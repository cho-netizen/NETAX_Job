<!--
  ============================================================
  [2026.10.08] job AI — AI탭과 오른쪽 사이드바가 함께 쓰는 "하나의" AI 화면
  ------------------------------------------------------------
  - 화면(DOM)은 이 파일에 딱 한 벌만 있다. 🤖 AI 메뉴를 열면 가운데 AI탭(#nxAiTabHost)으로,
    다른 메뉴로 가면 오른쪽 사이드바(#sideAIInner)로 "자리만" 옮긴다 — 그래서 대화가 끊기지 않고,
    어느 쪽에서 명령해도 같은 정보(화면·사건·열린 파일)가 AI에게 전달된다.
  - 대화 로직은 work.netax.kr의 chat.js(runChatTurn_·renderAssistantReply·말풍선 메뉴·모델
    자동선택·설정)를 옮겨온 것이다. 서버 프로토콜(doPost messages 분기, 라운드당 1회 호출 +
    done:false 반복)은 work와 완전히 같다.
  - work와 다른 점: (1) 대화는 사건 폴더의 _대화기록.json 하나가 아니라 대화마다 파일 1개
    (Code.js ai_conv*), 사건 연결은 선택, (2) work의 "탐색창+편집기" 대신 AI탭 오른쪽 미리보기
    칸에서 사건 자료를 보고, 문서 수정안도 거기서 확인·저장한다, (3) 결과를 job 화면 링크
    (작업관리에서 보기 등)로 보여준다.
  - 이 파일이 예전 aisidebar.html을 대체한다.
  ============================================================
-->
<div id="nxAi" class="nxai mode-side ph-chat">
  <div class="nxai-phone-tabs" id="nxAiPhoneTabs">

    <button type="button" data-ph="chat" class="on">🤖 대화</button>
    <button type="button" data-ph="files">📂 자료</button>
  </div>

  </aside>

  <div class="nxai-main">
  <section class="nxai-chat">
    <div class="nxai-head">
      <span class="nxai-resize" id="nxAiResize" title="끌어서 너비 조절"></span>
      <button type="button" class="nxai-icon nxai-fold" id="nxAiListShow" title="대화 목록 열기">»</button>

      <span class="nxai-spacer"></span>
      <button type="button" class="nxai-icon" id="nxAiNewBtnSide" title="새 대화">＋</button>

      <button type="button" class="nxai-icon" id="nxAiOpenTab" title="AI탭으로 크게 보기">⤢</button>
      <button type="button" class="nxai-icon" id="nxAiCollapse" title="접기">≫</button>
      <button type="button" class="nxai-icon nxai-fold" id="nxAiPvShow" title="미리보기 칸 열기">«</button>
    </div>
    <div class="nxai-body" id="nxAiBody">
      <div class="nxai-empty" id="nxAiEmpty">무엇이든 지시하세요 — 사건 자료 확인, 세액계산, 작업·고객 등록, 보고서 작성까지 job의 기능을 대신 실행합니다.<br>사건을 연결하면 그 사건 폴더를 기준으로 일합니다.</div>
    </div>
    <div class="nxai-attachbar" id="nxAiAttachBar"></div>
    <div class="nxai-input-row">
      <textarea id="nxAiInput" rows="1" placeholder="메시지 입력 (Enter 전송, Shift+Enter 줄바꿈, 이미지 붙여넣기 가능)"></textarea>
      <button type="button" id="nxAiSend" class="nxai-send" title="보내기">➤</button>
    </div>
    <div class="nxai-tools">

      <button type="button" class="nxai-tool" id="nxAiStrategyBtn" title="🧠 전략 검토 — 연결된 사건을 최고급 AI가 경우의 수별로 비교하고 더 나은 대안을 제시합니다(세액은 계산엔진으로 계산, 실행 전 예상 비용 확인)">🧠</button>
      <button type="button" class="nxai-tool" id="nxAiImproveBtn" title="🛠 개선 후보 처리 — 웹 Claude Code가 job에 쌓인 오류·유료 질문·자가점검을 보고 고친 뒤 깃허브에 수정안을 올립니다(열리는 화면에서 '지금 실행'). 매주 월요일 아침엔 자동. 수정안 승인(Merge) 후 설정 🐞 카드의 📥 수정 반영">🛠</button>
      <button type="button" class="nxai-tool" id="nxAiClearBtn" title="입력창 비우기">✕</button>
      <select id="nxAiGemTurns" class="nxai-model" style="width:auto" title="🔮·⚖로 제미니에게 물어볼 때 직전 대화를 몇 개(턴) 같이 보낼지 (0=입력창 내용만)">
        <option value="0">0턴</option><option value="1">1턴</option><option value="2">2턴</option><option value="3">3턴</option><option value="4">4턴</option><option value="5">5턴</option>
      </select>
      <button type="button" class="nxai-tool" id="nxAiGemBtn" title="입력창 내용을 제미니(무료)에게 물어보기 — NX 외부조회 커넥터 확장프로그램 필요. 고객 개인정보는 넣지 마세요">🔮</button>
      <button type="button" class="nxai-tool" id="nxAiBothBtn" title="같은 질문을 AI와 제미니에게 동시에 묻습니다 — 서로 답을 보지 않은 독립 의견을 받고 싶을 때(AI 쪽은 토큰 사용, NX 외부조회 커넥터 필요)">⚖</button>
      <button type="button" class="nxai-tool" id="nxAiExtBtn" title="NX 외부조회 커넥터 미연결 — 클릭하면 다시 연결합니다">🔌</button>
      <button type="button" class="nxai-tool" id="nxAiCaptureBtn" title="화면 캡처해서 첨부 — NX 커넥터가 있으면 도우미 창에서 다른 프로그램 창도 고를 수 있음(없으면 Win+Shift+S 후 입력창에 Ctrl+V)">📷</button>
      <button type="button" class="nxai-tool" id="nxAiVoiceBtn" title="🎤 음성 입력 — PC는 NX 커넥터의 도우미 창에서 말하면 글자로 바뀌어 입력창에 들어옵니다. 휴대폰은 키보드의 🎤(음성입력)를 쓰세요">🎤</button>
      <select id="nxAiModel" class="nxai-model" title="AI 모델 — F(고정)가 아니면 질문 내용에 따라 자동으로 바뀝니다(지금 값은 마지막으로 실제 쓰인 모델)">
        <option value="claude-sonnet-5">Sonnet 5</option>
        <option value="claude-opus-4-8">Opus 4.8</option>
        <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
        <option value="claude-fable-5">Fable 5</option>
        <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro</option>
        <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
        <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
        <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
      </select>
      <label class="nxai-tool" title="체크: 지금 고른 모델로 고정(F) / 해제: 질문 내용 보고 자동 전환(V)"><input type="checkbox" id="nxAiModelLock" hidden><span id="nxAiModelLockLabel" class="nxai-lock">V</span></label>
      <label class="nxai-tool" title="어드바이저 — 답변 전에 다른 AI(오퍼스)에게 한 번 더 검토를 받습니다"><input type="checkbox" id="nxAiAdvisor" hidden><span id="nxAiAdvisorLabel" class="nxai-adv">+</span></label>
      <span class="nxai-spacer"></span>
      <button type="button" class="nxai-tool" id="nxAiSettingsBtn" title="AI 설정 (Alt+S)">⚙</button>
    </div>
  </section>

  <aside class="nxai-preview" id="nxAiPreview">
    <div class="nxai-pv-head">
      <button type="button" class="nxai-pv-tab on" data-pv="files" id="nxAiPvTabFiles">📂 사건 자료</button>
      <button type="button" class="nxai-pv-tab" data-pv="view" id="nxAiPvTabView">👁 미리보기</button>
      <span class="nxai-spacer"></span>
      <button type="button" class="nxai-icon dark" id="nxAiPvPosBtn" title="미리보기 위치">A</button>
      <button type="button" class="nxai-icon dark nxai-fold" id="nxAiPvToggle" title="미리보기 칸 숨기기">»</button>
    </div>
    <div class="nxai-pv-files" id="nxAiPvFiles"><div class="nxai-muted">사건을 연결하면 그 사건 폴더의 자료가 여기 보입니다.</div></div>
    <div class="nxai-pv-view" id="nxAiPvView" hidden>
      <div class="nxai-pv-viewhead">
        <b id="nxAiPvName">—</b>
        <span class="nxai-spacer"></span>
        <button type="button" class="nxai-btn" id="nxAiPvAttach" title="이 파일을 채팅에 첨부">📎 첨부</button>
        <a class="nxai-btn" id="nxAiPvOpen" href="#" target="_blank" rel="noopener" title="새 창에서 열기">↗ 새 창</a>
      </div>
      <div class="nxai-pv-proposal" id="nxAiPvProposal" hidden>
        <span>📝 AI 수정안이 아래에 표시돼 있습니다 — <b>아직 저장되지 않았습니다.</b></span>
        <button type="button" class="nxai-btn primary" id="nxAiPvSaveProposal">💾 이 수정안으로 저장</button>
        <button type="button" class="nxai-btn" id="nxAiPvDiscardProposal">↩ 원래 내용으로</button>
      </div>
      <div class="nxai-pv-content" id="nxAiPvContent"></div>
      <div class="nxai-pv-editbar" id="nxAiPvEditBar" hidden>
        <span class="nxai-muted" id="nxAiPvStatus"></span>
        <span class="nxai-spacer"></span>
        <button type="button" class="nxai-btn primary" id="nxAiPvSave">💾 저장</button>
      </div>
    </div>
  </aside>
  </div>
</div>

<!-- AI 설정 -->
<div class="nxai-overlay" id="nxAiSettingsOverlay" hidden>
  <div class="nxai-modal">
    <div class="nxai-modal-head"><b>⚙ AI 설정</b><span class="nxai-spacer"></span><button type="button" class="nxai-icon dark" id="nxAiSettingsClose">✕</button></div>
    <div id="nxAiUsageBox" class="nxai-usage-box"></div>

<style>
  /* ===== 공통 ===== */
  .nxai{ --nxai-font:13.5px; display:flex; height:100%; min-height:0; width:100%; font-size:var(--nxai-font); }
  .nxai [hidden]{ display:none !important; }
  .nxai-spacer{ flex:1; }
  .nxai-muted{ color:#7a8496; font-size:12.5px; padding:10px; line-height:1.6; }
  .nxai-btn{ border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:7px; padding:5px 10px; font-size:12.5px; cursor:pointer; text-decoration:none; white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
  .nxai-btn:hover{ border-color:var(--gold); }
  .nxai-btn.primary{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .nxai-btn.primary:hover{ background:var(--navy-deep); }
  .nxai-icon{ border:none; background:none; cursor:pointer; font-size:13px; padding:3px 6px; border-radius:6px; color:inherit; opacity:.75; white-space:nowrap; }
  .nxai-icon:hover{ opacity:1; background:rgba(127,127,127,.15); }
  .nxai-icon.dark{ color:var(--ink); }

  /* ===== 대화창 ===== */
  .nxai-main{ flex:1; min-width:0; min-height:0; display:flex; flex-direction:row; }
  .nxai.pv-at-bottom .nxai-main{ flex-direction:column; }
  .nxai-chat{ flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; }
  .nxai-head{ display:flex; align-items:center; gap:6px; padding:8px 10px; border-bottom:1px solid var(--line); flex-shrink:0; position:relative; min-width:0; }
  .nxai-title{ border:none; background:none; cursor:pointer; font-weight:700; font-size:14px; color:inherit; min-width:0; max-width:45%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:2px 4px; text-align:left; }
  .nxai-case-chip{ border:1px dashed currentColor; background:none; color:inherit; opacity:.8; border-radius:999px; padding:2px 10px; font-size:12px; cursor:pointer; min-width:0; max-width:40%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nxai-case-chip.linked{ border-style:solid; opacity:1; }
  .nxai-body{ flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; min-height:0; }
  .nxai-empty{ color:#7a8496; text-align:center; margin:auto 10px; line-height:1.8; font-size:13px; }
  .nxai-msg{ max-width:100%; box-sizing:border-box; padding:9px 12px; border-radius:10px; line-height:1.6; white-space:pre-wrap; word-break:break-word; cursor:default; }
  .nxai-msg.ai{ background:#f0f2f6; color:var(--ink); border-top-left-radius:2px; align-self:stretch; }
  .nxai-msg.me{ background:rgba(200,162,68,.22); color:var(--ink); border-top-right-radius:2px; align-self:flex-end; max-width:88%; }
  .nxai-msg.ai{ white-space:normal; }
  .nxai-md > div{ min-height:1.2em; }
  .nxai-md .nxai-gap{ height:.55em; min-height:0; }
  .nxai-md .nxai-h{ font-weight:700; margin:.5em 0 .2em; }
  .nxai-md .nxai-h1{ font-size:1.18em; } .nxai-md .nxai-h2{ font-size:1.1em; } .nxai-md .nxai-h3, .nxai-md .nxai-h4{ font-size:1.02em; }
  .nxai-md .nxai-li{ position:relative; }
  .nxai-md .nxai-bullet{ display:inline-block; min-width:1.2em; margin-left:-1.2em; opacity:.7; }
  .nxai-md code{ background:rgba(127,127,127,.15); border-radius:4px; padding:0 4px; font-size:.92em; }
  .nxai-md .nxai-code{ background:#1e2433; color:#e8ecf3; border-radius:7px; padding:9px 11px; overflow-x:auto; font-size:.9em; white-space:pre; }
  .nxai-md .nxai-hr{ border:none; border-top:1px solid var(--line); margin:.6em 0; }
  .nxai-table-wrap{ overflow-x:auto; margin:.4em 0; }
  .nxai-table{ border-collapse:collapse; font-size:.93em; }
  .nxai-table th, .nxai-table td{ border:1px solid var(--line); padding:4px 8px; text-align:left; vertical-align:top; }
  .nxai-table th{ background:rgba(127,127,127,.1); }
  .nxai-table td{ font-variant-numeric:tabular-nums; }
  .nxai-history-hint{ text-align:center; color:#7a8496; font-size:12px; }

  var nxAiPendingFiles = [];            // [{id,name,type:'file'|'folder',mimeType,path}] — 드라이브 파일/폴더 첨부
  var nxAiPendingImages = [];           // [{id,name,dataUrl}] — 붙여넣기·캡처 이미지(드라이브 저장 없이 바로 첨부)
  var nxAiPreviewFile = null;           // 미리보기에 열린 파일 {id,name,mimeType,url}
  var nxAiPreviewText = null;           // 텍스트 파일이면 원문(저장된 내용)
  var nxAiPreviewProposalOriginal = null; // AI 수정안 표시 중이면, 되돌릴 원래 내용
  var nxAiPvFolder = null;              // 사건 자료 칸이 보고 있는 폴더 {folderId, path}
  var nxAiConvFolderId = null;          // _AI대화기록 폴더 — 사건 없는 대화의 업로드 위치

  function nxAiBlankConv_(){ return { id: null, sourceFileId: '', title: '', caseId: '', caseName: '', caseFolderId: '', casePath: null, messages: [] }; }
  function nxAiEl_(id){ return document.getElementById(id); }
  function nxAiApplyPvPos_(){
    var root = nxAiEl_('nxAi');
    if (!root) return;
    var saved = nxAiLs_('nxAiPvPos');
    var bottom = saved === 'bottom' || (saved !== 'right' && window.nxLayout === 'tablet');
    root.classList.toggle('pv-at-bottom', bottom);
    // 버튼 글자: A=자동, H=오른쪽(좌우 배치) 고정, V=아래(위아래 배치) 고정 — 세무사님 지정
    var btn = nxAiEl_('nxAiPvPosBtn');
    if (btn){
      var fixed = saved === 'right' || saved === 'bottom';
      btn.textContent = saved === 'right' ? 'H' : (saved === 'bottom' ? 'V' : 'A');
      btn.classList.toggle('fixed', fixed);
      var nextLabel = saved === 'right' ? '아래 고정' : (saved === 'bottom' ? '자동' : '오른쪽 고정');
      btn.title = '미리보기 위치: ' + (fixed ? (bottom ? '아래 고정' : '오른쪽 고정') : ('자동(지금 ' + (bottom ? '아래' : '오른쪽') + ')')) + ' — 누르면 ' + nextLabel;
    }
  }
  // 폰 화면(body.lay-phone)에서 보이는 칸 하나를 고른다: list | chat | files. 다른 화면 배치에선 표시만 기억.
  function nxAiPhoneTab_(which){
    var root = nxAiEl_('nxAi');
    if (!root) return;
    ['list', 'chat', 'files'].forEach(function(k){ root.classList.toggle('ph-' + k, k === which); });
    Array.prototype.forEach.call(document.querySelectorAll('#nxAiPhoneTabs button'), function(b){ b.classList.toggle('on', b.getAttribute('data-ph') === which); });
  }
  function nxAiEsc_(s){ return (typeof escapeHtml === 'function') ? escapeHtml(s) : String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function nxAiToast_(msg){ if (typeof toast === 'function') toast(msg); }
  function nxAiConfirm_(msg){ return (typeof nxConfirm_ === 'function') ? nxConfirm_(msg) : Promise.resolve(window.confirm(msg)); }
  function nxAiPrompt_(msg, def){ return (typeof nxPrompt_ === 'function') ? nxPrompt_(msg, def) : Promise.resolve(window.prompt(msg, def)); }
  function nxAiLs_(key, val){
    try{ if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); }catch(e){}
    return null;
  }

  // 로그인 직후 script.html이 부른다(예전 initAiSidebar 자리).
  function initAiSidebar(){
    if (nxAiApiSecret !== null) return;
    google.script.run.withSuccessHandler(function(secret){ nxAiApiSecret = secret || ''; })
      .withFailureHandler(function(){ nxAiApiSecret = ''; })
      .manageApp_getApiSecret(typeof manageAppSessionToken_ !== 'undefined' ? manageAppSessionToken_ : null);
    // [2026.10.08 수정] 대화 목록(특히 work 대화기록 검색 — 드라이브 전체 검색, 약 12초)을 로그인 직후에 같이
    // 돌렸더니 대시보드 요청들과 겹쳐 job 첫 화면이 느려졌다(원인 분석으로 확인). 목록은 AI탭을 처음 열 때
    // 불러온다(nxAiOnViewChange_). 사이드바에서 대화하는 데는 목록이 필요 없다.
  }

  // ============================================================
  // 자리 옮기기 — AI탭 ↔ 사이드바 (화면은 한 벌, 위치만 이동)
  // ============================================================
  function nxAiSetMode_(mode){
    var root = nxAiEl_('nxAi');
    var host = mode === 'tab' ? nxAiEl_('nxAiTabHost') : nxAiEl_('sideAIInner');
    if (!root || !host) return;
    if (root.parentNode !== host) host.appendChild(root);
    nxAiMode = mode;
    root.classList.toggle('mode-tab', mode === 'tab');
    root.classList.toggle('mode-side', mode !== 'tab');
    var side = nxAiEl_('sideAI');
    if (side) side.classList.toggle('nxai-away', mode === 'tab');
    nxAiScrollBottom_(true);
  }

  // script.html의 showView가 화면을 바꿀 때마다 부른다.
  function nxAiOnViewChange_(name){
    nxAiSetMode_(name === 'ai' ? 'tab' : 'side');
    if (name === 'ai'){
      if (nxAiListState === 'error' || nxAiListState === 'idle') nxAiLoadConvList_(true);
      else nxAiRenderConvList_();
    }
  }

  // 결과 링크(작업관리에서 보기 등)로 다른 화면에 갈 때 — 같은 대화를 사이드바로 펼쳐서 이어간다.
  function nxAiGoToView_(name){
    if (typeof goToView_ === 'function') goToView_(name);
    var side = nxAiEl_('sideAI');
    if (side){
      ['sideMenu'].forEach(function(id){ var el = nxAiEl_(id); if (el) el.classList.remove('expanded'); });
      side.classList.add('expanded');
    }
  }

  // ============================================================
  // 대화 목록 / 저장
  // ============================================================
  // 대화 목록을 받는다. 실패하면(일시적인 서버·네트워크 오류) "대화 없음"으로 잘못 보이지 않게 오류 상태를
  // 기억해 두고 1회 자동 재시도한다 — 그래도 안 되면 목록에 [다시 시도]를 보여준다(AI탭을 열 때도 다시 시도).
  var nxAiListState = 'idle'; // idle | loading | ok | error
  function nxAiLoadConvList_(isRetry){
    nxAiListState = 'loading';
    nxAiRenderConvList_();
    return callGas('ai_conv_list', {}).then(function(res){
      if (!res || res.error) throw new Error(res && res.error || '응답 없음');
      nxAiConvList = res.conversations || [];
      nxAiConvFolderId = res.folderId || null;
      nxAiListState = 'ok';
      nxAiRenderConvList_();
      // work 대화기록은 드라이브 전체 검색이라 느리므로 뒤이어 따로 받아 덧붙인다.
      nxAiWorkLoading = true; nxAiRenderConvList_();
      return callGas('ai_work_histories', {}).then(function(w){
        nxAiWorkLoading = false;
        if (w && !w.error){
          nxAiWorkList = w.workHistories || [];
          nxAiWorkUpdated = {};
          (w.updatedImports || []).forEach(function(id){ nxAiWorkUpdated[id] = true; });
          nxAiRefreshSyncUi_();
        }
        nxAiRenderConvList_();
      }, function(){ nxAiWorkLoading = false; nxAiRenderConvList_(); });
    }).catch(function(){
      nxAiWorkLoading = false;
      if (!isRetry){ setTimeout(function(){ nxAiLoadConvList_(true); }, 2000); return; }
      nxAiListState = 'error';
      nxAiRenderConvList_();
    });
  }

  function nxAiFmtTime_(s){
    if (!s) return '';
    var d = new Date(s);
    if (isNaN(d)) return s;
    var now = new Date();
    if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  // job 대화와 work 대화기록(아직 안 불러온 것)을 한 목록에 최근 순으로 섞어 보여준다.
  // work 항목은 누르면 그 자리에서 job 대화로 불러온다(원본 파일은 그대로 둠).
  function nxAiRenderConvList_(){
    var body = nxAiEl_('nxAiListBody');
    if (!body) return;
    var q = (nxAiEl_('nxAiListSearch').value || '').trim();
    var items = nxAiConvList.map(function(c){ return { kind: 'job', c: c, at: c.updatedAt || '' }; })
      .concat(nxAiWorkList.map(function(w){ return { kind: 'work', w: w, at: w.updatedAt || '' }; }));
    items = items.filter(function(it){
      if (!q) return true;
      var hay = it.kind === 'job' ? [it.c.title, it.c.caseName].join(' ') : [it.w.caseName, it.w.folderName].join(' ');
      return hay.indexOf(q) !== -1;
    });
    items.sort(function(a, b){ return String(b.at).localeCompare(String(a.at)); });
    if (nxAiListState === 'loading' && !nxAiConvList.length){ body.innerHTML = '<div class="nxai-muted">대화 목록을 불러오는 중…</div>'; return; }
    if (nxAiListState === 'error' && !nxAiConvList.length){
      body.innerHTML = '<div class="nxai-muted">대화 목록을 불러오지 못했습니다. <a href="#" id="nxAiListRetry">다시 시도</a></div>';
      nxAiEl_('nxAiListRetry').addEventListener('click', function(e){ e.preventDefault(); nxAiLoadConvList_(true); });
      return;
    }
    if (!items.length){
      body.innerHTML = '<div class="nxai-muted">' + (q ? '검색 결과가 없습니다.' : (nxAiWorkLoading ? 'work에서 하던 대화를 찾는 중…' : '아직 저장된 대화가 없습니다. 대화창에서 바로 시작하세요.')) + '</div>';
      return;
    }
    body.innerHTML = '';
    items.forEach(function(it){
      var row = document.createElement('div');
      if (it.kind === 'job'){
        var c = it.c;
        row.className = 'nxai-conv' + (c.id === nxAiConv.id ? ' on' : '');
        row._convId = c.id;
        row.innerHTML = '<span class="t">' + (nxAiWorkUpdated[c.id] ? '<span class="nxai-badge new" title="불러온 뒤 work에서 대화가 더 쌓였습니다">work 새 내용</span>' : '') + nxAiEsc_(c.title || '새 대화') + '</span>'
          + '<span class="m">' + (c.caseName ? '<span>🔗 ' + nxAiEsc_(c.caseName) + '</span>' : '<span>일반</span>')
          + '<span>' + nxAiEsc_(nxAiFmtTime_(c.updatedAt)) + '</span></span>';
        row.addEventListener('click', function(){ nxAiOpenConv_(c.id); });
        row.addEventListener('contextmenu', function(e){
          e.preventDefault();
          nxAiShowMenu_(e.clientX, e.clientY, [
            { label: '✏️ 제목 바꾸기', action: function(){ nxAiRenameConv_(c.id, c.title); } },
            { label: '🗑 대화 삭제(휴지통)', action: function(){ nxAiDeleteConv_(c.id); } }
          ]);
        });
      } else {
        var w = it.w;
        row.className = 'nxai-conv work';
        row.title = 'work.netax.kr에서 하던 대화 — 누르면 불러와서 이어갑니다(원본은 그대로 둡니다)';
        row.innerHTML = '<span class="t"><span class="nxai-badge">work</span>' + nxAiEsc_(w.caseName || w.folderName) + '</span>'
          + '<span class="m"><span>' + nxAiEsc_(nxAiFmtTime_(w.updatedAt)) + '</span><span>' + w.sizeKb + 'KB</span></span>';
        row.addEventListener('click', function(){
          nxAiImportWorkHistory_({ id: w.fileId, name: '_대화기록.json' }, {
            caseId: w.caseId, caseName: w.caseName || w.folderName, caseFolderId: w.folderId
          });
        });
      }
      body.appendChild(row);
    });
    if (nxAiWorkLoading) body.insertAdjacentHTML('beforeend', '<div class="nxai-muted">work에서 하던 대화를 찾는 중…</div>');
  }

  function nxAiOpenConv_(id){
    if (nxAiAbort){ nxAiToast_('답변을 받는 중입니다 — 끝난 뒤에 바꿔주세요.'); return; }
    // 서버 왕복에 몇 초 걸리므로, 누른 즉시 그 대화가 선택된 것과 불러오는 중임을 보여준다.
    Array.prototype.forEach.call(document.querySelectorAll('.nxai-conv'), function(r){ r.classList.toggle('on', r._convId === id); });
    nxAiPhoneTab_('chat');
    var loadingEl = nxAiAppendBubble_('assistant', '대화를 불러오는 중…');
    loadingEl.classList.add('nxai-loading');
    nxAiFlushSave_().then(function(){
      return callGas('ai_conv_load', { id: id });
    }).then(function(res){
      loadingEl.remove();
      if (!res || res.error){ nxAiToast_('대화를 불러오지 못했습니다: ' + (res && res.error)); return; }
      nxAiConv = Object.assign(nxAiBlankConv_(), res.conversation);
      nxAiRenderConversation_();
      nxAiRenderConvList_();
      nxAiRefreshCaseUi_();
      if (nxAiConv.caseFolderId) nxAiPvNavigate_({ folderId: nxAiConv.caseFolderId });
    });
  }

  function nxAiNewConv_(){
    if (nxAiAbort){ nxAiToast_('답변을 받는 중입니다 — 끝난 뒤에 시작해주세요.'); return; }
    nxAiFlushSave_().then(function(){
      // 지금 대화에 사건이 연결돼 있으면 새 대화도 같은 사건으로 시작한다(같은 사건 안에서 주제만 바꾸는 경우가 대부분).
      var keepCase = nxAiConv.caseId ? { caseId: nxAiConv.caseId, caseName: nxAiConv.caseName, caseFolderId: nxAiConv.caseFolderId, casePath: nxAiConv.casePath } : {};
      nxAiConv = Object.assign(nxAiBlankConv_(), keepCase);
      nxAiRenderConversation_();
      nxAiRenderConvList_();
      nxAiRefreshCaseUi_();
      nxAiEl_('nxAiInput').focus();
    });
  }

  function nxAiScheduleSave_(){
    clearTimeout(nxAiSaveTimer);
    nxAiSaveTimer = setTimeout(function(){ nxAiSaveTimer = null; nxAiSaveNow_(); }, 800);
  }
  function nxAiFlushSave_(){
    if (!nxAiSaveTimer) return Promise.resolve();
    clearTimeout(nxAiSaveTimer); nxAiSaveTimer = null;
    return nxAiSaveNow_();
  }
  function nxAiSaveNow_(){
    if (!nxAiConv.messages.length) return Promise.resolve();
    if (!nxAiConv.title){
      var first = nxAiConv.messages.filter(function(m){ return m.role === 'user' && typeof m.content === 'string'; })[0];
      nxAiConv.title = first ? first.content.replace(/\s+/g, ' ').slice(0, 30) : '새 대화';
    }
    var convAtSave = nxAiConv;
    return callGas('ai_conv_save', { conversation: {
      id: convAtSave.id, title: convAtSave.title, caseId: convAtSave.caseId, caseName: convAtSave.caseName,
      caseFolderId: convAtSave.caseFolderId, casePath: convAtSave.casePath, sourceFileId: convAtSave.sourceFileId || '', messages: convAtSave.messages.slice(-NXAI_MAX_MESSAGES)
    } }).then(function(res){
      if (!res || res.error){ nxAiToast_('대화 저장 실패: ' + (res && res.error)); return; }
      convAtSave.id = res.id;
      var existing = nxAiConvList.find(function(c){ return c.id === res.id; });
      var meta = { id: res.id, sourceFileId: convAtSave.sourceFileId || '', title: convAtSave.title, caseId: convAtSave.caseId, caseName: convAtSave.caseName, caseFolderId: convAtSave.caseFolderId, updatedAt: res.updatedAt, count: convAtSave.messages.length };
      if (existing) Object.assign(existing, meta); else nxAiConvList.unshift(meta);
      nxAiConvList.sort(function(a, b){ return String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')); });
      nxAiRenderConvList_();
      nxAiRefreshTitle_();
    }).catch(function(err){ nxAiToast_('대화 저장 중 오류: ' + (err && err.message ? err.message : err)); });
  }
  document.addEventListener('visibilitychange', function(){ if (document.hidden) nxAiFlushSave_(); });

  function nxAiRenameConv_(id, current){
    nxAiPrompt_('대화 제목', current || '').then(function(title){
      if (!title || !title.trim()) return;
      title = title.trim();
      if (!id){ nxAiConv.title = title; nxAiRefreshTitle_(); return; } // 아직 저장 전인 대화 — 저장할 때 같이 반영
      callGas('ai_conv_rename', { id: id, title: title }).then(function(res){
        if (res && res.error){ nxAiToast_(res.error); return; }
        var c = nxAiConvList.find(function(x){ return x.id === id; });
        if (c) c.title = title;
        if (nxAiConv.id === id) nxAiConv.title = title;
        nxAiRenderConvList_(); nxAiRefreshTitle_();
      });
    });
  }

  function nxAiDeleteConv_(id){
    nxAiConfirm_('이 대화를 삭제할까요? (드라이브 휴지통으로 이동 — 30일 안에는 복구할 수 있습니다)').then(function(ok){
      if (!ok) return;
      callGas('ai_conv_delete', { id: id }).then(function(res){
        if (res && res.error){ nxAiToast_(res.error); return; }
        nxAiConvList = nxAiConvList.filter(function(c){ return c.id !== id; });
        if (nxAiConv.id === id){ nxAiConv = nxAiBlankConv_(); nxAiRenderConversation_(); nxAiRefreshCaseUi_(); }
        nxAiRenderConvList_();
      });
    });
  }

  function nxAiRefreshTitle_(){
    nxAiEl_('nxAiTitle').textContent = '🤖 ' + (nxAiConv.title || '새 대화');
    nxAiRefreshSyncUi_();
  }

  // ============================================================
  // 사건 연결
  // ============================================================
  var nxAiCaseCache = null;
  function nxAiOpenCasePicker_(){
    nxAiEl_('nxAiCaseOverlay').hidden = false;
    nxAiEl_('nxAiCaseSearch').value = '';
    nxAiEl_('nxAiCaseSearch').focus();
    var p = nxAiCaseCache ? Promise.resolve(nxAiCaseCache) : callGas('work_get_cases', {}).then(function(res){
      nxAiCaseCache = (res && res.cases) || [];
      return nxAiCaseCache;
    });
    p.then(nxAiRenderCasePicker_);
  }
  function nxAiRenderCasePicker_(){
    var listEl = nxAiEl_('nxAiCaseList');
    var q = (nxAiEl_('nxAiCaseSearch').value || '').trim();
    var cases = (nxAiCaseCache || []).filter(function(c){
      var hay = [c.사건명, c.고객명, c.납세자, c.세목, c.업무유형].join(' ');
      return !q || hay.indexOf(q) !== -1;
    });
    if (!cases.length){ listEl.innerHTML = '<div class="nxai-muted">' + (nxAiCaseCache ? '해당하는 사건이 없습니다.' : '불러오는 중…') + '</div>'; return; }
    listEl.innerHTML = '';
    cases.slice(0, 200).forEach(function(c){
      var row = document.createElement('div');
      row.className = 'nxai-case-row';
      row.innerHTML = '<span>' + nxAiEsc_(c.사건명 || c.고객명 || '(이름 없음)') + '</span><span class="s">' + nxAiEsc_(c.상태 || '') + '</span>';
      row.addEventListener('click', function(){ nxAiLinkCase_(c); });
      listEl.appendChild(row);
    });
  }
  function nxAiLinkCase_(c){
    nxAiEl_('nxAiCaseOverlay').hidden = true;
    if (!c){
      nxAiConv.caseId = ''; nxAiConv.caseName = ''; nxAiConv.caseFolderId = ''; nxAiConv.casePath = null;
      nxAiRefreshCaseUi_(); nxAiPvRenderEmpty_();
      if (nxAiConv.messages.length) nxAiScheduleSave_();
      return;
    }
    nxAiConv.caseId = c.id;
    nxAiConv.caseName = c.사건명 || c.고객명 || '';
    nxAiConv.caseFolderId = c.폴더ID || '';
    nxAiConv.casePath = null;
    nxAiRefreshCaseUi_();
    if (nxAiConv.caseFolderId) nxAiPvNavigate_({ folderId: nxAiConv.caseFolderId });
    else nxAiEl_('nxAiPvFiles').innerHTML = '<div class="nxai-muted">이 사건은 아직 드라이브 폴더가 없습니다(작업관리에서 사건 폴더를 만들면 연결됩니다).</div>';
    if (nxAiConv.messages.length) nxAiScheduleSave_();
  }
  function nxAiRefreshCaseUi_(){
    var chip = nxAiEl_('nxAiCaseChip');
    chip.textContent = nxAiConv.caseName ? ('🔗 ' + nxAiConv.caseName) : '🔗 사건 연결';
    chip.classList.toggle('linked', !!nxAiConv.caseName);
    nxAiRefreshTitle_();
  }

  // ============================================================
  // 미리보기 칸 — 사건 자료 목록 / 파일 보기
  // ============================================================
  function nxAiPvShowTab_(which){
    nxAiEl_('nxAiPvTabFiles').classList.toggle('on', which === 'files');
    nxAiEl_('nxAiPvTabView').classList.toggle('on', which === 'view');
    nxAiEl_('nxAiPvFiles').hidden = which !== 'files';
    nxAiEl_('nxAiPvView').hidden = which !== 'view';

  function nxAiPvRenderEmpty_(){

    nxAiEl_('nxAiPvFiles').innerHTML = '<div class="nxai-muted">사건을 연결하면 그 사건 폴더의 자료가 여기 보입니다.</div>';

  // where = {folderId} 또는 {path}
  function nxAiPvNavigate_(where){
    var box = nxAiEl_('nxAiPvFiles');
    box.innerHTML = '<div class="nxai-muted">불러오는 중…</div>';
    return callGas('listFolder', where).then(function(res){
      if (!res || res.error){ box.innerHTML = '<div class="nxai-muted">' + nxAiEsc_(res && res.error || '폴더를 열지 못했습니다.') + '</div>'; return; }
      nxAiPvFolder = { folderId: res.folderId, path: res.path || [] };
      // 사건 폴더 자체를 열었으면 그 경로를 대화에 기억(AI에게 넘기는 "현재 위치"로 씀)
      if (where.folderId && where.folderId === nxAiConv.caseFolderId) nxAiConv.casePath = res.path || null;
      nxAiPvRenderListing_(res);
    });
  }
  function nxAiPvRenderListing_(res){
    var box = nxAiEl_('nxAiPvFiles');
    box.innerHTML = '';
    var crumb = document.createElement('div');
    crumb.className = 'nxai-pv-crumb';
    var casePathLen = (nxAiConv.casePath || []).length;
    var path = res.path || [];
    // 사건 폴더보다 위로는 못 올라가게(사건 자료 칸이므로) — 사건 폴더부터 현재 폴더까지만 보여준다.
    var startIdx = casePathLen ? casePathLen - 1 : Math.max(0, path.length - 1);
    for (var i = startIdx; i < path.length; i++){
      (function(idx){
        var a = document.createElement('a');
        a.textContent = path[idx];
        a.addEventListener('click', function(){ nxAiPvNavigate_({ path: path.slice(0, idx + 1) }); });
        crumb.appendChild(a);
        if (idx < path.length - 1) crumb.appendChild(document.createTextNode(' › '));
      })(i);
    }
    box.appendChild(crumb);
    // work.netax.kr이 사건 폴더에 남긴 대화기록(_대화기록.json)이 있으면 job 대화로 불러와 이어갈 수 있게 한다.
    var workHistory = (res.files || []).find(function(f){ return f.name === '_대화기록.json'; });
    if (workHistory && res.folderId === nxAiConv.caseFolderId){
      var imp = document.createElement('button');
      imp.type = 'button';
      imp.className = 'nxai-btn';
      imp.style.margin = '0 4px 8px';
      imp.textContent = '💬 work에서 하던 이 사건 대화 불러오기';
      imp.addEventListener('click', function(){ nxAiImportWorkHistory_(workHistory); });
      box.appendChild(imp);
    }
    (res.folders || []).forEach(function(f){
      var row = document.createElement('div');
      row.className = 'nxai-file';
      row.innerHTML = '<span>📁</span><span class="n">' + nxAiEsc_(f.name) + '</span><span class="a" title="이 폴더를 채팅에 첨부">📎</span>';
      row.querySelector('.a').addEventListener('click', function(e){
        e.stopPropagation();
        nxAiAddFileAttachment_({ id: f.id, name: f.name, type: 'folder', path: path.concat([f.name]) });
      });
      row.addEventListener('click', function(){ nxAiPvNavigate_({ folderId: f.id }); });
      box.appendChild(row);
    });
    (res.files || []).forEach(function(f){
      var row = document.createElement('div');
      row.className = 'nxai-file';
      row.innerHTML = '<span>' + nxAiFileIcon_(f) + '</span><span class="n" title="' + nxAiEsc_(f.name) + '">' + nxAiEsc_(f.name) + '</span><span class="a" title="채팅에 첨부">📎</span>';
      row.querySelector('.a').addEventListener('click', function(e){ e.stopPropagation(); nxAiAddFileAttachment_(f); });
      row.addEventListener('click', function(){ nxAiOpenPreview_(f); });
      box.appendChild(row);
    });
    if (!(res.folders || []).length && !(res.files || []).length){
      box.insertAdjacentHTML('beforeend', '<div class="nxai-muted">빈 폴더입니다.</div>');
    }
  }
  // work 대화기록 → 새 job 대화로 복사(원본 파일은 그대로 둔다 — work에서도 계속 볼 수 있게).
  // ============================================================
  // work → job 대화 가져오기/이어붙이기 — work.netax.kr과 함께 쓰는 전환 기간용(Code.js ai_convImportWork·
  // ai_convSyncWork 참고). 시스템이 안정되면 이 묶음과 대화 목록의 work 항목 표시를 걷어내면 된다.
  // ============================================================
  // caseInfo 생략 시 지금 대화에 연결된 사건을 쓴다(사건 자료 칸의 불러오기 버튼). 대화 목록의 work 항목은 그 파일의 사건 정보를 넘긴다.
  function nxAiImportWorkHistory_(file, caseInfo){
    if (nxAiAbort){ nxAiToast_('답변을 받는 중입니다 — 끝난 뒤에 해주세요.'); return; }
    var ci = caseInfo || { caseId: nxAiConv.caseId, caseName: nxAiConv.caseName, caseFolderId: nxAiConv.caseFolderId };
    var loadingEl = nxAiAppendBubble_('assistant', 'work 대화를 불러오는 중…');
    nxAiFlushSave_().then(function(){
      return callGas('ai_conv_import_work', { fileId: file.id, caseId: ci.caseId || '', caseName: ci.caseName || '', caseFolderId: ci.caseFolderId || '' });
    }).then(function(res){
      loadingEl.remove();
      if (!res || res.error){ nxAiToast_('work 대화를 불러오지 못했습니다: ' + (res && res.error)); return; }
      nxAiAdoptConversation_(res.conversation);
      nxAiWorkList = nxAiWorkList.filter(function(w){ return w.fileId !== file.id; });
      nxAiLoadConvListOnly_();
      nxAiToast_('work 대화 ' + nxAiConv.messages.length + '개 메시지를 불러왔습니다. 이어서 질문하면 됩니다.');
    }).catch(function(err){
      loadingEl.remove();
      nxAiToast_('work 대화를 불러오지 못했습니다: ' + (err && err.message ? err.message : err));
    });
  }

  // 불러온 뒤 work에서 더 쌓인 대화를 이어붙인다.
  function nxAiSyncWork_(){
    if (nxAiAbort || !nxAiConv.id) return;
    var id = nxAiConv.id;
    var btn = nxAiEl_('nxAiSyncWork');
    btn.disabled = true; btn.textContent = '이어붙이는 중…';
    nxAiFlushSave_().then(function(){
      return callGas('ai_conv_sync_work', { id: id });
    }).then(function(res){
      btn.disabled = false; btn.textContent = '⤵ work 새 내용 이어붙이기';
      if (!res || res.error){ nxAiToast_(res && res.error || '이어붙이지 못했습니다.'); return; }
      delete nxAiWorkUpdated[id];
      if (nxAiConv.id === id) nxAiAdoptConversation_(res.conversation);
      nxAiRenderConvList_();
      nxAiToast_(res.appended ? ('work에서 ' + res.appended + '개 메시지를 이어붙였습니다.') : 'work에 새로 추가된 대화가 없습니다.');
    }).catch(function(err){
      btn.disabled = false; btn.textContent = '⤵ work 새 내용 이어붙이기';
      nxAiToast_('이어붙이기 오류: ' + (err && err.message ? err.message : err));
    });
  }

  function nxAiAdoptConversation_(conv){
    nxAiConv = Object.assign(nxAiBlankConv_(), conv);
    nxAiRenderConversation_();
    nxAiRefreshCaseUi_();
    if (nxAiConv.caseFolderId) nxAiPvNavigate_({ folderId: nxAiConv.caseFolderId });
  }

  // 대화 목록만 다시 받는다(work 검색은 다시 하지 않음).
  function nxAiLoadConvListOnly_(){
    return callGas('ai_conv_list', {}).then(function(res){
      if (res && !res.error) nxAiConvList = res.conversations || [];
      nxAiRenderConvList_();
    });
  }

  // 지금 대화가 "work에 새 내용 있음"이면 대화창 위에 이어붙이기 버튼을 보여준다.
  function nxAiRefreshSyncUi_(){
    var btn = nxAiEl_('nxAiSyncWork');
    if (btn) btn.hidden = !(nxAiConv.id && nxAiWorkUpdated[nxAiConv.id]);
  }

  function nxAiFileIcon_(f){
    var k = nxAiFileKind_(f);
    return { pdf: '📕', image: '🖼️', text: '📝', gdoc: '📄', sheet: '📊' }[k] || '📎';
  }
  var NXAI_TEXT_EXT_RE = /\.(md|txt|json|csv|html?|xml|log|tsv)$/i;
  function nxAiFileKind_(f){
    var mt = f.mimeType || '', name = f.name || '';
    if (mt === 'application/pdf') return 'pdf';
    if (mt.indexOf('image/') === 0) return 'image';
    if (mt === 'application/vnd.google-apps.document' || mt === 'application/vnd.google-apps.presentation') return 'gdoc';
    if (mt === 'application/vnd.google-apps.spreadsheet' || /\.(xlsx?|xlsm)$/i.test(name)) return 'sheet';
    if (NXAI_TEXT_EXT_RE.test(name) || mt.indexOf('text/') === 0 || mt === 'application/json') return 'text';
    return 'other';
  }
  function nxAiDrivePreviewUrl_(f){
    var mt = f.mimeType || '';
    if (mt === 'application/vnd.google-apps.document') return 'https://docs.google.com/document/d/' + f.id + '/preview';
    if (mt === 'application/vnd.google-apps.spreadsheet') return 'https://docs.google.com/spreadsheets/d/' + f.id + '/preview';
    if (mt === 'application/vnd.google-apps.presentation') return 'https://docs.google.com/presentation/d/' + f.id + '/preview';
    return 'https://drive.google.com/file/d/' + f.id + '/preview';
  }

  // 파일 하나를 미리보기 칸에 연다. 텍스트 파일은 그 자리에서 고쳐서 저장할 수 있고, AI에게도
  // 지금 내용(liveContent)이 함께 전달돼 "이 문서 고쳐줘"에 수정안(apply_document_edit)을 낼 수 있다.
  function nxAiOpenPreview_(f){
    if (nxAiMode !== 'tab'){
      // 사이드바에서는 미리보기 칸이 없으므로 새 창으로 연다.
      if (f.url) window.open(f.url, '_blank', 'noopener'); else window.open(nxAiDrivePreviewUrl_(f), '_blank', 'noopener');
      return Promise.resolve();
    }
    nxAiPreviewFile = { id: f.id, name: f.name, mimeType: f.mimeType || '', url: f.url || ('https://drive.google.com/file/d/' + f.id + '/view') };
    nxAiPreviewText = null;
    nxAiPvHideProposal_();
    nxAiPvShowTab_('view');
    nxAiEl_('nxAiPvName').textContent = f.name;
    nxAiEl_('nxAiPvOpen').href = nxAiPreviewFile.url;
    nxAiEl_('nxAiPvEditBar').hidden = true;
    var content = nxAiEl_('nxAiPvContent');
    var kind = nxAiFileKind_(f);
    if (kind === 'text'){
      content.innerHTML = '<div class="nxai-muted">불러오는 중…</div>';
      return callGas('readFile', { fileId: f.id }).then(function(res){
        if (nxAiPreviewFile.id !== f.id) return; // 그 사이 다른 파일을 열었으면 무시
        if (!res || res.error){ content.innerHTML = '<div class="nxai-muted">' + nxAiEsc_(res && res.error || '읽지 못했습니다.') + '</div>'; return; }
        nxAiPreviewText = res.content || '';
        content.innerHTML = '';
        var ta = document.createElement('textarea');
        ta.id = 'nxAiPvText';
        ta.value = nxAiPreviewText;
        ta.addEventListener('input', nxAiPvUpdateDirty_);
        content.appendChild(ta);
        nxAiEl_('nxAiPvEditBar').hidden = false;
        nxAiPvUpdateDirty_();
      });
    }
    if (kind === 'image'){
      content.innerHTML = '<div class="nxai-muted">불러오는 중…</div>';
      return callGas('readFileBinary', { fileId: f.id }).then(function(res){
        if (nxAiPreviewFile.id !== f.id) return;
        if (!res || res.error || !res.base64){ content.innerHTML = '<iframe src="' + nxAiDrivePreviewUrl_(f) + '" allow="autoplay"></iframe>'; return; }
        content.innerHTML = '<img alt="" src="data:' + (res.mimeType || f.mimeType) + ';base64,' + res.base64 + '">';
      });
    }
    // PDF·구글문서·시트·그 밖의 파일 — 구글 드라이브 자체 미리보기. 안 보이면 "↗ 새 창"으로.
    content.innerHTML = '<iframe src="' + nxAiDrivePreviewUrl_(f) + '" allow="autoplay"></iframe>';
    return Promise.resolve();
  }
  function nxAiPvUpdateDirty_(){
    var ta = nxAiEl_('nxAiPvText');
    var dirty = ta && nxAiPreviewText !== null && ta.value !== nxAiPreviewText;
    nxAiEl_('nxAiPvStatus').textContent = dirty ? '저장하지 않은 수정이 있습니다' : '';
    nxAiEl_('nxAiPvSave').disabled = !dirty;
  }
  function nxAiPvSave_(){
    var ta = nxAiEl_('nxAiPvText');
    if (!ta || !nxAiPreviewFile) return Promise.resolve(false);
    var text = ta.value, file = nxAiPreviewFile;
    nxAiEl_('nxAiPvStatus').textContent = '저장 중…';
    return callGas('uploadFile', { fileId: file.id, name: file.name, base64Data: utf8ToBase64(text) }).then(function(res){
      if (!res || res.error){ nxAiEl_('nxAiPvStatus').textContent = ''; nxAiToast_('저장 실패: ' + (res && res.error)); return false; }
      if (nxAiPreviewFile && nxAiPreviewFile.id === file.id){
        nxAiPreviewText = text;
        nxAiPvHideProposal_();
        nxAiPvUpdateDirty_();
        nxAiEl_('nxAiPvStatus').textContent = '저장됨 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      }
      return true;
    });
  }
  function nxAiPvHideProposal_(){
    nxAiPreviewProposalOriginal = null;
    nxAiEl_('nxAiPvProposal').hidden = true;
  }
  // AI 수정안을 미리보기 칸에 띄운다 — 저장은 사람이 [이 수정안으로 저장]을 눌러야만 된다.
  function nxAiShowProposal_(targetFile, content){
    var show = function(){
      var ta = nxAiEl_('nxAiPvText');
      if (!ta){ nxAiToast_('이 파일은 미리보기에서 바로 고칠 수 없는 형식입니다.'); return; }
      nxAiPreviewProposalOriginal = ta.value;
      ta.value = content;
      nxAiEl_('nxAiPvProposal').hidden = false;
      nxAiPvUpdateDirty_();
    };
    if (nxAiMode !== 'tab') nxAiGoToView_('ai');
    if (nxAiPreviewFile && targetFile && nxAiPreviewFile.id === targetFile.id && nxAiEl_('nxAiPvText')){ nxAiPvShowTab_('view'); show(); return; }
    nxAiOpenPreview_(targetFile).then(show);
  }

  // ============================================================
  // 첨부
  // ============================================================
  function nxAiAddFileAttachment_(f){
    if (!f || !f.id) return;
    if (nxAiPendingFiles.some(function(a){ return a.id === f.id; })) return;
    nxAiPendingFiles.push({ id: f.id, name: f.name, type: f.type === 'folder' ? 'folder' : 'file', mimeType: f.mimeType, path: f.path });
    nxAiRenderAttachBar_();
  }
  function nxAiAddImage_(name, dataUrl){
    nxAiPendingImages.push({ id: 'img' + Date.now() + Math.random().toString(36).slice(2, 5), name: name, dataUrl: dataUrl });
    nxAiRenderAttachBar_();
  }
  function nxAiRenderAttachBar_(){
    var bar = nxAiEl_('nxAiAttachBar');
    bar.innerHTML = '';
    nxAiPendingFiles.forEach(function(a){
      bar.appendChild(nxAiChip_((a.type === 'folder' ? '📁 ' : '📎 ') + a.name, function(){
        nxAiPendingFiles = nxAiPendingFiles.filter(function(x){ return x.id !== a.id; }); nxAiRenderAttachBar_();
      }));
    });
    nxAiPendingImages.forEach(function(a){
      bar.appendChild(nxAiChip_('🖼️ ' + a.name, function(){
        nxAiPendingImages = nxAiPendingImages.filter(function(x){ return x.id !== a.id; }); nxAiRenderAttachBar_();
      }));
    });
  }
  function nxAiChip_(label, onRemove){
    var chip = document.createElement('span');
    chip.className = 'nxai-chip';
    chip.innerHTML = '<span class="n"></span><span class="x" title="첨부 취소">✕</span>';
    chip.querySelector('.n').textContent = label;
    chip.querySelector('.x').addEventListener('click', onRemove);
    return chip;
  }
  function nxAiParseDataUrl_(dataUrl){
    var m = /^data:([^;]+);base64,(.*)$/.exec(dataUrl || '');
    return m ? { mimeType: m[1], base64: m[2] } : null;
  }
  function nxAiReadAsDataUrl_(file){
    return new Promise(function(resolve, reject){
      var r = new FileReader();
      r.onload = function(){ resolve(r.result); };
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }
  // 내 컴퓨터 파일 — 연결된 사건 폴더(없으면 대화기록 폴더)에 올린 뒤 드라이브 파일로 첨부한다.
  function nxAiUploadLocalFiles_(fileList, onUploaded){
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    var targetFolderId = nxAiConv.caseFolderId || nxAiConvFolderId;
    if (!targetFolderId){
      // 대화 목록을 아직 안 불러왔으면(AI탭을 안 열었으면) 업로드 폴더도 모른다 — 목록만 받아 폴더를 확인한 뒤 다시 시도
      callGas('ai_conv_list', {}).then(function(res){
        if (res && res.folderId){ nxAiConvFolderId = res.folderId; nxAiUploadLocalFiles_(files, onUploaded); }
        else nxAiToast_('올릴 폴더를 확인하지 못했습니다 — 잠시 후 다시 시도해주세요.');
      }).catch(function(){ nxAiToast_('올릴 폴더를 확인하지 못했습니다 — 잠시 후 다시 시도해주세요.'); });
      return;
    }
    files.reduce(function(p, file){
      return p.then(function(){
        if (file.size > 20 * 1024 * 1024){ nxAiToast_(file.name + ' — 20MB를 넘어 올릴 수 없습니다.'); return; }
        nxAiToast_(file.name + ' 올리는 중…');
        return nxAiReadAsDataUrl_(file).then(function(dataUrl){
          var parsed = nxAiParseDataUrl_(dataUrl);
          var payload = { folderId: targetFolderId, name: file.name, mimeType: file.type || 'application/octet-stream', base64Data: parsed ? parsed.base64 : '' };
          return callGas('uploadFile', payload);
        }).then(function(res){
          if (!res || res.error){ nxAiToast_('올리기 실패: ' + (res && res.error)); return; }
          var up = { id: res.id, name: res.name || file.name, type: 'file', mimeType: file.type };
          nxAiAddFileAttachment_(up);
          if (onUploaded) try { onUploaded(up); } catch (e) { /* 후속 처리 실패가 올리기를 막지 않게 */ }
          if (nxAiPvFolder && nxAiConv.caseFolderId && nxAiPvFolder.folderId === nxAiConv.caseFolderId) nxAiPvNavigate_({ folderId: nxAiConv.caseFolderId });
        });
      });
    }, Promise.resolve());
  }

  // ============================================================
  // 말풍선
  // ============================================================
  function nxAiScrollBottom_(force){
    var body = nxAiEl_('nxAiBody');
    if (!body) return;
    var near = (body.scrollHeight - body.scrollTop - body.clientHeight) < 80;
    if (force || near){
      body.scrollTop = body.scrollHeight;
      requestAnimationFrame(function(){ body.scrollTop = body.scrollHeight; });
    }
  }
  function nxAiAppendBubble_(role, text){
    var empty = nxAiEl_('nxAiEmpty');
    if (empty) empty.hidden = true;
    var div = document.createElement('div');
    div.className = 'nxai-msg ' + (role === 'user' ? 'me' : 'ai');
    div.textContent = text;
    nxAiEl_('nxAiBody').appendChild(div);
    nxAiScrollBottom_(true);
    return div;
  }
  function nxAiRenderConversation_(){
    var body = nxAiEl_('nxAiBody');
    Array.prototype.slice.call(body.querySelectorAll('.nxai-msg, .nxai-history-hint')).forEach(function(n){ n.remove(); });
    nxAiEl_('nxAiEmpty').hidden = nxAiConv.messages.length > 0;
    nxAiConv.messages.forEach(function(m){
      var text = typeof m.content === 'string' ? m.content : '';
      var el = nxAiAppendBubble_(m.role === 'assistant' ? 'assistant' : 'user', text);
      if (m.role === 'assistant'){ el.innerHTML = '<div class="nxai-md">' + nxAiMd_(text) + '</div>'; }
      el._nxMsgRef = m;
    });
    nxAiRefreshTitle_();
    nxAiScrollBottom_(true);
  }

  // AI 답변의 마크다운(굵게·제목·목록·표·코드)을 화면용으로 바꾼다. 먼저 전부 이스케이프한 뒤
  // 정해진 기호만 태그로 바꾸므로, 답변 안에 HTML이 섞여 있어도 실행되지 않는다(안전).
  // 복사·대화기록에는 원문(마크다운 그대로)이 남는다.
  function nxAiMd_(text){
    var lines = String(text || '').split(/\r?\n/);
    var out = [], i = 0;
    var inline = function(s){
      return nxAiEsc_(s)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
        .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<i>$2</i>');
    };
    var cells = function(r){ return r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function(c){ return c.trim(); }); };
    while (i < lines.length){
      var line = lines[i];
      if (/^\s*```/.test(line)){
        var code = []; i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])){ code.push(lines[i]); i++; }
        i++;
        out.push('<pre class="nxai-code">' + nxAiEsc_(code.join('\n')) + '</pre>');
        continue;
      }
      if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])){
        var rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(lines[i]); i++; }
        var html = '<div class="nxai-table-wrap"><table class="nxai-table"><thead><tr>'
          + cells(rows[0]).map(function(c){ return '<th>' + inline(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
        rows.slice(2).forEach(function(r){ html += '<tr>' + cells(r).map(function(c){ return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; });
        out.push(html + '</tbody></table></div>');
        continue;
      }
      var hm = /^(#{1,4})\s+(.*)$/.exec(line);
      if (hm){ out.push('<div class="nxai-h nxai-h' + hm[1].length + '">' + inline(hm[2]) + '</div>'); i++; continue; }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)){ out.push('<hr class="nxai-hr">'); i++; continue; }
      var lm = /^(\s*)([-*•]|\d+[.)])\s+(.*)$/.exec(line);
      if (lm){
        out.push('<div class="nxai-li" style="padding-left:' + (1.2 + lm[1].length * 0.5) + 'em"><span class="nxai-bullet">'
          + (/\d/.test(lm[2]) ? nxAiEsc_(lm[2]) : '•') + '</span>' + inline(lm[3]) + '</div>');
        i++; continue;
      }
      out.push(line.trim() === '' ? '<div class="nxai-gap"></div>' : '<div>' + inline(line) + '</div>');
      i++;
    }
    return out.join('');
  }

  // [2026.10.08] job 기능 연결 — 화면 열기 / 실행 제안 카드
  // ============================================================
  var NXAI_VIEW_LABELS_ = { dashboard: '대시보드', booking: '예약관리', workmanage: '작업관리', clientmanage: '고객관리', collections: '수금관리',
    casehandling: '처리개요', lawsearch: '법령조회', docs: '증빙확보', taxcalc: '세액계산', print: '세액인쇄', reportwriter: '문서작성',
    reports: '열람관리', 'memo-text': '일반메모', 'memo-hand': '필기메모', reporthub: '보고서 모음', settings: '설정', manual: '사용자메뉴얼' };
  // 각 화면의 "그 사건으로 열기" 함수(goTo*_)를 그대로 쓴다 — 화면 버튼이 하는 것과 같은 동작.
  function nxAiOpenJobView_(view, caseId, clientId, then, taxTab){
    var side = nxAiEl_('sideAI');
    var openSide = function(){ if (side) side.classList.add('expanded'); };
    // 세액계산 자동계산 — 화면의 [📄 자동계산] 버튼과 같은 동작(tcRunAutoCalc_)을 그 사건·세목으로 실행
    if (view === 'taxcalc' && caseId && then === 'autocalc' && typeof goToTaxCalc_ === 'function'){
      goToTaxCalc_(caseId); openSide();
      var tries = 0;
      var waitAndRun = function(){
        tries++;
        var ready = typeof tcCurrentCase !== 'undefined' && tcCurrentCase && tcCurrentCase.id === caseId && document.getElementById('tcAutoCalcBtn');
        if (!ready){ if (tries < 60) setTimeout(waitAndRun, 500); else nxAiToast_('세액계산 화면이 준비되지 않아 자동계산을 시작하지 못했습니다 — [📄 자동계산]을 직접 눌러주세요.'); return; }
        var tabBtn = taxTab ? document.querySelector('.taxcalc-tab[data-tab="' + taxTab + '"]') : null;
        if (tabBtn && !tabBtn.classList.contains('active')) tabBtn.click();
        setTimeout(function(){ if (typeof tcRunAutoCalc_ === 'function') tcRunAutoCalc_(); }, 400);
      };
      setTimeout(waitAndRun, 500);
      return;
    }
    if (caseId){
      if (view === 'casehandling' && typeof goToCaseHandling_ === 'function'){ goToCaseHandling_(caseId); openSide(); return; }
      if (view === 'lawsearch' && typeof goToLawSearch_ === 'function'){ goToLawSearch_(caseId); openSide(); return; }
      if (view === 'taxcalc' && typeof goToTaxCalc_ === 'function'){ goToTaxCalc_(caseId); openSide(); return; }
      if (view === 'print' && typeof goToTaxCalc_ === 'function'){ goToTaxCalc_(caseId); setTimeout(function(){ goToView_('print'); openSide(); }, 600); return; }
      if (view === 'reportwriter' && typeof goToReportWriter_ === 'function'){ goToReportWriter_(caseId); openSide(); return; }
      if (view === 'workmanage' && typeof goToWorkManage_ === 'function'){ goToWorkManage_(caseId); openSide(); return; }
      if (view === 'docs'){
        callGas('work_get_cases', {}).then(function(res){
          var c = (res.cases || []).filter(function(x){ return x.id === caseId; })[0];
          if (typeof docsLoaded !== 'undefined') docsLoaded = true; // initDocs의 기본위치 이동과 겹치지 않게(처리개요 화면과 같은 처리)
          goToView_('docs');
          if (c && c.폴더ID && typeof docsNavigateById_ === 'function') docsNavigateById_(c.폴더ID);
          openSide();
        });
        return;
      }
    }
    if (view === 'clientmanage' && clientId && typeof goToClientManage_ === 'function'){ goToClientManage_(clientId); openSide(); return; }
    nxAiGoToView_(view);
  }

  function nxAiConfirmCard_(a, bubbleEl){
    var card = document.createElement('div');
    card.className = 'nxai-confirm';
    card.innerHTML = '<div class="nxai-confirm-head">🟡 실행 제안 — ' + nxAiEsc_(a.label || '') + '</div>'
      + '<div class="nxai-confirm-body"></div>'
      + '<div class="nxai-confirm-btns"><button type="button" class="nxai-btn primary">▶ 실행</button><button type="button" class="nxai-btn">취소</button></div>';
    card.querySelector('.nxai-confirm-body').textContent = a.summary || '';
    var runBtn = card.querySelectorAll('button')[0], cancelBtn = card.querySelectorAll('button')[1];
    var finish = function(text, ok){
      card.querySelector('.nxai-confirm-btns').innerHTML = '';
      var res = document.createElement('div');
      res.className = ok ? 'nxai-saved' : 'nxai-warn';
      res.textContent = text;
      card.appendChild(res);
      // 다음 질문 때 AI도 결과를 알도록, 이 답변 기록 끝에 결과를 덧붙인다.
      var ref = bubbleEl._nxMsgRef;
      if (ref && typeof ref.content === 'string'){ ref.content += '\n\n[사용자 처리: ' + (a.label || '') + ' — ' + text + ']'; nxAiScheduleSave_(); }
    };
    cancelBtn.addEventListener('click', function(){ finish('취소했습니다(실행하지 않음).', false); });
    runBtn.addEventListener('click', function(){
      // 화면 안에서 처리하는 제안(서버 호출 아님)
      if (a.gasAction === 'client:memoSave'){
        if (typeof openSaveDialog === 'function'){ openSaveDialog((a.payload && a.payload.content) || '', null); finish('메모 저장 창을 열었습니다 — 저장 위치를 골라 저장하세요.', true); }
        else finish('메모 저장 창을 열 수 없습니다.', false);
        return;
      }
      runBtn.disabled = true; cancelBtn.disabled = true; runBtn.textContent = '실행 중…';
      callGas(a.gasAction, a.payload || {}).then(function(res){
        var ok = !(res && (res.success === false || res.error));
        finish(ok ? ('✅ 실행했습니다' + (res && res.message ? ': ' + res.message : '')) : ('실행하지 못했습니다: ' + ((res && (res.message || res.error)) || '알 수 없는 오류')), ok);
        if (ok && /^(booking_)/.test(a.kind) && typeof initBooking === 'function' && document.getElementById('view-booking') && document.getElementById('view-booking').classList.contains('active')) initBooking();
        if (ok && a.kind === 'case_update' && typeof initWorkManage === 'function' && document.getElementById('view-workmanage') && document.getElementById('view-workmanage').classList.contains('active')) initWorkManage();
      }).catch(function(err){
        finish('실행하지 못했습니다: ' + (err && err.message ? err.message : err), false);
      });
    });
    return card;
  }

  // "반영했습니다/저장했습니다"류 완료 주장 — 실제 저장 신호 없이 말만 하면 경고(work와 동일)
  var NXAI_COMPLETION_CLAIM_RE = /(반영했|저장했|업데이트했|갱신했|추가했습니다|등록했|생성했|파일을?\s*만들었)/;

  function nxAiFileIdFromUrl_(url){
    var m = /\/d\/([A-Za-z0-9_-]{20,})/.exec(url || '') || /[?&]id=([A-Za-z0-9_-]{20,})/.exec(url || '');
    return m ? m[1] : null;
  }

  function nxAiRenderReply_(bubbleEl, replyText, clientActions, editTargetFile){
    var actions = Array.isArray(clientActions) ? clientActions : [];
    bubbleEl.innerHTML = '';

    // 폴더 이동 — work는 탐색창을 옮겼다. job은 화면을 바꾸지 않고 사건 자료 칸을 그 폴더로 옮긴다.
    var nav = actions.find(function(a){ return a && a.type === 'navigate_to'; });
    if (nav && Array.isArray(nav.path)){
      nxAiPvNavigate_({ path: nav.path }).then(function(){ if (nxAiMode === 'tab') nxAiPvShowTab_('files'); });
      addLink('📂 ' + (nav.path[nav.path.length - 1] || '최상위') + ' 폴더 보기', function(){

    }

    var explorerChanged = actions.find(function(a){ return a && a.type === 'explorer_changed'; });
    if (explorerChanged && nxAiPvFolder && JSON.stringify(nxAiPvFolder.path) === JSON.stringify(explorerChanged.path || [])){
      nxAiPvNavigate_({ folderId: nxAiPvFolder.folderId });
    }

    // 작업관리·고객관리를 바꿨으면 그 화면이 이미 열려 있을 때 새로고침하고, 가는 링크를 단다.
    if (actions.some(function(a){ return a && a.type === 'work_manage_changed'; })){
      if (typeof initWorkManage === 'function' && document.getElementById('view-workmanage') && document.getElementById('view-workmanage').classList.contains('active')) initWorkManage();
      addLink('📌 작업관리에서 보기', function(){ nxAiGoToView_('workmanage'); });
    }
    if (actions.some(function(a){ return a && a.type === 'client_manage_changed'; })){
      if (typeof initClientManage === 'function' && document.getElementById('view-clientmanage') && document.getElementById('view-clientmanage').classList.contains('active')) initClientManage();
      addLink('🙋 고객관리에서 보기', function(){ nxAiGoToView_('clientmanage'); });
    }

    // [2026.10.08] job 기능 — 화면 열기(job_open_screen): 바로 그 화면으로 가고, 다시 가는 링크도 남긴다.
    actions.filter(function(a){ return a && a.type === 'open_view'; }).forEach(function(a){
      var label = (NXAI_VIEW_LABELS_[a.view] || a.view);
      var go = function(){ nxAiOpenJobView_(a.view, a.caseId, a.clientId, a.then, a.taxTab); };
      addLink('📍 ' + label + (a.then === 'autocalc' ? ' 자동계산' : ' 열기'), go);
      if (!bubbleEl._nxOpenedOnce){ bubbleEl._nxOpenedOnce = true; setTimeout(go, 300); }
    });

    // [2026.10.08] job 기능 — 실행 제안(job_propose_action): 사람이 [실행]을 눌러야 화면이 서버 기능을 부른다.
    actions.filter(function(a){ return a && a.type === 'confirm_action'; }).forEach(function(a){
      bubbleEl.appendChild(nxAiConfirmCard_(a, bubbleEl));
    });

    // 문서 수정안 — 미리보기 칸에 띄우고, 사람이 저장 버튼을 눌러야 반영된다.
    var editAction = actions.find(function(a){ return a && a.type === 'edit_document'; });
    if (editAction){
      var notice = document.createElement('div');
      notice.className = 'nxai-notice';
      notice.textContent = '⚠️ 아직 저장되지 않았습니다 — 미리보기 칸의 [이 수정안으로 저장]을 눌러야 실제 문서에 반영됩니다.';
      bubbleEl.appendChild(notice);
      addLink('📝 수정안 보기', function(){ nxAiShowProposal_(editTargetFile, editAction.content || ''); });
      if (editTargetFile) nxAiShowProposal_(editTargetFile, editAction.content || '');
    }

    // 서버가 실제 파일쓰기 성공을 확인했을 때만 오는 신호 — AI 말과 무관한 확인 배지
    var saved = actions.filter(function(a){ return a && a.type === 'file_saved'; });
    saved.forEach(function(a){
      var badge = document.createElement('div');
      badge.className = 'nxai-saved';
      var label = a.updated ? '기존 파일에 덮어썼습니다' : '새 파일로 저장했습니다';
      badge.innerHTML = '✅ ' + label + ': ' + (a.url ? '<a href="' + nxAiEsc_(a.url) + '" target="_blank" rel="noopener">' + nxAiEsc_(a.name || '') + '</a>' : nxAiEsc_(a.name || ''));
      bubbleEl.appendChild(badge);
      var fid = nxAiFileIdFromUrl_(a.url);
      if (fid) addLink('👁 ' + (a.name || '저장한 파일') + ' 미리보기', function(){

    });

    var claimed = NXAI_COMPLETION_CLAIM_RE.test(replyText || '');
    var realSignal = !!editAction || saved.length > 0
      || actions.some(function(a){ return a && (a.type === 'work_manage_changed' || a.type === 'client_manage_changed' || a.type === 'explorer_changed'); });
    if (claimed && !realSignal){

    if (links.children.length) bubbleEl.appendChild(links);

  function nxAiRunTurn_(initialMessages, opts){
    var turnMessages = initialMessages.slice();
    var accumulated = [];
    var round = 0;
    var usageSum = { usd: 0, model: '' }; // 이번 질문에 든 유료 AI 비용(도구 라운드 합계)
    var step = function(){
      var forceWrapUp = round >= NXAI_MAX_ROUNDS;
      opts.thinkingBubble.textContent = round === 0 ? '생각 중…' : (forceWrapUp ? '마무리하는 중…' : '🔧 확인하는 중… (' + (round + 1) + '단계)');
      var requestBody = JSON.stringify(Object.assign({
        _key: nxAiApiSecret || '',
        messages: turnMessages,
        context: opts.context,
        autoRef: true,
        forceWrapUp: forceWrapUp
      }, opts.settingsPayload));
      var attempt = function(n){
        return fetch(NXAI_GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: opts.signal, body: requestBody })
          .then(function(res){ return res.json(); })
          .catch(function(err){
            if (err && err.name === 'AbortError') throw err;
            // 요청이 서버에 닿기 전에 끊긴 순수 네트워크 오류만 1회 재시도(중복 과금 위험 없음 — work와 같은 판단)
            if (n === 0){
              opts.thinkingBubble.textContent = '네트워크가 불안정해서 다시 시도하는 중…';
              return new Promise(function(r){ setTimeout(r, 1500); }).then(function(){ return attempt(1); });
            }
            throw err;
          });
      };
      return attempt(0).then(function(data){
        if (data.error){ opts.onError('오류: ' + data.error); return; }
        if (data.usage){ usageSum.usd += (+data.usage.costUsd || 0); usageSum.model = data.usage.model || usageSum.model; }
        accumulated = accumulated.concat(data.clientActions || []);
        if (data.done === false){
          turnMessages = turnMessages.concat([
            { role: 'assistant', content: data.assistantContent },
            { role: 'user', content: data.toolResults }
          ]);
          round++;
          return step();
        }
        opts.onDone(data.reply || '이번 요청에 답변을 받지 못했습니다. 다시 한 번 보내주세요.', accumulated, usageSum);
      });
    };
    return step().catch(function(err){
      if (err && err.name === 'AbortError'){ opts.onAbort(); return; }
      opts.onError('네트워크 오류: ' + (err && err.message ? err.message : err));
    });
  }

  // ============================================================
  // [2026.10.08] ⚡ 바로 처리기 — job 기능 요청은 AI를 부르지 않고 화면이 직접 처리한다(토큰 0).
  // ------------------------------------------------------------
  // 세무사님 원칙: "job의 GAS 도구를 쓰는 데 비싼 토큰을 쓰면 안 된다. 토큰은 고급 전략·판단에만."
  // 화면 열기·예약/수금/체크리스트 조회·마감 임박·진행 사건·자동계산 시작처럼 문장 패턴이 분명한 요청은
  // 여기서 정규식으로 알아보고 job의 같은 서버 기능(callGas)·화면 함수(goTo*_)로 바로 처리한다.
  // 판단이 필요한 말(왜·검토·분석·전략·얼마…)이 있거나, 대상을 하나로 못 정하면 AI로 넘긴다(보수적으로).
  // 결과에는 [🤖 AI에게 묻기] 버튼이 있어 언제든 같은 질문을 AI에게 넘길 수 있다.
  // ============================================================
  var NXAI_LOCAL_VIEWS_ = [
    [/처리\s*개요/, 'casehandling'], [/법령\s*조회|예규\s*판례/, 'lawsearch'], [/증빙\s*(확보|관리)|사건\s*폴더/, 'docs'],
    [/세액\s*인쇄|인쇄\s*서식|전자\s*신고\s*파일/, 'print'], [/세액\s*계산/, 'taxcalc'], [/문서\s*작성/, 'reportwriter'],
    [/작업\s*관리/, 'workmanage'], [/고객\s*관리/, 'clientmanage'], [/예약\s*관리/, 'booking'], [/수금\s*관리/, 'collections'],
    [/대시\s*보드/, 'dashboard'], [/열람\s*관리/, 'reports'], [/일반\s*메모|^메모\s*(장|화면|창)?\s*(열어|열기|보여|띄워|가자|가\s*줘|이동|켜)/, 'memo-text'], [/필기\s*메모/, 'memo-hand'], [/보고서\s*모음/, 'reporthub'],
    [/^설정\s*(화면|창)?\s*(열어|열기|보여|띄워|가자|가\s*줘|이동|켜)/, 'settings'], [/사용자\s*메뉴얼|사용\s*설명서|매뉴얼|메뉴얼/, 'manual']
  ];
  var NXAI_LOCAL_OPEN_RE_ = /(열어|열기|보여|띄워|가자|가\s*줘|이동|켜\s*줘|들어가)/;
  var NXAI_LOCAL_JUDGE_RE_ = /(왜|어떻게|어떤|검토|분석|판단|의견|전략|가능(한|할|해|성)|될까|되나|맞나|맞는지|해석|비교|추천|설명|이유|위험|요약|정리해|작성해|써\s*줘|만들어|고쳐|수정해|얼마|세액은|절세|신고\s*해야)/;

  function nxAiDetectLocal_(text){
    var t = String(text || '').trim();
    if (!t || t.length > 60) return null;
    // "○○ 수금 얼마 받았어?"는 판단이 아니라 합계 조회 — "얼마"만 보고 유료 AI로 보내지 않는다(2026-10-09).
    var judgeT = /(수금|입금)/.test(t) ? t.replace(/얼마(나|를)?/g, '') : t;
    judgeT = judgeT.replace(/설명서/g, ''); // "사용설명서 열어줘"의 '설명'은 판단 요청이 아니다
    if (NXAI_LOCAL_JUDGE_RE_.test(judgeT)) return null;
    if (/자동\s*계산/.test(t)){
      var m = /(양도|증여|상속)/.exec(t);
      return { kind: 'autocalc', tab: m ? { 양도: 'transfer', 증여: 'gift', 상속: 'inheritance' }[m[1]] : '' };
    }
    // "일정"은 구글 캘린더 조회(🔮 제미니)로 남겨두고, 예약·마감·할 일만 여기서 처리
    if (/오늘/.test(t) && /(할\s*일|예약|마감|뭐\s*(있|해)|업무)/.test(t)) return { kind: 'today' };
    if (/(연락처|전화\s*번호|전번|휴대\s*폰|핸드폰|주소|고객\s*정보)/.test(t) && !/(바꿔|변경|수정|등록|추가|저장|보내|문자)/.test(t)) return { kind: 'client_info' };
    if (/(진행\s*상황|진행\s*상태|어디까지|사건\s*상태|상태\s*(는|가|좀|알려|보여))/.test(t) && !/예약/.test(t)) return { kind: 'case_status' };
    if (/예약/.test(t) && !/(승인|거절|취소|연결|등록)/.test(t) && /(보여|목록|확인|대기|몇|있어|있나|현황|알려|내일|모레|이번\s*주|다음\s*주|이번\s*달)/.test(t)) return { kind: 'bookings' };
    // [2026.10.09] 미수금은 job이 받을 금액(보수)을 기록하지 않아 계산할 수 없다 — 유료 AI로 보내도 답이 없으므로 0원으로 바로 안내
    if (/(미수|못\s*받|안\s*받은|받을\s*돈|외상|밀린\s*(돈|보수|수임료))/.test(t)) return { kind: 'unpaid' };
    if (/(수금|입금|상담\s*(기록|내역|이력)|자문\s*(기록|내역))/.test(t) && !/(추가|등록|기록해|입력)/.test(t)) return { kind: 'logs' };
    if (/(체크\s*리스트|제출\s*현황|증빙\s*현황)/.test(t) && !/(표시|체크해|완료로|확보로)/.test(t)) return { kind: 'checklist' };
    if (/(마감|기한|법정일)/.test(t) && /(임박|다가|이번\s*주|곧|지난|넘은|남은|보여|알려|목록)/.test(t)) return { kind: 'deadlines' };
    if (/진행\s*중/.test(t) && /사건/.test(t) && /(몇|목록|보여|현황|알려)/.test(t)) return { kind: 'active' };
    for (var i = 0; i < NXAI_LOCAL_VIEWS_.length; i++){
      if (NXAI_LOCAL_VIEWS_[i][0].test(t) && (NXAI_LOCAL_OPEN_RE_.test(t) || t.length <= 20)) return { kind: 'open', view: NXAI_LOCAL_VIEWS_[i][1] };
    }
    return null;
  }

  function nxAiNorm_(s){ return String(s || '').replace(/\s+/g, ''); }
  // 문장 속 사건 찾기 — 사건명·고객명·납세자명이 들어 있는 사건. 세목 단어가 있으면 그것으로 좁히고,
  // 진행 중인 사건을 우선한다. 결과: { list: [후보…] } (0개면 못 찾음, 2개 이상이면 고르게 함)
  var NXAI_TAX_WORD_ = { 양도: 'transfer', 증여: 'gift', 상속: 'inheritance' };
  function nxAiFindCases_(text){
    return callGas('work_get_cases', {}).then(function(res){
      if (!res || !Array.isArray(res.cases)) throw new Error('사건 목록을 받지 못했습니다 — 잠시 후 다시 시도하세요.');
      var t = nxAiNorm_(text);
      var hits = (res.cases || []).filter(function(c){
        return [c.사건명, c.고객명, c.납세자].some(function(n){ n = nxAiNorm_(n); return n.length >= 2 && t.indexOf(n) !== -1; });
      });
      var taxM = /(양도|증여|상속)/.exec(text);
      if (taxM && hits.length > 1){
        var narrowed = hits.filter(function(c){ return c.세목 === NXAI_TAX_WORD_[taxM[1]] || String(c.사건명 || '').indexOf(taxM[1]) !== -1; });
        if (narrowed.length) hits = narrowed;
      }
      if (hits.length > 1){
        var open = hits.filter(function(c){ return c.상태 !== '완료'; });
        if (open.length) hits = open;
      }
      return { list: hits };
    });
  }
  function nxAiFindClient_(text){
    return callGas('client_get_clients', {}).then(function(res){
      if (!res || !Array.isArray(res.clients)) throw new Error('고객 목록을 받지 못했습니다 — 잠시 후 다시 시도하세요.');
      var t = nxAiNorm_(text);
      var hits = (res.clients || []).filter(function(c){ var n = nxAiNorm_(c.성명); return n.length >= 2 && t.indexOf(n) !== -1; });
      // 이름이 다른 이름에 포함되는 경우(예: 김순 / 김순희) 가장 긴 이름만
      var maxLen = hits.reduce(function(m, c){ return Math.max(m, nxAiNorm_(c.성명).length); }, 0);
      return hits.filter(function(c){ return nxAiNorm_(c.성명).length === maxLen; });
    });

  function nxAiMdTable_(headers, rows){
