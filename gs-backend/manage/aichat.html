        var due = open.filter(function(c){ return c.법정일 && c.법정일 <= limitStr; }).sort(function(a, b){ return String(a.법정일).localeCompare(String(b.법정일)); });
        var over = due.filter(function(c){ return c.법정일 < today; });
        return { md: '**마감 임박·경과 ' + due.length + '건** (기한 지남 ' + over.length + '건, 오늘부터 14일 이내 포함)\n\n' + nxAiMdTable_(['법정일', '사건', '상태'], due.map(function(c){ return [(c.법정일 < today ? '⚠️ ' : '') + c.법정일, c.사건명 || c.고객명, c.상태]; })),
          note: '[⚡바로 처리] 마감 임박 ' + due.length + '건(기한 지남 ' + over.length + '건)' };
      });
    }
    return Promise.resolve(null);
  }

  // 바로 처리 결과를 말풍선에 그린다(⚡ 표시 + 후보 고르기 버튼 + AI에게 묻기 버튼).
  function nxAiRenderLocal_(bubble, res, text){
    bubble.innerHTML = '<div class="nxai-local-badge">⚡ 바로 처리 · AI 미사용(토큰 0)</div><div class="nxai-md">' + nxAiMd_(res.md) + '</div>';
    var links = document.createElement('div');
    links.className = 'nxai-links';
    (res.choices || []).forEach(function(ch){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'nxai-btn'; b.textContent = ch.label;
      b.addEventListener('click', function(){
        Promise.resolve(ch.run()).then(function(r2){ if (r2) nxAiRenderLocal_(bubble, r2, text); });
      });
      links.appendChild(b);
    });
    var ask = document.createElement('button');
    ask.type = 'button'; ask.className = 'nxai-btn'; ask.textContent = '🤖 AI에게 묻기';
    ask.title = '같은 질문을 AI에게 넘깁니다(토큰 사용)';
    ask.addEventListener('click', function(){ if (!nxAiAbort) nxAiSendAI_(text, { noGem: true }); });
    links.appendChild(ask);
    bubble.appendChild(links);
    // 대화기록에는 요약 한 줄 + 결과표(최대 3천 자)를 남긴다 — 이어서 "이 중 ○○ 건 검토해줘"라고 AI에게 물으면
    // AI가 이 결과를 보고 판단한다(조회는 토큰 0, 판단에만 토큰). 결과가 길면 앞부분만.
    if (bubble._nxMsgRef){
      var body = String(res.md || '');
      bubble._nxMsgRef.content = (res.note || '[⚡바로 처리]') + '\n' + (body.length > 3000 ? body.slice(0, 3000) + '\n…(이하 생략)' : body);
    }
  }

  // [2026.10.10] 서류 자동 정리 — 서버(doc_parse)가 구글 무료 OCR로 읽고 규칙으로 정리한다(AI 미사용).
  // 등기부(표제부·갑구·을구), 가족관계증명서(사망 표시), 사업자등록증, 홈택스 신고서 접수증, 국세 납부서.
  var NXAI_REGISTRY_NAME_RE_ = /(등기|등본|초본|주민등록|부동산|집합건물|토지|건물|가족관계|사업자\s*등록|임대\s*사업자|접수증|납부서)/;
  var NXAI_DOC_SITE_RE_ = /(iros\.go\.kr|hometax\.go\.kr|efamily\.scourt\.go\.kr|gov\.kr)/i;
  var NXAI_REGISTRY_CMD_RE_ = /(등기|서류|증명서|접수증|납부서|사업자\s*등록|임대\s*사업자|가족\s*관계|주민\s*등록|등본|초본)[^]{0,12}(정리|요약|표로|읽어|뽑아|보여)/;
  function nxAiRunRegistry_(files, text){
    nxAiPhoneTab_('chat');
    var label = text || ('📄 서류 PDF 받음: ' + files.map(function(f){ return f.name; }).join(', '));
    var userMsg = { role: 'user', content: label };
    nxAiConv.messages.push(userMsg);
    nxAiAppendBubble_('user', label)._nxMsgRef = userMsg;
    var bubble = nxAiAppendBubble_('assistant', '⚡ 서류 읽는 중… (무료 글자인식, 한 건에 10~40초)');
    var aiMsg = { role: 'assistant', content: '[⚡바로 처리] 서류 정리' };
    bubble._nxMsgRef = aiMsg;
    var mds = [], kinds = [];
    return files.reduce(function(p, f){
      return p.then(function(){
        return callGas('doc_parse', { fileId: f.id }).then(function(res){
          if (!res || res.error){ mds.push('**' + f.name + '** — 정리하지 못했습니다: ' + (res && res.error || '응답 없음')); return; }
          if (res.label) kinds.push(res.label);
          mds.push(res.md);
        });
      });
    }, Promise.resolve()).then(function(){
      nxAiConv.messages.push(aiMsg);
      var onlyReg = kinds.length && kinds.every(function(k){ return k === '등기부'; });
      nxAiRenderLocal_(bubble, { md: mds.join('\n\n---\n\n'), note: '[⚡바로 처리] 서류 정리 ' + kinds.length + '건(' + (kinds.join('·') || '대상 아님') + ', 무료 OCR·규칙)' },
        (text || '이 서류') + (onlyReg ? ' — 권리관계상 주의할 점을 검토해줘' : ' — 세무상 확인할 점을 검토해줘'));
      nxAiCountFree_('local');
      nxAiScheduleSave_();
    }).catch(function(err){
      bubble.textContent = '서류 정리 중 오류: ' + (err && err.message ? err.message : err);
      if (typeof nxLogBug_ === 'function') nxLogBug_({ kind: 'local', where: '서류 정리', message: String(err && err.message || err), detail: files.map(function(f){ return f.name; }).join(', ') });
    });
  }

  function nxAiSend_(){
    var input = nxAiEl_('nxAiInput');
    var text = input.value.trim();
    if (!text || nxAiAbort) return;
    // [2026.10.10] "등기부/서류 정리·요약·표로" + 첨부 PDF → 무료 OCR+규칙으로 정리(토큰 0). 판단("위험한지 검토")은 그 결과를 보고 AI에게.
    if (NXAI_REGISTRY_CMD_RE_.test(text) && !/(검토|분석|판단|위험|전략|의견)/.test(text)){
      var regFiles = nxAiPendingFiles.filter(function(a){ return a.type !== 'folder' && (/pdf|image/.test(a.mimeType || '') || /\.(pdf|png|jpe?g)$/i.test(a.name || '')); });
      if (regFiles.length){
        input.value = ''; input.style.height = 'auto';
        nxAiPendingFiles = nxAiPendingFiles.filter(function(a){ return regFiles.indexOf(a) === -1; }); nxAiRenderAttachBar_();
        return nxAiRunRegistry_(regFiles, text);
      }
    }
    // 첨부가 있으면 AI가 봐야 하므로 바로 처리하지 않는다.
    if (nxAiPendingFiles.length || nxAiPendingImages.length) return nxAiSendAI_();
    var intent = nxAiDetectLocal_(text);
    if (!intent) return nxAiSendAI_();
    input.value = ''; input.style.height = 'auto';
    nxAiPhoneTab_('chat');
    var userMsg = { role: 'user', content: text };
    nxAiConv.messages.push(userMsg);
    var ub = nxAiAppendBubble_('user', text);
    ub._nxMsgRef = userMsg;
    var bubble = nxAiAppendBubble_('assistant', '⚡ 처리 중…');
    var aiMsg = { role: 'assistant', content: '[⚡바로 처리]' };
    bubble._nxMsgRef = aiMsg;
    nxAiRunLocal_(intent, text).then(function(res){
      if (!res){
        // 대상을 정하지 못함 — 이 질문은 AI에게 넘긴다(방금 넣은 말풍선·기록은 걷어낸다).
        var i = nxAiConv.messages.indexOf(userMsg); if (i !== -1) nxAiConv.messages.splice(i, 1);
        ub.remove(); bubble.remove();
        nxAiSendAI_(text);
        return;
      }
      nxAiConv.messages.push(aiMsg);
      nxAiRenderLocal_(bubble, res, text);
      nxAiCountFree_('local');
      nxAiScheduleSave_();
    }).catch(function(err){
      bubble.textContent = '바로 처리 중 오류: ' + (err && err.message ? err.message : err);
      var i = nxAiConv.messages.indexOf(userMsg); if (i !== -1) nxAiConv.messages.splice(i, 1);
      if (typeof nxLogBug_ === 'function') nxLogBug_({ kind: 'local', where: '바로 처리(' + intent.kind + ')', message: String(err && err.message || err), detail: text });
    });
  }

  function nxAiSendAI_(forcedText, opts){
    opts = opts || {};
    var input = nxAiEl_('nxAiInput');
    var text = (forcedText || input.value).trim();
    if (!text || nxAiAbort) return;
    if (nxAiApiSecret === null){ nxAiToast_('아직 준비 중입니다 — 잠시 후 다시 시도해주세요.'); return; }

    var files = nxAiPendingFiles.slice(), images = nxAiPendingImages.slice();
    var note = files.map(function(a){ return (a.type === 'folder' ? ' 📁' : ' 📎') + a.name; }).join('') + images.map(function(){ return ' 🖼️'; }).join('');
    nxAiPhoneTab_('chat');
    var userBubble = nxAiAppendBubble_('user', (opts.displayText || text) + note);
    input.value = ''; input.style.height = 'auto';
    nxAiPendingFiles = []; nxAiPendingImages = []; nxAiRenderAttachBar_();

    // 대화 기록에는 가벼운 텍스트만 남긴다(이미지를 기록에 넣으면 매 턴 다시 전송돼 비용이 누적됨 — work와 같음)
    var userMsg = { role: 'user', content: text };
    nxAiConv.messages.push(userMsg);
    userBubble._nxMsgRef = userMsg;

    var openFileCtx = nxAiOpenFileContext_();
    var editTarget = (openFileCtx && typeof openFileCtx.liveContent === 'string') ? Object.assign({}, nxAiPreviewFile) : null;
    var thinking = nxAiAppendBubble_('assistant', '생각 중…');
    nxAiAbort = new AbortController();
    nxAiSetBusy_(true);

    // 1단계(무료) — 정말 간단하고 NX 자료가 필요 없는 질문, 또는 구글 캘린더·Gmail·드라이브 조회는
    // 유료 AI보다 먼저 제미니에게 물어본다(work와 같은 규칙). 실패하면 조용히 원래 AI로 넘어간다.
    var gemRoute = nxAiDetectGemRoute_(text);
    var gemModelOk = nxAiSettings.model === 'auto' || nxAiSettings.model === 'claude-haiku-4-5-20251001';
    var gemEligible = !opts.noGem && !files.length && !images.length && !openFileCtx
      && ((gemModelOk && nxAiIsGemSafe_(text)) || !!gemRoute);
    var gemFail = ''; // 제미니를 시도했다가 실패한 이유 — 유료 AI 답변 위에 표시한다(조용히 넘어가면 토큰이 든 줄 모름)
    var gemStep = !gemEligible ? Promise.resolve(false) : (function(){
      // 제미니가 오래 생각해도 중간에 끊지 않는다(50초에 끊었더니 제미니가 답을 준비하는 동안 Haiku가 대신 답해버림 —
      // 2026-10-08 실사용 지적). 대신 경과 시간과 "유료 AI로 바로 받기" 버튼을 보여주고 기다릴지는 세무사님이 정한다.
      var gemLabel = gemRoute ? ('🔮 먼저 무료로 확인 중 (Gemini·' + gemRoute.label + ')') : '🔮 먼저 무료로 확인 중 (Gemini)';
      var gemId = null, gemSec = 0;
      thinking.innerHTML = '<span class="nxai-gem-wait">' + nxAiEsc_(gemLabel) + '…</span> <button type="button" class="nxai-btn nxai-gem-skip" title="제미니를 기다리지 않고 유료 AI에게 바로 묻습니다(토큰 사용)">⏭ 유료 AI로 바로 받기</button>';
      var waitEl = thinking.querySelector('.nxai-gem-wait');
      thinking.querySelector('.nxai-gem-skip').addEventListener('click', function(){ nxAiGemSkip_(gemId); });
      var gemTick = setInterval(function(){ gemSec++; if (waitEl) waitEl.textContent = gemLabel + '… ' + gemSec + '초 (제미니가 생각 중)'; }, 1000);
      if (nxAiAbort) nxAiAbort.signal.addEventListener('abort', function(){ nxAiGemSkip_(gemId); });
      var convAtGem = nxAiConv;
      return nxAiAskGemSilent_(gemRoute ? ('@' + text) : text, 150000, function(id){ gemId = id; }).then(function(r){
        var ans = r && r.answer, src = (r && r.sources) || [];
        // 캘린더·메일·드라이브 조회인데 실제 출처가 확인 안 되면 지어낸 답일 수 있다 — 실패로 보고 AI로 넘긴다.
        if (!ans || !ans.trim()){ gemFail = '빈 응답'; return false; }
        if (gemRoute && !src.length){ gemFail = '구글 앱 출처 확인 안 됨'; return false; }
        if (nxAiAbort && nxAiAbort.signal.aborted) return true;
        var label = gemRoute ? ('🔮 Gemini · ' + gemRoute.label + ' 조회 · 무료 — ✅ ' + src.join(', ') + ' 확인됨') : '🔮 Gemini · 무료 답변(토큰 0)';
        thinking.innerHTML = '<div class="nxai-local-badge gem">' + nxAiEsc_(label) + '</div><div class="nxai-md">' + nxAiMd_(ans) + '</div>';
        nxAiCountFree_('gem');
        var aiMsg = { role: 'assistant', content: ans };
        convAtGem.messages.push(aiMsg);
        thinking._nxMsgRef = aiMsg;
        if (convAtGem === nxAiConv) nxAiScheduleSave_();
        return true;
      }).catch(function(err){
        var m = err && err.message;
        gemFail = m === 'not_connected' ? '' : m === 'timeout' ? '시간 초과' : m === 'skipped' ? '기다리지 않고 건너뜀' : (m || '오류'); // 확장프로그램이 없는 기기(휴대폰 등)는 시도 자체를 안 한 것이라 표시하지 않음
        return false;
      }).then(function(done){
        clearInterval(gemTick);
        if (!done) thinking.textContent = gemFail ? ('🔮 제미니 실패(' + gemFail + ') — 유료 AI가 대신 답하는 중…') : '생각 중…';
        return done;
      });
    })();

    gemStep.then(function(gemDone){
    if (gemDone) return;
    return nxAiOpenFileMediaBlock_().then(function(mediaBlock){
      var imageBlocks = images.map(function(img){ return nxAiParseDataUrl_(img.dataUrl); }).filter(Boolean)
        .map(function(p){ return { type: 'image', source: { type: 'base64', media_type: p.mimeType, data: p.base64 } }; });
      var extra = [].concat(mediaBlock ? [mediaBlock] : [], imageBlocks);
      var requestMessages = nxAiTrimForRequest_(nxAiConv.messages);
      if (extra.length) requestMessages[requestMessages.length - 1] = { role: 'user', content: [{ type: 'text', text: text }].concat(extra) };
      var convAtSend = nxAiConv;
      return nxAiRunTurn_(requestMessages, {
        thinkingBubble: thinking,
        signal: nxAiAbort.signal,
        context: nxAiBuildContext_({ openFile: openFileCtx, attachedItems: files }),
        settingsPayload: opts.settings || nxAiBuildSettingsPayload_(text),
        onDone: function(reply, actions, usage){
          nxAiRenderReply_(thinking, reply, actions, editTarget);
          nxAiUsageFooter_(thinking, usage);
          // 유료로 간 질문을 기록 — 반복되는 단순 요청을 찾아 ⚡바로 처리로 옮기는 근거(⚙ AI 설정에서 확인)
          if (usage && usage.usd) callGas('ai_log_paid', { entry: { kind: opts.settings ? 'strategy' : 'chat', model: usage.model, usd: usage.usd, q: opts.displayText || text } }).catch(function(){});
          if (gemFail) thinking.insertAdjacentHTML('afterbegin', '<div class="nxai-local-badge" style="color:#a15c00;background:#fff3e0">🔮 제미니 실패(' + nxAiEsc_(gemFail) + ') → 유료 AI 답변</div>');
          var aiMsg = { role: 'assistant', content: reply };
          convAtSend.messages.push(aiMsg);
          thinking._nxMsgRef = aiMsg;
          if (convAtSend === nxAiConv) nxAiScheduleSave_();
        },
        onError: function(msg){
          thinking.textContent = msg;
          var i = convAtSend.messages.indexOf(userMsg); if (i !== -1) convAtSend.messages.splice(i, 1);
          if (typeof nxLogBug_ === 'function') nxLogBug_({ kind: 'ai', where: 'AI 대화(' + nxAiMode + ')', message: msg, detail: '질문: ' + text.slice(0, 300) });
        },
        onAbort: function(){
          thinking.textContent = '⏹ 중단됨';
          var i = convAtSend.messages.indexOf(userMsg); if (i !== -1) convAtSend.messages.splice(i, 1);
        }
      });
    });
    }).then(function(){
      nxAiAbort = null;
      nxAiSetBusy_(false);
      input.focus();
    });
  }

  // ============================================================
  // 말풍선 메뉴(좌클릭=복사/입력창 채우기, 더블클릭=재전송, 우클릭=메뉴) — work와 같은 동작
  // ============================================================
  function nxAiCopy_(msg){
    if (!msg || !msg.content) return;
    var done = function(){ nxAiToast_('메시지를 복사했습니다.'); };
    try{ navigator.clipboard.writeText(msg.content).then(done, function(){ nxAiCopyFallback_(msg.content); done(); }); }
    catch(e){ nxAiCopyFallback_(msg.content); done(); }
  }
  function nxAiCopyFallback_(text){
    var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){} ta.remove();
  }
  function nxAiRefill_(msg){
    var input = nxAiEl_('nxAiInput');
    input.value = msg.content; input.focus();
    input.selectionStart = input.selectionEnd = input.value.length;
    nxAiToast_('입력창에 불러왔습니다 — 수정한 뒤 다시 보내세요.');
  }
  function nxAiDeleteMsg_(bubble, msg){
    nxAiConfirm_('이 메시지를 대화기록에서 삭제할까요?').then(function(ok){
      if (!ok) return;
      var i = nxAiConv.messages.indexOf(msg); if (i !== -1) nxAiConv.messages.splice(i, 1);
      bubble.remove(); nxAiScheduleSave_();
    });
  }
  function nxAiRevertFrom_(bubble, msg){
    nxAiConfirm_('이 메시지부터 이후 대화가 전부 사라집니다. 계속할까요?').then(function(ok){
      if (!ok) return;
      var i = nxAiConv.messages.indexOf(msg); if (i !== -1) nxAiConv.messages.length = i;
      var sib = bubble; while (sib){ var next = sib.nextSibling; if (sib.classList && sib.classList.contains('nxai-msg')) sib.remove(); sib = next; }
      nxAiScheduleSave_();
    });
  }
  function nxAiSaveAsMemo_(msg){
    if (typeof openSaveDialog === 'function') openSaveDialog(msg.content, null);
    else nxAiToast_('메모 저장 화면을 열 수 없습니다.');
  }
  function nxAiRegenerate_(bubble, msg){
    if (nxAiAbort) return;
    nxAiConfirm_('이 답변을 다시 만들까요? 이 답변 이후의 대화는 모두 사라집니다.').then(function(ok){
      if (!ok) return;
      var i = nxAiConv.messages.indexOf(msg); if (i === -1) return;
      nxAiConv.messages.length = i;
      var sib = bubble; while (sib){ var next = sib.nextSibling; if (sib.classList && sib.classList.contains('nxai-msg')) sib.remove(); sib = next; }
      var lastUser = '';
      for (var k = nxAiConv.messages.length - 1; k >= 0; k--){ if (nxAiConv.messages[k].role === 'user'){ lastUser = nxAiConv.messages[k].content; break; } }
      var thinking = nxAiAppendBubble_('assistant', '생각 중…');
      var openFileCtx = nxAiOpenFileContext_();
      var editTarget = (openFileCtx && typeof openFileCtx.liveContent === 'string') ? Object.assign({}, nxAiPreviewFile) : null;
      var convAtSend = nxAiConv;
      nxAiAbort = new AbortController(); nxAiSetBusy_(true);
      nxAiRunTurn_(nxAiTrimForRequest_(nxAiConv.messages), {
        thinkingBubble: thinking, signal: nxAiAbort.signal,
        context: nxAiBuildContext_({ openFile: openFileCtx }),
        settingsPayload: nxAiBuildSettingsPayload_(lastUser),
        onDone: function(reply, actions){
          nxAiRenderReply_(thinking, reply, actions, editTarget);
          var aiMsg = { role: 'assistant', content: reply };
          convAtSend.messages.push(aiMsg); thinking._nxMsgRef = aiMsg;
          if (convAtSend === nxAiConv) nxAiScheduleSave_();
        },
        onError: function(m){ thinking.textContent = m; },
        onAbort: function(){ thinking.textContent = '⏹ 중단됨'; }
      }).then(function(){ nxAiAbort = null; nxAiSetBusy_(false); });
    });

  var nxAiMenuEl = null;

        if (nxAiSettings.systemPrompt) settings.systemPrompt = nxAiSettings.systemPrompt;
        nxAiSendAI_(prompt, { noGem: true, settings: settings, displayText: '🧠 전략 검토 — ' + (k.사건명 || nxAiConv.caseName || '') + (extra ? ' (추가 요청: ' + extra.slice(0, 60) + ')' : '') });
      });
    }).catch(function(err){ nxAiToast_('전략 검토를 시작하지 못했습니다: ' + (err && err.message || err)); });
  }

  // ⚖ 동시비교 — 같은 질문을 제미니와 AI에게 "동시에" 보낸다(한쪽 답을 먼저 보고 질문을 다듬지 않게 — work와 같음).
  // AI 요청은 보내는 순간의 대화기록으로 나가므로 제미니 답을 보지 않는다(제미니 답은 나중에 기록에 붙음).
  function nxAiAskBoth_(){
    var input = nxAiEl_('nxAiInput');
    var q = input.value.trim();
    if (!q){ nxAiToast_('AI와 제미니에게 동시에 물어볼 내용을 입력창에 먼저 쓰세요.'); input.focus(); return; }
    if (nxAiAbort) return;
    nxAiAskGemManual_(q, { compare: true });
    nxAiSendAI_(q, { noGem: true });
    input.value = ''; input.style.height = 'auto';
  }
  // 다른 사이트(등기부·실거래가·홈택스 등)에서 Alt+Shift+C로 보낸 글자 → 입력창에 이어 붙인다.
  function nxAiInsertCapturedText_(text, meta){
    if (!text || !String(text).trim()) return;
    nxAiCaptureCount++;
    var input = nxAiEl_('nxAiInput');
    var chunk = '[' + nxAiCaptureCount + '] ' + ((meta && meta.title) ? (meta.title + ' ' + (meta.url || '')) : '') + '\n' + String(text).trim();
    input.value = input.value ? (input.value + '\n\n' + chunk) : chunk;
    input.dispatchEvent(new Event('input'));
    nxAiToast_('확장프로그램에서 가져와 AI 입력창에 넣었습니다 (#' + nxAiCaptureCount + (meta && meta.mode === 'selection' ? ' · 선택영역' : ' · 전체 페이지') + ')');
  }
  window.addEventListener('message', function(event){
    if (event.source !== window && !(window.parent !== window && event.source === window.parent)) return;
    if (nxAiExtTarget && event.source !== nxAiExtTarget) return;
    var d = event.data;
    if (!d || d.source !== 'nx-bridge' || !d.type) return;
    if (d.type === 'NX_HELLO_ACK'){ nxAiExtTarget = event.source; nxAiExtConnected = true; nxAiExtUi_(); return; }
    if (d.type === 'NX_BRIDGE_PONG'){ nxAiBridgeVer = (d.version || '?') + (d.where === 'parent' ? '·바깥 틀' : ''); return; }
    if (d.type === 'NX_GEM_PROGRESS') return; // 진행 문구는 생략(말풍선은 "물어보는 중" 그대로)
    if (d.type === 'NX_GEM_ANSWER' || d.type === 'NX_GEM_ERROR'){
      var p = nxAiGemPending[d.requestId]; if (!p) return;
      delete nxAiGemPending[d.requestId];
      if (d.type === 'NX_GEM_ANSWER') p.resolve({ answer: d.answer || '', sources: d.sources || [] });
      else p.reject(new Error(d.error || 'gem_error'));
      return;
    }
    if (d.type === 'NX_CAPTURE') return nxAiInsertCapturedText_(d.text, d);
    // [2026.10.10] 도우미 창 음성 입력 — 번호 없이 입력창 뒤에 이어 붙인다(보내기는 세무사님이)
    if (d.type === 'NX_CAPTURE_VOICE'){
      var vin = nxAiEl_('nxAiInput'), vt = String(d.text || '').trim();
      if (vt){ vin.value = vin.value ? (vin.value.replace(/\s*$/, '') + ' ' + vt) : vt; vin.dispatchEvent(new Event('input')); vin.focus(); nxAiToast_('🎤 말씀하신 내용을 입력창에 넣었습니다 — 확인 후 보내세요.'); }
      return;
    }
    if (d.type === 'NX_CAPTURE_IMAGE'){
      if (d.dataUrl) nxAiAddImage_('화면캡처' + (d.title ? ' · ' + d.title : ''), d.dataUrl);
      nxAiToast_('확장프로그램에서 화면 캡처를 받아 첨부했습니다.');
      return;
    }
    // [2026.10.10] PDF 자동전송(확장프로그램 옵션) — 등기소·홈택스 등에서 PDF를 내려받는 순간 확장프로그램이 같은 파일을 보낸다.
    // "내 컴퓨터에서 올리기"와 같은 길로: 사건이 연결된 대화면 그 사건 폴더, 아니면 대화기록 폴더에 올리고 AI 입력창에 첨부.
    if (d.type === 'NX_CAPTURE_PDF'){
      try {
        var bin = atob(String(d.base64 || ''));
        var u8 = new Uint8Array(bin.length);
        for (var bi = 0; bi < bin.length; bi++) u8[bi] = bin.charCodeAt(bi);
        var pdfName = String(d.filename || 'document.pdf').replace(/[\\/:*?"<>|]/g, '_');
        if (!/\.pdf$/i.test(pdfName)) pdfName += '.pdf';
        nxAiToast_('확장프로그램에서 PDF를 받았습니다 — ' + (nxAiConv.caseName ? '"' + nxAiConv.caseName + '" 사건 폴더에' : '대화기록 폴더에') + ' 저장하고 첨부합니다.');
        // [2026.10.10] 등기부·홈택스·가족관계 서류 PDF면 받자마자 무료 OCR+규칙으로 정리해 보여준다(토큰 0)
        nxAiUploadLocalFiles_([new File([u8], pdfName, { type: 'application/pdf' })], (NXAI_REGISTRY_NAME_RE_.test(pdfName) || NXAI_DOC_SITE_RE_.test(String(d.url || ''))) ? function(up){
          nxAiPendingFiles = nxAiPendingFiles.filter(function(x){ return x.id !== up.id; }); nxAiRenderAttachBar_();
          nxAiRunRegistry_([up], '');
        } : null);
      } catch (err) { nxAiToast_('PDF를 받지 못했습니다: ' + (err && err.message || err)); }
      return;
    }
  });

  // 제미니(무료)에 자동으로 먼저 물어볼 질문인지 — work chat.js와 같은 규칙(그대로 유지할 것).
  // 사건·고객·세금처럼 NX 자료가 필요한 질문은 제미니가 그럴싸하게 지어낼 위험이 있어 전부 뺀다.
  // 고객 개인정보가 무료 제미니로 나가지 않게 하는 장치이기도 하다.
  var NXAI_GEM_UNSAFE_RE = /(파일|폴더|저장|불러|읽어|열어|찾아|검색|조회|일정|캘린더|할일|메일|이메일|보내|발송|사건|고객|상담|기억해|등록|계산|세액|세금|양도|증여|상속|취득세|재산세|법인세|소득세|부가가치세|세법|시행령|시행규칙|판례|예규|조문|비과세|감면|공제|세율|공시가격|시세|등기|사업자|주소|건축물|첨부|반영|수정|고쳐|삭제)/;
  function nxAiIsGemSafe_(text){
    if (!text || text.length > 200) return false;
    if (NXAI_GEM_UNSAFE_RE.test(text)) return false;
    if (NXAI_COMPLEX_RE.test(text)) return false;
    return true;
  }
  var NXAI_GEM_ROUTES = [
    { app: 'calendar', label: '구글캘린더', re: /(일정|캘린더|스케줄|미팅|약속|몇\s*시|언제)/ },
    { app: 'gmail', label: 'Gmail', re: /(메일|이메일|편지함|받은편지)/ },
    { app: 'drive', label: '드라이브', re: /(드라이브|파일|폴더|문서)/ }
  ];
  var NXAI_GEM_WRITE_RE = /(추가|등록|삭제|취소|변경|수정|만들어|잡아|저장|고쳐|반영|보내|발송|답장|이동|복사|공유|이름\s*바꿔)/;
  var NXAI_GEM_STRUCT_RE = /(사건|고객|상담|기억해|계산|세액|세금|양도|증여|상속|취득세|재산세|법인세|소득세|부가가치세|세법|시행령|시행규칙|판례|예규|조문|비과세|감면|공제|세율|공시가격|시세|등기|사업자|주소|건축물|첨부)/;
  function nxAiDetectGemRoute_(text){
    if (!text || text.length > 200) return null;
    if (NXAI_GEM_WRITE_RE.test(text) || NXAI_GEM_STRUCT_RE.test(text) || NXAI_COMPLEX_RE.test(text)) return null;
    for (var i = 0; i < NXAI_GEM_ROUTES.length; i++) if (NXAI_GEM_ROUTES[i].re.test(text)) return NXAI_GEM_ROUTES[i];
    return null;
  }

  // ============================================================

  (function(){

    // 모드에서는 사이드바 자체를 숨기므로 창도 같이 안 보이게 된다 — 처음에 body로 옮겨둔다.
    ['nxAiCaseOverlay', 'nxAiSettingsOverlay'].forEach(function(id){
      var el = nxAiEl_(id);
      if (el && el.parentNode !== document.body) document.body.appendChild(el);
      // 사이드바 모드에서 이 창을 누르면 index.html의 '바깥 클릭 → 사이드바 접기'로 오인되지 않게 한다.
      if (el) el.addEventListener('click', function(e){ e.stopPropagation(); });

    var input = nxAiEl_('nxAiInput');
    nxAiEl_('nxAiSend').addEventListener('click', function(){
      if (nxAiAbort){ nxAiAbort.abort(); return; }
      nxAiSend_();
    });
    // 한글 조합 중 Enter는 글자 확정용(isComposing/229) — 전송하지 않는다. keyCode 13도 같이 본다
    // (일부 환경에서 e.key가 비어 오는 문제 — 로그인 Enter 버그 때 확인된 사실).
    var shiftHeld = false;
    input.addEventListener('keydown', function(e){
      if (e.key === 'Shift') shiftHeld = true;
      if (e.isComposing || e.keyCode === 229) return;
      if ((e.key === 'Enter' || e.keyCode === 13) && !e.shiftKey){ e.preventDefault(); nxAiSend_(); }
    });
    input.addEventListener('keyup', function(e){ if (e.key === 'Shift') shiftHeld = false; });
    // 태블릿 가상자판 — Enter가 keydown으로 안 잡히고 줄바꿈 입력만 오는 경우(work와 같은 보강)
    input.addEventListener('beforeinput', function(e){
      if (e.inputType === 'insertLineBreak' && !shiftHeld){ e.preventDefault(); nxAiSend_(); }
    });
    input.addEventListener('input', function(){
      input.style.height = 'auto';
      input.style.height = Math.min(160, input.scrollHeight) + 'px';
    });
    // 이미지 붙여넣기 → 바로 첨부
    input.addEventListener('paste', function(e){
      var items = (e.clipboardData && e.clipboardData.items) || [];
      Array.prototype.forEach.call(items, function(it){
        if (it.kind === 'file' && it.type.indexOf('image/') === 0){
          e.preventDefault();

        }

    });

    var body = nxAiEl_('nxAiBody');

      var b = e.target.closest('.nxai-msg');

      if (input.value.trim() && !input.disabled) nxAiSend_();
    });
    body.addEventListener('contextmenu', function(e){
      var b = e.target.closest('.nxai-msg');
      if (!b || !b._nxMsgRef) return;
      e.preventDefault();
      var m = b._nxMsgRef;
      var items = [{ label: '📋 복사', action: function(){ nxAiCopy_(m); } }];
      if (m.role === 'assistant'){
        items.push({ label: '🔄 이 답변 다시 만들기', action: function(){ nxAiRegenerate_(b, m); } });
        items.push({ label: '📝 메모로 저장', action: function(){ nxAiSaveAsMemo_(m); } });
      } else {

      }

      });
    });
    // 처음 열 때 몇 번 나눠서 연결을 시도한다(확장프로그램 서비스워커가 잠들어 있으면 첫 인사를 놓칠 수 있음)
    [0, 1500, 4000, 8000].forEach(function(ms){ setTimeout(function(){ if (!nxAiExtConnected) nxAiExtHello_(); }, ms); });
    // 📋 클립보드 → 입력창(커서 위치). 구글 틀은 clipboard-read를 허용한다(허용목록 확인). 처음엔 브라우저가 허용을 묻는다.
    nxAiEl_('nxAiPasteBtn').addEventListener('click', function(){
      var inp = nxAiEl_('nxAiInput');
      if (!navigator.clipboard || !navigator.clipboard.readText){ nxAiToast_('이 브라우저는 클립보드 읽기를 지원하지 않습니다 — 입력창에서 Ctrl+V 해주세요.'); inp.focus(); return; }
      navigator.clipboard.readText().then(function(t){
        if (!t){ nxAiToast_('클립보드가 비어 있습니다.'); return; }
        var st = inp.selectionStart || inp.value.length, en = inp.selectionEnd || inp.value.length;
        inp.value = inp.value.slice(0, st) + t + inp.value.slice(en);
        inp.focus(); inp.selectionStart = inp.selectionEnd = st + t.length;
        inp.dispatchEvent(new Event('input'));
      }).catch(function(){ nxAiToast_('클립보드를 읽지 못했습니다(브라우저 권한) — 입력창에서 Ctrl+V 해주세요.'); inp.focus(); });
    });

    nxAiEl_('nxAiModelLock').addEventListener('change', function(){
      nxAiSettings.model = nxAiEl_('nxAiModelLock').checked ? nxAiEl_('nxAiModel').value : 'auto';
      nxAiSaveSettings_(); nxAiRefreshModelUi_();
    });
    nxAiEl_('nxAiModel').addEventListener('change', function(){
      if (!nxAiEl_('nxAiModelLock').checked) return;
      nxAiSettings.model = nxAiEl_('nxAiModel').value; nxAiSaveSettings_();
    });
    nxAiEl_('nxAiAdvisor').addEventListener('change', function(){
      nxAiSettings.enableAdvisor = nxAiEl_('nxAiAdvisor').checked; nxAiSaveSettings_(); nxAiRefreshModelUi_();
    });
    nxAiRefreshModelUi_();

    nxAiEl_('nxAiSettingsBtn').addEventListener('click', nxAiOpenSettings_);
    nxAiEl_('nxAiSettingsClose').addEventListener('click', nxAiCloseSettings_);
    nxAiEl_('nxAiSettingsSave').addEventListener('click', nxAiCloseSettings_);
    nxAiEl_('nxAiSettingsOverlay').addEventListener('click', function(e){ if (e.target.id === 'nxAiSettingsOverlay') nxAiCloseSettings_(); });
    nxAiEl_('nxAiSettingsReset').addEventListener('click', function(){
      var keep = { model: nxAiSettings.model, enableAdvisor: nxAiSettings.enableAdvisor };
      nxAiSettings = Object.assign({}, NXAI_DEFAULT_SETTINGS, keep);
      nxAiSaveSettings_(); nxAiOpenSettings_();
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape'){
        nxAiCloseMenu_();
        if (!nxAiEl_('nxAiSettingsOverlay').hidden) nxAiCloseSettings_();
        nxAiEl_('nxAiCaseOverlay').hidden = true;
        return;
      }
      if (!e.altKey || (e.key || '').toLowerCase() !== 's') return;
      e.preventDefault();
      nxAiCloseMenu_();
      if (nxAiEl_('nxAiSettingsOverlay').hidden) nxAiOpenSettings_(); else nxAiCloseSettings_();
    });

    nxAiEl_('nxAiPvTabFiles').addEventListener('click', function(){ nxAiPvShowTab_('files'); });
    nxAiEl_('nxAiPvTabView').addEventListener('click', function(){ nxAiPvShowTab_('view'); });
    // 미리보기 숨기기(칸 안의 ») / 열기(대화창 머리의 «) — 이 기기에 기억
    var PV_HIDDEN_KEY = 'nxAiPvHidden';
    var setPvHidden = function(hidden){ nxAiEl_('nxAi').classList.toggle('pv-collapsed', hidden); nxAiLs_(PV_HIDDEN_KEY, hidden ? '1' : '0'); };
    nxAiEl_('nxAiPvToggle').addEventListener('click', function(){ setPvHidden(true); });
    nxAiEl_('nxAiPvShow').addEventListener('click', function(e){ e.stopPropagation(); setPvHidden(false); });
    if (nxAiLs_(PV_HIDDEN_KEY) === '1') nxAiEl_('nxAi').classList.add('pv-collapsed');
    // 미리보기 위치 — 아이콘으로 오른쪽/아래를 고르면 이 기기에 기억. 고른 적 없으면 PC=오른쪽, 태블릿=아래.
    // 누를 때마다 자동 → 오른쪽 고정 → 아래 고정 → 자동 (세무사님 선택)
    nxAiEl_('nxAiPvPosBtn').addEventListener('click', function(){
      var cur = nxAiLs_('nxAiPvPos');
      var next = cur === 'right' ? 'bottom' : (cur === 'bottom' ? 'auto' : 'right');
      nxAiLs_('nxAiPvPos', next);
      nxAiApplyPvPos_();
    });
    document.addEventListener('nx-layout-change', nxAiApplyPvPos_);
    nxAiApplyPvPos_();
    // 폰 탭 전환
    Array.prototype.forEach.call(document.querySelectorAll('#nxAiPhoneTabs button'), function(b){
      b.addEventListener('click', function(){ nxAiPhoneTab_(b.getAttribute('data-ph')); });
    });
    nxAiEl_('nxAiPvAttach').addEventListener('click', function(){ if (nxAiPreviewFile) nxAiAddFileAttachment_(nxAiPreviewFile); });
    nxAiEl_('nxAiPvSave').addEventListener('click', nxAiPvSave_);
    nxAiEl_('nxAiPvSaveProposal').addEventListener('click', nxAiPvSave_);
    nxAiEl_('nxAiPvDiscardProposal').addEventListener('click', function(){
      var ta = nxAiEl_('nxAiPvText');
      if (ta && nxAiPreviewProposalOriginal !== null) ta.value = nxAiPreviewProposalOriginal;
      nxAiPvHideProposal_(); nxAiPvUpdateDirty_();
    });

    // 사이드바 너비 조절(예전 aisidebar.html에서 그대로) — 이 기기에만 기억
    var WIDTH_KEY = 'nxAiSbWidth', MIN_W = 220;
    var side = nxAiEl_('sideAI'), handle = nxAiEl_('nxAiResize');
    var maxW = function(){ return Math.max(MIN_W, window.innerWidth * 0.88); };
    if (side){
      new MutationObserver(function(){
        if (side.classList.contains('expanded')){
          var saved = parseInt(nxAiLs_(WIDTH_KEY), 10);
          if (saved) side.style.width = Math.min(Math.max(saved, MIN_W), maxW()) + 'px';
        } else side.style.width = '';
      }).observe(side, { attributes: true, attributeFilter: ['class'] });
      handle.addEventListener('pointerdown', function(e){
        if (nxAiMode !== 'side') return;
        e.preventDefault(); e.stopPropagation();
        handle.classList.add('dragging'); handle.setPointerCapture(e.pointerId);
        var onMove = function(ev){ side.style.width = Math.min(Math.max(window.innerWidth - ev.clientX, MIN_W), maxW()) + 'px'; };
        var onUp = function(){
          handle.classList.remove('dragging');
          handle.removeEventListener('pointermove', onMove); handle.removeEventListener('pointerup', onUp);
          nxAiLs_(WIDTH_KEY, String(parseInt(side.style.width, 10)));
        };
        handle.addEventListener('pointermove', onMove); handle.addEventListener('pointerup', onUp);
      });
    }
  })();
</script>
