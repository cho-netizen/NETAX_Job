<!-- ============================================================
     [2026.10.20] 🧭 시스템 관리 안 📚 지침·템플릿 정비 — 세무사님 "지침서·검토서·보고서·의뢰서 템플릿이 노하우의 최종 결정체…
     지속적으로 만들도록 하는 장치를 마련하라", "기존 파일을 점검하여 수정할 것은 수정하고 폐기할 것은 폐기하고 새로 만들 것은 만들어야 한다".
     서버는 KnowHow.js(knh_* 동작). 이 파일은 settings.html의 🧭 카드(#stSysAdminCard) 안, 파일 목록(#stSysAdminBody) 위에 제 구획을 스스로 끼운다
     (sysadmin.html을 고치는 다른 작업과 겹치지 않게). 대시보드 한 줄(#dashKnhCard)도 여기서 채운다.
       - 📚 제안 대기: 주간 루틴 초안(📥 반영 때 드라이브 "_제안함"으로 들어옴)·AI 사이드바 제안. 👁 보기(공용 렌더러)·차이 보기 →
         ✅ 채택(이전 판 "_이전판") / ✏ 작성관리에서 고친 뒤 채택 / ✖ 반려(사유 → 다음 루틴이 읽음), 폐기 제안은 ✅ 폐기("_폐기"로 옮김) / ✖ 유지.
       - 📊 업무별 보유 현황: 업무(세목×업무유형)별 지침·의뢰서·보고서 템플릿 유무, 마지막 정비일, 상태 — 빈칸 = 다음 작성 대상.
       - 🔎 파일별 판정: 현행 / 수정 필요 / 폐기 후보와 이유(밤마다 0원 규칙으로).
     서버에는 올리지 않는다(.claspignore).
     ============================================================ -->
<style>
  #stKnhBody{ margin:4px 0 14px; }
  #stKnhBody .kh-sec{ border:1px solid var(--line); border-radius:8px; background:var(--panel); margin-bottom:10px; }
  #stKnhBody .kh-sec > summary{ cursor:pointer; padding:9px 12px; font-size:13.5px; font-weight:700; color:var(--navy); list-style:none; }
  #stKnhBody .kh-sec > summary::-webkit-details-marker{ display:none; }
  #stKnhBody .kh-sec[open] > summary{ border-bottom:1px solid var(--line); }
  #stKnhBody .kh-in{ padding:8px 10px 10px; }
  #stKnhBody .kh-note{ font-size:12px; color:var(--sub); line-height:1.5; margin:2px 0 6px; word-break:keep-all; overflow-wrap:anywhere; }
  #stKnhBody .kh-warn{ font-size:12px; color:var(--danger); margin:2px 0; overflow-wrap:anywhere; }
  #stKnhBody .kh-row{ border:1px solid var(--line); border-radius:8px; background:#fff; padding:8px 10px; margin-bottom:6px; font-size:13px; line-height:1.5; overflow-wrap:anywhere; }
  #stKnhBody .kh-row .kh-t{ font-weight:700; color:var(--ink); }
  #stKnhBody .kh-row .kh-m{ font-size:11.5px; color:var(--sub); }
  #stKnhBody .kh-row ul{ margin:3px 0 0 18px; padding:0; font-size:12.5px; }
  #stKnhBody .kh-badge{ display:inline-block; font-size:11px; font-weight:700; border-radius:10px; padding:0 7px; margin-right:4px; border:1px solid currentColor; white-space:nowrap; }
  #stKnhBody .kh-ok{ color:var(--success); } #stKnhBody .kh-fix{ color:#b26a00; } #stKnhBody .kh-del{ color:#a83232; } #stKnhBody .kh-new{ color:#1f6feb; }
  #stKnhBody .kh-btns{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  #stKnhBody .kh-btns .ghost-btn, #stKnhBody .kh-btns .save-btn{ font-size:12px; padding:3px 9px; }
  #stKnhBody .kh-filter{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  #stKnhBody .kh-filter button.on{ background:var(--navy); color:#fff; }
  #stKnhBody .kh-cov{ display:grid; grid-template-columns:minmax(92px, 1.1fr) 3fr; gap:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff; font-size:12.5px; }
  #stKnhBody .kh-cov > div{ padding:6px 8px; border-bottom:1px solid var(--line); min-width:0; overflow-wrap:anywhere; }
  #stKnhBody .kh-cov .kh-cov-k{ font-weight:700; background:#f9fafb; }
  #stKnhBody .kh-cov .kh-gap{ color:#a83232; font-weight:700; }
  .kh-view-panel{ width:min(980px, 96vw) !important; max-height:92vh !important; display:flex; flex-direction:column; }
  .kh-view-panel .modal-head span{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kh-view-bar{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); background:#f9fafb; }
  .kh-view-bar .kh-tab.on{ background:var(--navy); color:#fff; }
  .kh-view-note{ font-size:12px; color:var(--sub); padding:6px 14px; border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
  .kh-view-body{ overflow:auto; padding:6px 4px 14px; flex:1 1 auto; min-height:120px; background:#fff; }
  .kh-diff{ font:12px/1.5 ui-monospace, Consolas, monospace; white-space:pre-wrap; word-break:break-word; padding:8px 12px; }
  .kh-diff .a{ background:#e6ffec; display:block; } .kh-diff .d{ background:#ffebe9; display:block; text-decoration:line-through; color:#82071e; }
  .kh-diff .s{ color:#8b949e; display:block; }
</style>
<script>
(function(){
  var kh_ = { status: null, filter: '수정 필요', loading: false, loadedAt: 0 };
  var KH_ACT_ = { '신규': 'kh-new', '수정': 'kh-fix', '폐기': 'kh-del' };
  var KH_ST_ = { '현행': 'kh-ok', '수정 필요': 'kh-fix', '폐기 후보': 'kh-del' };

  function esc_(s){ return typeof escapeHtml === 'function' ? escapeHtml(s) : String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function toast_(m){ if (typeof toast === 'function') toast(m); }
  function body_(){
    var b = document.getElementById('stKnhBody');
    if (b) return b;
    var card = document.getElementById('stSysAdminCard'), list = document.getElementById('stSysAdminBody');
    if (!card || !list) return null;
    b = document.createElement('div'); b.id = 'stKnhBody';
    card.insertBefore(b, list);
    return b;
  }

  // ---------- 그리기 ----------
  function render_(){
    var box = body_(); if (!box) return;
    var st = kh_.status || {}, r = st.result || null, pend = st.pending || [];
    var html = '';
    // ① 제안 대기
    html += '<details class="kh-sec" id="khSecPend"' + (pend.length ? ' open' : '') + '><summary>📚 지침·템플릿 제안 대기 ' + pend.length + '건</summary><div class="kh-in">'
      + '<div class="kh-note">매주 월요일 루틴이 초안을 만들고, 📥 반영 때 각 폴더 「_제안함」에 들어옵니다. 바로 쓰이지 않습니다 — 보고 채택해야 실제 지침·템플릿이 됩니다.</div>';
    if (!pend.length) html += '<div class="kh-note">대기 중인 제안이 없습니다.</div>';
    pend.forEach(function(p, i){
      html += '<div class="kh-row"><span class="kh-badge ' + (KH_ACT_[p.작업] || '') + '">' + esc_(p.작업) + '</span><span class="kh-t">' + esc_(p.종류) + ' · ' + esc_(String(p.대상 || '').replace(/\.(md|txt)$/i, '')) + '</span>'
        + '<div>' + esc_(p.이유 || '') + '</div><div class="kh-m">' + esc_(p.at || '') + ' · ' + esc_(p.출처 || '') + ' · ' + esc_(p.id) + '</div>'
        + '<div class="kh-btns"><button type="button" class="save-btn" data-kh="open" data-i="' + i + '">👁 보기·차이 → 결정</button></div></div>';
    });
    if ((st.decisions || []).length) {
      html += '<details style="margin-top:6px;"><summary style="cursor:pointer; font-size:12.5px; color:var(--sub);">최근 결정 ' + st.decisions.length + '건</summary>';
      st.decisions.forEach(function(d){ html += '<div class="kh-m" style="margin:3px 0;">' + esc_(String(d.at).slice(0, 10)) + ' · <b>' + esc_(d.결정) + '</b> · ' + esc_(d.작업) + ' ' + esc_(d.종류) + ' ' + esc_(String(d.대상 || '').replace(/\.(md|txt)$/i, '')) + (d.사유 ? ' — ' + esc_(d.사유) : '') + '</div>'; });
      html += '</details>';
    }
    html += '</div></details>';

    // ①-2 [2026.10.22] 확인할 법령 개정 — 개정 하나를 한 번 확인하면(실질 변경 없음/있음) 그 조문을 인용한 지침·템플릿·절세 아이템 판정이 같이 쓴다
    //  (10-22 소득세법 §88·89·95 2027.9.9. 시행 개정이 타법개정으로 법률 이름만 바뀐 것이었는데 파일마다 따로 확인해야 했음)
    var laws = st.개정 || [], lawTodo = laws.filter(function(v){ return !v.확인 && (v.문서.length || v.절세); }).length;
    if (laws.length) {
      html += '<details class="kh-sec" id="khSecLaw"' + (lawTodo ? ' open' : '') + '><summary>⚖ 확인할 법령 개정 ' + lawTodo + '건' + (laws.length > lawTodo ? ' (확인함 ' + (laws.length - lawTodo) + ')' : '') + '</summary><div class="kh-in">'
        + '<div class="kh-note">법령 개정 감시가 잡은 개정 중 지침·템플릿·절세 아이템이 인용한 조문입니다. 원문을 대조해 결론을 한 번 누르면 그 조문을 인용한 모든 파일에 같이 적용됩니다 — "실질 변경 없음"(예: 다른 법 개정으로 법률 이름만 바뀜)이면 표시가 풀리고, "있음"이면 반영할 때까지 남습니다. 파일 내용은 고치지 않습니다.</div>';
      laws.forEach(function(v, i){
        html += '<div class="kh-row">' + (v.확인 ? '<span class="kh-badge ' + (v.확인.결론 === '없음' ? 'kh-ok' : 'kh-del') + '">실질 변경 ' + esc_(v.확인.결론) + '</span>' : '<span class="kh-badge kh-fix">확인 전</span>')
          + '<span class="kh-t">' + esc_(v.법령) + ' §' + esc_(v.jo) + (v.제목 ? ' ' + esc_(v.제목) : '') + '</span>'
          + '<div class="kh-m">' + esc_(v.시행일) + (v.구분 === '시행예정' ? ' 시행 예정' : ' 시행') + ' · 감지 ' + esc_(v.감지일 || '') + ' · 걸린 지침·템플릿 ' + v.문서.length + '개 · 절세 아이템 ' + v.절세 + '개' + (v.확인 ? ' · 확인 ' + esc_(String(v.확인.at || '').slice(0, 10)) + (v.확인.메모 ? ' — ' + esc_(v.확인.메모) : '') : '') + '</div>'
          + (v.문서.length ? '<details><summary class="kh-m" style="cursor:pointer;">걸린 파일 보기</summary><div class="kh-m">' + v.문서.map(esc_).join(' · ') + '</div></details>' : '')
          + '<div class="kh-btns"><button type="button" class="ghost-btn" data-kh="law" data-i="' + i + '" data-v="없음">✔ 실질 변경 없음</button><button type="button" class="ghost-btn" data-kh="law" data-i="' + i + '" data-v="있음">⚠ 실질 변경 있음</button>'
          + (v.확인 ? '<button type="button" class="ghost-btn" data-kh="law" data-i="' + i + '" data-v="">기록 지우기</button>' : '') + '</div></div>';
      });
      html += '</div></details>';
    }

    // ①-3 [2026.10.22] 표시 분류 오류 후보 — 세무사님 "확인필요에서 확인하고 나서 판단대기로 분류하는 것 아닌가?" / "나는 분류시스템의 문제를 지적하는 것이다".
    //  확인조치사항에 판단 대기로 올라간 쟁점인데 아이템·지침에 같은 쟁점의 [확인 필요]가 남은 곳(밤 점검, KnowHow.js knhClsNightly_). 고치지 않고 보이기만.
    var cl = st.분류 || null, clc = (cl && cl.후보) || [];
    html += '<details class="kh-sec" id="khSecCls"' + (clc.length ? ' open' : '') + '><summary>🔀 표시 분류 오류 후보 ' + (cl ? (cl.ran ? clc.length + '곳' : '⚠ 검사 안 됨') : '— 아직 검사 전') + '</summary><div class="kh-in">'
      + '<div class="kh-note">규칙: 한 쟁점에 표시는 하나 — [확인 필요](근거 못 찾음) → 결론 나면 표시 지움 / 근거끼리 부딪히면 확인조치사항에 올리고 그 자리 표시를 "[판단 대기 — 확인조치사항 💡 절]"로 바꿈. 아래는 확인조치사항 미결 항목과 같은 쟁점 낱말이 든 [확인 필요] 줄이 아직 남은 곳입니다. 낱말 맞춤이라 헛잡힘이 있을 수 있습니다 — 보고 맞으면 그 줄 표시를 바꿔 주세요. 파일은 고치지 않습니다.</div>';
    if (cl) html += '<div class="kh-note">' + esc_(cl.at || '') + ' 검사 · 확인조치사항 미결 ' + (cl.미결 || 0) + '건 · 읽은 아이템·지침 ' + (cl.파일 || 0) + '개' + (cl.파일안적은항목 ? ' · 💡 항목 중 파일 이름을 안 적은 것 ' + cl.파일안적은항목 + '건(낱말로 찾음)' : '') + '</div>';
    if (cl && !cl.ran) html += '<div class="kh-warn">⚠ ' + esc_(cl.reason || '이유 모름') + '</div>';
    ((cl && cl.warn) || []).forEach(function(w){ html += '<div class="kh-warn">⚠ ' + esc_(w) + '</div>'; });
    if (cl && cl.ran && !clc.length) html += '<div class="kh-note">남은 분류 오류 후보가 없습니다.</div>';
    clc.forEach(function(c, i){
      html += '<div class="kh-row"><span class="kh-badge kh-fix">[확인 필요] 남음</span><span class="kh-t">' + esc_(String(c.파일 || '').replace(/\.(md|txt)$/i, '')) + '</span>'
        + '<div>확인조치사항: ' + esc_(c.항목) + ' <span class="kh-m">(' + esc_(c.절 || '') + ' · ' + c.확인조치줄 + '줄)</span></div>'
        + '<div class="kh-m">' + esc_(c.찾은방법) + ' · 쟁점 낱말: ' + esc_((c.쟁점낱말 || []).join(', ')) + '</div><ul>'
        + c.줄들.map(function(x){ return '<li>' + x.줄 + '줄 ' + esc_(x.표시) + ' — ' + esc_(x.글) + ' <span class="kh-m">(맞은 낱말 ' + esc_(x.낱말.join(', ')) + ')</span></li>'; }).join('') + '</ul>'
        + '<div class="kh-btns">' + (c.fileId ? '<button type="button" class="ghost-btn" data-kh="clsview" data-i="' + i + '">👁 이 파일 보기</button>' : '') + (cl.확인조치fileId ? '<button type="button" class="ghost-btn" data-kh="clsfollow">📋 확인조치사항 보기</button>' : '') + '</div></div>';
    });
    html += '<div class="kh-btns"><button type="button" class="ghost-btn" data-kh="clsrun" style="font-size:12px; padding:2px 9px;">🔄 지금 다시 검사(0원)</button></div></div></details>';

    // ② 판정 요약 + 파일별 판정
    var t = (r && r.totals) || {};
    html += '<details class="kh-sec" id="khSecJudge"><summary>🔎 지침·템플릿 정비 판정 — '
      + (r ? (r.ran ? '수정 필요 ' + (t['수정 필요'] || 0) + (t.급함 != null ? '(먼저 고칠 것 ' + t.급함 + ')' : '') + ' · 폐기 후보 ' + (t['폐기 후보'] || 0) + ' · 현행 ' + (t['현행'] || 0) : '⚠ 판정 안 됨') : '아직 판정 전') + '</summary><div class="kh-in">';
    if (r) html += '<div class="kh-note">' + esc_(r.at) + ' 판정' + (r.secs != null ? '(' + r.secs + '초)' : '') + ' · 매일 밤 규칙으로(0원). ' + esc_(r.auditNote || '') + '</div>';
    if (r && !r.ran) html += '<div class="kh-warn">⚠ ' + esc_(r.reason || '이유 모름') + '</div>';
    ((r && r.warn) || []).forEach(function(w){ html += '<div class="kh-warn">⚠ ' + esc_(w) + '</div>'; });
    html += '<div class="kh-filter">';
    ['수정 필요', '폐기 후보', '현행', '전체'].forEach(function(f){ html += '<button type="button" class="ghost-btn' + (kh_.filter === f ? ' on' : '') + '" data-kh="filter" data-f="' + f + '" style="font-size:12px; padding:2px 9px;">' + f + '</button>'; });
    html += '<button type="button" class="ghost-btn" data-kh="run" style="font-size:12px; padding:2px 9px;">🔄 지금 다시 판정(0원)</button></div>';
    var files = ((r && r.files) || []).filter(function(f){ return kh_.filter === '전체' || f.status === kh_.filter; });
    if (r && r.ran && !files.length) html += '<div class="kh-note">해당하는 파일이 없습니다.</div>';
    files.forEach(function(f){
      var idx = r.files.indexOf(f);
      html += '<div class="kh-row"><span class="kh-badge ' + (KH_ST_[f.status] || '') + '">' + esc_(f.status) + '</span>' + (f.status === '수정 필요' && f.priority >= 2 ? '<span class="kh-badge kh-del">' + (f.priority >= 3 ? '급함' : '고칠 것') + '</span>' : '') + '<span class="kh-t">' + esc_(f.kind) + ' · ' + esc_(String(f.name).replace(/\.(md|txt)$/i, '')) + '</span>'
        + (f.tags && f.tags.length ? ' <span class="kh-m">(' + esc_(f.tags.join(' · ')) + ')</span>' : '')
        + '<div class="kh-m">고친 날 ' + esc_(String(f.modified || '').slice(0, 10)) + ' · ' + (f.kind === '지침' ? '읽힘 ' : '쓰임 ') + Number(f.uses && f.uses.n || 0) + '회' + (f.uses && f.uses.last ? '(마지막 ' + esc_(f.uses.last) + ')' : '') + '</div>';
      if (f.reasons && f.reasons.length) html += '<ul>' + f.reasons.map(function(x){ return '<li>' + (x.type === '폐기' ? '🗑 ' : x.type === '수정' ? '✏ ' : x.type === '보완' ? '🔍 ' : 'ℹ ') + esc_(x.why) + (x.detail && x.detail.length && x.type === '수정' && /자기점검/.test(x.why) ? '<div class="kh-m">' + x.detail.map(esc_).join('<br>') + '</div>' : '') + '</li>'; }).join('') + '</ul>';
      if (f.fileId) html += '<div class="kh-btns"><button type="button" class="ghost-btn" data-kh="viewfile" data-i="' + idx + '">👁 보기</button><button type="button" class="ghost-btn" data-kh="editfile" data-i="' + idx + '">✏ 작성관리에서 편집</button></div>';
      html += '</div>';
    });
    html += '</div></details>';

    // ③ 업무별 보유 현황
    var cov = (r && r.coverage) || [];
    var gaps = cov.filter(function(c){ return c.빈칸 && c.빈칸.length; }).length;
    html += '<details class="kh-sec" id="khSecCov"><summary>📊 업무별 지침·템플릿 보유 현황' + (cov.length ? ' — 빈칸 있는 업무 ' + gaps + '/' + cov.length : '') + '</summary><div class="kh-in">'
      + '<div class="kh-note">빨간 글씨(빈칸)가 다음 작성 대상입니다. 사건 수는 작업관리 전체(괄호는 최근 6개월). 매주 루틴이 사건 많은 빈칸부터 초안을 만듭니다.</div>';
    if ((r && r.newNeeded || []).length) html += '<div class="kh-row"><span class="kh-badge kh-new">다음 작성 대상</span><ul>' + r.newNeeded.slice(0, 12).map(function(n){ return '<li>' + esc_(n.업무) + ' — ' + esc_((n.빈칸 || []).join(', ')) + '</li>'; }).join('') + '</ul></div>';
    if (cov.length) {
      html += '<div class="kh-cov">';
      cov.forEach(function(c){
        html += '<div class="kh-cov-k">' + esc_(c.업무) + '<div class="kh-m">사건 ' + c.사건수 + '(' + c.최근사건 + ')</div>' + (c.상태 ? '<span class="kh-badge ' + (KH_ST_[c.상태] || '') + '">' + esc_(c.상태) + '</span>' : '') + '</div><div>'
          + '<div>📘 지침: ' + (c.지침.length ? c.지침.length + '개' + (c.핵심지침 && c.핵심지침.length ? ' — 이끄는 지침 ' + esc_(c.핵심지침.join(', ')) : '') + (c.지침.length > (c.핵심지침 || []).length ? ' <details style="display:inline;"><summary style="display:inline; cursor:pointer; color:var(--gold); font-size:11.5px;">목록</summary><div class="kh-m">' + esc_(c.지침.join(', ')) + '</div></details>' : '') : '<span class="kh-gap">없음</span>') + '</div>'
          + '<div>📝 의뢰서: ' + (c.업무유형 === '상담' ? '<span class="kh-m">상담은 폴더·의뢰서 없음</span>' : c.의뢰서 ? esc_(c.의뢰서) : '<span class="kh-gap">없음</span>') + '</div>'
          + '<div>📄 보고서: ' + (c.보고서.length ? esc_(c.보고서.join(', ')) : (c.업무유형 === '상담' ? '<span class="kh-m">해당 없음</span>' : '<span class="kh-gap">없음</span>')) + '</div>'
          + (c.마지막정비 ? '<div class="kh-m">마지막 정비 ' + esc_(c.마지막정비) + '</div>' : '')
          + (c.빈칸.length ? '<div class="kh-gap">빈칸: ' + esc_(c.빈칸.join(' · ')) + '</div>' : '')
          + '</div>';
      });
      html += '</div>';
    } else html += '<div class="kh-note">아직 판정 결과가 없습니다 — 🔄 지금 다시 판정을 눌러 주세요.</div>';
    html += '</div></details>';
    // 열림 상태 유지
    var openIds = {}; ['khSecPend', 'khSecLaw', 'khSecCls', 'khSecJudge', 'khSecCov'].forEach(function(id){ var e = document.getElementById(id); if (e) openIds[id] = e.open; });
    box.innerHTML = html;
    Object.keys(openIds).forEach(function(id){ var e = document.getElementById(id); if (e) e.open = openIds[id]; });
  }

  function load_(force){
    var box = body_(); if (!box || kh_.loading) return;
    if (!force && kh_.loadedAt && Date.now() - kh_.loadedAt < 15000) return;
    kh_.loading = true;
    if (!kh_.status) box.innerHTML = '<div class="kh-note">📚 지침·템플릿 정비 불러오는 중…</div>';
    callGas('knh_status', {}).then(function(res){
      kh_.loading = false;
      if (!res || res.error){ box.innerHTML = '<div class="kh-warn">📚 지침·템플릿 정비를 불러오지 못했습니다: ' + esc_(res && res.error || '응답 없음') + '</div>'; return; }
      kh_.status = res; kh_.loadedAt = Date.now(); render_();
    }).catch(function(err){ kh_.loading = false; box.innerHTML = '<div class="kh-warn">📚 지침·템플릿 정비를 불러오지 못했습니다: ' + esc_(err && err.message || String(err)) + '</div>'; });
  }

  // ---------- 줄 단위 차이(LCS) ----------
  function diffHtml_(a, b){
    var A = String(a || '').replace(/\r\n/g, '\n').split('\n'), B = String(b || '').replace(/\r\n/g, '\n').split('\n');
    if (A.length * B.length > 4000000) return '<div class="kh-note" style="padding:10px;">파일이 너무 커서 차이를 계산하지 않았습니다 — 두 판을 각각 보세요.</div>';
    var n = A.length, m = B.length, L = [], i, j;
    for (i = 0; i <= n; i++) { L.push(new Uint16Array(m + 1)); }
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    var out = [], same = [], adds = 0, dels = 0;
    var flushSame = function(){ if (same.length > 6) { out.push('<span class="s">' + esc_(same.slice(0, 2).join('\n')) + '</span>', '<span class="s">… 같은 줄 ' + (same.length - 4) + '개 …</span>', '<span class="s">' + esc_(same.slice(-2).join('\n')) + '</span>'); } else if (same.length) out.push('<span class="s">' + esc_(same.join('\n')) + '</span>'); same = []; };
    i = 0; j = 0;
    while (i < n || j < m) {
      if (i < n && j < m && A[i] === B[j]) { same.push(A[i]); i++; j++; }
      else if (i < n && (j >= m || L[i + 1][j] >= L[i][j + 1])) { flushSame(); out.push('<span class="d">- ' + esc_(A[i]) + '</span>'); dels++; i++; }
      else { flushSame(); out.push('<span class="a">+ ' + esc_(B[j]) + '</span>'); adds++; j++; }
    }
    flushSame();
    return '<div class="kh-note" style="border:none;">더한 줄 ' + adds + ' · 뺀 줄 ' + dels + '</div><div class="kh-diff">' + out.join('') + '</div>';
  }

  function mdInto_(el, text){
    el.innerHTML = '';
    var md = document.createElement('div'); el.appendChild(md);
    if (typeof nxMdRender === 'function') nxMdRender(md, text || '', { theme: 'advisory', rich: true, outline: false, extraClass: 'nx-md-view' });
    else md.innerHTML = '<pre style="white-space:pre-wrap; padding:14px;">' + esc_(text || '') + '</pre>';
  }

  // ---------- 제안 보기·결정 ----------
  function openProposal_(p){
    var old = document.getElementById('khViewOverlay'); if (old) old.remove();
    var ov = document.createElement('div'); ov.id = 'khViewOverlay'; ov.className = 'modal-overlay';
    ov.innerHTML = '<div class="modal-panel kh-view-panel"><div class="modal-head"><span>' + esc_(p.작업 + ' 제안 — ' + p.종류 + ' · ' + String(p.대상).replace(/\.(md|txt)$/i, '')) + '</span><span class="modal-close" data-khv="close" title="닫기">✕</span></div>'
      + '<div class="kh-view-note" id="khVNote">불러오는 중…</div><div class="kh-view-bar" id="khVBar"></div><div class="kh-view-body" id="khVBody"></div></div>';
    document.body.appendChild(ov);
    var detail = null, tab = '';
    function close(){ document.removeEventListener('keydown', onKey); ov.remove(); }
    function onKey(e){ if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', onKey);
    function show(which){
      tab = which;
      var bodyEl = document.getElementById('khVBody'); if (!bodyEl || !detail) return;
      Array.prototype.forEach.call(document.querySelectorAll('#khVBar .kh-tab'), function(b){ b.classList.toggle('on', b.getAttribute('data-t') === which); });
      if (which === 'prop') mdInto_(bodyEl, detail.propText);
      else if (which === 'cur') mdInto_(bodyEl, detail.curText);
      else bodyEl.innerHTML = diffHtml_(detail.curText, detail.propText);
    }
    function bar(){
      var d = detail, isDel = d.작업 === '폐기', h = '';
      if (!isDel) h += '<button type="button" class="ghost-btn kh-tab" data-t="prop">📄 제안 초안</button>';
      if (d.curExists && !isDel) h += '<button type="button" class="ghost-btn kh-tab" data-t="diff">± 지금 파일과 차이</button>';
      if (d.curExists) h += '<button type="button" class="ghost-btn kh-tab" data-t="cur">📘 지금 파일</button>';
      h += '<span style="flex:1 1 20px;"></span>';
      if (isDel) h += '<button type="button" class="save-btn" data-khv="retire">✅ 폐기(「_폐기」로 옮김)</button><button type="button" class="ghost-btn" data-khv="keep">✖ 유지</button>';
      else h += '<button type="button" class="save-btn" data-khv="adopt">✅ 채택</button>' + (d.fileId ? '<button type="button" class="ghost-btn" data-khv="edit">✏ 작성관리에서 고쳐서 채택</button>' : '') + '<button type="button" class="ghost-btn" data-khv="reject">✖ 반려</button>';
      document.getElementById('khVBar').innerHTML = h;
      var note = esc_(d.이유 || '') + (d.baseChanged ? ' <b style="color:var(--danger);">⚠ 이 초안을 만든 뒤 지금 파일이 바뀌었습니다 — 차이를 꼭 보고 채택하세요(채택하면 지금 파일이 초안으로 바뀌고 지금 판은 「_이전판」에).</b>' : '')
        + (d.propMissing ? ' <b style="color:var(--danger);">⚠ 제안 파일을 찾지 못했습니다.</b>' : '')
        + (!isDel ? (d.curExists ? ' · 채택하면 지금 파일을 이 초안으로 바꾸고, 지금 판은 같은 폴더 「_이전판」에 둡니다.' : ' · 채택하면 새 파일로 만들어 바로 쓰입니다.') : ' · 지우지 않고 같은 폴더 「_폐기」로 옮깁니다(드라이브에서 다시 옮기면 되살아남).');
      document.getElementById('khVNote').innerHTML = note;
      show(isDel ? 'cur' : (d.curExists ? 'diff' : 'prop'));
    }
    function decide(decision, extra){
      var go = function(reason){
        callGas('knh_decide', Object.assign({ id: p.id, decision: decision, reason: reason || '' }, extra || {})).then(function(res){
          if (!res || res.error){ toast_('처리하지 못했습니다: ' + (res && res.error || '응답 없음')); return; }
          toast_(res.message || '처리했습니다.');
          try { localStorage.removeItem('khEdited_' + p.id); } catch (e) {}
          close(); load_(true); if (window.nxKnhDashLoad_) window.nxKnhDashLoad_(); if (window.nxSysAdminReload_) window.nxSysAdminReload_();
        }).catch(function(err){ toast_('처리하지 못했습니다: ' + (err && err.message || String(err))); });
      };
      if (decision === 'reject' || decision === 'keep') {
        nxPrompt_((decision === 'reject' ? '반려 사유' : '유지하는 이유') + '를 한 줄 적어 주세요 — 다음 주 루틴이 읽고 같은 제안을 되풀이하지 않습니다.', '', decision === 'reject' ? '✖ 반려' : '✖ 유지').then(function(v){ if (v && v.trim()) go(v.trim()); else if (v !== null) toast_('사유를 적어야 합니다.'); });
      } else {
        nxConfirm_(decision === 'retire' ? '「' + p.대상 + '」을 「_폐기」 폴더로 옮길까요? 지우지는 않습니다.' : '이 초안을 채택할까요? 바로 실제 ' + p.종류 + '(으)로 쓰입니다.', decision === 'retire' ? '✅ 폐기' : '✅ 채택').then(function(ok){ if (ok) go(''); });
      }
    }
    ov.addEventListener('click', function(e){
      if (e.target === ov) { close(); return; }
      var t = e.target.closest('.kh-tab'); if (t) { show(t.getAttribute('data-t')); return; }
      var b = e.target.closest('[data-khv]'); if (!b) return;
      var a = b.getAttribute('data-khv');
      if (a === 'close') close();
      else if (a === 'adopt') { var edited = false; try { edited = !!localStorage.getItem('khEdited_' + p.id); } catch (er) {} decide('adopt', { edited: edited }); }
      else if (a === 'reject' || a === 'retire' || a === 'keep') decide(a);
      else if (a === 'edit') {
        if (typeof goToReportWriter_ !== 'function') { toast_('작성관리 화면을 찾지 못했습니다.'); return; }
        try { localStorage.setItem('khEdited_' + p.id, '1'); } catch (er) {}
        close();
        goToReportWriter_('', { fileId: detail.fileId, noDocTypeAsk: true });
        toast_('제안 초안을 열었습니다 — 고쳐 💾 저장한 뒤 설정 🧭 📚 제안 대기에서 ✅ 채택을 누르세요.');
      }
    });
    callGas('knh_proposal', { id: p.id }).then(function(res){
      if (!res || res.error){ document.getElementById('khVNote').innerHTML = '<span style="color:var(--danger);">불러오지 못했습니다: ' + esc_(res && res.error || '응답 없음') + '</span>'; return; }
      detail = res.proposal; bar();
    }).catch(function(err){ var n = document.getElementById('khVNote'); if (n) n.textContent = '불러오지 못했습니다: ' + (err && err.message || err); });
  }

  function viewFile_(f){
    var old = document.getElementById('khViewOverlay'); if (old) old.remove();
    var ov = document.createElement('div'); ov.id = 'khViewOverlay'; ov.className = 'modal-overlay';
    ov.innerHTML = '<div class="modal-panel kh-view-panel"><div class="modal-head"><span>' + esc_(f.kind + ' · ' + f.name) + '</span><span class="modal-close" data-khv="close">✕</span></div><div class="kh-view-body" id="khVBody"><div class="kh-note" style="padding:14px;">불러오는 중…</div></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if (e.target === ov || (e.target.closest('[data-khv]'))) ov.remove(); });
    callGas('readFile', { fileId: f.fileId }).then(function(res){ var b = document.getElementById('khVBody'); if (!b) return; if (!res || res.error) { b.innerHTML = '<div class="kh-warn" style="padding:14px;">읽지 못했습니다: ' + esc_(res && res.error || '응답 없음') + '</div>'; return; } mdInto_(b, res.content); });
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('#stKnhBody [data-kh]'); if (!b) return;
    var a = b.getAttribute('data-kh'), st = kh_.status || {};
    if (a === 'open') openProposal_((st.pending || [])[Number(b.getAttribute('data-i'))]);
    else if (a === 'filter') { kh_.filter = b.getAttribute('data-f'); render_(); }
    else if (a === 'law') {
      var v = (st.개정 || [])[Number(b.getAttribute('data-i'))], to = b.getAttribute('data-v'); if (!v) return;
      window.nxKnhLawConfirm_(v, to).then(function(ok){ if (ok) load_(true); });
    }
    else if (a === 'clsview') { var c = ((st.분류 || {}).후보 || [])[Number(b.getAttribute('data-i'))]; if (c) viewFile_({ kind: c.종류 === '지침' ? '지침' : '절세 아이템', name: c.파일, fileId: c.fileId }); }
    else if (a === 'clsfollow') { var cf = st.분류 || {}; if (cf.확인조치fileId) viewFile_({ kind: '0 NETAX', name: cf.확인조치파일 || '확인조치사항', fileId: cf.확인조치fileId }); }
    else if (a === 'clsrun') {
      b.disabled = true; b.textContent = '검사 중…(1분 안)';
      callGas('knh_cls_run', {}).then(function(res){ if (res && res.error) toast_('검사하지 못했습니다: ' + res.error); load_(true); }).catch(function(err){ toast_('검사하지 못했습니다: ' + (err && err.message || err)); load_(true); });
    }
    else if (a === 'run') {
      b.disabled = true; b.textContent = '판정 중…(1~2분)';
      callGas('knh_run', {}).then(function(res){ if (res && res.error) toast_('판정하지 못했습니다: ' + res.error); load_(true); }).catch(function(err){ toast_('판정하지 못했습니다: ' + (err && err.message || err)); load_(true); });
    } else {
      var f = st.result && st.result.files && st.result.files[Number(b.getAttribute('data-i'))]; if (!f) return;
      if (a === 'viewfile') viewFile_(f);
      else if (a === 'editfile' && typeof goToReportWriter_ === 'function') goToReportWriter_('', { fileId: f.fileId, noDocTypeAsk: true });
    }
  });

  // [2026.10.22] 개정 확인 결론 기록 — 이 화면과 절세플랜 📚 아이템의 ⚠ 상자가 같이 쓴다(KnowHow.js knh_law_confirm)
  window.nxKnhLawConfirm_ = function(v, to){
    var label = v.법령 + ' §' + v.jo + '(' + v.시행일 + (v.구분 === '시행예정' ? ' 시행 예정' : ' 시행') + ')';
    var ask = to === '' ? nxConfirm_(label + ' 확인 기록을 지울까요? 다시 "확인 전"으로 돌아갑니다.', '기록 지우기').then(function(ok){ return ok ? '' : null; })
      : nxPrompt_(label + ' — "실질 변경 ' + to + '"으로 기록합니다. 무엇을 대조했는지 한 줄 적어 주세요' + (to === '없음' ? '(예: 다른 법 개정으로 법률 이름만 바뀜 — 법제처 시행일판 원문 대조)' : '(예: 세율 구간이 바뀜 — 반영 필요)') + '.', '', '기록');
    return ask.then(function(memo){
      if (memo === null || memo === undefined) return false;
      if (to && !String(memo).trim()) { toast_('무엇을 대조했는지 한 줄 적어야 기록됩니다.'); return false; }
      return callGas('knh_law_confirm', { key: v.key, jo: v.jo, 시행일: v.시행일, 결론: to, 메모: String(memo || '').trim() }).then(function(res){
        if (!res || res.error){ toast_('기록하지 못했습니다: ' + (res && res.error || '응답 없음')); return false; }
        toast_(res.message || '기록했습니다.'); return true;
      });
    }).catch(function(err){ toast_('기록하지 못했습니다: ' + (err && err.message || err)); return false; });
  };

  // 설정 화면이 열릴 때마다(15초 안에 다시 열면 그대로) 새로 받는다
  function watch_(){
    var v = document.getElementById('view-settings'); if (!v) return;
    var check = function(){ if (v.classList.contains('active')) load_(false); };
    new MutationObserver(check).observe(v, { attributes: true, attributeFilter: ['class'] });
    check();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch_); else watch_();

  // ---------- 대시보드 한 줄(📋 확인조치사항·🛠 개선요구 카드와 같은 모양) ----------
  window.nxKnhDashLoad_ = function(){
    var sum = document.getElementById('dashKnhSum'); if (!sum) return;
    callGas('knh_summary', {}).then(function(r){
      if (!r || r.error) { sum.textContent = '불러오지 못했습니다' + (r && r.error ? ': ' + r.error : ''); return; }
      var t = r.last && r.last.totals, parts = [];
      parts.push(r.pending ? '🔔 ' + r.pending + '건 대기' : '대기 없음');
      if (t) parts.push('수정 필요 ' + (t['수정 필요'] || 0) + ' · 폐기 후보 ' + (t['폐기 후보'] || 0) + ' · 빈칸 ' + (t.신규필요 || 0));
      else if (r.last && !r.last.ran) parts.push('⚠ 판정 안 됨');
      sum.textContent = parts.join(' · ');
    }).catch(function(e){ sum.textContent = '오류: ' + (e && e.message ? e.message : e); });
  };
  document.addEventListener('click', function(e){
    var h = e.target.closest && e.target.closest('#dashKnhHead'); if (!h) return;
    if (typeof goToView_ === 'function') goToView_('settings');
    setTimeout(function(){ var b = body_(); if (b) { var p = document.getElementById('khSecPend'); if (p) p.open = true; b.scrollIntoView({ block: 'start', behavior: 'smooth' }); } }, 300);
  });
})();
</script>
