<div class="view" id="view-ledger">
  <div class="view-head"><h2>사실(장부)</h2></div>
  <div class="tb-row" style="display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:1px solid var(--line); flex:0 0 auto; background:var(--panel);">
    <select id="lgCaseSelect"><option value="">사건 선택</option></select>
  </div>
  <div style="flex:1 1 auto; overflow-y:auto; padding:10px 14px;">
    <div id="lgEmpty" class="explorer-status">사건을 아직 고르지 않았습니다 — 위쪽 사건 칸에서 고르거나 <button type="button" class="ghost-btn sm" onclick="showView('workmanage')">사건 목록에서 고르기</button></div>
    <div id="lgWrap" style="display:none;">
      <!-- [2026.10.31] 아래 본문(lgBody)을 바꿔 보여 주는 하위 탭이라 공통 하위 탭 모양(.nx-tab), 앞 아이콘 없음 -->
      <div id="lgToolTabs" class="nx-tabbar" style="margin:0;">
        <button type="button" id="chLedgerBtn" class="nx-tab" title="사건의 모든 사실을 한 장부에 — 칸마다 값·주인(세무사님/넥스/서류)·상태(확정/추정/물어볼 것/증빙 받을 것/보류). 여기서 바로 값을 넣고, 물어볼 것에 답하고, 장부로 세액을 계산합니다 — 넥스가 쓰는 것과 같은 장부">장부</button>
        <button type="button" id="chGasStatusBtn" class="nx-tab" title="세액계산 칸마다 값과 출처(서류·답·추정)를 표로">반영 현황표</button>
        <button type="button" id="chGasFactsBtn" class="nx-tab" title="서류에서 모은 사람·자산·계약·돈 흐름·시간 순서·법령 점검을 표로(보기만, 기록 안 남음)">판단 재료</button>
        <button type="button" id="chGasFixBtn" class="nx-tab" title="이미 정해진 세액계산 입력 칸(과세대상 구분·필요경비·사건분류 등)의 값을 고치거나 되돌리고, 고친 기록을 봅니다 — 넥스가 쓰는 것과 같은 도구">칸 고치기</button>
      </div>
      <div id="lgBody" style="margin-top:10px;"></div>
    </div>
  </div>
</div>
<script>
  // [2026.10.31 처리개요 도구 정리 — 세무사님 "나안으로 가자"·"권장안대로 고치라고"] 사건 장부를 처리개요 "GAS 도구" 칸에서 메뉴의 한 화면으로 옮겼다
  //  (세무사님 "처리개요는 말 그대로 개요잖아 요약이잖아"). 반영 현황표·판단 재료·칸 값 고치기도 이 화면 안으로. 장부 코드는 처리개요에 있던 그대로(같은 서버 입구 — 넥스도 같은 장부)
  var lgSelectedId = '';
  var lgCases_ = [];
  function lgTokOk_(){ try { return !!sessionStorage.getItem('nxManageSessionToken'); } catch (e) { return false; } }
  function initLedger(){
    var sel = document.getElementById('lgCaseSelect');
    if (!sel) return Promise.resolve();
    if (!sel.dataset.inited){
      sel.dataset.inited = '1';
      sel.addEventListener('change', function(){ lgOpen_(sel.value); });
      // [2026.10.31] 세무사님 "이사건다른화면 콤보가 있는데, 처리개요버튼이 있는 것은 기능중복" / "사건콤보와 굳이 떼어 놓을 필요가 없어 보인다" — ↩ 처리개요 단추를 빼고 "↪ 이 사건 다른 화면"(처리개요 포함)을 사건 고르는 칸 바로 뒤에
      if (typeof nxCaseJumpAttach_ === 'function') nxCaseJumpAttach_(sel, 'ledger', function(){ return lgSelectedId; });
    }
    if (!lgTokOk_()) return Promise.resolve();
    return callGas('work_get_cases', {}).then(function(res){
      lgCases_ = (res && res.cases) || [];
      sel.innerHTML = buildCaseOptionsHtml_(lgCases_);
      if (lgSelectedId) sel.value = lgSelectedId;
    }).catch(function(){});
  }
  // 다른 화면(처리개요 [📒 장부 열기]·옆 패널·↪ 이 사건 다른 화면·세액계산 칸 채우기 상자)에서 그 사건을 고른 채 연다
  function goToLedger_(caseId, opts){
    if (typeof goToView_ === 'function') goToView_('ledger');
    Promise.resolve(initLedger()).then(function(){
      var sel = document.getElementById('lgCaseSelect'); if (sel) sel.value = caseId || '';
      lgOpen_(caseId, opts);
    });
  }
  function lgOpen_(caseId, opts){
    lgSelectedId = caseId || '';
    var wrap = document.getElementById('lgWrap'), empty = document.getElementById('lgEmpty');
    if (!caseId){ wrap.style.display = 'none'; empty.style.display = ''; return; }
    var c = lgCases_.filter(function(x){ return x.id === caseId; })[0] || { id: caseId };
    try { if (typeof nxLastCaseId_ !== 'undefined') nxLastCaseId_ = caseId; } catch (e) {}
    empty.style.display = 'none'; wrap.style.display = '';
    // 단추에 붙은 옛 리스너를 버리려고 단추를 새것으로 바꾼다(사건을 바꿔 고를 때마다 한 번만 붙게)
    ['chLedgerBtn', 'chGasStatusBtn', 'chGasFactsBtn', 'chGasFixBtn'].forEach(function(id){ var b = document.getElementById(id); if (b){ var nb = b.cloneNode(true); b.parentNode.replaceChild(nb, b); } });
    var body = document.getElementById('lgBody'); body.innerHTML = '';
    lgBindTools_(c, body);
    // 장부를 고치면 위 📒 사건 장부 띠(처리개요·세액계산과 같은 수)를 다시 읽는다
    window.chGasReloadNow_ = function(){ if (typeof window.nxLedgerStripRefresh_ === 'function') window.nxLedgerStripRefresh_(caseId); };
    window.chGasReloadNow_(); // 장부 화면을 열 때도 띠를 새로 — 아래 장부 본문과 같은 때의 수
    // 지금 보는 탭 남색 칠 — 묶음(lgToolTabs)은 바뀌지 않으니 리스너는 한 번만
    var tabsEl = document.getElementById('lgToolTabs');
    if (tabsEl && !tabsEl._nxBound){ tabsEl._nxBound = true; tabsEl.addEventListener('click', function(e){ var t = e.target.closest('.nx-tab'); if (!t) return; Array.prototype.forEach.call(tabsEl.querySelectorAll('.nx-tab'), function(b){ b.classList.toggle('active', b === t); }); }); }
    var first = (opts && opts.tab) || 'chLedgerBtn';
    var fb = document.getElementById(first); if (fb) fb.click();
  }
  function lgBindTools_(c, body){
    var tokOk = lgTokOk_;
    var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(ch){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]; }); };
    // ── 아래는 처리개요 GAS 도구 칸에 있던 코드 그대로(반영 현황표·사건 장부·칸 값 고치기) ──
    document.getElementById('chGasStatusBtn').addEventListener('click', function(){
      if (!tokOk()) return;
      body.innerHTML = '<div class="log-empty">반영 현황표 만드는 중…</div>';
      callGas('case_proc', { caseId: c.id, step: 'status', by: '세무사님' }).then(function(r){
        if (!r || r.error || !Array.isArray(r.rows)){ body.innerHTML = '<div class="log-empty">현황표를 만들지 못했습니다: ' + esc((r && r.error) || '응답 없음') + '</div>'; return; }
        body.innerHTML = '<div style="overflow-x:auto;"><table class="ch-gas-table" style="border-collapse:collapse; font-size:12.5px; white-space:nowrap;"><tr><th style="text-align:left;padding:3px 8px;">구분</th><th style="text-align:left;padding:3px 8px;">항목</th><th style="text-align:left;padding:3px 8px;">상태</th><th style="text-align:left;padding:3px 8px;">값·출처</th></tr>' +
          r.rows.map(function(x){ return '<tr>' + x.slice(0, 4).map(function(v, i){ return '<td style="padding:3px 8px; border-top:1px solid var(--line);' + (i === 3 ? ' max-width:420px; overflow-x:auto;' : '') + '" title="' + esc(v) + '">' + esc(v) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>';
      }).catch(function(e){ body.innerHTML = '<div class="log-empty">현황표를 만들지 못했습니다: ' + esc(e && e.message || e) + '</div>'; });
    });
    // [2026.10.27 10-27 A] 칸 값 고치기 — 넥스 카드(caseproc_fix)·지휘 넥스(value_set target)와 같은 서버 입구(case_proc valueFix·valueUndo). 세무사님 원문 "ai는 내가 직접 작업하는 것을 완전히 대행할 수 있어야 한다" — 그 반대도: 넥스가 쓰는 도구는 여기서 세무사님도 누른다
    // [2026.10.28] 📒 사건 장부 — 사실의 유일한 저장소(서버 CaseLedger.js, case_proc step ledger*). 넥스(채팅·지휘)와 세무사님이 같은 장부에 적는다.
    //  세무사님 원문: "확보할 수 있는 정보를 최대한 확보하고, 확보된 정보를 최대한 활용해서 사건처리를 하자는 것이고, 부족한 정보는 물어보거나 확보할 증빙으로 분류하자는 거 아닌가? 확인되지 않은 정보중에 추정치나 가정치를 넣어서 진행할 수도 있고"
    document.getElementById('chLedgerBtn').addEventListener('click', function(){
      if (!tokOk()) return;
      body.innerHTML = '<div class="log-empty">사건 장부를 읽는 중…</div>';
      var reload = function(){ document.getElementById('chLedgerBtn').click(); if (typeof window.chGasReloadNow_ === 'function') window.chGasReloadNow_(); };
      var call = function(payload, okMsg){ return callGas('case_proc', Object.assign({ caseId: c.id, by: '세무사님' }, payload)).then(function(res){ if (!res || res.error || res.ok === false){ showToast((res && (res.error || res.message)) || '하지 못했습니다.', 'error'); return null; } showToast(res.message || okMsg || '했습니다.', 'success'); return res; }).catch(function(e){ showToast('오류: ' + nxErrText_(e), 'error'); return null; }); };
      var STATE_KO = { 물어볼것: '❓ 물어볼 것', 증빙받을것: '📎 증빙 받을 것', 추정: '≈ 추정', 확정: '✅ 확정', 보류: '⏸ 보류', 무시: '— 무시' };
      var KIND_KO = { 세무사님: '세무사님', 넥스: '넥스', 서류: '서류', 규칙: '규칙', 추정: '추정', 계산: '계산' };
      var PATHS = [['seller.name', '양도인 성명'], ['seller.regNo', '양도인 주민등록번호'], ['seller.address', '양도인 주소'], ['seller.multiHouseCount', '보유 주택 수'], ['c0.date', '양도일'], ['c0.totalPrice', '양도가액'], ['c0.transferCause', '양도 원인(sale 매매 · expropriation 수용 · exchange 교환)'], ['c0.buyer.name', '양수인 성명'], ['c0.buyer.regNo', '양수인 주민등록번호'], ['c0.buyer.relation', '양수인 관계(none 없음 · sibling 형제자매 · lineal 직계 · spouse 배우자 · relative 친족)'], ['a0.assetLocation', '소재지'], ['a0.assetKind', '자산 종류(land 토지 · building 건물 · land_building 토지+건물)'], ['a0.assetType', '과세대상 구분(house 주택 · other 그 외 · presale_right 분양권)'], ['a0.acquisitionDate', '취득일'], ['a0.acquisitionPrice', '취득가액'], ['costs', '필요경비(예: 취득세 3,583,600원, 중개수수료 2,090,000원 — 서버가 항목으로 풂)'], ['taxfee', '신고 세무비용'], ['사건분류', '사건분류'], ['기준일', '기준일(양도일)']];
      callGas('case_proc', { caseId: c.id, step: 'ledger' }).then(function(r){
        if (!r || r.error || !r.ok){ body.innerHTML = '<div class="log-empty">장부를 읽지 못했습니다: ' + esc((r && r.error) || '응답 없음') + '</div>'; return; }
        var rows = r.줄 || [], sum = r.요약 || {};
        var h = '<div style="font-size:12.5px;">';
        // [2026.11.01] 장부 요약 두 겹 — 맨 위 머리줄 장부 띠와 같은 셈을 여기서 또 보여 줘 겹쳤다. 여기엔 단추만 두고, 줄 수·마지막 때는 「칸 장부」 탭 현황 줄로 옮긴다
        h += '<div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">'
          + '<button type="button" id="chLgCalc" class="ghost-btn" title="장부의 확정·추정 줄로 세액계산기를 돌려 사건에 저장합니다. 물어볼 것이 남아도 막지 않고, 빈 칸과 추정은 결과에 적습니다">장부로 세액계산</button>'
          + (!(sum.전체) ? '<button type="button" id="chLgImport" class="ghost-btn" title="옛 사건처리 결정 파일(정한 값·남은 질문)을 장부로 한 번 옮깁니다">옛 기록 옮겨오기</button>' : '') + '</div>';
        var cell = function(t, w, extra){ return '<td style="padding:3px 8px; border-top:1px solid var(--line); max-width:' + w + 'px; overflow-x:auto; white-space:nowrap;' + (extra || '') + '" title="' + esc(t) + '">' + esc(t) + '</td>'; };
        // [2026.10.29] 사건 장부의 바탕 — ① 폴더 파일에서 모은 사실 ② 서류끼리 맞대기 ③ 계산기 칸으로 간 길 ④ 칸 장부(값·질문). 세무사님 원문(10-29):
        //  "사건장부를 대체 얼마나 잘 만들고 얼마나 잘 업데이트하고 장부내 정보를 얼마나 입체적으로 비교검토매치시켜서 유용한 정보로 확보하여 gas의 적재적소에 뿌려서 원하는 정보를 확보하고 사건을 처리해 나가는지 내가 확인할 수가 없다"
        var kb = r.바탕 || null, ks = (kb && kb.sum) || {}, kp = (kb && kb.prev) || null;
        var dl = function(k){ if (!kp) return ''; var a = kp[k] || 0, b = ks[k] || 0; return a === b ? '' : ' <span style="color:var(--sub);">(전 ' + esc(a) + ')</span>'; };
        var nSt = function(prefix, re){ var n = 0; Object.keys(ks).forEach(function(k){ if (k.indexOf(prefix) === 0 && re.test(k.slice(prefix.length))) n += ks[k] || 0; }); return n; };
        var th = function(cols){ return '<tr>' + cols.map(function(c0){ return '<th style="text-align:left;padding:2px 8px; white-space:nowrap;">' + esc(c0) + '</th>'; }).join('') + '</tr>'; };
        var tbl = function(head, body0){ return '<div style="overflow-x:auto;"><table style="border-collapse:collapse; font-size:12px; white-space:nowrap; margin-top:3px;">' + th(head) + body0 + '</table></div>'; };
        // [2026.10.29 계획서 5단계] 사건 흐름 — 세무사님 원문(10-29) "사건접수후 의뢰서 등의 정보로 부터 사건개요를 파악하여 처리방향과 확보대상 증빙을 확보해 나가게 되고,
        //  증빙을 확보해 나가면서 사건장부에 정보를 모으는 과정이 일방통행이 아니라 수시로 피드백이 되면서" — 무엇이 어디서 와서 무엇을 바꿨는지 한 줄로
        var fl = r.흐름 || null, fb0 = (fl && fl.띠) || {};
        // [2026.11.01] 세무사님 "장부아래 탭명에 현황까지 붙여놓아서 너-무 길다" — 탭엔 이름과 손볼 것 숫자(있을 때만)만, 현황 전체는 탭 줄 밑 한 줄(지금 탭)·말풍선으로
        var lgTb = function(key, name, n, detail){ return '<button type="button" class="nx-tab" data-lg-tab="' + key + '" data-lg-detail="' + esc(detail) + '" title="' + esc(name + ' — ' + detail) + '">' + esc(name) + (n ? ' <span class="nx-n warn">' + esc(n) + '</span>' : '') + '</button>'; };
        h += '<div style="margin-top:8px; padding:6px 8px; border:1px solid var(--line); border-radius:6px;">'
          + '<div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;"><b>장부가 한 일</b><span style="color:var(--sub);">' + (kb && kb.at ? '서류 사실 모은 때 ' + esc(kb.at) + (kb.prevAt ? ' · 그 전 ' + esc(kb.prevAt) : '') : '아직 서류 사실을 모은 적이 없습니다 — 「이 사건 처리하자」(개요)를 돌리거나 오른쪽 단추를 누르세요') + ' · 칸과 서류 사실은 한 장부(사건 폴더에 파일이 들어오거나 바뀌면 그때 바로 다시 모음)</span>'
          + '<button type="button" id="chLgKbBuild" class="ghost-btn" title="칸 값은 건드리지 않고, 사건 폴더 서류를 다시 훑어 파일 장부·서류 사실·서류끼리 맞대기를 지금 서류로 다시 만듭니다(계산기 칸으로 간 길은 다음 개요 때 갱신)">서류 사실 다시 모으기</button></div>'
          + '<div class="nx-tabbar sub" style="margin:6px 0 0;">'

          busy(estB, true); call({ step: 'ledgerEstimate' }).then(function(res){ busy(estB, false); if (!res) return; showTool('📝 추정으로 넣기', res, [res.message].concat((res.skipped || []).length ? ['이미 정해져 둔 칸: ' + res.skipped.join(', ')] : [])); setTimeout(reload, 1200); });
        });
        // [2026.11.01] 세목마다 가정 칸 목록 — 양도는 장부 칸, 증여·상속은 계산기 입력 이름(넥스 do=calc over와 같음)
        var LG_OVER = { transfer: null, gift: [['giftAmount', '증여재산가액'], ['relation', '관계(배우자·직계존속·직계비속·기타친족·기타)'], ['giftDate', '증여일'], ['priorGiftAmount', '10년 안 앞선 증여액'], ['debtAssumedAmount', '인수 채무'], ['appraisalFeeAmount', '감정평가수수료']],
          inheritance: [['taxableEstateAmount', '상속 과세가액'], ['hasSpouse', '배우자 있음(예·아니오)'], ['childCount', '자녀 수'], ['netFinancialAssets', '순금융재산'], ['funeralCostAmount', '장례비']] };
        var lgOvers = [], lgTaxSel = document.getElementById('chLgTax'), lgPathSel = document.getElementById('chLgOverPath'), lgPath0 = lgPathSel ? lgPathSel.innerHTML : '';
        var lgDrawOvers = function(){ var box = document.getElementById('chLgOvers'); if (!box) return; box.innerHTML = lgOvers.map(function(o, i){ return '<span class="ghost-btn sm" style="cursor:default;">' + esc(o.label) + ' = ' + esc(o.value) + ' <a href="#" data-lg-ovdel="' + i + '" title="이 가정을 뺍니다">✕</a></span>'; }).join('');
          Array.prototype.forEach.call(box.querySelectorAll('[data-lg-ovdel]'), function(a){ a.addEventListener('click', function(ev){ ev.preventDefault(); lgOvers.splice(Number(a.getAttribute('data-lg-ovdel')), 1); lgDrawOvers(); }); }); };
        if (lgTaxSel) lgTaxSel.addEventListener('change', function(){
          var t = lgTaxSel.value, L5 = LG_OVER[t];
          lgPathSel.innerHTML = L5 ? '<option value="">가정 없음</option>' + L5.map(function(p){ return '<option value="' + esc(p[0]) + '">' + esc(p[1]) + '</option>'; }).join('') : lgPath0;
          lgOvers = []; lgDrawOvers();
          var cb = document.getElementById('chLgChainBox'); if (cb) cb.style.display = t === 'inheritance' ? 'inline-flex' : 'none';
        });
        if (lgTaxSel) lgTaxSel.dispatchEvent(new Event('change')); // 처음 고른 세목(주 세목)의 가정 칸 목록으로 맞춘다 — 증여 사건에 양도 칸이 뜨지 않게
        var lgAddOne = function(){ var op = lgPathSel.value, ov = (document.getElementById('chLgOverVal').value || '').trim(); if (!op) return true; if (!ov){ showToast('가정 값을 적어 주세요.', 'warning'); return false; }
          lgOvers = lgOvers.filter(function(o){ return o.path !== op; }).concat([{ path: op, value: ov, label: lgPathSel.options[lgPathSel.selectedIndex].textContent }]); lgPathSel.value = ''; document.getElementById('chLgOverVal').value = ''; lgDrawOvers(); return true; };
        var addOv = document.getElementById('chLgAddOver'); if (addOv) addOv.addEventListener('click', function(){ lgAddOne(); });
        var tryB = document.getElementById('chLgTry'); if (tryB) tryB.addEventListener('click', function(){
          var nm = (document.getElementById('chLgCaseName').value || '').trim();
          if (!lgAddOne()) return;
          var tx = lgTaxSel ? lgTaxSel.value : '', p5 = { step: 'ledgerCalc', name: nm, over: lgOvers.map(function(o){ return { path: o.path, value: o.value }; }) };
          if (tx) p5.tax = tx;
          var chs = document.getElementById('chLgChain');
          if (tx === 'inheritance' && chs && chs.value){ p5.chainFrom = [chs.value]; p5.chainHeir = !!document.getElementById('chLgChainHeir').checked; var shv = (document.getElementById('chLgChainShare').value || '').replace(/[^\d]/g, ''); if (shv) p5.chainShare = Number(shv); }
          busy(tryB, true, '계산 중…'); if (tOut) tOut.innerHTML = '<div class="log-empty">시험 계산 중…</div>';
          call(p5).then(function(res){
            lgOvers = []; lgDrawOvers();
            busy(tryB, false, '계산');
            if (!res){ if (tOut) tOut.innerHTML = ''; return; }
            showTool('🧮 ' + (res.이름 ? '경우(안) 「' + res.이름 + '」' : '시험 계산') + ' — 저장본 ' + (res.id || ''), res, (res.요약 || []).concat((res.gaps || []).length ? ['비어 있는 칸 ' + res.gaps.length + '개 — ④ 칸 장부에서 넣거나 추정으로'] : []));
            if (typeof window.chGasReloadNow_ === 'function') window.chGasReloadNow_();
          });
        });
        var cmpB = document.getElementById('chCmpGo'); if (cmpB) cmpB.addEventListener('click', function(){
          var rel = document.getElementById('chCmpRel').value, gAmt = (document.getElementById('chCmpGiftAmt').value || '').replace(/[^\d]/g, ''), iAmt = (document.getElementById('chCmpInhAmt').value || '').replace(/[^\d]/g, '');
          var p = { step: 'ledgerCompare' };
          if (rel) { p.gift = { relation: rel }; if (gAmt) p.gift.giftAmount = Number(gAmt); }
          if (iAmt) p.inheritance = { taxableEstateAmount: Number(iAmt), hasSpouse: !!document.getElementById('chCmpSpouse').checked, childCount: Number(document.getElementById('chCmpKids').value) || 0 };
          busy(cmpB, true, '비교 중…'); if (tOut) tOut.innerHTML = '<div class="log-empty">세목 비교 중…</div>';
          callGas('case_proc', Object.assign({ caseId: c.id, by: '세무사님' }, p)).then(function(res){
            busy(cmpB, false, '⚖ 비교');
            if (!res || res.error && !(res.비교 || []).length){ showToast((res && res.error) || '비교하지 못했습니다.', 'error'); if (tOut) tOut.innerHTML = ''; return; }
            showToast(res.message || '비교했습니다.', 'success');
            if (tOut) tOut.innerHTML = '<div><div class="nx-l4" style="margin:6px 0 3px;">세목 비교</div>' + tbl(['세목', '납부세액', '전제', '저장본'], (res.비교 || []).map(function(x){ return '<tr>' + cell(x.세목, 90) + cell(Number(x.납부세액 || 0).toLocaleString('ko-KR') + '원', 140, ' font-weight:600;') + cell(x.전제 || '', 380, ' color:var(--sub);') + cell(x.저장본 || '', 160, ' color:var(--sub);') + '</tr>'; }).join('')) + ((res.못함 || []).length ? '<div style="margin:4px 0 0 8px; color:#b23;">못 한 것: ' + res.못함.map(esc).join(' / ') + '</div>' : '') + '</div>';
            if (typeof window.chGasReloadNow_ === 'function') window.chGasReloadNow_();
          }).catch(function(e){ busy(cmpB, false, '⚖ 비교'); showToast('오류: ' + nxErrText_(e), 'error'); });
        });
      }).catch(function(e){ body.innerHTML = '<div class="log-empty">장부를 읽지 못했습니다: ' + esc(e && e.message || e) + '</div>'; });
    });
    document.getElementById('chGasFixBtn').addEventListener('click', function(){
      if (!tokOk()) return;
      body.innerHTML = '<div class="log-empty">정한 값·고침 기록을 읽는 중…</div>';
      var FIX_TARGETS = [['calc:a0.assetType', '과세대상 구분(house=주택 / other=그 외 / presale_right=분양권)'], ['expenses', '필요경비(항목 여러 개: "취득세 3,583,600원, 법무사수수료 385,000원")'], ['trTaxFee', '신고 세무비용(원)'], ['ov:사건분류', '사건분류(1세대1주택 비과세 / 2주택 중과 / 비사업용 토지(중과) / 일반 …)'], ['calc:c0.totalPrice', '양도가액(원)'], ['calc:a0.acquisitionPrice', '취득가액(원)'], ['calc:a0.acquisitionDate', '취득일(yyyy-mm-dd)'], ['calc:a0.assetLocation', '소재지'], ['calc:seller.name', '양도인 성명'], ['calc:c0.buyer.relation', '양수인 관계'], ['base', '기준일(양도일·증여일·상속개시일, yyyy-mm-dd)']];
      callGas('case_proc', { caseId: c.id, step: 'fixView' }).then(function(r){
        if (!r || r.error || !r.ok){ body.innerHTML = '<div class="log-empty">정한 값을 읽지 못했습니다: ' + esc((r && r.error) || '응답 없음') + '</div>'; return; }
        var vals = r.정한값 || [], hist = r.고침기록 || [];
        var opts = FIX_TARGETS.map(function(t){ return '<option value="' + esc(t[0]) + '">' + esc(t[1]) + '</option>'; }).join('');
        // [2026.10.27 I] 화면 글은 한국어 칸 이름(서버 이름), 코드 이름은 title로만
        vals.forEach(function(v){ if (!FIX_TARGETS.some(function(t){ return t[0] === v.칸; })) opts += '<option value="' + esc(v.칸) + '" title="' + esc(v.칸) + '">' + esc(v.이름 || v.칸) + ' (지금 ' + esc(String(v.값).slice(0, 30)) + ')</option>'; });
        var h = '<div style="font-size:12.5px;">';
        h += '<div><b>지금 정해진 값</b>' + (vals.length ? '<table style="border-collapse:collapse; font-size:12px; white-space:nowrap; margin-top:4px;"><tr><th style="text-align:left;padding:2px 8px;">칸</th><th style="text-align:left;padding:2px 8px;">값</th><th style="text-align:left;padding:2px 8px;">누가</th><th style="text-align:left;padding:2px 8px;">출처·때</th><th></th></tr>'
          + vals.map(function(v){ return '<tr><td style="padding:2px 8px; border-top:1px solid var(--line);" title="' + esc(v.칸) + '">' + esc(v.이름 || v.칸) + '</td><td style="padding:2px 8px; border-top:1px solid var(--line); max-width:260px; overflow-x:auto;" title="' + esc(v.값) + '">' + esc(v.값) + '</td><td style="padding:2px 8px; border-top:1px solid var(--line);">' + esc(v.누가) + '</td><td style="padding:2px 8px; border-top:1px solid var(--line); max-width:260px; overflow-x:auto;" title="' + esc(v.출처) + '">' + esc(v.출처) + ' ' + esc(v.때) + '</td><td style="padding:2px 4px; border-top:1px solid var(--line);"><button type="button" class="ghost-btn sm" data-fix-pick="' + esc(v.칸) + '">고치기</button></td></tr>'; }).join('') + '</table>' : ' <span style="color:var(--sub);">아직 정한 값이 없습니다(서류 읽기·칸 채우기를 먼저)</span>') + '</div>';
        h += '<div style="margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;"><select title="고칠 칸" id="chFixTarget">' + opts + '</select><input title="새 값" id="chFixValue" type="text" placeholder="새 값" style="min-width:220px;"><input title="이유" id="chFixWhy" type="text" placeholder="이유(선택)" style="min-width:180px;"><button type="button" class="save-btn" id="chFixGo">값 고치기</button></div>';
        h += '<div class="nx-help">고친 값은 사건 기록부에 "누가·언제·어느 칸·전 값 → 후 값"으로 남고, 그 칸이 걸린 남은 질문은 닫힙니다. 고친 뒤 세액계산을 다시 하면 새 값으로 계산됩니다.</div>';
        h += '<div style="margin-top:8px;"><b class="nx-l3" style="display:inline-block; margin:6px 6px 4px 0;">고침 기록</b>' + (hist.length ? hist.slice().reverse().map(function(x){ var pv = x.prev && x.prev.v != null ? (typeof x.prev.v === 'object' ? JSON.stringify(x.prev.v) : String(x.prev.v)) : '(비어 있음)'; var nv = x.next ? (typeof x.next.v === 'object' ? JSON.stringify(x.next.v) : String(x.next.v)) : ''; return '<div style="margin:3px 0 0 8px;" title="' + esc(x.target) + '">· ' + esc(x.at) + ' ' + esc(x.by) + ' 「' + esc(x.label || x.target) + '」 ' + esc(pv.slice(0, 60)) + ' → ' + esc(nv.slice(0, 60)) + (x.why ? ' (' + esc(x.why) + ')' : '') + (x.undone ? ' <span style="color:var(--sub);">되돌림 ' + esc(x.undone) + '</span>' : ' <button type="button" class="ghost-btn sm" data-fix-undo="' + esc(x.target) + '">되돌리기</button>') + '</div>'; }).join('') : ' <span style="color:var(--sub);">없음</span>') + '</div>';
        if ((r.안 || []).length) h += '<div style="margin-top:8px;"><b class="nx-l3" style="display:inline-block; margin:6px 6px 4px 0;">경우(안) 계산 저장본</b>' + r.안.map(function(s){ return '<div style="margin:3px 0 0 8px;">· ' + esc(s.이름) + ' — ' + esc(s.세목 || '') + ' ' + (s.최종세액 != null ? Number(s.최종세액).toLocaleString('ko-KR') + '원' : '') + ' (' + esc(s.누가 || '') + ' ' + esc(s.때 || '') + ', 저장본 ' + esc(s.id) + ')</div>'; }).join('') + '<div style="color:var(--sub); font-size:11.5px; margin-left:8px;">세액계산 화면에서 입력을 바꿔 계산한 뒤 [📑 안으로 저장]을 누르면 여기 쌓입니다.</div></div>';
        h += '</div>';
        body.innerHTML = h;
        var sel = document.getElementById('chFixTarget'), val = document.getElementById('chFixValue'), why = document.getElementById('chFixWhy');
        Array.prototype.forEach.call(body.querySelectorAll('button[data-fix-pick]'), function(b){ b.addEventListener('click', function(){ var k = b.getAttribute('data-fix-pick'); if (!Array.prototype.some.call(sel.options, function(o){ return o.value === k; })){ var o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o); } sel.value = k; val.focus(); }); });
        var reload = function(){ document.getElementById('chGasFixBtn').click(); if (typeof window.chGasReloadNow_ === 'function') window.chGasReloadNow_(); };
        document.getElementById('chFixGo').addEventListener('click', function(){
          var target = sel.value, v = val.value.trim();
          if (!v){ showToast('새 값을 적어 주세요.', 'warning'); return; }
          // 필요경비를 말로 적으면("취득세 3,583,600원, 법무사수수료 385,000원") 서버가 항목(이름·금액)으로 풀어 넣고, 못 풀면 빈 값으로 저장하지 않고 거절한다
          document.getElementById('chFixGo').disabled = true;
          callGas('case_proc', { caseId: c.id, step: 'valueFix', target: target, value: v, why: why.value.trim(), by: '세무사님' }).then(function(res){
            if (!res || res.error || res.ok === false){ showToast((res && (res.error || res.message)) || '고치지 못했습니다.', 'error'); document.getElementById('chFixGo').disabled = false; return; }
            showToast(res.message || '고쳤습니다.', 'success'); reload();
          }).catch(function(e){ showToast('고치는 중 오류: ' + nxErrText_(e), 'error'); document.getElementById('chFixGo').disabled = false; });
        });
        Array.prototype.forEach.call(body.querySelectorAll('button[data-fix-undo]'), function(b){ b.addEventListener('click', function(){
          b.disabled = true;
          callGas('case_proc', { caseId: c.id, step: 'valueUndo', target: b.getAttribute('data-fix-undo'), by: '세무사님' }).then(function(res){
            if (!res || res.error || res.ok === false){ showToast((res && (res.error || res.message)) || '되돌리지 못했습니다.', 'error'); b.disabled = false; return; }
            showToast(res.message || '되돌렸습니다.', 'success'); reload();
          }).catch(function(e){ showToast('되돌리는 중 오류: ' + nxErrText_(e), 'error'); b.disabled = false; });
        }); });
      }).catch(function(e){ body.innerHTML = '<div class="log-empty">정한 값을 읽지 못했습니다: ' + esc(e && e.message || e) + '</div>'; });
    });

    // 🔎 판단 재료 — [2026.10.31] 날것 글 덩어리 대신 표로(보기만 — 서버는 기록부에 줄을 남기지 않는다)
    document.getElementById('chGasFactsBtn').addEventListener('click', function(){
      if (!tokOk()) return;
      body.innerHTML = '<div class="log-empty">서류에서 모은 판단 재료를 정리하는 중…</div>';
      callGas('case_proc', { caseId: c.id, step: 'facts' }).then(function(r){
        if (!r || r.error || !r.재료){ body.innerHTML = '<div class="log-empty">판단 재료를 만들지 못했습니다: ' + esc((r && r.error) || '응답 없음') + '</div>'; return; }
        var flat = function(x){ return JSON.stringify(x).replace(/[{}"\[\]]/g, ''); };
        var cell = function(v){ if (v == null) return ''; if (typeof v !== 'object') return String(v); if (Array.isArray(v)) return v.map(function(x){ return typeof x === 'object' ? flat(x) : String(x); }).join(' / '); return Object.keys(v).map(function(k){ var s = v[k]; return k + ': ' + (s && typeof s === 'object' ? flat(s) : String(s)); }).join(' · '); };
        var td = function(v){ var s = cell(v); if (s.length > 300) s = s.slice(0, 300) + '…'; return '<td style="padding:3px 8px; border-top:1px solid var(--line); max-width:420px; overflow-x:auto;" title="' + esc(s) + '">' + esc(s) + '</td>'; };
        var th = function(s){ return '<th style="text-align:left; padding:3px 8px;">' + esc(s) + '</th>'; };
        var listTable = function(name, arr){
          var cap = name ? '<div style="font-size:12px; color:var(--sub); margin:6px 0 2px;">' + esc(name) + ' ' + arr.length + '건</div>' : '';
          if (!arr.length) return cap;
          if (arr.every(function(x){ return x && typeof x === 'object' && !Array.isArray(x); })){
            var cols = []; arr.forEach(function(x){ Object.keys(x).forEach(function(k){ if (cols.indexOf(k) === -1) cols.push(k); }); });
            return cap + '<div style="overflow-x:auto;"><table style="border-collapse:collapse; font-size:12.5px; white-space:nowrap;"><tr>' + cols.map(th).join('') + '</tr>' + arr.slice(0, 80).map(function(x){ return '<tr>' + cols.map(function(k){ return td(x[k]); }).join('') + '</tr>'; }).join('') + '</table></div>';
          }
          return cap + '<div style="font-size:12.5px;">' + arr.slice(0, 80).map(function(x){ return '· ' + esc(cell(x)); }).join('<br>') + '</div>';
        };
        // 목록(배열)을 품은 칸은 그 목록을 표로, 나머지 칸은 이름·값 두 칸 표로
        var tbl = function(v){
          if (v == null) return '<div class="log-empty">없음</div>';
          if (typeof v !== 'object') return '<div style="font-size:12.5px;">' + esc(v) + '</div>';
          if (Array.isArray(v)) return listTable('', v);
          var out = '', kv = [];
          Object.keys(v).forEach(function(k){ if (Array.isArray(v[k])) out += listTable(k, v[k]); else kv.push(k); });
          if (kv.length) out = '<div style="overflow-x:auto;"><table style="border-collapse:collapse; font-size:12.5px; white-space:nowrap;">' + kv.map(function(k){ return '<tr>' + th(k) + td(v[k]) + '</tr>'; }).join('') + '</table></div>' + out;
          return out || '<div class="log-empty">없음</div>';
        };
        body.innerHTML = Object.keys(r.재료).map(function(k, i){ return '<details style="margin:6px 0;"' + (i === 0 ? ' open' : '') + '><summary style="cursor:pointer;"><b>' + esc(k) + '</b></summary><div style="margin:4px 0 0 12px;">' + tbl(r.재료[k]) + '</div></details>'; }).join('') + '<div style="font-size:11.5px; color:var(--sub); margin-top:4px;">서류에서 GAS가 모은 재료입니다 — 판단은 넥스·세무사님 몫. 보기만 해서 사건 기록부에 줄이 생기지 않습니다.</div>';
      }).catch(function(e){ body.innerHTML = '<div class="log-empty">판단 재료를 만들지 못했습니다: ' + esc(e && e.message || e) + '</div>'; });
    });
  }
</script>
