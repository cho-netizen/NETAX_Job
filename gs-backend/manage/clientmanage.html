<div class="view" id="view-clientmanage">
  <div class="editor-toolbar">
    <h2 class="tb-title">고객</h2>
    <button type="button" id="btnClientNew" class="save-btn">+ 새 고객</button>
    <input type="text" id="clientSearchInput" class="nx-find" placeholder="고객 찾기" title="이름으로 찾기">
    <label class="nx-test-toggle" data-nx-testtoggle="client" hidden title="이름이 「가상」으로 시작하는 시험 자료를 보입니다"><input type="checkbox"> 시험 자료 <span class="nx-test-n"></span></label>
  </div>
  <div class="manage-split">
    <div class="manage-split-list" id="clientSplitList"><div id="clientList" class="log-list"></div></div>
    <div class="manage-split-detail" id="clientDetailCol">
      <div id="clientDetail"><div class="explorer-status">왼쪽에서 고객을 선택하거나 "+ 새 고객"을 눌러주세요.</div></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="clientQuickViewOverlay" style="display:none;">
  <div class="modal-panel" style="max-width:640px;">
    <div class="modal-head">
      <span>👤 고객정보 빠른보기</span>
      <span class="modal-close" id="btnCloseClientQuickView" title="닫기">✕</span>
    </div>
    <div class="modal-body" id="clientQuickViewMount"><div id="clientQuickViewDetail"></div></div>
  </div>
</div>

<script>
  // ============================================================
  // 고객관리 — client-manage.js 이식본. work-manage.js와 마찬가지로 로직은 그대로,
  // 새창/탐색창 전환 코드만 이 앱의 메뉴 라우팅에 맞게 걷어냈다.
  // ============================================================
  var clientList = document.getElementById('clientList');
  var clientDetail = document.getElementById('clientDetail');
  var clientSearchInput = document.getElementById('clientSearchInput');
  var clientNameOptions = document.getElementById('clientNameOptions');

  var clients = [];
  var selectedClientId = null;
  var clientShowingNewForm = false;
  var clientManageLoaded = false;
  // 메인 패널(왼쪽 목록에서 선택한 고객)의 "마지막으로 저장된 상태" 기준선. loadClients()는
  // 빠른보기 저장/삭제 등 메인 패널과 무관한 이유로도 수시로 호출되는데, 그때마다 메인 패널을
  // 서버 최신값으로 무조건 다시 그리면 지금 메인 패널에 입력 중인(아직 저장 안 한) 내용이
  // 조용히 사라진다 — 이 기준선과 현재 입력값이 다르면(=저장 안 한 수정이 있으면) 그 무조건
  // 재렌더링을 건너뛴다.
  var clientMainPanelBaseline_ = null;

  var CLIENT_TIER_OPTIONS_ = ['로얄', '우수', '보통', '영세'];

  function formatPhoneInput_(raw){
    var digits = String(raw || '').replace(/\D/g, '').slice(0, 11);
    if (digits.length < 4) return digits;
    if (digits.length < 8) return digits.slice(0, 3) + '-' + digits.slice(3);
    if (digits.indexOf('02') === 0){
      if (digits.length <= 9) return digits.slice(0, 2) + '-' + digits.slice(2, 5) + '-' + digits.slice(5);
      return digits.slice(0, 2) + '-' + digits.slice(2, 6) + '-' + digits.slice(6, 10);
    }
    if (digits.length <= 10) return digits.slice(0, 3) + '-' + digits.slice(3, 6) + '-' + digits.slice(6);
    return digits.slice(0, 3) + '-' + digits.slice(3, 7) + '-' + digits.slice(7, 11);
  }

  function initClientManage(){
    if (clientManageLoaded) return;
    clientManageLoaded = true;
    loadClients();
  }

  function loadClientsQuiet_(){ updateClientNameOptions_(); }

  // [2026.11.03 전수조사 다시] 화면 먼저 반영 도우미 — 보낸 칸으로 목록 줄을 만들고(주민번호 글자는 목록에 안 둠), 목록·상세를 바로 다시 그린다
  function ccLocalRow_(p, extra){
    var row = {}; ['id', '성명', '전화번호', '구분', '주소', '메모', '추가연락처'].forEach(function(k){ if (p[k] !== undefined) row[k] = p[k]; });
    row.수정일 = new Date().toISOString().slice(0, 10);
    return Object.assign(row, extra || {});
  }
  function ccLocalUpsert_(row, isNew){
    var i = -1; clients.forEach(function(x, k){ if (x.id === row.id) i = k; });
    if (i >= 0) clients[i] = Object.assign({}, clients[i], row); else { clients.unshift(Object.assign({}, row)); i = 0; }
    renderClientList(); updateClientNameOptions_();
    if (selectedClientId === row.id){
      var mainHasUnsavedEdits_ = !isNew && clientMainPanelBaseline_ !== null && clientDetail.querySelector('#ccEditName') && quickViewCurrentSignature_(clientDetail) !== clientMainPanelBaseline_;
      if (!mainHasUnsavedEdits_) renderClientDetail(clients[i]);
    }
  }
  function ccLocalDrop_(id){
    clients = clients.filter(function(x){ return x.id !== id; });
    renderClientList(); updateClientNameOptions_();
    if (selectedClientId === id){ selectedClientId = null; clientDetail.innerHTML = '<div class="explorer-status">고객 등록이 서버에 닿지 않았습니다 — 화면 아래 「다시 보내기」를 눌러 주세요.</div>'; }
  }

  function loadClients(){
    clientList.innerHTML = '<div class="log-empty">불러오는 중…</div>';
    callGas('client_get_clients', { search: clientSearchInput ? clientSearchInput.value.trim() : '' }).then(function(res){
      if (res.error || res.success === false){
        clientList.innerHTML = '<div class="log-empty">' + escapeHtml(res.error || res.message || '불러오지 못했습니다.') + '</div>';
        return;
      }
      // [2026.09.16 버그수정] "고객관리 탭이 안 뜬다"는 반복 지적 — 원인을 못 찾은 채 이전에
      // 한 번 고친 걸로는 재현이 안 됐다. 렌더링 단계(아래)에서 실제로 무슨 예외가 나는지
      // 화면에 그대로 보이게 해서, 다음에 또 재현되면 바로 원인을 알 수 있게 한다(예전엔 이
      // try/catch가 없어서, 여기서 뭐가 터지든 바깥 .catch()가 "불러오지 못했습니다"로
      // 뭉개버려 원인을 알 방법이 없었다).
      try {
        clients = res.clients || [];
        renderClientList();
        updateClientNameOptions_();
        // [2026.09 리팩터] 빠른보기 모달은 이제 #clientDetail을 옮겨 쓰지 않고 완전히 별도인
        // #clientQuickViewDetail에 그린다 — 그래서 여기서 메인 패널을 다시 그려도 모달 내용에는
        // 전혀 영향이 없다. inQuickView 분기 자체가 더 이상 필요 없다.
        if (selectedClientId){
          var still = clients.filter(function(c){ return c.id === selectedClientId; })[0];
          if (still){
            // [2026.09 버그수정] 실사용 시뮬레이션 중 발견 — 빠른보기에서 저장/삭제해도 이
            // loadClients()가 불려서, 메인 패널에 입력 중이던(저장 안 한) 내용이 그때마다
            // 서버 최신값으로 덮어써져 사라졌다. 메인 패널에 저장 안 한 수정이 있으면 이번
            // 재렌더링은 건너뛴다(왼쪽 목록 텍스트만 최신화되고, 메인 패널 입력값은 보존됨).
            var mainHasUnsavedEdits_ = clientMainPanelBaseline_ !== null && clientDetail.querySelector('#ccEditName') && quickViewCurrentSignature_(clientDetail) !== clientMainPanelBaseline_;
            if (!mainHasUnsavedEdits_) renderClientDetail(still);
            return;
          }
        }
        if (!clientShowingNewForm && clientDetail){
          clientDetail.innerHTML = '<div class="explorer-status">왼쪽에서 고객을 선택하거나 "+ 새 고객"을 눌러주세요.</div>';
        }
      } catch (renderErr) {
        clientList.innerHTML = '<div class="log-empty">화면을 그리는 중 오류: ' + escapeHtml(renderErr && renderErr.message ? renderErr.message : String(renderErr)) + '</div>';
      }
    }).catch(function(err){
      clientList.innerHTML = '<div class="log-empty">불러오지 못했습니다' + (err && err.message ? (': ' + escapeHtml(err.message)) : '') + '</div>';
    });
  }

  function updateClientNameOptions_(){
    if (!clientNameOptions) return;
    var p = (clientSearchInput && clientSearchInput.value.trim()) ? callGas('client_get_clients', {}) : Promise.resolve({ clients: clients });
    p.then(function(res){
      var all = res.clients || [];
      // [2026.09.18 버그수정] "수금내역에서 고객이 가나다순으로 뜨지 않는다" — 원래 순서 그대로
      // (시트 행 순서, 대개 등록순) 자동완성 목록에 넣어서, 이름을 알아도 찾기 어려웠다.
      all = all.slice().sort(function(a, b){ return String(a.성명 || '').localeCompare(String(b.성명 || ''), 'ko', { numeric: true }); });
      clientNameOptions.innerHTML = '';
      all.forEach(function(c){
        if (!c.성명) return;
        var opt = document.createElement('option');
        opt.value = c.성명;
        clientNameOptions.appendChild(opt);
      });
    }).catch(function(){});
  }

  function renderClientList(){
    clientList.innerHTML = '';
    if (!clients.length){
      clientList.innerHTML = '<div class="log-empty">등록된 고객이 없습니다.</div>';
      return;
    }
    // [2026.11.01] 가나다·숫자 순(가상2 < 가상10), 시험 자료는 기본으로 숨김(nxIsTestName_)
    var showTest = typeof nxShowTest_ === 'function' ? nxShowTest_() : true;
    var testN = clients.filter(function(c){ return typeof nxIsTestName_ === 'function' && nxIsTestName_(c.성명); }).length;
    if (typeof nxTestToggleSync_ === 'function') nxTestToggleSync_('client', testN);
    var shownList = clients.filter(function(c){ return showTest || !nxIsTestName_(c.성명); });
    if (!shownList.length){ clientList.innerHTML = '<div class="log-empty">시험 자료만 있습니다 — 위 「시험 자료」를 체크하면 보입니다.</div>'; return; }
    shownList.sort(function(a, b){ return String(a.성명 || '').localeCompare(String(b.성명 || ''), 'ko', { numeric: true }); }).forEach(function(c){
      var row = document.createElement('div');
      row.className = 'log-entry';
      row.style.cursor = 'pointer';
      row.title = (c.성명 || '') + (c.전화번호 ? ' · ' + c.전화번호 : '') + ' · ' + (c.구분 || '보통'); // 좁은 명단에서 잘린 글은 마우스를 올리면 다 보임
      if (c.id === selectedClientId) row.classList.add('on');
      // [2026.09.16 버그수정] "관리화면 취지에 맞게 이름·전화번호·분류가 모두 한 줄에 표시되게
      // 하라" — 구분(로얄/우수/보통/영세)이 줄바꿈되어 아래줄에 따로 나오던 것을 한 줄로 합친다.
      // [2026.11.01 화면 정비] 세무사님 "깔끔·가독성, 낭비되는 공간 없이" — 한 줄을 낮추고, 구분은 보통이 아닐 때만 색 꼬리표로(줄마다 되풀이되던 「· 보통」 뺌), 전화는 오른쪽 옅게
      var tierCol = { 로얄: '#a07a1c', 우수: '#0D1B3D', 영세: '#7a8396' }[c.구분] || '';
      row.innerHTML =
        '<div class="log-text" style="display:flex; align-items:center; gap:6px; min-width:0;"><b style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + escapeHtml(c.성명 || '') + '</b>' +
        (tierCol ? '<span style="font-size:11px; font-weight:700; color:' + tierCol + '; border:1px solid ' + tierCol + '; border-radius:8px; padding:0 6px; line-height:16px;">' + escapeHtml(c.구분) + '</span>' : '') +
        (c.전화번호 ? '<span style="margin-left:auto; color:var(--sub); font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums;">' + escapeHtml(c.전화번호) + '</span>' : '') +
        '</div>';
      row.addEventListener('click', function(){ clientShowingNewForm = false; selectedClientId = c.id; renderClientList(); renderClientDetail(c); });
      clientList.appendChild(row);
    });
  }

  // [2026.09.16 재설계] 세무사님 지적 — "추가연락처를 전화번호만 입력하면 어떡하나, 이름도
  // 같이 입력해야 누구 건지 안다." 자유텍스트(쉼표구분 전화번호만) 대신 "+ 의뢰인 추가"
  // 버튼으로 이름+전화번호를 한 쌍씩 등록하는 목록형 UI로 바꾼다. 새 고객 등록/고객 상세
  // 양쪽에서 재사용한다 — id 접두사만 다르게 받아 같은 화면에 두 벌이 동시에 있어도 안 겹친다.
  function ccExtraContactsBlockHtml_(idPrefix){
    return '<div class="cc-extra-list" id="' + idPrefix + '-list" style="font-size:12.5px; margin-bottom:4px;"></div>' +
      '<div id="' + idPrefix + '-form" style="display:none; gap:6px; flex-wrap:wrap; margin-bottom:6px;"></div>' +
      '<button type="button" class="ghost-btn sm" id="' + idPrefix + '-addbtn">+ 의뢰인</button>';
  }
  // 반환한 listEl에 ._contacts로 현재 목록이 계속 유지된다 — 저장 시 이걸 그대로 읽어 보낸다.
  // [주의] 메인 패널(#clientDetail)과 빠른보기(#clientQuickViewDetail)가 같은 id 접두사로
  // 동시에 열려있을 수 있어(위 renderClientDetail의 container 인자와 같은 이유), 반드시
  // container 범위 안에서만 찾는다 — 전역 document.getElementById를 쓰면 두 패널이 동시에
  // 열렸을 때 엉뚱한 패널의 엘리먼트를 잡을 수 있다.
  function ccWireExtraContacts_(idPrefix, initialContacts, container){
    container = container || document;
    var listEl = container.querySelector('#' + idPrefix + '-list');
    var formEl = container.querySelector('#' + idPrefix + '-form');
    var addBtn = container.querySelector('#' + idPrefix + '-addbtn');
    listEl._contacts = (initialContacts || []).slice();

    function renderList(){
      if (!listEl._contacts.length){ listEl.innerHTML = '<span style="color:var(--sub);">등록된 의뢰인이 없습니다.</span>'; return; }
      listEl.innerHTML = listEl._contacts.map(function(p, i){
        return '<div style="display:flex; align-items:center; gap:6px; padding:2px 0;">' +
          '<span>' + escapeHtml(p.이름 || '(이름없음)') + ' · ' + escapeHtml(p.전화번호) + '</span>' +
          '<span class="cc-extra-del" data-idx="' + i + '" style="cursor:pointer; color:var(--sub);" title="삭제">✕</span>' +
          '</div>';
      }).join('');
      listEl.querySelectorAll('.cc-extra-del').forEach(function(el){
        el.addEventListener('click', function(){
          listEl._contacts.splice(Number(el.getAttribute('data-idx')), 1);
          renderList();
        });
      });
    }
    renderList();

    addBtn.addEventListener('click', function(){
      formEl.style.display = 'flex';
      formEl.innerHTML =
        '<input title="이름" type="text" class="cc-extra-name" placeholder="이름" size="5" style="font-size:12px;">' +
        '<input title="전화번호" type="text" class="cc-extra-phone" placeholder="전화번호" size="13" style="font-size:12px;">' +
        '<button type="button" class="save-btn cc-extra-confirm sm">추가</button>' +
        '<button type="button" class="ghost-btn cc-extra-cancel sm">취소</button>';
      formEl.querySelector('.cc-extra-phone').addEventListener('input', function(e){ e.target.value = formatPhoneInput_(e.target.value); });
      formEl.querySelector('.cc-extra-cancel').addEventListener('click', function(){ formEl.style.display = 'none'; formEl.innerHTML = ''; });
      formEl.querySelector('.cc-extra-confirm').addEventListener('click', function(){
        var name = formEl.querySelector('.cc-extra-name').value.trim();
        var phone = formEl.querySelector('.cc-extra-phone').value.trim();
        if (!name){ showToast('이름을 입력해주세요.', 'warning'); return; }
        if (!phone){ showToast('전화번호를 입력해주세요.', 'warning'); return; }
        listEl._contacts.push({ 이름: name, 전화번호: phone });
        renderList();
        formEl.style.display = 'none';
        formEl.innerHTML = '';
      });
    });

    return listEl;
  }

  function renderNewClientForm(){
    clientShowingNewForm = true;
    selectedClientId = null;
    renderClientList();
    clientDetail.innerHTML =
      '<h3 style="margin-top:0;">새 고객 등록</h3>' +
      '<div style="display:flex; flex-direction:column; gap:8px; max-width:380px;">' +
      '<label>성명 *<br><input type="text" id="ccNewName" size="10" placeholder="고객 성명"></label>' +
      '<label>전화번호<br><input type="text" id="ccNewPhone" size="14" placeholder="(선택)"></label>' +
      '<label>추가 연락처(공동의뢰인·가족 — 현금영수증 자동연결에 쓰입니다)</label>' +
      ccExtraContactsBlockHtml_('ccNewExtra') +
      '<label>구분<br><select id="ccNewType">' + CLIENT_TIER_OPTIONS_.map(function(t){ return '<option value="' + t + '"' + (t === '보통' ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></label>' +
      '<label>주소<br><input type="text" id="ccNewAddr" size="14" placeholder="(선택)"></label>' +
      '<label>주민등록번호<br><input type="text" id="ccNewRrn" size="14" placeholder="(선택, 암호화되어 저장됩니다)"></label>' +
      '<label>메모<br><textarea id="ccNewMemo" style="width:100%; min-height:60px; font-family:inherit;" placeholder="(선택)"></textarea></label>' +
      '<div style="display:flex; gap:8px; margin-top:8px;">' +
      '<button type="button" id="ccNewSave" class="save-btn">저장</button>' +
      '<button type="button" id="ccNewCancel" class="ghost-btn">취소</button>' +
      '</div></div>';

    document.getElementById('ccNewPhone').addEventListener('input', function(e){ e.target.value = formatPhoneInput_(e.target.value); });
    var ccNewExtraList = ccWireExtraContacts_('ccNewExtra', []);

    document.getElementById('ccNewCancel').addEventListener('click', function(){
      clientShowingNewForm = false;
      clientDetail.innerHTML = '<div class="explorer-status">왼쪽에서 고객을 선택하거나 "+ 새 고객"을 눌러주세요.</div>';
    });
    document.getElementById('ccNewSave').addEventListener('click', function(){
      var 성명 = document.getElementById('ccNewName').value.trim();
      if (!성명){ showToast('성명을 입력해주세요.', 'warning'); return; }
      // [2026.11.04 큰일 ⑨ 같은 사람] 세무사님 "권장안대로"(큰일다섯_계획서_20261104 ⑨) — 이름이 같고 전화 끝 4자리가 같은 고객이
      //  이미 있으면 「이미 있는 ○○님인가요?」(그 고객 열기 / 그래도 새로). 생년월일은 주민번호를 목록에 싣지 않는 원칙(2026.09.19)
      //  때문에 화면에서 견줄 수 없어 쓰지 않는다. 전화를 비웠으면 같은 이름만으로 묻는다. 동명이인(전화 다름)은 그대로 새로 만든다.
      if (!this.dataset.sameOk){
        var last4 = function(s){ var d = String(s || '').replace(/\D/g, ''); return d.length >= 4 ? d.slice(-4) : ''; };
        var newTail = last4(document.getElementById('ccNewPhone').value);
        var nm = 성명.replace(/\s+/g, '');
        var same = clients.filter(function(c){
          if (String(c.성명 || '').replace(/\s+/g, '') !== nm) return false;
          if (!newTail) return true;
          var tails = [last4(c.전화번호)].concat((c.추가연락처 || []).map(function(x){ return last4(x && x.전화번호); }));
          return tails.indexOf(newTail) !== -1;
        });
        if (same.length){
          var box = document.getElementById('ccSameBox');
          if (!box){ box = document.createElement('div'); box.id = 'ccSameBox'; box.setAttribute('role', 'alertdialog'); box.style.cssText = 'border:1px solid var(--gold, #b8860b); border-radius:8px; padding:10px; margin-top:8px; display:flex; flex-direction:column; gap:6px;'; this.parentNode.parentNode.appendChild(box); }
          box.innerHTML = '<strong>이미 있는 ' + escapeHtml(성명) + '님인가요?</strong>' +
            '<div style="font-size:12.5px; color:var(--sub);">' + (newTail ? '이름과 전화 끝 4자리가 같은 고객이 있습니다.' : '전화번호를 비워 같은 이름 고객을 보여 드립니다.') + '</div>' +
            same.map(function(c){ return '<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;"><span>' + escapeHtml(c.성명 || '') + ' · ' + escapeHtml(c.전화번호 || '전화 없음') + (c.등록일 ? ' · 등록 ' + escapeHtml(c.등록일) : '') + '</span><button type="button" class="ghost-btn" data-open-same="' + escapeHtml(String(c.id)) + '">그 고객 열기</button></div>'; }).join('') +
            '<div><button type="button" class="ghost-btn" id="ccSameNew">그래도 새로 만들기</button></div>';
          var saveBtn = this;
          box.querySelectorAll('[data-open-same]').forEach(function(b){ b.addEventListener('click', function(){
            var c = clients.filter(function(x){ return String(x.id) === b.getAttribute('data-open-same'); })[0]; if (!c) return;
            clientShowingNewForm = false; selectedClientId = c.id; renderClientList(); renderClientDetail(c);
          }); });
          document.getElementById('ccSameNew').addEventListener('click', function(){ saveBtn.dataset.sameOk = '1'; saveBtn.click(); });
          box.scrollIntoView({ block: 'nearest' });
          return;
        }
      }
      // [2026.11.03 전수조사 다시] 세무사님 "답답해서 사용하지 못하는 일이 생기면 안된다" — 서버 답(3~5초)을 기다리지 않고
      //  번호를 화면이 정해 목록·상세에 바로 넣고, 서버엔 보낼 함으로 뒤에서 보낸다(같은 번호는 서버가 한 번만 만듦, 실패하면 화면 아래 붉은 띠)
      var newPayload = {
        id: nxNewId_(),
        성명: 성명, 전화번호: document.getElementById('ccNewPhone').value.trim(),
        추가연락처: ccNewExtraList._contacts,
        구분: document.getElementById('ccNewType').value.trim(),
        주소: document.getElementById('ccNewAddr').value.trim(),
        주민등록번호: document.getElementById('ccNewRrn').value.trim(),
        메모: document.getElementById('ccNewMemo').value.trim()
      };
      var newRow = ccLocalRow_(newPayload, { 등록일: new Date().toISOString().slice(0, 10), 주민번호등록됨: !!newPayload.주민등록번호 });
      nxSaveLater_('client_create_client', newPayload, { key: 'client_' + newPayload.id, label: 성명 + ' 고객 등록', patch: [{ list: 'clients', op: 'upsert', id: newPayload.id, row: newRow }],
        onFail: function(){ ccLocalDrop_(newPayload.id); }, redo: function(){ ccLocalUpsert_(newRow, false); } });
      showToast('고객을 등록했습니다.', 'success');
      clientShowingNewForm = false;
      selectedClientId = newPayload.id;
      ccLocalUpsert_(newRow, true);
    });
  }

  // [2026.09 리팩터] 실사용 시뮬레이션 도중, 빠른보기 모달에서 확인창을 눌러 "그래도 볼까요?"를
  // 선택하면 확인창이 뜨고도 결국 메인 화면의 저장 안 한 내용이 사라지는 것을 재확인했다 —
  // 경고만으로는 부족하고(미봉책), 애초에 메인 패널과 빠른보기 모달이 같은 DOM 노드(#clientDetail)를
  // 옮겨써서 공유하는 구조 자체가 원인이다. 그래서 이 함수가 그릴 대상 컨테이너를 인자로 받게
  // 바꾸고, 내부 조회도 전부 전역 document.getElementById 대신 그 컨테이너 안으로 한정해서
  // 찾도록(container.querySelector) 고쳤다 — 메인 패널(#clientDetail)과 빠른보기
  // (#clientQuickViewDetail)가 이제 완전히 독립된 DOM이라 한쪽 수정이 다른 쪽을 덮어쓸 방법이
  // 아예 없다.
  function renderClientDetail(c, container){
    container = container || clientDetail;
    container.innerHTML =
      // [2026.11.01 화면 정비] 세무사님 "정보·도구 유기적 배치" — 이름표 없이 칸만 늘어서 무엇이 무슨 칸인지 몰랐던 것을
      //  이름표 붙은 두 줄로(① 성명·구분 + 저장·문자·삭제 ② 전화·주소·주민번호), 추가 연락처는 그 아래. 칸 id는 그대로.
      // [2026.11.01 화면구조 개편 ④] 세무사님 "권장안대로 하마"(견본 ② 고객 한 사람 화면) — 넓으면 두 칸: 왼쪽 기본, 오른쪽 사건·흐름·돈. 칸 id·배선은 그대로
      '<div class="cc-board"><div class="cc-col"><div class="ch-col-h">기본</div>' +
      '<div class="nx-form-row" style="margin-top:0;">' +
      '<input type="text" id="ccEditName" placeholder="성명" value="' + escapeHtml(c.성명 || '') + '" size="' + Math.max(6, String(c.성명 || '').length + 2) + '" style="font-weight:700; font-size:15px;">' +
      '<span class="nx-fl">구분 <select id="ccEditType">' + CLIENT_TIER_OPTIONS_.map(function(t){ return '<option value="' + t + '"' + (t === (c.구분 || '보통') ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></span>' +
      '<span style="margin-left:auto; display:inline-flex; gap:6px;">' +
      '<button type="button" id="ccSaveClient" class="save-btn">저장</button>' +
      '<button type="button" id="ccSendSms" class="ghost-btn" title="이 고객에게 문자를 보냅니다(현금영수증 등 파일 링크를 메시지에 붙여넣어 같이 보낼 수 있습니다)">문자</button>' +
      '<button type="button" id="ccDeleteClient" class="btn danger" title="삭제">삭제</button>' +
      '</span></div>' +
      '<div class="nx-form-row">' +
      '<span class="nx-fl">전화 <input type="text" id="ccEditPhone" placeholder="010-0000-0000" value="' + escapeHtml(c.전화번호 || '') + '" style="width:118px;"></span>' +
      '<span class="nx-fl">주소 <input type="text" id="ccEditAddr" placeholder="주소" value="' + escapeHtml(c.주소 || '') + '" style="width:240px;"></span>' +
      '<span class="nx-fl">주민번호 <b style="font-weight:600; color:' + (c.주민번호등록됨 ? 'var(--ink)' : 'var(--sub)') + ';">' + (c.주민번호등록됨 ? '등록됨' : '미등록') + '</b>' +
      (c.주민번호등록됨 ? '<button type="button" id="ccRevealRrn" class="ghost-btn sm">보기</button><span id="ccRrnValue" style="font-size:12px; color:var(--ink); display:none;"></span>' : '') +
      '<input type="text" id="ccEditRrn" placeholder="바꿀 때만 입력" title="바꿀 때만 입력 — 암호화해 저장합니다" style="width:120px;"></span>' +
      '</div>' +
      '<div style="margin:12px 0 10px;"><span class="nx-fl" style="font-weight:600; color:var(--ink);">추가 연락처</span> <span class="nx-help">공동의뢰인·가족 — 현금영수증 자동연결에도 쓰입니다</span>' +
      ccExtraContactsBlockHtml_('ccEditExtra') + '</div>' +
      '<textarea id="ccEditMemo" placeholder="메모" style="width:100%; min-height:50px; font-family:inherit;">' + escapeHtml(c.메모 || '') + '</textarea>' +
      '</div><div class="cc-col">' +
      // [2026.10.18 탭연결 3번] 고객관리에서 바로 이 고객의 새 사건을 연다(작업관리 새 사건 폼에 고객을 고정해 넘김 — 동명이인 혼동 없음)
      '<div class="ch-col-h cc-h">사건 <button type="button" class="ghost-btn sm" data-cc-new-case="1">＋ 이 고객으로 새 사건</button></div>' +
      '<div id="ccLogList" class="log-list"><div class="log-empty">불러오는 중…</div></div>' +
      '<div class="ch-col-h cc-h">흐름 <span>예약 → 사건 → 수금, 날짜순</span></div>' +
      '<div id="ccFlow" class="cc-flow"><div class="log-empty">불러오는 중…</div></div>' +
      '<div class="ch-col-h cc-h">돈 <span id="ccMoneySum"></span><button type="button" id="ccPaymentToggle" class="ghost-btn sm">＋ 수금 추가</button></div>' + // [2026.11.01] 제목 글자를 누르는 숨은 단추 → 제목 + 단추
      '<div id="ccPaymentList" class="log-list"><div class="log-empty">불러오는 중…</div></div>' +
      '<div id="ccNewPaymentFormWrap" style="display:none; margin-top:10px; gap:6px; flex-wrap:wrap; align-items:center;"></div>' +
      '</div></div>';

    container.querySelector('#ccEditPhone').addEventListener('input', function(e){ e.target.value = formatPhoneInput_(e.target.value); });
    var ccEditExtraList = ccWireExtraContacts_('ccEditExtra', c.추가연락처, container);

    var ccRevealRrnBtn = container.querySelector('#ccRevealRrn');
    if (ccRevealRrnBtn){
      ccRevealRrnBtn.addEventListener('click', function(){
        var valueSpan = container.querySelector('#ccRrnValue');
        if (valueSpan.style.display !== 'none' && valueSpan.textContent){
          valueSpan.style.display = 'none';
          ccRevealRrnBtn.textContent = '보기';
          return;
        }
        callGas('client_get_rrn', { id: c.id }).then(function(res){
          if (res.error || res.success === false){ showToast(res.error || res.message || '조회 실패', 'error'); return; }
          valueSpan.textContent = res.주민등록번호 || '(값 없음)';
          valueSpan.style.display = '';
          ccRevealRrnBtn.textContent = '숨기기';
        }).catch(function(){ showToast('조회 중 오류가 발생했습니다.', 'error'); });
      });
    }

    container.querySelector('#ccSaveClient').addEventListener('click', function(){
      var name = container.querySelector('#ccEditName').value.trim();
      if (!name){ showToast('성명은 비워둘 수 없습니다.', 'warning'); return; }
      var upPayload = {
        id: c.id, 성명: name,
        전화번호: container.querySelector('#ccEditPhone').value.trim(),
        추가연락처: ccEditExtraList._contacts,
        구분: container.querySelector('#ccEditType').value.trim(),
        주소: container.querySelector('#ccEditAddr').value.trim(),
        주민등록번호: container.querySelector('#ccEditRrn').value.trim(),
        메모: container.querySelector('#ccEditMemo').value.trim()
      };
      // [2026.11.03 전수조사 다시] 화면 먼저 — 목록 이름·전화를 바로 고치고 서버엔 뒤에서(같은 고객끼리 차례로).
      //  빠른보기에서 저장해도 메인 패널의 저장 안 한 입력은 ccLocalUpsert_가 그대로 둔다(예전 기준선 판단과 같음)
      var before = Object.assign({}, c);
      var upRow = ccLocalRow_(upPayload, upPayload.주민등록번호 ? { 주민번호등록됨: true } : {});
      nxSaveLater_('client_update_client', upPayload, { key: 'client_' + c.id, label: name + ' 고객 저장', patch: [{ list: 'clients', op: 'upsert', id: c.id, row: upRow }],
        onFail: function(){ ccLocalUpsert_(before, false); }, redo: function(){ ccLocalUpsert_(Object.assign({}, before, upRow), false); } });
      Object.assign(c, upRow);
      showToast('저장했습니다.', 'success');
      if (container === clientDetail) clientMainPanelBaseline_ = quickViewCurrentSignature_(container);
      else quickViewSnapshot_ = quickViewCurrentSignature_(container);
      ccLocalUpsert_(upRow, false);
    });

    container.querySelector('#ccSendSms').addEventListener('click', function(){
      openClientSmsModal_(c);
    });

    container.querySelector('#ccDeleteClient').addEventListener('click', function(){
      nxConfirm_('"' + c.성명 + '" 고객을 삭제할까요? 수금 내역은 남아있지만 이 고객과의 연결은 끊어집니다.').then(function(ok){
      if (!ok) return;
      // [2026.11.03 전수조사 다시] 진행 중 사건 확인은 화면이 이미 가진 사건 목록으로(서버 확인과 같은 기준: 고객ID 같고 상태 ≠ 완료),
      //  확인을 받으면 화면에서 바로 빼고 서버엔 뒤에서 보낸다(실패하면 다시 넣고 붉은 띠)
      function sendDelete_(){
        var before = Object.assign({}, c);
        nxSaveLater_('client_delete_client', { id: c.id, force: true }, { key: 'client_' + c.id, label: (c.성명 || '고객') + ' 삭제', patch: [{ list: 'clients', op: 'delete', id: c.id }],
          onFail: function(){ ccLocalUpsert_(before, false); }, redo: function(){ ccLocalDrop_(before.id); } });
        clients = clients.filter(function(x){ return x.id !== c.id; });
        renderClientList(); updateClientNameOptions_();
        showToast('삭제했습니다.', 'success');
        if (container === clientDetail){
          selectedClientId = null;
          clientDetail.innerHTML = '<div class="explorer-status">왼쪽에서 고객을 선택하거나 "+ 새 고객"을 눌러주세요.</div>';
        } else closeClientQuickView_(true);
      }
      callGas('work_get_cases', {}).then(function(wr){
        var active = (wr.cases || []).filter(function(wc){ return wc.고객ID === c.id && wc.상태 !== '완료'; }).map(function(wc){ return wc.사건명; });
        if (!active.length) { sendDelete_(); return; }
        // [2026.09 버그수정] 진행 중인 사건이 있는 고객을 경고 없이 지우면 그 사건의
        // 고객 연결이 끊겨 "빠른보기"가 에러를 냈다 — 한 번 더 명확히 확인받는다.
        nxConfirm_('진행 중인 사건이 있습니다: ' + active.join(', ') + '\n\n그래도 삭제할까요?').then(function(ok2){ if (ok2) sendDelete_(); });
      }).catch(function(){ showToast('사건 목록을 받지 못해 삭제를 멈췄습니다 — 잠시 뒤 다시 눌러 주세요.', 'error'); });
      });
    });

    var newPaymentFormWrap = container.querySelector('#ccNewPaymentFormWrap');
    container.querySelector('#ccPaymentToggle').addEventListener('click', function(){
      if (newPaymentFormWrap.style.display === 'none'){
        newPaymentFormWrap.style.display = 'flex';
        newPaymentFormWrap.innerHTML =
          '<input type="date" id="ccNewPayDate" title="날짜(생략하면 오늘)">' +
          '<input title="금액(원)" type="number" id="ccNewPayAmount" placeholder="금액" size="8">' +
          '<select title="증빙" id="ccNewPayReceipt">' +
          '<option value="">수취증빙 선택</option>' +
          '<option value="현금영수증">현금영수증</option>' +
          '<option value="세금계산서">세금계산서</option>' +
          '<option value="신용카드">신용카드</option>' +
          '</select>' +
          '<select id="ccNewPayCase"><option value="">사건 선택 안 함</option></select>' +
          '<button type="button" id="ccAddPayment" class="save-btn">추가</button>' +
          '<button type="button" id="ccAddPaymentCancel" class="ghost-btn">취소</button>';
        callGas('work_get_cases', {}).then(function(res){
          var mine = (res.cases || []).filter(function(wc){ return wc.고객ID === c.id; });
          var sel = newPaymentFormWrap.querySelector('#ccNewPayCase');
          if (sel) sel.innerHTML = '<option value="">사건 선택 안 함</option>' + mine.map(function(wc){ return '<option value="' + wc.id + '">' + escapeHtml(wc.사건명 || '') + '</option>'; }).join('');
        }).catch(function(){});
        newPaymentFormWrap.querySelector('#ccAddPaymentCancel').addEventListener('click', function(){ newPaymentFormWrap.style.display = 'none'; newPaymentFormWrap.innerHTML = ''; });
        newPaymentFormWrap.querySelector('#ccAddPayment').addEventListener('click', function(){
          var amount = newPaymentFormWrap.querySelector('#ccNewPayAmount').value;
          if (!amount){ showToast('금액을 입력해주세요.', 'warning'); return; }
          // [2026.11.03 전수조사 다시] 화면 먼저 — 번호를 화면이 정해 수금 줄을 바로 넣고 서버엔 뒤에서(같은 번호는 한 번만 들어감)
          var payNew = {
            id: nxNewId_(), 고객ID: c.id, 고객명: c.성명,
            날짜: newPaymentFormWrap.querySelector('#ccNewPayDate').value || new Date().toISOString().slice(0, 10),
            금액: amount,
            수취증빙: newPaymentFormWrap.querySelector('#ccNewPayReceipt').value,
            사건ID: newPaymentFormWrap.querySelector('#ccNewPayCase').value
          };
          ccPaySave_(c, container, 'client_add_consult_log', payNew, Object.assign({}, payNew, { 금액: Number(amount) || 0 }), '수금 추가');
          showToast('수금 내역을 추가했습니다.', 'success');
          newPaymentFormWrap.style.display = 'none';
          newPaymentFormWrap.innerHTML = '';
        });
      } else {
        newPaymentFormWrap.style.display = 'none';
        newPaymentFormWrap.innerHTML = '';
      }
    });

    loadClientLogs_(c, container);
    loadClientPayments_(c, container);
    loadClientFlow_(c, container);

    if (container === clientDetail) clientMainPanelBaseline_ = quickViewCurrentSignature_(container);
  }

  // [2026.09.18 신규] "현금영수증 파일을 보내줘야 하는데 보낼 방법이 없다" — 고객관리에서
  // 바로 문자를 보낸다. 문자(SOLAPI)는 텍스트만 지원해서 파일을 그대로 첨부할 수는 없으므로,
  // 증빙관리에서 그 파일의 공유링크를 복사해 메시지 안에 붙여넣는 방식을 안내한다.
  function openClientSmsModal_(c){
    if (!c.전화번호){ showToast('이 고객의 전화번호가 등록되어 있지 않습니다.', 'warning'); return; }
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.style.display = 'flex';
    overlay.innerHTML =
      '<div class="modal-panel" style="width:min(420px, 92vw);">' +
        '<div class="modal-head"><span>문자 보내기 — ' + escapeHtml(c.성명 || '') + '</span><span class="modal-close" title="닫기" role="button" id="csClose">✕</span></div>' +
        '<div class="modal-body">' +
          '<div style="font-size:12.5px; color:var(--sub); margin-bottom:8px;">받는 번호: ' + escapeHtml(c.전화번호) + '</div>' +
          '<div style="font-size:12px; color:var(--sub); margin-bottom:8px;">파일(현금영수증 등)을 같이 보내려면, 서류 탭에서 그 파일의 공유링크를 복사해 아래 메시지에 붙여넣으세요.</div>' +
          '<textarea id="csMessage" placeholder="메시지 내용을 입력하세요" style="width:100%; min-height:110px; box-sizing:border-box; font-family:inherit; font-size:13px; padding:8px;"></textarea>' +
          '<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">' +
            '<button type="button" id="csSendBtn" class="save-btn">보내기</button>' +
            '<button type="button" id="csCancelBtn" class="ghost-btn">취소</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    function close(){ overlay.remove(); }
    overlay.querySelector('#csClose').onclick = close;
    overlay.querySelector('#csCancelBtn').onclick = close;
    overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });
    overlay.querySelector('#csSendBtn').addEventListener('click', function(){
      var message = overlay.querySelector('#csMessage').value.trim();
      if (!message){ showToast('메시지를 입력해주세요.', 'warning'); return; }
      var btn = overlay.querySelector('#csSendBtn');
      btn.disabled = true;
      callGas('client_send_sms', { 고객ID: c.id, message: message }).then(function(res){
        if (res.success === false){ showToast(res.message || '문자 발송에 실패했습니다.', 'error'); btn.disabled = false; return; }
        showToast('문자를 보냈습니다.', 'success');
        close();
      }).catch(function(err){
        showToast('발송 중 오류: ' + nxErrText_(err), 'error');
        btn.disabled = false;
      });
    });
  }

  // [2026.09.19 신규] "고객이 어떤 사건에서의 관계가 확인되지 않잖아 — 의뢰인·양도인·
  // 증여인·수증인·상속인 구분이 되어야 한다" — 이 고객이 그 사건에 고객ID(의뢰인)로만
  // 연결된 게 아니라, 사건개요 안의 관계자ID(양도인/증여인·수증인/상속인)로만 연결된
  // 경우도 있다(예: 증여자는 의뢰인이 아닐 수 있음). 한 사건 안에서 여러 역할을 동시에
  // 가질 수도 있으므로(의뢰인이면서 양도인인 경우 등) 배열로 전부 모아 표시한다.
  // [2026.09.19 확장] "의뢰인·양도인·증여인·수증인·상속인도 모두 여러 명일 수 있다" — 대표
  // 1명은 기존처럼 단일 ID 필드, 그 외 인원은 "…ExtraIds"류 배열 필드에 담긴다(공동의뢰인은
  // 세목과 무관한 공용 필드). 배열 쪽은 포함 여부(indexOf)로 확인.
  function clientRolesInCase_(wc, clientId){
    var roles = [];
    if (wc.고객ID === clientId) roles.push('의뢰인');
    var ov = wc.사건개요 || {};
    if (Array.isArray(ov['고객추가ID목록']) && ov['고객추가ID목록'].indexOf(clientId) !== -1) roles.push('의뢰인');
    if (ov.trTransferorId === clientId) roles.push('양도인');
    if (Array.isArray(ov.trTransferorExtraIds) && ov.trTransferorExtraIds.indexOf(clientId) !== -1) roles.push('양도인');
    if (ov.giftDonorId === clientId) roles.push('증여인');
    if (Array.isArray(ov.giftDonorExtraIds) && ov.giftDonorExtraIds.indexOf(clientId) !== -1) roles.push('증여인');
    if (ov.giftDoneeId === clientId) roles.push('수증인');
    if (Array.isArray(ov.giftDoneeExtraIds) && ov.giftDoneeExtraIds.indexOf(clientId) !== -1) roles.push('수증인');
    if (ov['상속인ID'] === clientId) roles.push('상속인');
    if (Array.isArray(ov['상속인추가ID목록']) && ov['상속인추가ID목록'].indexOf(clientId) !== -1) roles.push('상속인');
    if (ov.bizTaxpayerId === clientId) roles.push('납세자');
    if (Array.isArray(ov.bizTaxpayerExtraIds) && ov.bizTaxpayerExtraIds.indexOf(clientId) !== -1) roles.push('납세자');
    if (Array.isArray(ov.bizEmployeeIds) && ov.bizEmployeeIds.indexOf(clientId) !== -1) roles.push('임직원');
    // 대표 필드와 추가명단 양쪽에 같은 사람이 실수로 겹쳐 들어간 경우, 배지가 중복 표시되지 않게 정리.
    return roles.filter(function(r, i){ return roles.indexOf(r) === i; });
  }

  // [2026.11.01 화면구조 개편 ④] 흐름 — 이 고객의 예약(전화번호 숫자가 같은 것)·사건 시작·수금을 날짜순 한 줄씩. 읽기만(서버 변경 없음).
  //  예약은 고객 ID 없이 이름·전화로만 들어오므로 전화 숫자로 잇는다(전화가 없으면 예약은 못 이음 — 맨 끝에 알림)
  function loadClientFlow_(c, container){
    container = container || clientDetail;
    var box = container.querySelector('#ccFlow'); if (!box) return;
    var digits = function(p){ return String(p || '').replace(/\D/g, ''); };
    var phones = [digits(c.전화번호)].concat((c.추가연락처 || []).map(function(x){ return digits(x && (x.전화번호 || x.전화)); })).filter(function(p){ return p.length >= 9; });
    Promise.all([
      callGas('list_bookings', {}).catch(function(){ return {}; }),
      callGas('work_get_cases', {}).catch(function(){ return {}; }),
      callGas('client_get_consult_logs', { 고객ID: c.id }).catch(function(){ return {}; })
    ]).then(function(r){
      var rows = [];
      (r[0].bookings || []).forEach(function(b){
        if (!phones.length || phones.indexOf(digits(b.phone)) === -1) return;
        var st = b.caseId ? '사건접수' : (b.result || b.status || '');
        rows.push({ d: String(b.reservedDate || ''), k: '예약', t: (b.type || '상담') + (b.field ? ' · ' + b.field : ''), s: st });
      });
      (r[1].cases || []).filter(function(wc){ return clientRolesInCase_(wc, c.id).length > 0; }).forEach(function(wc){
        rows.push({ d: String(wc.의뢰일 || '').slice(0, 10), k: '사건', t: wc.사건명 || '', s: wc.상태 || '', id: wc.id });
      });
      (r[2].logs || []).forEach(function(p){
        var amt = Number(p.금액) || 0;
        rows.push({ d: String(p.날짜 || '').slice(0, 10), k: amt ? '수금' : '기록', t: amt ? (amt.toLocaleString('ko-KR') + '원' + (p.수취증빙 ? ' · ' + p.수취증빙 : '')) : (p.수취증빙 || p.비고 || p.메모 || '금액 없는 기록'), s: '' });
      });
      rows = rows.filter(function(x){ return x.d; });
      rows.sort(function(a, b){ return b.d.localeCompare(a.d); });
      if (!rows.length){ box.innerHTML = '<div class="log-empty">아직 흐름이 없습니다.</div>'; return; }
      box.innerHTML = rows.slice(0, 40).map(function(x){
        return '<div class="cc-flow-row"><span class="cc-flow-d">' + escapeHtml(x.d.slice(2)) + '</span><span class="cc-flow-k">' + escapeHtml(x.k) + '</span>' +
          '<span class="cc-flow-t" title="' + escapeHtml(x.t) + '">' + (x.id ? '<a href="#" data-cc-flow-case="' + escapeHtml(x.id) + '">' + escapeHtml(x.t) + '</a>' : escapeHtml(x.t)) + '</span>' +
          (x.s ? '<span class="cc-flow-s">' + escapeHtml(x.s) + '</span>' : '') + '</div>';
      }).join('') + (phones.length ? '' : '<div class="cc-flow-note">전화번호가 없어 예약은 잇지 못했습니다.</div>');
      if (!box.dataset.wired){
        box.dataset.wired = '1';
        box.addEventListener('click', function(e){
          var a = e.target.closest && e.target.closest('[data-cc-flow-case]'); if (!a) return;
          e.preventDefault();
          if (container !== clientDetail && typeof closeClientQuickView_ === 'function') { try { closeClientQuickView_(); } catch (er) {} }
          if (typeof goToCaseHandling_ === 'function') goToCaseHandling_(a.getAttribute('data-cc-flow-case'));
        });
      }
    });
  }
  function loadClientLogs_(c, container){
    container = container || clientDetail;
    var listEl = container.querySelector('#ccLogList');
    if (!listEl) return;
    // [2026.10.18 탭연결 3번] 사건 이력 줄의 [처리개요]/[작업관리] 버튼과 "＋ 이 고객으로 새 사건" — 예전엔 글자만 있어 사건으로 갈 수 없었다
    if (!listEl.dataset.wiredCaseGo){
      listEl.dataset.wiredCaseGo = '1';
      listEl.addEventListener('click', function(e){
        var b = e.target.closest && e.target.closest('[data-cc-case-go]');
        if (!b) return;
        var caseId = b.getAttribute('data-case-id');
        if (container !== clientDetail && typeof closeClientQuickView_ === 'function') { try { closeClientQuickView_(); } catch (err) {} }
        if (b.getAttribute('data-cc-case-go') === 'work' && typeof goToWorkManage_ === 'function') goToWorkManage_(caseId);
        else if (typeof goToCaseHandling_ === 'function') goToCaseHandling_(caseId);
      });
    }
    var newCaseBtn = container.querySelector('[data-cc-new-case]');
    if (newCaseBtn && !newCaseBtn.dataset.wired){
      newCaseBtn.dataset.wired = '1';
      newCaseBtn.addEventListener('click', function(){
        if (container !== clientDetail && typeof closeClientQuickView_ === 'function') { try { closeClientQuickView_(); } catch (err) {} }
        if (typeof goToView_ === 'function') goToView_('workmanage');
        if (typeof renderNewCaseForm === 'function') renderNewCaseForm({ 고객명: c.성명 || '', 전화: c.전화번호 || '', 고객ID: c.id });
      });
    }
    callGas('work_get_cases', {}).then(function(res){
      if (res.error || res.success === false){
        listEl.innerHTML = '<div class="log-empty">' + escapeHtml(res.error || res.message || '불러오지 못했습니다.') + '</div>';
        return;
      }
      var cases = (res.cases || []).filter(function(wc){ return clientRolesInCase_(wc, c.id).length > 0; });
      if (!cases.length){
        listEl.innerHTML = '<div class="log-empty">아직 이력이 없습니다.</div>';
        return;
      }
      cases.sort(function(a, b){ return (b.의뢰일 || b.수정일 || '').localeCompare(a.의뢰일 || a.수정일 || ''); });
      listEl.innerHTML = '';
      cases.forEach(function(wc){
        var row = document.createElement('div');
        row.className = 'log-entry';
        renderCaseHistoryRow_(row, wc, clientRolesInCase_(wc, c.id));
        listEl.appendChild(row);
      });
    }).catch(function(){
      listEl.innerHTML = '<div class="log-empty">불러오지 못했습니다.</div>';
    });
  }

  function renderCaseHistoryRow_(row, wc, roles){
    var semokLabel = (typeof WORK_SEMOK_LABELS !== 'undefined' && WORK_SEMOK_LABELS[wc.세목]) || wc.세목 || '';
    var deadlineLabel = typeof workDeadlineFieldLabel_ === 'function' ? workDeadlineFieldLabel_(wc.업무유형) : '법정일';
    var rolesHtml = (roles && roles.length)
      ? ' · ' + roles.map(function(r){ return '<span style="background:var(--gold-light); color:var(--navy-deep); border-radius:4px; padding:1px 6px; font-size:11px; font-weight:700;">' + escapeHtml(r) + '</span>'; }).join(' ')
      : '';
    // [2026.11.01 화면 정비] 세무사님 "낭비되는 공간 없이" — 세 줄 카드(사건명 / 법정일 / 단추)를 한 줄로: 의뢰일 · 사건명 · 세목·업무 · 상태 · 법정일 … 단추는 오른쪽 끝
    row.style.cssText += 'display:flex; align-items:center; gap:10px; padding:6px 10px;';
    row.innerHTML =
      '<div class="log-date" style="flex:0 0 58px;">' + escapeHtml(wc.의뢰일 ? fmtDateShort_(wc.의뢰일) : '') + '</div>' +
      '<div class="log-text" style="flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="' + escapeHtml(wc.사건명 || '') + '">' +
      '<b>' + escapeHtml(wc.사건명 || '') + '</b> <span style="color:var(--sub);">' + escapeHtml(semokLabel) + (wc.업무유형 ? '·' + escapeHtml(wc.업무유형) : '') + '</span>' +
      ' <span style="color:' + (wc.상태 === '완료' ? '#0D1B3D' : 'var(--navy)') + '; font-weight:600;">' + escapeHtml(wc.상태 || '') + '</span>' +
      rolesHtml.replace(/^ · /, ' ') +
      (wc.법정일 ? ' <span style="color:var(--sub);">' + escapeHtml(deadlineLabel) + ' ' + escapeHtml(fmtDateShort_(wc.법정일)) + '</span>' : '') +
      '</div>' +
      '<span style="flex:0 0 auto; display:inline-flex; gap:4px;">' +
        '<button type="button" class="ghost-btn sm" data-cc-case-go="handle" data-case-id="' + escapeHtml(wc.id) + '">개요</button>' +
        '<button type="button" class="ghost-btn sm" data-cc-case-go="work" data-case-id="' + escapeHtml(wc.id) + '">사건 목록</button>' +
      '</span>';
  }

  function loadClientPayments_(c, container){
    container = container || clientDetail;
    var listEl = container.querySelector('#ccPaymentList');
    if (!listEl) return;
    // [2026.09.15 신규] 수금 내역-사건 연결 드롭다운을 채우려면 이 고객의 사건 목록이 필요하다
    // (work_get_cases를 loadClientLogs_와 별도로 한 번 더 부르는 편이, 두 함수의 서로 다른
    // 타이밍에 의존하는 공유 캐시를 만드는 것보다 단순하고 안전하다).
    Promise.all([
      callGas('client_get_consult_logs', { 고객ID: c.id }),
      callGas('work_get_cases', {})
    ]).then(function(results){
      var res = results[0], casesRes = results[1];
      if (res.error || res.success === false){
        listEl.innerHTML = '<div class="log-empty">' + escapeHtml(res.error || res.message || '불러오지 못했습니다.') + '</div>';
        return;
      }
      ccPayDraw_(c, container, res.logs || [], (casesRes.cases || []).filter(function(wc){ return wc.고객ID === c.id; }));
    }).catch(function(){
      listEl.innerHTML = '<div class="log-empty">불러오지 못했습니다.</div>';
    });
  }
  function ccPayDraw_(c, container, payments, cases){
      var listEl = container.querySelector('#ccPaymentList');
      if (!listEl) return;
      container._ccPayState = { payments: payments, cases: cases };
      // [2026.11.01 화면구조 개편 ④] 돈 줄 머리 — 받은 합계(금액 있는 기록만). 청구·미수는 서버에 칸이 없어 아직 못 셈(사실 입력 한 곳 계획서에 넣음)
      var sumEl = container.querySelector('#ccMoneySum');
      // [2026.11.01 사실 입력 한 곳 5] 청구 = 이 고객 사건들의 청구액(사건개요.청구액, 처리개요 수금 카드에서 적음) 합 · 미수 = 청구 − 받은 금액
      if (sumEl){
        var paid = payments.filter(function(p){ return Number(p.금액) || 0; }), paidSum = paid.reduce(function(t, p){ return t + (Number(p.금액) || 0); }, 0);
        var billSum = cases.reduce(function(t, wc){ var ov = wc.사건개요; if (typeof ov === 'string') { try { ov = JSON.parse(ov); } catch (e) { ov = {}; } } return t + (Number(String((ov || {}).청구액 || '').replace(/[^\d]/g, '')) || 0); }, 0);
        var wn = function(n){ return n.toLocaleString('ko-KR') + '원'; };
        sumEl.textContent = (billSum ? '청구 ' + wn(billSum) + ' · ' : '') + (paid.length ? '받은 금액 ' + wn(paidSum) + ' · ' + paid.length + '건' : (billSum ? '받은 금액 0원' : '')) + (billSum ? ' · ' + (billSum > paidSum ? '미수 ' + wn(billSum - paidSum) : '미수 없음') : '');
      }
      if (!payments.length){
        listEl.innerHTML = '<div class="log-empty">아직 수금 내역이 없습니다.</div>';
        return;
      }
      listEl.innerHTML = '';
      payments.forEach(function(pay){
        var row = document.createElement('div');
        row.className = 'log-entry';
        renderPaymentRowView_(row, c, pay, container, cases);
        listEl.appendChild(row);
      });
  }

  // [2026.11.03 전수조사 다시] 수금 줄 저장 — 화면 먼저. 목록에 바로 넣고(·고치고·빼고) 합계 줄도 바로 다시 센 뒤, 서버엔 보낼 함으로 뒤에서.
  //  서버가 받으면 목록을 조용히 다시 받아 맞추고, 실패하면 원래 줄로 되돌린다(화면 아래 붉은 띠에 다시 보내기).
  //  row = 화면에 넣을 줄(지울 땐 null), prev = 고치기·지우기 전 줄
  function ccPaySave_(c, container, action, payload, row, label, prev){
    var id = payload.id;
    nxSaveLater_(action, payload, { key: 'log_' + id, label: (c.성명 || '고객') + ' ' + label,
      patch: [row ? { list: 'logs', op: 'upsert', id: id, row: row } : { list: 'logs', op: 'delete', id: id }],
      onDone: function(){ loadClientPayments_(c, container); },
      onFail: function(){ ccPayRender_(c, container, prev ? { op: 'upsert', row: prev } : { op: 'delete', id: id }); },
      redo: function(){ ccPayRender_(c, container, row ? { op: 'upsert', row: row } : { op: 'delete', id: id }); } });
    ccPayRender_(c, container, row ? { op: 'upsert', row: row } : { op: 'delete', id: id });
  }
  // 지금 그려 둔 수금 줄(마지막으로 받은 목록)에 한 줄을 넣거나 빼서 다시 그린다 — 서버를 부르지 않음
  function ccPayRender_(c, container, ch){
    container = container || clientDetail;
    var st = container._ccPayState; if (!st) return;
    var pays = st.payments.slice(), i = -1;
    pays.forEach(function(p, k){ if (String(p.id) === String(ch.op === 'delete' ? ch.id : ch.row.id)) i = k; });
    if (ch.op === 'delete'){ if (i >= 0) pays.splice(i, 1); }
    else if (i >= 0) pays[i] = Object.assign({}, pays[i], ch.row); else pays.unshift(ch.row);
    ccPayDraw_(c, container, pays, st.cases);
  }
  function ccCaseName_(cases, caseId){
    if (!caseId) return '';
    var found = (cases || []).filter(function(x){ return x.id === caseId; })[0];
    return found ? found.사건명 : '';
  }

  function renderPaymentRowView_(row, c, pay, container, cases){
    var amountText = pay.금액 ? Number(pay.금액).toLocaleString('ko-KR') + '원' : '';
    var caseName = ccCaseName_(cases, pay.사건ID);
    row.innerHTML =
      '<div class="log-date">' + escapeHtml(fmtDateShort_(pay.날짜)) + '</div>' +
      '<div class="log-text">' + escapeHtml(amountText) + (pay.수취증빙 ? ' · ' + escapeHtml(pay.수취증빙) : '') + (caseName ? ' · 🗂 ' + escapeHtml(caseName) : '') + '</div>' +
      '<span class="log-edit" title="수정" style="cursor:pointer; margin-right:6px;">✏️</span>' +
      '<span class="log-del" title="삭제">✕</span>';
    row.querySelector('.log-edit').addEventListener('click', function(){ renderPaymentRowEdit_(row, c, pay, container, cases); });
    row.querySelector('.log-del').addEventListener('click', function(){
      nxConfirm_('이 수금 내역을 삭제할까요?').then(function(ok){
        if (!ok) return;
        ccPaySave_(c, container, 'client_delete_consult_log', { id: pay.id }, null, '수금 삭제', pay);
      });
    });
  }

  function renderPaymentRowEdit_(row, c, pay, container, cases){
    var receiptOptions = ['', '현금영수증', '세금계산서', '신용카드'];
    row.innerHTML =

  function openClientDupAuditModal_(){
    var overlay = document.createElement('div');

    function renderGroups(groups){

      var html = '<div class="taxcalc-result-note" style="margin-bottom:8px;">이름 또는 전화번호가 겹치는 고객 ' + groups.length + '개 그룹입니다. 실제로 같은 사람이 맞으면, 남길 고객을 고르고(라디오) "합치기"를 누르세요 — 나머지 고객에 연결된 사건·자문내역·사건별 관계자 등록이 전부 남긴 고객으로 옮겨지고(my.netax.kr에 보이는 고객명도 같이 정리, 주소·주민등록번호·메모는 남긴 쪽이 비어있으면 합쳐지는 쪽 값으로 채움) 나머지 고객 레코드는 삭제됩니다.</div>';
      groups.forEach(function(g, gi){

          html += '<label style="display:flex; align-items:center; gap:8px; padding:4px 0; cursor:pointer;">' +

              showToast('사건 ' + res.movedCases + '건, 자문내역 ' + res.movedLogs + '건, 사건별 관계자 등록 ' + (res.movedPartyLinks || 0) + '건을 옮기고(my.netax.kr ' + res.movedMyPages + '건 표시명도 정리) 고객 ' + res.deletedClients + '명을 합쳤습니다.', 'success');
              loadClients();

              showToast('합치기 중 오류: ' + nxErrText_(err), 'error');
              btn.disabled = false;
            });
          });
        });
      });

    function load(){
      overlay.querySelector('#cdaBody').innerHTML = '확인 중…';
      callGas('client_audit_duplicates', {}).then(function(res){
        if (res.success === false){ overlay.querySelector('#cdaBody').innerHTML = '<div class="taxcalc-error">' + (res.message || '조회 실패') + '</div>'; return; }
        renderGroups(res.groups || []);
      }).catch(function(err){
        overlay.querySelector('#cdaBody').innerHTML = '<div class="taxcalc-error">조회 중 오류: ' + (err && err.message ? err.message : err) + '</div>';
      });

  // [2026.09.19 정비도구 재정비] 중복 고객 점검·사건폴더 전수조사 버튼은 설정 화면으로

  // 삭제는 되돌리기 어려우므로 목록을 먼저 보여주고 확인 후에만 지운다. 진행 중인 사건이
  // 연결된 고객은 서버가 자동으로 건너뛰고 결과에 별도로 알려준다.
  function openClientDeleteNumericNamesModal_(){

  // [2026.09.19 신규] "고객사건 밑 사건폴더의 모든 파일을 전수조사해서 모든 고객을 일괄등록해달라"
  // — 사건개요(구조화된 필드)에는 없지만 실제 사건 폴더에 올라온 파일 이름에만 등장하는 관계자를
  // 찾기 위해, 서버가 사건 폴더들을 훑어 AI로 파일명에서 사람 이름을 뽑아낸다. 사건 수가 많으면
  // Apps Script 6분 실행 제한 때문에 한 번에 안 끝날 수 있어(client_scan_case_files_for_names가
  // done:true를 줄 때까지) 반복 호출한다 — 화면에 "N/전체 사건 확인 중"으로 진행상황을 보여준다.
  // AI가 이름을 잘못 짚을 수 있으므로 곧바로 등록하지 않고, 전부 모은 뒤 사람이 체크박스로
  // 골라 선택한 것만 등록한다.
  // "공동상속인" + "로"가 아니라 "공동상속인" + "으로"가 맞다(받침 있는 글자 뒤는 "으로") —
  // 유니코드 한글 음절 코드로 마지막 글자의 받침 유무를 계산해 조사를 고른다.
  function csrRoParticle_(word){
    var last = String(word || '').trim().slice(-1);
    var code = last.charCodeAt(0) - 0xAC00;
    if (code < 0 || code > 11171) return '로'; // 한글 음절이 아니면(영문 등) 기본값
    return (code % 28 === 0) ? '로' : '으로';
  }

  // [2026.09.19] "겨우 2건 찾았다"는 반응에 정작 몇 개 폴더를 확인했는지(scannedCases)를
  // 물어보니 세무사님도 기억 못 하셨다 — 진행 중에만 잠깐 버튼 글자로 보이고 사라지는 정보라
  // 화면에 안 남았던 것. 결과 창 제목에 "확인한 폴더 수"를 같이 남겨서 "많이 훑었는데 후보가
  // 적게 나온 것"(파일명이 단서가 될 만큼 정보를 안 담고 있다는 뜻)과 "애초에 폴더를 얼마
  // 못 훑은 것"(탐색 자체가 문제)을 다음부터는 한눈에 구분할 수 있게 한다.
  function openClientScanReviewModal_(candidates, scannedCases){
    var scanNote = (typeof scannedCases === 'number') ? ('사건 폴더 ' + scannedCases + '개를 확인했습니다. ') : '';
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.style.display = 'flex';
    if (!candidates.length){
      overlay.innerHTML =
        '<div class="modal-panel" style="width:min(600px, 96vw);">' +
          '<div class="modal-head"><span>사건폴더 전수조사 결과</span><span class="modal-close" title="닫기" role="button" id="csrClose">✕</span></div>' +
          '<div class="modal-body"><div class="log-empty">' + scanNote + '사건개요에 없는 새 이름을 파일명에서 찾지 못했습니다.</div></div>' +
        '</div>';
      document.body.appendChild(overlay);
      overlay.querySelector('#csrClose').onclick = function(){ overlay.remove(); };
      overlay.addEventListener('click', function(e){ if (e.target === overlay) overlay.remove(); });
      return;
    }
    var html = '<div class="modal-panel" style="width:min(760px, 96vw); max-height:86vh; display:flex; flex-direction:column;">' +
      '<div class="modal-head"><span>사건폴더 전수조사 결과(' + candidates.length + '건)</span><span class="modal-close" title="닫기" role="button" id="csrClose">✕</span></div>' +
      '<div class="modal-body" style="overflow-y:auto;">' +
      '<div class="taxcalc-result-note" style="margin-bottom:8px;">' + scanNote + '그 중 사건 폴더 안 파일 이름에서 AI가 찾아낸 이름은 아래와 같습니다. 실제 관계자가 맞는 것만 체크하고 "선택 등록"을 누르세요 — 틀리게 찾은 항목은 체크를 풀면 등록되지 않습니다.</div>' +
      candidates.map(function(c, i){
        var detailParts = [];
        if (c.전화번호) detailParts.push('📞 ' + escapeHtml(c.전화번호));
        if (c.주소) detailParts.push('🏠 ' + escapeHtml(c.주소));
        if (c.주민등록번호) detailParts.push('🪪 주민등록번호 발견');
        return '<div style="padding:5px 0; border-bottom:1px solid var(--line);">' +
          '<label style="display:flex; align-items:center; gap:8px; cursor:pointer; flex-wrap:wrap;">' +
          '<input type="checkbox" class="csrItem" data-idx="' + i + '" checked>' +
          '<b>' + escapeHtml(c.성명) + '</b>' +
          (c.관계 ? '<span style="color:var(--navy); font-size:12px;">(' + escapeHtml(c.관계) + csrRoParticle_(c.관계) + ' 추정)</span>' : '') +
          '<span style="color:var(--sub); font-size:12px;">사건: ' + escapeHtml(c.사건명 || '(이름없음)') + (c.사건ID ? '' : ' (사건 목록에 연결 안 된 폴더 — 사건 연결 없이 고객만 등록됨)') + '</span>' +
          '</label>' +
          (detailParts.length ? '<div style="margin-left:26px; font-size:12px; color:var(--ink);">' + detailParts.join(' · ') + '</div>' : '') +
          '</div>';
      }).join('') +
      '</div>' +
      '<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">' +
      '<button type="button" class="save-btn" id="csrApply">선택 등록</button>' +
      '</div>' +
      '</div>';
    overlay.innerHTML = html;
    document.body.appendChild(overlay);
    function close(){ overlay.remove(); }
    overlay.querySelector('#csrClose').onclick = close;
    overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });
    overlay.querySelector('#csrApply').addEventListener('click', function(){
      var btn = this;
      var checked = Array.prototype.slice.call(overlay.querySelectorAll('.csrItem:checked'))
        .map(function(el){ return candidates[Number(el.getAttribute('data-idx'))]; });
      if (!checked.length){ showToast('선택된 항목이 없습니다.', 'warning'); return; }
      btn.disabled = true;
      btn.textContent = '등록 중…';
      callGas('client_apply_scanned_names', { items: checked }).then(function(res){
        if (res.error || res.success === false){ showToast(res.error || res.message || '등록 실패', 'error'); btn.disabled = false; btn.textContent = '선택 등록'; return; }
        showToast(res.registered + '명을 고객으로 등록했습니다.', 'success');
        loadClients();
        close();
      }).catch(function(){ showToast('등록 중 오류가 발생했습니다.', 'error'); btn.disabled = false; btn.textContent = '선택 등록'; });
    });
  }

  function runClientScanCaseFiles_(btn){
    nxConfirm_('모든 사건 폴더(하위 폴더 포함)를 AI로 훑어 새 관계자 이름을 찾고, 해당 파일을 열어 전화번호·주소·주민등록번호도 같이 찾습니다. 사건·파일이 많으면 시간이 꽤 걸릴 수 있습니다. 시작할까요?').then(function(ok){
      if (!ok) return;
      btn.disabled = true;
      var originalScanText = btn.textContent;
      function step(){
        callGas('client_scan_case_files_for_names', {}).then(function(res){
          if (res.error || res.success === false){
            btn.disabled = false;
            btn.textContent = originalScanText;
            showToast(res.error || res.message || '조사 실패', 'error');
            return;
          }
          btn.textContent = res.discovering
            ? '폴더 확인 중… (' + res.totalCases + '개 발견)'
            : '조사 중… ' + res.scannedCases + '/' + res.totalCases + '건 (후보 ' + res.candidateCountSoFar + '명)';
          if (res.done){
            btn.disabled = false;
            btn.textContent = originalScanText;
            if (res.truncated){ showToast('사건·후보가 너무 많아 여기까지만 조사하고 중단했습니다. 아래 결과를 먼저 등록한 뒤 다시 실행해주세요.', 'warning'); }
            openClientScanReviewModal_(res.candidates || [], res.totalCases);
            return;
          }
          step();
        }).catch(function(){
          btn.disabled = false;
          btn.textContent = originalScanText;
          showToast('조사 중 오류가 발생했습니다.', 'error');
        });
      }
      step();
    });
  }

  // ---- 고객정보 빠른보기 팝업 (작업관리 사건 상세의 👤 버튼에서 호출) ----
  // [2026.09 리팩터] 예전엔 별도 DOM 없이 메인 목록의 #clientDetail 노드를 그대로 모달 안으로
  // 옮겼다가 닫을 때 되돌리는 방식이라, 메인 목록에 저장 안 한 수정 내용이 있는 상태에서 이
  // 팝업으로 다른 고객을 열면 노드가 통째로 덮어써져 조용히 사라졌다(실사용 감사 지적, 심각도
  // 상). confirm() 경고만 추가했던 임시 조치는 "확인하고 진행"을 누르면 결국 똑같이 사라지는
  // 것으로 재확인돼 미봉책이었다 — 이제 빠른보기는 메인 패널과 완전히 분리된 자기 DOM
  // (#clientQuickViewDetail)에 그려서, 어느 쪽에서 무엇을 하든 다른 쪽 데이터를 건드릴 방법이
  // 구조적으로 없다.
  var quickViewSnapshot_ = null;
  function quickViewCurrentSignature_(container){
    container = container || clientDetail;
    var ids = ['ccEditName', 'ccEditPhone', 'ccEditType', 'ccEditMemo'];
    return ids.map(function(id){ var el = container.querySelector('#' + id); return el ? el.value : ''; }).join('');
  }

  function openClientQuickView_(clientId){
    if (!clientId){ showToast('이 사건에 연결된 고객 정보가 없습니다.', 'warning'); return; }
    var qvContainer = document.getElementById('clientQuickViewDetail');
    var overlay = document.getElementById('clientQuickViewOverlay');
    var alreadyOpen = overlay.style.display !== 'none';
    var proceedOpen_ = function(){
      var found = clients.filter(function(c){ return c.id === clientId; })[0];
      var p = found ? Promise.resolve(found) : callGas('client_get_clients', {}).then(function(res){
        return (res.clients || []).filter(function(c){ return c.id === clientId; })[0];
      }).catch(function(){ return null; });
      p.then(function(f){
        if (!f){ showToast('연결된 고객 정보를 찾을 수 없습니다.', 'error'); return; }
        overlay.style.display = 'flex';
        renderClientDetail(f, qvContainer);
        quickViewSnapshot_ = quickViewCurrentSignature_(qvContainer);
      });
    };
    if (alreadyOpen && quickViewSnapshot_ !== null && quickViewCurrentSignature_(qvContainer) !== quickViewSnapshot_){
      nxConfirm_('빠른보기에 저장하지 않은 수정 내용이 있습니다. 저장하지 않고 다른 고객을 볼까요?').then(function(ok){
        if (ok) proceedOpen_();
      });
    } else {
      proceedOpen_();
    }
  }

  function closeClientQuickView_(force){
    var qvContainer = document.getElementById('clientQuickViewDetail');
    var proceedClose_ = function(){
      quickViewSnapshot_ = null;
      document.getElementById('clientQuickViewOverlay').style.display = 'none';
      qvContainer.innerHTML = '';
    };
    if (!force && quickViewSnapshot_ !== null && quickViewCurrentSignature_(qvContainer) !== quickViewSnapshot_){
      nxConfirm_('저장하지 않은 수정 내용이 있습니다. 저장하지 않고 닫을까요?').then(function(ok){
        if (ok) proceedClose_();
      });
    } else {
      proceedClose_();
    }
  }

  document.getElementById('btnCloseClientQuickView').addEventListener('click', function(){ closeClientQuickView_(); });
  document.getElementById('clientQuickViewOverlay').addEventListener('click', function(e){
    if (e.target === document.getElementById('clientQuickViewOverlay')) closeClientQuickView_();
  });
</script>
