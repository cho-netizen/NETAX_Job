<script>
  // ============================================================
  // 공용 인프라 — google.script.run 래퍼, 로그인 게이트, 메뉴 라우팅
  // ============================================================

  // ============================================================
  // [2026.10.08] 화면 배치 기준 + 다크모드 (설정 탭에서 바꾸고 이 기기에만 기억 — work.netax.kr의
  // 같은 이름 설정을 옮겨온 것). 화면 배치는 폭으로 자동 판정(폰 600px 미만·태블릿 900px 미만·그 외 PC)
  // 하거나 한 단계로 고정한다. 각 화면의 반응형 규칙은 화면 폭(@media) 대신 body의 lay-phone/
  // lay-tablet/lay-pc 클래스와 window.nxLayout을 따른다(style.html·reportwriter.html·aichat.html).
  // ============================================================
  var NX_LAYOUT_KEY_ = 'nx_device_override', NX_DARK_KEY_ = 'nx_dark_mode';
  function nxLs_(key, val){
    try{ if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); }catch(e){}
    return null;
  }
  function nxLayoutOverride_(){ var o = nxLs_(NX_LAYOUT_KEY_); return (o === 'pc' || o === 'tablet' || o === 'phone') ? o : 'auto'; }
  function nxLayoutStage_(){
    var o = nxLayoutOverride_();
    if (o !== 'auto') return o;
    if (nxIsCoverScreen_()) return 'phone'; // 커버화면은 폭이 600을 넘는 기종이 있어도 폰 배치로
    var w = window.innerWidth;
    return w < 600 ? 'phone' : (w < 900 ? 'tablet' : 'pc');
  }
  // [2026.10.15] 접는 폰(Z플립) 커버화면 — 세무사님 결정: 커버화면에서는 기존 화면을 줄여 보이지 말고
  // "약식 대시보드 ↔ AI" 두 화면만 오가게 한다(나머지 기능은 펼쳐서). 폭·높이(innerWidth/Height)로 판정하면
  // 판정 기준은 아래 nxIsCoverScreen_ 설명 참고.
  // 커버화면은 긴 쪽도 640 이하(Z플립5·6 약 330~370, Z플립7 약 410~460), 일반 휴대폰은 긴 쪽 700 이상.
  // 폰 배치(lay-phone)는 그대로 두고 lay-cover만 덧붙인다(설정에서 배치를 직접 고정하면 커버 화면 안 씀).
  // [2026-10-15 실기기] 커버화면에서도 원래 화면이 나왔다 — 접고 펼칠 때 휴대폰 크롬이 screen 값을 바로 바꿔 주지 않는
  // 경우가 있어서, 창 크기(innerWidth/Height)가 커버화면만 할 때도 커버로 본다. 요즘 크롬은 키보드가 올라와도
  // 창 높이(innerHeight)를 줄이지 않으므로(가상 키보드는 화면 위에 겹침) 펼친 화면에서 잘못 바뀌지 않는다.
  function nxIsCoverScreen_(){
    var o = nxLayoutOverride_();
    if (o === 'pc' || o === 'tablet') return false; // 설정에서 PC·태블릿으로 고정하면 커버화면 안 씀('폰' 고정은 씀)
    // 손가락으로 쓰는 기기에서만(PC 창을 작게 줄였을 때 바뀌지 않게). 커버화면은 거의 정사각형(세로/가로 0.75~1.45)이고
    // 작다(짧은 쪽 240~640). 펼친 휴대폰은 세로/가로 2배 이상이라 해당 없음. 기종마다 커버화면 크기가 달라(Z플립5·6·7)
    // 고정 크기 대신 모양으로 판정한다.
    var touch = false; try { touch = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0; } catch (e) {}
    if (!touch) return false;
    // 기종도 본다(세무사님: 태블릿 화면 나누기처럼 크기·비율만 맞는 큰 기기에서 뜨면 안 됨) — 크롬이 알려 주는 기종명이
    // 있으면 갤럭시 Z플립(SM-F7…)일 때만. 기종명을 못 받는 브라우저면 아래 크기·비율 기준으로만 판단한다.
    if (window.nxDeviceModel && !/^SM-F7/i.test(window.nxDeviceModel)) return false;
    function squareSmall(w, h){ var s = Math.min(w, h), l = Math.max(w, h); return s >= 240 && s <= 640 && l <= 760 && l / s <= 1.45; }
    // 화면 크기(screen) 값은 접고 펼칠 때 늦게 바뀌어(시험에서 펼친 크기인데 커버로 판정) 쓰지 않고 실제 창 크기만 본다.
    return squareSmall(window.innerWidth, window.innerHeight);
  }
  function nxApplyLayout_(){
    var st = nxLayoutStage_();
    var changed = window.nxLayout !== st;
    window.nxLayout = st;
    ['pc', 'tablet', 'phone'].forEach(function(s){ document.body.classList.toggle('lay-' + s, s === st); });
    var cover = st === 'phone' && nxIsCoverScreen_();
    var coverChanged = !!window.nxCover !== cover;
    window.nxCover = cover;
    document.body.classList.toggle('lay-cover', cover);
    if (coverChanged && typeof nxCoverOnEnter_ === 'function') try{ nxCoverOnEnter_(cover); }catch(e){}
    if (coverChanged){ try{ document.dispatchEvent(new CustomEvent('nx-cover-change', { detail: cover })); }catch(e){} }
    if (changed){ try{ document.dispatchEvent(new CustomEvent('nx-layout-change', { detail: st })); }catch(e){} }
  }
  function nxSetLayoutOverride_(value){ nxLs_(NX_LAYOUT_KEY_, value); nxApplyLayout_(); }
  function nxApplyDark_(on){ document.documentElement.classList.toggle('nx-dark', !!on); }
  function nxSetDark_(on){ nxLs_(NX_DARK_KEY_, on ? '1' : '0'); nxApplyDark_(on); }
  function nxIsDark_(){ return document.documentElement.classList.contains('nx-dark'); }
  (function(){
    var saved = nxLs_(NX_DARK_KEY_);
    var prefersDark = false;
    try{ prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){}
    nxApplyDark_(saved === null ? prefersDark : saved === '1');
    nxApplyLayout_();
    var t = null;
    window.addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(nxApplyLayout_, 120); });
    // [2026.10.15] 접는 폰은 접고 펼칠 때 resize 알림이 늦거나 안 오는 경우가 있어(커버화면에 원래 화면이 남음),
    // 화면이 다시 보일 때와 1.5초마다 창 크기가 바뀌었는지 직접 확인한다(크기 비교만 — 바뀌었을 때만 배치 다시 계산).
    var lastSize = window.innerWidth + 'x' + window.innerHeight;
    function nxCheckSize_(){
      var s = window.innerWidth + 'x' + window.innerHeight;
      if (s !== lastSize){ lastSize = s; nxApplyLayout_(); }
    }
    // 기종명(안드로이드 크롬만 알려 줌) — 받으면 커버화면 판정을 다시 한다(nxIsCoverScreen_)
    try {
      if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues){
        navigator.userAgentData.getHighEntropyValues(['model']).then(function(v){
          if (v && v.model){ window.nxDeviceModel = String(v.model); nxApplyLayout_(); }
        }).catch(function(){});
      }
    } catch (e) {}
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) nxCheckSize_(); });
    window.addEventListener('pageshow', nxCheckSize_);
    setInterval(nxCheckSize_, 1500);
    // 문서작성의 확대·축소 버튼 위치는 화면 배치 단계에 따라 달라진다(reportwriter.html)
    document.addEventListener('nx-layout-change', function(){ if (typeof updatePreviewControlsPosition === 'function') try{ updatePreviewControlsPosition(); }catch(e){} });
  })();

  // [2026.09] "저장 버튼을 눌러도 반응이 없어 답답하다" — 버튼 하나하나에 로딩 상태를
  // 넣는 대신, 서버 요청이 진행 중인 동안 항상 켜지는 전역 진행바(#globalProgressBar,
  // style.html)로 한 번에 해결한다. 여러 요청이 동시에 나갈 수 있어 카운터로 관리 —
  // 마지막 요청이 끝나야 꺼진다.
  var callGasPending_ = 0;
  function callGasProgress_(delta){
    callGasPending_ = Math.max(0, callGasPending_ + delta);
    var bar = document.getElementById('globalProgressBar');
    if (bar) bar.classList.toggle('active', callGasPending_ > 0);
  }

  // [2026.09 보안수정] manageApp_call이 이제 로그인 시 발급된 세션 토큰을 요구한다 — 매 호출에
  // 자동으로 실어 보낸다(호출부 코드는 그대로 callGas(action, payload)만 쓰면 됨).
  var manageAppSessionToken_ = null;

  // manageApp_call(action, payload)를 프라미스로 감싼다. 기존 앱의 callGas(action, payload)와
  // 시그니처를 맞춰서, work-manage.js/client-manage.js 등을 이식할 때 호출부 코드를 그대로 쓸 수 있게 한다.
  // [2026.10.08] 여러 화면이 같은 목록을 따로 받아오던 것을 함께 쓴다 — 사건 목록(work_get_cases)은
  // 처리개요·법령조회·증빙확보·세액계산·문서작성·작업관리·대시보드 등 10곳이 각자 불렀다(요청 1번에 5초 이상,
  // 구글 응답이 불안정하면 30초). 한 번 받은 결과를 1분간 같이 쓰고, 동시에 같은 요청이 나가면 하나로 합친다.
  // 저장·수정 같은 쓰기 요청이 하나라도 나가면 기억을 지워 다음엔 새로 받는다(오래된 목록이 보이지 않게).
  // 화면이 받은 결과를 고쳐도 다른 화면에 번지지 않도록 매번 복사본을 준다.
  // 값 = 응답에 반드시 있어야 하는 목록 이름 — 없으면 기억하지 않고 오류로 처리한다.
  var CALLGAS_SHARED_READS_ = { work_get_cases: 'cases', client_get_clients: 'clients' };
  var CALLGAS_SHARED_TTL_MS_ = 60000;
  var CALLGAS_READONLY_RE_ = /(^|_)(get|list|search|read|lookup|load|check)/i;
  var callGasShared_ = {};
  function callGas(action, payload){
    var isPlain = !payload || Object.keys(payload).length === 0;
    if (CALLGAS_SHARED_READS_[action] && isPlain){
      var hit = callGasShared_[action];
      if (!hit || Date.now() - hit.at > CALLGAS_SHARED_TTL_MS_){
        var listKey = CALLGAS_SHARED_READS_[action];
        hit = { at: Date.now(), promise: callGasRaw_(action, payload).then(function(res){
          if (!res || !Array.isArray(res[listKey])) throw new Error('목록을 받지 못했습니다(서버 응답 이상) — 잠시 후 다시 시도하세요.');
          return res;
        }) };
        callGasShared_[action] = hit;
        hit.promise.catch(function(){ if (callGasShared_[action] === hit) delete callGasShared_[action]; });
      }
      return hit.promise.then(function(res){ return JSON.parse(JSON.stringify(res)); });
    }
    if (!CALLGAS_READONLY_RE_.test(action) && action.indexOf('ai_') !== 0){
      // [2026.10.09 버그수정] 저장 "시작"에만 기억을 지우면, 저장이 도는 사이 다른 화면이 사건 목록을 읽어 저장 전 목록이
      // 다시 1분간 기억됐다(시험 사건 8개를 만들었는데 목록엔 6개만 보임 — 실사용 점검에서 발견). 끝날 때도 한 번 더 지운다.
      callGasShared_ = {};
      return callGasRaw_(action, payload).then(function(res){ callGasShared_ = {}; return res; }, function(err){ callGasShared_ = {}; throw err; });
    }
    return callGasRaw_(action, payload);
  }
  // [2026.10.08] 버그 자동기록 — 화면 스크립트 오류를 서버 _오류기록.json에 남긴다(Code.js ai_logBug).
  // 같은 오류는 한 번만, 한 번 열 때 최대 10건(오류가 반복돼 서버를 두드리지 않게).
  var nxBugSent_ = {}, nxBugCount_ = 0;
  function nxLogBug_(entry){
    try{
      var key = (entry.kind || '') + '|' + (entry.message || '').slice(0, 120);
      if (nxBugSent_[key] || nxBugCount_ >= 10) return;
      // [2026.10.14 긴급수정] 로그인 전(세션 없음)에는 서버에 보내지 않는다 — 로그인 화면에서 난 오류를 보내다 서버가 AUTH_REQUIRED로
      // 답하면 "로그인이 만료되었습니다" 알림 → 새로고침이 되풀이되어 로그인 창이 아예 안 보였다(2026-10-14 실사용).
      var tok = null; try { tok = sessionStorage.getItem('nxManageSessionToken'); } catch (e) {}
      if (!tok) return;
      nxBugSent_[key] = true; nxBugCount_++;
      entry.view = entry.view || window._currentViewLabel || '';
      try {
        var calls = (typeof nxRecentCalls_ !== 'undefined' ? nxRecentCalls_ : []).map(function(c){ return c.t + ' ' + c.a + (c.ok === null ? '(진행중)' : c.ok ? '✓' : '✗') + (c.ms != null ? ' ' + c.ms + 'ms' : ''); }).join(', ');
        entry.detail = String(entry.detail || '').slice(0, 1100) + '\n[재현] 최근 요청: ' + (calls || '없음') + ' / 화면 ' + window.innerWidth + 'x' + window.innerHeight;
      } catch (e2) {}
      callGasRaw_('ai_log_bug', { entry: entry }).catch(function(){});
    }catch(e){}
  }
  window.addEventListener('error', function(e){
    if (!e || !e.message || /ResizeObserver loop/.test(e.message)) return;
    nxLogBug_({ kind: 'js', where: (e.filename || '').split('/').pop() + ':' + (e.lineno || ''), message: e.message, detail: e.error && e.error.stack ? String(e.error.stack).slice(0, 1200) : '' });
  });
  // [2026.10.09] 실사용 점검에서 발견 — 화면 코드가 서버 실패를 따로 받아주지 않은 곳(예: 증빙확보의 확보완료/미확보로)은
  // 저장이 실패해도 화면에 아무 말이 없어 "눌렀는데 아무 일도 안 일어남"으로 보였다. 화면마다 고치는 대신 여기 한 곳에서,
  // 서버 요청(callGasRaw_)에서 난 실패를 아무도 받아주지 않았으면 무엇이 실패했는지 화면에 알린다(오류 기록에도 남음).
  var NX_ACTION_VERB_ = function(action){
    return /(update|save|set|create|add|apply|link|approve|reject|cancel|delete|remove|send|publish|upload|mark|rename|merge)/i.test(action || '') ? '저장·처리' : '불러오기';
  };
  window.addEventListener('unhandledrejection', function(e){
    var r = e && e.reason;
    var msg = r && r.message ? r.message : String(r || '');
    if (!msg || /AUTH_REQUIRED|AbortError/.test(msg)) return;
    if (r && r.nxAction){
      try{ toast('⚠ ' + NX_ACTION_VERB_(r.nxAction) + '에 실패했습니다 — ' + msg.slice(0, 120) + ' (잠시 후 다시 시도해 주세요)'); }catch(err){}
    }
    nxLogBug_({ kind: 'promise', where: r && r.nxAction ? '서버요청 ' + r.nxAction : '', message: msg, detail: r && r.stack ? String(r.stack).slice(0, 1200) : '' });
  });

  // [2026.10.13] 오류 재현 묶음 — 최근 서버 요청 8개(이름·성공/실패·걸린 시간만, 입력값은 남기지 않음)를 오류 기록에 붙인다
  var nxRecentCalls_ = [];
  function nxRecentCallStart_(action){
    var rec = { a: action, t: new Date().toTimeString().slice(0, 8), s: Date.now(), ok: null };
    nxRecentCalls_.push(rec); if (nxRecentCalls_.length > 8) nxRecentCalls_.shift();
    return function(ok){ rec.ok = ok; rec.ms = Date.now() - rec.s; };
  }
  function callGasRaw_(action, payload){
    callGasProgress_(1);
    var nxDone = action === 'ai_log_bug' ? function(){} : nxRecentCallStart_(action);
    return new Promise(function(resolve, reject){
      google.script.run
        .withSuccessHandler(function(res){
          callGasProgress_(-1);
          nxDone(!(res && res.error));
          if (res && res.error === 'AUTH_REQUIRED' && action === 'ai_log_bug'){ resolve(null); return; } // 오류 기록 전송은 조용히 넘김(로그인 화면을 덮지 않게)
          // [2026.10.14 긴급수정] 아직 로그인하지 않은 상태(세션 토큰 없음)에서 어떤 기능이 서버를 불렀다면 "만료"가 아니다 —
          // 알림·새로고침 없이 조용히 실패시킨다(로그인 화면이 그대로 보이게). 로그인 전 서버 호출 실수가 다시 생겨도 로그인을 막지 못하게.
          if (res && res.error === 'AUTH_REQUIRED'){
            var hadTok = null; try { hadTok = sessionStorage.getItem('nxManageSessionToken'); } catch (e) {}
            if (!hadTok){ var ea = new Error('AUTH_REQUIRED'); ea.nxAction = action; reject(ea); return; }
          }
          if (res && res.error === 'AUTH_REQUIRED'){
            // 세션 토큰이 없거나 만료됨 — 다시 로그인하도록 강제.
            try{ sessionStorage.removeItem('nxManageSessionToken'); }catch(e){}
            nxAlert_('로그인이 만료되었습니다. 다시 로그인해주세요.').then(function(){ location.reload(); });
            return;
          }
          if (res && res.error){ var er = new Error(res.error); er.nxAction = action; reject(er); }
          else resolve(res);
        })
        .withFailureHandler(function(err){
          callGasProgress_(-1);
          nxDone(false);
          if (!(err instanceof Error)) err = new Error(String(err && err.message || err || '서버 연결 실패'));
          err.nxAction = action;
          reject(err);
        })
        .manageApp_call(action, payload || {}, manageAppSessionToken_);
    });
  }

  // [2026.09.16 버그수정] 네이티브 alert()/confirm()을 쓰면, 이 앱이 구글 앱스스크립트의
  // 샌드박스 iframe(...script.googleusercontent.com) 안에서 돌아가기 때문에 크롬이 대화상자
  // 맨 위에 "n-xxxx.script.googleusercontent.com에 삽입된 페이지 내용:" 같은 불필요한 안내를
  // 강제로 붙인다 — 이건 페이지 코드로는 절대 없앨 수 없는 브라우저 자체 보안 표시라, 네이티브
  // 대화상자 자체를 안 쓰고 화면 안에 직접 그리는 커스텀 대화상자로 전부 바꾼다.
  function nxDialog_(opts){
    return new Promise(function(resolve){
      var old = document.getElementById('nxDialogOverlay');
      if (old) old.remove();
      var overlay = document.createElement('div');
      overlay.id = 'nxDialogOverlay';
      overlay.className = 'modal-overlay';
      overlay.style.zIndex = '9999';
      var btnsHtml = opts.buttons.map(function(b, i){
        return '<button type="button" class="' + (b.className || 'btn') + '" data-nx-val="' + i + '">' + escapeHtml(b.label) + '</button>';
      }).join(' ');
      overlay.innerHTML =
        '<div class="modal-panel" style="width:min(360px, 92vw);">' +
          '<div class="modal-head"><span>' + escapeHtml(opts.title || '안내') + '</span></div>' +
          '<div class="modal-body">' +
            '<div style="white-space:pre-wrap; font-size:13.5px; line-height:1.5; color:var(--ink);">' + escapeHtml(opts.message || '') + '</div>' +
            // [2026.10.18] opts.stack — 사건 고르기처럼 긴 버튼이 여러 개면 한 줄로 넘치지 않게 세로로 쌓는다(기본은 예전 그대로)
            '<div style="display:flex; ' + (opts.stack ? 'flex-direction:column; align-items:stretch; max-height:55vh; overflow-y:auto;' : 'justify-content:flex-end;') + ' gap:8px; margin-top:14px;">' + btnsHtml + '</div>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);
      var finish = function(val){
        document.removeEventListener('keydown', onKey);
        overlay.remove();
        resolve(val);
      };
      overlay.querySelectorAll('[data-nx-val]').forEach(function(btn){
        btn.addEventListener('click', function(){ finish(opts.buttons[Number(btn.getAttribute('data-nx-val'))].value); });
      });
      // [2026.09.16 버그수정] 세무사님 전수검사 지적 — 앱 전체(저장/취소 쌍 12곳 전수 확인)가
      // 예외 없이 "저장·확인(주된 동작)이 왼쪽, 취소가 오른쪽" 순서인데, 정작 이 공용
      // 대화상자만 반대(취소가 왼쪽)로 만들어져 있었다. 버튼 배열의 "화면에 놓이는 순서"와
      // "Enter/Esc가 어떤 값을 돌려줄지"를 분리해서(primary/isCancel 플래그), 배열 순서를
      // 자유롭게 바꿔도 키보드 동작은 항상 Enter=주된 동작·Esc=취소로 고정되게 한다.
      var primaryIdx = opts.buttons.findIndex(function(b){ return b.primary; });
      if (primaryIdx === -1) primaryIdx = opts.buttons.length - 1;
      var cancelIdx = opts.buttons.findIndex(function(b){ return b.isCancel; });
      if (cancelIdx === -1) cancelIdx = 0;
      var onKey = function(e){
        if (e.key === 'Enter') finish(opts.buttons[primaryIdx].value);
        else if (e.key === 'Escape') finish(opts.buttons[cancelIdx].value);
      };
      document.addEventListener('keydown', onKey);
      var primaryBtn = overlay.querySelector('[data-nx-val="' + primaryIdx + '"]');
      if (primaryBtn) primaryBtn.focus();
    });
  }
  // 기존 네이티브 alert()과 같은 자리에 그대로 쓰도록 이름을 맞춘다.
  function nxAlert_(message, title){
    return nxDialog_({ title: title || '안내', message: message, buttons: [{ label: '확인', value: true, className: 'save-btn', primary: true }] });
  }
  // 네이티브 confirm()과 달리 Promise<boolean>을 돌려준다 — 호출부는
  // `if (!confirm(x)) return;` 대신 `nxConfirm_(x).then(function(ok){ if(!ok) return; ... })`로 바꿔야 한다.
  // 앱 전체의 "저장이 왼쪽·취소가 오른쪽" 관례에 맞춰 확인을 먼저 놓는다.
  function nxConfirm_(message, title){
    return nxDialog_({ title: title || '확인', message: message, buttons: [
      { label: '확인', value: true, className: 'save-btn', primary: true },
      { label: '취소', value: false, className: 'ghost-btn', isCancel: true }
    ] });
  }
  // 네이티브 prompt()도 같은 이유(iframe 안내문구)로 못 쓴다 — 입력칸이 있는 커스텀 대화상자로
  // 대체. 네이티브 prompt()과 달리 Promise<string|null>을 돌려준다(취소=null).
  function nxPrompt_(message, defaultValue, title){
    return new Promise(function(resolve){
      var old = document.getElementById('nxDialogOverlay');
      if (old) old.remove();
      var overlay = document.createElement('div');
      overlay.id = 'nxDialogOverlay';
      overlay.className = 'modal-overlay';
      overlay.style.zIndex = '9999';
      overlay.innerHTML =
        '<div class="modal-panel" style="width:min(420px, 92vw);">' +
          '<div class="modal-head"><span>' + escapeHtml(title || '입력') + '</span></div>' +
          '<div class="modal-body">' +
            '<div style="white-space:pre-wrap; font-size:13.5px; line-height:1.5; color:var(--ink); margin-bottom:8px;">' + escapeHtml(message || '') + '</div>' +
            '<input type="text" id="nxPromptInput" style="width:100%; box-sizing:border-box;">' +
            '<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">' +
              '<button type="button" class="save-btn" data-nx-val="ok">확인</button>' +
              '<button type="button" class="ghost-btn" data-nx-val="cancel">취소</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);
      var input = overlay.querySelector('#nxPromptInput');
      input.value = defaultValue || '';
      var finish = function(val){
        document.removeEventListener('keydown', onKey);
        overlay.remove();
        resolve(val);
      };
      overlay.querySelector('[data-nx-val="cancel"]').addEventListener('click', function(){ finish(null); });
      overlay.querySelector('[data-nx-val="ok"]').addEventListener('click', function(){ finish(input.value); });
      var onKey = function(e){
        if (e.key === 'Enter') finish(input.value);
        else if (e.key === 'Escape') finish(null);
      };
      document.addEventListener('keydown', onKey);
      input.focus();
      input.select();
    });
  }

  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('shown');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove('shown'); }, 2200);
  }
  // work-manage.js/client-manage.js 이식본이 그대로 부르는 이름(showToast(msg, type))으로도 동작하게.
  function showToast(msg, type){ toast(msg); }

  function escapeHtml(s){
    if (s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // [2026.09 리팩토링] "사건 목록으로 <option> 만들기"가 lawsearch/casehandling/docs/taxcalc/
  // reportwriter 5개 화면에 거의 똑같이(고객명순 정렬 + "고객명 · 사건명 (상태)") 복사돼 있어서,
  // 표시 형식을 하나 바꾸려면 5곳을 다 찾아 고쳐야 했다 — 공용 함수로 통합. 동작(정렬 기준,
  // 표시 문구)은 기존 그대로이고, 화면마다 달랐던 placeholder 문구·상태표시 여부·선택값만
  // opts로 넘겨 예전과 똑같이 보이게 한다.
  // [2026.09.16 버그수정] 세무사님 지적 — 사건명 명명규칙이 이미 "고객명(납세자)_세목_
  // 업무유형"이라 고객명을 항상 포함하는데, 이 콤보 라벨이 "고객명 · 사건명"으로 고객명을
  // 또 앞에 붙여서 중복 표시하고 있었다. 사건명만 보여준다(정렬 기준은 그대로 고객명 순 —
  // 같은 고객의 여러 사건이 목록에서 붙어 보이는 게 여전히 편하므로).
  function buildCaseOptionsHtml_(cases, opts){
    opts = opts || {};
    var placeholder = opts.placeholder !== undefined ? opts.placeholder : '사건을 선택하세요';
    var showStatus = opts.showStatus !== false;
    var selectedId = opts.selectedId;
    return '<option value="">' + escapeHtml(placeholder) + '</option>' +
      (cases || []).slice().sort(function(a, b){ return (a.고객명 || '').localeCompare(b.고객명 || ''); }).map(function(c){
        var label = escapeHtml(c.사건명 || '') + (showStatus ? ' (' + escapeHtml(c.상태 || '') + ')' : '');
        return '<option value="' + c.id + '"' + (selectedId !== undefined && c.id === selectedId ? ' selected' : '') + '>' + label + '</option>';
      }).join('');
  }

  // explorer.js의 짧은 날짜 표시(YYYY-MM-DD → YY-MM-DD) — 표시 전용, 저장값은 그대로 유지.
  function fmtDateShort_(dateStr){
    if (!dateStr) return '';
    return String(dateStr).slice(2);
  }

  // explorer.js/document-tools.js와 동일한 base64 변환 헬퍼 — 증빙관리·메모 이식본에서 공용으로 사용.
  function utf8ToBase64(str){ return btoa(unescape(encodeURIComponent(str))); }
  function uint8ToBase64(bytes){
    var binary = '';
    var chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    return btoa(binary);
  }
  // "고객사건"(기본 작업 폴더) 루트 경로 — 메모의 고객명 매칭 저장, 작업관리 새 사건 등에서
  // 공용으로 쓰는 기준점. listFolder({})는 서버의 기본 폴더(DEFAULT_FOLDER_ID_PROPERTY) 경로를 준다.
  var _customerRootPathCache = null;
  function getCustomerRootPath_(){
    if (_customerRootPathCache) return Promise.resolve(_customerRootPathCache);
    return callGas('listFolder', {}).then(function(res){
      _customerRootPathCache = res.path || [];
      return _customerRootPathCache;
    });
  }

  function formatFileSize(bytes){
    if (!bytes && bytes !== 0) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/1024/1024).toFixed(1) + ' MB';
  }

  // AI 사이드바의 요청 context.currentView로 그대로 실려나가는 라벨 — 대화 중 화면을 옮겨도
  // AI가 "지금 어느 화면을 보고 있는지" 알 수 있게 한다.
  // [주의] 아래 로그인 게이트 IIFE가 이미 로그인된 세션이면 곧바로 enterApp()→showView()를

  // 않은 변수를 참조해 TypeError가 나고, 그 여파로 initDashboard 등 나머지 초기화가 전부
  // 실행되지 않는 버그가 실제로 발생했었다).
  var VIEW_LABELS_ = {
    ai: 'AI', dashboard: '대시보드', consult: '상담 녹음', clientcard: '고객 카드', booking: '예약관리', workmanage: '작업관리', casehandling: '처리개요', lawsearch: '법령정보', clientmanage: '고객관리',
    collections: '수금관리',
    docs: '증빙확보', taxcalc: '세액계산', print: '세액인쇄', reportwriter: '문서작성', reports: '열람관리',
    'memo-text': '일반메모', 'memo-hand': '필기메모', reporthub: '보고서 모음', settings: '설정', manual: '사용자메뉴얼'
  };

  // ---- 로그인 게이트 ----
  // [2026.09 보안수정] 예전에는 여기서 sessionStorage에 "로그인함" 표시만 남기고, 그 표시를
  // 서버로 전혀 보내지 않았다 — manageApp_call이 이제 세션 토큰을 요구하므로, 로그인 성공 시
  // 서버가 내려준 토큰을 저장해두고 매 호출마다 실어 보낸다.
  (function(){
    var gate = document.getElementById('loginGate');
    var form = document.getElementById('loginForm');
    var input = document.getElementById('loginPw');
    var btn = document.getElementById('loginBtn');
    var err = document.getElementById('loginErr');
    var STORAGE_KEY = 'nxManageSessionToken';

    function tryLogin(){
      if (btn.disabled) return; // 중복 제출(예: submit과 다른 경로가 겹치는 경우) 방지
      var pw = input.value;
      if (!pw){ return; }
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(function(res){
          btn.disabled = false;
          if (res && res.ok && res.token){
            manageAppSessionToken_ = res.token;
            try{ sessionStorage.setItem(STORAGE_KEY, res.token); }catch(e){}
            enterApp();
          } else {
            err.textContent = '비밀번호가 올바르지 않습니다.';
            input.value = '';
            input.focus();
          }
        })
        .withFailureHandler(function(e){
          btn.disabled = false;
          err.textContent = '확인 중 오류: ' + (e && e.message ? e.message : e);
        })
        .manageApp_checkPassword(pw);
    }
    // [2026.09 버그수정] "<입장>을 직접 눌러야만 로그인된다"는 지적. button을 type="submit"으로
    // 바꿔 <form>의 표준 제출(submit) 이벤트로 Enter를 잡는 게 기본이지만, 실제 기기·브라우저
    // 환경에 따라 Enter 키 이벤트 자체가 브라우저의 "이 폼을 제출하라"는 기본동작으로 이어지지
    // 않는 경우가 있는 것으로 확인돼(키 이벤트에 code/keyCode가 안 실리는 등) keydown 직접
    // 처리도 같이 남겨 이중 안전장치로 둔다 — 둘 다 fire되면 tryLogin이 두 번 불릴 수 있는데,
    // tryLogin 맨 앞의 "이미 처리 중이면 무시" 가드로 중복 전송은 막는다. e.key뿐 아니라
    // 예전 규격인 e.keyCode(=13)도 같이 확인해, e.key가 비거나 다르게 오는 환경도 커버한다.
    if (form) form.addEventListener('submit', function(e){ e.preventDefault(); tryLogin(); });
    else btn.addEventListener('click', tryLogin);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.keyCode === 13) tryLogin(); });

    var savedToken = null;
    try{ savedToken = sessionStorage.getItem(STORAGE_KEY); }catch(e){}
    if (savedToken){
      manageAppSessionToken_ = savedToken;
      enterApp();
    } else {
      input.focus();
    }
  })();

  function enterApp(){
    document.getElementById('loginGate').classList.add('hidden');
    document.getElementById('appRoot').classList.add('shown');
    // [2026.09.16 버그수정] settings.html과 같은 원인 — 로그인 후에도 CSS로 숨기기만 해서
    // <input type="password" id="loginPw">가 앱을 쓰는 내내 DOM에 그대로 남아있었다. 로그인은
    // 한 번 성공하면 이 세션 동안 다시 쓸 일이 없으므로, 로그인칸 자체를 DOM에서 완전히
    // 제거해 크롬이 페이지 전체를 훑을 때 더 이상 비밀번호칸으로 잡히지 않게 한다.
    var loginPwEl = document.getElementById('loginPw');
    if (loginPwEl) loginPwEl.remove();
    if (!enterApp._inited){
      enterApp._inited = true;
      initNav();
      tbCollapseInit_();
      showView('dashboard');
      if (typeof initDashboard === 'function') initDashboard();
      if (typeof initAiSidebar === 'function') initAiSidebar();
      // 작업관리 "새 사건" 폼의 고객명 자동완성(clientNameOptions)이 처음부터 채워져 있도록,
      // 고객관리 화면을 열지 않아도 미리 한 번 받아온다(client-manage.js 원본과 동일한 이유).
      // [2026.09.15 버그수정] 실사용 지적 — 이 시점(로그인 직후)에 clientManageLoaded를
      // 미리 true로 찍어버려서, 이 이른 시점의 client_get_clients 호출이 어떤 이유로든

      // initClientManage()의 "이미 로드됨" 가드에 막혀 다시는 불러오지 않았다 — 작업관리의
      // 고객 빠른보기(별도 경로로 그때그때 새로 불러옴)는 멀쩡한데 고객관리 탭만 계속
      // 비어보이는 증상의 원인. 이 이른 호출은 자동완성 사전채움 "덤"일 뿐이니 로드완료
      // 표시는 남기지 않는다 — 탭을 실제로 열 때 initClientManage()가 정상적으로 다시 부른다.
      if (typeof loadClients === 'function'){ loadClients(); }
    }
  }

        var fromAct = document.querySelector('.menu-item.active[data-view]');

  // [2026.10.18 탭연결 5번] 처리 화면들은 고른 사건을 화면마다 따로 기억해서, 처리개요에서 A 사건을 보다가 왼쪽 메뉴의 세액계산을
  // 누르면 빈 화면이나 전에 보던 B 사건이 떴다(그대로 계산·저장하면 엉뚱한 사건에 들어갈 위험). 왼쪽 메뉴로 옮길 때:

  //    (저장 안 한 계산·문서를 말없이 바꾸지 않도록 누를 때만 옮긴다)
  var nxLastCaseId_ = '';
  var NX_CASE_FOLLOW_VIEWS_ = ['casehandling', 'lawsearch', 'docs', 'taxcalc', 'print', 'reportwriter'];
  function nxScreenCaseIdOf_(v){

      if (v === 'reportwriter'){ var rs = document.getElementById('rwCaseSelect'); return rs ? rs.value : ''; }

  // [2026.09] "아이콘+버튼명" 툴바(.tb-row/.scan-row)가 좁아지면 1단계로 아이콘부터 숨기고
  // 2단계로 글자까지 숨겨 자리를 줄이는 로직 — "폭 숫자" 기준(container query)으로 처음
  // 시도했다가, flex-wrap:wrap 때문에 컨테이너 자체는 안 좁아지고 버튼만 2줄로 줄바꿈돼버려서
  // 전혀 동작하지 않는 문제가 있었다("생략 단계로 안 넘어가고 바로 2줄") — 그래서 폭이 아니라

  // 바꿔서 줄바꿈 없이 필요한 실제 너비(scrollWidth)를 재고, 원래 값으로 되돌린다.
  function tbFitsOneLine_(el){
    var prevWrap = el.style.flexWrap;

  function tbCollapseApply_(el){

    // 추가만 해서, 화면이 아주 좁을 때 아이콘도 글자도 없는 완전히 빈 버튼(테두리만 남음)이
    // 됐다. 최종 단계는 텍스트 대신 아이콘만 남기는 쪽(아이콘 전용)이 훨씬 알아보기 쉽다.
    el.classList.remove('tb-ic-off', 'tb-tx-off');

  // 잠깐 꺼둔다.

    // 이건 window resize가 아니라서 위 리스너로는 안 잡힌다 — #centerWork 자체의 렌더링

    // flex로 나타나는 경우)도 같이 봐야, 처음엔 숨겨져 있다가 나중에 보이는 툴바도 놓치지 않는다.

  // [2026.10.15] 커버화면 밀기(세무사님 제안) — 위로 밀면 요약 ↔ AI, AI 화면에서 왼쪽으로 밀면 음성 ↔ 문자(aichat.html).

    goToView_(view);
  }

  // [2026.10.18 탭연결 1번] 세무사님 지시 — "상담사건이 증빙을 올리려면 안내를 하면서 자동으로 유형을 물어서 수정되도록 해야 한다."
  // 상담 사건은 파일이 없는 사건이라 드라이브 폴더를 만들지 않는다(Code.js work_createCase). 그런데 증빙을 올리려는 순간
  // 그 전제가 깨지므로, 그때 업무유형(신고·자문 등)을 물어 고르면 작업관리와 똑같이 work_update_case로 업무유형을 바꾼다 —
  // 서버가 그 저장 안에서 사건명·폴더·고객창구 연결을 함께 만든다(work_updateCase). 돌려주는 값: 폴더가 생긴 최신 사건 객체
  // (취소하면 null). 폴더가 이미 있으면 묻지 않고 그대로 돌려준다.
  function nxEnsureCaseFolder_(c, purpose){
    if (!c) return Promise.resolve(null);
    if (c.폴더ID) return Promise.resolve(c);
    if (String(c.업무유형 || '') !== '상담'){
      // 상담이 아닌데 폴더가 없는 옛 사건 — 업무유형은 그대로 두고 폴더만 만든다(처리개요 고객창구 [연결]과 같은 ensure_case_folder)
      return callGas('ensure_case_folder', { id: c.id }).then(function(r){
        if (!r || r.success === false || !r.folderId){ showToast((r && r.message) || '사건 폴더를 만들지 못했습니다.'); return null; }
        c.폴더ID = r.folderId;
        return c;
      });
    }
    var opts = (typeof WORK_UPTYPE_OPTIONS_ !== 'undefined' && (WORK_UPTYPE_OPTIONS_[c.세목] || WORK_UPTYPE_OPTIONS_.transfer)) || ['신고', '자문'];
    opts = opts.filter(function(u){ return u !== '상담'; });
    var buttons = opts.map(function(u){ return { label: u, value: u, className: 'save-btn' }; });
    buttons.push({ label: '취소', value: null, className: 'ghost-btn', isCancel: true, primary: true });
    return nxDialog_({
      title: '업무유형 정하기',
      // purpose는 조사까지 붙여 받는다(예: '메모를', '문서를', '상담 녹음을') — 기본 '증빙을'
      message: '"' + (c.사건명 || '이 사건') + '"은(는) 상담 사건이라 아직 사건 폴더가 없습니다.\n\n' +
        (purpose || '증빙을') + ' 올리려면 이 사건의 업무유형을 골라 주세요. 고르면 업무유형이 바뀌고(사건명도 함께), 사건 폴더가 만들어지며 고객창구(my.netax.kr)도 연결됩니다.\n\n' +
        '· 신고 — 신고서를 작성하는 사건(법정기한 자동 계산)\n· 자문 — 검토서·보고서를 작성하는 사건',
      buttons: buttons
    }).then(function(upType){
      if (!upType) return null;
      return callGas('work_update_case', { id: c.id, 업무유형: upType, 기대수정일: c.수정일 }).then(function(res){
        if (!res || res.error || res.success === false){ showToast((res && (res.message || res.error)) || '업무유형을 바꾸지 못했습니다.'); return null; }
        Object.assign(c, res.case || {});
        if (!c.폴더ID){ showToast('업무유형은 "' + upType + '"(으)로 바꿨지만 폴더를 만들지 못했습니다 — 잠시 후 다시 시도해 주세요.'); return null; }
        showToast('업무유형을 "' + upType + '"(으)로 바꾸고 사건 폴더를 만들었습니다.');
        if (res.warning) showToast(res.warning);
        // 작업관리가 들고 있는 옛 사건 정보(업무유형·폴더 없음)를 다음에 열 때 새로 받게 한다(지금 열려 있으면 바로)
        try {
          var wmEl = document.getElementById('view-workmanage');
          if (wmEl && wmEl.classList.contains('active') && typeof loadWorkCases === 'function') loadWorkCases();
          else if (typeof workManageLoaded !== 'undefined') workManageLoaded = false;
        } catch (e) {}
        return c;
      });
    });
  }
  // 사건의 증빙확보(사건 폴더)를 연다 — 처리개요 📁 증빙확보·📝 메모, "↪ 이 사건 다른 화면", 증빙확보 사건 고르기, AI가 같이 쓴다.
  // 폴더 없는 상담 사건이면 nxEnsureCaseFolder_로 업무유형을 먼저 묻는다. onReady(c)는 폴더가 생긴 뒤 화면이 자기 정보를 고칠 때 쓴다.
  function nxOpenCaseDocs_(c, onReady){
    if (!c) return;
    var go = function(cc){
      if (typeof docsLoaded !== 'undefined') docsLoaded = true; // initDocs의 기본위치 이동과 겹치지 않게
      goToView_('docs');
      if (cc.폴더ID && typeof docsNavigateById_ === 'function') docsNavigateById_(cc.폴더ID);
    };
    if (c.폴더ID){ go(c); return; }
    // 폴더ID가 없는 옛 사건(상담 아님) 중엔 이름이 같은 폴더가 이미 있는 경우가 있어, 예전처럼 이름 경로로 먼저 찾아간다
    if (String(c.업무유형 || '') !== '상담' && typeof getCustomerRootPath_ === 'function' && typeof docsNavigate === 'function'){
      if (typeof docsLoaded !== 'undefined') docsLoaded = true;
      goToView_('docs');
      getCustomerRootPath_().then(function(basePath){ docsNavigate(basePath.concat([String(c.사건명 || '').trim()])); });
      return;
    }
    nxEnsureCaseFolder_(c).then(function(cc){
      if (!cc) return;
      if (onReady) { try { onReady(cc); } catch (e) {} }
      go(cc);
    });
  }
  // 콤보박스 만들기 — fromView(지금 화면)는 목록에서 빼고, getCaseId()로 지금 사건을 읽는다.
  // beforeLeave(go)를 주면 이동 전에 확인(예: 문서작성의 미저장 경고) 후 go()를 부른다.
  function nxCaseJumpSelect_(fromView, getCaseId, beforeLeave){
    var sel = document.createElement('select');
    sel.className = 'nx-case-jump';
    sel.title = '이 사건의 다른 화면으로 바로 이동';
    sel.style.maxWidth = '170px';
    sel.innerHTML = '<option value="">↪ 이 사건 다른 화면</option>' + NX_CASE_VIEWS_.filter(function(v){ return v[0] !== fromView; })
      .map(function(v){ return '<option value="' + v[0] + '">' + v[1] + '</option>'; }).join('');
    sel.addEventListener('change', function(){
      var v = sel.value; sel.value = '';
      if (!v) return;
      var id = getCaseId();
      var go = function(){ nxCaseJump_(v, id); };
      if (beforeLeave) beforeLeave(go); else go();
    });
    return sel;
  }
  // 이미 있는 버튼(예: "↩ 처리개요") 바로 뒤에 한 번만 붙인다
  function nxCaseJumpAttach_(afterEl, fromView, getCaseId, beforeLeave){
    if (!afterEl || !afterEl.parentNode) return;
    var next = afterEl.nextElementSibling;
    if (next && next.classList && next.classList.contains('nx-case-jump')) return;
    afterEl.parentNode.insertBefore(nxCaseJumpSelect_(fromView, getCaseId, beforeLeave), afterEl.nextSibling);
  }

  // [2026.09 신규] 사용자메뉴얼 — 화면 오른쪽 아래 ❓ 버튼을 누르면 "지금 보고 있던 화면"에
  // 해당하는 설명으로 바로 이동한다. 화면마다 따로 버튼을 붙이지 않고 하나의 전역 버튼이
  // 현재 활성 메뉴(data-view)를 보고 알아서 섹션을 고르는 방식이라, 새 화면이 생겨도 이 표에
  // 한 줄만 추가하면 된다.
  var HELP_SECTION_BY_VIEW_ = {
    dashboard: 'help-dashboard', booking: 'help-booking', workmanage: 'help-workmanage',
    casehandling: 'help-casehandling', lawsearch: 'help-lawsearch', clientmanage: 'help-clientmanage',
    collections: 'help-collections',
    docs: 'help-docs', taxcalc: 'help-taxcalc', reportwriter: 'help-reportwriter', reports: 'help-reports',
    'memo-text': 'help-memo-text', 'memo-hand': 'help-memo-hand', settings: 'help-settings', manual: 'help-toc'
  };
  function goToHelp_(sectionId){
    goToView_('manual');
    requestAnimationFrame(function(){
      var el = document.getElementById(sectionId);
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      el.classList.add('help-flash');
      setTimeout(function(){ el.classList.remove('help-flash'); }, 1600);
    });
  }
  var globalHelpBtn_ = document.getElementById('globalHelpBtn');
  if (globalHelpBtn_) {
    globalHelpBtn_.addEventListener('click', function(){
      var activeItem = document.querySelector('.menu-item[data-view].active');
      var viewName = activeItem ? activeItem.getAttribute('data-view') : null;
      var sectionId = (viewName && HELP_SECTION_BY_VIEW_[viewName]) || 'help-toc';
      goToHelp_(sectionId);
    });
  }

  // [2026.10.13 자가치유] 화면 배선 자가점검 — job을 열고 잠시 뒤(화면이 한가할 때) 한 번만, 하루 한 번:
  // 왼쪽 메뉴마다 그 화면 틀(#view-이름)과 여는 함수(init…)가 실제로 있는지, 주요 화면의 핵심 함수가 정의돼 있는지 본다.
  // 빠진 것이 있으면 오류 기록에 남긴다(→ 개선 후보 보고서 → 주간 루틴이 고침). 서버 호출은 문제가 있을 때 한 번뿐, 토큰 0.
  (function(){
    var INIT_BY_VIEW_ = { booking: 'initBooking', workmanage: 'initWorkManage', casehandling: 'initCaseHandling', lawsearch: 'initLawSearch',
      clientmanage: 'initClientManage', collections: 'initCollections', docs: 'initDocs', 'memo-text': 'initMemoText', 'memo-hand': 'initMemoHand',
      reporthub: 'initReportHub', taxcalc: 'initTaxCalc', print: 'initPrintHub', reportwriter: 'initReportWriter', reports: 'initReports',
      settings: 'initSettings', dashboard: 'initDashboard' };
    // 화면 안의 핵심 기능(버튼이 부르는 함수) — 이름이 바뀌거나 빠지면 버튼이 조용히 먹통이 된다
    var CORE_FNS_ = ['callGas', 'showView', 'goToView_', 'nxLogBug_', 'runAiAutoFillTransferBulk', 'runFolderAiExtraction',
      'calculateTransferTaxMultiJS', 'calculateGiftTaxJS', 'calculateInheritanceTaxJS', 'createNewDoc'];
    function check_(){
      try {
        // 로그인 전에는 하지 않는다(로그인 창 위에서 서버를 부르지 않게) — 로그인 뒤 다음 기회에 다시 본다
        var tok = null; try { tok = sessionStorage.getItem('nxManageSessionToken'); } catch (e) {}
        if (!tok) { setTimeout(check_, 60000); return; }
        var today = new Date().toISOString().slice(0, 10);
        try { if (localStorage.getItem('nxWiringCheckDay') === today) return; } catch (e) {}
        var missing = [];
        document.querySelectorAll('.menu-item[data-view]').forEach(function(m){
          var v = m.getAttribute('data-view');
          if (v === 'ai' || v === 'manual') return;
          if (!document.getElementById('view-' + v)) missing.push('화면 틀 없음: ' + v);
          var fn = INIT_BY_VIEW_[v];
          if (fn && typeof window[fn] !== 'function') missing.push('여는 함수 없음: ' + v + '(' + fn + ')');
        });
        CORE_FNS_.forEach(function(f){ if (typeof window[f] !== 'function') missing.push('핵심 함수 없음: ' + f); });
        try { localStorage.setItem('nxWiringCheckDay', today); } catch (e) {}
        if (missing.length && typeof nxLogBug_ === 'function') nxLogBug_({ kind: 'wiring', where: '화면 배선 자가점검', message: missing.slice(0, 8).join(' / '), detail: missing.join('\n') });
      } catch (e) { /* 점검 자체 실패는 화면에 영향 주지 않음 */ }
    }
    window.addEventListener('load', function(){
      setTimeout(function(){ if (window.requestIdleCallback) requestIdleCallback(check_, { timeout: 10000 }); else check_(); }, 15000);
    });
  })();
</script>
