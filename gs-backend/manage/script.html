<script>
  // ============================================================
  // 공용 인프라 — google.script.run 래퍼, 로그인 게이트, 메뉴 라우팅
  // ============================================================

  // ============================================================
  // [2026.10.08] 화면 배치 기준 + 다크모드 (설정 탭에서 바꾸고 이 기기에만 기억 — work.netax.kr의
  // 같은 이름 설정을 옮겨온 것). 화면 배치는 폭으로 자동 판정(폰 600px 미만·태블릿 900px 미만·그 외 PC)
  // 하거나 한 단계로 고정한다. 각 화면의 반응형 규칙은 화면 폭(@media) 대신 body의 lay-phone/
  // lay-tablet/lay-pc 클래스와 window.nxLayout을 따른다(style.html·reportwriter.html·aichat.html).
  // ============================================================
  // [2026-11-13 느림 ①] 세무사님 "느림은 권장대로 하라"(계획서 docs/_기록/느림_구조_계획서_20261113.html) — 서버를 부를 때마다 7~16초 걸리는 읽기(장부·오늘 카드)를
  // 이 기기에 마지막으로 받은 값으로 먼저 그리고, 뒤에서 새 값이 오면 바꿔 그린다. 기기에 남기는 것은 그 읽기 결과뿐(로그인 표·비밀값 없음),
  // 최근 20개만·한 건 400KB까지, 모든 기기 로그아웃(설정)하면 지운다. 옛 값을 보이는 동안은 화면이 단추를 막고 「몇 초 전 값」을 띄운다(nxStaleMark_).
  var NX_LC_PREFIX_ = 'nx_lc_';
  window.nxLocalCache_ = {
    get: function(key){ try { var v = JSON.parse(localStorage.getItem(NX_LC_PREFIX_ + key) || 'null'); return v && v.r ? v : null; } catch (e) { return null; } },
    set: function(key, r){
      try {
        var s = JSON.stringify({ t: Date.now(), r: r }); if (s.length > 400000) return;
        // [2026.11.13 5차 재점검 D] 기기에는 주민등록번호 뒷자리를 남기지 않는다(장부에 주민번호 칸 값이 있는 실사건 2건) — 「900101-1******」로 가려 남기고, 새 값을 서버에서 받으면 원래대로 그린다
        //  숫자로 적힌 13자리(저장 시각 밀리초 등)는 건드리지 않는다 — 하이픈 있는 꼴과 따옴표 안의 13자리 글자 값만
        s = s.replace(/(\d{6})\s*-\s*([1-8])\d{6}(?!\d)/g, '$1-$2******').replace(/"(\d{6})([1-8])\d{6}"/g, '"$1-$2******"');
        localStorage.setItem(NX_LC_PREFIX_ + key, s);
        var keys = []; for (var i = 0; i < localStorage.length; i++){ var k = localStorage.key(i); if (k && k.indexOf(NX_LC_PREFIX_) === 0) keys.push(k); }
        if (keys.length > 20) keys.map(function(k){ var t = 0; try { t = JSON.parse(localStorage.getItem(k)).t || 0; } catch (e) {} return { k: k, t: t }; })
          .sort(function(a, b){ return a.t - b.t; }).slice(0, keys.length - 20).forEach(function(x){ localStorage.removeItem(x.k); });
      } catch (e) {}
    },
    clear: function(){ try { var ks = []; for (var i = 0; i < localStorage.length; i++){ var k = localStorage.key(i); if (k && k.indexOf(NX_LC_PREFIX_) === 0) ks.push(k); } ks.forEach(function(k){ localStorage.removeItem(k); }); } catch (e) {} }
  };
  // 옛 값 표시 — box 안 단추·입력을 막고 맨 위에 「n분 전 값 · 새로 받는 중」 띠. 새 값으로 다시 그리면(box.innerHTML 교체) 저절로 풀린다.
  window.nxStaleMark_ = function(box, t){
    if (!box) return;
    var sec = Math.max(0, Math.round((Date.now() - (t || 0)) / 1000));
    var ago = sec < 60 ? sec + '초' : sec < 3600 ? Math.round(sec / 60) + '분' : sec < 86400 ? Math.round(sec / 3600) + '시간' : Math.round(sec / 86400) + '일';
    box.classList.add('nx-stale');
    var bar = document.createElement('div'); bar.className = 'nx-stale-bar'; bar.textContent = '⏳ ' + ago + ' 전에 받은 값입니다 — 새 값을 받는 중(받으면 바로 바뀌고 단추가 풀립니다)';
    box.insertBefore(bar, box.firstChild);
  };
  // 읽기 전용 서버 조회를 「지난 값 먼저 → 새 값」으로: .then(fn)의 fn이 지난 값이 있으면 먼저 한 번(둘째 인자 {stale:true, t}), 새 값으로 또 한 번 불린다.
  // where(화면 칸)를 주면 그 칸 맨 위에 「지난 값」 띠를 지난 값을 쓰는 동안만 둔다. 새 값이 오류면 기억하지 않는다.
  window.nxCacheFirst_ = function(action, payload, where){
    var key = 'gas_' + action + (payload && Object.keys(payload).length ? '_' + JSON.stringify(payload) : '');
    var p = callGas(action, payload || {});
    return {
      then: function(fn){
        var old = window.nxLocalCache_.get(key), host = where ? document.getElementById(where) : null;
        if (old) { try { fn(old.r, { stale: true, t: old.t }); if (host) { nxStaleClear_(host); nxStaleMark_(host, old.t); } } catch (e) {} }
        return p.then(function(r){ if (host) nxStaleClear_(host); if (r && !r.error) window.nxLocalCache_.set(key, r); return fn(r, { stale: false }); },
                      function(e){ if (host) nxStaleClear_(host); throw e; });
      }
    };
  };
  // [2026.11.13 5차 사] 자주 안 바뀌는 상태(배포 상태·밤 점검·판정 대기)는 이 기기에 받은 지 maxAgeMs 안이면 서버를 아예 부르지 않는다 —
  //  대시보드를 열 때마다 배포 상태 16~34초·밤 점검 13~34초가 job 서버를 붙잡아 전체 표시가 17~37초였다(오류 기록 65건, 11-05~11-13)
  window.nxCacheRecent_ = function(action, payload, where, maxAgeMs){
    var key = 'gas_' + action + (payload && Object.keys(payload).length ? '_' + JSON.stringify(payload) : '');
    var old = window.nxLocalCache_.get(key);
    if (old && Date.now() - (old.t || 0) < (maxAgeMs || 600000)) return { then: function(fn){ try { return Promise.resolve(fn(old.r, { stale: false, cached: true, t: old.t })); } catch (e) { return Promise.reject(e); } } };
    return window.nxCacheFirst_(action, payload, where);
  };
  window.nxStaleClear_ = function(box){ if (!box) return; box.classList.remove('nx-stale'); var b = box.querySelector(':scope > .nx-stale-bar'); if (b) b.remove(); };
  var NX_LAYOUT_KEY_ = 'nx_device_override', NX_DARK_KEY_ = 'nx_dark_mode';
  function nxLs_(key, val){
    try{ if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); }catch(e){}
    return null;
  }
  function nxLayoutOverride_(){ var o = nxLs_(NX_LAYOUT_KEY_); return (o === 'pc' || o === 'tablet' || o === 'phone') ? o : 'auto'; }
  function nxLayoutStage_(){
    var o = nxLayoutOverride_();
    if (o !== 'auto') return o;
    if (nxIsCoverScreen_()) return 'phone'; // 커버화면은 폭이 600을 넘는 기종이 있어도 폰 배치로
    var w = window.innerWidth;
    return w < 600 ? 'phone' : (w < 900 ? 'tablet' : 'pc');
  }
  // [2026.10.15] 접는 폰(Z플립) 커버화면 — 세무사님 결정: 커버화면에서는 기존 화면을 줄여 보이지 말고
  // "약식 대시보드 ↔ AI" 두 화면만 오가게 한다(나머지 기능은 펼쳐서). 폭·높이(innerWidth/Height)로 판정하면
  // 판정 기준은 아래 nxIsCoverScreen_ 설명 참고.
  // 커버화면은 긴 쪽도 640 이하(Z플립5·6 약 330~370, Z플립7 약 410~460), 일반 휴대폰은 긴 쪽 700 이상.
  // 폰 배치(lay-phone)는 그대로 두고 lay-cover만 덧붙인다(설정에서 배치를 직접 고정하면 커버 화면 안 씀).
  // [2026-10-15 실기기] 커버화면에서도 원래 화면이 나왔다 — 접고 펼칠 때 휴대폰 크롬이 screen 값을 바로 바꿔 주지 않는
  // 경우가 있어서, 창 크기(innerWidth/Height)가 커버화면만 할 때도 커버로 본다. 요즘 크롬은 키보드가 올라와도
  // 창 높이(innerHeight)를 줄이지 않으므로(가상 키보드는 화면 위에 겹침) 펼친 화면에서 잘못 바뀌지 않는다.
  function nxIsCoverScreen_(){
    // [2026.10.22] 세무사님 "권장순서대로 하고…"(기기 3종 검토 D-3) — 워치·휴대폰 바로가기 "넥스에게 말하기"(/m/?talk=1 → /app/?talk=1)는
    //  기기 크기와 상관없이 말하기 모드로 연다(그 창이 열려 있는 동안). 갤럭시워치(기종 SM-R…·SM-L…)도 말하기 모드.
    try { if (/[?&]talk=1/.test(location.search)) sessionStorage.setItem('nxForceTalk', '1'); } catch (e) {}
    try { if (sessionStorage.getItem('nxForceTalk') === '1') return true; } catch (e) {}
    if (window.nxDeviceModel && /^SM-[RL]\d/i.test(window.nxDeviceModel)) return true;
    var o = nxLayoutOverride_();
    if (o === 'pc' || o === 'tablet') return false; // 설정에서 PC·태블릿으로 고정하면 커버화면 안 씀('폰' 고정은 씀)
    // 손가락으로 쓰는 기기에서만(PC 창을 작게 줄였을 때 바뀌지 않게). 커버화면은 거의 정사각형(세로/가로 0.75~1.45)이고
    // 작다(짧은 쪽 240~640). 펼친 휴대폰은 세로/가로 2배 이상이라 해당 없음. 기종마다 커버화면 크기가 달라(Z플립5·6·7)
    // 고정 크기 대신 모양으로 판정한다.
    var touch = false; try { touch = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0; } catch (e) {}
    if (!touch) return false;
    // 기종도 본다(세무사님: 태블릿 화면 나누기처럼 크기·비율만 맞는 큰 기기에서 뜨면 안 됨) — 크롬이 알려 주는 기종명이
    // 있으면 갤럭시 Z플립(SM-F7…)일 때만. 기종명을 못 받는 브라우저면 아래 크기·비율 기준으로만 판단한다.
    if (window.nxDeviceModel && !/^SM-F7/i.test(window.nxDeviceModel)) return false;
    // 워치 화면(짧은 쪽 240 미만, 거의 정사각·원형)도 작은 정사각으로 본다(2026.10.22 — 150부터)
    function squareSmall(w, h){ var s = Math.min(w, h), l = Math.max(w, h); return s >= 150 && s <= 640 && l <= 760 && l / s <= 1.45; }
    // 화면 크기(screen) 값은 접고 펼칠 때 늦게 바뀌어(시험에서 펼친 크기인데 커버로 판정) 쓰지 않고 실제 창 크기만 본다.
    return squareSmall(window.innerWidth, window.innerHeight);
  }
  function nxApplyLayout_(){
    var st = nxLayoutStage_();
    var changed = window.nxLayout !== st;
    window.nxLayout = st;
    ['pc', 'tablet', 'phone'].forEach(function(s){ document.body.classList.toggle('lay-' + s, s === st); });
    if (typeof nxFontZoomApply_ === 'function') nxFontZoomApply_(); // [2026.11.11] 글자 크기 — 배치별 기본값이 있어 배치가 바뀌면 다시 맞춘다
    var cover = st === 'phone' && nxIsCoverScreen_();
    var coverChanged = !!window.nxCover !== cover;
    window.nxCover = cover;
    document.body.classList.toggle('lay-cover', cover);
    if (coverChanged && typeof nxCoverOnEnter_ === 'function') try{ nxCoverOnEnter_(cover); }catch(e){}
    if (coverChanged){ try{ document.dispatchEvent(new CustomEvent('nx-cover-change', { detail: cover })); }catch(e){} }
    if (changed){ try{ document.dispatchEvent(new CustomEvent('nx-layout-change', { detail: st })); }catch(e){} }
  }
  function nxSetLayoutOverride_(value){ nxLs_(NX_LAYOUT_KEY_, value); nxApplyLayout_(); }
  function nxApplyDark_(on){ document.documentElement.classList.toggle('nx-dark', !!on); }
  function nxSetDark_(on){ nxLs_(NX_DARK_KEY_, on ? '1' : '0'); nxApplyDark_(on); }
  // [2026.11.11] 글자 크기(설정 › 화면) — 화면 전체 배율(퍼센트, 80~150, 5단위). 이 기기에만 저장(localStorage nx_font_zoom).
  //  저장값이 없으면 배치별 기본값(PC 100·태블릿 115·폰 110, 접는 폰 커버화면 100). 머리글의 작은 script가 첫 그림 전에 같은 규칙으로 한 번 적용한다.
  // [2026.11.11] 기기별 화면 — 현장 도구(폰·태블릿 메뉴 「현장」·폰 도구 시트), 폰 아래 탭 줄, 폰 메뉴 「더 보기」.
  //  휴대폰 창구(/m/)의 도구는 같은 탭에서 연다 — 이 앱의 로그인표(sessionStorage)를 창구가 이어받아 비밀번호를 다시 묻지 않는다(m/index.html ensureLogin).
  var NX_FIELD_URLS_ = { scan: '/m/?scan=1', sign: '/m/?sign=1', pen: '/m/?pen=1', talk: '/m/?talk=1', memo: '/m/?memo=1', visit: '/m/?visit=1', todo: '/m/?todo=1', board: '/m/?board=1' };
  function nxFieldOpen_(kind){
    var sheet = document.getElementById('nxFieldSheet');
    if (kind === 'close'){ if (sheet) sheet.hidden = true; return; }
    if (sheet) sheet.hidden = true;
    if (kind === 'present'){ document.body.classList.toggle('nx-present'); if (typeof nxSideMenuPeek_ === 'function') nxSideMenuPeek_(false); return; }
    if (kind === 'handmemo'){ goToView_('memo-hand'); return; }
    if (kind === 'suggest'){ if (typeof nxSuggestOpen_ === 'function') nxSuggestOpen_(); return; }
    if (kind === 'help'){ var h = document.getElementById('globalHelpBtn'); if (h) h.click(); return; }
    var url = NX_FIELD_URLS_[kind]; if (!url) return;
    if (typeof nxSideMenuPeek_ === 'function') nxSideMenuPeek_(false);
    location.href = url;
  }
  function nxPhoneBarSync_(name){
    var cur = name || (function(){ var v = document.querySelector('#centerWork > .view.active'); return v ? v.id.replace(/^view-/, '') : ''; })();
    var key = cur; try { if (typeof nxCbIsCaseView_ === 'function' && nxCbIsCaseView_(cur)) key = 'casehandling'; } catch (e) {} // 사건 머리줄이 아직 안 만들어졌을 때도 끊기지 않게
    document.querySelectorAll('#nxPhoneBar [data-pb]').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-pb') === key); });
  }
  (function(){
    document.addEventListener('click', function(e){
      var mi = e.target.closest && e.target.closest('.menu-item[data-view]'); if (mi) setTimeout(function(){ nxPhoneBarSync_(); }, 0); // 왼쪽 메뉴로 옮겨도 아래 탭 줄 표시 맞춤
      var f = e.target.closest && e.target.closest('[data-field]');
      if (f){ e.preventDefault(); e.stopPropagation(); nxFieldOpen_(f.getAttribute('data-field')); return; }
      var pb = e.target.closest && e.target.closest('#nxPhoneBar [data-pb]');
      if (pb){
        var k = pb.getAttribute('data-pb'), sheet = document.getElementById('nxFieldSheet');
        e.stopPropagation(); // 뒤의 "바깥을 누르면 덮어 나온 메뉴 숨김" 듣기가 방금 연 메뉴·시트를 바로 닫지 않게
        if (k === 'tools'){ if (sheet) sheet.hidden = !sheet.hidden; return; }
        if (sheet) sheet.hidden = true;
        if (k === 'menu'){ if (typeof nxSideMenuPeek_ === 'function'){ var m = document.getElementById('sideMenu'); nxSideMenuPeek_(!m.classList.contains('peek')); } return; }
        if (typeof nxSideMenuPeek_ === 'function') nxSideMenuPeek_(false);
        goToView_(k);
        if (k === 'ai' && typeof window.nxAiLinkShownCase_ === 'function') window.nxAiLinkShownCase_(); // [2026-11-13 4차 52] 보던 사건 잇기
        return;
      }
      var more = e.target.closest && e.target.closest('#sideMenuMoreBtn');
      if (more){
        e.stopPropagation();
        var sm = document.getElementById('sideMenu'); var on = !sm.classList.contains('show-more');
        sm.classList.toggle('show-more', on); (more.querySelector('.mi-label') || more).textContent = on ? '간단히' : '더 보기';
        try { localStorage.setItem('nx_menu_more', on ? '1' : '0'); } catch (er) {}
        return;
      }
      var sheet2 = document.getElementById('nxFieldSheet');
      if (sheet2 && !sheet2.hidden && !(e.target.closest && e.target.closest('#nxFieldSheet, #nxPhoneBar'))) sheet2.hidden = true;
    }, true);
    try { if (localStorage.getItem('nx_menu_more') === '1'){ var sm0 = document.getElementById('sideMenu'); sm0.classList.add('show-more'); var mb = document.getElementById('sideMenuMoreBtn'); if (mb) (mb.querySelector('.mi-label') || mb).textContent = '간단히'; } } catch (e) {}
    document.addEventListener('nx-layout-change', function(){ nxPhoneBarSync_(); });
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ nxPhoneBarSync_(); }); else setTimeout(nxPhoneBarSync_, 0);
  })();
  var NX_FONT_KEY_ = 'nx_font_zoom';
  function nxFontZoomSaved_(){ var v = parseInt(nxLs_(NX_FONT_KEY_), 10); return (v >= 80 && v <= 150) ? v : 0; }
  function nxFontZoomDefault_(){ var st = window.nxLayout || nxLayoutStage_(); if (st === 'tablet') return 115; if (st === 'phone' && !window.nxCover) return 110; return 100; }
  function nxFontZoomGet_(){ return nxFontZoomSaved_() || nxFontZoomDefault_(); }
  function nxFontZoomApply_(){ try { document.documentElement.style.setProperty('--nx-font-zoom', String(nxFontZoomGet_() / 100)); } catch (e) {} }
  function nxFontZoomSet_(pct){
    if (pct === null || pct === undefined || pct === ''){ try { localStorage.removeItem(NX_FONT_KEY_); } catch (e) {} }
    else { var v = Math.round(Number(pct) / 5) * 5; if (!(v >= 80)) v = 80; if (v > 150) v = 150; nxLs_(NX_FONT_KEY_, String(v)); }
    nxFontZoomApply_();
  }
  function nxIsDark_(){ return document.documentElement.classList.contains('nx-dark'); }
  (function(){
    var saved = nxLs_(NX_DARK_KEY_);
    var prefersDark = false;
    try{ prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){}
    nxApplyDark_(saved === null ? prefersDark : saved === '1');
    nxApplyLayout_();
    var t = null;
    window.addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(nxApplyLayout_, 120); });
    // [2026.10.15] 접는 폰은 접고 펼칠 때 resize 알림이 늦거나 안 오는 경우가 있어(커버화면에 원래 화면이 남음),
    // 화면이 다시 보일 때와 1.5초마다 창 크기가 바뀌었는지 직접 확인한다(크기 비교만 — 바뀌었을 때만 배치 다시 계산).
    var lastSize = window.innerWidth + 'x' + window.innerHeight;
    function nxCheckSize_(){
      var s = window.innerWidth + 'x' + window.innerHeight;
      if (s !== lastSize){ lastSize = s; nxApplyLayout_(); }
    }
    // 기종명(안드로이드 크롬만 알려 줌) — 받으면 커버화면 판정을 다시 한다(nxIsCoverScreen_)
    try {
      if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues){

  // 맨 위에 "n-xxxx.script.googleusercontent.com에 삽입된 페이지 내용:" 같은 불필요한 안내를
  // 강제로 붙인다 — 이건 페이지 코드로는 절대 없앨 수 없는 브라우저 자체 보안 표시라, 네이티브
  // 대화상자 자체를 안 쓰고 화면 안에 직접 그리는 커스텀 대화상자로 전부 바꾼다.
  function nxDialog_(opts){
    return new Promise(function(resolve){
      var old = document.getElementById('nxDialogOverlay');
      if (old) old.remove();
      var overlay = document.createElement('div');
      overlay.id = 'nxDialogOverlay';
      overlay.className = 'modal-overlay';
      overlay.style.zIndex = '9999';
      var btnsHtml = opts.buttons.map(function(b, i){
        return '<button type="button" class="' + (b.className || 'btn') + '" data-nx-val="' + i + '">' + escapeHtml(b.label) + '</button>';
      }).join(' ');
      overlay.innerHTML =
        '<div class="modal-panel" style="width:min(360px, 92vw);">' +
          '<div class="modal-head"><span>' + escapeHtml(opts.title || '안내') + '</span></div>' +
          '<div class="modal-body">' +
            '<div style="white-space:pre-wrap; font-size:13.5px; line-height:1.5; color:var(--ink);">' + escapeHtml(opts.message || '') + '</div>' +
            // [2026.10.18] opts.stack — 사건 고르기처럼 긴 버튼이 여러 개면 한 줄로 넘치지 않게 세로로 쌓는다(기본은 예전 그대로)
            '<div style="display:flex; ' + (opts.stack ? 'flex-direction:column; align-items:stretch; max-height:55vh; overflow-y:auto;' : 'justify-content:flex-end;') + ' gap:8px; margin-top:14px;">' + btnsHtml + '</div>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);
      var finish = function(val){
        document.removeEventListener('keydown', onKey);
        overlay.remove();
        resolve(val);
      };
      overlay.querySelectorAll('[data-nx-val]').forEach(function(btn){
        btn.addEventListener('click', function(){ finish(opts.buttons[Number(btn.getAttribute('data-nx-val'))].value); });
      });
      // [2026.09.16 버그수정] 세무사님 전수검사 지적 — 앱 전체(저장/취소 쌍 12곳 전수 확인)가
      // 예외 없이 "저장·확인(주된 동작)이 왼쪽, 취소가 오른쪽" 순서인데, 정작 이 공용
      // 대화상자만 반대(취소가 왼쪽)로 만들어져 있었다. 버튼 배열의 "화면에 놓이는 순서"와
      // "Enter/Esc가 어떤 값을 돌려줄지"를 분리해서(primary/isCancel 플래그), 배열 순서를
      // 자유롭게 바꿔도 키보드 동작은 항상 Enter=주된 동작·Esc=취소로 고정되게 한다.
      var primaryIdx = opts.buttons.findIndex(function(b){ return b.primary; });
      if (primaryIdx === -1) primaryIdx = opts.buttons.length - 1;
      var cancelIdx = opts.buttons.findIndex(function(b){ return b.isCancel; });
      if (cancelIdx === -1) cancelIdx = 0;
      var onKey = function(e){
        if (e.key === 'Enter') finish(opts.buttons[primaryIdx].value);
        else if (e.key === 'Escape') finish(opts.buttons[cancelIdx].value);
      };
      document.addEventListener('keydown', onKey);
      var primaryBtn = overlay.querySelector('[data-nx-val="' + primaryIdx + '"]');
      if (primaryBtn) primaryBtn.focus();
    });
  }
  // 기존 네이티브 alert()과 같은 자리에 그대로 쓰도록 이름을 맞춘다.
  function nxAlert_(message, title){
    return nxDialog_({ title: title || '안내', message: message, buttons: [{ label: '확인', value: true, className: 'save-btn', primary: true }] });
  }
  // 네이티브 confirm()과 달리 Promise<boolean>을 돌려준다 — 호출부는
  // `if (!confirm(x)) return;` 대신 `nxConfirm_(x).then(function(ok){ if(!ok) return; ... })`로 바꿔야 한다.
  // 앱 전체의 "저장이 왼쪽·취소가 오른쪽" 관례에 맞춰 확인을 먼저 놓는다.
  function nxConfirm_(message, title){
    return nxDialog_({ title: title || '확인', message: message, buttons: [
      { label: '확인', value: true, className: 'save-btn', primary: true },
      { label: '취소', value: false, className: 'ghost-btn', isCancel: true }
    ] });
  }
  // [2026.11.01] 기본서(닐슨 4 일관성) — 확인 창은 이 화면 창(nxConfirm_) 하나로. 「확인하면 이어서 하던 일」이 바로 답을 받아야 하는 곳은
  //  처음 누를 땐 창만 띄우고(false), [확인]을 누르면 같은 단추를 한 번 더 눌러 준다(그때는 true) — 부르는 쪽 코드를 바꾸지 않아도 된다.
  var nxGateOk_ = {};
  function nxConfirmGate_(key, message, title){
    if (nxGateOk_[key]){ delete nxGateOk_[key]; return true; }
    var b = nxPressed_ && Date.now() - nxPressed_.at < 1500 ? nxPressed_.el : null;
    if (!b) return window.confirm(message); // 단추 없이 불린 경우(드묾)만 브라우저 창
    nxConfirm_(message, title).then(function(ok){ if (ok && b.isConnected){ nxGateOk_[key] = true; b.click(); delete nxGateOk_[key]; } });
    return false;
  }
  // 네이티브 prompt()도 같은 이유(iframe 안내문구)로 못 쓴다 — 입력칸이 있는 커스텀 대화상자로
  // 대체. 네이티브 prompt()과 달리 Promise<string|null>을 돌려준다(취소=null).
  function nxPrompt_(message, defaultValue, title){
    return new Promise(function(resolve){
      var old = document.getElementById('nxDialogOverlay');
      if (old) old.remove();
      var overlay = document.createElement('div');
      overlay.id = 'nxDialogOverlay';
      overlay.className = 'modal-overlay';
      overlay.style.zIndex = '9999';
      overlay.innerHTML =
        '<div class="modal-panel" style="width:min(420px, 92vw);">' +
          '<div class="modal-head"><span>' + escapeHtml(title || '입력') + '</span></div>' +
          '<div class="modal-body">' +
            '<div style="white-space:pre-wrap; font-size:13.5px; line-height:1.5; color:var(--ink); margin-bottom:8px;">' + escapeHtml(message || '') + '</div>' +
            '<input type="text" id="nxPromptInput" style="width:100%; box-sizing:border-box;">' +
            '<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">' +
              '<button type="button" class="save-btn" data-nx-val="ok">확인</button>' +
              '<button type="button" class="ghost-btn" data-nx-val="cancel">취소</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);
      var input = overlay.querySelector('#nxPromptInput');
      input.value = defaultValue || '';
      var finish = function(val){
        document.removeEventListener('keydown', onKey);
        overlay.remove();
        resolve(val);
      };
      overlay.querySelector('[data-nx-val="cancel"]').addEventListener('click', function(){ finish(null); });
      overlay.querySelector('[data-nx-val="ok"]').addEventListener('click', function(){ finish(input.value); });
      var onKey = function(e){
        if (e.key === 'Enter') finish(input.value);
        else if (e.key === 'Escape') finish(null);
      };
      document.addEventListener('keydown', onKey);
      input.focus();
      input.select();
    });
  }

  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('shown');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove('shown'); }, 2200);
  }
  // work-manage.js/client-manage.js 이식본이 그대로 부르는 이름(showToast(msg, type))으로도 동작하게.
  function showToast(msg, type){ toast(msg); }
  // [2026.11.02] 꺼 둔 단추 대신 — 누를 수 없는 단추는 aria-disabled + data-why로 두고, 누르면 무엇이 먼저인지 알려 준다(GOV.UK: 꺼진 단추는 왜 안 되는지 알 수 없다)
  document.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('[aria-disabled="true"]');
    if (!b) return;
    e.preventDefault(); e.stopImmediatePropagation();
    toast(b.getAttribute('data-why') || '지금은 누를 수 없습니다');
  }, true);

  // [2026.11.01] 기본서(W3C 2.1.1·4.1.2·2.4.3) — 화면마다 따로 고치지 않고 한 곳에서: 그려지는 모든 화면에 자동으로 붙는다
  //  ① 누름 상자(onclick 붙은 div·줄, 메뉴 줄, 사건 줄)는 Tab으로 닿고 Enter·Space로 누른다
  //  ② 탭 줄은 탭 줄·탭·지금 탭을 알리고, ←→로 옆 탭으로 간다
  //  ③ 덮는 창은 창이라고 알리고, 열리면 창 안으로 가고, Esc로 닫고, 닫히면 누르던 자리로 돌아온다
  //  ④ 이름표 없는 칸은 바로 앞 글(또는 안내 말)을 이름으로 잇는다
  (function(){
    var PRESS_ = '.menu-item[data-view], .log-entry, div[onclick], span[onclick], li[onclick], td[onclick], tr[onclick], label[onclick], [role="button"]:not(button):not(a):not(input)';
    var TABBAR_ = '.nx-tabbar, .taxcalc-tabs, .taxcalc-subtabs, .taxcalc-tier-tabs';
    var TAB_ = '.nx-tab, .taxcalc-tab, .taxcalc-subtab, .tp-mode';
    var OVER_ = '.modal-overlay, .nxai-overlay, .statute-modal-backdrop';
    var FOCUSABLE_ = 'button:not([disabled]), [href], input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
    function shown_(el){ return !!(el && el.isConnected && el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden'); }
    function press_(root){
      root.querySelectorAll(PRESS_).forEach(function(el){
        if (el.hasAttribute('tabindex')) return;
        el.setAttribute('tabindex', '0');
        if (!el.hasAttribute('role') && !/^(TD|TR)$/.test(el.tagName)) el.setAttribute('role', 'button');
        // [2026-11-13 3차 3] 이렇게 단추가 된 줄(사건 카드·목록 줄)이 이름 없는 단추로 읽혔다 — 보이는 글을 이름으로(이미 이름이 있으면 그대로)
        if (!el.hasAttribute('aria-label') && !el.hasAttribute('aria-labelledby')) { var nm = String(el.innerText || el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 80); if (nm) el.setAttribute('aria-label', nm); }

    function tabs_(root){
      root.querySelectorAll(TABBAR_).forEach(function(bar){
        if (bar.getAttribute('role') !== 'tablist') bar.setAttribute('role', 'tablist');
        Array.prototype.forEach.call(bar.children, function(t){
          if (!t.matches || !t.matches(TAB_)) return;
          if (t.getAttribute('role') !== 'tab') t.setAttribute('role', 'tab');
          var on = t.classList.contains('active') || t.classList.contains('on') ? 'true' : 'false';
          if (t.getAttribute('aria-selected') !== on) t.setAttribute('aria-selected', on);
        });
      });
    }
    function label_(root){
      root.querySelectorAll('input:not([type="hidden"]):not([type="button"]):not([type="submit"]), select, textarea').forEach(function(c){
        if (c._nxL) return;
        c._nxL = true;
        // 날짜·금액 칸은 휴대폰에서 숫자 자판이 뜨게(이 앱 날짜 칸은 숫자만 쳐도 2026-01-31로 맞춰 주는 글 칸이라 달력 칸으로 바꾸지 않는다)
        if (c.tagName === 'INPUT' && (c.type === 'text' || !c.getAttribute('type')) && !c.hasAttribute('inputmode')){
          var ph_ = c.getAttribute('placeholder') || '', hint_ = (c.id || '') + ' ' + (c.getAttribute('aria-label') || '') + ' ' + (c.title || '');
          if (/\btaxcalc-(date|money)\b/.test(c.className) || /^Y{4}/.test(ph_) || (/Amount|금액|\(원\)/i.test(hint_) && !/억|만/.test(ph_))) c.setAttribute('inputmode', 'numeric');
          if (/\btaxcalc-date\b/.test(c.className) && !c.title) c.title = '날짜 — 숫자만 치면 2026-01-31처럼 맞춰집니다';
        }
        if (c.hasAttribute('aria-label') || c.hasAttribute('aria-labelledby')) return;
        if (c.closest('label')) return;
        if (c.id && document.querySelector('label[for="' + (window.CSS && CSS.escape ? CSS.escape(c.id) : c.id) + '"]')) return;
        var name = '';
        var p = c.previousElementSibling;
        if (p && (/^(SPAN|B|STRONG|SMALL|DIV)$/.test(p.tagName) || (p.tagName === 'LABEL' && !p.htmlFor)) && !p.querySelector('input,select,textarea,button')) name = (p.textContent || '').trim();
        // 체크칸·고르기 단추는 이름표가 칸 뒤에 온다
        var nx = c.nextElementSibling;
        if (!name && (c.type === 'checkbox' || c.type === 'radio') && nx && nx.tagName === 'LABEL' && !nx.htmlFor) name = (nx.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 60);
        if (!name || name.length > 60) name = c.getAttribute('title') || c.getAttribute('placeholder') || '';

    var lastFocus_ = [];
    function dialogs_(root){
      var list = root.matches && root.matches(OVER_) ? [root] : root.querySelectorAll(OVER_);
      Array.prototype.forEach.call(list, function(ov){
        var panel = ov.querySelector('.modal-panel, .nxai-modal, .scan-modal-panel') || ov;
        if (panel.getAttribute('role') !== 'dialog'){
          panel.setAttribute('role', 'dialog');
          panel.setAttribute('aria-modal', 'true');
          var head = panel.querySelector('.modal-head span, .modal-head, h3, h2');

          lastFocus_.push(document.activeElement);
          if (!ov.contains(document.activeElement)){

    function later_(){
      if (queued_) return; queued_ = true;
      // 그리기 타이머(requestAnimationFrame)는 뒤에 깔린 탭에서 멈추므로 짧은 시간 타이머로 묶는다
      setTimeout(function(){
        queued_ = false;
        all_(document);
        // 닫힌(지워지거나 숨은) 창은 누르던 자리로 돌려보낸다
        document.querySelectorAll(OVER_).forEach(function(ov){ if (ov._nxOpened && !shown_(ov)){ ov._nxOpened = false; back_(); } });
        if (closedGone_){ closedGone_ = false; back_(); }

    var closedGone_ = false;
    var mo = new MutationObserver(function(muts){
      for (var i = 0; i < muts.length; i++){
        var m = muts[i];
        for (var j = 0; j < m.removedNodes.length; j++){ var n = m.removedNodes[j]; if (n._nxOpened){ n._nxOpened = false; closedGone_ = true; } }

    });

      all_(document);
      mo.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'style', 'hidden'] });
    }

    document.addEventListener('keydown', function(e){
      var t = e.target;
      // ① 누름 상자: Enter·Space
      if ((e.key === 'Enter' || e.key === ' ') && t && t.matches && t.matches(PRESS_) && !/^(INPUT|SELECT|TEXTAREA|BUTTON|A)$/.test(t.tagName)){
        e.preventDefault(); t.click(); return;

      // ② 탭 줄: ←→ Home End
      if (t && t.matches && t.matches(TAB_) && /^(ArrowLeft|ArrowRight|Home|End)$/.test(e.key)){
        var bar = t.closest(TABBAR_); if (!bar) return;
        var ts = Array.prototype.filter.call(bar.querySelectorAll(TAB_), shown_);
        var i = ts.indexOf(t); if (i < 0) return;
        var k = e.key === 'Home' ? 0 : e.key === 'End' ? ts.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + ts.length) % ts.length;
        e.preventDefault(); ts[k].focus(); ts[k].click(); return;
      }
      // ③ 덮는 창: Esc로 닫기(공용 확인·입력 창은 제 손으로 닫는다), Tab은 창 안에서만 돈다
      if (e.key === 'Escape' || e.key === 'Tab'){
        var ovs = Array.prototype.filter.call(document.querySelectorAll(OVER_), shown_);
        var ov = ovs[ovs.length - 1]; if (!ov || ov.id === 'nxDialogOverlay') return;
        if (e.key === 'Escape'){
          var x = ov.querySelector('.modal-close, [data-close], .nxai-close');
          if (!x) x = Array.prototype.filter.call(ov.querySelectorAll('button'), function(b){ return /^(닫기|취소|✕|×)$/.test((b.textContent || '').trim()); })[0];
          if (x){ e.preventDefault(); x.click(); }
          return;
        }
        var fs = Array.prototype.filter.call(ov.querySelectorAll(FOCUSABLE_), shown_);
        if (!fs.length) return;
        if (e.shiftKey && (document.activeElement === fs[0] || !ov.contains(document.activeElement))){ e.preventDefault(); fs[fs.length - 1].focus(); }
        else if (!e.shiftKey && (document.activeElement === fs[fs.length - 1] || !ov.contains(document.activeElement))){ e.preventDefault(); fs[0].focus(); }
      }
    }, true);
  })();

  function escapeHtml(s){
    if (s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // [2026.09 리팩토링] "사건 목록으로 <option> 만들기"가 lawsearch/casehandling/docs/taxcalc/
  // reportwriter 5개 화면에 거의 똑같이(고객명순 정렬 + "고객명 · 사건명 (상태)") 복사돼 있어서,
  // 표시 형식을 하나 바꾸려면 5곳을 다 찾아 고쳐야 했다 — 공용 함수로 통합. 동작(정렬 기준,
  // 표시 문구)은 기존 그대로이고, 화면마다 달랐던 placeholder 문구·상태표시 여부·선택값만
  // opts로 넘겨 예전과 똑같이 보이게 한다.
  // [2026.09.16 버그수정] 세무사님 지적 — 사건명 명명규칙이 이미 "고객명(납세자)_세목_
  // 업무유형"이라 고객명을 항상 포함하는데, 이 콤보 라벨이 "고객명 · 사건명"으로 고객명을
  // 또 앞에 붙여서 중복 표시하고 있었다. 사건명만 보여준다(정렬 기준은 그대로 고객명 순 —
  // 같은 고객의 여러 사건이 목록에서 붙어 보이는 게 여전히 편하므로).
  function buildCaseOptionsHtml_(cases, opts){
    opts = opts || {};
    var placeholder = opts.placeholder !== undefined ? opts.placeholder : '사건 선택';
    var showStatus = opts.showStatus !== false;
    var selectedId = opts.selectedId;
    return '<option value="">' + escapeHtml(placeholder) + '</option>' +

  var nxLastCaseId_ = '';

  function nxScreenCaseIdOf_(v){
    try {

  function nxFollowCaseOnMenu_(view){
    var old = document.getElementById('nxCaseFollowBar');
    if (old) old.remove();
    if (!nxLastCaseId_ || NX_CASE_FOLLOW_VIEWS_.indexOf(view) === -1) return;
    var lastId = nxLastCaseId_;
    var cur = nxScreenCaseIdOf_(view);
    if (cur === lastId) return;
    if (!cur && (view === 'casehandling' || view === 'ledger' || view === 'lawsearch')){ nxCaseJump_(view, lastId); return; }
    if (nxCbIsCaseView_(view)) return; // [2026.11.01] 사건 작업공간 — 머리줄이 지금 사건을 보이고 거기서 바꾸므로 노란 띠는 띄우지 않는다
    callGas('work_get_cases', {}).then(function(res){
      var cases = (res && res.cases) || [];
      var nameOf = function(id){ var c = cases.filter(function(x){ return x.id === id; })[0]; return c ? (c.사건명 || c.고객명 || '') : ''; };
      var lastName = nameOf(lastId);

      var viewEl = document.getElementById('view-' + view);
      if (!viewEl || !viewEl.classList.contains('active')) return; // 그 사이 다른 화면으로 옮겼음
      if (nxScreenCaseIdOf_(view) === lastId) return; // 그 사이 같은 사건이 열렸음
      var curNow = nxScreenCaseIdOf_(view), curName = curNow ? nameOf(curNow) : '';

      bar.style.cssText = 'display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 10px; padding:8px 12px; border:1px solid var(--gold, #C8A244); border-radius:8px; background:var(--gold-light, #fdf6e3); font-size:13px;';
      bar.innerHTML = '<span>' + (curName ? '이 화면은 지금 「' + escapeHtml(curName) + '」 사건입니다. ' : '이 화면은 사건이 골라져 있지 않습니다. ') +
        '방금 보던 「<b>' + escapeHtml(lastName) + '</b>」 사건으로 열까요?</span>' +
        '<button type="button" class="save-btn sm" data-follow="go">「' + escapeHtml(lastName) + '」로 열기</button>' +
        '<button type="button" class="ghost-btn sm" data-follow="stay">' + (curName ? '그대로 두기' : '닫기') + '</button>';
      bar.addEventListener('click', function(e){
        var b = e.target.closest('[data-follow]');

        if (b.getAttribute('data-follow') === 'go') nxCaseJump_(view, lastId);

  // [2026.09] "아이콘+버튼명" 툴바(.tb-row/.scan-row)가 좁아지면 1단계로 아이콘부터 숨기고
  // 2단계로 글자까지 숨겨 자리를 줄이는 로직 — "폭 숫자" 기준(container query)으로 처음
  // 시도했다가, flex-wrap:wrap 때문에 컨테이너 자체는 안 좁아지고 버튼만 2줄로 줄바꿈돼버려서
  // 전혀 동작하지 않는 문제가 있었다("생략 단계로 안 넘어가고 바로 2줄") — 그래서 폭이 아니라
  // "한 줄에 실제로 다 들어가는지"를 직접 재는 방식으로 바꿨다. flex-wrap을 잠깐 nowrap으로
  // 바꿔서 줄바꿈 없이 필요한 실제 너비(scrollWidth)를 재고, 원래 값으로 되돌린다.
  function tbFitsOneLine_(el){
    var prevWrap = el.style.flexWrap;
    el.style.flexWrap = 'nowrap';
    var fits = el.scrollWidth <= el.clientWidth + 1;
    el.style.flexWrap = prevWrap;
    return fits;
  }
  function tbCollapseApply_(el){
    // [2026.09 버그수정] 실사용 감사 지적 — 그래도 안 맞으면 tb-tx-off를 tb-ic-off "위에"
    // 추가만 해서, 화면이 아주 좁을 때 아이콘도 글자도 없는 완전히 빈 버튼(테두리만 남음)이
    // 됐다. 최종 단계는 텍스트 대신 아이콘만 남기는 쪽(아이콘 전용)이 훨씬 알아보기 쉽다.
    el.classList.remove('tb-ic-off', 'tb-tx-off');
    if (tbFitsOneLine_(el)) return;
    el.classList.add('tb-ic-off');
    if (tbFitsOneLine_(el)) return;
    el.classList.remove('tb-ic-off');
    el.classList.add('tb-tx-off');
  }
  var _tbMutationObserver_ = null;
  // tbCollapseApply_가 style(flex-wrap 측정용)·class(tb-ic-off 등)를 직접 건드리는데, 그
  // 변화를 관찰 대상(#centerWork) 안에서 일으키므로 아무 조치 없이 두면 그 변화가 다시
  // MutationObserver를 깨워 tbCollapseAll_을 또 부르는 무한루프가 된다 — 재는 동안만 관찰을
  // 잠깐 꺼둔다.
  function tbCollapseAll_(){
    if (_tbMutationObserver_) _tbMutationObserver_.disconnect();
    document.querySelectorAll('.tb-row, .scan-row').forEach(tbCollapseApply_);
    if (_tbMutationObserver_) _tbMutationObserver_.observe(document.getElementById('centerWork'), { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
  }
  var _tbCollapseTimer_ = null;
  function tbCollapseAllDebounced_(){
    clearTimeout(_tbCollapseTimer_);
    _tbCollapseTimer_ = setTimeout(tbCollapseAll_, 30);
  }
  function tbCollapseInit_(){
    if (tbCollapseInit_._done) return;
    tbCollapseInit_._done = true;
    window.addEventListener('resize', tbCollapseAllDebounced_);
    // 창 크기 자체는 그대로여도 오른쪽 AI사이드바를 열고 닫으면 작업영역 폭이 바뀌는데,
    // 이건 window resize가 아니라서 위 리스너로는 안 잡힌다 — #centerWork 자체의 렌더링
    // 크기 변화를 직접 관찰한다.
    if (typeof ResizeObserver !== 'undefined'){
      new ResizeObserver(tbCollapseAllDebounced_).observe(document.getElementById('centerWork'));
    }
    // 각 화면의 렌더 함수가 innerHTML로 툴바를 새로 그릴 때마다(사건 전환, 목록 갱신 등)
    // 마다 일일이 호출을 심는 대신, DOM 변화 자체를 관찰해서 한 곳에서 처리한다.
    // childList(내용이 새로 그려짐)뿐 아니라 style/class 변화(예: 선택바가 display:none→
    // flex로 나타나는 경우)도 같이 봐야, 처음엔 숨겨져 있다가 나중에 보이는 툴바도 놓치지 않는다.
    if (typeof MutationObserver !== 'undefined'){
      _tbMutationObserver_ = new MutationObserver(tbCollapseAllDebounced_);
      _tbMutationObserver_.observe(document.getElementById('centerWork'), { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
    }
    tbCollapseAll_();
  }

      //  보던 곳이 대시보드면 이어 갈 데가 없어 띄우지 않고, 11-14 전에 남은 Claude 미리보기 창 흔적(기기 칸 「…|Claude…」)도 띄우지 않는다.

        + '<button type="button" class="save-btn sm" data-place="go">이어 열기</button><button type="button" class="ghost-btn sm" data-place="x">닫기</button>';
      bar.addEventListener('click', function(e){

  // 다른 화면의 버튼에서 메뉴를 직접 클릭한 것처럼 화면을 전환할 때 씀(예: 작업관리 사건
  // 상세의 "이 사건 처리하기" 버튼 → 사건처리 화면으로 이동). showView만 부르면 좌측 메뉴의
  // active 표시가 안 바뀌므로 같이 처리한다.
  function goToView_(name){

    document.querySelectorAll('.menu-item[data-view]').forEach(function(i){

    });

  // [2026.10.15] 커버화면(nxApplyLayout_의 lay-cover) — 약식 대시보드와 AI 두 화면만 아래 버튼으로 오간다.
  // 커버화면으로 바뀌는 순간 그 둘이 아닌 화면을 보고 있었으면 요약(대시보드)으로 옮긴다. 펼치면 원래 화면 그대로.
  function nxCoverActiveView_(){
    var v = document.querySelector('#centerWork > .view.active');
    return v ? v.id.replace(/^view-/, '') : '';
  }
  function nxCoverSync_(){
    if (typeof nxCmRecDot_ === 'function') nxCmRecDot_(); // 녹음 중 표시(consultmemo.html)
    // [2026.11.12 전수조사] 예전 커버 화면 아래 단추 줄(nxCoverBar)은 화면에서 없어져 그 단추 표시·누르기 처리를 걷음(녹음 표시만 남김)
  }
  function nxCoverOnEnter_(cover){
    var root = document.getElementById('appRoot');
    if (cover && root && root.classList.contains('shown')){

    }

  }

  // [2026.10.15] 커버화면 밀기(세무사님 제안) — 위로 밀면 요약 ↔ AI, AI 화면에서 왼쪽으로 밀면 음성 ↔ 문자(aichat.html).
  // 요약은 목록을 위아래로 넘기므로, 넘길 것이 남아 있으면 넘기기를 우선하고 끝(맨 위·맨 아래)에서 더 밀 때만 바꾼다.
  // AI 화면의 말하기 버튼은 누르고 있는 동안 듣는데, 누른 채 크게 밀면 말하기가 아니라 밀기로 본다(aichat.html 쪽에서 듣기 취소).
  var nxCoverBackView_ = 'dashboard';
  (function(){
    var sx = 0, sy = 0, st = 0, edgeTop = false, edgeBottom = false, on = false;
    function scroller_(el, root){
      for (var n = el; n && n !== root.parentNode; n = n.parentNode){
        if (n.nodeType !== 1) continue;
        var oy = getComputedStyle(n).overflowY;
        if ((oy === 'auto' || oy === 'scroll') && n.scrollHeight > n.clientHeight + 2) return n;
      }
      return null;
    }
    document.addEventListener('touchstart', function(e){
      on = !!window.nxCover && e.touches.length === 1 && !!(e.target.closest && e.target.closest('#centerWork'));
      if (!on) return;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
      var view = document.querySelector('#centerWork > .view.active');
      var sc = view ? scroller_(e.target, view) : null;
      edgeTop = !sc || sc.scrollTop <= 1;
      edgeBottom = !sc || sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 2;
    }, { passive: true });
    document.addEventListener('touchend', function(e){
      if (!on || !window.nxCover) return;
      on = false;
      var t = e.changedTouches && e.changedTouches[0]; if (!t) return;
      var dx = t.clientX - sx, dy = t.clientY - sy, dt = Date.now() - st;
      if (dt > 900) return;
      var view = nxCoverActiveView_();
      // [세무사님 정정] 한 방향만 토글 — 위로 밀기: 요약 ↔ AI / 왼쪽으로 밀기(AI 화면): 음성 ↔ 문자.
      // 아래로 밀기: 상담 녹음 화면(consultmemo.html) — 거기서 위로 밀면 원래 화면으로. 오른쪽 밀기: 고객 카드.
      if (dy < -60 && Math.abs(dy) > Math.abs(dx) * 1.5){
        if (view === 'consult'){ goToView_(nxCoverBackView_ || 'dashboard'); nxCoverSync_(); return; }
        if (view !== 'ai' && !edgeBottom) return; // 요약은 넘길 목록이 남았으면 넘기기 우선
        goToView_(view === 'ai' ? 'dashboard' : 'ai');
        nxCoverSync_();
      } else if (dy > 60 && Math.abs(dy) > Math.abs(dx) * 1.5 && view !== 'consult'){
        if (view !== 'ai' && !edgeTop) return; // 요약은 맨 위에서 더 끌어내릴 때만
        nxCoverBackView_ = view;
        goToView_('consult');
        nxCoverSync_();
      } else if (dx < -60 && Math.abs(dx) > Math.abs(dy) * 1.5){
        if (view === 'clientcard'){ goToView_(nxCoverBackView_ || 'dashboard'); nxCoverSync_(); return; } // 고객 카드에서 왼쪽 = 돌아가기
        if (view === 'ai' && typeof nxAiTalkToggleMode_ === 'function') nxAiTalkToggleMode_();
      } else if (dx > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && view !== 'clientcard'){
        // 오른쪽으로 밀기: 고객 카드(clientcard.html) — 거기서 왼쪽으로 밀면 원래 화면으로
        nxCoverBackView_ = view;
        goToView_('clientcard');
        nxCoverSync_();
      }
    }, { passive: true });
  })();

  // [2026.10.13] 사건 관련 화면 바로가기 — "처리개요에서 증빙관리로 옮겨간 다음에는 처리개요로만 갈 수 있고
  // 세액계산이나 연관작업으로 옮겨갈 수 없다"는 지적. 사건을 다루는 모든 화면 머리에 같은 콤보박스를 둬,
  // 지금 사건을 그대로 들고 어느 관련 화면으로든 바로 간다. 각 화면의 "그 사건으로 열기" 함수(goTo*_)를 그대로 쓴다
  // (AI 탭 nxAiOpenJobView_와 같은 동작).
  // [2026.11.01] 세무사님 "<탭 이동>이라고 안내메시지를 변경하고, 보여지는 데이타도 아이콘은 없애라" — 상자 폭이 보일 글자(화면 이름) 길이만큼만
  // [2026.11.01] 기본서(닐슨 4 일관성) — 메뉴·사건 작업 탭과 같은 이름으로
  var NX_CASE_VIEWS_ = [['casehandling', '개요'], ['ledger', '사실(장부)'], ['workmanage', '사건 목록'], ['docs', '서류'], ['taxcalc', '계산'],
    ['print', '세액인쇄'], ['reportwriter', '보고서'], ['lawsearch', '근거(법령)'], ['reports', '고객 열람']]; // 열람관리: 탭연결 9번
  function nxCaseJump_(view, caseId){
    NX_CB_.lawFree = false; // [2026.11.01] 사건을 들고 법령정보로 가면 작업공간의 근거 탭
    if (!caseId){ showToast('먼저 위에서 사건을 골라 주세요.'); return; }
    if (view === 'casehandling' && typeof goToCaseHandling_ === 'function'){ goToView_('casehandling'); goToCaseHandling_(caseId); return; }
    if (view === 'ledger' && typeof goToLedger_ === 'function'){ goToLedger_(caseId); return; } // [2026.10.31] 사실(장부) 탭
    if (view === 'workmanage' && typeof goToWorkManage_ === 'function'){ goToWorkManage_(caseId); return; }
    if (view === 'taxcalc' && typeof goToTaxCalc_ === 'function'){ goToTaxCalc_(caseId); return; }
    if (view === 'print' && typeof goToTaxCalc_ === 'function'){ goToTaxCalc_(caseId); setTimeout(function(){ goToView_('print'); }, 600); return; }
    if (view === 'reportwriter' && typeof goToReportWriter_ === 'function'){ goToReportWriter_(caseId); return; }
    if (view === 'lawsearch' && typeof goToLawSearch_ === 'function'){ goToLawSearch_(caseId); return; }
    if (view === 'reports' && typeof goToReports_ === 'function'){ goToReports_(caseId); return; } // 탭연결 9번 — 그 사건을 고른 채 열람관리 등록 칸을 연다
    if (view === 'docs'){
      // 증빙확보는 사건 폴더ID로 연다(처리개요의 📁 증빙확보 버튼과 같은 방식 — 기본위치 이동과 겹치지 않게 docsLoaded 먼저)
      // [2026.10.18 탭연결 1번] 폴더가 없는 상담 사건이면 막다른 안내 대신 업무유형을 물어 폴더를 만든 뒤 연다(nxOpenCaseDocs_)
      callGas('work_get_cases', {}).then(function(res){
        var c = ((res && res.cases) || []).filter(function(x){ return x.id === caseId; })[0];
        if (!c){ showToast('사건을 찾지 못했습니다 — 목록을 새로고침해 주세요.'); return; }
        nxOpenCaseDocs_(c);
      }).catch(function(){ showToast('사건 정보를 불러오지 못했습니다 — 잠시 후 다시 시도해 주세요.'); });
      return;
    }
    goToView_(view);

  // [2026.10.18 탭연결 1번] 세무사님 지시 — "상담사건이 증빙을 올리려면 안내를 하면서 자동으로 유형을 물어서 수정되도록 해야 한다."
  // 상담 사건은 파일이 없는 사건이라 드라이브 폴더를 만들지 않는다(Code.js work_createCase). 그런데 증빙을 올리려는 순간
  // 그 전제가 깨지므로, 그때 업무유형(신고·자문 등)을 물어 고르면 작업관리와 똑같이 work_update_case로 업무유형을 바꾼다 —
  // 서버가 그 저장 안에서 사건명·폴더·고객창구 연결을 함께 만든다(work_updateCase). 돌려주는 값: 폴더가 생긴 최신 사건 객체
  // (취소하면 null). 폴더가 이미 있으면 묻지 않고 그대로 돌려준다.
  function nxEnsureCaseFolder_(c, purpose){
    if (!c) return Promise.resolve(null);
    if (c.폴더ID) return Promise.resolve(c);
    if (String(c.업무유형 || '') !== '상담'){
      // 상담이 아닌데 폴더가 없는 옛 사건 — 업무유형은 그대로 두고 폴더만 만든다(처리개요 고객창구 [연결]과 같은 ensure_case_folder)
      return callGas('ensure_case_folder', { id: c.id }).then(function(r){
        if (!r || r.success === false || !r.folderId){ showToast((r && r.message) || '사건 폴더를 만들지 못했습니다.'); return null; }
        c.폴더ID = r.folderId;
        return c;
      });
    }
    var opts = (typeof WORK_UPTYPE_OPTIONS_ !== 'undefined' && (WORK_UPTYPE_OPTIONS_[c.세목] || WORK_UPTYPE_OPTIONS_.transfer)) || ['신고', '자문'];
    opts = opts.filter(function(u){ return u !== '상담'; });
    var buttons = opts.map(function(u){ return { label: u, value: u, className: 'save-btn' }; });
    buttons.push({ label: '취소', value: null, className: 'ghost-btn', isCancel: true, primary: true });
    return nxDialog_({
      title: '업무유형 정하기',
      // purpose는 조사까지 붙여 받는다(예: '메모를', '문서를', '상담 녹음을') — 기본 '증빙을'
      message: '"' + (c.사건명 || '이 사건') + '"은(는) 상담 사건이라 아직 사건 폴더가 없습니다.\n\n' +
        (purpose || '증빙을') + ' 올리려면 이 사건의 업무유형을 골라 주세요. 고르면 업무유형이 바뀌고(사건명도 함께), 사건 폴더가 만들어지며 고객창구(my.netax.kr)도 연결됩니다.\n\n' +
        '· 신고 — 신고서를 작성하는 사건(법정기한 자동 계산)\n· 자문 — 검토서·보고서를 작성하는 사건',
      buttons: buttons
    }).then(function(upType){
      if (!upType) return null;
      return callGas('work_update_case', { id: c.id, 업무유형: upType, 기대수정일: c.수정일, 폴더바로: true, 이름맞춤바로: true }).then(function(res){
        if (!res || res.error || res.success === false){ showToast((res && (res.message || res.error)) || '업무유형을 바꾸지 못했습니다.'); return null; }
        Object.assign(c, res.case || {});
        if (!c.폴더ID){ showToast('업무유형은 "' + upType + '"(으)로 바꿨지만 폴더를 만들지 못했습니다 — 잠시 후 다시 시도해 주세요.'); return null; }
        showToast('업무유형을 "' + upType + '"(으)로 바꾸고 사건 폴더를 만들었습니다.');
        if (res.warning) showToast(res.warning);
        // 작업관리가 들고 있는 옛 사건 정보(업무유형·폴더 없음)를 다음에 열 때 새로 받게 한다(지금 열려 있으면 바로)
        try {
          var wmEl = document.getElementById('view-workmanage');
          if (wmEl && wmEl.classList.contains('active') && typeof loadWorkCases === 'function') loadWorkCases();
          else if (typeof workManageLoaded !== 'undefined') workManageLoaded = false;
        } catch (e) {}
        return c;
      });
    });
  }
  // 사건의 증빙확보(사건 폴더)를 연다 — 처리개요 📁 증빙확보·📝 메모, "↪ 이 사건 다른 화면", 증빙확보 사건 고르기, AI가 같이 쓴다.
  // 폴더 없는 상담 사건이면 nxEnsureCaseFolder_로 업무유형을 먼저 묻는다. onReady(c)는 폴더가 생긴 뒤 화면이 자기 정보를 고칠 때 쓴다.
  function nxOpenCaseDocs_(c, onReady){
    if (!c) return;
    var go = function(cc){
      if (typeof docsLoaded !== 'undefined') docsLoaded = true; // initDocs의 기본위치 이동과 겹치지 않게
      goToView_('docs');
      if (cc.폴더ID && typeof docsNavigateById_ === 'function') docsNavigateById_(cc.폴더ID);
    };
    if (c.폴더ID){ go(c); return; }
    // 폴더ID가 없는 옛 사건(상담 아님) 중엔 이름이 같은 폴더가 이미 있는 경우가 있어, 예전처럼 이름 경로로 먼저 찾아간다
    if (String(c.업무유형 || '') !== '상담' && typeof getCustomerRootPath_ === 'function' && typeof docsNavigate === 'function'){
      if (typeof docsLoaded !== 'undefined') docsLoaded = true;
      goToView_('docs');
      getCustomerRootPath_().then(function(basePath){ docsNavigate(basePath.concat([String(c.사건명 || '').trim()])); });
      return;
    }
    nxEnsureCaseFolder_(c).then(function(cc){
      if (!cc) return;
      if (onReady) { try { onReady(cc); } catch (e) {} }
      go(cc);
    });
  }
  // 콤보박스 만들기 — fromView(지금 화면)는 목록에서 빼고, getCaseId()로 지금 사건을 읽는다.
  // beforeLeave(go)를 주면 이동 전에 확인(예: 문서작성의 미저장 경고) 후 go()를 부른다.
  function nxCaseJumpSelect_(fromView, getCaseId, beforeLeave){
    var sel = document.createElement('select');
    sel.className = 'nx-case-jump';
    sel.title = '이 사건의 다른 화면으로 바로 이동';
    sel.innerHTML = '<option value="">탭 이동</option>' + NX_CASE_VIEWS_.filter(function(v){ return v[0] !== fromView; })
      .map(function(v){ return '<option value="' + v[0] + '">' + v[1] + '</option>'; }).join('');
    sel.addEventListener('change', function(){
      var v = sel.value; sel.value = '';
      if (!v) return;
      var id = getCaseId();
      var go = function(){ nxCaseJump_(v, id); };
      if (beforeLeave) beforeLeave(go); else go();
    });
    return sel;
  }
  // 사건 고르는 칸 바로 뒤에 한 번만 붙인다 — [2026.10.31] 세무사님 "사건콤보와 굳이 떼어 놓을 필요가 없어 보인다"(예전엔 ↩ 처리개요 단추 뒤, 그 단추는 이 상자와 같은 일이라 뺐다)
  function nxCaseJumpAttach_(afterEl, fromView, getCaseId, beforeLeave){
    if (!afterEl || !afterEl.parentNode) return;
    try { nxLedgerStripAttach_(afterEl, fromView, getCaseId); } catch (e) {} // [2026.10.29] 사건 화면마다 맨 위 사건 장부 띠(사건 고르는 줄 바로 아래)
    var next = afterEl.nextElementSibling;
    if (next && next.classList && next.classList.contains('nx-case-jump')) return;
    afterEl.parentNode.insertBefore(nxCaseJumpSelect_(fromView, getCaseId, beforeLeave), afterEl.nextSibling);

  // [2026.09 신규] 사용자메뉴얼 — 화면 오른쪽 아래 ❓ 버튼을 누르면 "지금 보고 있던 화면"에

  // ============================================================
  // [2026.10.28] ✍ 개선 건의 — 어느 화면에서든 수시로. 세무사님 원문: "하던 창을 닫고 작성해야 하는데, 작업중에 그렇게 할 수는
  // 없지 않은가? 나중에 기재하려고 하다 보면 잊어버리거나 실상을 제대로 적을 수가 없게 된다. 화면 어디서라도 수시로 기재할 수 있도록 하자"

  // "실상"이 남도록 지금 탭·사건명·세액계산 세목을 자동으로 같이 보낸다(화면 입력 값은 고객 정보라 보내지 않음).
  // ============================================================
  function nxSuggestContext_(){
    var parts = [];
    try {
      var activeItem = document.querySelector('.menu-item[data-view].active');
      var viewName = activeItem ? activeItem.getAttribute('data-view') : '';
      var viewLabel = window._currentViewLabel || (activeItem ? activeItem.textContent.trim() : '');
      if (viewLabel) parts.push(viewLabel);
      // 사건 — 처리개요에서 고른 사건(chCases/chSelectedId) → AI 사이드바에 연결된 사건 → 증빙확보에서 보고 있는 폴더
      var caseName = '';
      if (typeof chSelectedId !== 'undefined' && chSelectedId && typeof chCases !== 'undefined' && Array.isArray(chCases)){
        var row = chCases.filter(function(c){ return c && c.id === chSelectedId; })[0];
        if (row) caseName = String(row.사건명 || row.고객명 || '');
      }
      if (!caseName && typeof nxAiConv !== 'undefined' && nxAiConv && nxAiConv.caseName) caseName = String(nxAiConv.caseName);
      if (!caseName && viewName === 'docs' && typeof docsPath !== 'undefined' && Array.isArray(docsPath) && docsPath.length) caseName = String(docsPath[docsPath.length - 1] || '');
      if (caseName) parts.push('사건: ' + caseName.slice(0, 60));
      if (viewName === 'taxcalc'){
        var tab = document.querySelector('.taxcalc-tab.active');
        var tabLabel = tab ? (tab.textContent || '').trim() : '';
        if (tabLabel) parts.push('세목: ' + tabLabel.slice(0, 30));
      }
    } catch (e) {}
    return parts.join(' · ');
  }
  // 작은 창을 지금 화면 위에 겹쳐 띄운다 — 탭 이동 없음. Promise<{success,error}|null>(닫기=null).
  // opts.reopenId: [2026.10.28] 처리된 요청이 부족할 때 같은 창에서 "다시 요구"를 적는다(세무사님 "부족해 보이면 다시 요구사항을 적을 수 있도록") → comm_request_confirm(ok=false) → 재오픈

      overlay.innerHTML =
        '<div class="modal-panel" style="width:min(520px, 94vw);">' +
          '<div class="modal-head"><span>' + (reopenId ? '↩ 다시 요구 — ' + escapeHtml(reopenId) : noteId ? '✍ 내용 보태기 — ' + escapeHtml(noteId) : '✍ 개선 건의') + '</span></div>' +

            (special

            '<textarea id="nxSuggestText" rows="5" placeholder="' + (reopenId ? '무엇이 아직 부족한지, 어떻게 되어야 하는지 적어 주세요 — 이 요청이 다시 열려 개발자가 먼저 고칩니다' : noteId ? '이 요청에 덧붙일 말을 적어 주세요 — 글 끝에 보탬 줄로 남고 개발자가 함께 봅니다' :'고쳤으면 하는 점, 새로 원하는 기능, 방금 겪은 불편을 그대로 적어 주세요') + '" style="width:100%; box-sizing:border-box; font-size:14px; line-height:1.5; resize:vertical;"></textarea>' +
            // [2026.10.28] 화면 캡처 첨부(Ctrl+V 붙여넣기·📎 고르기, 최대 3장) / 긴급은 사유 없이 체크만(세무사님 "입력자가 긴급여부를 판단하는 것이라면 긴급사유는 필요없다")
            (special ? '' :
              '<div id="nxSuggestImgs" style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;"></div>' +
              '<div style="display:flex; align-items:center; gap:10px; margin-top:8px; font-size:13px; flex-wrap:wrap;">' +
                '<label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" id="nxSuggestUrgent"> 🚨 긴급</label>' +
                '<button type="button" class="ghost-btn sm" id="nxSuggestPick">화면 캡처 붙이기</button>' +
                '<span style="font-size:11.5px; color:var(--sub);">캡처한 그림은 이 창에서 Ctrl+V로도 붙습니다</span>' +
                '<input type="file" id="nxSuggestFile" accept="image/*" multiple hidden>' +
              '</div>') +
            '<div style="font-size:12px; color:var(--sub); margin-top:6px;">' + (reopenId ? '저장하면 이 요청이 "재오픈"으로 바뀌고 다음 개발자 실행 때 먼저 고칩니다.' : noteId ? '저장하면 이 요청 글 끝에 보탬 줄이 붙습니다(상태는 그대로).' :'저장하면 개선 후보에 올라가고, 웹 Claude Code(매주 월요일 아침 자동)가 수정안으로 올립니다. 🚨 긴급이면 저장 직후 처리 실행 화면을 바로 엽니다.') + ' Ctrl+Enter로도 저장.</div>' +
            '<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">' +
              '<button type="button" class="save-btn" data-nx-val="ok">저장</button>' +
              '<button type="button" class="ghost-btn" data-nx-val="cancel">닫기</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);
      var ta = overlay.querySelector('#nxSuggestText');
      var okBtn = overlay.querySelector('[data-nx-val="ok"]');
      var images = []; // {name, dataUrl}
      var imgBox = overlay.querySelector('#nxSuggestImgs');
      var drawImgs = function(){
        if (!imgBox) return;
        imgBox.innerHTML = images.map(function(im, i){ return '<span style="position:relative; display:inline-block;"><img src="' + im.dataUrl + '" alt="" style="height:64px; border:1px solid var(--line); border-radius:4px;"><button type="button" data-nx-img="' + i + '" title="빼기" style="position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; border:none; background:#b3261e; color:#fff; font-size:11px; cursor:pointer; line-height:18px; padding:0;">×</button></span>'; }).join('');
      };
      var addFile = function(file){
        if (!file || !/^image\//.test(file.type)) return;
        if (images.length >= 3){ toast('캡처는 3장까지 붙일 수 있습니다'); return; }
        if (file.size > 5 * 1024 * 1024){ toast('5MB가 넘는 그림은 붙일 수 없습니다'); return; }
        var rd = new FileReader();
        rd.onload = function(){ images.push({ name: file.name || '캡처.png', dataUrl: String(rd.result) }); drawImgs(); };
        rd.readAsDataURL(file);
      };
      if (imgBox){
        imgBox.addEventListener('click', function(e){ var b = e.target.closest('[data-nx-img]'); if (!b) return; images.splice(Number(b.getAttribute('data-nx-img')), 1); drawImgs(); });
        var fileEl = overlay.querySelector('#nxSuggestFile');
        overlay.querySelector('#nxSuggestPick').addEventListener('click', function(){ fileEl.click(); });
        fileEl.addEventListener('change', function(){ Array.prototype.forEach.call(fileEl.files || [], addFile); fileEl.value = ''; });
        overlay.addEventListener('paste', function(e){
          var items = (e.clipboardData && e.clipboardData.items) || [], got = false;
          for (var i = 0; i < items.length; i++){ if (items[i].kind === 'file' && /^image\//.test(items[i].type)){ addFile(items[i].getAsFile()); got = true; } }
          if (got) e.preventDefault();
        });
      }
      var close = function(val){ document.removeEventListener('keydown', onKey, true); overlay.remove(); resolve(val); };
      var save = function(){
        var text = String(ta.value || '').trim();
        if (!text){ ta.focus(); return; }
        var urgentEl = overlay.querySelector('#nxSuggestUrgent'), urgent = !!(urgentEl && urgentEl.checked);

        req.then(function(r){

            close(r);
            // 🚨 긴급 — 세무사님 "긴급을 체크하면 언제 처리하는가?": 기다리지 않도록 저장 직후 처리 실행 화면(웹 Claude Code 루틴)을 바로 연다. 열린 화면에서 "실행"을 한 번 누르면 그 자리에서 고치기 시작.
            if (!special && urgent) nxConfirm_('🚨 긴급으로 올렸습니다.\n지금 바로 처리 실행 화면(웹 Claude Code)을 열까요?\n열린 화면에서 "실행"을 한 번 누르면 바로 고치기 시작합니다.', '긴급 처리').then(function(ok){ if (ok) window.open('https://claude.ai/code/routines/trig_01K6EHE36YV1H7sAUsNzguY3', '_blank'); });

        }).catch(function(err){ okBtn.disabled = false; okBtn.textContent = '저장'; toast('저장 중 오류: ' + nxErrText_(err)); });
      };

      };
      document.addEventListener('keydown', onKey, true);
      ta.focus();
    });
  }

  // 왼쪽 메뉴마다 그 화면 틀(#view-이름)과 여는 함수(init…)가 실제로 있는지, 주요 화면의 핵심 함수가 정의돼 있는지 본다.

  (function(){

    function check_(){

        // 로그인 전에는 하지 않는다(로그인 창 위에서 서버를 부르지 않게) — 로그인 뒤 다음 기회에 다시 본다
        var tok = null; try { tok = sessionStorage.getItem('nxManageSessionToken'); } catch (e) {}

    });
  })();

  /* [2026.10.31] 하위 탭 줄이 좁은 화면에서 옆으로 밀려 뒤 탭이 가려지면 오른쪽 끝을 흐리고 ▶를 띄운다 — 세무사님 "작은화면에서 넘치면 어떻게 하려고 하는가?".
     ▶를 누르면 그 줄을 옆으로 민다. 끝까지 밀었거나 다 들어가면 사라진다. 서버를 부르지 않는 화면 일만. 탭 이름 전체는 title로. */
  (function(){
    var SEL_ = '.nx-tabbar, .taxcalc-tabs, .taxcalc-subtabs'; // [2026.11.01] 사건 작업 탭 줄도 nx-tabbar라 함께 잰다
    var arrows_ = [], queued_ = false;
    function update_(){
      queued_ = false;
      var bars = document.querySelectorAll(SEL_), used = 0;
      for (var i = 0; i < bars.length; i++){
        var bar = bars[i];
        // [2026.11.01] 탭 최소 폭은 CSS(제 이름 폭)로 — 예전엔 여기서 "지금 폭"을 재 최소 폭으로 삼아 잴 때마다 커져 190까지 벌어졌음(세무사님 "너무 넓게 잡는 것")
        Array.prototype.forEach.call(bar.querySelectorAll(".nx-tab, .taxcalc-tab, .taxcalc-subtab"), function(t){
          if (!t.title && t.scrollWidth > t.clientWidth + 1) t.title = t.textContent.trim();
        });
        var over = bar.offsetParent && bar.scrollWidth > bar.clientWidth + 2;
        var more = over && bar.scrollLeft + bar.clientWidth < bar.scrollWidth - 2, less = over && bar.scrollLeft > 2;
        bar.classList.toggle('nx-more', !!more); bar.classList.toggle('nx-more-l', !!less);
        if (!more && !less) continue;
        var r = bar.getBoundingClientRect();
        if (r.bottom < 0 || r.top > window.innerHeight) continue;
        [[more, 1], [less, -1]].forEach(function(side){
          if (!side[0]) return;
          // [2026-11-13 4차 50] 폰에서 탭 줄이 위 머리줄(붙어 있는 줄)에 가려졌거나 안쪽 칸 밖으로 밀려나도 화살표가 떠서 머리줄·본문 글을 덮었다 — 그 자리에 탭 줄이 실제로 보일 때만 띄운다
          var px = side[1] > 0 ? r.right - 12 : r.left + 12, py = r.top + r.height / 2, hit = document.elementFromPoint(px, py);
          if (!hit || !(bar.contains(hit) || (hit.classList && hit.classList.contains('nx-tabmore-arrow')))) return;
          var a = arrows_[used];
          if (!a){
            a = document.createElement('button'); a.type = 'button'; a.className = 'nx-tabmore-arrow';
            a.addEventListener('click', function(){ if (this._bar) this._bar.scrollBy({ left: this._dir * Math.max(120, this._bar.clientWidth * 0.7), behavior: 'smooth' }); });
            document.body.appendChild(a); arrows_.push(a);
          }
          a._bar = bar; a._dir = side[1]; a.textContent = side[1] > 0 ? '▶' : '◀'; a.title = side[1] > 0 ? '뒤 탭 보기' : '앞 탭 보기';
          a.style.position = 'fixed'; a.style.display = '';
          a.style.left = (side[1] > 0 ? r.right - 24 : r.left + 2) + 'px'; a.style.top = (r.top + (r.height - 22) / 2) + 'px';
          used++;
        });
      }
      for (var j = used; j < arrows_.length; j++) arrows_[j].style.display = 'none';
    }
    function queue_(){ if (!queued_){ queued_ = true; requestAnimationFrame(update_); } }
    window.addEventListener('resize', queue_);
    document.addEventListener('scroll', queue_, true);
    document.addEventListener('click', function(){ setTimeout(queue_, 50); }, true);
    new MutationObserver(function(recs){
      for (var k = 0; k < recs.length; k++){ var t = recs[k].target; if (!(t.classList && (t.classList.contains('nx-tabmore-arrow') || (recs[k].attributeName === 'class' && t.matches && t.matches(SEL_))))) return queue_(); }
    }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'style'] });
    queue_();
  })();
</script>
<script>
  // [2026.11.01] 세무사님 "설명은 충분해야 하지만 화면을 깔끔해야 한다 … 화면에다가 항목명 같은 곳에다가 설명을 마구 적지 말라" —
  // 늘 깔려 있던 설명문(.nx-help)은 숨겨 두고, 바로 앞 제목·단추 옆에 작은 「?」를 붙인다. 마우스를 올리면 말풍선으로, 누르면 그 자리에 펼쳐 보인다(손가락 화면도 됨).
  // 바뀌는 상태 글(불러오는 중·건수 등)은 .nx-help로 바꾸지 않는다 — 늘 보여야 하는 것이기 때문.
  (function(){
    function prepare_(el){
      if (el.dataset.nxh) return; el.dataset.nxh = '1';
      var a = el.previousElementSibling, b = document.createElement('button');
      if (!a && el.parentElement && el.parentElement.previousElementSibling && /^(SUMMARY|H3|H4)$/.test(el.parentElement.previousElementSibling.tagName)) a = el.parentElement.previousElementSibling; // 접히는 묶음 안 첫 줄이면 묶음 제목 옆에
      b.type = 'button'; b.className = 'nx-help-btn'; b.textContent = '?';
      b.title = (el.textContent || '').replace(/\s+/g, ' ').trim();
      b.setAttribute('aria-label', '설명 보기');
      b.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); el.classList.toggle('open'); b.classList.toggle('on', el.classList.contains('open')); });
      if (a && /^(H2|H3|H4|SUMMARY|LABEL)$/.test(a.tagName) || (a && a.classList && (a.classList.contains('nx-l3') || a.classList.contains('nx-l4')))) a.appendChild(b);
      else if (a && (a.tagName === 'BUTTON' || (a.classList && a.classList.contains('nx-help-anchor')))) a.insertAdjacentElement('afterend', b);
      else if (el.closest('.card') && el.closest('.card').querySelector(':scope > h3') && !el.closest('.card').querySelector(':scope > h3 .nx-help-btn')) el.closest('.card').querySelector(':scope > h3').appendChild(b); /* [2026.11.01] 홀로 남은 설명은 「? 설명」 알약 대신 카드 제목 옆 「?」로 */
      else { b.classList.add('nx-help-lone'); b.textContent = '? 설명'; el.insertAdjacentElement('beforebegin', b); }
      if (a && a.tagName === 'BUTTON' && !a.title) a.title = b.title;
    }
    function scan_(root){ var list = (root || document).querySelectorAll('.nx-help:not([data-nxh])'); for (var i = 0; i < list.length; i++) prepare_(list[i]); }
    var t_ = 0;
    new MutationObserver(function(){ if (!t_) t_ = setTimeout(function(){ t_ = 0; scan_(); }, 60); }).observe(document.body, { childList: true, subtree: true });
    scan_();
    window.nxHelpScan_ = scan_;
  })();
</script>
