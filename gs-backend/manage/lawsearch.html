<!-- [2026.10.19 조견표 체계] 세무사님 말씀 — "서식관리도 조견표와 마찬가지로 법령탭속에 하위탭으로" — 법령조회를 "법령정보"로 바꾸고
     하위 탭 [📜 법령][📄 서식][📋 조견표]. 법령 탭은 예전 법령조회 그대로(사건 첨부), 서식·조견표는 사건 없이 본다. 설계: netax-inventory/maps/설계_조견표체계.md -->
<style>
  .lsi-tabs{ display:flex; gap:0; border-bottom:1px solid var(--line); padding:0 14px; flex-wrap:wrap; }
  .lsi-tab{ background:none; border:none; border-bottom:2px solid transparent; padding:9px 14px; font-size:14px; color:var(--sub); cursor:pointer; }
  .lsi-tab.active{ color:var(--navy); font-weight:600; border-bottom-color:var(--gold); }
  .lsi-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; align-items:center; }
  .lsi-chip{ border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:4px 11px; font-size:12.5px; cursor:pointer; color:inherit; }
  .lsi-chip.active{ border-color:var(--navy); color:var(--navy); font-weight:600; }
  .lsi-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .lsi-table th, .lsi-table td{ border-bottom:1px solid var(--line); padding:6px 6px; text-align:left; vertical-align:top; }
  .lsi-table th{ color:var(--sub); font-weight:600; white-space:nowrap; }
  .lsi-badge{ display:inline-block; border-radius:9px; padding:1px 7px; font-size:11.5px; border:1px solid var(--line); white-space:nowrap; }
  .lsi-badge.ok{ border-color:#2e7d32; color:#2e7d32; }
  .lsi-badge.warn{ border-color:#b26a00; color:#b26a00; }
  .lsi-link{ color:var(--navy); cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; font-size:inherit; }
  .lsi-note{ font-size:11.5px; color:var(--sub); }
  .lsi-files a{ margin-right:8px; white-space:nowrap; }
  .lsi-table-wrap{ overflow-x:auto; }
  .lsi-table td.nw{ white-space:nowrap; }
  .lsi-table td.w-mid{ min-width:9em; }
  .lsi-table td.w-wide{ min-width:18em; }
  .lsi-long summary{ cursor:pointer; color:var(--navy); }
  /* [2026.10.19 세무사님 "별도칸으로 나누고 데이타길이가 길어질 경우 필드길이를 고정하여 행넘김없이 스크롤되도록 하라"]
     서식 탭 표: 정보마다 칸, 칸 너비 고정, 칸 안은 줄바꿈 없이 가로 스크롤(마우스를 올리면 전체 글), 표가 넓으면 표째 가로 스크롤 + 첫 칸 고정 */
  .lsi-grid-wrap{ overflow-x:auto; max-width:100%; }
  .lsi-grid{ table-layout:fixed; border-collapse:collapse; font-size:12.5px; }
  .lsi-grid th, .lsi-grid td{ border-bottom:1px solid var(--line); padding:5px 6px; text-align:left; vertical-align:middle; white-space:nowrap; overflow:hidden; }
  .lsi-grid th{ color:var(--sub); font-weight:600; background:var(--panel); }
  .lsi-grid th:first-child, .lsi-grid td:first-child{ position:sticky; left:0; z-index:1; background:var(--panel); box-shadow:1px 0 0 var(--line); }
  .lsi-grid .lsi-cell{ display:block; width:100%; height:22px; line-height:18px; box-sizing:border-box; overflow-x:auto; overflow-y:hidden; white-space:nowrap; } /* 높이 고정 — 칸 안 스크롤 막대(4px)가 생겨도 행 높이가 같게 */
  .lsi-grid .lsi-cell::-webkit-scrollbar{ height:4px; }
  .lsi-grid .lsi-cell::-webkit-scrollbar-thumb{ background:var(--line); border-radius:2px; }
  .lsi-grid .lsi-files a{ margin-right:6px; }
</style>
<div class="view" id="view-lawsearch">
  <div class="view-head"><h2>⚖️ 법령정보</h2></div>
  <div class="lsi-tabs">
    <button type="button" class="lsi-tab active" data-lsitab="law">📜 법령</button>
    <button type="button" class="lsi-tab" data-lsitab="form">📄 서식</button>
    <button type="button" class="lsi-tab" data-lsitab="ref">📋 조견표</button>
    <button type="button" class="lsi-tab" data-lsitab="reform">🧾 세제개편</button>
  </div>
  <div class="view-body">
    <div id="lsiPane-law">
      <div class="card">
        <div class="tb-row" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <select id="lsCaseSelect" style="min-width:220px; max-width:420px;"><option value="">사건을 선택하세요</option></select>
          <button type="button" id="lsBackToCaseBtn" class="ghost-btn" style="margin-left:auto;"><span class="btn-ic">↩</span><span class="btn-tx"> 처리개요</span></button>
        </div>
      </div>
      <!--@@APP_ONLY:lawdb-card@@-->
      <!--@@APP_ONLY:judgewait@@-->
      <div class="card">
        <h3 style="margin-top:0;">조문으로 찾아보기</h3>
        <div class="lsi-note" style="margin-bottom:8px;">조문 하나를 고르면 그 조문을 해석한 서식 칸, 그 조문을 쓰는 조견표, 그 조문을 쓰는 계산을 함께 보여 줍니다. 사건을 고르지 않아도 됩니다.</div>
        <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
          <select id="lsiArtLaw" style="min-width:200px;" aria-label="법령 고르기"></select>
          <span>제</span><input type="text" id="lsiArtNo" style="width:80px;" placeholder="예: 24, 97의2" aria-label="조문 번호"><span>조</span>
          <button type="button" class="btn" id="lsiArtGo">보기</button>
        </div>
        <div id="lsiArtResult" style="margin-top:10px;"></div>
      </div>
      <div id="lsBody"></div>
    </div>
    <div id="lsiPane-form" style="display:none;"></div>
    <div id="lsiPane-ref" style="display:none;"></div>
    <div id="lsiPane-reform" style="display:none;"></div>
  </div>
</div>

<script>
  // ============================================================
  // 법령관리 — 국세법령정보시스템(taxlaw.nts.go.kr) 분류(법령/세법해석례/판례·결정례/별표·서식)의
  // 실제 출처(target)들을 체크박스 하나로 다 펼쳐두고 한 번에 검색한다(탭으로 나누면 매번
  // 왔다갔다 검색해야 해서 불편하다는 피드백 반영). 검색결과도 체크박스로 여러 개 골라
  // 한꺼번에 첨부할 수 있고, 첨부해도 화면 전체를 다시 그리지 않는다 — 첨부된 항목만
  // "✅ 첨부됨"으로 표시하고 나머지 검색결과는 그대로 남겨서, 다시 검색하기 전까지 계속
  // 골라 첨부할 수 있게 한다.
  // ============================================================
  var lsCases = [];
  var lsSelectedId = null;
  var lsCaseSelectEl = document.getElementById('lsCaseSelect');
  var lsBodyEl = document.getElementById('lsBody');
  var lsCurrentCase = null;   // 지금 화면에 그려진 사건(로컬로 법령예규판례 배열을 직접 갱신함)
  var lsResultItems = [];     // 지금 떠 있는 검색결과 전체({category, item, title, sub}) — 다중첨부용
  // [2026.09 버그수정] 검색(runSearch)이나 첨부(attachSelected_)가 서버 응답을 기다리는 동안
  // 사용자가 다른 사건으로 전환하면, 그 응답이 도착했을 때 이미 바뀐 lsCurrentCase(=다른
  // 사건)를 기준으로 결과를 표시하거나 — 심하면 그 사건에 저장까지 — 해버릴 수 있었다(사건
  // A에서 찾은 법령해석례가 사건 B에 잘못 첨부되는 사고). renderLsBody_가 호출될 때마다
  // 이 값을 올려서, 응답이 왔을 때 그 사이 사건이 바뀌었는지 확인하는 용도로 쓴다.
  var lsGeneration_ = 0;

  var LS_ALL_SOURCES_ = [
    { key: 'law', label: '법령(법률·시행령·시행규칙)', on: true },
    { key: 'interpretation', label: '법령해석례', on: true },
    { key: 'administrative_rule', label: '행정규칙(훈령·예규·고시·집행기준·통칙 등)', on: false },
    { key: 'precedent', label: '법원 판례', on: true },
    { key: 'tax_tribunal', label: '조세심판원(심판청구)', on: false },
    { key: 'constitutional', label: '헌법재판소', on: false },
    { key: 'form', label: '별표·서식', on: false }
  ];
  var LS_CATEGORY_LABELS_ = {
    precedent: '판례', interpretation: '법령해석례', administrative_rule: '행정규칙',
    tax_tribunal: '조세심판원', constitutional: '헌재결정례', law: '법령', form: '별표·서식', statute: '법령 조문'
  };
  var LS_NO_DETAIL_ = { law: true, form: true }; // 상세조회 없이 검색결과만으로 첨부하는 카테고리

  // [2026.09 버그수정] 이 화면은 loaded-가드가 없어서 다른 화면(taxcalc 등)과 달리 매번
  // showView('lawsearch')마다 initLawSearch()가 다시 실행됐다 — goToLawSearch_가 그 직후에
  // 또 한 번 loadLsCases_(caseId)를 불러서, 사건처리에서 "⚖️ 법령조회로 이동"을 누를 때마다
  // 사건 목록을 두 번 중복 조회하고 있었다(taxcalc의 goToTaxCalc_에서 이미 고친 것과 같은
  // 유형). 다른 화면들처럼 최초 1회만 자동 로드하고, 재방문 시 목록 새로고침은
  // goToLawSearch_가 필요할 때만 명시적으로 하게 한다.
  var lsLoaded = false;
  function initLawSearch(){
    if (lsLoaded) return;
    lsLoaded = true;
    loadLsCases_();
  }

  function loadLsCases_(preselectId){
    lsCaseSelectEl.innerHTML = '<option value="">불러오는 중…</option>';
    callGas('work_get_cases', {}).then(function(res){
      lsCases = res.cases || [];
      renderLsCaseSelect_();
      var wantId = preselectId || lsSelectedId;
      if (wantId && lsCases.some(function(c){ return c.id === wantId; })){
        lsCaseSelectEl.value = wantId;
        lsSelectedId = wantId;
        renderLsBody_();
      }
    }).catch(function(){ lsCaseSelectEl.innerHTML = '<option value="">불러오지 못했습니다</option>'; });
  }

  function renderLsCaseSelect_(){
    var keepValue = lsCaseSelectEl.value;
    lsCaseSelectEl.innerHTML = buildCaseOptionsHtml_(lsCases);
    if (keepValue) lsCaseSelectEl.value = keepValue;
  }

  lsCaseSelectEl.addEventListener('change', function(){
    lsSelectedId = lsCaseSelectEl.value || null;
    renderLsBody_();
  });

  // [2026.09] 법령조회·증빙확보·세액계산·문서작성은 처리개요 카드에서 넘어오는 경우가
  // 많은데, 다시 처리개요로 돌아가려면 왼쪽 메뉴를 찾아 눌러야 해서 불편하다는 지적 —
  // 지금 고른 사건을 그대로 들고 처리개요로 돌아가는 버튼을 추가한다.
  document.getElementById('lsBackToCaseBtn').addEventListener('click', function(){
    if (typeof goToView_ === 'function') goToView_('casehandling');
    if (lsSelectedId && typeof goToCaseHandling_ === 'function') goToCaseHandling_(lsSelectedId);
  });
  // 공용 함수(script.html)는 맨 마지막에 읽히므로 화면이 다 읽힌 뒤에 붙인다
  document.addEventListener('DOMContentLoaded', function(){
    if (typeof nxCaseJumpAttach_ === 'function') nxCaseJumpAttach_(document.getElementById('lsBackToCaseBtn'), 'lawsearch', function(){ return lsSelectedId; });
  });

  function lsResultTitle_(category, item){
    if (category === 'precedent') return { title: item.사건명 || '(제목 없음)', sub: [item.사건번호, item.선고일자, item.법원명].filter(Boolean).join(' · ') };
    if (category === 'interpretation') return { title: item.안건명 || '(제목 없음)', sub: [item.안건번호, item.회신일자, item.질의기관].filter(Boolean).join(' · ') };
    if (category === 'administrative_rule') return { title: item.행정규칙명 || '(제목 없음)', sub: [item.행정규칙종류, item.발령일자, item.소관부처].filter(Boolean).join(' · ') };
    if (category === 'tax_tribunal') return { title: item.사건명 || '(제목 없음)', sub: [item.청구번호, item.의결일자, item.재결구분명].filter(Boolean).join(' · ') };
    if (category === 'constitutional') return { title: item.사건명 || '(제목 없음)', sub: [item.사건번호, item.종국일자].filter(Boolean).join(' · ') };
    if (category === 'law') return { title: item.법령명 || '(제목 없음)', sub: [item.법령구분, item.소관부처, item.시행일자 ? ('시행 ' + item.시행일자) : ''].filter(Boolean).join(' · ') };
    if (category === 'form') return { title: item.별표명 || '(제목 없음)', sub: [item.관련법령명, item.별표종류].filter(Boolean).join(' · ') };
    return { title: '(제목 없음)', sub: '' };
  }

  function lsDetailSummary_(category, detail){
    var text = category === 'precedent' ? (detail.판결요지 || detail.판시사항 || '')
      : category === 'interpretation' ? (detail.회답 || detail.질의요지 || '')
      : category === 'tax_tribunal' ? (detail.재결요지 || detail.이유 || '')
      : category === 'constitutional' ? (detail.결정요지 || detail.판시사항 || '')
      : (detail.내용 || '');
    text = String(text).trim();
    return text.length > 300 ? text.slice(0, 300) + '…' : text;
  }

  // law·form은 상세조회가 없어서 검색결과 필드로 바로 요약을 만든다.
  function lsSearchOnlySummary_(category, item){
    if (category === 'law') return [item.법령구분, item.소관부처, item.공포일자 ? ('공포 ' + item.공포일자) : '', item.시행일자 ? ('시행 ' + item.시행일자) : ''].filter(Boolean).join(' · ');
    if (category === 'form'){
      var base = [item.관련법령명, item.별표종류, item.소관부처].filter(Boolean).join(' · ');
      return item.파일링크 ? (base + '\n📎 https://www.law.go.kr' + item.파일링크) : base;
    }
    return '';
  }

  function lsIsAttached_(category, id){
    return (lsCurrentCase.법령예규판례 || []).some(function(e){ return e.category === category && e.id === id; });
  }

  // 서버 저장 + 로컬 상태(lsCurrentCase, 사건 목록 캐시) 갱신만 하고, 검색결과 화면은 건드리지
  // 않는다 — 다시 검색하기 전까지 결과 목록이 그대로 남아있어야 한다는 요청 반영.
  // [2026.09] 동시편집 낙관적 잠금 — 마지막으로 읽은 수정일을 같이 보내고, 그 사이 다른 곳에서
  // 먼저 저장돼 충돌났으면 덮어쓰지 않고 최신 내용으로 다시 불러온다.
  // [2026.09 버그수정] targetCase를 인자로 받는다 — attachSelected_가 클릭 시점의 사건을
  // 캡처해서 넘겨주므로, 서버 응답을 기다리는 사이 사용자가 다른 사건으로 전환해도(전역
  // lsCurrentCase가 바뀌어도) 항상 원래 사건에 저장된다. targetCase가 지금도 화면에 떠 있는
  // 사건(=lsCurrentCase와 동일)일 때만 화면을 갱신한다 — 이미 다른 사건으로 넘어갔으면 그
  // 사건의 화면(DOM)이 통째로 다시 그려져 있으므로 건드리지 않는다.
  function lsSaveAttachments_(newList, targetCase){
    targetCase = targetCase || lsCurrentCase;
    return callGas('work_update_case', { id: targetCase.id, 법령예규판례: newList, 기대수정일: targetCase.수정일 }).then(function(res){
      if (res.conflict){ showToast(res.message || '충돌이 발생했습니다. 새로고침합니다.', 'warning'); if (targetCase === lsCurrentCase && typeof loadLsCases_ === 'function') loadLsCases_(targetCase.id); return false; }
      if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return false; }
      targetCase.법령예규판례 = newList;
      if (res.case && res.case.수정일) targetCase.수정일 = res.case.수정일;
      var cached = lsCases.filter(function(x){ return x.id === targetCase.id; })[0];
      if (cached) { cached.법령예규판례 = newList; if (res.case && res.case.수정일) cached.수정일 = res.case.수정일; }
      if (targetCase === lsCurrentCase) renderLsAttached_(lsCurrentCase);
      if (typeof loadWorkCases === 'function') loadWorkCases();
      return true;
    }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); return false; });
  }

  function renderLsBody_(){
    lsGeneration_++;
    lsResultItems = [];
    if (!lsSelectedId){
      lsBodyEl.innerHTML = '<div class="explorer-status">위에서 사건을 선택해주세요.</div>';
      lsCurrentCase = null;
      return;
    }
    var c = lsCases.filter(function(x){ return x.id === lsSelectedId; })[0];
    if (!c){
      lsBodyEl.innerHTML = '<div class="explorer-status">사건을 찾을 수 없습니다.</div>';
      lsCurrentCase = null;
      return;
    }
    lsCurrentCase = c;
    lsBodyEl.innerHTML =
      '<div class="card">' +
      '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:10px;">' + escapeHtml(c.사건명) + '</div>' +
      '<div style="display:flex; gap:6px 16px; flex-wrap:wrap; margin-bottom:10px; font-size:12.5px;">' +
      LS_ALL_SOURCES_.map(function(s){
        return '<label style="display:flex; align-items:center; gap:4px; cursor:pointer; white-space:nowrap;"><input type="checkbox" class="lsSourceChk" data-key="' + s.key + '"' + (s.on ? ' checked' : '') + '>' + escapeHtml(s.label) + '</label>';
      }).join('') +
      '</div>' +
      '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">' +
      '<input type="text" id="lsQuery" placeholder="포함어 (예: 1세대1주택 비과세)" style="flex:1; min-width:160px;">' +
      '<button type="button" id="lsSearchBtn" class="ghost-btn">검색</button>' +
      '</div>' +
      '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">' +
      '<input type="text" id="lsExclude" placeholder="제외어(선택, 쉼표로 여러 개)" style="flex:1; min-width:140px; font-size:12.5px;">' +
      // [2026.09 버그수정] 사건을 선택하면 그 사건의 세목이 뭔지 이미 알고 있는데도 이 칸을
      // 매번 다시 손으로 입력해야 했다 — 선택된 사건의 세목으로 미리 채워둔다(직접 지우거나
      // 다른 세목으로 바꿔서 검색하는 것은 여전히 자유롭게 가능).
      '<input type="text" id="lsSemok" placeholder="세목(선택, 예: 양도소득세)" value="' + escapeHtml((typeof WORK_SEMOK_LABELS !== 'undefined' && WORK_SEMOK_LABELS[c.세목]) || c.세목 || '') + '" style="flex:1; min-width:120px; font-size:12.5px;">' +
      '<input type="text" id="lsAgency" placeholder="생산기관·법원(선택, 예: 국세청, 대법원)" style="flex:1; min-width:140px; font-size:12.5px;">' +
      '<input type="text" id="lsFormType" placeholder="서식종류(선택, 예: 서식, 별표)" style="flex:1; min-width:120px; font-size:12.5px;">' +
      '</div>' +
      '<div id="lsResults"></div>' +
      '<div id="lsResultsActionBar" style="display:none; margin-top:8px;"><button type="button" id="lsAttachSelectedBtn" class="save-btn">➕ 선택한 항목 첨부</button></div>' +
      '</div>' +
      '<div class="card">' +
      '<div style="font-size:12px; color:var(--sub); margin-bottom:6px;">이 사건에 첨부된 자료</div>' +
      '<div id="lsAttached"></div>' +
      '</div>';

    renderLsAttached_(c);
    wireLsSearch_();
  }

  function wireLsSearch_(){
    var resultsBox = document.getElementById('lsResults');
    var actionBar = document.getElementById('lsResultsActionBar');
    var queryInput = document.getElementById('lsQuery');

    function selectedSources(){
      var keys = Array.prototype.map.call(document.querySelectorAll('.lsSourceChk:checked'), function(el){ return el.dataset.key; });
      return keys;
    }

    // [2026.09] 국세법령정보시스템의 검색필터(포함어/제외어/세목/생산기관/서식종류)를 옮겨왔다.
    // 실제로 확인해보니 이 필터들이 국가법령정보센터 API 자체의 파라미터는 아니라서(그런
    // 코드필터 자체가 없음), 세목은 검색어에 같이 실어 보내고(포함어와 AND 효과), 나머지
    // (제외어/생산기관/서식종류)는 검색결과를 받아온 뒤 제목·부가정보 문자열에서 걸러내는
    // 방식으로 구현했다 — 완벽한 코드분류는 아니지만 실무적으로 충분히 좁혀진다.
    function runSearch(){
      var query = queryInput.value.trim();
      if (!query){ showToast('검색어를 입력해주세요.', 'warning'); return; }
      var cats = selectedSources();
      if (!cats.length){ showToast('검색할 출처를 하나 이상 선택해주세요.', 'warning'); return; }
      var semok = document.getElementById('lsSemok').value.trim();
      var fullQuery = semok ? (query + ' ' + semok) : query;
      var excludeWords = document.getElementById('lsExclude').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      var agencyWord = document.getElementById('lsAgency').value.trim();
      var formTypeWord = document.getElementById('lsFormType').value.trim();

      resultsBox.innerHTML = '<div class="log-empty">검색 중…</div>';
      actionBar.style.display = 'none';
      lsResultItems = [];
      var searchGen = lsGeneration_;
      Promise.all(cats.map(function(category){
        return callGas('law_search_precedent', { category: category, query: fullQuery })
          .then(function(res){ return { category: category, res: res }; })
          .catch(function(err){ return { category: category, res: { error: err && err.message ? err.message : String(err) } }; });
      })).then(function(all){
        // [2026.09 버그수정] 검색 응답을 기다리는 사이 다른 사건으로 전환됐으면(=lsGeneration_
        // 증가) 이 결과는 지금 화면(다른 사건)과 무관하다 — 버린다. 이미 renderLsBody_가 이
        // DOM(#lsResults 등)을 통째로 새로 그렸으므로 resultsBox/actionBar도 더 이상 화면에
        // 붙어있지 않은 낡은 참조다.
        if (searchGen !== lsGeneration_) return;
        var anyError = null;
        var totalBeforeFilter = 0;
        all.forEach(function(entry){
          if (entry.res.error){ anyError = entry.res.error; return; }
          (entry.res.results || []).forEach(function(item){
            totalBeforeFilter++;
            var t = lsResultTitle_(entry.category, item);
            var haystack = (t.title + ' ' + t.sub).toLowerCase();
            if (excludeWords.some(function(w){ return haystack.indexOf(w.toLowerCase()) !== -1; })) return;
            if (agencyWord && haystack.indexOf(agencyWord.toLowerCase()) === -1) return;
            if (formTypeWord && entry.category === 'form' && haystack.indexOf(formTypeWord.toLowerCase()) === -1) return;
            lsResultItems.push({ category: entry.category, item: item, title: t.title, sub: t.sub });
          });
        });
        renderLsResults_();
        if (!lsResultItems.length){
          resultsBox.innerHTML = '<div class="log-empty">' + escapeHtml(anyError || (totalBeforeFilter ? '필터 조건에 맞는 결과가 없습니다(검색 자체는 ' + totalBeforeFilter + '건 있었음).' : '검색 결과가 없습니다.')) + '</div>';
        }
      });
    }
    document.getElementById('lsSearchBtn').addEventListener('click', runSearch);
    // [2026.09 버그수정] 로그인 화면과 같은 원인(e.key가 일부 환경에서 Enter로 안 잡힘) — keyCode도 같이 확인.
    queryInput.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.keyCode === 13){ e.preventDefault(); runSearch(); } });

    document.getElementById('lsAttachSelectedBtn').addEventListener('click', attachSelected_);
  }

  function renderLsResults_(){
    var resultsBox = document.getElementById('lsResults');
    var actionBar = document.getElementById('lsResultsActionBar');
    resultsBox.innerHTML = '';
    lsResultItems.forEach(function(ri, idx){
      var attached = lsIsAttached_(ri.category, ri.item.id);
      var row = document.createElement('div');
      row.className = 'log-entry';
      row.dataset.ridx = idx;
      row.innerHTML =
        '<div style="flex:0 0 auto; display:flex; align-items:center;">' +
        (attached ? '<span title="첨부됨" style="font-size:15px;">✅</span>' : '<input type="checkbox" class="lsResultChk" data-idx="' + idx + '">') +
        '</div>' +
        '<div class="log-date">' + escapeHtml(LS_CATEGORY_LABELS_[ri.category] || ri.category) + '</div>' +
        '<div class="log-text" style="flex:1;"><b>' + escapeHtml(ri.title) + '</b>' +
        (ri.sub ? '<br><span style="color:var(--sub); font-size:12px;">' + escapeHtml(ri.sub) + '</span>' : '') + '</div>' +
        (attached ? '<span style="color:var(--navy); font-size:12px; font-weight:700;">첨부됨</span>' : '');
      resultsBox.appendChild(row);
    });
    actionBar.style.display = lsResultItems.length ? 'block' : 'none';
  }

  // [2026.09] 결정유형(인용/기각/각하, 위헌/합헌 등)은 원본 검색결과에 코드필드로 없고
  // 판결문 문장(주문·결정요지 등) 안에 섞여 있어서, 미리 걸러주는 필터로는 못 만든다(수백 건을
  // 다 열어봐야 해서 너무 느림). 대신 첨부할 때는 이미 원문을 가져오니, 그 문장에서 흔한
  // 표현을 찾아 참고용 딱지만 붙여준다 — 정확한 분류가 아니라 "대략 이런 결과였다"는 참고용.
  function lsInferOutcome_(category, detail){
    var text = '';
    if (category === 'tax_tribunal') text = String(detail.주문 || detail.재결요지 || '');
    else if (category === 'constitutional') text = String(detail.결정요지 || detail.판시사항 || '');
    else if (category === 'precedent') text = String(detail.판결요지 || detail.판시사항 || '');
    else return '';
    var patterns = [
      ['일부인용', /일부\s*인용/], ['일부기각', /일부\s*기각/],
      ['인용', /인용(한다|함|되었다|결정)/], ['기각', /기각(한다|함|되었다|결정)/], ['각하', /각하(한다|함|되었다|결정)/],
      ['위헌', /위헌(이다|이라고|선언|결정)/], ['헌법불합치', /헌법\s*불합치/], ['합헌', /합헌(이다|이라고|결정)/]
    ];
    for (var i = 0; i < patterns.length; i++){ if (patterns[i][1].test(text)) return patterns[i][0]; }
    return '';
  }

  function attachSelected_(){
    var checked = Array.prototype.map.call(document.querySelectorAll('.lsResultChk:checked'), function(el){ return Number(el.dataset.idx); });
    if (!checked.length){ showToast('첨부할 항목을 체크해주세요.', 'warning'); return; }
    // [2026.10.19] 어디에 쓸지 한 줄 — 관련법령 파일·검토서 근거·AI 지휘가 이것으로 쓴다(비워도 됨, 취소하면 첨부 안 함)
    var use = window.prompt('어디에 쓸 자료인가요? 쟁점이나 계산 칸을 적어 주세요(비워도 됩니다).', '');
    if (use === null) return;
    var btn = document.getElementById('lsAttachSelectedBtn');
    btn.disabled = true;
    btn.textContent = '조회 중…';

    // [2026.09 버그수정] 조회(law_get_precedent_detail)에 시간이 걸리는 동안 사용자가 다른
    // 사건으로 전환할 수 있다 — 지금 이 순간의 사건을 캡처해두고 끝까지 이 사건 기준으로
    // 처리한다(완료 시점에 전역 lsCurrentCase를 다시 참조하면 그 사이 바뀐 엉뚱한 사건에
    // 첨부·저장될 위험이 있었다).
    var targetCase = lsCurrentCase;
    var picked = checked.map(function(idx){ return lsResultItems[idx]; });
    Promise.all(picked.map(function(ri){
      if (LS_NO_DETAIL_[ri.category]){
        return Promise.resolve({ 요약: lsSearchOnlySummary_(ri.category, ri.item), 결과: '' });
      }
      return callGas('law_get_precedent_detail', { category: ri.category, id: ri.item.id })
        .then(function(detail){ return { 요약: lsDetailSummary_(ri.category, detail), 결과: lsInferOutcome_(ri.category, detail) }; })
        .catch(function(){ return { 요약: (ri.sub || '') + '\n(원문 없음 — 검색결과 기본정보만 첨부됨)', 결과: '' }; });
    })).then(function(picked_results){
      var today = new Date().toISOString().slice(0, 10);
      var newEntries = picked.map(function(ri, i){
        var entry = { category: ri.category, id: ri.item.id, 제목: ri.title, 요약: picked_results[i].요약, 번호: ri.sub || '', 첨부일: today, 첨부: '직접', 쓸곳: String(use || '').trim() };
        if (picked_results[i].결과) entry.결과 = picked_results[i].결과;
        return entry;
      }).filter(function(entry){
        return !(targetCase.법령예규판례 || []).some(function(e){ return e.category === entry.category && e.id === entry.id; });
      });
      var newList = (targetCase.법령예규판례 || []).concat(newEntries);
      lsSaveAttachments_(newList, targetCase).then(function(ok){
        btn.disabled = false;
        btn.textContent = '➕ 선택한 항목 첨부';
        if (ok){
          showToast((targetCase === lsCurrentCase ? '' : ('(' + (targetCase.사건명 || '') + ') ')) + newEntries.length + '건 첨부했습니다.', 'success');
          // [2026.09 버그수정] 그 사이 다른 사건으로 넘어갔으면 지금 화면(#lsResults)은 이미
          // 그 다른 사건의 것이므로 여기(targetCase 기준) 결과로 덮어쓰지 않는다.
          if (targetCase === lsCurrentCase) renderLsResults_(); // 첨부된 것만 "✅ 첨부됨"으로 바뀌고 나머지는 그대로 남는다.
        }
      });
    });
  }

  function renderLsAttached_(c){
    var wrap = document.getElementById('lsAttached');
    if (!wrap) return;
    var list = c.법령예규판례 || [];
    if (!list.length){
      wrap.innerHTML = '<div class="log-empty">아직 첨부된 자료가 없습니다.</div>';
      return;
    }
    wrap.innerHTML = '';
    list.slice().reverse().forEach(function(entry){
      var row = document.createElement('div');
      row.className = 'log-entry';
      row.innerHTML =
        '<div class="log-date">' + escapeHtml(LS_CATEGORY_LABELS_[entry.category] || entry.category) +
        (entry.결과 ? '<br><span title="판결문 문장에서 자동으로 찾은 참고용 표시 — 정확한 분류 아님" style="background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:1px 6px; font-size:11px; color:var(--navy); display:inline-block; margin-top:3px;">' + escapeHtml(entry.결과) + '</span>' : '') + '</div>' +
        '<div class="log-text"><b>' + escapeHtml(entry.제목 || '') + '</b>' +
        ' <span style="font-size:11.5px;color:var(--sub);">' + (entry.첨부 === 'AI' ? (entry.확인 ? '🤖 AI 첨부(확정)' : '🤖 AI 첨부(미확인)') : '직접 첨부') + (entry.판 ? ' · ' + escapeHtml(String(entry.판)) + ' 시행판' : '') + (entry.쓸곳 ? ' · 쓸 곳: ' + escapeHtml(entry.쓸곳) : '') + (entry.이유 ? ' · ' + escapeHtml(entry.이유) : '') + '</span>' +
        (entry.첨부 === 'AI' && !entry.확인 ? ' <button type="button" class="ghost-btn ls-ai-ok" style="font-size:11.5px;padding:1px 6px;">✔ 확정</button>' : '') +
        (entry.요약 ? '<br><span style="color:var(--sub); font-size:12.5px; white-space:pre-wrap;">' + escapeHtml(entry.요약) + '</span>' : '') + '</div>' +
        '<span class="log-del" title="첨부 해제">✕</span>';
      var okBtn = row.querySelector('.ls-ai-ok');
      if (okBtn) okBtn.addEventListener('click', function(){
        var newList = list.map(function(e){ return (e.category === entry.category && e.id === entry.id) ? Object.assign({}, e, { 확인: true, 확인일: new Date().toISOString().slice(0, 10) }) : e; });
        lsSaveAttachments_(newList).then(function(ok){ if (ok) renderLsResults_(); });
      });
      row.querySelector('.log-del').addEventListener('click', function(){
        var newList = list.filter(function(e){ return !(e.category === entry.category && e.id === entry.id); });
        lsSaveAttachments_(newList).then(function(ok){ if (ok) renderLsResults_(); });
      });
      wrap.appendChild(row);
    });
  }

  // 사건처리 카드의 "⚖️ 법령관리에서 열기" 버튼에서 호출 — 이 화면으로 이동하고 그
  // 사건을 바로 골라준다(goToCaseHandling_과 같은 패턴).
  function goToLawSearch_(caseId){
    // [2026.09 버그수정] lsSelectedId를 goToView_보다 먼저 정해두면, 최초 진입 시
    // initLawSearch()가 실행하는 loadLsCases_()가 이미 이 값을 보고 바로 그 사건을 골라주므로
    // (loadLsCases_의 wantId = preselectId || lsSelectedId), 아래 명시적 재조회가 필요 없다 —
    // 이미 로드된 세션(goToView_ 호출 전 lsLoaded)일 때만 최신 목록으로 다시 불러온다.
    // (goToView_가 최초 진입 시 initLawSearch()를 실행해 lsLoaded를 그 안에서 true로 바꾸므로,
    // 반드시 goToView_ 호출 "전" 값을 따로 기억해둬야 한다 — 안 그러면 최초 진입 때도 항상
    // true로 보여 여기서 다시 한번 중복 조회하게 된다.)
    var wasAlreadyLoaded = lsLoaded;
    lsSelectedId = caseId;
    if (typeof goToView_ === 'function') goToView_('lawsearch');
    if (wasAlreadyLoaded) loadLsCases_(caseId);
  }
</script>

<script>
  // ============================================================
  // [2026.10.19 조견표 체계] 법령정보 하위 탭 — [📜 법령][📄 서식][📋 조견표]
  //  세무사님 말씀(원문): "세무서식도 세법해석이 함축적으로 녹아들어 있다는 점을 중요하게 생각한다면 서식관리도 조견표와
  //  마찬가지로 법령탭속에 하위탭으로 구성해야 하지 않을까?" — 셋이 서로 이어진다:
  //   조문 → 그 조문을 해석한 서식 칸 / 서식 칸 → 그 칸을 채우는 조견표·계산기 칸 / 조견표 행 → 근거 조문·서식 칸.
  //  · 서식 목록은 세액인쇄의 PRINT_REGISTRY_(subForms)를 "읽기만" 한다 — 세액인쇄에 서식을 더하면 여기도 저절로 생긴다.
  //  · 서식 원본은 드라이브 업무관리자\서식\법제처 원본(PDF)·한글 서식 폴더를 listFolder로 읽어 서식번호로 짝짓는다(조견표\해설서·책자는 참고자료로).
  //  · 조문 → 계산 지도는 EngineLawMap.js(자동 생성)를 앱을 만들 때 tools/build-app.js가 아래 자리에 끼워 넣는다
  //    (서버 호출 없음. 예전 구글 주소 화면에서는 null이라 "앱 화면에서만"이라고 알린다).
  //  · 칸 지도(LSI_FORM_MAPS_)·조견표(LSI_REF_TABLES_)는 세무사님 확인 전 "초안" — 운영 판정·계산에는 쓰지 않는다.
  // ============================================================
  var LSI_ENGINE_LAW_MAP_ = /*@@ENGINE_LAW_MAP@@*/null;
  // 서식번호(PRINT_REGISTRY_의 formNo 그대로) → 칸 지도 / 조견표 한 장씩(번호·이름·절차·행·개정·쓰는곳·확인필요)
  // 아래 두 줄은 tools/build-reftables.js가 저장소 reftables/*.json으로 다시 쓴다 — 직접 고치지 말고 JSON을 고친 뒤 도구를 돌릴 것
  /*@@REF_DATA_BEGIN@@*/
  var LSI_FORM_MAPS_ = {};
  var LSI_REF_TABLES_ = [];
  var LSI_FORM_CATALOG_ = {"서식":[]};
  /*@@REF_DATA_END@@*/
  var lsiActiveTab_ = 'law';
  var lsiFolderFiles_ = null;      // [{name,url,mimeType,folder,official,ref}] — 드라이브 서식·해설서 폴더
  var lsiFolderLoading_ = false;
  var lsiFormGroup_ = null;

  // 드라이브 서식 폴더에 있는데 세액인쇄 목록의 어느 서식과도 짝이 안 된 파일 — 목록에 빠진 서식을 찾는 데 쓴다
  // [2026.10.19 세무사님 질문 "서식폴더에 있지만 목록과 짝이 안된 파일이 무척 많이 나열되어 있는데 이것이 무슨 의미인가?"]

  var LSI_REF_WORDS_ = /사례|작성요령|설명|개요|흐름도|안내|가이드|요령|실수|체크포인트|포인트|상식|오해|책자|과세개요|지원제도/;

  }

    // 제목 열쇠 두 가지: 그대로, 괄호 속 글을 뺀 것(예: '양도소득(국외전출자)과세표준 신고…' ↔ '양도소득과세표준 신고…')

      //  점수: 똑같음 > 파일 제목이 서식 이름 안에 있음(서식 이름이 짧을수록) > 서식 이름이 파일 제목 안에 있음(서식 이름이 길수록)

  // ---------- 조문 문자열 읽기: "상증세법 §24①" → { law: '상속세 및 증여세법', art: '24' } ----------

      };
      adjGo.addEventListener('click', runAdj);
      document.getElementById('lsiAdjAddr').addEventListener('keydown', function(e){ if (e.key === 'Enter') runAdj(); });
    }
    if (box.scrollIntoView) box.scrollIntoView({ block: 'start' });
  }

  // ============================================================
  // [2026.10.21 세제개편 하위 탭] 세무사님 말씀(원문): "법령정보탭에 세제개편 서브탭을 만들어서 세제개편안별 원문과 비교분석해설서를
  //  만들어두면 좋겠다. 이후 확정되면 개정세법으로 재분류하면 되고 말야"
  //  · 개편안 하나 = 드라이브 0 NETAX\업무관리자\법령\세제개편\<개편안 폴더>(원문 PDF·한글 + 비교분석 해설서 .md).
  //  · 확정되면 그 폴더를 업무관리자\법령\개정세법\으로 옮긴다(이 탭의 "확정 — 개정세법으로" 버튼, 되돌리기도 있음). 폴더째 옮기므로 파일 ID는 그대로.
  //  · 확정 전 개편안은 참고·상담용 — 세액계산 엔진·사건처리는 이 폴더를 읽지 않는다.
  //  · 경로로 찾으므로(listFolder path) 폴더 ID를 코드에 박지 않는다. 서버 코드 변경 없음(listFolder·readFile·moveItem 기존 입구).
  // ============================================================
  var LSI_REFORM_PATH_ = ['0 NETAX', '업무관리자', '법령', '세제개편'];
  var LSI_ENACTED_PATH_ = ['0 NETAX', '업무관리자', '법령', '개정세법'];
  var lsiReform_ = null, lsiReformLoading_ = false, lsiReformError_ = '';
  function lsiLoadReform_(){
    if (lsiReformLoading_) return;
    lsiReformLoading_ = true; lsiReformError_ = '';
    var one = function(path, enacted){
      return callGas('listFolder', { path: path }).then(function(res){
        if (!res || res.error) throw new Error((res && res.error) || '폴더를 읽지 못했습니다');
        return Promise.all((res.folders || []).map(function(d){
          return callGas('listFolder', { folderId: d.id }).then(function(r){
            return { id: d.id, name: d.name, enacted: enacted, files: (r && r.files) || [], error: r && r.error ? r.error : '' };
          }).catch(function(e){ return { id: d.id, name: d.name, enacted: enacted, files: [], error: e.message }; });
        }));
      });
    };
    Promise.all([one(LSI_REFORM_PATH_, false), one(LSI_ENACTED_PATH_, true)]).then(function(r){
      var all = r[0].concat(r[1]);
      all.sort(function(a, b){ return b.name.localeCompare(a.name, 'ko'); }); // 폴더 이름이 날짜로 시작 — 최근 것 먼저
      lsiReform_ = all;
    }).catch(function(e){ lsiReformError_ = e.message; lsiReform_ = lsiReform_ || []; })
      .then(function(){ lsiReformLoading_ = false; if (lsiActiveTab_ === 'reform') lsiRenderReform_(); });
  }
  function lsiRenderReform_(){
    var pane = document.getElementById('lsiPane-reform');
    if (!lsiReform_){ pane.innerHTML = '<div class="card"><div class="lsi-note">드라이브 업무관리자\\법령\\세제개편·개정세법 폴더를 읽는 중…</div></div>'; lsiLoadReform_(); return; }
    var card = function(g){
      var docs = g.files.filter(function(f){ return /\.md$/i.test(f.name); });
      var srcs = g.files.filter(function(f){ return !/\.md$/i.test(f.name); });
      return '<div class="card" data-lsirf="' + lsiEsc_(g.id) + '">' +
        '<div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px;">' +
          '<h3 style="margin:0;">' + lsiEsc_(g.name) + '</h3>' +
          (g.enacted ? '<span class="lsi-badge ok">개정세법(확정)</span>' : '<span class="lsi-badge warn">개편안 — 확정 전, 계산·신고에 쓰지 않음</span>') +
          '<button type="button" class="ghost-btn" style="margin-left:auto;" data-lsirfmove="' + (g.enacted ? 'back' : 'enact') + '">' + (g.enacted ? '↩ 개편안으로 되돌리기' : '✅ 확정 — 개정세법으로 옮기기') + '</button>' +
        '</div>' +
        (g.error ? '<div class="lsi-note" style="color:#a33;">이 폴더를 읽지 못했습니다: ' + lsiEsc_(g.error) + '</div>' : '') +
        '<div style="margin-top:8px;"><b>비교분석 해설서</b> ' + (docs.length ? docs.map(function(f){ return '<button type="button" class="btn" style="margin:2px 6px 2px 0;" data-lsirfdoc="' + lsiEsc_(f.id) + '" data-lsirfname="' + lsiEsc_(f.name) + '">📖 ' + lsiEsc_(f.name.replace(/\.md$/i, '')) + '</button>'; }).join('') : '<span class="lsi-note">아직 없음</span>') + '</div>' +
        '<div class="lsi-files" style="margin-top:6px;"><b>원문</b> ' + (srcs.length ? srcs.map(function(f){ return '<a href="' + lsiEsc_(f.url) + '" target="_blank" rel="noopener noreferrer">📄 ' + lsiEsc_(f.name) + '</a>'; }).join('') : '<span class="lsi-note">아직 없음</span>') + '</div>' +
      '</div>';
    };
    var pend = lsiReform_.filter(function(g){ return !g.enacted; }), done = lsiReform_.filter(function(g){ return g.enacted; });
    pane.innerHTML =
      '<div class="card" style="display:flex; flex-wrap:wrap; align-items:center; gap:8px;">' +
        '<span class="lsi-note">세제개편안의 원문과 현행 세법과의 비교분석 해설서입니다. 확정되면 "확정 — 개정세법으로 옮기기"를 누르세요.</span>' +
        '<button type="button" class="ghost-btn" style="margin-left:auto;" data-lsirfreload="1">↻ 새로 읽기</button>' +
      '</div>' +
      (lsiReformError_ ? '<div class="card lsi-note" style="color:#a33;">폴더를 읽지 못했습니다: ' + lsiEsc_(lsiReformError_) + '</div>' : '') +
      '<h3 style="margin:14px 4px 6px;">개편안 (확정 전) <span class="lsi-note">' + pend.length + '건</span></h3>' + (pend.length ? pend.map(card).join('') : '<div class="card lsi-note">없음</div>') +
      '<h3 style="margin:14px 4px 6px;">개정세법 (확정) <span class="lsi-note">' + done.length + '건</span></h3>' + (done.length ? done.map(card).join('') : '<div class="card lsi-note">없음</div>');
    pane.querySelectorAll('[data-lsirfreload]').forEach(function(b){ b.addEventListener('click', function(){ lsiReform_ = null; lsiRenderReform_(); }); });
    pane.querySelectorAll('[data-lsirfdoc]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.dataset.lsirfdoc, name = b.dataset.lsirfname;
        nxMdOpenWindow(name, function(){ return callGas('readFile', { fileId: id }).then(function(r){ if (!r || r.error) throw new Error((r && r.error) || '읽지 못했습니다'); return r.content || ''; }); });
      });
    });
    pane.querySelectorAll('[data-lsirfmove]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.closest('[data-lsirf]').dataset.lsirf, enact = b.dataset.lsirfmove === 'enact';
        var g = (lsiReform_ || []).filter(function(x){ return x.id === id; })[0]; if (!g) return;
        nxConfirm_(enact ? '「' + g.name + '」을(를) 확정된 개정세법으로 옮길까요?\n드라이브 업무관리자\\법령\\세제개편 → 개정세법 폴더로 폴더째 옮깁니다(되돌릴 수 있음).'
          : '「' + g.name + '」을(를) 다시 확정 전 개편안으로 옮길까요?', enact ? '개정세법으로 재분류' : '개편안으로 되돌리기').then(function(ok){
          if (!ok) return;
          b.disabled = true;
          callGas('moveItem', { id: id, type: 'folder', destPath: enact ? LSI_ENACTED_PATH_ : LSI_REFORM_PATH_ }).then(function(r){
            if (!r || r.error) throw new Error((r && r.error) || '옮기지 못했습니다');
            showToast(enact ? '개정세법으로 옮겼습니다.' : '개편안으로 되돌렸습니다.', 'success');
            lsiReform_ = null; lsiRenderReform_();
          }).catch(function(e){ b.disabled = false; showToast('옮기지 못했습니다: ' + e.message, 'warning'); });
        });
      });
    });
  }
</script>
