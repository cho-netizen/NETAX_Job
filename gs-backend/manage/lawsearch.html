<!-- [2026.10.19 조견표 체계] 세무사님 말씀 — "서식관리도 조견표와 마찬가지로 법령탭속에 하위탭으로" — 법령조회를 "법령정보"로 바꾸고
     하위 탭 [📜 법령][📄 서식][📋 조견표]. 법령 탭은 예전 법령조회 그대로(사건 첨부), 서식·조견표는 사건 없이 본다. 설계: netax-inventory/maps/설계_조견표체계.md -->
<style>
  .lsi-tabs{ display:flex; gap:0; border-bottom:1px solid var(--line); padding:0 14px; flex-wrap:wrap; }
  .lsi-tab{ background:none; border:none; border-bottom:2px solid transparent; padding:9px 14px; font-size:14px; color:var(--sub); cursor:pointer; }
  .lsi-tab.active{ color:var(--navy); font-weight:600; border-bottom-color:var(--gold); }
  .lsi-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; align-items:center; }
  .lsi-chip{ border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:4px 11px; font-size:12.5px; cursor:pointer; color:inherit; }
  .lsi-chip.active{ border-color:var(--navy); color:var(--navy); font-weight:600; }
  .lsi-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .lsi-table th, .lsi-table td{ border-bottom:1px solid var(--line); padding:6px 6px; text-align:left; vertical-align:top; }
  .lsi-table th{ color:var(--sub); font-weight:600; white-space:nowrap; }
  .lsi-badge{ display:inline-block; border-radius:9px; padding:1px 7px; font-size:11.5px; border:1px solid var(--line); white-space:nowrap; }
  .lsi-badge.ok{ border-color:#2e7d32; color:#2e7d32; }
  .lsi-badge.warn{ border-color:#b26a00; color:#b26a00; }
  .lsi-link{ color:var(--navy); cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; font-size:inherit; }
  .lsi-note{ font-size:11.5px; color:var(--sub); }
  .lsi-files a{ margin-right:8px; white-space:nowrap; }
  .lsi-table-wrap{ overflow-x:auto; }
  .lsi-table td.nw{ white-space:nowrap; }
  .lsi-table td.w-mid{ min-width:9em; }
  .lsi-table td.w-wide{ min-width:18em; }
  .lsi-long summary{ cursor:pointer; color:var(--navy); }
</style>
<div class="view" id="view-lawsearch">
  <div class="view-head"><h2>⚖️ 법령정보</h2></div>
  <div class="lsi-tabs">
    <button type="button" class="lsi-tab active" data-lsitab="law">📜 법령</button>
    <button type="button" class="lsi-tab" data-lsitab="form">📄 서식</button>
    <button type="button" class="lsi-tab" data-lsitab="ref">📋 조견표</button>
  </div>
  <div class="view-body">
    <div id="lsiPane-law">
      <div class="card">
        <div class="tb-row" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <select id="lsCaseSelect" style="min-width:220px; max-width:420px;"><option value="">사건을 선택하세요</option></select>
          <button type="button" id="lsBackToCaseBtn" class="ghost-btn" style="margin-left:auto;"><span class="btn-ic">↩</span><span class="btn-tx"> 처리개요</span></button>
        </div>
      </div>
      <div class="card">
        <h3 style="margin-top:0;">조문으로 찾아보기</h3>
        <div class="lsi-note" style="margin-bottom:8px;">조문 하나를 고르면 그 조문을 해석한 서식 칸, 그 조문을 쓰는 조견표, 그 조문을 쓰는 계산을 함께 보여 줍니다. 사건을 고르지 않아도 됩니다.</div>
        <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
          <select id="lsiArtLaw" style="min-width:200px;" aria-label="법령 고르기"></select>
          <span>제</span><input type="text" id="lsiArtNo" style="width:80px;" placeholder="예: 24, 97의2" aria-label="조문 번호"><span>조</span>
          <button type="button" class="btn" id="lsiArtGo">보기</button>
        </div>
        <div id="lsiArtResult" style="margin-top:10px;"></div>
      </div>
      <div id="lsBody"></div>
    </div>
    <div id="lsiPane-form" style="display:none;"></div>
    <div id="lsiPane-ref" style="display:none;"></div>
  </div>
</div>

<script>
  // ============================================================
  // 법령관리 — 국세법령정보시스템(taxlaw.nts.go.kr) 분류(법령/세법해석례/판례·결정례/별표·서식)의
  // 실제 출처(target)들을 체크박스 하나로 다 펼쳐두고 한 번에 검색한다(탭으로 나누면 매번
  // 왔다갔다 검색해야 해서 불편하다는 피드백 반영). 검색결과도 체크박스로 여러 개 골라
  // 한꺼번에 첨부할 수 있고, 첨부해도 화면 전체를 다시 그리지 않는다 — 첨부된 항목만
  // "✅ 첨부됨"으로 표시하고 나머지 검색결과는 그대로 남겨서, 다시 검색하기 전까지 계속
  // 골라 첨부할 수 있게 한다.
  // ============================================================
  var lsCases = [];
  var lsSelectedId = null;
  var lsCaseSelectEl = document.getElementById('lsCaseSelect');
  var lsBodyEl = document.getElementById('lsBody');
  var lsCurrentCase = null;   // 지금 화면에 그려진 사건(로컬로 법령예규판례 배열을 직접 갱신함)
  var lsResultItems = [];     // 지금 떠 있는 검색결과 전체({category, item, title, sub}) — 다중첨부용
  // [2026.09 버그수정] 검색(runSearch)이나 첨부(attachSelected_)가 서버 응답을 기다리는 동안
  // 사용자가 다른 사건으로 전환하면, 그 응답이 도착했을 때 이미 바뀐 lsCurrentCase(=다른
  // 사건)를 기준으로 결과를 표시하거나 — 심하면 그 사건에 저장까지 — 해버릴 수 있었다(사건
  // A에서 찾은 법령해석례가 사건 B에 잘못 첨부되는 사고). renderLsBody_가 호출될 때마다
  // 이 값을 올려서, 응답이 왔을 때 그 사이 사건이 바뀌었는지 확인하는 용도로 쓴다.
  var lsGeneration_ = 0;

  var LS_ALL_SOURCES_ = [
    { key: 'law', label: '법령(법률·시행령·시행규칙)', on: true },
    { key: 'interpretation', label: '법령해석례', on: true },
    { key: 'administrative_rule', label: '행정규칙(훈령·예규·고시·집행기준·통칙 등)', on: false },
    { key: 'precedent', label: '법원 판례', on: true },
    { key: 'tax_tribunal', label: '조세심판원(심판청구)', on: false },
    { key: 'constitutional', label: '헌법재판소', on: false },
    { key: 'form', label: '별표·서식', on: false }
  ];
  var LS_CATEGORY_LABELS_ = {
    precedent: '판례', interpretation: '법령해석례', administrative_rule: '행정규칙',
    tax_tribunal: '조세심판원', constitutional: '헌재결정례', law: '법령', form: '별표·서식'
  };
  var LS_NO_DETAIL_ = { law: true, form: true }; // 상세조회 없이 검색결과만으로 첨부하는 카테고리

  // [2026.09 버그수정] 이 화면은 loaded-가드가 없어서 다른 화면(taxcalc 등)과 달리 매번
  // showView('lawsearch')마다 initLawSearch()가 다시 실행됐다 — goToLawSearch_가 그 직후에
  // 또 한 번 loadLsCases_(caseId)를 불러서, 사건처리에서 "⚖️ 법령조회로 이동"을 누를 때마다
  // 사건 목록을 두 번 중복 조회하고 있었다(taxcalc의 goToTaxCalc_에서 이미 고친 것과 같은
  // 유형). 다른 화면들처럼 최초 1회만 자동 로드하고, 재방문 시 목록 새로고침은
  // goToLawSearch_가 필요할 때만 명시적으로 하게 한다.
  var lsLoaded = false;
  function initLawSearch(){
    if (lsLoaded) return;
    lsLoaded = true;
    loadLsCases_();
  }

  function loadLsCases_(preselectId){
    lsCaseSelectEl.innerHTML = '<option value="">불러오는 중…</option>';
    callGas('work_get_cases', {}).then(function(res){
      lsCases = res.cases || [];
      renderLsCaseSelect_();
      var wantId = preselectId || lsSelectedId;
      if (wantId && lsCases.some(function(c){ return c.id === wantId; })){
        lsCaseSelectEl.value = wantId;
        lsSelectedId = wantId;
        renderLsBody_();
      }
    }).catch(function(){ lsCaseSelectEl.innerHTML = '<option value="">불러오지 못했습니다</option>'; });
  }

  function renderLsCaseSelect_(){
    var keepValue = lsCaseSelectEl.value;
    lsCaseSelectEl.innerHTML = buildCaseOptionsHtml_(lsCases);
    if (keepValue) lsCaseSelectEl.value = keepValue;
  }

  lsCaseSelectEl.addEventListener('change', function(){
    lsSelectedId = lsCaseSelectEl.value || null;
    renderLsBody_();
  });

  // [2026.09] 법령조회·증빙확보·세액계산·문서작성은 처리개요 카드에서 넘어오는 경우가
  // 많은데, 다시 처리개요로 돌아가려면 왼쪽 메뉴를 찾아 눌러야 해서 불편하다는 지적 —
  // 지금 고른 사건을 그대로 들고 처리개요로 돌아가는 버튼을 추가한다.
  document.getElementById('lsBackToCaseBtn').addEventListener('click', function(){
    if (typeof goToView_ === 'function') goToView_('casehandling');
    if (lsSelectedId && typeof goToCaseHandling_ === 'function') goToCaseHandling_(lsSelectedId);
  });
  // 공용 함수(script.html)는 맨 마지막에 읽히므로 화면이 다 읽힌 뒤에 붙인다
  document.addEventListener('DOMContentLoaded', function(){
    if (typeof nxCaseJumpAttach_ === 'function') nxCaseJumpAttach_(document.getElementById('lsBackToCaseBtn'), 'lawsearch', function(){ return lsSelectedId; });
  });

  function lsResultTitle_(category, item){
    if (category === 'precedent') return { title: item.사건명 || '(제목 없음)', sub: [item.사건번호, item.선고일자, item.법원명].filter(Boolean).join(' · ') };
    if (category === 'interpretation') return { title: item.안건명 || '(제목 없음)', sub: [item.안건번호, item.회신일자, item.질의기관].filter(Boolean).join(' · ') };
    if (category === 'administrative_rule') return { title: item.행정규칙명 || '(제목 없음)', sub: [item.행정규칙종류, item.발령일자, item.소관부처].filter(Boolean).join(' · ') };
    if (category === 'tax_tribunal') return { title: item.사건명 || '(제목 없음)', sub: [item.청구번호, item.의결일자, item.재결구분명].filter(Boolean).join(' · ') };
    if (category === 'constitutional') return { title: item.사건명 || '(제목 없음)', sub: [item.사건번호, item.종국일자].filter(Boolean).join(' · ') };
    if (category === 'law') return { title: item.법령명 || '(제목 없음)', sub: [item.법령구분, item.소관부처, item.시행일자 ? ('시행 ' + item.시행일자) : ''].filter(Boolean).join(' · ') };
    if (category === 'form') return { title: item.별표명 || '(제목 없음)', sub: [item.관련법령명, item.별표종류].filter(Boolean).join(' · ') };
    return { title: '(제목 없음)', sub: '' };
  }

  function lsDetailSummary_(category, detail){
    var text = category === 'precedent' ? (detail.판결요지 || detail.판시사항 || '')
      : category === 'interpretation' ? (detail.회답 || detail.질의요지 || '')
      : category === 'tax_tribunal' ? (detail.재결요지 || detail.이유 || '')
      : category === 'constitutional' ? (detail.결정요지 || detail.판시사항 || '')
      : (detail.내용 || '');
    text = String(text).trim();
    return text.length > 300 ? text.slice(0, 300) + '…' : text;
  }

  // law·form은 상세조회가 없어서 검색결과 필드로 바로 요약을 만든다.
  function lsSearchOnlySummary_(category, item){
    if (category === 'law') return [item.법령구분, item.소관부처, item.공포일자 ? ('공포 ' + item.공포일자) : '', item.시행일자 ? ('시행 ' + item.시행일자) : ''].filter(Boolean).join(' · ');
    if (category === 'form'){
      var base = [item.관련법령명, item.별표종류, item.소관부처].filter(Boolean).join(' · ');
      return item.파일링크 ? (base + '\n📎 https://www.law.go.kr' + item.파일링크) : base;
    }
    return '';
  }

  function lsIsAttached_(category, id){
    return (lsCurrentCase.법령예규판례 || []).some(function(e){ return e.category === category && e.id === id; });
  }

  // 서버 저장 + 로컬 상태(lsCurrentCase, 사건 목록 캐시) 갱신만 하고, 검색결과 화면은 건드리지
  // 않는다 — 다시 검색하기 전까지 결과 목록이 그대로 남아있어야 한다는 요청 반영.
  // [2026.09] 동시편집 낙관적 잠금 — 마지막으로 읽은 수정일을 같이 보내고, 그 사이 다른 곳에서
  // 먼저 저장돼 충돌났으면 덮어쓰지 않고 최신 내용으로 다시 불러온다.
  // [2026.09 버그수정] targetCase를 인자로 받는다 — attachSelected_가 클릭 시점의 사건을
  // 캡처해서 넘겨주므로, 서버 응답을 기다리는 사이 사용자가 다른 사건으로 전환해도(전역
  // lsCurrentCase가 바뀌어도) 항상 원래 사건에 저장된다. targetCase가 지금도 화면에 떠 있는
  // 사건(=lsCurrentCase와 동일)일 때만 화면을 갱신한다 — 이미 다른 사건으로 넘어갔으면 그
  // 사건의 화면(DOM)이 통째로 다시 그려져 있으므로 건드리지 않는다.
  function lsSaveAttachments_(newList, targetCase){
    targetCase = targetCase || lsCurrentCase;
    return callGas('work_update_case', { id: targetCase.id, 법령예규판례: newList, 기대수정일: targetCase.수정일 }).then(function(res){
      if (res.conflict){ showToast(res.message || '충돌이 발생했습니다. 새로고침합니다.', 'warning'); if (targetCase === lsCurrentCase && typeof loadLsCases_ === 'function') loadLsCases_(targetCase.id); return false; }
      if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return false; }
      targetCase.법령예규판례 = newList;
      if (res.case && res.case.수정일) targetCase.수정일 = res.case.수정일;
      var cached = lsCases.filter(function(x){ return x.id === targetCase.id; })[0];
      if (cached) { cached.법령예규판례 = newList; if (res.case && res.case.수정일) cached.수정일 = res.case.수정일; }
      if (targetCase === lsCurrentCase) renderLsAttached_(lsCurrentCase);
      if (typeof loadWorkCases === 'function') loadWorkCases();
      return true;
    }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); return false; });
  }

  function renderLsBody_(){
    lsGeneration_++;
    lsResultItems = [];
    if (!lsSelectedId){
      lsBodyEl.innerHTML = '<div class="explorer-status">위에서 사건을 선택해주세요.</div>';
      lsCurrentCase = null;
      return;
    }
    var c = lsCases.filter(function(x){ return x.id === lsSelectedId; })[0];
    if (!c){
      lsBodyEl.innerHTML = '<div class="explorer-status">사건을 찾을 수 없습니다.</div>';
      lsCurrentCase = null;
      return;
    }
    lsCurrentCase = c;
    lsBodyEl.innerHTML =
      '<div class="card">' +
      '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:10px;">' + escapeHtml(c.사건명) + '</div>' +
      '<div style="display:flex; gap:6px 16px; flex-wrap:wrap; margin-bottom:10px; font-size:12.5px;">' +
      LS_ALL_SOURCES_.map(function(s){
        return '<label style="display:flex; align-items:center; gap:4px; cursor:pointer; white-space:nowrap;"><input type="checkbox" class="lsSourceChk" data-key="' + s.key + '"' + (s.on ? ' checked' : '') + '>' + escapeHtml(s.label) + '</label>';
      }).join('') +
      '</div>' +
      '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">' +
      '<input type="text" id="lsQuery" placeholder="포함어 (예: 1세대1주택 비과세)" style="flex:1; min-width:160px;">' +
      '<button type="button" id="lsSearchBtn" class="ghost-btn">검색</button>' +
      '</div>' +
      '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">' +
      '<input type="text" id="lsExclude" placeholder="제외어(선택, 쉼표로 여러 개)" style="flex:1; min-width:140px; font-size:12.5px;">' +
      // [2026.09 버그수정] 사건을 선택하면 그 사건의 세목이 뭔지 이미 알고 있는데도 이 칸을
      // 매번 다시 손으로 입력해야 했다 — 선택된 사건의 세목으로 미리 채워둔다(직접 지우거나
      // 다른 세목으로 바꿔서 검색하는 것은 여전히 자유롭게 가능).
      '<input type="text" id="lsSemok" placeholder="세목(선택, 예: 양도소득세)" value="' + escapeHtml((typeof WORK_SEMOK_LABELS !== 'undefined' && WORK_SEMOK_LABELS[c.세목]) || c.세목 || '') + '" style="flex:1; min-width:120px; font-size:12.5px;">' +
      '<input type="text" id="lsAgency" placeholder="생산기관·법원(선택, 예: 국세청, 대법원)" style="flex:1; min-width:140px; font-size:12.5px;">' +
      '<input type="text" id="lsFormType" placeholder="서식종류(선택, 예: 서식, 별표)" style="flex:1; min-width:120px; font-size:12.5px;">' +
      '</div>' +
      '<div id="lsResults"></div>' +
      '<div id="lsResultsActionBar" style="display:none; margin-top:8px;"><button type="button" id="lsAttachSelectedBtn" class="save-btn">➕ 선택한 항목 첨부</button></div>' +
      '</div>' +
      '<div class="card">' +
      '<div style="font-size:12px; color:var(--sub); margin-bottom:6px;">이 사건에 첨부된 자료</div>' +
      '<div id="lsAttached"></div>' +
      '</div>';

    renderLsAttached_(c);
    wireLsSearch_();
  }

  function wireLsSearch_(){
    var resultsBox = document.getElementById('lsResults');
    var actionBar = document.getElementById('lsResultsActionBar');
    var queryInput = document.getElementById('lsQuery');

    function selectedSources(){
      var keys = Array.prototype.map.call(document.querySelectorAll('.lsSourceChk:checked'), function(el){ return el.dataset.key; });
      return keys;
    }

    // [2026.09] 국세법령정보시스템의 검색필터(포함어/제외어/세목/생산기관/서식종류)를 옮겨왔다.
    // 실제로 확인해보니 이 필터들이 국가법령정보센터 API 자체의 파라미터는 아니라서(그런
    // 코드필터 자체가 없음), 세목은 검색어에 같이 실어 보내고(포함어와 AND 효과), 나머지
    // (제외어/생산기관/서식종류)는 검색결과를 받아온 뒤 제목·부가정보 문자열에서 걸러내는
    // 방식으로 구현했다 — 완벽한 코드분류는 아니지만 실무적으로 충분히 좁혀진다.
    function runSearch(){
      var query = queryInput.value.trim();
      if (!query){ showToast('검색어를 입력해주세요.', 'warning'); return; }
      var cats = selectedSources();
      if (!cats.length){ showToast('검색할 출처를 하나 이상 선택해주세요.', 'warning'); return; }
      var semok = document.getElementById('lsSemok').value.trim();
      var fullQuery = semok ? (query + ' ' + semok) : query;
      var excludeWords = document.getElementById('lsExclude').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      var agencyWord = document.getElementById('lsAgency').value.trim();
      var formTypeWord = document.getElementById('lsFormType').value.trim();

      resultsBox.innerHTML = '<div class="log-empty">검색 중…</div>';
      actionBar.style.display = 'none';
      lsResultItems = [];
      var searchGen = lsGeneration_;
      Promise.all(cats.map(function(category){
        return callGas('law_search_precedent', { category: category, query: fullQuery })
          .then(function(res){ return { category: category, res: res }; })
          .catch(function(err){ return { category: category, res: { error: err && err.message ? err.message : String(err) } }; });
      })).then(function(all){
        // [2026.09 버그수정] 검색 응답을 기다리는 사이 다른 사건으로 전환됐으면(=lsGeneration_
        // 증가) 이 결과는 지금 화면(다른 사건)과 무관하다 — 버린다. 이미 renderLsBody_가 이
        // DOM(#lsResults 등)을 통째로 새로 그렸으므로 resultsBox/actionBar도 더 이상 화면에
        // 붙어있지 않은 낡은 참조다.
        if (searchGen !== lsGeneration_) return;
        var anyError = null;
        var totalBeforeFilter = 0;
        all.forEach(function(entry){
          if (entry.res.error){ anyError = entry.res.error; return; }
          (entry.res.results || []).forEach(function(item){
            totalBeforeFilter++;
            var t = lsResultTitle_(entry.category, item);
            var haystack = (t.title + ' ' + t.sub).toLowerCase();
            if (excludeWords.some(function(w){ return haystack.indexOf(w.toLowerCase()) !== -1; })) return;
            if (agencyWord && haystack.indexOf(agencyWord.toLowerCase()) === -1) return;
            if (formTypeWord && entry.category === 'form' && haystack.indexOf(formTypeWord.toLowerCase()) === -1) return;
            lsResultItems.push({ category: entry.category, item: item, title: t.title, sub: t.sub });
          });
        });
        renderLsResults_();
        if (!lsResultItems.length){
          resultsBox.innerHTML = '<div class="log-empty">' + escapeHtml(anyError || (totalBeforeFilter ? '필터 조건에 맞는 결과가 없습니다(검색 자체는 ' + totalBeforeFilter + '건 있었음).' : '검색 결과가 없습니다.')) + '</div>';
        }
      });
    }
    document.getElementById('lsSearchBtn').addEventListener('click', runSearch);
    // [2026.09 버그수정] 로그인 화면과 같은 원인(e.key가 일부 환경에서 Enter로 안 잡힘) — keyCode도 같이 확인.
    queryInput.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.keyCode === 13){ e.preventDefault(); runSearch(); } });

    document.getElementById('lsAttachSelectedBtn').addEventListener('click', attachSelected_);
  }

  function renderLsResults_(){
    var resultsBox = document.getElementById('lsResults');
    var actionBar = document.getElementById('lsResultsActionBar');
    resultsBox.innerHTML = '';
    lsResultItems.forEach(function(ri, idx){
      var attached = lsIsAttached_(ri.category, ri.item.id);
      var row = document.createElement('div');
      row.className = 'log-entry';
      row.dataset.ridx = idx;
      row.innerHTML =
        '<div style="flex:0 0 auto; display:flex; align-items:center;">' +
        (attached ? '<span title="첨부됨" style="font-size:15px;">✅</span>' : '<input type="checkbox" class="lsResultChk" data-idx="' + idx + '">') +
        '</div>' +
        '<div class="log-date">' + escapeHtml(LS_CATEGORY_LABELS_[ri.category] || ri.category) + '</div>' +
        '<div class="log-text" style="flex:1;"><b>' + escapeHtml(ri.title) + '</b>' +
        (ri.sub ? '<br><span style="color:var(--sub); font-size:12px;">' + escapeHtml(ri.sub) + '</span>' : '') + '</div>' +
        (attached ? '<span style="color:var(--navy); font-size:12px; font-weight:700;">첨부됨</span>' : '');
      resultsBox.appendChild(row);
    });
    actionBar.style.display = lsResultItems.length ? 'block' : 'none';
  }

  // [2026.09] 결정유형(인용/기각/각하, 위헌/합헌 등)은 원본 검색결과에 코드필드로 없고
  // 판결문 문장(주문·결정요지 등) 안에 섞여 있어서, 미리 걸러주는 필터로는 못 만든다(수백 건을
  // 다 열어봐야 해서 너무 느림). 대신 첨부할 때는 이미 원문을 가져오니, 그 문장에서 흔한
  // 표현을 찾아 참고용 딱지만 붙여준다 — 정확한 분류가 아니라 "대략 이런 결과였다"는 참고용.
  function lsInferOutcome_(category, detail){
    var text = '';
    if (category === 'tax_tribunal') text = String(detail.주문 || detail.재결요지 || '');
    else if (category === 'constitutional') text = String(detail.결정요지 || detail.판시사항 || '');
    else if (category === 'precedent') text = String(detail.판결요지 || detail.판시사항 || '');
    else return '';
    var patterns = [
      ['일부인용', /일부\s*인용/], ['일부기각', /일부\s*기각/],
      ['인용', /인용(한다|함|되었다|결정)/], ['기각', /기각(한다|함|되었다|결정)/], ['각하', /각하(한다|함|되었다|결정)/],
      ['위헌', /위헌(이다|이라고|선언|결정)/], ['헌법불합치', /헌법\s*불합치/], ['합헌', /합헌(이다|이라고|결정)/]
    ];
    for (var i = 0; i < patterns.length; i++){ if (patterns[i][1].test(text)) return patterns[i][0]; }
    return '';
  }

  function attachSelected_(){
    var checked = Array.prototype.map.call(document.querySelectorAll('.lsResultChk:checked'), function(el){ return Number(el.dataset.idx); });
    if (!checked.length){ showToast('첨부할 항목을 체크해주세요.', 'warning'); return; }
    var btn = document.getElementById('lsAttachSelectedBtn');
    btn.disabled = true;
    btn.textContent = '조회 중…';

    // [2026.09 버그수정] 조회(law_get_precedent_detail)에 시간이 걸리는 동안 사용자가 다른
    // 사건으로 전환할 수 있다 — 지금 이 순간의 사건을 캡처해두고 끝까지 이 사건 기준으로
    // 처리한다(완료 시점에 전역 lsCurrentCase를 다시 참조하면 그 사이 바뀐 엉뚱한 사건에
    // 첨부·저장될 위험이 있었다).
    var targetCase = lsCurrentCase;
    var picked = checked.map(function(idx){ return lsResultItems[idx]; });
    Promise.all(picked.map(function(ri){
      if (LS_NO_DETAIL_[ri.category]){
        return Promise.resolve({ 요약: lsSearchOnlySummary_(ri.category, ri.item), 결과: '' });
      }
      return callGas('law_get_precedent_detail', { category: ri.category, id: ri.item.id })
        .then(function(detail){ return { 요약: lsDetailSummary_(ri.category, detail), 결과: lsInferOutcome_(ri.category, detail) }; })
        .catch(function(){ return { 요약: (ri.sub || '') + '\n(원문 없음 — 검색결과 기본정보만 첨부됨)', 결과: '' }; });
    })).then(function(picked_results){
      var today = new Date().toISOString().slice(0, 10);
      var newEntries = picked.map(function(ri, i){
        var entry = { category: ri.category, id: ri.item.id, 제목: ri.title, 요약: picked_results[i].요약, 첨부일: today };
        if (picked_results[i].결과) entry.결과 = picked_results[i].결과;
        return entry;
      }).filter(function(entry){
        return !(targetCase.법령예규판례 || []).some(function(e){ return e.category === entry.category && e.id === entry.id; });
      });
      var newList = (targetCase.법령예규판례 || []).concat(newEntries);
      lsSaveAttachments_(newList, targetCase).then(function(ok){
        btn.disabled = false;
        btn.textContent = '➕ 선택한 항목 첨부';
        if (ok){
          showToast((targetCase === lsCurrentCase ? '' : ('(' + (targetCase.사건명 || '') + ') ')) + newEntries.length + '건 첨부했습니다.', 'success');
          // [2026.09 버그수정] 그 사이 다른 사건으로 넘어갔으면 지금 화면(#lsResults)은 이미
          // 그 다른 사건의 것이므로 여기(targetCase 기준) 결과로 덮어쓰지 않는다.
          if (targetCase === lsCurrentCase) renderLsResults_(); // 첨부된 것만 "✅ 첨부됨"으로 바뀌고 나머지는 그대로 남는다.
        }
      });
    });
  }

  function renderLsAttached_(c){
    var wrap = document.getElementById('lsAttached');
    if (!wrap) return;
    var list = c.법령예규판례 || [];
    if (!list.length){
      wrap.innerHTML = '<div class="log-empty">아직 첨부된 자료가 없습니다.</div>';
      return;
    }
    wrap.innerHTML = '';
    list.slice().reverse().forEach(function(entry){
      var row = document.createElement('div');
      row.className = 'log-entry';
      row.innerHTML =
        '<div class="log-date">' + escapeHtml(LS_CATEGORY_LABELS_[entry.category] || entry.category) +
        (entry.결과 ? '<br><span title="판결문 문장에서 자동으로 찾은 참고용 표시 — 정확한 분류 아님" style="background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:1px 6px; font-size:11px; color:var(--navy); display:inline-block; margin-top:3px;">' + escapeHtml(entry.결과) + '</span>' : '') + '</div>' +
        '<div class="log-text"><b>' + escapeHtml(entry.제목 || '') + '</b>' +
        (entry.요약 ? '<br><span style="color:var(--sub); font-size:12.5px; white-space:pre-wrap;">' + escapeHtml(entry.요약) + '</span>' : '') + '</div>' +
        '<span class="log-del" title="첨부 해제">✕</span>';
      row.querySelector('.log-del').addEventListener('click', function(){
        var newList = list.filter(function(e){ return !(e.category === entry.category && e.id === entry.id); });
        lsSaveAttachments_(newList).then(function(ok){ if (ok) renderLsResults_(); });
      });
      wrap.appendChild(row);
    });
  }

  // 사건처리 카드의 "⚖️ 법령관리에서 열기" 버튼에서 호출 — 이 화면으로 이동하고 그
  // 사건을 바로 골라준다(goToCaseHandling_과 같은 패턴).
  function goToLawSearch_(caseId){
    // [2026.09 버그수정] lsSelectedId를 goToView_보다 먼저 정해두면, 최초 진입 시
    // initLawSearch()가 실행하는 loadLsCases_()가 이미 이 값을 보고 바로 그 사건을 골라주므로
    // (loadLsCases_의 wantId = preselectId || lsSelectedId), 아래 명시적 재조회가 필요 없다 —
    // 이미 로드된 세션(goToView_ 호출 전 lsLoaded)일 때만 최신 목록으로 다시 불러온다.
    // (goToView_가 최초 진입 시 initLawSearch()를 실행해 lsLoaded를 그 안에서 true로 바꾸므로,
    // 반드시 goToView_ 호출 "전" 값을 따로 기억해둬야 한다 — 안 그러면 최초 진입 때도 항상
    // true로 보여 여기서 다시 한번 중복 조회하게 된다.)
    var wasAlreadyLoaded = lsLoaded;
    lsSelectedId = caseId;
    if (typeof goToView_ === 'function') goToView_('lawsearch');
    if (wasAlreadyLoaded) loadLsCases_(caseId);
  }
</script>

<script>
  // ============================================================
  // [2026.10.19 조견표 체계] 법령정보 하위 탭 — [📜 법령][📄 서식][📋 조견표]
  //  세무사님 말씀(원문): "세무서식도 세법해석이 함축적으로 녹아들어 있다는 점을 중요하게 생각한다면 서식관리도 조견표와
  //  마찬가지로 법령탭속에 하위탭으로 구성해야 하지 않을까?" — 셋이 서로 이어진다:
  //   조문 → 그 조문을 해석한 서식 칸 / 서식 칸 → 그 칸을 채우는 조견표·계산기 칸 / 조견표 행 → 근거 조문·서식 칸.
  //  · 서식 목록은 세액인쇄의 PRINT_REGISTRY_(subForms)를 "읽기만" 한다 — 세액인쇄에 서식을 더하면 여기도 저절로 생긴다.
  //  · 서식 원본은 열람관리 자료실과 같은 드라이브 폴더(REP_LAWREF_FOLDERS_)를 listFolder로 읽어 서식번호로 짝짓는다.
  //  · 조문 → 계산 지도는 EngineLawMap.js(자동 생성)를 앱을 만들 때 tools/build-app.js가 아래 자리에 끼워 넣는다
  //    (서버 호출 없음. 예전 구글 주소 화면에서는 null이라 "앱 화면에서만"이라고 알린다).
  //  · 칸 지도(LSI_FORM_MAPS_)·조견표(LSI_REF_TABLES_)는 세무사님 확인 전 "초안" — 운영 판정·계산에는 쓰지 않는다.
  // ============================================================
  var LSI_ENGINE_LAW_MAP_ = /*@@ENGINE_LAW_MAP@@*/null;
  // 서식번호(PRINT_REGISTRY_의 formNo 그대로) → 칸 지도 / 조견표 한 장씩(번호·이름·절차·행·개정·쓰는곳·확인필요)

번호로 과세가액 (17)·과세표준 (20) = 17 − 18 − 19). 법제처 별표서식 원본으로 다시 확인 필요 — 여기서는 뜻대로 ⑱ − ⑲ − ⑳로 적음.","국세청 전자신고 설명서(2026.2)의 '서식항목번호'는 본표에서 지금 서식(2026.3.20)보다 하나씩 작음(상속세과세가액 (17) ↔ 서식 ⑱ … 신고세액공제 (33) ↔ ㉞). 칸 대응은 이름으로 맞춤. 2026.3.20 개정 내용(어느 칸이 새로 생겼는지)은 법제처 서식 연혁으로 확인 필요.","★ 인쇄·전자신고 본표 ⑱⑲⑳이 서식 정의와 다름: ⑱ = 장례비 빼기 전 과세가액, ⑲ = 장례비·감정평가수수료 포함 공제, ⑳ = 한도 적용 전 입력값. 그래서 인쇄된 ⑱ − ⑲ − ⑳ ≠ ㉑(감정평가수수료가 있으면 그만큼 어긋남)이고, 국세청 점검식 '과세표준 = 17 − 18 − 19'에 걸릴 수 있음. 엔진 결과에 '장례비 뺀 과세가액'·'한도 적용 공제(limitedDeduction)'·'공제적용한도액(overallDeductionLimit)' 키가 없어 인쇄가 쓸 값이 없음.","⑦ 외국에 주소를 둔 상속인 여부 칸이 계산기에 없고, 신고기한 9개월(§67④)을 납부지연일수에 반영하지 않음.","⑫ 상속원인 칸이 계산기·인쇄에 없음.","인쇄 본표에 ㉙ 소계·㊲ 공제·면제 후 납부할 세액·㊷~㊺ 납부방법 줄이 없음.","㉔ 세대생략 비율 분모(화면: 총상속재산가액)가 §27 '상속재산(가산 증여재산 중 상속인·수유자가 받은 것 포함)'과 같은지.","㉖ 이자상당액 근거: 서식 작성방법은 §18의2⑨·§18의3⑦, 국세청 설명서는 '§18조제10항' — 현행 조문 번호 확인 필요.","㉚ 시행령 조문 번호(§20의4)·㉛ 조특법 항 번호·㉜ 시행령 §21① 산식·㉝ 단기세액공제율·㊱ 영리법인 산식은 이번에 법제처 원문 대조를 하지 않음(계산기 주석 기준).","㉞ 신고세액공제·㉔ 세대생략가산액의 원 미만 처리(엔진 Math.round) 기준 확인 필요."]},"상속세 및 증여세법 시행규칙 [별지 제9호서식 부표1]":{"서식번호":"상속세 및 증여세법 시행규칙 [별지 제9호서식 부표1]","이름":"상속세과세가액계산명세서","서식판":"개정 2025. 3. 21. (서식 앞쪽 머리글 그대로)","출처":[{"이름":"서식 원문 PDF 3~4쪽(앞쪽·뒤쪽 작성방법) — 사무소 보관본","주소":"J:/내 드라이브/0 NETAX/업무관리자/세금계산/5 상속세/상증세법 [별지 제9호서식] 상속세과세표준 및 자진납부계산서.pdf"},{"이름":"국가법령정보센터 상속세 및 증여세법(법제처 DRF 원문, MST 276123) §12~§17","주소":"https://www.law.go.kr/법령/상속세및증여세법/제13조"},{"이름":"국가법령정보센터 상속세 및 증여세법 §14","주소":"https://www.law.go.kr/법령/상속세및증여세법/제14조"},{"이름":"국가법령정보센터 상속세 및 증여세법 시행령(MST 290845, 시행 2026-10-01) §9(공과금 및 장례비용)","주소":"https://www.law.go.kr/법령/상속세및증여세법시행령/제9조"},{"이름":"국세청 상속세 전자신고파일 설명서(2026년 2월) 16~18쪽 '상속세과세가액계산명세서_상속세 과세가액계산 레코드(자료구분 04)' — 칸 산식 대조용","주소":"J:/내 드라이브/0 NETAX/업무관리자/세금계산/5 상속세/☆상속세전자신고파일설명서(2026년2월).pdf"}],"상태":"초안","칸":[{"칸":"①","이름":"재산구분 코드","작성방법":"작성방법 1: 재산구분 코드표에서 골라 적음 — A11 상속재산(상속인), A12 상속재산(상속인 외), A13 상속개시전 처분재산, A21~A24 증여재산가산(상속인/상속인 외/창업자금/가업승계), B11~B13 비과세재산(금양임야/공공단체 유증/기타), B21~B22 과세가액불산입(공익법인 출연재산/공익신탁재산)","계산":"—","근거조문":["상증세법 §13","§12","§15~§17"],"계산기칸 구 → 2026-07-01부터 제물포구. 인천 남구 → 2018-07-01부터 미추홀구. 인천 서구 → 2026-07-01부터 서해구 + 검단구.","광주(동·서·남·북·광산구)·전남 여수·순천·광양 → 2026-07-01부터 '전남광주통합특별시 ○○'(구·시 이름 그대로).","화성시 → 2026-02-01부터 만세·효행·병점·동탄구(2026-882호 '화성 동탄구'는 이 구). 수원 영통구 망포동·용인 기흥구 영덕동 등 일부 지번은 2019·2020 경계 조정으로 시가 바뀜.","부천시 → 2016-07-04~2023-12-31 구 없음, 2024-01-01부터 원미·소사·오정구 다시 있음(공고는 '부천시' 전역이라 영향 적음).","청주시: 2014-07-01 청원군 통합·4개 구. 2020-828호 '청주시(동 지역, 오창읍·오송읍)'는 통합 뒤 이름.","창원시: 2010-07-01 마산·진해 통합·5개 구(2020-1650호 '창원 성산구').","대구 군위군: 2023-07-01부터 대구광역시(조정대상지역 공고엔 없음).","세종: 2012-07-01 출범(옛 연기군·공주시·청원군 일부).","전주: 2024-01-18부터 '전북특별자치도 전주시'(구·동 그대로)."],"확인필요":["1. 마산시 합포구·회원구 폐지(2001-01-01) — 법정동코드 폐지일만 확인. 마산시 구 폐지 조례 원문은 국가법령정보센터 자치법규 검색('마산시', '합포구')에서 찾지 못함(마산시 조례는 창원 통합 뒤 대부분 폐지되어 검색 안 됨).","2. 수원시 영통구 신설(2003-11-24) — 법정동코드 생성일만 확인. 자치법규 검색('수원시 구', '영통구', '수원시 관할구역')에서 수원시 구 설치 조례를 찾지 못했고, 영통구로 옮겨 간 동 목록도 미확인.","3. 용인시 구 설치일(2005-10-31)·천안시 구 설치일(2008-06-23) — 조례 부칙은 '구를 설치한 날/구청 업무를 개시한 날'이라 날짜가 없고, 날짜는 법정동코드 생성일에만 있음. 행정안전부(당시 행정자치부) 승인 문서나 관보로 확인 필요.","4. 부천시 구 폐지일 — 조례는 2016-07-04, 법정동코드 폐지일은 2016-07-01. 표는 조례를 따름(어느 쪽이 맞는지 부천시 공보로 확인 권장).","5. 법정동코드 날짜의 한계 — 행정표준코드관리시스템 시군구 단위 목록(전 시도, 폐지 포함)을 모두 뽑아 생성일·폐지일을 대조했으나, 일부 코드는 날짜가 비어 있거나 입력일로 보이는 값(예: 2013-04-02)이 있어 '2000년 이후 일반구 신설·폐지 전부'를 이것만으로 보장하지 못함. 표의 일반구 행은 조례 원문이 있는 것은 조례 날짜, 없는 것은 확인 필요로 표시.","6. 제주 행정시 구역 — 2006-07-01 북제주군→제주시, 남제주군→서귀포시 대응은 제주특별자치도 행정시 구역 조례 원문을 아직 확인하지 않음.","7. 경계 조정(대통령령) 33건은 동·리 이름까지만 표에 적음 — 실제 이동한 지번 목록은 각 원문. 해당 동·리 주소는 지번을 원문과 맞춰 볼 것.","8. 2000-01-01~2026-10-19 사이 법률·대통령령 검색은 국가법령정보센터(제목에 '설치', '폐지', '관할구역', '경계변경', '명칭 변경', '편입', '특별자치', '특별시', '도농복합' 등)로 했음. 제목이 전혀 다른 법령 속 부칙으로 바뀐 구역은 놓쳤을 수 있음.","9. 2026-10-19 뒤 공포·시행예정 법령(다른 시·도 통합 등)은 다시 확인할 것 — 검색 시점에 시행예정 행정구역 법률은 찾지 못함.","10. 행정동(주민센터 단위) 분동·통합은 이 표 범위 밖(법정동·시군구 단위만)."]},{"번호":"1부-04","이름":"투기지역(소득세법 지정지역) 지정·해제","무엇":"소득세법 §104의2 지정지역(이른바 투기지역)의 지역별 지정 기간 — 주택 지정지역과 토지(주택 외 부동산) 지정지역을 나눠 공고 원문과 함께 적음","기준일":"양도일(§104④3호: 양도 당시 지정지역에 있는 비사업용 토지). 단서: 지정 공고일 이전에 7-190호가 '충북 청원군'으로 정정 — 청원군 주택 지정지역 해제 효력일이 09-28인지 10-10인지 원문만으로는 못 정함(표는 09-28 전날까지로 두고 확인 필요 표시). 충주시는 주택 지정 이력이 없음(토지만 2005-06-30~2007-12-02).","3. 2017-114호 세종 지정이 시행령 §168의3①1호(주택형)인지 4호(행복도시 예정지역형)인지 공고문에 호수가 없음 — 4호라면 ③3호(주택 외 부동산)가 §104④3호 대상이 될 수 있어 해석 필요(세종은 2022-09-26 해제). 예정지역 경계도 확인 필요.","4. §104④ 지정지역 가산세율 연혁 중 '2010년 12월 31일까지 양도' 한시 규정이 상시 규정으로 바뀐 개정 법률을 아직 특정하지 못함(2010년 판 한시·2018년 판 상시만 대조).","5. 2003~2009년 §104④ 탄력세율(±15%p, 지정지역 한정 가능) 위임을 실제 시행령에서 썼는지 — 2004·2006년 시행령 판에서는 찾지 못함, 다른 판 미확인.","6. 2025-10-15 부동산 대책 — 관보 지정지역 공고 목록에는 변경이 없음(조정대상지역·투기과열지구·토지거래허가구역만 바뀜). 재정경제부·국토교통부 보도자료 원문으로는 아직 확인하지 않음.","7. 국가법령정보센터 행정규칙에 지정지역 공고가 실려 있는지는 확인하지 못함(자동 조회가 빈 응답) — 표의 근거는 관보.","8. 2003-02-27 제2003-9호는 제목이 '부동산투기지역지정'이나 본문은 주택 — 주택 지정지역으로 처리함(관보 본문 기준).","9. 2026-10-19 뒤 새 공고는 다시 확인할 것(지정권자: 2026-01-02부터 재정경제부장관)."]},{"번호":"1부-05","이름":"토지거래허가구역 지정·해제","무엇":"「부동산 거래신고 등에 관한 법률」 §10 토지거래허가구역의 지정권자·공고·효력 기간·대상 지역·대상 용도(주택·아파트 중심, 서울·경기, 2018년 이후)","기준일":"쓰는 곳마다 다름 — 다주택 중과 한시배제 나목: 토지거래허가 신청·허가·계약일 기준(2026-05-09까지 신청), 농어촌주택(조특법 §99의4): 취득 당시","근거법령":["부동산 거래신고 등에 관한 법률 §10①(국토교통부장관 또는 시·도지사가 5년 이내 지정, 허가대상자·용도·지목 특정 가능)·②(도시계획위원회 심의)·⑤(지정 공고일부터 5일 후 효력)·⑦(해제·축소엔 ⑤ 준용 안 함 — 공고일 효력) — https://www.law.go.kr/법령/부동산거래신고등에관한법률/제10조","소득세법 시행령 §167의3①12의2호 나목(토지거래허가 대상 주택부수토지에 정착된 주택: 2026-05-09까지 허가 신청·허가·계약금 수령, 계약일부터 4개월(표 지역 6개월) 이내 양도, 2026-05-10 이후 계약은 2026-09-09(표 지역 2026-11-09)까지) — 같은 문구가 §167의4·§167의10·§167의11에도 — https://www.law.go.kr/법령/소득세법시행령/제167조의3 (현행 대통령령 제36737호 원문 직접 대조)","조세특례제한법 §99의4①1호가목4)(농어촌주택 소재지에서 「부동산 거래신고 등에 관한 법률」 §10에 따른 허가구역 제외, 취득 당시 기준) — https://www.law.go.kr/법령/조세특례제한법/제99조의4","소득세법 시행령 §168의14(비사업용토지 부득이 사유) — 현행 원문엔 허가구역 문구 없음(확인필요 7)"],"근거서식":[],"출처":[{"이름":"국토교통부 공지사항 게시판(국토교통부공고)","주소":"https://www.molit.go.kr/USR/BORD0201/m_69/LST.jsp?id=N01_B"},{"이름":"서울시보 원문(PDF)","주소":"https://www.seoul.go.kr/func/seoulsibo/list.do"},{"이름":"서울부동산정보광장 토지거래허가구역 지정현황·공고문","주소":"https://land.seoul.go.kr/land/other/appointStatusSeoul.do"} 1 서리풀 신규택지 관련 공고.","7. 비사업용토지 부득이 사유와 허가구역의 연결 근거 — 현행 소득세법 시행령 §168의14·시행규칙 §83의5 원문엔 허가구역 문구가 없음. 기본통칙 104의3, 국세청 예규, 옛 조문 확인 필요(이 표는 지역·기간만 줌).","8. 경기도 자체 지정 중 아파트 관련 다른 공고 — 토지이음에서 2020-06~2026-08 일부 기간만 검색. 경기도 2020-1261호(2020-06-29, 시흥·용인·양평·평택 등, 기획부동산 임야로 보임) 미열람. 경기도 현황표(2026-04-02 기준) https://gris.gg.go.kr/gnPlan/selectLandTransactionZone.do 대조 필요.","9. 서울 정비사업 후보지(공공재개발·신속통합기획·모아타운) 계열 — 필지 단위로 수시 지정·조정·해제. 원문 확인: 2022-189, 2022-827(기간 미확인), 2022-2385, 2023-2415, 2024-145, 2025-399, 2025-1138(정정), 2023-3231(40개소 해제, 2023-11-16). 번호만 확인: 2021-156·984·1425·3211, 2022-226·2455·3443·3547, 2023-172·800·801·3544, 2024-11·914·972·1395·1658·2175·2249·2557·2697·2825·3079·3502, 2025-903·1497·2530·3142·3548, 2026-5·456·767·1910·2289·2609. 필지별 구간은 이 표에 넣지 않음 — 서울부동산정보광장 지정현황(https://land.seoul.go.kr/land/other/appointStatusSeoul.do)에서 필지로 조회할 것.","10. 2020년 이전(2018 전) 주택 관련 지정 — 국토부 공지 게시판(2017~2026 '토지거래' 59건)과 서울시보만 봄. 2017 이전 수도권 대규모 지정·해제는 관보로 다시 확인 필요.","11. 국가법령정보센터 행정규칙에는 허가구역 지정 공고가 실려 있지 않음(법령정보 API '허가구역'·'토지거래' 검색 결과는 등기지침·업무처리규정뿐)."]},{"번호":"1부-31","이름":"유상거래 취득세율(주택·기타) — 참고용","참고용":"참고용 — 양도세 계산 연동 안 함(지방세는 세무사님이 범위 밖으로 정함). 취득가액 필요경비(취득세 납부액) 검산 참고로만.","무엇":"개인 간 유상거래 주택·기타 부동산 취득세 표준세율과 다주택 중과세율, 부가세(지방교육세·농특세)를 시기별로 적는다.","기준일":"취득일(잔금일·등기일 중 빠른 날 — 지방세법 시행령 §20)","책자":"2026 양도소득세 부록 p3 \"7. 유상거래시 취득세 세율\"","근거법령":["지방세법 §11①7호나목·8호, §13의2(본조신설 2020.8.12.)","지방세법 §151①1호(지방교육세)","농어촌특별세법 §5①6호"],"근거서식":[],"출처":[{"이름":"국가법령정보센터 지방세법 현행 [시행 2026.7.1.]","주소":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=282559&efYd=20260701"},{"이름":"국가법령정보센터 지방세법 [법률 제16855호, 2019.12.31., 시행 2020.1.1.] (6~9억 비례세율, 4주택 이상 특례 제외)","주소":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=213055&efYd=20200101"},{"이름":"국가법령정보센터 지방세법 [법률 제17473호, 시행 2020.8.12.] (§13의2 다주택 중과 신설)","주소":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=220927&efYd=20200812"}],"대조":[],"갱신":"개정 때","상태":"초안","절차":[],"행":[{"구분":"주택 유상거래 — 6억원 이하","시작":"2020-01-01","끝":null,"값":"1%","책값":"6억이하 1% / 1주택 1~3%","조  코드 05.","조특법 §98의2(지방미분양주택, 2008.11.3.~2010.12.31. 취득 → 표2 적용) — 원문 미대조. 서식 코드 06. 엔진에 해당 분기 없음.","조특법 §97의5·§97의6 등 그 밖의 임대 관련 장특공 특례, 조특법 §99의2 등 — 목록만, 원문 미대조.","조정대상지역 다주택 중과 배제 기간(시행령 §167의3①12호의2·§167의10①12호의2 등, 2022.5.10.~2026.5.9. 양도·보유 2년 이상)과 그 연장 여부 — 중과가 배제되면 장특공 대상이 되므로 2부-02·조정대상지역 이력표(5번 담당)와 연결 필요. 이 표에서는 원문 확인 안 함.","2009~2010년 다주택 세율 특례(법률 제9270호 부칙 제14조 및 그 뒤 연장·개정 부칙들)의 정확한 적용 기간 — 부칙 제14조 원문만 확인, 이후 연장 부칙은 미확인.","2008.1.1.~2008.2.21. 시행령 §159의2가 \"법 제95조제2항제3호 단서\"(옛 조문 구조)를 가리키던 기간의 해석 — 원문은 그렇게 적혀 있음(법 조문 개편과 시행령 정비 사이 틈), 실무 해석은 세무사님 확인.","고가주택 12억(2021.12.8. 전 9억) 초과분 안분(§95③·시행령 §160) 기준금액 연혁 — 2부-04 담당.","1세대1주택 표2의 \"보유기간\" 계산에서 다른 주택 처분 후 남은 1주택의 보유기간 재기산(옛 시행령 §154⑤, 2021.1.1.~2022.5.9.) 문제 — 비과세 보유기간 쪽 규정이라 이 표에 넣지 않음, 장특공 보유기간에 영향이 있는지 확인 필요.","2007년 이전 양도분 공제율 — 원문 미수집."]},{"번호":"2부-04","이름":"고가주택 기준금액 연혁(1세대1주택 비과세 한도·고가주택 안분·조합원입주권 고가 판정)","무엇":"1세대1주택(또는 1조합원입주권)이라도 양도 당시 실지거래가액 합계가 이 금액을 넘으면 '고가주택'으로 보아 비과세하지 않고, 넘는 부분 비율만큼만 양도차익·장기보유특별공제액을 계산한다. 그 기준금액을 양도 시기별로 정한다. (2부-04 \"1세대1주택 비과세 판정표\" 중 고가주택 부분 — 보유·거주요건·일시적2주택 등 나머지는 같은 번호로 뒤에 보탬)","기준일":"양도일(소득세법 §98 — 보통 잔금청산일). 2008년·2021년 개정 부칙 모두 \"시행 후(이후) 양도하는 분(주택·조합원입주권)부터\"로 정함","근거법령":["소득세법 §89①3호 각 목 외의 부분(고가주택 제외) — 2021.12.8.부터 법에 12억원 직접 규정, 그 전은 \"대통령령으로 정하는 기준\"","소득세법 §89①4호 각 목 외의 부분 단서(고가 조합원입주권) — 2021.12.8.부터 법에 12억원, 그 전은 시행령 §155⑰","소득세법 §95③(고가주택 양도차익·장기보유특별공제액 계산 위임)","소득세법 시행령 §156①(고가주택의 범위), §160①(고가주택 양도차익 등의 계산 — 안분 산식의 기준금액)","소득세법 시행령 §155⑰(2021.12.7.까지 고가 조합원입주권 기준 9억원)","소득세법 일부개정법률(법률 제18578호) 부칙 제1조제3호·제7조④⑤, 소득세법 시행령 일부개정령(대통령령 제21062호) 부칙 제2조, (대통령령 제32420호) 부칙 제8조"],"근거서식":["소득세법 시행규칙 [별지 제84호서식 부표1] 양도소득금액 계산명세서 — 고가주택 양도차익·장기보유특별공제 칸(작성방법의 고가주택 안분)","소득세법 시행규칙 [별지 제83호서식] 계열 1세대1주택 특례적용신고서(비과세 판정 근거)"],"출처":[{"이름":"국가법령정보센터 소득세법 시행령(대통령령 제18705호, 시행 2005.2.19.) §156① 6억원·§160① 6억원","주소":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=66864&efYd=20050219"},{"이름":"국가법령정보센터 소득세법 시행령(대통령령 제21062호, 2008.10.7. 공포·시행) §156① 9억원, 부칙 제2조","주소":"https://ww 각 호 늦은 날)까지 양도해야 중과 배제 — 책 뒤 개정","적용기준":"양도일","부칙":"167의3 별도 적용례 없음(시행일 이후 양도)"}],"쓰는곳":[{"곳":"계산기 칸","이름":"엔진 rentalLongTermRate(type, holdingYears, rentalYears)(513행) — rental_general=§97의3, rental_long=§97의4; 입력 t.rentalSpecialType·t.rentalYears, 결과 \"장기임대주택특례_적용여부\"(1222행)","보는날":"날짜 안 봄(임대연수만). 이 표 적용 시 등록일·양도일·취득일 필요"},{"곳":"계산기 칸","이름":"엔진 §97의3 임대기간분 안분(925~952행) — acquisitionStandardPrice·registrationStandardPrice·transferStandardPrice","보는날":"기준시가 3종"},{"곳":"계산기 칸","이름":"엔진 calculateLongTermRentalHouseReductionJS(7150행)·resolveLongTermRentalHouseReductionAdjustment_(1445행) — §97(sect97, subType)·§97의2·§97의5, 입력 t.longTermRentalHouseProvision·lrSubType·lr*StandardPrice","보는날":"날짜 안 봄"},{"곳":"계산기 칸","이름":"엔진 다주택 중과 판정 isMultiHouseSurcharge(921행) — isRentalSpecial이면 중과 제외","보는날":"양도일(한시유예만)"},{"곳":"사건처리 판정","이름":"임대주택 사건: 등록일(구청·세무서)·임대개시일·취득일(계약일)·임대개시일 기준시가·전용면적·임대료 증가율·조정대상지역 여부를 증빙(임대사업자 등록증·임대차계약서·표준임대차계약 신고)에서 모아 이 표 단계 1~6으로 특례를 고름","보는날":"등록일·취득일·양도일"}],"엔진과다른곳":["513~525 rentalLongTermRate(rental_general): 10년 이상 70%만 돌려준다(523). 원문은 2022.12.31. 이전 등록분이면 8년 이상 50%·10년 이상 70%(2016.1.1. 이후 양도, 법률 제13560호), 2015년 양도는 8년 50%·10년 60%(법률 제12853호), 2014년 양도는 10년 60%(법률 제12173호) — 8년 이상 10년 미만 임대한 2022년 이전 등록분은 엔진이 특례를 아예 안 준다(null → 일반 표1).","517~519 엔진 주석 \"8년 이상 50%는 2018.1.16 개정본까지 … 2020년 임대주택 등록제도 개편으로 삭제\"는 원문과 다르다 — 실제 삭제는 2022.12.31. 개정(법률 제19199호, 2023.1.1. 시행)이고 부칙 제38조로 그 전 등록분은 종전 규정(8년 50%)을 계속 적용한다.","513~525 등록일을 전혀 보지 않는다 — 등록기한(2020.12.31.까지 매입·2022.12.31./2024.12.31./2027.12.31.까지 건설), 2023.1.1. 이후 등록은 민간건설임대만, 2020.7.11. 이후 아파트 매입 등록신청·단기→장기 변경신고 제외, 2018.9.14. 이후 취득분 임대개시일 기준시가 6억(수도권 밖 3억) 가액요건, 국민주택규모, 임대료 5% 요건을 판정하지 않고 입력값 rentalSpecialType만 믿는다.","911~913 isOneHouse(1세대1주택 표2)인 거래에도 rentalRate가 ltRate를 덮어쓴다 — §97의4① 단서(\"같은 항 단서에 해당하는 경우에는 그러하지 아니하다\")와 다름: 1세대1주택 표2(최대 80%)가 표1+추가공제(최대 40%)로 낮아질 수 있다.","921 isMultiHouseSurcharge = … && !isRentalSpecial — 장특공 특례(§97의3·§97의4) 대상이면 다주택 중과를 무조건 뺀다. 원문의 중과 배제는 소득령 §167의3①2호 각 목(마목 단서1 2018.9.14. 이후 1주택 이상 세대의 조정지역 신규취득 장기일반 매입 제외, 2026.10.1.부터 ⑪ 아파트 매입 2027.12.31. 양도기한, 아목 단기매입 조정지역 제외 등)으로 따로 판정한다. 반대로 §97의3·§97의4 특례가 없는 장기임대주택(가목·마목·바목·아목·자목)의 중과 배제를 판정하는 분기는 엔진에 없다(multiHouseCount 숫자 입력뿐).","945 임대 전 기간 양도차익에 normalRate = longTermRate(holdingYears) — 현행 표1만 쓴다(2018년 이전 양도는 옛 표1 10~30%, 2부-03; longTermRateAt_ 미사용).","526~533 rentalLongTermRate(rental_long, §97의4): 추가공제율 표(6년 2%~10년 10%)는 원문과 같다. 그러나 대상 판정(소득령 §167의3①2호 가목·다목 = 2018.3.31.까지 사업자등록등, 가목 매입 1호·임대개시일 기준시가 6억/수도권 밖 3억, 다목 건설 2호·대지 298㎡·연면적 149㎡·6억, 2019.2.12. 이후 계약·갱신분 임대료 5%)이 없다.","533 longTermRate(holdingYears) — 날짜를 안 보는 현행 표1만 더한다(2018년 이전 양도는 옛 표1 기준이어야 함).","1443~1444·1464~1469 §97의5를 \"감면대상 양도소득금액을 빼는(소득공제처럼)\" 방식으로 처리한다. 원문은 \"임대기간 중 발생한 양도소득에 대한 양도소득세의 100분의 100에 상당하는 세액을 감면\"(세액감면)이고, 감면 대상이 양도소득의 일부(임대기간분)라서 주석의 \"전액면제는 0=0이라 같다\"는 논리가 성립하지 않는다 — 기본공제 250만원·누진세율 때문에 세액이 달라질 수 있다(감면세액 계산식 소득세법 §90 원문은 미대조).","7150~7212 calculateLongTermRentalHouseReductionJS: §97(2000.12.31. 이전 임대개시·5호 이상), §97의2(2호 이상·신축 1호 포함), §97의5(2018.12.31.까지 취득·3개월 이내 등록·10년 계속 임대·§97의3①2호 요건 준수) 요건을 판정하지 않고 provision/subType 입력만 믿는다. §97의5 감면세액의 농어촌특별세 20%(책 내용)는 계산하지 않는다.","7200~7204 기준시가 3종이 없으면 \"양도가액 − 등록일 평가액\"으로 근사 — 원문(조특령 §97의5②)은 기준시가 비율 계산식만 정한다(근사 허용 근거 없음)."],"책과원문다름":["§97 행정요건: 책 \"세무서 사업자등록 요건 아님\" — 원문은 사업자등록 대신 임대개시일부터 3월 이내 세무서에 \"주택임대신고서\" 제출을 요구(조특령 §97③).","§97 단서 건설/매입: 책 \"구분 없음\" — 원문 단서는 건설임대(5년)와 매입임대(1995.1.1. 이후 취득·미입주, 5년)를 나눠 적음.","§97의2 \"임대개시기한 2001.12.31.\": 원문에 임대개시 기한 문구는 없음(신축 기간·매매계약 기간의 끝).","§97의4 주택규모 \"해당 없음\": 원문 다목(건설)은 대지 298㎡·연면적 149㎡ 이하 요건 있음.","§97·§97의2 중과 배제(소득령 §167의3①3호): 2026.9.30. 개정(2026.10.1. 시행)으로 아파트 민간매입임대이면 2027.12.31.(⑪ 각 호 늦은 날)까지 양도해야 함 — 책 뒤 개정.","§97의3 공제율: 책은 \"2022.12.31. 이전 등록 8년 50%·10년 70%\"만 적음 — 원문상 2015년 양도는 8년 50%·10년 60%, 2014년 양도는 10년 60%(책은 2016년 이후 양도 기준)."],"확인필요":["§97의5 농어촌특별세 20%(책 \"농특세 20% 납부\") — 농어촌특별세법 §5①1호·§4 비과세 목록 원문 미대조.","§97·§97의2 옛 판(2010.1.1. 전문개정 이전) 본문·부칙 — 미대조. 현행 문구로만 적음.","조특령 §97의3⑤·§97의5② 기준시가 안분 계산 시작":null,"끝":null,"값":"조특법 §99에 따라 양도소득세가 감면되는 주택은 1세대 3주택 이상 중과 대상에서 제외(2주택 중과는 §167의10①2호, 주택+입주권·분양권은 §167의4③2호가 같은 목록을 가리킴). 다만 다른 주택의 중과 판정 때 주택 수에는 들어감(§167의3① 괄호는 1호·12호만 뺌)","책값":"중과세 배제","조건":"감면주택 자체를 양도할 때","근거조문":"소득세법 시행령 §167의3①5호·§167의10①2호·§167의4③2호","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=290841&efYd=20261001","확인":"원문 대조됨"},{"책자":"2026 양도소득세 부록 p1","구분":"§99의3 신축주택 — 대상자","시작":"2000-11-01","끝":null,"값":"거주자(주택건설사업자는 제외)","책값":"거주자에 한함","조건":"","근거조문":"조특법 §99의3① 본문","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918","확인":"원문 대조됨"},{"책자":"2026 양도소득세 부록 p2","구분":"§99의3 신축주택 — 1기(수도권 밖·국민주택)","시작":"2000-11-01","끝":"2001-05-22","값":"수도권 밖에 있는 국민주택(부수토지 연면적 2배 이내)만 — 주택건설사업자와 2000.11.1.~2001.12.31.에 최초 매매계약·계약금 납부 또는 그 기간 사용승인 받은 자가건설 주택. 효과: 5년 이내 양도 세액 100% 감면, 5년 후 5년간 양도소득금액 공제","책값":"■ 서울 이외 지역: 2000.11.1.~","조건":"2001.8.14. 개정으로 기간이 2001.5.23.~로 바뀌었고, 2001.5.23. 전에 취득한 신축주택은 종전 규정(법률 제6501호 부칙 제13조) → 이 구간 = 취득일 2000.11.1.~2001.5.22.","근거조문":"조특법 §99의3①(신설 2000.12.29., 법률 제6297호, 시행 2001.1.1.), 조특령 §99의3①(2001.1.1. — 수도권 = 별표 7 제1호), 법률 제6501호 부칙 제13조","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=54893&efYd=20010101 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=58254&efYd=20010101 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=54135&efYd=20010814","확인":"원문 대조됨 — 책과 원문 다름: 책 \"서울 이외 지역\", 원문 \"수도권 외의 지역\"·\"국민주택에 한하며\""},{"책자":"2026 양도소득세 부록 p2","구분":"§99의3 신축주택 — 2기(전국)","시작":"2001-05-23","끝":"2003-06-30","값":"전국의 신축주택(국민주택 한정 없음, 고가주택 제외) — 2001.5.23.~2003.6.30.에 주택건설업자와 최초 매매계약·계약금 납부(조합 잔여주택 등 포함) 또는 그 기간 사용승인 받은 자가건설 주택(관리처분인가일·사업계획승인일 현재 조합원 취득분 포함)","책값":"■ 전국 확대: 2001.5.23.~2003.6.30.","조건":"2001.8.14. 개정은 \"시행 후 최초로 양도하는 분부터\"(부칙 제5조①). 서울·과천·5대 신도시는 다음 행","근거조문":"조특법 §99의3①1호·2호(개정 2001.8.14., 법률 제6501호), 조특령 §99의3③⑤","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=54135&efYd=20010814 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨"},{"책자":"2026 양도소득세 부록 p2","구분":"§99의3 신축주택 — 2기 중 서울·과천·5대 신도시","시작":"2001-05-23","끝":"2002-12-31","값":"서울특별시·과천시·택지개발지구 분당·일산·평촌·산본·중동 신도시는 2003.1.1. 이후 계약(취득)분부터 대상에서 빠짐 → 사실상 2002.12.31.까지 계약·계약금 납부분만. 다만 2003.1.1. 전에 착공해 2003.6.30.까지 사용승인 받은 자가건설 주택은 종전 규정","책값":"(서울, 과천 5대 신도시는 2002.12.31.)","조건":"\"부동산 가격 급등(우려) 지역\"으로 대통령령이 정한 지역 제외(2002.12.11. 법 개정, 2002.12.30. 시행령 §99의3① 신설). 부칙 제29조①: 시행 전 계약·계약금 납부분은 종전 규정","근거조문":"조특법 §99의3① 본문(개정 2002.12.11., 법률 제6762호, 시행 2003.1.1.) 부칙 제29조, 조특령 §99의3①","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=55304&efYd=20030101 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨"},{"책자":"2026 양도소득세 부록 p2","구분":"§99의3 신축주택 — 제외","시작":"2001-05-23","끝":null,"값":"매매계약일 현재 입주한 사실이 있는 주택 / 2001.5.23. 전에 맺은 분양계약을 해제하고 본인·배우자(직계존비속·형제자매 포함)가 다시 분양받거나 대체 주택을 분양받은 주택 / 양도 당시 고가주택","책값":"좌동(입주사실·계약해제 후 배우자 등 재계약) / 고가주택 제외","조건":"","근거조문":"조특법 §99의3①단서·①1호 단서, 조특령 §99의3④","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨"},{"책자":"2026 양도소득세 부록 p2","구분":"§99의3 신축주택 — 과세특례","시작":"2016-01-01","끝":null,"값":"§99와 같음 — 5년 이내 양도: 취득일~양도일 양도소득금액 전액 공제 / 5년 후: 5년간분 공제(조특령 §99의3② 계산식). 2015.12.31. 이전 양도분은 5년 이내 양도 시 양도소득세 면제(세액감면 방식)","책값":"5년간 발생한 양도소득금액 전액감면","조건":"양도일 기준(법률 제13560호 부칙 제2조③)","근거조문":"조특법 §99의3①(개정 2015.12.15.), 조특령 §99의3②","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=177204&efYd=20160101","확인":"원문 대조됨"},{"책자":"2026 양도소득세 부록 p2","구분":"§99의3 신축주택 — 비과세 주택 수·중과","시작":null,"끝":null,"값":"주택 수: 다른 주택을 2007.12.31.까지 양도할 때만 제외 → 2008년 이후 양도는 주택 수 포함 / 중과: 감면주택 자체는 중과 제외(소득령 §167의3①5호)","책값":"주택수 포함 / 중과세 배제","조건":"","근거조문":"조특법 §99의3②, 소득세법 시행령 §167의3①5호","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=290841&efYd=20261001","확인":"원문 대조됨(책과 같음)"},{"책자":"2026 양도소득세 부록 p1","구분":"§99의4 농어촌·고향주택 — 대상자","시작":"2003-08-01","끝":null,"값":"거주자와 그 배우자가 구성하는 1세대(소득세법 §88 6호의 1세대)","책값":"거주자에 한함 / 적용대상: 일반주택 1채를 소유한 자","조건":"법 문언은 \"농어촌주택등 1채를 취득해 3년 이상 보유하고 그 취득 전 보유하던 다른 주택(일반주택)을 양도\" — 일반주택이 1채여야 하는 것은 §89①3호 1세대1주택 비과세 판정에서 나옴","근거조문":"조특법 §99의4① 본문, 조특령 §99의4①","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨"},{"책자":"2026 양도소득세 부록 p2","구분":"§99의4 — 취득기간(현행)","시작":"2026-01-01","끝":null,"값":"농어촌주택: 2003.8.1.~2028.12.31. / 고향주택: 2009.1.1.~2028.12.31.(자기가 건설해 취득한 경우 포함)","책값":"2003.8.1.~2028.12.31. / 2009.1.1.~2028.12.31.","조건":"취득일 기준. 2025.12.23. 개정(시행 2026.1.1.)으로 2025.12.31. → 2028.12.31. 연장 — 책과 같음","근거조문":"조특법 §99의4① 본문(개정 2025.12.23., 법률 제21223호)","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=280409&efYd=20260101","확인":"원문 대조됨(책과 같음)"},{"책자":"2026 양도소득세 부록 p2","구분":"§99의4 — 농어촌주택 지역(현행)","시작":"2024-01-01","끝":null,"값":"취득 당시 다음 중 하나: (가) 기회발전특구에 소재 — 단, 수도권과밀억제권역 안의 기회발전특구는 빼되 그곳이 인구감소지역이나 접경지역이면 포함 → 이 경우 읍·면·동 요건과 아래 제외지역을 따지지 않음 / (나) 읍·면 또는 [별표 12] 시 지역에 속한 동에 소재하고 다음이 아닐 것: 1) 수도권(접경지역이면서 인구감소지역으로 재정경제부령이 정한 곳은 제외에서 뺌) 2) 도시지역(인구감소지역이면서 기업도시개발구역으로 재정경제부령이 정한 곳은 제외에서 뺌) 3) 조정대상지역 4) 토지거래 허가구역 5) 관광단지","책값":"수도권 및 도시지역 등 제외주) / 주) 기회발전특구(수도권과밀억제권역 밖에 한정)에 주택이 소재하는 경우 읍·면·동 소재 여부, 도시지역, 조정대상지역, 부동산거래 허가구역, 관광단지 여부와 무관하게 적용됨","조건":"기회발전특구 부분은 2023.12.31. 개정(시행 2024.1.1.) — 부칙 제16조 \"이 법 시행 이후 일반주택을 양도하는 경우부터\". 동(洞) 범위는 2026.2.27. 시행령 개정으로 \"[별표 12] 시 지역에 속한 동\"(종전: 그중 일반주택 소재 동과 같거나 연접하지 않은 동)","근거조문":"조특법 §99의4①1호가목(개정 2023.12.31.·2024.12.31.·2026.6.2. 법명 변경), 조특령 §99의4②③④⑤(②개정 2026.2.27.)","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=257993&efYd=20240101 ; https://www.law.go.kr/LSW/lsInfoP.do  양도일·농어촌주택 취득일"}],"확인필요":["조특령 [별표 12] 고향주택 소재 시 지역 목록 — 책은 \"인구 20만 이하의 시\". 별표가 그림(한글·PDF)이라 이번에 내용 미대조(법제처 별표 bylSeq=18518745).","§99의4①1호가목1) 단서(수도권 중 접경지역 예외)가 생긴 개정·적용시기 — 현행 문언·시행령 ③만 확인.","§99의4 가액 기준의 2014년 전 연혁(2억원 이전 값), 2003~2008 농어촌주택 요건 원문 — 미수집.","§99·§99의3 감면 신청 서식 번호(조특법 시행규칙 별지)와 양도세 신고서(별지 제84호서식) 감면 칸·감면 코드 — 미대조.","§99·§99의3 감면소득금액 계산식(조특령 §99①·§99의3② 그림 계산식) — 그림이라 글자 미대조.","§99의3 2기(2001.5.23.~)의 \"고급주택/고가주택\" 판정 기준 금액 연혁 — 2부-04와 연결 필요.","§99·§99의3 감면(2015년 이전 세액감면) 시 농어촌특별세 과세 여부 — 이번 범위 밖, 미대조."],"책과원문다름":["§99의3 1기: 책 \"서울 이외 지역: 2000.11.1.~\" ↔ 원문(2001.1.1. 시행 법률 제6297호) \"수도권외의 지역\"·\"국민주택에 한하며\", 2001.5.23. 전 취득분 한정.","§99의4 기회발전특구(주): 책 \"수도권과밀억제권역 밖에 한정\" ↔ 원문 \"인구감소지역 및 접경지역이 아닌 수도권과밀억제권역 안의 기회발전특구는 제외\" — 과밀억제권역 안이라도 인구감소지역·접경지역 특구는 포함.","§99·§99의3 \"5년간 발생한 양도소득금액 전액감면\": 원문은 5년 이내 양도 = 취득~양도일 전액 소득금액 공제, 5년 후 = 5년간분 공제(2016.1.1. 이후 양도), 그 전 양도는 세액감면 — 책 표현이 방식을 구분하지 않음.","§99의4 지역(책 \"수도권 및 도시지역 등 제외\")에 원문의 예외(수도권 중 접경·인구감소지역, 도시지역 중 인구감소지역·기업도시개발구역)가 빠져 있음.","책 뒤 개정: 조특령 2026.2.27. §99의4② 동 범위 변경(책 3월 현재와 같은 시기 — 반영 여부 불명), 2026.6.2. 법명 변경(내용 같음). 적용기한 2028.12.31.은 책과 원문 같음."],"엔진과다른곳":{"엔진":"C:/GitHub/wt-reftable/gs-backend/manage/taxcalc-engine.html","줄번호기준":"엔진 줄 번호는 2026-10-19 13:45 기준(8750줄 — 다른 작업으로 파일이 바뀌는 중이라 함수 이름으로 다시 찾을 것)","목록":["취득기간 확인 없음 — calculateNewHouseAcquisitionReductionJS(5188행, 주석 5162~5168행): §99(1998.5.22.~1999.6.30./12.31.)·§99의3(2000.11.1.~2003.6.30.)·§99의2(2013) 취득기간·감면신청을 검사하지 않음(주석에 \"이 도구가 검증하지 않으므로 별도로 확인\"이라고 적혀 있음).","§99의3 시기별 지역 요건 없음 — 2001.5.22. 전 취득분은 수도권 밖 국민주택만, 2003.1.1. 이후 계약분은 서울·과천·5대 신도시 제외인데 엔진은 지역 입력이 없음(5188행 함수 전체).","§99·§99의3 2015.12.31. 이전 양도분 방식 — 원문은 5년 이내 양도 시 세액 100% 감면(면제)인데 엔진은 양도일과 관계없이 소득금액 공제로만 계산(5219~5232행 근처 exemptGain). 영향은 옛 양도분 경정 때만.","5년 경계 — yearsHeld = 일수 ÷ 365.25(5212행)로 \"취득일부터 5년 이내\"를 판정 → 달력 기준과 경계일 1~2일 어긋날 수 있음.","감면주택 다주택 중과 제외 없음 — transferAssetCore의 isMultiHouseSurcharge(932행)에 newHouseReductionProvision(§99·§99의3 감면주택) 제외 분기가 없음 → 2026.5.10. 이후 조정 8 미분양 국민주택 — 2차","시작":"1998-03-01","끝":"1998-12-31","값":"같은 요건으로 1998.3.1.~1998.12.31. 취득(1998.2.28. 현재 미분양 확인)","책값":"98.3.1~98.12.31. / 98.2.28. 현재 미분양주택","조건":"취득일 기준","근거조문":"조특법 §98③, 조특령 §98⑤","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨(책과 같음)"},{"책자":"2026 양도소득세 부록 p2","구분":"§98 — 요건·특례","시작":"1995-11-01","끝":null,"값":"5년 이상 보유·임대 후 양도 시 둘 중 선택: ① 양도소득세 세율 20%(§104① 대신) ② 종합소득으로 계산(§19② 준용). 보유기간은 §95④ 준용","책값":"5년 이상 보유 임대 / 세액감면 해당 없음 / 양도세율 20%와 소득세율 비교과세 / 장특 특례 없음","조건":"책 \"비교과세\"는 원문상 납세자 \"선택\"","근거조문":"조특법 §98①1호·2호, 조특령 §98③④","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨"},{"책자":"2026 양도소득세 부록 p2","구분":"§98 — 비과세 주택 수·중과","시작":"1995-11-01","끝":null,"값":"주택 수: 이 기간에 취득한 미분양주택 외 다른 주택을 가진 거주자가 다른 주택을 팔 때는 미분양주택 빼고 다른 주택만으로 §89①3호 판정 / 중과: §97·§97의2·§98로 감면되는 임대주택으로 5년 이상 임대한 국민주택은 중과 제외(소득령 §167의3①3호)","책값":"※ 98조~98조의8 … 비과세 판단시 주택수에서 제외, 다주택중과 배제","조건":"","근거조문":"조특령 §98②⑥, 소득세법 시행령 §167의3①3호","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=290841&efYd=20261001","확인":"원문 대조됨"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의2 지방 미분양주택 — 대상","시작":"2008-11-03","끝":"2010-12-31","값":"거주자(법인은 ②)가 2008.11.3.~2010.12.31.에 취득(그때까지 계약·계약금 포함)한 수도권 밖 미분양주택: ① 입주자 계약일이 지난 단지에서 2008.11.2.까지 분양계약이 안 돼 2008.11.3. 이후 선착순 공급하는 주택 ② 2008.11.3.까지 사업계획승인(건축허가 포함)을 받았거나 신청한 사업주체가 공급하는 주택(2008.11.3. 현재 입주자 계약일 전)으로 사업주체와 최초 매매계약","책값":"거주자에 한함 / 08.11.3.~2010.12.31. / 08.11.2. 현재 미분양주택·08.11.3. 신규분양주택 / 사업주체와 최초로 매매계약을 체결하지 않은 주택 제외 / 수도권 밖 / 규모·가액·보유 제한 없음","조건":"취득일 기준. 책 \"사업주체와 최초 매매계약\"은 원문상 ②유형의 요건","근거조문":"조특법 §98의2①, 조특령 §98의2①","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨(책과 같음)"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의2 — 특례","시작":"2008-11-03","끝":null,"값":"장기보유특별공제액 = 양도차익 × 소득세법 §95② 표2의 \"보유기간별 공제율\"(1세대1주택 여부 무관) / 세율 = §104①1호 기본세율(보유기간 무관) / 부동산매매업 거주자는 종합소득산출세액을 §55①로(§64① 비교과세 안 함) / 법인은 법인세법 §55의2①2호·§95의2 추가과세 안 함(미등기 제외)","책값":"세율: 보유기간에 상관없이 누진세율 / 장특공제: 주택수 상관없이 표2(80%) 적용 / 기타: 매매업 다주택자 중과세 배제","조건":"표2는 양도일의 표 — 2021.1.1. 이후 표2는 보유기간별(최대 40%)과 거주기간별로 나뉘어 문언상 \"보유기간별 공제율\"만이면 최대 40%(2009~2020년 양도는 최대 80%). 책 \"80%\"는 2020년까지 표 기준 — 해석은 확인필요","근거조문":"조특법 §98의2①1호·2호·②③(개정 2014.1.1.), 소득세법 §95② 표2(2부-03)","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=149368&efYd=20140101","확인":"원문 대조됨 — 책과 원문 다를 수 있음(2021년 이후 양도분 \"표2(80%)\")"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의2 — 비과세 주택 수·중과","시작":"2008-11-03","끝":null,"값":"주택 수: §89①3호 적용 때 해당 거주자의 소유주택으로 보지 않음(2013년까지는 §104①4~7호 중과 판정에서도 제외) / 중과: 소득령 §167의3①5호 중과 제외","책값":"※ 비과세 판단시 주택수에서 제외, 다주택중과 배제","조건":"2014.1.1. 법률 제12173호로 \"§89①3호 및 §104①4호~7호\" → \"§89①3호\"","근거조문":"조특법 §98의2④, 소득세법 시행령 §167의3①5호","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=149368&efYd=20140101 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=290841&efYd=20261001","확인":"원문 대조됨"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의3 미분양주택 — 대상·기간","시작":"2009-02-12","끝":"2010-02-11","값":"거주자: 2009.2.12.~2010.2.11. / 국내사업장 없는 비거주자: 2009.3.16.~2010.2.11. — 서울 밖(소득세법 §104의2 지정지역 제외) 미분양주택을 사업주체(20호 미만 공급 주택건설사업자 포함)와 최초로 매매계약해 취득(2010.2.11.까지 계약·계약금 포함). 미분양주택 = 2009.2.11.까지 미계약 → 2009.2.12. 이후 선착순 공급 / 2009.2.12. 이후 입주자 계약일 도래 신규분양 / 20호 미만 건설사업자 공급 / 주택도시보증공사·대물 시공자·기업구조조정부동산투자회사등·신탁업자·주상복합 건축주 공급분","책값":"제한 없음 / 거주자 09.2.12.~10.2.11.·비거주자 09.3.16.~10.2.11. / 2009.2.11. 현재 미분양·2009.2.12. 이후 신규분양·20호 미만 주택건설사업자 공급 / 서울특별시 외 소재(투기지역 제외)","조건":"취득(계약)일 기준","근거조문":"조특법 §98의3①, 조특령 §98의3①","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨(책과 같음)"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의3 — 자가신축·제외·규모","시작":"2009-02-12","끝":"2010-02-11","값":"자가신축: 2009.2.12.~2010.2.11.에 착공(불분명하면 착공신고서 제출일)하고 사용승인·사용검사(임시 포함) 받은 주택 포함(재개발·재건축·소규모재건축 조합원분, 멸실 재건축 제외) / 제외: 매매계약일 현재 입주 사실, 기간 중 해제 후 본인·배우자(직계존비속·형제자매 포함) 재계약, 대체계약 / 규모: 수도권과밀억제권역 안이면 대지 660㎡ 이내 + 주택 연면적(공동주택 전용) 149㎡ 이내","책값":"2009.2.12.~2010.2.11. 기간 중 공사착공하고 사용승인을 받은 주택 / 입주사실·해약 후 재계약·대체계약 제외 / 수도권과밀억제권역 안은 대지면적 660㎡, 주택149㎡ 이하","조건":"과밀억제권역 여부는 매매계약일 현재(조특령 §98의3④)","근거조문":"조특법 §98의3②, 조특령 §98의3①단서·②④","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨(책과 같음)"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의3 — 감면·장특공·세율","시작":"2009-02-12","끝":null,"값":"취득일부터 5년 이내 양도: 양도소득세의 100%(수도권과밀억제권역 60%) 세액감면 / 5년 지나 양도: 취득일부터 5년간 발생한 양도소득금액(과밀 60%)을 과세대상소득금액에서 뺌(조특령 §40① 준용). 장특공 = §95② 표1(1세대1주택이면 표2) 보유기간별 공제율, 세율 = 기본세율 — §95②·§104①3호(중과·단기)와 무관","책값":"취득일로부터 5년간 100%(과밀억제권 60%) / 세율: 좌동(보유기간에 상관없이 누진세율) / 장특공제: 특례 없음","조건":"책 \"장특공제 특례 없음\" — 원문 ④는 중과 대상이어도 표1을 적용하는 특례","근거조문":"조특법 §98의3①④(개정 2014.1.1.·2016.1.19.), 조특령 §98의3③","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨 — 책 \"장특공제 특례 없음\"과 원문 ④(표1 강제 적용) 표현 다름"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의3 — 비과세 주택 수·중과","시작":"2009-02-12","끝":null,"값":"주택 수: §89①3호 적용 때 소유주택으로 보지 않음 / 중과: 소득령 §167의3①5호 중과 제외","책값":"※ 주택수 제외·다주택중과 배제","조건":"","근거조문":"조특법 §98의3③, 소득세법 시행령 §167의3①5호","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=290841&efYd=20261001","확인":"원문 대조됨"},{"책자":"2026 양도소득세 부록 p2","구분":"(참고) §98의4 비거주자 일반주택","시작":"2009-03-16","끝":"2010-02-11","값":"국내사업장 없는 비거주자가 2009.3.16.~2010.2.11.에 §98의3 미분양주택 외의 주택을 취득(2010.2.11.까지 계약·계약금 포함)해 양도 → 양도소득세 10% 세액감면. 비과세 주택 수 제외 조항 없음, 소득령 §167의3①5호 중과 제외 목록에도 없음","책값":"(③표에 없음. ※ \"조특법 98조~98조의8 … 주택수에서 제외되며, 다주택중과 배제된다\"의 범위에 문언상 포함)","조건":"취득일 기준","근거조문":"조특법 §98의4, 소득세법 시행령 §167의3①5호","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=290841&efYd=20261001","확인":"원문 대조됨 — 책 ※와 원문 다름(§98의4는 주택 수 제외·중과 배제 근거 없음)"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의5 수도권 밖 미분양주택 — 대상","시작":"2010-05-14","끝":"2011-04-30","값":"거주자 또는 국내사업장 없는 비거주자가 2010.2.11. 현재 수도권 밖 미분양주택(입주자 계약일 지난 단지에서 2010.2.11.까지 미계약 → 선착순 공급 / 주택도시보증공사·대물 시공자·구조조정리츠·신탁업자 공급분)을 2011.4.30.까지 사업주체 등과 최초 매매계약해 취득(계약금 포함). 제외: 매매계약일 현재 입주, 2010.5.14.~2011.4.30. 중 해제 후 본인·배우자 등 재계약, 대체계약","책값":"제한 없음 / 2010.5.14.~2011.4.30. / 2010.2.11. 현재 미분양주택 / 좌동(제외) / 수도권 밖 / 규모·가액·보유 제한 없음","조건":"법 문언은 \"2011.4.30.까지\"(시작일 = 본조 신설·시행일 2010.5.14., 시행령 §98의4②2호 \"2010.5.14.부터 2011.4.30.까지\")","근거조문":"조특법 §98의5①(신설 2010.5.14.), 조특령 §98의4①②","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨(책과 같음)"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의5 — 감면율","시작":"2010-05-14","끝":null,"값":{"분양가격 인하율 10% 이하":"60%","10% 초과 20% 이하":"80%","20% 초과":"100%"},"책값":"취득일로부터 5년간 분양가액 인하율에 따라 60%~100%","조건":"5년 이내 양도 = 양도소득세 × 감면율 세액감면 / 5년 후 = 5년간 발생 양도소득금액 × 감면율 공제. 분양가격 = 입주자 모집공고안 공시 분양가격, 인하율 계산식은 조특령 §98의4④(그림 — 미대조). 장특공·세율은 §98의3과 같은 특례(③) — 책은 \"세율 좌동, 장특 특례 없음\"","근거조문":"조특법 §98의5①1호~3호·③, 조특령 §98의4③④","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨(감면율). 인하율 계산식은 확인 필요"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의5 — 비과세 주택 수·중과","시작":"2010-05-14","끝":null,"값":"주택 수: 소유주택으로 보지 않음 / 중과: 소득령 §167의3①5호","책값":"※","조건":"","근거조문":"조특법 §98의5②, 소득세법 시행령 §167의3①5호","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=290841&efYd=20261001","확인":"원문 대조됨"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의6 준공후미분양 — 대상 주택","시작":"2011-03-29","끝":"2011-12-31","값":"거주자 또는 국내사업장 없는 비거주자 / 준공후미분양주택 = 사용검사·사용승인 후 2011.3.29. 현재 분양계약이 안 돼 선착순 공급하는 주택. 제외: 주택+부수토지 기준시가 합계가 취득 당시(1호는 최초 임대 개시 때) 6억 초과, 연면적(공동주택 전용) 149㎡ 초과, 준공 후 입주 사실, 2011.3.29.~2011.12.31. 중 해제 후 본인·배우자 등 재계약, 대체계약","책값":"제한 없음 / 2011.3.29.~2011.12.31. / 2011.3.29. 현재 미분양 주택 / 입주사실·재계약·대체계약 제외 / 지역제한 없음 / 전용면적 149㎡ 이하 / 임대개시당시 6억원 이하","조건":"6억 판정 시점: 1호 = 최초 임대 개시 때, 2호 = 취득 당시(책은 \"임대개시당시\"만). 법 문언에 \"취득기간\"은 따로 없고, 2011.3.29.~12.31.은 시행령 제외 사유의 기간·임대계약 기한 — 부칙 제4조 \"2011.3.29. 현재 준공후미분양주택을 최초로 양도하는 분부터\"","근거조문":"조특법 §98의6①(신설 2011.5.19., 법률 제10631호) 부칙 제4조, 조특령 §98의5②③","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=113166&efYd=20110519","확인":"원문 대조됨 — 책 \"임대개시당시 6억\"은 1호 기준만"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의6 — 1호·2호 임대 요건","시작":"2011-03-29","끝":null,"값":"1호: 사업주체등(사업주체·주택도시보증공사·대물 시공자·구조조정리츠·신탁업자)이 2011.12.31.까지 임대계약을 맺어 2년 이상 임대한 주택을 거주자 등이 사업주체등과 최초 매매계약해 취득 / 2호: 사업주체등과 최초 매매계약해 취득하고 5년 이상 임대(소득세법 §168 사업자등록 + 민간임대주택법 §5 임대사업자등록을 하고 2011.12.31. 이전 임대계약을 맺은 경우만). 임대기간은 등록 후 임대 개시일부터, 상속인은 피상속인 기간 합산","책값":"5년 이상 임대 요건 등주) / 2호: 임대등록 및 사업자등록을 하고 2011.12.31. 이전에 임대계약을 체결한 경우 / 주) ① 1호 … 2년 이상 임대한 주택을 거주자 등이 최초 계약 체결하여 취득한 주택 ② 2호 … 5년 이상 임대한 주택","조건":"","근거조문":"조특법 §98의6①1호·2호, 조특령 §98의5①⑤","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨(책과 같음)"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의6 — 감면·장특공·세율","시작":"2011-03-29","끝":null,"값":"취득일부터 5년 이내 양도: 양도소득세 50% 세액감면(1호 요건 주택만) / 5년 지나 양도: 취득일부터 5년간 발생한 양도소득금액의 50%를 과세대상소득금액에서 뺌. 장특공 = 표1(1세대1주택이면 표2) 보유기간별, 세율 = 기본세율(중과·단기와 무관)","책값":"취득일로부터 5년간 50% / 세율: 보유기간에 상관없이 누진세율 / 장특공제: 특례 없음","조건":"","근거조문":"조특법 §98의6①③, 조특령 §98의5④","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨 — 책 \"장특 특례 없음\"과 원문 ③ 표현 다름"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의6 — 비과세 주택 수·중과","시작":"2011-05-19","끝":null,"값":"주택 수: §89①3호 적용 때 소유주택으로 보지 않음(2011.5.19.~2013.12.31.은 §104①4~7호 중과 판정에서도 제외) / 중과: 소득령 §167의3①5호","책값":"※","조건":"","근거조문":"조특법 §98의6②(개정 2014.1.1.), 소득세법 시행령 §167의3①5호","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=113166&efYd=20110519 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=149368&efYd=20140101 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=290841&efYd=20261001","확인":"원문 대조됨"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의7 미분양주택(2012) — 대상","시작":"2012-09-24","끝":"2012-12-31","값":"내국인이 2012.9.24. 현재 미분양주택(입주자 계약일 지난 단지에서 2012.9.23.까지 미계약 → 선착순 공급)으로서 취득가액 9억원 이하인 주택을 2012.9.24.~2012.12.31.에 사업주체(또는 주택도시보증공사·대물 시공자·구조조정리츠·신탁업자)와 최초 매매계약(계약금 납부)하거나 그 계약으로 취득. 제외: 실제 거래가액(취득세 등 부대비용 빼고) 9억 초과, 매매계약일 현재 입주, 2012.9.23. 이전 계약이 기간 중 해제된 주택, 그 해제자·배우자 등이 기간 중 다시 계약한 주택","책값":"내국인에 한함 / 2012.9.24.~2012.12.31. / 2012.9.23. 현재 미분양주택 / 9억원 초과·입주사실·재계약·계약 후 해제된 주택 제외 / 지역·규모 제한 없음 / 9억원 이하","조건":"법 문언 \"2012년 9월 24일 현재\", 시행령 \"2012.9.23.까지 분양계약이 체결되지 아니하여\" — 같은 뜻","근거조문":"조특법 §98의7①(신설 2012.10.2.), 조특령 §98의6①②③","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨(책과 같음)"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의7 — 감면","시작":"2012-09-24","끝":null,"값":"취득일부터 5년 이내 양도: 양도소득세 100% 세액감면 / 5년 지나 양도: 취득일부터 5년간 발생한 양도소득금액을 과세대상소득금액에서 공제. 세율·장특공 특례 없음","책값":"취득일로부터 5년간 100% / 세율·장특 특례 없음","조건":"","근거조문":"조특법 §98의7①, 조특령 §98의6④","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨(책과 같음)"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의7 — 비과세 주택 수·중과","시작":"2012-10-02","끝":null,"값":"주택 수: 소유주택으로 보지 않음 / 중과: 소득령 §167의3①5호","책값":"※","조건":"","근거조문":"조특법 §98의7②, 소득세법 시행령 §167의3①5호","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=290841&efYd=20261001","확인":"원문 대조됨"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의8 준공후미분양(2015) — 대상","시작":"2015-01-01","끝":"2015-12-31","값":"거주자가 준공후미분양주택(사용검사·승인 후 2014.12.31.까지 미계약 + 2015.1.1. 이후 선착순 공급)으로서 취득가액 6억원 이하(실제 거래가액, 부대비용 제외)·연면적(공동주택 전용) 135㎡ 이하인 주택을 사업주체 등과 2015.1.1.~2015.12.31.에 최초 매매계약하고, 5년 이상 임대(사업자등록·임대사업자등록 + 2015.12.31. 이전 임대계약). 제외: 2014.12.31. 이전 계약이 2015.1.1. 이후 해제된 주택, 그 해제자·배우자 등이 2015년 중 다시 계약한 주택","책값":"거주자에 한함 / 2015.1.1.~2015.12.31. / 2014.12.31. 현재 미분양주택 2015.1.1. 선착순 방법으로 공급할 것 / 해약 후 재계약·2014.12.31. 이전 계약 후 2015.1.1. 이후 해제 제외 / 전용면적 135㎡ 이하 / 6억원 이하 / 5년 이상 임대 요건 / 임대등록 및 사업자등록을 하고 2015.12.31. 이전에 임대계약","조건":"계약일 기준","근거조문":"조특법 §98의8①(신설 2014.12.23.), 조특령 §98의7①②③⑤","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨(책과 같음)"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의8 — 특례","시작":"2015-01-01","끝":null,"값":"취득일부터 5년간 발생한 양도소득금액의 50%를 과세대상소득금액에서 공제(세액감면이 아닌 소득공제, 5년 이내 양도 별도 규정 없음). 세율·장특공 특례 없음","책값":"세액감면: 취득일로부터 5년간 50% / 세율·장특 특례 없음","조건":"책은 \"세액감면\" 칸에 적었으나 원문은 소득금액 공제","근거조문":"조특법 §98의8①, 조특령 §98의7④","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918","확인":"원문 대조됨 — 책과 원문 다름(세액감면 → 소득금액 50% 공제)"},{"책자":"2026 양도소득세 부록 p2","구분":"§98의8 — 비과세 주택 수·중과","시작":"2015-01-01","끝":null,"값":"주택 수: 소유주택으로 보지 않음 / 중과: 소득령 §167의3①5호","책값":"※","조건":"","근거조문":"조특법 §98의8②, 소득세법 시행령 §167의3①5호","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=290841&efYd=20261001","확인":"원문 대조됨"},{"책자":"2026 양도소득세 부록 p2","구분":"§99의2 신축주택 등(2013) — 대상","시작":"2013-04-01","끝":"2013-12-31","값":"거주자 또는 비거주자가 신축주택·미분양주택(2013.3.31.까지 미계약 → 2013.4.1. 이후 선착순 / 2013.4.1. 이후 입주자 계약일 도래 / 30호 미만 주택건설사업자 / 주택도시보증공사·대물 시공자·구조조정리츠·신탁업자 / 2013.4.1.~12.31.  / 5호","§98의4":"근거 없음 / 근거 없음","§98의5":"§98의5② / 5호","§98의6":"§98의6② / 5호","§98의7":"§98의7② / 5호","§98의8":"§98의8② / 5호","§99의2":"§99의2② / 5호"},"책값":"※ 조특법 98조~98조의8 및 조특법 99조의2에 해당하는 주택은 비과세 판단시 주택수에서 제외되며, 다주택중과 배제된다.","조건":"\"주택 수 제외\"는 §89①3호(1세대1주택 비과세) 판정에서만 — 다른 주택의 중과 판정 주택 수에는 들어감(소득령 §167의3① 괄호는 1호·12호만 뺌, 2014.1.1. 전에는 조특법 각 항이 §104①4~7호 판정에서도 뺐음). \"중과 배제\"는 그 감면주택 자체를 팔 때","근거조문":"조특법 §98의2④·§98의3③·§98의5②·§98의6②·§98의7②·§98의8②·§99의2②, 조특령 §98②⑥, 소득세법 시행령 §167의3①3호·5호·§167의10①2호·§167의4③2호","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=290841&efYd=20261001 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=149368&efYd=20140101","확인":"원문 대조됨 — 책과 원문 다름: §98의4는 해당 없음, 주택 수 제외는 비과세 판정에 한정"},{"책자":"2026 양도소득세 부록 p2","구분":"(참고) §98의9 수도권 밖 준공후미분양 — 1주택자 간주","시작":"2024-01-10","끝":"2026-12-31","값":"1주택 1세대가 2024.1.10.~2026.12.31.에 수도권 밖 준공후미분양주택(전용 85㎡ 이하, 취득가액 7억원 이하 — 2026.2.27. 전 취득분은 6억원, 양도자 = 사업주체·분양사업자·대물 시공자, 최초 계약, 사용검사·승인일까지 미분양 선착순 공급)을 취득한 뒤 종전 주택을 양도 → 그 준공후미분양주택을 소유주택으로 보지 않고 §89①3호 적용(종부세는 신청 시 1세대1주택자)","책값":"(책 p2 \"(2) 주요개정\" 표: 비수도권 소재 준공 후 미분양주택 / 조특법98의9 / 기존 1주택자가 준공 후 미분양주택을 취득하는 경우 1주택자로 간주 / 2024.1.10.~2026.12.31.)","조건":"취득일 기준. 2025.12.23. 개정으로 기한 2025.12.31. → 2026.12.31. 가액 7억은 조특령 2026.2.27. 개정 부칙 제21조 \"이 영 시행 이후 취득하는 경우부터\"","근거조문":"조특법 §98의9①②(개정 2025.12.23.), 조특령 §98의8①(개정 2026.2.27.)","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=284389&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=288915&efYd=20260918 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=280409&efYd=20260101 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=283625&efYd=20260227","확인":"원문 대조됨(책과 같음 — 기한)"},{"책자":"2026 양도소득세 부록 p2","구분":"(참고) 소득령 §167의3①12호나목 수도권 밖 준공후미분양 — 중과 제외·중과 주택 수 제외","시작":"2024-01-10","끝":"2027-12-31","값":"2024.1.10.~2027.12.31.에 취득한 수도권 밖 준공 후 미분양주택(전용 85㎡ 이하, 취득가액 7억원 이하 — 2026.2.27. 전 취득분 6억원)은 다주택 중과 억원 이하이거나 85㎡ 이하\"(하나만 맞으면 됨).","§98의6: 책 \"임대개시당시 6억원 이하\" ↔ 원문 기준시가 6억 — 1호는 최초 임대 개시 때, 2호는 취득 당시. 책 적용기간 \"2011.3.29.~2011.12.31.\"은 법 문언상 취득기간이 아니라 시행령 제외 사유 기간·임대계약 기한.","§98의3·§98의5·§98의6: 책 \"장특공제 특례 없음\" ↔ 원문 ④/③ \"§95② 및 §104①3호에도 불구하고 표1(표2) 보유기간별 공제율\" — 중과 대상이어도 장특공을 주는 특례.","§98의2: 책 \"표2(80%)\" ↔ 원문 \"표2에 따른 보유기간별 공제율\" — 2021.1.1. 이후 표2 보유기간별은 최대 40%(해석 확인필요).","§98: 책 \"양도세율 20%와 소득세율 비교과세\" ↔ 원문은 둘 중 \"선택\".","책 뒤 개정(참고 행): 소득령 §167의3①12호나목 취득기한 2026.12.31. → 2027.12.31.(2026.10.1. 시행), 가액 6억 → 7억(2026.2.27.), 조특령 §98의8(§98의9 요건) 6억 → 7억(2026.2.27.)."],"엔진과다른곳":{"엔진":"C:/GitHub/wt-reftable/gs-backend/manage/taxcalc-engine.html","줄번호기준":"엔진 줄 번호는 2026-10-19 13:45 기준(8750줄 — 다른 작업으로 파일이 바뀌는 중이라 함수 이름으로 다시 찾을 것)","목록":["§98의2(지방 미분양주택: 장특공 표2 보유기간별·기본세율·주택 수 제외·부동산매매업) — 엔진에 없음(grep \"98의2\"·\"sect98_2\" 0건).","§98(1995~1998 미분양 국민주택, 20% 세율 또는 종합소득 선택) — 엔진에 없음.","감면주택 다주택 중과 제외 없음 — isMultiHouseSurcharge(932행)에 unsoldHouseReductionProvision 제외 분기가 없음 → 소득령 §167의3①5호(§98의2·§98의3·§98의5~§98의8·§99의2)·3호(§98)에 해당하는 주택을 조정대상지역 다주택자가 2026.5.10. 이후 팔면 중과(1649행)·장특공 0(933행)이 잘못 붙을 수 있음.","§98의3④·§98의5③·§98의6③ 장특공·세율 특례 없음 — 원문은 중과·단기보유와 관계없이 표1(1세대1주택이면 표2) 장특공 + 기본세율인데, 엔진은 감면분만 양도차익에서 빼고 단기세율 분기(약 1100행 \"holdingYears < 2\")·중과 시 ltRate=0(933행)을 그대로 적용.","5년 이내 세액감면을 \"양도차익×감면율 제외\"로 바꿔 계산 — calculateUnsoldHouseAcquisitionReductionJS 5321~5323행(안내문 \"동일한 효과\"): 원문은 산출세액×감면율 세액감면이라 누진세율에서 감면율이 100% 미만(§98의3 과밀 60%, §98의5 60·80%, §98의6 50%)이면 엔진 세액이 원문보다 적게 나옴(과소). 100%(§98의7·§99의2 — calculateNewHouseAcquisitionReductionJS 안내문 \"결과는 동일\")도 같은 해 다른 양도와 합산·기본공제 배분에서 다를 수 있음.","조문별 취득기간·대상 기준일·사람·지역 요건 확인 없음 — calculateUnsoldHouseAcquisitionReductionJS(5251행)는 provision만 받음: §98의3 서울 밖·거주자/비거주자 기간, §98의5 수도권 밖·2010.2.11. 현재 미분양·2011.4.30.까지 계약, §98의6 2011.3.29. 현재 준공후미분양, §98의7 내국인·2012.9.24.~12.31. 계약, §98의8 2015년 계약을 검사하지 않음.","§98의3 과밀억제권역 660㎡·149㎡ 요건, §98의6 6억(기준시가, 1호는 임대개시 때)·149㎡ 요건 확인 없음 — 5274행은 과밀 여부로 감면율(60/100)만 고름.","§98의7 9억·§98의8 6억 판정 값 — 5286·5 공고일 이전 계약·계약금 지급분은 예외). 자목(건설)은 조정대상지역도 제외 대상.","근거조문":"소득세법 시행령 §167의3①2호아목·자목(신설 2025.2.28. 대통령령 제35349호) · 부칙 제1조5호·제15조②","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=269541&efYd=20250604","확인":"원문 대조됨(개정문·부칙)"},{"책자":"2026 양도소득세 부록 p3 (p1 흐름도 주와 같음)","구분":"다주택중과 — 한시유예 종료로 중과 재시행","책값":"소령 167의3 소령167의10 / 다주택중과 한시유예의 종료로 중과 재시행 / 2026.5.10. 이후 양도분주2)","시작":"2026-05-10","끝":null,"값":"2026.5.10. 이후 양도분부터 조정대상지역 다주택 중과(세율 +20/+30%p, 장특공 배제) 다시 적용 — 예외는 다음 행(2026.5.9. 이전 계약 등)","조건":"적용기준 = 양도일(경과 예외는 계약일·허가신청일). 조문 4개 모두 같은 구조(§167의3①12의2, §167의4③6의2, §167의10①12의2, §167의11①12).","근거조문":"소득세법 시행령 §167의3①12의2 가목('2026년 5월 9일까지 양도하는 주택')·나목·다목 등(개정 2026.2.27. 대통령령 제36129호, 공포일 시행; 2026.4.23. 대통령령 제36276호 개정)","출처":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=283631&efYd=20260227 ; https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=285631&efYd=20260423","확인":"원문 대조됨. 책 근거는 167의3·167의10만 — 원문은 §167의4·§167의11도 같음. 2026.9.30. 개정(제36737호)은 이 호를 건드리지 않음"},{"책자":"2026 양도소득세 부록 p3 주2) · p1 흐름도 주)","구분":"다주택중과 재시행 — 2026.5.9. 이전 계약 경과 예외(주2)","책값":"2026.5.9. 이전 매매계약을 체결하고 계약금을 지급받은 사실이 증빙서류에 의해 확인되는 경우로 계약일로부터 강남·서초·송파·용산구는 4개월(2025.10.16. 이후 조정대상 지역으로 추가 지정된 지역의 경우는 6개월)이내 양도하는 경우 중과되지 않는다. 더불어 토지거래허가 대상 주택부수토지에 정착된 주택의 경우 위 요건외에도 … 토지거래허가를 받아야 한다.","시작":"2026-05-10","끝":"2026-11-09","값":{"공통":"보유기간 2년 이상","토지거래허가 대상 아님(다목)":"2026.5.9.까지 매매계약 체결 + 계약금 받은 사실 증빙 & 계약일부터 4개월(아래 표 지역 6개월) 이내 양도","토지거래허가 대상(나목, 2026.4.23. 개정 뒤)":"① 2026.5.9.까지 토지거래허가 신청 ② 그 허가를 받음 ③ 매매계약 + 계약금 증빙(계약일 제한 없음) ④ 계약일부터 4개월(표 지역 6개월) 이내 양도. 다만 2026.5.10. 이후 계약이면 2026.9.9.(표 지역 2026.11.9.)까지 양도","6개월 표 지역(나목4) 표)":"서울: 성동·마포·강동·영등포·양천·동작·광진·중·종로·서대문·강서·노원·성북·구로·동대문·관악·은평·중랑·금천·강북·도봉구 / 경기: 수원시 장안·팔달·영통구, 성남시 수정·중원·분당구, 안양시 동안구, 과천시, 용인시 수지구, 광명시, 하남시, 의왕시","4개월":"표에 없는 지역 전부"},"조건":"2026.2.27.~4.22. 원문(제36129호)의 나목: 허가를 받고 + 2026.5.9.까지 계약 + 계약일부터 4(6)개월 이내 양도. 2026.4.23.(제36276호, 공포일 시행)부터 위 값처럼 바뀜.","근거조문":"소득세법 시행령 §167의3①12의2나목·다목, §167의4③6의2나목·다목, §167의10①12의2나목·다목, §167의11①12나목·다목(신설 2026.2.27. 대통 소득령 대통령령 제35349호)","시행일":"2025.2.28.(아목·자목 2025.6.4.)","내용":"바목 6억→9억, 아목(단기 매입 6년·4억/2억)·자목(단기 건설 6년·6억) 신설, §155⑳ 생애 한 차례 삭제","적용기준":"등록일·양도일","부칙":"제14조 §155⑳ 시행 이후 양도분부터; 제15조① 바목 시행 이후 등록분, ② 아·자목 2025.6.4. 이후 등록 단기부터"},{"개정일":"2026.9.30.(소득령 대통령령 제36737호)","시행일":"2026.10.1.","내용":"가목2)·나목2)·라목8)·마목4)·3호 후단·⑪: 아파트 민간매입임대는 2027.12.31.(등) 까지 양도해야 중과배제; §155⑳ 문구 정리, ㉓은 그 양도기한 요건 미적용 명시 — 책 뒤 개정","적용기준":"양도일","부칙":"167의3·155⑳ 별도 적용례 없음"}],"쓰는곳":[{"곳":"계산기 칸","이름":"엔진 calculateRentalHousingResidenceExclusionJS(5962행)·rentalHousingItemMaCheckJS_(5934행) — §155⑳ 거주주택 특례(마목만 직접 판정)","보는날":"날짜 안 봄(임대연수·체크 입력)"},{"곳":"계산기 칸","이름":"엔진 다주택 중과 isMultiHouseSurcharge(921행) — 장기임대주택 중과배제 분기 없음(multiHouseCount 입력, isRentalSpecial만)","보는날":"양도일(한시유예만)"},{"곳":"계산기 칸","이름":"엔진 rentalLongTermRate(513행) — §97의3·§97의4 장특공(2부-24)","보는날":"날짜 안 봄"},{"곳":"사건처리 판정","이름":"임대사업자 등록증(유형·등록일)·사업자등록증·취득 계약서·임대차계약서(임대료 증가율)·기준시가 이력으로 목(가~자)·의무기간을 골라 중과·거주주택 비과세 판정","보는날":"등록(신청)일·취득일·양도일"}],"엔진과다른곳":["5934~5961 rentalHousingItemMaCheckJS_(§155⑳ 거주주택 특례의 마목 판정): 임대기간을 무조건 10년 이상으로 본다(5936). 원문은 2020.8.18. 전에 등록신청한 마목·바목 주택은 종전 8년(소득령 2020.10.7. 개정 부칙 제5조).","5948~5949 마목 단서1)(1주택 이상 세대가 새로 취득한 조정지역 장기일반)을 ⑳에서도 제외한다 — 원문 §155⑳ 괄호는 \"마목에 해당하는 주택의 경우에는 같은 목 1)에 따른 주택[2)·3)에 해당하지 않는 경우로 한정]을 포함\"이라 거주주택 특례에서는 오히려 포함된다(중과 배제에서만 빠짐).","5927~5933 엔진 주석 \"아·자목(단기민간임대)은 2020.8.18. 개정으로 신규등록 폐지된 레거시\"는 원문과 다르다 — 아목·자목은 2025.2.28. 개정으로 신설된 6년 단기민간임대주택(2025.6.4. 이후 등록분, 부칙 제15조②)으로 지금 새로 생기는 유형이다.","5962~5992 calculateRentalHousingResidenceExclusionJS: ⑳ 괄호의 \"가목·다목은 2020.7.10. 이전 임대사업자등록 신청분으로 한정\"을 판정하지 않는다(체크 입력). 2019.2.12. 이후 취득 주택을 2025.2.27. 이전에 양도한 경우의 \"생애 한 차례\" 제한(소득령 2019.2.12. 개정, 2025.2.28. 삭제)은 없다(현행 기준만). ㉓(자진·자동말소 후 5년 이내 거주주택 양도) 판정 분기가 엔진에 없다(grep \"말소\" 결과 없음).","921 isMultiHouseSurcharge = … && !isRentalSpecial — 장특공 특례(§97의3·§97의4) 대상이면 다주택 중과를 무조건 뺀다. 원문의 중과 배제는 소득령 §167의3①2호 각 목(마목 단서1 2018.9.14. 이후 1주택 이상 세대의 조정지역 신규취득 장기일반 매입 제외, 2026.10.1.부터 ⑪ 아파트 매입 2027.12.31. 양도기한, 아목 단기매입 조정지역 제외 등)으로 따로 판정한다. 반대로 §97의3·§97의4 특례가 없는 장기임대주택(가목·마목·바목·아목·자목)의 중과 배제를 판정하는 분기는 엔진에 없다(multiHouseCount 숫자 입력뿐)."],"책과원문다름":["호수기준(1차 판독 고침): 그림은 장기일반·매입·장특공제 열 모두 \"1호 이상\"(1차 판독본은 \"1호\") — 원문도 같은 뜻(호수 하한 1호).","주8)·(4)주1): 단기 매입 4억/2억·단기 건설 6억의 기준시점을 책은 \"취득당시 기준시가\"로 적음 — 원문(소득령 §167의3①2호 아목2)·자목3))은 \"임대개시일 당시\"(자목은 2호 이상 임대개시일).","행정요건 \"세무서 선택적 등록\": 세무서 사업자등록은 소득세법 §168①상 의무이고 미등록 시 §81의12 가산세 — 세제혜택 요건이 아닐 뿐 \"선택\"은 아님.","주2) \"4년 단기는 2020.7.11. 이후 등록분부터 폐지\": 민간임대주택법상 정의 삭제는 2020.8.18.(법률 제17482호), 2020.7.11.은 세법상 혜택 배제 기준일.","주11) \"2025.2.28. 이전 양도분 … 평생 1번\": 원문 부칙은 2025.2.28.(시행일) 양도부터 새 규정 — 경계일 2025.2.28.은 횟수 제한 없음 쪽.","중과배제(매입): 2026.9.30. 개정으로 아파트 민간매입임대는 2027.12.31.(⑪ 각 호 늦은 날)까지 양도해야 중과배제 — 책 뒤 개정."],"확인필요":["§97의5 농어촌특별세 20%(책 \"농특세 20% 과세\") — 농어촌특별세법 원문 미대조.","옛 소득령 §154①4호(2019.12.16. 이전 등록 신청분에 계속 적용되는 거주요건 배제)의 본문 요건(임대의무기간 충족·임대료 5% 등) — 2020.2.11. 이전 판 본문 미대조.","§155⑳에서 장기임대주택(§167의3①2호 가목 등)에 2026.10.1. 추가된 \"⑪ 기한까지 양도할 것\" 요건이 거주주택 특례에 어떻게 걸리는지 — ㉓은 미적용을 명시했으나 ⑳ 본문은 명시 없음, 세무사님 확인.","\"재개발·재건축 시 가액/면적 기준 적용시기\", 다가구 취급의 세부 — 2부-29 확인필요 참고.","민간임대주택법 임대의무기간 기산 시점(§43① \"임대사업자 등록일 등 대통령령으로 정하는 시점\") — 시행령 미대조."]},{"번호":"2부-29","이름":"임대주택 대책·시행령 개정에 따른 요건 변동표(중과·거주주택 비과세·종부세 합산배제·조특법 §97의3·§97의5)","무엇":"임대주택 대책(2017.12.13.·2018.9.13.·2020.7.10.)과 시행령 개정에 따라 등록·취득 시기별로 달라지는 의무임대기간·가액·임대료·임대요건 유지·등록시기 제한·기산일·재건축 기간 처리를 5개 제도(소령 §167의3 중과배제, §155⑳ 거주주택 비과세, 종부령 §3 합산배제, 조특법 §97의3, §97의5)로 나란히 놓는다.","기준일":"쓰는 곳마다 다름 — 의무기간은 임대사업자 등록(신청)일, 가액·조정지역 제외는 취득일(계약일 포함), 거주주택 비과세 횟수·아파트 양도기한은 양도일, 종부세는 과세기준일(매년 6월 1일 — 종부세법 원문 미대조)","근거법령":["소득세법 시행령 §155⑳㉒㉓·§167의3①2호·②·③·⑤·⑪","종합부동산세법 시행령 §3","조세특례제한법 §97의3·§97의5, 시행령 §97의3·§97의5","민간임대주택에 관한 특별법 §2·§43, 법률 제17482·20550호 부칙","각 개정 대통령령 부칙(제28637·29241·29242·29523·31083·35349·36737호)"],"근거서식":["임대주택 합산배제 신고서(종부령 §3⑨, 서식 번호 미대조)","장기임대주택 등 거주주택 비과세 특례 신고서(소득령 §155㉔, 서식 번호 미대조)"],"출처":[{"이름":"국가법령정보센터 소득세법 시행령 현행(대통령령 제36737호, 시행 2026.10.1.)","주소":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=290841&efYd=  원문 \"임대개시일 당시\"(소득령 아목2)·자목3)), 종부세는 \"임대개시일 또는 최초 합산배제신고 연도 과세기준일\".","재개발·재건축 공사기간 종부세 칸 \"분리과세\": 원문(종부령 §3⑦7호)은 멸실 전후 임대기간 합산(준공일부터 6개월 이내 임대개시) — 책 표현과 다름.","등록시기 제한 \"없음\"(중과·비과세·종부): 제도 일몰은 없으나 원문은 목별 등록시기 제한(가목·다목 2018.3.31., 2020.7.10./7.11. 기준, 아·자목 2025.6.4.~)을 둠.","2026.9.30. 개정(2026.10.1. 시행) 아파트 민간매입임대 중과배제 양도기한(2027.12.31. 등) — 책 뒤 개정, 표에 없음."],"확인필요":["\"재건축한 경우 가액/면적기준 적용시기\"(임대개시 당시 / 재건축 당시) — 5개 제도 모두 원문 문구 미발견(소득령 §167의3⑤2호 마목·§155㉒2호 마목은 재건축 후 새 주택의 등록 유형 문제만 다룸). 국세청 해석 등 확인 필요.","\"2019.2.12. 이후 취득 — 주택수 제한없음\"(중과·종부·§97의3·§97의5 칸) 책 표현의 근거 조문.","다가구주택 — §155⑳·§97의5 칸 원문 문구 미대조(§155⑮ 본문 미독해).","기준일 임대요건 유지 \"×\"(중과·§97의3·§97의5) — 원문에 양도일 현재 임대 문구가 없음을 확인했을 뿐, 의무기간 충족 후 말소·임대 중단 상태 양도의 취급은 세무사님 확인.","종부세 과세기준일(6월 1일, 종부세법 §3·지방세법 §114) — 원문 미대조.","§155⑳ 장기임대주택에 2026.10.1. 추가된 \"⑪ 기한까지 양도할 것\"(가목2)·마목4) 등)이 거주주택 특례에도 걸리는지 — ㉓만 미적용 명시, 세무사님 확인."]},{"번호":"2부-30","이름":"조합원입주권으로 바뀌는 시기(재개발·재건축 권리변환 기준일) 개정연혁","무엇":"정비사업 대상 주택이 \"주택\"에서 \"조합원입주권(부동산을 취득할 수 있는 권리)\"으로 바뀌는 기준일을 사업 종류·시기별로 정한다(1세대1주택·주택 수·세율·장특공 판정의 출발점).","기준일":"그 사업의 인가일(관리처분계획인가일 등)이 속한 기간","책자":"2026 양도소득세 부록 p3 \"5. 재개발·재건축관련 — 조합원 입주권의 권리로 변환시기 개정연혁\"","근거법령":["소득세법 §88 9호(조합원입주권 정의 — 「도시 및 주거환경정비법」 §74 관리처분계획 인가, 「빈집 및 소규모주택 정비에 관한 특례법」 §29 사업시행계획인가)","「도시 및 주거환경정비법」 제정(법률 제6852호, 2002.12.30., 시행 2003.7.1.)","「도시 및 주거환경정비법」 일부개정(법률 제7392호, 2005.3.18.)"],"근거서식":[],"출처":[{"이름":"국가법령정보센터 소득세법 현행 §88 9호","주소":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=280405&efYd=20260701"},{"이름":"국가법령정보센터 도시 및 주거환경정비법 제정 [법률 제6852호, 시행 2003.7.1.]","주소":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=57479&efYd=20030701"},{"이름":"국가법령정보센터 도시 및 주거환경정비법 [법률 제7392호, 2005.3.18.] 제·개정문","주소":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=66959"}],"대조":[],"갱신":"거의 안 바뀜(정비 관련 법 개정 때)","상태":"초안","절차":[{"단계":1,"묻는것":"사업이 재개발인가 재건축인가(소규모정비사업이면 현행 §88 9호의 사업시행계획인가)","예":"아래 행에서 사업 종류 열","아니오":"확인 필요(사업 종류 서류)","근거":"소득세법 §88 9호"},{"단계":2,"묻는것":"그 사업의 인가일이 2003.6.30. 이전 / 2003.7.1.~2005.5.30. / 2005.5.31. 이후 중 어디인   // ---------- 세무사님 확인 기록(서버 스크립트 속성 — reftable_review_get/set). 기록만 하고, 확인해도 계산·판정에 바로 쓰이지 않는다 ----------

  // ---------- 서식번호 읽기: "소득세법 시행규칙 [별지 제84호서식 부표1]" → 법 + 번호 열쇠("84부표1") ----------
  var LSI_LAW_ALIASES_ = [
    [/조세특례제한법|조특법/, '조세특례제한법 시행규칙'], [/상속세\s*및\s*증여세법|상증세법|상증법/, '상속세 및 증여세법 시행규칙'],
    [/국세기본법/, '국세기본법 시행규칙'], [/법인세법/, '법인세법 시행규칙'], [/지방세법/, '지방세법 시행규칙'], [/소득세법/, '소득세법 시행규칙']

    if (!m) return null;

  function lsiLawOf_(s){

  // 서식 한 줄에 맞는 원본 파일 찾기 — ①번호+법 이름 같음 ②번호만 같음(파일 이름에 법 이름이 없음) ③본 서식 파일(부표가 본 서식 hwp 안에 같이 있는 경우)
  //  ④제목이 파일 이름에 그대로 들어 있음. 짝을 어떻게 지었는지 그대로 보여 준다(지어내지 않음).

    var out = [];
    files.forEach(function(f){
      var fk = lsiFormKey_(f.name), fl = lsiLawOf_(f.name);
      if (key && fk === key && fl === law) out.push({ f: f, how: '번호·법 같음' });

  function lsiRegistryRows_(group){

      var itFormNo = typeof it.formNo === 'function' ? '' : it.formNo;
      var list = it.subForms && it.subForms.length ? it.subForms : [{ formNo: itFormNo, title: it.label, section: 'required' }];
      list.forEach(function(sf){

  }

  function lsiRenderForms_(){

      '<div class="lsi-note" style="margin-bottom:6px;">서식처럼 보이는 파일 ' + formLike.length + '개 — 세액인쇄 서식 목록에 빠진 서식이거나 이 화면이 번호를 못 읽은 파일입니다.</div>' +

      '<details><summary class="lsi-note" style="cursor:pointer;">안내·사례 자료 ' + guides.length + '개 보기</summary><ul style="margin:6px 0 0 18px; font-size:12.5px;">' + guides.map(li).join('') + '</ul></details></div>';
  }

  // ---------- 조문 문자열 읽기: "상증세법 §24①" → { law: '상속세 및 증여세법', art: '24' } ----------

  function lsiParseArticle_(s){
    s = String(s || '');
    var law = '';
    for (var i = 0; i < LSI_ART_LAW_ALIASES_.length; i++) if (LSI_ART_LAW_ALIASES_[i][0].test(s)) { law = LSI_ART_LAW_ALIASES_[i][1]; break; }

  }

  function lsiOpenArticle_(law, art){

  function lsiShowArticle_(){

  function lsiFmtVal_(v){

      '<h4>판정 순서</h4>' + tbl(['단계', '묻는 것', '예 →', '아니오 →', '근거'], (t.절차 || []).map(function(s){ return '<tr><td>' + lsiEsc_(s.단계) + '</td><td>' + lsiEsc_(s.묻는것) + '</td><td>' + lsiEsc_(s.예) + '</td><td>' + lsiEsc_(s.아니오) + '</td><td>' + lsiEsc_(s.근거) + '</td></tr>'; })) +
      '<h4>값 표</h4>' + tbl(['구분', '적용 시작', '적용 끝', '값', '조건', '근거 조문', '서식 칸', '출처', '확인'], (t.행 || []).map(function(r){
        return '<tr><td class="w-mid">' + lsiEsc_(r.구분) + '</td><td class="nw">' + lsiEsc_(r.시작 || '') + '</td><td class="nw">' + lsiEsc_(r.끝 || '지금까지') + '</td><td class="w-wide">' + lsiFmtVal_(r.값) + '</td><td class="w-mid">' + lsiFmtVal_(r.조건 || '') + '</td>' +
          '<td>' + lsiArtLinks_(r.근거조문 ? [r.근거조문] : []) + '</td><td>' + lsiFormCellLinks_(r.서식칸 ? [r.서식칸] : []) + '</td><td>' + (r.출처 ? '<a href="' + lsiEsc_(r.출처) + '" target="_blank" rel="noopener">원문 ↗</a>' : '') + (r.책자 ? '<div class="lsi-note">' + lsiEsc_(r.책자) + '</div>' : '') + '</td>' +
          '<td>' + lsiCheckBadge_(r.확인) + '</td></tr>';
      })) +
      '<h4>개정 이력</h4>' + tbl(['개정일', '시행일', '무엇이 바뀌었나', '어느 날 기준으로', '경과규정(부칙)'], (t.개정 || []).map(function(r){ return '<tr><td>' + lsiEsc_(r.개정일) + '</td><td>' + lsiEsc_(r.시행일) + '</td><td>' + lsiEsc_(r.내용) + '</td><td>' + lsiEsc_(r.적용기준) + '</td><td>' + lsiEsc_(r.부칙) + '</td></tr>'; })) +
      '<h4>시스템이 쓰는 곳</h4>' + tbl(['쓰는 곳', '이름', '보는 날', '켜짐'], (t.쓰는곳 || []).map(function(r){ return '<tr><td>' + lsiEsc_(r.곳) + '</td><td>' + lsiEsc_(r.이름) + '</td><td>' + lsiEsc_(r.보는날) + '</td><td>' + (r.켜짐 ? '켜짐' : '꺼짐(세무사님 확인 전)') + '</td></tr>'; })) +
      // [2026.10.19] 자료마다 더 적어 둔 것(책자 출처·책과 원문이 다른 곳·엔진과 다른 곳 등)도 그대로 보여 준다
      [['책자', '책자 출처(대조용)'], ['책과원문다름', '책과 법령 원문이 다른 곳(원문을 따름)'], ['엔진차이', '계산기와 다른 곳(고칠 거리)'], ['엔진과다른곳', '계산기와 다른 곳(고칠 거리)'], ['현재 지정 중', '지금 지정 중'], ['1부-01 지역 대응', '조정대상지역 표와 맞춰 보기'], ['참고용', '참고용']].map(function(kv){ var v = t[kv[0]]; if (v == null || (Array.isArray(v) && !v.length)) return ''; return '<h4>' + lsiEsc_(kv[1]) + '</h4>' + (Array.isArray(v) && typeof v[0] !== 'object' ? '<ul style="margin:4px 0 0 18px; font-size:12.5px;">' + v.map(function(x){ return '<li>' + lsiEsc_(x) + '</li>'; }).join('') + '</ul>' : '<div style="font-size:12.5px;">' + lsiFmtVal_(v) + '</div>'); }).join('') +
      ((t.확인필요 || []).length ? '<h4>확인 필요(공식 출처로 확인 못 함 — 표에 넣지 않음)</h4><ul style="margin:4px 0 0 18px; font-size:12.5px;">' + t.확인필요.map(function(x){ return '<li>' + lsiEsc_(x) + '</li>'; }).join('') + '</ul>' : '') +
      '</div>';
    lsiWireLinks_(box);
    lsiWireReview_(box, t.번호, t, function(){ lsiRenderRefs_(); });
    if (box.scrollIntoView) box.scrollIntoView({ block: 'start' });
  }
</script>
