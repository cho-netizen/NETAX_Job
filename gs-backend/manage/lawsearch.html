     하위 탭 [📜 법령][📄 서식][📋 조견표]. 법령 탭은 예전 법령조회 그대로(사건 첨부), 서식·조견표는 사건 없이 본다. 설계: netax-inventory/maps/설계_조견표체계.md -->
<style>
  .lsi-tabs{ display:flex; gap:0; border-bottom:1px solid var(--line); padding:0 14px; flex-wrap:wrap; }
  .lsi-tab{ background:none; border:none; border-bottom:2px solid transparent; padding:9px 14px; font-size:14px; color:var(--sub); cursor:pointer; }
  .lsi-tab.active{ color:var(--navy); font-weight:600; border-bottom-color:var(--gold); }
  .lsi-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; align-items:center; }
  .lsi-chip{ border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:4px 11px; font-size:12.5px; cursor:pointer; color:inherit; }
  .lsi-chip.active{ border-color:var(--navy); color:var(--navy); font-weight:600; }
  .lsi-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .lsi-table th, .lsi-table td{ border-bottom:1px solid var(--line); padding:6px 6px; text-align:left; vertical-align:top; }
  .lsi-table th{ color:var(--sub); font-weight:600; white-space:nowrap; }
  .lsi-badge{ display:inline-block; border-radius:9px; padding:1px 7px; font-size:11.5px; border:1px solid var(--line); white-space:nowrap; }
  .lsi-badge.ok{ border-color:#2e7d32; color:#2e7d32; }
  .lsi-badge.warn{ border-color:#b26a00; color:#b26a00; }
  .lsi-link{ color:var(--navy); cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; font-size:inherit; }
  .lsi-note{ font-size:11.5px; color:var(--sub); }
  .lsi-files a{ margin-right:8px; white-space:nowrap; }
  .lsi-table-wrap{ overflow-x:auto; }
  .lsi-table td.nw{ white-space:nowrap; }
  .lsi-table td.w-mid{ min-width:9em; }
  .lsi-table td.w-wide{ min-width:18em; }
  .lsi-long summary{ cursor:pointer; color:var(--navy); }
</style>
<div class="view" id="view-lawsearch">
  <div class="view-head"><h2>⚖️ 법령정보</h2></div>
  <div class="lsi-tabs">
    <button type="button" class="lsi-tab active" data-lsitab="law">📜 법령</button>
    <button type="button" class="lsi-tab" data-lsitab="form">📄 서식</button>
    <button type="button" class="lsi-tab" data-lsitab="ref">📋 조견표</button>
  </div>
  <div class="view-body">
    <div id="lsiPane-law">
      <div class="card">
        <div class="tb-row" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <select id="lsCaseSelect" style="min-width:220px; max-width:420px;"><option value="">사건을 선택하세요</option></select>
          <button type="button" id="lsBackToCaseBtn" class="ghost-btn" style="margin-left:auto;"><span class="btn-ic">↩</span><span class="btn-tx"> 처리개요</span></button>
        </div>
      </div>
      <div class="card" id="lsiDbCard">
        <h3 style="margin-top:0;">📖 법령 원문 (법령 정비본)</h3>
        <div class="lsi-note" style="margin-bottom:8px;">법제처 원문을 법령정보 모양으로 봅니다. 조문 전체나 항 하나를 [복사]로 그대로 인용할 수 있고, 판(시행일)을 고르면 그때 법령을 봅니다. 그림 산식은 글로 옮긴 것(세무사님 타이핑·판독)이나 법제처 글자상자로 보여 줍니다.</div>
        <div id="lsiDbBar" class="lsidb-bar"><button type="button" class="btn" id="lsiDbOpen">법령 원문 열기</button></div>
        <div id="lsiDbBody"></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0;">조문으로 찾아보기</h3>
        <div class="lsi-note" style="margin-bottom:8px;">조문 하나를 고르면 그 조문을 해석한 서식 칸, 그 조문을 쓰는 조견표, 그 조문을 쓰는 계산을 함께 보여 줍니다. 사건을 고르지 않아도 됩니다.</div>
        <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
          <select id="lsiArtLaw" style="min-width:200px;" aria-label="법령 고르기"></select>
          <span>제</span><input type="text" id="lsiArtNo" style="width:80px;" placeholder="예: 24, 97의2" aria-label="조문 번호"><span>조</span>
          <button type="button" class="btn" id="lsiArtGo">보기</button>
        </div>
        <div id="lsiArtResult" style="margin-top:10px;"></div>
      </div>
      <div id="lsBody"></div>
    </div>
    <div id="lsiPane-form" style="display:none;"></div>
    <div id="lsiPane-ref" style="display:none;"></div>
  </div>
</div>

<script>
  // ============================================================
  // 법령관리 — 국세법령정보시스템(taxlaw.nts.go.kr) 분류(법령/세법해석례/판례·결정례/별표·서식)의
  // 실제 출처(target)들을 체크박스 하나로 다 펼쳐두고 한 번에 검색한다(탭으로 나누면 매번
  // 왔다갔다 검색해야 해서 불편하다는 피드백 반영). 검색결과도 체크박스로 여러 개 골라
  // 한꺼번에 첨부할 수 있고, 첨부해도 화면 전체를 다시 그리지 않는다 — 첨부된 항목만
  // "✅ 첨부됨"으로 표시하고 나머지 검색결과는 그대로 남겨서, 다시 검색하기 전까지 계속
  // 골라 첨부할 수 있게 한다.
  // ============================================================
  var lsCases = [];
  var lsSelectedId = null;
  var lsCaseSelectEl = document.getElementById('lsCaseSelect');
  var lsBodyEl = document.getElementById('lsBody');
  var lsCurrentCase = null;   // 지금 화면에 그려진 사건(로컬로 법령예규판례 배열을 직접 갱신함)
  var lsResultItems = [];     // 지금 떠 있는 검색결과 전체({category, item, title, sub}) — 다중첨부용
  // [2026.09 버그수정] 검색(runSearch)이나 첨부(attachSelected_)가 서버 응답을 기다리는 동안
  // 사용자가 다른 사건으로 전환하면, 그 응답이 도착했을 때 이미 바뀐 lsCurrentCase(=다른
  // 사건)를 기준으로 결과를 표시하거나 — 심하면 그 사건에 저장까지 — 해버릴 수 있었다(사건
  // A에서 찾은 법령해석례가 사건 B에 잘못 첨부되는 사고). renderLsBody_가 호출될 때마다
  // 이 값을 올려서, 응답이 왔을 때 그 사이 사건이 바뀌었는지 확인하는 용도로 쓴다.
  var lsGeneration_ = 0;

  var LS_ALL_SOURCES_ = [
    { key: 'law', label: '법령(법률·시행령·시행규칙)', on: true },
    { key: 'interpretation', label: '법령해석례', on: true },
    { key: 'administrative_rule', label: '행정규칙(훈령·예규·고시·집행기준·통칙 등)', on: false },
    { key: 'precedent', label: '법원 판례', on: true },
    { key: 'tax_tribunal', label: '조세심판원(심판청구)', on: false },
    { key: 'constitutional', label: '헌법재판소', on: false },
    { key: 'form', label: '별표·서식', on: false }
  ];
  var LS_CATEGORY_LABELS_ = {
    precedent: '판례', interpretation: '법령해석례', administrative_rule: '행정규칙',
    tax_tribunal: '조세심판원', constitutional: '헌재결정례', law: '법령', form: '별표·서식'
  };
  var LS_NO_DETAIL_ = { law: true, form: true }; // 상세조회 없이 검색결과만으로 첨부하는 카테고리

  // [2026.09 버그수정] 이 화면은 loaded-가드가 없어서 다른 화면(taxcalc 등)과 달리 매번
  // showView('lawsearch')마다 initLawSearch()가 다시 실행됐다 — goToLawSearch_가 그 직후에
  // 또 한 번 loadLsCases_(caseId)를 불러서, 사건처리에서 "⚖️ 법령조회로 이동"을 누를 때마다
  // 사건 목록을 두 번 중복 조회하고 있었다(taxcalc의 goToTaxCalc_에서 이미 고친 것과 같은
  // 유형). 다른 화면들처럼 최초 1회만 자동 로드하고, 재방문 시 목록 새로고침은
  // goToLawSearch_가 필요할 때만 명시적으로 하게 한다.
  var lsLoaded = false;
  function initLawSearch(){
    if (lsLoaded) return;
    lsLoaded = true;
    loadLsCases_();
  }

  function loadLsCases_(preselectId){
    lsCaseSelectEl.innerHTML = '<option value="">불러오는 중…</option>';
    callGas('work_get_cases', {}).then(function(res){
      lsCases = res.cases || [];
      renderLsCaseSelect_();
      var wantId = preselectId || lsSelectedId;
      if (wantId && lsCases.some(function(c){ return c.id === wantId; })){
        lsCaseSelectEl.value = wantId;
        lsSelectedId = wantId;
        renderLsBody_();
      }
    }).catch(function(){ lsCaseSelectEl.innerHTML = '<option value="">불러오지 못했습니다</option>'; });
  }

  function renderLsCaseSelect_(){
    var keepValue = lsCaseSelectEl.value;
    lsCaseSelectEl.innerHTML = buildCaseOptionsHtml_(lsCases);
    if (keepValue) lsCaseSelectEl.value = keepValue;
  }

  lsCaseSelectEl.addEventListener('change', function(){
    lsSelectedId = lsCaseSelectEl.value || null;
    renderLsBody_();
  });

  // [2026.09] 법령조회·증빙확보·세액계산·문서작성은 처리개요 카드에서 넘어오는 경우가
  // 많은데, 다시 처리개요로 돌아가려면 왼쪽 메뉴를 찾아 눌러야 해서 불편하다는 지적 —
  // 지금 고른 사건을 그대로 들고 처리개요로 돌아가는 버튼을 추가한다.
  document.getElementById('lsBackToCaseBtn').addEventListener('click', function(){
    if (typeof goToView_ === 'function') goToView_('casehandling');
    if (lsSelectedId && typeof goToCaseHandling_ === 'function') goToCaseHandling_(lsSelectedId);
  });
  // 공용 함수(script.html)는 맨 마지막에 읽히므로 화면이 다 읽힌 뒤에 붙인다
  document.addEventListener('DOMContentLoaded', function(){
    if (typeof nxCaseJumpAttach_ === 'function') nxCaseJumpAttach_(document.getElementById('lsBackToCaseBtn'), 'lawsearch', function(){ return lsSelectedId; });
  });

  function lsResultTitle_(category, item){
    if (category === 'precedent') return { title: item.사건명 || '(제목 없음)', sub: [item.사건번호, item.선고일자, item.법원명].filter(Boolean).join(' · ') };
    if (category === 'interpretation') return { title: item.안건명 || '(제목 없음)', sub: [item.안건번호, item.회신일자, item.질의기관].filter(Boolean).join(' · ') };
    if (category === 'administrative_rule') return { title: item.행정규칙명 || '(제목 없음)', sub: [item.행정규칙종류, item.발령일자, item.소관부처].filter(Boolean).join(' · ') };
    if (category === 'tax_tribunal') return { title: item.사건명 || '(제목 없음)', sub: [item.청구번호, item.의결일자, item.재결구분명].filter(Boolean).join(' · ') };
    if (category === 'constitutional') return { title: item.사건명 || '(제목 없음)', sub: [item.사건번호, item.종국일자].filter(Boolean).join(' · ') };
    if (category === 'law') return { title: item.법령명 || '(제목 없음)', sub: [item.법령구분, item.소관부처, item.시행일자 ? ('시행 ' + item.시행일자) : ''].filter(Boolean).join(' · ') };
    if (category === 'form') return { title: item.별표명 || '(제목 없음)', sub: [item.관련법령명, item.별표종류].filter(Boolean).join(' · ') };
    return { title: '(제목 없음)', sub: '' };
  }

  function lsDetailSummary_(category, detail){
    var text = category === 'precedent' ? (detail.판결요지 || detail.판시사항 || '')
      : category === 'interpretation' ? (detail.회답 || detail.질의요지 || '')
      : category === 'tax_tribunal' ? (detail.재결요지 || detail.이유 || '')
      : category === 'constitutional' ? (detail.결정요지 || detail.판시사항 || '')
      : (detail.내용 || '');
    text = String(text).trim();
    return text.length > 300 ? text.slice(0, 300) + '…' : text;
  }

  // law·form은 상세조회가 없어서 검색결과 필드로 바로 요약을 만든다.
  function lsSearchOnlySummary_(category, item){
    if (category === 'law') return [item.법령구분, item.소관부처, item.공포일자 ? ('공포 ' + item.공포일자) : '', item.시행일자 ? ('시행 ' + item.시행일자) : ''].filter(Boolean).join(' · ');
    if (category === 'form'){
      var base = [item.관련법령명, item.별표종류, item.소관부처].filter(Boolean).join(' · ');
      return item.파일링크 ? (base + '\n📎 https://www.law.go.kr' + item.파일링크) : base;
    }
    return '';
  }

  function lsIsAttached_(category, id){
    return (lsCurrentCase.법령예규판례 || []).some(function(e){ return e.category === category && e.id === id; });
  }

  // 서버 저장 + 로컬 상태(lsCurrentCase, 사건 목록 캐시) 갱신만 하고, 검색결과 화면은 건드리지
  // 않는다 — 다시 검색하기 전까지 결과 목록이 그대로 남아있어야 한다는 요청 반영.
  // [2026.09] 동시편집 낙관적 잠금 — 마지막으로 읽은 수정일을 같이 보내고, 그 사이 다른 곳에서
  // 먼저 저장돼 충돌났으면 덮어쓰지 않고 최신 내용으로 다시 불러온다.
  // [2026.09 버그수정] targetCase를 인자로 받는다 — attachSelected_가 클릭 시점의 사건을
  // 캡처해서 넘겨주므로, 서버 응답을 기다리는 사이 사용자가 다른 사건으로 전환해도(전역
  // lsCurrentCase가 바뀌어도) 항상 원래 사건에 저장된다. targetCase가 지금도 화면에 떠 있는
  // 사건(=lsCurrentCase와 동일)일 때만 화면을 갱신한다 — 이미 다른 사건으로 넘어갔으면 그
  // 사건의 화면(DOM)이 통째로 다시 그려져 있으므로 건드리지 않는다.
  function lsSaveAttachments_(newList, targetCase){
    targetCase = targetCase || lsCurrentCase;
    return callGas('work_update_case', { id: targetCase.id, 법령예규판례: newList, 기대수정일: targetCase.수정일 }).then(function(res){
      if (res.conflict){ showToast(res.message || '충돌이 발생했습니다. 새로고침합니다.', 'warning'); if (targetCase === lsCurrentCase && typeof loadLsCases_ === 'function') loadLsCases_(targetCase.id); return false; }
      if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return false; }
      targetCase.법령예규판례 = newList;
      if (res.case && res.case.수정일) targetCase.수정일 = res.case.수정일;
      var cached = lsCases.filter(function(x){ return x.id === targetCase.id; })[0];
      if (cached) { cached.법령예규판례 = newList; if (res.case && res.case.수정일) cached.수정일 = res.case.수정일; }
      if (targetCase === lsCurrentCase) renderLsAttached_(lsCurrentCase);
      if (typeof loadWorkCases === 'function') loadWorkCases();
      return true;
    }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); return false; });
  }

  function renderLsBody_(){
    lsGeneration_++;
    lsResultItems = [];
    if (!lsSelectedId){
      lsBodyEl.innerHTML = '<div class="explorer-status">위에서 사건을 선택해주세요.</div>';
      lsCurrentCase = null;
      return;
    }
    var c = lsCases.filter(function(x){ return x.id === lsSelectedId; })[0];
    if (!c){
      lsBodyEl.innerHTML = '<div class="explorer-status">사건을 찾을 수 없습니다.</div>';
      lsCurrentCase = null;
      return;
    }
    lsCurrentCase = c;
    lsBodyEl.innerHTML =
      '<div class="card">' +
      '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:10px;">' + escapeHtml(c.사건명) + '</div>' +
      '<div style="display:flex; gap:6px 16px; flex-wrap:wrap; margin-bottom:10px; font-size:12.5px;">' +
      LS_ALL_SOURCES_.map(function(s){
        return '<label style="display:flex; align-items:center; gap:4px; cursor:pointer; white-space:nowrap;"><input type="checkbox" class="lsSourceChk" data-key="' + s.key + '"' + (s.on ? ' checked' : '') + '>' + escapeHtml(s.label) + '</label>';
      }).join('') +
      '</div>' +
      '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">' +
      '<input type="text" id="lsQuery" placeholder="포함어 (예: 1세대1주택 비과세)" style="flex:1; min-width:160px;">' +
      '<button type="button" id="lsSearchBtn" class="ghost-btn">검색</button>' +
      '</div>' +
      '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">' +
      '<input type="text" id="lsExclude" placeholder="제외어(선택, 쉼표로 여러 개)" style="flex:1; min-width:140px; font-size:12.5px;">' +
      // [2026.09 버그수정] 사건을 선택하면 그 사건의 세목이 뭔지 이미 알고 있는데도 이 칸을
      // 매번 다시 손으로 입력해야 했다 — 선택된 사건의 세목으로 미리 채워둔다(직접 지우거나
      // 다른 세목으로 바꿔서 검색하는 것은 여전히 자유롭게 가능).
      '<input type="text" id="lsSemok" placeholder="세목(선택, 예: 양도소득세)" value="' + escapeHtml((typeof WORK_SEMOK_LABELS !== 'undefined' && WORK_SEMOK_LABELS[c.세목]) || c.세목 || '') + '" style="flex:1; min-width:120px; font-size:12.5px;">' +
      '<input type="text" id="lsAgency" placeholder="생산기관·법원(선택, 예: 국세청, 대법원)" style="flex:1; min-width:140px; font-size:12.5px;">' +
      '<input type="text" id="lsFormType" placeholder="서식종류(선택, 예: 서식, 별표)" style="flex:1; min-width:120px; font-size:12.5px;">' +
      '</div>' +
      '<div id="lsResults"></div>' +
      '<div id="lsResultsActionBar" style="display:none; margin-top:8px;"><button type="button" id="lsAttachSelectedBtn" class="save-btn">➕ 선택한 항목 첨부</button></div>' +
      '</div>' +
      '<div class="card">' +
      '<div style="font-size:12px; color:var(--sub); margin-bottom:6px;">이 사건에 첨부된 자료</div>' +
      '<div id="lsAttached"></div>' +
      '</div>';

    renderLsAttached_(c);
    wireLsSearch_();
  }

  function wireLsSearch_(){
    var resultsBox = document.getElementById('lsResults');
    var actionBar = document.getElementById('lsResultsActionBar');
    var queryInput = document.getElementById('lsQuery');

    function selectedSources(){
      var keys = Array.prototype.map.call(document.querySelectorAll('.lsSourceChk:checked'), function(el){ return el.dataset.key; });
      return keys;
    }

    // [2026.09] 국세법령정보시스템의 검색필터(포함어/제외어/세목/생산기관/서식종류)를 옮겨왔다.
    // 실제로 확인해보니 이 필터들이 국가법령정보센터 API 자체의 파라미터는 아니라서(그런
    // 코드필터 자체가 없음), 세목은 검색어에 같이 실어 보내고(포함어와 AND 효과), 나머지
    // (제외어/생산기관/서식종류)는 검색결과를 받아온 뒤 제목·부가정보 문자열에서 걸러내는
    // 방식으로 구현했다 — 완벽한 코드분류는 아니지만 실무적으로 충분히 좁혀진다.
    function runSearch(){
      var query = queryInput.value.trim();
      if (!query){ showToast('검색어를 입력해주세요.', 'warning'); return; }
      var cats = selectedSources();
      if (!cats.length){ showToast('검색할 출처를 하나 이상 선택해주세요.', 'warning'); return; }
      var semok = document.getElementById('lsSemok').value.trim();
      var fullQuery = semok ? (query + ' ' + semok) : query;
      var excludeWords = document.getElementById('lsExclude').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      var agencyWord = document.getElementById('lsAgency').value.trim();
      var formTypeWord = document.getElementById('lsFormType').value.trim();

      resultsBox.innerHTML = '<div class="log-empty">검색 중…</div>';
      actionBar.style.display = 'none';
      lsResultItems = [];
      var searchGen = lsGeneration_;
      Promise.all(cats.map(function(category){
        return callGas('law_search_precedent', { category: category, query: fullQuery })
          .then(function(res){ return { category: category, res: res }; })
          .catch(function(err){ return { category: category, res: { error: err && err.message ? err.message : String(err) } }; });
      })).then(function(all){
        // [2026.09 버그수정] 검색 응답을 기다리는 사이 다른 사건으로 전환됐으면(=lsGeneration_
        // 증가) 이 결과는 지금 화면(다른 사건)과 무관하다 — 버린다. 이미 renderLsBody_가 이
        // DOM(#lsResults 등)을 통째로 새로 그렸으므로 resultsBox/actionBar도 더 이상 화면에
        // 붙어있지 않은 낡은 참조다.
        if (searchGen !== lsGeneration_) return;
        var anyError = null;
        var totalBeforeFilter = 0;
        all.forEach(function(entry){
          if (entry.res.error){ anyError = entry.res.error; return; }
          (entry.res.results || []).forEach(function(item){
            totalBeforeFilter++;
            var t = lsResultTitle_(entry.category, item);
            var haystack = (t.title + ' ' + t.sub).toLowerCase();
            if (excludeWords.some(function(w){ return haystack.indexOf(w.toLowerCase()) !== -1; })) return;
            if (agencyWord && haystack.indexOf(agencyWord.toLowerCase()) === -1) return;
            if (formTypeWord && entry.category === 'form' && haystack.indexOf(formTypeWord.toLowerCase()) === -1) return;
            lsResultItems.push({ category: entry.category, item: item, title: t.title, sub: t.sub });
          });
        });
        renderLsResults_();
        if (!lsResultItems.length){
          resultsBox.innerHTML = '<div class="log-empty">' + escapeHtml(anyError || (totalBeforeFilter ? '필터 조건에 맞는 결과가 없습니다(검색 자체는 ' + totalBeforeFilter + '건 있었음).' : '검색 결과가 없습니다.')) + '</div>';
        }
      });
    }
    document.getElementById('lsSearchBtn').addEventListener('click', runSearch);
    // [2026.09 버그수정] 로그인 화면과 같은 원인(e.key가 일부 환경에서 Enter로 안 잡힘) — keyCode도 같이 확인.
    queryInput.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.keyCode === 13){ e.preventDefault(); runSearch(); } });

    document.getElementById('lsAttachSelectedBtn').addEventListener('click', attachSelected_);
  }

  function renderLsResults_(){
    var resultsBox = document.getElementById('lsResults');
    var actionBar = document.getElementById('lsResultsActionBar');
    resultsBox.innerHTML = '';
    lsResultItems.forEach(function(ri, idx){
      var attached = lsIsAttached_(ri.category, ri.item.id);
      var row = document.createElement('div');
      row.className = 'log-entry';
      row.dataset.ridx = idx;
      row.innerHTML =
        '<div style="flex:0 0 auto; display:flex; align-items:center;">' +
        (attached ? '<span title="첨부됨" style="font-size:15px;">✅</span>' : '<input type="checkbox" class="lsResultChk" data-idx="' + idx + '">') +
        '</div>' +
        '<div class="log-date">' + escapeHtml(LS_CATEGORY_LABELS_[ri.category] || ri.category) + '</div>' +
        '<div class="log-text" style="flex:1;"><b>' + escapeHtml(ri.title) + '</b>' +
        (ri.sub ? '<br><span style="color:var(--sub); font-size:12px;">' + escapeHtml(ri.sub) + '</span>' : '') + '</div>' +
        (attached ? '<span style="color:var(--navy); font-size:12px; font-weight:700;">첨부됨</span>' : '');
      resultsBox.appendChild(row);
    });
    actionBar.style.display = lsResultItems.length ? 'block' : 'none';
  }

  // [2026.09] 결정유형(인용/기각/각하, 위헌/합헌 등)은 원본 검색결과에 코드필드로 없고
  // 판결문 문장(주문·결정요지 등) 안에 섞여 있어서, 미리 걸러주는 필터로는 못 만든다(수백 건을
  // 다 열어봐야 해서 너무 느림). 대신 첨부할 때는 이미 원문을 가져오니, 그 문장에서 흔한
  // 표현을 찾아 참고용 딱지만 붙여준다 — 정확한 분류가 아니라 "대략 이런 결과였다"는 참고용.
  function lsInferOutcome_(category, detail){
    var text = '';
    if (category === 'tax_tribunal') text = String(detail.주문 || detail.재결요지 || '');
    else if (category === 'constitutional') text = String(detail.결정요지 || detail.판시사항 || '');
    else if (category === 'precedent') text = String(detail.판결요지 || detail.판시사항 || '');
    else return '';
    var patterns = [
      ['일부인용', /일부\s*인용/], ['일부기각', /일부\s*기각/],
      ['인용', /인용(한다|함|되었다|결정)/], ['기각', /기각(한다|함|되었다|결정)/], ['각하', /각하(한다|함|되었다|결정)/],
      ['위헌', /위헌(이다|이라고|선언|결정)/], ['헌법불합치', /헌법\s*불합치/], ['합헌', /합헌(이다|이라고|결정)/]
    ];
    for (var i = 0; i < patterns.length; i++){ if (patterns[i][1].test(text)) return patterns[i][0]; }
    return '';
  }

  function attachSelected_(){
    var checked = Array.prototype.map.call(document.querySelectorAll('.lsResultChk:checked'), function(el){ return Number(el.dataset.idx); });
    if (!checked.length){ showToast('첨부할 항목을 체크해주세요.', 'warning'); return; }
    var btn = document.getElementById('lsAttachSelectedBtn');
    btn.disabled = true;
    btn.textContent = '조회 중…';

    // [2026.09 버그수정] 조회(law_get_precedent_detail)에 시간이 걸리는 동안 사용자가 다른
    // 사건으로 전환할 수 있다 — 지금 이 순간의 사건을 캡처해두고 끝까지 이 사건 기준으로
    // 처리한다(완료 시점에 전역 lsCurrentCase를 다시 참조하면 그 사이 바뀐 엉뚱한 사건에
    // 첨부·저장될 위험이 있었다).
    var targetCase = lsCurrentCase;
    var picked = checked.map(function(idx){ return lsResultItems[idx]; });
    Promise.all(picked.map(function(ri){
      if (LS_NO_DETAIL_[ri.category]){
        return Promise.resolve({ 요약: lsSearchOnlySummary_(ri.category, ri.item), 결과: '' });
      }
      return callGas('law_get_precedent_detail', { category: ri.category, id: ri.item.id })
        .then(function(detail){ return { 요약: lsDetailSummary_(ri.category, detail), 결과: lsInferOutcome_(ri.category, detail) }; })
        .catch(function(){ return { 요약: (ri.sub || '') + '\n(원문 없음 — 검색결과 기본정보만 첨부됨)', 결과: '' }; });
    })).then(function(picked_results){
      var today = new Date().toISOString().slice(0, 10);
      var newEntries = picked.map(function(ri, i){
        var entry = { category: ri.category, id: ri.item.id, 제목: ri.title, 요약: picked_results[i].요약, 첨부일: today };
        if (picked_results[i].결과) entry.결과 = picked_results[i].결과;
        return entry;
      }).filter(function(entry){
        return !(targetCase.법령예규판례 || []).some(function(e){ return e.category === entry.category && e.id === entry.id; });
      });
      var newList = (targetCase.법령예규판례 || []).concat(newEntries);
      lsSaveAttachments_(newList, targetCase).then(function(ok){
        btn.disabled = false;
        btn.textContent = '➕ 선택한 항목 첨부';
        if (ok){
          showToast((targetCase === lsCurrentCase ? '' : ('(' + (targetCase.사건명 || '') + ') ')) + newEntries.length + '건 첨부했습니다.', 'success');
          // [2026.09 버그수정] 그 사이 다른 사건으로 넘어갔으면 지금 화면(#lsResults)은 이미
          // 그 다른 사건의 것이므로 여기(targetCase 기준) 결과로 덮어쓰지 않는다.
          if (targetCase === lsCurrentCase) renderLsResults_(); // 첨부된 것만 "✅ 첨부됨"으로 바뀌고 나머지는 그대로 남는다.
        }
      });
    });
  }

  function renderLsAttached_(c){
    var wrap = document.getElementById('lsAttached');
    if (!wrap) return;
    var list = c.법령예규판례 || [];
    if (!list.length){
      wrap.innerHTML = '<div class="log-empty">아직 첨부된 자료가 없습니다.</div>';
      return;
    }
    wrap.innerHTML = '';
    list.slice().reverse().forEach(function(entry){
      var row = document.createElement('div');
      row.className = 'log-entry';
      row.innerHTML =
        '<div class="log-date">' + escapeHtml(LS_CATEGORY_LABELS_[entry.category] || entry.category) +
        (entry.결과 ? '<br><span title="판결문 문장에서 자동으로 찾은 참고용 표시 — 정확한 분류 아님" style="background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:1px 6px; font-size:11px; color:var(--navy); display:inline-block; margin-top:3px;">' + escapeHtml(entry.결과) + '</span>' : '') + '</div>' +
        '<div class="log-text"><b>' + escapeHtml(entry.제목 || '') + '</b>' +
        (entry.요약 ? '<br><span style="color:var(--sub); font-size:12.5px; white-space:pre-wrap;">' + escapeHtml(entry.요약) + '</span>' : '') + '</div>' +
        '<span class="log-del" title="첨부 해제">✕</span>';
      row.querySelector('.log-del').addEventListener('click', function(){
        var newList = list.filter(function(e){ return !(e.category === entry.category && e.id === entry.id); });
        lsSaveAttachments_(newList).then(function(ok){ if (ok) renderLsResults_(); });
      });
      wrap.appendChild(row);
    });
  }

  // 사건처리 카드의 "⚖️ 법령관리에서 열기" 버튼에서 호출 — 이 화면으로 이동하고 그
  // 사건을 바로 골라준다(goToCaseHandling_과 같은 패턴).
  function goToLawSearch_(caseId){
    // [2026.09 버그수정] lsSelectedId를 goToView_보다 먼저 정해두면, 최초 진입 시
    // initLawSearch()가 실행하는 loadLsCases_()가 이미 이 값을 보고 바로 그 사건을 골라주므로
    // (loadLsCases_의 wantId = preselectId || lsSelectedId), 아래 명시적 재조회가 필요 없다 —
    // 이미 로드된 세션(goToView_ 호출 전 lsLoaded)일 때만 최신 목록으로 다시 불러온다.
    // (goToView_가 최초 진입 시 initLawSearch()를 실행해 lsLoaded를 그 안에서 true로 바꾸므로,
    // 반드시 goToView_ 호출 "전" 값을 따로 기억해둬야 한다 — 안 그러면 최초 진입 때도 항상
    // true로 보여 여기서 다시 한번 중복 조회하게 된다.)
    var wasAlreadyLoaded = lsLoaded;
    lsSelectedId = caseId;
    if (typeof goToView_ === 'function') goToView_('lawsearch');
    if (wasAlreadyLoaded) loadLsCases_(caseId);
  }
</script>

<script>
  // ============================================================
  // [2026.10.19 조견표 체계] 법령정보 하위 탭 — [📜 법령][📄 서식][📋 조견표]
  //  세무사님 말씀(원문): "세무서식도 세법해석이 함축적으로 녹아들어 있다는 점을 중요하게 생각한다면 서식관리도 조견표와
  //  마찬가지로 법령탭속에 하위탭으로 구성해야 하지 않을까?" — 셋이 서로 이어진다:
  //   조문 → 그 조문을 해석한 서식 칸 / 서식 칸 → 그 칸을 채우는 조견표·계산기 칸 / 조견표 행 → 근거 조문·서식 칸.
  //  · 서식 목록은 세액인쇄의 PRINT_REGISTRY_(subForms)를 "읽기만" 한다 — 세액인쇄에 서식을 더하면 여기도 저절로 생긴다.
  //  · 서식 원본은 열람관리 자료실과 같은 드라이브 폴더(REP_LAWREF_FOLDERS_)를 listFolder로 읽어 서식번호로 짝짓는다.
  //  · 조문 → 계산 지도는 EngineLawMap.js(자동 생성)를 앱을 만들 때 tools/build-app.js가 아래 자리에 끼워 넣는다
  //    (서버 호출 없음. 예전 구글 주소 화면에서는 null이라 "앱 화면에서만"이라고 알린다).
  //  · 칸 지도(LSI_FORM_MAPS_)·조견표(LSI_REF_TABLES_)는 세무사님 확인 전 "초안" — 운영 판정·계산에는 쓰지 않는다.
  // ============================================================
  var LSI_ENGINE_LAW_MAP_ = /*@@ENGINE_LAW_MAP@@*/null;

  // 아래 두 줄은 tools/build-reftables.js가 저장소 reftables/*.json으로 다시 쓴다 — 직접 고치지 말고 JSON을 고친 뒤 도구를 돌릴 것
  /*@@REF_DATA_BEGIN@@*/
  var LSI_FORM_MAPS_ = {};
  var LSI_REF_TABLES_ = [];
  var LSI_FORM_CATALOG_ = {"서식":[]};

  var lsiActiveTab_ = 'law';
  var lsiFolderFiles_ = null;      // [{name,url,mimeType,folder}] — 드라이브 서식 폴더 3곳
  var lsiFolderLoading_ = false;

  var lsiOpenRef_ = null;

  var LSI_FOLDER_NAMES_ = { 5: '상속세', 6: '증여세', 7: '양도소득세' };
  var LSI_FALLBACK_FOLDERS_ = { 5: '1jz3BITVNVs2Wv90Nof0sDMSLFaMrcemc', 6: '1r9WMIy2ZzFE6nJZM-eUAaAUNvn4JAgyw', 7: '1qRmfUCM2vdA5rtQqxxenkhbv_zbD7Pyp' };
  // [2026.10.19 세무사님 "그 폴더에 넣어라"] 법제처 공식 서식 PDF 144종 — 업무관리자\세금계산\법정서식원본(법제처)\<세목>, 이름 = 법제처 서식 이름 + _개정YYYY.M.D(목록: 그 폴더 _목록.md)
  //  원본 열기는 이 PDF를 먼저 보여 주고, 예전부터 있던 hwp/pdf(위 세목 폴더)는 그 옆에 둔다.
  var LSI_OFFICIAL_FOLDERS_ = { '상속': '11qD8IugSmXnNlI2RueaSrTCYrL74F937', '증여': '1wqtL3uPhNCuAwM8O3uHM1F-tt8QQLJ-3', '양도': '126zwjK9dcE8-ZgMYGdgj3FZiei78DsK7', '공통': '1L9OQq6HWSn_Jk0ap5IwbUYbU_NrdP90y' };
  var LSI_BASE_LAWS_ = ['소득세법', '소득세법 시행령', '소득세법 시행규칙', '상속세 및 증여세법', '상속세 및 증여세법 시행령', '상속세 및 증여세법 시행규칙',

  function lsiEsc_(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // ---------- 세무사님 확인 기록(서버 스크립트 속성 — reftable_review_get/set). 기록만 하고, 확인해도 계산·판정에 바로 쓰이지 않는다 ----------
  var lsiReviews_ = null, lsiReviewLoading_ = false, lsiReviewFailed_ = false, lsiReviewWaiters_ = [];

  function lsiLoadReviews_(after){

  // 표 내용 지문 — 확인한 뒤 표가 바뀌면 "확인 뒤 바뀜"으로 알리려고(행·칸·절차·개정만 본다)
  function lsiVer_(obj){

  function lsiState_(key, obj){

  }
  function lsiReviewBarHtml_(key, obj){

    var line = lsiReviews_ === null ? '확인 기록을 불러오는 중…'
      : lsiReviewFailed_ ? '확인 기록을 불러오지 못했습니다(서버 연결을 확인해 주세요).'
      : !rv ? '아직 세무사님 확인 전입니다.'
      : '세무사님 <b>' + lsiEsc_(rv.상태) + '</b> — ' + lsiEsc_(rv.시각 || '') + (changed ? ' · <span class="lsi-badge warn">확인한 뒤 표가 바뀌었습니다 — 다시 봐 주세요</span>' : '') + (rv.메모 ? '<br>메모: ' + lsiEsc_(rv.메모) : '');

      '<div style="display:flex; gap:6px; flex-wrap:wrap;">' +
      '<button type="button" class="btn" data-lsirev="확인">✅ 이 표 확인</button>' +
      '<button type="button" class="btn" data-lsirevmemo="1">✏ 고칠 곳 메모</button>' +
      '<button type="button" class="btn" data-lsirev="보류">⏸ 보류</button>' +
      (rv ? '<button type="button" class="ghost-btn" data-lsirev="지움">기록 지우기</button>' : '') + '</div>' +
      '<div class="lsi-revmemo" style="display:none; margin-top:6px;"><textarea rows="2" style="width:100%;" aria-label="고칠 곳 메모" placeholder="어느 행·칸을 어떻게 고쳐야 하는지 적어 주세요">' + lsiEsc_(rv && rv.메모 || '') + '</textarea>' +
      '<button type="button" class="btn" data-lsirev="메모" style="margin-top:4px;">메모 저장</button></div>' +

  }
  function lsiWireReview_(root, key, obj, redraw){
    var bar = root.querySelector('.lsi-review'); if (!bar) return;
    var memo = bar.querySelector('.lsi-revmemo');
    var m = bar.querySelector('[data-lsirevmemo]'); if (m) m.addEventListener('click', function(){ memo.style.display = ''; memo.querySelector('textarea').focus(); });
    bar.querySelectorAll('[data-lsirev]').forEach(function(b){
      b.addEventListener('click', function(){
        var st = b.dataset.lsirev;

        b.disabled = true;
        callGas('reftable_review_set', { key: key, state: st, ver: lsiVer_(obj), memo: memo.querySelector('textarea').value.trim() }).then(function(r){
          if (!r || r.error) throw new Error((r && r.error) || '저장 실패');

  }

  function lsiShowTab_(tab){

  document.querySelectorAll('.lsi-tab').forEach(function(b){ b.addEventListener('click', function(){ lsiShowTab_(b.dataset.lsitab); }); });

  // ---------- 서식번호 읽기: "소득세법 시행규칙 [별지 제84호서식 부표1]" → 법 + 번호 열쇠("84부표1") ----------
  var LSI_LAW_ALIASES_ = [
    [/조세특례제한법|조특법/, '조세특례제한법 시행규칙'], [/상속세\s*및\s*증여세법|상증세법|상증법/, '상속세 및 증여세법 시행규칙'],
    [/국세기본법/, '국세기본법 시행규칙'], [/법인세법/, '법인세법 시행규칙'], [/지방세법/, '지방세법 시행규칙'], [/소득세법/, '소득세법 시행규칙']

    if (!m) return null;
    return m[1] + (m[2] ? m[2].replace(/\s/g, '') : '') + (m[3] ? '부표' + m[3].replace(/\s/g, '') : (/부표/.test(m[0]) ? '부표' : '')) + (m[4] ? '(' + m[4] + ')' : '');
  }
  function lsiLawOf_(s){
    s = String(s || '');
    for (var i = 0; i < LSI_LAW_ALIASES_.length; i++) if (LSI_LAW_ALIASES_[i][0].test(s)) return LSI_LAW_ALIASES_[i][1];
    return '';
  }
  function lsiNorm_(s){ return String(s || '').replace(/[\s·ㆍ,¸()\[\]「」.\-_]/g, ''); }

  function lsiLoadFolderFiles_(){
    if (lsiFolderFiles_ || lsiFolderLoading_) return;
    lsiFolderLoading_ = true;
    var folders = (typeof REP_LAWREF_FOLDERS_ !== 'undefined' && REP_LAWREF_FOLDERS_) ? REP_LAWREF_FOLDERS_ : LSI_FALLBACK_FOLDERS_;
    var list = Object.keys(folders).map(function(k){ return { id: folders[k], label: LSI_FOLDER_NAMES_[k] || k, official: false }; })
      .concat(Object.keys(LSI_OFFICIAL_FOLDERS_).map(function(k){ return { id: LSI_OFFICIAL_FOLDERS_[k], label: '법제처 원본·' + k, official: true }; }));
    Promise.all(list.map(function(d){
      return callGas('listFolder', { folderId: d.id }).then(function(res){
        return (res && res.files || []).filter(function(f){ return !d.official || /\.pdf$/i.test(f.name); }).map(function(f){ return { name: f.name, url: f.url, mimeType: f.mimeType, folder: d.label, official: d.official }; });
      }).catch(function(){ return [{ error: true, folder: d.label }]; });

  }

  // 서식 한 줄에 맞는 원본 파일 찾기 — ①번호+법 이름 같음 ②번호만 같음(파일 이름에 법 이름이 없음) ③본 서식 파일(부표가 본 서식 hwp 안에 같이 있는 경우)
  //  ④제목이 파일 이름에 그대로 들어 있음. 짝을 어떻게 지었는지 그대로 보여 준다(지어내지 않음).
  function lsiMatchFiles_(formNo, title){
    // 법제처 원본 PDF는 번호·법이 같은 것만(이름 규칙이 정해져 있음), 맨 앞에. 나머지는 예전 방식대로 그 옆에.
    var key0 = lsiFormKey_(formNo), law0 = lsiLawOf_(formNo);
    var official = (lsiFolderFiles_ || []).filter(function(f){ return !f.error && f.official && key0 && lsiFormKey_(f.name) === key0 && lsiLawOf_(f.name) === law0; }).map(function(f){ return { f: f, how: '법제처 공식 서식(번호·법 같음)' }; });

  }
  function lsiMatchOldFiles_(formNo, title){
    var files = (lsiFolderFiles_ || []).filter(function(f){ return !f.error && !f.official; });
    var key = lsiFormKey_(formNo), law = lsiLawOf_(formNo);
    var out = [];
    files.forEach(function(f){
      var fk = lsiFormKey_(f.name), fl = lsiLawOf_(f.name);
      if (key && fk === key && fl === law) out.push({ f: f, how: '번호·법 같음' });
      else if (key && fk === key && !fl) out.push({ f: f, how: '번호만 같음(파일 이름에 법 이름 없음 — 확인 필요)' });
    });
    if (!out.length && key && key.indexOf('부표') !== -1){
      var parent = key.split('부표')[0];
      files.forEach(function(f){ if (lsiFormKey_(f.name) === parent && (lsiLawOf_(f.name) === law || !lsiLawOf_(f.name))) out.push({ f: f, how: '본 서식 파일 안에 함께 있음(추정)' }); });
    }
    if (!out.length && title){
      var nt = lsiNorm_(title);
      if (nt.length >= 6) files.forEach(function(f){ if (lsiNorm_(f.name).indexOf(nt) !== -1) out.push({ f: f, how: '제목이 같음' }); });
    }
    return out;
  }

  // [2026.10.19 서식 사전 전체] 서식 탭 목록은 법령 별지 기준 전체 목록(LSI_FORM_CATALOG_, 144종)을 쓴다 — 세액인쇄 목록(신고에 내는 서식)보다 넓다.
  //  예전 구글 주소 화면처럼 목록 자료가 없으면 세액인쇄 목록으로 대신한다.
  function lsiCatalogOn_(){ return typeof LSI_FORM_CATALOG_ !== 'undefined' && LSI_FORM_CATALOG_ && (LSI_FORM_CATALOG_.서식 || []).length > 0; }
  function lsiFormGroups_(){ return lsiCatalogOn_() ? (LSI_FORM_CATALOG_.세목순서 || ['양도', '상속', '증여', '공통']) : (typeof PRINT_GROUP_ORDER_ !== 'undefined' ? PRINT_GROUP_ORDER_ : ['양도소득세', '상속세', '증여세', '증여·상속 공통']); }
  function lsiGroupOfForm_(formNo){
    if (lsiCatalogOn_()){ var c = LSI_FORM_CATALOG_.서식.filter(function(x){ return x.서식번호 === formNo; })[0]; return c ? c.세목 : null; }
    return (typeof PRINT_REGISTRY_ !== 'undefined') ? (PRINT_REGISTRY_.filter(function(it){ return (it.subForms || []).some(function(sf){ return sf.formNo === formNo; }) || it.formNo === formNo; })[0] || {}).group : null;
  }
  // 세액인쇄 세목 이름 → 서식 사전 세목(세액인쇄의 '전체 서식 목록' 단추에서 넘어올 때)
  function lsiGroupFromPrint_(g){ if (!lsiCatalogOn_()) return g; return ({ '양도소득세': '양도', '상속세': '상속', '증여세': '증여', '증여·상속 공통': '공통' })[g] || g; }
  function lsiFormRows_(group){
    if (!lsiCatalogOn_()) return lsiRegistryRows_(group);
    return LSI_FORM_CATALOG_.서식.filter(function(x){ return x.세목 === group; }).map(function(x){ return { formNo: x.서식번호, title: x.이름, 개정일: x.개정일, 쓰임: x.쓰임, 법제처: x.법제처 }; });

  function lsiRegistryRows_(group){
    if (typeof PRINT_REGISTRY_ === 'undefined') return [];
    var rows = [], seen = {};
    PRINT_REGISTRY_.filter(function(it){ return it.group === group; }).forEach(function(it){
      var itFormNo = typeof it.formNo === 'function' ? '' : it.formNo;
      var list = it.subForms && it.subForms.length ? it.subForms : [{ formNo: itFormNo, title: it.label, section: 'required' }];
      list.forEach(function(sf){
        if (!sf.formNo || seen[sf.formNo]) return;
        seen[sf.formNo] = true;
        rows.push({ formNo: sf.formNo, title: sf.title, section: sf.section, source: it.label, printKey: it.key });
      });

  }

  function lsiRenderForms_(){
    var pane = document.getElementById('lsiPane-form');
    if (!lsiCatalogOn_() && typeof PRINT_REGISTRY_ === 'undefined'){ pane.innerHTML = '<div class="card">서식 목록(세액인쇄)을 아직 불러오지 못했습니다. 잠시 뒤 다시 눌러 주세요.</div>'; return; }
    lsiLoadFolderFiles_();
    var groups = lsiFormGroups_();
    if (!lsiFormGroup_ || groups.indexOf(lsiFormGroup_) === -1) lsiFormGroup_ = lsiGroupFromPrint_(lsiFormGroup_) && groups.indexOf(lsiGroupFromPrint_(lsiFormGroup_)) !== -1 ? lsiGroupFromPrint_(lsiFormGroup_) : groups[0];
    var rows = lsiFormRows_(lsiFormGroup_);
    var allCount = groups.reduce(function(n, g){ return n + lsiFormRows_(g).length; }, 0);
    var html = '<div class="card">' +
      '<div class="lsi-note" style="margin-bottom:8px;">서식은 세법을 가장 먼저 정밀하게 해석한 기준입니다. 서식마다 <b>칸 해설</b>(칸 → 근거 조문 → 계산기 칸 → 쓰이는 조견표)을 쌓아 갑니다. ' +
      (lsiCatalogOn_() ? '목록은 법령 시행규칙 별지 기준 전체 서식(모두 ' + allCount + '개, 지방세 신고서 제외 — 신고에 내는 서식은 세액인쇄가 고릅니다)이고, 원본은' : '목록은 <b>세액인쇄</b>의 서식 목록(모두 ' + allCount + '개)을 그대로 읽어 오고, 원본은') + ' 드라이브에서 서식번호로 찾습니다 — <b>법제처 PDF</b>(업무관리자\\세금계산\\법정서식원본(법제처)의 법제처 공식 서식)를 먼저, 예전부터 있던 한글·PDF 파일은 그 옆에 둡니다. 이 탭은 서식 사전입니다 — 어떤 서식을 낼지·인쇄·전자신고는 🖨 세액인쇄에서 합니다.</div>' +
      '<div class="lsi-chips">' + groups.map(function(g){ return '<button type="button" class="lsi-chip' + (g === lsiFormGroup_ ? ' active' : '') + '" data-lsigroup="' + lsiEsc_(g) + '">' + lsiEsc_(g) + ' (' + lsiFormRows_(g).length + ')</button>'; }).join('') + '</div>';
    var noFile = 0;
    var body = rows.map(function(r){
      var files = lsiFolderFiles_ ? lsiMatchFiles_(r.formNo, r.title) : null;
      if (files && !files.length) noFile++;
      var fm = LSI_FORM_MAPS_[r.formNo];
      var fileHtml = files === null ? '<span class="lsi-note">불러오는 중…</span>'
        : files.length ? '<span class="lsi-files">' + files.map(function(x){ return '<a href="' + lsiEsc_(x.f.url) + '" target="_blank" rel="noopener" title="' + lsiEsc_(x.f.folder + ' 폴더 · ' + x.f.name + ' · ' + x.how) + '">' + (x.f.official ? '법제처 PDF' : /\.pdf$/i.test(x.f.name) ? 'PDF' : /\.hwpx?$/i.test(x.f.name) ? '한글' : '파일') + (x.how === '번호·법 같음' || x.f.official ? '' : '?') + '</a>'; }).join('') + '</span>'
        : '<span class="lsi-badge warn">원본 없음</span>';
      var mapHtml = fm ? '<button type="button" class="lsi-link" data-lsiformmap="' + lsiEsc_(r.formNo) + '">칸 ' + (fm.칸 || []).length + '개</button> <span class="lsi-badge' + (lsiState_(r.formNo, fm) === '세무사님 확인' ? ' ok' : ' warn') + '">' + lsiEsc_(lsiState_(r.formNo, fm)) + '</span>' : '<span class="lsi-note">아직 없음</span>';
      // [2026.10.19 세무사님] 서식 탭은 서식 사전 — 필수/해당 시·전자/서면·찍기(세액인쇄로) 같은 신고·출력 표시는 세액인쇄에만 둔다
      return '<tr><td style="white-space:nowrap;">' + lsiEsc_(typeof printShortFormNo_ === 'function' ? printShortFormNo_(r.formNo) : r.formNo) + '</td>' +
        '<td>' + lsiEsc_(r.title) + '<div class="lsi-note">' + lsiEsc_(r.formNo.split('[')[0].trim()) + (r.개정일 ? ' · 개정 ' + lsiEsc_(r.개정일) : '') + (r.법제처 ? ' · <a href="' + lsiEsc_(r.법제처) + '" target="_blank" rel="noopener">법제처 화면 ↗</a>' : '') + '</div></td>' +
        '<td class="nw">' + fileHtml + lsiOldFilesHtml_(r.formNo) + '</td><td class="nw">' + mapHtml + '</td></tr>';
    }).join('');
    html += '<div class="lsi-table-wrap"><table class="lsi-table"><thead><tr><th>서식번호</th><th>서식 이름</th><th>원본</th><th>칸 해설</th></tr></thead><tbody>' + body + '</tbody></table></div>';
    html += '<div class="lsi-note" style="margin-top:6px;">원본 옆 "?"는 서식번호만 같거나 제목으로 짝지은 것입니다(마우스를 올리면 이유가 보입니다).' + (lsiFolderFiles_ ? ' 이 세목에서 원본을 못 찾은 서식 ' + noFile + '개.' : '') + '</div></div>';
    html += '<div id="lsiFormMapBox"></div>';
    if (lsiFolderFiles_) html += lsiUnmatchedHtml_();
    pane.innerHTML = html;
    if (lsiOpenFormMap_ && LSI_FORM_MAPS_[lsiOpenFormMap_]) setTimeout(function(){ lsiShowFormMap_(lsiOpenFormMap_, true); }, 0);
    pane.querySelectorAll('[data-lsigroup]').forEach(function(b){ b.addEventListener('click', function(){ lsiFormGroup_ = b.dataset.lsigroup; lsiRenderForms_(); }); });
    pane.querySelectorAll('[data-lsiformmap]').forEach(function(b){ b.addEventListener('click', function(){ lsiShowFormMap_(b.dataset.lsiformmap); }); });
  }

  // 드라이브 서식 폴더에 있는데 세액인쇄 목록의 어느 서식과도 짝이 안 된 파일 — 목록에 빠진 서식을 찾는 데 쓴다
  // [2026.10.19 세무사님 질문 "서식폴더에 있지만 목록과 짝이 안된 파일이 무척 많이 나열되어 있는데 이것이 무슨 의미인가?"]
  //  예전 서식 폴더(5 상속세·6 증여세·7 양도소득세)의 파일 중 서식 사전 줄과 바로 짝지어지지 않은 것을 세 묶음으로 나눈다.
  //  ① 옛 판: 이름이 번호 없이 바뀌었지만 같은 서식(제목이 같음) — 그 서식 줄 아래 "옛 판"으로 붙인다.
  //  ② 참고자료: 서식이 아닌 해설·안내·사례·파일설명서 — 세목별로 접어서 보여 준다(조견표 재료).
  //  ③ 확인 필요: 서식처럼 보이지만 이 목록(법령 시행규칙 별지, 지방세 제외) 밖이거나 이름으로 알 수 없는 것 — 이유를 붙인다.
  //  참고자료 말: 이 말이 있으면 서식 이름 같아도 참고자료(사례·설명·안내 등). 서식이 아닌 이름(신청서·신고서·명세서·계산서 등이 없음)도 참고자료.
  var LSI_REF_WORDS_ = /사례|작성요령|설명|개요|흐름도|안내|가이드|요령|실수|체크포인트|포인트|상식|오해|책자|과세개요|지원제도/;
  function lsiTitleKey_(name){
    var t = String(name || '').replace(/\.(hwpx?|pdf|docx?)$/i, '').replace(/^\s*(\[[^\]]*\]|\([^)]*\))\s*/, '').replace(/^[\d_.\s]+/, '')
      .replace(/\((?:[^()]*법[^()]*|수정|\d+)\)\s*$/, '').replace(/_?\d{2}년$/, '');
    return lsiNorm_(t);
  }
  var lsiLeftCache_ = null, lsiLeftCacheOf_ = null;
  function lsiClassifyLeftovers_(){
    if (lsiLeftCacheOf_ === lsiFolderFiles_ && lsiLeftCache_) return lsiLeftCache_;
    var used = {};
    var rows = [];
    lsiFormGroups_().forEach(function(g){ lsiFormRows_(g).forEach(function(r){ rows.push(r); lsiMatchFiles_(r.formNo, r.title).forEach(function(x){ used[x.f.url] = true; }); }); });
    // 제목 열쇠 두 가지: 그대로, 괄호 속 글을 뺀 것(예: '양도소득(국외전출자)과세표준 신고…' ↔ '양도소득과세표준 신고…')
    var noParen = function(t){ return lsiNorm_(String(t || '').replace(/\([^()]*\)/g, '')); };
    var titles = rows.map(function(r){ return { formNo: r.formNo, keys: [lsiNorm_(r.title), noParen(r.title)] }; });
    var out = { old: {}, oldCount: 0, ref: {}, refCount: 0, unknown: [], errs: (lsiFolderFiles_ || []).filter(function(f){ return f.error; }) };
    (lsiFolderFiles_ || []).filter(function(f){ return !f.error && !f.official && !used[f.url]; }).forEach(function(f){
      var key = lsiTitleKey_(f.name), key2 = noParen(lsiTitleKey_(f.name));
      var isRefWord = LSI_REF_WORDS_.test(f.name);
      // 옛 판: 제목이 서식 이름과 같거나 서로 포함(8자 이상) — 가장 길게 겹치는 서식 하나에
      //  서식번호가 이름에 따로 적힌 파일([별지 제57호의2서식] 등)과 다른 법령 서식은 제목으로 짝짓지 않는다(번호가 다르면 다른 서식)
      //  점수: 똑같음 > 파일 제목이 서식 이름 안에 있음(서식 이름이 짧을수록) > 서식 이름이 파일 제목 안에 있음(서식 이름이 길수록)
      var best = null, bestScore = 0;
      if (!isRefWord && !lsiFormKey_(f.name) && !/법인세법|지방세|사무처리규정/.test(f.name) && key.length >= 6) titles.forEach(function(t){
        [key, key2].forEach(function(k){ t.keys.forEach(function(tk){
          if (tk.length < 6 || k.length < 6) return;
          var sc = k === tk ? 1000 : (k.length >= 8 && tk.indexOf(k) !== -1) ? 500 - (tk.length - k.length) : (tk.length >= 8 && k.indexOf(tk) !== -1) ? 100 + tk.length : 0;
          if (sc > bestScore){ bestScore = sc; best = t; }
        }); });
      });
      if (best){ (out.old[best.formNo] = out.old[best.formNo] || []).push(f); out.oldCount++; return; }
      var formLike = /\[별지|서식\]|신청서|신고서|명세서|계산서|합계표|확인서/.test(f.name);
      if (isRefWord || !formLike){ (out.ref[f.folder] = out.ref[f.folder] || []).push(f); out.refCount++; return; }
      var why = /사무처리규정/.test(f.name) ? '국세청 사무처리규정 서식(법령 시행규칙 별지가 아님)'
        : /법인세법|지방세/.test(f.name) ? '다른 법령 서식(이 서식 사전 범위 밖)'
        : lsiFormKey_(f.name) ? '서식번호는 읽었지만 이 목록에 없는 번호(삭제·이동된 옛 번호이거나 범위 밖)'
        : '이름만으로는 어느 서식인지 알 수 없음';
      out.unknown.push({ f: f, why: why });
    });
    lsiLeftCache_ = out; lsiLeftCacheOf_ = lsiFolderFiles_;
    return out;
  }
  function lsiOldFilesHtml_(formNo){
    if (!lsiFolderFiles_) return '';
    var list = lsiClassifyLeftovers_().old[formNo] || [];
    if (!list.length) return '';
    return '<div class="lsi-note" style="margin-top:2px;">옛 판: ' + list.map(function(f){
      var yr = (String(f.name).match(/(\d{2})년/) || [])[1];
      return '<a href="' + lsiEsc_(f.url) + '" target="_blank" rel="noopener" title="' + lsiEsc_(f.folder + ' 폴더 · ' + f.name + ' · 제목이 같아 짝지음(개정일은 파일에 없음)') + '">' + (/\.pdf$/i.test(f.name) ? 'PDF' : /\.hwpx?$/i.test(f.name) ? '한글' : '파일') + '(' + (yr ? '20' + yr + '년' : '개정일 모름') + ')</a>';
    }).join(' ') + '</div>';
  }
  function lsiUnmatchedHtml_(){
    var c = lsiClassifyLeftovers_();
    var li = function(f, extra){ return '<li><a href="' + lsiEsc_(f.url) + '" target="_blank" rel="noopener">' + lsiEsc_(f.name) + '</a> <span class="lsi-note">(' + lsiEsc_(f.folder) + (extra ? ' · ' + lsiEsc_(extra) : '') + ')</span></li>'; };
    var refFolders = Object.keys(c.ref);
    return '<div class="card"><details><summary style="cursor:pointer;"><b>예전 서식 폴더의 다른 파일</b> <span class="lsi-note">— 옛 판 ' + c.oldCount + '개(각 서식 줄에 붙임) · 참고자료 ' + c.refCount + '개 · 확인 필요 ' + c.unknown.length + '개</span></summary>' +
      (c.errs.length ? '<div class="lsi-note">폴더를 못 읽음: ' + c.errs.map(function(e){ return lsiEsc_(e.folder); }).join(', ') + '</div>' : '') +
      '<div class="lsi-note" style="margin:6px 0;">예전부터 쓰던 서식 폴더(업무관리자\\세금계산\\5 상속세·6 증여세·7 양도소득세)의 파일 중 위 서식 줄과 번호로 바로 짝지어지지 않은 것입니다. 지우거나 옮기지 않았습니다.</div>' +
      '<details style="margin:4px 0;"><summary class="lsi-note" style="cursor:pointer;">참고자료 ' + c.refCount + '개 — 서식이 아닌 해설·안내·사례·파일설명서(세목별)</summary>' +
        refFolders.map(function(k){ return '<div style="margin:6px 0 0 6px;"><b style="font-size:12.5px;">' + lsiEsc_(k) + ' (' + c.ref[k].length + ')</b><ul style="margin:2px 0 0 18px; font-size:12.5px;">' + c.ref[k].map(function(f){ return li(f); }).join('') + '</ul></div>'; }).join('') + '</details>' +
      '<details style="margin:4px 0;"><summary class="lsi-note" style="cursor:pointer;">확인 필요 ' + c.unknown.length + '개 — 서식처럼 보이지만 이 목록 밖이거나 이름으로 알 수 없음</summary><ul style="margin:6px 0 0 18px; font-size:12.5px;">' + c.unknown.map(function(u){ return li(u.f, u.why); }).join('') + '</ul></details>' +
      '</details></div>';
  }

  // ---------- 조문 문자열 읽기: "상증세법 §24①" → { law: '상속세 및 증여세법', art: '24' } ----------
  var LSI_ART_LAW_ALIASES_ = [
    [/조특령|조세특례제한법\s*시행령|조특법\s*시행령/, '조세특례제한법 시행령'], [/조세특례제한법\s*시행규칙|조특법\s*시행규칙/, '조세특례제한법 시행규칙'], [/조특법|조세특례제한법/, '조세특례제한법'],
    [/상속세\s*및\s*증여세법\s*시행령|상증(?:세)?법\s*시행령|상증령/, '상속세 및 증여세법 시행령'], [/상속세\s*및\s*증여세법\s*시행규칙|상증(?:세)?법\s*시행규칙/, '상속세 및 증여세법 시행규칙'], [/상증(?:세)?법|상속세\s*및\s*증여세법/, '상속세 및 증여세법'],
    [/국세기본법\s*시행령|국기령/, '국세기본법 시행령'], [/국세기본법|국기법/, '국세기본법'],
    [/소득세법\s*시행령|소득령/, '소득세법 시행령'], [/소득세법\s*시행규칙/, '소득세법 시행규칙'], [/소득세법|소법/, '소득세법'],
    [/주택법/, '주택법'], [/부동산\s*거래신고/, '부동산 거래신고 등에 관한 법률']
  ];
  function lsiParseArticle_(s){
    s = String(s || '');
    var law = '';
    for (var i = 0; i < LSI_ART_LAW_ALIASES_.length; i++) if (LSI_ART_LAW_ALIASES_[i][0].test(s)) { law = LSI_ART_LAW_ALIASES_[i][1]; break; }
    var m = s.match(/(?:§|제)\s*(\d+)\s*(?:조)?\s*(의\s*\d+)?/);
    if (!m) return null;
    return { law: law, art: m[1] + (m[2] ? m[2].replace(/\s/g, '') : '') };
  }
  function lsiLawUrl_(law, art){
    var a = String(art || '').match(/^(\d+)(?:의(\d+))?$/);
    return 'https://www.law.go.kr/법령/' + encodeURIComponent(String(law).replace(/\s/g, '')) + (a ? '/' + encodeURIComponent('제' + a[1] + '조' + (a[2] ? '의' + a[2] : '')) : '');
  }
  function lsiSameArt_(s, law, art){ var p = lsiParseArticle_(s); return !!(p && p.art === art && (!p.law || p.law === law)); }

  (function lsiFillLawSelect_(){
    var sel = document.getElementById('lsiArtLaw');
    var names = LSI_BASE_LAWS_.slice();
    if (LSI_ENGINE_LAW_MAP_) Object.keys(LSI_ENGINE_LAW_MAP_).forEach(function(n){ if (names.indexOf(n) === -1) names.push(n); });
    sel.innerHTML = names.map(function(n){ return '<option>' + lsiEsc_(n) + '</option>'; }).join('');
  })();

  function lsiOpenArticle_(law, art){
    if (lsiActiveTab_ !== 'law') lsiShowTab_('law');
    var sel = document.getElementById('lsiArtLaw');
    if (law){ if (!Array.prototype.some.call(sel.options, function(o){ return o.value === law; })) sel.insertAdjacentHTML('beforeend', '<option>' + lsiEsc_(law) + '</option>'); sel.value = law; }
    document.getElementById('lsiArtNo').value = art || '';
    lsiShowArticle_();
    var box = document.getElementById('lsiArtResult');
    if (box && box.scrollIntoView) box.scrollIntoView({ block: 'nearest' });
  }

  function lsiShowArticle_(){
    var law = document.getElementById('lsiArtLaw').value;
    var art = String(document.getElementById('lsiArtNo').value || '').replace(/^제\s*/, '').replace(/\s*조\s*/, '').replace(/\s/g, '');
    var box = document.getElementById('lsiArtResult');
    if (!/^\d+(의\d+)?$/.test(art)){ box.innerHTML = '<div class="lsi-note">조문 번호를 숫자로 넣어 주세요(예: 24, 97의2).</div>'; return; }
    // 1) 이 조문을 해석한 서식 칸
    var cells = [];
    Object.keys(LSI_FORM_MAPS_).forEach(function(fno){
      (LSI_FORM_MAPS_[fno].칸 || []).forEach(function(k){ if ((k.근거조문 || []).some(function(s){ return lsiSameArt_(s, law, art); })) cells.push({ fno: fno, k: k }); });
    });
    // 2) 이 조문을 쓰는 조견표
    var refs = LSI_REF_TABLES_.filter(function(t){
      return (t.근거법령 || []).some(function(s){ return lsiSameArt_(s, law, art); }) || (t.행 || []).some(function(r){ return lsiSameArt_(r.근거조문, law, art); });
    });
    // 3) 이 조문을 쓰는 계산(EngineLawMap — 주석에 조문이 적힌 함수, 추정 포함)
    var fns = LSI_ENGINE_LAW_MAP_ ? ((LSI_ENGINE_LAW_MAP_[law] || {})[art] || []) : null;
    var place = function(f){ return /^taxcalc-engine:/.test(f) ? '세액계산 엔진' : /^taxcalc:/.test(f) ? '세액계산 화면' : '서버(AI 도구·사건처리)'; };
    var byPlace = {};
    (fns || []).forEach(function(f){ (byPlace[place(f)] = byPlace[place(f)] || []).push(f.replace(/^taxcalc(-engine)?:/, '')); });
    var artLabel = '제' + art.replace(/^(\d+)의(\d+)$/, '$1조의$2').replace(/^(\d+)$/, '$1조');
    box.innerHTML =
      '<div style="margin-bottom:6px;"><b>' + lsiEsc_(law + ' ' + artLabel) + '</b> <a href="' + lsiEsc_(lsiLawUrl_(law, art)) + '" target="_blank" rel="noopener">법제처 원문 ↗</a></div>' +
      '<div style="margin-bottom:6px;">📄 <b>이 조문을 해석한 서식 칸</b>: ' + (cells.length ? cells.map(function(c){ return '<button type="button" class="lsi-link" data-lsigoform="' + lsiEsc_(c.fno) + '">' + lsiEsc_((typeof printShortFormNo_ === 'function' ? printShortFormNo_(c.fno) : c.fno) + ' ' + (c.k.칸 || '') + ' ' + (c.k.이름 || '')) + '</button>'; }).join(', ') : '<span class="lsi-note">아직 없음(칸 해설을 만든 서식만 나옵니다)</span>') + '</div>' +
      '<div style="margin-bottom:6px;">📋 <b>이 조문을 쓰는 조견표</b>: ' + (refs.length ? refs.map(function(t){ return '<button type="button" class="lsi-link" data-lsigoref="' + lsiEsc_(t.번호) + '">' + lsiEsc_(t.번호 + ' ' + t.이름) + '</button>'; }).join(', ') : '<span class="lsi-note">아직 없음</span>') + '</div>' +
      '<div>🧮 <b>이 조문을 쓰는 계산</b>: ' + (fns === null ? '<span class="lsi-note">이 목록은 job.netax.kr/app 화면에서 보입니다.</span>'
        : fns.length ? Object.keys(byPlace).map(function(p){ return p + ' ' + byPlace[p].length + '곳'; }).join(' · ') + ' <details style="display:inline;"><summary class="lsi-note" style="display:inline; cursor:pointer;">(만드는 사람용 이름 보기)</summary><div class="lsi-note">' + Object.keys(byPlace).map(function(p){ return p + ': ' + byPlace[p].map(lsiEsc_).join(', '); }).join('<br>') + '<br>주석·문구에 이 조문이 적힌 함수입니다(추정 포함).</div></details>'
        : '<span class="lsi-note">계산 코드에 이 조문이 적힌 곳이 없습니다(그래도 계산에 안 쓰인다는 뜻은 아닙니다 — 주석에 조문 번호가 안 적혔을 수 있음).</span>') + '</div>';
    lsiWireLinks_(box);
  }
  document.getElementById('lsiArtGo').addEventListener('click', lsiShowArticle_);
  document.getElementById('lsiArtNo').addEventListener('keydown', function(e){ if (e.key === 'Enter') lsiShowArticle_(); });

  // ---------- 서로 잇는 단추(조문·조견표·서식 칸·계산기) ----------
  function lsiArtLinks_(list){
    return (list || []).map(function(s){
      var p = lsiParseArticle_(s);
      return p && p.law ? '<button type="button" class="lsi-link" data-lsiart="' + lsiEsc_(p.law + '|' + p.art) + '">' + lsiEsc_(s) + '</button>' : lsiEsc_(s);
    }).join(', ');
  }
  function lsiRefLinks_(list){
    return (list || []).map(function(s){
      var no = String(s).match(/^[12]부-\d+/);
      return no ? '<button type="button" class="lsi-link" data-lsigoref="' + lsiEsc_(no[0]) + '">' + lsiEsc_(s) + '</button>' : lsiEsc_(s);
    }).join(', ');
  }
  function lsiFormCellLinks_(list){
    return (list || []).map(function(s){
      var fno = Object.keys(LSI_FORM_MAPS_).filter(function(f){ return lsiFormKey_(f) && lsiFormKey_(f) === lsiFormKey_(s) && lsiLawOf_(f) === lsiLawOf_(s); })[0];
      return fno ? '<button type="button" class="lsi-link" data-lsigoform="' + lsiEsc_(fno) + '">' + lsiEsc_(s) + '</button>' : lsiEsc_(s);
    }).join(', ');
  }
  function lsiWireLinks_(root){

  // ---------- [2026.10.19] 조정대상지역(1부-01) — 주소로 찾기·시기별 보기 ----------

  var LSI_ADJ_SIDO_ = { '서울특별시': '서울', '서울시': '서울', '부산광역시': '부산', '대구광역시': '대구', '인천광역시': '인천', '광주광역시': '광주', '대전광역시': '대전', '울산광역시': '울산', '세종특별자치시': '세종', '경기도': '경기', '충청북도': '충북', '충청남도': '충남', '전라북도': '전북', '전북특별자치도': '전북', '전라남도': '전남', '경상북도': '경북', '경상남도': '경남' };
  function lsiAdjTok_(addr, t){ return new RegExp('(^|[\\s(,])' + t + '($|[\\s),])').test(addr) || new RegExp('(^|[\\s(,])[^\\s(,]*시' + t + '($|[\\s),])').test(addr); }

  // 시기별 보기 — 공고를 날짜 순으로 따라가며 그 시기에 지정돼 있던 줄을 모은다(책자 모양). 해제가 지정 줄과 같은 범위(시도·시·구, 일부 동 해제 아님)면 지운다.

      // [2026.10.19 서버 용량] 조견표 자료는 job.netax.kr/app 화면에만 들어 있다(예전 구글 주소 화면은 빈 값)

      lsiReviewBarHtml_(t.번호, t) +

        return '<tr><td class="w-mid">' + lsiEsc_(r.구분) + '</td><td class="nw">' + lsiEsc_(r.시작 || '') + '</td><td class="nw">' + lsiEsc_(r.끝 || '지금까지') + '</td><td class="w-wide">' + lsiFmtVal_(r.값) + '</td><td class="w-mid">' + lsiFmtVal_(r.조건 || '') + '</td>' +

      '<h4>시스템이 쓰는 곳</h4>' + tbl(['쓰는 곳', '이름', '보는 날', '켜짐'], (t.쓰는곳 || []).map(function(r){ return '<tr><td>' + lsiEsc_(r.곳) + '</td><td>' + lsiEsc_(r.이름) + '</td><td>' + lsiEsc_(r.보는날) + '</td><td>' + (r.켜짐 ? '<span title="' + lsiEsc_(r.켜짐설명 || '') + '">켜짐' + (r.켜짐설명 ? ' — ' + lsiEsc_(r.켜짐설명) : '') + '</span>' : '꺼짐(세무사님 확인 전)') + '</td></tr>'; })) +
      // [2026.10.19] 자료마다 더 적어 둔 것(책자 출처·책과 원문이 다른 곳·엔진과 다른 곳 등)도 그대로 보여 준다
      [['책자', '책자 출처(대조용)'], ['책과원문다름', '책과 법령 원문이 다른 곳(원문을 따름)'], ['엔진차이', '계산기와 다른 곳(고칠 거리)'], ['엔진과다른곳', '계산기와 다른 곳(고칠 거리)'], ['현재 지정 중', '지금 지정 중'], ['1부-01 지역 대응', '조정대상지역 표와 맞춰 보기'], ['참고용', '참고용']].map(function(kv){ var v = t[kv[0]]; if (v == null || (Array.isArray(v) && !v.length)) return ''; return '<h4>' + lsiEsc_(kv[1]) + '</h4>' + (Array.isArray(v) && typeof v[0] !== 'object' ? '<ul style="margin:4px 0 0 18px; font-size:12.5px;">' + v.map(function(x){ return '<li>' + lsiEsc_(x) + '</li>'; }).join('') + '</ul>' : '<div style="font-size:12.5px;">' + lsiFmtVal_(v) + '</div>'); }).join('') +
      ((t.확인필요 || []).length ? '<h4>확인 필요(공식 출처로 확인 못 함 — 표에 넣지 않음)</h4><ul style="margin:4px 0 0 18px; font-size:12.5px;">' + t.확인필요.map(function(x){ return '<li>' + lsiEsc_(x) + '</li>'; }).join('') + '</ul>' : '') +
      '</div>';
    lsiWireLinks_(box);
    lsiWireReview_(box, t.번호, t, function(){ lsiRenderRefs_(); });
    var adjGo = document.getElementById('lsiAdjGo');
    if (adjGo){
      var runAdj = function(){
        var r = lsiAdjAt_(t.공고구조, document.getElementById('lsiAdjAddr').value, document.getElementById('lsiAdjDate').value, document.getElementById('lsiAdjPurpose').value);
        var cls = r.판정 === '조정' ? 'warn' : r.판정 === '비조정' ? 'ok' : 'warn';
        document.getElementById('lsiAdjResult').innerHTML = '<span class="lsi-badge ' + cls + '" style="font-size:13px;">' + lsiEsc_(r.판정) + '</span> ' + lsiEsc_(r.이유) +
          (r.근거 && r.근거.length ? ' · 근거 공고: ' + r.근거.map(function(no){ var e = t.공고구조.filter(function(x){ return x.no === no; })[0]; return e && e.src ? '<a href="' + lsiEsc_(e.src) + '" target="_blank" rel="noopener">' + lsiEsc_(no) + '호 ↗</a>' : lsiEsc_(no); }).join(', ') : '');
      };
      adjGo.addEventListener('click', runAdj);
      document.getElementById('lsiAdjAddr').addEventListener('keydown', function(e){ if (e.key === 'Enter') runAdj(); });
    }
    if (box.scrollIntoView) box.scrollIntoView({ block: 'start' });
  }

<script>
  // ============================================================
  // [2026.10.19 법령 정비본] [📜 법령] 탭 — 법령 원문을 법령정보시스템 모양으로 보기·복사.
  //  세무사님 말씀(원문): "내가 처음에 구상했던 것은 법령파일을 md파일로 만들어서 문서작성할때 처럼 법령정보시스템 모양으로 보여주는 것이었다.
  //  그렇게 하면 원본문서를 다른 곳으로 복사하여 인용하기도 좋고, 보기도 좋겠다는 생각이었지."
  //  자료: 드라이브 법령정비본(서버 law_db_toc·law_lookup_article이 읽음 — 본문은 서버 코드에 없음). 판(시행일)을 고르면 그때 법령.
  //  [복사]는 조문 전체 또는 항 하나를 법령정보 모양 그대로(들여쓰기는 전각 공백) 클립보드에 넣는다. 로그인 전에는 서버를 부르지 않는다(열기 단추를 눌러야 읽음).
  // ============================================================
  var lsiDb_ = { laws: null, law: null, ver: null, toc: null, art: null };
  function lsiDbYmd_(s){ var m = String(s || '').match(/^(\d{4})(\d{2})(\d{2})$/); return m ? m[1] + '. ' + (+m[2]) + '. ' + (+m[3]) + '.' : String(s || ''); }
  function lsiDbCopy_(text){
    var done = function(){ if (typeof toast === 'function') toast('복사했습니다'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function(){ lsiDbCopyOld_(text); done(); });
    else { lsiDbCopyOld_(text); done(); }
  }
  function lsiDbCopyOld_(text){ var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(t); }
  function lsiDbOpen_(then){
    if (lsiDb_.laws){ if (then) then(); return; }
    document.getElementById('lsiDbBody').innerHTML = '<div class="lsi-note">법령 목록을 읽는 중…</div>';
    callGas('law_db_toc', {}).then(function(r){
      if (!r || r.error || !r.법령){ document.getElementById('lsiDbBody').innerHTML = '<div class="lsi-note">' + lsiEsc_((r && r.error) || '법령 정비본을 읽지 못했습니다.') + '</div>'; return; }
      lsiDb_.laws = r.법령;
      document.getElementById('lsiDbBar').innerHTML =
        '<select id="lsiDbLaw" aria-label="법령 고르기">' + r.법령.map(function(l){ return '<option value="' + lsiEsc_(l.키) + '">' + lsiEsc_(l.이름 + (l.범위 === '조회만' ? ' (지방세 — 조회만)' : '')) + '</option>'; }).join('') + '</select>' +
        '<select id="lsiDbVer" aria-label="판(시행일) 고르기"></select>' +
        '<span>제</span><input type="text" id="lsiDbNo" style="width:80px;" placeholder="예: 95, 97의2" aria-label="조문 번호"><span>조</span>' +
        '<button type="button" class="btn" id="lsiDbGo">보기</button>' +
        '<button type="button" class="ghost-btn" id="lsiDbPrev">◀ 앞 조</button><button type="button" class="ghost-btn" id="lsiDbNext">뒤 조 ▶</button>';
      document.getElementById('lsiDbLaw').addEventListener('change', function(){ lsiDbPickLaw_(this.value); });
      document.getElementById('lsiDbVer').addEventListener('change', function(){ lsiDb_.ver = this.value; lsiDbToc_(); });
      document.getElementById('lsiDbGo').addEventListener('click', function(){ lsiDbShow_(document.getElementById('lsiDbNo').value); });
      document.getElementById('lsiDbNo').addEventListener('keydown', function(e){ if (e.key === 'Enter') lsiDbShow_(this.value); });
      document.getElementById('lsiDbPrev').addEventListener('click', function(){ lsiDbStep_(-1); });
      document.getElementById('lsiDbNext').addEventListener('click', function(){ lsiDbStep_(1); });
      document.getElementById('lsiDbBody').innerHTML = '<div id="lsiDbTocBox"></div><div id="lsiDbDoc" class="lsidb-doc"></div>';
      lsiDbPickLaw_(r.법령[0].키, then);
    }).catch(function(e){ document.getElementById('lsiDbBody').innerHTML = '<div class="lsi-note">법령 목록을 읽지 못했습니다: ' + lsiEsc_(e && e.message || e) + '</div>'; });
  }
  function lsiDbPickLaw_(key, then){
    var l = lsiDb_.laws.filter(function(x){ return x.키 === key; })[0]; if (!l) return;
    lsiDb_.law = l; lsiDb_.ver = l.현행;
    document.getElementById('lsiDbLaw').value = key;
    document.getElementById('lsiDbVer').innerHTML = l.판.slice().reverse().map(function(p){
      return '<option value="' + lsiEsc_(p.판) + '"' + (p.판 === l.현행 ? ' selected' : '') + '>' + lsiEsc_(lsiDbYmd_(p.시행일) + ' 시행 (' + (p.상태 || '') + ', 제' + String(p.공포번호).replace(/^0+/, '') + '호)') + '</option>';
    }).join('');
    lsiDbToc_(then);
  }
  function lsiDbToc_(then){
    var box = document.getElementById('lsiDbTocBox'); box.innerHTML = '<div class="lsi-note">차례를 읽는 중…</div>';
    callGas('law_db_toc', { lawName: lsiDb_.law.키, ver: lsiDb_.ver }).then(function(r){
      if (!r || r.error || !r.조){ box.innerHTML = '<div class="lsi-note">' + lsiEsc_((r && r.error) || '차례를 읽지 못했습니다.') + '</div>'; return; }
      lsiDb_.toc = r.조;
      var heads = {}; (r.머리 || []).forEach(function(h){ heads[h.앞] = h.글; });
      box.innerHTML = '<details' + (lsiDb_.art ? '' : ' open') + '><summary class="lsi-note" style="cursor:pointer;">차례 (' + r.조.length + '개 조) — 누르면 그 조를 봅니다</summary><div class="lsidb-toc">' +
        r.조.map(function(a){ return (heads[a[0]] || []).map(function(h){ return '<div class="h">' + lsiEsc_(h) + '</div>'; }).join('') +
          '<button type="button" data-lsidbart="' + lsiEsc_(a[0]) + '">제' + lsiEsc_(a[0].replace(/^(\d+)의(\d+)$/, '$1조의$2').replace(/^(\d+)$/, '$1조')) + ' ' + lsiEsc_(a[1] || '') + '</button>'; }).join('') + '</div></details>';
      box.querySelectorAll('[data-lsidbart]').forEach(function(b){ b.addEventListener('click', function(){ lsiDbShow_(b.dataset.lsidbart); }); });
      if (then) then(); else if (lsiDb_.art) lsiDbShow_(lsiDb_.art);
    }).catch(function(e){ box.innerHTML = '<div class="lsi-note">차례를 읽지 못했습니다: ' + lsiEsc_(e && e.message || e) + '</div>'; });
  }
  function lsiDbStep_(d){
    if (!lsiDb_.toc || !lsiDb_.art) return;
    var i = lsiDb_.toc.map(function(a){ return a[0]; }).indexOf(lsiDb_.art), n = lsiDb_.toc[i + d];
    if (n) lsiDbShow_(n[0]);
  }
  // 한 줄의 들여쓰기 단계: 항(①)·본문 0, 호(1.) 1, 목(가.) 2, 세목(1)) 3
  function lsiDbLevel_(s, inHo){ return /^\s*\d+\)/.test(s) ? 3 : /^\s*[가-하]\.\s?/.test(s) ? 2 : inHo ? 1 : 0; }
  // 글 덩어리(항내용·호) → HTML + 복사용 글. 산식 그림 표시·법제처 글자상자·산식 보정을 법령정보 모양으로.
  function lsiDbBlock_(text, inHo){
    var lines = String(text || '').split('\n'), html = '', plain = [], i, lvl0 = inHo ? 1 : 0;
    for (i = 0; i < lines.length; i++){
      var l = lines[i], m = l.match(/^\s*〔산식 그림 img(\d+)〕\s*$/);
      if (!m){ if (!l.trim()) continue; var lv = i === 0 ? lvl0 : lsiDbLevel_(l, inHo); html += '<div class="lsidb-l' + lv + '">' + lsiEsc_(l.trim()) + '</div>'; plain.push(new Array(lv + 1).join('　') + l.trim()); continue; }
      var id = m[1], fx = [], box = [], isBox = function(s){ return s !== undefined && /^[│┌└├┬┴┼─┐┘┤\s]/.test(s) && /[│┌└─]/.test(s); };
      if (/^〔산식 보정/.test(lines[i + 1] || '')){ fx.push(lines[++i]); while (i + 1 < lines.length && lines[i + 1].trim() && !isBox(lines[i + 1]) && !/^\s*〔산식 그림/.test(lines[i + 1]) && !(lines[i + 1].trim().length <= 20 && isBox(lines[i + 2]))) fx.push(lines[++i]); }
      while (i + 1 < lines.length && (isBox(lines[i + 1]) || (lines[i + 1].trim().length <= 20 && isBox(lines[i + 2])))) box.push(lines[++i]);
      var url = 'https://www.law.go.kr/LSW/flDownload.do?flSeq=' + id;
      if (fx.length){ html += '<div class="lsidb-fx"><div class="lsi-note">' + lsiEsc_(fx[0].replace(/^〔|〕$/g, '')) + '</div>' + fx.slice(1).map(function(s){ return '<div>' + lsiEsc_(s.trim()) + '</div>'; }).join('') + '</div>'; plain.push.apply(plain, fx.slice(1).map(function(s){ return s.trim(); })); }
      // 화면에는 법제처 원본 그림을 그대로(글자상자는 글꼴 따라 줄이 어긋남), 글자상자는 접어 두고 복사에는 글을 넣는다
      html += '<div><img class="lsidb-img" loading="lazy" src="' + lsiEsc_(url) + '" alt="산식 그림 img' + id + '"></div>';
      if (box.length){ html += '<details class="lsi-note"><summary style="cursor:pointer;">글로 보기(법제처 글자상자 — 복사에 들어감)</summary><div class="lsidb-box">' + lsiEsc_(box.join('\n')) + '</div></details>'; plain.push.apply(plain, box); }
      else if (!fx.length){ html += '<div class="lsidb-wait">[그림 산식 — 판독 대기] 글로 옮긴 산식이 아직 없습니다.</div>'; plain.push('[그림 산식 — 판독 대기] ' + url); }
    }
    return { html: html, plain: plain.join('\n') };
  }
  function lsiDbShow_(no){
    var art = String(no || '').replace(/^제\s*/, '').replace(/\s*조\s*/, '').replace(/\s/g, '');
    var doc = document.getElementById('lsiDbDoc');
    if (!/^\d+(의\d+)?$/.test(art)){ doc.innerHTML = '<div class="lsi-note">조문 번호를 숫자로 넣어 주세요(예: 95, 97의2).</div>'; return; }
    lsiDb_.art = art; document.getElementById('lsiDbNo').value = art;
    document.querySelectorAll('#lsiDbTocBox [data-lsidbart]').forEach(function(b){ b.classList.toggle('on', b.dataset.lsidbart === art); });
    var l = lsiDb_.law, p = l.판.filter(function(x){ return x.판 === lsiDb_.ver; })[0];
    doc.innerHTML = '<div class="lsi-note">조문을 읽는 중…</div>';
    callGas('law_lookup_article', { lawName: l.이름, articleNo: art, baseDate: p && p.판 !== l.현행 ? p.시행일 : '' }).then(function(r){
      if (!r || r.error || !r.조문){ doc.innerHTML = '<div class="lsi-note">' + lsiEsc_((r && r.error) || '조문을 읽지 못했습니다.') + '</div>'; return; }
      var head = '<div class="lsidb-head"><b>' + lsiEsc_(r.법령명) + '</b> [시행 ' + lsiEsc_(lsiDbYmd_(r.시행일자)) + ']' + (p ? ' [제' + lsiEsc_(String(p.공포번호).replace(/^0+/, '')) + '호, ' + lsiEsc_(lsiDbYmd_(p.공포일)) + ', ' + lsiEsc_(p.구분 || '') + ']' : '') +
        (r.주의 ? '<br>⚠ ' + lsiEsc_(r.주의) : '') + (r.개정확인 ? '<br>' + lsiEsc_(r.개정확인) : '') + (r.시행예정개정 ? '<br>⏳ ' + lsiEsc_(r.시행예정개정) : '') +
        '<br><span class="lsi-note">' + lsiEsc_(r.출처 || '') + (r.원문링크 ? ' · <a href="' + lsiEsc_(r.원문링크) + '" target="_blank" rel="noopener">법제처에서 보기 ↗</a>' : '') + '</span></div>';
      var copies = [];
      var body = r.조문.map(function(u){
        var lines0 = String(u.조문내용 || '').split('\n'), tm = lines0[0].match(/^(제\d+조(?:의\d+)?\([^)]*\))\s*(.*)$/);
        var title = tm ? tm[1] : lines0[0], rest = (tm ? [tm[2]] : []).concat(lines0.slice(1)).join('\n');
        var parts = [], all = [title];
        var add = function(b){ if (!b.html) return; var k = copies.push(b.plain) - 1; parts.push('<div class="lsidb-g">' + b.html + '<button type="button" class="lsidb-copy" data-lsidbcopy="' + k + '" title="이 부분만 복사">복사</button></div>'); all.push(b.plain); };
        add(lsiDbBlock_(rest, false));
        (u.항 || []).forEach(function(h){
          var b = lsiDbBlock_(h.항내용, false), hos = (h.호 || []).map(function(o){ return lsiDbBlock_(o, true); });
          add({ html: b.html + hos.map(function(x){ return x.html; }).join(''), plain: [b.plain].concat(hos.map(function(x){ return x.plain; })).filter(Boolean).join('\n') });
        });
        if (u.참고){ parts.push('<div class="lsidb-ref">' + lsiEsc_(u.참고).replace(/\n/g, '<br>') + '</div>'); all.push(u.참고); }
        var bad = u['검증필요_코드에서옮김(근거 아님)'] || [], again = (u.산식보정 || []).filter(function(x){ return /^다시/.test(x.상태 || ''); });
        if (bad.length || again.length) parts.push('<div class="lsi-note">※ 근거로 쓰지 않는 산식: ' + bad.concat(again).map(function(x){ return 'img' + lsiEsc_(x.그림[0]) + ' — ' + lsiEsc_(x.상태); }).join(' / ') + '</div>');
        var k = copies.push(all.join('\n')) - 1;
        return '<div class="lsidb-art"><div class="lsidb-t">' + lsiEsc_(title) + ' <button type="button" class="lsidb-copy" data-lsidbcopy="' + k + '" title="조문 전체 복사">조문 복사</button></div>' + parts.join('') + '</div>';
      }).join('');
      doc.innerHTML = head + body;
      doc.querySelectorAll('[data-lsidbcopy]').forEach(function(b){ b.addEventListener('click', function(){ lsiDbCopy_(copies[+b.dataset.lsidbcopy]); }); });
    }).catch(function(e){ doc.innerHTML = '<div class="lsi-note">조문을 읽지 못했습니다: ' + lsiEsc_(e && e.message || e) + '</div>'; });
  }
  // 다른 곳(조문으로 찾아보기 등)에서 "이 조문 원문"으로 열기
  function lsiDbJump_(lawName, art){
    var key = String(lawName || '').replace(/\s/g, '');
    lsiDbOpen_(function(){
      var has = lsiDb_.laws.some(function(l){ return l.키 === key; });
      if (!has){ document.getElementById('lsiDbDoc').innerHTML = '<div class="lsi-note">' + lsiEsc_(lawName) + '은(는) 법령 정비본에 없습니다(법제처 원문 링크를 이용해 주세요).</div>'; return; }
      lsiDb_.art = art;
      // 다른 곳에서 넘어오면 늘 현행판으로(앞서 골라 둔 옛 판·예정판이 남지 않게)
      if (lsiDb_.law && lsiDb_.law.키 === key && lsiDb_.toc && lsiDb_.ver === lsiDb_.law.현행) lsiDbShow_(art); else lsiDbPickLaw_(key, function(){ lsiDbShow_(art); });
    });
    var c = document.getElementById('lsiDbCard'); if (c && c.scrollIntoView) c.scrollIntoView({ block: 'start' });
  }
  document.getElementById('lsiDbOpen').addEventListener('click', function(){ lsiDbOpen_(); });
  // "조문으로 찾아보기" 결과 아래에 원문 보기 단추를 붙인다(그쪽 코드는 건드리지 않음 — 그쪽 보기가 먼저 그린 뒤에 덧붙임)
  document.getElementById('lsiArtGo').addEventListener('click', function(){
    var law = document.getElementById('lsiArtLaw').value, art = String(document.getElementById('lsiArtNo').value || '').replace(/^제\s*/, '').replace(/\s*조\s*/, '').replace(/\s/g, '');
    var box = document.getElementById('lsiArtResult');
    if (!/^\d+(의\d+)?$/.test(art) || !box) return;
    var b = document.createElement('button'); b.type = 'button'; b.className = 'lsi-link'; b.textContent = '📖 이 조문 원문 보기(법령정보 모양·복사)';
    b.addEventListener('click', function(){ lsiDbJump_(law, art); });
    var d = document.createElement('div'); d.style.marginTop = '6px'; d.appendChild(b); box.appendChild(d);
  });
</script>
