<script>
  // ============================================================
  // [2026.10.08] job 구조 전환 — google.script.run 대리(브리지)
  // ------------------------------------------------------------
  // 이 앱은 원래 구글 앱스스크립트가 만든 틀(iframe) 안에서만 돌았고, 서버 호출은 그 틀이 제공하는
  // google.script.run으로 했다. 그 틀은 마이크·화면캡처를 막고(허용목록에 없음) 휴대폰 앱 설치·
  // 공유하기·확장프로그램 연결도 막아서, 화면을 job.netax.kr에서 직접 띄우는 방식으로 바꿨다
  // (gs-backend는 데이터 처리만). 그렇게 띄우면 google.script.run이 없으므로, 같은 모양의 대리
  // 객체를 만들어 서버(doPost의 __manage 입구 → manageApp_dispatchHttp_)로 보낸다. 화면 쪽 코드는
  // 그대로 google.script.run.withSuccessHandler(...).manageApp_xxx(...)를 쓰면 된다.
  // 구글 틀 안에서 열렸을 때(예전 주소)는 진짜 google.script.run이 있으므로 아무것도 하지 않는다.
  // ============================================================
  (function(){
    if (window.google && window.google.script && window.google.script.run) return;
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbyFbvXiV6rSzCvhtc_T2WrzNF5ZxhOFWtSSsgzSavzPbjv4LBGhjXhu_Q2_8m-PDj8s/exec';
    window.NX_STANDALONE = true; // 구글 틀 밖(job.netax.kr)에서 직접 열렸다는 표시

    // 구글 웹앱 응답은 ①실행 → ②결과 받아가기 두 단계인데 ②가 자주 실패한다(오류 화면 HTML이 옴 —
    // Code.js manageApp_dispatchHttpOnce_ 설명 참고). 그때도 서버 실행은 끝나 있으므로, 같은 요청번호(rid)로
    // 다시 묻는다 — 서버는 다시 실행하지 않고 기억해둔 결과를 준다(저장이 두 번 되지 않음).
    var RETRY_DELAYS = [1000, 2000, 3000, 4000, 5000, 6000, 6000, 6000];
    function newRid(){ return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); }
    // 묶어 보내기 — 거의 동시에(40ms 안에) 나가는 호출을 하나의 요청으로 묶는다. 대시보드처럼 8개를 따로
    // 보내면 구글 서버가 각각 22~31초 걸리고 결과 받기도 대부분 실패했다(2026-10-08 실측). 서버는 한 번
    // 실행 안에서 차례로 처리해 결과를 배열로 돌려준다(Code.js manageApp_dispatchHttpBatch_).
    var BATCH_WAIT_MS = 40, BATCH_MAX = 12;
    // [2026.10.17] 사건 목록·고객 목록(여러 화면이 기다리는 조회)과 사건처리(한 번에 수십 초 걸릴 수 있음)는 묶지 않고 따로
    // 보낸다 — 서버는 묶음 안을 차례로 처리하므로, 사이드바가 사건처리·예약목록과 같이 묶으면 사건 목록도 가장 느린 것이
    // 끝날 때까지 못 받았다(2026-10-16 1:1 점검에서 "불러오는 중" 45초 이상).
    var SOLO_ACTIONS = { work_get_cases: 1, client_get_clients: 1, case_proc: 1 };
    // 서버가 "앞 요청이 아직 처리 중"(__pending)이라고 답하면 같은 요청번호로 계속 묻는다 — 다시 실행되지 않으므로 안전.
    // 그래도 4분이 지나면(서버 실행이 6분 한도로 죽었을 수 있음) 포기한다.
    var PENDING_GIVE_UP_MS = 240000, PENDING_DELAY_MS = 1000;
    // [2026.10.17] 관리 서버 — 화면을 열 때마다 기다리는 조회 4가지는 작은 구글 프로젝트(NETAX_Job/gs-light)에 먼저 묻는다.
    // job 서버는 코드가 3MB라 빈 호출도 3~5초, 무거운 일과 겹치면 10~30초씩 튀었다(작은 프로젝트는 1.5초 안팎, 2026-10-17 측정).
    // 관리 서버가 오류·이상한 답·12초 무응답이면 같은 요청을 그대로 job 서버로 보낸다(조회라 두 번 해도 안전) — 그래서 관리
    // 서버가 멈춰도 예전처럼 동작한다. 로그인 만료 판단도 언제나 job 서버가 한다(관리 서버는 확인 못 하면 오류로만 답함).
    // 화면을 열 때 조회마다 한 번, 뒤에서 job 서버 답과 똑같은지 비교해 다르면 오류 기록에 남기고 이 화면에서는 관리 서버를 더
    // 쓰지 않는다(LIGHT_SHADOW_CHECK). 관리 서버 코드는 📥로 바뀌지 않고 PC에서 clasp로만 올라가므로(gs-light/README), Code.js의
    // 조회 함수가 바뀌었는데 관리 서버를 안 올렸어도 이 비교가 잡아 job 서버로 돌아간다 — 끄지 말 것.
    var LIGHT_URL = 'https://script.google.com/macros/s/AKfycbxnruhEVQURJupt1eM7K8Iyn_EDDwSJ6mcmdvQhGqxF7rxB1VLxZkxJMi5jAYuj8e9woQ/exec';
    var LIGHT_ACTIONS = { work_get_cases: 1, client_get_clients: 1, client_get_consult_logs: 1, list_bookings: 1 };
    var LIGHT_TIMEOUT_MS = 12000, LIGHT_SHADOW_CHECK = true;
    var lightOff = false, lightShadowDone = {}, lightFails = 0;
    function lightLog(message, detail){
      try { console.warn('[관리 서버] ' + message); } catch (e) {}
      try { if (typeof nxLogBug_ === 'function') nxLogBug_({ kind: 'light', where: '관리 서버', message: message, detail: String(detail || '').slice(0, 1000) }); } catch (e) {}
    }
    function viaLight(item){
      var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, LIGHT_TIMEOUT_MS) : null;
      var body = JSON.stringify({ __manageBatch: [{ fn: item.fn, args: item.args }] });
      return fetch(LIGHT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body, signal: ctrl ? ctrl.signal : undefined })
        .then(function(res){ return res.text(); })
        .then(function(text){
          clearTimeout(timer);
          var data = null; try { data = JSON.parse(text); } catch (e) {}
          var r = data && Array.isArray(data.__results) ? data.__results[0] : null;
          if (!r || !('__result' in r) || r.error || (r.__result && r.__result.error)) throw new Error((r && r.error) || (r && r.__result && r.__result.error) || '관리 서버 응답 이상');
          return r.__result;
        }, function(err){ clearTimeout(timer); throw err; });
    }
    function shadowCheck(item, lightResult){
      var action = item.args[0];
      if (!LIGHT_SHADOW_CHECK || lightShadowDone[action]) return;
      lightShadowDone[action] = true;
      var a = JSON.stringify(lightResult);
      send([{ fn: item.fn, args: item.args, resolve: function(mainResult){
        var b = JSON.stringify(mainResult);
        if (a !== b){
          lightOff = true;
          lightLog(action + ' 결과가 job 서버와 다름 — 이 화면에서는 관리 서버를 끔', '관리 ' + a.length + '자 / job ' + b.length + '자, 처음 다른 곳: ' + (function(){ for (var i = 0; i < Math.min(a.length, b.length); i++) if (a[i] !== b[i]) return i + ' [' + a.slice(Math.max(0, i - 40), i + 40) + '] vs [' + b.slice(Math.max(0, i - 40), i + 40) + ']'; return '길이만 다름'; })());
        }
      }, reject: function(){} }]);
    }
    var queue = [], flushTimer = null;
    function post(fnName, args){
      return new Promise(function(resolve, reject){
        if (!lightOff && fnName === 'manageApp_call' && args && LIGHT_ACTIONS[args[0]]){
          var item = { fn: fnName, args: args, resolve: resolve, reject: reject };
          viaLight(item).then(function(r){ lightFails = 0; resolve(r); shadowCheck(item, r); }, function(err){
            // 두 번 연달아 실패하면 이 화면에서는 관리 서버를 끈다(설치 전·장애 중에 매번 헛걸음하지 않게)
            if (++lightFails >= 2) lightOff = true;
            lightLog(args[0] + ' 관리 서버 실패 → job 서버로', err && err.message);
            send([item]);
          });
          return;
        }
        if (fnName === 'manageApp_call' && args && SOLO_ACTIONS[args[0]]){
          send([{ fn: fnName, args: args, resolve: resolve, reject: reject }]);
          return;
        }
        queue.push({ fn: fnName, args: args, resolve: resolve, reject: reject });
        if (queue.length >= BATCH_MAX){ flush(); return; }
        if (!flushTimer) flushTimer = setTimeout(flush, BATCH_WAIT_MS);
      });
    }
    function flush(){
      clearTimeout(flushTimer); flushTimer = null;
      var items = queue.splice(0, queue.length);
      if (!items.length) return;
      send(items);
    }
    function send(items){
      var rid = newRid(), startedAt = Date.now();
      var body = JSON.stringify({ __manageBatch: items.map(function(it){ return { fn: it.fn, args: it.args }; }), __rid: rid });
      var failAll = function(err){ items.forEach(function(it){ it.reject(err); }); };
      var attempt = function(n){
        // 결과 받기 단계가 멈추면 15~30초 뒤에야 실패가 오므로, 25초에서 끊고 같은 요청번호로 다시 묻는다
        // (서버는 항목별로 기억해둔 결과를 쓰고, 묶음이 아직 실행 중이면 끝날 때까지 기다렸다가 준다).
        var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 25000) : null;
        var retry = function(){
          return new Promise(function(r){ setTimeout(r, RETRY_DELAYS[n]); }).then(function(){ return attempt(n + 1); });
        };
        return fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body, signal: ctrl ? ctrl.signal : undefined })
          .then(function(res){ return res.text(); })
          .then(function(text){ clearTimeout(timer); return text; }, function(err){ clearTimeout(timer); throw err; })
          .then(function(text){
            var data = null;
            try{ data = JSON.parse(text); }catch(e){ data = null; }
            if (data && data.__pending){
              // 앞서 보낸 같은 요청이 서버에서 아직 실행 중 — 재시도 횟수를 쓰지 않고 다시 묻는다.
              if (Date.now() - startedAt < PENDING_GIVE_UP_MS){
                return new Promise(function(r){ setTimeout(r, PENDING_DELAY_MS); }).then(function(){ return attempt(n); });
              }
              throw new Error('서버가 4분 넘게 처리 중입니다. 화면을 새로고침해 결과가 반영됐는지 확인하세요.');
            }
            if (!data || !Array.isArray(data.__results)){
              if (data && data.error) throw new Error(data.error);
              if (n < RETRY_DELAYS.length) return retry();
              throw new Error('서버 응답을 받지 못했습니다(구글 서버가 일시적으로 불안정합니다). 잠시 후 다시 시도하세요. 저장 작업이었다면 화면을 새로고침해 반영됐는지 먼저 확인하세요.');
            }
            items.forEach(function(it, i){
              var r = data.__results[i];
              if (r && r.error && !('__result' in r)) it.reject(new Error(r.error));
              else it.resolve(r ? r.__result : undefined);
            });
          }, function(err){
            // 요청이 서버에 닿기 전에 끊겼거나 25초가 지남 — 같은 요청번호로 다시 보내도 안전하다.
            if (n < RETRY_DELAYS.length) return retry();
            throw err;
          });
      };
      attempt(0).catch(failAll);
    }

    function runner(){
      var onOk = function(){}, onFail = function(err){ console.error(err); };
      var proxy = new Proxy({}, { get: function(t, key){
        if (key === 'withSuccessHandler') return function(f){ onOk = f; return proxy; };
        if (key === 'withFailureHandler') return function(f){ onFail = f; return proxy; };
        if (key === 'withUserObject') return function(){ return proxy; };
        return function(){
          var args = Array.prototype.slice.call(arguments);
          post(String(key), args).then(function(r){ onOk(r); }, function(e){ onFail(e); });
        };
      }});
      return proxy;
    }

    window.google = window.google || {};
    window.google.script = { get run(){ return runner(); } };
  })();
</script>
