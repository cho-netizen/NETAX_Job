  <!-- [2026.10.08] 위 base target="_top" 때문에, 주소가 "#"·빈칸인 링크나 처리 안 된 폼이 눌리면 창 전체가
       구글 틀 내부 주소(…googleusercontent.com/userCodeAppPanel)로 넘어가 버린다(앱 창 위에 그 주소 줄이 뜸).
       같은 문서를 가리키는 링크·폼은 이동만 막는다(각 버튼의 원래 동작은 그대로 실행됨). -->
  <script>
  (function(){
    function sameDoc(u){
      try{ var a = new URL(u, location.href); return a.origin === location.origin && a.pathname === location.pathname; }catch(e){ return false; }
    }
    document.addEventListener('click', function(e){
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a) return;
      var t = (a.getAttribute('target') || '').toLowerCase();
      if (t === '_blank') { if (a.getAttribute('href') === '#' ) e.preventDefault(); return; }
      if (!sameDoc(a.href)) return;
      e.preventDefault();
      // 사용설명서 목차(#help-…)처럼 화면 안 항목을 가리키는 링크는 그 항목으로 스크롤만 한다.
      var id = decodeURIComponent((a.hash || '').slice(1));
      var el = id && document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, true);
    document.addEventListener('submit', function(e){
      var f = e.target;
      if (f && f.tagName === 'FORM' && sameDoc(f.action || location.href)) e.preventDefault();
    }, true);
  })();
  </script>
  <!-- [2026.10.08] job.netax.kr에서 직접 열릴 때 google.script.run 대리(구글 틀 안에서는 아무 일도 안 함) -->

      <button type="button" id="nxHandMemoBtn" title="필기메모 — 손글씨 메모 화면" onclick="goToView_('memo-hand')">✏</button>
      <button type="button" id="nxPresentBtn" title="고객에게 보여주기 — 메뉴·넥스 칸을 숨기고 이 화면만 크게"
        onclick="document.body.classList.toggle('nx-present')">🖥</button>
    </main>

    <aside id="sideAI">
      <div id="sideAIInner">
        <?!= include_('manage/aichat') ?>
      </div>
    </aside>
  </div>

  <!-- [2026.10.16] 커버화면은 탭 버튼 없이 밀기로만 화면을 바꾼다(세무사님) — 녹음 중일 때만 작은 표시(누르면 녹음 화면) -->
  <button type="button" id="nxCmRecBadge" hidden>● 녹음 중</button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // [2026.09] 작성관리(report-writer)는 더 이상 work.netax.kr을 새 창으로 여는 링크가 아니라
    // gs-backend/manage/reportwriter.html로 완전히 이식된 네이티브 화면이다(data-view="reportwriter",
    // 다른 화면들과 동일하게 script.html의 showView()가 처리) — 예전에 여기 있던
    // REPORT_WRITER_URL/window.open 코드는 삭제했다.

    // 좌측 메뉴·우측 AI 패널 — 처음엔 hover(마우스가 스치기만 해도 펴짐)로 만들었는데,
    // 인식 범위가 너무 넓어서 화면 데이터에 마우스가 가까이 가기만 해도 패널이 펴져
    // 가려버리는 문제가 실사용 중 확인됐다("커서가 왼쪽 거의 끝까지 가야 열려야 하는데
    // 너무 빨리 열린다"). 그래서 hover는 완전히 없애고 "눌러야 펴지고, 바깥을 누르면
    // 접히는" 방식으로 바꿨다 — 우연히 스쳐서 펴지는 일 자체가 없다.
    // [패치] 좁은 화면(작은 창·폰)에서 둘 다 펴지면 가운데 작업화면이 거의 안 남을 정도로
    // 눌려서, 그 안의 스크롤바 위치까지 이상해 보이는 문제가 있었다 — 하나를 펴면 다른
    // 하나는 자동으로 접어서, 좁은 화면에서도 항상 하나만 펴지게 한다(넓은 화면에서 굳이
    // 둘 다 펴도 문제없지만, 일관되게 하나로 통일해도 불편함이 없어 그냥 항상 이렇게 함).
    var SIDE_PANEL_IDS_ = ['sideMenu', 'sideAI'];
    SIDE_PANEL_IDS_.forEach(function(id){
      var el = document.getElementById(id);
      el.addEventListener('click', function(e){
        if (!el.classList.contains('expanded')){
          SIDE_PANEL_IDS_.forEach(function(otherId){
            if (otherId === 'sideAI' && nxSidePinned_()) return; // 📌 고정된 사이드바는 접지 않음(2026-10-16)
            if (otherId === 'sideMenu') return; // [2026.11.01] 세무사님 "자동숨김 … 수동숨김 수동펼침" → 그 뒤 "나안": 메뉴는 고정(NETAX 줄)·저절로 숨김(덮어 보이기)으로 스스로 접고 펴므로 AI 창이 건드리지 않는다
            if (otherId !== id) document.getElementById(otherId).classList.remove('expanded');
          });
          if (id === 'sideMenu'){ nxSideMenuPeek_(true); e.stopPropagation(); return; } // 손으로 띠를 누르면(태블릿·휴대폰) 덮어서 나타남
          el.classList.add('expanded');
          e.stopPropagation(); // 펴지는 이 클릭이 바로 아래 document 리스너로 번져서 즉시 다시 접히지 않도록
        }
      });
    });
    // [2026.11.01] 세무사님 "넓은 모니터에서는 굳이 접을 필요가 없어서 … 저절로 숨겨졌다가 마우스를 가져가면 나타나게" → "나안으로 가자"
    // 평소엔 왼쪽 끝 얇은 띠만 남고, 띠에 마우스를 0.3초 대면 가운데 화면 위에 덮어 나타남(화면을 밀지 않음).
    // 메뉴를 고르면 바로, 마우스를 빼면 0.5초 뒤 숨는다. NETAX 줄을 누르면 고정(늘 펼쳐 자리 차지) ↔ 풀기, 고른 것을 기억.
    function nxSideMenuApply_(){
      var m = document.getElementById('sideMenu'), t = document.getElementById('sideMenuToggle');
      var pinned = m.classList.contains('pinned'), open = pinned || m.classList.contains('peek');
      m.classList.toggle('expanded', open);
      if (open && window.nxSideMenuFit_) window.nxSideMenuFit_(); // 펼친 다음에 잰다(먼저 재면 숨은 화면에서 0 → 기본 폭 190으로 남음)
      setTimeout(nxSideMenuScrollBtns_, 0); // 위·아래 단추 보임 다시 맞춤
      if (t){ t.textContent = pinned ? '◀' : '▶'; t.title = pinned ? '고정 풀기(저절로 숨김)' : '늘 펼쳐 두기(고정)'; }
    }
    function nxSideMenuPeek_(on){
      var m = document.getElementById('sideMenu');
      clearTimeout(window.nxSideMenuPeekT_);
      if (m.classList.contains('pinned')) return;
      m.classList.toggle('peek', !!on);
      nxSideMenuApply_();
    }
    function nxSideMenuSetPin_(pin){
      var m = document.getElementById('sideMenu');
      clearTimeout(window.nxSideMenuPeekT_);
      m.classList.toggle('pinned', !!pin);
      m.classList.remove('peek');
      nxSideMenuApply_();
      try { localStorage.setItem('nx_menu_pin', pin ? '1' : '0'); } catch (er) {}
    }
    (function(){
      var m = document.getElementById('sideMenu');
      m.addEventListener('mouseenter', function(){
        clearTimeout(window.nxSideMenuPeekT_);
        if (m.classList.contains('pinned') || m.classList.contains('peek')) return;
        window.nxSideMenuPeekT_ = setTimeout(function(){ nxSideMenuPeek_(true); }, 300); // 스쳐 지나가면 열리지 않게
      });
      m.addEventListener('mouseleave', function(){
        clearTimeout(window.nxSideMenuPeekT_);
        if (!m.classList.contains('peek')) return;
        window.nxSideMenuPeekT_ = setTimeout(function(){ nxSideMenuPeek_(false); }, 500);
      });
      // [2026.11.01] 기본서(W3C 2.1.1) — 키보드(Tab)로 메뉴에 들어오면 마우스를 댄 것처럼 펼치고, 메뉴 밖으로 나가면 접는다
      // 접힌 띠는 메뉴 줄이 숨어 있어 Tab이 닿지 않는다 — 띠 자체를 한 칸으로 두어 Tab이 닿으면 펼치고, 다음 Tab부터 메뉴 줄로 간다
      m.setAttribute('tabindex', '0'); m.setAttribute('aria-label', '메뉴');
      m.addEventListener('focusin', function(){ if (!m.classList.contains('pinned')) nxSideMenuPeek_(true); });
      m.addEventListener('focusout', function(e){ if (!m.contains(e.relatedTarget) && m.classList.contains('peek')) nxSideMenuPeek_(false); });
    })();
    // [2026.11.01] 세무사님 "우측사이드바 열림을 좌측메뉴바 열림과 똑같이" — 오른쪽 넥스 창도 띠에 0.3초 대면 덮어 나타나고, 빼면 0.5초 뒤 숨는다(📌 고정이면 그대로).
    // 쓰는 중엔 숨기지 않는다: 입력칸에 글을 쓰고 있거나(포커스), 넥스 창이 띄운 고르기 메뉴·사건 고르기·설정 창이 열려 있을 때 — 바깥을 누르면 숨음.
    (function(){
      var a = document.getElementById('sideAI');
      var busy = function(){
        var f = document.activeElement;
        if (a.matches(':hover') || (a.contains(f) && f.matches('textarea, input, select, [contenteditable="true"]'))) return true; // 단추를 누른 뒤 남은 포커스는 쓰는 중으로 치지 않음
        if (window.nxAiMenuEl && document.body.contains(window.nxAiMenuEl)) return true;
        return ['nxAiCaseOverlay', 'nxAiSettingsOverlay'].some(function(id){ var o = document.getElementById(id); return o && !o.hidden; });
      };
      a.addEventListener('mouseenter', function(){
        clearTimeout(window.nxSideAIPeekT_);
        if (a.classList.contains('expanded') || a.classList.contains('nxai-away')) return;
        window.nxSideAIPeekT_ = setTimeout(function(){ a.classList.add('expanded'); }, 300);
      });
      a.addEventListener('mouseleave', function(){
        clearTimeout(window.nxSideAIPeekT_);
        if (!a.classList.contains('expanded') || nxSidePinned_()) return;
        window.nxSideAIPeekT_ = setTimeout(function(){ if (!busy() && !nxSidePinned_()) a.classList.remove('expanded'); }, 500);
      });
    })();
    // NETAX 줄 어디를 눌러도 고정 ↔ 풀기
    document.querySelector('#sideMenu .menu-brand').addEventListener('click', function(e){
      e.stopPropagation();
      nxSideMenuSetPin_(!document.getElementById('sideMenu').classList.contains('pinned'));
    });
    // [2026.11.01] 메뉴 위·아래 단추 — 더 올라갈(내려갈) 곳이 있을 때만 보이고, 누르면 보이는 높이의 70%씩 밀린다
    function nxSideMenuScrollBtns_(){
      var inner = document.getElementById('sideMenuInner'), up = document.getElementById('sideMenuUp'), dn = document.getElementById('sideMenuDown');
      if (!inner || !up) return;
      up.classList.toggle('show', inner.scrollTop > 2);
      dn.classList.toggle('show', inner.scrollTop + inner.clientHeight < inner.scrollHeight - 2);
    }
    ['sideMenuUp', 'sideMenuDown'].forEach(function(id){
      document.getElementById(id).addEventListener('click', function(e){
        e.stopPropagation();
        var inner = document.getElementById('sideMenuInner');
        inner.scrollBy({ top: (id === 'sideMenuUp' ? -1 : 1) * Math.round(inner.clientHeight * 0.7), behavior: 'smooth' });
      });
    });
    document.getElementById('sideMenuInner').addEventListener('scroll', nxSideMenuScrollBtns_);
    window.addEventListener('resize', nxSideMenuScrollBtns_);
    function nxSidePinned_(){ try { return localStorage.getItem('nx_side_pin') === '1'; } catch (e) { return false; } }
    document.addEventListener('click', function(e){
      var sm = document.getElementById('sideMenu');
      if (sm.classList.contains('peek') && !sm.contains(e.target)) nxSideMenuPeek_(false); // 덮어 나온 메뉴는 바깥을 누르면 숨음(고정은 그대로)
      ['sideAI'].forEach(function(id){
        if (id === 'sideAI' && nxSidePinned_()) return; // 📌 고정
        var el = document.getElementById(id);
        if (el.classList.contains('expanded') && !el.contains(e.target)) el.classList.remove('expanded');
      });
    });

    // [2026.09] 펼쳤을 때 항목마다 줄이 안 맞던 문제 — 이모지+텍스트가 한 덩어리 텍스트라
    // 이모지 폭이 제각각이면(⚖️ vs 👤 vs 🧭 등) 그 뒤 글자 시작 위치도 따라 흔들렸다. 이모지와
    // 라벨을 별도 span으로 나눠 이모지 칸 폭을 고정한다(.mi-icon/.mi-label, style.html 참고).
    // [2026.09 재설계] 예전엔 접힌 상태에서 별도의 "아이콘 전용 목록"(#sideMenuIcons)을 통째로
    // 새로 만들어 보여줬는데, 그 목록은 펼친 목록과 완전히 다른 간격(margin:3px)으로 촘촘히
    // 쌓여서 펼쳤을 때와 자리가 전혀 안 맞고 지저분해 보였다("사이드바가 열렸을 때 자리에
    // 그대로 아이콘이 자리했으면 좋겠다" 지적). 이제 별도 목록을 만들지 않고, 같은 .menu-item
    // 엘리먼트를 접혔을 때는 라벨만 CSS로 숨기고 아이콘만 보이게 한다(style.html의
    // `#sideMenu:not(.expanded)` 규칙) — 같은 엘리먼트·같은 세로 위치이므로 펼쳤을 때와
    // 정확히 같은 자리에 아이콘이 남는다.
    Array.prototype.forEach.call(document.getElementById('sideMenuInner').children, function(child){
      if (!child.classList.contains('menu-item')) return;
      var item = child;
      var fullText = (item.textContent || '').trim();
      var parts = fullText.split(/\s+/);
      var icon = parts[0] || '·';
      var label = parts.slice(1).join(' ');
      item.textContent = '';
      var iconSpan = document.createElement('span');
      iconSpan.className = 'mi-icon';
      iconSpan.textContent = icon;
      var labelSpan = document.createElement('span');
      labelSpan.className = 'mi-label';
      labelSpan.textContent = label;
      item.title = fullText;
      item.appendChild(iconSpan);
      item.appendChild(labelSpan);
      // 접힌 상태에서 이 항목을 눌러 바로 이동할 때, 클릭이 #sideMenu까지 번져서(펼치기
      // 핸들러) 같이 펼쳐지지 않도록 막는다 — 예전 아이콘 전용 목록도 같은 이유로 이렇게 했다.
      item.addEventListener('click', function(e){ e.stopPropagation(); nxSideMenuPeek_(false); }); // 고르면 바로 숨음(고정이면 그대로)
    });

    // [2026.09] 펼친 폭이 210px로 고정이라 텍스트보다 쓸데없이 넓었던 것 — 가장 긴 항목의
    // 실제 너비만큼만 펼쳐지도록, 잠깐 화면에 안 보이게 펼쳐서 폭을 재고 그 값을 CSS 변수로
    // 적용한다(style.html의 --side-expanded-w 참고).
    // [2026.11.01] 로그인 전엔 화면이 숨어 있어 0으로 재져 늘 최소 폭(120)이었다 — 펼칠 때마다 다시 잰다
    window.nxSideMenuFit_ = function(){
      var innerEl = document.getElementById('sideMenuInner');
      var menuEl = document.getElementById('sideMenu');
      var wasExp = menuEl.classList.contains('expanded');
      var prevDisplay = innerEl.style.display, prevVisibility = innerEl.style.visibility;
      innerEl.style.visibility = 'hidden';
      innerEl.style.display = 'block';
      // [2026.11.01] 펼친 모양(아이콘 없이 이름만)으로 재야 긴 이름이 잘리지 않는다 — 접힌 채 재면 이름이 빠져 늘 최소 폭이 됐다
      menuEl.classList.add('expanded');
      // [2026.11.01] 세무사님 "메뉴의 폭을 정확하게 글씨가 끝나는 폭으로" — 가장 긴 글씨의 오른쪽 끝(메뉴 왼쪽에서 잰 값) + 스크롤 막대 폭, 최소 폭 없음 / 11-01 "지금보다 약 5% 더 넓게" → "너무 넓혔다 … 2.5%" → 글씨 폭의 1.025배 → "한글자 정도만큼 더 줄이자" → 이름 끝 + 13(◀ 자리, 한 글자) — ◀는 재는 데서 뺌
      var measured = 0, left = menuEl.getBoundingClientRect().left;
      innerEl.querySelectorAll('.menu-item .mi-label, .menu-group-label, .menu-brand .mb-name').forEach(function(x){
        var ta = x.style.textAlign; if (x.classList.contains('menu-group-label')) x.style.textAlign = 'left'; /* 묶음 이름은 가운데 정렬이라 왼쪽에 붙여 재야 글씨 폭이 나온다 */
        var fw = x.style.fontWeight; if (x.classList.contains('mi-label')) x.style.fontWeight = '700'; /* 지금 고른 줄은 굵게 보이므로 굵은 글씨로 잰다 */ var rg = document.createRange(); rg.selectNodeContents(x); var rc = rg.getBoundingClientRect(); x.style.fontWeight = fw; x.style.textAlign = ta;
        if (rc.width && rc.right - left > measured) measured = rc.right - left;
      });
      var bar = innerEl.offsetWidth - innerEl.clientWidth;
      if (!wasExp) menuEl.classList.remove('expanded');
      innerEl.style.display = prevDisplay;
      innerEl.style.visibility = prevVisibility;
      if (measured > 0){ document.documentElement.style.setProperty('--side-expanded-w', Math.ceil(measured + 13 + bar) + 'px'); setTimeout(nxSideMenuScrollBtns_, 0); }
      // 로그인 창 뒤라 아직 안 보이면(0) 보일 때까지 0.5초마다 다시 잰다 — 펼친 채로 열었을 때 기본 폭(190)으로 남던 것
      else if (menuEl.classList.contains('expanded')){ clearTimeout(window.nxSideMenuFitT_); window.nxSideMenuFitT_ = setTimeout(window.nxSideMenuFit_, 500); }
    };
    window.nxSideMenuFit_();
    (function(){ var o = false; try { var v = localStorage.getItem('nx_menu_pin'); o = v === null ? localStorage.getItem('nx_menu_open') === '1' : v === '1'; } catch (er) {} if (o && window.innerWidth < 700){ document.getElementById('sideMenu').classList.remove('pinned'); nxSideMenuApply_(); return; } /* [2026.11.01] 휴대폰 폭에선 넓은 화면에서 고정해 둔 메뉴도 펼쳐 두지 않는다(가운데 화면이 절반으로 줄던 것) — 기억한 고정값은 그대로 둠 */ nxSideMenuSetPin_(o); })();
  </script>

  <?!= include_('manage/script') ?>
