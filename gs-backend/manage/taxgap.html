<!-- [2026.11.12] 🧾 건전세정 — 세무행정 사각지대(과세가 이루어지지 않는 부분) 사례 모음 (요청 R2611040743, 계획서 "모두 권장대로")
     세무사님 원문(11-04): "건전세정 이라는 탭을 만들어 보자 / 현재 세무행정시스템의 사각지대에 놓여 있어서 세금부과가 이루어지지 않은 부분에 대하여 자료를 수집하는 것을 추진하자"
     사례 한 건 = 드라이브 총괄관리자/건전세정/ md 한 장(서버 TaxGap.js). 왼쪽 목록 · 오른쪽 한 건(보기·고치기·새 사례). 사건 작업공간 머리줄 「건전세정 사례로」와 넥스 도구 tax_gap_case가 같은 파일을 본다. -->
<style>
  .tg-wrap{ display:flex; gap:14px; padding:10px 14px; align-items:flex-start; flex-wrap:wrap; }
  .tg-list{ flex:0 0 360px; max-width:100%; }
  .tg-one{ flex:1 1 420px; min-width:0; }
  .tg-grid-wrap{ overflow-x:auto; max-width:100%; border:1px solid var(--line); border-radius:8px; }
  .tg-grid{ table-layout:fixed; border-collapse:collapse; font-size:12.5px; width:100%; min-width:340px; }
  .tg-grid th, .tg-grid td{ border-bottom:1px solid var(--line); padding:5px 6px; text-align:left; vertical-align:middle; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tg-grid th{ color:var(--sub); font-weight:600; background:var(--panel); }
  .tg-grid tr[data-tg-id]{ cursor:pointer; }
  .tg-grid tr.on td{ background:rgba(31,111,235,0.07); }
  .tg-field{ display:flex; flex-direction:column; gap:4px; margin-bottom:8px; }
  .tg-field label{ font-size:12px; color:var(--sub); }
  .tg-field input, .tg-field select, .tg-field textarea{ width:100%; box-sizing:border-box; font:inherit; font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:inherit; }
  .tg-field textarea{ min-height:72px; resize:vertical; }
  .tg-meta{ font-size:12px; color:var(--sub); margin-bottom:8px; }
</style>
<div class="view" id="view-taxgap">
  <div class="view-head"><h2>🧾 건전세정</h2></div>
  <!-- [2026.11.12] 세무사님 "설명이라는 버튼도 필요없다" — 안내문(공통 장치가 「? 설명」 단추로 바꾸던 것) 걷어 냄 -->
  <div class="tg-wrap">
    <div class="tg-list">
      <div style="display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap;">
        <button type="button" class="save-btn sm" id="tgNewBtn">새 사례</button>
        <select id="tgFieldFilter" title="분야로 거르기"><option value="">모든 분야</option></select>
        <button type="button" class="ghost-btn sm" id="tgReloadBtn" title="목록 다시 불러오기">↻</button>
        <a id="tgFolderLink" class="ghost-btn sm" target="_blank" rel="noopener" hidden>폴더 열기</a>
      </div>
      <div class="tg-grid-wrap"><table class="tg-grid"><colgroup><col style="width:190px"><col style="width:52px"><col style="width:92px"></colgroup>
        <thead><tr><th>제목</th><th>분야</th><th>적은 날</th></tr></thead>
        <tbody id="tgRows"><tr><td colspan="3" style="color:var(--sub);">불러오는 중…</td></tr></tbody></table></div>
    </div>
    <div class="tg-one" id="tgOne">
      <div class="explorer-status" id="tgEmpty">왼쪽에서 사례를 고르거나 「새 사례」를 누르세요.</div>
      <div id="tgForm" hidden>
        <div class="tg-meta" id="tgMeta"></div>
        <div class="tg-field"><label>제목</label><input type="text" id="tgTitle" maxlength="200" placeholder="예: 농지 매매 뒤 미등기 전매 — 양도 사실이 잡히지 않는 경우"></div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <div class="tg-field" style="flex:0 0 140px;"><label>분야</label><select id="tgField"></select></div>
          <div class="tg-field" style="flex:1 1 200px;"><label>관련 사건(고객 실명 없이)</label><input type="text" id="tgCase" maxlength="200"></div>
        </div>
        <div id="tgSections"></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;">
          <button type="button" class="save-btn" id="tgSaveBtn">저장</button>
          <a id="tgOpenLink" class="ghost-btn" target="_blank" rel="noopener" hidden>드라이브에서 열기</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  // 서버는 로그인 뒤에만(10-14 원칙) — initTaxGap은 showView에서만 불린다
  var TG_ = { items: [], fields: [], sections: [], cur: null, loaded: false };
  function tgEsc_(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(ch){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]; }); }
  function initTaxGap(){
    if (!TG_.loaded){
      TG_.loaded = true;
      document.getElementById('tgNewBtn').addEventListener('click', function(){ tgOpen_(null); });
      document.getElementById('tgReloadBtn').addEventListener('click', function(){ tgLoad_(); });
      document.getElementById('tgFieldFilter').addEventListener('change', function(){ tgRender_(); });
      document.getElementById('tgSaveBtn').addEventListener('click', tgSave_);
      document.getElementById('tgRows').addEventListener('click', function(e){
        var tr = e.target.closest && e.target.closest('tr[data-tg-id]'); if (!tr) return;
        tgOpen_(tr.getAttribute('data-tg-id'));
      });
    }
    tgLoad_();
  }
  function tgLoad_(){
    return callGas('tax_gap_list', {}).then(function(r){
      if (!r || !r.success){ document.getElementById('tgRows').innerHTML = '<tr><td colspan="3" style="color:var(--danger,#b3261e);">' + tgEsc_((r && r.error) || '불러오지 못함') + '</td></tr>'; return; }
      TG_.items = r.items || []; TG_.fields = r.분야들 || []; TG_.sections = r.절들 || [];
      var fs = document.getElementById('tgFieldFilter'), keep = fs.value;
      fs.innerHTML = '<option value="">모든 분야</option>' + TG_.fields.map(function(f){ return '<option value="' + tgEsc_(f) + '">' + tgEsc_(f) + '</option>'; }).join('');
      fs.value = keep;
      var fl = document.getElementById('tgFolderLink'); if (r.폴더){ fl.href = r.폴더; fl.hidden = false; }
      tgRender_();
    }).catch(function(err){ document.getElementById('tgRows').innerHTML = '<tr><td colspan="3" style="color:var(--danger,#b3261e);">오류: ' + tgEsc_(err && err.message || err) + '</td></tr>'; });
  }
  function tgRender_(){
    var f = document.getElementById('tgFieldFilter').value, list = TG_.items.filter(function(x){ return !f || x.분야 === f; });
    var tb = document.getElementById('tgRows');
    if (!list.length){ tb.innerHTML = '<tr><td colspan="3" style="color:var(--sub);">사례가 없습니다 — 「새 사례」로 적거나, 사건 작업 머리줄 「건전세정 사례로」로 보내세요.</td></tr>'; return; }
    tb.innerHTML = list.map(function(x){
      return '<tr data-tg-id="' + tgEsc_(x.id) + '" class="' + (TG_.cur && TG_.cur.id === x.id ? 'on' : '') + '"><td title="' + tgEsc_(x.제목) + '">' + tgEsc_(x.제목) + '</td><td>' + tgEsc_(x.분야) + '</td><td title="' + tgEsc_(x.적은날 + (x.적은이 ? ' · ' + x.적은이 : '')) + '">' + tgEsc_(String(x.적은날).slice(0, 10)) + '</td></tr>';
    }).join('');
  }
  function tgSectionsHtml_(sec){
    return TG_.sections.map(function(s){ return '<div class="tg-field"><label>' + tgEsc_(s) + '</label><textarea data-tg-sec="' + tgEsc_(s) + '">' + tgEsc_((sec || {})[s] || '') + '</textarea></div>'; }).join('');
  }
  function tgOpen_(id){
    var form = document.getElementById('tgForm'), empty = document.getElementById('tgEmpty');
    var fsel = document.getElementById('tgField');
    fsel.innerHTML = TG_.fields.map(function(f){ return '<option value="' + tgEsc_(f) + '">' + tgEsc_(f) + '</option>'; }).join('');
    if (!id){
      TG_.cur = { id: '' };
      document.getElementById('tgMeta').textContent = '새 사례';
      document.getElementById('tgTitle').value = ''; fsel.value = '기타'; document.getElementById('tgCase').value = '';
      document.getElementById('tgSections').innerHTML = tgSectionsHtml_({});
      document.getElementById('tgOpenLink').hidden = true;
      empty.hidden = true; form.hidden = false; tgRender_(); document.getElementById('tgTitle').focus();
      return;
    }
    callGas('tax_gap_read', { id: id }).then(function(r){
      if (!r || !r.success){ toast((r && r.error) || '사례를 읽지 못했습니다'); return; }
      TG_.cur = r;
      document.getElementById('tgMeta').textContent = (r.적은날 || '') + (r.적은이 ? ' · ' + r.적은이 + ' 적음' : '') + ' · ' + (r.파일 || '');
      document.getElementById('tgTitle').value = r.제목 || ''; fsel.value = r.분야 || '기타'; document.getElementById('tgCase').value = r.관련사건 || '';
      document.getElementById('tgSections').innerHTML = tgSectionsHtml_(r.절 || {});
      var ol = document.getElementById('tgOpenLink'); if (r.url){ ol.href = r.url; ol.hidden = false; } else ol.hidden = true;
      empty.hidden = true; form.hidden = false; tgRender_();
    }).catch(function(err){ toast('오류: ' + (err && err.message || err)); });
  }
  function tgSave_(){
    var title = String(document.getElementById('tgTitle').value || '').trim();
    if (!title){ toast('제목을 적어 주세요'); document.getElementById('tgTitle').focus(); return; }
    var sec = {};
    document.querySelectorAll('#tgSections textarea[data-tg-sec]').forEach(function(t){ sec[t.getAttribute('data-tg-sec')] = t.value; });
    var body = { id: (TG_.cur && TG_.cur.id) || '', 제목: title, 분야: document.getElementById('tgField').value, 관련사건: document.getElementById('tgCase').value, 절: sec };
    var btn = document.getElementById('tgSaveBtn'); btn.disabled = true; btn.textContent = '저장 중…';
    callGas('tax_gap_save', body).then(function(r){
      btn.disabled = false; btn.textContent = '저장';
      if (!r || !r.success){ toast((r && r.error) || '저장하지 못했습니다'); return; }
      toast('저장했습니다 — ' + r.파일);
      tgLoad_().then(function(){ tgOpen_(r.id); });
    }).catch(function(err){ btn.disabled = false; btn.textContent = '저장'; toast('저장 중 오류: ' + (err && err.message || err)); });
  }
  // 사건 작업공간 머리줄 「건전세정 사례로」 — 사건 요약으로 사례 초안을 만들고(고객 실명은 ○○) 이 탭을 연다
  function tgFromCase_(caseId){
    if (!caseId){ toast('사건을 먼저 골라 주세요'); return; }
    var ask = typeof nxPrompt_ === 'function' ? nxPrompt_('이 사건에서 과세가 이루어지지 않는 부분이 무엇인지 한두 줄로 적어 주세요(비워도 됩니다 — 사례 글에서 채울 수 있음).', '', '건전세정 사례로') : Promise.resolve(window.prompt('왜 과세 안 되나(비워도 됨)', ''));
    ask.then(function(note){
      if (note === null) return;
      callGas('tax_gap_from_case', { caseId: caseId, note: note || '' }).then(function(r){
        if (!r || !r.success){ toast((r && r.error) || '사례를 만들지 못했습니다'); return; }
        toast('건전세정 사례 초안을 만들었습니다 — ' + r.파일);
        showView('taxgap');
        tgLoad_().then(function(){ tgOpen_(r.id); });
      }).catch(function(err){ toast('오류: ' + (err && err.message || err)); });
    });
  }
</script>
