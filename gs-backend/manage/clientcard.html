<!--
  [2026.10.16] 고객 카드 — 접는 폰 커버화면에서 오른쪽으로 밀면 열리는 화면(세무사님 결정).
  커버화면은 주로 고객과 통화하기 직전·통화 중에 쓰므로 "이 고객이 누구고, 사건이 어디까지 왔고, 지난번에 무슨 얘기를
  했는지"를 한 화면에 모은다. 고객 이름을 말하면 후보 고객을 큰 버튼으로 보여 주고 눌러서 확정한다(녹음 화면과 같은 원칙 —
  말로 들은 대로 자동으로 정하지 않음). 카드: 📞 전화, 진행 중인 사건(상태·법정일), 사건 폴더의 가장 최근 상담내용 요약
  (🔊 듣기), 사건별 🎙 바로 녹음(consultmemo.html). 문자 버튼은 넣지 않음(고객과는 주로 카카오로 소통 — 세무사님).
-->
<div class="view" id="view-clientcard">
  <div class="cc" id="ccRoot">
    <div class="cc-head"><b>👤 고객 카드</b><button type="button" class="cc-mini" id="ccAgain">다른 고객</button></div>
    <div class="cc-body" id="ccBody"></div>
  </div>
</div>
<style>
  #view-clientcard{ background:var(--navy); color:#fff; }
  .cc{ display:flex; flex-direction:column; height:100%; min-height:0; padding:10px 12px; box-sizing:border-box; gap:8px; }
  .cc-head{ display:flex; align-items:center; gap:8px; font-size:16px; flex-shrink:0; }
  .cc-head b{ flex:1; }
  .cc-mini{ border:1px solid rgba(255,255,255,0.3); background:transparent; color:#fff; border-radius:8px; height:36px; padding:0 12px; font-size:14px; cursor:pointer; }
  .cc-body{ flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .cc-btn{ border:none; border-radius:12px; background:rgba(255,255,255,0.1); color:#fff; font-size:16px; font-weight:600; padding:8px 12px; min-height:52px; cursor:pointer; text-align:left; text-decoration:none; display:block; }
  .cc-btn small{ display:block; font-size:12.5px; font-weight:400; color:#c9d2e6; }
  .cc-btn.gold{ background:var(--gold); color:var(--navy); text-align:center; }
  .cc-btn.green{ background:#2f9e6b; text-align:center; }
  .cc-btn.big{ min-height:90px; font-size:20px; }
  .cc-name{ font-size:22px; font-weight:700; }
  .cc-sub{ font-size:13px; color:#c9d2e6; }
  .cc-msg{ font-size:14px; color:#c9d2e6; line-height:1.5; }
  .cc-case{ display:flex; gap:8px; align-items:stretch; background:rgba(255,255,255,0.06); border-radius:12px; padding:8px 10px; }
  .cc-case .info{ flex:1; min-width:0; font-size:15px; }
  .cc-case .info small{ display:block; font-size:13px; color:#c9d2e6; }
  .cc-case .rec{ flex-shrink:0; width:52px; border:none; border-radius:10px; background:#e5484d; color:#fff; font-size:22px; cursor:pointer; }
  .cc-dday{ color:#ffb4b4; font-weight:700; }
  .cc-sum{ font-size:15px; line-height:1.6; white-space:pre-wrap; background:rgba(255,255,255,0.06); border-radius:10px; padding:10px; }
  .cc-sum b{ color:var(--gold-light); }
</style>
<script>
  var nxCc_ = { clients: null, cases: null, cur: null, sums: {} };
  function nxCcEl_(id){ return document.getElementById(id); }
  function nxCcEsc_(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nxCcBody_(html){ nxCcEl_('ccBody').innerHTML = html; }

  function nxCcLoad_(){
    var p1 = nxCc_.clients ? Promise.resolve() : callGas('client_get_clients', {}).then(function(r){ nxCc_.clients = (r && r.clients) || []; });
    var p2 = nxCc_.cases ? Promise.resolve() : callGas('work_get_cases', {}).then(function(r){ nxCc_.cases = (r && r.cases) || []; });
    return Promise.all([p1, p2]);
  }
  // 말한 이름과 고객 성명을 비교 — 그대로 들어 있으면 높게, 글자 일부만 맞으면 낮게(받아쓰기 오인식 대비)
  function nxCcMatch_(said){
    var q = String(said || '').replace(/\s+/g, '').replace(/(고객|님|씨|사장|대표|선생)$/g, '');
    if (!q) return [];
    return (nxCc_.clients || []).map(function(c){
      var n = String(c.성명 || '').replace(/\s+/g, '');
      if (!n) return null;
      var score = 0;
      if (q === n) score += 20; else if (q.indexOf(n) !== -1 || n.indexOf(q) !== -1) score += 10;
      var common = 0; for (var i = 0; i < q.length; i++) if (n.indexOf(q[i]) !== -1) common++;
      score += common / Math.max(q.length, 1) * 4;
      return { c: c, score: score };
    }).filter(function(x){ return x && x.score >= 4; }).sort(function(a, b){ return b.score - a.score; }).slice(0, 3).map(function(x){ return x.c; });
  }
  function nxCcPick_(list, note){
    nxCc_.cur = null;
    nxCcBody_('<button type="button" class="cc-btn gold big" id="ccSay">🎤 고객 이름 말하기</button>' +
      (note ? '<div class="cc-msg">' + note + '</div>' : '') +
      (list || []).map(function(c){
        return '<button type="button" class="cc-btn" data-cc-client="' + nxCcEsc_(c.id) + '">' + nxCcEsc_(c.성명) + '<small>' + nxCcEsc_([c.구분, c.전화번호].filter(Boolean).join(' · ')) + '</small></button>';
      }).join(''));
  }
  function nxCcSay_(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR){ nxCcPick_(null, '이 브라우저는 음성 인식이 안 됩니다 — 크롬으로 열어 주세요.'); return; }
    var b = nxCcEl_('ccSay'); if (b){ b.textContent = '듣는 중… 고객 이름을 말씀하세요'; b.classList.remove('gold'); b.style.background = '#e5484d'; }
    var rec = new SR(); rec.lang = 'ko-KR'; rec.interimResults = false; rec.maxAlternatives = 3;
    var heard = [];
    rec.onresult = function(ev){ for (var i = 0; i < ev.results[0].length; i++) heard.push(ev.results[0][i].transcript); };
    rec.onend = function(){
      if (!heard.length){ nxCcPick_(null, '이름을 듣지 못했습니다 — 다시 눌러 주세요.'); return; }
      nxCcPick_([], '고객 찾는 중… (' + nxCcEsc_(heard[0]) + ')');
      nxCcLoad_().then(function(){
        var found = [];
        heard.forEach(function(h){ nxCcMatch_(h).forEach(function(c){ if (found.indexOf(c) === -1) found.push(c); }); });
        found = found.slice(0, 3);
        nxCcPick_(found, found.length ? '"' + nxCcEsc_(heard[0]) + '" — 맞는 고객을 누르세요' : '"' + nxCcEsc_(heard[0]) + '"에 맞는 고객이 없습니다 — 다시 말해 주세요.');
      }, function(err){ nxCcPick_(null, '고객 목록을 못 불러왔습니다: ' + nxCcEsc_(err && err.message || err)); });
    };
    rec.onerror = function(){};
    try { rec.start(); } catch (e) { nxCcPick_(null, '음성 인식을 시작하지 못했습니다.'); }
  }

  function nxCcDday_(d){
    if (!d) return '';
    var t = new Date(String(d).replace(/\./g, '-')); if (isNaN(t)) return '';
    var n = Math.ceil((t - new Date(new Date().toDateString())) / 86400000);
    return n === 0 ? 'D-day' : (n > 0 ? 'D-' + n : 'D+' + (-n));
  }
  function nxCcShow_(client){
    nxCc_.cur = client;
    var name = String(client.성명 || '').replace(/\s+/g, '');
    var cases = (nxCc_.cases || []).filter(function(c){
      return String(c.고객ID || '') === String(client.id) || String(c.고객명 || '').replace(/\s+/g, '') === name || String(c.납세자 || '').replace(/\s+/g, '') === name;
    }).sort(function(a, b){ var da = a.상태 === '완료' ? 1 : 0, db = b.상태 === '완료' ? 1 : 0; return da - db || String(b.수정일 || '').localeCompare(String(a.수정일 || '')); });
    var phones = [client.전화번호].concat((client.추가연락처 || []).map(function(x){ return x && (x.전화번호 || x.phone || x.value) || ''; }))
      .map(function(p){ return String(p || '').trim(); }).filter(Boolean);
    var html = '<div><div class="cc-name">' + nxCcEsc_(client.성명) + '</div><div class="cc-sub">' + nxCcEsc_([client.구분, client.주소].filter(Boolean).join(' · ')) + '</div></div>';
    html += phones.length ? phones.map(function(p){ return '<a class="cc-btn green" href="tel:' + nxCcEsc_(p.replace(/[^0-9+]/g, '')) + '">📞 ' + nxCcEsc_(p) + '</a>'; }).join('') : '<div class="cc-msg">등록된 전화번호가 없습니다.</div>';
    html += cases.length ? cases.slice(0, 5).map(function(c){
      var dd = c.상태 !== '완료' ? nxCcDday_(c.법정일) : '';
      return '<div class="cc-case"><div class="info">' + nxCcEsc_(c.사건명) + '<small>' + nxCcEsc_(c.상태 || '') + (dd ? ' · <span class="cc-dday">법정일 ' + dd + '</span>' : '') + '</small></div>' +
        (c.폴더ID ? '<button type="button" class="rec" data-cc-rec="' + nxCcEsc_(c.id) + '" aria-label="이 사건 상담 녹음">🎙</button>' : '') + '</div>';
    }).join('') : '<div class="cc-msg">연결된 사건이 없습니다.</div>';
    html += '<div id="ccSums"><div class="cc-msg">최근 상담내용 찾는 중…</div></div>';
    nxCcBody_(html);
    nxCcLoadSums_(cases.filter(function(c){ return c.폴더ID; }).slice(0, 3));
  }
  // 사건 폴더의 가장 최근 상담내용_*.md에서 "핵심 요약"만 꺼내 보여 준다(🔊 듣기)
  function nxCcLoadSums_(cases){
    var box = function(){ return nxCcEl_('ccSums'); };
    if (!cases.length){ if (box()) box().innerHTML = ''; return; }
    var found = [];
    Promise.all(cases.map(function(c){
      return callGas('listFolder', { folderId: c.폴더ID }).then(function(r){
        var md = ((r && r.files) || []).filter(function(f){ return /^상담내용_.*\.md$/.test(f.name); }).sort(function(a, b){ return b.name.localeCompare(a.name); })[0];
        if (!md) return;
        return callGas('readFile', { fileId: md.id }).then(function(x){
          var text = String(x && x.content || '');
          var m = text.match(/## 핵심 요약\s*([\s\S]*?)(\n## |$)/);
          found.push({ caseName: c.사건명, when: md.name.replace(/^상담내용_|\.md$/g, ''), sum: (m ? m[1] : text.slice(0, 400)).trim() });
        });
      }).catch(function(){});
    })).then(function(){
      if (!box()) return;
      if (!found.length){ box().innerHTML = '<div class="cc-msg">저장된 상담내용이 없습니다.</div>'; return; }
      found.sort(function(a, b){ return b.when.localeCompare(a.when); });
      nxCc_.sums = {};
      box().innerHTML = found.map(function(f, i){
        nxCc_.sums[i] = f.sum;
        var w = f.when.replace(/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2}).*/, '$2/$3 $4:$5');
        return '<div class="cc-sum"><b>최근 상담 ' + nxCcEsc_(w) + ' · ' + nxCcEsc_(f.caseName) + '</b>\n' + nxCcEsc_(f.sum) + '</div>' +
          '<button type="button" class="cc-btn" data-cc-hear="' + i + '">🔊 요약 듣기</button>';
      }).join('');
    });
  }

  function nxCcOpen_(){
    if (nxCc_.cur){ return; } // 보던 고객 카드 그대로
    nxCcPick_();
    nxCcLoad_().catch(function(){}); // 미리 불러 두기 — 이름을 말하는 동안 받아 둠
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest && e.target.closest('#view-clientcard button, #view-clientcard a');
    if (!t) return;
    if (t.id === 'ccSay') return nxCcSay_();
    if (t.id === 'ccAgain') return nxCcPick_();
    var cid = t.getAttribute('data-cc-client');
    if (cid){ var c = (nxCc_.clients || []).filter(function(x){ return String(x.id) === cid; })[0]; if (c) nxCcShow_(c); return; }
    var rid = t.getAttribute('data-cc-rec');
    if (rid){
      var k = (nxCc_.cases || []).filter(function(x){ return String(x.id) === rid; })[0];
      if (typeof nxCm_ !== 'undefined' && (nxCm_.st === 'rec' || nxCm_.st === 'paused' || nxCm_.st === 'up' || nxCm_.st === 'wait')){ goToView_('consult'); nxCoverSync_(); return; }
      goToView_('consult'); nxCoverSync_();
      if (k && typeof nxCmStart_ === 'function') nxCmStart_(k.id, k.사건명 || k.고객명);
      return;
    }
    var hi = t.getAttribute('data-cc-hear');
    if (hi !== null && window.speechSynthesis){
      var u = new SpeechSynthesisUtterance(String(nxCc_.sums[hi] || '').replace(/[#*`>-]/g, ' ')); u.lang = 'ko-KR';
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }
  });
</script>
