function tcApplyOverviewToTransfer_(caseObj){
  if (!caseObj || caseObj.세목 !== 'transfer' || typeof transferAssets === 'undefined') return;
  var overview = caseObj.사건개요 || {};
  var list = Array.isArray(overview.물건목록) ? overview.물건목록 : null;
  var classificationFlags = TC_CASE_CLASSIFICATION_TO_TRANSFER_FLAGS_[overview.사건분류] || null;
  // [2026.09 버그수정] 다주택중과 판정용 주택수는 이제 자산이 아니라 양도인 정보의 flat
  // 필드 하나뿐이라, 사건분류에서 짐작되는 값은 그 flat 필드에 채워야 한다(예전엔 새로
  // 만드는 자산 하나하나에 채웠음).
  if (classificationFlags && classificationFlags.multiHouseCount) {
    var multiHouseEl = document.getElementById('trMultiHouseCount');
    if (multiHouseEl) multiHouseEl.value = classificationFlags.multiHouseCount;
  }
  var firstIsEmpty = !transferAssets[0] || !(transferAssets[0].assetLocation || transferAssets[0].transferPrice || transferAssets[0].acquisitionPrice);
  if (list && list.length && transferAssets.length <= 1 && firstIsEmpty) {
    // [2026.09 재설계] 계약(취득계약구분/양도계약구분)을 자산과 별도인 1급 데이터로 승격 —
    // 사건개요서에 저장된 태그 문자열을 보고 같은 태그를 쓰는 자산들을 묶어 계약 객체를
    // 자동으로 만들어준다(casehandling.html은 그대로 태그 문자열만 다루면 되므로 그 화면은
    // 손대지 않아도 됨). "전체 묶기"(양도계약일괄)도 모든 자산을 하나의 계약으로 묶는
    // 것으로 그대로 옮겨온다.
    acquisitionContracts = [];
    transferContracts = [];
    var acqTagToContract = {};
    var trTagToContract = {};
    transferAssets = list.map(function(item){
      var a = {
        assetType: item.assetType || '', assetKind: item.assetKind || '', assetLocation: item.assetLocation || '',
        assetDong: item.assetDong || '', assetHo: item.assetHo || '', assetDongList: item.assetDongList || [],
        transferPrice: item.양도가액 || '', acquisitionPrice: item.취득가액 || '',
        acquisitionDate: item.취득일 || '', transferDate: caseObj.기준일 || ''
      };
      var acqTag = String(item.취득계약구분 || '').trim();
      if (acqTag) {
        if (!acqTagToContract[acqTag]) {
          acqTagToContract[acqTag] = { id: tcNewContractId_(), name: acqTag, date: item.취득일 || '', totalPrice: numVal(item.취득가액) || 0, totalExpenseItems: [], externalMembers: [] };
          acquisitionContracts.push(acqTagToContract[acqTag]);
        }
        a.acquisitionContractId = acqTagToContract[acqTag].id;
      }
      var trTag = String(item.양도계약구분 || '').trim();
      if (trTag || overview.양도계약일괄) {
        var trKey = overview.양도계약일괄 ? '__all__' : trTag;
        if (!trTagToContract[trKey]) {
          trTagToContract[trKey] = { id: tcNewContractId_(), name: overview.양도계약일괄 ? '전체 일괄 계약' : trTag, date: caseObj.기준일 || '', totalPrice: numVal(item.양도가액) || 0, totalExpenseItems: [], externalMembers: [] };
          transferContracts.push(trTagToContract[trKey]);
        }
        a.transferContractId = trTagToContract[trKey].id;
      }
      if (classificationFlags) Object.assign(a, classificationFlags);
      return a;
    });
    if (typeof renderTransferPane === 'function') renderTransferPane();
    return;
  }
  if (!transferAssets[0]) return;
  var a = transferAssets[0];
  var changed = false;
  ['assetType', 'assetKind', 'assetLocation', 'assetDong', 'assetHo'].forEach(function(key){
    if (!a[key] && overview[key]) { a[key] = overview[key]; changed = true; }
  });
  if (Array.isArray(overview.assetDongList) && !Array.isArray(a.assetDongList)) { a.assetDongList = overview.assetDongList; changed = true; }
  if (!a.transferPrice && overview.양도가액) { a.transferPrice = overview.양도가액; changed = true; }
  if (!a.acquisitionPrice && overview.취득가액) { a.acquisitionPrice = overview.취득가액; changed = true; }
  if (!a.acquisitionDate && overview.취득일) { a.acquisitionDate = overview.취득일; changed = true; }
  if (!a.transferDate && caseObj.기준일) { a.transferDate = caseObj.기준일; changed = true; }
  if (classificationFlags) {
    Object.keys(classificationFlags).forEach(function(key){
      if (!a[key]) { a[key] = classificationFlags[key]; changed = true; }
    });
  }
  if (changed && typeof renderTransferPane === 'function') renderTransferPane();
}

    renderTcCaseBar_();
  });
  // [2026.09] 처리개요에서 넘어온 경우가 많은데 왼쪽 메뉴로 되돌아가야만 해서 불편하다는
  // 지적 — 지금 고른 사건을 그대로 들고 처리개요로 돌아가는 버튼.
  document.getElementById('tcBackToCaseBtn').addEventListener('click', function(){
    if (typeof goToView_ === 'function') goToView_('casehandling');
    if (tcSelectedId && typeof goToCaseHandling_ === 'function') goToCaseHandling_(tcSelectedId);
  });
  if (tcSelectedId) renderTcSavedList_(tcCurrentCase ? (tcCurrentCase.세액계산결과 || []) : []);
  if (tcSelectedId !== tcLastAppliedCaseId_) {
    tcResetOverviewInputsForNewCase_();
    tcLastAppliedCaseId_ = tcSelectedId;
  }
  if (tcCurrentCase) {
    tcSwitchToTab_(tcCurrentCase.세목);
    tcApplyOverviewToInputs_(tcCurrentCase);
    tcApplyOverviewToTransfer_(tcCurrentCase);
    tcApplyOverviewToSellers_(tcCurrentCase);
    tcApplyOverviewToValuationAssets_(tcCurrentCase);
    tcApplyOverviewToHeirs_(tcCurrentCase);
    tcApplyOverviewToGiftParties_(tcCurrentCase);
    tcApplyCaseBaseDate_(tcCurrentCase);
    tcApplySpecialGiftProvisionDefaults_(tcCurrentCase);
    tcApplyGiftRelation_(tcCurrentCase);
  }
  tcRenderCaseFactsBanner_(tcCurrentCase);
}

function renderTcSavedList_(list){
  var wrap = document.getElementById('tcSavedList');
  if (!wrap) return;
  if (!list.length){
    wrap.innerHTML = '<div class="log-empty">아직 저장된 계산 결과가 없습니다.</div>';
    return;
  }
  wrap.innerHTML = '';
  // [2026.09] 저장된 계산이 여러 건 쌓이면(다른 납세자·재계산 등) 목록이 길어져서 사건
  // 선택 바 전체가 늘어나므로, 기본은 한 줄로 접어두고 꺾쇠로 펼쳐볼 수 있게 한다.
  // [2026.09 버그수정] 재계산해도 예전 계산결과가 그대로 나란히 남아, 어느 게 맞는 최신
  // 결과인지 구분이 안 됐다 — 같은 세목(양도/증여 등) 중 가장 최근 것에 "최신" 표시를 단다.
  var seenSemok_ = {};
  list.slice().reverse().forEach(function(entry){
    var isLatest = !seenSemok_[entry.세목];
    seenSemok_[entry.세목] = true;
    // [2026.09.23 버그수정] 세무사님 지적 — 저장 목록엔 "언제 계산했다"는 날짜만 보이고 세액이
    // 안 보여 아무 정보가 안 된다고 지적받음. entry.최종세액은 저장할 때 이미 숫자로 뽑아
    // 저장해두고 있었는데(tcSaveCurrentResult_) 정작 목록에서 한 번도 안 읽고 있었다 — 항상
    // 보이는 줄에 금액을 바로 표시한다. 또한 펼쳐보기(▾)의 미리보기가 300자로 잘려있어 결과가
    // 길면(항목이 많은 세목) 정작 "납부세액" 줄이 잘려 안 보일 수 있었다 — 펼치면 전체를 다 보여준다.
    var preview = String(entry.요약 || '');
    var row = document.createElement('div');
    row.className = 'log-entry';
    row.style.flexDirection = 'column';
    row.style.alignItems = 'stretch';
    row.innerHTML =
      '<div style="display:flex; align-items:center; gap:8px; cursor:pointer;" class="tc-saved-toggle">' +
      '<span class="tc-saved-toggle-arrow" style="color:var(--sub); font-size:11px; flex-shrink:0; width:14px;">▾</span>' +
      '<div class="log-date" style="flex-shrink:0;">' + escapeHtml(fmtDateShort_(entry.계산일) || entry.계산일 || '') + '</div>' +
      '<div class="log-text" style="flex:1;"><b>' + escapeHtml(entry.세목 || '') + ' · ' + escapeHtml(entry.구분 || '') + '</b>' +
      (Number.isFinite(entry.최종세액) ? ' <b style="color:var(--accent, #2a7a4f);">' + won(entry.최종세액) + '</b>' : '') +
      (entry.기준일스냅샷 ? ' <span style="color:var(--sub); font-size:11px;">(기준일: ' + escapeHtml(entry.기준일스냅샷) + ')</span>' : '') +
      (isLatest ? ' <span style="color:#2a7a4f; font-weight:700; font-size:11px;">최신</span>' : ' <span style="color:var(--sub); font-size:11px;">이전 계산</span>') + '</div>' +
      '<span class="log-del" title="삭제">✕</span>' +
      '</div>' +
      '<div class="tc-saved-preview" style="display:none; color:var(--sub); font-size:12.5px; margin:6px 0 0 22px; white-space:pre-wrap;">' + escapeHtml(preview) + '</div>';
    var toggle = row.querySelector('.tc-saved-toggle');
    var arrow = row.querySelector('.tc-saved-toggle-arrow');
    var previewEl = row.querySelector('.tc-saved-preview');
    toggle.addEventListener('click', function(){
      var open = previewEl.style.display !== 'none';
      previewEl.style.display = open ? 'none' : 'block';
      arrow.textContent = open ? '▾' : '▴';
    });
    row.querySelector('.log-del').addEventListener('click', function(clickEvt){
      clickEvt.stopPropagation();
      var newList = (tcCurrentCase.세액계산결과 || []).filter(function(e){ return e.id !== entry.id; });
      tcSaveList_(newList);
    });
    wrap.appendChild(row);
  });
}

// [2026.09] 동시편집 낙관적 잠금 — 마지막으로 읽은 수정일을 같이 보내고, 그 사이 다른 곳에서
// 먼저 저장돼 충돌났으면 덮어쓰지 않고 최신 사건 정보로 다시 불러온다. 저장이 성공하면 서버가
// 새로 매긴 수정일로 로컬 캐시도 같이 갱신해야, 바로 이어서 또 저장할 때 방금 자기가 한 저장
// 때문에 충돌로 오판하지 않는다.
function tcSaveList_(newList){
  return callGas('work_update_case', { id: tcCurrentCase.id, 세액계산결과: newList, 기대수정일: tcCurrentCase.수정일 }).then(function(res){
    if (res.conflict){ showToast(res.message || '충돌이 발생했습니다. 새로고침합니다.', 'warning'); loadTcCases_(tcCurrentCase.id); return false; }
    if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return false; }
    tcCurrentCase.세액계산결과 = newList;
    if (res.case && res.case.수정일) tcCurrentCase.수정일 = res.case.수정일;
    var cached = tcCases.filter(function(c){ return c.id === tcCurrentCase.id; })[0];
    if (cached) { cached.세액계산결과 = newList; if (res.case && res.case.수정일) cached.수정일 = res.case.수정일; }
    renderTcSavedList_(newList);
    if (typeof loadWorkCases === 'function') loadWorkCases();
    return true;
  }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); return false; });
}

// 지금 활성화된 메인 탭(양도/증여/상속/취득)의 메인 결과 박스 텍스트를 그대로 캡처한다. 각
// 탭 안에는 우회양도부인 등 부속 계산기가 여러 개 더 있지만(각각 별도 id), 신고서
// 자체의 최종 세액은 항상 이 4개 메인 박스(taxCalcTransferResult 등)에 표시되므로 이것만
// 캡처한다 — 부속 계산기 결과까지 다 모으면 요약이 아니라 화면 전체 덤프가 된다.
function tcSaveCurrentResult_(){
  if (!tcSelectedId || !tcCurrentCase){ showToast('먼저 사건을 선택해주세요.', 'warning'); return; }
  var activeTabEl = document.querySelector('.taxcalc-tab.active');
  var tab = activeTabEl ? activeTabEl.dataset.tab : 'transfer';
  // [2026.09 버그수정] 사건의 세목과 지금 계산 탭이 다르면(예: 상속 사건을 골라놓고 양도 탭에
  // 계산한 채 저장) 경고 없이 그대로 저장돼 엉뚱한 세목 결과가 그 사건에 섞여 들어갔다.
  // 완전히 막지는 않는다(다른 세목 계산을 참고용으로 같이 저장하고 싶을 수도 있으므로) —
  // 대신 명시적으로 한 번 더 확인한다.
  var proceedSaveResult_ = function(){
  var boxId = TC_RESULT_BOX_IDS_[tab];
  var box = boxId ? document.getElementById(boxId) : null;
  var text = box ? box.innerText.trim() : '';
  if (!text){ showToast('먼저 세액 계산을 실행해주세요.', 'warning'); return; }
  // [2026.09 버그수정] 계산 중 오류(예: 필수 입력 누락)가 나면 결과박스엔 에러 문구가 그대로
  // 남는데, 그 문구도 "텍스트가 있으니" 정상 계산결과처럼 저장되고 있었다 — 나중에 저장목록에
  // 진짜 계산결과처럼 섞여 보인다.
  if (box && box.querySelector('.taxcalc-error')){ showToast('계산이 오류로 끝났습니다 — 오류를 고친 뒤 다시 계산해주세요.', 'error'); return; }
  // [2026.09 버그수정] 지금까지는 결과 박스 전체를 텍스트 요약(요약)으로만 저장해서, (1) 세액만
  // 따로 모아 통계를 낼 수 없었고 (2) 보고서(reportwriter.html) 본문에 세액을 자동으로 넣어줄
  // 방법이 없어 세무사가 계산 결과를 보고서에 다시 손으로 옮겨 적어야 했다. 결과 박스 맨 아래
  // "합계/총액" 줄(taxcalc-result-row.total, taxCalcResultRow가 렌더링)의 금액을 숫자로도
  // 같이 뽑아 최종세액 필드에 저장한다.
  var totalEls = box ? box.querySelectorAll('.taxcalc-result-row.total .v') : [];
  var totalText = totalEls.length ? totalEls[totalEls.length - 1].textContent : '';
  var totalNum = totalText ? Number(totalText.replace(/[^0-9.]/g, '')) : NaN;
  // [2026.09 버그수정] 실사용 감사 지적 — 저장된 계산결과에 계산에 실제로 쓰인 기준일(증여일·
  // 상속개시일)이 전혀 남지 않아, 나중에 "이 계산이 어떤 날짜로 됐는지" 확인할 방법이 없었다
  // (상속개시일 연결이 늦게 고쳐지기 전에 빈 날짜로 계산·저장된 옛 결과를 사후에 찾아낼
  // 근거 자체가 없다는 지적 — 앞으로 저장되는 것부터는 스냅샷을 남겨 재검토 가능하게 한다).
  var dateSnapshotFieldBySemok_ = { gift: 'giftDate', inheritance: 'ihDeathDate' };
  var dateSnapshotFieldId_ = dateSnapshotFieldBySemok_[tab];
  var dateSnapshot_ = dateSnapshotFieldId_ ? (document.getElementById(dateSnapshotFieldId_) || {}).value : '';
  var entry = {
    id: 'tc_' + Date.now(),
    세목: TC_TAB_LABELS_[tab] || tab,
    구분: taxCalcTier === 'simple' ? '간편계산' : '정밀계산',
    요약: text,
    최종세액: Number.isFinite(totalNum) ? totalNum : undefined,
    계산일: new Date().toISOString().slice(0, 10)
  };
  if (dateSnapshot_) entry.기준일스냅샷 = dateSnapshot_;
  var newList = (tcCurrentCase.세액계산결과 || []).concat([entry]);
  // [2026.09 버그수정] 계산결과 저장(잠금 있음)과 사건개요 금액 동기화(잠금 없음)를 동시에
  // 따로 보내면, 두 요청이 서버에 도착하는 순서가 뒤바뀔 수 있어(구글 앱스스크립트는 각
  // 요청이 독립적으로 처리됨) 방금 계산한 결과 저장이 "다른 곳에서 먼저 저장했다"는 엉뚱한
  // 충돌로 실패할 수 있었다 — 계산결과를 먼저 저장하고 성공한 뒤에만 개요 동기화를 보낸다.
  tcSaveList_(newList).then(function(ok){
    if (ok) {
      showToast('이 사건에 저장했습니다' + (Number.isFinite(totalNum) ? ' — 납부세액 ' + won(totalNum) : '') + '.', 'success');
      tcSyncOverviewAmounts_(tab);
    }
  });
  };
  if (tcCurrentCase.세목 && tab !== tcCurrentCase.세목 && TC_TAB_LABELS_[tcCurrentCase.세목]) {
    var caseLabel = TC_TAB_LABELS_[tcCurrentCase.세목] || tcCurrentCase.세목;
    var tabLabel = TC_TAB_LABELS_[tab] || tab;
    nxConfirm_('선택한 사건은 "' + caseLabel + '" 사건인데, 지금 "' + tabLabel + '" 탭의 계산결과를 저장하려고 합니다.\n정말 이대로 저장할까요?').then(function(ok){
      if (ok) proceedSaveResult_();
    });
  } else {
    proceedSaveResult_();
  }
}

// [2026.09] "사건개요서의 양도가액·취득가액·증여가액·상속가액은 어차피 예상가액일 뿐이니,
// 실제 세액계산에 쓴(더 확실한) 값이 나오면 사건개요서도 그 값으로 소급 정정해야 한다"는
// 요청 — 계산 결과를 사건에 저장하는 시점에 실제로 입력된 금액을 사건개요에 덮어쓴다.
// [2026.09 재설계] 양도는 이제 사건개요서(overview.물건목록)가 자산 전체 목록의 주인이므로,
// 대표 1건이 아니라 지금 화면의 transferAssets 전체(자산이 추가/삭제됐을 수도 있음)를
// 통째로 다시 써서 목록을 항상 최신으로 유지한다 — 이게 없으면 여기서 추가한 2번째·3번째
// 자산은 화면을 새로고침하는 순간 사라졌었다(실제로 그동안 저장이 아예 안 되고 있었음).
function tcSyncOverviewAmounts_(tab){
  if (!tcCurrentCase) return;
  var updates = null;
  if (tab === 'transfer' && typeof transferAssets !== 'undefined' && transferAssets.length){
    updates = {
      물건목록: transferAssets.map(function(a){
        return {
          assetType: a.assetType || '', assetKind: a.assetKind || '', assetLocation: a.assetLocation || '',
          assetDong: a.assetDong || '', assetHo: a.assetHo || '', assetDongList: a.assetDongList || [],
          취득일: a.acquisitionDate || '', 양도가액: a.transferPrice || '', 취득가액: a.acquisitionPrice || '',
          // [2026.09 재설계] 계약구분은 이제 태그 문자열이 아니라 acquisitionContracts/
          // transferContracts를 가리키는 FK다 — casehandling.html은 여전히 태그 문자열만
          // 다루므로, 저장할 땐 연결된 계약의 이름을 다시 문자열로 풀어서 써준다.
          취득계약구분: (function(){ var c = a.acquisitionContractId ? acquisitionContracts.find(function(x){ return x.id === a.acquisitionContractId; }) : null; return c ? c.name : ''; })(),
          양도계약구분: (function(){ var c = a.transferContractId ? transferContracts.find(function(x){ return x.id === a.transferContractId; }) : null; return c ? c.name : ''; })()
        };
      }),
      물건수: String(transferAssets.length)
    };
    var first = transferAssets[0];
    if (first) Object.assign(updates, {
      assetType: first.assetType || '', assetKind: first.assetKind || '', assetLocation: first.assetLocation || '',
      assetDong: first.assetDong || '', assetHo: first.assetHo || '', assetDongList: first.assetDongList || [],
      양도가액: first.transferPrice || '', 취득가액: first.acquisitionPrice || ''
    });
  } else if (tab === 'gift'){
    var giftAmountEl = document.getElementById('giftAmount');
    if (giftAmountEl && giftAmountEl.value) updates = { giftAmount: giftAmountEl.value };
  } else if (tab === 'inheritance'){
    updates = {};
    var ihEstateEl = document.getElementById('ihEstate');
    if (ihEstateEl && ihEstateEl.value) updates.ihEstate = ihEstateEl.value;
    // [2026.09 버그수정] 실사용 감사 지적 — 상속인 명부(성명·주민등록번호·나이·장애여부·동거
    // 요건·사전증여 등)가 사건에 전혀 저장되지 않아, 화면을 벗어나거나 다른 사건을 봤다가
    // 돌아오면 통째로 사라져 처음부터 다시 입력해야 했다. 계산 저장 시점에 사건개요에 함께
    // 저장하고, 사건을 다시 열면 아래 tcApplyOverviewToHeirs_가 그대로 불러온다.
    if (typeof inheritanceHeirs !== 'undefined' && inheritanceHeirs.some(function(h){ return h && (h.name || h.regNo); })) {
      updates.상속인목록 = inheritanceHeirs;
    }
    if (!Object.keys(updates).length) updates = null;
  }
  // [2026.09 버그수정] 이 함수의 원래 취지("사건개요서의 예상가액을 세액계산에서 실제로 쓴
  // 확실한 값으로 소급 정정")가 증여일·상속개시일에는 적용되지 않고 있었다 — 세액계산 중
  // 증여일·상속개시일을 고쳐도 사건에는 저장되지 않아, 다음에 이 사건을 다시 열면 옛 날짜가
  // 그대로 남아있고 법정신고기한도 옛 날짜 기준으로 계속 어긋난 채였다.
  var baseDateFieldId = TC_BASE_DATE_FIELD_BY_SEMOK_[tab];
  var baseDateEl = baseDateFieldId ? document.getElementById(baseDateFieldId) : null;
  var newBaseDate = (baseDateEl && baseDateEl.value && baseDateEl.value !== tcCurrentCase.기준일) ? baseDateEl.value : null;
  if (!updates && !newBaseDate) return;
  var overview = Object.assign({}, tcCurrentCase.사건개요 || {}, updates || {});
  var payload = { id: tcCurrentCase.id, 사건개요: overview, 기대수정일: tcCurrentCase.수정일 };
  if (newBaseDate) payload.기준일 = newBaseDate;
  // [2026.09 버그수정] 사건개요를 통째로 덮어쓰는 자동 동기화인데 잠금이 빠져 있었다 — 마침
  // 그 사이 사건처리 화면에서 사건개요서를 저장했다면 그 내용을 조용히 덮어쓸 수 있었다.
  callGas('work_update_case', payload).then(function(res){
    if (res.conflict){ showToast(res.message || '충돌이 발생했습니다. 새로고침합니다.', 'warning'); loadTcCases_(tcCurrentCase.id); return; }
    if (res.success === false) return;
    tcCurrentCase.사건개요 = overview;
    if (newBaseDate) { tcCurrentCase.기준일 = newBaseDate; tcLastOverviewValues_[baseDateFieldId] = newBaseDate; }
    if (res.case && res.case.수정일) tcCurrentCase.수정일 = res.case.수정일;
    var cached = tcCases.filter(function(c){ return c.id === tcCurrentCase.id; })[0];
    if (cached) { cached.사건개요 = overview; if (newBaseDate) cached.기준일 = newBaseDate; if (res.case && res.case.수정일) cached.수정일 = res.case.수정일; }
  }).catch(function(){});
}

// 사건처리 카드의 "🧮 세액계산 열기" 버튼에서 호출 — goToLawSearch_/goToCaseHandling_과 같은
// 패턴(goToView_가 showView를 태워 initTaxCalc를 자동으로 한 번 더 부르지만, lawsearch·
// casehandling도 마찬가지로 그 뒤에 preselectId로 자기 목록을 다시 불러온다).
// [2026.09 버그수정] 실사용 감사 지적 — script.html의 showView()는 'taxcalc'로 전환할 때마다
// 예외 없이 initTaxCalc()를 호출하고, initTaxCalc()는 그때마다 항상 loadTcCases_()를 부른다
// (한 번만 도는 초기화와 별개 — 확인 완료). 그래서 지금까지는 사건 목록을 매번 두 번(먼저
// tcSelectedId 없이, 곧바로 caseId로 다시) 불러왔다 — 결과가 우연히 항상 맞았을 뿐 불필요한
// 서버 호출이었다. tcSelectedId를 goToView_보다 먼저 정해두면 첫 번째 호출부터 바로 정확한
// 사건을 불러오므로 두 번째 호출이 필요 없다.
function goToTaxCalc_(caseId){
  tcSelectedId = caseId;
  if (typeof goToView_ === 'function') goToView_('taxcalc');
  else loadTcCases_(caseId);
}
</script>
