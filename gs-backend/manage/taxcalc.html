        '<div class="taxcalc-field"><label>증거일</label><input type="date" id="tfvEvidenceDate" min="1900-01-01" max="2099-12-31"></div>' +
        '<div class="taxcalc-field checkbox"><input type="checkbox" id="tfvRelatedParty"><label for="tfvRelatedParty">[매매만] 특수관계인과의 거래</label></div>' +
        '<div class="taxcalc-field"><label>감정가액 평균</label><input type="number" id="tfvAppraisalAvg" placeholder="원"><span class="taxcalc-field-help">감정만</span></div>' +
        '<div class="taxcalc-field"><label>보충적평가액</label><input type="number" id="tfvSupplementaryValue" placeholder="원"><span class="taxcalc-field-help">감정만</span></div>' +
      '</div>' +
      '<button type="button" class="taxcalc-run-btn" data-action="run-transfer-fair-market-value-recognition">시가 인정 여부 판정하기</button>' +
      '<div id="taxCalcTransferFmvResult"></div>' +
    '</div>';

  tcRestoreFlatFieldValues_(taxCalcTransferPane, flatFieldValues_);
  tcSyncTaxOfficeButtons_(taxCalcTransferPane);

  // 거주구분(양도인) — 값이 바뀌면 출국 특례 체크박스 노출 여부가 바뀌어야 하므로, 이 화면의
  // 다른 값 변경 시 처리(예: assetKind)와 같은 방식으로 전체를 다시 그린다(플랫 필드 값은
  // 위 tcRestoreFlatFieldValues_로 이미 보존됨).
  const trResidentEl = document.getElementById('trResident');
  if (trResidentEl) trResidentEl.addEventListener('change', renderTransferPane);

  // 저장해뒀던 입력값 다시 채워넣기(카드 추가/삭제로 다시 그릴 때 기존 입력 유지)
  transferAssets.forEach(function(vals, idx){
    const card = taxCalcTransferPane.querySelector('.taxcalc-asset[data-idx="' + idx + '"]');
    if (!card) return;
    Object.keys(vals).forEach(function(key){
      const el = card.querySelector('[data-field="' + key + '"]');
      if (!el) return;
      if (el.type === 'checkbox') el.checked = !!vals[key];
      else el.value = vals[key];
    });
    // [2026.09 버그수정] 세무사님 재점검("손과 눈으로 수동으로 시스템을 사용한다고 가정")
    // 중 실제로 재현됨 — 체크박스는 브라우저가 innerHTML을 다시 그려도 같은 id(예: "rr-0")의
    // 이전 체크 상태를 조용히 남겨두는 경우가 있다(text/date/number/select는 재현 안 됨,
    // 직접 확인함). 자산을 삭제하고 새 자산을 그 자리(같은 idx)에 추가하면, 새 자산 데이터엔
    // 그 특례 체크 여부가 아예 없는데(Object.keys에 안 잡힘) 화면엔 예전 자산의 체크 표시가
    // 그대로 남아 세무사가 손도 안 댄 특례가 체크된 것처럼 보일 수 있었다(실제 세액계산은
    // transferAssets 객체를 읽어 정확했지만, 화면 표시와 실제 값이 어긋나는 혼란을 유발함).
    // 카드 안의 체크박스 전부를 순회해 데이터에 없으면 명시적으로 false로 되돌린다.
    card.querySelectorAll('input[type="checkbox"][data-field]').forEach(function(el){
      el.checked = !!vals[el.dataset.field];
    });
    updatePropertyCardConditionalVisibility_(card, idx);
  });

  // 입력 변경 시 transferAssets 배열에 즉시 반영(계산 버튼 누를 때 다시 읽지 않아도 되게)
  // [2026.09 재설계] 계약 카드도 같은 .taxcalc-asset 카드 모양을 재사용하므로(.taxcalc-contract
  // 클래스가 추가로 붙음) 여기서는 반드시 제외해야 한다 — 계약 카드는 아래에서 따로 배선한다.
  taxCalcTransferPane.querySelectorAll('.taxcalc-asset:not(.taxcalc-contract)').forEach(function(card){
    const idx = numVal(card.dataset.idx);
    card.querySelectorAll('[data-field]').forEach(function(el){
      el.addEventListener('input', function(){
        const key = el.dataset.field;
        transferAssets[idx][key] = el.type === 'checkbox' ? el.checked : el.value;
        updatePropertyCardConditionalVisibility_(card, idx);
        if (key === 'transferDate') transferSellers.forEach(function(_, si){ recomputeTransferUnpaidDays(si); });
      });
      el.addEventListener('change', function(){
        const key = el.dataset.field;
        // [2026.09 신규] 계약 선택 드롭다운에서 "+ 새 계약 만들기"를 고르면 계약을 하나 만들고
        // 이 자산을 바로 연결한다 — 계약 총액은 계약 카드에서만 입력하므로 여기선 만들기만 한다.
        if ((key === 'acquisitionContractId' || key === 'transferContractId') && el.value === '__new__'){
          const kind = key === 'acquisitionContractId' ? 'acquisition' : 'transfer';
          const list = contractList_(kind);
          const c = { id: tcNewContractId_(), name: (kind === 'acquisition' ? '취득계약 ' : '양도계약 ') + tcPad2_(list.length + 1), totalPrice: 0, totalExpenseItems: [], externalMembers: [] };
          list.push(c);
          transferAssets[idx][key] = c.id;
          renderTransferPane();
          return;
        }
        transferAssets[idx][key] = el.type === 'checkbox' ? el.checked : el.value;
        // [2026.09 버그수정] 세무사님 재점검 중 발견 — isBusinessSuccessionAsset은 순수 UI
        // 게이트일 뿐(엔진은 businessSuccessionDeductionRatio>0·decedentAcquisitionValue 존재
        // 여부로만 판단, 이 체크박스 자체는 안 읽음)이라, 체크했다가 값을 입력하고 다시
        // 체크해제해도 세부 입력칸만 숨겨질 뿐 예전 값이 남아 계산에 계속 몰래 반영될 위험이
        // 있었다 — 체크해제 시 세부값을 실제로 지운다.
        if (key === 'isBusinessSuccessionAsset' && !transferAssets[idx][key]){
          ['businessSuccessionDeductionRatio', 'decedentAcquisitionValue', 'decedentAcquisitionDate'].forEach(function(k){
            transferAssets[idx][k] = '';
            const depEl = card.querySelector('[data-field="' + k + '"]');
            if (depEl) depEl.value = '';
          });
        }
        updatePropertyCardConditionalVisibility_(card, idx);
        if (key === 'assetKind' || key === 'hasMultipleBuildingSections') renderTransferPane(); // 지목(토지)↔층수·용도(건물), 단일↔층별입력으로 입력요소 자체가 바뀌므로 다시 그림
        if (key === 'buyerRelation') renderTransferPane(); // 특수관계 여부에 따라 시가 입력란·§35 연결버튼 표시가 바뀌므로 다시 그림
        if (key === 'isReconstructionRights' || key === 'isLandReplotment' || key === 'useConvertedRightsBaseAcquisitionPrice' || key === 'isCompletedNewHousing') renderTransferPane(); // 청산금 안내·버튼·환산가액 입력란·1세대1조합원입주권 체크박스 표시 여부가 바뀌므로 다시 그림
        // [2026.09 재설계] 계약 연결·계약 안분용 기준시가가 바뀌면 이 계약에 속한 "다른" 자산
        // 카드들의 몫도 같이 바뀌므로(안분 비율 재계산), 그 자산들 화면까지 갱신하려면 다시
        // 그리는 수밖에 없다 — renderTransferPane() 맨 앞에서 항상 recomputeAllContracts_()를
        // 먼저 실행해 최신 값으로 채운다.
        if (TC_CONTRACT_ALLOCATION_FIELDS_.indexOf(key) !== -1) renderTransferPane();
      });
    });
    // renderSellerAllocationSectionHtml_(공동양도인 지분 배분)의 입력칸 배선 — [data-dafield]와
    // 완전히 같은 패턴, transferSellers/sellerAllocations만 다르다.
    card.querySelectorAll('[data-slafield]').forEach(function(el){
      el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', function(){
        const allocIdx = numVal(el.closest('[data-slalloc-idx]').dataset.slallocIdx);
        const key = el.dataset.slafield;
        if (!Array.isArray(transferAssets[idx].sellerAllocations)) transferAssets[idx].sellerAllocations = [{}];
        transferAssets[idx].sellerAllocations[allocIdx][key] = el.value;
      });
    });
    card.querySelectorAll('[data-costfield]').forEach(function(el){
      el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', function(){
        const listKey = el.closest('[data-cost-list]').dataset.costList;
        const itemIdx = numVal(el.closest('[data-cost-idx]').dataset.costIdx);
        const key = el.dataset.costfield;
        if (!Array.isArray(transferAssets[idx][listKey])) transferAssets[idx][listKey] = [{}];
        transferAssets[idx][listKey][itemIdx][key] = el.value;
        if (key === 'receiptType') { renderTransferPane(); return; } // 증빙없음 경고 표시 여부가 바뀌므로 다시 그림
        const totalEl = card.querySelector('[data-cost-total="' + listKey + '"]');
        if (totalEl) totalEl.textContent = '합계 ' + won(computeCostItemsTotal_(transferAssets[idx][listKey]));
      });
    });
    // 층별 건물기준시가 입력행 — 구조·용도·면적이 바뀌면 이 자산뿐 아니라 같은 계약의 다른
    // 자산 몫도 다시 계산해야 하므로(안분 비율 변경), 비용항목처럼 국소 갱신하지 않고 항상
    // 전체를 다시 그린다(계약 안분용 기준시가 필드와 동일한 처리 방침).
    card.querySelectorAll('[data-ffield]').forEach(function(el){
      el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', function(){
        const ridx = numVal(el.closest('[data-floor-idx]').dataset.floorIdx);
        if (!Array.isArray(transferAssets[idx].buildingFloorRows)) transferAssets[idx].buildingFloorRows = [{}];
        transferAssets[idx].buildingFloorRows[ridx][el.dataset.ffield] = el.value;
        renderTransferPane();
      });
    });
  });
  // 계약 카드 자체의 입력칸(계약 이름·계약 전체 금액·계약 전체 비용내역·이 사건에 없는 자산의
  // 기준시가) — 값이 바뀌면 이 계약에 속한 모든 자산의 몫이 달라지므로 항상 다시 그린다.
  taxCalcTransferPane.querySelectorAll('.taxcalc-contract').forEach(function(card){
    const kind = card.dataset.contractKind;
    const contract = contractList_(kind).find(function(c){ return c.id === card.dataset.contractId; });
    if (!contract) return;
    card.querySelectorAll('[data-cfield]').forEach(function(el){
      el.addEventListener('change', function(){
        const key = el.dataset.cfield;
        contract[key] = el.type === 'checkbox' ? el.checked : el.value;
        // [2026.09 버그수정] 세무사님 재점검 중 발견 — hasExtendedDeadlineClaim도 순수 UI
        // 게이트라(연장특례 판정은 saleContractDate 등 값 자체로 하며, 이 체크박스는 엔진이
        // 읽지 않음), 체크해제 시 세부값을 실제로 지워야 숨겨진 뒤에도 몰래 반영되지 않는다.
        if (key === 'hasExtendedDeadlineClaim' && !contract[key]){
          contract.saleContractDate = '';
          contract.isLandTransactionPermitArea = false;
          contract.isPermitApplicationFiledByDeadline = false;
          contract.isPermitObtained = false;
        }
        renderTransferPane();
      });
    });
    card.querySelectorAll('[data-bfield]').forEach(function(el){
      el.addEventListener('change', function(){
        const bidx = numVal(el.closest('[data-buyer-idx]').dataset.buyerIdx);
        if (!Array.isArray(contract.buyers)) contract.buyers = [{}];
        contract.buyers[bidx][el.dataset.bfield] = el.value;
        renderTransferPane();
      });
    });
    card.querySelectorAll('[data-extfield]').forEach(function(el){
      el.addEventListener('change', function(){
        const ridx = numVal(el.closest('[data-ext-idx]').dataset.extIdx);
        contract.externalMembers[ridx][el.dataset.extfield] = el.value;
        renderTransferPane();
      });
    });
    card.querySelectorAll('[data-costfield]').forEach(function(el){
      if (el.closest('.taxcalc-asset:not(.taxcalc-contract)')) return; // 이 계약 안에 중첩된 자산 카드 소속 비용항목은 자산 쪽 배선이 처리한다
      el.addEventListener('change', function(){
        const listKey = el.closest('[data-cost-list]').dataset.costList;
        const itemIdx = numVal(el.closest('[data-cost-idx]').dataset.costIdx);
        if (!Array.isArray(contract[listKey])) contract[listKey] = [{}];
        contract[listKey][itemIdx][el.dataset.costfield] = el.value;
        renderTransferPane();
      });
    });
  });
  // [2026.09.23 재설계] trPaidDate/trUnpaidDays 배선과 초기 계산은 renderSellerRegistry()가
  // 양도인별로 전담한다(이 함수가 [data-slfield] 위임 리스너를 달고 매 양도인마다
  // recomputeTransferUnpaidDays(idx)를 호출) — 여기서 옛 flat id를 또 배선하면 idx 0에 리스너가
  // 두 번 붙는다.
  renderSellerRegistry();
  // [2026.09.23 버그수정] 관할세무서 버튼(양도인 주소칸과 함께 renderSellerRegistry()로 이동됨)이
  // 위 tcSyncTaxOfficeButtons_(3413번째 줄) 호출 시점엔 아직 DOM에 없었으므로(#sellerRegistry가
  // 그 뒤에야 채워짐), 여기서 한 번 더 불러줘야 저장된 관할세무서 이름이 버튼 글자에 반영된다.
  tcSyncTaxOfficeButtons_(taxCalcTransferPane);
  const stTransferDateEl = document.getElementById('stTransferDate');
  const stPaidDateEl = document.getElementById('stPaidDate');
  if (stTransferDateEl) stTransferDateEl.addEventListener('input', recomputeStockUnpaidDays);
  if (stPaidDateEl) stPaidDateEl.addEventListener('input', recomputeStockUnpaidDays);
  recomputeStockUnpaidDays();
  const oaTransferDateEl = document.getElementById('oaTransferDate');
  const oaPaidDateEl = document.getElementById('oaPaidDate');
  if (oaTransferDateEl) oaTransferDateEl.addEventListener('input', recomputeOverseasAssetUnpaidDays);
  if (oaPaidDateEl) oaPaidDateEl.addEventListener('input', recomputeOverseasAssetUnpaidDays);
  recomputeOverseasAssetUnpaidDays();
  wireMoneyCapHint_('stBasicDeductionUsed', 'stBasicDeductionUsedHint', 2500000);
  enhanceNumberInputs(taxCalcTransferPane);
  enhanceDateInputs(taxCalcTransferPane);
  enhanceRegNoInputs(taxCalcTransferPane);
  enhanceNameOnlyInputs(taxCalcTransferPane);
}

// [2026.09 전면 재설계] 세무사님 재점검 지시 — "확인할 항목들을 몽땅 화면에 덤프하지 말고
// 체크했을 때만 세부항목이 뜨도록 하라." 자산 카드의 재건축·환지·8년자경농지·등록임대주택·
// 연금계좌공제·수용감면·이월과세·신축주택감면 등 특례 10여 개가 전부 펼쳐진 채로(체크 여부와
// 무관하게 세부 입력칸까지 전부 보임) 떠 있어서 자산 카드 하나에 필드가 100개 넘게 나오는
// 문제가 있었다. data-show-if="<필드명>"이 붙은 입력칸은 그 필드명의 현재 값이 참(체크됨,
// 또는 select에 값이 선택됨)일 때만 보이도록 하나의 함수로 통일한다 — 체크박스든 select든
// 판정 방식이 같다(빈 문자열·false는 숨김, 그 외는 표시). 예전엔 "1세대1주택" 체크박스
// 하나만 이런 전용 함수(updateOneHouseVisibility)로 처리했는데, 이제 모든 특례가 같은
// 패턴을 쓰므로 하나의 범용 함수로 합친다.
function updatePropertyCardConditionalVisibility_(card, idx){
  const a = transferAssets[idx];
  if (!a) return;
  card.querySelectorAll('[data-show-if]').forEach(function(field){
    field.style.display = a[field.dataset.showIf] ? '' : 'none';
  });
}


// [2026.09.23 신규] 공동양도인 지원 — collectTransferInput이 반환하는 필드 중 "원 단위 금액"만
// 골라 지분율만큼 스케일한다(양도가액·취득가액·필요경비·각종 기준시가·재건축 권리가액/청산금·
// 이월과세 관련 금액 등 — 공동소유 자산 하나의 총액을 지분대로 나눈 것이 각자의 몫이므로).
// 거주연수·다주택수·면적·비율 같은 "금액이 아닌 숫자"나 날짜·플래그·문자열은 지분과 무관한
// 사실이므로 이 목록에 넣지 않고 그대로 둔다(run-transfer 핸들러 참고).
var TR_MONEY_FIELDS_TO_SCALE_ = [
  'fairMarketValueForGiftCheck', 'acquisitionStandardPriceForExpense', 'comparableTransactionPrice',
  'appraisalValue', 'transferStandardPriceForConversion', 'depreciationDeductedAsBusinessExpense',
  'transferPrice', 'acquisitionPrice', 'necessaryExpenses', 'acquisitionStandardPrice',
  'registrationStandardPrice', 'transferStandardPrice', 'downContractPriceDifference',
  'rightsValue', 'settlementPaid', 'originalAssetAcquisitionPrice', 'originalNecessaryExpenses',
  'originalAcquisitionStandardPrice', 'approvalDateStandardPrice', 'convertedBuildingAcquisitionValueForPenalty',
  'donorAcquisitionPrice', 'donorNecessaryExpenses', 'doneeOwnAcquisitionPrice', 'doneeOwnNecessaryExpenses',

  'nhTransferStandardPrice', 'uhFiveYearMarkValue', 'uhAcquisitionStandardPrice', 'uhFiveYearStandardPrice',
  'uhTransferStandardPrice', 'pensionAccountContribution', 'decedentAcquisitionValue'
];
function collectTransferInput(vals){
  const transferPrice = numVal(vals.transferPrice) || 0;
  // [2026.09 버그수정] 취득가액 순차적용(매매사례가액→감정가액→환산취득가액→취득당시기준시가)을
  // 예전엔 여기서 미리 계산해서 확정된 숫자만 엔진에 넘겼다 — 그런데 계산엔진
  // (calculateTransferTaxSingleJS/transferAssetCore)도 완전히 같은 순차적용 로직을 독자적으로
  // 갖고 있어서(§114의2 환산취득가액가산세 자동판정, 개산공제 자동적용까지 포함한 더 완전한
  // 버전), 여기서 먼저 acquisitionPrice를 확정해버리면 엔진의 "!t.acquisitionPrice" 판정이
  // 항상 거짓이 되어 엔진의 자체 판정이 통째로 죽은 코드가 됐다 — 그 결과 환산취득가액·
  // 감정가액으로 취득가액을 정해도 환산취득가액가산세(5%)가 조용히 0으로 계산됐다. 이제 이
  // 순차적용은 엔진 한 곳에서만 하도록, 원본 값을 그대로 넘긴다.
  let acquisitionPrice = numVal(vals.acquisitionPrice) || 0;
  let necessaryExpenses = computeCostItemsTotal_(vals.acquisitionExpenseItems) + computeCostItemsTotal_(vals.transferExpenseItems);
  // 관리처분인가 이후 조합원입주권·신축주택 양도(소득세법시행령§166①②③) — 취득가액을 단순 대체하는
  // 대신, tax-calc.js의 transferAssetCore가 관리처분계획등인가전·인가후 양도차익을 나눠 각각 다른
  // 장기보유특별공제를 적용하도록 원시 데이터(권리가액·청산금·기존건물 관련 필드)를 그대로 넘긴다.
  // 이때 필요경비는 최종양도분(transferExpenseItems)만 쓰고, 기존건물분은 별도 입력칸을 쓴다
  // (아래 originalNecessaryExpenses) — 취득비용 내역(acquisitionExpenseItems)은 무시한다.
  if (vals.isReconstructionRights){
    necessaryExpenses = computeCostItemsTotal_(vals.transferExpenseItems);
  }
  // 환지처분 — 취득가액은 환지 전 종전토지 취득가액에 환지청산금 납부액(면적 증가분 추가취득)을
  // 더한 금액으로 대체된다(청산금 환급분은 별도 거래로 환지처분공고일에 과세). 취득일은 환지 전
  // 종전토지 취득일을 그대로 승계한다(취득시기 의제 없음).
  if (vals.isLandReplotment){
    const origPrice = numVal(vals.originalAssetAcquisitionPrice) || 0;
    const replotPaid = numVal(vals.replotmentSettlementPaid) || 0;
    if (origPrice > 0 || replotPaid > 0) acquisitionPrice = origPrice + replotPaid;
  }
  return {
    assetType: vals.assetType || 'other',
    buyerName: vals.buyerName || '',
    buyerRegNo: vals.buyerRegNo || '',
    buyerRelation: vals.buyerRelation || 'none',
    fairMarketValueForGiftCheck: numVal(vals.fairMarketValueForGiftCheck) || 0,
    useEstimatedNecessaryExpense: !!vals.useEstimatedNecessaryExpense,
    acquisitionStandardPriceForExpense: numVal(vals.acquisitionStandardPriceForExpense) || 0,
    // [2026.09 버그수정] 엔진이 자체적으로 취득가액 순차적용을 하려면 이 세 원본 필드가
    // 그대로 필요하다 — 예전엔 여기서 미리 계산만 하고 원본은 버려서 엔진에 전달되지 않았다.
    comparableTransactionPrice: numVal(vals.comparableTransactionPrice) || 0,
    appraisalValue: numVal(vals.appraisalValue) || 0,
    transferStandardPriceForConversion: numVal(vals.transferStandardPriceForConversion) || 0,
    depreciationDeductedAsBusinessExpense: numVal(vals.depreciationDeductedAsBusinessExpense) || 0,
    transferPrice: transferPrice,
    acquisitionPrice: acquisitionPrice,
    necessaryExpenses: necessaryExpenses,
    acquisitionDate: vals.acquisitionDate || '',
    transferDate: vals.transferDate || '',
    isOneHouseOneFamily: !!vals.isOneHouseOneFamily,
    residenceYears: numVal(vals.residenceYears) || 0,
    isTransferorResident: vals.isTransferorResident !== false,
    isNonResidentTwoYearException: !!vals.isNonResidentTwoYearException,
    isAdjustedArea: !!vals.isAdjustedArea,
    multiHouseCount: numVal(vals.multiHouseCount) || 0,
    saleContractDate: vals.saleContractDate || '',
    isLandTransactionPermitArea: !!vals.isLandTransactionPermitArea,
    isPermitApplicationFiledByDeadline: !!vals.isPermitApplicationFiledByDeadline,
    isPermitObtained: !!vals.isPermitObtained,
    isExtendedDeadlineRegion: !!vals.isExtendedDeadlineRegion,
    isNonBusinessLand: !!vals.isNonBusinessLand,
    isUnregisteredTransfer: !!vals.isUnregisteredTransfer,
    isEightYearFarmland: !!vals.isEightYearFarmland,
    isLivestockLandExempt: !!vals.isLivestockLandExempt,
    isLivestockRestartedWithin5Years: !!vals.isLivestockRestartedWithin5Years,
    isLivestockRestartException: !!vals.isLivestockRestartException,
    isFisheryLandExempt: !!vals.isFisheryLandExempt,
    isFarmlandSubstitutionExempt: !!vals.isFarmlandSubstitutionExempt,
    isFarmlandSubstitutionRequirementFailed: !!vals.isFarmlandSubstitutionRequirementFailed,
    isForestManagementExempt: !!vals.isForestManagementExempt,
    isNewBuildingWithin5Years: !!vals.isNewBuildingWithin5Years,
    convertedBuildingAcquisitionValueForPenalty: numVal(vals.convertedBuildingAcquisitionValueForPenalty) || 0,
    rentalSpecialType: vals.rentalSpecialType || '',
    rentalYears: numVal(vals.rentalYears) || 0,
    acquisitionStandardPrice: numVal(vals.acquisitionStandardPrice) || 0,
    registrationStandardPrice: numVal(vals.registrationStandardPrice) || 0,
    transferStandardPrice: numVal(vals.transferStandardPrice) || 0,
    pensionAccountContribution: numVal(vals.pensionAccountContribution) || 0,
    pensionContributionDate: vals.pensionContributionDate || '',
    isBasicPensionRecipient: !!vals.isBasicPensionRecipient,
    isOneHouseOrNoHouseHousehold: !!vals.isOneHouseOrNoHouseHousehold,
    isPensionWithdrawnWithin5Years: !!vals.isPensionWithdrawnWithin5Years,
    compensationType: vals.compensationType || '',
    publicNoticeDate: vals.publicNoticeDate || '',
    isBondPledgeBreached: !!vals.isBondPledgeBreached,
    downContractPriceDifference: numVal(vals.downContractPriceDifference) || 0,
    isReconstructionRights: !!vals.isReconstructionRights,
    isCompletedNewHousing: !!vals.isCompletedNewHousing,
    isOneMemberRightOneFamily: !!vals.isOneMemberRightOneFamily,
    isOriginalMember: !vals.isSuccessorMember,
    managementDispositionDate: vals.managementDispositionDate || '',
    rightsValue: numVal(vals.rightsValue) || 0,
    settlementPaid: numVal(vals.settlementPaid) || 0,
    originalAssetAcquisitionPrice: numVal(vals.originalAssetAcquisitionPrice) || 0,
    originalNecessaryExpenses: numVal(vals.originalNecessaryExpenses) || 0,
    useConvertedRightsBaseAcquisitionPrice: !!vals.useConvertedRightsBaseAcquisitionPrice,
    originalAcquisitionStandardPrice: numVal(vals.originalAcquisitionStandardPrice) || 0,
    approvalDateStandardPrice: numVal(vals.approvalDateStandardPrice) || 0,
    businessSuccessionDeductionRatio: numVal(vals.businessSuccessionDeductionRatio) || 0,
    decedentAcquisitionValue: vals.decedentAcquisitionValue !== '' && vals.decedentAcquisitionValue != null ? numVal(vals.decedentAcquisitionValue) : null,
    decedentAcquisitionDate: vals.decedentAcquisitionDate || '',
    // [2026.09 신규] 이월과세(§97의2) — 예전엔 별도 계산기에서 결과를 손으로 옮겨 입력해야
    // 했는데, 이제 이 필드들을 채워두면 calculateTransferTaxMultiJS가 합산 계산 전에 이 거래
    // 단독 기준으로 적용여부를 자동 판정해 취득가액·취득일·필요경비에 반영한다.
    donorRelation: vals.donorRelation || '',
    giftReceivedDate: vals.giftReceivedDate || '',
    isEminentDomainExcludedFromCarryover: !!vals.isEminentDomainExcludedFromCarryover,
    donorAcquisitionPrice: numVal(vals.donorAcquisitionPrice) || 0,
    donorAcquisitionDate: vals.donorAcquisitionDate || '',
    donorNecessaryExpenses: numVal(vals.donorNecessaryExpenses) || 0,
    doneeOwnAcquisitionPrice: numVal(vals.doneeOwnAcquisitionPrice) || 0,
    doneeOwnNecessaryExpenses: numVal(vals.doneeOwnNecessaryExpenses) || 0,
    giftTaxPaid: numVal(vals.giftTaxPaid) || 0,
    giftTaxableValue: numVal(vals.giftTaxableValue) || 0,
    // [2026.09 신규] 신축주택·미분양주택 감면(조특법§99 계열) — 이 필드가 채워지면
    // calculateTransferTaxMultiJS가 합산 계산 전에 감면분을 자동으로 양도소득금액에서 뺀다.
    newHouseReductionProvision: vals.newHouseReductionProvision || '',
    nhIsHighPriceHouseExcluded: !!vals.nhIsHighPriceHouseExcluded,
    nhIsPriceOrAreaQualified: !!vals.nhIsPriceOrAreaQualified,

    uhSect986ItemType: vals.uhSect986ItemType || '',
    uhExclusiveAreaSqm: vals.uhExclusiveAreaSqm === '' || vals.uhExclusiveAreaSqm == null ? '' : numVal(vals.uhExclusiveAreaSqm),
    uhFiveYearMarkValue: numVal(vals.uhFiveYearMarkValue) || 0,
    uhAcquisitionStandardPrice: numVal(vals.uhAcquisitionStandardPrice) || 0,
    uhFiveYearStandardPrice: numVal(vals.uhFiveYearStandardPrice) || 0,
    uhTransferStandardPrice: numVal(vals.uhTransferStandardPrice) || 0,
    // [2026.09 신규] 공공매입임대주택 건설목적 토지양도 감면(조특법§97의9) — 세액 10% 감면
    isPublicRentalHousingLand: !!vals.isPublicRentalHousingLand,
    // [2026.09.23 신규] 국가양도산지(§85의10, 세액 10% 감면) — 예전 별도 계산기(nf) 흡수.
    isNationalForestLandReduction: !!vals.isNationalForestLandReduction,
    nfIsUrbanArea: !!vals.nfIsUrbanArea,
    // [2026.09.23 신규] 구조조정대상 부동산(§43) — 예전 별도 계산기(rp) 흡수. 5년이내=세액
    // 50%감면, 5년초과=소득금액 일부감면(공통 감면분기는 아래 뒷단에서 처리).
    isRestructuringPropertyReduction: !!vals.isRestructuringPropertyReduction,
    rpFiveYearMarkValue: numVal(vals.rpFiveYearMarkValue) || 0,
    rpAcquisitionStandardPrice: numVal(vals.rpAcquisitionStandardPrice) || 0,
    rpFiveYearStandardPrice: numVal(vals.rpFiveYearStandardPrice) || 0,
    rpTransferStandardPrice: numVal(vals.rpTransferStandardPrice) || 0,
    // [2026.09.23 신규] 장기임대주택 등(§97/§97의2/§97의5) — 예전 별도 계산기(lr) 흡수.
    longTermRentalHouseProvision: vals.longTermRentalHouseProvision || '',
    lrSubType: vals.lrSubType || '',
    lrRegistrationValue: numVal(vals.lrRegistrationValue) || 0,
    lrAcquisitionStandardPrice: numVal(vals.lrAcquisitionStandardPrice) || 0,
    lrRegistrationStandardPrice: numVal(vals.lrRegistrationStandardPrice) || 0,
    lrTransferStandardPrice: numVal(vals.lrTransferStandardPrice) || 0
  };
}

// 거래 1건의 계산근거(산출과정)를 [별지 84호서식] "양도소득계산명세" 스타일로 단계별 수식+실제금액 텍스트로 만든다.
// calculateTransferTaxSingleJS 결과 하나만 보고 만들므로, 다건 합산의 "합산과세표준→산출세액" 단계는 별도로 renderTransferResult에서 덧붙인다.
function buildTransferCalcBasisLines(r){
  const lines = [];
  if (r.error) { lines.push('오류: ' + r.error); return lines; }
  if (r.미등기양도 || (r.입력값 && r.입력값.미등기양도)) {
    lines.push('미등기양도자산 — 장기보유특별공제·기본공제 배제');
    lines.push('양도차익 = 양도가액 - 취득가액 - 필요경비 = ' + won(r.입력값.양도가액) + ' - ' + won(r.입력값.취득가액) + ' - ' + won(r.입력값.필요경비) + ' = ' + won(r.양도차익));
    lines.push('산출세액 = 양도차익 × 70% = ' + won(r.산출세액));
    lines.push('지방소득세(10%) = ' + won(r.지방소득세));
    lines.push('납부세액 합계 = ' + won(r.납부세액_합계));
    return lines;
  }
  if (r.다운계약서_비과세배제) {
    lines.push('1세대1주택 비과세 대상이나, 다운계약서(업계약서) 등 거짓 계약으로 비과세를 적용받은 것으로 전제(소득세법§91②)');
    lines.push('비과세 미적용시 산출세액(지방소득세 포함) = ' + won(r.비과세미적용시_산출세액));
    lines.push('계약서·실거래 차액 = ' + won(r.계약서_실거래_차액));

        html += '<div>' + label + ' — 국가양도산지감면(§85의10) 미적용(' + (n.사유 || '') + ')</div>';
      } else if (n.구분 === '취득가액산정'){
        html += '<div>' + label + ' — ' + n.특례 + '</div>';
      } else {
        const parts = [];
        if (n.특례) parts.push(n.특례);
        if (n.감면액) parts.push('감면 ' + won(n.감면액));
        if (n.추징액) parts.push('추징 ' + won(n.추징액));
        html += '<div>' + label + ' (' + n.구분 + ') — ' + parts.join(', ') + '</div>';
      }
    });
    html += '</div>';
  }
  html += '<div class="taxcalc-result-note">' + r.안내 + '</div>';
  html += '<div class="taxcalc-result-note">이 결과는 참고용 개산이며, 실제 신고 전 홈택스 모의계산으로 재검증하세요.</div>';
  html += '</div>';
  return html;
}

        // 증여자가 2명 이상이고 관계가 직계존속일 때만 노출 — 같은 값을 적은 증여자들끼리
        // (같은 수증인 대상 한정) run-gift에서 하나로 묶어 계산한다.
        (giftDonors.length > 1 && giftDonorEffectiveRelation_(d) === '직계존속' ? '<div class="taxcalc-field"><label>동일인 그룹(§47②)</label><input type="text" data-dfield="sameAsGroup" placeholder="예: 부부" value="' + (d.sameAsGroup || '').replace(/"/g, '&quot;') + '"><span class="taxcalc-field-help">배우자와 같은 증여로 합산할 경우 같은 값을 입력(같은 수증인 대상만 합산됩니다). 비워두면 이 증여자 혼자 독립 계산</span></div>' : '') +
      '</div>' +
      (giftDonorGroupPrimaryIdx_(idx) !== idx ? '<div class="taxcalc-result-note" style="margin-top:6px;">⚠ 동일인 그룹 대표는 증여자 ' + tcPad2_(giftDonorGroupPrimaryIdx_(idx) + 1) + '입니다 — 아래 인수채무·10년합산·신고상태 입력은 계산에 반영되지 않고 대표 카드의 값만 쓰입니다(증여재산가액만 이 카드 몫으로 합산됨)</div>' : '') +
      '<div class="taxcalc-asset-head" style="margin-top:10px;"><b>증여재산가액 · 부담부증여(이 증여자 몫)</b></div>' +

          // [2026.09.23] 수증인이 2명 이상이면 이 증여자의 증여가액이 수증인별로 나뉘어야 하므로
          // 단일 숫자 입력은 의미가 없다 — 위 재산평가 자산목록의 (증여자,수증인) 배분에서
          // 자동으로만 계산되고 직접 입력할 수 없다(입력칸을 남겨두면 계산에 안 쓰이는데도

        '<div class="taxcalc-field checkbox"><input type="checkbox" data-dfield="debtObjProven"' + (d.debtObjProven ? ' checked' : '') + '><label>배우자·직계존비속간 증여일 때만 — 위 채무가 객관적으로 인수 사실이 인정됨(§47③ 단서)</label></div>' +
        '<div class="taxcalc-field"><label>10년내 동일인 기증여합산액</label><input type="number" data-dfield="priorAmount"' + idOf('giftPriorAmount') + ' placeholder="원" value="' + (d.priorAmount || '') + '"><span class="taxcalc-field-help">없으면 비움 — 동일인에는 직계존속 증여시 그 배우자도 포함됩니다</span></div>' +

        '<div class="taxcalc-field checkbox"><input type="checkbox" data-dfield="genSkipOver2B"' + (d.genSkipOver2B ? ' checked' : '') + '><label>세대생략증여재산가액 20억 초과(수증자 미성년 여부는 위 주민등록번호로 자동판정)</label></div>' +
        '<div class="taxcalc-field"><label>세대생략(조부모 등)분 증여재산가액</label><input type="number" data-dfield="genSkipAmount" placeholder="원" value="' + (d.genSkipAmount || '') + '"><span class="taxcalc-field-help">전액이면 비움</span></div>' +
        '<div class="taxcalc-field"><label>기증여분 중 이미 납부한 세대생략 할증과세액</label><input type="number" data-dfield="genSkipPriorPaid" placeholder="원" value="' + (d.genSkipPriorPaid || '') + '"><span class="taxcalc-field-help">없으면 비움</span></div>' +
        '<div class="taxcalc-field checkbox"><input type="checkbox" data-dfield="genSkipSubstitute"' + (d.genSkipSubstitute ? ' checked' : '') + '><label>세대생략이 대습증여(직계비속의 사망으로 그 자녀가 대신 증여받음, §57①단서 — 할증 면제)로 인한 것임</label></div>' +
      '</div>' +

        '<div class="taxcalc-field"><button type="button" class="taxcalc-run-btn" data-action="send-debt-to-transfer" data-idx="' + idx + '">인수채무분을 양도세 거래로 보내기</button></div>' +
      '</div>' +
      '<div class="taxcalc-asset-head" style="margin-top:10px;"><b>신고 상태 · 가산세(이 증여자 몫)</b></div>' +
      '<div class="taxcalc-grid">' +
        '<div class="taxcalc-field"><label>신고 상태</label><select data-dfield="filingStatus"><option value="ontime"' + (d.filingStatus !== 'unreported' && d.filingStatus !== 'underreported' ? ' selected' : '') + '>정상(기한내) 신고</option><option value="unreported"' + (d.filingStatus === 'unreported' ? ' selected' : '') + '>무신고</option><option value="underreported"' + (d.filingStatus === 'underreported' ? ' selected' : '') + '>과소신고</option></select></div>' +
        '<div class="taxcalc-field checkbox"><input type="checkbox" data-dfield="reportedInTime"' + (d.reportedInTime !== false ? ' checked' : '') + '><label>(정상신고일 때) 법정신고기한 내 — 신고세액공제 3%</label></div>' +

        '<div class="taxcalc-field"><label>세무서 고지 후 체납 — 지정납부기한 경과 개월수(있으면)</label><input type="number" data-dfield="monthsAfterDesignated" placeholder="0" value="' + (d.monthsAfterDesignated || '') + '"></div>' +

      '</div>' +
    '</div>';
  }).join('');
  container.innerHTML = rowsHtml +
    '<button type="button" class="taxcalc-add-asset" data-action="add-donor-row" style="margin-top:8px;">+ 증여자 추가</button>';

  container.querySelectorAll('[data-dfield]').forEach(function(el){
    el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', function(){
      const row = el.closest('[data-donor-idx]');
      const idx = numVal(row.dataset.donorIdx);
      const key = el.dataset.dfield;
      giftDonors[idx][key] = el.type === 'checkbox' ? el.checked : el.value;
      if (key === 'relation'){
        const opt = el.selectedOptions[0];
        giftDonors[idx].genSkip = opt && opt.dataset.genskip || '0';
      }
      if (key === 'paidDate') recomputeGiftUnpaidDays(idx);
      if (key === 'name' || key === 'relation' || key === 'sameAsGroup') { renderGiftDonorRegistry(); return; } // 제목·자산배분 드롭다운 라벨·동일인그룹 안내 갱신
    });
  });
  enhanceNumberInputs(container);
  enhanceDateInputs(container);
  enhanceRegNoInputs(container);
  enhanceNameOnlyInputs(container);
  giftDonors.forEach(function(_, idx){ recomputeGiftUnpaidDays(idx); });
}
// renderGiftDonorRegistry()의 수증인 버전 — [2026.09.23 신규]. 증여자와 달리 수증인 카드에는

        (idx > 0 ? '<button type="button" class="taxcalc-del-asset" data-action="del-donee-row" data-idx="' + idx + '">✕ 수증인 삭제</button>' : '') +
        '<button type="button" class="taxcalc-add-asset-inline" data-action="add-donee-row">+ 수증인 추가</button>' +
      '</span></div>' +
      '<div class="taxcalc-grid">' +
        '<div class="taxcalc-field"><label>성명</label><input type="text" data-dnfield="name"' + idOf('giftDoneeName') + ' data-nameonly="1" value="' + (dn.name || '').replace(/"/g, '&quot;') + '"></div>' +
        '<div class="taxcalc-field"><label>주민등록번호</label><input type="text" data-dnfield="regNo" id="giftDoneeRegNo' + suf + '" placeholder="000000-0000000" data-regno="1" value="' + (dn.regNo || '').replace(/"/g, '&quot;') + '"></div>' +

function renderGiftResult(results){
  const box = document.getElementById('taxCalcGiftResult');
  // 하위호환: 예전처럼 결과 객체 하나만 넘어오면 배열로 감싸서 그대로 처리한다.
  const list = Array.isArray(results) ? results : [{ donorIdxs: [0], doneeIdx: 0, result: results }];
  let html = list.map(function(item, idx){
    // [2026.09.23] 동일인그룹으로 묶인 결과는 증여자 여러 명을 한 줄에 표시하고, 수증인이
    // 2명 이상이면 어느 수증인 몫인지도 라벨에 밝힌다.
    const donorIdxs = item.donorIdxs || [0];
    const donorLabel = donorIdxs.map(function(di){
      const d = giftDonors[di] || {};
      return '증여자 ' + tcPad2_(di + 1) + (d.name ? '(' + escapeHtml(d.name) + ')' : '');
    }).join('·') + (donorIdxs.length > 1 ? ' [동일인그룹]' : '');
    const donee = giftDonees[item.doneeIdx || 0] || {};
    const label = donorLabel + (giftDonees.length > 1 ? ' → 수증인 ' + tcPad2_((item.doneeIdx || 0) + 1) + (donee.name ? '(' + escapeHtml(donee.name) + ')' : '') : '');
    return renderOneGiftResultHtml_(item.result, idx, label);
  }).join('');
  if (list.length > 1 && list.every(function(item){ return !item.result.error; })){
    const totalTax = list.reduce(function(s, item){ return s + (numVal(item.result.납부세액) || 0); }, 0);
    html += '<div class="taxcalc-result" style="margin-top:10px;">' + taxCalcResultRow('증여자 전체 합계 납부세액', won(totalTax), { total: true }) + '</div>';
  }
  html += '<div class="taxcalc-result-note" style="margin-top:10px;">납부지연가산세율(1일 10만분의22)은 시행령 개정으로 바뀔 수 있습니다. 창업자금·가업승계 증여세 과세특례(조특법§30의5·6)를 적용받는 경우 이 계산이 아니라 아래 별도의 특례세율 증여세 계산기를 쓰세요. 실제 신고 전 홈택스 모의계산으로 재검증하세요.</div>';
  box.innerHTML = html;
}

// 자동 구분·합산한다(§14①3호는 이 둘의 한도가 서로 다르므로 반드시 구분해서 집계해야 한다).
let inheritanceFuneralItems = [{}];
function computeFuneralTotals_(items){
  const list = Array.isArray(items) ? items : [];
  const general = list.filter(function(it){ return it.category !== 'niche'; }).reduce(function(s, it){ return s + (numVal(it.amount) || 0); }, 0);
  const niche = list.filter(function(it){ return it.category === 'niche'; }).reduce(function(s, it){ return s + (numVal(it.amount) || 0); }, 0);
  return { general: general, niche: niche };
}

// 처분재산 한 줄을 1년기준·2년기준 각각 별도로 계산해 화면에 실시간으로 보여준다(상증세법§15,
// 시행령§11④ 산식의 중간 단계를 그대로 노출) — 순인출액=총인출-내돈입금액, 미소명액=순인출액-소명액,
// 문턱=MIN(순인출액×20%, 2억원). 시행령§11④ 원문: 미소명액이 문턱 "미만"이면 추정하지 않음(0),
// 문턱 "이상"이면 문턱금액을 "차감한 금액"을 추정한다 — 즉 문턱을 넘어도 미소명액 전액이 아니라
// 그 차액만 산입된다. 최종 산입액은 1년/2년 중 큰 금액.
function computeDisposalBasisPresumed_(amount, selfDeposit, explained, thresholdAmount){
  const net = Math.max(0, numVal(amount) - numVal(selfDeposit));
  if (net < thresholdAmount) return { net: net, unexplained: 0, cutoff: 0, presumed: 0, meets: false };
  const unexplained = Math.max(0, net - numVal(explained));
  const cutoff = Math.min(net * 0.2, 200000000);
  return { net: net, unexplained: unexplained, cutoff: cutoff, presumed: (unexplained >= cutoff ? unexplained - cutoff : 0), meets: true };
}
function computeDisposalItemPresumedAmount_(item){
  const oneYear = computeDisposalBasisPresumed_(item.oneYearAmount, item.oneYearSelfDeposit, item.oneYearExplained, 200000000);
  const twoYear = computeDisposalBasisPresumed_(item.twoYearAmount, item.twoYearSelfDeposit, item.twoYearExplained, 500000000);
  return Math.max(oneYear.presumed, twoYear.presumed);
}
function updateDisposalItemComputedHints_(row, item){
  const oneYear = computeDisposalBasisPresumed_(item.oneYearAmount, item.oneYearSelfDeposit, item.oneYearExplained, 200000000);
  const twoYear = computeDisposalBasisPresumed_(item.twoYearAmount, item.twoYearSelfDeposit, item.twoYearExplained, 500000000);
  const oneYearEl = row.querySelector('[data-dcomputed="oneYear"]');
  const twoYearEl = row.querySelector('[data-dcomputed="twoYear"]');
  const finalEl = row.querySelector('[data-dcomputed="final"]');
  if (oneYearEl) oneYearEl.textContent = !oneYear.meets ? '① 1년기준(2억) 미충족 — 산입 대상 아님' :
    '① 순인출 ' + won(oneYear.net) + ' · 미소명 ' + won(oneYear.unexplained) + ' · 문턱 ' + won(oneYear.cutoff) + ' → 산입액 ' + won(oneYear.presumed);
  if (twoYearEl) twoYearEl.textContent = !twoYear.meets ? '② 2년기준(5억) 미충족 — 산입 대상 아님' :
    '② 순인출 ' + won(twoYear.net) + ' · 미소명 ' + won(twoYear.unexplained) + ' · 문턱 ' + won(twoYear.cutoff) + ' → 산입액 ' + won(twoYear.presumed);
  if (finalEl) finalEl.textContent = '이 재산종류의 추정상속재산 산입액(①·② 중 큰 금액) = ' + won(Math.max(oneYear.presumed, twoYear.presumed));
}

      (idx > 0 ? '<button type="button" class="taxcalc-del-asset" data-action="del-disposal-item" data-idx="' + idx + '">✕ 처분 삭제</button>' : '') +

function renderFuneralItemsList(){
  const container = document.getElementById('ihFuneralItemsList');
  if (!container) return;
  const rowsHtml = inheritanceFuneralItems.map(function(item, idx){
    return '<div class="taxcalc-grid" data-funeral-idx="' + idx + '" style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);">' +
      '<div class="taxcalc-field"><label>지급처</label><input type="text" data-ffield="payee" value="' + (item.payee || '').replace(/"/g, '&quot;') + '" placeholder="예: OO장례식장"></div>' +
      '<div class="taxcalc-field"><label>지급처 사업자번호</label><input type="text" data-ffield="bizNo" value="' + (item.bizNo || '').replace(/"/g, '&quot;') + '" placeholder="123-45-67890"><button type="button" class="taxcalc-ai-btn" data-action="check-bizno" style="margin-top:4px;">🔍 확인</button><span class="taxcalc-result-note" data-bizno-result style="margin:2px 0 0;"></span></div>' +
      '<div class="taxcalc-field"><label>구분</label><select data-ffield="category"><option value="general"' + (item.category !== 'niche' ? ' selected' : '') + '>일반 장례비용</option><option value="niche"' + (item.category === 'niche' ? ' selected' : '') + '>봉안시설·자연장지 비용</option></select></div>' +
      '<div class="taxcalc-field"><label>금액</label><input type="number" data-ffield="amount" placeholder="원" value="' + (item.amount || '') + '"></div>' +
      (idx > 0 ? '<button type="button" class="taxcalc-del-asset" data-action="del-funeral-item" data-idx="' + idx + '">✕ 장례비용 삭제</button>' : '') +
    '</div>';
  }).join('');
  const totals = computeFuneralTotals_(inheritanceFuneralItems);
  const generalDeduction = totals.general > 0 ? Math.min(Math.max(totals.general, 5000000), 10000000) : 5000000;
  const nicheDeduction = Math.min(totals.niche, 5000000);
  container.innerHTML = rowsHtml +
    '<button type="button" class="taxcalc-add-asset" data-action="add-funeral-item" style="margin-top:8px;">+ 장례비용 추가</button>' +
    '<div class="taxcalc-result-note" data-funeral-total="1">일반분 합계 ' + won(totals.general) + '(공제 ' + won(generalDeduction) + ') · 봉안시설분 합계 ' + won(totals.niche) + '(공제 ' + won(nicheDeduction) + ') · 공제액 합계 ' + won(generalDeduction + nicheDeduction) + '</div>';

  container.querySelectorAll('[data-ffield]').forEach(function(el){
    el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', function(){
      const row = el.closest('[data-funeral-idx]');
      const idx = numVal(row.dataset.funeralIdx);
      const key = el.dataset.ffield;
      inheritanceFuneralItems[idx][key] = el.value;
      const t = computeFuneralTotals_(inheritanceFuneralItems);
      const gd = t.general > 0 ? Math.min(Math.max(t.general, 5000000), 10000000) : 5000000;
      const nd = Math.min(t.niche, 5000000);
      const totalEl = container.querySelector('[data-funeral-total]');
      if (totalEl) totalEl.textContent = '일반분 합계 ' + won(t.general) + '(공제 ' + won(gd) + ') · 봉안시설분 합계 ' + won(t.niche) + '(공제 ' + won(nd) + ') · 공제액 합계 ' + won(gd + nd);
    });
  });
  enhanceNumberInputs(container);
}

  const lines = [];

  if (r.공익신탁재산가액) lines.push('공익신탁재산가액(§17) = -' + won(r.공익신탁재산가액));
  if (r.상속개시전처분재산_추정합계) lines.push('상속개시전 처분재산 등 산입액(§15) = +' + won(r.상속개시전처분재산_추정합계));

  if (r.동거주택상속공제) lines.push('동거주택상속공제(§23의2) = -' + won(r.동거주택상속공제));
  if (r.감정평가수수료공제) lines.push('감정평가수수료공제(§25) = -' + won(r.감정평가수수료공제));
  if (r.재해손실공제) lines.push('재해손실공제(§23) = -' + won(r.재해손실공제));
  if (r.장례비용공제) lines.push('장례비용공제(§14①3호, 일반분 ' + won(r.장례비용공제_일반분) + ' + 봉안시설분 ' + won(r.장례비용공제_봉안시설분) + ') = -' + won(r.장례비용공제));

  if (r.영농상속공제) lines.push('영농상속공제(§18의3) = -' + won(r.영농상속공제));

  lines.push('납부세액 = ' + won(r.납부세액));
  return lines;
}

  const box = document.getElementById('taxCalcInheritanceResult');

  if (r.상속개시전처분재산_추정합계 || r.비과세재산가액 || r.공익법인출연재산가액 || r.공익신탁재산가액) {

    if (r.상속개시전처분재산_추정합계) html += taxCalcResultRow('상속개시전 처분재산 추정 가산액(§15)', '+' + won(r.상속개시전처분재산_추정합계));
    html += taxCalcResultRow('적용된 상속세과세가액', won(r.상속세과세가액_적용값));
  }
  html += taxCalcResultRow('인적공제', won(r.인적공제));
  html += taxCalcResultRow('기초+인적공제 vs 일괄공제(5억) 중 큰 값', won(r['기초인적공제_또는_일괄공제']));
  html += taxCalcResultRow('배우자공제', won(r.배우자공제));
  if (r.배우자공제한도액 != null) html += taxCalcResultRow('(배우자공제 한도액)', won(r.배우자공제한도액));
  if (r.금융재산상속공제) html += taxCalcResultRow('금융재산상속공제', won(r.금융재산상속공제));
  if (r.동거주택상속공제) html += taxCalcResultRow('동거주택상속공제', won(r.동거주택상속공제));
  if (r.감정평가수수료공제) html += taxCalcResultRow('감정평가수수료공제', won(r.감정평가수수료공제));
  if (r.재해손실공제) html += taxCalcResultRow('재해손실공제', won(r.재해손실공제));
  html += taxCalcResultRow('장례비용공제', won(r.장례비용공제));
  if (r.가업상속공제 || (r.가업상속공제_계산내역 && r.가업상속공제_계산내역.중견기업게이트_적용여부)) {
    html += taxCalcResultRow('가업상속공제', won(r.가업상속공제));
    if (r.가업상속공제_계산내역 && r.가업상속공제_계산내역.중견기업게이트_적용여부) html += '<div class="taxcalc-result-note">⛔ 중견기업 게이트(§18의2②, 시행령§15⑥⑦) — 가업상속인의 가업상속재산 외 상속재산가액이 가업상속공제 미적용시 납부세액의 200%를 초과해 가업상속공제가 전액 배제되었습니다.</div>';
    else if (r.가업상속공제_계산내역) html += '<div class="taxcalc-result-note">자동계산: 대상금액 ' + won(r.가업상속공제_계산내역.대상금액) + ' / 한도액 ' + won(r.가업상속공제_계산내역.한도액) + '</div>';
  }
  if (r.영농상속공제) {
    html += taxCalcResultRow('영농상속공제', won(r.영농상속공제));
    if (r.영농상속공제_계산내역) html += '<div class="taxcalc-result-note">자동계산: 대상금액 ' + won(r.영농상속공제_계산내역.대상금액) + ' / 한도액 ' + won(r.영농상속공제_계산내역.한도액) + '</div>';
  }
  html += taxCalcResultRow('상속공제 합계', won(r.상속공제_합계) + (r.상속공제종합한도_적용여부 ? ' (종합한도 적용됨)' : ''));
  html += taxCalcResultRow('과세표준', won(r.과세표준));
  html += taxCalcResultRow('산출세액', won(r.산출세액) + (r.세대생략가산액 ? ' (세대생략가산액 ' + won(r.세대생략가산액) + ' 포함)' : ''));
  if (r.증여세액공제_5억이하배제) html += taxCalcResultRow('기납부증여세액공제', '0 (§28①단서: 상속세 과세가액 5억원 이하)');
  else if (r.기납부증여세액공제) html += taxCalcResultRow('기납부증여세액공제', '-' + won(r.기납부증여세액공제));
  if (r.특례증여세액공제) html += taxCalcResultRow('특례증여세액공제', '-' + won(r.특례증여세액공제));
  if (r.외국납부세액공제) html += taxCalcResultRow('외국납부세액공제', '-' + won(r.외국납부세액공제));
  if (r.단기재상속세액공제) html += taxCalcResultRow('단기재상속세액공제', '-' + won(r.단기재상속세액공제));
  if (r.그밖의공제) html += taxCalcResultRow('그 밖의 공제', '-' + won(r.그밖의공제));
  html += taxCalcResultRow('신고세액공제(3%)', '-' + won(r.신고세액공제));
  if (r.이자상당액) html += taxCalcResultRow('이자상당액', '+' + won(r.이자상당액));
  if (r.영리법인면제분납부세액) html += taxCalcResultRow('영리법인 면제분 상속인 납부세액', '+' + won(r.영리법인면제분납부세액));
  if (r.무신고가산세) html += taxCalcResultRow('무신고가산세', '+' + won(r.무신고가산세));
  if (r.과소신고가산세) html += taxCalcResultRow('과소신고가산세', '+' + won(r.과소신고가산세));
  if (r.납부지연가산세) html += taxCalcResultRow('납부지연가산세', '+' + won(r.납부지연가산세));
  if (r.문화재등징수유예세액) html += taxCalcResultRow('문화재등 징수유예세액', '-' + won(r.문화재등징수유예세액));
  if (r.가업상속납부유예세액) html += taxCalcResultRow('가업상속 납부유예세액', '-' + won(r.가업상속납부유예세액));
  html += taxCalcResultRow('납부세액', won(r.납부세액), { total: true });
  if (r.가업상속납부유예_가능세액 != null) html += '<div class="taxcalc-result-note">참고: §72의2에 따라 가업상속 납부유예를 신청할 경우 최대 ' + won(r.가업상속납부유예_가능세액) + '까지 유예 가능합니다(가업상속공제와 별개로 선택 가능 — 실제 유예받으려면 위 "가업상속 납부유예세액" 입력란에 이 금액을 넣고 다시 계산하세요).</div>';
  html += '<div class="taxcalc-result-note">배우자가 단독상속인이면 일괄공제(5억) 대신 기초공제+인적공제만 적용되도록 위 상속인 명부 기준으로 자동 판정됩니다(§18의2). 가업상속공제·영농상속공제·특례증여세액공제·영리법인 면제세액은 자격요건 판정과 세액 자체를 이 계산기가 산출하지 않으므로 별도로 계산한 값을 직접 입력해야 합니다. 납부지연가산세율(1일 10만분의22)은 시행령 개정으로 바뀔 수 있습니다. 실제 신고 전 홈택스 모의계산으로 재검증하세요.</div>';
  html += '<button type="button" class="taxcalc-calcbasis-btn" data-action="toggle-inheritance-calc-basis" style="margin-top:8px;">🧮 계산근거 접기/펴기</button>';
  html += '<div class="taxcalc-calcbasis" id="inheritanceCalcBasis">' +
    '<div class="taxcalc-calcbasis-title">계산근거([별지 제9호서식] 상속세과세표준신고 기준)</div>' +
    buildInheritanceCalcBasisLines(r).map(function(l){ return '<div class="taxcalc-calcbasis-line">' + l + '</div>'; }).join('') +
  '</div>';
  html += '</div>';
  box.innerHTML = html;
  renderHeirTool();
}

// 손자녀는 두 경우가 세법상 다르게 취급된다(상증세법§27 단서) — 부모가 먼저 사망·결격되어
// 대신 상속받는 "대습상속"은 세대생략할증이 배제되고, 부모가 생존한 상태에서 유증·상속포기 등으로
// 세대를 건너뛰어 상속받는 경우만 할증(30%/40%)이 적용된다. 체크박스로 다시 물을 필요 없이
// 관계 선택만으로 자동 판정한다.
const HEIR_RELATION_OPTIONS = ['배우자', '자녀', '손자녀(대습상속 — 부모가 먼저 사망·결격)', '손자녀(세대생략 — 부모 생존, 유증·상속포기 등)', '부모(직계존속)', '상속인 아닌 자(유증·사인증여 등)'];
function renderHeirRegistry(){
  const container = document.getElementById('ihHeirRegistry');
  if (!container) return;
  const deathDateEl = document.getElementById('ihDeathDate');
  const deathDate = deathDateEl ? deathDateEl.value : '';
  const rowsHtml = inheritanceHeirs.map(function(h, idx){
    const relationOptions = HEIR_RELATION_OPTIONS.map(function(opt){
      return '<option value="' + opt + '"' + (h.relation === opt ? ' selected' : '') + '>' + opt + '</option>';
    }).join('');
    const age = calcAgeAt_(parseBirthDateFromRegNo_(h.regNo), deathDate);
    const heirNumerals_ = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
    // [2026.09 버그수정] 실사용 감사 지적 — 재산평가 자산목록은 .taxcalc-asset 박스+번호
    // 헤더로 자산 하나하나가 뚜렷이 구분되는데, 정작 더 헷갈리기 쉬운 상속인 명부는 점선
    // 구분선뿐이고 몇 번째 상속인인지 표시가 없었다. 같은 박스+헤더 패턴으로 맞춘다.
    // [2026.09.20 배치 재설계+버그수정] 세무사님 지시로 양도세 계약·자산 카드에 적용한 원칙을
    // 여기도 그대로: 삭제·추가 버튼을 제목 옆에 바로 붙이고(우측정렬 아님), "상속인이 1명뿐이면
    // 그 마지막 하나는 못 지운다"는 재검토21에서 자산 카드에 있던 것과 똑같은 제한을 제거한다.
    return '<div class="taxcalc-asset" data-heir-idx="' + idx + '">' +
      '<div class="taxcalc-asset-head"><span style="display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap;">' +
        '<b>상속인 ' + (heirNumerals_[idx] || ('#' + (idx + 1))) + (h.name ? ' — ' + escapeHtml(h.name) : '') + '</b>' +
        (idx > 0 ? '<button type="button" class="taxcalc-del-asset" data-action="del-heir-row" data-idx="' + idx + '">✕ 상속인 삭제</button>' : '') +
        '<button type="button" class="taxcalc-add-asset-inline" data-action="add-heir-row">+ 상속인 추가</button>' +
      '</span></div>' +
      '<div class="taxcalc-grid">' +
      '<div class="taxcalc-field"><label>성명</label><input type="text" data-hfield="name" data-nameonly="1" value="' + (h.name || '').replace(/"/g,'&quot;') + '"></div>' +
      '<div class="taxcalc-field"><label>주민등록번호</label><input type="text" data-hfield="regNo" data-regno="1" placeholder="000000-0000000" value="' + (h.regNo || '').replace(/"/g,'&quot;') + '"></div>' +
      '<div class="taxcalc-field"><label>관계</label><select data-hfield="relation"><option value="">선택</option>' + relationOptions + '</select></div>' +
      '<div class="taxcalc-field" style="flex:0 1 340px;"><label>주소</label><div class="taxcalc-field-inline"><input type="text" data-hfield="address" value="' + (h.address || '').replace(/"/g,'&quot;') + '" placeholder="예: OO시 OO구 OO동 123-4 (검색 또는 직접입력)"><button type="button" class="taxcalc-ai-btn" data-action="open-address-search-heir" data-idx="' + idx + '" title="주소 검색">🔍</button></div></div>' +
      '<div class="taxcalc-field"><label>동</label><select data-hfield="addressDong"><option value="">직접입력/해당없음</option>' +
        (Array.isArray(h.addressDongList) ? h.addressDongList : []).map(function(d){ return '<option value="' + d + '"' + (h.addressDong === d ? ' selected' : '') + '>' + d + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="taxcalc-field"><label>호</label><input type="text" data-hfield="addressHo" value="' + (h.addressHo || '').replace(/"/g,'&quot;') + '" placeholder="예: 1502호"></div>' +
      '<div class="taxcalc-field"><span class="taxcalc-result-note" style="margin:0;">나이' + (age !== null ? ' — 만 ' + age + '세(주민등록번호로 자동 계산)' : ' — 주민등록번호를 입력하면 자동 계산됩니다') + '</span></div>' +
      '<div class="taxcalc-field checkbox"><input type="checkbox" data-hfield="isDisabled" id="hDisabled-' + idx + '"' + (h.isDisabled ? ' checked' : '') + '><label for="hDisabled-' + idx + '">장애인</label></div>' +
      '<div class="taxcalc-field checkbox"><input type="checkbox" data-hfield="isReporter" id="hReporter-' + idx + '"' + (h.isReporter ? ' checked' : '') + '><label for="hReporter-' + idx + '">신고인</label></div>' +
      '<div class="taxcalc-field checkbox"><input type="checkbox" data-hfield="isCohabitHouse" id="hCohabit-' + idx + '"' + (h.isCohabitHouse ? ' checked' : '') + '><label for="hCohabit-' + idx + '">동거주택 상속(10년이상 동거·무주택 등)</label></div>' +
      '<div class="taxcalc-field" data-show-if-heir="isCohabitHouse" style="' + (h.isCohabitHouse ? '' : 'display:none;') + '"><label>동거주택가액</label><input type="number" data-hfield="cohabitHouseValue" placeholder="원" value="' + (h.cohabitHouseValue || '') + '"></div>' +
      // [2026.09 버그수정] 상증세법§23의2는 "상속개시일 현재 그 주택에 담보된 피상속인의
      // 채무액을 뺀 가액"을 공제 기준액으로 삼는데, 이 화면은 여태 담보채무를 뺄 방법 없이
      // 동거주택가액 총액을 그대로 공제액 계산에 넣고 있었다(6억 한도에 걸리는 사건은 결과에
      // 영향 없지만, 그 미만인 사건은 공제가 과다계산될 수 있었다).
      '<div class="taxcalc-field" data-show-if-heir="isCohabitHouse" style="' + (h.isCohabitHouse ? '' : 'display:none;') + '"><label>위 주택에 담보된 피상속인 채무액</label><input type="number" data-hfield="cohabitHouseDebt" placeholder="원" value="' + (h.cohabitHouseDebt || '') + '"><span class="taxcalc-field-help">없으면 비움</span></div>' +
      '<div class="taxcalc-field" style="flex-basis:100%; max-width:none;"><span class="taxcalc-result-note" data-heir-computed="actual" style="margin:0;">실제상속재산가액(자동) = ' + won(computeHeirActualValue_(idx)) + ' — 아래 재산평가 자산목록의 "상속인별 배분"에서 정해집니다</span></div>' +
      '<div class="taxcalc-field checkbox"><input type="checkbox" data-hfield="hasPriorGift" id="hPriorGift-' + idx + '"' + (h.hasPriorGift ? ' checked' : '') + '><label for="hPriorGift-' + idx + '">10년 이내 이 상속인에게 사전증여 있음(§13 가산대상)</label></div>' +
      '<div class="taxcalc-field" data-show-if-heir="hasPriorGift" style="' + (h.hasPriorGift ? '' : 'display:none;') + '"><label>사전증여재산가액(증여 당시 원본가액)</label><input type="number" data-hfield="priorGiftAmount" placeholder="원" value="' + (h.priorGiftAmount || '') + '"></div>' +
      '<div class="taxcalc-field" data-show-if-heir="hasPriorGift" style="' + (h.hasPriorGift ? '' : 'display:none;') + '"><label>위 증여재산의 증여세 과세표준</label><input type="number" data-hfield="priorGiftTaxableBase" placeholder="원" value="' + (h.priorGiftTaxableBase || '') + '"></div>' +
      '<div class="taxcalc-field" data-show-if-heir="hasPriorGift" style="' + (h.hasPriorGift ? '' : 'display:none;') + '"><label>위 증여 당시 납부한 증여세산출세액</label><input type="number" data-hfield="priorGiftTaxPaid" placeholder="원" value="' + (h.priorGiftTaxPaid || '') + '"></div>' +
      '</div>' +
    '</div>';
  }).join('');

  container.innerHTML = rowsHtml +
    '<button type="button" class="taxcalc-add-asset" data-action="add-heir-row" style="margin-top:8px;">+ 상속인 추가</button>';

  container.querySelectorAll('[data-hfield]').forEach(function(el){
    el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', function(){
      const row = el.closest('[data-heir-idx]');
      const idx = numVal(row.dataset.heirIdx);
      const key = el.dataset.hfield;
      inheritanceHeirs[idx][key] = el.type === 'checkbox' ? el.checked : el.value;
      if (key === 'isCohabitHouse' || key === 'hasPriorGift'){
        row.querySelectorAll('[data-show-if-heir="' + key + '"]').forEach(function(field){
          field.style.display = el.checked ? 'flex' : 'none';
        });
      }
      recomputeHeirDerivedFields();
      updateHeirActualValueHints();
    });
  });
  enhanceNumberInputs(container);
  enhanceDateInputs(container);
  enhanceRegNoInputs(container);
  enhanceNameOnlyInputs(container);
}

// 상속인)이 복수일 수 있고, 세율 자체가 취득인 개인 사정(다주택수·생애최초·법인여부·
// 국가유공자·특수관계인거래 등)에 좌우되므로 giftDonors와 같은 부류(각자 독립 계산 후 합산)
// 로 다룬다. 단, 기존 flat 입력칸(atHouseCount 등)을 전부 idOf 트릭으로 바꾸는 대신 —
// 그 칸들을 "취득인 01" 전용으로 그대로 두고(단독거래는 손대지 않음), 이 배열은 "2번째
// 취득인부터"만 담는다. 취득원인·부동산종류·중과제외주택 유형 등 물건 자체의 속성은 공유.
let acquisitionAcquirers = [];
// [2026.09.23 신규] "취득인 01"(기본, 위 기존 flat 입력칸 그대로)에 더해 공동취득인이 있을 때만
// 쓰는 추가 취득인 카드 — giftDonorRegistry와 같은 큰카드 패턴(번호헤더+버튼, 삭제가드 없음,
// 빈 배열이 기본값). 신고기한은 취득원인(atAcquisitionType)·취득일(atAcquisitionDate, 둘 다
// 공유)을 기준으로 이 취득인의 실제납부일과 비교해 계산한다.
function recomputeAcquirerUnpaidDays_(idx){
  const dateEl = document.getElementById('atAcquisitionDate');
  const typeEl = document.getElementById('atAcquisitionType');
  const paidDate = document.getElementById('atExPaidDate-' + idx);
  if (!dateEl || !dateEl.value || !paidDate) return;
  const type = typeEl ? typeEl.value : 'paid';
  let deadline;
  if (type === 'inheritance') deadline = taxCalcDeadlineFromMonthEnd_(dateEl.value, 6);
  else if (type === 'gift') deadline = taxCalcDeadlineFromMonthEnd_(dateEl.value, 3);
  else { const d = new Date(dateEl.value + 'T00:00:00'); deadline = isNaN(d.getTime()) ? null : new Date(d.getTime() + 60 * 86400000); }
  setUnpaidDaysField_('atExUnpaidDays-' + idx, taxCalcDaysLate_(deadline, paidDate.value));
}

    if (el) el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', recomputeAtUnpaidDays);
  });
  // 취득일·취득원인은 모든 취득인의 신고기한 계산에 공통이므로 바뀌면 추가 취득인들도 같이 갱신
  ['atAcquisitionDate', 'atAcquisitionType'].forEach(function(id){
    const el = document.getElementById(id);
    if (el) el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', function(){
      acquisitionAcquirers.forEach(function(_, idx){ recomputeAcquirerUnpaidDays_(idx); });
    });
  });
  recomputeAtUnpaidDays();
}

// [2026.09 신규] 취득원인별 신고기한(§20①·§20의2)에 맞춰 납부지연일수를 자동계산한다 —
// 유상·원시·분할 등은 취득일+60일, 상속은 상속개시일이 속하는 달 말일+6개월, 증여는
// 취득일이 속하는 달 말일+3개월.
function recomputeAtUnpaidDays(){
  const dateEl = document.getElementById('atAcquisitionDate');
  const typeEl = document.getElementById('atAcquisitionType');
  const paidDate = document.getElementById('atPaidDate');
  const hint = document.getElementById('atDeadlineHint');
  if (!dateEl || !dateEl.value){ setUnpaidDaysField_('atUnpaidDays', 0); if (hint) hint.textContent = ''; return; }
  const type = typeEl ? typeEl.value : 'paid';
  let deadline;
  if (type === 'inheritance'){
    deadline = taxCalcDeadlineFromMonthEnd_(dateEl.value, 6);
  } else if (type === 'gift'){
    deadline = taxCalcDeadlineFromMonthEnd_(dateEl.value, 3);
  } else {
    const d = new Date(dateEl.value + 'T00:00:00');
    deadline = isNaN(d.getTime()) ? null : new Date(d.getTime() + 60 * 86400000);
  }
  setUnpaidDaysField_('atUnpaidDays', taxCalcDaysLate_(deadline, paidDate ? paidDate.value : ''));
  if (hint) hint.textContent = deadline ? '신고납부기한: ' + formatDateYmd_(deadline) + '까지' : '';
}

    '<div class="taxcalc-asset">' +

function wireStandardPricePane_(){
  taxCalcStandardPricePane.querySelectorAll('[data-scfield]').forEach(function(el){
    el.addEventListener((el.tagName === 'SELECT' || el.type === 'checkbox') ? 'change' : 'input', function(){
      const key = el.dataset.scfield;
      scTool[key] = el.type === 'checkbox' ? el.checked : el.value;
      if (key === 'hasMultipleBuildingSections' || key === 'buildingTaxType') renderStandardPricePane();
    });
  });
  taxCalcStandardPricePane.querySelectorAll('[data-scffield]').forEach(function(el){
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', function(){
      const ridx = numVal(el.closest('[data-floor-idx]').dataset.floorIdx);
      if (!Array.isArray(scTool.buildingFloorRows)) scTool.buildingFloorRows = [{}];
      scTool.buildingFloorRows[ridx][el.dataset.scffield] = el.value;
    });
  });
  enhanceNumberInputs(taxCalcStandardPricePane);
}

    opts += '<option value="transfer:' + i + ':trf">양도세 — ' + label + ' — 양도시(안분용)</option>';
    opts += '<option value="transfer:' + i + ':acqconv">양도세 — ' + label + ' — 환산취득가액용 취득당시 기준시가</option>';
    opts += '<option value="transfer:' + i + ':trfconv">양도세 — ' + label + ' — 환산취득가액용 양도당시 기준시가</option>';
  });
  giftValuationAssets.forEach(function(a, i){

  // 상증세법§60~66 준용 평가액)를 예전엔 손으로 옮겨 적어야 했다. 여기서 계산한 기준시가(총액)를

function renderStandardPriceResult_(r){
  const box = document.getElementById('taxCalcStandardPriceResult');

  let html = '<div class="taxcalc-result" style="margin-top:10px;">';

// [2026.09 신규] 세무사님 지적 — 취득세도 취득내역(취득가액 등)이 입력되면 취득비용 내역에
// 자동으로 채워져야 하는 것 아니냐는 질문. 취득세는 다주택 중과·조정대상지역·각종 감면 등
// 이 계산기가 아니면 판단할 수 없는 사실관계가 많아, 자산 입력만으로 완전히 무인 자동계산하는
// 건 위험하다(잘못된 감면 적용을 조용히 취득비용에 흘려보낼 수 있음) — 대신 이 계산기가 이미
// 정확히 계산한 결과를 자산을 골라 취득비용 내역에 한 번에 반영하는 "적용" 버튼으로 자동화한다
// (재건축 청산금 환급분 처리(send-settlement-to-new-transfer) 등 기존 계산기들과 같은 패턴).
function taxCalcAcquisitionTaxApplyHtml_(){
  if (!transferAssets.length) return '';
  const options = transferAssets.map(function(a, i){
    return '<option value="' + i + '">' + escapeHtml(a.assetLocation || ('양도자산 ' + tcPad2_(i + 1))) + '</option>';
  }).join('');
  return '<div class="taxcalc-field" style="margin-top:8px;"><label>이 취득세를 적용할 자산</label><select id="atApplyTargetIdx">' + options + '</select></div>' +
    '<div class="taxcalc-field"><button type="button" class="taxcalc-run-btn" data-action="apply-acquisition-tax-to-property">→ 선택한 자산의 취득비용 내역에 추가</button></div>';
}
function acquisitionTaxResultTotal_(r){
  return r.납부세액_합계 != null ? r.납부세액_합계 : r.산출세액;
}
function renderOneAcquisitionTaxResultHtml_(r, label){
  if (!r || r.error) return '<div class="taxcalc-error">' + (label ? label + ': ' : '') + ((r && r.error) || '계산 결과가 없습니다.') + '</div>';
  let html = '<div class="taxcalc-result" style="margin-top:10px;">';
  if (label) html += '<div class="taxcalc-calcbasis-title" style="margin-bottom:4px;">' + label + '</div>';
  const total = acquisitionTaxResultTotal_(r);
  if (r.부담부증여_채무액분 != null){
    html += taxCalcResultRow('부담부증여 — 채무액분(유상취득)', won(r.부담부증여_채무액분));
    html += taxCalcResultRow('부담부증여 — 증여분(무상취득)', won(r.부담부증여_증여분));
    html += taxCalcResultRow('과세표준 합계', won(r.과세표준 || 0));
    html += taxCalcResultRow('취득세 산출세액 합계', won(r.산출세액));
    if (r.지방교육세 != null) html += taxCalcResultRow('지방교육세 합계', won(r.지방교육세));
    if (r.농어촌특별세 != null) html += taxCalcResultRow('농어촌특별세 합계', won(r.농어촌특별세));
    if (r.무신고가산세) html += taxCalcResultRow('무신고가산세', '+' + won(r.무신고가산세));
    if (r.과소신고가산세) html += taxCalcResultRow('과소신고가산세', '+' + won(r.과소신고가산세));
    if (r.납부지연가산세) html += taxCalcResultRow('납부지연가산세', '+' + won(r.납부지연가산세));
    html += taxCalcResultRow('납부세액 합계', won(total), { total: true });
    if (r.안내) html += '<div class="taxcalc-result-note">' + r.안내 + '</div>';
    html += '</div>';
    return html;
  }
  if (r.재분류적용여부) html += taxCalcResultRow('재분류 적용', '취득유형 ' + r.최종적용_취득유형 + ' / 과세표준 ' + won(r.최종적용_과세표준));
  html += taxCalcResultRow('과세표준', won(r.과세표준 || 0));
  html += taxCalcResultRow('적용세율', r.적용세율 + '%');
  html += taxCalcResultRow('취득세 산출세액', won(r.산출세액));
  if (r.취득세_감면세액 != null) html += taxCalcResultRow('취득세 감면세액', '-' + won(r.취득세_감면세액));
  if (r.취득세_최종납부액 != null) html += taxCalcResultRow('취득세 최종납부액', won(r.취득세_최종납부액));
  if (r.지방교육세 != null) html += taxCalcResultRow('지방교육세', won(r.지방교육세));
  if (r.농어촌특별세 != null) html += taxCalcResultRow('농어촌특별세', won(r.농어촌특별세));
  if (r.무신고가산세) html += taxCalcResultRow('무신고가산세', '+' + won(r.무신고가산세));
  if (r.과소신고가산세) html += taxCalcResultRow('과소신고가산세', '+' + won(r.과소신고가산세));
  if (r.납부지연가산세) html += taxCalcResultRow('납부지연가산세', '+' + won(r.납부지연가산세));
  html += taxCalcResultRow('납부세액 합계', won(total), { total: true });
  if (r.적용근거) html += '<div class="taxcalc-result-note">' + r.적용근거 + '</div>';
  if (r.안내) html += '<div class="taxcalc-result-note">' + r.안내 + '</div>';
  html += '</div>';
  return html;
}
// [2026.09.23 재구성] 취득인이 여러 명일 수 있어(양도세 양수인·증여세 수증인·상속세
// 상속인과의 연동 대비) 결과도 배열로 받는다 — 하위호환: 예전처럼 결과 객체 하나만
// 넘어오면 배열로 감싸서 그대로 처리한다.
function renderAcquisitionTaxResult(results){
  const box = document.getElementById('taxCalcAcquisitionResult');
  const list = Array.isArray(results) ? results : [{ acquirer: (acquisitionAcquirers && acquisitionAcquirers[0]) || {}, result: results }];
  if (list.length === 1 && list[0].result && list[0].result.error){
    box.innerHTML = '<div class="taxcalc-error">' + list[0].result.error + '</div>';
    return;
  }
  let html = list.map(function(item, idx){
    const label = list.length > 1 ? ('취득인 ' + tcPad2_(idx + 1) + (item.acquirer && item.acquirer.name ? ' — ' + escapeHtml(item.acquirer.name) : '')) : '';
    return renderOneAcquisitionTaxResultHtml_(item.result, label);
  }).join('');
  const grandTotal = list.reduce(function(s, item){ return s + (item.result && !item.result.error ? (numVal(acquisitionTaxResultTotal_(item.result)) || 0) : 0); }, 0);
  if (list.length > 1 && list.every(function(item){ return item.result && !item.result.error; })){
    html += '<div class="taxcalc-result" style="margin-top:10px;">' + taxCalcResultRow('취득인 전체 합계 납부세액', won(grandTotal), { total: true }) + '</div>';
  }
  html += taxCalcAcquisitionTaxApplyHtml_();
  box.innerHTML = html;
  box.dataset.lastTotal = grandTotal || 0;
}

// ---- 화면 전환 및 이벤트 바인딩 ----
// [2026.09] 관리 앱 이식본 — openTaxCalcView/closeTaxCalcView의 탐색기 패널 전환·새창 부트스트랩
// 부분은 이 앱의 메뉴 라우팅(showView)으로 대체하고, 4개 탭 최초 렌더만 이 함수가 담당한다.
function initTaxCalcOnce_(){
  renderTransferPane();
  renderGiftPane();
  renderInheritancePane();
  renderAcquisitionPane();
  renderRegistrationLicensePane();
  renderStandardPricePane();
  updateTaxCalcPaneVisibility();
}

// 현재 탭(양도/증여/상속)에 맞는 화면만 보이게 한다. 간편·정밀은 같은 화면을 공유하므로
// tier는 taxCalcView에 클래스만 하나 토글해서, 증빙업로드·AI자동입력 관련 UI만 CSS로 숨긴다
// (index.html의 .taxcalc-view-tier-simple .taxcalc-ai-btn 등 규칙).
function updateTaxCalcPaneVisibility(){
  const which = document.querySelector('.taxcalc-tab.active').dataset.tab;
  taxCalcTransferPane.style.display = which === 'transfer' ? 'block' : 'none';
  taxCalcGiftPane.style.display = which === 'gift' ? 'block' : 'none';
  taxCalcInheritancePane.style.display = which === 'inheritance' ? 'block' : 'none';
  taxCalcAcquisitionPane.style.display = which === 'acquisition' ? 'block' : 'none';
  taxCalcRegistrationLicensePane.style.display = which === 'registrationlicense' ? 'block' : 'none';
  taxCalcStandardPricePane.style.display = which === 'standardprice' ? 'block' : 'none';
  taxCalcView.classList.toggle('taxcalc-view-tier-simple', taxCalcTier === 'simple');
}

document.querySelectorAll('.taxcalc-tab').forEach(function(tab){
  tab.addEventListener('click', function(){
    document.querySelectorAll('.taxcalc-tab').forEach(function(t){ t.classList.remove('active'); });
    tab.classList.add('active');
    updateTaxCalcPaneVisibility();
  });
});

document.querySelectorAll('#taxCalcTierTabs [data-tier]').forEach(function(tab){
  tab.addEventListener('click', function(){
    document.querySelectorAll('#taxCalcTierTabs [data-tier]').forEach(function(t){ t.classList.remove('tier-on'); });
    tab.classList.add('tier-on');
    taxCalcTier = tab.dataset.tier;
    updateTaxCalcPaneVisibility();
  });
});

// 클릭 위임 — 거래추가/삭제/계산 버튼들은 매번 다시 그려지므로(renderTransferPane) 위임 방식이 안전하다.
taxCalcView.addEventListener('click', function(e){
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === 'del-asset'){
    const idx = numVal(btn.dataset.idx);
    transferAssets.splice(idx, 1);
    renderTransferPane();
  } else if (action === 'add-seller-alloc' || action === 'del-seller-alloc'){
    // add-donor-alloc/del-donor-alloc과 같은 패턴 — 비용항목 버튼과 같은 이유로 가장 가까운
    // 자산 카드(계약 카드 아님)를 먼저 찾는다.
    const propertyCard = btn.closest('.taxcalc-asset:not(.taxcalc-contract)');
    if (!propertyCard) return;
    const assetIdx = numVal(propertyCard.dataset.idx);
    const asset = transferAssets[assetIdx];
    if (!Array.isArray(asset.sellerAllocations)) asset.sellerAllocations = [{}];
    if (action === 'add-seller-alloc') asset.sellerAllocations.push({});
    else asset.sellerAllocations.splice(numVal(btn.dataset.idx), 1);
    renderTransferPane();
  } else if (action === 'add-cost-item' || action === 'del-cost-item'){
    // [2026.09 주의] 양도계약 카드 안에 자산 카드가 중첩되므로(양도계약 그룹), 자산 카드의
    // 비용항목 버튼도 DOM상 조상으로 올라가면 .taxcalc-contract를 만난다 — 반드시 "가장
    // 가까운" .taxcalc-asset(자산 카드 자신)부터 먼저 확인해야 계약의 비용으로 잘못
    // 반영되지 않는다.
    const propertyCard = btn.closest('.taxcalc-asset:not(.taxcalc-contract)');
    const listKey = btn.dataset.costList;
    if (propertyCard){
      const idx = numVal(propertyCard.dataset.idx);
      if (!Array.isArray(transferAssets[idx][listKey])) transferAssets[idx][listKey] = [{}];
      if (action === 'add-cost-item') transferAssets[idx][listKey].push({});
      else transferAssets[idx][listKey].splice(numVal(btn.dataset.idx), 1);
    } else {
      const contractCard = btn.closest('.taxcalc-contract');
      const contract = contractList_(contractCard.dataset.contractKind).find(function(c){ return c.id === contractCard.dataset.contractId; });
      if (!Array.isArray(contract[listKey])) contract[listKey] = [{}];
      if (action === 'add-cost-item') contract[listKey].push({});
      else contract[listKey].splice(numVal(btn.dataset.idx), 1);
    }
    renderTransferPane();
  } else if (action === 'add-contract-buyer' || action === 'del-contract-buyer'){
    // renderContractBuyersHtml_(양수인 목록)의 추가·삭제 — 자산 카드와 중첩될 일이 없으므로
    // add-cost-item처럼 가장 가까운 카드를 구분할 필요 없이 곧장 .taxcalc-contract를 찾는다.
    const contractCard = btn.closest('.taxcalc-contract');
    const contract = contractList_(contractCard.dataset.contractKind).find(function(c){ return c.id === contractCard.dataset.contractId; });
    if (!Array.isArray(contract.buyers)) contract.buyers = [{}];
    if (action === 'add-contract-buyer') contract.buyers.push({});
    else contract.buyers.splice(numVal(btn.dataset.idx), 1);
    renderTransferPane();
  } else if (action === 'toggle-acq-membership'){
    const targetIdx = numVal(btn.dataset.targetIdx);
    transferAssets[targetIdx].acquisitionContractId = btn.checked ? btn.dataset.contractId : '';
    renderTransferPane();
  } else if (action === 'add-contract'){
    const kind = btn.dataset.contractKind;
    contractList_(kind).push({ id: tcNewContractId_(), name: (kind === 'acquisition' ? '취득계약 ' : '양도계약 ') + tcPad2_(contractList_(kind).length + 1), totalPrice: 0, totalExpenseItems: [], externalMembers: [] });
    renderTransferPane();
  } else if (action === 'add-property-to-contract'){
    const kind = btn.dataset.contractKind;
    const key = contractFkKey_(kind);
    const newAssetFlags_ = tcCurrentCase && tcCurrentCase.사건개요 ? TC_CASE_CLASSIFICATION_TO_TRANSFER_FLAGS_[tcCurrentCase.사건개요.사건분류] : null;
    const newAsset = newAssetFlags_ ? Object.assign({}, newAssetFlags_) : {};
    newAsset[key] = btn.dataset.contractId;
    transferAssets.push(newAsset);
    renderTransferPane();
    const newCard = taxCalcTransferPane.querySelector('.taxcalc-asset[data-idx="' + (transferAssets.length - 1) + '"]');
    if (newCard){ newCard.scrollIntoView({ behavior: 'smooth', block: 'center' }); newCard.classList.add('help-flash'); setTimeout(function(){ newCard.classList.remove('help-flash'); }, 1600); }
  } else if (action === 'del-contract'){

      const rightsValue = numVal(vals.rightsValue) || 0;
      if (!received || !rightsValue) return;
      const ratio = Math.min(1, received / rightsValue);
      const splitPrice = Math.round(origPrice * ratio);
      const splitExpense = Math.round(origExpense * ratio);
      newAsset.transferPrice = received;
      newAsset.transferDate = vals.managementDispositionDate || '';
      newAsset.acquisitionPrice = splitPrice;
      newAsset.acquisitionExpenseItems = splitExpense ? [{ label: '청산금 수령분 필요경비 안분', amount: splitExpense }] : [];

// 텍스트를 그대로 캡처해 work_update_case의 세액계산결과 배열에 통째로 재저장한다

var tcCases = [];
var tcSelectedId = null;
var tcCurrentCase = null;
var TC_TAB_LABELS_ = { transfer: '양도소득세', gift: '증여세', inheritance: '상속세', acquisition: '취득세' };
var TC_RESULT_BOX_IDS_ = { transfer: 'taxCalcTransferResult', gift: 'taxCalcGiftResult', inheritance: 'taxCalcInheritanceResult', acquisition: 'taxCalcAcquisitionResult' };
var tcCaseBarEl = document.getElementById('taxCalcCaseBar');

function loadTcCases_(preselectId){
  if (!tcCaseBarEl) return;
  callGas('work_get_cases', {}).then(function(res){
    tcCases = res.cases || [];
    var wantId = preselectId || tcSelectedId;
    if (wantId && !tcCases.some(function(c){ return c.id === wantId; })) wantId = null;
    tcSelectedId = wantId;
    tcCurrentCase = wantId ? tcCases.filter(function(c){ return c.id === wantId; })[0] : null;
    renderTcCaseBar_();
  }).catch(function(){
    tcCaseBarEl.innerHTML = '<div class="log-empty">사건 목록을 불러오지 못했습니다.</div>';
  });
}

  var tab = document.querySelector('.taxcalc-tab[data-tab="' + semok + '"]');
  if (!tab || tab.classList.contains('active')) return;

var tcLastOverviewValues_ = {};
function tcApplyCaseBaseDate_(caseObj){
  if (!caseObj || !caseObj.기준일) return;
  var fieldId = TC_BASE_DATE_FIELD_BY_SEMOK_[caseObj.세목];
  if (!fieldId) return;
  var el = document.getElementById(fieldId);
  if (!el) return;
  if (el.value && el.value !== tcLastOverviewValues_[fieldId]) return;
  if (el.value === caseObj.기준일) return;

  tcLastOverviewValues_[fieldId] = caseObj.기준일;

// [2026.09 버그수정] 사건 A를 계산하다가(양도인 성명 등이 자동으로 채워진 채) 화면을
// 새로고침하지 않고 바로 사건 B로 바꾸면, "이미 값이 있으면 안 덮어쓴다"는 위 함수들의 보호
// 로직 때문에 A의 값이 B의 입력칸에 그대로 남아있었다 — 잘못 알아채면 B 사건에 A의 taxpayer/
// 금액이 섞인 계산결과가 저장될 위험이 있었다. 실제로 선택된 사건 id가 바뀔 때만(같은 사건을

// 외에는 아무것도 비워지지 않았다. 증여세 특례탭(창업자금·명의신탁·재산취득자금 증여추정·
// 채무면제 등)의 수십 개 입력칸, 수증자·증여자 주민등록번호·주소, 상속공제 요건 체크박스,
// 상속인 명부·자산평가 목록까지 전부 사건을 바꿔도 그대로 남아있어 — 다른 의뢰인의
// 주민등록번호가 화면에 남은 채로 계산이 이어지거나 요건 판정이 뒤섞일 위험이 있었다. 개별
// id를 일일이 나열하는 대신 세목별 탭(pane) 전체를 순회해 모든 입력을 원상태로 되돌린다.
var tcLastAppliedCaseId_ = undefined;
function tcResetPaneFields_(paneEl){
  if (!paneEl) return;
  paneEl.querySelectorAll('input, select, textarea').forEach(function(el){
    if (el.type === 'checkbox' || el.type === 'radio') el.checked = el.defaultChecked;
    else if (el.tagName === 'SELECT') el.selectedIndex = 0;
    else el.value = el.defaultValue || '';
  });
}
function tcResetOverviewInputsForNewCase_(){
  Object.keys(TC_OVERVIEW_INPUT_KEYS_).forEach(function(semok){
    TC_OVERVIEW_INPUT_KEYS_[semok].forEach(function(key){
      var el = document.getElementById(key);
      if (el) el.value = '';
    });
  });
  tcLastOverviewValues_ = {};
  if (typeof transferSellers !== 'undefined') transferSellers = [{}];
  if (typeof transferAssets !== 'undefined') {
    transferAssets = [];
    if (typeof acquisitionContracts !== 'undefined') acquisitionContracts = [];
    if (typeof transferContracts !== 'undefined') transferContracts = [];
    if (typeof tcSeedDefaultTransferState_ === 'function') tcSeedDefaultTransferState_();
    if (typeof renderTransferPane === 'function') renderTransferPane();
  }
  if (typeof taxCalcGiftPane !== 'undefined') tcResetPaneFields_(taxCalcGiftPane);
  if (typeof taxCalcInheritancePane !== 'undefined') tcResetPaneFields_(taxCalcInheritancePane);
  if (typeof giftDonors !== 'undefined') {
    giftDonors = [{}];
    if (typeof renderGiftDonorRegistry === 'function') renderGiftDonorRegistry();
  }
  if (typeof giftDonees !== 'undefined') {
    giftDonees = [{}];
    if (typeof renderGiftDoneeRegistry === 'function') renderGiftDoneeRegistry();
  }
  if (typeof acquisitionAcquirers !== 'undefined') {

    if (typeof renderAcquirerExtraRegistry === 'function') renderAcquirerExtraRegistry();
  }
  if (typeof giftValuationAssets !== 'undefined') {
    giftValuationAssets = [{}];
    if (typeof renderValuationAssetList === 'function') renderValuationAssetList('giftValuationList', giftValuationAssets);

  if (typeof inheritanceValuationAssets !== 'undefined') {
    inheritanceValuationAssets = [{}];
    if (typeof renderValuationAssetList === 'function') renderValuationAssetList('inheritanceValuationList', inheritanceValuationAssets);
  }
  if (typeof inheritanceHeirs !== 'undefined') {
    inheritanceHeirs = [{}, {}];
    if (typeof renderHeirRegistry === 'function') renderHeirRegistry();

  // [2026.09 버그수정] 실사용 감사 지적 — 상속개시전 처분재산·장례비용 목록은 상속인 명부·
  // 재산평가 목록과 완전히 같은 구조(동적으로 채워지는 배열)인데 리셋 대상에서 빠져 있었다.
  // tcResetPaneFields_의 "el.value = el.defaultValue" 방식은 이미 동적으로 값이 채워진
  // input에는 효과가 없어(defaultValue 자체가 이전 사건 값), 사건을 바꿔도 이 두 목록만

    inheritanceFuneralItems = [{}];
    if (typeof renderFuneralItemsList === 'function') renderFuneralItemsList();

}

function tcApplyOverviewToInputs_(caseObj){
  if (!caseObj) return;
  var keys = TC_OVERVIEW_INPUT_KEYS_[caseObj.세목];
  if (!keys) return;
  var overview = caseObj.사건개요 || {};
  keys.forEach(function(key){
    var el = document.getElementById(key);
    if (!el || overview[key] == null || overview[key] === '') return;
    // 사용자가 우리가 지난번에 채워준 값 그대로 두고 있으면 최신 사건개요 값으로 갱신한다
    // (같은 사건을 다시 열었는데 그 사이 사건개요서에서 정정한 경우를 반영하기 위함).
    // 사용자가 직접 다른 값으로 고쳐뒀으면 그 입력을 존중해 건드리지 않는다.
    if (el.value && el.value !== tcLastOverviewValues_[key]) return;
    if (el.value === String(overview[key])) return;
    el.value = overview[key];
    tcLastOverviewValues_[key] = String(overview[key]);
    // [2026.09.20 버그수정] gift의 giftDonorName/giftAmount/giftDebtAssumed/giftPriorAmount는
    // 이제 giftDonors[0]과 data-dfield로 연결돼 있다 — el.value만 바꾸면 change/input 리스너가
    // 안 타서 배열 쪽은 옛 값(보통 빈 값)에 머문다. input을 직접 쏴서 동기화한다(플랫 필드는
    // 원래도 리스너가 없거나 있어도 무해함).
    el.dispatchEvent(new Event('input', { bubbles: true }));
  });
}
// [2026.09 버그수정] 실사용 감사 지적 — 양도는 tcApplyOverviewToTransfer_가 사건개요서의
// 물건목록(소재지 등)을 그대로 이어받는데, 증여·상속의 재산평가 목록(giftValuationAssets/
// inheritanceValuationAssets)은 이 연결이 아예 없어서 사건개요서에 필지를 여러 건 등록해도
// 세액계산 화면은 항상 빈 카드 1개로 시작했다. 평가방법·금액 등 계산 전용 값은 원래 취지대로
// 이 화면에서 채우고, 사건개요서가 이미 파악해둔 소재지 정보만 최초 1회 프리필한다.
function tcApplyOverviewToValuationAssets_(caseObj){
  if (!caseObj) return;
  var isGift = caseObj.세목 === 'gift', isInheritance = caseObj.세목 === 'inheritance';
  if (!isGift && !isInheritance) return;
  var assetsVar = isGift ? giftValuationAssets : inheritanceValuationAssets;
  if (typeof assetsVar === 'undefined') return;
  var overview = caseObj.사건개요 || {};
  var list = Array.isArray(overview.물건목록) ? overview.물건목록 : null;
  if (!list || !list.length) return;
  var firstIsEmpty = !assetsVar[0] || !assetsVar[0].assetLocation;
  if (assetsVar.length > 1 || !firstIsEmpty) return;
  var mapped = list.map(function(item){
    return { assetKind: item.assetKind || '', assetLocation: item.assetLocation || '', assetDong: item.assetDong || '', assetHo: item.assetHo || '', assetDongList: item.assetDongList || [] };
  });
  var containerId = isGift ? 'giftValuationList' : 'inheritanceValuationList';
  if (isGift) giftValuationAssets = mapped; else inheritanceValuationAssets = mapped;
  if (typeof renderValuationAssetList === 'function') renderValuationAssetList(containerId, isGift ? giftValuationAssets : inheritanceValuationAssets);
}
// [2026.09 버그수정] 상속인 명부가 사건에 저장되지 않던 문제의 짝 — tcSyncOverviewAmounts_가
// 저장해둔 overview.상속인목록을 사건을 다시 열 때 불러온다. 계산 전용 값이 아니라 사실관계
// (성명·주민등록번호 등)라 최초 1회만 채우고, 그 뒤로 화면에서 직접 고친 내용은 보존한다.
function tcApplyOverviewToHeirs_(caseObj){
  if (!caseObj || caseObj.세목 !== 'inheritance' || typeof inheritanceHeirs === 'undefined') return;
  var overview = caseObj.사건개요 || {};
  var list = Array.isArray(overview.상속인목록) ? overview.상속인목록 : null;
  // [2026.09 버그수정] 실사용 감사 지적 — 초기 상속인 배열이 [{},{}] (길이 2, 빈 행 2개)로
  // 시작하는데 예전 가드는 "length > 1이면 이미 손댄 것으로 간주"해서, 사건을 막 불러온
  // 직후에도 항상 조기 종료돼 이 함수 전체가 죽은 코드나 마찬가지였다 — 상속인목록도,
  // 상속인수/대표성명 시딩도 실행된 적이 없었다. 행 개수가 아니라 "모든 행이 실제로
  // 비어있는지"로 판단해야 한다.
  var allEmpty = inheritanceHeirs.every(function(h){ return !h || !(h.name || h.regNo); });
  if (!allEmpty) return;
  if (list && list.length) {
    inheritanceHeirs = list.map(function(h){ return Object.assign({}, h); });
    if (typeof renderHeirRegistry === 'function') renderHeirRegistry();
    return;
  }
  // [2026.09 버그수정] 실사용 감사 지적 — 사건개요서의 "상속인 수"/"대표 상속인 성명"은
  // 지금까지 어디서도 참조되지 않는 죽은 값이었다(세액계산은 항상 빈 2행으로 시작). 아직
  // 상세 명부(상속인목록)를 한 번도 입력한 적이 없을 때만, 사건개요서에서 미리 파악해둔
  // 인원수·대표 성명으로 빈 행을 만들어준다(그 뒤로 직접 채운 내용은 위 분기가 보존).
  var count = Number(overview.상속인수) || 0;
  var repName = overview.상속인성명 || '';
  // [2026.09.23 신규, "전수조사" 지시] 처리개요의 "그 외 상속인"(쉼표구분 추가명단)도 이름만
  // 채운 카드로 미리 만들어준다 — 지금까지는 상속인수(숫자)만큼 빈 행만 만들고 실제 이름은
  // 대표 1명(상속인성명)만 반영해서, 나머지 상속인은 세액계산에서 또 하나하나 이름부터
  // 다시 입력해야 했다.
  var extraNames = String(overview.상속인추가명단 || '').split(',').map(function(s){ return s.trim(); }).filter(function(s){ return s; });
  if (!count && !repName && !extraNames.length) return;
  var seeded = [];
  if (repName) seeded.push({ name: repName });
  extraNames.forEach(function(n){ seeded.push({ name: n }); });
  while (seeded.length < Math.max(count, 2)) seeded.push({});
  inheritanceHeirs = seeded;
  if (typeof renderHeirRegistry === 'function') renderHeirRegistry();
}
// tcApplyOverviewToHeirs_의 증여세 버전 — [2026.09.23 신규, "전수조사" 지시]. 처리개요의
// "공동증여인"/"공동수증인"(쉼표구분 추가명단)을 세액계산의 증여자/수증인 복수카드에도
// 이름만 채워 미리 만들어준다. giftDonorName/giftDoneeName(대표 1명)은 이미
// tcApplyOverviewToInputs_가 채워주지만 추가 인원은 지금까지 아무 데도 안 이어져 있었다.

// [2026.09 버그수정] casehandling.html의 관계 라벨(전체 문구)을 taxcalc.html의 select
// 값(짧은 코드 + data-genskip 속성)으로 옮기는 전용 변환표 — 두 화면이 값 형식 자체가
// 달라서 단순 대입이 안 통했다(giftRelation을 위 TC_OVERVIEW_INPUT_KEYS_.gift에서 뺀 이유).
var CH_TO_TC_GIFT_RELATION_MAP_ = {
  '배우자': { value: '배우자', genskip: null },
  '직계존속(1촌, 부모 등→자녀)': { value: '직계존속', genskip: '0' },
  '직계존속(2촌 이상, 조부모 등→손자녀·세대생략)': { value: '직계존속', genskip: '1' },
  '직계비속(1촌, 자녀 등→부모)': { value: '직계비속', genskip: '0' },
  '직계비속(2촌 이상, 손자녀 등→조부모·세대생략)': { value: '직계비속', genskip: '1' },
  '기타친족': { value: '기타친족', genskip: null },
  '기타(상속인 아닌 자 등)': { value: '기타', genskip: null }
};
function tcApplyGiftRelation_(caseObj){
  if (!caseObj || caseObj.세목 !== 'gift') return;
  var overview = caseObj.사건개요 || {};
  var mapped = CH_TO_TC_GIFT_RELATION_MAP_[overview.giftRelation];
  if (!mapped) return;
  var el = document.getElementById('giftRelation');
  if (!el || !el.options.length) return;
  var currentOpt = el.options[el.selectedIndex];
  var currentSig = currentOpt ? (currentOpt.value + '|' + (currentOpt.dataset.genskip || '')) : '';
  var lastSig = tcLastOverviewValues_['giftRelation'];
  if (lastSig !== undefined && currentSig !== lastSig) return; // 사용자가 직접 바꿔둔 값은 존중
  var targetOpt = null;
  for (var i = 0; i < el.options.length; i++) {
    var o = el.options[i];
    if (o.value === mapped.value && (mapped.genskip == null || (o.dataset.genskip || '0') === mapped.genskip)) { targetOpt = o; break; }
  }
  if (!targetOpt) return;
  var targetSig = targetOpt.value + '|' + (targetOpt.dataset.genskip || '');
  if (currentSig === targetSig) return;
  el.selectedIndex = targetOpt.index;
  tcLastOverviewValues_['giftRelation'] = targetSig;
  // [2026.09.20 버그수정] giftRelation이 이제 증여자 카드(giftDonors[0])의 data-dfield
  // 바인딩과 연결돼 있다 — selectedIndex를 코드로 바꾸는 것만으로는 change 이벤트가 안 뜨므로
  // giftDonors[0]에는 반영이 안 되는 상태로 남는다(화면엔 맞게 보이는데 실제 계산엔 옛 값이
  // 쓰이는 조용한 불일치). change를 직접 쏴서 그 동기화 로직을 그대로 태운다.
  el.dispatchEvent(new Event('change', { bubbles: true }));
}
function tcApplySpecialGiftProvisionDefaults_(caseObj){
  if (!caseObj || caseObj.세목 !== 'gift') return;
  var overview = caseObj.사건개요 || {};
  if (overview.사건분류 !== '창업자금·가업승계 특례증여') return;
  var map = { srGiftAmount: overview.giftAmount, srGiftDate: caseObj.기준일 };
  Object.keys(map).forEach(function(key){
    var value = map[key];
    if (value == null || value === '') return;
    var el = document.getElementById(key);
    if (!el) return;
    if (el.value && el.value !== tcLastOverviewValues_[key]) return;
    if (el.value === String(value)) return;
    el.value = value;
    tcLastOverviewValues_[key] = String(value);
    if (key === 'srGiftDate') el.dispatchEvent(new Event('input', { bubbles: true }));
  });
}
// [2026.09 재설계] "자산이 여러 필지면 사건개요서 단계에서 전체 목록부터 파악해야 하는데,
// 이 화면(세액계산)에서야 겨우 다 입력하게 되고 그나마도 대표 1건 말고는 저장조차 안 됐다"는

// 이 화면은 그 목록을 그대로 불러와서 시작하고, 자산별 세부 계산값(양도비용 내역 등 계산
// 전용 필드)만 여기서 채운다. 이미 계산 작업이 진행 중(첫 로딩이 아님)이면 목록을 다시

// [2026.09 버그수정] 실사용 감사 지적 — 사건개요서의 "사건분류"(1세대1주택 비과세, 2주택
// 중과, 비사업용 토지, 미등기양도 등)를 이미 사건개요서 단계에서 판단해 골라놨는데도, 실제
// 과세여부·세율을 가르는 이 화면의 자산별 체크박스(isOneHouseOneFamily 등)는 완전히 별개라
// 세무사가 여기서 또 체크하는 걸 잊으면 아무 경고 없이 그 판단이 계산에 전혀 반영되지 않는다
// — 기준일 연결 누락과 같은 유형의 문제이면서 영향은 더 크다(비과세 여부 자체이므로). "이미
// 판단해둔 사실을 참고 정보로 미리 채워준다"는 취지라 자산마다 새로 만들 때(비어있을 때)만
// 채우고, 세무사가 자산별로 다르게 고쳐두면 그 판단을 존중해 건드리지 않는다.
var TC_CASE_CLASSIFICATION_TO_TRANSFER_FLAGS_ = {
  '1세대1주택 비과세': { isOneHouseOneFamily: true },
  '1세대1주택 고가주택(과세)': { isOneHouseOneFamily: true },
  '2주택 중과': { multiHouseCount: '2' },
  '3주택이상 중과': { multiHouseCount: '3' },

  '미등기양도': { isUnregisteredTransfer: true }
