<!-- [2026.11.04 큰일 ④ 판정 창] 세무사님 "권장안대로"(큰일다섯_계획서_20261104 ④)
     사건 작업 머리줄 「판정」 단추 → 창 하나에서 판정 묶음을 찾아 고르고, 장부에서 미리 채운 칸을 고쳐 돌린다.
     넥스와 같은 입구(case_proc ledgerJudge — ledgerJudgeRun_ → judgeMoreRun_)를 쓰고, 칸 목록은 서버가 판정 함수 글에서 뽑아 준다(JudgeForm.js).
     계산기 카드를 읽는 옛 창 셋(1세대1주택·비사업용 토지·대주주)은 여기서 고르면 그 창을 연다(1세대1주택은 장부로 바로 돌리기도 됨). -->
<style>
  .jw-panel { width:min(980px, 96vw); max-height:92vh; display:flex; flex-direction:column; }
  .jw-body { display:grid; grid-template-columns:260px minmax(0,1fr); gap:12px; min-height:0; flex:1; overflow:hidden; padding:10px 12px; }
  .jw-left { display:flex; flex-direction:column; gap:6px; min-height:0; }
  .jw-left input[type=search] { width:100%; box-sizing:border-box; }
  .jw-groups { display:flex; flex-wrap:wrap; gap:4px; }
  .jw-chip { border:1px solid var(--line); background:var(--bg, #fff); border-radius:12px; padding:2px 9px; font-size:12px; cursor:pointer; color:var(--text, inherit); }
  .jw-chip.on { background:var(--navy, #1f2d4d); border-color:var(--navy, #1f2d4d); color:#fff; }
  .jw-list { overflow:auto; border:1px solid var(--line); border-radius:6px; flex:1; min-height:120px; }
  .jw-item { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); background:none; padding:6px 8px; cursor:pointer; font-size:13px; color:var(--text, inherit); }
  .jw-item small { color:var(--sub); margin-left:4px; }
  .jw-item.on { background:var(--navy, #1f2d4d); color:#fff; }
  .jw-item.on small { color:#dfe5f2; }
  .jw-right { overflow:auto; min-width:0; }
  .jw-head { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:baseline; margin-bottom:6px; }
  .jw-head b { font-size:15px; }
  .jw-law { color:var(--sub); font-size:12px; }
  .jw-fields { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:8px 10px; }
  .jw-f { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .jw-f.wide { grid-column:1 / -1; }
  .jw-f > label { font-size:12.5px; font-weight:600; }
  .jw-f input, .jw-f select, .jw-f textarea { width:100%; box-sizing:border-box; }
  .jw-from { font-size:11.5px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .jw-from.tent { color:var(--gold, #b8860b); }
  .jw-sub { border:1px solid var(--line); border-radius:6px; padding:6px; display:flex; flex-direction:column; gap:6px; }
  .jw-subrow { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:4px 6px; align-items:end; position:relative; padding-right:26px; }
  .jw-subrow + .jw-subrow { border-top:1px dashed var(--line); padding-top:6px; }
  .jw-subrow label { font-size:11.5px; color:var(--sub); display:flex; flex-direction:column; gap:1px; }
  .jw-subdel { position:absolute; right:0; bottom:2px; }
  .jw-actions { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 6px; align-items:center; }
  .jw-res { border-top:1px solid var(--line); padding-top:8px; display:flex; flex-direction:column; gap:8px; }
  .jw-verdict { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:14px; }
  .jw-badge { border-radius:4px; padding:2px 8px; font-weight:700; font-size:13px; }
  .jw-badge.ok { background:#e3f1e6; color:#1d6b32; }
  .jw-badge.no { background:#fbe5e5; color:#a12626; }
  .jw-badge.tent { background:#fbf1d8; color:#8a6412; }
  .jw-req { width:100%; border-collapse:collapse; font-size:12.5px; table-layout:fixed; }
  .jw-req th, .jw-req td { border-bottom:1px solid var(--line); padding:4px 6px; text-align:left; vertical-align:top; }
  .jw-req col.c1 { width:30%; } .jw-req col.c2 { width:44px; } .jw-req col.c4 { width:24%; }
  .jw-req td.r { text-align:center; font-weight:700; }
  .jw-req td.law { color:var(--sub); }
  .jw-res h4 { margin:2px 0; font-size:13px; }
  .jw-res ul { margin:0; padding-left:18px; font-size:12.5px; }
  .jw-res pre { white-space:pre-wrap; font-size:11.5px; max-height:220px; overflow:auto; background:var(--bg2, #f6f7f9); padding:6px; border-radius:4px; }
  .jw-empty { color:var(--sub); font-size:13px; padding:20px 4px; }
  @media (max-width:700px){ .jw-body { grid-template-columns:1fr; overflow:auto; align-content:start; } .jw-left { min-height:auto; } .jw-right { min-height:auto; } .jw-list { max-height:180px; flex:none; } .jw-right { overflow:visible; } }
</style>
<script>
  var NX_JW_ = { list: null, group: '', q: '', cur: null, last: null, caseId: '' };
  var NX_JW_GROUPS_ = ['주택', '토지', '감면', '상속증여', '기한', '계산', '기타'];
  function nxJwEsc_(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function nxJudgeOpen_(){
    var id = typeof nxCbCurId_ === 'function' ? nxCbCurId_() : '';
    if (!id){ showToast('먼저 위에서 사건을 골라 주세요', 'warn'); return; }
    NX_JW_.caseId = id;
    var old = document.getElementById('nxJudgeOverlay'); if (old) old.remove();
    var ov = document.createElement('div');
    ov.className = 'modal-overlay'; ov.id = 'nxJudgeOverlay'; ov.style.display = 'flex';
    ov.innerHTML =
      '<div class="modal-panel jw-panel" role="dialog" aria-modal="true" aria-label="판정">' +
        '<div class="modal-head"><span>판정</span><span class="modal-close" title="닫기" role="button" tabindex="0" id="jgwClose">✕</span></div>' +
        '<div class="jw-body">' +
          '<div class="jw-left">' +
            '<input type="search" id="jgwFind" placeholder="판정 찾기 (예: 자경, 상속인)" aria-label="판정 찾기">' +
            '<div class="jw-groups" id="jgwGroups"></div>' +
            '<div class="jw-list" id="jgwList"><div class="jw-empty">판정 목록을 받는 중…</div></div>' +
          '</div>' +
          '<div class="jw-right" id="jgwRight"><div class="jw-empty">왼쪽에서 판정을 고르세요. 칸은 장부와 지난 판정에서 미리 채웁니다.</div></div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);
    var close = function(){ ov.remove(); document.removeEventListener('keydown', onKey); };
    var onKey = function(e){ if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    ov.querySelector('#jgwClose').onclick = close;
    ov.addEventListener('click', function(e){ if (e.target === ov) close(); });
    ov.querySelector('#jgwFind').addEventListener('input', function(){ NX_JW_.q = this.value.trim(); nxJwDrawList_(); });
    ov.querySelector('#jgwGroups').innerHTML = ['전체'].concat(NX_JW_GROUPS_).map(function(g){ return '<button type="button" class="jw-chip' + ((g === '전체' ? '' : g) === NX_JW_.group ? ' on' : '') + '" data-g="' + (g === '전체' ? '' : g) + '">' + g + '</button>'; }).join('');
    ov.querySelector('#jgwGroups').addEventListener('click', function(e){
      var b = e.target.closest('[data-g]'); if (!b) return;
      NX_JW_.group = b.getAttribute('data-g');
      this.querySelectorAll('.jw-chip').forEach(function(x){ x.classList.toggle('on', x === b); });
      nxJwDrawList_();
    });
    ov.querySelector('#jgwList').addEventListener('click', function(e){ var b = e.target.closest('[data-k]'); if (b) nxJwPick_(b.getAttribute('data-k')); });
    ov.querySelector('#jgwFind').focus();
    if (NX_JW_.list) { nxJwDrawList_(); return; }
    callGas('case_proc', { caseId: id, step: 'ledgerJudgeList' }).then(function(r){
      if (!r || !r.ok) throw new Error((r && (r.error || r.message)) || '판정 목록을 받지 못했습니다');
      NX_JW_.list = r.판정 || [];
      nxJwDrawList_();
    }).catch(function(err){ var l = document.getElementById('jgwList'); if (l) l.innerHTML = '<div class="jw-empty">' + nxJwEsc_(err.message || err) + '</div>'; });
  }
  function nxJwDrawList_(){
    var box = document.getElementById('jgwList'); if (!box || !NX_JW_.list) return;
    var q = NX_JW_.q.replace(/\s/g, '');
    var rows = NX_JW_.list.filter(function(x){
      if (NX_JW_.group && x.무리 !== NX_JW_.group) return false;
      if (!q) return true;
      return (x.이름 + ' ' + (x.별칭 || []).join(' ') + ' ' + (x.근거 || []).join(' ')).replace(/\s/g, '').indexOf(q) !== -1;
    });
    box.innerHTML = rows.length ? rows.map(function(x){
      return '<button type="button" class="jw-item' + (NX_JW_.cur && NX_JW_.cur.묶음 === x.묶음 ? ' on' : '') + '" data-k="' + nxJwEsc_(x.묶음) + '" title="' + nxJwEsc_((x.근거 || []).join(' · ')) + '">' + nxJwEsc_(x.이름) + '<small>' + nxJwEsc_(x.무리) + '</small></button>';
    }).join('') : '<div class="jw-empty">맞는 판정이 없습니다</div>';
  }
  function nxJwPick_(k){
    var x = (NX_JW_.list || []).filter(function(y){ return y.묶음 === k; })[0]; if (!x) return;
    NX_JW_.cur = x; NX_JW_.last = null;
    nxJwDrawList_();
    var R = document.getElementById('jgwRight');
    var head = '<div class="jw-head"><b>' + nxJwEsc_(x.이름) + '</b><span class="jw-law">' + nxJwEsc_((x.근거 || []).join(' · ')) + '</span></div>';
    if (x.따로창 === 'calc') { nxJwDrawCalc_(x); return; }
    if (x.따로창){
      var why = x.따로창 === 'taxRelief' ? '계산기 양도 카드의 물건·세대를 읽어 판정합니다. 장부에 적힌 사실로 바로 돌릴 수도 있습니다.' : '계산기 화면의 창으로 엽니다(그 창의 칸을 채워 판정).';
      R.innerHTML = head + '<p style="font-size:13px;">' + why + '</p><div class="jw-actions">' +
        (x.따로창 === 'taxRelief' ? '<button type="button" class="primary-btn" id="jgwRun">장부로 돌리기</button><button type="button" class="ghost-btn" id="jgwSave" disabled title="먼저 돌려 보세요">장부에 남기기</button>' : '') +
        '<button type="button" class="ghost-btn" id="jgwOther">계산기 창 열기</button></div><div id="jgwRes"></div>';
      R.querySelector('#jgwOther').onclick = function(){ nxJwOpenOld_(x.따로창); };
      if (x.따로창 === 'taxRelief') nxJwWireRun_(R);
      return;
    }
    R.innerHTML = head + '<div class="jw-empty">장부에서 칸을 채우는 중…</div>';
    callGas('case_proc', { caseId: NX_JW_.caseId, step: 'ledgerJudgePrefill', 묶음: x.묶음 }).then(function(r){
      if (NX_JW_.cur !== x) return;
      nxJwDrawForm_(x, (r && r.ok && r.값) || {}, (r && r.ok && r.출처) || {});
    }).catch(function(){ if (NX_JW_.cur === x) nxJwDrawForm_(x, {}, {}); });
  }
  // [2026.11.04 큰일 ⑩-1] 「계산」 무리 — 넥스만 쓰던 계산 도구를 같은 엔진으로 화면에서 직접 돌림(서버·토큰 0, 보기만)
  function nxJwCalcLabel_(f){
    var d = String(f.설명 || '').replace(/^\[[^\]]*\]\s*/, '');
    var h = d.split(/[(（,.—]/)[0].trim();
    if (/^\w+\s*=/.test(h)) h = (f.종류 === '고르기' ? '종류' : f.이름);
    return (h && h.length <= 28 ? h : (h || f.이름).slice(0, 26) + '…') + (f.꼭 ? ' *' : '');
  }
  function nxJwDrawCalc_(x){
    var R = document.getElementById('jgwRight');
    var html = '<div class="jw-head"><b>' + nxJwEsc_(x.이름) + '</b><span class="jw-law">' + nxJwEsc_((x.근거 || []).join(' · ')) + '</span></div>';
    html += '<p style="font-size:12.5px; color:var(--sub); margin:0 0 8px;">넥스가 쓰는 것과 같은 계산 엔진으로 바로 돌립니다(보기만 — 장부에는 넣지 않음). * 칸은 꼭 넣을 칸, 칸 이름에 손을 대면 자세한 설명이 뜹니다.</p>';
    html += '<div class="jw-fields">' + (x.칸 || []).map(function(f){
      var lab = nxJwCalcLabel_(f), tip = nxJwEsc_(f.이름 + ' — ' + (f.설명 || ''));
      var id = 'jw_' + f.이름.replace(/[^\w가-힣]/g, '_');
      if (f.종류 === '고르기') return '<div class="jw-f"><label for="' + id + '" title="' + tip + '">' + nxJwEsc_(lab) + '</label><select id="' + id + '" data-p="' + nxJwEsc_(f.이름) + '" data-t="s" title="' + tip + '"><option value="" class="ph">고르세요</option>' +
        (f.보기 || []).map(function(o){ var m = String(f.설명 || '').match(new RegExp(String(o).replace(/[^\w]/g, '') + '\\s*=\\s*([^,(=]+?)(?=[,(]|\\s\\w+\\s*=|$)')); return '<option value="' + nxJwEsc_(o) + '">' + nxJwEsc_(m ? m[1].trim() : o) + '</option>'; }).join('') + '</select></div>';
      if (f.종류 === '목록' || f.종류 === '묶음') return '<div class="jw-f wide"><label for="' + id + '" title="' + tip + '">' + nxJwEsc_(lab) + '</label><textarea rows="3" id="' + id + '" data-p="' + nxJwEsc_(f.이름) + '" data-t="j" title="' + tip + '"></textarea></div>';
      return '<div class="jw-f"><label for="' + id + '" title="' + tip + '">' + nxJwEsc_(lab) + '</label>' + nxJwInput_({ 이름: lab, 종류: f.종류 }, '', f.이름) + '</div>';
    }).join('') + '</div>';
    html += '<div class="jw-actions"><button type="button" class="primary-btn" id="jgwRun">돌리기</button></div><div id="jgwRes"></div>';
    R.innerHTML = html;
    R.querySelector('#jgwRun').onclick = function(){
      var facts, box = document.getElementById('jgwRes');
      try { facts = nxJwFacts_(R); } catch (err) { showToast(err.message, 'warn'); return; }
      var miss = (x.칸 || []).filter(function(f){ return f.꼭 && facts[f.이름] === undefined; });
      if (miss.length){ showToast('꼭 넣을 칸이 비었습니다 — ' + miss.map(nxJwCalcLabel_).join(', '), 'warn'); return; }
      var fn = window[x.엔진];
      if (typeof fn !== 'function'){ box.innerHTML = '<div class="jw-res">계산 엔진에 이 계산이 없습니다(' + nxJwEsc_(x.엔진) + ')</div>'; return; }
      var r;
      try { r = fn(facts); } catch (err) { box.innerHTML = '<div class="jw-res"><span class="jw-badge no">계산 오류</span> ' + nxJwEsc_(err.message || String(err)) + '</div>'; return; }
      r = r || {};
      var bad = r.error || r.오류;
      var lines = Object.keys(r).filter(function(k){ var v = r[k]; return v != null && typeof v !== 'object' && k !== 'error'; }).slice(0, 24);
      var h = '<div class="jw-res">' + (bad ? '<div class="jw-verdict"><span class="jw-badge no">계산 못 함</span><span>' + nxJwEsc_(bad) + '</span></div>' : '') +
        (lines.length ? '<div style="overflow-x:auto;"><table class="jw-req"><tbody>' + lines.map(function(k){ var v = r[k]; return '<tr><td>' + nxJwEsc_(k) + '</td><td class="r">' + nxJwEsc_(typeof v === 'number' ? v.toLocaleString('ko-KR') : v === true ? '예' : v === false ? '아니오' : String(v)) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '');
      var note = nxJwList_([].concat(r.알림 || [], r.warnings || [], r.notes || [])); if (note) h += '<h4>알림</h4>' + note;
      h += '<details><summary style="cursor:pointer; font-size:12.5px;">계산 결과 전체 보기</summary><pre>' + nxJwEsc_(JSON.stringify(r, null, 1)) + '</pre></details></div>';
      box.innerHTML = h;
    };
  }
  function nxJwInput_(f, v, path){
    var id = 'jw_' + path.replace(/[^\w가-힣]/g, '_'), val = v == null ? '' : v;
    var t = f.종류 || '글';
    if (t === '예아니오'){
      var s = val === true ? '예' : val === false ? '아니오' : String(val);
      return '<select id="' + id + '" data-p="' + nxJwEsc_(path) + '" data-t="yn" aria-label="' + nxJwEsc_(f.이름) + '"><option value="" class="ph">고르세요</option>' +
        ['예', '아니오', '모름'].map(function(o){ return '<option' + (o === s ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select>';
    }
    if (t === '날짜') return '<input type="date" id="' + id + '" data-p="' + nxJwEsc_(path) + '" data-t="d" value="' + nxJwEsc_(/^\d{4}-\d{2}-\d{2}$/.test(String(val)) ? val : '') + '" aria-label="' + nxJwEsc_(f.이름) + '">';
    if (t === '숫자') return '<input type="text" inputmode="decimal" id="' + id + '" data-p="' + nxJwEsc_(path) + '" data-t="n" value="' + nxJwEsc_(typeof val === 'number' ? val.toLocaleString('ko-KR') : val) + '" aria-label="' + nxJwEsc_(f.이름) + '" title="숫자 또는 「3억 5천만」처럼">';
    return '<input type="text" id="' + id + '" data-p="' + nxJwEsc_(path) + '" data-t="s" value="' + nxJwEsc_(typeof val === 'object' ? JSON.stringify(val) : val) + '" aria-label="' + nxJwEsc_(f.이름) + '">';
  }
  // 속칸 종류는 이름 끝말로 가늠(서버가 윗칸만 종류를 알려 줌)
  function nxJwSubKind_(n){
    if (/(일|일자|날)$/.test(n) && !/(일수|일세대)$/.test(n)) return '날짜';
    if (/(가액|금액|액|채무|면적|지분|비율|율|연수|개월|세액|이익|주식수|보증금|년)$/.test(n)) return '숫자';
    if (/^(대습|결격|포기|사망|상장|거주|자녀|배우자|특수관계|증빙|인정)/.test(n) || /(여부|했나|있나)$/.test(n)) return '예아니오';
    return '글';
  }
  function nxJwSubRow_(f, i, obj){
    return '<div class="jw-subrow" data-row="' + i + '">' + f.속칸.map(function(s){
      return '<label>' + nxJwEsc_(s) + nxJwInput_({ 이름: s, 종류: nxJwSubKind_(s) }, obj ? obj[s] : '', f.이름 + '.' + i + '.' + s) + '</label>';
    }).join('') + (f.종류 === '목록' ? '<button type="button" class="ghost-btn sm jw-subdel" data-del="' + nxJwEsc_(f.이름) + '" title="이 줄 지우기" aria-label="이 줄 지우기">✕</button>' : '') + '</div>';
  }
  function nxJwDrawForm_(x, vals, from){
    var R = document.getElementById('jgwRight');
    var fields = x.칸 || [];
    var html = '<div class="jw-head"><b>' + nxJwEsc_(x.이름) + '</b><span class="jw-law">' + nxJwEsc_((x.근거 || []).join(' · ')) + '</span></div>';
    var filled = Object.keys(from).length;
    html += '<p style="font-size:12.5px; color:var(--sub); margin:0 0 8px;">' + (filled ? '장부·지난 판정에서 ' + filled + '칸을 채웠습니다. ' : '') + '모르는 칸은 비워 두면 「?」로 남고 판정은 잠정이 됩니다.</p>';
    html += '<div class="jw-fields">' + fields.map(function(f){
      var fr = from[f.이름] ? '<span class="jw-from' + (/잠정/.test(from[f.이름]) ? ' tent' : '') + '" title="' + nxJwEsc_(from[f.이름]) + '">' + nxJwEsc_(from[f.이름]) + '</span>' : '';
      if ((f.종류 === '목록' || f.종류 === '묶음') && f.속칸 && f.속칸.length){
        var v = vals[f.이름];
        var rows = f.종류 === '목록' ? (Array.isArray(v) && v.length ? v : [{}]) : [v && typeof v === 'object' ? v : {}];
        return '<div class="jw-f wide" data-group="' + nxJwEsc_(f.이름) + '" data-kind="' + f.종류 + '"><label>' + nxJwEsc_(f.이름) + (f.종류 === '목록' ? ' (여럿)' : '') + '</label><div class="jw-sub">' +
          rows.map(function(o, i){ return nxJwSubRow_(f, i, o); }).join('') +
          (f.종류 === '목록' ? '<div><button type="button" class="ghost-btn sm" data-add="' + nxJwEsc_(f.이름) + '">줄 더하기</button></div>' : '') + '</div>' + fr + '</div>';
      }
      if (f.종류 === '목록' || f.종류 === '묶음'){
        var tv = vals[f.이름] != null ? JSON.stringify(vals[f.이름], null, 1) : '';
        return '<div class="jw-f wide"><label for="jw_' + nxJwEsc_(f.이름) + '">' + nxJwEsc_(f.이름) + '</label><textarea rows="3" id="jw_' + nxJwEsc_(f.이름) + '" data-p="' + nxJwEsc_(f.이름) + '" data-t="j" title="' + (f.종류 === '목록' ? '[{…},{…}] 모양' : '{…} 모양') + '">' + nxJwEsc_(tv) + '</textarea>' + fr + '</div>';
      }
      return '<div class="jw-f"><label for="jw_' + nxJwEsc_(f.이름).replace(/[^\w가-힣]/g, '_') + '">' + nxJwEsc_(f.이름) + '</label>' + nxJwInput_(f, vals[f.이름], f.이름) + fr + '</div>';
    }).join('') + '</div>';
    html += '<div class="jw-actions"><button type="button" class="primary-btn" id="jgwRun">돌리기</button><button type="button" class="ghost-btn" id="jgwSave" disabled title="먼저 돌려 보세요">장부에 남기기</button></div><div id="jgwRes"></div>';
    R.innerHTML = html;
    R.querySelectorAll('[data-add]').forEach(function(b){
      b.onclick = function(){
        var f = fields.filter(function(y){ return y.이름 === b.getAttribute('data-add'); })[0];
        var sub = b.closest('.jw-sub'), n = sub.querySelectorAll('.jw-subrow').length;
        b.parentNode.insertAdjacentHTML('beforebegin', nxJwSubRow_(f, n, {}));
      };
    });
    R.addEventListener('click', function(e){ var d = e.target.closest('[data-del]'); if (!d) return; var row = d.closest('.jw-subrow'), sub = row.parentNode; if (sub.querySelectorAll('.jw-subrow').length > 1) row.remove(); else row.querySelectorAll('input,select').forEach(function(i){ i.value = ''; }); });
    nxJwWireRun_(R);
  }
  function nxJwVal_(el){
    var t = el.getAttribute('data-t'), v = el.value.trim();
    if (v === '') return undefined;
    if (t === 'yn') return v === '예' ? true : v === '아니오' ? false : undefined;
    if (t === 'n'){ var c = v.replace(/[,\s원]/g, ''); return /^-?\d+(\.\d+)?$/.test(c) ? Number(c) : v; }
    if (t === 'j'){ try { return JSON.parse(v); } catch (e) { throw new Error('「' + el.getAttribute('data-p') + '」 칸 모양이 틀렸습니다(대괄호·중괄호 확인)'); } }
    return v;
  }
  function nxJwFacts_(R){
    var facts = {};
    R.querySelectorAll('.jw-fields > .jw-f').forEach(function(box){
      var g = box.getAttribute('data-group');
      if (g){
        var rows = [];
        box.querySelectorAll('.jw-subrow').forEach(function(row){
          var o = {}, any = false;
          row.querySelectorAll('[data-p]').forEach(function(el){ var v = nxJwVal_(el); if (v !== undefined){ o[el.getAttribute('data-p').split('.').slice(2).join('.')] = v; any = true; } });
          if (any) rows.push(o);
        });
        if (box.getAttribute('data-kind') === '목록'){ if (rows.length) facts[g] = rows; }
        else if (rows[0]) facts[g] = rows[0];
        return;
      }
      var el = box.querySelector('[data-p]'); if (!el) return;
      var v = nxJwVal_(el); if (v !== undefined) facts[el.getAttribute('data-p')] = v;
    });
    return facts;
  }
  function nxJwWireRun_(R){
    var run = R.querySelector('#jgwRun'), save = R.querySelector('#jgwSave');
    var go = function(write){
      var x = NX_JW_.cur, facts;
      try { facts = x.따로창 ? {} : nxJwFacts_(R); } catch (err) { showToast(err.message, 'warn'); return; }
      var p = { caseId: NX_JW_.caseId, step: 'ledgerJudge', by: '세무사님', 묶음: x.묶음, write: !!write };
      Object.keys(facts).forEach(function(k){ if (!(k in p)) p[k] = facts[k]; });
      p.facts = facts;
      run.disabled = true; if (save) save.disabled = true;
      callGas('case_proc', p).then(function(r){
        if (!r || !r.ok) throw new Error((r && (r.error || r.message)) || '판정을 돌리지 못했습니다');
        NX_JW_.last = { facts: facts, r: r };
        nxJwDrawRes_(r, write);
        if (write) showToast('장부에 남겼습니다 — ' + (r.장부 || x.이름), 'ok');
      }).catch(function(err){ showToast(err.message || String(err), 'warn'); })
        .then(function(){ run.disabled = false; if (save) { save.disabled = !NX_JW_.last; save.title = NX_JW_.last ? '이 사실과 결과를 사건 장부 판정 기록에 남깁니다' : '먼저 돌려 보세요'; } });
    };
    run.onclick = function(){ go(false); };
    if (save) save.onclick = function(){ go(true); };
  }
  // 할 일 줄은 {무엇, 때, 기한…} 모양 — 「무엇 (때)」로 읽히게, 같은 줄은 한 번만
  function nxJwLine_(s){
    if (s == null || typeof s !== 'object') return String(s == null ? '' : s);
    var main = s.무엇 || s.할일 || s.이름 || s.글 || s.내용 || '';
    var when = s.때 || s.기한 || s.날 || '';
    if (!main) return Object.keys(s).map(function(k){ var v = s[k]; return k + ' ' + (typeof v === 'object' ? JSON.stringify(v) : v); }).join(' · ');
    return main + (when ? ' (' + when + ')' : '');
  }
  function nxJwList_(a){
    var seen = {};
    a = (Array.isArray(a) ? a : a ? [a] : []).map(nxJwLine_).filter(function(s){ if (!s || seen[s]) return false; seen[s] = 1; return true; });
    return a.length ? '<ul>' + a.map(function(s){ return '<li>' + nxJwEsc_(s) + '</li>'; }).join('') + '</ul>' : '';
  }
  function nxJwDrawRes_(out, wrote){
    var box = document.getElementById('jgwRes'); if (!box) return;
    var r = out.결과 || {};
    var cls = r.결론 === '안 됨' ? 'no' : r.잠정 ? 'tent' : 'ok';
    var h = '<div class="jw-res"><div class="jw-verdict"><span class="jw-badge ' + cls + '">' + nxJwEsc_(r.결론 || '?') + (r.잠정 ? ' — 잠정' : '') + '</span><span>' + nxJwEsc_(r.표시 || '') + '</span></div>';
    var req = Array.isArray(r.요건) ? r.요건 : [];
    if (req.length) h += '<h4>요건</h4><div style="overflow-x:auto;"><table class="jw-req"><colgroup><col class="c1"><col class="c2"><col><col class="c4"></colgroup><thead><tr><th>요건</th><th>결과</th><th>왜</th><th>근거</th></tr></thead><tbody>' +
      req.map(function(q){ return '<tr><td>' + nxJwEsc_(q.이름) + '</td><td class="r" style="color:' + (q.결과 === '✔' ? '#1d6b32' : q.결과 === '✘' ? '#a12626' : '#8a6412') + ';">' + nxJwEsc_(q.결과) + '</td><td>' + nxJwEsc_(q.왜) + '</td><td class="law">' + nxJwEsc_(q.근거) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    var left = nxJwList_(r.남은것); if (left) h += '<h4>더 확인할 것</h4>' + left;
    var todo = nxJwList_(r.할일); if (todo) h += '<h4>할 일</h4>' + todo;
    var law = nxJwList_(r.근거); if (law) h += '<h4>근거</h4>' + law;
    var note = nxJwList_([].concat(r.알림 || [], out.알림 || [])); if (note) h += '<h4>알림</h4>' + note;
    if (r.엔진칸) h += '<details><summary style="cursor:pointer; font-size:12.5px;">계산기에 넣을 칸 보기</summary><pre>' + nxJwEsc_(JSON.stringify(r.엔진칸, null, 1)) + '</pre></details>';
    h += '<div style="font-size:12px; color:var(--sub);">' + nxJwEsc_(wrote ? '장부: ' + (out.장부 || '남김') : (out.장부 || '보기만 — 장부에 넣지 않음')) + '</div></div>';
    box.innerHTML = h;
  }
  // 옛 창 셋 — 계산기 화면(이 사건)을 연 뒤 그 창을 띄운다
  function nxJwOpenOld_(kind){
    var ov = document.getElementById('nxJudgeOverlay'); if (ov) ov.remove();
    var fn = kind === 'taxRelief' ? 'openTaxReliefJudgeModal_' : kind === 'nonBizLand' ? 'openNonBusinessLandModal_' : 'openMajorShareholderModal_';
    var open = function(){ if (typeof window[fn] === 'function') window[fn](0); else showToast('계산기 창을 열지 못했습니다', 'warn'); };
    if (document.getElementById('view-taxcalc') && document.getElementById('view-taxcalc').classList.contains('active')) { open(); return; }
    if (typeof nxCbGo_ === 'function') nxCbGo_('taxcalc', NX_JW_.caseId);
    setTimeout(open, 900);
  }
</script>
