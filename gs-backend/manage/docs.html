  function renderPdfMgrList(){
    pdfMgrList.innerHTML = '';
    pdfMgrEntries.forEach(function(entry, idx){
      var row = document.createElement('div');
      row.className = 'scan-tray-item';
      row.dataset.idx = idx;
      var isImage = entry.type === 'image';
      var rotLabel = (!isImage && entry.rotation) ? (' (' + entry.rotation + '° 회전)') : '';
      var signedLabel = isImage ? ' (서명 적용됨 — 그림 페이지)' : '';
      var chipIcon = isImage ? '🖋' : '📄';
      // 서명 배치·회전은 원본 페이지 상태일 때만 의미가 있다 — 이미 그림으로 바뀐 페이지는
      // 다시 서명 위치를 잡거나 돌릴 필요가 없으므로 버튼 자체를 안 보여준다.
      var signBtn = !isImage ? '<button data-act="sign" title="이 페이지에 서명 정밀 배치">✍</button>' : '';
      var rotateBtn = !isImage ? '<button data-act="rotate" title="90도 회전 — 원본이 옆으로/거꾸로 되어 있을 때">↻</button>' : '';
      row.innerHTML = '<label class="pdf-mgr-check"><input type="checkbox"' + (entry.checked ? ' checked' : '') + '></label>'
        + '<div class="scan-tray-grip"><span class="pdf-chip-icon">' + chipIcon + '</span>'
        + '<span class="name">' + escapeHtml(entry.sourceName) + ' - ' + (entry.pageIndex + 1) + '페이지' + rotLabel + signedLabel + '</span></div>'
        + signBtn + rotateBtn
        + '<button data-act="del" title="목록에서 빼기">✕</button>';
      row.querySelector('input[type="checkbox"]').addEventListener('change', function(e){
        entry.checked = e.target.checked;
      });
      row.querySelectorAll('button').forEach(function(btn){
        btn.addEventListener('click', function(){
          var act = btn.dataset.act;
          if (act === 'del'){ pdfMgrEntries.splice(idx, 1); renderPdfMgrList(); }
          else if (act === 'rotate'){ entry.rotation = (entry.rotation + 90) % 360; renderPdfMgrList(); }
          else if (act === 'sign'){ openSignaturePlacement(entry, idx); }
        });
      });
      setupPdfMgrDrag(row);
      pdfMgrList.appendChild(row);
    });
  }

  // 드래그 재정렬 — 스캔 바구니와 완전히 같은 방식(document 전체에서 이동/종료 신호를 받음).
  function setupPdfMgrDrag(row){
    var grip = row.querySelector('.scan-tray-grip');
    function onMove(e){
      var after = getPdfMgrDragAfterElement(e.clientY);
      if (after == null) pdfMgrList.appendChild(row);
      else if (after !== row) pdfMgrList.insertBefore(row, after);
    }
    function onEnd(){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onEnd);
      document.removeEventListener('pointercancel', onEnd);
      row.classList.remove('dragging');
      var newOrder = Array.from(pdfMgrList.children).map(function(el){ return Number(el.dataset.idx); });
      pdfMgrEntries = newOrder.map(function(i){ return pdfMgrEntries[i]; });
      renderPdfMgrList();
    }
    grip.addEventListener('pointerdown', function(e){
      e.preventDefault();
      row.classList.add('dragging');
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onEnd);
      document.addEventListener('pointercancel', onEnd);
    });
  }
  function getPdfMgrDragAfterElement(y){
    var items = Array.from(pdfMgrList.querySelectorAll('.scan-tray-item:not(.dragging)'));
    return items.reduce(function(closest, child){
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
      return closest;
    }, { offset: -Infinity, element: null }).element;
  }

  document.getElementById('btnPdfMgrCheckAll').addEventListener('click', function(){
    if (!pdfMgrEntries.length) return;
    var allChecked = pdfMgrEntries.every(function(en){ return en.checked; });
    pdfMgrEntries.forEach(function(en){ en.checked = !allChecked; });
    renderPdfMgrList();
  });

  // 체크된(또는 전체) 항목들을 순서 그대로 하나의 새 PDF 바이트로 만든다.
  async function buildPdfFromPdfMgrEntries(entries){
    var outDoc = await PDFLib.PDFDocument.create();

    // 워터마크 — 문구가 있으면 모든 페이지에 대각선으로 반투명하게 깐다.
    // 주의: 기본 내장 폰트(Helvetica)는 영문/숫자만 정확히 나온다 — 한글은 깨지거나
    // 안 나올 수 있으니, 워터마크 문구는 영문 위주로 쓰는 걸 권장한다(예: DRAFT, CONFIDENTIAL).
    var watermarkText = pdfMgrWatermarkText.value.trim();
    var watermarkFont = watermarkText ? await outDoc.embedFont(PDFLib.StandardFonts.HelveticaBold) : null;

    // 서명(도장) — 등록되어 있으면 한 번만 삽입(embed)해두고 페이지마다 재사용한다.
    var signatureImage = null;
    if (pdfMgrSignatureBytes){
      try{ signatureImage = await outDoc.embedPng(pdfMgrSignatureBytes); }
      catch(e){
        try{ signatureImage = await outDoc.embedJpg(pdfMgrSignatureBytes); }
        catch(e2){ toast('서명 이미지 형식을 읽지 못해 서명 없이 진행합니다.'); }
      }
    }

    for (var k = 0; k < entries.length; k++){
      var entry = entries[k];
      if (entry.type === 'image'){
        // 서명 정밀배치로 이미 그림으로 확정된 페이지 — 원래 페이지와 같은 크기로 새 페이지를 만들고
        // 그 그림을 그대로 채운다(이미 서명은 그림 안에 포함되어 있음). 워터마크만 그 위에 추가로 얹을 수 있다.
        var pngBytes = dataUrlToUint8(entry.imageDataUrl);
        var embeddedImg = await outDoc.embedPng(pngBytes);
        var imgPage = outDoc.addPage([entry.pagePtWidth, entry.pagePtHeight]);
        imgPage.drawImage(embeddedImg, { x: 0, y: 0, width: entry.pagePtWidth, height: entry.pagePtHeight });
        if (watermarkText){
          imgPage.drawText(watermarkText, {
            x: entry.pagePtWidth / 2 - watermarkText.length * 9,
            y: entry.pagePtHeight / 2,
            size: 40, font: watermarkFont, color: PDFLib.rgb(0.6, 0.6, 0.6), opacity: 0.28,
            rotate: PDFLib.degrees(45)
          });
        }
        continue;
      }

      var copiedArr = await outDoc.copyPages(entry.doc, [entry.pageIndex]);
      var copied = copiedArr[0];
      if (entry.rotation){
        var currentAngle = copied.getRotation().angle || 0;
        copied.setRotation(PDFLib.degrees((currentAngle + entry.rotation) % 360));
      }
      var size = copied.getSize();
      var width = size.width, height = size.height;

      if (watermarkText){
        copied.drawText(watermarkText, {
          x: width / 2 - watermarkText.length * 9,
          y: height / 2,
          size: 40,
          font: watermarkFont,
          color: PDFLib.rgb(0.6, 0.6, 0.6),
          opacity: 0.28,
          rotate: PDFLib.degrees(45)
        });
      }
      if (signatureImage){
        var sigW = 120, sigH = 120 * (signatureImage.height / signatureImage.width);
        var margin = 24;
        var pos = pdfMgrSignaturePos.value;
        var sx, sy;
        if (pos === 'bl'){ sx = margin; sy = margin; }
        else if (pos === 'tr'){ sx = width - sigW - margin; sy = height - sigH - margin; }
        else if (pos === 'tl'){ sx = margin; sy = height - sigH - margin; }
        else if (pos === 'center'){ sx = width / 2 - sigW / 2; sy = height / 2 - sigH / 2; }
        else { sx = width - sigW - margin; sy = margin; } // 기본값: 우측 하단(br)
        copied.drawImage(signatureImage, { x: sx, y: sy, width: sigW, height: sigH });
      }

      outDoc.addPage(copied);
    }
    return await outDoc.save();
  }

  // ============================================================
  // 서명 관리 — 한 번 등록한 서명을 브라우저(localStorage)에 저장해뒀다가 다음에 자동으로
  // 다시 불러오고, 파일 업로드뿐 아니라 화면(터치/마우스)에 직접 그려서 바로 등록할 수도 있다.
  // [2026.09 이식] document-tools.js 로직을 그대로 옮겨왔다.

  var SIGNATURE_STORAGE_KEY = 'nx_saved_signature';

  function updateSignatureStatusUI(){
    pdfMgrSignatureStatus.textContent = pdfMgrSignatureBytes
      ? '서명 등록됨 — 저장 시 모든 페이지 우측 하단에 찍힙니다'
      : '';
  }

  function bytesToDataUrl_(bytes, mime){
    mime = mime || 'image/png';
    var binary = '';
    bytes.forEach(function(b){ binary += String.fromCharCode(b); });
    return 'data:' + mime + ';base64,' + btoa(binary);
  }

  function saveSignatureBytes_(bytes){
    pdfMgrSignatureBytes = bytes;
    try{ localStorage.setItem(SIGNATURE_STORAGE_KEY, bytesToDataUrl_(bytes)); }
    catch(e){ toast('서명을 브라우저에 저장하지 못했습니다(용량 초과 가능) — 이번 화면에서는 계속 쓸 수 있습니다.'); }
    updateSignatureStatusUI();

  }

  try{
    var savedSignatureDataUrl = localStorage.getItem(SIGNATURE_STORAGE_KEY);
    if (savedSignatureDataUrl) pdfMgrSignatureBytes = dataUrlToUint8(savedSignatureDataUrl);
  }catch(e){}

  var sigDrawCtx = null;

  function setupSigDrawCanvas_(){
    // 화면에 보이는 CSS 크기 기준으로 캔버스 실제 픽셀 크기를 맞춘다(고해상도 화면에서도 선명하게).
    var rect = sigDrawCanvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    sigDrawCanvas.width = Math.max(1, Math.round(rect.width * dpr));
    sigDrawCanvas.height = Math.max(1, Math.round(rect.height * dpr));
    sigDrawCtx = sigDrawCanvas.getContext('2d');
    sigDrawCtx.scale(dpr, dpr);
    sigDrawCtx.fillStyle = '#fff';
    sigDrawCtx.fillRect(0, 0, rect.width, rect.height);
    sigDrawCtx.lineWidth = 2.5;
    sigDrawCtx.lineCap = 'round';
    sigDrawCtx.lineJoin = 'round';
    sigDrawCtx.strokeStyle = '#1a1a2e';
  }
  function sigDrawPos_(e){
    var rect = sigDrawCanvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  sigDrawCanvas.addEventListener('pointerdown', function(e){
    if (!sigDrawCtx) return;
    sigDrawing = true;
    sigDrawCanvas.setPointerCapture(e.pointerId);
    var p = sigDrawPos_(e);
    sigDrawCtx.beginPath();
    sigDrawCtx.moveTo(p.x, p.y);
  });
  sigDrawCanvas.addEventListener('pointermove', function(e){
    if (!sigDrawing || !sigDrawCtx) return;
    var p = sigDrawPos_(e);
    sigDrawCtx.lineTo(p.x, p.y);
    sigDrawCtx.stroke();
  });
  function endSigDraw_(){ sigDrawing = false; }
  sigDrawCanvas.addEventListener('pointerup', endSigDraw_);

  async function openSignaturePlacement(entry, idx){

  // "적용" — 지금 화면(페이지 그림 + 그 위 서명 위치)을 그대로 합쳐서 하나의 이미지로 굽고,

  // ============================================================
  // 텍스트 추출(OCR) — 체크한 페이지를 이미지로 그려서 Tesseract.js로 글자를 읽어낸다.
  // 전부 브라우저 안에서 처리되고 서버로는 아무것도 전송되지 않는다(API 비용이 전혀 안 든다).
  // 인쇄된 문서(등기부등본·세금계산서 등)에 적합하고, 손글씨는 정확도가 낮다.
  // 결과는(채팅이 없는 이 앱이라) 별도 결과창에 보여주고 클립보드로 복사할 수 있게 한다.
  // [2026.09 이식] document-tools.js 로직을 그대로 옮겨왔다.
  // ============================================================
  var tesseractWorker_ = null;
  async function getTesseractWorker_(){
    if (tesseractWorker_) return tesseractWorker_;
    tesseractWorker_ = await Tesseract.createWorker(['kor', 'eng']);
    return tesseractWorker_;
  }

  async function renderPdfMgrEntryToCanvas_(entry){
    if (!entry.pdfjsDoc) throw new Error('이 페이지는 미리보기용 문서가 없어 텍스트를 추출할 수 없습니다.');
    var page = await entry.pdfjsDoc.getPage(entry.pageIndex + 1);
    var viewport = page.getViewport({ scale: 2.5, rotation: entry.rotation || 0 });
    var canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
    return canvas;
  }

  document.getElementById('btnPdfMgrOcr').addEventListener('click', async function(){
    var targets = pdfMgrEntries.filter(function(en){ return en.checked; });
    if (!targets.length){ toast('텍스트를 추출할 페이지를 먼저 체크하세요.'); return; }
    var btn = document.getElementById('btnPdfMgrOcr');
    btn.disabled = true;
    try{
      var worker = await getTesseractWorker_();
      var parts = [];
      for (var i = 0; i < targets.length; i++){
        btn.textContent = '🔤 추출 중… (' + (i + 1) + '/' + targets.length + ')';
        var entry = targets[i];
        try{
          var canvas = await renderPdfMgrEntryToCanvas_(entry);
          var result = await worker.recognize(canvas);
          var label = entry.sourceName + ' - ' + (entry.pageIndex + 1) + '페이지';
          parts.push('[' + label + ']\n' + (result.data.text || '').trim());
        }catch(err){
          parts.push('[' + entry.sourceName + ' - ' + (entry.pageIndex + 1) + '페이지] 텍스트 추출 실패: ' + (err && err.message ? err.message : err));

  // ============================================================
  // [2026.09 이식] 계산기 — 사건 폴더별 임시 세액 개산 워크시트 (work.netax.kr explorer.js 이식).
  // [n] 참조 문법으로 앞 행을 계산에 쓰고, 누진세(...)·장특공제율(...) 등 세무 함수는
  // taxcalc-engine.html이 이미 정의해둔 window.resolveCalcTaxFunctions를 그대로 쓴다.
  // ============================================================
  var DOCS_CALC_FILE_NAME_ = '계산기.json';
  var docsCalcFolderId_ = null;
  var docsCalcFileId_ = null;
  var docsCalcRows_ = [];
  var docsCalcSaveTimer_ = null;

  function docsEvalCalcRows_(){
    var results = {};
    docsCalcRows_.forEach(function(row, idx){
      var ref = String(idx + 1);
      var raw = (row.formula || '').trim();
      var val = NaN;
      if (raw.indexOf('=') === 0){
        var expr = raw.slice(1).replace(/\[(\d+)\]/g, function(m, n){ return (n in results) ? String(results[n]) : '0'; });
        if (typeof resolveCalcTaxFunctions === 'function') expr = resolveCalcTaxFunctions(expr);
        expr = expr.replace(/%/g, '/100');
        if (/^[0-9+\-*/().\s]+$/.test(expr) && expr.trim()){
          try { val = Function('"use strict"; return (' + expr + ')')(); } catch(err){ val = NaN; }
        }
      } else if (raw !== ''){
        var n = Number(raw.replace(/,/g, ''));
        val = Number.isFinite(n) ? n : NaN;
      }
      results[ref] = Number.isFinite(val) ? val : 0;
      row.result = val;
    });
  }

  function docsRenderCalcRows_(){
    docsEvalCalcRows_();
    var body = document.getElementById('docsCalcRowsBody');
    body.innerHTML = '';
    docsCalcRows_.forEach(function(row, idx){
      var ref = '[' + (idx + 1) + ']';
      var tr = document.createElement('tr');
      tr.dataset.rowId = row.id;

      var tdRef = document.createElement('td');
      tdRef.style.cssText = 'padding:4px 6px; color:var(--sub); font-family:monospace;';
      tdRef.textContent = ref;

      var tdLabel = document.createElement('td');
      tdLabel.style.padding = '4px 6px';
      var labelInput = document.createElement('input');
      labelInput.type = 'text';
      labelInput.placeholder = '항목명';
      labelInput.value = row.label || '';
      labelInput.style.width = '100%';
      labelInput.addEventListener('input', function(){ row.label = labelInput.value; });
      labelInput.addEventListener('change', docsSaveCalc_);
      labelInput.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); docsInsertCalcRowAfter_(row.id, 'label'); } });
      tdLabel.appendChild(labelInput);

      var tdFormula = document.createElement('td');
      tdFormula.style.padding = '4px 6px';
      var formulaInput = document.createElement('input');
      formulaInput.type = 'text';
      formulaInput.placeholder = '예: 500000000 또는 =[1]*0.06';
      formulaInput.value = row.formula || '';
      formulaInput.style.width = '100%';
      formulaInput.addEventListener('input', function(){ row.formula = formulaInput.value; docsUpdateCalcResults_(); });
      formulaInput.addEventListener('change', docsSaveCalc_);
      formulaInput.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); docsInsertCalcRowAfter_(row.id, 'formula'); } });
      tdFormula.appendChild(formulaInput);

      var tdResult = document.createElement('td');
      tdResult.style.cssText = 'padding:4px 6px; text-align:right; font-weight:600;' + (Number.isFinite(row.result) ? '' : 'color:#c0392b;');
      tdResult.textContent = Number.isFinite(row.result) ? row.result.toLocaleString('ko-KR') : '오류';

      var tdDel = document.createElement('td');
      tdDel.style.padding = '4px 6px';
      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.textContent = '✕';
      delBtn.title = '이 행 삭제';
      delBtn.style.cssText = 'border:none; background:none; color:var(--sub); cursor:pointer; font-size:13px;';
      delBtn.addEventListener('click', function(){
        docsCalcRows_ = docsCalcRows_.filter(function(r){ return r.id !== row.id; });
        docsRenderCalcRows_();
        docsSaveCalc_();
      });
      tdDel.appendChild(delBtn);

      tr.appendChild(tdRef); tr.appendChild(tdLabel); tr.appendChild(tdFormula); tr.appendChild(tdResult); tr.appendChild(tdDel);
      body.appendChild(tr);

  // 행 구조(입력창)는 그대로 두고 결과 칸만 갱신 — 타이핑 중 커서가 날아가지 않도록.
  function docsUpdateCalcResults_(){
    docsEvalCalcRows_();
    docsCalcRows_.forEach(function(row){
      var tr = document.querySelector('#docsCalcRowsBody tr[data-row-id="' + row.id + '"]');
      if (!tr) return;
      var tdResult = tr.children[3];
      tdResult.style.color = Number.isFinite(row.result) ? '' : '#c0392b';
      tdResult.textContent = Number.isFinite(row.result) ? row.result.toLocaleString('ko-KR') : '오류';
    });
  }

  function docsInsertCalcRowAfter_(afterRowId, field){
    var idx = docsCalcRows_.findIndex(function(r){ return r.id === afterRowId; });
    var newRow = { id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6), label: '', formula: '' };
    docsCalcRows_.splice(idx + 1, 0, newRow);
    docsRenderCalcRows_();
    docsSaveCalc_();
    requestAnimationFrame(function(){
      var newTr = document.querySelector('#docsCalcRowsBody tr[data-row-id="' + newRow.id + '"]');
      if (!newTr) return;
      var targetTd = field === 'formula' ? newTr.children[2] : newTr.children[1];
      var targetInput = targetTd && targetTd.querySelector('input');
      if (targetInput) targetInput.focus();
    });
  }

  function docsAddCalcRow_(){
    docsCalcRows_.push({ id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6), label: '', formula: '' });
    docsRenderCalcRows_();
  }

  function docsSaveCalcNow_(){
    var statusEl = document.getElementById('docsCalcSaveStatus');
    statusEl.textContent = '저장 중…';
    var payload = {
      folderId: docsCalcFolderId_,
      name: DOCS_CALC_FILE_NAME_,
      mimeType: 'application/json',
      base64Data: utf8ToBase64(JSON.stringify(docsCalcRows_.map(function(r){ return { id: r.id, label: r.label, formula: r.formula }; })))
    };
    if (docsCalcFileId_) payload.fileId = docsCalcFileId_;
    return callGas('uploadFile', payload).then(function(res){
      if (res.error){ statusEl.textContent = '저장 실패'; toast('계산기 저장 실패: ' + res.error); return; }
      if (!docsCalcFileId_) docsCalcFileId_ = res.id;
      statusEl.textContent = '저장됨 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    }).catch(function(err){
      statusEl.textContent = '저장 실패';
      toast('계산기 저장 중 오류: ' + (err && err.message ? err.message : err));
    });
  }

  function docsSaveCalc_(){
    document.getElementById('docsCalcSaveStatus').textContent = '저장 대기…';
    clearTimeout(docsCalcSaveTimer_);
    docsCalcSaveTimer_ = setTimeout(docsSaveCalcNow_, 600);
  }

  function docsOpenCalcModal_(){
    if (!docsCurrentListing || !docsCurrentListing.folderId){ toast('먼저 폴더를 열어주세요.'); return; }
    docsCalcFolderId_ = docsCurrentListing.folderId;
    document.getElementById('docsCalcFolderLabel').textContent = docsPath.join(' / ');
    document.getElementById('docsCalcOverlay').style.display = 'flex';
    document.getElementById('docsCalcRowsBody').innerHTML = '<tr><td colspan="5" style="padding:10px; color:var(--sub);">불러오는 중…</td></tr>';
    var existing = (docsCurrentListing.files || []).find(function(f){ return f.name === DOCS_CALC_FILE_NAME_; });
    var loadPromise;
    if (existing){
      docsCalcFileId_ = existing.id;
      loadPromise = callGas('readFile', { fileId: existing.id }).then(function(fileData){
        docsCalcRows_ = fileData.content ? JSON.parse(fileData.content) : [];
      });
    } else {
      docsCalcFileId_ = null;
      docsCalcRows_ = [];
      loadPromise = Promise.resolve();
    }
    loadPromise.catch(function(){ docsCalcFileId_ = null; docsCalcRows_ = []; }).then(function(){
      if (!docsCalcRows_.length) docsAddCalcRow_();
      docsRenderCalcRows_();
    });
  }

  function docsCloseCalcModal_(){
    var pending = docsCalcSaveTimer_ ? (clearTimeout(docsCalcSaveTimer_), docsCalcSaveTimer_ = null, docsSaveCalcNow_()) : Promise.resolve();
    document.getElementById('docsCalcOverlay').style.display = 'none';
    pending.then(function(){ docsNavigate(docsPath); }); // 방금 저장한 계산기.json이 목록에 바로 보이도록

  document.getElementById('docsBtnCalcDeadlineRun').addEventListener('click', function(){
    var baseVal = document.getElementById('docsCalcDeadlineBaseDate').value;
    if (!baseVal){ toast('기준일을 먼저 선택하세요.'); return; }
    if (typeof dateFns === 'undefined'){ toast('날짜 계산 라이브러리를 불러오지 못했습니다.'); return; }
    var months = { transfer: 2, gift: 3, inheritance: 6, inheritance_overseas: 9 }[document.getElementById('docsCalcDeadlineType').value] || 0;
    var base = new Date(baseVal + 'T00:00:00');
    var monthEnd = dateFns.endOfMonth(base);
    var rough = dateFns.addMonths(monthEnd, months);
    // addMonths는 day-of-month를 유지하며 더하므로 도착한 달이 더 길면 말일이 아닐 수 있다 — 한 번 더 말일로 보정.
    var deadline = dateFns.endOfMonth(rough);
    var weekdayKo = ['일','월','화','수','목','금','토'][deadline.getDay()];
    document.getElementById('docsCalcDeadlineResult').textContent = '신고기한: ' + dateFns.format(deadline, 'yyyy-MM-dd') + ' (' + weekdayKo + ')';
  });

  document.getElementById('btnCloseDocsCalc').addEventListener('click', docsCloseCalcModal_);

  // ============================================================
  // [2026.09 이식] 관계도 — mermaid 문법으로 그리는 가계도·지분관계·조직도 (explorer.js 이식).
  // mermaid 라이브러리 자체와 NETAX 브랜드 테마 초기화는 reportwriter.html이 이미 해둔 것을 그대로 쓴다.
  // ============================================================
  var DOCS_DIAGRAM_FILE_NAME_ = '관계도.mmd';
  var DOCS_DIAGRAM_DEFAULT_ = 'graph TD\n  A[아버지] --> B[자녀1]\n  A --> C[자녀2]';
  var docsDiagramFolderId_ = null;
  var docsDiagramFileId_ = null;
  var docsDiagramRenderTimer_ = null;
  var docsDiagramRenderSeq_ = 0;

  function docsRenderDiagramPreview_(){
    var code = document.getElementById('docsDiagramInput').value.trim();
    var preview = document.getElementById('docsDiagramPreview');
    if (!code){
      preview.innerHTML = '<div style="color:var(--sub); font-size:12.5px;">왼쪽에 mermaid 문법으로 입력하면 여기에 그려집니다.</div>';
      return;
    }
    if (!window.mermaid){
      preview.innerHTML = '<div style="color:#c0392b; font-size:12.5px;">mermaid 라이브러리를 불러오지 못했습니다.</div>';
      return;
    }
    var id = 'docsDiagram' + (docsDiagramRenderSeq_++);
    mermaid.render(id, code).then(function(res){
      // [2026.09 버그수정] DOMPurify의 svg 프로필은 기본적으로 <foreignObject>를 허용하지 않는데,
      // mermaid의 flowchart 노드 라벨(htmlLabels:true, reportwriter.html의 전역 설정)은 그
      // foreignObject 안에 들어있어 — 그대로 두면 도형만 그려지고 글자(한글 라벨)가 통째로
      // 사라진다. ADD_TAGS로 foreignObject만 허용을 추가하고, 그 안 내용은 DOMPurify가 여전히
      // 정상적으로 한 번 더 걸러준다.
      preview.innerHTML = (typeof DOMPurify !== 'undefined')
        ? DOMPurify.sanitize(res.svg, { USE_PROFILES: { svg: true, svgFilters: true }, ADD_TAGS: ['foreignObject'] })
        : res.svg;
    }).catch(function(err){
      preview.innerHTML = '<div style="color:#c0392b; font-size:12.5px; white-space:pre-wrap;">문법 오류:\n' + escapeHtml(err && err.message ? err.message : String(err)) + '</div>';
    });
  }

  document.getElementById('docsDiagramInput').addEventListener('input', function(){
    clearTimeout(docsDiagramRenderTimer_);
    docsDiagramRenderTimer_ = setTimeout(docsRenderDiagramPreview_, 500);
  });

  function docsSaveDiagram_(){
    var payload = {
      folderId: docsDiagramFolderId_,
      name: DOCS_DIAGRAM_FILE_NAME_,
      mimeType: 'text/plain',
      base64Data: utf8ToBase64(document.getElementById('docsDiagramInput').value)
    };
    if (docsDiagramFileId_) payload.fileId = docsDiagramFileId_;
    return callGas('uploadFile', payload).then(function(res){
      if (res.error){ toast('관계도 저장 실패: ' + res.error); return; }
      if (!docsDiagramFileId_) docsDiagramFileId_ = res.id;
      var btn = document.getElementById('btnDocsDiagramSave');
      btn.textContent = '✓ 저장됨';
      clearTimeout(btn._flashTimer);
      btn._flashTimer = setTimeout(function(){ btn.textContent = '저장'; }, 1200);
    }).catch(function(err){
      toast('관계도 저장 중 오류: ' + (err && err.message ? err.message : err));
    });
  }

  function docsOpenDiagramModal_(){
    if (!docsCurrentListing || !docsCurrentListing.folderId){ toast('먼저 폴더를 열어주세요.'); return; }
    docsDiagramFolderId_ = docsCurrentListing.folderId;
    document.getElementById('docsDiagramFolderLabel').textContent = docsPath.join(' / ');
    document.getElementById('docsDiagramOverlay').style.display = 'flex';
    var existing = (docsCurrentListing.files || []).find(function(f){ return f.name === DOCS_DIAGRAM_FILE_NAME_; });
    var input = document.getElementById('docsDiagramInput');
    var loadPromise;
    if (existing){
      docsDiagramFileId_ = existing.id;
      loadPromise = callGas('readFile', { fileId: existing.id }).then(function(fileData){ input.value = fileData.content || ''; });
    } else {
      docsDiagramFileId_ = null;
      input.value = DOCS_DIAGRAM_DEFAULT_;
      loadPromise = Promise.resolve();
    }
    loadPromise.catch(function(){ docsDiagramFileId_ = null; input.value = DOCS_DIAGRAM_DEFAULT_; }).then(docsRenderDiagramPreview_);
  }

  function docsCloseDiagramModal_(){
    document.getElementById('docsDiagramOverlay').style.display = 'none';
    docsNavigate(docsPath); // 방금 저장한 관계도.mmd가 목록에 바로 보이도록 새로고침
  }

  // 보고서(reportwriter.html)는 이미 ```mermaid 코드블록을 도식으로 렌더링하므로, 여기서
  // 만든 관계도를 그 문법 그대로 복사해서 보고서 편집창에 붙여넣기만 하면 된다.
  document.getElementById('btnDocsDiagramCopy').addEventListener('click', function(){
    var code = document.getElementById('docsDiagramInput').value;
    var md = '```mermaid\n' + code + '\n```';
    navigator.clipboard.writeText(md).then(function(){ toast('mermaid 코드를 클립보드에 복사했습니다 — 보고서 편집창에 붙여넣으면 도식으로 표시됩니다.'); }).catch(function(){ toast('복사에 실패했습니다.'); });
  });
  document.getElementById('btnDocsDiagramSave').addEventListener('click', docsSaveDiagram_);
  document.getElementById('btnCloseDocsDiagram').addEventListener('click', function(){
    docsSaveDiagram_().then(docsCloseDiagramModal_);
  });

  // ============================================================
  // [2026.09 이식] 경과지 — 사건 폴더별 진행 경과 기록 보드 (explorer.js 이식).
  // 마감일이 있는 항목은 저장할 때 syncGlobalLog로 중앙 인덱스+구글캘린더에도 자동 반영된다
  // (handleSyncGlobalLog/syncCalendarForPath_는 Code.js에 이미 있음 — 여기선 UI만 새로 만든다).
  // ============================================================
  var DOCS_LOG_FILE_NAME_ = '경과지.json';
  var docsLogFolderId_ = null;
  var docsLogPath_ = [];
  var docsLogFileId_ = null;
  var docsLogEntries_ = [];

  function docsRenderLogList_(){
    var list = document.getElementById('docsLogList');
    list.innerHTML = '';
    if (!docsLogEntries_.length){
      list.innerHTML = '<div class="log-empty">아직 기록이 없습니다. 위에서 첫 항목을 추가해보세요.</div>';
      return;
    }
    var todayStr = new Date().toISOString().slice(0, 10);
    var sorted = docsLogEntries_.slice().sort(function(a, b){ return (b.date||'').localeCompare(a.date||''); });
    sorted.forEach(function(entry){
      var row = document.createElement('div');
      row.className = 'log-entry';
      var dueBadge = '';
      if (entry.dueDate){
        var overdue = entry.dueDate < todayStr;
        var dueToday = entry.dueDate === todayStr;
        var badgeColor = overdue ? '#c0392b' : (dueToday ? '#b8860b' : 'var(--sub)');
        dueBadge = '<span style="display:inline-block; margin-top:2px; font-size:10.5px; color:' + badgeColor + ';">📌 ' + escapeHtml(fmtDateShort_(entry.dueDate)) + '</span>';
      }
      row.innerHTML = '<div class="log-date">' + escapeHtml(fmtDateShort_(entry.date)) + dueBadge + '</div>'
        + '<div class="log-text">' + escapeHtml(entry.text || '') + '</div>'
        + '<button type="button" class="log-del" title="삭제">✕</button>';
      row.querySelector('.log-del').addEventListener('click', function(){
        docsLogEntries_ = docsLogEntries_.filter(function(e){ return e.id !== entry.id; });
        docsRenderLogList_();
        docsSaveLog_();
      });
      list.appendChild(row);
    });
  }

  function docsSaveLog_(){
    var statusEl = document.getElementById('docsLogSaveStatus');
    statusEl.textContent = '저장 중…';
    var payload = {
      folderId: docsLogFolderId_,
      name: DOCS_LOG_FILE_NAME_,
      mimeType: 'application/json',
      base64Data: utf8ToBase64(JSON.stringify(docsLogEntries_))
    };
    if (docsLogFileId_) payload.fileId = docsLogFileId_;
    return callGas('uploadFile', payload).then(function(res){
      if (res.error){ statusEl.textContent = '저장 실패'; toast('경과지 저장 실패: ' + res.error); return; }
      if (!docsLogFileId_) docsLogFileId_ = res.id;
      statusEl.textContent = '저장됨 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      // 현황판 등에서 폴더를 일일이 뒤지지 않고 모아볼 수 있는 중앙 인덱스+캘린더 동기화 —
      // 실패해도 이 폴더 저장 자체는 이미 끝났으므로 조용히 무시(다음 저장 때 다시 시도됨).
      callGas('syncGlobalLog', { path: docsLogPath_, entries: docsLogEntries_ }).catch(function(){});
    }).catch(function(err){
      statusEl.textContent = '저장 실패';
      toast('경과지 저장 중 오류: ' + (err && err.message ? err.message : err));
    });
  }

  function docsOpenLogModal_(){
    if (!docsCurrentListing || !docsCurrentListing.folderId){ toast('먼저 폴더를 열어주세요.'); return; }
    docsLogFolderId_ = docsCurrentListing.folderId;
    docsLogPath_ = docsPath.slice();
    document.getElementById('docsLogFolderLabel').textContent = docsPath.join(' / ');
    document.getElementById('docsLogOverlay').style.display = 'flex';
    document.getElementById('docsLogDateInput').value = new Date().toISOString().slice(0, 10);
    document.getElementById('docsLogTextInput').value = '';
    document.getElementById('docsLogDueInput').value = '';
    document.getElementById('docsLogList').innerHTML = '<div class="log-empty">불러오는 중…</div>';
    var existing = (docsCurrentListing.files || []).find(function(f){ return f.name === DOCS_LOG_FILE_NAME_; });
    var loadPromise;
    if (existing){
      docsLogFileId_ = existing.id;
      loadPromise = callGas('readFile', { fileId: existing.id }).then(function(fileData){
        docsLogEntries_ = fileData.content ? JSON.parse(fileData.content) : [];
      });
    } else {
      docsLogFileId_ = null;
      docsLogEntries_ = [];
      loadPromise = Promise.resolve();
    }
    loadPromise.catch(function(){ docsLogFileId_ = null; docsLogEntries_ = []; }).then(docsRenderLogList_);
  }

  function docsCloseLogModal_(){
    document.getElementById('docsLogOverlay').style.display = 'none';
    docsNavigate(docsPath); // 방금 저장한 경과지.json이 목록에 바로 보이도록
  }

  document.getElementById('btnDocsLogAdd').addEventListener('click', function(){
    var text = document.getElementById('docsLogTextInput').value.trim();
    if (!text) return;
    docsLogEntries_.push({
      id: 'e' + Date.now() + Math.random().toString(36).slice(2, 6),
      date: document.getElementById('docsLogDateInput').value || new Date().toISOString().slice(0, 10),
      text: text,
      dueDate: document.getElementById('docsLogDueInput').value || ''
    });
    document.getElementById('docsLogTextInput').value = '';
    document.getElementById('docsLogDueInput').value = '';
    docsRenderLogList_();
    docsSaveLog_();
  });
  document.getElementById('docsLogTextInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); document.getElementById('btnDocsLogAdd').click(); }
  });
  document.getElementById('btnCloseDocsLog').addEventListener('click', docsCloseLogModal_);
</script>
