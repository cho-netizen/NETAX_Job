<style>
  /* [2026.09 이식] PDF관리·서명·워터마크·화면캡처·바구니 드래그재정렬 — document-tools.js에서
     가져온 기능들의 전용 스타일. style.html은 건드리지 않고 이 파일 안에서만 추가한다. */
  .scan-tray{ display:flex; flex-direction:column; gap:6px; max-height:300px; overflow-y:auto; }
  .scan-tray-item.dragging{ opacity:0.5; }
  .pdf-mgr-check{ flex-shrink:0; display:flex; align-items:center; }
  .pdf-mgr-check input{ width:16px; height:16px; cursor:pointer; }
  #sigDrawCanvas{ width:100%; height:180px; display:block; background:#fff; cursor:crosshair; touch-action:none; border:1px solid var(--line); border-radius:8px; }
  #sigPlaceStageWrap{ width:100%; overflow:auto; background:#2a2a2a; display:flex; justify-content:center; padding:8px 0; border-radius:8px; }
  #sigPlaceStage{ position:relative; }
  #sigPlaceSigImg{ position:absolute; touch-action:none; cursor:grab; }
  #ocrResultText{ width:100%; min-height:260px; font-family:inherit; font-size:12.5px; resize:vertical; box-sizing:border-box; }
</style>

<div class="view" id="view-docs">
  <div class="tb-row" style="display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:1px solid var(--line); flex:0 0 auto; background:var(--panel);">
    <label style="font-size:12px; color:var(--sub);">사건</label>
    <select id="docsCaseSelect" style="min-width:220px; max-width:360px;"><option value="">사건 선택</option></select>
    <button type="button" id="docsBackToCaseBtn" class="ghost-btn" style="margin-left:auto;"><span class="btn-ic">↩</span><span class="btn-tx"> 처리개요</span></button>
  </div>
  <div class="docs-toolbar tb-row">
    <button type="button" id="docsBtnUp" class="ghost-btn" title="상위 폴더"><span class="btn-ic">⬆</span><span class="btn-tx"> 상위</span></button>
    <div class="docs-breadcrumb" id="docsBreadcrumb"></div>
    <button type="button" id="docsBtnNewFolder" class="ghost-btn"><span class="btn-ic">📁</span><span class="btn-tx"> 새 폴더</span></button>
    <button type="button" id="docsBtnUpload" class="ghost-btn"><span class="btn-ic">⬆</span><span class="btn-tx"> 업로드</span></button>
    <input type="file" id="docsUploadInput" multiple style="display:none;">
    <button type="button" id="docsBtnPdfManager" class="ghost-btn"><span class="btn-ic">📑</span><span class="btn-tx"> PDF관리</span></button>
    <button type="button" id="docsBtnScan" class="ghost-btn"><span class="btn-ic">📷</span><span class="btn-tx"> 스캔</span></button>
  </div>
  <div id="docsCaseEvidencePanel" style="display:none; flex:0 0 auto; border-bottom:1px solid var(--line); padding:10px 14px; overflow-y:auto; max-height:40vh;"></div>
  <div id="docsSelectionBar" class="tb-row" style="display:none; flex:0 0 auto; align-items:center; gap:10px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); font-size:12.5px;">
    <span id="docsSelectionCount"></span>
    <button type="button" id="docsBtnScanSelected" class="ghost-btn" style="font-size:12px;"><span class="btn-ic">📷</span><span class="btn-tx"> 스캔에 추가</span></button>
    <button type="button" id="docsBtnPdfMgrSelected" class="ghost-btn" style="font-size:12px;"><span class="btn-ic">📑</span><span class="btn-tx"> PDF관리에 추가</span></button>
    <button type="button" id="docsBtnClearSelection" class="ghost-btn" style="font-size:12px; margin-left:auto;">선택 해제</button>
  </div>
  <div class="docs-list" id="docsList" style="flex:1; overflow-y:auto;"><div class="spinner">불러오는 중…</div></div>
</div>

<!-- PDF 관리 — 이미 저장된 PDF들을 페이지 단위로 불러와서 합치기·발췌·순서변경·서명·워터마크.
     스캔 바구니(.scan-tray)와 같은 드래그 재정렬 UI를 재사용하되, 페이지별 체크박스가 추가된다.
     [2026.09 이식] document-tools.js의 PDF 관리 도구를 그대로 옮겨왔다. -->
<div class="modal-overlay" id="pdfMgrOverlay" style="display:none;">
  <div class="scan-modal-panel">
    <div class="modal-head">
      <span>📑 PDF 관리 — 합치기·발췌·서명·워터마크</span>
      <span class="modal-close" id="btnClosePdfMgr" title="닫기">✕</span>
    </div>
    <div class="scan-body">
      <input type="file" id="pdfMgrFileInput" accept="application/pdf" multiple style="display:none;">
      <div class="scan-row">
        <button type="button" id="btnPdfMgrAdd" class="ghost-btn"><span class="btn-ic">📄</span><span class="btn-tx"> PDF 추가</span></button>
        <button type="button" id="btnPdfMgrCheckAll" class="ghost-btn"><span class="btn-ic">☑</span><span class="btn-tx"> 전체선택</span></button>
        <button type="button" id="btnPdfMgrOcr" class="ghost-btn" title="체크한 페이지에서 인쇄된 글자를 텍스트로 추출합니다(브라우저 안에서 바로 처리 — 서버로 전송되지 않음). 손글씨는 정확도가 낮을 수 있습니다."><span class="btn-ic">🔤</span><span class="btn-tx"> 텍스트 추출</span></button>
      </div>
      <div class="scan-row">
        <input type="text" id="pdfMgrWatermarkText" placeholder="워터마크 문구(영문 권장 — 한글은 깨질 수 있음)" style="flex:1; min-width:160px;">
        <input type="file" id="pdfMgrSignatureInput" accept="image/*" style="display:none;">
        <button type="button" id="btnPdfMgrSignature" class="ghost-btn">🖋 서명 관리</button>
        <select id="pdfMgrSignaturePos">
          <option value="br" selected>서명: 우측 하단</option>
          <option value="bl">서명: 좌측 하단</option>
          <option value="tr">서명: 우측 상단</option>
          <option value="tl">서명: 좌측 상단</option>
          <option value="center">서명: 중앙</option>
        </select>
        <span id="pdfMgrSignatureStatus" style="font-size:11.5px; color:var(--sub);"></span>
      </div>
      <div id="pdfMgrList" class="scan-tray"></div>
    </div>
    <div class="scan-row" style="padding:0 16px 6px; border-top:1px solid var(--line); padding-top:12px;">
      <input type="text" id="pdfMgrExtractName" placeholder="추출할 파일 이름" style="flex:1; min-width:120px;">
      <button type="button" id="btnPdfMgrExtract" class="ghost-btn">✂ 선택 추출</button>
    </div>
    <div class="scan-row" style="padding:0 16px 16px;">
      <input type="text" id="pdfMgrSaveName" placeholder="전체 저장 파일 이름" style="flex:1; min-width:120px;">
      <button type="button" id="btnPdfMgrSaveAll" class="save-btn">💾 전체 저장</button>
    </div>
  </div>
</div>

     바로 등록한다. 한 번 등록하면 브라우저(localStorage)에 저장되어 계속 재사용된다. -->

<!-- 텍스트 추출(OCR) 결과 — 채팅이 없는 이 앱에서는 입력창에 바로 넣는 대신, 결과를 보여주고

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<!-- 스캔(원근보정·자동인식·문서구분) 공용 도구 — my.netax.kr 고객창구의 자료제출함과 동일한
     코드를 netax.kr에서 그대로 불러 쓴다(중복 이식 대신 공용 모듈로 분리, 2026.09). -->
<script src="https://netax.kr/shared/scan-tool.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script>
  // ============================================================
  // 증빙관리 — 탐색창(폴더 이동)+보기창(구글드라이브 뷰어로 새 탭에서 열기)+스캔창.
  // 스캔의 원근보정(호모그래피) 수학은 document-tools.js의 검증된 로직을 그대로 가져왔다.
  // 탐색 자체는 explorer.js를 이식하지 않고, 이 앱에 맞게 가볍게 새로 짰다
  // (explorer.js는 채팅 첨부·다중선택 등과 얽혀있어 그 부분까지 옮길 필요가 없었음).
  // ============================================================
  var docsPath = [];
  var docsCurrentListing = null;
  var docsLoaded = false;
  var docsSelectedIds = {}; // { fileId: true } — 스캔/PDF관리로 한번에 여러 개 넘길 때 씀. 폴더 이동 시 비운다.
  var docsSelectedCaseId_ = null; // "↩ 처리개요" 버튼용 — 지금 보고 있는 폴더가 어느 사건인지(docsNavigate에서 갱신).

  // pdf.js는 실제 렌더링을 별도 워커에서 돌리므로, 워커 스크립트 위치를 지정해줘야 한다
  // (PDF 관리의 텍스트추출·서명 정밀배치 미리보기에 사용).
  if (typeof pdfjsLib !== 'undefined'){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js';
  }

  function initDocs(){
    // [2026.09 버그수정] docsLoaded는 chEvOpenDocsBtn/chDocsWriterOpenBtn(casehandling.html)
    // 이 레이스컨디션을 막으려고 여기 오기 전에 미리 true로 세팅해두는 경우가 있다 — 그래서
    // "docsLoaded면 무조건 return"으로 짜여있으면 그 경로로 처음 들어올 때 아래
    // docsInitCaseSelect_()(사건연결 드롭다운·뒤로가기 버튼 연결)가 전혀 실행되지 않는 버그가
    // 있었다("증빙확보에서 처리개요로 버튼이 안 먹는다"). 최초 1회만 할 일(docsNavigate([]))과
    // 매번 해도 되는 일(docsInitCaseSelect_, 자체적으로 중복실행 방지)을 분리한다.
    if (!docsLoaded){
      docsLoaded = true;
      docsNavigate([]);
    }
    docsInitCaseSelect_();
  }

  // [2026.09] 법령조회·세액계산에는 상단에 "사건연결" 드롭다운이 있어서 사건을 바로 골라
  // 들어갈 수 있는데, 증빙확보(왼쪽 메뉴로 바로 들어오면)는 그게 없어서 폴더를 일일이
  // 찾아 들어가야 했다 — 지적받아 추가. docsGetAllCases_()로 이미 있는 사건 목록 캐시를
  // 재사용하고, 고르면 chRenderEvidenceSummary_의 "증빙확보에서 열기"와 같은 방식으로
  // 그 사건 폴더로 바로 이동한다.
  function docsInitCaseSelect_(){
    var sel = document.getElementById('docsCaseSelect');
    if (!sel || sel.dataset.inited) return; // initDocs()가 여러 번 불려도 리스너가 중복 등록되지 않게
    sel.dataset.inited = '1';
    docsGetAllCases_().then(function(cases){
      sel.innerHTML = buildCaseOptionsHtml_(cases, { placeholder: '사건 선택' });
    });
    sel.addEventListener('change', function(){
      var caseId = sel.value;
      if (!caseId) return;
      docsGetAllCases_().then(function(cases){
        var c = cases.filter(function(x){ return x.id === caseId; })[0];
        if (!c) return;
        // [2026.09 버그수정] 폴더ID(한 번 만들어지면 안 바뀜)로 직접 연다 — 사건명(=폴더명)만
        // 보고 경로를 다시 만들면, 나중에 고객명 등이 바뀌어 사건명이 달라진 사건은 실제
        // Drive 폴더(이름은 그대로)를 못 찾는다. 폴더ID가 없는 옛날 사건만 이름으로 대체한다.
        if (c.폴더ID) { docsNavigateById_(c.폴더ID); return; }
        getCustomerRootPath_().then(function(basePath){
          docsNavigate(basePath.concat([String(c.사건명 || '').trim()]));
        });
      });
    });
    document.getElementById('docsBackToCaseBtn').addEventListener('click', function(){
      if (typeof goToView_ === 'function') goToView_('casehandling');
      if (docsSelectedCaseId_ && typeof goToCaseHandling_ === 'function') goToCaseHandling_(docsSelectedCaseId_);
    });
  }

  // [2026.09] "↩ 처리개요" 버튼이 지금 보고 있는 폴더에 맞는 사건을 들고 돌아가려면, 폴더를
  // 옮길 때마다 지금 위치가 어느 사건인지 다시 계산해둬야 한다. "보고서"·"제출자료"처럼 사건
  // 폴더 한 단계 안쪽까지 들어가 있어도 찾을 수 있게 부모 폴더도 같이 검사한다.
  // [2026.09 버그수정] 사건명(=폴더명)만으로 매칭하면 담당자가 나중에 고객명·세목 등을 고쳐서
  // 사건명이 바뀌는 순간 이 화면이 조용히 그 사건을 못 찾게 된다. 지금 보고 있는 폴더 바로
  // 그 자체(rel.length===1)라면 listFolder가 돌려준 실제 폴더ID(docsCurrentListing.folderId)를
  // 사건의 폴더ID와 직접 비교해서 이름이 바뀌어도 안 끊기게 한다 — 폴더ID가 없는 옛날 사건만
  // 이름 매칭으로 대체한다.
  function docsSyncSelectedCase_(){
    var sel = document.getElementById('docsCaseSelect');
    getCustomerRootPath_().then(function(basePath){
      var rel = docsPath.slice(basePath.length); // 고객사건 루트 밑으로 몇 단계 들어왔는지
      if (rel.length < 1 || rel.length > 2){ docsSelectedCaseId_ = null; if (sel) sel.value = ''; return; }
      var currentFolderId = (rel.length === 1 && docsCurrentListing) ? docsCurrentListing.folderId : null;
      docsGetAllCases_().then(function(cases){
        var c = currentFolderId
          ? cases.filter(function(x){ return x.폴더ID && x.폴더ID === currentFolderId; })[0]
          : null;
        if (!c) c = cases.filter(function(x){ return String(x.사건명 || '').trim() === rel[0]; })[0];
        docsSelectedCaseId_ = c ? c.id : null;
        if (sel) sel.value = c ? c.id : '';
      });
    });
  }

  function docsNavigate(path){
    docsPath = path;
    docsSelectedIds = {};
    updateDocsSelectionBar_();
    var listEl = document.getElementById('docsList');
    listEl.innerHTML = '<div class="spinner">불러오는 중…</div>';
    callGas('listFolder', { path: docsPath }).then(function(res){
      if (res.error){ listEl.innerHTML = '<div class="log-empty">' + escapeHtml(res.error) + '</div>'; return; }
      docsPath = res.path || docsPath;
      docsCurrentListing = res;
      renderDocsBreadcrumb();
      renderDocsList();
      docsRenderCaseEvidencePanel_();
      docsSyncSelectedCase_();
    }).catch(function(){ listEl.innerHTML = '<div class="log-empty">불러오지 못했습니다.</div>'; });
  }

  // [2026.09 버그수정] docsNavigate(path)는 이름을 절대 루트부터 따라 내려가는 방식이라, 사건
  // 폴더가 만들어진 뒤 고객명 등이 바뀌어 사건명(=폴더명)이 달라지면(실제 Drive 폴더 이름은
  // 그대로인데 DB의 사건명만 새 값으로 바뀜) 새 이름으로는 그 폴더를 절대 못 찾는다. 사건의
  // 폴더ID(c.폴더ID, 한 번 만들어지면 절대 안 바뀜)를 이미 알고 있을 때는 이름과 무관하게
  // 이 함수로 직접 열 것.
  function docsNavigateById_(folderId){
    docsSelectedIds = {};
    updateDocsSelectionBar_();
    var listEl = document.getElementById('docsList');
    listEl.innerHTML = '<div class="spinner">불러오는 중…</div>';
    callGas('listFolder', { folderId: folderId }).then(function(res){
      if (res.error){ listEl.innerHTML = '<div class="log-empty">' + escapeHtml(res.error) + '</div>'; return; }
      docsPath = res.path || [];
      docsCurrentListing = res;
      renderDocsBreadcrumb();
      renderDocsList();
      docsRenderCaseEvidencePanel_();
      docsSyncSelectedCase_();
    }).catch(function(){ listEl.innerHTML = '<div class="log-empty">불러오지 못했습니다.</div>'; });
  }

  // ============================================================
  // [2026.09] "사건처리는 이 사건의 대시보드, 실제 증빙 파일 작업은 증빙관리에서" 원칙에 따라
  // 증빙 3분류(자동확보/추가확보/요청자료) 체크리스트를 여기로 옮겼다. 지금 보고 있는 폴더가
  // work_ 사건이 시작될 때 만든 "고객명 사건명" 폴더와 이름이 일치하면(사건 하나는 항상 이
  // 루트 바로 밑에 폴더 하나이므로 docsPath.length===1일 때만 검사), 그 파일 목록 위에
  // 체크리스트를 같이 보여준다. 자동확보는 세액계산 화면이 쓰는 주소검색/실거래가/공시가격
  // 조회(openAddressSearchModal_ 등)를 그대로 재사용한다.
  // ============================================================
  var docsAllCasesCache_ = null;
  function docsGetAllCases_(force){
    if (docsAllCasesCache_ && !force) return Promise.resolve(docsAllCasesCache_);
    return callGas('work_get_cases', {}).then(function(res){
      docsAllCasesCache_ = res.cases || [];
      return docsAllCasesCache_;
    }).catch(function(){ return docsAllCasesCache_ || []; });
  }

  function docsRenderCaseEvidencePanel_(){
    var panel = document.getElementById('docsCaseEvidencePanel');
    if (!panel) return;
    var pathAtCall = docsPath;
    // [2026.09 버그수정] listFolder는 path를 줄 때 항상 "절대 루트"부터 이름을 하나씩 따라
    // 내려간다(getDefaultFolder()는 path 없이 부를 때만 씀) — 그래서 "고객사건" 폴더가 절대
    // 루트 바로 밑에 있어도, 사건 폴더까지 가려면 반드시 ["고객사건", "사건폴더명"] 처럼
    // 앞에 기본폴더까지의 전체 경로를 붙여야 한다. getCustomerRootPath_()(script.html에 이미
    // 있는 공용 함수)가 그 기본경로를 정확히 알려주므로 하드코딩하지 않고 그걸로 계산한다.
    getCustomerRootPath_().then(function(basePath){
      if (docsPath !== pathAtCall) return; // 그 사이 다른 폴더로 이동했으면 무시
      var isUnderBase = docsPath.length === basePath.length + 1 &&
        basePath.every(function(seg, i){ return docsPath[i] === seg; });
      if (!isUnderBase){ panel.style.display = 'none'; panel.innerHTML = ''; return; }
      var folderName = docsPath[docsPath.length - 1];
      // [2026.09 버그수정] listFolder가 돌려준 이 폴더의 실제 ID(docsCurrentListing.folderId)를
      // 사건의 폴더ID와 먼저 비교한다 — 이름(사건명)만으로 매칭하면 담당자가 나중에 고객명·
      // 세목 등을 고쳐 사건명이 바뀌는 순간 이 패널이 조용히 사라졌다. 폴더ID가 없는 옛날
      // 사건만 이름 매칭으로 대체한다.
      var currentFolderId = docsCurrentListing ? docsCurrentListing.folderId : null;
      // [2026.09 버그수정] "처리개요엔 요청자료 8건인데 증빙확보엔 하나도 없다" — 여기 캐시가
      // docsInitCaseSelect_()가 맨 처음 채운 뒤로는 새로고침 없이 계속 재사용됐다(force 없이
      // 호출), 그래서 사건 생성 이후(예: 필요증빙 템플릿 적용) 캐시가 낡은 채로 남아있었다.
      // 폴더를 옮길 때마다(=이 함수가 불릴 때마다) 매번 새로 받아온다.
      docsGetAllCases_(true).then(function(cases){
        if (docsPath !== pathAtCall) return;
        var c = currentFolderId
          ? cases.filter(function(x){ return x.폴더ID && x.폴더ID === currentFolderId; })[0]
          : null;
        if (!c) c = cases.filter(function(x){ return String(x.사건명 || '').trim() === folderName; })[0];
        if (!c){ panel.style.display = 'none'; panel.innerHTML = ''; return; }
        panel.style.display = 'block';
        docsRenderEvidenceUi_(panel, c);
      });
    });
  }

  // [2026.09] 동시편집 낙관적 잠금 — c.수정일(마지막으로 읽었던 값)을 같이 보내 그 사이 다른
  // 곳에서 먼저 저장됐으면(수정일이 달라졌으면) 덮어쓰지 않고 최신 내용으로 새로고침한다.
  function docsSaveEvidence_(c, newList){
    callGas('work_update_case', { id: c.id, 증빙목록: newList, 기대수정일: c.수정일 }).then(function(res){
      if (res.conflict){ showToast(res.message || '충돌이 발생했습니다. 새로고침합니다.', 'warning'); docsGetAllCases_(true).then(function(){ docsRenderCaseEvidencePanel_(); }); return; }
      if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return; }
      docsGetAllCases_(true).then(function(){ docsRenderCaseEvidencePanel_(); });
    }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
  }

  function docsAddEvidence_(c, entryPartial){
    var entry = Object.assign({ id: 'ev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) }, entryPartial);
    var newList = (c.증빙목록 || []).concat([entry]);
    docsSaveEvidence_(c, newList);
    if (entryPartial.source === 'requested' && c.my_report_id){
      callGas('admin_add_checklist_item', { report_id: c.my_report_id, item: entryPartial.label }).catch(function(){});
    }
  }

  function docsRenderEvidenceList_(c, source, containerId, submissionStatus){
    var box = document.getElementById(containerId);
    if (!box) return;
    var entries = (c.증빙목록 || []).filter(function(e){ return e.source === source; });
    if (!entries.length){ box.innerHTML = '<div class="log-empty">없습니다.</div>'; return; }
    box.innerHTML = '';
    entries.forEach(function(entry){
      var row = document.createElement('div');
      row.className = 'log-entry';
      var got = entry.status === '확보됨';
      // [2026.09 버그수정] my.netax.kr에서 고객이 이미 올렸는데 여기(증빙목록)엔 반영이
      // 안 돼 "미확보"로 남아있는 경우를 놓치지 않도록 안내를 덧붙인다.
      var sub = (!got && submissionStatus) ? submissionStatus[entry.label || ''] : null;
      row.innerHTML =
        '<div class="log-date" style="color:' + (got ? 'var(--navy)' : 'var(--sub)') + ';">' + escapeHtml(entry.status || '') + '</div>' +
        '<div class="log-text"><b>' + escapeHtml(entry.label || '') + '</b>' +
        (entry.note ? '<br><span style="color:var(--sub); font-size:12.5px;">' + escapeHtml(entry.note) + '</span>' : '') +
        (sub && sub.submitted ? '<br><span style="color:#b8860b; font-size:12.5px; font-weight:600;">📤 고객이 이미 제출함(' + escapeHtml(sub.fileName || '') + (sub.uploadedAt ? ', ' + escapeHtml(String(sub.uploadedAt).slice(0, 10)) : '') + ') — 확인 후 확보완료로 표시하세요</span>' : '') +
        '</div>' +
        (source !== 'auto' ? '<button type="button" class="ghost-btn docsEvToggleBtn" style="padding:3px 8px; font-size:12px;">' + (got ? '미확보로' : '확보완료') + '</button>' : '') +
        (source === 'requested' ? '<button type="button" class="ghost-btn docsEvRenameBtn" style="padding:3px 8px; font-size:12px;">이름변경</button>' : '') +
        '<span class="log-del" title="삭제">✕</span>';
      if (source !== 'auto'){
        row.querySelector('.docsEvToggleBtn').addEventListener('click', function(){
          var nowGot = entry.status !== '확보됨';
          var newList = (c.증빙목록 || []).map(function(e){
            if (e.id !== entry.id) return e;
            return Object.assign({}, e, { status: nowGot ? '확보됨' : '미확보', 확보일: nowGot ? new Date().toISOString().slice(0, 10) : e.확보일 });
          });
          docsSaveEvidence_(c, newList);
          // [2026.09 버그수정] 요청자료를 회계사가 여기서 확보완료/미확보로 바꾸면, 고객이
          // my.netax.kr에서 보는 체크리스트에도 같이 반영한다 — 안 그러면 회계사가 직접
          // 구한 자료도 고객 화면엔 계속 "미제출"로 남아 고객이 괜히 또 챙겨 올릴 수 있다.
          if (source === 'requested' && c.my_report_id && entry.label){
            callGas('admin_set_checklist_status', { report_id: c.my_report_id, item: entry.label, submitted: nowGot }).catch(function(){});
          }
        });
      }
      // [2026.09 버그수정] 요청자료 이름을 오타 등으로 고치고 싶을 때 지금까진 지우고
      // 새로 추가하는 수밖에 없었는데, 그러면 고객이 이미 올린 파일의 제출상태(옛 이름으로
      // 연결됨)와 연결이 끊겨 "이미 제출함" 안내가 조용히 사라졌다 — 제출상태까지 같이
      // 옮겨주는 이름변경을 추가한다.
      if (source === 'requested'){
        row.querySelector('.docsEvRenameBtn').addEventListener('click', function(){
          var newLabel = prompt('새 자료명을 입력하세요.', entry.label || '');
          if (newLabel === null) return;
          newLabel = newLabel.trim();
          if (!newLabel || newLabel === entry.label) return;
          var oldLabel = entry.label;
          var newList = (c.증빙목록 || []).map(function(e){
            return e.id === entry.id ? Object.assign({}, e, { label: newLabel }) : e;
          });
          docsSaveEvidence_(c, newList);
          if (c.my_report_id && oldLabel){
            callGas('admin_rename_checklist_item', { report_id: c.my_report_id, old_item: oldLabel, new_item: newLabel }).catch(function(){});
          }
        });
      }
      row.querySelector('.log-del').addEventListener('click', function(){
        var newList = (c.증빙목록 || []).filter(function(e){ return e.id !== entry.id; });
        docsSaveEvidence_(c, newList);
        // [2026.09 버그수정] 요청자료를 지워도 my.netax.kr 쪽 체크리스트엔 지저분한 옛 항목이
        // 그대로 남아있었다 — 같이 지운다.
        if (source === 'requested' && c.my_report_id && entry.label){
          callGas('admin_remove_checklist_item', { report_id: c.my_report_id, item: entry.label }).catch(function(){});
        }
      });
      box.appendChild(row);
    });
  }

  function docsRenderEvAutoPicked_(c, picked){
    var box = document.getElementById('docsEvAutoPicked');
    if (!box) return;
    var lawdCd = (picked.admCd || '').slice(0, 5);
    box.innerHTML =
      '<div style="background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:8px;">' +
      '<div style="font-size:12.5px; margin-bottom:6px;"><b>' + escapeHtml(picked.roadAddr || picked.jibunAddr || '') + '</b></div>' +
      '<div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:6px;">' +
      '<button type="button" id="docsEvRealPriceBtn" class="ghost-btn" style="font-size:12px;">실거래가 조회(참고)</button>' +
      '</div>' +
      '<div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">' +
      '<select id="docsEvPriceKind" style="width:140px;"><option value="land">개별공시지가(토지)</option><option value="apartment">공동주택가격</option><option value="house">개별주택가격</option></select>' +
      '<input type="text" id="docsEvDong" placeholder="동(선택)" style="width:70px;">' +
      '<input type="text" id="docsEvHo" placeholder="호" style="width:70px;">' +
      '<button type="button" id="docsEvPriceBtn" class="ghost-btn" style="font-size:12px;">공시가격 조회</button>' +
      '</div>' +
      '</div>';

    document.getElementById('docsEvRealPriceBtn').addEventListener('click', function(){
      if (!lawdCd){ showToast('이 주소는 법정동코드를 확인할 수 없습니다.', 'error'); return; }
      if (typeof openRealPriceModal_ !== 'function'){ showToast('실거래가 조회 기능을 불러오지 못했습니다.', 'error'); return; }
      openRealPriceModal_(lawdCd, function(item){
        docsAddEvidence_(c, {
          source: 'auto',
          label: '실거래가: ' + (item.aptNm || '') + ' ' + (item.dong || '') + ' ' + (item.jibun || ''),
          note: (item.area || '') + '㎡ · ' + (item.floor || '') + '층 · ' + (item.dealDate || '') + ' · ' + Number(item.dealAmount || 0).toLocaleString() + '원',
          status: '확보됨', 확보일: new Date().toISOString().slice(0, 10)
        });
      });
    });

    document.getElementById('docsEvPriceBtn').addEventListener('click', function(){
      var priceKind = document.getElementById('docsEvPriceKind').value;
      var dong = document.getElementById('docsEvDong').value.trim();
      var ho = document.getElementById('docsEvHo').value.trim();
      if (!picked.admCd || !picked.lnbrMnnm){ showToast('이 주소는 지번 정보가 부족해 공시가격을 조회할 수 없습니다.', 'error'); return; }
      var san = String(picked.mtYn) === '1' ? '2' : '1';
      var mnnm = ('0000' + picked.lnbrMnnm).slice(-4);
      var slno = ('0000' + (picked.lnbrSlno || '0')).slice(-4);
      var pnu = picked.admCd + san + mnnm + slno;
      callGas('lookupOfficialPrice', { pnu: pnu, priceKind: priceKind, dong: dong, ho: ho }).then(function(data){
        if (data.error){ showToast(data.error, 'error'); return; }
        var kindLabel = priceKind === 'apartment' ? '공동주택가격' : priceKind === 'house' ? '개별주택가격' : '개별공시지가';
        docsAddEvidence_(c, {
          source: 'auto',
          label: kindLabel + ': ' + Number(data.price).toLocaleString() + '원',
          note: (picked.roadAddr || picked.jibunAddr || '') + (dong ? ' ' + dong + '동' : '') + (ho ? ' ' + ho + '호' : '') + ' (기준연도 ' + data.stdrYear + ')',
          status: '확보됨', 확보일: new Date().toISOString().slice(0, 10)
        });
      }).catch(function(err){ showToast('조회 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
    });
  }

  function docsRenderEvidenceUi_(panel, c){
    panel.innerHTML =
      '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:8px;">📋 ' + escapeHtml(c.고객명) + ' · ' + escapeHtml(c.사건명) + ' — 증빙</div>' +
      '<div style="margin-bottom:14px;">' +
      '<div style="font-size:12px; font-weight:600; color:var(--sub); margin-bottom:6px;">자동확보</div>' +
      '<button type="button" id="docsEvAutoAddrBtn" class="ghost-btn" style="margin-bottom:8px;">🏠 주소로 자동조회(실거래가·공시가격)</button>' +
      '<div id="docsEvAutoPicked"></div>' +
      '<div id="docsEvListAuto"></div>' +
      '</div>' +
      '<div style="margin-bottom:14px;">' +
      '<div style="font-size:12px; font-weight:600; color:var(--sub); margin-bottom:6px;">추가확보</div>' +
      '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">' +
      '<input type="text" id="docsEvManualLabel" placeholder="자료명 (예: 등기부등본)" style="flex:1; min-width:140px;">' +
      '<input type="text" id="docsEvManualNote" placeholder="메모·링크(선택)" style="flex:1; min-width:140px;">' +
      '<button type="button" id="docsEvManualAddBtn" class="save-btn">추가</button>' +
      '</div>' +
      '<div id="docsEvListManual"></div>' +
      '</div>' +
      '<div>' +
      '<div style="font-size:12px; font-weight:600; color:var(--sub); margin-bottom:6px;">요청자료 <span style="font-weight:400;">(고객에게 요청 — 고객창구에 연결돼 있으면 그 체크리스트에도 자동 반영)</span></div>' +
      '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">' +
      '<input type="text" id="docsEvReqLabel" placeholder="요청할 자료명 (예: 매매계약서)" style="flex:1; min-width:140px;">' +
      '<input type="text" id="docsEvReqNote" placeholder="메모(선택)" style="flex:1; min-width:140px;">' +
      '<button type="button" id="docsEvReqAddBtn" class="save-btn">추가</button>' +
      '</div>' +
      '<div id="docsEvListRequested"></div>' +
      '</div>';

    docsRenderEvidenceList_(c, 'auto', 'docsEvListAuto');
    docsRenderEvidenceList_(c, 'manual', 'docsEvListManual');
    docsRenderEvidenceList_(c, 'requested', 'docsEvListRequested');
    // [2026.09 버그수정] 증빙목록(여기, 회계사가 수동으로만 확보/미확보를 바꾸는 곳)과
    // my.netax.kr의 제출상태(고객이 실제로 올렸는지, 완전히 다른 시트)가 서로 동기화되지
    // 않아서, 고객이 이미 올렸는데도 여기선 계속 "미확보"로 남아있는 문제가 있었다. 두
    // 저장소를 하나로 합치는 대신(위험도가 큼), "요청자료" 목록을 그릴 때 my포털 제출현황을
    // 같이 조회해서 이미 제출된 항목에 안내를 띄우는 방식으로 최소 침습적으로 연결한다 —
    // 확보 여부 확정은 여전히 회계사가 확인 버튼을 눌러야 한다(고객이 엉뚱한 파일을 올렸을
    // 수도 있으므로 자동으로 확보됨 처리하지 않음).
    if (c.my_report_id){
      callGas('admin_get_case', { report_id: c.my_report_id }).then(function(res){
        if (res.success === false) return;
        docsRenderEvidenceList_(c, 'requested', 'docsEvListRequested', (res.case && res.case.submission_status) || {});
      }).catch(function(){});
    }

    document.getElementById('docsEvAutoAddrBtn').addEventListener('click', function(){
      if (typeof openAddressSearchModal_ !== 'function'){ showToast('주소검색 기능을 불러오지 못했습니다.', 'error'); return; }

    document.getElementById('docsEvReqAddBtn').addEventListener('click', function(){

  function renderDocsBreadcrumb(){
    // [2026.09 버그수정] 예전엔 "🏠 고객사건"을 글자로 박아뒀는데, docsPath 자체가 이미
    // (getPathFromRoot 때문에) "고객사건"부터 시작하는 실제 경로를 담고 있어서 글자가
    // 두 번 겹쳐 보였다("고객사건 / 고객사건 / 임직권 상생임대") — 🏠 아이콘만 홈으로 두고
    // 실제 폴더 이름은 docsPath가 그대로 보여주게 한다.
    var el = document.getElementById('docsBreadcrumb');
    var html = '<span data-i="-1">🏠</span>';
    docsPath.forEach(function(seg, i){ html += ' / <span data-i="' + i + '">' + escapeHtml(seg) + '</span>'; });

    el.querySelectorAll('span').forEach(function(sp){
      sp.addEventListener('click', function(){

      });

  }

  function docsIconFor(mimeType, name){
    if (mimeType === 'application/pdf') return '📕';
    if (mimeType && mimeType.indexOf('image/') === 0) return '🖼';
    if (mimeType && mimeType.indexOf('spreadsheet') !== -1) return '📊';
    if (/\.md$/i.test(name || '')) return '📝';
    return '📄';
  }

  function renderDocsList(){
    var listEl = document.getElementById('docsList');
    var data = docsCurrentListing;
    var folders = data.folders || [], files = data.files || [];
    if (!folders.length && !files.length){ listEl.innerHTML = '<div class="log-empty">빈 폴더입니다.</div>'; return; }
    var html = '';
    folders.forEach(function(f){
      html += '<div class="docs-row" data-type="folder" data-id="' + escapeHtml(f.id) + '" data-name="' + escapeHtml(f.name) + '">' +
        '<span class="docs-icon">📁</span><span class="docs-name">' + escapeHtml(f.name) + '</span>' +
        '<span class="docs-actions"><span data-act="rename" title="이름변경">✏️</span><span data-act="delete" title="삭제">🗑</span></span>' +
        '</div>';
    });
    files.forEach(function(f){
      // [2026.09 이식] 폴더에 이미 있는 파일을 그대로 스캔 도구/PDF관리로 불러오는 길 — PDF는
      // "PDF관리로 열기", 이미지는 "스캔으로 열기" 아이콘을 추가로 보여준다.
      var isPdf = f.mimeType === 'application/pdf';
      var isImage = f.mimeType && f.mimeType.indexOf('image/') === 0;
      var extraActs = '';
      if (isPdf) extraActs += '<span data-act="pdfmgr" title="PDF관리로 열기">📑</span>';
      else if (isImage) extraActs += '<span data-act="scan" title="스캔으로 열기">📷</span>';
      // 스캔/PDF관리로 여러 개를 한번에 넘길 수 있게, 대상 파일(PDF·이미지)에만 체크박스를 둔다.
      var chkHtml = (isPdf || isImage)
        ? '<input type="checkbox" class="docsSelectChk" style="margin-right:6px;"' + (docsSelectedIds[f.id] ? ' checked' : '') + '>'
        : '<span style="display:inline-block; width:22px;"></span>';
      html += '<div class="docs-row" data-type="file" data-id="' + escapeHtml(f.id) + '" data-url="' + escapeHtml(f.url || '') + '">' +
        chkHtml +
        '<span class="docs-icon">' + docsIconFor(f.mimeType, f.name) + '</span><span class="docs-name">' + escapeHtml(f.name) + '</span>' +
        '<span class="docs-meta">' + escapeHtml(f.modifiedDate || '') + (f.sizeBytes ? ' · ' + formatFileSize(f.sizeBytes) : '') + '</span>' +
        '<span class="docs-actions">' + extraActs + '<span data-act="rename" title="이름변경">✏️</span><span data-act="delete" title="삭제">🗑</span></span>' +
        '</div>';
    });
    listEl.innerHTML = html;

    listEl.querySelectorAll('.docs-row').forEach(function(row){
      row.addEventListener('click', function(e){
        if (e.target.closest('.docs-actions') || e.target.classList.contains('docsSelectChk')) return;
        if (row.dataset.type === 'folder'){
          docsNavigate(docsPath.concat([row.dataset.name]));
        } else if (row.dataset.url){
          window.open(row.dataset.url, '_blank');
        }
      });
      var chk = row.querySelector('.docsSelectChk');
      if (chk){
        chk.addEventListener('click', function(e){ e.stopPropagation(); });
        chk.addEventListener('change', function(){
          if (chk.checked) docsSelectedIds[row.dataset.id] = true;
          else delete docsSelectedIds[row.dataset.id];
          updateDocsSelectionBar_();
        });
      }
      row.querySelectorAll('.docs-actions span').forEach(function(actEl){
        actEl.addEventListener('click', function(e){
          e.stopPropagation();
          var act = actEl.dataset.act;
          var id = row.dataset.id, type = row.dataset.type;
          var label = row.querySelector('.docs-name').textContent;
          if (act === 'delete'){
            if (!confirm('"' + label + '"을(를) 삭제할까요? (휴지통으로 이동)')) return;
            callGas('deleteItem', { id: id, type: type }).then(function(res){
              if (res.error){ toast('삭제 실패: ' + res.error); return; }
              toast('삭제했습니다.');
              docsNavigate(docsPath);
            });
          } else if (act === 'rename'){
            var newName = prompt('새 이름을 입력하세요:', label);
            if (!newName || !newName.trim() || newName.trim() === label) return;
            callGas('renameItem', { id: id, type: type, newName: newName.trim() }).then(function(res){
              if (res.error){ toast('이름변경 실패: ' + res.error); return; }
              toast('이름을 변경했습니다.');
              docsNavigate(docsPath);
            });
          } else if (act === 'pdfmgr' || act === 'scan'){
            // 체크해둔 항목이 있으면(이 줄이 체크돼 있든 아니든) 그 선택 전체를 대상으로 하고,
            // 아무것도 안 체크했으면 이 줄 파일 하나만 대상으로 한다 — 체크박스로 여러 개
            // 골라두고 아무 줄의 아이콘이나 눌러도 선택 전체가 처리되게(헷갈리지 않도록).
            var selectedIds = Object.keys(docsSelectedIds);
            if (selectedIds.length){
              if (act === 'pdfmgr') docsPdfMgrSelected_(docsSelectedFileObjs_().filter(function(f){ return f.mimeType === 'application/pdf'; }));
              else docsScanSelected_(docsSelectedFileObjs_().filter(function(f){ return f.mimeType && f.mimeType.indexOf('image/') === 0; }));
              return;
            }
            var fileObj = (data.files || []).filter(function(x){ return x.id === id; })[0];
            if (!fileObj) return;
            if (act === 'pdfmgr') openExistingFileInPdfManager(fileObj);
            else openExistingFileInScan(fileObj);
          }
        });
      });
    });
  }

  // [2026.09] 스캔/PDF관리를 열기 전에, 지금 보고 있는 폴더에서 파일을 하나 또는 여러 개
  // 체크해서 한번에 넘길 수 있게 한다("갤러리에서 불러오기"는 이 기기의 로컬 사진첩을 여는
  // 것이라 지금 보는 Drive 폴더와는 무관함 — 그래서 별도로 이 선택 방식을 추가했다).
  function updateDocsSelectionBar_(){
    var bar = document.getElementById('docsSelectionBar');
    var ids = Object.keys(docsSelectedIds);
    if (!ids.length){ bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    document.getElementById('docsSelectionCount').textContent = ids.length + '개 선택됨';
  }

  function docsSelectedFileObjs_(){
    var ids = Object.keys(docsSelectedIds);
    var files = (docsCurrentListing && docsCurrentListing.files) || [];
    return ids.map(function(id){ return files.filter(function(f){ return f.id === id; })[0]; }).filter(Boolean);
  }

  document.getElementById('docsBtnClearSelection').addEventListener('click', function(){
    docsSelectedIds = {};
    updateDocsSelectionBar_();
    renderDocsList();
  });

  async function docsPdfMgrSelected_(files){
    if (!files.length){ toast('선택한 항목 중 PDF 파일이 없습니다.'); return; }
    for (var i = 0; i < files.length; i++){ await openExistingFileInPdfManager(files[i]); }
  }
  document.getElementById('docsBtnPdfMgrSelected').addEventListener('click', function(){
    docsPdfMgrSelected_(docsSelectedFileObjs_().filter(function(f){ return f.mimeType === 'application/pdf'; }));
  });

  async function docsScanSelected_(files){
    if (!files.length){ toast('선택한 항목 중 이미지 파일이 없습니다.'); return; }
    toast(files.length + '개 불러오는 중입니다…');
    try{
      var fileObjs = [];
      for (var i = 0; i < files.length; i++){
        var res = await callGas('readFileBinary', { fileId: files[i].id });
        if (res.error){ toast(files[i].name + ' 불러오기 실패: ' + res.error); continue; }
        var binary = atob(res.base64);
        var bytes = new Uint8Array(binary.length);
        for (var b = 0; b < binary.length; b++) bytes[b] = binary.charCodeAt(b);
        var blob = new Blob([bytes], { type: files[i].mimeType || 'image/jpeg' });
        fileObjs.push(new File([blob], files[i].name, { type: files[i].mimeType || 'image/jpeg' }));
      }
      if (!fileObjs.length) return;
      docsOpenScanModal_(fileObjs);
      if (fileObjs.length > 1) toast('총 ' + fileObjs.length + '개 — "담기"를 누를 때마다 다음 파일로 자동으로 넘어갑니다.');
    }catch(err){
      toast('불러오기 중 오류: ' + (err && err.message ? err.message : err));
    }
  }
  document.getElementById('docsBtnScanSelected').addEventListener('click', function(){
    docsScanSelected_(docsSelectedFileObjs_().filter(function(f){ return f.mimeType && f.mimeType.indexOf('image/') === 0; }));
  });

  document.getElementById('docsBtnUp').addEventListener('click', function(){
    if (docsPath.length) docsNavigate(docsPath.slice(0, -1));
  });
  document.getElementById('docsBtnNewFolder').addEventListener('click', function(){
    var name = prompt('새 폴더 이름을 입력하세요:');
    if (!name || !name.trim()) return;
    callGas('createFolder', { path: docsPath, name: name.trim() }).then(function(res){
      if (res.error){ toast('폴더 생성 실패: ' + res.error); return; }
      toast('폴더를 만들었습니다.');
      docsNavigate(docsPath);
    });
  });
  document.getElementById('docsBtnUpload').addEventListener('click', function(){
    document.getElementById('docsUploadInput').click();
  });
  document.getElementById('docsUploadInput').addEventListener('change', function(e){
    var files = Array.from(e.target.files || []);
    if (!files.length) return;
    var remaining = files.length;
    files.forEach(function(file){
      var reader = new FileReader();
      reader.onload = function(){
        var base64 = reader.result.split(',')[1];
        callGas('uploadFile', { path: docsPath, name: file.name, mimeType: file.type || 'application/octet-stream', base64Data: base64 }).then(function(res){
          remaining--;
          if (res.error) toast('업로드 실패(' + file.name + '): ' + res.error);
          if (remaining === 0){ toast('업로드를 마쳤습니다.'); docsNavigate(docsPath); }
        });
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  });

  // ============================================================
  // 스캔 — netax.kr/shared/scan-tool.js(공용 스캔 도구)를 그대로 불러 쓴다. 원근보정·자동인식·
  // "문서 구분" 로직은 my.netax.kr 고객창구의 자료제출함과 완전히 같은 코드를 공유한다
  // (중복 이식이 아님 — 여기서 고치면 고객창구에도 동시에 반영된다).
  // ============================================================
  function docsOpenScanModal_(initialFiles){
    NetaxScan.open({
      targetLabel: docsPath.length ? docsPath.join(' / ') : '고객사건(최상위)',
      allowScreenCapture: true,
      initialFiles: initialFiles || [],
      actions: [
        {
          label: 'PC에 다운로드',
          busyLabel: '만드는 중…',
          handler: async function(docs){
            docs.forEach(function(doc){
              var blob = new Blob([doc.bytes], { type:'application/pdf' });
              var url = URL.createObjectURL(blob);
              var a = document.createElement('a');
              a.href = url; a.download = doc.name + '.pdf';
              a.click();
              URL.revokeObjectURL(url);
            });
            return false; // 계속 스캔할 수도 있으니 모달을 닫지 않는다
          }
        },
        {
          label: '현재 폴더에 저장',
          primary: true,
          busyLabel: '저장 중…',
          handler: async function(docs){
            var summary = docs.length > 1
              ? ('문서 ' + docs.length + '개(' + docs.map(function(d){ return d.name; }).join(', ') + ')를')
              : ('"' + docs[0].name + '"를');
            if (!confirm(summary + ' "고객사건' + (docsPath.length ? ' / ' + docsPath.join(' / ') : '') + '" 폴더에 저장합니다. 맞나요?')) return false;
            var failed = [];
            for (var i = 0; i < docs.length; i++){
              var doc = docs[i];
              var base64 = uint8ToBase64(doc.bytes);
              var name = doc.name + '.pdf';
              var res = await callGas('uploadFile', { path: docsPath, name: name, mimeType: 'application/pdf', base64Data: base64 });
              if (res.error) failed.push(name + '(' + res.error + ')');
            }
            if (failed.length){ toast('일부 저장 실패: ' + failed.join(', ')); return false; }
            toast(docs.length > 1 ? (docs.length + '개 문서를 저장했습니다.') : ('저장했습니다: ' + docs[0].name + '.pdf'));
            docsNavigate(docsPath);
            return true;
          }
        }
      ]
    });
  }
  document.getElementById('docsBtnScan').addEventListener('click', function(){ docsOpenScanModal_(); });

  // ---- 폴더에 이미 있는 파일을 그대로 스캔으로 불러오기(탐색목록의 📷 아이콘) ----
  // readFileBinary 액션(원본 바이트 그대로 반환)으로 받아와서, 로컬에서 새로 고른 파일과
  // 완전히 같은 경로로 처리한다.
  async function openExistingFileInScan(file){
    toast(file.name + ' 불러오는 중입니다…');
    try{
      var res = await callGas('readFileBinary', { fileId: file.id });
      if (res.error){ toast('불러오기 실패: ' + res.error); return; }
      var binary = atob(res.base64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var blob = new Blob([bytes], { type: file.mimeType || 'image/jpeg' });
      var fileObj = new File([blob], file.name, { type: file.mimeType || 'image/jpeg' });
      docsOpenScanModal_([fileObj]);
    }catch(err){
      toast(file.name + ' 불러오기 중 오류: ' + (err && err.message ? err.message : err));
    }
  }
  // ============================================================
  // PDF 관리 — 스캔과 별도 메뉴. 이미 저장된 PDF들을 페이지 단위로 불러와서
  // 합치기·발췌·순서변경·서명·워터마크를 할 수 있다. 스캔 바구니(.scan-tray)와 같은 드래그
  // 재정렬 UI를 그대로 재사용하되, 페이지별 체크박스를 얹어서 "선택한 페이지만 따로 뽑아
  // 저장"이 가능하게 한다. [2026.09 이식] document-tools.js 로직을 그대로 옮겨왔다.
  // ============================================================
  var pdfMgrOverlay = document.getElementById('pdfMgrOverlay');
  var pdfMgrList = document.getElementById('pdfMgrList');
  var pdfMgrFileInput = document.getElementById('pdfMgrFileInput');
  var pdfMgrExtractName = document.getElementById('pdfMgrExtractName');
  var pdfMgrSaveName = document.getElementById('pdfMgrSaveName');
  var pdfMgrWatermarkText = document.getElementById('pdfMgrWatermarkText');
  var pdfMgrSignatureInput = document.getElementById('pdfMgrSignatureInput');
  var pdfMgrSignatureStatus = document.getElementById('pdfMgrSignatureStatus');
  var pdfMgrSignaturePos = document.getElementById('pdfMgrSignaturePos');

  var pdfMgrEntries = []; // { id, doc(PDFLib 문서객체), pdfjsDoc, sourceName, pageIndex, checked, rotation }
  var pdfMgrIdSeq = 1;
  var pdfMgrSignatureBytes = null; // 도장처럼 찍을 서명 이미지(선택 안 하면 null)

  function openPdfManager(){ pdfMgrOverlay.style.display = 'flex'; }
  function closePdfManager(){ pdfMgrOverlay.style.display = 'none'; }
  document.getElementById('docsBtnPdfManager').addEventListener('click', openPdfManager);
  document.getElementById('btnClosePdfMgr').addEventListener('click', closePdfManager);

  // [2026.09] 탐색목록에서 PDF 파일의 "PDF관리로 열기"를 고르면 여기로 온다. readFileBinary
  // 액션(원본 바이트 그대로 반환)으로 받아와서, 로컬 업로드와 완전히 같은 방식(PDFLib+pdf.js로
  // 파싱해서 페이지 단위로 등록)으로 처리한다.
  async function openExistingFileInPdfManager(file){
    toast(file.name + ' 불러오는 중입니다…');
    try{
      var res = await callGas('readFileBinary', { fileId: file.id });
      if (res.error){ toast('불러오기 실패: ' + res.error); return; }
      var binary = atob(res.base64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

      var doc = await PDFLib.PDFDocument.load(bytes);
      var pdfjsDoc = (typeof pdfjsLib !== 'undefined') ? await pdfjsLib.getDocument({ data: bytes.slice() }).promise : null;
      var sourceName = file.name.replace(/\.pdf$/i, '');
      var pageCount = doc.getPageCount();
      for (var p = 0; p < pageCount; p++){
        pdfMgrEntries.push({ id: pdfMgrIdSeq++, type: 'pdfpage', doc: doc, pdfjsDoc: pdfjsDoc, sourceName: sourceName, pageIndex: p, checked: false, rotation: 0 });
      }
      renderPdfMgrList();
      openPdfManager();
    }catch(err){
      toast(file.name + ' 불러오기 중 오류: ' + (err && err.message ? err.message : err));
    }
  }

  document.getElementById('btnPdfMgrAdd').addEventListener('click', function(){ pdfMgrFileInput.click(); });
  pdfMgrFileInput.addEventListener('change', async function(e){
    var files = Array.from(e.target.files || []);
    pdfMgrFileInput.value = '';
    for (var f = 0; f < files.length; f++){
      var file = files[f];
      try{
        var bytes = new Uint8Array(await file.arrayBuffer());
        var doc = await PDFLib.PDFDocument.load(bytes);
        // pdf.js는 pdf-lib와 별개의 파서라, 렌더링(서명 배치용)을 위해 따로 한 번 더 읽어둔다.
        // 같은 배열을 그대로 넘기면 나중에 detach되는 문제가 있어 복사본을 넘긴다.
        var pdfjsDoc = (typeof pdfjsLib !== 'undefined') ? await pdfjsLib.getDocument({ data: bytes.slice() }).promise : null;
        var sourceName = file.name.replace(/\.pdf$/i, '');
        var pageCount = doc.getPageCount();
        for (var p2 = 0; p2 < pageCount; p2++){
          pdfMgrEntries.push({ id: pdfMgrIdSeq++, type: 'pdfpage', doc: doc, pdfjsDoc: pdfjsDoc, sourceName: sourceName, pageIndex: p2, checked: false, rotation: 0 });
        }
      }catch(err){
        toast(file.name + ' 불러오기 실패: ' + (err && err.message ? err.message : err));
      }
    }
    renderPdfMgrList();
  });

  function renderPdfMgrList(){
    pdfMgrList.innerHTML = '';
    pdfMgrEntries.forEach(function(entry, idx){
      var row = document.createElement('div');
      row.className = 'scan-tray-item';
      row.dataset.idx = idx;
      var isImage = entry.type === 'image';
      var rotLabel = (!isImage && entry.rotation) ? (' (' + entry.rotation + '° 회전)') : '';
      var signedLabel = isImage ? ' (서명 적용됨 — 그림 페이지)' : '';
      var chipIcon = isImage ? '🖋' : '📄';
      // 서명 배치·회전은 원본 페이지 상태일 때만 의미가 있다 — 이미 그림으로 바뀐 페이지는
      // 다시 서명 위치를 잡거나 돌릴 필요가 없으므로 버튼 자체를 안 보여준다.
      var signBtn = !isImage ? '<button data-act="sign" title="이 페이지에 서명 정밀 배치">✍</button>' : '';
      var rotateBtn = !isImage ? '<button data-act="rotate" title="90도 회전 — 원본이 옆으로/거꾸로 되어 있을 때">↻</button>' : '';
      row.innerHTML = '<label class="pdf-mgr-check"><input type="checkbox"' + (entry.checked ? ' checked' : '') + '></label>'
        + '<div class="scan-tray-grip"><span class="pdf-chip-icon">' + chipIcon + '</span>'
        + '<span class="name">' + escapeHtml(entry.sourceName) + ' - ' + (entry.pageIndex + 1) + '페이지' + rotLabel + signedLabel + '</span></div>'
        + signBtn + rotateBtn
        + '<button data-act="del" title="목록에서 빼기">✕</button>';
      row.querySelector('input[type="checkbox"]').addEventListener('change', function(e){
        entry.checked = e.target.checked;
      });
      row.querySelectorAll('button').forEach(function(btn){
        btn.addEventListener('click', function(){
          var act = btn.dataset.act;
          if (act === 'del'){ pdfMgrEntries.splice(idx, 1); renderPdfMgrList(); }
          else if (act === 'rotate'){ entry.rotation = (entry.rotation + 90) % 360; renderPdfMgrList(); }
          else if (act === 'sign'){ openSignaturePlacement(entry, idx); }
        });
      });
      setupPdfMgrDrag(row);
      pdfMgrList.appendChild(row);
    });
  }

  // 드래그 재정렬 — 스캔 바구니와 완전히 같은 방식(document 전체에서 이동/종료 신호를 받음).
  function setupPdfMgrDrag(row){
    var grip = row.querySelector('.scan-tray-grip');
    function onMove(e){
      var after = getPdfMgrDragAfterElement(e.clientY);
      if (after == null) pdfMgrList.appendChild(row);
      else if (after !== row) pdfMgrList.insertBefore(row, after);
    }
    function onEnd(){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onEnd);
      document.removeEventListener('pointercancel', onEnd);
      row.classList.remove('dragging');
      var newOrder = Array.from(pdfMgrList.children).map(function(el){ return Number(el.dataset.idx); });
      pdfMgrEntries = newOrder.map(function(i){ return pdfMgrEntries[i]; });
      renderPdfMgrList();
    }
    grip.addEventListener('pointerdown', function(e){
      e.preventDefault();
      row.classList.add('dragging');
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onEnd);
      document.addEventListener('pointercancel', onEnd);
    });
  }
  function getPdfMgrDragAfterElement(y){
    var items = Array.from(pdfMgrList.querySelectorAll('.scan-tray-item:not(.dragging)'));
    return items.reduce(function(closest, child){
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
      return closest;
    }, { offset: -Infinity, element: null }).element;
  }

  document.getElementById('btnPdfMgrCheckAll').addEventListener('click', function(){
    if (!pdfMgrEntries.length) return;
    var allChecked = pdfMgrEntries.every(function(en){ return en.checked; });
    pdfMgrEntries.forEach(function(en){ en.checked = !allChecked; });
    renderPdfMgrList();
  });

  // 체크된(또는 전체) 항목들을 순서 그대로 하나의 새 PDF 바이트로 만든다.
  async function buildPdfFromPdfMgrEntries(entries){
    var outDoc = await PDFLib.PDFDocument.create();

    // 워터마크 — 문구가 있으면 모든 페이지에 대각선으로 반투명하게 깐다.
    // 주의: 기본 내장 폰트(Helvetica)는 영문/숫자만 정확히 나온다 — 한글은 깨지거나
    // 안 나올 수 있으니, 워터마크 문구는 영문 위주로 쓰는 걸 권장한다(예: DRAFT, CONFIDENTIAL).
    var watermarkText = pdfMgrWatermarkText.value.trim();
    var watermarkFont = watermarkText ? await outDoc.embedFont(PDFLib.StandardFonts.HelveticaBold) : null;

    // 서명(도장) — 등록되어 있으면 한 번만 삽입(embed)해두고 페이지마다 재사용한다.
    var signatureImage = null;
    if (pdfMgrSignatureBytes){
      try{ signatureImage = await outDoc.embedPng(pdfMgrSignatureBytes); }
      catch(e){
        try{ signatureImage = await outDoc.embedJpg(pdfMgrSignatureBytes); }
        catch(e2){ toast('서명 이미지 형식을 읽지 못해 서명 없이 진행합니다.'); }
      }
    }

    for (var k = 0; k < entries.length; k++){
      var entry = entries[k];
      if (entry.type === 'image'){
        // 서명 정밀배치로 이미 그림으로 확정된 페이지 — 원래 페이지와 같은 크기로 새 페이지를 만들고
        // 그 그림을 그대로 채운다(이미 서명은 그림 안에 포함되어 있음). 워터마크만 그 위에 추가로 얹을 수 있다.
        var pngBytes = dataUrlToUint8(entry.imageDataUrl);
        var embeddedImg = await outDoc.embedPng(pngBytes);
        var imgPage = outDoc.addPage([entry.pagePtWidth, entry.pagePtHeight]);
        imgPage.drawImage(embeddedImg, { x: 0, y: 0, width: entry.pagePtWidth, height: entry.pagePtHeight });
        if (watermarkText){
          imgPage.drawText(watermarkText, {
            x: entry.pagePtWidth / 2 - watermarkText.length * 9,
            y: entry.pagePtHeight / 2,
            size: 40, font: watermarkFont, color: PDFLib.rgb(0.6, 0.6, 0.6), opacity: 0.28,
            rotate: PDFLib.degrees(45)
          });
        }
        continue;
      }

      var copiedArr = await outDoc.copyPages(entry.doc, [entry.pageIndex]);
      var copied = copiedArr[0];
      if (entry.rotation){
        var currentAngle = copied.getRotation().angle || 0;
        copied.setRotation(PDFLib.degrees((currentAngle + entry.rotation) % 360));
      }
      var size = copied.getSize();
      var width = size.width, height = size.height;

      if (watermarkText){
        copied.drawText(watermarkText, {
          x: width / 2 - watermarkText.length * 9,
          y: height / 2,
          size: 40,
          font: watermarkFont,
          color: PDFLib.rgb(0.6, 0.6, 0.6),
          opacity: 0.28,
          rotate: PDFLib.degrees(45)
        });
      }
      if (signatureImage){
        var sigW = 120, sigH = 120 * (signatureImage.height / signatureImage.width);
        var margin = 24;
        var pos = pdfMgrSignaturePos.value;
        var sx, sy;
        if (pos === 'bl'){ sx = margin; sy = margin; }
        else if (pos === 'tr'){ sx = width - sigW - margin; sy = height - sigH - margin; }
        else if (pos === 'tl'){ sx = margin; sy = height - sigH - margin; }
        else if (pos === 'center'){ sx = width / 2 - sigW / 2; sy = height / 2 - sigH / 2; }
        else { sx = width - sigW - margin; sy = margin; } // 기본값: 우측 하단(br)
        copied.drawImage(signatureImage, { x: sx, y: sy, width: sigW, height: sigH });
      }

      outDoc.addPage(copied);
    }
    return await outDoc.save();
  }

  document.getElementById('btnPdfMgrExtract').addEventListener('click', async function(){
    var checked = pdfMgrEntries.filter(function(en){ return en.checked; });
    if (!checked.length){ toast('추출할 페이지를 먼저 체크하세요.'); return; }
    var name = (pdfMgrExtractName.value.trim() || '추출') + '.pdf';
    var btn = document.getElementById('btnPdfMgrExtract');
    btn.disabled = true; btn.textContent = '처리 중…';
    try{
      var bytes = await buildPdfFromPdfMgrEntries(checked);
      var base64 = uint8ToBase64(bytes);
      var res = await callGas('uploadFile', { path: docsPath, name: name, mimeType: 'application/pdf', base64Data: base64 });
      if (res.error){ toast('저장 실패: ' + res.error); return; }
      toast('추출해서 저장했습니다: ' + name);
      docsNavigate(docsPath);
      if (confirm('추출한 ' + checked.length + '개 페이지를 지금 목록에서 지울까요?\n(취소하면 그대로 남습니다)')){
        pdfMgrEntries = pdfMgrEntries.filter(function(en){ return !en.checked; });
        renderPdfMgrList();
      }
    }catch(err){
      toast('추출 중 오류: ' + (err && err.message ? err.message : err));
    }finally{
      btn.disabled = false; btn.textContent = '✂ 선택 추출';
    }
  });

  document.getElementById('btnPdfMgrSaveAll').addEventListener('click', async function(){
    if (!pdfMgrEntries.length){ toast('목록이 비어 있습니다.'); return; }
    var name = (pdfMgrSaveName.value.trim() || '문서') + '.pdf';
    var btn = document.getElementById('btnPdfMgrSaveAll');
    btn.disabled = true; btn.textContent = '처리 중…';
    try{
      var bytes = await buildPdfFromPdfMgrEntries(pdfMgrEntries);
      var base64 = uint8ToBase64(bytes);
      var res = await callGas('uploadFile', { path: docsPath, name: name, mimeType: 'application/pdf', base64Data: base64 });
      if (res.error){ toast('저장 실패: ' + res.error); return; }
      toast('저장했습니다: ' + name);
      docsNavigate(docsPath);
    }catch(err){
      toast('저장 중 오류: ' + (err && err.message ? err.message : err));
    }finally{
      btn.disabled = false; btn.textContent = '💾 전체 저장';
    }
  });

  // ============================================================
  // 서명 관리 — 한 번 등록한 서명을 브라우저(localStorage)에 저장해뒀다가 다음에 자동으로
  // 다시 불러오고, 파일 업로드뿐 아니라 화면(터치/마우스)에 직접 그려서 바로 등록할 수도 있다.
  // [2026.09 이식] document-tools.js 로직을 그대로 옮겨왔다.
  // ============================================================
  var SIGNATURE_STORAGE_KEY = 'nx_saved_signature';

  function updateSignatureStatusUI(){
    pdfMgrSignatureStatus.textContent = pdfMgrSignatureBytes
      ? '서명 등록됨 — 저장 시 모든 페이지 우측 하단에 찍힙니다'
      : '';
  }

  function bytesToDataUrl_(bytes, mime){
    mime = mime || 'image/png';
    var binary = '';
    bytes.forEach(function(b){ binary += String.fromCharCode(b); });
    return 'data:' + mime + ';base64,' + btoa(binary);
  }

  function saveSignatureBytes_(bytes){
    pdfMgrSignatureBytes = bytes;
    try{ localStorage.setItem(SIGNATURE_STORAGE_KEY, bytesToDataUrl_(bytes)); }
    catch(e){ toast('서명을 브라우저에 저장하지 못했습니다(용량 초과 가능) — 이번 화면에서는 계속 쓸 수 있습니다.'); }
    updateSignatureStatusUI();
    refreshSigManagePreview();
  }

  function clearSignature_(){
    pdfMgrSignatureBytes = null;
    try{ localStorage.removeItem(SIGNATURE_STORAGE_KEY); }catch(e){}
    updateSignatureStatusUI();
    refreshSigManagePreview();
  }

  // 이전에 등록해둔 서명이 있으면 화면을 열 때 자동으로 불러온다.
  try{
    var savedSignatureDataUrl = localStorage.getItem(SIGNATURE_STORAGE_KEY);
    if (savedSignatureDataUrl) pdfMgrSignatureBytes = dataUrlToUint8(savedSignatureDataUrl);
  }catch(e){}
  updateSignatureStatusUI();

  var sigManageOverlay = document.getElementById('sigManageOverlay');
  var sigManagePreviewImg = document.getElementById('sigManagePreviewImg');
  var sigManageEmptyLabel = document.getElementById('sigManageEmptyLabel');
  var sigManagePreviewWrap = document.getElementById('sigManagePreviewWrap');
  var sigManageDrawWrap = document.getElementById('sigManageDrawWrap');
  var sigDrawCanvas = document.getElementById('sigDrawCanvas');

  function refreshSigManagePreview(){
    if (pdfMgrSignatureBytes){
      sigManagePreviewImg.src = bytesToDataUrl_(pdfMgrSignatureBytes);
      sigManagePreviewImg.style.display = '';
      sigManageEmptyLabel.style.display = 'none';
    } else {
      sigManagePreviewImg.style.display = 'none';
      sigManageEmptyLabel.style.display = '';
    }
  }

  function openSigManage(){
    sigManagePreviewWrap.style.display = 'flex';
    sigManageDrawWrap.style.display = 'none';
    refreshSigManagePreview();
    sigManageOverlay.style.display = 'flex';
  }
  function closeSigManage(){ sigManageOverlay.style.display = 'none'; }

  document.getElementById('btnPdfMgrSignature').addEventListener('click', openSigManage);
  document.getElementById('btnCloseSigManage').addEventListener('click', closeSigManage);

  document.getElementById('btnSigManageFromFile').addEventListener('click', function(){ pdfMgrSignatureInput.click(); });
  pdfMgrSignatureInput.addEventListener('change', async function(e){
    var file = e.target.files[0];
    pdfMgrSignatureInput.value = '';
    if (!file) return;
    saveSignatureBytes_(new Uint8Array(await file.arrayBuffer()));
    toast('서명이 등록됐습니다.');
  });

  document.getElementById('btnSigManageDelete').addEventListener('click', function(){
    if (!pdfMgrSignatureBytes) return;
    if (confirm('등록된 서명을 삭제할까요?')) clearSignature_();
  });

  // 화면(터치·마우스)에 직접 그려서 그 자리에서 바로 서명을 받는 서명패드.
  document.getElementById('btnSigManageDraw').addEventListener('click', function(){
    sigManagePreviewWrap.style.display = 'none';
    sigManageDrawWrap.style.display = 'flex';
    setupSigDrawCanvas_();
  });
  document.getElementById('btnSigDrawCancel').addEventListener('click', function(){
    sigManageDrawWrap.style.display = 'none';
    sigManagePreviewWrap.style.display = 'flex';
  });

  var sigDrawCtx = null;
  var sigDrawing = false;
  function setupSigDrawCanvas_(){
    // 화면에 보이는 CSS 크기 기준으로 캔버스 실제 픽셀 크기를 맞춘다(고해상도 화면에서도 선명하게).
    var rect = sigDrawCanvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    sigDrawCanvas.width = Math.max(1, Math.round(rect.width * dpr));
    sigDrawCanvas.height = Math.max(1, Math.round(rect.height * dpr));
    sigDrawCtx = sigDrawCanvas.getContext('2d');
    sigDrawCtx.scale(dpr, dpr);
    sigDrawCtx.fillStyle = '#fff';
    sigDrawCtx.fillRect(0, 0, rect.width, rect.height);
    sigDrawCtx.lineWidth = 2.5;
    sigDrawCtx.lineCap = 'round';
    sigDrawCtx.lineJoin = 'round';
    sigDrawCtx.strokeStyle = '#1a1a2e';
  }
  function sigDrawPos_(e){
    var rect = sigDrawCanvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  sigDrawCanvas.addEventListener('pointerdown', function(e){
    if (!sigDrawCtx) return;
    sigDrawing = true;
    sigDrawCanvas.setPointerCapture(e.pointerId);
    var p = sigDrawPos_(e);
    sigDrawCtx.beginPath();
    sigDrawCtx.moveTo(p.x, p.y);
  });
  sigDrawCanvas.addEventListener('pointermove', function(e){
    if (!sigDrawing || !sigDrawCtx) return;
    var p = sigDrawPos_(e);
    sigDrawCtx.lineTo(p.x, p.y);
    sigDrawCtx.stroke();
  });
  function endSigDraw_(){ sigDrawing = false; }
  sigDrawCanvas.addEventListener('pointerup', endSigDraw_);
  sigDrawCanvas.addEventListener('pointercancel', endSigDraw_);
  sigDrawCanvas.addEventListener('pointerleave', endSigDraw_);

  document.getElementById('btnSigDrawClear').addEventListener('click', function(){
    if (!sigDrawCtx) return;
    var rect = sigDrawCanvas.getBoundingClientRect();
    sigDrawCtx.fillStyle = '#fff';
    sigDrawCtx.fillRect(0, 0, rect.width, rect.height);
  });

  document.getElementById('btnSigDrawSave').addEventListener('click', function(){
    if (!sigDrawCtx) return;
    sigDrawCanvas.toBlob(async function(blob){
      if (!blob){ toast('서명 이미지를 만들지 못했습니다.'); return; }
      saveSignatureBytes_(new Uint8Array(await blob.arrayBuffer()));
      sigManageDrawWrap.style.display = 'none';
      sigManagePreviewWrap.style.display = 'flex';
      toast('서명이 등록됐습니다.');
    }, 'image/png');
  });

  // ============================================================
  // 서명 정밀 배치 — 실제 그 페이지를 그림으로 렌더링해서 보여주고, 서명 이미지를 손가락으로
  // 끌어서 원하는 자리에 정확히 놓을 수 있게 한다. 확정하면 그 페이지는 "그림 기반 페이지"로
  // 바뀐다. [2026.09 이식] document-tools.js 로직을 그대로 옮겨왔다.
  // ============================================================
  var sigPlaceOverlay = document.getElementById('sigPlaceOverlay');
  var sigPlaceCanvas = document.getElementById('sigPlaceCanvas');
  var sigPlaceSigImg = document.getElementById('sigPlaceSigImg');
  var sigPlaceStage = document.getElementById('sigPlaceStage');
  var sigPlaceEntryIdx = -1;
  var sigPlaceOriginalEntry = null;
  var sigPlaceViewportScale = 1.5; // pdf.js 렌더링 배율(포인트 단위를 화면 px로 확대해서 그림)

  async function openSignaturePlacement(entry, idx){
    if (!pdfMgrSignatureBytes){ toast('먼저 "🖋 서명 관리"로 서명을 등록하세요.'); return; }
    if (!entry.pdfjsDoc){ toast('이 파일은 미리보기를 지원하지 않습니다.'); return; }
    sigPlaceEntryIdx = idx;
    sigPlaceOriginalEntry = entry;
    sigPlaceOverlay.style.display = 'flex';
    try{
      var page = await entry.pdfjsDoc.getPage(entry.pageIndex + 1); // pdf.js 페이지 번호는 1부터 시작
      var viewport = page.getViewport({ scale: sigPlaceViewportScale });
      sigPlaceCanvas.width = viewport.width;
      sigPlaceCanvas.height = viewport.height;
      sigPlaceStage.style.width = viewport.width + 'px';
      sigPlaceStage.style.height = viewport.height + 'px';
      await page.render({ canvasContext: sigPlaceCanvas.getContext('2d'), viewport: viewport }).promise;

      var sigBlobUrl = URL.createObjectURL(new Blob([pdfMgrSignatureBytes]));
      sigPlaceSigImg.src = sigBlobUrl;
      sigPlaceSigImg.style.width = '150px';
      sigPlaceSigImg.style.height = 'auto';
      sigPlaceSigImg.style.left = Math.max(0, viewport.width - 170) + 'px';
      sigPlaceSigImg.style.top = Math.max(0, viewport.height - 110) + 'px';
    }catch(err){
      toast('페이지 미리보기 실패: ' + (err && err.message ? err.message : err));
      sigPlaceOverlay.style.display = 'none';
    }
  }
  function closeSignaturePlacement(){ sigPlaceOverlay.style.display = 'none'; }
  document.getElementById('btnCloseSigPlace').addEventListener('click', closeSignaturePlacement);

  // 서명 이미지를 손가락/마우스로 끌어서 원하는 자리로 옮기는 로직(스캔 바구니와 같은 드래그 방식).
  (function setupSigDrag(){
    var dragging = false, offX = 0, offY = 0;
    sigPlaceSigImg.addEventListener('pointerdown', function(e){
      dragging = true;
      var rect = sigPlaceSigImg.getBoundingClientRect();
      offX = e.clientX - rect.left;
      offY = e.clientY - rect.top;
      e.preventDefault();
    });
    document.addEventListener('pointermove', function(e){
      if (!dragging) return;
      var stageRect = sigPlaceStage.getBoundingClientRect();
      sigPlaceSigImg.style.left = (e.clientX - stageRect.left - offX) + 'px';
      sigPlaceSigImg.style.top = (e.clientY - stageRect.top - offY) + 'px';
    });
    document.addEventListener('pointerup', function(){ dragging = false; });
    document.addEventListener('pointercancel', function(){ dragging = false; });
  })();

  // "적용" — 지금 화면(페이지 그림 + 그 위 서명 위치)을 그대로 합쳐서 하나의 이미지로 굽고,
  // 그 페이지를 "그림 기반 페이지"로 바꿔치기한다.
  document.getElementById('btnSigPlaceConfirm').addEventListener('click', async function(){
    var ctx = sigPlaceCanvas.getContext('2d');
    var stageRect = sigPlaceStage.getBoundingClientRect();
    var imgRect = sigPlaceSigImg.getBoundingClientRect();
    var drawX = imgRect.left - stageRect.left;
    var drawY = imgRect.top - stageRect.top;
    ctx.drawImage(sigPlaceSigImg, drawX, drawY, sigPlaceSigImg.offsetWidth, sigPlaceSigImg.offsetHeight);
    var finalDataUrl = sigPlaceCanvas.toDataURL('image/png');

    // 나중에 PDF로 다시 넣을 때 원래 페이지와 같은 실제 크기(포인트 단위)가 되도록 미리 구해둔다.
    var originalPage = sigPlaceOriginalEntry.doc.getPage(sigPlaceOriginalEntry.pageIndex);
    var pageSize = originalPage.getSize();

    pdfMgrEntries[sigPlaceEntryIdx] = {
      id: sigPlaceOriginalEntry.id,
      type: 'image',
      sourceName: sigPlaceOriginalEntry.sourceName,
      pageIndex: sigPlaceOriginalEntry.pageIndex,
      checked: sigPlaceOriginalEntry.checked,
      imageDataUrl: finalDataUrl,
      pagePtWidth: pageSize.width,
      pagePtHeight: pageSize.height
    };
    renderPdfMgrList();
    closeSignaturePlacement();
    toast('서명을 적용했습니다. 이 페이지는 이제 그림 기반 페이지입니다.');
  });

  // ============================================================
  // 텍스트 추출(OCR) — 체크한 페이지를 이미지로 그려서 Tesseract.js로 글자를 읽어낸다.
  // 전부 브라우저 안에서 처리되고 서버로는 아무것도 전송되지 않는다(API 비용이 전혀 안 든다).
  // 인쇄된 문서(등기부등본·세금계산서 등)에 적합하고, 손글씨는 정확도가 낮다.
  // 결과는(채팅이 없는 이 앱이라) 별도 결과창에 보여주고 클립보드로 복사할 수 있게 한다.
  // [2026.09 이식] document-tools.js 로직을 그대로 옮겨왔다.
  // ============================================================
  var tesseractWorker_ = null;
  async function getTesseractWorker_(){
    if (tesseractWorker_) return tesseractWorker_;
    tesseractWorker_ = await Tesseract.createWorker(['kor', 'eng']);
    return tesseractWorker_;
  }

  async function renderPdfMgrEntryToCanvas_(entry){
    if (!entry.pdfjsDoc) throw new Error('이 페이지는 미리보기용 문서가 없어 텍스트를 추출할 수 없습니다.');
    var page = await entry.pdfjsDoc.getPage(entry.pageIndex + 1);
    var viewport = page.getViewport({ scale: 2.5, rotation: entry.rotation || 0 });
    var canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
    return canvas;
  }

  document.getElementById('btnPdfMgrOcr').addEventListener('click', async function(){
    var targets = pdfMgrEntries.filter(function(en){ return en.checked; });
    if (!targets.length){ toast('텍스트를 추출할 페이지를 먼저 체크하세요.'); return; }
    var btn = document.getElementById('btnPdfMgrOcr');
    btn.disabled = true;
    try{
      var worker = await getTesseractWorker_();
      var parts = [];
      for (var i = 0; i < targets.length; i++){
        btn.textContent = '🔤 추출 중… (' + (i + 1) + '/' + targets.length + ')';
        var entry = targets[i];
        try{
          var canvas = await renderPdfMgrEntryToCanvas_(entry);
          var result = await worker.recognize(canvas);
          var label = entry.sourceName + ' - ' + (entry.pageIndex + 1) + '페이지';
          parts.push('[' + label + ']\n' + (result.data.text || '').trim());
        }catch(err){
          parts.push('[' + entry.sourceName + ' - ' + (entry.pageIndex + 1) + '페이지] 텍스트 추출 실패: ' + (err && err.message ? err.message : err));
        }
      }
      document.getElementById('ocrResultText').value = parts.join('\n\n---\n\n');
      document.getElementById('ocrResultOverlay').style.display = 'flex';
      toast(targets.length + '개 페이지에서 텍스트를 추출했습니다.');
    }catch(err){
      toast('텍스트 추출 중 오류: ' + (err && err.message ? err.message : err));
    }finally{
      btn.disabled = false;
      btn.textContent = '🔤 텍스트 추출';
    }
  });

  document.getElementById('btnCloseOcrResult').addEventListener('click', function(){
    document.getElementById('ocrResultOverlay').style.display = 'none';
  });
  document.getElementById('btnOcrResultCopy').addEventListener('click', function(){
    var ta = document.getElementById('ocrResultText');
    ta.select();
    try{
      navigator.clipboard.writeText(ta.value).then(function(){ toast('클립보드에 복사했습니다.'); }).catch(function(){
        document.execCommand('copy'); toast('클립보드에 복사했습니다.');
      });
    }catch(e){ document.execCommand('copy'); toast('클립보드에 복사했습니다.'); }
  });
</script>
