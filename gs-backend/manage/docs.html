<style>
  /* [2026.09 이식] PDF관리·서명·워터마크·화면캡처·바구니 드래그재정렬 — document-tools.js에서
     가져온 기능들의 전용 스타일. style.html은 건드리지 않고 이 파일 안에서만 추가한다. */
  .scan-tray{ display:flex; flex-direction:column; gap:6px; max-height:300px; overflow-y:auto; }
  .scan-tray-item.dragging{ opacity:0.5; }
  .pdf-mgr-check{ flex-shrink:0; display:flex; align-items:center; }
  .pdf-mgr-check input{ width:16px; height:16px; cursor:pointer; }
  #sigDrawCanvas{ width:100%; height:180px; display:block; background:#fff; cursor:crosshair; touch-action:none; border:1px solid var(--line); border-radius:8px; }
  #sigPlaceStageWrap{ width:100%; overflow:auto; background:#2a2a2a; display:flex; justify-content:center; padding:8px 0; border-radius:8px; }
  #sigPlaceStage{ position:relative; }
  #sigPlaceSigImg{ position:absolute; touch-action:none; cursor:grab; }
  #ocrResultText{ width:100%; min-height:260px; font-family:inherit; font-size:12.5px; resize:vertical; box-sizing:border-box; }

  /* [2026.09 이식] work.netax.kr explorer.js의 우클릭 메뉴·검색·휴지통·이동 — 실사용 지적으로
     추가. 탐색기 행의 hover-only 아이콘(.docs-actions)은 터치기기에서 못 써서, 항상 보이는
     "⋮" 버튼 + 우클릭(데스크톱)/길게 눌러도 되는 컨텍스트 메뉴로 대체한다. */
  .docs-row .docs-kebab{ flex-shrink:0; padding:2px 6px; border-radius:4px; color:var(--sub); cursor:pointer; }
  .docs-row .docs-kebab:hover{ background:#e5e7eb; color:var(--ink); }
  .docs-ctx-menu{ position:fixed; z-index:400; background:var(--panel); border:1px solid var(--line); border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,0.18); min-width:150px; padding:4px; font-size:13px; }
  .docs-ctx-menu-item{ padding:8px 12px; border-radius:6px; cursor:pointer; white-space:nowrap; }
  .docs-ctx-menu-item:hover{ background:#f3f4f7; }
  .docs-ctx-menu-item.danger{ color:var(--danger, #b3261e); }
  .docs-ctx-sep{ height:1px; background:var(--line); margin:4px 2px; }
  .docs-fab{ position:absolute; right:18px; bottom:18px; width:48px; height:48px; border-radius:50%; background:var(--navy);
    color:#fff; font-size:26px; line-height:46px; text-align:center; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,0.28); z-index:60; user-select:none; }
  .docs-fab:hover{ background:var(--navy-deep); }
  .docs-view-choice{ position:fixed; z-index:400; background:var(--panel); border:1px solid var(--line); border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,0.18); padding:4px; font-size:13px; min-width:140px; }
  .docs-search-result{ display:flex; flex-direction:column; gap:2px; padding:9px 10px; border-radius:6px; cursor:pointer; }
  .docs-search-result:hover{ background:#f3f4f7; }
  .docs-search-result .p{ font-size:11.5px; color:var(--sub); }
  .docs-trash-row{ display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:6px; font-size:13px; }
  /* [2026.09 이식] 텍스트류 파일보기(메모장 느낌) + 엑셀/CSV 표보기(excel-viewer.html 이식). */
  #docsViewerBody pre.docs-text-view{ white-space:pre-wrap; word-break:break-all; font-family:'Consolas',monospace; font-size:12.5px; line-height:1.6; margin:0; }
  #docsViewerBody table{ border-collapse:collapse; font-size:12.5px; }
  #docsViewerBody table td, #docsViewerBody table th{ border:1px solid var(--line); padding:4px 8px; white-space:nowrap; }
  #docsViewerBody table th{ background:var(--bg); position:sticky; top:0; }
  .docs-viewer-fallback{ text-align:center; padding:30px; color:var(--sub); font-size:13px; }
</style>

<div class="view" id="view-docs">
  <div class="tb-row" style="display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:1px solid var(--line); flex:0 0 auto; background:var(--panel);">
    <label style="font-size:12px; color:var(--sub);">사건</label>
    <select id="docsCaseSelect" style="min-width:220px; max-width:360px;"><option value="">사건 선택</option></select>
    <button type="button" id="docsBackToCaseBtn" class="ghost-btn" style="margin-left:auto;"><span class="btn-ic">↩</span><span class="btn-tx"> 처리개요</span></button>
  </div>
  <div class="docs-toolbar tb-row">
    <button type="button" id="docsBtnUp" class="ghost-btn" title="상위 폴더"><span class="btn-ic">⬆</span><span class="btn-tx"> 상위</span></button>
    <div class="docs-breadcrumb" id="docsBreadcrumb"></div>
    <button type="button" id="docsBtnNewFolder" class="ghost-btn"><span class="btn-ic">📁</span><span class="btn-tx"> 새 폴더</span></button>
    <button type="button" id="docsBtnUpload" class="ghost-btn"><span class="btn-ic">📤</span><span class="btn-tx"> 업로드</span></button>
    <input type="file" id="docsUploadInput" multiple style="display:none;">
    <button type="button" id="docsBtnPdfManager" class="ghost-btn"><span class="btn-ic">📑</span><span class="btn-tx"> PDF관리</span></button>
    <button type="button" id="docsBtnScan" class="ghost-btn"><span class="btn-ic">📷</span><span class="btn-tx"> 스캔</span></button>
    <button type="button" id="docsBtnFolderNameAudit" class="ghost-btn" title="모든 사건의 폴더명이 명명규칙(고객명_세목_업무유형)대로인지 전수조사"><span class="btn-ic">🏷</span><span class="btn-tx"> 폴더명 점검</span></button>
  </div>
  <div id="docsCaseEvidencePanel" style="display:none; flex:0 0 auto; border-bottom:1px solid var(--line); padding:10px 14px; overflow-y:auto; max-height:40vh;"></div>
  <div id="docsSelectionBar" class="tb-row" style="display:none; flex:0 0 auto; align-items:center; gap:8px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); font-size:12.5px; flex-wrap:wrap;">
    <span id="docsSelectionCount"></span>
    <button type="button" id="docsBtnScanSelected" class="ghost-btn" style="font-size:12px;"><span class="btn-ic">📷</span><span class="btn-tx"> 스캔에 추가</span></button>
    <button type="button" id="docsBtnPdfMgrSelected" class="ghost-btn" style="font-size:12px;"><span class="btn-ic">📑</span><span class="btn-tx"> PDF관리에 추가</span></button>
    <!-- [2026.09 이식] work.netax.kr 참고화면과 같은 방식 — 체크한 항목에 바로 쓸 수 있는
         이름변경·공유·삭제·이동. 이름변경은 한 번에 하나만 뜻이 있어 1개 선택했을 때만 보인다. -->
    <button type="button" id="docsBtnRenameSelected" class="ghost-btn" style="font-size:12px;"><span class="btn-ic">✏️</span><span class="btn-tx"> 이름변경</span></button>
    <button type="button" id="docsBtnShareSelected" class="ghost-btn" style="font-size:12px;"><span class="btn-ic">🔗</span><span class="btn-tx"> 공유</span></button>
    <button type="button" id="docsBtnMoveSelected" class="ghost-btn" style="font-size:12px;"><span class="btn-ic">📂</span><span class="btn-tx"> 이동</span></button>
    <button type="button" id="docsBtnDeleteSelected" class="btn danger" style="font-size:12px;"><span class="btn-ic">🗑</span><span class="btn-tx"> 삭제</span></button>
    <button type="button" id="docsBtnClearSelection" class="ghost-btn" style="font-size:12px; margin-left:auto;">선택 해제</button>
  </div>
  <div style="position:relative; flex:1; min-height:0; display:flex;">
    <div class="docs-list" id="docsList" style="flex:1; overflow-y:auto;"><div class="spinner">불러오는 중…</div></div>
    <!-- [2026.09 이식] 화면이 파일로 꽉 차서 빈 곳이 없을 때를 대비한 + 버튼 — 빈 곳 우클릭과
         똑같은 메뉴(새 폴더/새 문서/업로드/검색/제출현황/휴지통/새로고침)를 띄운다. -->
    <div class="docs-fab" id="docsFab" title="더보기">+</div>
  </div>
</div>

<!-- 우클릭/⋮ 컨텍스트 메뉴 — 파일·폴더 행, 빈 목록 공간, + 버튼이 전부 이걸 공유해서 쓴다. -->
<div class="docs-ctx-menu" id="docsCtxMenu" style="display:none;"></div>
<!-- 파일 좌클릭 시 "파일보기/파일관리" 선택 팝업(PDF·이미지만 — 더블클릭하면 이거 없이 바로 파일보기). -->
<div class="docs-view-choice" id="docsViewChoice" style="display:none;"></div>

<!-- [2026.09 이식] 파일보기 — md/이미지/pdf/html만 다루던 것을 넓혀서, 텍스트류는 메모장처럼
     바로 읽고, 엑셀/CSV는 표로 바로 보여준다(work.netax.kr의 excel-viewer.html 이식). 그 외
     형식(워드·파워포인트 등)은 구글드라이브 자체 미리보기로, 한글(HWP)은 구글이 아예 못 열어서
     다운로드 안내로 대체한다. -->
<div class="modal-overlay" id="docsViewerOverlay" style="display:none;">
  <div class="modal-panel" style="max-width:900px; width:96vw;">
    <div class="modal-head">
      <span id="docsViewerTitle">파일보기</span>
      <span class="modal-close" id="btnCloseDocsViewer" title="닫기">✕</span>
    </div>
    <div class="modal-body" style="max-height:75vh; overflow:auto;">
      <div id="docsViewerToolbar" style="display:none; margin-bottom:10px; align-items:center; gap:8px;">
        <select id="docsViewerSheetSelect" style="display:none;"></select>
        <span style="font-size:11.5px; color:var(--sub);">표에서 범위를 드래그해 복사할 수 있습니다.</span>
      </div>
      <!-- [2026.09 신규] 텍스트/md 파일 — 사건개시템플릿이 자동으로 만들어주는 체크리스트 등을
           내려받지 않고 바로 여기서 고쳐 쓸 수 있게, "보기 전용"에 편집 모드를 추가한다. -->
      <div id="docsTextEditBar" style="display:none; margin-bottom:10px; gap:8px;">
        <button type="button" id="btnDocsTextEdit" class="ghost-btn">✏ 편집</button>
        <button type="button" id="btnDocsTextSave" class="save-btn" style="display:none;">💾 저장</button>
        <button type="button" id="btnDocsTextCancel" class="ghost-btn" style="display:none;">취소</button>
        <span id="docsTextSaveStatus" style="font-size:11.5px; color:var(--sub);"></span>
      </div>
      <div id="docsViewerBody"><div class="spinner">불러오는 중…</div></div>
    </div>
  </div>
</div>

<!-- 파일검색 — 폴더를 안 거치고 드라이브 전체에서 이름으로 바로 찾는다. -->
<div class="modal-overlay" id="docsSearchOverlay" style="display:none;">
  <div class="modal-panel" style="max-width:520px;">
    <div class="modal-head">
      <span>🔍 파일 검색</span>
      <span class="modal-close" id="btnCloseDocsSearch" title="닫기">✕</span>
    </div>
    <div class="modal-body">
      <div style="display:flex; gap:8px; margin-bottom:10px;">
        <input type="text" id="docsSearchInput" placeholder="파일·폴더 이름으로 검색" style="flex:1;">
        <button type="button" id="docsSearchRunBtn" class="save-btn">검색</button>
      </div>
      <div id="docsSearchResults"></div>
    </div>
  </div>
</div>

<!-- 휴지통 — 지금 보고 있는 폴더 바로 아래에서 삭제된 항목만 보여주고 복원한다. -->
<div class="modal-overlay" id="docsTrashOverlay" style="display:none;">
  <div class="modal-panel" style="max-width:480px;">
    <div class="modal-head">
      <span>🗑 휴지통 — <span id="docsTrashFolderName"></span></span>
      <span class="modal-close" id="btnCloseDocsTrash" title="닫기">✕</span>
    </div>
    <div class="modal-body">
      <div id="docsTrashList"><div class="spinner">불러오는 중…</div></div>
    </div>
  </div>
</div>

<!-- 이동 — 대상 폴더를 직접 찾아 들어가서 고른다(지금 보고 있는 목록과 같은 방식으로 탐색). -->
<div class="modal-overlay" id="docsMoveOverlay" style="display:none;">
  <div class="modal-panel" style="max-width:480px;">
    <div class="modal-head">
      <span>📂 이동할 위치 선택 — <span id="docsMoveItemName"></span></span>
      <span class="modal-close" id="btnCloseDocsMove" title="닫기">✕</span>
    </div>
    <div class="modal-body">
      <div class="docs-breadcrumb" id="docsMoveBreadcrumb" style="margin-bottom:8px;"></div>
      <div id="docsMoveList" style="max-height:300px; overflow-y:auto;"></div>
      <div style="margin-top:14px; display:flex; justify-content:flex-end;">
        <button type="button" id="docsMoveConfirmBtn" class="save-btn">여기로 이동</button>
      </div>
    </div>
  </div>
</div>

<!-- PDF 관리 — 이미 저장된 PDF들을 페이지 단위로 불러와서 합치기·발췌·순서변경·서명·워터마크.
     스캔 바구니(.scan-tray)와 같은 드래그 재정렬 UI를 재사용하되, 페이지별 체크박스가 추가된다.
     [2026.09 이식] document-tools.js의 PDF 관리 도구를 그대로 옮겨왔다. -->
<div class="modal-overlay" id="pdfMgrOverlay" style="display:none;">
  <div class="scan-modal-panel">
    <div class="modal-head">
      <span>📑 PDF 관리 — 합치기·발췌·서명·워터마크</span>
      <span class="modal-close" id="btnClosePdfMgr" title="닫기">✕</span>
    </div>
    <div class="scan-body">
      <input type="file" id="pdfMgrFileInput" accept="application/pdf" multiple style="display:none;">
      <div class="scan-row">
        <button type="button" id="btnPdfMgrAdd" class="ghost-btn"><span class="btn-ic">📄</span><span class="btn-tx"> PDF 추가</span></button>
        <button type="button" id="btnPdfMgrCheckAll" class="ghost-btn"><span class="btn-ic">☑</span><span class="btn-tx"> 전체선택</span></button>
        <button type="button" id="btnPdfMgrOcr" class="ghost-btn" title="체크한 페이지에서 인쇄된 글자를 텍스트로 추출합니다(브라우저 안에서 바로 처리 — 서버로 전송되지 않음). 손글씨는 정확도가 낮을 수 있습니다."><span class="btn-ic">🔤</span><span class="btn-tx"> 텍스트 추출</span></button>
      </div>
      <div class="scan-row">
        <input type="text" id="pdfMgrWatermarkText" placeholder="워터마크 문구(영문 권장 — 한글은 깨질 수 있음)" style="flex:1; min-width:160px;">
        <input type="file" id="pdfMgrSignatureInput" accept="image/*" style="display:none;">
        <button type="button" id="btnPdfMgrSignature" class="ghost-btn">🖋 서명 관리</button>
        <select id="pdfMgrSignaturePos">
          <option value="br" selected>서명: 우측 하단</option>
          <option value="bl">서명: 좌측 하단</option>
          <option value="tr">서명: 우측 상단</option>
          <option value="tl">서명: 좌측 상단</option>
          <option value="center">서명: 중앙</option>
        </select>
        <span id="pdfMgrSignatureStatus" style="font-size:11.5px; color:var(--sub);"></span>
      </div>
      <div id="pdfMgrList" class="scan-tray"></div>
    </div>
    <div class="scan-row" style="padding:0 16px 6px; border-top:1px solid var(--line); padding-top:12px;">
      <input type="text" id="pdfMgrExtractName" placeholder="추출할 파일 이름" style="flex:1; min-width:120px;">
      <button type="button" id="btnPdfMgrExtract" class="ghost-btn">✂ 선택 추출</button>
    </div>
    <div class="scan-row" style="padding:0 16px 16px;">
      <input type="text" id="pdfMgrSaveName" placeholder="전체 저장 파일 이름" style="flex:1; min-width:120px;">
      <button type="button" id="btnPdfMgrSaveAll" class="save-btn">💾 전체 저장</button>
    </div>
  </div>
</div>

<!-- 서명 관리 — 미리 등록해둔 서명을 확인·교체·삭제하거나, 화면에 손가락/마우스로 직접 그려서
     바로 등록한다. 한 번 등록하면 브라우저(localStorage)에 저장되어 계속 재사용된다. -->
<div class="modal-overlay" id="sigManageOverlay" style="display:none;">
  <div class="modal-panel" style="max-width:420px;">
    <div class="modal-head">
      <span>서명 관리</span>
      <span class="modal-close" id="btnCloseSigManage" title="닫기">✕</span>
    </div>
    <div class="modal-body">
      <div id="sigManagePreviewWrap" style="display:flex; flex-direction:column; align-items:center; gap:10px;">
        <div id="sigManagePreviewBox" style="width:100%; min-height:120px; border:1px dashed var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center; background:#fff;">
          <img id="sigManagePreviewImg" style="max-width:100%; max-height:160px; display:none;">
          <span id="sigManageEmptyLabel" style="color:var(--sub); font-size:12.5px;">등록된 서명이 없습니다</span>
        </div>
        <div class="tb-row" style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
          <button type="button" id="btnSigManageFromFile" class="ghost-btn"><span class="btn-ic">📁</span><span class="btn-tx"> 파일에서 불러오기</span></button>
          <button type="button" id="btnSigManageDraw" class="ghost-btn"><span class="btn-ic">✍</span><span class="btn-tx"> 직접 그리기</span></button>
          <button type="button" id="btnSigManageDelete" class="btn danger"><span class="btn-ic">🗑</span><span class="btn-tx"> 삭제</span></button>
        </div>
      </div>
      <div id="sigManageDrawWrap" style="display:none; flex-direction:column; gap:8px;">
        <canvas id="sigDrawCanvas"></canvas>
        <div style="display:flex; gap:8px; justify-content:center;">
          <button type="button" id="btnSigDrawClear" class="ghost-btn">지우기</button>
          <button type="button" id="btnSigDrawCancel" class="ghost-btn">취소</button>
          <button type="button" id="btnSigDrawSave" class="save-btn">이 서명 사용</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 서명 정밀 배치 — 실제 그 페이지를 그림으로 렌더링해서 보여주고, 서명 이미지를 손가락으로
     끌어서 원하는 자리에 정확히 놓을 수 있게 한다. 확정하면 그 페이지는 "그림 기반 페이지"로
     바뀐다(글자 선택·검색은 그 페이지에 한해 안 되게 됨). -->
<div class="modal-overlay" id="sigPlaceOverlay" style="display:none;">
  <div class="scan-modal-panel">
    <div class="modal-head">
      <span>서명을 끌어서 위치를 정하세요</span>
      <span class="modal-close" id="btnCloseSigPlace" title="닫기">✕</span>
    </div>
    <div class="scan-body">
      <div class="scan-row">
        <button type="button" id="btnSigPlaceConfirm" class="save-btn">✔ 적용</button>
      </div>
      <div id="sigPlaceStageWrap">
        <div id="sigPlaceStage">
          <canvas id="sigPlaceCanvas"></canvas>
          <img id="sigPlaceSigImg">
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<!-- 스캔(원근보정·자동인식·문서구분) 공용 도구 — my.netax.kr 고객창구의 자료제출함과 동일한
     코드를 netax.kr에서 그대로 불러 쓴다(중복 이식 대신 공용 모듈로 분리, 2026.09). -->
<script src="https://netax.kr/shared/scan-tool.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<!-- [2026.09 이식] work.netax.kr excel-viewer.html이 쓰던 것과 같은 버전 — 엑셀/CSV를
     새 탭으로 안 나가고 바로 표로 보여준다. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- [2026.09 이식] 계산기의 "신고기한 계산" 기능용 — work.netax.kr index.html과 같은 버전. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/date-fns/2.30.0/date_fns.min.js"></script>
<script>
  // ============================================================
  // 증빙관리 — 탐색창(폴더 이동)+보기창(구글드라이브 뷰어로 새 탭에서 열기)+스캔창.
  // 스캔의 원근보정(호모그래피) 수학은 document-tools.js의 검증된 로직을 그대로 가져왔다.
  // 탐색 자체는 explorer.js를 이식하지 않고, 이 앱에 맞게 가볍게 새로 짰다
  // (explorer.js는 채팅 첨부·다중선택 등과 얽혀있어 그 부분까지 옮길 필요가 없었음).
  // ============================================================
  var docsPath = [];
  var docsCurrentListing = null;
  var docsLoaded = false;
  var docsSelectedIds = {}; // { fileId: true } — 스캔/PDF관리로 한번에 여러 개 넘길 때 씀. 폴더 이동 시 비운다.
  var docsSelectedCaseId_ = null; // "↩ 처리개요" 버튼용 — 지금 보고 있는 폴더가 어느 사건인지(docsNavigate에서 갱신).

  // pdf.js는 실제 렌더링을 별도 워커에서 돌리므로, 워커 스크립트 위치를 지정해줘야 한다
  // (PDF 관리의 텍스트추출·서명 정밀배치 미리보기에 사용).
  if (typeof pdfjsLib !== 'undefined'){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js';
  }

  function initDocs(){
    // [2026.09 버그수정] docsLoaded는 chEvOpenDocsBtn/chDocsWriterOpenBtn(casehandling.html)
    // 이 레이스컨디션을 막으려고 여기 오기 전에 미리 true로 세팅해두는 경우가 있다 — 그래서
    // "docsLoaded면 무조건 return"으로 짜여있으면 그 경로로 처음 들어올 때 아래
    // docsInitCaseSelect_()(사건연결 드롭다운·뒤로가기 버튼 연결)가 전혀 실행되지 않는 버그가
    // 있었다("증빙확보에서 처리개요로 버튼이 안 먹는다"). 최초 1회만 할 일(docsNavigate([]))과
    // 매번 해도 되는 일(docsInitCaseSelect_, 자체적으로 중복실행 방지)을 분리한다.
    if (!docsLoaded){
      docsLoaded = true;
      docsNavigate([]);
    }
    docsInitCaseSelect_();
    var auditBtn = document.getElementById('docsBtnFolderNameAudit');
    if (auditBtn && !auditBtn.dataset.inited){
      auditBtn.dataset.inited = '1';
      auditBtn.addEventListener('click', docsOpenFolderNameAuditModal_);
    }
  }

  // [2026.09] "폴더명 작성규칙(고객명_세목_업무유형, work_generateUniqueCaseName_ 참고)을
  // 제대로 안 지키고 있는 것 같다"는 지적 — 고객명 정정·세목 변경 등이 있어도 사건명(=폴더명)은
  // 자동으로 안 바뀌는 기존 정책 때문에 시간이 지날수록 실제 규칙과 어긋나는 폴더가 쌓일 수
  // 있다. 실제 Drive 폴더와 시트를 동시에 바꾸는 위험한 작업이라, 먼저 무엇이 바뀔지 전부
  // 보여주고(dryRun) 확인 후에만 실제로 적용한다 — 자동으로 조용히 바꾸지 않는다.
  function docsOpenFolderNameAuditModal_(){
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.style.display = 'flex';
    overlay.innerHTML =
      '<div class="modal-panel" style="width:min(760px, 96vw); max-height:86vh; display:flex; flex-direction:column;">' +
        '<div class="modal-head"><span>🏷 폴더명 규칙 전수조사</span><span class="modal-close" id="docsFnaClose">✕</span></div>' +
        '<div class="modal-body" style="overflow-y:auto;">' +
          '<div id="docsFnaBody">확인 중…</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    function close(){ overlay.remove(); }
    overlay.querySelector('#docsFnaClose').onclick = close;
    overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });

    function renderList(items){
      var body = overlay.querySelector('#docsFnaBody');
      if (!items.length){ body.innerHTML = '<div class="log-empty">규칙과 어긋나는 사건명(폴더명)이 없습니다. 전부 규칙대로입니다.</div>'; return; }
      var rows = items.map(function(it){
        return '<tr>' +
          '<td style="padding:4px 8px;">' + escapeHtml(it.고객명) + '</td>' +
          '<td style="padding:4px 8px; color:#b23;">' + escapeHtml(it.현재사건명 || '(빈 값)') + '</td>' +
          '<td style="padding:4px 8px; color:#2a7a4f;">' + escapeHtml(it.제안사건명) + '</td>' +
          '<td style="padding:4px 8px;">' + (it.폴더ID ? '있음' : '없음(사건명만 수정)') + '</td>' +
        '</tr>';
      }).join('');
      body.innerHTML =
        '<div class="taxcalc-result-note" style="margin-bottom:8px;">아래 ' + items.length + '건은 지금 규칙대로 다시 만들면 이름이 달라집니다. "일괄 적용"을 누르면 시트의 사건명과 실제 Drive 폴더명을 함께 바꿉니다(폴더가 있는 경우만). 확보한 자료·하위 폴더 구조는 그대로 유지됩니다(이름만 바뀜).</div>' +
        '<div style="overflow-x:auto;"><table style="width:100%; border-collapse:collapse; font-size:12.5px;"><thead><tr style="text-align:left; border-bottom:1px solid var(--line);"><th style="padding:4px 8px;">고객명</th><th style="padding:4px 8px;">현재 사건명(폴더명)</th><th style="padding:4px 8px;">규칙대로면</th><th style="padding:4px 8px;">Drive 폴더</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<button type="button" id="docsFnaApplyBtn" class="btn danger" style="margin-top:10px;">⚠ 위 ' + items.length + '건 일괄 적용(되돌리기 어려움)</button>';
      body.querySelector('#docsFnaApplyBtn').addEventListener('click', function(){
        if (!confirm(items.length + '건의 사건명과 Drive 폴더명을 실제로 바꿉니다. 계속할까요?')) return;
        body.innerHTML = '적용 중…';
        callGas('work_audit_case_folder_names', { apply: true }).then(function(res){
          if (res.success === false){ body.innerHTML = '<div class="taxcalc-error">' + (res.message || '적용 실패') + '</div>'; return; }
          body.innerHTML = '<div class="taxcalc-result-note">' + res.applied + '건 적용했습니다.</div>';
          showToast(res.applied + '건의 폴더명을 규칙대로 수정했습니다.', 'success');
          // [2026.09 버그수정] 사건명이 바뀌었는데 이 화면의 사건 선택 드롭다운·작업관리 목록
          // 캐시는 그대로라 옛 이름이 계속 보였다 — 즉시 새로고침한다.
          docsGetAllCases_(true);
          if (typeof loadWorkCases === 'function') loadWorkCases();
        }).catch(function(err){
          body.innerHTML = '<div class="taxcalc-error">적용 중 오류: ' + (err && err.message ? err.message : err) + '</div>';
        });
      });
    }

    callGas('work_audit_case_folder_names', {}).then(function(res){
      if (res.success === false){ overlay.querySelector('#docsFnaBody').innerHTML = '<div class="taxcalc-error">' + (res.message || '조회 실패') + '</div>'; return; }
      renderList(res.items || []);
    }).catch(function(err){
      overlay.querySelector('#docsFnaBody').innerHTML = '<div class="taxcalc-error">조회 중 오류: ' + (err && err.message ? err.message : err) + '</div>';
    });
  }

  // [2026.09] 법령조회·세액계산에는 상단에 "사건연결" 드롭다운이 있어서 사건을 바로 골라
  // 들어갈 수 있는데, 증빙확보(왼쪽 메뉴로 바로 들어오면)는 그게 없어서 폴더를 일일이
  // 찾아 들어가야 했다 — 지적받아 추가. docsGetAllCases_()로 이미 있는 사건 목록 캐시를
  // 재사용하고, 고르면 chRenderEvidenceSummary_의 "증빙확보에서 열기"와 같은 방식으로
  // 그 사건 폴더로 바로 이동한다.
  function docsInitCaseSelect_(){
    var sel = document.getElementById('docsCaseSelect');
    if (!sel || sel.dataset.inited) return; // initDocs()가 여러 번 불려도 리스너가 중복 등록되지 않게
    sel.dataset.inited = '1';
    docsGetAllCases_().then(function(cases){
      sel.innerHTML = buildCaseOptionsHtml_(cases, { placeholder: '사건 선택' });
    });
    sel.addEventListener('change', function(){
      var caseId = sel.value;
      if (!caseId) return;
      docsGetAllCases_().then(function(cases){
        var c = cases.filter(function(x){ return x.id === caseId; })[0];
        if (!c) return;
        // [2026.09 버그수정] 폴더ID(한 번 만들어지면 안 바뀜)로 직접 연다 — 사건명(=폴더명)만
        // 보고 경로를 다시 만들면, 나중에 고객명 등이 바뀌어 사건명이 달라진 사건은 실제
        // Drive 폴더(이름은 그대로)를 못 찾는다. 폴더ID가 없는 옛날 사건만 이름으로 대체한다.
        if (c.폴더ID) { docsNavigateById_(c.폴더ID); return; }
        getCustomerRootPath_().then(function(basePath){
          docsNavigate(basePath.concat([String(c.사건명 || '').trim()]));
        });
      });
    });
    document.getElementById('docsBackToCaseBtn').addEventListener('click', function(){
      if (typeof goToView_ === 'function') goToView_('casehandling');
      if (docsSelectedCaseId_ && typeof goToCaseHandling_ === 'function') goToCaseHandling_(docsSelectedCaseId_);
    });
  }

  // [2026.09] "↩ 처리개요" 버튼이 지금 보고 있는 폴더에 맞는 사건을 들고 돌아가려면, 폴더를
  // 옮길 때마다 지금 위치가 어느 사건인지 다시 계산해둬야 한다. "보고서"·"제출자료"처럼 사건
  // 폴더 한 단계 안쪽까지 들어가 있어도 찾을 수 있게 부모 폴더도 같이 검사한다.
  // [2026.09 버그수정] 사건명(=폴더명)만으로 매칭하면 담당자가 나중에 고객명·세목 등을 고쳐서
  // 사건명이 바뀌는 순간 이 화면이 조용히 그 사건을 못 찾게 된다. 지금 보고 있는 폴더 바로
  // 그 자체(rel.length===1)라면 listFolder가 돌려준 실제 폴더ID(docsCurrentListing.folderId)를
  // 사건의 폴더ID와 직접 비교해서 이름이 바뀌어도 안 끊기게 한다 — 폴더ID가 없는 옛날 사건만
  // 이름 매칭으로 대체한다.
  function docsSyncSelectedCase_(){
    var sel = document.getElementById('docsCaseSelect');
    getCustomerRootPath_().then(function(basePath){
      var rel = docsPath.slice(basePath.length); // 고객사건 루트 밑으로 몇 단계 들어왔는지
      if (rel.length < 1 || rel.length > 2){ docsSelectedCaseId_ = null; if (sel) sel.value = ''; return; }
      var currentFolderId = (rel.length === 1 && docsCurrentListing) ? docsCurrentListing.folderId : null;
      docsGetAllCases_().then(function(cases){
        var c = currentFolderId
          ? cases.filter(function(x){ return x.폴더ID && x.폴더ID === currentFolderId; })[0]
          : null;
        if (!c) c = cases.filter(function(x){ return String(x.사건명 || '').trim() === rel[0]; })[0];
        docsSelectedCaseId_ = c ? c.id : null;
        if (sel) sel.value = c ? c.id : '';
      });
    });
  }

  function docsNavigate(path){
    docsPath = path;
    docsSelectedIds = {};
    updateDocsSelectionBar_();
    var listEl = document.getElementById('docsList');
    listEl.innerHTML = '<div class="spinner">불러오는 중…</div>';
    callGas('listFolder', { path: docsPath }).then(function(res){
      if (res.error){ listEl.innerHTML = '<div class="log-empty">' + escapeHtml(res.error) + '</div>'; return; }
      docsPath = res.path || docsPath;
      docsCurrentListing = res;
      renderDocsBreadcrumb();
      renderDocsList();
      docsRenderCaseEvidencePanel_();
      docsSyncSelectedCase_();
    }).catch(function(){ listEl.innerHTML = '<div class="log-empty">불러오지 못했습니다.</div>'; });
  }

  // [2026.09 버그수정] docsNavigate(path)는 이름을 절대 루트부터 따라 내려가는 방식이라, 사건
  // 폴더가 만들어진 뒤 고객명 등이 바뀌어 사건명(=폴더명)이 달라지면(실제 Drive 폴더 이름은
  // 그대로인데 DB의 사건명만 새 값으로 바뀜) 새 이름으로는 그 폴더를 절대 못 찾는다. 사건의
  // 폴더ID(c.폴더ID, 한 번 만들어지면 절대 안 바뀜)를 이미 알고 있을 때는 이름과 무관하게
  // 이 함수로 직접 열 것.
  function docsNavigateById_(folderId){
    docsSelectedIds = {};
    updateDocsSelectionBar_();
    var listEl = document.getElementById('docsList');
    listEl.innerHTML = '<div class="spinner">불러오는 중…</div>';
    callGas('listFolder', { folderId: folderId }).then(function(res){
      if (res.error){ listEl.innerHTML = '<div class="log-empty">' + escapeHtml(res.error) + '</div>'; return; }
      docsPath = res.path || [];
      docsCurrentListing = res;
      renderDocsBreadcrumb();
      renderDocsList();
      docsRenderCaseEvidencePanel_();
      docsSyncSelectedCase_();
    }).catch(function(){ listEl.innerHTML = '<div class="log-empty">불러오지 못했습니다.</div>'; });
  }

  // ============================================================
  // [2026.09] "사건처리는 이 사건의 대시보드, 실제 증빙 파일 작업은 증빙관리에서" 원칙에 따라
  // 증빙 3분류(자동확보/추가확보/요청자료) 체크리스트를 여기로 옮겼다. 지금 보고 있는 폴더가
  // work_ 사건이 시작될 때 만든 "고객명 사건명" 폴더와 이름이 일치하면(사건 하나는 항상 이
  // 루트 바로 밑에 폴더 하나이므로 docsPath.length===1일 때만 검사), 그 파일 목록 위에
  // 체크리스트를 같이 보여준다. 자동확보는 세액계산 화면이 쓰는 주소검색/실거래가/공시가격
  // 조회(openAddressSearchModal_ 등)를 그대로 재사용한다.
  // ============================================================
  var docsAllCasesCache_ = null;
  function docsGetAllCases_(force){
    if (docsAllCasesCache_ && !force) return Promise.resolve(docsAllCasesCache_);
    return callGas('work_get_cases', {}).then(function(res){
      docsAllCasesCache_ = res.cases || [];
      return docsAllCasesCache_;
    }).catch(function(){ return docsAllCasesCache_ || []; });
  }

  function docsRenderCaseEvidencePanel_(){
    var panel = document.getElementById('docsCaseEvidencePanel');
    if (!panel) return;
    var pathAtCall = docsPath;
    // [2026.09 버그수정] listFolder는 path를 줄 때 항상 "절대 루트"부터 이름을 하나씩 따라
    // 내려간다(getDefaultFolder()는 path 없이 부를 때만 씀) — 그래서 "고객사건" 폴더가 절대
    // 루트 바로 밑에 있어도, 사건 폴더까지 가려면 반드시 ["고객사건", "사건폴더명"] 처럼
    // 앞에 기본폴더까지의 전체 경로를 붙여야 한다. getCustomerRootPath_()(script.html에 이미
    // 있는 공용 함수)가 그 기본경로를 정확히 알려주므로 하드코딩하지 않고 그걸로 계산한다.
    getCustomerRootPath_().then(function(basePath){
      if (docsPath !== pathAtCall) return; // 그 사이 다른 폴더로 이동했으면 무시
      var isUnderBase = docsPath.length === basePath.length + 1 &&
        basePath.every(function(seg, i){ return docsPath[i] === seg; });
      if (!isUnderBase){ panel.style.display = 'none'; panel.innerHTML = ''; return; }
      var folderName = docsPath[docsPath.length - 1];
      // [2026.09 버그수정] listFolder가 돌려준 이 폴더의 실제 ID(docsCurrentListing.folderId)를
      // 사건의 폴더ID와 먼저 비교한다 — 이름(사건명)만으로 매칭하면 담당자가 나중에 고객명·
      // 세목 등을 고쳐 사건명이 바뀌는 순간 이 패널이 조용히 사라졌다. 폴더ID가 없는 옛날
      // 사건만 이름 매칭으로 대체한다.
      var currentFolderId = docsCurrentListing ? docsCurrentListing.folderId : null;
      // [2026.09 버그수정] "처리개요엔 요청자료 8건인데 증빙확보엔 하나도 없다" — 여기 캐시가
      // docsInitCaseSelect_()가 맨 처음 채운 뒤로는 새로고침 없이 계속 재사용됐다(force 없이
      // 호출), 그래서 사건 생성 이후(예: 필요증빙 템플릿 적용) 캐시가 낡은 채로 남아있었다.
      // 폴더를 옮길 때마다(=이 함수가 불릴 때마다) 매번 새로 받아온다.
      docsGetAllCases_(true).then(function(cases){
        if (docsPath !== pathAtCall) return;
        var c = currentFolderId
          ? cases.filter(function(x){ return x.폴더ID && x.폴더ID === currentFolderId; })[0]
          : null;
        if (!c) c = cases.filter(function(x){ return String(x.사건명 || '').trim() === folderName; })[0];
        if (!c){ panel.style.display = 'none'; panel.innerHTML = ''; return; }
        panel.style.display = 'block';
        docsRenderEvidenceUi_(panel, c);
      });
    });
  }

  // [2026.09] 동시편집 낙관적 잠금 — c.수정일(마지막으로 읽었던 값)을 같이 보내 그 사이 다른
  // 곳에서 먼저 저장됐으면(수정일이 달라졌으면) 덮어쓰지 않고 최신 내용으로 새로고침한다.
  // [2026.09 버그수정] 예전엔 성공 시에도 docsGetAllCases_(true)로 사건 목록을 통째로 다시
  // 받아 docsRenderCaseEvidencePanel_()로 패널 전체(주소검색 입력칸·수동/요청자료 추가란
  // 포함)를 다시 그렸다 — 그 사이 입력해두고 아직 "추가"를 안 누른 라벨·메모 텍스트가
  // 그대로 날아갔다(실사용 감사 지적). c 객체와 캐시를 그 자리에서 갱신하고, 증빙 목록
  // 3칸(자동/추가/요청)만 다시 그린다.
  function docsSaveEvidence_(c, newList){
    return callGas('work_update_case', { id: c.id, 증빙목록: newList, 기대수정일: c.수정일 }).then(function(res){
      if (res.conflict){ showToast(res.message || '충돌이 발생했습니다. 새로고침합니다.', 'warning'); docsGetAllCases_(true).then(function(){ docsRenderCaseEvidencePanel_(); }); return res; }
      if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return res; }
      if (res.case) Object.assign(c, res.case); else c.증빙목록 = newList;
      if (docsAllCasesCache_){
        var cached = docsAllCasesCache_.filter(function(x){ return x.id === c.id; })[0];
        if (cached) Object.assign(cached, c);
      }
      docsRenderEvidenceList_(c, 'auto', 'docsEvListAuto');
      docsRenderEvidenceList_(c, 'manual', 'docsEvListManual');
      docsRenderEvidenceList_(c, 'requested', 'docsEvListRequested');
      if (c.my_report_id){
        callGas('admin_get_case', { report_id: c.my_report_id }).then(function(res2){
          if (res2.success === false) return;
          docsRenderEvidenceList_(c, 'requested', 'docsEvListRequested', (res2.case && res2.case.submission_status) || {});
        }).catch(function(){});
      }
      return res;
    }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); throw err; });
  }

  function docsAddEvidence_(c, entryPartial){
    var entry = Object.assign({ id: 'ev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) }, entryPartial);
    var newList = (c.증빙목록 || []).concat([entry]);
    var saved = docsSaveEvidence_(c, newList);
    if (entryPartial.source === 'requested' && c.my_report_id){
      callGas('admin_add_checklist_item', { report_id: c.my_report_id, item: entryPartial.label }).catch(function(){});
    }
    return saved;
  }

  function docsRenderEvidenceList_(c, source, containerId, submissionStatus){
    var box = document.getElementById(containerId);
    if (!box) return;
    var entries = (c.증빙목록 || []).filter(function(e){ return e.source === source; });
    if (!entries.length){ box.innerHTML = '<div class="log-empty">없습니다.</div>'; return; }
    box.innerHTML = '';
    entries.forEach(function(entry){
      var row = document.createElement('div');
      row.className = 'log-entry';
      var got = entry.status === '확보됨';
      // [2026.09 버그수정] my.netax.kr에서 고객이 이미 올렸는데 여기(증빙목록)엔 반영이
      // 안 돼 "미확보"로 남아있는 경우를 놓치지 않도록 안내를 덧붙인다.
      var sub = (!got && submissionStatus) ? submissionStatus[entry.label || ''] : null;
      row.innerHTML =
        '<div class="log-date" style="color:' + (got ? 'var(--navy)' : 'var(--sub)') + ';">' + escapeHtml(entry.status || '') + '</div>' +
        '<div class="log-text"><b>' + escapeHtml(entry.label || '') + '</b>' +
        (entry.note ? '<br><span style="color:var(--sub); font-size:12.5px;">' + escapeHtml(entry.note) + '</span>' : '') +
        (sub && sub.submitted ? '<br><span style="color:#b8860b; font-size:12.5px; font-weight:600;">📤 고객이 이미 제출함(' + escapeHtml(sub.fileName || '') + (sub.uploadedAt ? ', ' + escapeHtml(String(sub.uploadedAt).slice(0, 10)) : '') + ') — 확인 후 확보완료로 표시하세요</span>' : '') +
        '</div>' +
        (source !== 'auto' ? '<button type="button" class="ghost-btn docsEvToggleBtn" style="padding:3px 8px; font-size:12px;">' + (got ? '미확보로' : '확보완료') + '</button>' : '') +
        (source === 'requested' ? '<button type="button" class="ghost-btn docsEvRenameBtn" style="padding:3px 8px; font-size:12px;">이름변경</button>' : '') +
        '<span class="log-del" title="삭제">✕</span>';
      if (source !== 'auto'){
        row.querySelector('.docsEvToggleBtn').addEventListener('click', function(){
          var nowGot = entry.status !== '확보됨';
          var newList = (c.증빙목록 || []).map(function(e){
            if (e.id !== entry.id) return e;
            return Object.assign({}, e, { status: nowGot ? '확보됨' : '미확보', 확보일: nowGot ? new Date().toISOString().slice(0, 10) : e.확보일 });
          });
          docsSaveEvidence_(c, newList);
          // [2026.09 버그수정] 요청자료를 회계사가 여기서 확보완료/미확보로 바꾸면, 고객이
          // my.netax.kr에서 보는 체크리스트에도 같이 반영한다 — 안 그러면 회계사가 직접
          // 구한 자료도 고객 화면엔 계속 "미제출"로 남아 고객이 괜히 또 챙겨 올릴 수 있다.
          if (source === 'requested' && c.my_report_id && entry.label){
            callGas('admin_set_checklist_status', { report_id: c.my_report_id, item: entry.label, submitted: nowGot }).catch(function(){});
          }
        });
      }
      // [2026.09 버그수정] 요청자료 이름을 오타 등으로 고치고 싶을 때 지금까진 지우고
      // 새로 추가하는 수밖에 없었는데, 그러면 고객이 이미 올린 파일의 제출상태(옛 이름으로
      // 연결됨)와 연결이 끊겨 "이미 제출함" 안내가 조용히 사라졌다 — 제출상태까지 같이
      // 옮겨주는 이름변경을 추가한다.
      if (source === 'requested'){
        row.querySelector('.docsEvRenameBtn').addEventListener('click', function(){
          var newLabel = prompt('새 자료명을 입력하세요.', entry.label || '');
          if (newLabel === null) return;
          newLabel = newLabel.trim();
          if (!newLabel || newLabel === entry.label) return;
          var oldLabel = entry.label;
          var newList = (c.증빙목록 || []).map(function(e){
            return e.id === entry.id ? Object.assign({}, e, { label: newLabel }) : e;
          });
          docsSaveEvidence_(c, newList);
          if (c.my_report_id && oldLabel){
            callGas('admin_rename_checklist_item', { report_id: c.my_report_id, old_item: oldLabel, new_item: newLabel }).catch(function(){});
          }
        });
      }
      row.querySelector('.log-del').addEventListener('click', function(){
        var newList = (c.증빙목록 || []).filter(function(e){ return e.id !== entry.id; });
        docsSaveEvidence_(c, newList);
        // [2026.09 버그수정] 요청자료를 지워도 my.netax.kr 쪽 체크리스트엔 지저분한 옛 항목이
        // 그대로 남아있었다 — 같이 지운다.
        if (source === 'requested' && c.my_report_id && entry.label){
          callGas('admin_remove_checklist_item', { report_id: c.my_report_id, item: entry.label }).catch(function(){});
        }
      });
      box.appendChild(row);
    });
  }

  function docsRenderEvAutoPicked_(c, picked){
    var box = document.getElementById('docsEvAutoPicked');
    if (!box) return;
    var lawdCd = (picked.admCd || '').slice(0, 5);
    box.innerHTML =
      '<div style="background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:8px;">' +
      '<div style="font-size:12.5px; margin-bottom:6px;"><b>' + escapeHtml(picked.roadAddr || picked.jibunAddr || '') + '</b></div>' +
      '<div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:6px;">' +
      '<button type="button" id="docsEvRealPriceBtn" class="ghost-btn" style="font-size:12px;">실거래가 조회(참고)</button>' +
      '</div>' +
      '<div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">' +
      '<select id="docsEvPriceKind" style="width:140px;"><option value="land">개별공시지가(토지)</option><option value="apartment">공동주택가격</option><option value="house">개별주택가격</option></select>' +
      '<input type="text" id="docsEvDong" placeholder="동(선택)" style="width:70px;">' +
      '<input type="text" id="docsEvHo" placeholder="호" style="width:70px;">' +
      '<button type="button" id="docsEvPriceBtn" class="ghost-btn" style="font-size:12px;">공시가격 조회</button>' +
      '</div>' +
      '</div>';

    document.getElementById('docsEvRealPriceBtn').addEventListener('click', function(){
      if (!lawdCd){ showToast('이 주소는 법정동코드를 확인할 수 없습니다.', 'error'); return; }
      if (typeof openRealPriceModal_ !== 'function'){ showToast('실거래가 조회 기능을 불러오지 못했습니다.', 'error'); return; }
      openRealPriceModal_(lawdCd, function(item){
        docsAddEvidence_(c, {
          source: 'auto',
          label: '실거래가: ' + (item.aptNm || '') + ' ' + (item.dong || '') + ' ' + (item.jibun || ''),
          note: (item.area || '') + '㎡ · ' + (item.floor || '') + '층 · ' + (item.dealDate || '') + ' · ' + Number(item.dealAmount || 0).toLocaleString() + '원',
          status: '확보됨', 확보일: new Date().toISOString().slice(0, 10)
        });
      });
    });

    document.getElementById('docsEvPriceBtn').addEventListener('click', function(){
      var priceKind = document.getElementById('docsEvPriceKind').value;
      var dong = document.getElementById('docsEvDong').value.trim();
      var ho = document.getElementById('docsEvHo').value.trim();
      if (!picked.admCd || !picked.lnbrMnnm){ showToast('이 주소는 지번 정보가 부족해 공시가격을 조회할 수 없습니다.', 'error'); return; }
      var san = String(picked.mtYn) === '1' ? '2' : '1';
      var mnnm = ('0000' + picked.lnbrMnnm).slice(-4);
      var slno = ('0000' + (picked.lnbrSlno || '0')).slice(-4);
      var pnu = picked.admCd + san + mnnm + slno;
      callGas('lookupOfficialPrice', { pnu: pnu, priceKind: priceKind, dong: dong, ho: ho }).then(function(data){
        if (data.error){ showToast(data.error, 'error'); return; }
        var kindLabel = priceKind === 'apartment' ? '공동주택가격' : priceKind === 'house' ? '개별주택가격' : '개별공시지가';
        docsAddEvidence_(c, {
          source: 'auto',
          label: kindLabel + ': ' + Number(data.price).toLocaleString() + '원',
          note: (picked.roadAddr || picked.jibunAddr || '') + (dong ? ' ' + dong + '동' : '') + (ho ? ' ' + ho + '호' : '') + ' (기준연도 ' + data.stdrYear + ')',
          status: '확보됨', 확보일: new Date().toISOString().slice(0, 10)
        });
      }).catch(function(err){ showToast('조회 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
    });
  }

  function docsIconFor(mimeType, name){
    if (mimeType === 'application/pdf') return '📕';
    if (mimeType && mimeType.indexOf('image/') === 0) return '🖼';
    if (mimeType && mimeType.indexOf('spreadsheet') !== -1) return '📊';
    if (/\.md$/i.test(name || '')) return '📝';
    return '📄';
  }

  function renderDocsList(){
    var listEl = document.getElementById('docsList');
    var data = docsCurrentListing;
    var folders = data.folders || [], files = data.files || [];
    if (!folders.length && !files.length){ listEl.innerHTML = '<div class="log-empty">빈 폴더입니다.</div>'; return; }
    var html = '';
    folders.forEach(function(f){
      // [2026.09 이식] 폴더도 체크해서 선택바(이름변경·공유·삭제·이동)를 쓸 수 있게 한다
      // (work.netax.kr 참고화면처럼 파일·폴더 구분 없이 전부 체크 가능).
      html += '<div class="docs-row" data-type="folder" data-id="' + escapeHtml(f.id) + '" data-name="' + escapeHtml(f.name) + '">' +
        '<input type="checkbox" class="docsSelectChk" style="margin-right:6px;"' + (docsSelectedIds[f.id] ? ' checked' : '') + '>' +
        '<span class="docs-icon">📁</span><span class="docs-name">' + escapeHtml(f.name) + '</span>' +
        '<span class="docs-kebab" data-act="ctx" title="더보기">⋮</span>' +
        '</div>';
    });
    files.forEach(function(f){
      // [2026.09 이식] 폴더에 이미 있는 파일을 그대로 스캔 도구/PDF관리로 불러오는 길 — PDF는
      // "PDF관리로 열기", 이미지는 "스캔으로 열기" 아이콘을 추가로 보여준다.
      html += '<div class="docs-row" data-type="file" data-id="' + escapeHtml(f.id) + '" data-url="' + escapeHtml(f.url || '') + '" data-name="' + escapeHtml(f.name) + '" data-mime="' + escapeHtml(f.mimeType || '') + '">' +
        '<input type="checkbox" class="docsSelectChk" style="margin-right:6px;"' + (docsSelectedIds[f.id] ? ' checked' : '') + '>' +
        '<span class="docs-icon">' + docsIconFor(f.mimeType, f.name) + '</span><span class="docs-name">' + escapeHtml(f.name) + '</span>' +
        '<span class="docs-meta">' + escapeHtml(f.modifiedDate || '') + (f.sizeBytes ? ' · ' + formatFileSize(f.sizeBytes) : '') + '</span>' +
        '<span class="docs-kebab" data-act="ctx" title="더보기">⋮</span>' +
        '</div>';
    });
    listEl.innerHTML = html;

    // [2026.09 이식] 좌클릭(파일보기/파일관리 선택) vs 좌더블클릭(바로 파일보기)을 구분해야 해서,
    // 단일클릭은 살짝 늦춰(dblclick이 뒤따라오면 취소) 처리한다 — 표준적인 클릭/더블클릭 구분법.
    var docsRowClickTimer_ = null;
    listEl.querySelectorAll('.docs-row').forEach(function(row){
      var chk = row.querySelector('.docsSelectChk');
      if (chk){
        chk.addEventListener('click', function(e){ e.stopPropagation(); });
        chk.addEventListener('change', function(){
          if (chk.checked) docsSelectedIds[row.dataset.id] = true;
          else delete docsSelectedIds[row.dataset.id];
          updateDocsSelectionBar_();
        });
      }
      row.querySelector('.docs-kebab').addEventListener('click', function(e){
        e.stopPropagation();
        var r = e.target.getBoundingClientRect();
        docsShowCtxMenu_(r.left, r.bottom, docsBuildRowCtxItems_(row));
      });
      row.addEventListener('contextmenu', function(e){
        e.preventDefault();
        e.stopPropagation();
        docsShowCtxMenu_(e.clientX, e.clientY, docsBuildRowCtxItems_(row));
      });
      row.addEventListener('click', function(e){
        if (e.target.closest('.docs-kebab') || e.target.classList.contains('docsSelectChk')) return;
        if (row.dataset.type === 'folder'){
          docsNavigate(docsPath.concat([row.dataset.name]));
          return;
        }
        // 파일: PDF·이미지는 "파일보기/파일관리" 중 고르게 하고, 그 외 형식은 곧바로 파일보기를
        // 연다(엑셀·텍스트류는 docsOpenFileViewer_ 안에서 형식에 맞게 알아서 표시해준다).
        if (!docsManageKind_(row.dataset.mime)){
          var fo = docsFileObjFromRow_(row);
          if (fo) docsOpenFileViewer_(fo);
          return;
        }
        if (docsRowClickTimer_){ clearTimeout(docsRowClickTimer_); docsRowClickTimer_ = null; return; }
        var cx = e.clientX, cy = e.clientY;
        docsRowClickTimer_ = setTimeout(function(){
          docsRowClickTimer_ = null;
          docsShowViewChoice_(cx, cy, row);
        }, 240);
      });
      row.addEventListener('dblclick', function(e){
        if (row.dataset.type === 'folder') return; // 폴더는 원래 클릭 한 번으로 들어가짐
        if (docsRowClickTimer_){ clearTimeout(docsRowClickTimer_); docsRowClickTimer_ = null; }
        var fo2 = docsFileObjFromRow_(row);
        if (fo2) docsOpenFileViewer_(fo2);
      });
    });
  }

  // ============================================================
  // [2026.09 이식] work.netax.kr explorer.js의 우클릭 메뉴·검색·휴지통·이동 —
  // "탐색기가 너무 단순해서 실제 업무를 못 하겠다"는 지적에 따라 추가.
  // ============================================================

  function docsManageKind_(mime){
    if (mime === 'application/pdf') return 'pdf';
    if (mime && mime.indexOf('image/') === 0) return 'image';
    return null;
  }

  // ============================================================
  // [2026.09 이식] 파일보기 — "md·이미지·pdf·html만 다룬다"는 전제를 버리고, 지원 가능한
  // 형식은 최대한 앱 안에서 바로 보여준다:
  //   - 엑셀·CSV → 표로 바로 렌더링(work.netax.kr excel-viewer.html의 SheetJS 방식 이식)
  //   - 텍스트류(md·txt·json·csv 아닌 것들·html 소스 등) → 메모장처럼 원문 그대로 표시
  //   - 이미지·PDF → 기존처럼 새 탭(구글드라이브 자체 뷰어가 이미 훌륭함)
  //   - 한글(HWP) → 구글이 아예 못 열므로, 다운로드 + 한컴독스 안내로 대체
  //   - 그 외(워드·파워포인트 등) → 구글드라이브 자체 미리보기(새 탭)로 대체
  // ============================================================
  var DOCS_EXCEL_EXT_RE_ = /\.(xlsx|xls|csv)$/i;
  var DOCS_TEXT_EXT_RE_ = /\.(md|txt|json|log|html?|css|js|xml|csv\.txt|ya?ml|ini|conf)$/i;
  var DOCS_HWP_EXT_RE_ = /\.(hwp|hwpx)$/i;
  function docsViewKind_(f){
    var name = (f.name || '').toLowerCase();
    if (f.mimeType === 'application/pdf') return 'pdf';
    if (f.mimeType && f.mimeType.indexOf('image/') === 0) return 'image';
    if (DOCS_HWP_EXT_RE_.test(name) || (f.mimeType || '').indexOf('hwp') !== -1) return 'hwp';
    if (DOCS_EXCEL_EXT_RE_.test(name) || f.mimeType === 'application/vnd.ms-excel' ||
        f.mimeType === 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' ||
        f.mimeType === MimeTypeGoogleSheets_) return 'excel';
    if (DOCS_TEXT_EXT_RE_.test(name) || (f.mimeType || '').indexOf('text/') === 0) return 'text';
    return 'other'; // 워드·파워포인트 등 — 드라이브 자체 미리보기로 대체
  }
  var MimeTypeGoogleSheets_ = 'application/vnd.google-apps.spreadsheet';

  function docsOpenFileViewer_(f){
    var kind = docsViewKind_(f);
    if (kind === 'image' || kind === 'pdf'){
      if (f.url) window.open(f.url, '_blank');
      return;
    }
    var overlay = document.getElementById('docsViewerOverlay');
    var titleEl = document.getElementById('docsViewerTitle');
    var bodyEl = document.getElementById('docsViewerBody');
    var toolbarEl = document.getElementById('docsViewerToolbar');
    var sheetSelect = document.getElementById('docsViewerSheetSelect');
    titleEl.textContent = '👁 ' + f.name;
    toolbarEl.style.display = 'none';
    sheetSelect.style.display = 'none';
    sheetSelect.innerHTML = '';
    document.getElementById('docsTextEditBar').style.display = 'none';
    document.getElementById('btnDocsTextSave').style.display = 'none';
    document.getElementById('btnDocsTextCancel').style.display = 'none';
    document.getElementById('btnDocsTextEdit').style.display = '';
    document.getElementById('docsTextSaveStatus').textContent = '';
    bodyEl.innerHTML = '<div class="spinner">불러오는 중…</div>';
    overlay.style.display = 'flex';

    if (kind === 'hwp'){
      bodyEl.innerHTML = '<div class="docs-viewer-fallback">' +
        '한글(HWP) 파일은 구글이 직접 미리보기를 지원하지 않습니다.<br><br>' +
        (f.url ? '<a href="' + escapeHtml(f.url) + '" target="_blank" class="save-btn" style="text-decoration:none; display:inline-block; margin:4px;">⬇ 다운로드</a>' : '') +
        '<a href="https://www.hancomdocs.com/" target="_blank" class="ghost-btn" style="text-decoration:none; display:inline-block; margin:4px;">🔗 한컴독스에서 열기</a>' +
        '<div style="font-size:11.5px; margin-top:8px;">한컴독스는 새 탭에서 열리며, 다운로드한 파일을 직접 올려서 봐야 합니다.</div>' +
        '</div>';
      return;
    }

    if (kind === 'excel'){
      if (typeof XLSX === 'undefined'){
        bodyEl.innerHTML = '<div class="docs-viewer-fallback">엑셀 처리 라이브러리를 불러오지 못했습니다. ' +
          (f.url ? '<a href="' + escapeHtml(f.url) + '" target="_blank">새 탭에서 열기</a>' : '') + '</div>';
        return;
      }
      callGas('readFileBinary', { fileId: f.id }).then(function(res){
        if (res.error){ bodyEl.innerHTML = '<div class="docs-viewer-fallback">' + escapeHtml(res.error) + '</div>'; return; }
        if (!res.base64){ bodyEl.innerHTML = '<div class="docs-viewer-fallback">파일 내용을 받지 못했습니다.</div>'; return; }
        try {
          var binary = atob(res.base64);
          var bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          var wb = XLSX.read(bytes, { type: 'array' });
          function renderSheet(name){
            var ws = wb.Sheets[name];
            if (!ws){ bodyEl.innerHTML = '<div class="docs-viewer-fallback">시트를 찾을 수 없습니다.</div>'; return; }
            // [2026.09 버그수정] sheet_to_html 기본값은 <title>SheetJS Table Export</title>가 든
            // 완전한 HTML 문서 문자열을 돌려줘서, innerHTML로 넣으면 이 앱 탭의 제목이 바뀌어버렸다
            // — header/footer를 비워서 순수 <table> 조각만 받는다.
            bodyEl.innerHTML = XLSX.utils.sheet_to_html(ws, { header: '', footer: '' });
          }
          wb.SheetNames.forEach(function(name){
            var opt = document.createElement('option');
            opt.value = name; opt.textContent = name;
            sheetSelect.appendChild(opt);
          });
          if (wb.SheetNames.length > 1){
            sheetSelect.style.display = '';
            toolbarEl.style.display = 'flex';
            sheetSelect.onchange = function(){ renderSheet(sheetSelect.value); };
          } else {
            toolbarEl.style.display = 'flex';
          }
          renderSheet(wb.SheetNames[0]);
        } catch (err) {
          bodyEl.innerHTML = '<div class="docs-viewer-fallback">엑셀 파일을 여는 데 실패했습니다: ' + escapeHtml(err.message || String(err)) + '</div>';
        }
      });
      return;
    }

    if (kind === 'text'){
      callGas('readFile', { fileId: f.id }).then(function(res){
        if (res.error){ bodyEl.innerHTML = '<div class="docs-viewer-fallback">' + escapeHtml(res.error) + '</div>'; return; }
        if (res.kind === 'binary' || res.base64){
          bodyEl.innerHTML = '<div class="docs-viewer-fallback">이 파일은 텍스트로 표시할 수 없습니다. ' +
            (f.url ? '<a href="' + escapeHtml(f.url) + '" target="_blank">새 탭에서 열기</a>' : '') + '</div>';
          return;
        }
        var originalContent = res.content || '';
        bodyEl.innerHTML = '<pre class="docs-text-view">' + escapeHtml(originalContent || '(내용 없음)') + '</pre>';
        document.getElementById('docsTextEditBar').style.display = 'flex';

        var editBtn = document.getElementById('btnDocsTextEdit');
        var saveBtn = document.getElementById('btnDocsTextSave');
        var cancelBtn = document.getElementById('btnDocsTextCancel');
        var statusEl = document.getElementById('docsTextSaveStatus');

        function enterEditMode(){
          bodyEl.innerHTML = '<textarea id="docsTextEditArea" style="width:100%; box-sizing:border-box; min-height:50vh; font-family:Consolas,monospace; font-size:12.5px; line-height:1.6; padding:8px; border:1px solid var(--line); border-radius:8px;"></textarea>';
          document.getElementById('docsTextEditArea').value = originalContent;
          editBtn.style.display = 'none';
          saveBtn.style.display = '';
          cancelBtn.style.display = '';
          statusEl.textContent = '';
        }
        function exitViewMode(content){
          bodyEl.innerHTML = '<pre class="docs-text-view">' + escapeHtml(content || '(내용 없음)') + '</pre>';
          editBtn.style.display = '';
          saveBtn.style.display = 'none';
          cancelBtn.style.display = 'none';
        }
        editBtn.onclick = enterEditMode;
        cancelBtn.onclick = function(){ exitViewMode(originalContent); statusEl.textContent = ''; };
        saveBtn.onclick = function(){
          var newContent = document.getElementById('docsTextEditArea').value;
          statusEl.textContent = '저장 중…';
          saveBtn.disabled = true;
          callGas('uploadFile', { fileId: f.id, base64Data: utf8ToBase64(newContent) }).then(function(res2){
            saveBtn.disabled = false;
            if (res2.error){ statusEl.textContent = ''; toast('저장 실패: ' + res2.error); return; }
            originalContent = newContent;
            exitViewMode(originalContent);
            statusEl.textContent = '저장됨 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
          }).catch(function(err){
            saveBtn.disabled = false;
            statusEl.textContent = '';
            toast('저장 중 오류: ' + (err && err.message ? err.message : err));
          });
        };
      });
      return;
    }

    // kind === 'other' (워드·파워포인트 등) — 구글드라이브 자체 미리보기로 대체.
    overlay.style.display = 'none';
    if (f.url) window.open(f.url, '_blank');
    else toast('이 파일은 미리보기 링크가 없습니다.', 'warning');
  }
  document.getElementById('btnCloseDocsViewer').addEventListener('click', function(){
    document.getElementById('docsViewerOverlay').style.display = 'none';
  });

  // ---- 공용 컨텍스트 메뉴 ----
  var docsCtxMenuEl_ = document.getElementById('docsCtxMenu');
  var docsViewChoiceEl_ = document.getElementById('docsViewChoice');
  function docsHideCtxMenu_(){ docsCtxMenuEl_.style.display = 'none'; docsViewChoiceEl_.style.display = 'none'; }
  document.addEventListener('click', docsHideCtxMenu_);
  document.addEventListener('scroll', docsHideCtxMenu_, true);
  window.addEventListener('keydown', function(e){ if (e.key === 'Escape') docsHideCtxMenu_(); });

  function docsPositionFloating_(el, x, y){
    el.style.display = 'block';
    // 화면 오른쪽/아래로 넘치면 반대쪽으로 붙인다.
    var vw = window.innerWidth, vh = window.innerHeight;
    var w = el.offsetWidth || 160, h = el.offsetHeight || 120;
    el.style.left = Math.min(x, vw - w - 8) + 'px';
    el.style.top = Math.min(y, vh - h - 8) + 'px';
  }

  function docsShowCtxMenu_(x, y, items){
    docsCtxMenuEl_.innerHTML = items.map(function(it, i){
      if (it.sep) return '<div class="docs-ctx-sep"></div>';
      return '<div class="docs-ctx-menu-item' + (it.danger ? ' danger' : '') + '" data-i="' + i + '">' + escapeHtml(it.label) + '</div>';
    }).join('');
    docsCtxMenuEl_.querySelectorAll('.docs-ctx-menu-item').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        docsHideCtxMenu_();
        var it = items[Number(el.dataset.i)];
        if (it && it.onClick) it.onClick();
      });
    });
    docsPositionFloating_(docsCtxMenuEl_, x, y);
  }

  // 파일이 지금 목록(docsCurrentListing.files)에 있으면 그 원본 객체를 찾아준다 — 파일보기 등이
  // url뿐 아니라 id·mimeType 등 전체 정보가 필요해서 row의 data-* 대신 이걸로 통일해 쓴다.
  function docsFileObjFromRow_(row){
    return (docsCurrentListing.files || []).filter(function(x){ return x.id === row.dataset.id; })[0] || null;
  }

  // 파일(PDF·이미지) 좌클릭 시 "파일보기/파일관리" 선택 팝업.
  function docsShowViewChoice_(x, y, row){
    var kind = docsManageKind_(row.dataset.mime);
    var manageLabel = kind === 'pdf' ? '📑 파일관리(PDF관리로 열기)' : '📷 파일관리(스캔으로 열기)';
    var items = [
      { label: '👁 파일보기', onClick: function(){ var fo = docsFileObjFromRow_(row); if (fo) docsOpenFileViewer_(fo); } },
      { label: manageLabel, onClick: function(){
        var fileObj = docsFileObjFromRow_(row);
        if (!fileObj) return;
        if (kind === 'pdf') openExistingFileInPdfManager(fileObj);
        else openExistingFileInScan(fileObj);
      } }
    ];
    docsViewChoiceEl_.innerHTML = items.map(function(it, i){
      return '<div class="docs-ctx-menu-item" data-i="' + i + '">' + escapeHtml(it.label) + '</div>';
    }).join('');
    docsViewChoiceEl_.querySelectorAll('.docs-ctx-menu-item').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        docsHideCtxMenu_();
        items[Number(el.dataset.i)].onClick();
      });
    });
    docsPositionFloating_(docsViewChoiceEl_, x, y);
  }

  // 파일·폴더 행의 우클릭/⋮ 메뉴 — 이름변경·공유·이동·삭제(+PDF·이미지는 관리도구 바로가기).
  function docsBuildRowCtxItems_(row){
    var id = row.dataset.id, type = row.dataset.type;
    var label = row.dataset.name || row.querySelector('.docs-name').textContent;
    var items = [];
    var kind = type === 'file' ? docsManageKind_(row.dataset.mime) : null;
    if (kind === 'pdf') items.push({ label: '📑 PDF관리로 열기', onClick: function(){
      var fileObj = (docsCurrentListing.files || []).filter(function(x){ return x.id === id; })[0];
      if (fileObj) openExistingFileInPdfManager(fileObj);
    } });
    if (kind === 'image') items.push({ label: '📷 스캔으로 열기', onClick: function(){
      var fileObj = (docsCurrentListing.files || []).filter(function(x){ return x.id === id; })[0];
      if (fileObj) openExistingFileInScan(fileObj);
    } });
    if (items.length) items.push({ sep: true });
    items.push({ label: '✏️ 이름변경', onClick: function(){
      var newName = prompt('새 이름을 입력하세요:', label);
      if (!newName || !newName.trim() || newName.trim() === label) return;
      callGas('renameItem', { id: id, type: type, newName: newName.trim() }).then(function(res){
        if (res.error){ toast('이름변경 실패: ' + res.error); return; }
        toast('이름을 변경했습니다.');
        docsNavigate(docsPath);
      });
    } });
    items.push({ label: '🔗 공유', onClick: function(){ docsShareItem_(id, type, label); } });
    items.push({ label: '📂 이동', onClick: function(){ docsOpenMoveModal_(id, type, label); } });
    items.push({ sep: true });
    items.push({ label: '🗑 삭제', danger: true, onClick: function(){
      if (!confirm('"' + label + '"을(를) 삭제할까요? (휴지통으로 이동)')) return;
      callGas('deleteItem', { id: id, type: type }).then(function(res){
        if (res.error){ toast('삭제 실패: ' + res.error); return; }
        toast('삭제했습니다.');
        docsNavigate(docsPath);
      });
    } });
    return items;
  }

  // 빈 목록 공간(또는 + 버튼) 우클릭 메뉴.
  function docsBuildEmptyCtxItems_(){
    return [
      { label: '📁 새 폴더', onClick: function(){ document.getElementById('docsBtnNewFolder').click(); } },
      { label: '📝 새 문서', onClick: docsCreateBlankDoc_ },
      { label: '📤 파일 업로드', onClick: function(){ document.getElementById('docsBtnUpload').click(); } },
      { sep: true },
      { label: '📋 경과지', onClick: docsOpenLogModal_ },
      { label: '🧮 계산기', onClick: docsOpenCalcModal_ },
      { label: '🗺 관계도', onClick: docsOpenDiagramModal_ },
      { sep: true },
      { label: '🔍 파일 검색', onClick: docsOpenSearchModal_ },
      { label: '🔗 제출현황', onClick: function(){
        if (!docsSelectedCaseId_){ toast('먼저 사건을 선택해주세요(위 "사건" 드롭다운).', 'warning'); return; }
        if (typeof goToView_ === 'function') goToView_('casehandling');
        if (typeof goToCaseHandling_ === 'function') goToCaseHandling_(docsSelectedCaseId_);
      } },
      { label: '🗑 휴지통', onClick: docsOpenTrashModal_ },
      { sep: true },
      { label: '🔄 새로고침', onClick: function(){ docsNavigate(docsPath); } }
    ];
  }
  document.getElementById('docsList').addEventListener('contextmenu', function(e){
    if (e.target.closest('.docs-row')) return; // 행 자체는 위에서 따로 처리됨
    e.preventDefault();
    docsShowCtxMenu_(e.clientX, e.clientY, docsBuildEmptyCtxItems_());
  });
  document.getElementById('docsFab').addEventListener('click', function(e){
    e.stopPropagation();
    var r = e.target.getBoundingClientRect();
    docsShowCtxMenu_(r.left - 150, r.top - 8, docsBuildEmptyCtxItems_());
  });

  // ---- 새 문서 ----
  function docsCreateBlankDoc_(){
    var name = prompt('새 문서 이름을 입력하세요:', '새 문서');
    if (!name || !name.trim()) return;
    callGas('createBlankDoc', { folderId: docsCurrentListing.folderId, name: name.trim() }).then(function(res){
      if (res.error){ toast('문서 만들기 실패: ' + res.error); return; }
      toast('문서를 만들었습니다.');
      docsNavigate(docsPath);
      if (res.url) window.open(res.url, '_blank');
    });
  }

  // ---- 공유 ----
  function docsShareItem_(id, type, label){
    callGas('shareItem', { id: id, type: type }).then(function(res){
      if (res.error){ toast('공유 실패: ' + res.error); return; }
      var url = res.url;
      var copied = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url);
          copied = true;
        }
      } catch (e) {}
      if (copied) toast('"' + label + '" 공유 링크를 복사했습니다(링크가 있는 모든 사용자·보기 가능).');
      else prompt('아래 링크가 복사되도록 공유설정을 바꿨습니다(직접 복사해주세요):', url);
    });
  }

  // ---- 이동 ---- (여러 개를 한번에 이동할 수 있게 대상을 배열로 들고 있는다 — 선택바에서
  // 여러 항목을 체크하고 "이동"을 눌러도, 우클릭 메뉴에서 항목 하나만 이동해도 같은 코드를 쓴다.)
  var docsMoveTargets_ = []; // [{id, type}]
  var docsMoveBrowsePath_ = [];
  var docsMoveBrowseFolderId_ = null;
  function docsOpenMoveModal_(id, type, label){
    docsOpenMoveModalMulti_([{ id: id, type: type }], label);
  }
  function docsOpenMoveModalMulti_(targets, label){
    docsMoveTargets_ = targets;
    docsMoveBrowsePath_ = docsPath.slice(); // 지금 보고 있는 폴더에서 시작
    document.getElementById('docsMoveItemName').textContent = label;
    document.getElementById('docsMoveOverlay').style.display = 'flex';
    docsMoveNavigate_(docsMoveBrowsePath_);
  }
  function docsMoveNavigate_(path){
    docsMoveBrowsePath_ = path;
    var listEl = document.getElementById('docsMoveList');
    listEl.innerHTML = '<div class="spinner">불러오는 중…</div>';
    callGas('listFolder', { path: path }).then(function(res){
      if (res.error){ listEl.innerHTML = '<div class="log-empty">' + escapeHtml(res.error) + '</div>'; return; }
      docsMoveBrowsePath_ = res.path || path;
      docsMoveBrowseFolderId_ = res.folderId;
      var bc = document.getElementById('docsMoveBreadcrumb');
      bc.innerHTML = docsMoveBrowsePath_.map(function(seg, i){
        return '<span data-i="' + i + '">' + escapeHtml(seg) + '</span>';
      }).join(' / ');
      bc.querySelectorAll('span').forEach(function(el){
        el.addEventListener('click', function(){ docsMoveNavigate_(docsMoveBrowsePath_.slice(0, Number(el.dataset.i) + 1)); });
      });
      var folders = res.folders || [];
      if (!folders.length){ listEl.innerHTML = '<div class="log-empty">하위 폴더가 없습니다.</div>'; return; }
      listEl.innerHTML = folders.map(function(f){
        return '<div class="docs-row" data-name="' + escapeHtml(f.name) + '"><span class="docs-icon">📁</span><span class="docs-name">' + escapeHtml(f.name) + '</span></div>';
      }).join('');
      listEl.querySelectorAll('.docs-row').forEach(function(row){
        row.addEventListener('click', function(){ docsMoveNavigate_(docsMoveBrowsePath_.concat([row.dataset.name])); });
      });
    });
  }
  document.getElementById('btnCloseDocsMove').addEventListener('click', function(){
    document.getElementById('docsMoveOverlay').style.display = 'none';
  });
  document.getElementById('docsMoveConfirmBtn').addEventListener('click', function(){
    if (!docsMoveBrowseFolderId_){ toast('이동할 위치를 확인하지 못했습니다.', 'error'); return; }
    var blocked = docsMoveTargets_.some(function(t){ return t.type === 'folder' && t.id === docsMoveBrowseFolderId_; });
    if (blocked){ toast('같은 폴더로는 이동할 수 없습니다.', 'warning'); return; }
    Promise.all(docsMoveTargets_.map(function(t){
      return callGas('moveItem', { id: t.id, type: t.type, destFolderId: docsMoveBrowseFolderId_ });
    })).then(function(results){
      var failed = results.filter(function(r){ return r.error; });
      if (failed.length) toast('일부 이동 실패(' + failed.length + '건): ' + failed[0].error, 'error');
      else toast('이동했습니다.');
      docsSelectedIds = {};
      document.getElementById('docsMoveOverlay').style.display = 'none';
      docsNavigate(docsPath);
    });
  });

  // ---- 파일 검색 ----
  function docsOpenSearchModal_(){
    document.getElementById('docsSearchOverlay').style.display = 'flex';
    document.getElementById('docsSearchResults').innerHTML = '';
    var input = document.getElementById('docsSearchInput');
    input.value = '';
    setTimeout(function(){ input.focus(); }, 50);
  }
  document.getElementById('btnCloseDocsSearch').addEventListener('click', function(){
    document.getElementById('docsSearchOverlay').style.display = 'none';
  });
  function docsRunSearch_(){
    var q = document.getElementById('docsSearchInput').value.trim();
    if (!q) return;
    var resultsEl = document.getElementById('docsSearchResults');
    resultsEl.innerHTML = '<div class="spinner">검색 중…</div>';
    callGas('searchFiles', { query: q }).then(function(res){
      if (res.error){ resultsEl.innerHTML = '<div class="log-empty">' + escapeHtml(res.error) + '</div>'; return; }
      var items = res.items || [];
      if (!items.length){ resultsEl.innerHTML = '<div class="log-empty">검색 결과가 없습니다.</div>'; return; }
      resultsEl.innerHTML = items.map(function(it, i){
        var icon = it.type === 'folder' ? '📁' : docsIconFor(it.mimeType, it.name);
        return '<div class="docs-search-result" data-i="' + i + '">' +
          '<div>' + icon + ' ' + escapeHtml(it.name) + '</div>' +
          '<div class="p">' + escapeHtml((it.path || []).join(' / ') || '(최상위)') + '</div>' +
          '</div>';
      }).join('');
      resultsEl.querySelectorAll('.docs-search-result').forEach(function(el){
        el.addEventListener('click', function(){
          var it = items[Number(el.dataset.i)];
          document.getElementById('docsSearchOverlay').style.display = 'none';
          // 파일이면 부모 폴더로, 폴더면 그 폴더 자체로 이동한다(검색결과엔 파일 url이 없어서
          // 미리보기 대신 "어디 있는지 찾아가서 직접 열기"로 안내).
          var targetPath = it.type === 'folder' ? (it.path || []).concat([it.name]) : (it.path || []);
          docsNavigate(targetPath);
        });
      });
    });
  }
  document.getElementById('docsSearchRunBtn').addEventListener('click', docsRunSearch_);
  document.getElementById('docsSearchInput').addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.keyCode === 13) docsRunSearch_(); });

  // ---- 휴지통 ----
  function docsOpenTrashModal_(){
    document.getElementById('docsTrashFolderName').textContent = docsPath.length ? docsPath[docsPath.length - 1] : '고객사건';
    document.getElementById('docsTrashOverlay').style.display = 'flex';
    docsLoadTrash_();
  }
  document.getElementById('btnCloseDocsTrash').addEventListener('click', function(){
    document.getElementById('docsTrashOverlay').style.display = 'none';
  });
  function docsLoadTrash_(){
    var listEl = document.getElementById('docsTrashList');
    listEl.innerHTML = '<div class="spinner">불러오는 중…</div>';
    callGas('listTrash', { folderId: docsCurrentListing.folderId }).then(function(res){
      if (res.error){ listEl.innerHTML = '<div class="log-empty">' + escapeHtml(res.error) + '</div>'; return; }
      var items = res.items || [];
      if (!items.length){ listEl.innerHTML = '<div class="log-empty">이 폴더에는 삭제된 항목이 없습니다.</div>'; return; }
      listEl.innerHTML = items.map(function(it, i){
        return '<div class="docs-trash-row" data-i="' + i + '">' +
          '<span class="docs-icon">' + (it.type === 'folder' ? '📁' : '📄') + '</span>' +
          '<span class="docs-name" style="flex:1;">' + escapeHtml(it.name) + '</span>' +
          '<button type="button" class="ghost-btn" data-act="restore" style="font-size:12px;">↩ 복원</button>' +
          '</div>';
      }).join('');
      listEl.querySelectorAll('[data-act="restore"]').forEach(function(btn, idx){
        btn.addEventListener('click', function(){
          var it = items[idx];
          callGas('restoreItem', { id: it.id, type: it.type }).then(function(res2){
            if (res2.error){ toast('복원 실패: ' + res2.error); return; }
            toast('"' + it.name + '"을(를) 복원했습니다.');
            docsLoadTrash_();
            docsNavigate(docsPath);
          });
        });
      });
    });
  }

  // [2026.09] 스캔/PDF관리를 열기 전에, 지금 보고 있는 폴더에서 파일을 하나 또는 여러 개
  // 체크해서 한번에 넘길 수 있게 한다("갤러리에서 불러오기"는 이 기기의 로컬 사진첩을 여는
  // 것이라 지금 보는 Drive 폴더와는 무관함 — 그래서 별도로 이 선택 방식을 추가했다).
  function updateDocsSelectionBar_(){
    var bar = document.getElementById('docsSelectionBar');
    var ids = Object.keys(docsSelectedIds);
    if (!ids.length){ bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    document.getElementById('docsSelectionCount').textContent = ids.length + '개 선택됨';
    // 이름변경은 한 번에 하나에만 의미가 있다.
    document.getElementById('docsBtnRenameSelected').style.display = (ids.length === 1) ? '' : 'none';
  }

  function docsSelectedFileObjs_(){
    var ids = Object.keys(docsSelectedIds);
    var files = (docsCurrentListing && docsCurrentListing.files) || [];
    return ids.map(function(id){ return files.filter(function(f){ return f.id === id; })[0]; }).filter(Boolean);
  }

  // 파일·폴더 구분 없이 선택된 항목을 { id, name, type } 형태로 돌려준다 — 선택바의
  // 이름변경/공유/삭제/이동은 폴더도 대상이 될 수 있어서 docsSelectedFileObjs_(파일 전용)와 별도로 둔다.
  function docsSelectedItemObjs_(){
    var ids = Object.keys(docsSelectedIds);
    var files = (docsCurrentListing && docsCurrentListing.files) || [];
    var folders = (docsCurrentListing && docsCurrentListing.folders) || [];
    return ids.map(function(id){
      var f = files.filter(function(x){ return x.id === id; })[0];
      if (f) return { id: f.id, name: f.name, type: 'file' };

  // ============================================================
  // 스캔 — netax.kr/shared/scan-tool.js(공용 스캔 도구)를 그대로 불러 쓴다. 원근보정·자동인식·
  // "문서 구분" 로직은 my.netax.kr 고객창구의 자료제출함과 완전히 같은 코드를 공유한다
  // (중복 이식이 아님 — 여기서 고치면 고객창구에도 동시에 반영된다).
  // ============================================================
  function docsOpenScanModal_(initialFiles){
    NetaxScan.open({
      targetLabel: docsPath.length ? docsPath.join(' / ') : '고객사건(최상위)',
      allowScreenCapture: true,
      initialFiles: initialFiles || [],
      actions: [
        {
          label: 'PC에 다운로드',
          busyLabel: '만드는 중…',
          handler: async function(docs){
            docs.forEach(function(doc){
              var blob = new Blob([doc.bytes], { type:'application/pdf' });
              var url = URL.createObjectURL(blob);
              var a = document.createElement('a');
              a.href = url; a.download = doc.name + '.pdf';
              a.click();
              URL.revokeObjectURL(url);
            });
            return false; // 계속 스캔할 수도 있으니 모달을 닫지 않는다
          }
        },
        {
          label: '현재 폴더에 저장',
          primary: true,
          busyLabel: '저장 중…',
          handler: async function(docs){
            var summary = docs.length > 1
              ? ('문서 ' + docs.length + '개(' + docs.map(function(d){ return d.name; }).join(', ') + ')를')
              : ('"' + docs[0].name + '"를');
            if (!confirm(summary + ' "고객사건' + (docsPath.length ? ' / ' + docsPath.join(' / ') : '') + '" 폴더에 저장합니다. 맞나요?')) return false;
            var failed = [];
            for (var i = 0; i < docs.length; i++){
              var doc = docs[i];
              var base64 = uint8ToBase64(doc.bytes);
              var name = doc.name + '.pdf';
              var res = await callGas('uploadFile', { path: docsPath, name: name, mimeType: 'application/pdf', base64Data: base64 });
              if (res.error) failed.push(name + '(' + res.error + ')');
            }
            if (failed.length){ toast('일부 저장 실패: ' + failed.join(', ')); return false; }
            toast(docs.length > 1 ? (docs.length + '개 문서를 저장했습니다.') : ('저장했습니다: ' + docs[0].name + '.pdf'));
            docsNavigate(docsPath);
            return true;
          }
        }
      ]
    });
  }

  // ============================================================
  // PDF 관리 — 스캔과 별도 메뉴. 이미 저장된 PDF들을 페이지 단위로 불러와서
  // 합치기·발췌·순서변경·서명·워터마크를 할 수 있다. 스캔 바구니(.scan-tray)와 같은 드래그
  // 재정렬 UI를 그대로 재사용하되, 페이지별 체크박스를 얹어서 "선택한 페이지만 따로 뽑아
  // 저장"이 가능하게 한다. [2026.09 이식] document-tools.js 로직을 그대로 옮겨왔다.
  // ============================================================
  var pdfMgrOverlay = document.getElementById('pdfMgrOverlay');
  var pdfMgrList = document.getElementById('pdfMgrList');
  var pdfMgrFileInput = document.getElementById('pdfMgrFileInput');
  var pdfMgrExtractName = document.getElementById('pdfMgrExtractName');

  var pdfMgrSignatureInput = document.getElementById('pdfMgrSignatureInput');
  var pdfMgrSignatureStatus = document.getElementById('pdfMgrSignatureStatus');
  var pdfMgrSignaturePos = document.getElementById('pdfMgrSignaturePos');

  var pdfMgrEntries = []; // { id, doc(PDFLib 문서객체), pdfjsDoc, sourceName, pageIndex, checked, rotation }
  var pdfMgrIdSeq = 1;
  var pdfMgrSignatureBytes = null; // 도장처럼 찍을 서명 이미지(선택 안 하면 null)

  function openPdfManager(){ pdfMgrOverlay.style.display = 'flex'; }
  function closePdfManager(){ pdfMgrOverlay.style.display = 'none'; }
  document.getElementById('docsBtnPdfManager').addEventListener('click', openPdfManager);
  document.getElementById('btnClosePdfMgr').addEventListener('click', closePdfManager);

  // [2026.09] 탐색목록에서 PDF 파일의 "PDF관리로 열기"를 고르면 여기로 온다. readFileBinary
  // 액션(원본 바이트 그대로 반환)으로 받아와서, 로컬 업로드와 완전히 같은 방식(PDFLib+pdf.js로
  // 파싱해서 페이지 단위로 등록)으로 처리한다.
  async function openExistingFileInPdfManager(file){
    toast(file.name + ' 불러오는 중입니다…');
    try{
      var res = await callGas('readFileBinary', { fileId: file.id });
      if (res.error){ toast('불러오기 실패: ' + res.error); return; }
      var binary = atob(res.base64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

      var doc = await PDFLib.PDFDocument.load(bytes);
      var pdfjsDoc = (typeof pdfjsLib !== 'undefined') ? await pdfjsLib.getDocument({ data: bytes.slice() }).promise : null;
      var sourceName = file.name.replace(/\.pdf$/i, '');
      var pageCount = doc.getPageCount();
      for (var p = 0; p < pageCount; p++){
        pdfMgrEntries.push({ id: pdfMgrIdSeq++, type: 'pdfpage', doc: doc, pdfjsDoc: pdfjsDoc, sourceName: sourceName, pageIndex: p, checked: false, rotation: 0 });
      }
      renderPdfMgrList();
      openPdfManager();
    }catch(err){
      toast(file.name + ' 불러오기 중 오류: ' + (err && err.message ? err.message : err));
    }
  }

  document.getElementById('btnPdfMgrAdd').addEventListener('click', function(){ pdfMgrFileInput.click(); });
  pdfMgrFileInput.addEventListener('change', async function(e){
    var files = Array.from(e.target.files || []);
    pdfMgrFileInput.value = '';
    for (var f = 0; f < files.length; f++){
      var file = files[f];
      try{
        var bytes = new Uint8Array(await file.arrayBuffer());
        var doc = await PDFLib.PDFDocument.load(bytes);
        // pdf.js는 pdf-lib와 별개의 파서라, 렌더링(서명 배치용)을 위해 따로 한 번 더 읽어둔다.
        // 같은 배열을 그대로 넘기면 나중에 detach되는 문제가 있어 복사본을 넘긴다.
        var pdfjsDoc = (typeof pdfjsLib !== 'undefined') ? await pdfjsLib.getDocument({ data: bytes.slice() }).promise : null;
        var sourceName = file.name.replace(/\.pdf$/i, '');
        var pageCount = doc.getPageCount();
        for (var p2 = 0; p2 < pageCount; p2++){
          pdfMgrEntries.push({ id: pdfMgrIdSeq++, type: 'pdfpage', doc: doc, pdfjsDoc: pdfjsDoc, sourceName: sourceName, pageIndex: p2, checked: false, rotation: 0 });
        }
      }catch(err){
        toast(file.name + ' 불러오기 실패: ' + (err && err.message ? err.message : err));
