<div class="view" id="view-workmanage">
  <div class="editor-toolbar">
    <h2 class="tb-title">사건 목록</h2>
    <button type="button" id="btnWorkCaseNew" class="save-btn">+ 새 사건</button>
    <label for="workCaseFilterStatus" class="nx-vlabel">상태</label><select id="workCaseFilterStatus" title="상태로 필터">
      <option value="">전체</option>
      <option value="진행" selected>진행</option>
      <option value="보류">보류</option>
      <option value="완료">완료</option>
    </select>
    <input type="text" id="workCaseSearchInput" class="nx-find" placeholder="사건 찾기" title="의뢰인·납세자·완료일로 찾기">
  </div>
  <div class="manage-split">
    <div class="manage-split-list"><div id="workCaseList" class="log-list"></div></div>
    <div class="manage-split-detail">
      <div id="workCaseDetail"><div class="explorer-status">목록에서 사건을 고르거나 "+ 새 사건"을 눌러주세요.</div></div>
    </div>
  </div>
</div>
<datalist id="clientNameOptions"></datalist>

<script>
  // ============================================================
  // 작업관리 — work-manage.js 이식본. 기존 앱과 로직은 100% 동일하고,
  // 탐색창/새창 전환 관련 코드만 이 앱의 메뉴 라우팅(showView)에 맞춰 걷어냈다.
  // ============================================================
  var workCaseList = document.getElementById('workCaseList');
  var workCaseDetail = document.getElementById('workCaseDetail');
  var workCaseFilterStatus = document.getElementById('workCaseFilterStatus');
  var workCaseSearchInput = document.getElementById('workCaseSearchInput');

  // [2026-11-14] 세무사님 "목록과 카드가 모두 보이는 것외에 목록만 보이거나 카드만 보이는 3가지가 모두 필요해 보인다. 카드만 보이는 화면에서는 위/아래 또는
  //  이전/이후 버튼으로 카드이동을 할 수 있어야겠지" / "좁은화면에서만 구현하라는 것이 아니다" → 계획서 둘째 판 "권장대로 하라"
  //  목록|카드로 나눈 화면(사건 목록·고객) 공통 도우미 — 보기 셋(☰ 목록만 · ◫ 같이 · ▭ 카드만), 카드만일 때 ◀ 이전 · n / 전체 · 다음 ▶ · ☰ 목록으로(← → 키도).
  //  고른 보기는 이 기기에 넓은 화면·좁은 화면(700px 이하) 따로 기억(처음: 넓으면 같이, 좁으면 목록만). 넘기는 순서 = 지금 목록에 보이는 순서(줄의 data-ms-id).
  //  cfg: key(기억 이름)·viewId·noun(사건/고객)·selectedId()·open(id)(저장 안 한 값 확인 뒤 그 줄을 연다). 돌려주는 것: picked()(카드를 보여야 할 때 — 목록만이면 카드만으로), refresh()(번호 다시)
  //  (고객 화면 clientmanage.html이 이 파일 뒤에 실리므로 두 화면 모두 여기 하나를 쓴다)
  function nxSplitViews_(cfg){
    var view = document.getElementById(cfg.viewId);
    if (!view) return { picked: function(){}, refresh: function(){} };
    var split = view.querySelector('.manage-split');
    var listBox = view.querySelector('.manage-split-list .log-list');
    var detailCol = view.querySelector('.manage-split-detail');
    var bar = view.querySelector('.editor-toolbar');
    var narrowMq = window.matchMedia('(max-width:700px)');
    var noun = cfg.noun || '항목';
    var MODES = [['list', '☰', '목록', '목록만 크게'], ['both', '◫', '같이', '목록과 카드를 같이'], ['card', '▭', '카드', '카드만 크게 — ◀ ▶로 넘기기']];
    var seg = document.createElement('span');
    seg.className = 'ms-modes'; seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', '보기 바꾸기');
    seg.innerHTML = MODES.map(function(m){ return '<button type="button" class="ghost-btn sm" data-ms-mode="' + m[0] + '" title="' + m[3] + '" aria-label="' + m[3] + '">' + m[1] + '<span class="ms-lbl"> ' + m[2] + '</span></button>'; }).join('');
    if (bar) bar.appendChild(seg);
    var nav = document.createElement('div');
    nav.className = 'ms-nav';
    nav.innerHTML = '<button type="button" class="ghost-btn sm" data-ms-go="-1" title="이전 ' + noun + ' (← 키)">◀ 이전</button>' +
      '<span class="ms-pos" aria-live="polite"></span>' +
      '<button type="button" class="ghost-btn sm" data-ms-go="1" title="다음 ' + noun + ' (→ 키)">다음 ▶</button>' +
      '<button type="button" class="ghost-btn sm ms-tolist" data-ms-mode="list" title="목록만 보기로">☰ 목록으로</button>';
    detailCol.insertBefore(nav, detailCol.firstChild);
    var posEl = nav.querySelector('.ms-pos'), prevBtn = nav.querySelector('[data-ms-go="-1"]'), nextBtn = nav.querySelector('[data-ms-go="1"]');
    var mode = 'both';
    function storeKey_(){ return 'nxSplitView_' + cfg.key + (narrowMq.matches ? '_좁은' : '_넓은'); }
    function stored_(){ var v = null; try { v = localStorage.getItem(storeKey_()); } catch (e) {} return (v === 'list' || v === 'both' || v === 'card') ? v : (narrowMq.matches ? 'list' : 'both'); }
    function order_(){ return Array.prototype.map.call(listBox.querySelectorAll('[data-ms-id]'), function(el){ return el.getAttribute('data-ms-id'); }); }
    function refresh(){
      var ids = order_(), cur = String(cfg.selectedId() == null ? '' : cfg.selectedId()), i = ids.indexOf(cur);
      posEl.textContent = ids.length ? ((i >= 0 ? (i + 1) : '–') + ' / ' + ids.length) : '0 / 0';
      prevBtn.disabled = !ids.length || i === 0;
      nextBtn.disabled = !ids.length || i === ids.length - 1;
    }
    function setMode(m, keep){
      mode = m;
      split.classList.toggle('ms-mode-list', m === 'list');
      split.classList.toggle('ms-mode-card', m === 'card');
      seg.querySelectorAll('[data-ms-mode]').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-ms-mode') === m ? 'true' : 'false'); });
      if (keep) { try { localStorage.setItem(storeKey_(), m); } catch (e) {} }
      refresh();
    }
    function go(step){
      var ids = order_(); if (!ids.length) return;
      var i = ids.indexOf(String(cfg.selectedId() == null ? '' : cfg.selectedId()));
      var j = i < 0 ? (step > 0 ? 0 : ids.length - 1) : i + step;
      if (j < 0 || j >= ids.length) return;
      cfg.open(ids[j]);
    }
    view.addEventListener('click', function(e){
      var mb = e.target.closest && e.target.closest('[data-ms-mode]');
      if (mb && view.contains(mb)) { setMode(mb.getAttribute('data-ms-mode'), true); return; }
      var gb = e.target.closest && e.target.closest('[data-ms-go]');
      if (gb && view.contains(gb) && !gb.disabled) go(Number(gb.getAttribute('data-ms-go')));
    });
    var onWidth_ = function(){ setMode(stored_(), false); };
    if (narrowMq.addEventListener) narrowMq.addEventListener('change', onWidth_); else if (narrowMq.addListener) narrowMq.addListener(onWidth_);
    document.addEventListener('keydown', function(e){
      if (mode !== 'card' || !view.classList.contains('active')) return;
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || e.defaultPrevented) return;
      var a = document.activeElement;
      if (a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable)) return; // 글을 쓰거나 고르는 중엔 넘기지 않는다
      if (document.getElementById('nxDialogOverlay')) return;
      var openModal = Array.prototype.some.call(document.querySelectorAll('.modal-overlay'), function(o){ return o.offsetWidth > 0; });
      if (openModal) return;
      e.preventDefault();
      go(e.key === 'ArrowRight' ? 1 : -1);
    });
    setMode(stored_(), false);
    return {
      picked: function(){
        if (mode === 'list') setMode('card', false);
        detailCol.scrollTop = 0; refresh();
        // 같이 보기에서 다른 화면·◀ ▶로 연 줄이 목록 밖에 있으면 목록을 그 줄까지 굴려 보이게(목록 칸 안에서만)
        var cur = String(cfg.selectedId() == null ? '' : cfg.selectedId());
        var row = cur && listBox.querySelector('[data-ms-id="' + cur.replace(/"/g, '') + '"]');
        var box = listBox.closest('.manage-split-list');
        if (row && box && mode === 'both') { var rb = row.getBoundingClientRect(), bb = box.getBoundingClientRect(); if (rb.top < bb.top || rb.bottom > bb.bottom) box.scrollTop += (rb.top - bb.top) - 8; }
      },
      refresh: refresh
    };
  }

  // [2026-11-14 전수조사 고침] 카드의 「저장 안 한 값」 — 칸 이름을 손으로 고르지 않고 카드(container) 안의 모든 입력칸을 본다(사건·고객 공통).
  //  · 칸마다 기준값: clean() 때(그렸을 때·저장했을 때·버리고 넘어갈 때) 그 자리의 값, 나중에 펼쳐진 칸(수금 추가·+ 의뢰인·새 하위업무 등)은 나타난 때의 값.
  //    그래서 코드가 처음 채운 값(기본 날짜 등)은 「고침」이 아니고, 세무사님이 쓰거나 「오늘」처럼 단추로 바꾼 값만 「고침」이다.
  //  · opt.skip: 고치는 즉시 저장되는 칸·화면 이동 칸(빼야 「저장했는데 또 묻는」 헛물음이 없다)
  //  · opt.extra(): 입력칸이 아닌 값(고객 추가 연락처 목록처럼 단추로 넣고 빼는 것)을 글자로 — 카드 「저장」에 실려 가므로 카드 값으로 본다
  //  · opt.pending: 카드 「저장」에 실려 가지 않고 자기 「추가」 단추로만 들어가는 칸 묶음(새 하위업무·세부항목·수금 추가·+ 의뢰인 입력).
  //    카드를 저장해도 이 칸들의 기준값은 그대로 둔다(저장했다고 쓰다 만 글을 「저장됨」으로 치지 않게) — parts()가 둘을 갈라 알려 준다
  function nxDirtyTracker_(container, opt){
    opt = opt || {};
    var base = new WeakMap(), extraBase = null;
    function val_(el){ return (el.type === 'checkbox' || el.type === 'radio') ? String(el.checked) : String(el.value); }
    function controls_(root){ return root.querySelectorAll ? root.querySelectorAll('input, textarea, select') : []; }
    function isPending_(el){ return !!(opt.pending && el.closest && el.closest(opt.pending)); }
    function take_(root, force){
      if (root.nodeType === 1 && /^(INPUT|TEXTAREA|SELECT)$/.test(root.tagName) && (force || !base.has(root))) base.set(root, val_(root));
      Array.prototype.forEach.call(controls_(root), function(el){ if (force || !base.has(el)) base.set(el, val_(el)); });
    }
    if (window.MutationObserver) new MutationObserver(function(muts){
      muts.forEach(function(m){ Array.prototype.forEach.call(m.addedNodes, function(n){ if (n.nodeType === 1) take_(n, false); }); });
    }).observe(container, { childList: true, subtree: true });
    // keepPending: 카드를 저장했을 때 — 「추가」 칸은 기준값을 그대로 둔다
    function clean(keepPending){
      var old = base;
      base = new WeakMap();
      Array.prototype.forEach.call(controls_(container), function(el){ base.set(el, (keepPending && isPending_(el) && old.has(el)) ? old.get(el) : val_(el)); });
      extraBase = opt.extra ? opt.extra() : null;
    }
    function parts(){
      var r = { card: false, pending: false };
      if (opt.extra && extraBase !== null && opt.extra() !== extraBase) r.card = true;
      Array.prototype.forEach.call(controls_(container), function(el){
        if (opt.skip && el.matches && el.matches(opt.skip)) return;
        if (el.type === 'button' || el.type === 'submit' || el.type === 'hidden') return;
        if (base.has(el) && val_(el) !== base.get(el)) { if (isPending_(el)) r.pending = true; else r.card = true; }
      });
      return r;
    }
    function dirty(){ var r = parts(); return r.card || r.pending; }
    clean(false);
    return { clean: clean, dirty: dirty, parts: parts };
  }
  // 카드를 갈아끼우기 전에 묻기(사건·고객 공통) — g: { parts(), clean(), isNew(), save(), noun, pendingNames }.
  //  카드 값을 고쳤으면 「저장하고 넘어가기 / 저장 안 하고 넘어가기 / 머무르기」, 「추가」를 안 누른 칸만 남았으면 「버리고 넘어가기 / 머무르기」.
  //  저장이 막히면(이름 빈칸 등) 넘어가지 않는다. 저장 뒤에도 「추가」 안 누른 칸이 남아 있으면 한 번 더 묻는다
  function nxLeaveGuard_(g, go){
    var r = g.parts();
    if (!r.card && !r.pending) { go(); return; }
    var isNew = g.isNew();
    var msg, buttons;
    if (r.card && !isNew) {
      msg = '이 ' + g.noun + ' 카드에 고치거나 적고 저장하지 않은 내용이 있습니다.' + (r.pending ? '\n(' + g.pendingNames + '에 쓰고 「추가」를 누르지 않은 것도 있습니다 — 저장해도 그것은 들어가지 않습니다.)' : '');
      buttons = [{ label: '저장하고 넘어가기', value: 'save', className: 'save-btn', primary: true }, { label: '저장 안 하고 넘어가기', value: 'drop', className: 'ghost-btn' }, { label: '머무르기', value: null, className: 'ghost-btn', isCancel: true }];
    } else {
      msg = isNew ? '새 ' + g.noun + ' 등록 칸에 적은 내용이 아직 저장되지 않았습니다.' : g.pendingNames + '에 쓰고 「추가」를 누르지 않은 내용이 있습니다.';
      buttons = [{ label: '버리고 넘어가기', value: 'drop', className: 'btn danger' }, { label: '머무르기', value: null, className: 'ghost-btn', isCancel: true, primary: true }];
    }
    nxDialog_({ title: '저장 안 한 내용', message: msg, buttons: buttons, stack: true /* 단추 셋이 좁은 창 폭을 넘지 않게 세로로 */ }).then(function(v){
      if (v === 'drop') { g.clean(false); go(); return; }
      if (v === 'save') {
        g.save();
        var r2 = g.parts();
        if (r2.card) return; // 저장이 막힘 — 그 자리에 둔다
        if (r2.pending) { nxLeaveGuard_(g, go); return; } // 「추가」 안 누른 칸은 따로 한 번 더
        go();
      }
    });
  }
  // 창을 닫거나 새로고침할 때도 — 사건·고객 카드에 저장 안 한 값이 있으면 브라우저가 묻게
  window.addEventListener('beforeunload', function(e){
    var d = (typeof wcHasUnsaved_ === 'function' && wcHasUnsaved_()) || (typeof clHasUnsaved_ === 'function' && clHasUnsaved_());
    if (d) { e.preventDefault(); e.returnValue = ''; }
  });

  // [2026.09] 취득세는 독립된 세목으로 따로 관리하지 않는다 — 매매(양도)·증여·상속 등
  // 기본 3세목 처리 과정에서 특수관계자간 거래 등과 함께 다뤄지는 성격이라, 사건 자체를
  // "취득세 사건"으로 새로 만들지 않는다(세액계산 화면의 취득세 탭은 그대로 있음 — 다른
  // 사건 처리 중 필요하면 거기서 계산만 한다).
  // [2026.09.18 신규] "사업" 세목 추가 — 업무유형은 신고/상담만(다른 세목과 동일), 법정기한은
  // 상담처럼 직접입력(종합소득세·부가세 등 세부 마감규칙이 제각각이라 자동계산 규칙을 안 둠 —
  // WORK_DEADLINE_MONTHS_에 business가 없으면 work_calcDeadline_이 빈 값을 돌려줘 자동으로
  // 직접입력만 가능해진다), 사건개요서·필요증빙 템플릿은 당장 없음(불복과 동일하게 자유텍스트
  // 처리대상으로 충분 — CH_CASE_OVERVIEW_FIELDS_에 business를 안 넣어두면 casehandling.html이
  // 자동으로 그 화면을 보여준다).
  var WORK_SEMOK_LABELS = { transfer: '양도', gift: '증여', inheritance: '상속', objection: '불복', business: '사업' };
  var WORK_STATUS_OPTIONS = ['진행', '보류', '완료'];
  var WORK_SUBTASK_STATUS_OPTIONS = ['대기', '진행', '보류', '완료'];
  // [2026.09.18 신규] "상담을 자문과 상담으로 세분 — 검토서·보고서가 작성되는 사건은 자문,
  // 파일이 작성되지 않아 폴더가 필요 없는 사건은 상담으로." 신고/자문/상담 셋 다 법정신고
  // 유형(신고)만 자동계산 대상이고, 자문·상담은 상담이 원래 그랬듯 직접입력(아래
  // WORK_MANUAL_DEADLINE_TYPES_ 참고) — 자문(검토·의견)도 신고처럼 정해진 법정기한이 있는
  // 게 아니기 때문에 같은 자리에 둔다.
  var WORK_UPTYPE_OPTIONS_ = {
    // [2026-11-12 3차 ④ 세무사님 "모두 권장안대로"] 세무조사는 어느 세목에서든 생긴다(양도 감면 조사·증여 자금출처 조사 등) — 불복 아래에만 숨어 있어 새 사건 때 못 찾았다. 세목마다 고를 수 있게.
    //  가족법인·가업승계는 사업 세목의 업무로(세무사님 여섯 업무 중 자리가 없던 것)
    transfer: ['신고', '자문', '상담', '세무조사'],
    gift: ['신고', '자문', '상담', '세무조사'],
    inheritance: ['신고', '자문', '상담', '세무조사'],
    business: ['신고', '자문', '상담', '가족법인·가업승계', '세무조사'],
    // [2026.09] 세무조사 대리·자금출처소명은 형식상 "불복"(처분에 대한 다툼)은 아니지만,
    // 정식 신고·상담과도 달라서 기존에 해명자료를 넣어둔 것과 같은 자리(objection)에 둔다.
    objection: ['이의신청', '심사청구', '심판청구', '행정소송', '경정청구', '과세적부', '해명자료', '세무조사', '자금출처소명']
  };
  // 자문·상담·해명자료·세무조사·자금출처소명은 법정기한이 없어(과세관청과 협의해 정해지는
  // 처리시한) 자동계산 대신 사용자가 직접 입력한다.
  var WORK_MANUAL_DEADLINE_TYPES_ = ['자문', '상담', '해명자료', '세무조사', '자금출처소명', '가족법인·가업승계'];
  // [2026.09] "기준일"이라는 추상 용어 대신 세목마다 실제로 부르는 이름을 그대로 쓴다.
  // [2026.10.30] 불복: '처분일' → '기한 기산일' — 불복 사건개요서에 처분(고지)일 칸이 따로 생겼고, 기준일은 법정일 계산의 기산일(통지 받은 날·법정신고기한 등)이라
  var WORK_BASE_DATE_LABELS_ = { transfer: '양도일', gift: '증여일', inheritance: '상속일', objection: '기한 기산일' };

  // [2026.10.30 버그수정] 오늘 날짜는 이 컴퓨터(서울) 날짜로 — toISOString은 세계표준시라 0시~9시에 어제 날짜가 됐다
  // (10-30 새벽 등록한 사건의 의뢰일이 모두 10-29로 들어감, 기한 지남 ⏰ 표시도 같은 시간에 하루 늦었음).
  function workTodayStr_(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  function workDeadlineFieldLabel_(upType){
    return WORK_MANUAL_DEADLINE_TYPES_.indexOf(upType) !== -1 ? '처리시한' : '법정일';
  }

  function workDefaultManualDeadline_(requestDateStr){
    var base = requestDateStr ? new Date(requestDateStr + 'T00:00:00') : new Date();
    if (isNaN(base.getTime())) return '';
    base.setDate(base.getDate() + 7);
    var y = base.getFullYear();
    var m = String(base.getMonth() + 1).padStart(2, '0');
    var d = String(base.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }

  var workCases = [];
  var workSelectedCaseId = null;
  var workShowingNewForm = false;
  var wcViews_ = null; // [2026-11-14] 세 가지 보기 도우미(nxSplitViews_) — 이 파일 맨 아래에서 만든다
  var workManageLoaded = false;
  var workMyPortalByReportId = {}; // report_id -> my.netax.kr 케이스(체크리스트·제출현황) — 현황 배지 표시용

  function initWorkManage(){
    if (workManageLoaded) return;
    workManageLoaded = true;
    loadWorkCases();
  }

  // [2026.09.19 정비도구 재정비] 사건관리·고객관리·수금관리·증빙관리에 흩어져 있던 1회성
  // 정비도구를 전부 설정 화면 하나로 모으기로 하면서, 이 화면 툴바에 있던 "🛠 정비도구"
  // 드롭다운(완료일 보정류 4개+캘린더 재동기화+서류없는사건정리+관계자고객등록)을 없앴다.
  // 실제 로직은 그대로 이 파일에 남기고(사건 데이터를 다루는 함수라 여기 있는 게 자연스러움),
  // 버튼만 설정 화면으로 옮겨 이 함수들을 그대로 호출한다 — openFixCompletionDatesModal_ 등
  // 이미 이름 붙은 함수는 그대로 재사용, 버튼 변수를 직접 참조하던 인라인 핸들러 2개
  // (캘린더 재동기화·관계자 고객등록)만 버튼을 인자로 받는 형태로 뽑아냈다.
  function runResyncCalendars_(btn){
    nxConfirm_('모든 사건의 [NX] 캘린더 일정을 지금 저장된 값 기준으로 다시 맞춥니다. 계속할까요?').then(function(ok){
      if (!ok) return;
      btn.disabled = true;
      callGas('work_resync_all_calendars', {}).then(function(res){
        btn.disabled = false;
        if (res.success === false){ showToast(res.message || '재동기화 실패', 'error'); return; }
        showToast('캘린더 재동기화 완료 — ' + res.synced + '건 성공' + (res.failed ? ', ' + res.failed + '건 실패' : '') + '.', 'success');
      }).catch(function(err){
        btn.disabled = false;
        showToast('재동기화 중 오류: ' + nxErrText_(err), 'error');
      });
    });
  }

  // [2026.09.17 신규] "완료일이 현금영수증발행일보다 늦은 경우 모두 발행일로 변경" — 한 고객이
  // 사건을 하나만 가진 경우만 자동 적용 대상(그 고객의 최신 현금영수증 발행일 = 그 사건 것이
  // 확실함)이고, 사건을 여러 개 가진 고객은 어느 영수증이 어느 사건 것인지 특정 못 해 "확인
  // 필요" 목록으로만 따로 보여준다(자동 적용 안 함).
  function openFixCompletionAfterReceiptModal_(){
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.style.display = 'flex';
    overlay.innerHTML =
      '<div class="modal-panel" style="width:min(760px, 96vw); max-height:86vh; display:flex; flex-direction:column;">' +
        '<div class="modal-head"><span>완료일-영수증일 보정</span><span class="modal-close" title="닫기" role="button" id="wfrClose">✕</span></div>' +
        '<div class="modal-body" style="overflow-y:auto;">' +
          '<div id="wfrBody">확인 중…</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    function close(){ overlay.remove(); }
    overlay.querySelector('#wfrClose').onclick = close;
    overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });

    function tableHtml(items){
      var rows = items.map(function(it){
        return '<tr><td style="padding:4px 8px;">' + escapeHtml(it.고객명) + '</td>' +
          '<td style="padding:4px 8px;">' + escapeHtml(it.사건명) + '</td>' +
          '<td style="padding:4px 8px; color:#b23;">' + escapeHtml(it.현재완료일) + '</td>' +
          '<td style="padding:4px 8px; color:#0D1B3D;">' + escapeHtml(it.영수증발행일) + '</td></tr>';
      }).join('');
      return '<table style="width:100%; border-collapse:collapse; font-size:12.5px;"><thead><tr style="text-align:left; border-bottom:1px solid var(--line);"><th style="padding:4px 8px;">고객명</th><th style="padding:4px 8px;">사건명</th><th style="padding:4px 8px;">현재 완료일</th><th style="padding:4px 8px;">영수증 발행일</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function renderResult(res){
      var body = overlay.querySelector('#wfrBody');
      var html = '';
      if (!res.count && !res.ambiguousCount){
        html = '<div class="log-empty">완료일이 현금영수증 발행일보다 늦은 사건이 없습니다.</div>';
        body.innerHTML = html;
        return;
      }
      if (res.count){
        html += '<div class="taxcalc-result-note" style="margin-bottom:8px;">완료일이 그 고객의 현금영수증 발행일보다 늦은 사건 ' + res.count + '건입니다(한 고객에 사건이 하나뿐이라 확실한 경우만). "일괄 적용"을 누르면 완료일을 영수증 발행일로 바꿉니다.</div>' +
          '<div style="overflow-x:auto;">' + tableHtml(res.items) + '</div>' +
          '<button type="button" id="wfrApplyBtn" class="btn danger" style="margin:10px 0;">⚠ 위 ' + res.count + '건 일괄 적용(되돌리기 어려움)</button>';
      }
      if (res.ambiguousCount){
        html += '<div class="taxcalc-result-note" style="margin:14px 0 8px; color:var(--sub);">아래 ' + res.ambiguousCount + '건은 같은 고객이 사건을 2개 이상 가지고 있어 어느 영수증이 어느 사건 것인지 자동으로 특정할 수 없습니다 — 직접 확인 후 필요하면 개별적으로 완료일을 다시 지정해주세요(완료→진행→완료 다시 전환하면 새 완료일을 입력할 수 있습니다).</div>' +
          '<div style="overflow-x:auto;">' + tableHtml(res.ambiguous) + '</div>';
      }
      body.innerHTML = html;
      var applyBtn = body.querySelector('#wfrApplyBtn');
      if (applyBtn) applyBtn.addEventListener('click', function(){
        nxConfirm_(res.count + '건의 완료일을 각 사건의 현금영수증 발행일로 일괄 적용합니다. 계속할까요?').then(function(ok){
          if (!ok) return;
          body.innerHTML = '적용 중…';
          callGas('work_fix_completion_after_receipt', { apply: true }).then(function(res2){
            if (res2.success === false){ body.innerHTML = '<div class="taxcalc-error">' + (res2.message || '적용 실패') + '</div>'; return; }
            body.innerHTML = '<div class="taxcalc-result-note">' + res2.applied + '건 적용했습니다.</div>';
            showToast(res2.applied + '건의 완료일을 영수증 발행일로 맞췄습니다.', 'success');
            loadWorkCases();
          }).catch(function(err){
            body.innerHTML = '<div class="taxcalc-error">적용 중 오류: ' + (err && err.message ? err.message : err) + '</div>';
          });
        });
      });
    }

    // [2026.09.17 신규] "현금영수증이 사건에 먼저 연결돼야 한다"는 지적으로 근본 원인(스캔이
    // 이미 알고 있던 사건ID를 안 넘기던 버그)을 고쳤다 — 여기서는 그 수정 이전에 이미 쌓인
    // 기존 기록에 사건ID를 뒤늦게 채우는 보정을 먼저 한 번 실행한 뒤(파일명으로 재검색이라
    // 몇 초 걸릴 수 있음) 목록을 불러온다.
    overlay.querySelector('#wfrBody').innerHTML = '기존 영수증 기록에 사건 연결 정보를 보정하는 중…';
    callGas('work_backfill_receipt_case_links', {}).then(function(backfillRes){
      if (backfillRes && backfillRes.updated) showToast('기존 영수증 ' + backfillRes.updated + '건에 사건 연결 정보를 채웠습니다.', 'success');
      return callGas('work_fix_completion_after_receipt', {});
    }).then(function(res){
      if (res.success === false){ overlay.querySelector('#wfrBody').innerHTML = '<div class="taxcalc-error">' + (res.message || '조회 실패') + '</div>'; return; }
      renderResult(res);
    }).catch(function(err){
      overlay.querySelector('#wfrBody').innerHTML = '<div class="taxcalc-error">조회 중 오류: ' + (err && err.message ? err.message : err) + '</div>';
    });
  }

  // [2026.09.19 정비도구 재정비] 완료일 보정 도구 3개(완료일 일괄 보정·완료일-보고서작성일
  // 보정·신고파일 작성일 반영)는 전부 이미 끝난 일회성 마이그레이션이라 삭제했다 — "각
  // 정비도구가 지금도 유효한가?"는 지적에 확인해보니, 시스템 개통 초기(9/21~23)의 잘못된
  // 완료일이나 그 후속 보정은 그 시점이 다시 올 수 없어 영구적으로 "해당 없음"만 나오는
  // 상태였고, 신고파일 작성일 반영은 2026.09.18에 딱 한 번 받은 실제 고객 14명의 이름+날짜가
  // 코드에 그대로 박혀 있던 것이었다(개인정보를 코드에 남겨둘 이유가 없어 완전히 제거).

  function loadWorkCases(){
    workCaseList.innerHTML = '<div class="log-empty">불러오는 중…</div>';
    callGas('work_get_cases', {}).then(function(res){
      if (res.error || res.success === false){
        workCaseList.innerHTML = '<div class="log-empty">' + escapeHtml(res.error || res.message || '불러오지 못했습니다.') + '</div>';
        return;
      }
      workCases = res.cases || [];
      renderWorkCaseList();
      if (workSelectedCaseId){
        var still = workCases.filter(function(c){ return c.id === workSelectedCaseId; })[0];
        if (still) { if (!wcIsTyping_() && !wcHasUnsaved_()) renderWorkCaseDetail(still); return; } // [2026-11-14 전수조사] 고친 값이 있으면 덮지 않는다
      }
      if (!workShowingNewForm){
        workCaseDetail.innerHTML = '<div class="explorer-status">목록에서 사건을 고르거나 "+ 새 사건"을 눌러주세요.</div>';
      }
    }).catch(function(){
      workCaseList.innerHTML = '<div class="log-empty">불러오지 못했습니다.</div>';
    });
    // my.netax.kr 연결·제출현황 배지용 — 실패해도 목록 자체는 정상 동작해야 하므로 별도·조용히 시도.
    callGas('admin_list', { module: 'my' }).then(function(res){
      workMyPortalByReportId = {};
      (res.cases || []).forEach(function(c){ workMyPortalByReportId[c.report_id] = c; });
      renderWorkCaseList();
      if (workSelectedCaseId){
        var still2 = workCases.filter(function(c){ return c.id === workSelectedCaseId; })[0];
        if (still2 && !wcIsTyping_() && !wcHasUnsaved_()) renderWorkCaseDetail(still2); // [2026-11-14 전수조사] 쓰는 중·고친 값이 있으면 덮지 않는다
      }
    }).catch(function(){});
  }

  function workProgress(caseObj){
    var total = 0, done = 0;
    (function walk(nodes){
      (nodes || []).forEach(function(n){
        total++;
        if (n.status === '완료') done++;
        walk(n.children);
      });
    })(caseObj.하위업무);
    return { total: total, done: done };
  }

  // my.netax.kr 연결·체크리스트 제출현황을 짧은 문구로 — 작업관리는 현황만 보여주는 화면이라
  // (실제 연결·항목추가는 사건처리 화면에서) 여기서는 읽기전용 배지만 붙인다.
  // [2026.09 버그수정] "🔗 포털연결됨"/"🔗 포털 0/1"처럼 아이콘 뒤에 또 "포털"을 반복해서
  // 굳이 안 적어도 되는 글자가 붙어있었다 — 아이콘 자체가 이미 "포털 연결"을 뜻하므로,
  // 연결만 됐으면 아이콘만, 제출현황이 있으면 숫자만 최대한 짧게 붙인다.
  function workMyPortalBadgeText_(c){
    if (!c.my_report_id) return '';
    var mc = workMyPortalByReportId[c.my_report_id];
    if (!mc) return ' · 🔗';
    var checklist = mc.checklist || [];
    var status = mc.submission_status || {};
    var done = checklist.filter(function(item){ return status[item] && status[item].submitted; }).length;
    return checklist.length ? (' · 🔗 ' + done + '/' + checklist.length) : ' · 🔗';
  }

  function renderWorkCaseList(){
    var filter = workCaseFilterStatus.value;
    // [2026.10.13] 필터 기본값이 "진행"이라, 다른 화면에서 완료·보류 사건을 열려고 넘어오면 목록에서 안 보인다 —
    // 그때만(goToWorkManage_로 들어온 직후 한 번) 필터를 "전체"로 넓힌다. 세무사님이 직접 필터를 바꾼 경우는 건드리지 않는다.
    if (workJumpWidenFilter_ && workSelectedCaseId && workCases.length){
      var jumpTo = workCases.filter(function(c){ return c.id === workSelectedCaseId; })[0];
      workJumpWidenFilter_ = false;
      if (jumpTo && filter && jumpTo.상태 !== filter){ workCaseFilterStatus.value = ''; filter = ''; }
    }
    // [2026.09.18 신규] "일일이 스크롤해서 찾는 것이 너무 힘들다" — 사건 수가 늘어나면서
    // 왼쪽 목록을 눈으로 훑어 찾기 힘들어졌다는 지적. 의뢰인(고객명)뿐 아니라 납세자로도
    // 찾을 수 있어야 한다(상속은 의뢰인=상속인, 납세자=피상속인이 다른 게 정상이라 둘 중
    // 아무 이름으로나 찾을 수 있어야 실제로 쓸모가 있다).
    var q = (workCaseSearchInput && workCaseSearchInput.value.trim().toLowerCase()) || '';
    var filtered = workCases.filter(function(c){
      if (filter && c.상태 !== filter) return false;
      if (!q) return true;
      // [2026.09.18 신규] 완료일로도 찾을 수 있게 — 법정일 문자열("2026-06-30")은 짧은
      // 표시형("26-06-30", fmtDateShort_ 참고)이 그 안에 그대로 포함되는 구조라, 부분일치
      // 검색만으로 "2026-06-30"/"26-06-30"/"06-30" 등 어떤 식으로 입력해도 찾아진다.
      return String(c.고객명 || '').toLowerCase().indexOf(q) !== -1 ||
        String(c.납세자 || '').toLowerCase().indexOf(q) !== -1 ||
        String(c.법정일 || '').indexOf(q) !== -1;
    });
    workCaseList.innerHTML = '';
    if (!filtered.length){
      workCaseList.innerHTML = '<div class="log-empty">' + (q ? '검색 결과가 없습니다.' : '등록된 사건이 없습니다.') + '</div>';
      return;
    }
    var todayStr = workTodayStr_();
    filtered.slice().sort(function(a, b){ return (a.법정일 || '9999').localeCompare(b.법정일 || '9999'); }).forEach(function(c){
      var prog = workProgress(c);
      var overdue = c.법정일 && c.법정일 < todayStr && c.상태 !== '완료';
      var row = document.createElement('div');
      // [2026.10.31] 세무사님 "카드모양으로 감쌀 경우에는 색상처리를 해야" — 사건 카드마다 상태 색 띠(기한 지남 빨강·진행 남색·보류 회색·완료 초록, style.html)
      row.className = 'log-entry ' + (overdue ? 'st-over' : c.상태 === '완료' ? 'st-done' : c.상태 === '보류' ? 'st-hold' : 'st-go');
      row.style.cursor = 'pointer';
      // [2026-11-13 3차 3] 사건 카드가 화면 읽기·자동 점검에 이름 없는 단추로 잡혔다 — 사건명·기한·상태를 이름으로
      row.setAttribute('role', 'button'); row.setAttribute('tabindex', '0');
      row.setAttribute('aria-label', String(c.사건명 || c.고객명 || '사건') + ' — ' + (c.법정일 ? '기한 ' + c.법정일 : '기한 없음') + ' · ' + String(c.상태 || ''));
      if (c.id === workSelectedCaseId) row.style.outline = '2px solid var(--navy)';
      var noDeadlineText = workDeadlineFieldLabel_(c.업무유형) === '처리시한' ? '시한없음' : '기한없음';
      var dateStyle = c.상태 === '완료' ? ' style="color:var(--sub);"' : '';
      // [2026.09 버그수정] 사건명 명명규칙이 "고객명(납세자)_세목_업무유형"으로 바뀌면서(납세자가
      // 고객명과 같아도 항상 표시) 사건명 자체가 길어져, 바로 아래 줄에 세목·업무유형이 또
      // 나오는 것과 겹쳐 좁은 목록에서 두 줄로 줄바꿈되곤 했다 — 사건명 전체를 또 보여주는 대신,
      // 동명이인 번호와 납세자만 뽑아서 짧게 붙인다.
      // [2026.09.16 버그수정] "작업관리가 사건명 규칙과 다르게 명명돼 보인다"는 지적 — 이 배지가
      // 납세자가 고객명과 같으면(=대부분 비어있는 경우) 괄호를 아예 숨겨서, 사건명은 항상
      // "고객명(납세자)"인데 목록만 "고객명"만 보여 규칙이 안 지켜지는 것처럼 보였다. 사건명과
      // 완전히 같은 규칙(항상 표시, 비어있으면 고객명 그대로)으로 맞춘다 — 부수 효과로 "고객E
      // (고객E)"처럼 납세자가 아직 안 채워진 사건도 목록만 보고 바로 알아볼 수 있게 된다.
      // [2026.09 버그수정] 구글시트가 "3733" 같은 숫자로만 된 고객명을 문자열이 아니라 진짜
      // 숫자로 읽어들이는 경우가 있다 — String()으로 강제하지 않으면 .replace() 호출에서
      // "custName.replace is not a function" 오류가 나서 이 목록을 다시 그릴 때마다(클릭할
      // 때마다) 예외가 터져, 사건 상세보기 자체가 실행되지 않는 심각한 문제로 이어졌다.
      var custName = String(c.고객명 || '');
      var taxpayerName = String(c.납세자 || '');
      var numMatch = custName ? String(c.사건명 || '').match(new RegExp('^' + custName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(\\d+)')) : null;
      var subBits = [];
      if (numMatch) subBits.push('#' + numMatch[1]);
      if (custName) subBits.push('(' + escapeHtml(taxpayerName || custName) + ')');
      // [2026.09 버그수정] 부가정보 줄(세목·업무유형·상태·포털뱃지)이 좁은 사이드바에서
      // 넘치면 줄바꿈되어 카드 높이가 들쭉날쭉해졌다 — 줄바꿈 대신 한 줄로 자르고 "..."로
      // 표시한다(요약 목록이니 전체는 클릭해서 상세보기에서 확인).
      row.innerHTML =
        '<div class="log-date"' + (overdue ? ' style="color:#b3261e; font-weight:700;" title="기한 지남"' : dateStyle) + '>' + escapeHtml(c.법정일 ? fmtDateShort_(c.법정일) : noDeadlineText) + '</div>' +
        '<div class="log-text"><b>' + escapeHtml(custName || '(고객명 없음)') + '</b>' + (subBits.length ? ' <span style="color:var(--sub);">' + subBits.join(' ') + '</span>' : '') +
        '<div style="color:var(--sub); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + escapeHtml(WORK_SEMOK_LABELS[c.세목] || c.세목 || '') + (c.업무유형 ? ' · ' + escapeHtml(c.업무유형) : '') + ' · ' + escapeHtml(c.상태 || '') +
        (prog.total ? (' · 하위업무 ' + prog.done + '/' + prog.total) : '') + workMyPortalBadgeText_(c) + '</div></div>';
      row.setAttribute('data-ms-id', String(c.id)); // [2026-11-14] 카드만 보기의 ◀ ▶ 넘기는 순서 = 이 목록 순서
      row.addEventListener('click', function(){ wcOpenCase_(c.id); });
      workCaseList.appendChild(row);
    });
    if (wcViews_) wcViews_.refresh();
  }

  // [2026-11-14 세 가지 보기] 사건 하나 열기 — 목록 줄·◀ ▶·← → 모두 이 길. 카드에 저장 안 한 값이 있으면 먼저 여쭌다(넘기기 단추가 생겨 값을 잃을 일이 늘어서 — 계획서 ㉢)
  function wcOpenCase_(id){
    wcLeaveGuard_(function(){
      var c = workCases.filter(function(x){ return String(x.id) === String(id); })[0];
      if (!c) return;
      workShowingNewForm = false; workSelectedCaseId = c.id;
      renderWorkCaseList(); renderWorkCaseDetail(c);
      if (wcViews_) wcViews_.picked();
    });
  }
  // [2026-11-14 전수조사 고침] 세무사님 "당연히 그렇게 해야지 혹시라도 그런 것이 또 있는지 전수조사하라" / "너무 황당한 것을 간과한단 말야"
  //  처음엔 칸 이름을 손으로 골라 보아서, 고객 「추가 연락처」 목록·쓰다 만 「+ 의뢰인」·「수금 추가」·「새 하위업무」·「세부항목」 칸이 빠졌다.
  //  이제 카드 안의 모든 칸을 본다(nxDirtyTracker_) — 그렸을 때·저장했을 때·나중에 펼쳐진 때의 값을 칸마다 기억해 지금 값과 견준다. 고치는 즉시 저장되는 칸(상태·하위업무 줄)과 화면 이동 칸만 뺀다.
  var wcDirty_ = nxDirtyTracker_(workCaseDetail, { skip: '#wcEditStatus, .wcNodeStatus, .wcNodeTitle, .wcNodeDue, .nx-case-jump, .nx-case-jump *', pending: '#wcNewRootFormWrap, .wcChildFormWrap' });
  function wcHasUnsaved_(){ return wcDirty_.dirty(); }
  function wcLeaveGuard_(go){
    nxLeaveGuard_({ parts: wcDirty_.parts, clean: wcDirty_.clean, pendingNames: '「새 하위업무」·「세부항목」 칸', isNew: function(){ return !!document.getElementById('wcNewCustomer'); },
      save: function(){ var sb = document.getElementById('wcSaveCase'); if (sb) sb.click(); }, noun: '사건' }, go);
  }

  // [2026.09] "사건명이 애매하다"는 지적에 따라 이 폼엔 사건명 입력칸이 없다 — 서버
  // (work_createCase)가 "고객명(납세자) 세목 업무유형"으로 자동 생성한다(work_generateUniqueCaseName_,
  // 같은 조합이 이미 있으면 뒤에 " 2" 등을 붙임). 필요하면 나중에 사건 상세(편집) 화면에서
  // 직접 고칠 수 있다.
  function renderNewCaseForm(prefill){ // [2026-11-14 전수조사] 부르는 곳(예약·고객·이 화면)이 어디든 고치던 카드부터 묻는다
    if (prefill && prefill.target) prefill = undefined; // 단추 누름(이벤트)이 그대로 넘어온 경우
    wcLeaveGuard_(function(){ renderNewCaseForm_(prefill); });
  }
  function renderNewCaseForm_(prefill){
    workShowingNewForm = true;
    workSelectedCaseId = null;
    renderWorkCaseList();
    prefill = prefill || {};
    workCaseDetail.innerHTML =
      '<h3>새 사건 등록</h3>' +
      (prefill.bookingRowIndex ? '<div style="font-size:12px; color:var(--sub); margin-bottom:8px;">예약에서 시작 — 저장하면 그 예약에 이 사건이 연결됩니다.</div>' : '') +
      (prefill.고객ID ? '<div style="font-size:12px; color:var(--sub); margin-bottom:8px;">고객에서 시작 — 저장하면 고객의 그 고객에 바로 연결됩니다.</div>' : '') +
      '<div style="display:flex; flex-direction:column; gap:8px; max-width:420px;">' +
      '<label>고객명(의뢰인) *<br><input type="text" id="wcNewCustomer" list="clientNameOptions" value="' + escapeHtml(prefill.고객명 || '') + '" size="' + Math.max(String(prefill.고객명 || '').length, 8) + '" placeholder="고객명"></label>' +
      '<label>납세자 <span style="color:var(--sub); font-weight:400;">(의뢰인과 다른 경우만 입력)</span><br><input type="text" id="wcNewTaxpayer" value="' + escapeHtml(prefill.납세자 || '') + '" size="' + Math.max(String(prefill.납세자 || '').length, 8) + '" placeholder="(선택)"></label>' +
      '<label>세목<br><select id="wcNewSemok">' +
        Object.keys(WORK_SEMOK_LABELS).map(function(k){ return '<option value="' + k + '">' + WORK_SEMOK_LABELS[k] + '</option>'; }).join('') +
      '</select></label>' +
      '<label>업무유형<br><select id="wcNewUptype"></select></label>' +
      '<label>의뢰일<br><div style="display:flex; gap:6px;"><input type="date" id="wcNewRequestDate"><button type="button" id="wcNewRequestDateToday" class="ghost-btn" style="white-space:nowrap;">오늘</button></div></label>' +
      '<div id="wcNewBaseDateWrap"><label><span id="wcNewBaseDateLabel">기준일</span><br><input type="date" id="wcNewBaseDate"></label></div>' +
      '<label id="wcNewManualDeadlineLabel" style="display:none;"><span id="wcNewManualDeadlineText">처리시한</span><br><input type="date" id="wcNewManualDeadline"></label>' +
      '<label>진행메모<br><textarea id="wcNewOverview" style="width:100%; min-height:60px; font-family:inherit; box-sizing:border-box;" placeholder="어떻게 처리할 계획인지">' + escapeHtml(prefill.개요 || '') + '</textarea></label>' +
      '<div style="display:flex; gap:8px; margin-top:8px;">' +
      '<button type="button" id="wcNewSave" class="save-btn">저장</button>' +
      '<button type="button" id="wcNewCancel" class="ghost-btn">취소</button>' +
      '</div></div>';

    // [2026.09 버그수정] 실사용 지적(사건개요서의 취득일과 같은 문제) — 네이티브 달력 위젯은
    // 값이 비어있으면 항상 "오늘"부터 시작해 과거 날짜(의뢰일·기준일 등)로 넘어가기 번거롭다 —
    // taxcalc.html의 enhanceDateInputs로 통일해 직접 타이핑 가능하게 한다.
    if (typeof enhanceDateInputs === 'function') enhanceDateInputs(workCaseDetail);

    var newSemokSel = document.getElementById('wcNewSemok');
    var newUptypeSel = document.getElementById('wcNewUptype');

    function refillNewUptype(){
      var options = WORK_UPTYPE_OPTIONS_[newSemokSel.value] || [];
      newUptypeSel.innerHTML = options.map(function(u){ return '<option value="' + u + '">' + u + '</option>'; }).join('');
      onNewUptypeChange();
    }
    function onNewUptypeChange(){
      var manual = WORK_MANUAL_DEADLINE_TYPES_.indexOf(newUptypeSel.value) !== -1;
      document.getElementById('wcNewBaseDateLabel').textContent = WORK_BASE_DATE_LABELS_[newSemokSel.value] || '기준일';
      // [2026.09] "작업관리에서 기준일을 없애고 사건개요서에 넣으면 작업관리가 되느냐"는
      // 질문에 대한 답 — 사건개요서 양식이 있는 세목(현재 양도소득세)은 이 입력칸을 여기서
      // 안 보여주고 처리개요의 사건개요서(양도일 칸, 기준일과 같은 값)에서만 입력한다.
      // work_createCase는 기준일이 비어있으면 법정일도 비워둔 채 사건을 만들고, 나중에
      // 사건개요서를 처음 저장할 때 work_updateCase가 그 시점에 법정일을 계산한다(필요증빙
      // 템플릿과 같은 타이밍) — 작업관리 자체는 이 입력칸이 하나 없어질 뿐 그대로 동작한다.
      var hasOverviewTemplate = typeof CH_CASE_OVERVIEW_FIELDS_ !== 'undefined' && !!CH_CASE_OVERVIEW_FIELDS_[newSemokSel.value];
      document.getElementById('wcNewBaseDateWrap').style.display = hasOverviewTemplate ? 'none' : '';
      var manualLabel = document.getElementById('wcNewManualDeadlineLabel');
      manualLabel.style.display = manual ? '' : 'none';
      if (manual){
        document.getElementById('wcNewManualDeadlineText').textContent = workDeadlineFieldLabel_(newUptypeSel.value);
        var deadlineInput = document.getElementById('wcNewManualDeadline');
        if (!deadlineInput.value) deadlineInput.value = workDefaultManualDeadline_(document.getElementById('wcNewRequestDate').value);
      }
    }
    newSemokSel.addEventListener('change', refillNewUptype);
    newUptypeSel.addEventListener('change', onNewUptypeChange);
    // [2026.09.23 신규, "전수조사" 지시로 발견] 예약(booking.html)에서 넘어온 의뢰일·(추정)
    // 세목·업무유형을 미리 채워둔다 — 지금까지는 이 폼이 고객명/납세자/개요만 prefill을
    // 읽고 나머지는 항상 빈 값/첫 옵션으로 시작해서, 예약 시점에 이미 있던 정보를 매번
    // 다시 입력해야 했다. 세목이 있으면 그 세목의 업무유형 목록으로 먼저 갈아끼운 뒤
    // (refillNewUptype이 목록을 새로 채우면서 업무유형도 초기화하므로) 업무유형을 그 다음에
    // 맞춘다 — 순서가 바뀌면 덮어써진다.
    if (prefill.세목 && WORK_SEMOK_LABELS[prefill.세목]) newSemokSel.value = prefill.세목;
    refillNewUptype();
    if (prefill.업무유형 && (WORK_UPTYPE_OPTIONS_[newSemokSel.value] || []).indexOf(prefill.업무유형) !== -1) {
      newUptypeSel.value = prefill.업무유형;
      onNewUptypeChange();
    }
    if (prefill.의뢰일) document.getElementById('wcNewRequestDate').value = prefill.의뢰일;

    document.getElementById('wcNewRequestDateToday').addEventListener('click', function(){
      document.getElementById('wcNewRequestDate').value = workTodayStr_();
    });

    document.getElementById('wcNewCancel').addEventListener('click', function(){
      workShowingNewForm = false;
      workCaseDetail.innerHTML = '<div class="explorer-status">목록에서 사건을 고르거나 "+ 새 사건"을 눌러주세요.</div>';
    });
    document.getElementById('wcNewSave').addEventListener('click', function(){
      // [2026.09 버그수정] 더블클릭(또는 네트워크가 느릴 때 급한 마음에 두 번 누름) 방지 —
      // 막지 않으면 work_create_case가 두 번 호출돼 사건·폴더·my.netax.kr 접속코드가
      // 각각 두 개씩 만들어지고, 예약에서 시작한 경우 예약엔 나중 응답의 사건ID만 남아
      // 먼저 만들어진 사건이 예약과 연결 안 된 채 고아로 남는다.
      var saveBtn = this;
      if (saveBtn.disabled) return;
      var 고객명 = document.getElementById('wcNewCustomer').value.trim();
      if (!고객명){ showToast('고객명을 입력해주세요.', 'warning'); return; }
      saveBtn.disabled = true;
      // [2026.10.30 B1 — 세무사님 "A1·B1부터 해라"] 저장이 30초쯤(사건 폴더·의뢰서·고객 접속 만들기) 걸리는데 단추만 잠겨 눌러도 반응이 없는 것처럼 보였다 —
      //  단추 글자를 "저장 중… N초"로 바꿔 지나간 초를 보이고, 실패하면 원래 글자로 되돌린다(성공하면 화면이 사건으로 바뀐다)
      var saveBtnHtml = saveBtn.innerHTML, saveT0 = Date.now();
      var saveTick = function(){ saveBtn.textContent = '저장 중… ' + Math.round((Date.now() - saveT0) / 1000) + '초 (30초쯤 걸립니다)'; saveBtn.title = '사건 폴더·의뢰서·고객 접속을 만드는 중입니다'; };
      saveTick();
      var saveTimer = setInterval(saveTick, 1000);
      var saveDone = function(ok){ clearInterval(saveTimer); if (!ok){ saveBtn.innerHTML = saveBtnHtml; saveBtn.disabled = false; } };
      var upType = newUptypeSel.value;
      var manual = WORK_MANUAL_DEADLINE_TYPES_.indexOf(upType) !== -1;
      var payload = {
        고객명: 고객명,
        납세자: document.getElementById('wcNewTaxpayer').value.trim(),
        세목: newSemokSel.value,
        업무유형: upType,
        의뢰일: document.getElementById('wcNewRequestDate').value,
        기준일: document.getElementById('wcNewBaseDate').value,
        개요: document.getElementById('wcNewOverview').value.trim()
      };
      if (manual) payload.법정일 = document.getElementById('wcNewManualDeadline').value;
      // 예약에서 시작한 경우 화면엔 입력칸이 따로 없지만, 예약 때 받은 전화·고객유형·
      // 현재세무처리·관련분야를 그대로 실어 보낸다(work_createCase가 전화는 고객 레코드에,
      // 나머지는 개요 앞부분에 반영한다) — 예전엔 여기서 다 버려지고 있었다.
      if (prefill.전화) payload.전화 = prefill.전화;
      // [2026.10.18 탭연결 3번] 고객관리 "＋ 이 고객으로 새 사건"에서 왔으면 그 고객에 바로 붙인다(이름으로 다시 찾지 않음 — 동명이인 혼동 방지).
      // 고객명 칸을 다른 사람으로 고쳤으면 고정을 풀고 예전처럼 이름으로 찾는다.
      if (prefill.고객ID && 고객명 === String(prefill.고객명 || '').trim()) payload.고객ID = prefill.고객ID;
      if (prefill.고객유형) payload.고객유형 = prefill.고객유형;

      // [2026.09 버그수정] 실사용 감사 지적 — 사건개요서 양식이 있는 세목(양도·증여·상속)은
      // 이 화면에서 기준일 입력칸을 숨기기만 하고 DOM에는 그대로 남겨둬서, 화면에 안 보이는
      // 값이 저장 시 같이 전송되고 있었다(처리개요 쪽에서 매번 목록을 새로고침해줘서 실제
      // 사고로 이어진 적은 없지만 구조적으로 위험). 이 세목은 아예 payload에서 빼서
      // 사건개요서가 기준일의 유일한 출처가 되게 한다.
      var hasOverviewTemplateForSave = typeof CH_CASE_OVERVIEW_FIELDS_ !== 'undefined' && !!CH_CASE_OVERVIEW_FIELDS_[editSemokSel.value];
      var payload = {
        id: c.id,
        고객명: customerName,
        납세자: 납세자,
        세목: editSemokSel.value,
        업무유형: upType,
        의뢰일: document.getElementById('wcEditRequestDate').value,
        상태: document.getElementById('wcEditStatus').value,
        개요: document.getElementById('wcEditOverview').value.trim(),
        // [2026.09 버그수정] 이 화면의 저장은 다른 화면들과 달리 동시편집 잠금이 아예 빠져
        // 있었다 — 특히 사건개요를 통째로 patch하는 아래 taxpayerField 분기와, 상태(완료 등)를
        // 바꾸는 유일한 경로라는 점에서 가장 챙겨야 할 곳이었다.
        기대수정일: c.수정일
      };
      if (completionDateOverride) payload.완료일 = completionDateOverride;
      if (!hasOverviewTemplateForSave) payload.기준일 = document.getElementById('wcEditBaseDate').value;
      // [2026.09.18] "완료일을 직접 입력할 수 있게 해달라" — 완료된 사건은 이 칸이 곧 완료일
      // 이므로 언제나 그대로 보낸다(수동유형=처리시한도 원래부터 자동계산이 없어 항상 그대로
      // 보내는 게 안전했음, 같은 원칙). 자동계산 유형이면서 아직 완료 전인 사건만, 사용자가
      // 이 칸을 실제로 고쳤을 때(렌더링 당시 값과 달라졌을 때)만 명시적 override로 보낸다 —
      // 안 건드렸으면 서버의 기준일 기반 자동계산이 평소처럼 그대로 적용돼야 한다.
      var deadlineInputVal_ = document.getElementById('wcEditManualDeadline').value;
      if (manual || c.상태 === '완료' || deadlineInputVal_ !== wcEditDeadlineOriginal_) payload.법정일 = deadlineInputVal_;
      // [2026.09] 작업관리의 "납세자"와 사건개요서의 납세의무자 이름 필드(casehandling.html의
      // TAXPAYER_NAME_FIELD_BY_SEMOK_)가 반드시 같은 값이어야 한다는 요청 — 여기서 납세자를
      // 고치면 사건개요 쪽도 같이 맞춘다(반대 방향은 casehandling.html의 chSaveTarget이
      // 담당). 납세자를 비워두면(원래 값 유지하려는 경우) 사건개요 쪽은 건드리지 않는다.
      var taxpayerField = (typeof TAXPAYER_NAME_FIELD_BY_SEMOK_ !== 'undefined') ? TAXPAYER_NAME_FIELD_BY_SEMOK_[editSemokSel.value] : null;
      if (taxpayerField && 납세자) {
        var overviewPatch = {};
        overviewPatch[taxpayerField] = 납세자;
        payload.사건개요 = Object.assign({}, c.사건개요 || {}, overviewPatch);
      }
      // [2026.11.03 전수조사 다시] 화면 먼저 — 고친 칸을 목록·상세에 바로 넣고 서버엔 뒤에서(같은 사건끼리 차례로). 서버가 다시 만든 값(사건명·법정일)은 답이 오면 맞춘다.
      //  예전엔 답(수 초)을 기다린 뒤 목록 전체를 다시 받았다(또 수 초). 충돌(다른 기기가 먼저 고침)이면 서버 줄로 바꿔 보이고 화면 아래 띠에 남는다.
      nxCaseSave_(payload, { base: c, label: (c.사건명 || '사건') + ' 저장',
        onDone: function(res){
          if (!res || !res.case) return;
          var cur = nxFindCase_(res.case.id); if (cur && cur !== c) Object.assign(c, cur); else Object.assign(c, res.case);
          if (String(workSelectedCaseId) !== String(c.id)) { renderWorkCaseList(); return; }
          // [2026.10.09] 입력 중이면 상세는 다시 그리지 않는다(쓰던 글이 지워지지 않게) — 목록만
          if (wcIsTyping_() || wcHasUnsaved_()) renderWorkCaseList(); else { renderWorkCaseList(); renderWorkCaseDetail(c); } // [2026-11-14 전수조사] 저장 뒤 또 고친 값이 있으면 덮지 않는다
        },
        onFail: function(why){ if (/먼저 저장|충돌/.test(String(why))) { var cur = nxFindCase_(c.id); if (cur && String(workSelectedCaseId) === String(c.id) && !wcIsTyping_() && !wcHasUnsaved_()) { renderWorkCaseList(); renderWorkCaseDetail(cur); } } } });
      Object.keys(payload).forEach(function(k){ if (k !== '기대수정일' && k.charAt(0) !== '_') c[k] = payload[k]; });
      if (!silent) showToast('저장했습니다.', 'success');
      renderWorkCaseList();
      wcDirty_.clean(true); // [2026-11-14] 저장한 값이 새 기준(「추가」 안 누른 하위업무 칸은 그대로 봄)
    }
    document.getElementById('wcSaveCase').addEventListener('click', function(){ saveCaseNow_(false); });
    // [2026.09 버그수정] 증빙이 하나도 안 갖춰지고 보고서도 전혀 발행되지 않은 채로 "완료"로
    // 바꿔도 아무 경고 없이 그냥 저장돼 버렸다 — 완료로 바꾸는 순간만 가볍게 확인한다(이미
    // 완료 상태인데 다른 값으로 잠깐 바뀌었다가 도로 완료로 돌아오는 경우는 실제 "새로 완료
    // 처리"가 아니므로 제외).
    document.getElementById('wcEditStatus').addEventListener('change', function(){
      var sel = this;
      var newStatus = sel.value;
      if (newStatus === '완료' && c.상태 !== '완료') {
        function askDateThenSave_(){
          wcPromptCompletionDate_().then(function(dateVal){
            if (!dateVal){ sel.value = c.상태; return; }
            saveCaseNow_(true, dateVal);
          });
        }
        checkCompletionReadiness_(c).then(function(warnings){
          if (warnings.length){
            nxConfirm_('완료 처리하기 전에 확인해주세요:\n\n- ' + warnings.join('\n- ') + '\n\n그래도 완료로 처리할까요?').then(function(ok){
              if (!ok){ sel.value = c.상태; return; }
              askDateThenSave_();
            });
            return;
          }
          askDateThenSave_();
        });
      } else {
        saveCaseNow_(true);
      }
    });

    document.getElementById('wcDeleteCase').addEventListener('click', function(){
      nxConfirm_('"' + c.사건명 + '" 사건을 삭제할까요? 하위업무와 캘린더 일정도 함께 지워집니다.').then(function(ok){
        if (!ok) return;
        // [2026.11.03 전수조사 다시] 화면 먼저 — 목록에서 바로 빼고 서버엔 뒤에서(달력·보고서 목록 정리는 서버 뒤에서). 실패하면 화면 아래 띠에 남고 [지우기]하면 목록을 다시 받는다
        nxSaveLater_('work_delete_case', { id: c.id }, { key: 'case_' + c.id, label: (c.사건명 || '사건') + ' 지우기', patch: [{ list: 'cases', op: 'delete', id: c.id }],
          onFail: function(why){ showToast('삭제하지 못했습니다 — ' + why, 'error'); } });
        workSelectedCaseId = null;
        showToast('삭제했습니다.', 'success');
        renderWorkCaseList(); workCaseDetail.innerHTML = '<div class="explorer-status">목록에서 사건을 고르거나 "+ 새 사건"을 눌러주세요.</div>';
      });
    });
    wcDirty_.clean(); // [2026-11-14] 그린 값이 기준 — 고치면 넘길 때 여쭌다
  }


  // [2026.09] 완료 처리 직전에 "요청자료가 다 안 모였는데도/보고서를 발행하지 않았는데도
  // 완료로 넘어가는" 실수를 막기 위한 가벼운 사전 점검. 저장을 막지는 않고(예외적으로 증빙·
  // 보고서 없이도 완료해야 하는 사건이 있을 수 있으므로) 확인 메시지만 띄운다.
  // 상세 화면에서 글을 쓰는 중인가(쓰는 중엔 상세를 다시 그리지 않는다 — 쓰던 글이 지워지지 않게)
  function wcIsTyping_(){ var a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && workCaseDetail && workCaseDetail.contains(a)); }
  function checkCompletionReadiness_(c){
    var warnings = [];
    var unresolved = (c.증빙목록 || []).filter(function(e){ return e.source === 'requested' && e.status !== '확보됨'; });
    if (unresolved.length) warnings.push('요청자료 중 ' + unresolved.length + '건이 아직 미확보 상태입니다.');
    // [2026.10.18 탭연결 8번] 하위업무 미완료와 수금(입금) 기록도 같이 본다 — 일은 끝났는데 보수를 받았는지 시스템이 알려주지 않았다.
    // (청구액·미수 관리는 새 기능이라 만들지 않았다 — 여기서는 "이 사건에 연결된 입금 기록이 하나라도 있나"만 본다)
    var subPending = 0;
    (function walk(nodes){ (nodes || []).forEach(function(n){ if (n.status !== '완료') subPending++; walk(n.children); }); })(c.하위업무);
    if (subPending) warnings.push('사건 목록 하위업무 중 ' + subPending + '건이 아직 완료 전입니다.');
    var payCheck = callGas('client_get_consult_logs', {}).then(function(res){
      var paid = ((res && res.logs) || []).filter(function(l){ return l.사건ID === c.id && Number(l.금액) > 0; });
      if (!paid.length) warnings.push('이 사건에 연결된 수금(입금) 기록이 없습니다 — 보수를 받았으면 개요 수금 카드나 수금 화면에서 이 사건으로 기록하세요.');
    }).catch(function(){});
    if (!c.폴더ID) return payCheck.then(function(){ return warnings; });
    // [2026.11.03 전수조사 다시] 수금 확인과 보고서 확인을 차례로 하던 것(서버 세 번 줄지어 10초 넘게)을 함께 보낸다
    var repCheck = callGas('get_case_subfolders', { caseId: c.id }).then(function(sub){
      if (!sub || sub.error || !sub.reportFolderId) return;
      return callGas('listFolder', { folderId: sub.reportFolderId }).then(function(res){
        var hasHtml = !res.error && (res.files || []).some(function(f){ return /\.html?$/i.test(f.name); });
        if (!hasHtml) warnings.push('고객에게 발행된 보고서(.html)가 아직 없습니다.');
      });
    }).catch(function(){});
    return Promise.all([payCheck, repCheck]).then(function(){ return warnings; });
  }

  // [2026.09.16 신규] "시스템 개통 전에 이미 완료된 사건을 지금 완료 처리하니 완료일이
  // 오늘(9/22, 9/23)로 찍혀버린다"는 지적 — work_updateCase가 완료 전환 시 항상 오늘 날짜로
  // 법정일을 덮어써서, 실제 완료일을 입력할 방법 자체가 없었다. 완료로 바꿀 때마다 실제
  // 완료일(기본값 오늘)을 확인받아, 지난 사건을 지금 기록할 때는 그 날짜를 직접 넣을 수
  // 있게 한다.
  function wcPromptCompletionDate_(){
    return new Promise(function(resolve){
      var old = document.getElementById('nxDialogOverlay');
      if (old) old.remove();
      var overlay = document.createElement('div');
      overlay.id = 'nxDialogOverlay';
      overlay.className = 'modal-overlay';
      overlay.style.zIndex = '9999';
      var todayStr = workTodayStr_();
      overlay.innerHTML =
        '<div class="modal-panel" style="width:min(360px, 92vw);">' +
          '<div class="modal-head"><span>완료 처리</span></div>' +
          '<div class="modal-body">' +
            '<div style="font-size:13.5px; line-height:1.5; margin-bottom:8px;">실제로 완료된 날짜를 입력해주세요(시스템 개통 전에 이미 끝난 사건을 지금 기록하는 경우, 오늘이 아닌 실제 날짜를 넣으면 됩니다).</div>' +
            '<input type="date" id="wcCompletionDateInput" value="' + todayStr + '" style="width:100%; box-sizing:border-box; padding:6px 8px; border:1px solid var(--line); border-radius:6px;">' +
            '<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">' +
              '<button type="button" class="save-btn" data-val="ok">확인</button>' +
              '<button type="button" class="ghost-btn" data-val="cancel">취소</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);
      var input = overlay.querySelector('#wcCompletionDateInput');
      function finish(val){ overlay.remove(); resolve(val); }
      overlay.querySelector('[data-val="ok"]').addEventListener('click', function(){ finish(input.value || todayStr); });
      overlay.querySelector('[data-val="cancel"]').addEventListener('click', function(){ finish(null); });
      overlay.addEventListener('click', function(e){ if (e.target === overlay) finish(null); });
    });
  }
  // [2026.10.29] 세무사님 "대시보드에서 진행을 즉시 완료로 변경할 수 있거나 처리개요에서 완료로 처리할 수 있으면 좋겠다" —
  // 예전엔 대시보드 마감임박 줄을 누르면 처리개요로만 가고, 처리개요에도 완료 단추가 없어 작업관리로 다시 가야 했다.
  // 작업관리 상태 칸을 '완료'로 바꿀 때와 같은 순서(완료 전 점검 → 실제 완료일 입력 → 저장)를 그대로 밟는다.
  // 상태·완료일·기대수정일만 보내므로 다른 칸은 서버가 그대로 둔다(work_updateCase는 온 칸만 고침).
  // 돌려주는 값: 저장된 사건(성공) / null(취소·실패 — 알림은 여기서 띄움)
  function nxCompleteCaseQuick_(c){
    if (!c || !c.id) return Promise.resolve(null);
    if (c.상태 === '완료'){ showToast('이미 완료된 사건입니다.', 'warning'); return Promise.resolve(null); }
    return checkCompletionReadiness_(c).then(function(warnings){
      if (!warnings.length) return true;
      return nxConfirm_('완료 처리하기 전에 확인해주세요:\n\n- ' + warnings.join('\n- ') + '\n\n그래도 완료로 처리할까요?');
    }).then(function(ok){
      if (!ok) return null;
      return wcPromptCompletionDate_();
    }).then(function(dateVal){
      if (!dateVal) return null;
      var prevSt = c.상태;
      // [2026.11.03] 화면 먼저 — 보낼 함으로 뒤에서 저장(실패하면 화면 아래 붉은 띠에서 다시 보내기)
      return nxCaseSave_({ id: c.id, 상태: '완료', 완료일: dateVal, 기대수정일: c.수정일 }, { base: c, label: (c.사건명 || '사건') + ' 완료 처리',
        onFail: function(){ if (typeof workCases !== 'undefined'){ workCases.forEach(function(x){ if (x.id === c.id) x.상태 = prevSt; }); } },
        redo: function(){ if (typeof workCases !== 'undefined'){ workCases.forEach(function(x){ if (x.id === c.id) x.상태 = '완료'; }); } } }).then(function(res){
        showToast('완료로 처리했습니다(' + dateVal + ').', 'success');
        var updated = res.case || Object.assign({}, c, { 상태: '완료', 완료일: dateVal });
        if (typeof workCases !== 'undefined'){ workCases.forEach(function(x){ if (x.id === c.id) Object.assign(x, updated); }); }
        return updated;
      });
    }).catch(function(e){ showToast('완료 처리 중 오류가 났습니다: ' + nxErrText_(e), 'error'); return null; });
  }


  function renderWorkTree(nodes, container, caseId, depth){
    container.innerHTML = '';
    if (!nodes.length && depth === 0) return;
    nodes.forEach(function(node){
      var row = document.createElement('div');
      row.style.marginLeft = (depth * 20) + 'px';
      row.style.borderLeft = depth ? '2px solid var(--line)' : 'none';
      row.style.padding = '4px 0 4px 8px';
      var overdue = node.dueDate && node.dueDate < workTodayStr_() && node.status !== '완료';
      row.innerHTML =
        '<div style="display:flex; flex-wrap:wrap; align-items:center; gap:6px;">' +
        '<select class="wcNodeStatus" style="font-size:12px;">' + WORK_SUBTASK_STATUS_OPTIONS.map(function(s){ return '<option value="' + s + '"' + (s === node.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>' +
        '<input title="항목 이름" type="text" class="wcNodeTitle" value="' + escapeHtml(node.title || '') + '" style="flex:1; min-width:120px; font-size:13px;">' +
        '<input title="기한" type="date" class="wcNodeDue" value="' + escapeHtml(node.dueDate || '') + '" style="font-size:12px;' + (overdue ? ' color:#b3261e;' : '') + '">' +
        '<button type="button" class="ghost-btn wcNodeAddChild sm">+ 하위</button>' +
        '<span class="log-del wcNodeDelete" title="삭제">✕</span>' +
        '</div>' +
        '<div class="wcChildFormWrap" style="display:none; margin-top:4px; margin-left:20px; gap:6px; flex-wrap:wrap;"></div>' +
        '<div class="wcChildren"></div>';
      container.appendChild(row);

      var statusSel = row.querySelector('.wcNodeStatus');
      var titleInput = row.querySelector('.wcNodeTitle');
      var dueInput = row.querySelector('.wcNodeDue');

      statusSel.addEventListener('change', function(){ updateWorkSubtask(caseId, node.id, { status: statusSel.value }); });
      titleInput.addEventListener('change', function(){ updateWorkSubtask(caseId, node.id, { title: titleInput.value.trim() }); });
      dueInput.addEventListener('change', function(){ updateWorkSubtask(caseId, node.id, { dueDate: dueInput.value }); });

      row.querySelector('.wcNodeDelete').addEventListener('click', function(){
        nxConfirm_('"' + (node.title || '') + '" 항목을 삭제할까요?' + (node.children && node.children.length ? ' 하위 항목도 함께 지워집니다.' : '')).then(function(ok){
          if (!ok) return;
          deleteWorkSubtask(caseId, node.id);
        });
      });

      var addChildBtn = row.querySelector('.wcNodeAddChild');
      var childFormWrap = row.querySelector('.wcChildFormWrap');
      addChildBtn.addEventListener('click', function(){
        if (childFormWrap.style.display === 'none'){
          childFormWrap.style.display = 'flex';
          childFormWrap.innerHTML =
            '<input title="세부항목 이름" type="text" class="wcChildTitle" placeholder="세부항목 이름" style="flex:1; min-width:120px; font-size:12.5px;">' +
            '<input title="기한" type="date" class="wcChildDue" style="font-size:12px;">' +
            '<button type="button" class="save-btn wcChildSave sm">추가</button>' +
            '<button type="button" class="ghost-btn wcChildCancel sm">취소</button>';
          childFormWrap.querySelector('.wcChildCancel').addEventListener('click', function(){ childFormWrap.style.display = 'none'; childFormWrap.innerHTML = ''; });
          childFormWrap.querySelector('.wcChildSave').addEventListener('click', function(){
            var t = childFormWrap.querySelector('.wcChildTitle').value.trim();
            if (!t){ showToast('항목 이름을 입력해주세요.', 'warning'); return; }
            addWorkSubtask(caseId, node.id, t, childFormWrap.querySelector('.wcChildDue').value);
          });
        } else {
          childFormWrap.style.display = 'none';
          childFormWrap.innerHTML = '';
        }
      });

      renderWorkTree(node.children || [], row.querySelector('.wcChildren'), caseId, depth + 1);
    });
  }


  // [2026.09.15 신규] 수금관리 등 다른 화면에서 사건명을 눌러 작업관리로 바로 이동할 때 씀
  // (casehandling.html의 goToCaseHandling_과 같은 패턴).
  var workJumpWidenFilter_ = false;
  function goToWorkManage_(caseId){
    if (typeof goToView_ === 'function') goToView_('workmanage');
    // [2026-11-14 전수조사] 다른 화면(대시보드·처리개요·수금·고객·넥스 창·사건 바꾸기)에서 와도 고치던 카드를 묻지 않고 갈아끼우지 않는다. 같은 사건이면 그대로 보여 준다
    if (caseId && String(caseId) === String(workSelectedCaseId) && !workShowingNewForm && wcHasUnsaved_()) { if (wcViews_) wcViews_.picked(); return; }
    wcLeaveGuard_(function(){
      workShowingNewForm = false;
      workSelectedCaseId = caseId;
      workJumpWidenFilter_ = !!caseId;
      loadWorkCases();
      if (caseId && wcViews_) wcViews_.picked(); // [2026-11-14] 다른 화면에서 사건을 찾아왔으면 목록만 보기여도 그 카드가 보이게
    });
  }

  // [2026.09 버그수정] 하위업무 추가/수정/삭제 후 이 함수(카드 전체 재구성)를 썼더니, 그 사이
  // 입력 중이던(아직 "저장" 안 누른) 상단 폼(고객명·납세자·진행메모 등)이 통째로 날아갔다
  // (실사용 감사에서 확인된 데이터유실 버그) — 상단 폼은 그대로 두고 하위업무 트리와 진행률
  // 배지만 갱신한다. 기존 case 객체를 새 객체로 통째로 교체하면 renderWorkCaseDetail이 각
  // 핸들러(저장 버튼 등)에 캡처해둔 c 참조가 낡은 채로 남아, 다음 "저장" 클릭 시 기대수정일이
  // 옛 값이라 가짜 충돌로 뜰 수 있으므로 — 그 자리에서 필드만 덮어써 참조를 그대로 유지한다.
  function applySubtaskUpdate_(caseObj, warning){
    var existing = workCases.filter(function(c){ return c.id === caseObj.id; })[0];
    if (existing) Object.assign(existing, caseObj); else { existing = caseObj; workCases.push(existing); }
    renderWorkCaseList();
    var tree = document.getElementById('wcTree');
    if (tree) { renderWorkTree(existing.하위업무 || [], tree, existing.id, 0); if (typeof enhanceDateInputs === 'function') enhanceDateInputs(tree); }
    var toggle = document.getElementById('wcAddRootToggle');
    if (toggle) toggle.textContent = '하위업무 ' + workProgress(existing).done + ' / ' + workProgress(existing).total;
    if (warning) showToast(warning, 'warning');
  }

  // [2026.09 버그수정] 실사용 시뮬레이션 중 발견 — applySubtaskUpdate_로 바꾸면서(카드 전체
  // 재구성 대신 트리만 갱신) "새 하위업무" 입력폼이 예전엔 전체 재구성 때 자동으로 닫히던
  // 것이 이제 안 닫히고 방금 넣은 값 그대로 계속 열려 있었다 — 성공 콜백으로 직접 닫아준다.
  // [2026.11.03] 세무사님 "답답해서 사용하지 못하는 일이 생기면 안된다" — 추가·지우기도 화면에 먼저(번호는 화면이 만들어 두 번 가도 한 번만), 서버는 보낼 함으로 뒤에서.
  function wsFindNode_(caseObj, nodeId){
    var hit = null;
    (function walk(nodes, parent){ (nodes || []).forEach(function(n, i){ if (hit) return; if (n.id === nodeId) hit = { list: nodes, idx: i, node: n }; else walk(n.children, n); }); })(caseObj && caseObj.하위업무);
    return hit;
  }
  function wsSubDone_(caseId){
    return function(res){
      if (!res || !res.case) return;
      var tree = document.getElementById('wcTree');
      if (tree && tree.contains(document.activeElement)){ var ex = workCases.filter(function(c){ return c.id === caseId; })[0]; if (ex) ex.수정일 = res.case.수정일; if (res.warning) showToast(res.warning, 'warning'); return; }
      applySubtaskUpdate_(res.case, res.warning);
    };
  }
  function addWorkSubtask(caseId, parentId, title, dueDate, onSuccess){
    if (!title){ showToast('항목 이름을 입력해주세요.', 'warning'); return; }
    var existing = workCases.filter(function(c){ return c.id === caseId; })[0];
    var nodeId = nxNewId_();
    var newNode = { id: nodeId, title: title, status: '대기', assignee: '', dueDate: dueDate || '', children: [] };
    if (existing){
      if (!Array.isArray(existing.하위업무)) existing.하위업무 = [];
      var parent = parentId ? wsFindNode_(existing, parentId) : null;
      if (parent){ if (!Array.isArray(parent.node.children)) parent.node.children = []; parent.node.children.push(newNode); }
      else existing.하위업무.push(newNode);
      applySubtaskUpdate_(existing);
    }
    if (typeof onSuccess === 'function') onSuccess();
    nxSaveLater_('work_add_subtask', { id: caseId, parentId: parentId, title: title, dueDate: dueDate, nodeId: nodeId }, { key: 'sub_' + caseId,
      label: '하위업무 ' + String(title).slice(0, 20) + ' 추가',
      onDone: wsSubDone_(caseId),
      onFail: function(){ if (!existing) return; var h = wsFindNode_(existing, nodeId); if (h){ h.list.splice(h.idx, 1); applySubtaskUpdate_(existing); } },
      redo: function(){ if (!existing || wsFindNode_(existing, nodeId)) return; var pr = parentId ? wsFindNode_(existing, parentId) : null; if (pr){ if (!Array.isArray(pr.node.children)) pr.node.children = []; pr.node.children.push(newNode); } else existing.하위업무.push(newNode); applySubtaskUpdate_(existing); } });
  }

  // [2026.11.03] 보낼 함(script.html nxSaveLater_) — 상태·이름·기한 고침은 화면에 먼저 적고 서버엔 뒤에서(같은 사건은 차례로).
  //  서버 답이 오면 그 사건 값으로 맞추되, 세무사님이 하위업무 칸에 손대는 중이면 트리를 다시 그리지 않는다(쓰던 칸이 날아가지 않게).
  function updateWorkSubtask(caseId, nodeId, fields){
    var existing = workCases.filter(function(c){ return c.id === caseId; })[0];
    var node = null;
    (function walk(nodes){ (nodes || []).forEach(function(n){ if (n.id === nodeId) node = n; else walk(n.children); }); })(existing && existing.하위업무);
    var before = node ? Object.assign({}, node) : null;
    if (node){ Object.assign(node, fields); renderWorkCaseList(); var tg = document.getElementById('wcAddRootToggle'); if (tg) tg.textContent = '하위업무 ' + workProgress(existing).done + ' / ' + workProgress(existing).total; }
    nxSaveLater_('work_update_subtask', Object.assign({ id: caseId, nodeId: nodeId }, fields), { key: 'sub_' + caseId,
      label: '하위업무 ' + String((node && node.title) || '').slice(0, 20) + ' 고침',
      onDone: function(res){
        if (!res.case) return;
        var tree = document.getElementById('wcTree');
        if (tree && tree.contains(document.activeElement)){ var ex = workCases.filter(function(c){ return c.id === caseId; })[0]; if (ex) ex.수정일 = res.case.수정일; if (res.warning) showToast(res.warning, 'warning'); return; }
        applySubtaskUpdate_(res.case, res.warning);
      },
      onFail: function(){ if (node && before){ Object.keys(fields).forEach(function(k){ node[k] = before[k]; }); applySubtaskUpdate_(existing); } },
      redo: function(){ if (node){ Object.assign(node, fields); applySubtaskUpdate_(existing); } } });
  }

  function deleteWorkSubtask(caseId, nodeId){
    var existing = workCases.filter(function(c){ return c.id === caseId; })[0];
    var h = wsFindNode_(existing, nodeId), removed = null, at = -1, list = null;
    if (h){ list = h.list; at = h.idx; removed = list.splice(at, 1)[0]; applySubtaskUpdate_(existing); }
    nxSaveLater_('work_delete_subtask', { id: caseId, nodeId: nodeId }, { key: 'sub_' + caseId,
      label: '하위업무 ' + String((removed && removed.title) || '').slice(0, 20) + ' 지우기',
      onDone: wsSubDone_(caseId),
      onFail: function(){ if (removed && list){ list.splice(Math.min(at, list.length), 0, removed); applySubtaskUpdate_(existing); } },
      redo: function(){ if (removed && list){ var k = list.indexOf(removed); if (k >= 0){ list.splice(k, 1); applySubtaskUpdate_(existing); } } } });
  }

  document.getElementById('btnWorkCaseNew').addEventListener('click', function(){ renderNewCaseForm(); }); // [2026-11-14] 묻기는 renderNewCaseForm 안에서
  wcViews_ = nxSplitViews_({ key: 'work', viewId: 'view-workmanage', noun: '사건', selectedId: function(){ return workSelectedCaseId; }, open: wcOpenCase_ });
  workCaseFilterStatus.addEventListener('change', renderWorkCaseList);
  workCaseSearchInput.addEventListener('input', renderWorkCaseList);
</script>
