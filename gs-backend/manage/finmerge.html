<!-- [2026.11.20] 💰 금융거래 합치기(1단계) — 세무사님 11-20 「권장대로 하자」(docs/_기록/금융거래_10년검토_계획서_20261120.html)
     세무사님 원문: "1단계로 의뢰인으로 부터 받은 다양한 금융기관의 거래내역을 하나의 파일로 합치는 것" / "일단 1단계만 하자"
     사건 머리줄 「💰 금융거래 합치기」(상속 사건) → 이 창. 사건 폴더의 은행 원시파일(엑셀·PDF·사진·압축)을 골라 금융거래 서버(gs-fin)가
     사건 폴더의 구글 시트 「금융거래_통합_…」 하나로 합친다. 넥스 도구 bank_merge도 같은 서버·같은 함수(공통원칙 1절 — 넥스 전용 길 없음).
     CSV(세무사님 변환본)·사건 맨 위 합본은 기본 꺼짐. 서버는 한 번에 4분 30초까지 읽고, 다 될 때까지 이 창이 다시 부른다. -->
<style>
  .fm-back[hidden], .fm-back [hidden]{ display:none !important; } /* 아래 display 규칙이 hidden을 덮어쓰지 않게(11-20 시험에서 창이 처음부터 떠 있고 닫기가 안 먹던 것) */
  .fm-back{ position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:9000; display:flex; align-items:flex-start; justify-content:center; padding:4vh 10px; overflow:auto; }
  .fm-box{ background:var(--bg, #fff); color:var(--text, #222); border-radius:10px; width:min(980px, 100%); max-width:100%; box-shadow:0 8px 30px rgba(0,0,0,.25); padding:14px 16px; box-sizing:border-box; }
  .fm-head{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .fm-head h3{ margin:0; font-size:16px; flex:1 1 auto; }
  .fm-tabs{ display:flex; gap:4px; margin-bottom:8px; }
  .fm-tabs button{ border:1px solid var(--line, #ddd); background:var(--panel, #f6f7f9); border-radius:6px; padding:4px 10px; font:inherit; font-size:13px; cursor:pointer; }
  .fm-tabs button.on{ background:#1f6feb; color:#fff; border-color:#1f6feb; }
  .fm-row{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:6px 0; font-size:13px; }
  .fm-grid-wrap{ overflow:auto; max-height:46vh; border:1px solid var(--line, #ddd); border-radius:8px; }
  .fm-grid{ border-collapse:collapse; font-size:12.5px; width:100%; table-layout:fixed; min-width:560px; }
  .fm-grid th, .fm-grid td{ border-bottom:1px solid var(--line, #eee); padding:4px 6px; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fm-grid th{ position:sticky; top:0; background:var(--panel, #f6f7f9); font-weight:600; }
  .fm-grid td.num{ text-align:right; }
  .fm-sub{ font-size:12px; color:var(--sub, #666); }
  .fm-bar{ height:8px; background:var(--line, #e5e7eb); border-radius:4px; overflow:hidden; flex:1 1 200px; }
  .fm-bar > i{ display:block; height:100%; width:0; background:#1f6feb; transition:width .3s; }
  .fm-warn{ color:#b35900; }
  .fm-ok{ color:#1a7f37; }
  .fm-nf{ border:1px solid #f0c36d; background:#fffaf0; border-radius:8px; padding:8px; margin:8px 0; }
  .fm-nf select{ font-size:12px; }
</style>
<div class="fm-back" id="fmBack" hidden>
  <div class="fm-box" role="dialog" aria-modal="true" aria-labelledby="fmTitle">
    <div class="fm-head">
      <h3 id="fmTitle">💰 금융거래 합치기</h3>
      <button type="button" class="ghost-btn sm" id="fmClose">닫기</button>
    </div>
    <div class="fm-tabs"><button type="button" class="on" data-fm-tab="merge">합치기</button><button type="button" data-fm-tab="fmt">은행 서식표</button></div>
    <div id="fmMerge">
      <div class="fm-row fm-sub" id="fmCaseLine"></div>
      <div class="fm-row">
        <span>사건 암호(암호 걸린 은행 엑셀·압축)</span>
        <input type="password" id="fmPw" autocomplete="off" placeholder="없으면 비워 둠" style="width:160px">
        <button type="button" class="ghost-btn sm" id="fmPwSave">적어 두기</button>
        <span class="fm-sub" id="fmPwState"></span>
      </div>
      <div class="fm-grid-wrap"><table class="fm-grid" id="fmFiles"><colgroup><col style="width:34px"><col><col style="width:80px"><col style="width:240px"></colgroup>
        <thead><tr><th></th><th>파일(사건 폴더 안 자리)</th><th>크기</th><th>기본으로 끈 까닭</th></tr></thead><tbody></tbody></table></div>
      <div class="fm-row">
        <span class="fm-sub" id="fmPicked"></span>
        <span style="flex:1"></span>
        <label class="fm-sub"><input type="checkbox" id="fmRestart"> 읽은 기억 버리고 처음부터</label>
        <button type="button" class="save-btn sm" id="fmRun">합치기</button>
      </div>
      <div class="fm-row" id="fmProg" hidden><div class="fm-bar"><i id="fmBarIn"></i></div><span class="fm-sub" id="fmProgTxt"></span></div>
      <div id="fmResult"></div>
    </div>
    <div id="fmFmt" hidden>
      <div class="fm-row fm-sub">은행이 내려주는 서식마다 원본 칸 → 장부 칸 짝입니다. 한 번 정해 두면 다음 사건부터 묻지 않습니다. 「첫 판」은 11-20 고객사건 폴더 조사로 넣은 것이고, 고쳐 저장하면 서식표 파일(업무관리자)에 남습니다.</div>
      <div id="fmFmtList"></div>
      <div class="fm-row"><span style="flex:1"></span><button type="button" class="save-btn sm" id="fmFmtSave">서식표 저장</button></div>
    </div>
  </div>
</div>
<script>
(function(){
  // 금융거래 서버 배포 주소(gs-fin/README.md) — 첫 배포 뒤 적는다. 비어 있으면 「아직 올라가지 않음」으로 알린다
  var FM_URL = 'https://script.google.com/macros/s/AKfycbwut0DS0v2KwV7VZZkeZ_Xz73VfHELrlxbolYY0Q2QIsU57RmZokDcGQ8SMxJxp7psIoQ/exec';
  var FM_TARGETS = ['거래일자','거래시간','거래일시','입금','출금','금액','입출구분','잔액','내용','상대','상대은행','상대계좌','거래구분','거래점','메모'];
  var FM = { caseId: '', files: [], formats: [], newFormats: [], busy: false };
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return typeof escapeHtml === 'function' ? escapeHtml(s) : String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); };
  var won = function(n){ return n == null || n === '' ? '' : Number(n).toLocaleString('ko-KR'); };
  function fmCall(action, payload, timeoutMs){
    if (!FM_URL) return Promise.reject(new Error('금융거래 서버가 아직 올라가지 않았습니다(배포 주소 없음).'));
    var tok = null; try { tok = sessionStorage.getItem('nxManageSessionToken'); } catch (e) {}
    if (!tok) return Promise.reject(new Error('로그인이 필요합니다.'));
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null, timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, timeoutMs || 60000) : null;
    return fetch(FM_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctrl ? ctrl.signal : undefined,
      body: JSON.stringify({ __manageBatch: [{ fn: 'manageApp_call', args: [action, payload || {}, tok] }] }) })
      .then(function(res){ return res.text(); })
      .then(function(t){
        clearTimeout(timer);
        var d = null; try { d = JSON.parse(t); } catch (e) {}
        var r = d && Array.isArray(d.__results) ? d.__results[0] : null;
        if (!r) throw new Error((d && d.error) || '금융거래 서버 응답 이상');
        if (r.error) throw new Error(r.error);
        if (r.__result && r.__result.error) throw new Error(r.__result.error);
        return r.__result;
      }, function(err){ clearTimeout(timer); throw err; });
  }
  function fmToast(msg, kind){ if (typeof showToast === 'function') showToast(msg, kind || 'info'); }
  function fmOpen(caseId, caseName, tab){
    FM.caseId = caseId || ''; FM.newFormats = [];
    $('fmBack').hidden = false; $('fmResult').innerHTML = ''; $('fmProg').hidden = true;
    $('fmTitle').textContent = '💰 금융거래 합치기' + (caseName ? ' — ' + caseName : '');
    fmTab(tab || (caseId ? 'merge' : 'fmt'));
    if (caseId) fmLoadFiles();
  }
  function fmTab(t){
    Array.prototype.forEach.call(document.querySelectorAll('[data-fm-tab]'), function(b){ b.classList.toggle('on', b.getAttribute('data-fm-tab') === t); });
    $('fmMerge').hidden = t !== 'merge'; $('fmFmt').hidden = t !== 'fmt';
    if (t === 'fmt') fmLoadFormats();
  }
  function fmLoadFiles(){
    var tb = $('fmFiles').querySelector('tbody'); tb.innerHTML = '<tr><td colspan="4" class="fm-sub">사건 폴더 파일을 읽는 중…</td></tr>';
    fmCall('fin_merge_list', { caseId: FM.caseId }, 90000).then(function(r){
      FM.files = r.파일 || [];
      $('fmCaseLine').innerHTML = '폴더 「' + esc(r.사건 && r.사건.폴더) + '」 · 파일 ' + FM.files.length + '개' + (r.지난결과 ? ' · 지난 결과 <a href="' + esc(r.지난결과.url) + '" target="_blank" rel="noopener">' + esc(r.지난결과.name) + '</a>(' + esc(r.지난결과.at) + ')' : '');
      $('fmPwState').textContent = r.암호있음 ? '적어 둔 암호 있음' : '';
      fmDrawFiles();
    }, function(err){ tb.innerHTML = '<tr><td colspan="4" class="fm-warn">' + esc(err.message) + '</td></tr>'; });
  }
  function fmDrawFiles(){
    var tb = $('fmFiles').querySelector('tbody');
    var sz = function(n){ return n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; };
    tb.innerHTML = FM.files.map(function(f, i){
      return '<tr><td><input type="checkbox" data-fm-i="' + i + '"' + (f.on ? ' checked' : '') + '></td><td title="' + esc(f.path) + '">' + esc(f.path) + '</td><td>' + sz(f.size || 0) + '</td><td class="fm-sub" title="' + esc(f.why) + '">' + esc(f.why || '') + '</td></tr>';
    }).join('') || '<tr><td colspan="4" class="fm-sub">파일이 없습니다.</td></tr>';
    Array.prototype.forEach.call(tb.querySelectorAll('input[data-fm-i]'), function(cb){ cb.checked = !!FM.files[Number(cb.getAttribute('data-fm-i'))].on; });
    fmPickedLine();
  }
  function fmPickedLine(){ $('fmPicked').textContent = '고른 파일 ' + FM.files.filter(function(f){ return f.on; }).length + '개'; }
  function fmRun(){
    if (FM.busy) return;
    var ids = FM.files.filter(function(f){ return f.on; }).map(function(f){ return f.id; });
    if (!ids.length){ fmToast('합칠 파일을 골라 주세요', 'warn'); return; }
    FM.busy = true; $('fmRun').disabled = true; $('fmResult').innerHTML = ''; $('fmProg').hidden = false;
    var restart = $('fmRestart').checked, t0 = Date.now();
    var step = function(){
      $('fmProgTxt').textContent = '읽는 중…';
      fmCall('fin_merge_run', { caseId: FM.caseId, fileIds: ids, restart: restart, budgetMs: 270000 }, 340000).then(function(r){
        restart = false;
        var pct = r.done ? 100 : Math.round(100 * (r.읽음 || 0) / Math.max(1, r.전체 || 1));
        $('fmBarIn').style.width = pct + '%';
        $('fmProgTxt').textContent = r.done ? '다 됨 · ' + Math.round((Date.now() - t0) / 1000) + '초' : '파일 ' + r.읽음 + ' / ' + r.전체 + (r.남은일 ? ' · ' + r.남은일 : '') + ' — 이어서 읽는 중';
        if (!r.done) { step(); return; }
        FM.busy = false; $('fmRun').disabled = false; fmShow(r);
      }, function(err){ FM.busy = false; $('fmRun').disabled = false; $('fmProgTxt').innerHTML = '<span class="fm-warn">' + esc(err.message) + '</span> — 다시 누르면 읽은 파일은 건너뛰고 이어 갑니다'; });
    };
    step();
  }
  function fmShow(r){
    var h = '<div class="fm-row"><b class="fm-ok">합친 시트:</b> <a href="' + esc(r.시트.url) + '" target="_blank" rel="noopener">' + esc(r.시트.name) + '</a>'
      + ' <span class="fm-sub">· 계좌 ' + (r.계좌 || []).length + '개 · 거래 ' + won(r.거래줄) + '줄 · 겹쳐서 한 번만 센 줄 ' + won(r.겹친줄) + ' · 확인할 것 ' + won(r.확인수) + '</span></div>';
    h += '<div class="fm-grid-wrap" style="max-height:30vh"><table class="fm-grid" style="min-width:820px"><colgroup><col style="width:70px"><col style="width:150px"><col style="width:70px"><col style="width:170px"><col style="width:60px"><col style="width:110px"><col style="width:110px"><col style="width:110px"><col style="width:60px"></colgroup>'
      + '<thead><tr><th>기관</th><th>계좌</th><th>예금주</th><th>자료 기간</th><th>줄</th><th>입금 합계</th><th>출금 합계</th><th>끝 잔액</th><th>검산 ⚠</th></tr></thead><tbody>'
      + (r.계좌 || []).map(function(a){ return '<tr><td>' + esc(a.기관) + '</td><td>' + esc(a.계좌) + '</td><td>' + esc(a.예금주) + '</td><td>' + esc(a.기간) + '</td><td class="num">' + won(a.줄) + '</td><td class="num">' + won(a.입금합계) + '</td><td class="num">' + won(a.출금합계) + '</td><td class="num">' + won(a.끝잔액) + '</td><td class="num' + (a.검산틀림 ? ' fm-warn' : '') + '">' + (a.검산틀림 || '') + '</td></tr>'; }).join('')
      + '</tbody></table></div>';
    if ((r.확인 || []).length) h += '<div class="fm-row fm-sub">확인할 것(앞 ' + Math.min(12, r.확인.length) + '개 — 전부는 시트 「확인할 것」 탭): ' + r.확인.slice(0, 12).map(function(c){ return '<span class="fm-warn">[' + esc(c.종류) + ']</span> ' + esc(c.파일) + ' — ' + esc(String(c.내용).slice(0, 80)); }).join(' / ') + '</div>';
    FM.newFormats = r.새서식 || [];
    if (FM.newFormats.length) h += '<div id="fmNfHost"></div>';
    $('fmResult').innerHTML = h;
    if (FM.newFormats.length) fmDrawNewFormats();
  }
  // 처음 보는 서식 — 짐작한 짝을 보여 드리고 한 번 정해 받아 서식표에 더한다(다음 사건부터 묻지 않음)
  function fmDrawNewFormats(){
    var host = $('fmNfHost'); if (!host) return;
    host.innerHTML = FM.newFormats.map(function(nf, k){
      return '<div class="fm-nf" data-fm-nf="' + k + '"><div class="fm-row"><b>처음 보는 서식</b> <span class="fm-sub">예: ' + esc(nf.예파일) + '</span> · 이름 <input type="text" data-fm-nfid value="' + esc((nf.기관 || '은행') + '_' + nf.key) + '" style="width:200px"> 기관 <input type="text" data-fm-nforg value="' + esc(nf.기관 || '') + '" style="width:80px"></div>'
        + '<div class="fm-grid-wrap" style="max-height:24vh"><table class="fm-grid" style="min-width:420px"><thead><tr><th>원본 칸</th><th>장부 칸(짐작 — 고쳐 주세요)</th></tr></thead><tbody>'
        + nf.머리글.map(function(h){ return '<tr><td>' + esc(h) + '</td><td><select data-fm-h="' + esc(h) + '">' + fmOpts(nf.짝[h] || '') + '</select></td></tr>'; }).join('')
        + '</tbody></table></div><div class="fm-row"><span style="flex:1"></span><button type="button" class="save-btn sm" data-fm-nfsave="' + k + '">이 짝으로 서식표에 등록하고 다시 합치기</button></div></div>';
    }).join('');
  }
  function fmOpts(cur){ return '<option value="">원본 칸(그대로 모음)</option>' + FM_TARGETS.map(function(t){ return '<option' + (t === cur ? ' selected' : '') + '>' + t + '</option>'; }).join(''); }
  function fmLoadFormats(){
    $('fmFmtList').innerHTML = '<div class="fm-sub">서식표를 읽는 중…</div>';
    return fmCall('fin_formats_get', {}, 60000).then(function(r){ FM.formats = r.서식 || []; fmDrawFormats(); return FM.formats; },
      function(err){ $('fmFmtList').innerHTML = '<div class="fm-warn">' + esc(err.message) + '</div>'; throw err; });
  }
  function fmDrawFormats(){
    $('fmFmtList').innerHTML = FM.formats.map(function(fm, k){
      return '<details class="fm-nf" style="background:transparent;border-color:var(--line,#ddd)" data-fm-f="' + k + '"><summary><b>' + esc(fm.id) + '</b> <span class="fm-sub">· ' + esc(fm.기관 || '') + ' · ' + esc(fm.출처 || '') + ' · 칸 ' + fm.머리글.length + '</span></summary>'
        + '<div class="fm-grid-wrap" style="max-height:30vh;margin-top:6px"><table class="fm-grid" style="min-width:420px"><thead><tr><th>원본 칸</th><th>장부 칸</th></tr></thead><tbody>'
        + fm.머리글.map(function(h){ return '<tr><td>' + esc(h) + '</td><td><select data-fm-h="' + esc(h) + '">' + fmOpts(fm.짝[h] || '') + '</select></td></tr>'; }).join('')
        + '</tbody></table></div></details>';
    }).join('');
  }
  function fmCollect(box){ var m = {}; Array.prototype.forEach.call(box.querySelectorAll('select[data-fm-h]'), function(s){ if (s.value) m[s.getAttribute('data-fm-h')] = s.value; }); return m; }
  // 저장은 서식표 파일에 둘 것만(첫 판과 같은 것은 빼고 — 첫 판을 고친 것·새 서식만)
  function fmSaveFormats(list){
    return fmCall('fin_formats_save', { formats: list }, 60000).then(function(r){ fmToast('서식표 저장 — ' + r.서식수 + '가지', 'success'); return r; });
  }
  function fmFormatsToSave(){
    return FM.formats.map(function(fm, k){ var box = document.querySelector('[data-fm-f="' + k + '"]'); var m = box ? fmCollect(box) : fm.짝; var changed = JSON.stringify(m) !== JSON.stringify(fm.짝); return (fm.출처 !== '첫 판' || changed) ? { id: fm.id, 기관: fm.기관, 제목: fm.제목, 머리글: fm.머리글, 짝: m } : null; }).filter(Boolean);
  }
  document.addEventListener('click', function(e){
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.id === 'fmClose' || t.id === 'fmBack') { if (FM.busy && !confirm('합치는 중입니다. 창을 닫아도 서버는 지금 묶음까지 읽고, 다시 열어 합치기를 누르면 이어 갑니다. 닫을까요?')) return; $('fmBack').hidden = true; return; }
    var tb = t.closest('[data-fm-tab]'); if (tb) { fmTab(tb.getAttribute('data-fm-tab')); return; }
    if (t.id === 'fmRun') { fmRun(); return; }
    if (t.id === 'fmPwSave') {
      fmCall('fin_pw_set', { caseId: FM.caseId, pw: $('fmPw').value }, 60000).then(function(r){ $('fmPw').value = ''; $('fmPwState').textContent = r.암호있음 ? '적어 둔 암호 있음' : '암호 지움'; fmToast(r.암호있음 ? '사건 암호를 적어 두었습니다(시트·기록엔 남지 않음)' : '사건 암호를 지웠습니다', 'success'); }, function(err){ fmToast(err.message, 'error'); });
      return;
    }
    if (t.id === 'fmFmtSave') { fmSaveFormats(fmFormatsToSave()).then(fmLoadFormats, function(err){ fmToast(err.message, 'error'); }); return; }
    var ns = t.getAttribute && t.getAttribute('data-fm-nfsave');
    if (ns != null) {
      var box = document.querySelector('[data-fm-nf="' + ns + '"]'), nf = FM.newFormats[Number(ns)];
      var item = { id: box.querySelector('[data-fm-nfid]').value.trim(), 기관: box.querySelector('[data-fm-nforg]').value.trim(), 제목: '', 머리글: nf.머리글, 짝: fmCollect(box) };
      t.disabled = true;
      fmLoadFormats().then(function(){ return fmSaveFormats(fmFormatsToSave().filter(function(x){ return x.id !== item.id; }).concat([item])); })
        .then(function(){ fmTab('merge'); fmRun(); }, function(err){ t.disabled = false; fmToast(err.message, 'error'); });
    }
  });
  document.addEventListener('change', function(e){
    var cb = e.target; if (!cb || !cb.getAttribute) return;
    var i = cb.getAttribute('data-fm-i'); if (i == null) return;
    FM.files[Number(i)].on = cb.checked; fmPickedLine();
  });
  window.nxFinMergeOpen_ = fmOpen;
})();
</script>
