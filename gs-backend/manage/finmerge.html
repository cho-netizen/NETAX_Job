<!-- [2026.11.20] 💰 금융거래(1단계 결과 보기) — 세무사님 11-20 「권장대로 하자」(docs/_기록/금융거래_10년검토_계획서_20261120.html)
     세무사님 원문: "1단계로 의뢰인으로 부터 받은 다양한 금융기관의 거래내역을 하나의 파일로 합치는 것" / "일단 1단계만 하자"
     세무사님 11-20 "1단계 금융거래내역을 분석할 수 있는 준비상태로 만드는 것은 그냥 자동으로 gas가 하는 것이지 따로 명령하는 것이 아니다" → "맞다 고쳐라"
     합치기는 job 서버 1분 틱이 저절로 한다(진행 중 상속 사건 폴더가 바뀌면 바로, 30분마다 전부 — gs-backend/FinProxy.js). 이 창은 명령 없이
     합친 결과(시트·계좌·확인할 것)·파일마다 다룬 것을 보여 주고, 세무사님만 정할 수 있는 것(사건 암호·처음 보는 서식의 칸 짝)을 받는다 —
     정하면 금융거래 서버가 그 사건을 바로 다시 합친다. 넥스 도구 bank_merge도 같은 결과를 읽는다. -->

<div class="fm-back" id="fmBack" hidden>

<script>
(function(){
  // 금융거래 서버 배포 주소(gs-fin/README.md) — 첫 배포 뒤 적는다. 비어 있으면 「아직 올라가지 않음」으로 알린다
  var FM_URL = 'https://script.google.com/macros/s/AKfycbwut0DS0v2KwV7VZZkeZ_Xz73VfHELrlxbolYY0Q2QIsU57RmZokDcGQ8SMxJxp7psIoQ/exec';
  var FM_TARGETS = ['거래일자','거래시간','거래일시','입금','출금','금액','입출구분','잔액','내용','상대','상대은행','상대계좌','거래구분','거래점','메모'];
  var FM = { caseId: '', files: [], formats: [], newFormats: [], busy: false };
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return typeof escapeHtml === 'function' ? escapeHtml(s) : String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); };
  var won = function(n){ return n == null || n === '' ? '' : Number(n).toLocaleString('ko-KR'); };
  function fmCall(action, payload, timeoutMs){
    if (!FM_URL) return Promise.reject(new Error('금융거래 서버가 아직 올라가지 않았습니다(배포 주소 없음).'));
    var tok = null; try { tok = sessionStorage.getItem('nxManageSessionToken'); } catch (e) {}
    if (!tok) return Promise.reject(new Error('로그인이 필요합니다.'));
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null, timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, timeoutMs || 60000) : null;
    return fetch(FM_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctrl ? ctrl.signal : undefined,
      body: JSON.stringify({ __manageBatch: [{ fn: 'manageApp_call', args: [action, payload || {}, tok] }] }) })
      .then(function(res){ return res.text(); })
      .then(function(t){
        clearTimeout(timer);
        var d = null; try { d = JSON.parse(t); } catch (e) {}
        var r = d && Array.isArray(d.__results) ? d.__results[0] : null;
        if (!r) throw new Error((d && d.error) || '금융거래 서버 응답 이상');
        if (r.error) throw new Error(r.error);
        if (r.__result && r.__result.error) throw new Error(r.__result.error);
        return r.__result;
      }, function(err){ clearTimeout(timer); throw err; });
  }
  function fmToast(msg, kind){ if (typeof showToast === 'function') showToast(msg, kind || 'info'); }
  function fmOpen(caseId, caseName, tab){
    FM.caseId = caseId || ''; FM.newFormats = [];
    $('fmBack').hidden = false; $('fmResult').innerHTML = ''; $('fmProg').hidden = true;
    $('fmTitle').textContent = '💰 금융거래' + (caseName ? ' — ' + caseName : '');
    fmTab(tab || (caseId ? 'merge' : 'fmt'));
    if (caseId) fmLoadFiles();
  }
  function fmTab(t){
    Array.prototype.forEach.call(document.querySelectorAll('[data-fm-tab]'), function(b){ b.classList.toggle('on', b.getAttribute('data-fm-tab') === t); });
    $('fmMerge').hidden = t !== 'merge'; $('fmFmt').hidden = t !== 'fmt';
    if (t === 'fmt') fmLoadFormats();
  }
  function fmLoadFiles(){
    var tb = $('fmFiles').querySelector('tbody'); tb.innerHTML = '<tr><td colspan="3" class="fm-sub">사건 폴더 파일을 읽는 중…</td></tr>';
    $('fmResult').innerHTML = '<div class="fm-sub">합친 결과를 읽는 중…</div>';
    return fmCall('fin_merge_list', { caseId: FM.caseId }, 90000).then(function(r){
      FM.files = r.파일 || [];
      var L = r.지난결과;
      $('fmCaseLine').innerHTML = '폴더 「' + esc(r.사건 && r.사건.폴더) + '」 · 파일 ' + FM.files.length + '개 · '
        + (r.최신 ? '<span class="fm-ok">최신</span>' + (L ? ' — ' + esc(L.at) + ' ' + esc(L.by === '자동' ? '저절로 합침' : '합침') : '') : '<span class="fm-warn">폴더·서식표·암호가 바뀌어 곧 저절로 다시 합칩니다(1분 안팎)</span>');
      $('fmPwState').textContent = r.암호있음 ? '적어 둔 암호 있음' : '';
      fmDrawFiles();
      if (L) fmShow({ 시트: { url: L.url, name: L.name }, 계좌: L.계좌, 거래줄: L.rows, 겹친줄: L.겹친줄, 확인: L.확인, 확인수: L.확인수, 새서식: L.새서식, 검토: r.검토 });
      else $('fmResult').innerHTML = '<div class="fm-sub">' + (r.최신 ? '이 사건 폴더에서 은행 거래내역 원시파일을 찾지 못했습니다(엑셀·PDF·사진·압축을 사건 폴더에 넣으면 저절로 합칩니다).' : '아직 합치지 않았습니다 — 곧 저절로 합칩니다.') + '</div>';
    }, function(err){ tb.innerHTML = '<tr><td colspan="3" class="fm-warn">' + esc(err.message) + '</td></tr>'; $('fmResult').innerHTML = ''; });
  }
  function fmDrawFiles(){
    var tb = $('fmFiles').querySelector('tbody');
    var sz = function(n){ return n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; };
    tb.innerHTML = FM.files.map(function(f){
      return '<tr><td title="' + esc(f.path) + '">' + esc(f.path) + '</td><td>' + sz(f.size || 0) + '</td><td class="' + (f.다룸 === '합침' ? 'fm-ok' : 'fm-sub') + '" title="' + esc(f.다룸) + '">' + esc(f.다룸 || '') + '</td></tr>';
    }).join('') || '<tr><td colspan="3" class="fm-sub">파일이 없습니다.</td></tr>';
  }
  // 세무사님이 정한 것(암호·서식)을 저장하면 금융거래 서버가 그 사건을 바로 다시 합친다 — 그동안 알림 한 줄, 끝나면 결과를 다시 읽음
  function fmBusy(on, msg){ FM.busy = on; $('fmProg').hidden = !on; $('fmProgTxt').textContent = msg || ''; }
  function fmShow(r){
    var h = '<div class="fm-row"><b class="fm-ok">합친 시트:</b> <a href="' + esc(r.시트.url) + '" target="_blank" rel="noopener">' + esc(r.시트.name) + '</a>'
      + ' <span class="fm-sub">· 계좌 ' + (r.계좌 || []).length + '개 · 거래 ' + won(r.거래줄) + '줄 · 겹쳐서 한 번만 센 줄 ' + won(r.겹친줄) + ' · 확인할 것 ' + won(r.확인수) + '</span></div>';
    h += '<div class="fm-grid-wrap" style="max-height:30vh"><table class="fm-grid" style="min-width:1040px"><colgroup><col style="width:70px"><col style="width:150px"><col style="width:70px"><col style="width:170px"><col style="width:60px"><col style="width:110px"><col style="width:110px"><col style="width:110px"><col style="width:60px"><col style="width:220px"></colgroup>'
      + '<thead><tr><th>기관</th><th>계좌</th><th>예금주</th><th>자료 기간</th><th>줄</th><th>입금 합계</th><th>출금 합계</th><th>끝 잔액</th><th>검산 ⚠</th><th>참고</th></tr></thead><tbody>'
      + (r.계좌 || []).map(function(a){ return '<tr><td>' + esc(a.기관) + '</td><td>' + esc(a.계좌) + '</td><td>' + esc(a.예금주) + '</td><td>' + esc(a.기간) + '</td><td class="num">' + won(a.줄) + '</td><td class="num">' + won(a.입금합계) + '</td><td class="num">' + won(a.출금합계) + '</td><td class="num">' + won(a.끝잔액) + '</td><td class="num' + (a.검산틀림 ? ' fm-warn' : '') + '">' + (a.검산틀림 || '') + '</td><td class="fm-sub" title="' + esc(a.참고 || '') + '" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(a.참고 || '') + '</td></tr>'; }).join('')
      + '</tbody></table></div>';
    if ((r.확인 || []).length) h += '<div class="fm-row fm-sub">확인할 것(앞 ' + Math.min(12, r.확인.length) + '개 — 전부는 시트 「확인할 것」 탭): ' + r.확인.slice(0, 12).map(function(c){ return '<span class="fm-warn">[' + esc(c.종류) + ']</span> ' + esc(c.파일) + ' — ' + esc(String(c.내용).slice(0, 80)); }).join(' / ') + '</div>';
    h += fmReview(r.검토);
    FM.newFormats = r.새서식 || [];
    if (FM.newFormats.length) h += '<div id="fmNfHost"></div>';
    $('fmResult').innerHTML = h;
    if (FM.newFormats.length) fmDrawNewFormats();
  }
  // [2026.11.24] 2단계 — 사전증여·추정상속 선제 검토 요약(docs/_기록/금융거래_2단계_분석_계획서_20261124.html). 판단·소명은 시트의 ✎ 칸에서(이 창은 보기만)
  function fmReview(v){
    if (!v) return '<div class="fm-row fm-sub" style="margin-top:8px">2단계(사전증여·추정상속 검토)는 다음 틱에 저절로 셈합니다.</div>';
    var z = v.짚을곳 || {}, h = '<div style="margin-top:10px;border-top:1px solid var(--line,#ddd);padding-top:8px"><div class="fm-row"><b>2단계 — 과세관청이 볼 것을 먼저 추림</b> <span class="fm-sub">' + esc(v.at || '') + ' · 상속개시일 ' + esc(v.상속개시일 || '없음 — 시트 「사건 기준」 탭에 적어 주세요') + '</span></div>';
    h += '<div class="fm-row fm-sub">짚을 곳 — A 자료 빈틈 ' + won(z.A) + ' · B 추정상속 ' + won(z.B) + ' · C 사전증여 ' + won(z.C) + ' · D 큰돈 출처·행방 ' + won(z.D) + ' · 남은 것 ' + won(z.남은것) + ' · 받을 자료 ' + won(v.받을자료) + ' · 관련인 확정 ' + won((v.관련인 || {}).확정) + '/후보 ' + won((v.관련인 || {}).후보) + '</div>';
    (v.추정상속 || []).forEach(function(s){ h += '<div class="fm-row fm-sub">추정상속(§15) ' + esc(s.기간) + ' 안 — 순인출 ' + won(s.순인출) + '원 · ' + (s.기준넘음 ? '<span class="fm-warn">기준 넘음</span>' : '기준 안 넘음') + ' · 소명 ' + won(s.소명액) + ' · 미소명 ' + won(s.미소명) + ' · 추정액 ' + won(s.추정액) + '원</div>'; });
    (v.사전증여 || []).slice(0, 8).forEach(function(s){ h += '<div class="fm-row fm-sub">사전증여(§13) ' + esc(s.관련인) + '(' + esc(s.갈래) + ', ' + esc(s.합산기간) + ') — 나감 ' + won(s.나감) + ' · 들어옴 ' + won(s.들어옴) + ' · 순액 ' + won(s.순액) + '원</div>'; });
    // [2026.11.25] 3단계 — 증감분석·분석대상자·보고서
    var tg = v.분석대상자 || null; if (tg) h += '<div class="fm-row fm-sub">분석대상자 — ① 상속인·특수관계자 ' + won(tg.상속인특수관계자) + ' · ② 주요 거래대상자 ' + won(tg.주요거래대상자) + ' · ③ 살펴볼 ' + won(tg.살펴볼) + ' (시트 「분석대상자」 탭)</div>';
    if ((v.크게줄어든구간 || []).length) h += '<div class="fm-row fm-sub">예금이 크게 줄어든 구간 — ' + v.크게줄어든구간.map(esc).join(' · ') + ' (시트 「증감분석」 탭)</div>';
    if (v.보고서 && v.보고서.url) h += '<div class="fm-row fm-sub">보고서 — <a href="' + esc(v.보고서.url) + '" target="_blank" rel="noopener">' + esc(v.보고서.name) + '</a> (GAS 칸은 저절로 · 의견은 그 아래에)</div>';
    if ((v.큰것 || []).length) h += '<div class="fm-sub" style="margin:4px 0">짚을 곳 큰 것부터(전부는 시트 「짚을 곳」 탭):<ol style="margin:2px 0 0 18px;padding:0">' + v.큰것.slice(0, 8).map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ol></div>';
    return h + '<div class="fm-row fm-sub">판단·소명액·분석대상자 갈래는 시트의 노란 칸(✎)에 적으시면 1~2분 안에 다시 셈합니다(다시 합쳐도 지워지지 않음).</div></div>';
  }
  // 처음 보는 서식 — 짐작한 짝을 보여 드리고 한 번 정해 받아 서식표에 더한다(다음 사건부터 묻지 않음)
  function fmDrawNewFormats(){
    var host = $('fmNfHost'); if (!host) return;
    host.innerHTML = FM.newFormats.map(function(nf, k){
      return '<div class="fm-nf" data-fm-nf="' + k + '"><div class="fm-row"><b>처음 보는 서식</b> <span class="fm-sub">예: ' + esc(nf.예파일) + '</span> · 이름 <input type="text" data-fm-nfid value="' + esc((nf.기관 || '은행') + '_' + nf.key) + '" style="width:200px"> 기관 <input type="text" data-fm-nforg value="' + esc(nf.기관 || '') + '" style="width:80px"></div>'
        + '<div class="fm-grid-wrap" style="max-height:24vh"><table class="fm-grid" style="min-width:420px"><thead><tr><th>원본 칸</th><th>장부 칸(짐작 — 고쳐 주세요)</th></tr></thead><tbody>'
        + nf.머리글.map(function(h){ return '<tr><td>' + esc(h) + '</td><td><select data-fm-h="' + esc(h) + '">' + fmOpts(nf.짝[h] || '') + '</select></td></tr>'; }).join('')
        + '</tbody></table></div><div class="fm-row"><span style="flex:1"></span><button type="button" class="save-btn sm" data-fm-nfsave="' + k + '">이 짝으로 서식표에 등록</button></div></div>';
    }).join('');
  }
  function fmOpts(cur){ return '<option value="">원본 칸(그대로 모음)</option>' + FM_TARGETS.map(function(t){ return '<option' + (t === cur ? ' selected' : '') + '>' + t + '</option>'; }).join(''); }
  function fmLoadFormats(){
    $('fmFmtList').innerHTML = '<div class="fm-sub">서식표를 읽는 중…</div>';
    return fmCall('fin_formats_get', {}, 60000).then(function(r){ FM.formats = r.서식 || []; fmDrawFormats(); return FM.formats; },
      function(err){ $('fmFmtList').innerHTML = '<div class="fm-warn">' + esc(err.message) + '</div>'; throw err; });
  }
  function fmDrawFormats(){
    $('fmFmtList').innerHTML = FM.formats.map(function(fm, k){
      return '<details class="fm-nf" style="background:transparent;border-color:var(--line,#ddd)" data-fm-f="' + k + '"><summary><b>' + esc(fm.id) + '</b> <span class="fm-sub">· ' + esc(fm.기관 || '') + ' · ' + esc(fm.출처 || '') + ' · 칸 ' + fm.머리글.length + '</span></summary>'
        + '<div class="fm-grid-wrap" style="max-height:30vh;margin-top:6px"><table class="fm-grid" style="min-width:420px"><thead><tr><th>원본 칸</th><th>장부 칸</th></tr></thead><tbody>'
        + fm.머리글.map(function(h){ return '<tr><td>' + esc(h) + '</td><td><select data-fm-h="' + esc(h) + '">' + fmOpts(fm.짝[h] || '') + '</select></td></tr>'; }).join('')
        + '</tbody></table></div></details>';
    }).join('');
  }
  function fmCollect(box){ var m = {}; Array.prototype.forEach.call(box.querySelectorAll('select[data-fm-h]'), function(s){ if (s.value) m[s.getAttribute('data-fm-h')] = s.value; }); return m; }
  // 저장은 서식표 파일에 둘 것만(첫 판과 같은 것은 빼고 — 첫 판을 고친 것·새 서식만)
  function fmSaveFormats(list, caseId){
    return fmCall('fin_formats_save', { formats: list, caseId: caseId || '' }, caseId ? 300000 : 60000).then(function(r){ fmToast('서식표 저장 — ' + r.서식수 + '가지', 'success'); return r; });
  }
  function fmFormatsToSave(){
    return FM.formats.map(function(fm, k){ var box = document.querySelector('[data-fm-f="' + k + '"]'); var m = box ? fmCollect(box) : fm.짝; var changed = JSON.stringify(m) !== JSON.stringify(fm.짝); return (fm.출처 !== '첫 판' || changed) ? { id: fm.id, 기관: fm.기관, 제목: fm.제목, 머리글: fm.머리글, 짝: m } : null; }).filter(Boolean);
  }
  document.addEventListener('click', function(e){
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.id === 'fmClose' || t.id === 'fmBack') { $('fmBack').hidden = true; return; } // 다시 합치기는 서버가 하므로 창을 닫아도 그대로 이어 감
    var tb = t.closest('[data-fm-tab]'); if (tb) { fmTab(tb.getAttribute('data-fm-tab')); return; }
    if (t.id === 'fmPwSave') {
      fmBusy(true, '암호를 적어 두고 이 사건을 다시 합치는 중…');
      fmCall('fin_pw_set', { caseId: FM.caseId, pw: $('fmPw').value }, 300000).then(function(r){ $('fmPw').value = ''; fmBusy(false); $('fmPwState').textContent = r.암호있음 ? '적어 둔 암호 있음' : '암호 지움'; fmToast(r.암호있음 ? '사건 암호를 적어 두었습니다(시트·기록엔 남지 않음)' : '사건 암호를 지웠습니다', 'success'); fmLoadFiles(); }, function(err){ fmBusy(false); fmToast(err.message, 'error'); });
      return;
    }
    if (t.id === 'fmFmtSave') { fmSaveFormats(fmFormatsToSave()).then(fmLoadFormats, function(err){ fmToast(err.message, 'error'); }); return; }
    var ns = t.getAttribute && t.getAttribute('data-fm-nfsave');
    if (ns != null) {
      var box = document.querySelector('[data-fm-nf="' + ns + '"]'), nf = FM.newFormats[Number(ns)];
      var item = { id: box.querySelector('[data-fm-nfid]').value.trim(), 기관: box.querySelector('[data-fm-nforg]').value.trim(), 제목: '', 머리글: nf.머리글, 짝: fmCollect(box) };
      t.disabled = true;
      fmBusy(true, '서식표에 등록하고 이 사건을 다시 합치는 중…');
      fmLoadFormats().then(function(){ return fmSaveFormats(fmFormatsToSave().filter(function(x){ return x.id !== item.id; }).concat([item]), FM.caseId); })
        .then(function(){ fmBusy(false); fmTab('merge'); fmLoadFiles(); }, function(err){ fmBusy(false); t.disabled = false; fmToast(err.message, 'error'); });
    }
  });
  window.nxFinMergeOpen_ = fmOpen;
})();
</script>
