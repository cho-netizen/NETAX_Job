<!-- [2026-11-25] 📱 영수증 문자 — 「1 상담사건」 폴더의 현금영수증 PDF를 고객 휴대폰에 사진 문자로 보내고, 보내는 순간 수금관리에 적는다.
     세무사님 원문: "단순 상담고객에게 현금영수증을 보내주어야 하는데, 문자메시지로 보내주어야 한다 … 넥스시스템에서 직접 보내주는 것을 구현해 달라"
     / "현금영수증을 발급하여 폴더에 저장하고 나서 문자메시지를 보내주어야 하는데, 수금관리에는 바로 보이지 않잖아?" → "그렇게 하자" → "권장대로 하자"
     계획서 docs/_기록/현금영수증_사진문자_계획서_20261125.html(둘째 판). 서버는 gs-backend/ReceiptSms.js.
     차례: 목록(최근 저장한 것부터) → 고르면 판독·번호·영수증 그림(첫 쪽을 JPG로, 빈 여백 잘라 200KB 안) → [보내기] → 문자 + 수금 기록.
     단추 자리: 대시보드 「최근수금」 카드, 수금 화면 위쪽(계획서 ㉠). 만든 그림은 폴더에 남기지 않는다(㉡ — 남기면 수금이 두 번 잡힐 수 있음). -->
<style>
  .rs-back[hidden]{ display:none !important; }
  .rs-back{ position:fixed; inset:0; background:rgba(13,27,61,.55); z-index:9000; display:flex; align-items:flex-start; justify-content:center; padding:4vh 10px; overflow:auto; }
  .rs-box{ background:var(--panel, #fff); color:var(--ink, #222); border-radius:10px; width:min(560px, 100%); box-shadow:0 8px 30px rgba(0,0,0,.25); padding:14px 16px; box-sizing:border-box; }
  .rs-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .rs-head h3{ margin:0; font-size:16px; flex:1 1 auto; }
  .rs-x{ cursor:pointer; font-size:18px; padding:0 4px; }
  .rs-list{ border:1px solid var(--line, #ddd); border-radius:8px; max-height:52vh; overflow:auto; }
  .rs-item{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--line, #eee); cursor:pointer; font-size:13.5px; }
  .rs-item:last-child{ border-bottom:none; }
  .rs-item:hover{ background:var(--hover, #f2f6ff); }
  .rs-item b{ flex:0 0 auto; min-width:4.5em; }
  .rs-item .rs-file{ flex:1 1 auto; min-width:0; color:var(--sub, #666); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rs-item .rs-when{ flex:0 0 auto; color:var(--sub, #666); font-size:12px; }
  .rs-tag{ flex:0 0 auto; font-size:11px; border-radius:4px; padding:1px 5px; background:#e8f2ff; color:#1a5fb4; }
  .rs-tag.gray{ background:#eee; color:#666; }
  .rs-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; font-size:13px; }
  .rs-row label{ color:var(--sub, #666); flex:0 0 4.5em; }
  .rs-img{ display:block; max-width:100%; max-height:46vh; margin:6px auto 8px; border:1px solid var(--line, #ddd); border-radius:6px; background:#fff; }
  .rs-sub{ font-size:12px; color:var(--sub, #666); }
  .rs-warn{ color:#b3261e; font-size:12.5px; }
  .rs-foot{ display:flex; gap:8px; justify-content:flex-end; align-items:center; margin-top:10px; flex-wrap:wrap; }
  #rsText{ width:100%; min-height:132px; box-sizing:border-box; font:inherit; font-size:13px; padding:6px 8px; }
  #rsPhone{ font:inherit; font-size:14px; padding:4px 6px; width:12em; }
  #rsPhoneSel{ font:inherit; font-size:13.5px; padding:3px 4px; width:auto; max-width:100% !important; } /* 공용 모양이 고르기 상자를 162px로 묶어 「(고객관리)」가 잘렸다 */
</style>
<div class="rs-back" id="rsBack" hidden>
  <div class="rs-box" role="dialog" aria-label="영수증 문자">
    <div class="rs-head"><h3 id="rsTitle">📱 영수증 문자</h3><span class="rs-x" id="rsClose" role="button" title="닫기">✕</span></div>
    <div id="rsBody"></div>
  </div>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return typeof escapeHtml === 'function' ? escapeHtml(s) : String(s == null ? '' : s); };
  var won = function(n){ return n === '' || n == null ? '' : Number(n).toLocaleString('ko-KR') + '원'; };
  // 세무사님 "<요청하신> 문구는 빼자" / "카카오채널 주소를 바로 안내해 줄까?"(11-25) — 채널 주소는 전자명함(NETAX_Card script.js KAKAO_CHANNEL_URL)과 같은 곳
  // 세무사님 "<네이버와 구글에 리뷰를 남겨주시면, 신설매장으로서 큰 힘이 됩니다.>라는 문구도 넣을까?" / "네이버리뷰는 아마도 각자 마이플레이스에서 작성하는 것 아닌가?"(11-25)
  //  구글은 사무소 쪽을 바로 여는 주소(cid — 구글 지도 「이음 세무컨설팅 조종호 세무사」로 열어 확인), 네이버는 MY플레이스 영수증 인증이라 주소 없이 안내
  var DEFAULT_TEXT = '이음세무컨설팅에서 현금영수증을 보내드립니다.\n카카오채널로 편하게 상담하실 수 있습니다: https://pf.kakao.com/_SixeWn\n리뷰를 남겨 주시면 큰 힘이 됩니다.\n구글: https://maps.google.com/?cid=10498862036873431500\n네이버: 네이버 지도 앱 MY플레이스에서 이 영수증 사진으로 인증 후 작성';
  var MAX = 195 * 1024; // 솔라피 한도 200KB보다 조금 작게
  var RS = { files: [], cur: null, jpg: '', busy: false };

  function say(msg){ if (typeof toast === 'function') toast(msg); }
  function close(){ if (RS.busy) return; $('rsBack').hidden = true; RS.cur = null; RS.jpg = ''; }
  $('rsClose').addEventListener('click', close);
  $('rsBack').addEventListener('click', function(e){ if (e.target === $('rsBack')) close(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !$('rsBack').hidden) close(); });

  function showList(){
    $('rsTitle').textContent = '📱 영수증 문자 — 보낼 영수증 고르기';
    $('rsBody').innerHTML = '<div class="rs-sub" style="margin-bottom:6px;">「1 상담사건」 폴더의 현금영수증(최근 저장한 것부터)</div><div class="rs-list" id="rsList"><div class="spinner">불러오는 중…</div></div>' +
      '<div class="rs-foot"><span class="rs-sub" style="margin-right:auto;">방금 저장한 파일이 안 보이면 잠시 뒤 다시 찾기</span><button type="button" class="ghost-btn" id="rsReload">다시 찾기</button></div>';
    $('rsReload').addEventListener('click', loadList);
    loadList();
  }
  function loadList(){
    var box = $('rsList'); if (!box) return;
    box.innerHTML = '<div class="spinner">불러오는 중…</div>';
    callGas('receipt_sms_list', {}).then(function(res){
      if (!res || res.success === false){ box.innerHTML = '<div class="log-empty">' + esc((res && (res.message || res.error)) || '목록을 읽지 못했습니다.') + '</div>'; return; }
      RS.files = res.files || [];
      if (!RS.files.length){ box.innerHTML = '<div class="log-empty">「1 상담사건」 폴더에 현금영수증 PDF가 없습니다.</div>'; return; }
      box.innerHTML = RS.files.map(function(f, i){
        return '<div class="rs-item" data-i="' + i + '" role="button">' +
          '<b>' + esc(f.고객명 || '(이름 없음)') + '</b><span class="rs-file" title="' + esc(f.name) + '">' + esc(f.name) + '</span>' +
          (f.보냄 ? '<span class="rs-tag gray" title="' + esc(f.보냄) + '에 보냄">보냄 ' + esc(String(f.보냄).slice(5, 10)) + '</span>' : '') +
          '<span class="rs-when">' + esc(f.저장) + '</span></div>';
      }).join('');
      box.querySelectorAll('.rs-item').forEach(function(el){
        el.addEventListener('click', function(){ prepare(RS.files[Number(el.dataset.i)]); });
      });
    }).catch(function(e){ box.innerHTML = '<div class="log-empty">목록을 읽지 못했습니다: ' + esc(typeof nxErrText_ === 'function' ? nxErrText_(e) : e.message) + '</div>'; });
  }

  // PDF 첫 쪽 → 빈 여백을 잘라 낸 JPG(200KB 안)
  async function pdfToJpeg(b64){
    if (typeof pdfjsLib === 'undefined') throw new Error('PDF 그리기 도구(pdf.js)를 불러오지 못했습니다.');
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var doc = await pdfjsLib.getDocument({ data: bytes, isEvalSupported: false }).promise;
    var page = await doc.getPage(1);
    var v1 = page.getViewport({ scale: 1 });
    // 홈택스 영수증은 A4 한쪽 위에 좁게 찍혀 있어 넉넉히 크게 그린 뒤 잘라 낸다(잘린 영수증 긴 변 약 1,200px — 휴대폰에서 글자가 또렷하게)
    var vp = page.getViewport({ scale: 2400 / Math.max(v1.width, v1.height) });
    var c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    // 빈 여백 자르기 — 흰색이 아닌 곳의 테두리 + 여유 20px
    var d = ctx.getImageData(0, 0, c.width, c.height).data, x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
    for (var y = 0; y < c.height; y += 2) for (var x = 0; x < c.width; x += 2) {
      var k = (y * c.width + x) * 4;
      if (d[k] < 235 || d[k + 1] < 235 || d[k + 2] < 235){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    if (x1 < 0){ x0 = 0; y0 = 0; x1 = c.width - 1; y1 = c.height - 1; }
    x0 = Math.max(0, x0 - 20); y0 = Math.max(0, y0 - 20); x1 = Math.min(c.width - 1, x1 + 20); y1 = Math.min(c.height - 1, y1 + 20);
    var cw = x1 - x0 + 1, ch = y1 - y0 + 1;
    var widths = [1200, 1000, 860, 720, 600], quals = [0.85, 0.75, 0.65];
    for (var wi = 0; wi < widths.length; wi++){
      var s = Math.min(1, widths[wi] / Math.max(cw, ch)), o = document.createElement('canvas');
      o.width = Math.round(cw * s); o.height = Math.round(ch * s);
      var oc = o.getContext('2d'); oc.fillStyle = '#fff'; oc.fillRect(0, 0, o.width, o.height);
      oc.drawImage(c, x0, y0, cw, ch, 0, 0, o.width, o.height);
      for (var qi = 0; qi < quals.length; qi++){
        var url = o.toDataURL('image/jpeg', quals[qi]), size = Math.floor((url.length - 23) * 3 / 4);
        if (size <= MAX) return { url: url, size: size, w: o.width, h: o.height };
      }
    }
    throw new Error('영수증 그림을 200KB 안으로 줄이지 못했습니다.');
  }

  function prepare(f){
    RS.cur = null; RS.jpg = '';
    $('rsTitle').textContent = '📱 영수증 문자 — ' + (f.고객명 || f.name);
    $('rsBody').innerHTML = '<div class="spinner">영수증을 읽는 중…(금액·발행처 판독, 몇 초)</div>';
    callGas('receipt_sms_prepare', { fileId: f.id }).then(function(res){
      if (!res || res.success === false) throw new Error((res && (res.message || res.error)) || '영수증을 읽지 못했습니다.');
      RS.cur = res;
      return pdfToJpeg(res.pdfBase64).then(function(img){ RS.jpg = img.url; showPreview(res, img); });
    }).catch(function(e){
      $('rsBody').innerHTML = '<div class="rs-warn">' + esc(typeof nxErrText_ === 'function' ? nxErrText_(e) : e.message) + '</div><div class="rs-foot"><button type="button" class="ghost-btn" id="rsBack2">목록으로</button></div>';
      $('rsBack2').addEventListener('click', showList);
    });
  }

  function showPreview(r, img){
    var phones = r.phones || [];
    var phoneHtml = phones.length > 1
      ? '<select id="rsPhoneSel">' + phones.map(function(p, i){ return '<option value="' + esc(p.phone) + '">' + esc(fmtPhone(p.phone)) + ' (' + esc(p.from) + ')</option>'; }).join('') + '<option value="">직접 적기</option></select> '
      : '';
    var first = phones.length ? phones[0].phone : '';
    var notes = [];
    if (r.수금 === '기록함') notes.push('이미 수금관리에 적힌 영수증입니다 — 문자만 보내고 수금은 다시 적지 않습니다.');
    else if (r.이사무소) notes.push('보내면 수금관리에 바로 적습니다' + (r.금액 !== '' ? '(' + won(r.금액) + ')' : '(금액을 못 읽어 「금액 확인 필요」로)') + '.');
    else notes.push('발행처가 「' + r.발행처 + '」로 읽혀 수금관리에는 적지 않습니다(문자는 보냅니다).');
    if (r.보냄) notes.push(r.보냄 + '에 이미 한 번 보낸 영수증입니다.');
    notes.push('받는 번호는 고객관리에 남깁니다(이미 있는 번호면 그대로, 다른 번호가 있으면 추가연락처에).');
    $('rsBody').innerHTML =
      '<img class="rs-img" id="rsImg" alt="현금영수증 그림" src="' + img.url + '">' +
      '<div class="rs-sub" style="text-align:center;">' + esc(r.file.name) + ' · 그림 ' + Math.round(img.size / 1024) + 'KB</div>' +
      '<div class="rs-row"><label>판독</label><span>' + esc(r.날짜 || '날짜 못 읽음') + ' · ' + (r.금액 !== '' ? '<b>' + esc(won(r.금액)) + '</b>' : '금액 못 읽음') + ' · 발행처 ' + esc(r.발행처) + '</span></div>' +
      '<div class="rs-row"><label for="rsPhone">받는 번호</label>' + phoneHtml + '<input id="rsPhone" inputmode="tel" value="' + esc(fmtPhone(first)) + '" placeholder="휴대폰 번호"' + (phones.length > 1 ? ' style="display:none;"' : '') + '>' +
        (phones.length ? '' : '<span class="rs-sub">고객관리·예약 기록에 번호가 없습니다 — 적어 주세요</span>') + '</div>' +
      '<div class="rs-row" style="display:block;"><textarea id="rsText" maxlength="1000">' + esc(DEFAULT_TEXT) + '</textarea></div>' +
      notes.map(function(n){ return '<div class="rs-sub">· ' + esc(n) + '</div>'; }).join('') +
      '<div class="rs-foot"><span class="rs-sub" style="margin-right:auto;">사진 문자 110원</span><button type="button" class="ghost-btn" id="rsToList">목록으로</button><button type="button" class="save-btn" id="rsSend">보내기</button></div>';
    var sel = $('rsPhoneSel');
    if (sel) sel.addEventListener('change', function(){
      var inp = $('rsPhone');
      if (sel.value){ inp.value = sel.value; inp.style.display = 'none'; } else { inp.value = ''; inp.style.display = ''; inp.focus(); }
    });
    $('rsToList').addEventListener('click', showList);
    $('rsSend').addEventListener('click', send);
  }
  function fmtPhone(p){ var d = String(p || '').replace(/[^0-9]/g, ''); return d.length === 11 ? d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7) : d.length === 10 ? d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6) : d; }

  function send(){
    var r = RS.cur; if (!r || !RS.jpg || RS.busy) return;
    var phone = String($('rsPhone').value || '').replace(/[^0-9]/g, '');
    var text = String($('rsText').value || '').trim();
    if (!/^01[016789]\d{7,8}$/.test(phone)){ say('받는 번호를 휴대폰 번호로 적어 주세요.'); $('rsPhone').style.display = ''; $('rsPhone').focus(); return; }
    if (!text){ say('보낼 글이 비어 있습니다.'); return; }
    var known = (r.phones || []).some(function(p){ return p.phone === phone; });
    var btn = $('rsSend'); btn.disabled = true; btn.textContent = '보내는 중…'; RS.busy = true;
    callGas('receipt_sms_send', { fileId: r.file.id, phone: phone, text: text, jpgBase64: RS.jpg, savePhone: !known }).then(function(res){
      RS.busy = false;
      if (!res || res.success === false){ btn.disabled = false; btn.textContent = '보내기'; say((res && (res.message || res.error)) || '보내지 못했습니다.'); return; }
      var msg = (r.고객명 || '') + '님(' + fmtPhone(phone) + ')께 영수증 사진 문자를 보냈습니다.';
      if (res.수금 === 'added') msg += ' 수금관리에 ' + (res.금액 !== '' ? won(res.금액) : '「금액 확인 필요」로') + ' 적었습니다.';
      else if (res.수금 === 'already') msg += ' (수금관리엔 이미 적혀 있음)';
      else if (res.수금 === 'not_office' || res.수금 === 'unknown') msg += ' 이 사무소 발행으로 읽히지 않아 수금관리엔 적지 않았습니다.';
      if (res.notes && res.notes.length) msg += ' ' + res.notes.join(' · ');
      say(msg);
      $('rsBack').hidden = true;
      if (res.수금 === 'added'){
        try { if (typeof loadDashPayments === 'function') loadDashPayments(); } catch (e) {}
        try { if (typeof loadCollections_ === 'function') loadCollections_(); } catch (e) {}
      }
    }).catch(function(e){
      RS.busy = false; btn.disabled = false; btn.textContent = '보내기';
      say('보내지 못했습니다: ' + (typeof nxErrText_ === 'function' ? nxErrText_(e) : e.message));
    });
  }

  // opt.fileId가 있으면(넥스 카드) 그 영수증의 미리 보기로 바로 간다
  window.nxReceiptSmsOpen_ = function(opt){
    $('rsBack').hidden = false;
    if (opt && opt.fileId) prepare({ id: String(opt.fileId), 고객명: String(opt.고객명 || ''), name: String(opt.name || '') });
    else showList();
  };
})();
</script>
