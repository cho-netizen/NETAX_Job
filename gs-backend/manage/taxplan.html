<style>
  /* [2026.10.21 신규] 💡 절세플랜 — 세무사님 원문: "2~5번은 케이스별 절세플랜이나 서비스기능인데, 우리시스템도 탭을 하나 만들어서
     반영할 필요가 있다. 즉 많이 찾는 유형을 정형화하기, 복잡할 수 있는 사안을 미리 명료하게 정리해 두기 등등의 목적으로 구현해두면
     좋을 것 같다." / 배치: "별도 메뉴 안으로 확정"(세액계산 세목 탭 줄에 넣으니 어색하다고 하셔서 왼쪽 메뉴로).
     설계: netax-inventory/maps/절세플랜탭_설계_20261020.md. 새 계산 로직 없음 — 세액계산 엔진(taxcalc-engine.html)을 입력만 바꿔
     여러 번 돌려 나란히 놓는다. 서버를 부르지 않는다(토큰 0). 결정은 세무사님 — 화면은 비교표만, "권장"을 단정하지 않는다. */
  #view-taxplan .tp-casebar{ display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; padding:8px 0 10px; border-bottom:1px solid var(--line); margin-bottom:10px; font-size:13px; }

  #view-taxplan .tp-kinds{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; }
  #view-taxplan .tp-chip{ border:1px solid var(--taxcalc-border, #a9b0bd); border-radius:14px; padding:4px 11px; background:var(--panel); color:var(--ink); font:inherit; font-size:12px; cursor:pointer; }
  #view-taxplan .tp-chip.on{ background:var(--navy); color:#fff; border-color:var(--navy); }
  #view-taxplan .tp-card{ border:1px solid var(--taxcalc-border, #a9b0bd); border-radius:8px; padding:12px; margin-bottom:12px; background:var(--panel); }
  #view-taxplan .tp-card h3{ margin:0 0 8px; font-size:14px; color:var(--navy); display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline; }
  #view-taxplan .tp-card h3 small{ font-weight:400; font-size:12px; opacity:.8; }

  #view-taxplan .tp-grid input[type=text], #view-taxplan .tp-grid select{ border:1px solid var(--taxcalc-border, #a9b0bd); border-radius:4px; padding:5px 7px; font:inherit; background:var(--panel); color:var(--ink); }
  #view-taxplan .tp-grid input.tp-num{ text-align:right; }

  #view-taxplan table.tp-tbl th{ background:var(--bg); font-weight:700; }

</style>

<div class="view" id="view-taxplan">
  <div class="view-head"><h2>💡 절세플랜</h2></div>
  <div class="view-body">
    <div class="tp-casebar" id="tpCaseBar"></div>
    <div class="taxcalc-tabs" id="tpGroupTabs" style="padding:0; margin-bottom:10px;">

      <button type="button" class="taxcalc-tab" data-tp-group="tr">양도</button>

    </div>
    <div class="tp-kinds" id="tpKinds"></div>
    <div id="tpForm"></div>
    <div id="tpResult"></div>
  </div>

<script>
// ============================================================
// [2026.10.21 신규] 절세플랜 — 계산 부분(nxTaxPlanCalc_)은 화면과 떨어진 순수 함수라 node로 엔진과 함께 불러 시험한다.
//  모든 세액은 엔진 함수(calculateInheritanceTaxJS·calculateGiftTaxJS·calculateTransferTaxMultiJS·calculateBurdenedGiftTransferJS·
//  allocateInheritanceTaxByHeirJS)가 낸다. 여기서 하는 일은 시나리오별로 입력 한두 칸만 바꿔 넣는 것뿐이다.
// ============================================================
(function(){
  var W = window;
  var n_ = function(v){ var x = Number(v); return isFinite(x) ? x : 0; };
  var copy_ = function(o){ return JSON.parse(JSON.stringify(o || {})); };
  var assign_ = function(){ var t = {}; for (var i = 0; i < arguments.length; i++){ var s = arguments[i] || {}; for (var k in s) if (Object.prototype.hasOwnProperty.call(s, k)) t[k] = s[k]; } return t; };
  var C = W.nxTaxPlanCalc_ = {};

  // 날짜 문자열(YYYY-MM-DD)에 해를 더한다 — 2차 상속 가정일용
  C.addYears_ = function(d, y){
    var s = String(d || ''); if (s.length < 10) return '';
    return String(Number(s.slice(0, 4)) + Math.round(n_(y))) + s.slice(4, 10);
  };

  // ① 배우자 상속분 배분 — 배우자 몫(실제 상속받은 금액)만 바꿔 1차 상속세, 그 몫이 배우자 고유재산과 함께 다시 상속될 때(2차, 가정)의 상속세를 나란히.
  //   o: { custom: 직접 입력 배우자 몫, spouseOwn: 배우자 고유재산, years: 배우자 사망까지 햇수, childCount2: 2차 상속 자녀 수 }
  //   근거: 상증법 §19①(실제 상속받은 금액, 법정상속분 등 한도)·④(5억 미만이면 5억), §30(10년 안 재상속 단기재상속 세액공제).
  C.spouse = function(base, o){
    o = o || {};
    if (!base || !(n_(base.taxableEstateAmount) > 0)) return { error: '상속세 과세가액을 넣어 주세요.' };
    if (!(n_(base.spouseLegalShareRatio) > 0)) return { error: '배우자 법정상속분 비율을 넣어 주세요(예: 배우자와 자녀 2명이면 3/7).' };
    var calc = W.calculateInheritanceTaxJS;
    var b = assign_(copy_(base), { hasSpouse: true, isSpouseOnlyHeir: false, isSpousePropertyDivided: true });
    var r0 = calc(assign_(b, { spouseActualInheritedAmount: 0 }));
    if (!r0 || r0.error) return { error: (r0 && r0.error) || '상속세 계산이 되지 않았습니다.' };
    var limit = n_(r0.배우자공제한도액);
    var estate = n_(b.taxableEstateAmount);
    var cand = [
      { label: '0원 (배우자 몫 없음 — 최소 5억 공제)', a: 0 },
      { label: '5억', a: 500000000 },
      { label: '법정상속분 한도까지', a: Math.min(limit, 3000000000, estate) }
    ];
    if (n_(o.custom) > 0) cand.push({ label: '직접 입력', a: Math.min(n_(o.custom), estate) });
    var seen = {}, rows = [];
    var years = Math.max(0, n_(o.years));
    var date1 = String(b.dateOfDeath || b.inheritanceDate || '');
    var date2 = C.addYears_(date1, years);
    var kids2 = o.childCount2 != null && o.childCount2 !== '' ? n_(o.childCount2) : n_(b.childCount);
    cand.forEach(function(c){
      var a = Math.round(c.a);
      if (seen[a]) return; seen[a] = 1;
      var r1 = calc(assign_(b, { spouseActualInheritedAmount: a }));
      if (!r1 || r1.error) { rows.push({ label: c.label, a: a, error: (r1 && r1.error) || '계산 안 됨' }); return; }
      var estate2 = n_(o.spouseOwn) + a, r2 = null, t2 = 0;
      if (estate2 > 0){
        var p2 = { dateOfDeath: date2, inheritanceDate: date2, taxableEstateAmount: estate2, hasSpouse: false, childCount: kids2, filingStatus: 'ontime' };
        if (years < 10 && a > 0){
          // §30② — 전의 상속세 산출세액 × 재상속분 ÷ 전의 상속재산가액 × 공제율. 전의 상속재산가액은 사건 칸(총상속재산가액)이 있으면 그 값, 없으면 과세가액으로 근사.
          p2.priorInheritanceTax = n_(r1.산출세액);
          p2.reinheritedPropertyValue = a;
          p2.priorInheritanceTotalPropertyValue = n_(b.totalGrossEstateValue) || n_(r1.상속세과세가액_적용값) || estate;
          p2.priorInheritanceTaxableBase = n_(r1.상속세과세가액_적용값) || estate;
          p2.yearsSincePriorInheritance = Math.max(1, years);
        }
        r2 = calc(p2);
        t2 = r2 && !r2.error ? n_(r2.납부세액) : 0;
      }
      var alloc = null, kids1 = n_(b.childCount);
      if (kids1 > 0 && W.allocateInheritanceTaxByHeirJS){
        var each = Math.max(0, (estate - a) / kids1);
        var heirs = [{ actualInheritedValue: a }];
        for (var i = 0; i < kids1; i++) heirs.push({ actualInheritedValue: each });
        var al = W.allocateInheritanceTaxByHeirJS(r1, heirs);
        if (al && !al.error) alloc = al;
      }
      rows.push({ label: c.label, a: a, ded: n_(r1.배우자공제), t1: n_(r1.납부세액), t2: t2, total: n_(r1.납부세액) + t2, r1: r1, r2: r2, alloc: alloc,
        credit2: r2 && !r2.error ? n_(r2.단기재상속세액공제) : 0, err2: r2 && r2.error ? r2.error : '' });
    });
    return { rows: rows, limit: limit, date2: date2, years: years, kids2: kids2 };
  };

  // ② 토지보상 방식 비교 + 감면 하나 고르기 — 같은 거래에 감면 방식만 바꿔 calculateTransferTaxMultiJS로(한 과세기간 합산·§133 한도·농특세까지 엔진이 계산).
  //   o: { split: {cash, bond, bond_3y, bond_5y, land_replacement} 실제 받은 금액, farm: 8년 자경 요건을 갖춤 }
  //   실제 나눔대로 = 같은 자산을 받은 금액 비율로 나눠 방식별 거래로 넣음 — [확인 필요] 서식 감면소득금액 계산과 같은 숫자인지 서식 칸 대조 전.
  var COMP_KINDS_ = [
    { key: 'cash', label: '전액 현금보상' }, { key: 'bond', label: '전액 채권보상' },
    { key: 'bond_3y', label: '채권 3년 만기 특약' }, { key: 'bond_5y', label: '채권 5년 만기 특약' },
    { key: 'land_replacement', label: '대토보상(감면 선택)' }
  ];
  C.COMP_KINDS_ = COMP_KINDS_;
  var PRICE_KEYS_ = ['transferPrice', 'acquisitionPrice', 'necessaryExpenses', 'appraisalValue', 'comparableTransactionPrice', 'transferStandardPriceForConversion', 'acquisitionStandardPriceForConversion', 'acquisitionStandardPriceForExpense'];
  C.comp = function(base, o, filingParams){
    o = o || {};
    if (!base || !(n_(base.transferPrice) > 0)) return { error: '보상금(양도가액)을 넣어 주세요.' };
    if (!base.transferDate || !base.acquisitionDate) return { error: '취득일과 양도(수용)일을 넣어 주세요.' };
    var fp = assign_({ filingStatus: 'ontime' }, filingParams || {});
    var b = assign_(copy_(base), { compensationType: '', isEightYearFarmland: false });
    var run = function(pieces){ return W.calculateTransferTaxMultiJS(pieces, fp); };
    var pick = function(label, r, note){
      if (!r || r.error) return { label: label, error: (r && r.error) || '계산 안 됨' };
      var gate = [];
      (r.자산별_내역 || []).forEach(function(x){ var rr = (x && x.결과) || x || {}; ['수용감면_요건안내', '자경농지감면_요건안내'].forEach(function(k){ if (rr[k] && gate.indexOf(rr[k]) === -1) gate.push(rr[k]); }); });
      var total = n_(r.납부세액_합계_농특세포함) || (n_(r.납부세액_합계) + n_(r.농어촌특별세));
      var red = n_(r.합산조특법세액감면액) || (n_(r.합산수용감면액) + n_(r.합산자경감면액));
      // 감면이 없으면 엔진이 "감면 전 산출세액" 칸을 따로 내지 않는다 — 그때는 양도소득세 그대로가 감면 전 세액
      return { label: label, note: note || '', before: n_(r.합산감면전_산출세액) || (n_(r.산출세액_합계) + red), red: red,
        tax: n_(r.산출세액_합계),rural: n_(r.농어촌특별세), local: n_(r.지방소득세), total: total, net: n_(base.transferPrice) - total, gate: gate, r: r };
    };
    var rows = [pick('감면 없음(비교 기준)', run([assign_(b)]))];
    COMP_KINDS_.forEach(function(k){ rows.push(pick(k.label, run([assign_(b, { compensationType: k.key })]))); });
    var sp = o.split || {}, keys = COMP_KINDS_.map(function(k){ return k.key; }).filter(function(k){ return n_(sp[k]) > 0; });
    var sum = keys.reduce(function(s, k){ return s + n_(sp[k]); }, 0);
    if (keys.length > 1 && sum > 0){
      var given = {}, pieces = keys.map(function(k, i){
        var f = n_(sp[k]) / sum, piece = assign_(b, { compensationType: k });
        PRICE_KEYS_.forEach(function(pk){
          if (!(n_(b[pk]) > 0)) return;
          var v = i === keys.length - 1 ? n_(b[pk]) - (given[pk] || 0) : Math.round(n_(b[pk]) * f);
          given[pk] = (given[pk] || 0) + v; piece[pk] = v;
        });
        return piece;
      });
      rows.push(pick('실제 받은 대로 나눔', run(pieces), keys.map(function(k){ return COMP_KINDS_.filter(function(x){ return x.key === k; })[0].label.replace('전액 ', '') + ' ' + Math.round(n_(sp[k]) / sum * 100) + '%'; }).join(' · ')));
    }
    if (o.farm) rows.push(pick('8년 자경농지 감면(수용 감면 대신)', run([assign_(b, { isEightYearFarmland: true })])));
    return { rows: rows };
  };

  // ④ 10년 안 같은 증여자 증여의 기납부세액 추정 — 실제 낸 세액을 모를 때만, 과거 증여를 그 증여일 기준으로 다시 계산한 "증여 당시 산출세액"을 추정값으로 쓴다.
  //   근거: 상증법 §47②(10년 합산), §58①·②(가산한 증여재산에 대해 납부하였거나 납부할 증여세액 공제, 한도 산식). 앞 증여를 차례로 합산하며 계산(앞 증여의 산출세액은
  //   그 앞 증여까지 합산한 값이라, 마지막 과거 증여의 합산 결과를 이번 계산에 넘긴다 — 엔진 증여세 대납 재계산과 같은 방식).
  //   cur: { giftAmount, giftDate, relation, isMinor }, rows: [{ date, amount }], actualPaid: 실제 낸 세액 합계(알면)
  C.prior = function(base, cur, rows, actualPaid){
    cur = cur || {};
    if (!(n_(cur.giftAmount) > 0) || !cur.giftDate) return { error: '이번 증여의 날짜와 금액을 넣어 주세요.' };
    var calc = W.calculateGiftTaxJS;
    var d = String(cur.giftDate), from = C.addYears_(d, -10);
    var list = (rows || []).filter(function(x){ return x && n_(x.amount) > 0 && x.date; }).map(function(x){ return { date: String(x.date), amount: Math.round(n_(x.amount)) }; });
    list.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    var used = [], out = [];
    list.forEach(function(x){
      if (x.date >= d) { out.push({ date: x.date, amount: x.amount, skip: '이번 증여일 이후라 합산하지 않음' }); return; }
      if (x.date < from) { out.push({ date: x.date, amount: x.amount, skip: '10년 밖이라 합산하지 않음(§47②)' }); return; }
      used.push(x);
    });
    var acc = null;
    used.forEach(function(x){
      var p = { giftAmount: x.amount, giftDate: x.date, relation: cur.relation, isMinor: !!cur.isMinor, filingStatus: 'ontime' };
      if (acc) { p.priorGiftAmount = n_(acc.증여세과세가액); p.priorPaidTax = n_(acc.산출세액_할증전); p.priorGiftTaxableBase = n_(acc.과세표준); p.priorRelationDeductionUsed = n_(acc.증여재산공제); }
      var r = calc(p);
      if (!r || r.error) { out.push({ date: x.date, amount: x.amount, error: (r && r.error) || '계산 안 됨' }); return; }
      out.push({ date: x.date, amount: x.amount, aggTax: n_(r.산출세액_할증전), ownTax: n_(r.산출세액_할증전) - (acc ? n_(acc.산출세액_할증전) : 0), ded: n_(r.증여재산공제) });
      acc = r;
    });
    out.sort(function(a, b){ return a.date < b.date ? -1 : 1; });
    var useActual = n_(actualPaid) > 0;
    var p = assign_(copy_(base), { giftAmount: Math.round(n_(cur.giftAmount)), giftDate: d, relation: cur.relation, isMinor: !!cur.isMinor });
    if (acc) {
      p.priorGiftAmount = n_(acc.증여세과세가액);
      p.priorPaidTax = useActual ? Math.round(n_(actualPaid)) : n_(acc.산출세액_할증전);
      p.priorGiftTaxableBase = n_(acc.과세표준);
      p.priorRelationDeductionUsed = n_(acc.증여재산공제);
    } else {
      ['priorGiftAmount', 'priorPaidTax', 'priorGiftTaxableBase', 'priorRelationDeductionUsed'].forEach(function(k){ delete p[k]; });
    }
    var r = calc(p);
    if (!r || r.error) return { error: (r && r.error) || '이번 증여세가 계산되지 않았습니다.', rows: out };
    return { rows: out, result: r, estimated: !!acc && !useActual, priorPaid: acc ? p.priorPaidTax : 0, priorAmount: acc ? p.priorGiftAmount : 0 };
  };

  // ⑤ 부담부증여 vs 단순증여 — 증여세(받는 사람)와 채무 인수분 양도세(주는 사람)를 합쳐 비교.
  //   근거: 상증법 §47①(인수 채무 차감)·③(배우자·직계존비속 간 채무 인수는 객관적 입증 없으면 인수 안 한 것으로 추정), 소득세법 §88①(채무 인수분은 양도),
  //   소득세법 시행령 §159(양도로 보는 부분의 양도가액·취득가액 = 채무액 비율). 세액계산 증여세 탭 "채무를 양도세로 보내기"와 같은 경로(필요경비도 채무 비율로).
  //   o: { giftDate, value, relation, isMinor, debt, proven, customDebt, acqDate, acqPrice, acqExpense, assetType, transferExempt }
  C.burden = function(o){
    o = o || {};
    if (!(n_(o.value) > 0) || !o.giftDate) return { error: '증여일과 증여재산 평가액을 넣어 주세요.' };
    var gcalc = W.calculateGiftTaxJS, gbase = { giftAmount: Math.round(n_(o.value)), giftDate: o.giftDate, relation: o.relation, isMinor: !!o.isMinor, filingStatus: 'ontime' };
    var rows = [];
    var g0 = gcalc(gbase);
    rows.push({ label: '단순증여(채무 안 넘김)', debt: 0, gift: g0 && !g0.error ? n_(g0.납부세액) : 0, tr: 0, err: g0 && g0.error ? g0.error : '', notes: [] });
    var debts = [];
    if (n_(o.debt) > 0) debts.push({ label: '부담부증여(채무 전부 넘김)', d: Math.round(n_(o.debt)) });
    if (n_(o.customDebt) > 0 && Math.round(n_(o.customDebt)) !== Math.round(n_(o.debt))) debts.push({ label: '채무 일부만 넘김(직접 입력)', d: Math.round(n_(o.customDebt)) });
    debts.forEach(function(x){
      var d = Math.min(x.d, Math.round(n_(o.value))), notes = [];
      var g = gcalc(assign_(gbase, { debtAssumedAmount: d, isDebtObjectivelyProven: !!o.proven }));
      if (!g || g.error) { rows.push({ label: x.label, debt: d, err: (g && g.error) || '증여세 계산 안 됨' }); return; }
      var tr = 0;
      if (g.채무공제_배제여부){
        notes.push('채무를 증여재산에서 빼지 않았습니다 — ' + (g.채무공제_배제사유 || '배우자·직계존비속 간 채무 인수는 객관적으로 입증돼야 뺍니다(상증법 §47③)') + '. 이 경우 양도로 보는 부분도 없습니다.');
      } else if (o.transferExempt){
        notes.push('채무 인수분 양도세는 비과세(1세대1주택 등)로 가정해 0원입니다 — 요건은 세액계산 양도세 탭에서 확인하세요.');
      } else {
        var bg = W.calculateBurdenedGiftTransferJS({ assetAcquisitionPrice: Math.round(n_(o.acqPrice)), assetGiftValue: Math.round(n_(o.value)), totalDebtAmount: d, necessaryExpenses: 0 });
        if (!bg || bg.error) { rows.push({ label: x.label, debt: d, err: (bg && bg.error) || '양도분 계산 안 됨' }); return; }
        if (!o.acqDate) { rows.push({ label: x.label, debt: d, gift: n_(g.납부세액), err: '양도세를 계산하려면 주는 사람의 취득일을 넣어 주세요.' }); return; }
        var t = { assetType: o.assetType || 'other', acquisitionDate: o.acqDate, transferDate: o.giftDate,
          transferPrice: bg.양도로보는부분_양도가액, acquisitionPrice: bg.양도로보는부분_취득가액, isBurdenedGiftDebtPortion: true,
          necessaryExpenses: n_(o.acqExpense) > 0 ? Math.round(n_(o.acqExpense) * n_(bg.채무액비율)) : 0 };
        var tr_ = W.calculateTransferTaxMultiJS([t], { filingStatus: 'ontime' });
        if (!tr_ || tr_.error) { rows.push({ label: x.label, debt: d, gift: n_(g.납부세액), err: (tr_ && tr_.error) || '양도세 계산 안 됨' }); return; }
        tr = n_(tr_.납부세액_합계_농특세포함) || n_(tr_.납부세액_합계);
        notes.push('양도로 보는 부분: 양도가액 ' + n_(bg.양도로보는부분_양도가액).toLocaleString('ko-KR') + '원 · 취득가액 ' + n_(bg.양도로보는부분_취득가액).toLocaleString('ko-KR') + '원(채무 비율 ' + (Math.round(n_(bg.채무액비율) * 10000) / 100) + '%, 소득세법 시행령 §159)');
      }
      rows.push({ label: x.label, debt: d, gift: n_(g.납부세액), tr: tr, notes: notes });
    });
    rows.forEach(function(x){ if (!x.err) x.total = n_(x.gift) + n_(x.tr); });
    return { rows: rows };
  };

  // ⑦ 상속재산 평가액(기준시가 vs 감정가) → 상속세 + 이후 양도세. 상속받은 자산의 취득가액은 상속세 평가액(소득세법 시행령 §163⑨ — 지침 상속_평가액과_이후양도),
  //   감정평가수수료는 상속세에서 공제(엔진 한도대로). 양도는 상속개시일 취득으로 본다.
  //   o: { stdValue, apprValue, fee, sellPrice, sellDate, sellExpense, assetType, exempt }
  C.valuation = function(base, o){
    o = o || {};
    if (!base || !(n_(base.taxableEstateAmount) > 0)) return { error: '상속세 과세가액을 넣어 주세요.' };
    if (!(n_(o.stdValue) > 0) || !(n_(o.apprValue) > 0)) return { error: '이 부동산의 기준시가와 감정가를 넣어 주세요.' };
    var date = String(base.dateOfDeath || base.inheritanceDate || '');
    if (!date) return { error: '상속개시일을 넣어 주세요.' };
    var diff = Math.round(n_(o.apprValue) - n_(o.stdValue));
    var mk = function(label, val, extra){
      var p = assign_(copy_(base), extra || {});
      var r = W.calculateInheritanceTaxJS(p);
      if (!r || r.error) return { label: label, err: (r && r.error) || '상속세 계산 안 됨' };
      var tr = 0, trErr = '';
      if (o.exempt) tr = 0;
      else if (n_(o.sellPrice) > 0 && o.sellDate){
        var t = W.calculateTransferTaxMultiJS([{ assetType: o.assetType || 'other', acquisitionDate: date, transferDate: o.sellDate, transferPrice: Math.round(n_(o.sellPrice)), acquisitionPrice: Math.round(val), necessaryExpenses: Math.round(n_(o.sellExpense)), acquisitionCause: 'inheritance' }], { filingStatus: 'ontime' });
        if (!t || t.error) trErr = (t && t.error) || '양도세 계산 안 됨'; else tr = n_(t.납부세액_합계_농특세포함) || n_(t.납부세액_합계);
      } else trErr = '이후 양도가액·양도일을 넣으면 양도세까지 계산합니다';
      return { label: label, val: val, inh: n_(r.납부세액), tr: tr, trErr: trErr, total: n_(r.납부세액) + tr, r: r };
    };
    var rows = [mk('기준시가로 신고', n_(o.stdValue))];
    var ex = { taxableEstateAmount: n_(base.taxableEstateAmount) + diff, appraisalFeeAmount: n_(base.appraisalFeeAmount) + Math.round(n_(o.fee)) };
    ['totalGrossEstateValue', 'grossEstateValue'].forEach(function(k){ if (n_(base[k]) > 0) ex[k] = n_(base[k]) + diff; });
    rows.push(mk('감정가로 신고', n_(o.apprValue), ex));
    return { rows: rows };
  };
})();

        h += table_([['안', 200], ['넘긴 채무', 130], ['증여세(받는 사람)', 140], ['양도세(주는 사람)', 140], ['합계', 130]], rb.rows, function(x){
          if (x.err) return ['<td>' + esc_(x.label) + '</td>', td_(x.debt), tdErr_(x.err, 3)];
          return ['<td>' + esc_(x.label) + '</td>', td_(x.debt), td_(x.gift), td_(x.tr), tdTotal_(x.total)];
        });
        var bn = []; rb.rows.forEach(function(x){ (x.notes || []).forEach(function(s){ bn.push(x.label + ': ' + s); }); });
        h += (bn.length ? '<ul class="tp-notes">' + bn.map(function(s){ return '<li>' + esc_(s) + '</li>'; }).join('') + '</ul>' : '') + '<div class="tp-law">근거: 상증법 §47①③, 소득세법 §88①, 소득세법 시행령 §159 · ' + LOW_NOTE_ + '</div></div>';
      }
    } catch (e) {
      h = '<div class="tp-err">계산 중 오류: ' + esc_(e && e.message ? e.message : e) + '</div>';
    }
    out.innerHTML = h;
  }

  function renderKinds_(){
    var tabs = root_().querySelectorAll('[data-tp-group]');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tp-group') === group_);
    document.getElementById('tpKinds').innerHTML = KINDS_[group_].map(function(k){ return '<button type="button" class="tp-chip' + (k.key === kind_ ? ' on' : '') + '" data-tp-kind="' + k.key + '">' + esc_(k.label) + '</button>'; }).join('');
  }
  function renderCaseBar_(){
    var nm = caseName_();
    document.getElementById('tpCaseBar').innerHTML = '<span>세액계산에 열린 사건: <b>' + esc_(nm || '없음') + '</b></span><span class="tp-hint">사건 없이도 상담용으로 계산할 수 있습니다. 결과는 비교만 하고 사건에 저장하지 않습니다 — 고른 안은 세액계산에 직접 넣으세요.</span>';
  }
  function render_(){ renderCaseBar_(); renderKinds_(); renderForm_(); document.getElementById('tpResult').innerHTML = ''; }

  // 불러온 입력의 값을 칸에 채운다
  function load_(which){
    if (which === 'inh' && window.tcLastInheritanceInput_){
      var b = JSON.parse(JSON.stringify(window.tcLastInheritanceInput_)); base_.inh = b;
      vals_.ihDate = b.dateOfDeath || b.inheritanceDate || ''; vals_.ihEstate = b.taxableEstateAmount || ''; vals_.ihChild = b.childCount != null ? String(b.childCount) : '';
      vals_.ihRatio = b.spouseLegalShareRatio ? String(Math.round(b.spouseLegalShareRatio * 10000) / 10000) : ''; vals_.ihSpouseActual = b.spouseActualInheritedAmount || '';
    } else if (which === 'tr' && window.tcLastTransferInputs_ && window.tcLastTransferInputs_.inputs && window.tcLastTransferInputs_.inputs.length){
      var t = JSON.parse(JSON.stringify(window.tcLastTransferInputs_)); base_.tr = t; var a = t.inputs[0];
      vals_.cpAcqDate = a.acquisitionDate || ''; vals_.cpNotice = a.publicNoticeDate || ''; vals_.cpDate = a.transferDate || '';
      vals_.cpPrice = a.transferPrice || ''; vals_.cpAcqPrice = a.acquisitionPrice || ''; vals_.cpExp = a.necessaryExpenses || '';
      if (a.isEightYearFarmland) vals_.cpFarm = true;
    } else if (which === 'gift' && window.tcLastGiftInputs_ && window.tcLastGiftInputs_.length){
      var g = JSON.parse(JSON.stringify(window.tcLastGiftInputs_)); base_.gift = g; var x = g[0];
      vals_.pgDate = vals_.bgDate = x.giftDate || ''; vals_.pgAmount = vals_.bgValue = x.giftAmount || '';
      vals_.pgRel = vals_.bgRel = x.relation || ''; vals_.pgMinor = vals_.bgMinor = !!x.isMinor;
      if (x.debtAssumedAmount) vals_.bgDebt = x.debtAssumedAmount; vals_.bgProven = !!x.isDebtObjectivelyProven;
    }
    renderForm_(); document.getElementById('tpResult').innerHTML = '';
  }

  var bound_ = false;
  function bind_(){
    if (bound_) return; bound_ = true;
    var root = root_();
    root.addEventListener('click', function(e){
      var t = e.target.closest ? e.target.closest('[data-tp-group],[data-tp-kind],[data-tp-action]') : null;
      if (!t || !root.contains(t)) return;
      if (t.hasAttribute('data-tp-group')){ group_ = t.getAttribute('data-tp-group'); kind_ = KINDS_[group_][0].key; renderKinds_(); renderForm_(); document.getElementById('tpResult').innerHTML = ''; return; }
      if (t.hasAttribute('data-tp-kind')){ kind_ = t.getAttribute('data-tp-kind'); renderKinds_(); renderForm_(); document.getElementById('tpResult').innerHTML = ''; return; }
      var act = t.getAttribute('data-tp-action');
      if (act === 'run') run_();
      else if (act === 'load') load_(t.getAttribute('data-tp-which'));
      else if (act === 'unload'){ delete base_[t.getAttribute('data-tp-which')]; renderForm_(); document.getElementById('tpResult').innerHTML = ''; }
      else if (act === 'prior-add'){ priorRows_.push({ date: '', amount: '' }); renderForm_(); }
      else if (act === 'goto'){
        var tab = t.getAttribute('data-tp-tab');
        if (typeof goToView_ === 'function') goToView_('taxcalc');
        var tb = document.querySelector('.taxcalc-tab[data-tab="' + tab + '"]'); if (tb) tb.click();
      }
    });
    var save = function(e){
      var el = e.target;
      if (el.hasAttribute && el.hasAttribute('data-tp-field')){
        vals_[el.getAttribute('data-tp-field')] = el.type === 'checkbox' ? el.checked : el.value;
      } else if (el.hasAttribute && el.hasAttribute('data-tp-prior')){
        var i = Number(el.getAttribute('data-tp-prior')); if (priorRows_[i]) priorRows_[i][el.getAttribute('data-tp-k')] = el.value;
      }
    };
    root.addEventListener('input', save);
    root.addEventListener('change', save);
    root.addEventListener('focusout', function(e){
      var el = e.target;
      if (el.classList && el.classList.contains('tp-num') && el.value){ var v = num_(el.value); if (v > 0) el.value = won_(v); }
    });
    // Enter로 계산 — 폼 submit이 아니라 칸 안 Enter(이 화면에 form이 없고 저장도 없어 계산만 다시 함)
    root.addEventListener('keydown', function(e){ if (e.key === 'Enter' && e.target && e.target.matches && e.target.matches('#tpForm input[type=text]')) { e.preventDefault(); save(e); run_(); } });
  }

  window.initTaxPlan = function(){ bind_(); render_(); };
})();
</script>
