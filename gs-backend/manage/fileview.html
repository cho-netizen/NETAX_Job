     총괄관리자/_기록/넥스_독립업무처리_기기별_전수검사_계획서_20261127.html(A 보기·B 압축·C 파일 다루기·D 메일·6단계 밖으로 나간 횟수) → 「권장대로 하자」.

     · PDF = pdf.js(이미 서류 화면이 쓰는 3.11.174) · 한글 = rhwp(MIT, 11-27 실제 한글 파일로 hwp.js와 견줌 — HWPX까지 모양 그대로) · 압축 = zip.js(BSD)

     · 넥스 카드 file_view·zip_unzip·mail_attach_save와 같은 서버 입구(Standalone.js). -->

<script>
(function(){
  var FV = window.nxFV = window.nxFV || {};
  var PDF_MAX_ = 15 * 1024 * 1024; // 서버 readFileBinary 한도와 같음
  var ZIPJS_ = 'https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.52/dist/zip-full.min.js';
  var RHWP_ = 'https://cdn.jsdelivr.net/npm/@rhwp/core@0.9.1/rhwp.js';
  var RHWP_WASM_ = 'https://cdn.jsdelivr.net/npm/@rhwp/core@0.9.1/rhwp_bg.wasm';
  function esc(s){ return typeof escapeHtml === 'function' ? escapeHtml(String(s == null ? '' : s)) : String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function say(m, t){ if (typeof toast === 'function') toast(m, t); }
  function fsize(n){ if (typeof formatFileSize === 'function') return formatFileSize(n); n = Number(n) || 0; return n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; }
  FV.dev = function(){ var b = document.body.classList; if (b.contains('lay-phone') || b.contains('lay-cover')) return '폰'; if (b.contains('lay-tablet')) return '태블릿'; return innerWidth < 600 ? '폰' : 'PC'; };

  // ---------- 종류 가르기 ----------
  FV.kindOf = function(f){
    var n = String(f.name || '').toLowerCase(), mt = String(f.mimeType || '').toLowerCase();
    if (/\.(hwpx|docx|xlsx|pptx)$/.test(n)) { /* 겉은 zip이지만 문서 */ }
    else if (/\.zip$/.test(n) || /(^|\/)(x-)?zip(-compressed)?$/.test(mt)) return 'zip';
    if (/\.(7z|rar|alz|egg|tar|gz|tgz|bz2|xz)$/.test(n)) return 'archive';
    if (mt === 'application/pdf' || /\.pdf$/.test(n)) return 'pdf';
    if (/\.(hwp|hwpx)$/.test(n) || mt.indexOf('hwp') !== -1) return 'hwp';
    if (mt === 'application/vnd.google-apps.spreadsheet') return 'gsheet';
    if (mt === 'application/vnd.google-apps.document' || mt === 'application/vnd.google-apps.presentation') return 'gdoc';
    if (/\.(xlsx|xls|xlsm)$/.test(n) || mt === 'application/vnd.ms-excel' || mt.indexOf('spreadsheetml') !== -1) return 'excel';
    if (/\.(heic|heif|tif|tiff)$/.test(n)) return 'drive'; // 브라우저가 못 그리는 사진 — 드라이브 미리보기
    if (mt.indexOf('image/') === 0 || /\.(jpe?g|png|gif|bmp|webp)$/.test(n)) return 'image';
    if (/\.(md|txt|json|csv|tsv|html?|xml|log)$/.test(n) || mt.indexOf('text/') === 0) return 'text';
    if (mt.indexOf('audio/') === 0 || mt.indexOf('video/') === 0 || /\.(mp3|m4a|wav|aac|ogg|mp4|mov|webm|avi)$/.test(n)) return 'media';
    return 'drive'; // 워드·파워포인트·그 밖 — 드라이브 미리보기를 창 안에
  };

  // ---------- 파일 내용 받기 ----------
  var binCache_ = [];
  FV.readBin = function(f){
    var hit = binCache_.filter(function(x){ return x.id === f.id; })[0];
    if (hit) return Promise.resolve(hit.bytes);
    return callGas('readFileBinary', { fileId: f.id }).then(function(res){
      if (!res || res.error) throw new Error((res && res.error) || '파일을 받지 못했습니다');
      var bin = atob(res.base64), u = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      if (!f.mimeType && res.mimeType) f.mimeType = res.mimeType;
      binCache_.unshift({ id: f.id, bytes: u }); if (binCache_.length > 4) binCache_.pop();
      return u;
    });
  };
  function bytesToB64_(u){ var s = ''; for (var i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
  FV.bytesToB64 = bytesToB64_;
  function loadScript_(src, globalName){
    if (globalName && window[globalName]) return Promise.resolve(window[globalName]);
    return new Promise(function(ok, no){
      var s = document.createElement('script'); s.src = src; s.async = true;
      s.onload = function(){ ok(globalName ? window[globalName] : true); };
      s.onerror = function(){ no(new Error('도구를 불러오지 못했습니다(인터넷 연결 확인): ' + src.split('/').slice(-3, -1).join('/'))); };
      document.head.appendChild(s);
    });
  }
  function zipjs_(){ return loadScript_(ZIPJS_, 'zip').then(function(z){ try { z.configure({ useWebWorkers: false }); } catch (e) {} return z; }); }
  var rhwpP_ = null;
  function rhwp_(){
    if (rhwpP_) return rhwpP_;
    if (!globalThis.measureTextWidth){ var cx = null; globalThis.measureTextWidth = function(font, text){ if (!cx) cx = document.createElement('canvas').getContext('2d'); cx.font = font; return cx.measureText(text).width; }; }
    rhwpP_ = import(RHWP_).then(function(m){ return m.default({ module_or_path: RHWP_WASM_ }).then(function(){ return m; }); }).catch(function(e){ rhwpP_ = null; throw e; });
    return rhwpP_;
  }

  // ---------- 밖으로 나간 횟수 세기(6단계) ----------
  //  바깥 주소로 새 창을 열 때마다 「무엇을 하려고·어느 기기」를 서버에 센다(주소·파일 이름은 안 보냄). 로그인 전에는 안 부른다(로그인 창 사고 10-14).
  function extCat_(u){
    var h = u.hostname, p = u.pathname;
    if (/drive\.google\.com$/.test(h)) return /\/folders\//.test(p) ? '드라이브 폴더' : (/uc$|export=download/.test(p + u.search) ? '큰 파일 내려받기' : '드라이브 파일 보기');
    if (/docs\.google\.com$/.test(h)) return /\/edit/.test(p) ? '구글 문서·시트 고치기' : '구글 문서 보기';
    if (/mail\.google\.com$/.test(h)) return '지메일';
    if (/calendar\.google\.com$/.test(h)) return '구글 달력';
    if (/tasks\.google\.com$/.test(h)) return '구글 할 일';
    if (/law\.go\.kr$/.test(h)) return '법령 원문(법제처)';
    if (/nts\.go\.kr$/.test(h)) return '국세청';
    if (/hometax\.go\.kr$/.test(h)) return '홈택스';
    if (/wetax\.go\.kr$/.test(h)) return '위택스';
    if (/hancomdocs\.com$/.test(h)) return '한컴독스';
    if (/naver\.com$/.test(h)) return '네이버';
    if (/eum\.go\.kr$/.test(h)) return '토지이음';
    return '그 밖 사이트';
  }
  FV.logOut = function(url){
    try {
      var u = new URL(url, location.href);
      if (!/^https?:$/.test(u.protocol) || u.hostname === location.hostname || /(^|\.)netax\.kr$/.test(u.hostname) || /googleusercontent\.com$|script\.google\.com$/.test(u.hostname)) return;
      if (!sessionStorage.getItem('nxManageSessionToken')) return;
      callGas('sf_ext_log', { cat: extCat_(u), dev: FV.dev(), host: u.hostname }).catch(function(){});
    } catch (e) {}
  };
  // 드라이브 파일·폴더 주소는 바깥으로 나가지 않고 안에서 연다(A5 — 화면마다 따로 박힌 「원문 열기」·「📂 폴더 열기」 링크를 한 곳에서 붙잡는다).
  //  파일 → 한 보기 창(nxFV.openById) / 폴더 → 서류 화면에서 그 폴더. 구글 문서 「고치기」(/edit)·큰 파일 내려받기(uc)는 그대로 바깥.
  function driveInside_(url){
    var m = /^https:\/\/drive\.google\.com\/file\/d\/([\w-]{10,})\/(view|preview)/.exec(url || '');
    if (m){ FV.openById(m[1]); return true; }
    var g = /^https:\/\/drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([\w-]{10,})/.exec(url || '');
    if (g && typeof docsNavigateById_ === 'function' && typeof showView === 'function'){ closeCur_(); showView('docs'); docsNavigateById_(g[1]); return true; }
    return false;
  }
  if (!window.__nxfvOpenWrapped){
    window.__nxfvOpenWrapped = true;
    var origOpen = window.open;
    window.open = function(url){
      if (url && typeof url === 'string'){ if (driveInside_(url)) return null; FV.logOut(url); }
      return origOpen.apply(window, arguments);
    };
    document.addEventListener('click', function(e){
      var a = e.target && e.target.closest && e.target.closest('a[href]');
      if (!a || a.hasAttribute('download')) return;
      if (a.target === '_blank' || e.ctrlKey || e.metaKey){
        if (!e.shiftKey && driveInside_(a.href)){ e.preventDefault(); e.stopPropagation(); return; }
        FV.logOut(a.href);
      }
    }, true);
  }
  // 이름·종류를 모를 때(링크·넥스 카드) — 파일을 한 번 받아 종류를 알아내 연다(받은 내용은 그대로 보기에 씀)
  FV.openById = function(id, name){
    if (name){ FV.open({ id: id, name: name }); return; }
    say('파일을 여는 중…');
    callGas('readFileBinary', { fileId: id }).then(function(res){
      if (!res || res.error){ FV.open({ id: id, name: '파일', mimeType: '' }); return; } // 15MB 넘음 등 — 드라이브 미리보기를 창 안에
      var bin = atob(res.base64), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      binCache_.unshift({ id: id, bytes: u }); if (binCache_.length > 4) binCache_.pop();
      FV.open({ id: id, name: res.name || '파일', mimeType: res.mimeType || '', sizeBytes: u.length });
    }).catch(function(){ FV.open({ id: id, name: '파일', mimeType: '' }); });
  };

  // ---------- 창 틀 ----------
  var cur_ = null; // { f, opts, el, body, tools, info, cleanup:[] }
  function closeCur_(){
    if (!cur_) return;
    (cur_.cleanup || []).forEach(function(fn){ try { fn(); } catch (e) {} });
    cur_.el.remove(); cur_ = null;
    document.removeEventListener('keydown', onKey_, true);
  }
  FV.close = closeCur_;
  function onKey_(e){
    if (!cur_) return;
    var t = e.target; if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) && e.key !== 'Escape') return;
    if (document.getElementById('nxDialogOverlay')) return; // 물음 창이 떠 있으면 그 창이 먼저
    if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); if (cur_.back) cur_.back(); else closeCur_(); }
    else if (e.key === 'ArrowRight' && cur_.next){ e.preventDefault(); cur_.next(); }
    else if (e.key === 'ArrowLeft' && cur_.prev){ e.preventDefault(); cur_.prev(); }
  }
  function btn_(label, title, fn, cls){ var b = document.createElement('button'); b.type = 'button'; b.className = 'nxfv-btn' + (cls ? ' ' + cls : ''); b.textContent = label; if (title) b.title = title; b.addEventListener('click', function(e){ e.stopPropagation(); fn(b); }); return b; }
  function sep_(){ var s = document.createElement('span'); s.className = 'nxfv-sep'; return s; }
  function frame_(title){
    closeCur_();
    var ov = document.createElement('div'); ov.className = 'nxfv-ov'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', title);
    ov.innerHTML = '<div class="nxfv-panel"><div class="nxfv-head"><div class="nxfv-title"></div><span class="nxfv-info"></span><div class="nxfv-tools"></div></div><div class="nxfv-body"></div></div>';
    ov.querySelector('.nxfv-title').textContent = title; ov.querySelector('.nxfv-title').title = title;
    ov.addEventListener('mousedown', function(e){ if (e.target === ov) ov.__downOut = true; });
    ov.addEventListener('click', function(e){ if (e.target === ov && ov.__downOut) closeCur_(); ov.__downOut = false; });
    document.body.appendChild(ov);
    document.addEventListener('keydown', onKey_, true);
    cur_ = { el: ov, body: ov.querySelector('.nxfv-body'), tools: ov.querySelector('.nxfv-tools'), info: ov.querySelector('.nxfv-info'), cleanup: [] };
    return cur_;
  }
  function addClose_(c){ c.tools.appendChild(btn_('✕', '닫기(Esc)', closeCur_)); }
  function addT_(c, el){ if (c.endMark && c.endMark.parentNode === c.tools) c.tools.insertBefore(el, c.endMark); else c.tools.appendChild(el); return el; }

  // ---------- 열기 ----------
  // f: {id, name, mimeType, url, sizeBytes, folderId?}  opts: {siblings:[파일...], folderId, from}
  FV.open = function(f, opts){
    opts = opts || {};
    if (!f || !f.id){ say('열 파일이 없습니다.'); return; }
    var kind = FV.kindOf(f);
    // 글·보고서·구글시트는 서류 화면의 원래 보기 창(글 고치기·보고서 모양)이 맡는다
    if ((kind === 'text' || kind === 'gsheet') && typeof docsOpenFileViewer_ === 'function' && !opts.noDelegate){ docsOpenFileViewer_(f, { fromFV: true, inPlace: !!opts.inPlace }); return; }
    var c = frame_(f.name || '파일');
    c.f = f; c.opts = opts;
    var sib = (opts.siblings || []).filter(function(x){ return x && x.id; });
    var at = sib.map(function(x){ return x.id; }).indexOf(f.id);
    if (sib.length > 1 && at !== -1){
      c.prev = at > 0 ? function(){ FV.open(sib[at - 1], opts); } : null;
      c.next = at < sib.length - 1 ? function(){ FV.open(sib[at + 1], opts); } : null;
      var pb = btn_('◀', '앞 파일(←)', function(){ if (c.prev) c.prev(); }); pb.disabled = !c.prev;
      var nb = btn_('▶', '다음 파일(→)', function(){ if (c.next) c.next(); }); nb.disabled = !c.next;
      addT_(c, pb); addT_(c, nb);
      var cnt = document.createElement('span'); cnt.className = 'nxfv-info'; cnt.textContent = (at + 1) + '/' + sib.length; addT_(c, cnt);
      addT_(c, sep_());
      // 손가락으로 옆으로 밀면 앞·뒤 파일
      var sx = null;
      c.body.addEventListener('touchstart', function(e){ if (e.touches.length === 1) sx = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() }; }, { passive: true });
      c.body.addEventListener('touchend', function(e){ if (!sx) return; var d = e.changedTouches[0], dx = d.clientX - sx.x, dy = d.clientY - sx.y; if (Date.now() - sx.t < 600 && Math.abs(dx) > 80 && Math.abs(dy) < 50 && c.zoom === 1){ if (dx < 0 && c.next) c.next(); else if (dx > 0 && c.prev) c.prev(); } sx = null; }, { passive: true });
    }

  // ---------- 엑셀 — 보기 + 칸 고쳐 사본으로 저장 ----------
  function viewExcel_(c, f, bytesIn){
    if (typeof XLSX === 'undefined'){ viewDrive_(c, f, '엑셀 도구를 불러오지 못해 드라이브 미리보기로 보입니다.'); return; }
    c.body.className = 'nxfv-body plain'; c.body.innerHTML = '<div class="nxfv-msg">엑셀을 여는 중…</div>';
    (bytesIn ? Promise.resolve(bytesIn) : FV.readBin(f)).then(function(bytes){
      var wb = XLSX.read(bytes, { type: 'array', cellFormula: true, cellStyles: true });
      var edits = {}; // 시트|주소 → 값
      var sel = document.createElement('select'); sel.className = 'nxfv-btn'; sel.title = '시트 고르기';
      wb.SheetNames.forEach(function(nm){ var o = document.createElement('option'); o.value = nm; o.textContent = nm; sel.appendChild(o); });
      if (wb.SheetNames.length > 1) addT_(c, sel);
      var save = btn_('💾 고친 칸 사본으로', '고친 칸을 넣은 사본을 같은 폴더에 「이름_고침_날짜.xlsx」로 저장(원본은 그대로)', function(){ saveCopy(); }, 'pri');
      save.disabled = true; if (!bytesIn) addT_(c, save);
      function render(nm){
        var ws = wb.Sheets[nm]; if (!ws || !ws['!ref']){ c.body.innerHTML = '<div class="nxfv-msg">빈 시트입니다.</div>'; return; }
        var rg = XLSX.utils.decode_range(ws['!ref']), maxR = Math.min(rg.e.r, rg.s.r + 1999), maxC = Math.min(rg.e.c, rg.s.c + 59);
        var h = '<div class="nxfv-note">칸을 눌러 고칠 수 있습니다' + (bytesIn ? '(압축 안 파일은 보기만)' : ' — 저장은 사본으로만(서식 색·굵기는 사본에서 빠질 수 있음, 원본은 그대로)') + (rg.e.r > maxR || rg.e.c > maxC ? ' · 큰 표라 앞 2,000줄·60칸까지만 보입니다' : '') + '</div><table class="nxfv-tbl"><tr><th></th>';
        for (var cc = rg.s.c; cc <= maxC; cc++) h += '<th>' + XLSX.utils.encode_col(cc) + '</th>';
        h += '</tr>';
        for (var rr = rg.s.r; rr <= maxR; rr++){
          h += '<tr><th>' + (rr + 1) + '</th>';
          for (var c2 = rg.s.c; c2 <= maxC; c2++){
            var ad = XLSX.utils.encode_cell({ r: rr, c: c2 }), cell = ws[ad], k = nm + '|' + ad;
            var v = edits[k] != null ? edits[k] : (cell ? (cell.w != null ? cell.w : (cell.v != null ? cell.v : '')) : '');
            h += '<td data-a="' + ad + '"' + (bytesIn ? '' : ' contenteditable="true"') + (edits[k] != null ? ' class="ed"' : '') + (cell && cell.f ? ' title="수식: =' + esc(cell.f) + '"' : '') + '>' + esc(v) + '</td>';
          }

        }
        c.body.innerHTML = h + '</table>';
        c.body.querySelectorAll('td[contenteditable]').forEach(function(td){
          var before = td.textContent;
          td.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); td.blur(); } });
          td.addEventListener('blur', function(){ if (td.textContent !== before){ edits[nm + '|' + td.dataset.a] = td.textContent; td.classList.add('ed'); before = td.textContent; save.disabled = false; c.info.textContent = '고친 칸 ' + Object.keys(edits).length; } });
        });

        Object.keys(edits).forEach(function(k){
          var p = k.split('|'), ws = wb.Sheets[p[0]], v = edits[k], num = String(v).replace(/,/g, '').trim();

        });
        var d = new Date(), ymd = String(d.getFullYear()).slice(2) + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
        var name = String(f.name).replace(/\.(xlsx|xls|xlsm)$/i, '') + '_고침_' + ymd + '.xlsx';
        var b64 = XLSX.write(wb, { type: 'base64', bookType: 'xlsx' });
        if (!folderId){ FV.saveBlob(new Blob([Uint8Array.from(atob(b64), function(ch){ return ch.charCodeAt(0); })]), name); say('폴더를 몰라 이 기기로 내려받았습니다: ' + name); return; }

          save.textContent = '💾 고친 칸 사본으로';
          if (!res || res.error){ save.disabled = false; say('저장하지 못했습니다: ' + ((res && res.error) || '')); return; }
          say('같은 폴더에 「' + name + '」로 저장했습니다(원본은 그대로).'); if (typeof docsReloadQuiet_ === 'function') docsReloadQuiet_();
        });

    }).catch(function(e){ viewDrive_(c, f, '엑셀을 열지 못해 드라이브 미리보기로 보입니다(' + esc(e.message || e) + ').'); });
  }

  // ---------- 압축(zip) ----------

  // ---------- 바이트로 바로 보기(압축 안 파일·메일 첨부) ----------
  FV.viewBytes = function(f, bytes, opts){
    opts = opts || {};
    var c = frame_(f.name || '파일'); c.f = f; c.opts = opts; c.zoom = 1;
    if (opts.onBack){ c.back = function(){ opts.onBack(); }; addT_(c, btn_('◀ 목록', '앞 목록으로(Esc)', function(){ opts.onBack(); })); addT_(c, sep_()); }
    if (!f.mimeType){ var x = String(f.name).split('.').pop().toLowerCase(); f.mimeType = ({ pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', bmp: 'image/bmp', webp: 'image/webp' })[x] || ''; }

    c.tools.appendChild(btn_('⬇', '이 기기로 내려받기', function(){ FV.saveBlob(new Blob([bytes], { type: f.mimeType || 'application/octet-stream' }), f.name); }));
    addClose_(c);
    if (kind === 'pdf') viewPdf_(c, f, bytes);
    else if (kind === 'image') viewImage_(c, f, bytes);
    else if (kind === 'hwp') viewHwp_(c, f, bytes);

    else { c.body.className = 'nxfv-body plain'; c.body.innerHTML = '<div class="nxfv-msg">이 형식은 이 창에서 바로 못 봅니다 — 폴더에 풀거나 넣은 뒤 그 파일을 누르면 드라이브 미리보기로 이 창 안에서 봅니다. 또는 ⬇ 내려받기.</div>'; }
    return c;
  };

  // ---------- 내려받기·인쇄·사본·묶기 ----------
  FV.saveBlob = function(blob, name){
    var url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name || '파일'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
  };
  FV.download = function(f){
    if (f.sizeBytes && f.sizeBytes > PDF_MAX_){ window.open('https://drive.google.com/uc?export=download&id=' + encodeURIComponent(f.id), '_blank', 'noopener'); return; }
    say('「' + f.name + '」 내려받는 중…');
    FV.readBin(f).then(function(u){ FV.saveBlob(new Blob([u], { type: f.mimeType || 'application/octet-stream' }), f.name); })
      .catch(function(e){ if (/너무 큽니다|15MB/.test(e.message)) window.open('https://drive.google.com/uc?export=download&id=' + encodeURIComponent(f.id), '_blank', 'noopener'); else say('내려받지 못했습니다: ' + e.message); });
  };
  FV.printBytes = function(bytes, name, mime){
    var blob = new Blob([bytes], { type: mime });
    if (FV.dev() !== 'PC'){
      try { var file = new File([blob], name || '문서', { type: mime }); if (navigator.canShare && navigator.canShare({ files: [file] })){ navigator.share({ files: [file], title: name }).catch(function(){}); return; } } catch (e) {}
    }
    var url = URL.createObjectURL(blob), ifr = document.createElement('iframe');
    ifr.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0;';
    ifr.src = url; document.body.appendChild(ifr);
    ifr.onload = function(){ setTimeout(function(){ try { ifr.contentWindow.focus(); ifr.contentWindow.print(); } catch (e) { window.open(url, '_blank'); } }, 300); };
    setTimeout(function(){ ifr.remove(); URL.revokeObjectURL(url); }, 120000);
  };
  FV.printHtml = function(title, html){
    var ifr = document.createElement('iframe'); ifr.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0;'; document.body.appendChild(ifr);
    var d = ifr.contentDocument; d.open(); d.write('<!doctype html><meta charset="utf-8"><title>' + esc(title) + '</title><style>@page{margin:0} body{margin:0} .nxfv-page{page-break-after:always;width:100%!important} svg{width:100%;height:auto}</style>' + html); d.close();
    setTimeout(function(){ try { ifr.contentWindow.focus(); ifr.contentWindow.print(); } catch (e) {} setTimeout(function(){ ifr.remove(); }, 60000); }, 400);
  };
  FV.copy = function(f){

  // 여러 파일 → zip 하나(내려받기 또는 폴더에 넣기). 15MB 넘는 파일은 빼고 알린다.
  FV.zipFiles = function(files, zipName, toFolderId){
    files = (files || []).filter(function(x){ return x && x.id; });
    if (!files.length){ say('묶을 파일을 고르세요.'); return Promise.resolve(); }
    var big = files.filter(function(x){ return x.sizeBytes && x.sizeBytes > PDF_MAX_; }); files = files.filter(function(x){ return big.indexOf(x) === -1; });
    say('파일 ' + files.length + '개를 묶는 중…');
    return zipjs_().then(function(z){
      var w = new z.ZipWriter(new z.BlobWriter('application/zip'), { useWebWorkers: false }), used = {}, seq = Promise.resolve(), n = 0;
      files.forEach(function(f){ seq = seq.then(function(){ return FV.readBin(f).then(function(u){ var nm = f.name; var k = 2; while (used[nm]){ nm = f.name.replace(/(\.[^.]+)?$/, '(' + k + ')$1'); k++; } used[nm] = 1; n++; return w.add(nm, new z.Uint8ArrayReader(u)); }).catch(function(){ }); }); });
      return seq.then(function(){ return w.close(); }).then(function(blob){
        var name = zipName || ('묶음_' + new Date().toISOString().slice(2, 16).replace(/[-:T]/g, '') + '.zip');
        var tail = big.length ? ' · 15MB 넘는 ' + big.length + '개는 빠짐(그 파일은 하나씩 ⬇)' : '';
        if (!toFolderId){ FV.saveBlob(blob, name); say(n + '개를 「' + name + '」로 묶어 내려받았습니다' + tail); return; }
        return blob.arrayBuffer().then(function(ab){ return callGas('uploadFile', { folderId: toFolderId, name: name, mimeType: 'application/zip', base64Data: bytesToB64_(new Uint8Array(ab)), noPreread: true }); }).then(function(res){
          if (!res || res.error){ say('묶음을 폴더에 넣지 못했습니다: ' + ((res && res.error) || '')); return; }
          say(n + '개를 「' + name + '」로 묶어 이 폴더에 넣었습니다' + tail); if (typeof docsReloadQuiet_ === 'function') docsReloadQuiet_();
        });
      });
    }).catch(function(e){ say('묶지 못했습니다: ' + e.message); });
  };

  // ---------- PC 탐색기 「연결 프로그램 → NETAX 관리」로 보낸 파일(D2, manifest.json file_handlers) ----------

      var sel = c.body.querySelector('.caseSel'), cur = (typeof docsSelectedCaseId_ !== 'undefined' && docsSelectedCaseId_) || (typeof nxAiConv !== 'undefined' && nxAiConv && nxAiConv.caseId) || '';
      callGas('work_get_cases', {}).then(function(r){
        var cases = ((r && r.cases) || []).filter(function(k){ return k.폴더ID && !/완료|종결|취소/.test(k.상태 || ''); });
        sel.innerHTML = '<option value="">사건 고르기…</option>' + cases.map(function(k){ return '<option value="' + esc(k.폴더ID) + '"' + (k.id === cur ? ' selected' : '') + '>' + esc(k.사건명) + '</option>'; }).join('');
      });
      c.body.querySelector('.putBtn').addEventListener('click', function(){
        var fid = sel.value; if (!fid){ say('넣을 사건을 고르세요.'); return; }
        var b = this; b.disabled = true; c.body.querySelector('.putInfo').textContent = '올리는 중…';
        FV.uploadFiles(files, { folderId: fid }).then(function(r){ b.disabled = false; c.body.querySelector('.putInfo').textContent = r.ok + '개 넣음' + (r.bad.length ? ' · 못 넣음 ' + r.bad.length : '') + ' — 서류 읽기가 이어서 읽습니다.'; });
      });
    })();
  };
  if ('launchQueue' in window){
    try { window.launchQueue.setConsumer(function(p){ if (!p || !p.files || !p.files.length) return; Promise.all(p.files.map(function(h){ return h.getFile(); })).then(FV.receiveLocal).catch(function(){}); }); } catch (e) {}
  }

  // ---------- 끌어다 놓기 올리기(C1) — 어떤 칸이든 붙일 수 있게 ----------
  //  getTarget(): {folderId 또는 path} 를 돌려줌. onDone(): 다 올린 뒤 목록 다시 그리기.
  FV.attachDrop = function(el, getTarget, onDone){
    if (!el || el.__nxfvDrop) return; el.__nxfvDrop = true;
    var depth = 0;
    var isFiles = function(e){ var t = e.dataTransfer && e.dataTransfer.types; return t && Array.prototype.indexOf.call(t, 'Files') !== -1; };
    el.addEventListener('dragenter', function(e){ if (!isFiles(e)) return; e.preventDefault(); depth++; el.classList.add('nxfv-dropzone'); });
    el.addEventListener('dragover', function(e){ if (!isFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    el.addEventListener('dragleave', function(e){ if (!isFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) el.classList.remove('nxfv-dropzone'); });
    el.addEventListener('drop', function(e){
      if (!isFiles(e)) return; e.preventDefault(); depth = 0; el.classList.remove('nxfv-dropzone');
      var files = Array.prototype.slice.call(e.dataTransfer.files || []);
      if (!files.length) return;
      var tgt = getTarget && getTarget(); if (!tgt){ say('올릴 폴더를 먼저 여세요.'); return; }
      FV.uploadFiles(files, tgt).then(function(){ if (onDone) onDone(); });
    });
  };
  FV.uploadFiles = function(files, tgt){
    var ok = 0, bad = [], seq = Promise.resolve();
    say('파일 ' + files.length + '개를 올리는 중…');
    files.forEach(function(file){
      seq = seq.then(function(){
        if (file.size > 40 * 1024 * 1024){ bad.push(file.name + '(40MB 넘음)'); return; }
        return file.arrayBuffer().then(function(ab){
          var body = { name: file.name, mimeType: file.type || 'application/octet-stream', base64Data: bytesToB64_(new Uint8Array(ab)) };
          if (tgt.folderId) body.folderId = tgt.folderId; else body.path = tgt.path;
          return callGas('uploadFile', body);
        }).then(function(res){ if (res && !res.error) ok++; else bad.push(file.name); }).catch(function(){ bad.push(file.name); });
      });
    });
    return seq.then(function(){ say(ok + '개 올렸습니다' + (bad.length ? ' · 못 올림: ' + bad.join(', ') : '') + '.'); return { ok: ok, bad: bad }; });
  };
})();
</script>
