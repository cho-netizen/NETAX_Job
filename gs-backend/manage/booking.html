<div class="view" id="view-booking">
  <div class="view-head"><h2>예약관리</h2></div>
  <div class="view-body">
    <!-- [2026.09.16 버그수정] 실사용 지적 — "+직권등록" 버튼만 있는 카드가 한 줄을 통째로
         차지해서 화면을 위아래로 불필요하게 길게 만들었다 — "상담신청 목록" 제목 줄에
         같이 붙여서 카드 하나로 합친다(행 수 절감). -->
    <div class="card">
      <!-- [2026.10.30 예약 결과 관리] 세무사님 "이 목록이 언제까지 누적되는지? … 예약확정후 취소하거나 노쇼가 있을 수 있고, 방문상담하여 사건접수로
           이어질 수도 있는데, 그런 사항이 관리가 되지 않는다" → 목록을 처리할 것·지난 기록·전체로 나누고(기록은 지우지 않음), 확정 뒤 결과 적기·기존 사건에 연결·연결 확인. -->
      <h3 style="display:flex; flex-wrap:wrap; align-items:center; gap:8px;">상담신청 목록
        <span id="bkModeBar" style="display:flex; flex-wrap:wrap; gap:6px; font-weight:normal;">
          <button type="button" class="ghost-btn" data-bk-mode="todo" style="font-size:12px; padding:4px 10px;" title="새 신청·다가오는 확정 예약·결과를 적을 예약·사건에 이을 후보가 있는 예약">처리할 것</button>
          <button type="button" class="ghost-btn" data-bk-mode="past" style="font-size:12px; padding:4px 10px;" title="거절·취소·사건접수·상담완료·노쇼로 끝난 예약(지우지 않고 보관)">지난 기록</button>
          <button type="button" class="ghost-btn" data-bk-mode="all" style="font-size:12px; padding:4px 10px;">전체</button>
        </span>
        <button type="button" id="bkLinkReview" class="ghost-btn" style="font-size:12px; padding:4px 10px;" title="사건에 안 이은 확정 예약과 같은 고객의 사건 짝을 찾아 보여 줍니다(예약관리의 사건 시작을 거치지 않고 만든 사건)">🔗 연결 확인</button>
        <button type="button" id="bkAdminToggle" class="ghost-btn" style="margin-left:auto; font-size:12px; padding:4px 10px;">+ 직권등록</button>
      </h3>
      <div id="bkAdminForm" style="display:none; flex-direction:column; gap:8px; max-width:420px; margin:12px 0;">
        <label style="font-size:12px; color:var(--sub);">이름 *<br><input type="text" id="bkNewName" size="10" placeholder="예: 홍길동"></label>
        <label style="font-size:12px; color:var(--sub);">연락처<br><input type="text" id="bkNewPhone" size="14" placeholder="010-1234-5678"></label>
        <label style="font-size:12px; color:var(--sub);">유형<br><input type="text" id="bkNewType" size="16" placeholder="예: 양도소득세 상담"></label>
        <label style="font-size:12px; color:var(--sub);">관련분야(선택)<br><input type="text" id="bkNewField" size="10" placeholder="예: 부동산"></label>
        <div style="display:flex; gap:8px;">
          <label style="font-size:12px; color:var(--sub);">날짜<br><input type="date" id="bkNewDate" style="width:95px;"></label>
          <label style="font-size:12px; color:var(--sub);">시간<br><input type="time" id="bkNewTime" style="width:100px;"></label>
        </div>
        <label style="font-size:12px; color:var(--sub);">상황(의뢰 내용)<br><textarea id="bkNewSituation" rows="3" style="width:100%; font-family:inherit; box-sizing:border-box;" placeholder="상담 내용을 적어두면 사건 시작 시 그대로 넘어갑니다"></textarea></label>
        <div><button type="button" id="bkNewSubmit" class="save-btn">등록</button></div>
      </div>
      <div id="bookingList"><div class="spinner">불러오는 중…</div></div>
    </div>
  </div>
</div>
<script>
  var bookingLoaded = false;
  // [2026.10.30 예약 결과 관리] 보기 — 처리할 것(기본)·지난 기록·전체. 고른 보기는 이 브라우저에 기억(없어도 동작)
  var bookingMode_ = 'todo';
  try { bookingMode_ = localStorage.getItem('nxBookingMode') || 'todo'; } catch (e) {}
  if (['todo', 'past', 'all'].indexOf(bookingMode_) === -1) bookingMode_ = 'todo';
  function initBooking(force){
    if (bookingLoaded && !force) return;
    bookingLoaded = true;
    loadBookingList();
  }

  // [2026.09 버그수정] 실제 확정 상태값은 '승인'이 아니라 '확정'이다.
  // [2026.10.30] 정렬은 아래 처지(kind) 순서로 — 새 신청 → 결과 적을 것 → 이을 후보 있음 → 다가오는 확정 → 끝난 것
  var BOOKING_KIND_ORDER_ = { apply: 0, needResult: 1, needLink: 2, upcoming: 3, done: 4 };
  var BOOKING_RESULT_LABEL_ = { '상담완료': '💬 상담완료', '사건접수': '📁 사건접수', '노쇼': '⛔ 노쇼', '고객취소': '⚪ 고객취소', '사무소취소': '⚪ 사무소취소' };
  function bookingTodayStr_(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  // 한 줄의 처지 — apply 새 신청 / needResult 날짜가 지났는데 결과 없음 / needLink 이을 후보 있음 / upcoming 다가오는 확정 / done 끝남
  function bookingKind_(b, today){
    if (b.status === '신청') return 'apply';
    if (b.status === '확정' && !b.caseId){
      var cands = (b.linkCandidates || []).length;
      if (!b.result) return (b.reservedDate && b.reservedDate < today) ? 'needResult' : (cands ? 'needLink' : 'upcoming');
      return cands ? 'needLink' : 'done'; // 상담완료·노쇼 — 이을 후보가 있을 때만 처리할 것에
    }
    return 'done'; // 거절·취소·사건접수
  }
  function bookingIsTodo_(kind){ return kind !== 'done'; }
  function bookingBadge_(b){
    if (b.status === '신청') return '🔴 신청';
    if (b.status === '거절') return '🚫 거절';
    if (b.caseId) return '📁 사건접수';
    if (b.result && BOOKING_RESULT_LABEL_[b.result]) return BOOKING_RESULT_LABEL_[b.result];
    if (b.status === '취소') return '⚪ 취소';
    if (b.status === '확정') return b._kind === 'needResult' ? '🟠 결과 적기' : '🟢 확정';
    return esc(b.status);
  }
  function bookingFind_(rowIndex){ return (window._bookingAll || []).filter(function(x){ return x._rowIndex === rowIndex; })[0]; }

  // 다른 화면(대시보드 "예약 결과 적기")에서 보기를 정해 들어올 때
  function bookingShowMode_(mode){
    bookingMode_ = mode;
    try { localStorage.setItem('nxBookingMode', mode); } catch (e) {}
    var wasLoaded = bookingLoaded;
    if (typeof goToView_ === 'function') goToView_('booking');
    if (wasLoaded || !bookingLoaded) initBooking(true);
  }
  document.getElementById('bkModeBar').addEventListener('click', function(e){
    var btn = e.target.closest('[data-bk-mode]'); if (!btn) return;
    bookingMode_ = btn.getAttribute('data-bk-mode');
    try { localStorage.setItem('nxBookingMode', bookingMode_); } catch (e2) {}
    bookingRender_();
  });

  function loadBookingList(){
    var box = document.getElementById('bookingList');
    box.innerHTML = '<div class="spinner">불러오는 중…</div>';
    callGas('list_bookings', {}).then(function(res){
      window._bookingAll = (res.bookings || []).map(function(b, idx){
        b._rowIndex = idx + 2; // 시트 1행=헤더, 배열 0번째 = 2행
        return b;
      });
      bookingRender_();
    }).catch(function(e){ box.innerHTML = '<div class="empty-row">오류: '+esc(e.message)+'</div>'; });
  }

  function bookingRender_(){
    var box = document.getElementById('bookingList');
    var today = bookingTodayStr_();
    var all = window._bookingAll || [];
    all.forEach(function(b){ b._kind = bookingKind_(b, today); });
    var todoN = all.filter(function(b){ return bookingIsTodo_(b._kind); }).length;
    var mode = bookingMode_;
    // 대시보드에서 누른 줄이 지금 보기에 없으면 전체로 보여 준다(못 찾는 일 없게)
    if (window._bookingFocusRow){
      var fb = bookingFind_(window._bookingFocusRow);
      if (fb && mode !== 'all' && (mode === 'todo') !== bookingIsTodo_(fb._kind)) mode = 'all';
    }
    var list = all.filter(function(b){ return mode === 'all' || (mode === 'todo' ? bookingIsTodo_(b._kind) : !bookingIsTodo_(b._kind)); });
    var when = function(b){ return String(b.reservedDate || '') + String(b.reservedTime || ''); };
    list.sort(function(a, b){
      if (mode === 'past') return when(b).localeCompare(when(a)); // 지난 기록은 최근 것부터
      var oa = BOOKING_KIND_ORDER_[a._kind], ob = BOOKING_KIND_ORDER_[b._kind];
      if (oa !== ob) return oa - ob;
      // [2026.09 버그수정] 임박한 것이 먼저(오름차순). 끝난 것만 최근 것부터
      return a._kind === 'done' ? when(b).localeCompare(when(a)) : when(a).localeCompare(when(b));
    });
    document.querySelectorAll('#bkModeBar [data-bk-mode]').forEach(function(btn){
      var m = btn.getAttribute('data-bk-mode');
      btn.textContent = m === 'todo' ? '처리할 것 ' + todoN : (m === 'past' ? '지난 기록 ' + (all.length - todoN) : '전체 ' + all.length);
      btn.style.fontWeight = m === mode ? '700' : '';
      btn.style.borderColor = m === mode ? 'var(--navy, #0d1b3d)' : '';
    });
    if (!list.length){
      box.innerHTML = '<div class="empty-row">' + (mode === 'todo' ? '처리할 예약이 없습니다. 지난 기록은 위 "지난 기록"에서 볼 수 있습니다.' : '신청 내역이 없습니다.') + '</div>';
      window._bookingCache = list;
      return;
    }
    // [2026.09 버그수정] 데이터 길이에 맞춰 각 열 폭을 지정한다. 제목칸에도 줄바꿈 금지.
    var th = function(px){ return 'style="max-width:' + px + 'px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"'; };
    // [2026.09.16] 유형 칸 80px, 상황 칸 450px. [2026.10.30] 사건처리 칸에 "기존 사건에 연결"이 붙어 250px로
    var html = '<div style="overflow-x:auto;"><table class="list-table" style="table-layout:fixed; width:auto; min-width:1050px;"><colgroup>'
      + '<col style="width:140px"><col style="width:70px"><col style="width:95px"><col style="width:80px"><col style="width:70px">'
      + '<col style="width:400px"><col style="width:100px"><col style="width:120px"><col style="width:250px">'
      + '</colgroup><tr><th ' + th(140) + '>희망일시</th><th ' + th(70) + '>이름</th><th ' + th(110) + '>연락처</th><th ' + th(80) + '>유형</th><th ' + th(70) + '>관련분야</th>' +
      '<th ' + th(400) + '>상황</th><th ' + th(100) + '>상태</th><th ' + th(120) + '>예약처리</th><th ' + th(250) + '>사건처리</th></tr>';
    list.forEach(function(b, idx){
      // [2026.09.16 버그수정] 배지·버튼 글자 자체에 직접 줄바꿈 금지를 건다.
      var hasMemo = !!(b.resultMemo || b.resultDate);
      var badge = '<span style="white-space:nowrap;' + (hasMemo ? ' cursor:pointer; text-decoration:underline dotted;' : '') + '"' + (hasMemo ? ' onclick="bookingShowResultMemo_(' + b._rowIndex + ')" title="눌러서 결과 기록 보기"' : '') + '>' + bookingBadge_(b) + '</span>';
      var actions = '-';
      if (b.status === '신청'){
        actions = '<button type="button" class="save-btn" style="white-space:nowrap;" onclick="bookingApprove(' + b._rowIndex + ')">승인</button> ' +
          '<button type="button" class="btn danger" style="white-space:nowrap;" onclick="bookingReject(' + b._rowIndex + ')">거절</button>';
      } else if (b.status === '확정' && !b.caseId){
        // [2026.10.30] 예전 "예약 취소" 단추는 결과 적기의 "사무소취소"로 흡수(취소 문자는 거기서 고름)
        actions = '<button type="button" class="' + (b._kind === 'needResult' ? 'save-btn' : 'btn') + '" style="white-space:nowrap;" onclick="bookingOpenResult_(' + b._rowIndex + ')">결과 적기</button>';
      }
      var caseCell = '-';
      if (b.caseId){
        caseCell = '<button type="button" class="btn" style="white-space:nowrap;" onclick="bookingGoToCase(\'' + esc(b.caseId) + '\')">🔗 사건 연결됨</button>';
      } else if (b.status === '확정'){
        var nC = (b.linkCandidates || []).length;
        caseCell = '<button type="button" class="btn" style="white-space:nowrap;" onclick="bookingStartCase(' + b._rowIndex + ')">사건 시작</button> ' +
          '<button type="button" class="' + (nC ? 'save-btn' : 'ghost-btn') + '" style="white-space:nowrap;" onclick="bookingOpenLink_(' + b._rowIndex + ')"' + (nC ? ' title="같은 고객으로 만든 사건이 있습니다 — 눌러서 확인"' : '') + '>기존 사건에 연결' + (nC ? ' (후보 ' + nC + ')' : '') + '</button>';
      }
      // [2026.09.16 버그수정(2차)] 각 <td>에 실제 폭(px)을 직접 못박는다(colgroup과 별개인 이중 안전장치).
      var td = function(px, extra){ return 'style="max-width:' + px + 'px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;' + (extra || '') + '"'; };
      html += '<tr data-bk-row="' + b._rowIndex + '">' +
        '<td ' + td(140) + '>' + esc(b.reservedDate) + ' ' + esc(b.reservedTime) + '</td>' +
        '<td ' + td(70) + '>' + esc(b.name) + '</td>' +
        '<td ' + td(110) + '>' + esc(b.phone) + '</td>' +
        '<td ' + td(80, ' cursor:pointer;') + ' onclick="bookingShowSituation_(' + idx + ', \'type\')">' + esc(b.type) + '</td>' +
        '<td ' + td(70, ' cursor:pointer;') + ' onclick="bookingShowSituation_(' + idx + ', \'field\')">' + esc(b.field || '-') + '</td>' +
        '<td ' + td(400, ' cursor:pointer;') + ' onclick="bookingShowSituation_(' + idx + ', \'situation\')">' + esc(b.situation) + '</td>' +
        '<td ' + td(100) + '>' + badge + '</td>' +
        '<td style="white-space:nowrap;">' + actions + '</td>' +
        '<td style="white-space:nowrap;">' + caseCell + '</td>' +
        '</tr>';
    });
    html += '</table></div>';
    box.innerHTML = html;
    window._bookingCache = list;
    // [2026.10.18 탭연결 4번] 대시보드 '대기중인 상담신청'에서 눌러 왔으면 그 줄로 스크롤하고 잠깐 강조한다(bookingFocusRow_)
    if (window._bookingFocusRow){
      var focusTr = box.querySelector('tr[data-bk-row="' + window._bookingFocusRow + '"]');
      window._bookingFocusRow = null;
      if (focusTr){ focusTr.scrollIntoView({ block: 'center' }); focusTr.style.background = 'var(--gold-light)'; setTimeout(function(){ focusTr.style.background = ''; }, 2500); }
    }
  }

  function bookingShowResultMemo_(rowIndex){
    var b = bookingFind_(rowIndex); if (!b) return;
    nxAlert_((b.result ? '결과: ' + b.result + (b.resultDate ? ' (' + b.resultDate + ')' : '') + '\n\n' : '') + (b.resultMemo || '(메모 없음)'), b.name + '님 예약 기록');
  }

  // ---- 공용 창(이 화면 전용 — 공용 nxDialog_는 글자만 받아 단추·입력칸을 못 넣는다) ----
  function bookingOpenModal_(title, bodyHtml, width){
    bookingCloseModal_();
    var overlay = document.createElement('div');
    overlay.id = 'bkModal';
    overlay.className = 'modal-overlay';
    overlay.style.zIndex = '9990';
    overlay.innerHTML = '<div class="modal-panel" style="width:min(' + (width || 520) + 'px, 94vw);">' +
      '<div class="modal-head"><span>' + esc(title) + '</span><button type="button" class="ghost-btn" data-bk-close="1" style="padding:2px 10px;">닫기</button></div>' +
      '<div class="modal-body" id="bkModalBody">' + bodyHtml + '</div></div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){ if (e.target === overlay || e.target.closest('[data-bk-close]')) bookingCloseModal_(); });
    return overlay;
  }
  function bookingCloseModal_(){ var o = document.getElementById('bkModal'); if (o) o.remove(); }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && document.getElementById('bkModal') && !document.getElementById('nxDialogOverlay')) bookingCloseModal_(); });
  function bookingAfterChange_(){ initBooking(true); if (typeof dashboardLoaded !== 'undefined') { dashboardLoaded = false; } }

  // ---- 결과 적기 ----
  var BOOKING_RESULT_OPTS_ = [
    { v: '상담완료', t: '💬 상담완료', d: '방문·전화 상담을 했고 아직 사건으로 받지 않음 — 나중에 사건 시작·기존 사건 연결 가능', sms: null },
    { v: '노쇼', t: '⛔ 노쇼', d: '연락 없이 오지 않음', sms: false, msg: '예약하신 상담 시간에 뵙지 못했습니다. 다시 예약을 원하시면 연락 부탁드립니다.' },
    { v: '고객취소', t: '⚪ 고객취소', d: '고객이 취소를 요청함 — 캘린더 일정을 지웁니다', sms: false, msg: '요청하신 상담 예약 취소가 처리되었습니다. 다시 상담이 필요하시면 연락 부탁드립니다.' },
    { v: '사무소취소', t: '⚪ 사무소취소', d: '사무소 사정으로 취소 — 캘린더 일정을 지웁니다', sms: true, msg: '예약이 취소되었습니다. 문의사항은 연락 부탁드립니다.' },
    { v: '일정변경', t: '📆 일정변경', d: '날짜·시간을 옮깁니다 — 캘린더 일정도 같이 옮깁니다', sms: true, msg: '상담 예약이 (새 날짜 시간)(으)로 변경되었습니다.' }
  ];
  function bookingOpenResult_(rowIndex){
    var b = bookingFind_(rowIndex); if (!b) return;
    var opts = BOOKING_RESULT_OPTS_.slice();
    if (b.result === '상담완료' || b.result === '노쇼') opts.push({ v: '지우기', t: '↩ 결과 지우기', d: '잘못 적은 결과를 지웁니다(지운 일은 메모에 남음)', sms: null });
    var h = '<div style="font-size:13px; color:var(--sub); margin-bottom:6px;">' + esc(b.reservedDate) + ' ' + esc(b.reservedTime) + ' · ' + esc(b.name) + (b.phone ? ' · ' + esc(b.phone) : '') +
      (b.result ? '<br>지금 결과: <b>' + esc(b.result) + '</b>' + (b.resultDate ? ' (' + esc(b.resultDate) + ')' : '') : '') + '</div>';
    opts.forEach(function(o){
      h += '<label style="display:flex; gap:8px; align-items:flex-start; padding:6px 4px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13.5px;">' +
        '<input type="radio" name="bkResPick" value="' + esc(o.v) + '" style="margin-top:3px;"><span><b>' + esc(o.t) + '</b><br><span style="color:var(--sub); font-size:12.5px;">' + esc(o.d) + '</span></span></label>';
    });
    h += '<div id="bkResWhen" style="display:none; gap:8px; margin-top:8px;"><label style="font-size:12px; color:var(--sub);">새 날짜<br><input type="date" id="bkResDate"></label><label style="font-size:12px; color:var(--sub);">새 시간<br><input type="time" id="bkResTime"></label></div>' +
      '<div id="bkResSmsRow" style="display:none; margin-top:8px; font-size:13px;"><label style="cursor:pointer;"><input type="checkbox" id="bkResSms"> 고객에게 문자 보내기</label><div id="bkResSmsText" style="color:var(--sub); font-size:12.5px; margin-top:2px;"></div></div>' +
      '<label style="font-size:12px; color:var(--sub); margin-top:8px;">메모(선택)<br><textarea id="bkResMemo" rows="2" style="width:100%; box-sizing:border-box; font-family:inherit;" placeholder="예: 다음 주 서류 가지고 다시 오기로"></textarea></label>' +
      (b.resultMemo ? '<div style="font-size:12px; color:var(--sub); white-space:pre-wrap; margin-top:4px;">지난 기록\n' + esc(b.resultMemo) + '</div>' : '') +
      '<div style="display:flex; gap:8px; margin-top:12px;"><button type="button" class="save-btn" id="bkResSave">저장</button><button type="button" class="ghost-btn" data-bk-close="1">닫기</button></div>';
    var ov = bookingOpenModal_('예약 결과 적기', h, 460);
    var pick = function(){ var r = ov.querySelector('input[name="bkResPick"]:checked'); return r ? opts.filter(function(o){ return o.v === r.value; })[0] : null; };
    ov.addEventListener('change', function(e){
      if (e.target.name !== 'bkResPick') return;
      var o = pick();
      document.getElementById('bkResWhen').style.display = o && o.v === '일정변경' ? 'flex' : 'none';
      var smsRow = document.getElementById('bkResSmsRow');
      if (!o || o.sms === null){ smsRow.style.display = 'none'; document.getElementById('bkResSms').checked = false; return; }
      smsRow.style.display = 'block';
      var chk = document.getElementById('bkResSms');
      if (!b.phone){ chk.checked = false; chk.disabled = true; document.getElementById('bkResSmsText').textContent = '전화번호가 없어 문자를 보낼 수 없습니다.'; return; }
      chk.disabled = false; chk.checked = !!o.sms;
      document.getElementById('bkResSmsText').textContent = '보낼 글: ' + o.msg;
    });
    document.getElementById('bkResSave').addEventListener('click', function(){
      var o = pick(); if (!o){ toast('결과를 골라 주세요.'); return; }
      var payload = { rowIndex: rowIndex, expectName: b.name, result: o.v, memo: document.getElementById('bkResMemo').value.trim(), sms: document.getElementById('bkResSms').checked };
      if (o.v === '일정변경'){
        payload.newDate = document.getElementById('bkResDate').value; payload.newTime = document.getElementById('bkResTime').value;
        if (!payload.newDate || !payload.newTime){ toast('새 날짜와 시간을 넣어 주세요.'); return; }
      }
      var btn = this; btn.disabled = true; btn.textContent = '저장 중…';
      callGas('booking_set_result', payload).then(function(res){
        btn.disabled = false; btn.textContent = '저장';
        if (!res || res.success === false){ toast((res && res.message) || '저장 실패'); return; }
        toast(res.message || '저장했습니다.');
        bookingCloseModal_(); bookingAfterChange_();
      }).catch(function(e){ btn.disabled = false; btn.textContent = '저장'; toast('오류: ' + e.message); });
    });
  }

  // ---- 예약 ↔ 사건 짝 한 줄(기존 사건 연결·연결 확인·사건 등록 뒤 묻기 세 곳이 같은 모양) ----
  window._bkPairs = {};
  function bookingPairHtml_(key, p, mainHtml, allowDismiss){
    window._bkPairs[key] = p;
    var why = p.근거 ? '<span style="font-size:11.5px; padding:1px 6px; border-radius:8px; border:1px solid ' + (p.강함 ? '#2a7a4f; color:#2a7a4f' : '#b06a00; color:#b06a00') + ';">' + esc(p.근거) + (p.강함 ? '' : ' — 동명이인일 수 있음') + '</span>' : '';
    return '<div data-bk-pair-row="' + esc(key) + '" style="display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:6px 2px; border-bottom:1px solid var(--line); font-size:13px;">' +
      '<span style="flex:1 1 220px;">' + mainHtml + ' ' + why + '</span>' +
      '<button type="button" class="save-btn" data-bk-pair-link="' + esc(key) + '" style="white-space:nowrap;">연결</button>' +
      (allowDismiss ? '<button type="button" class="ghost-btn" data-bk-pair-dismiss="' + esc(key) + '" style="white-space:nowrap;" title="이 사건은 이 예약의 후보에서 뺍니다(다시 묻지 않음)">같은 건 아님</button>' : '') + '</div>';
  }
  // 짝 단추 처리 — 연결: 예약을 그 사건에 잇는다(결과 = 사건접수) / 같은 건 아님: 후보에서 뺀다
  function bookingWirePairs_(ov, onLinked){
    ov.addEventListener('click', function(e){
      var lk = e.target.closest('[data-bk-pair-link]'), ds = e.target.closest('[data-bk-pair-dismiss]');
      if (!lk && !ds) return;
      var key = (lk || ds).getAttribute(lk ? 'data-bk-pair-link' : 'data-bk-pair-dismiss');
      var p = window._bkPairs[key]; if (!p) return;
      var row = ov.querySelector('[data-bk-pair-row="' + key + '"]');
      var btns = row ? row.querySelectorAll('button') : [];
      btns.forEach(function(x){ x.disabled = true; });
      var act = lk ? callGas('link_booking_case', { rowIndex: p.rowIndex, caseId: p.caseId, expectName: p.bookingName })
                   : callGas('booking_dismiss_candidate', { rowIndex: p.rowIndex, caseId: p.caseId, expectName: p.bookingName });
      act.then(function(res){
        if (!res || res.success === false){ btns.forEach(function(x){ x.disabled = false; }); toast((res && res.message) || '처리 실패'); return; }
        if (lk){
          toast(p.bookingName + '님 예약을 「' + (p.사건명 || '사건') + '」에 이었습니다.');
          // 같은 예약의 다른 후보 줄은 더 볼 필요가 없다
          Object.keys(window._bkPairs).forEach(function(k){ var q = window._bkPairs[k]; if (q && q.rowIndex === p.rowIndex){ var r2 = ov.querySelector('[data-bk-pair-row="' + k + '"]'); if (r2 && r2 !== row) r2.remove(); } });
          if (row) row.innerHTML = '<span style="color:#2a7a4f;">✅ 이었습니다 — ' + esc(p.bookingName) + '님 예약 ↔ 「' + esc(p.사건명 || '') + '」</span>';
          if (onLinked) onLinked(p);
        } else {
          if (row) row.remove();
          toast('후보에서 뺐습니다.');
        }
        bookingAfterChange_();
      }).catch(function(err){ btns.forEach(function(x){ x.disabled = false; }); toast('오류: ' + err.message); });
    });
  }

  // ---- 기존 사건에 연결(예약 한 줄 → 사건 고르기) ----
  function bookingOpenLink_(rowIndex){
    var b = bookingFind_(rowIndex); if (!b) return;
    window._bkPairs = {};
    var ov = bookingOpenModal_('기존 사건에 연결 — ' + b.name + '님 ' + b.reservedDate, '<div class="spinner">같은 고객의 사건을 찾는 중…</div>', 560);
    bookingWirePairs_(ov, function(){ setTimeout(bookingCloseModal_, 900); });
    callGas('booking_case_candidates', { rowIndex: rowIndex, expectName: b.name }).then(function(res){
      var body = document.getElementById('bkModalBody'); if (!body) return;
      if (!res || res.success === false){ body.innerHTML = '<div class="empty-row">' + esc((res && res.message) || '불러오지 못했습니다') + '</div>'; return; }
      var caseLine = function(c){ return '「' + esc(c.사건명 || '') + '」 <span style="color:var(--sub); font-size:12px;">' + esc(c.고객명 || '') + ' · 만든 날 ' + esc(c.생성일 || '-') + (c.상태 ? ' · ' + esc(c.상태) : '') + '</span>'; };
      var h = '<div style="font-size:12.5px; color:var(--sub);">이으면 이 예약의 결과가 "사건접수"가 되고, 예약 캘린더 일정은 지워집니다(사건 일정은 사건 쪽에서 관리).</div>';
      h += '<div style="font-weight:700; margin-top:8px;">같은 건일 수 있는 사건</div>';
      if ((res.candidates || []).length){
        res.candidates.forEach(function(c, i){ h += bookingPairHtml_('c' + i, { rowIndex: rowIndex, caseId: c.caseId, 사건명: c.사건명, bookingName: b.name, 근거: c.근거, 강함: c.강함 }, caseLine(c), true); });
      } else h += '<div class="empty-row" style="padding:6px 0;">전화번호나 이름이 같은 사건이 없습니다.</div>';
      h += '<div style="font-weight:700; margin-top:10px;">다른 사건에서 고르기 <input type="text" id="bkLinkFilter" placeholder="고객명·사건명으로 좁히기" style="margin-left:6px; font-weight:normal; width:180px;"></div><div id="bkLinkRecent">';
      (res.recent || []).forEach(function(c, i){ h += '<div data-bk-recent="' + esc((c.고객명 || '') + ' ' + (c.사건명 || '')) + '">' + bookingPairHtml_('r' + i, { rowIndex: rowIndex, caseId: c.caseId, 사건명: c.사건명, bookingName: b.name }, caseLine(c), false) + '</div>'; });
      h += '</div>';
      body.innerHTML = h;
      document.getElementById('bkLinkFilter').addEventListener('input', function(){
        var q = this.value.trim();
        document.querySelectorAll('#bkLinkRecent [data-bk-recent]').forEach(function(el){ el.style.display = !q || el.getAttribute('data-bk-recent').indexOf(q) !== -1 ? '' : 'none'; });
      });
    }).catch(function(e){ var body = document.getElementById('bkModalBody'); if (body) body.innerHTML = '<div class="empty-row">오류: ' + esc(e.message) + '</div>'; });
  }

  // ---- 연결 확인(전체) — 사건에 안 이은 확정 예약 ↔ 같은 고객의 사건 짝. 지금까지 쌓인 것 한 번 정리에도 쓴다 ----
  document.getElementById('bkLinkReview').addEventListener('click', function(){
    window._bkPairs = {};
    var ov = bookingOpenModal_('연결 확인 — 사건에 안 이은 확정 예약', '<div class="spinner">예약과 사건을 맞대 보는 중…</div>', 600);
    bookingWirePairs_(ov);
    callGas('booking_link_review', {}).then(function(res){
      var body = document.getElementById('bkModalBody'); if (!body) return;
      if (!res || res.success === false){ body.innerHTML = '<div class="empty-row">' + esc((res && res.message) || '불러오지 못했습니다') + '</div>'; return; }
      var h = '<div style="font-size:12.5px; color:var(--sub);">예약일이 지났거나 상담완료로 적은 확정 예약 중, 같은 전화번호·같은 이름으로 만든 사건이 있는 것입니다(예약일 30일 전 ~ 180일 뒤에 만든 사건). 같은 건이면 "연결", 아니면 "같은 건 아님"을 눌러 주세요. 저절로 바꾸는 것은 없습니다.</div>';
      if (res.결과적기필요) h += '<div style="font-size:13px; color:#a83232; margin-top:6px;">🟠 날짜가 지났는데 결과를 안 적은 예약 ' + res.결과적기필요 + '건 — 목록 "처리할 것"에서 결과 적기</div>';
      if (!(res.items || []).length) h += '<div class="empty-row" style="padding:10px 0;">이을 후보가 있는 예약이 없습니다.</div>';
      (res.items || []).forEach(function(it, i){
        h += '<div style="margin-top:10px; font-weight:700; font-size:13.5px;">' + esc(it.reservedDate) + ' ' + esc(it.reservedTime) + ' · ' + esc(it.name) + (it.phone ? ' · ' + esc(it.phone) : '') + (it.result ? ' · ' + esc(it.result) : '') + '</div>';
        (it.candidates || []).forEach(function(c, j){
          h += bookingPairHtml_('v' + i + '_' + j, { rowIndex: it.rowIndex, caseId: c.caseId, 사건명: c.사건명, bookingName: it.name, 근거: c.근거, 강함: c.강함 },
            '「' + esc(c.사건명 || '') + '」 <span style="color:var(--sub); font-size:12px;">만든 날 ' + esc(c.생성일 || '-') + '</span>', true);
        });
      });
      body.innerHTML = h;
    }).catch(function(e){ var body = document.getElementById('bkModalBody'); if (body) body.innerHTML = '<div class="empty-row">오류: ' + esc(e.message) + '</div>'; });
  });

  // ---- 사건 등록 뒤 묻기 — 작업관리·고객관리·사건메모·의뢰메모 어디서 사건을 만들었든, 서버가 돌려준 예약 후보를 보여 드린다 ----
  //  (예약관리 "사건 시작"으로 만든 사건은 서버가 이미 이었으므로 후보가 오지 않는다)
  function bookingAskLinkAfterCreate_(res){
    var cands = res && res.bookingCandidates;
    if (!cands || !cands.length || !res.case) return;
    window._bkPairs = {};
    var h = '<div style="font-size:13px;">「' + esc(res.case.사건명 || '') + '」 사건을 등록했습니다. 아래 확정 예약과 같은 건이면 이어 두세요 — 이으면 예약 결과가 "사건접수"로 남습니다.</div>';
    cands.forEach(function(c, i){
      h += bookingPairHtml_('a' + i, { rowIndex: c.rowIndex, caseId: res.case.id, 사건명: res.case.사건명, bookingName: c.name, 근거: c.근거, 강함: c.강함 },
        esc(c.reservedDate) + ' ' + esc(c.reservedTime) + ' · <b>' + esc(c.name) + '</b>' + (c.phone ? ' · ' + esc(c.phone) : '') + (c.result ? ' · ' + esc(c.result) : ''), true);
    });
    h += '<div style="margin-top:10px;"><button type="button" class="ghost-btn" data-bk-close="1">나중에(예약관리 "연결 확인"에서 다시 볼 수 있음)</button></div>';
    var ov = bookingOpenModal_('이 사건과 같은 건일 수 있는 예약', h, 560);
    bookingWirePairs_(ov, function(){ setTimeout(bookingCloseModal_, 1200); });
  }

  // [2026.09 신규] 목록은 요약만, 전체 상황 내용은 클릭했을 때만 보여준다.
  // [2026.09.16 버그수정] 고객명/유형/상황 텍스트를 그대로 onclick="..." 속성 안에 작은따옴표로
  // 감싸 박아 넣고 있었다 — 상황란은 여러 줄 textarea 입력이라 줄바꿈이나 작은따옴표(')가
  // 하나라도 들어가면 그 지점에서 onclick의 JS 문자열이 깨져 인라인 핸들러 전체가 구문
  // 오류가 나고, 브라우저는 이를 조용히 무시한다(커서는 pointer로 바뀌지만 클릭해도 아무
  // 반응이 없던 증상의 원인). 텍스트를 속성에 직접 넣지 않고, 행 번호만 넘겨 캐시에서
  // 조회하도록 바꾼다.
  function bookingShowSituation_(idx, field){
    var b = (window._bookingCache||[])[idx];
    if (!b) return;
    var label = field === 'type' ? '유형' : (field === 'field' ? '관련분야' : '상황');
    var value = field === 'type' ? b.type : (field === 'field' ? (b.field || '-') : b.situation);
    nxAlert_(b.name + '님 ' + label + '\n\n' + value);
  }

  function bookingApprove(rowIndex){
    var b = (window._bookingCache||[]).filter(function(x){ return x._rowIndex === rowIndex; })[0];
    if (!b) return;
    nxConfirm_(b.name + '님의 신청을 승인할까요?\n\n승인하면 고객에게 예약 확정 문자가 바로 발송되고 캘린더에 일정이 등록됩니다.').then(function(ok){
      if (!ok) return;
      callGas('approve', { rowIndex: rowIndex, eventId: b.eventId, phone: b.phone, reservedDate: b.reservedDate, reservedTime: b.reservedTime })
        .then(function(res){
          if (res && res.success === false){ toast(res.message || '승인 실패'); return; }
          toast('승인되었습니다.'); initBooking(true); if (typeof dashboardLoaded !== 'undefined') { dashboardLoaded = false; }
        })
        .catch(function(e){ toast('오류: ' + e.message); });
    });
  }

  function bookingReject(rowIndex){
    var b = (window._bookingCache||[]).filter(function(x){ return x._rowIndex === rowIndex; })[0];
    if (!b) return;
    nxConfirm_(b.name + '님의 신청을 거절할까요?\n\n거절하면 고객에게 거절 안내 문자가 바로 발송됩니다.').then(function(ok){
      if (!ok) return;
      callGas('reject', { rowIndex: rowIndex, phone: b.phone })
        .then(function(res){
          if (res && res.success === false){ toast(res.message || '거절 실패'); return; }
          toast('거절되었습니다.'); initBooking(true);
        })
        .catch(function(e){ toast('오류: ' + e.message); });
    });
  }

  // [2026.10.30] 확정 예약 취소(옛 "예약 취소" 단추)는 결과 적기의 "고객취소·사무소취소"로 흡수했다 — 서버 입구(cancel_confirmed_booking)는 넥스 제안용으로 남김

  // ============================================================
  // 5단계 — 직권등록(고객 신청 없이 운영자가 바로 예약 확정) + 이 예약으로 사건 시작.
  // ============================================================
  document.getElementById('bkAdminToggle').addEventListener('click', function(){
    var form = document.getElementById('bkAdminForm');
    form.style.display = form.style.display === 'none' ? 'flex' : 'none';
  });

  document.getElementById('bkNewSubmit').addEventListener('click', function(){
    var name = document.getElementById('bkNewName').value.trim();
    var date = document.getElementById('bkNewDate').value;
    var time = document.getElementById('bkNewTime').value;
    if (!name || !date || !time){ toast('이름·날짜·시간은 필수입니다.'); return; }
    var payload = {
      name: name,
      phone: document.getElementById('bkNewPhone').value.trim(),
      type: document.getElementById('bkNewType').value.trim(),
      field: document.getElementById('bkNewField').value.trim(),
      date: date, time: time,
      situation: document.getElementById('bkNewSituation').value.trim()
    };
    // [2026.10.09] 전화번호를 넣으면 서버가 고객에게 '예약 등록' 문자를 바로 보낸다 — 예전엔 확인 없이 바로 나갔다
    var go = payload.phone ? nxConfirm_(name + '님 예약을 ' + date + ' ' + time + '으로 등록할까요?\n\n전화번호가 있어 고객에게 예약 등록 문자가 바로 발송됩니다. 문자를 보내지 않으려면 취소하고 전화번호를 비운 채 등록하세요.') : Promise.resolve(true);
    go.then(function(ok){
    if (!ok) return;
    var btn = document.getElementById('bkNewSubmit');
    btn.disabled = true; btn.textContent = '등록 중…';
    callGas('admin_apply', payload).then(function(res){
      btn.disabled = false; btn.textContent = '등록';
      if (res.error || res.success === false){ toast(res.error || res.message || '등록 실패'); return; }
      toast('예약을 등록했습니다.');
      document.getElementById('bkNewName').value = '';
      document.getElementById('bkNewPhone').value = '';
      document.getElementById('bkNewType').value = '';
      document.getElementById('bkNewField').value = '';
      document.getElementById('bkNewSituation').value = '';
      // [2026.09 버그수정] 날짜·시간 칸이 리셋 목록에서 빠져 있어서, 다음에 폼을 다시 열면
      // 이전 예약의 날짜·시간이 그대로 남아있었다 — 확인 없이 등록하면 엉뚱한 날짜로 잡힐 위험.
      document.getElementById('bkNewDate').value = '';
      document.getElementById('bkNewTime').value = '';
      document.getElementById('bkAdminForm').style.display = 'none';
      initBooking(true);
    }).catch(function(e){ btn.disabled = false; btn.textContent = '등록'; toast('오류: ' + e.message); });
    });
  });

  // [2026.09.23 신규, "전수조사" 지시로 발견] 예약의 "유형"(관리자 직권등록 자유텍스트)·
  // "관련분야"·"상황"에 세목을 짐작할 만한 낱말이 있으면 미리 추정해서 세목·업무유형
  // 드롭다운에 채워둔다 — 100% 정확할 수 없는 추측이므로(예약은 세목을 구조화된 필드로
  // 안 받는다) 어디까지나 "매번 처음부터 고르지 않아도 되는" 편의용 기본값일 뿐, 그대로
  // 두면 틀릴 수 있어 화면에서 바로 눈에 띄게 그대로 드롭다운이라 쉽게 바꿀 수 있다.
  function bookingGuessSemok_(text){
    var t = String(text || '');
    if (/양도|매매|부동산\s*양도|주택\s*매도/.test(t)) return 'transfer';
    if (/증여/.test(t)) return 'gift';
    if (/상속/.test(t)) return 'inheritance';
    if (/불복|이의신청|심판|심사청구|경정청구|과세적부/.test(t)) return 'objection';
    if (/사업자|법인|종합소득|부가가치세|부가세/.test(t)) return 'business';
    return '';
  }

  // 예약의 "상황"(의뢰 내용)을 진행메모 초안으로 넘기면서 작업관리 새 사건 폼을 연다.
  // [2026.09 버그수정] 전화·고객유형·현재세무처리·관련분야가 여기서 넘어가지 않아 사건 시작과
  // 동시에 통째로 사라지고 있었다 — 전화는 고객 레코드에, 나머지는 개요(진행메모) 맨 앞에
  // "[예약 접수 정보]" 블록으로 자동으로 얹히도록 work_createCase에서 처리한다(Code.js 참고).
  // [2026.09.23 버그수정, "전수조사" 지시로 발견] 예약의 희망일시(reservedDate)가 아예
  // 전달되지 않아서, 이미 예약 시점에 정해져 있던 날짜를 사건 등록 화면에서 또 골라야 했다
  // — 의뢰일 기본값으로 넘긴다(그대로 둬도 되고, 실제 상담이 늦춰지면 직접 고치면 됨).
  // 세목·업무유형도 위 추정 함수로 짐작해 미리 채운다(확신 없으면 빈 채로 둬서 예전처럼
  // 첫 옵션이 그대로 선택되게 한다).
  function bookingStartCase(rowIndex){
    var b = (window._bookingCache||[]).filter(function(x){ return x._rowIndex === rowIndex; })[0];
    if (!b) return;
    if (typeof goToView_ === 'function') goToView_('workmanage');
    var guessedSemok = bookingGuessSemok_([b.type, b.field, b.situation].filter(Boolean).join(' '));
    if (typeof renderNewCaseForm === 'function'){
      renderNewCaseForm({
        고객명: b.name, 전화: b.phone || '', 고객유형: b.type || '',
        현재세무처리: b.statuses || '', 관련분야: b.field || '',
        개요: b.situation || '', bookingRowIndex: b._rowIndex,
        의뢰일: b.reservedDate || '',
        세목: guessedSemok,
        // 예약은 정의상 아직 정식 수임 전 첫 상담이므로, 불복(별도 세부유형 체계라 "상담"이
        // 없음)이 아닌 한 업무유형은 "상담"으로 미리 맞춰둔다.
        업무유형: (guessedSemok && guessedSemok !== 'objection') ? '상담' : ''
      });
    }
  }

  // [2026.10.18 탭연결 4번] 다른 화면(대시보드)에서 예약 한 줄을 눌러 왔을 때 — 예약관리를 새로 불러 그 줄로 가서 강조
  function bookingFocusRow_(rowIndex){
    window._bookingFocusRow = rowIndex;
    // 처음 여는 거면 goToView_가 목록을 불러오고, 이미 열어 본 화면이면 최신으로 한 번만 다시 불러온다(두 번 불러 강조가 지워지지 않게)
    var wasLoaded = bookingLoaded;
    if (typeof goToView_ === 'function') goToView_('booking');
    if (wasLoaded || !bookingLoaded) initBooking(true);
  }

  function bookingGoToCase(caseId){
    if (typeof goToCaseHandling_ === 'function') goToCaseHandling_(caseId);
  }
</script>
