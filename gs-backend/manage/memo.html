<script>
  // ============================================================
  // 메모 — document-tools.js의 quickMemo(일반메모)+note(필기메모) 이식본.
  // 검색콤보의 "템플릿으로 사건개시" 기능은 이제 작업관리(새 사건)와 역할이 겹쳐서 뺐고,
  // 필기메모 저장 시 AI로 자동 텍스트변환하던 단계도 뺐다(1단계는 AI 없이 GAS만 사용 —
  // 손글씨는 PDF 그대로 저장하고, 텍스트 변환은 나중에 AI 단계에서 다룬다).
  // ============================================================

  // ---- 공용 저장 흐름 ----
  var pendingSaveContent = '', pendingSaveExtraFile = null, pendingSaveOnDone = null;
  var netaxRootPathCache = null;

  function generalMemoParentPath_(){
    if (netaxRootPathCache) return Promise.resolve(netaxRootPathCache);
    return callGas('getNetaxRootPath', {}).then(function(data){
      if (data && !data.error && Array.isArray(data.path)){
        netaxRootPathCache = data.path;
        return netaxRootPathCache;
      }
      toast('"0 NETAX" 폴더 위치를 확인하지 못해 기본 작업 폴더 아래에 저장합니다.');
      return getCustomerRootPath_();
    }).catch(function(){ return getCustomerRootPath_(); });
  }
  function generalMemoPath_(){
    return generalMemoParentPath_().then(function(p){ return p.concat(['일반메모']); });
  }

  function formatMemoTimestamp_(){
    var d = new Date();
    function pad(n){ return String(n).padStart(2, '0'); }
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // [2026.11.14 메모 한 창] 옛 저장 창(고객명을 넣으면 사건 폴더 「고객명사건.md」, 비우면 일반메모)을 걷고 두 갈래로 —
  //  「사건에 넣기」(아래 의뢰서 스크립트 memoOpenCaseDialog_: 그 사건 의뢰서 파일 맨 앞에 상담기록) / 「일반메모로 저장」(폴더를 펼쳐 보고 고름).
  //  사건 폴더를 고객 이름으로 맞춰 찾던 옛 길(findCustomerFolderMatches_·writeMemoEntry_·saveAsCustomerMemo_ 등)은 함께 걷음 — 사건은 사건 목록에서 고른다.
  //  이미 있는 「고객명사건.md」 파일은 그대로 둔다(GAS가 사건 폴더 메모 글로 계속 읽음).

  // [2026.09 신규] "일반메모" 폴더부터 현재 선택된 폴더(currentNotebookPath — 예전 이름 노트북)까지, 없는
  // 단계는 순서대로 만들어가며 최종 경로를 돌려준다.
  function ensureNotebookFullPath_(){
    return generalMemoParentPath_().then(function(parentPath){
      var segments = ['일반메모'].concat(currentNotebookPath);
      var chain = Promise.resolve(parentPath);
      segments.forEach(function(seg){
        chain = chain.then(function(pathSoFar){
          return callGas('listFolder', { path: pathSoFar }).then(function(listing){
            var exists = (listing.folders || []).some(function(f){ return f.name === seg; });
            var p = exists ? Promise.resolve() : callGas('createFolder', { path: pathSoFar, name: seg }).then(function(created){ if (created.error) throw new Error(created.error); });
            return p.then(function(){ return pathSoFar.concat([seg]); });
          });
        });
      });
      return chain;
    });
  }

  // 일반메모로 저장 — 글은 「이름.md」, 손글씨는 「이름.pdf」(넥스 대화 글도 .md)
  function saveAsGeneralMemo_(content, extraFile, fileName){
    var base = String(fileName || '').trim().replace(/\.(md|pdf)$/i, '').replace(/[\\\/:*?"<>|]/g, '_');
    if (!base) return Promise.resolve(false);
    var folderLabel = notebookLabel_(currentNotebookPath);
    return ensureNotebookFullPath_().then(function(targetPath){
      var hasText = !!(content && String(content).trim());

  function memoStamp_(){
    var d = new Date(); var pad = function(n){ return String(n).padStart(2, '0'); };

  }
  function memoGenDefaultName_(content, extraFile){
    if (extraFile && !(content && String(content).trim())) return '손글씨_' + memoStamp_();
    var first = '';
    String(content || '').split(/\r?\n/).some(function(l){ var t = l.replace(/^[\s#>*\-]+/, '').replace(/\[[ xX]\]\s*/, '').trim(); if (t){ first = t; return true; } return false; });

  function memoPreviewLine_(content){
    var line = (content || '').split('\n').map(function(l){ return l.replace(/^#+\s*/, '').trim(); }).find(function(l){ return l; }) || '';

  // [2026.09 신규] 조플린 "마크다운 + 프론트매터" 내보내기 형식(맨 위 ---로 감싼 YAML에
  // tags: 목록)과, 여기서 직접 쓰는 본문 속 #태그 둘 다 인식한다 — 나중에 조플린 내보내기
  // 폴더를 그대로 드라이브에 끌어다 놓기만 해도 태그가 바로 인식되게 하려는 것.
  function parseFrontMatterTags_(content){
    var tags = [];
    var m = /^---\s*\n([\s\S]*?)\n---\s*\n?/.exec(content || '');
    var body = content || '';
    if (m){
      body = body.slice(m[0].length);
      var fm = m[1];
      var blockMatch = /^[Tt]ags:\s*\n((?:\s*-\s*.+\n?)+)/m.exec(fm);
      if (blockMatch){
        blockMatch[1].split('\n').forEach(function(line){
          var lm = /^\s*-\s*(.+?)\s*$/.exec(line);
          if (lm) tags.push(lm[1]);
        });
      }
      var inlineMatch = /^[Tt]ags:\s*\[(.*)\]\s*$/m.exec(fm);
      if (inlineMatch){
        inlineMatch[1].split(',').forEach(function(t){
          var v = t.trim().replace(/^["']|["']$/g, '');
          if (v) tags.push(v);
        });
      }
    }
    var re = /(^|\s)#([\p{L}\p{N}_-]+)/gu;
    var mm;
    while ((mm = re.exec(body))) tags.push(mm[2]);
    return { tags: tags.filter(function(t, i){ return tags.indexOf(t) === i; }), body: body };
  }

  var memoPreviewEl = document.getElementById('memoPreview');

  // 미리보기의 i번째 체크박스를 클릭하면, 원본 텍스트에서 "- [ ]"/"- [x]" 패턴 중 i번째

  function toggleChecklistLineInSource_(index){
    var re = /^(\s*[-*+]\s+)\[([ xX])\]/gm;
    var i = 0;
    memoText.value = memoText.value.replace(re, function(whole, prefix, mark){
      if (i++ !== index) return whole;
      return prefix + '[' + (mark.trim() ? ' ' : 'x') + ']';
    });

  // [2026.09 신규] reportwriter.html(작성관리)이 marked.js 12.0.2의 알려진 버그들(비ASCII
  // 문자 바로 뒤 **볼드** 파싱 실패, 홑물결표 취소선 오인식)을 우회하려고 쓰는 전처리 함수와
  // 각주([^1]) 지원을 그대로 가져왔다 — 같은 marked 버전을 쓰므로 memo에도 같은 버그가
  // 그대로 나타난다. 이름은 memo 전용으로 따로 둬서(reportwriter.html의 동명 전역함수와
  // 한 페이지에 같이 있어도) 서로 안 겹치게 한다.
  function memoFixBulletChars_(mdText){
    return mdText.replace(/^([ \t]*)[•●▪◦‣][ \t]+/gm, '$1- ');
  }
  function memoSanitizeInvisibleChars_(mdText){
    return mdText
      .replace(/　/g, '  ')
      .replace(/[   -   ]/g, ' ')
      .replace(/[​‌‍﻿]/g, '');
  }
  function memoPreprocessBold_(mdText){
    mdText = memoSanitizeInvisibleChars_(mdText);
    mdText = memoFixBulletChars_(mdText);
    mdText = mdText.replace(/\\+(\*)/g, '$1');
    mdText = mdText.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
    return mdText;
  }
  function memoEscapeLoneTildes_(mdText){
    return mdText.replace(/(?<!~)~(?!~)/g, '\\~');
  }
  function memoPreprocessFootnotes_(mdText){
    var defs = {};
    var order = [];
    mdText = mdText.replace(/^\\?\[\^([^\]]+)\]:\s*(.+)$/gm, function(m, id, def){ defs[id] = def; return ''; });
    if (Object.keys(defs).length === 0) return mdText;
    mdText = mdText.replace(/\\?\[\^([^\]]+)\]/g, function(m, id){
      if (!(id in defs)) return m;
      if (order.indexOf(id) === -1) order.push(id);
      var num = order.indexOf(id) + 1;
      return '<sup id="memo-fnref-' + id + '"><a href="#memo-fn-' + id + '">[' + num + ']</a></sup>';
    });
    if (order.length > 0){
      var footnoteSection = '\n\n## 각주\n\n';
      order.forEach(function(id, i){
        footnoteSection += (i + 1) + '. <span id="memo-fn-' + id + '">' + defs[id] + '</span> <a href="#memo-fnref-' + id + '">↩</a>\n';
      });
      mdText += footnoteSection;
    }
    return mdText;
  }
  // [2026.09 신규] H버튼은 누를 때마다 #만 하나씩 넣는데(여러 번 눌러 ##/### 쌓기 위함),
  // 표준 마크다운은 #과 글자 사이에 공백이 있어야만 제목으로 인식한다 — *기울임*처럼 붙여
  // 써도 되는 문법과 헷갈리지 않도록, 공백 없는 "#제목"도 미리보기에서 제목으로 인식되게
  // 렌더링 직전에 공백을 채워 넣는다(저장되는 원본 글자는 그대로 둠, 미리보기 변환만).
  function memoFixHeadingSpacing_(mdText){
    return mdText.replace(/^(#{1,6})([^#\s])/gm, '$1 $2');
  }
  // [2026.09 신규] 법률/공문서식 개요번호(Ⅰ. → 1. → A. → ⅰ. 순서로 깊어지는 문단번호)를
  // 그 레벨에 맞는 제목으로 자동 인식한다 — 번호 자체는 그대로 두고 앞에 #을 필요한 개수만큼
  // 붙인다. 로마숫자는 일반 영문자(I,V,X 등)와 겹치는 유니코드 전용 로마숫자 문자
  // (Ⅰ Ⅱ Ⅲ... / ⅰ ⅱ ⅲ...)만 인식해서, "A."(알파벳) 표기와 절대 헷갈리지 않게 한다 — 한글
  // 워드프로세서의 "개요 번호" 기능이 넣어주는 문자와 같다. [주의] 이 때문에 "1."로 시작하는
  // 줄은 이제 항상 제목3으로 취급되고, 평범한 번호 목록으로는 더 이상 못 쓴다(세무사님 확인 후
  // 적용 — 번호 목록이 필요하면 "- 항목"(불릿)을 대신 쓸 것).
  function memoFixOutlineNumbering_(mdText){
    mdText = mdText.replace(/^([ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩⅪⅫ]\.)/gm, '## $1');
    mdText = mdText.replace(/^(\d+\.)/gm, '### $1');
    mdText = mdText.replace(/^([A-Z]\.)/gm, '#### $1');
    mdText = mdText.replace(/^([ⅰⅱⅲⅳⅴⅵⅶⅷⅸⅹⅺⅻ]\.)/gm, '##### $1');
    return mdText;
  }
  function memoPreprocessMarkdown_(md){
    md = memoPreprocessFootnotes_(md);
    md = memoPreprocessBold_(md);
    md = memoEscapeLoneTildes_(md);
    md = memoFixHeadingSpacing_(md);
    md = memoFixOutlineNumbering_(md);
    return md;
  }

  // reportwriter.html의 renderMermaidBlocks와 같은 방식 — mermaid는 이미 그 파일에서
  // 전역으로 로드·초기화되어 있으므로(한 페이지에 같이 실림) 여기서는 그대로 재사용만 한다.
  var memoMermaidRenderSeq_ = 0;
  async function memoRenderMermaidBlocks_(container){
    if (typeof mermaid === 'undefined') return;
    var blocks = container.querySelectorAll('code.language-mermaid');
    for (var i = 0; i < blocks.length; i++){
      var block = blocks[i];
      memoMermaidRenderSeq_++;
      try {
        var result = await mermaid.render('memo-mermaid-diagram-' + memoMermaidRenderSeq_, block.textContent);
        var wrapper = document.createElement('div');
        wrapper.className = 'mermaid-diagram';
        wrapper.innerHTML = result.svg;
        block.closest('pre').replaceWith(wrapper);
      } catch (err){
        console.error('[메모 순서도 렌더링 실패]', err);
      }
    }
  }

  function renderMemoPreview_(){
    var raw = memoPreprocessMarkdown_(memoText.value);
    // [2026.09 버그수정] reportwriter.html과 같은 breaks:false로 맞췄더니, 법령 붙여넣기처럼
    // 가볍게 엔터로만 줄을 바꾼 메모가 미리보기에서 전부 한 줄로 붙어버리는 문제가 있었다(표준
    // 마크다운은 원래 엔터 한 번을 줄바꿈으로 안 침 — 정식 보고서를 쓰는 문서작성에는 맞는
    // 설정이지만, 가볍게 받아적는 메모에는 안 맞음). 메모만 breaks:true로 바꿔 엔터 한 번도
    // 그대로 줄바꿈되게 한다(문서작성은 기존 저장된 보고서 모양이 바뀌지 않도록 그대로 둠).
    var html = (typeof marked !== 'undefined') ? marked.parse(raw, { breaks:true, gfm:true }) : raw.replace(/</g, '&lt;');
    // [2026.10.20 보안] DOMPurify를 못 불러오면 거르지 않고 그리던 것(fail-open)을 글자로만 보이게 바꿨다 — 메모에는 상담 녹음 요약(고객 말)도 들어온다.
    // style 허용은 뺐다(화면을 덮는 가짜 단추를 만들 수 있음).
    if (typeof DOMPurify !== 'undefined' && DOMPurify.sanitize) html = DOMPurify.sanitize(html, { ADD_ATTR: ['checked'] });
    else html = '<pre style="white-space:pre-wrap;">' + String(raw || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre>';
    memoPreviewEl.innerHTML = html || '<p style="color:var(--sub);">(내용 없음)</p>';
    memoPreviewEl.querySelectorAll('input[type="checkbox"]').forEach(function(cb, idx){
      cb.disabled = false;
      cb.addEventListener('change', function(){
        toggleChecklistLineInSource_(idx);
        renderMemoPreview_();
      });
    });
    memoRenderMermaidBlocks_(memoPreviewEl);
  }

  // [2026.11.14] 옛 「저장 위치」 고르기·「+ 노트북」 단추는 걷음 — 「일반메모로 저장」 창의 폴더 펼침·「+ 새 폴더」(위 memoGenAddFolder)로

  // ============================================================
  // 서식 빠른삽입 + 마크다운 문법 도움말 (reportwriter.html의 #mdHelpBar/#mdHelpModal과
  // 같은 방식 — 이 화면에서 실제로 렌더링되는 것만 담는다: mermaid·각주는 작성관리
  // 전용이라 뺐고, 체크리스트·태그는 이 화면 전용이라 새로 넣었다.)
  // ============================================================
  function insertMemoMdSnippet_(kind){
    var ta = memoText;
    var start = ta.selectionStart, end = ta.selectionEnd;
    var before = ta.value.slice(0, start), selected = ta.value.slice(start, end), after = ta.value.slice(end);
    var insertText = '';
    switch (kind){
      // [2026.09 버그수정] 선택 없이(범위 앞에서 한 번, 범위 끝에서 한 번 눌러 감싸려는 경우)
      // 클릭하면 예전엔 "굵은 글씨" 같은 안내용 글자까지 같이 들어가서, 그걸 지우고 다시
      // 마크(**)를 타이핑해야 했다 — 세무사님 지적으로 선택이 없을 땐 마크만 들어가게 한다
      // (시작점에서 한 번, 끝점에서 한 번 누르면 그대로 깔끔하게 감싸짐).
      // H는 누를 때마다 #을 하나씩만 넣는다 — 커서가 그대로 있으니 두 번 누르면 ##, 세 번
      // 누르면 ###이 된다(제목 레벨을 원하는 만큼 직접 쌓는 방식).
      // [2026.09 버그수정] *도 #과 똑같이 개수에 따라 뜻이 다르다(1개=기울임, 2개=굵게,
      // 3개=굵게+기울임) — H버튼처럼 누를 때마다 *를 하나씩만 넣어서, 필요한 개수만큼
      // 직접 눌러 쌓게 한다(선택 여부와 무관하게 항상 * 하나만 — 예전처럼 B/I를 따로 두고
      // 각각 **/*를 통째로 넣으면 세 개(굵게+기울임)는 아예 만들 방법이 없었다).
      case 'h2': insertText = '#'; break;
      case 'bold': insertText = '*'; break;
      case 'underline': {
        // 밑줄은 여는/닫는 태그가 서로 달라 시작·끝 두 번 클릭 방식이 안 맞는다 — 대신 선택이
        // 없으면 <u></u>를 한 번에 넣고 커서를 그 사이에 둬서 바로 이어 타이핑할 수 있게 한다.
        if (selected){ insertText = '<u>' + selected + '</u>'; break; }
        ta.value = before + '<u></u>' + after;
        ta.selectionStart = ta.selectionEnd = before.length + '<u>'.length;
        ta.focus();
        if (memoPreviewOn) renderMemoPreview_();
        return;
      }
      case 'color': {
        // [2026.09 신규] 마크다운엔 글자색 문법이 없어서, <span style="color:..."> HTML을 직접
        // 끼워넣는다 — 색 고르기는 색상 선택기가 뜨는 비동기 동작이라 별도 처리한다.
        var colorInput = document.getElementById('memoColorInput');
        colorInput.onchange = function(){
          var openTag = '<span style="color:' + colorInput.value + '">';
          if (selected){
            var wrapped = openTag + selected + '</span>';
            ta.value = before + wrapped + after;
            ta.selectionStart = ta.selectionEnd = before.length + wrapped.length;
          } else {
            ta.value = before + openTag + '</span>' + after;
            ta.selectionStart = ta.selectionEnd = before.length + openTag.length;
          }
          ta.focus();
          if (memoPreviewOn) renderMemoPreview_();
        };
        colorInput.click();
        return;
      }
      case 'list':
        insertText = '\n' + (selected ? selected.split('\n').map(function(l){ return '- ' + l; }).join('\n') : '- 항목1\n- 항목2\n- 항목3') + '\n';
        break;
      case 'checklist':
        insertText = '\n' + (selected ? selected.split('\n').map(function(l){ return '- [ ] ' + l; }).join('\n') : '- [ ] 할일1\n- [ ] 할일2') + '\n';
        break;
      case 'table': insertText = '\n| 항목 | 내용 |\n|---|---|\n| 첫째 | ' + (selected || '') + ' |\n| 둘째 |  |\n'; break;
      case 'mermaid': insertText = '\n```mermaid\nflowchart TD\n    A["시작"] --> B["' + (selected || '끝') + '"]\n```\n'; break;
      case 'footnote': {
        var used = Array.from(ta.value.matchAll(/\[\^(\d+)\]/g)).map(function(m){ return parseInt(m[1], 10); });
        var nextNum = used.length ? Math.max.apply(null, used) + 1 : 1;
        insertText = (selected ? selected + '[^' + nextNum + ']' : '[^' + nextNum + ']');
        var def = '\n\n[^' + nextNum + ']: ';
        ta.value = before + insertText + after + def;
        ta.selectionStart = ta.selectionEnd = before.length + insertText.length;
        ta.focus();
        if (memoPreviewOn) renderMemoPreview_();
        return;
      }
      case 'hr': insertText = '\n\n---\n\n'; break;
    }
    ta.value = before + insertText + after;
    var newPos = before.length + insertText.length;
    ta.selectionStart = ta.selectionEnd = newPos;
    ta.focus();
    if (memoPreviewOn) renderMemoPreview_();
  }

  // 도움말 패널 드래그 이동(마우스+터치) — reportwriter.html과 같은 방식.
  (function(){
    var panel = document.getElementById('memoMdHelpModal');
    var dragging = false, offsetX = 0, offsetY = 0;
    function shouldStartDrag(target){
      if (target.id === 'memoMdHelpCloseX') return false;
      if (target.closest('#memoMdHelpBody')) return false;
      return true;
    }
    function startDrag(clientX, clientY){
      dragging = true;
      var rect = panel.getBoundingClientRect();
      offsetX = clientX - rect.left; offsetY = clientY - rect.top;
      panel.style.left = rect.left + 'px';
      panel.style.margin = '0';
      document.body.style.userSelect = 'none';
    }
    function moveDrag(clientX, clientY){
      if (!dragging) return;
      var maxLeft = window.innerWidth - panel.offsetWidth;
      var maxTop = window.innerHeight - 40;
      panel.style.left = Math.min(Math.max(0, clientX - offsetX), maxLeft) + 'px';
      panel.style.top = Math.min(Math.max(0, clientY - offsetY), maxTop) + 'px';
    }
    function endDrag(){ dragging = false; document.body.style.userSelect = ''; }
    panel.addEventListener('mousedown', function(e){ if (shouldStartDrag(e.target)) startDrag(e.clientX, e.clientY); });
    document.addEventListener('mousemove', function(e){ moveDrag(e.clientX, e.clientY); });
    document.addEventListener('mouseup', endDrag);
    panel.addEventListener('touchstart', function(e){
      if (!shouldStartDrag(e.target)) return;
      var t = e.touches[0]; startDrag(t.clientX, t.clientY);
    }, { passive: true });
    document.addEventListener('touchmove', function(e){
      if (!dragging) return;
      var t = e.touches[0]; moveDrag(t.clientX, t.clientY);
    }, { passive: true });
    document.addEventListener('touchend', endDrag);
  })();

  // ============================================================
  // 찾기/바꾸기 (reportwriter.html과 같은 방식, memoText 대상)
  // ============================================================
  var memoFindMatches = [];
  var memoFindIndex = -1;

  function updateMemoFindMatches(){
    var query = document.getElementById('memoFindInput').value;
    memoFindMatches = [];
    memoFindIndex = -1;
    if (query){
      var lowerText = memoText.value.toLowerCase();
      var lowerQuery = query.toLowerCase();
      var pos = 0;
      while (true){
        var idx = lowerText.indexOf(lowerQuery, pos);
        if (idx === -1) break;
        memoFindMatches.push(idx);
        pos = idx + lowerQuery.length;
      }
    }
    document.getElementById('memoFindStatus').textContent =
      query ? (memoFindMatches.length ? '0/' + memoFindMatches.length : '0/0') : '';
  }
  function scrollMemoTextareaToSelection_(){
    var before = memoText.value.slice(0, memoText.selectionStart);
    var lineNum = before.split('\n').length - 1;
    var lineHeight = parseFloat(getComputedStyle(memoText).lineHeight) || 20;
    memoText.scrollTop = Math.max(0, lineNum * lineHeight - memoText.clientHeight / 2);
  }
  function selectMemoFindMatch_(){
    var query = document.getElementById('memoFindInput').value;
    var start = memoFindMatches[memoFindIndex];
    memoText.focus();
    memoText.setSelectionRange(start, start + query.length);
    scrollMemoTextareaToSelection_();
    document.getElementById('memoFindStatus').textContent = (memoFindIndex + 1) + '/' + memoFindMatches.length;
  }
  function goToMemoFindMatch_(direction){
    if (!memoFindMatches.length) return;
    memoFindIndex = memoFindIndex === -1 ? 0 : (memoFindIndex + direction + memoFindMatches.length) % memoFindMatches.length;
    selectMemoFindMatch_();
  }
  function replaceMemoCurrentMatch_(){
    if (memoFindIndex === -1 || !memoFindMatches.length) return;
    var query = document.getElementById('memoFindInput').value;
    var replacement = document.getElementById('memoReplaceInput').value;
    var start = memoFindMatches[memoFindIndex];
    memoText.value = memoText.value.slice(0, start) + replacement + memoText.value.slice(start + query.length);
    if (memoPreviewOn) renderMemoPreview_();
    updateMemoFindMatches();
    if (memoFindMatches.length){
      memoFindIndex = Math.min(memoFindIndex, memoFindMatches.length - 1);
      selectMemoFindMatch_();
    }
  }
  function replaceAllMemoMatches_(){
    var query = document.getElementById('memoFindInput').value;
    var replacement = document.getElementById('memoReplaceInput').value;
    if (!query) return;
    var count = memoFindMatches.length;
    var escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    memoText.value = memoText.value.replace(new RegExp(escaped, 'gi'), replacement);
    if (memoPreviewOn) renderMemoPreview_();
    updateMemoFindMatches();
    toast(count + '건 변경됨');
  }
  function openMemoFindBar_(){
    document.getElementById('memoFindReplaceBar').style.display = 'flex';
    var fi = document.getElementById('memoFindInput');
    fi.focus();
    fi.select();
    updateMemoFindMatches();
  }
  function closeMemoFindBar_(){
    document.getElementById('memoFindReplaceBar').style.display = 'none';
    memoFindMatches = [];
    memoFindIndex = -1;
  }
  document.getElementById('memoBtnFindOpen').addEventListener('click', function(){
    var bar = document.getElementById('memoFindReplaceBar');
    if (bar.style.display === 'flex') closeMemoFindBar_(); else openMemoFindBar_();
  });
  document.getElementById('memoFindInput').addEventListener('input', updateMemoFindMatches);
  document.getElementById('memoFindNext').addEventListener('click', function(){ goToMemoFindMatch_(1); });
  document.getElementById('memoFindPrev').addEventListener('click', function(){ goToMemoFindMatch_(-1); });
  document.getElementById('memoReplaceOne').addEventListener('click', replaceMemoCurrentMatch_);
  document.getElementById('memoReplaceAllBtn').addEventListener('click', replaceAllMemoMatches_);
  document.getElementById('memoFindInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); goToMemoFindMatch_(e.shiftKey ? -1 : 1); }
    else if (e.key === 'Escape'){ e.preventDefault(); closeMemoFindBar_(); }
  });
  memoText.addEventListener('keydown', function(e){
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f'){
      e.preventDefault();
      openMemoFindBar_();
    }
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ closeMemoMdHelpModal_(); closeMemoFindBar_(); }
  });

  // ============================================================
  // 글자 확대/축소 — reportwriter.html은 편집창/미리보기 확대를 따로 두지만, 메모는 한 번에
  // 하나만 보이는 구조라 하나의 배율을 텍스트창·미리보기 양쪽에 같이 적용한다.
  // ============================================================
  var memoZoomPct = 100;
  function applyMemoZoom_(){
    memoText.style.zoom = memoZoomPct + '%';
    memoPreviewEl.style.zoom = memoZoomPct + '%';
    document.getElementById('memoZoomLabel').textContent = memoZoomPct + '%';
  }
  document.getElementById('memoZoomIn').addEventListener('click', function(){
    memoZoomPct = Math.min(memoZoomPct + 10, 200);
    applyMemoZoom_();
  });
  document.getElementById('memoZoomOut').addEventListener('click', function(){
    memoZoomPct = Math.max(memoZoomPct - 10, 50);
    applyMemoZoom_();
  });

  // ============================================================
  // 전체화면 — reportwriter.html의 rwRoot 전체화면과 같은 API(Fullscreen API)를 쓰되, 메모는
  // 편집/미리보기가 한 화면에서 토글되는 구조라 화면 하나(view-memo-text)만 전체화면으로 만들면 된다.
  // ============================================================
  function toggleMemoFullscreen_(){
    var root = document.getElementById('view-memo-text');
    if (!document.fullscreenElement){
      (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  }
  document.getElementById('memoBtnFullscreen').addEventListener('click', toggleMemoFullscreen_);
  document.addEventListener('fullscreenchange', function(){
    var inFs = !!document.fullscreenElement;
    var btn = document.getElementById('memoBtnFullscreen');
    if (btn) btn.title = inFs ? '전체화면 나가기' : '전체화면으로 보기';
  });

  // ============================================================
  // 엑셀/구글시트에서 표를 복사해 붙여넣으면 마크다운 표로 자동 변환 (reportwriter.html과 동일)
  // ============================================================
  function memoGridToMarkdownTable_(grid){
    if (!grid || !grid.length) return null;
    function cellText(raw){
      var t = String(raw == null ? '' : raw).replace(/\r\n|\r|\n/g, '<br>').trim();
      t = t.replace(/\|/g, '\\|');
      return t || ' ';
    }
    var cleaned = grid.map(function(row){ return row.map(cellText); });
    var colCount = Math.max.apply(null, cleaned.map(function(r){ return r.length; }));
    cleaned.forEach(function(r){ while (r.length < colCount) r.push(' '); });
    var header = cleaned[0];
    var body = cleaned.slice(1);
    var lines = [];
    lines.push('| ' + header.join(' | ') + ' |');
    lines.push('|' + header.map(function(){ return ':--'; }).join('|') + '|');
    body.forEach(function(r){ lines.push('| ' + r.join(' | ') + ' |'); });
    return lines.join('\n');
  }
  function memoHtmlTableToMarkdown_(tableEl){
    var rows = Array.from(tableEl.querySelectorAll('tr'));
    if (!rows.length) return null;
    function cellsOf(tr){ return Array.from(tr.querySelectorAll('td,th')); }
    var totalCells = rows.reduce(function(sum, tr){ return sum + cellsOf(tr).length; }, 0);
    if (totalCells <= 1) return null;
    var grid = rows.map(function(tr){ return cellsOf(tr).map(function(cell){ return cell.textContent; }); });
    return memoGridToMarkdownTable_(grid);
  }
  function memoParseTsvToGrid_(text){
    var lines = text.replace(/\r\n?/g, '\n').split('\n');
    while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();
    if (lines.length < 2) return null;
    var rows = lines.map(function(l){ return l.split('\t'); });
    if (rows.some(function(r){ return r.length < 2; })) return null;
    var counts = {};
    rows.forEach(function(r){ counts[r.length] = (counts[r.length] || 0) + 1; });
    var mode = Object.keys(counts).reduce(function(a, b){ return counts[a] > counts[b] ? a : b; });
    if (counts[mode] / rows.length < 0.8) return null;
    return rows;
  }
  memoText.addEventListener('paste', function(e){
    var html = e.clipboardData && e.clipboardData.getData('text/html');
    if (html && /<table[\s>]/i.test(html)){
      var table = null;
      try {
        var safeHtml = (typeof DOMPurify !== 'undefined') ? DOMPurify.sanitize(html) : html;
        table = new DOMParser().parseFromString(safeHtml, 'text/html').querySelector('table');
      } catch (err){ table = null; }
      var md = table ? memoHtmlTableToMarkdown_(table) : null;
      if (md){
        e.preventDefault();
        document.execCommand('insertText', false, md);
        toast('엑셀 표 모양대로 붙여넣었습니다');
      }
      return;
    }
    var plain = e.clipboardData && e.clipboardData.getData('text/plain');
    if (plain && plain.indexOf('\t') !== -1){
      var grid = memoParseTsvToGrid_(plain);
      var md2 = grid ? memoGridToMarkdownTable_(grid) : null;
      if (md2){
        e.preventDefault();
        document.execCommand('insertText', false, md2);
        toast('탭으로 구분된 내용을 표로 붙여넣었습니다');
      }
    }
  });
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
  // ============================================================
  // 필기메모 — document-tools.js의 noteOverlay 캔버스 필기 로직을 그대로 이식.
  // 원본은 저장 시 AI로 손글씨를 자동 텍스트변환했지만, 1단계는 AI를 쓰지 않으므로
  // 필기 페이지를 그대로 PDF로 묶어 고객 폴더(또는 일반메모)에 저장한다.
  // ============================================================
  (function(){
    var noteCanvasWrap = document.getElementById('noteCanvasWrap');
    var noteZoomInner = document.getElementById('noteZoomInner');
    var noteBgCanvas = document.getElementById('noteBgCanvas');
    var bgCtx = noteBgCanvas.getContext('2d');
    var noteCanvas = document.getElementById('noteCanvas');
    var ctx = noteCanvas.getContext('2d');
    var notePenColor = document.getElementById('notePenColor');
    var notePenSize = document.getElementById('notePenSize');
    var btnNoteToolMode = document.getElementById('btnNoteToolMode');
    var btnNoteUndo = document.getElementById('btnNoteUndo');
    var btnNoteRedo = document.getElementById('btnNoteRedo');
    var btnNoteClear = document.getElementById('btnNoteClear');
    var btnNoteBgImage = document.getElementById('btnNoteBgImage');
    var noteBgFileInput = document.getElementById('noteBgFileInput');
    var btnNoteBgPattern = document.getElementById('btnNoteBgPattern');
    var btnNoteZoom = document.getElementById('btnNoteZoom');
    var btnNotePrevPage = document.getElementById('btnNotePrevPage');
    var btnNoteNextPage = document.getElementById('btnNoteNextPage');
    var notePageIndicator = document.getElementById('notePageIndicator');

    var TOOL_MODES = ['pen', 'highlight', 'eraser', 'select', 'line', 'rect'];
    var TOOL_MODE_ICON = { pen: '✏️', highlight: '🖍', eraser: '🧹', select: '✂️', line: '📏', rect: '▭' };
    var TOOL_MODE_LABEL = { pen: '펜', highlight: '형광펜', eraser: '지우개', select: '영역삭제', line: '직선', rect: '사각형' };
    var toolModeIndex = 0, toolMode = TOOL_MODES[0];

    var drawing = false, lastX = 0, lastY = 0;
    var lastPenTime = 0, PALM_REJECT_WINDOW_MS = 600;
    var undoStack = [], redoStack = [];
    var shapeSnapshotImageData = null, shapeStartPoint = null, shapeCurrentPoint = null;

    var notePages = [''], notePageBackgrounds = [null], noteCurrentPageIndex = 0;
    var bgPatternMode = 'none', zoomLevel = 1;
    var noteInited = false;

    function updatePageIndicator(){ notePageIndicator.textContent = (noteCurrentPageIndex + 1) + '/' + notePages.length; }
    function saveCurrentPageSnapshot(){ notePages[noteCurrentPageIndex] = noteCanvas.toDataURL('image/png'); }

    function renderCurrentBackground(){
      bgCtx.clearRect(0, 0, noteBgCanvas.width, noteBgCanvas.height);
      var bg = notePageBackgrounds[noteCurrentPageIndex];
      if (bg){
        var img = new Image();
        img.onload = function(){ bgCtx.drawImage(img, 0, 0, noteCanvasWrap.clientWidth, noteCanvasWrap.clientHeight); };
        img.src = bg;
      }
    }
    function loadPage(index){
      saveCurrentPageSnapshot();
      noteCurrentPageIndex = index;
      undoStack = []; redoStack = [];
      var w = noteCanvasWrap.clientWidth, h = noteCanvasWrap.clientHeight;
      ctx.clearRect(0, 0, noteCanvas.width, noteCanvas.height);
      var saved = notePages[noteCurrentPageIndex];
      if (saved && saved.length > 100){
        var img = new Image();
        img.onload = function(){ ctx.drawImage(img, 0, 0, w, h); };
        img.src = saved;
      }
      renderCurrentBackground();
      updatePageIndicator();
    }
    function resizeCanvasToWrap(){
      var prevInk = noteCanvas.toDataURL ? noteCanvas.toDataURL('image/png') : null;
      var dpr = window.devicePixelRatio || 1;
      var w = noteCanvasWrap.clientWidth, h = noteCanvasWrap.clientHeight;
      noteCanvas.width = Math.max(1, Math.round(w * dpr));
      noteCanvas.height = Math.max(1, Math.round(h * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      if (prevInk && prevInk.length > 100){
        var img = new Image();
        img.onload = function(){ ctx.drawImage(img, 0, 0, w, h); };
        img.src = prevInk;
      }
      noteBgCanvas.width = Math.max(1, Math.round(w * dpr));
      noteBgCanvas.height = Math.max(1, Math.round(h * dpr));
      bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      renderCurrentBackground();
    }
    function getPoint(e){
      var rect = noteCanvas.getBoundingClientRect();
      var scaleX = rect.width ? (noteCanvasWrap.clientWidth / rect.width) : 1;
      return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleX, pressure: (e.pressure && e.pressure > 0) ? e.pressure : 0.5 };
    }
    function pushUndoSnapshot(){
      undoStack.push(noteCanvas.toDataURL('image/png'));
      if (undoStack.length > 30) undoStack.shift();
      redoStack = [];
    }
    function applyStrokeStyle(pressure){
      var baseSize = Number(notePenSize.value) || 3;
      if (toolMode === 'eraser'){
        ctx.globalCompositeOperation = 'destination-out'; ctx.globalAlpha = 1; ctx.lineWidth = baseSize * 3;
      } else if (toolMode === 'highlight'){
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 0.35; ctx.strokeStyle = notePenColor.value; ctx.lineWidth = baseSize * 4;
      } else {
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.strokeStyle = notePenColor.value;
        ctx.lineWidth = Math.max(0.8, baseSize * (0.4 + (pressure || 0.5)));
      }
    }

    noteCanvas.addEventListener('pointerdown', function(e){
      if (e.pointerType === 'touch' && (Date.now() - lastPenTime) < PALM_REJECT_WINDOW_MS) return;
      if (e.pointerType === 'pen') lastPenTime = Date.now();
      drawing = true;
      noteCanvas.setPointerCapture(e.pointerId);
      var p = getPoint(e);
      if (toolMode === 'line' || toolMode === 'rect' || toolMode === 'select'){
        pushUndoSnapshot();
        shapeSnapshotImageData = ctx.getImageData(0, 0, noteCanvas.width, noteCanvas.height);
        shapeStartPoint = p; shapeCurrentPoint = p;
        return;
      }
      pushUndoSnapshot();
      lastX = p.x; lastY = p.y;
    });
    noteCanvas.addEventListener('pointermove', function(e){
      if (!drawing) return;
      if (e.pointerType === 'touch' && (Date.now() - lastPenTime) < PALM_REJECT_WINDOW_MS) return;
      var p = getPoint(e);
      if (toolMode === 'select'){
        if (!shapeSnapshotImageData) return;
        shapeCurrentPoint = p;
        ctx.putImageData(shapeSnapshotImageData, 0, 0);
        ctx.save();
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
        ctx.setLineDash([6, 4]); ctx.strokeStyle = '#b3261e'; ctx.lineWidth = 1.5;
        var rx = shapeStartPoint.x, ry = shapeStartPoint.y, rw = p.x - shapeStartPoint.x, rh = p.y - shapeStartPoint.y;
        ctx.strokeRect(rx, ry, rw, rh);
        ctx.fillStyle = 'rgba(225, 29, 72, 0.1)'; ctx.fillRect(rx, ry, rw, rh);
        ctx.restore();
        return;
      }
      if (toolMode === 'line' || toolMode === 'rect'){
        if (!shapeSnapshotImageData) return;
        ctx.putImageData(shapeSnapshotImageData, 0, 0);
        applyStrokeStyle(p.pressure);
        ctx.beginPath();
        if (toolMode === 'line'){ ctx.moveTo(shapeStartPoint.x, shapeStartPoint.y); ctx.lineTo(p.x, p.y); }
        else { ctx.rect(shapeStartPoint.x, shapeStartPoint.y, p.x - shapeStartPoint.x, p.y - shapeStartPoint.y); }
        ctx.stroke();
        return;
      }
      applyStrokeStyle(p.pressure);
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
      lastX = p.x; lastY = p.y;
    });
    function endStroke(){
      if (toolMode === 'select' && shapeSnapshotImageData && shapeStartPoint && shapeCurrentPoint){
        ctx.putImageData(shapeSnapshotImageData, 0, 0);
        var x = Math.min(shapeStartPoint.x, shapeCurrentPoint.x), y = Math.min(shapeStartPoint.y, shapeCurrentPoint.y);
        var w = Math.abs(shapeCurrentPoint.x - shapeStartPoint.x), h = Math.abs(shapeCurrentPoint.y - shapeStartPoint.y);
        if (w > 2 && h > 2) ctx.clearRect(x, y, w, h);
      }
      drawing = false; shapeSnapshotImageData = null; shapeStartPoint = null; shapeCurrentPoint = null;
      ctx.globalAlpha = 1;
    }
    noteCanvas.addEventListener('pointerup', endStroke);
    noteCanvas.addEventListener('pointercancel', endStroke);
    noteCanvas.addEventListener('pointerleave', endStroke);

    btnNoteToolMode.addEventListener('click', function(){
      toolModeIndex = (toolModeIndex + 1) % TOOL_MODES.length;
      toolMode = TOOL_MODES[toolModeIndex];
      btnNoteToolMode.textContent = TOOL_MODE_ICON[toolMode];
      btnNoteToolMode.title = TOOL_MODE_LABEL[toolMode];
    });
    btnNoteUndo.addEventListener('click', function(){
      if (!undoStack.length){ toast('더 되돌릴 내용이 없습니다.'); return; }
      redoStack.push(noteCanvas.toDataURL('image/png'));
      var prev = undoStack.pop();
      var img = new Image();
      var w = noteCanvasWrap.clientWidth, h = noteCanvasWrap.clientHeight;
      img.onload = function(){ ctx.clearRect(0, 0, noteCanvas.width, noteCanvas.height); ctx.drawImage(img, 0, 0, w, h); };
      img.src = prev;
    });
    btnNoteRedo.addEventListener('click', function(){
      if (!redoStack.length){ toast('다시 실행할 내용이 없습니다.'); return; }
      undoStack.push(noteCanvas.toDataURL('image/png'));
      var next = redoStack.pop();
      var img = new Image();
      var w = noteCanvasWrap.clientWidth, h = noteCanvasWrap.clientHeight;
      img.onload = function(){ ctx.clearRect(0, 0, noteCanvas.width, noteCanvas.height); ctx.drawImage(img, 0, 0, w, h); };
      img.src = next;
    });
    btnNoteClear.addEventListener('click', function(){
      nxConfirm_('지금 페이지에 쓴 메모를 지웁니다. 계속할까요?').then(function(ok){
        if (!ok) return;
        pushUndoSnapshot();
        ctx.clearRect(0, 0, noteCanvas.width, noteCanvas.height);
      });
    });

    btnNoteBgImage.addEventListener('click', function(){ noteBgFileInput.click(); });
    noteBgFileInput.addEventListener('change', function(e){
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        notePageBackgrounds[noteCurrentPageIndex] = reader.result;
        renderCurrentBackground();
        toast('배경 이미지를 불러왔습니다.');
      };
      reader.readAsDataURL(file);
      noteBgFileInput.value = '';
    });

    btnNoteBgPattern.addEventListener('click', function(){
      var modes = ['none', 'ruled', 'grid'];
      bgPatternMode = modes[(modes.indexOf(bgPatternMode) + 1) % modes.length];
      noteCanvasWrap.classList.remove('note-bg-ruled', 'note-bg-grid');
      if (bgPatternMode === 'ruled') noteCanvasWrap.classList.add('note-bg-ruled');
      if (bgPatternMode === 'grid') noteCanvasWrap.classList.add('note-bg-grid');
      btnNoteBgPattern.textContent = { none: '▦', ruled: '≡', grid: '⊞' }[bgPatternMode];
    });

    btnNoteZoom.addEventListener('click', function(){
      var levels = [1, 1.5, 2];
      zoomLevel = levels[(levels.indexOf(zoomLevel) + 1) % levels.length];
      noteZoomInner.style.transform = 'scale(' + zoomLevel + ')';
      noteZoomInner.style.width = (100 / zoomLevel) + '%';
      noteZoomInner.style.height = (100 / zoomLevel) + '%';
      noteCanvasWrap.classList.toggle('note-zoomed', zoomLevel > 1);
      noteCanvas.style.touchAction = zoomLevel > 1 ? 'pan-x pan-y' : 'none';
      if (zoomLevel > 1) toast('확대됨 — 손가락으로는 화면만 이동됩니다.');
    });

    btnNotePrevPage.addEventListener('click', function(){
      if (noteCurrentPageIndex === 0) return;
      loadPage(noteCurrentPageIndex - 1);
    });
    btnNoteNextPage.addEventListener('click', function(){
      if (noteCurrentPageIndex < notePages.length - 1){ loadPage(noteCurrentPageIndex + 1); }
      else {
        saveCurrentPageSnapshot();
        notePages.push(''); notePageBackgrounds.push(null);
        loadPage(notePages.length - 1);
      }
    });

    function resetUi(){
      toolModeIndex = 0; toolMode = TOOL_MODES[0];
      btnNoteToolMode.textContent = TOOL_MODE_ICON[toolMode];
      zoomLevel = 1;
      noteZoomInner.style.transform = 'scale(1)'; noteZoomInner.style.width = '100%'; noteZoomInner.style.height = '100%';
      noteCanvasWrap.classList.remove('note-zoomed');
      noteCanvas.style.touchAction = 'none';
      btnNoteZoom.textContent = '🔍';
      bgPatternMode = 'none';
      noteCanvasWrap.classList.remove('note-bg-ruled', 'note-bg-grid');
      btnNoteBgPattern.textContent = '▦';
    }

    function initMemoHand(){
      if (!noteInited){
        noteInited = true;
        notePages = ['']; notePageBackgrounds = [null]; noteCurrentPageIndex = 0;
        undoStack = []; redoStack = [];
        resetUi();
        updatePageIndicator();
        requestAnimationFrame(function(){
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          noteCanvas.width = 0; noteCanvas.height = 0;
          resizeCanvasToWrap();
        });
      }
    }
    window.initMemoHand = initMemoHand;
    // [2026.11.14 메모 한 창] 손글씨 탭이 보일 때만 크기를 다시 잰다 — 숨은(글 탭) 채로 재면 그림판 폭이 0이 되어 그린 것이 지워진다
    function memoHandVisible_(){ return noteCanvasWrap.clientWidth > 0 && noteCanvasWrap.clientHeight > 0; }
    window.addEventListener('resize', function(){
      if (memoHandVisible_()) resizeCanvasToWrap();
    });
    // 손글씨 탭으로 돌아왔을 때 — 숨어 있던 사이 창 크기가 바뀌었으면 그린 것을 지키며 맞춘다
    window.memoHandFit_ = function(){
      if (!memoHandVisible_()) return;
      var dpr = window.devicePixelRatio || 1;
      if (noteCanvas.width !== Math.max(1, Math.round(noteCanvasWrap.clientWidth * dpr)) || noteCanvas.height !== Math.max(1, Math.round(noteCanvasWrap.clientHeight * dpr))) resizeCanvasToWrap();
    };

    function flattenPage(inkDataUrl, bgDataUrl, w, h){
      return new Promise(function(resolve){
        var dpr = window.devicePixelRatio || 1;
        var off = document.createElement('canvas');
        off.width = Math.max(1, Math.round(w * dpr)); off.height = Math.max(1, Math.round(h * dpr));
        var octx = off.getContext('2d');
        octx.setTransform(dpr, 0, 0, dpr, 0, 0);
        octx.fillStyle = '#fff'; octx.fillRect(0, 0, w, h);
        function drawInkThenResolve(){
          if (inkDataUrl && inkDataUrl.length > 100){
            var inkImg = new Image();
            inkImg.onload = function(){ octx.drawImage(inkImg, 0, 0, w, h); resolve(off.toDataURL('image/png')); };
            inkImg.src = inkDataUrl;
          } else { resolve(off.toDataURL('image/png')); }
        }
        if (bgDataUrl){
          var bgImg = new Image();
          bgImg.onload = function(){ octx.drawImage(bgImg, 0, 0, w, h); drawInkThenResolve(); };
          bgImg.src = bgDataUrl;
        } else { drawInkThenResolve(); }
      });
    }

    // [2026.11.14 메모 한 창] 손글씨의 💾 단추는 걷고, 창 위 공통 단추(「사건에 넣기」「일반메모로 저장」)가 이 두 함수를 부른다
    //  memoHandBuildPdf_ — 그린 쪽들을 PDF 하나로(그린 것이 없으면 null) / memoHandReset_ — 넣은 뒤 그림판 비우기
    window.memoHandBuildPdf_ = async function(){
      saveCurrentPageSnapshot();
      var w = noteCanvasWrap.clientWidth, h = noteCanvasWrap.clientHeight;
      var pageIndexesToInclude = [];
      for (var i = 0; i < notePages.length; i++){
        var hasInk = notePages[i] && notePages[i].length > 100;
        var hasBg = !!notePageBackgrounds[i];
        if (hasInk || hasBg) pageIndexesToInclude.push(i);
      }
      if (!pageIndexesToInclude.length) return null;
      var outDoc = await PDFLib.PDFDocument.create();
      for (var idx of pageIndexesToInclude){
        var flatDataUrl = await flattenPage(notePages[idx], notePageBackgrounds[idx], w, h);
        var base64Png = flatDataUrl.split(',')[1];
        var pngBytes = Uint8Array.from(atob(base64Png), function(c){ return c.charCodeAt(0); });
        var embedded = await outDoc.embedPng(pngBytes);
        var page = outDoc.addPage([embedded.width, embedded.height]);
        page.drawImage(embedded, { x: 0, y: 0, width: embedded.width, height: embedded.height });
      }
      var pdfBytes = await outDoc.save();
      var pdfName = '필기메모_' + new Date().toISOString().slice(0,16).replace(/[-:T]/g, '') + '.pdf';
      return { name: pdfName, mimeType: 'application/pdf', base64Data: uint8ToBase64(pdfBytes) };
    };
    window.memoHandReset_ = function(){
      notePages = ['']; notePageBackgrounds = [null]; noteCurrentPageIndex = 0;
      noteInited = false;
      initMemoHand();
    };
  })();
</script>

<script>
  // ============================================================
  // [2026.09 신규] 의뢰서 작성 — work.netax.kr 메모장의 "일반메모/사건개시템플릿" 콤보박스를
  // 다시 만든 것(사용자 요청: "사건시스템에서 의뢰서 작성을 클릭하면 템플릿 콤보박스가 열리고,
  // 연결할 사건을 선택하면 그 사건 폴더에 저장되고, 아직 연결할 사건이 없으면 새사건으로
  // 연결을 안내하면서 그 사건 폴더에 저장되는 형식"). 새 사건 생성 시 자동으로 붙는 템플릿
  // (work_seedCaseTemplateIfAny_)과는 별개 경로 — 언제든 원하는 템플릿을 원하는 사건에 직접
  // 붙일 수 있다. 저장 파일명은 "템플릿명_고객명"으로 만들어(자동으로 이미 들어간 빈 템플릿과
  // 이름이 겹쳐 덮어써지지 않도록) 별도 파일로 남긴다.
  // ============================================================
  // [2026.11.14 메모 한 창] 의뢰서 작성 전환 칸(memoReqPanel·전용 글칸)은 걷고, 양식은 「양식 ▾」(memoTplSelect)로 메모 칸에 불러온다.
  //  「사건에 넣기」 창은 글·손글씨·넥스 대화가 함께 쓴다(아래 memoOpenCaseDialog_).
  var memoReqTemplateSelectEl = document.getElementById('memoTplSelect');
  var memoReqApplyStepEl = document.getElementById('memoReqApplyStep');
  var memoReqInited_ = false;
  var memoReqTemplates_ = []; // listCaseTemplates 결과 그대로 보관
  var memoReqSelectedTemplate_ = null;
  var memoReqAllCases_ = [];

  // 템플릿 이름만으로 세목/업무유형을 짐작해 새 사건 폼에 미리 채워준다(맞으면 좋고, 틀리면
  // 사용자가 그냥 다시 고르면 됨 — 강제 아님). "양도신고"처럼 세목+업무유형이 합쳐진 이름,
  // "세무조사"처럼 업무유형만으로 이미 고유한 이름, "양도"처럼 세목만인 이름 순으로 확인한다.
  function memoReqGuessSemokUptype_(templateName){
    // [2026.09.17] 의뢰서템플릿 파일명이 전부 "의뢰서_" 접두어를 쓰는 규칙으로 바뀌어서,
    // 세목/업무유형을 짐작할 땐 그 접두어를 뗀 나머지로 비교해야 한다.
    if (templateName.indexOf('의뢰서_') === 0) templateName = templateName.slice('의뢰서_'.length);
    var semokLabels = (typeof WORK_SEMOK_LABELS !== 'undefined') ? WORK_SEMOK_LABELS : { transfer:'양도', gift:'증여', inheritance:'상속', objection:'불복', business:'사업' };
    var semokKeys = Object.keys(semokLabels);
    for (var i = 0; i < semokKeys.length; i++){
      var key = semokKeys[i], label = semokLabels[key];
      if (templateName === label) return { semok: key, uptype: null };
      if (templateName.indexOf(label) === 0){
        var rest = templateName.slice(label.length);
        var uptypeOptions = (typeof WORK_UPTYPE_OPTIONS_ !== 'undefined' && WORK_UPTYPE_OPTIONS_[key]) || [];
        if (uptypeOptions.indexOf(rest) !== -1) return { semok: key, uptype: rest };
      }
    }
    // 불복 세부유형(세목 접두어 없이 이름 자체가 업무유형인 경우) — 예: "세무조사", "경정청구".
    var objUptypes = (typeof WORK_UPTYPE_OPTIONS_ !== 'undefined' && WORK_UPTYPE_OPTIONS_.objection) || [];
    if (objUptypes.indexOf(templateName) !== -1) return { semok: 'objection', uptype: templateName };
    return null;
  }

  // [2026.11.14 메모 한 창] 양식 목록은 「양식 ▾」 고르기 상자로 — 고르면 그 양식 글을 메모 칸에 불러온다(따로 칸이 바뀌지 않음).
  //  글로 불러올 수 있는 양식(.md 등)만 보인다(지금 양식 27개 모두 글).
  function memoReqLoadTemplates_(){
    memoReqTemplateSelectEl.innerHTML = '<option value="">양식 ▾ (불러오는 중…)</option>';
    callGas('listCaseTemplates', {}).then(function(res){
      if (res.error){ memoReqTemplateSelectEl.innerHTML = '<option value="">양식 ▾ (' + escapeHtml(res.error) + ')</option>'; return; }
      memoReqTemplates_ = (res.templates || []).filter(function(t){ return t.isText; });
      if (!memoReqTemplates_.length){
        memoReqTemplateSelectEl.innerHTML = '<option value="">양식 ▾ (양식 없음)</option>';
        return;
      }
      // [2026.10.22 묶음 ㅁ4] 자주 쓰는 신고 3개(양도·상속·증여)를 맨 위에 — 목록 27개 가나다순에 섞여 찾기 어려웠다(가상양도7 표 4)
      var memoReqTplRank_ = function(n){ n = String(n || ''); return /양도\s*신고/.test(n) ? 0 : /상속\s*신고/.test(n) ? 1 : /증여\s*신고/.test(n) ? 2 : 9; };
      var memoReqTplSorted_ = memoReqTemplates_.slice().sort(function(a, b){ return (memoReqTplRank_(a.name) - memoReqTplRank_(b.name)) || String(a.name).localeCompare(String(b.name), 'ko'); });
      memoReqTemplateSelectEl.innerHTML = '<option value="">양식 ▾</option>' +
        memoReqTplSorted_.map(function(t){ return '<option value="' + t.id + '">' + escapeHtml(String(t.name).replace(/^의뢰서_/, '')) + '</option>'; }).join('');
      if (memoReqSelectedTemplate_) memoReqTemplateSelectEl.value = memoReqSelectedTemplate_.id;
    }).catch(function(err){
      memoReqTemplateSelectEl.innerHTML = '<option value="">양식 ▾ (불러오지 못함)</option>';
      toast('양식 목록을 불러오지 못했습니다: ' + nxErrText_(err));
    });
  }
  window.memoEnsureTemplates_ = function(){ if (!memoReqInited_){ memoReqInited_ = true; memoReqLoadTemplates_(); } };

  // [2026.09.17 신규] "증여신고" 등 옛 이름 그대로인 템플릿 파일에 "의뢰서_" 접두어를 일괄로
  // 붙인다 — 이름변경뿐이라 파괴적이지 않으므로 dry-run 없이 바로 실행하고 결과만 보여준다
  // (보고서템플릿 정리 버튼과 동일 원칙).
  // [2026.11.01] 단추는 설정 › 정비도구 › 의뢰 메모로 옮김(거기서 부름)
  window.memoReqTplNameFix_ = function(){
    callGas('migrate_case_template_names', {}).then(function(res){
      if (res.success === false){ nxAlert_(res.message || '실패했습니다.', '템플릿 이름정리'); return; }
      nxAlert_(res.log.join('\n'), '템플릿 이름정리 결과');
      memoReqLoadTemplates_();
    }).catch(function(err){
      nxAlert_('오류: ' + nxErrText_(err), '템플릿 이름정리');
    });
  };
  // ---- 「양식 ▾」 — 고른 의뢰서 양식을 메모 칸에 불러온다(글이 있으면 뒤에 붙일지 묻는다) ----
  memoReqTemplateSelectEl.addEventListener('change', function(){
    var sel = memoReqTemplateSelectEl;
    var tpl = memoReqTemplates_.filter(function(t){ return t.id === sel.value; })[0];
    var backTo_ = function(){ sel.value = memoReqSelectedTemplate_ ? memoReqSelectedTemplate_.id : ''; };
    if (!tpl){ backTo_(); return; }
    var load_ = function(append){
      exitMemoPreview_();
      var prev = memoText.value;
      var lead = append ? prev.replace(/\s+$/, '') + '\n\n' : '';
      memoText.value = lead + '(양식 불러오는 중…)';
      memoText.disabled = true;
      callGas('getCaseTemplateContent', { fileId: tpl.id }).then(function(res){
        if (res.error){ toast(res.error); memoText.value = prev; backTo_(); return; }
        memoText.value = lead + (res.content || '');
        memoReqSelectedTemplate_ = tpl;
        memoText.focus();
      }).catch(function(err){
        toast('양식을 불러오지 못했습니다: ' + nxErrText_(err));
        memoText.value = prev; backTo_();
      }).finally(function(){ memoText.disabled = false; });
    };
    if (memoText.value.trim()){
      nxConfirm_('지금 적은 글 뒤에 「' + String(tpl.name).replace(/^의뢰서_/, '') + '」 양식을 붙일까요?\n(취소하면 그대로 둡니다)').then(function(ok){ if (ok) load_(true); else backTo_(); });
    } else {
      load_(false);
    }
  });

  // ---- 「메모」 한 창 — ⌨ 글 / ✍ 손글씨 탭 (세무사님 11-14 "일반메모와 필기메모를 하나의 창으로 전환") ----
  //  탭을 바꿔도 적던 글·그리던 그림은 그대로(손글씨 그림판은 숨은 동안 크기를 다시 재지 않는다 — memoHandFit_)
  var memoTab_ = 'text';
  function memoSetTab_(t){
    if (t === 'text' || t === 'hand') memoTab_ = t;
    var hand = memoTab_ === 'hand';
    document.getElementById('memoTextPane').style.display = hand ? 'none' : '';
    document.getElementById('memoHandPane').style.display = hand ? '' : 'none';
    document.querySelectorAll('#memoTabBar [data-memo-tab]').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-memo-tab') === memoTab_); });
    if (hand){
      if (typeof initMemoHand === 'function') initMemoHand();
      requestAnimationFrame(function(){ if (window.memoHandFit_) window.memoHandFit_(); });
    }
    window._currentViewLabel = hand ? '메모(손글씨)' : '메모';
  }
  window.memoSetTab_ = memoSetTab_;
  window.memoCurrentTab_ = function(){ return memoTab_; };
  document.getElementById('memoTabBar').addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('[data-memo-tab]');
    if (b) memoSetTab_(b.getAttribute('data-memo-tab'));
  });

  // ---- 두 탭 공통 단추 — 「사건에 넣기」「일반메모로 저장」 ----
  function memoHandPdfThen_(btn, next){
    btn.disabled = true;
    Promise.resolve(window.memoHandBuildPdf_ ? window.memoHandBuildPdf_() : null).then(function(pdf){
      if (!pdf){ toast('그린 것이 없습니다.'); return; }
      next(pdf);
    }).catch(function(err){
      toast('손글씨를 PDF로 만들지 못했습니다: ' + nxErrText_(err));
    }).finally(function(){ btn.disabled = false; });
  }
  var memoHandResetCb_ = function(){ if (window.memoHandReset_) window.memoHandReset_(); };
  document.getElementById('memoBtnToCase').addEventListener('click', function(){
    if (memoTab_ === 'hand'){
      memoHandPdfThen_(this, function(pdf){ memoOpenCaseDialog_({ content: '', extraFile: pdf, origin: '손글씨', onDone: memoHandResetCb_ }); });
      return;
    }
    var content = memoText.value.trim();
    if (!content){ toast('적은 내용이 없습니다.'); return; }
    memoOpenCaseDialog_({ content: content, origin: '메모', template: memoReqSelectedTemplate_ });
  });
  document.getElementById('memoBtnSave').addEventListener('click', function(){
    if (memoTab_ === 'hand'){
      memoHandPdfThen_(this, function(pdf){ memoOpenGeneralSave_({ content: '', extraFile: pdf, onDone: memoHandResetCb_ }); });
      return;
    }
    if (editingGeneralMemoFile){ saveOverExistingGeneralMemo_(); return; }
    if (!memoText.value.trim()){ toast('적은 내용이 없습니다.'); return; }
    memoOpenGeneralSave_({ content: memoText.value.trim(), onDone: function(){
      memoText.value = ''; memoReqSelectedTemplate_ = null; memoReqTemplateSelectEl.value = '';
    } });
  });

  // ---- 「사건에 넣기」 창 열기 — ctx = { content, extraFile(손글씨 PDF), origin('메모'|'손글씨'|'넥스 대화'), template, onDone } ----
  var memoCaseCtx_ = null;
  function memoOpenCaseDialog_(ctx){
    memoCaseCtx_ = ctx || {};
    document.getElementById('memoReqNewCustomer').value = '';
    document.getElementById('memoReqNewTaxpayer').value = '';
    document.getElementById('memoReqNewRequestDate').value = nxLocalDateStr_();
    document.getElementById('memoReqApplyDesc').textContent = memoCaseCtx_.extraFile
      ? '손글씨 PDF를 그 사건 폴더에 넣고, 그 사건 의뢰서 파일 맨 앞에 상담기록 한 줄을 쌓습니다.'
      : '새 사건으로 등록하거나 이미 있는 사건을 고르면, 적은 내용을 그 사건의 의뢰서 파일 맨 앞에 상담기록으로 쌓습니다.';
    var semokSel = document.getElementById('memoReqNewSemok');
    var uptypeSel = document.getElementById('memoReqNewUptype');
    function refreshUptypeOptions(){
      var options = (typeof WORK_UPTYPE_OPTIONS_ !== 'undefined' && WORK_UPTYPE_OPTIONS_[semokSel.value]) || ['신고', '자문', '상담'];
      uptypeSel.innerHTML = options.map(function(u){ return '<option value="' + u + '">' + u + '</option>'; }).join('');
    }
    var guess = memoCaseCtx_.template ? memoReqGuessSemokUptype_(memoCaseCtx_.template.name) : null; // 양식 이름으로 세목·업무유형 짐작(강제 아님)
    semokSel.value = guess ? guess.semok : 'transfer';
    semokSel.onchange = refreshUptypeOptions;
    refreshUptypeOptions();
    if (guess && guess.uptype) uptypeSel.value = guess.uptype;

    var applySel = document.getElementById('memoReqApplyCaseSelect');
    applySel.innerHTML = '<option value="">불러오는 중…</option>';
    callGas('work_get_cases', {}).then(function(res){
      memoReqAllCases_ = res.cases || [];
      applySel.innerHTML = buildCaseOptionsHtml_(memoReqAllCases_, { placeholder: '사건 선택' });
    }).catch(function(){ applySel.innerHTML = '<option value="">불러오지 못함</option>'; });

    memoReqApplyStepEl.style.display = 'flex';
    setTimeout(function(){ document.getElementById('memoReqNewCustomer').focus(); }, 50);
  }
  window.memoOpenCaseDialog_ = memoOpenCaseDialog_;
  document.getElementById('memoReqApplyCancel').addEventListener('click', function(){ memoReqApplyStepEl.style.display = 'none'; });
  document.getElementById('memoReqApplyClose').addEventListener('click', function(){ memoReqApplyStepEl.style.display = 'none'; });
  // [2026.09 신규] "겹치는 부분이 많을수록 좋다"는 요청 — 의뢰서 본문에서 이름 몇 개와
  // 상담메모만 기계적으로(정규식으로) 뽑아 사건개요에 자동 반영한다. 양도가액·취득일 같은
  // 숫자·물건 정보는 사건개요의 단일 필드가 아니라 여러 개 담는 "물건목록"에 들어가고,
  // 자유 텍스트에서 이런 걸 안전하게 뽑아내려면 사실상 AI가 필요하다(문구가 조금만 달라도
  // 오추출 위험) — 그 부분은 일부러 손대지 않고 AI 작업 재개 시로 미룬다. 라벨은 "핵심
  // 단어"로 느슨하게 매칭해서, 신고용 템플릿처럼 "성명 및 사망일자"로 붙여 쓴 줄도 이름
  // 부분만 잡아낸다(값에 쉼표가 있으면 첫 조각만 사용).
  var MEMO_REQ_OVERVIEW_MAP_ = {
    transfer: [ { test: /의뢰인\s*성명/, key: 'trTransferorName' } ],
    gift: [
      { test: /의뢰인\s*성명/, key: 'giftDoneeName' },
      { test: /증여자\s*성명/, key: 'giftDonorName' }
    ],
    inheritance: [
      { test: /의뢰인\s*성명/, key: '상속인성명' },
      { test: /피상속인\s*성명/, key: 'ihDeceasedName' }
    ]
  };
  // [2026.10.22 묶음 ㅁ1 — 세무사님 결정 6 "의뢰서 값을 가설(출처: 의뢰서)로 넣고 서류로 확인"] 의뢰서의 날짜·금액·소재지를 처리개요 칸으로 — 예전엔 이름만 넘기고
  //  양도일·양도가액·소재지·취득일·취득가액은 세무사님이 처리개요에서 또 쳐야 했다(가상양도7 표 9). GAS 칸 채우기(③)가 이 값을 "가설(의뢰서)"로 서류와 대조한다
  function memoReqKrDate_(s){
    s = String(s || '');
    var m = /((?:19|20)\d{2})\s*[년.\-\/]\s*(\d{1,2})\s*[월.\-\/]\s*(\d{1,2})\s*일?/.exec(s);
    if (!m) return '';
    var p2 = function(n){ return (n.length < 2 ? '0' : '') + n; };
    return m[1] + '-' + p2(m[2]) + '-' + p2(m[3]);
  }
  function memoReqKrMoney_(s){
    s = String(s || '').replace(/,/g, '').replace(/\s+/g, '');
    var m = /(\d+(?:\.\d+)?)억(?:(\d+(?:\.\d+)?)(천만|천|백만|백|만)?)?/.exec(s);
    if (m){ var v = Number(m[1]) * 1e8; if (m[2]){ var u = { '천만': 1e7, '천': 1e7, '백만': 1e6, '백': 1e6, '만': 1e4 }[m[3] || '']; if (!u) u = Number(m[2]) < 10 ? 1e7 : 1e4; v += Number(m[2]) * u; } return Math.round(v); }
    m = /(\d+(?:\.\d+)?)(천만|백만|만)원?/.exec(s); if (m) return Math.round(Number(m[1]) * { '천만': 1e7, '백만': 1e6, '만': 1e4 }[m[2]]);
    m = /\d{5,}/.exec(s); if (m) return Number(m[0]);
    return 0;
  }
  var memoReqBaseDate_ = ''; // 의뢰서에서 읽은 기준일(양도일·증여일·상속개시일) — 사건 등록 때 기준일로 넘겨 법정일이 처음부터 진짜 값이 되게(묶음 ㅁ2)
  function memoReqExtractOverview_(semok, content){
    var rules = MEMO_REQ_OVERVIEW_MAP_[semok];
    memoReqBaseDate_ = '';
    if (!rules) return null; // 불복 등 구조화 사건개요가 없는 세목
    var overview = {}, asset = {};
    (content || '').split('\n').forEach(function(line){
      var m = line.match(/^\s*-\s*([^:：]+)[:：]\s*(.+?)\s*$/);
      if (!m) return;
      var label = m[1].trim();
      var raw = m[2].trim();
      var value = raw.split(/[,，]/)[0].trim();
      if (!value) return;
      rules.forEach(function(rule){ if (rule.test.test(label) && !overview[rule.key]) overview[rule.key] = value; });
      // 기준일(양도일·증여일·상속개시일·사망일) — 날짜 꼴이면
      if (/^(양도일|증여일|상속개시일|사망일)/.test(label) && !memoReqBaseDate_) memoReqBaseDate_ = memoReqKrDate_(raw);
      if (semok === 'transfer'){
        if (/^소재지/.test(label) && !asset.assetLocation) asset.assetLocation = raw;
        if (/^취득일/.test(label) && !asset.취득일) asset.취득일 = memoReqKrDate_(raw);
        if (/^취득가액/.test(label) && !asset.취득가액){ var am = memoReqKrMoney_(raw); if (am) asset.취득가액 = String(am); }
        if (/^양도가액/.test(label) && !asset.양도가액){ var tm = memoReqKrMoney_(raw); if (tm) asset.양도가액 = String(tm); }
        if (/부동산\s*종류|자산\s*종류/.test(label) && !asset.주택판단){ if (/아파트|주택|빌라|연립|다세대|오피스텔\s*\(주거|단독/.test(raw)) asset.주택판단 = 'house'; }
      }
      if (semok === 'gift' && /^증여재산가액/.test(label) && !overview.giftAmount){ var gm = memoReqKrMoney_(raw); if (gm) overview.giftAmount = String(gm); }
    });
    Object.keys(asset).forEach(function(k){ if (asset[k] === '') delete asset[k]; });
    if (Object.keys(asset).length){ overview.물건목록 = [asset]; Object.assign(overview, asset); }
    var memoMatch = (content || '').match(/##\s*상담\s*메모\s*\n+([\s\S]*)$/);
    if (memoMatch){
      var noteText = memoMatch[1].replace(/^-\s*/, '').trim();
      if (noteText) overview['특이사항'] = noteText;
    }
    return Object.keys(overview).length ? overview : null;
  }

  // [2026.10.22 묶음 ㅁ3] 등록이 끝난 뒤 다음 할 일을 그 자리에서 — "처리개요로 가기"·"증빙 넣기"(서류 올리기·📖 서류 읽기 — [2026.10.31] 서류 도구는 증빙확보에)
  function memoReqShowRegisteredBar_(c){
    try {
      var old = document.getElementById('memoReqRegisteredBar'); if (old) old.remove();
      var bar = document.createElement('div'); bar.id = 'memoReqRegisteredBar';
      bar.style.cssText = 'display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0; padding:8px 10px; border:1px solid #0D1B3D; border-radius:8px; background:#eef1f7; font-size:13px;';
      var t = document.createElement('span'); t.textContent = '✅ 「' + String(c.사건명 || c.고객명 || '') + '」 사건을 등록했습니다 — 다음:'; bar.appendChild(t);
      var b1 = document.createElement('button'); b1.type = 'button'; b1.className = 'save-btn'; b1.textContent = '개요로 가기';
      b1.addEventListener('click', function(){ if (typeof goToCaseHandling_ === 'function') goToCaseHandling_(c.id); });
      var b2 = document.createElement('button'); b2.type = 'button'; b2.className = 'ghost-btn'; b2.textContent = '증빙 넣기·서류 읽기';
      b2.addEventListener('click', function(){ if (typeof nxAiOpenJobView_ === 'function') nxAiOpenJobView_('docs', c.id); else if (typeof goToView_ === 'function') goToView_('docs'); });
      var b3 = document.createElement('button'); b3.type = 'button'; b3.className = 'ghost-btn'; b3.textContent = '닫기'; b3.addEventListener('click', function(){ bar.remove(); });
      bar.appendChild(b1); bar.appendChild(b2); bar.appendChild(b3);
      document.getElementById('memoTopBar').insertAdjacentElement('afterend', bar); // [2026.11.14] 메모 창 단추 줄 바로 아래(글·손글씨 어느 탭이든 보임)
      bar.scrollIntoView({ block: 'nearest' });
    } catch (e) {}
  }
  // ---- 상담기록 한 덩이 — 의뢰서 파일 맨 앞에 쌓는 글 ----
  function memoCaseEntry_(ctx){
    var body = String((ctx && ctx.content) || '').trim();
    var lines = ['## 상담기록 (' + formatMemoTimestamp_() + ' · ' + ((ctx && ctx.origin) || '메모') + ')', ''];
    if (body) lines.push(body);
    if (ctx && ctx.extraFile) lines.push((body ? '\n' : '') + '- 손글씨: ' + ctx.extraFile.name + ' (이 사건 폴더)');
    return lines.join('\n').replace(/\n{3,}/g, '\n\n') + '\n';
  }
  // 의뢰 요약(작업관리 사건 줄 「개요」 칸 — 서버·넥스가 의뢰 메모로 읽는 칸) 한 줄:
  //  양식의 「가장 궁금한 점」 → 「## 상담 메모」 첫 줄 → 제목·양식 칸(- 이름: 값)이 아닌 첫 글 줄 순
  function memoSummaryLine_(content){
    var src = String(content || '');
    var pick = '';
    var m1 = src.match(/^\s*-\s*가장\s*궁금한\s*점[^:：\n]*[:：][ \t]*(\S[^\n]*)$/m);
    if (m1) pick = m1[1].trim();
    if (!pick){ var m2 = src.match(/##\s*상담\s*메모\s*\n+\s*-?\s*(\S[^\n]*)/); if (m2) pick = m2[1].trim(); }
    if (!pick) src.split(/\r?\n/).some(function(l){
      var t = l.trim();
      if (!t || /^[#>|]/.test(t) || /^-\s*[^:：]+[:：]/.test(t) || /^---+$/.test(t)) return false;
      pick = t.replace(/^[-*]\s*(\[[ xX]\]\s*)?/, ''); return true;
    });
    return pick.slice(0, 200);
  }

  // 「사건에 넣기」 — 새 사건 등록
  document.getElementById('memoReqNewCaseConfirm').addEventListener('click', function(){
    var ctx = memoCaseCtx_ || {};
    var 고객명 = document.getElementById('memoReqNewCustomer').value.trim();
    if (!고객명){ toast('고객명을 입력해주세요.'); return; }
    var semok = document.getElementById('memoReqNewSemok').value;
    var uptype = document.getElementById('memoReqNewUptype').value;
    if (ctx.extraFile && uptype === '상담'){ toast('상담 사건은 사건 폴더가 없어 손글씨 PDF를 넣을 수 없습니다 — 업무유형을 신고·자문 등으로 골라 주세요.'); return; }
    var content = String(ctx.content || '');
    var overview = content ? memoReqExtractOverview_(semok, content) : null;
    var taxpayerField_ = (typeof TAXPAYER_NAME_FIELD_BY_SEMOK_ !== 'undefined') ? TAXPAYER_NAME_FIELD_BY_SEMOK_[semok] : null;
    var 납세자입력 = document.getElementById('memoReqNewTaxpayer').value.trim();
    var 납세자 = 납세자입력 || ((taxpayerField_ && overview && overview[taxpayerField_]) ? overview[taxpayerField_] : '');
    var createPayload = {
      고객명: 고객명,
      납세자: 납세자,
      세목: semok,
      업무유형: uptype,
      의뢰일: document.getElementById('memoReqNewRequestDate').value
    };
    if (content && memoReqBaseDate_) createPayload.기준일 = memoReqBaseDate_; // [2026.10.22 묶음 ㅁ2] 의뢰서의 양도일·증여일·상속개시일을 기준일로
    var tpl = ctx.template || null;
    if (uptype === '상담'){
      // [2026.11.14] 상담 사건은 사건 폴더를 만들지 않아(work_createCase — 폴더ID 빈 값) 의뢰서 파일이 생기지 않는다 —
      //  예전엔 의뢰서 글이 소리 없이 빠졌다. 적은 글을 사건 줄 「의뢰 요약」(개요) 칸에 통째로 넣는다(서버·넥스가 의뢰 메모로 읽는 칸).
      createPayload.개요 = (content || memoCaseEntry_(ctx)).slice(0, 6000);
    } else {
      // [2026.10.23 속도 ㅅ4차] 의뢰서 글과 사건개요를 등록 호출에 같이 보낸다(서버 한 번)
      createPayload.의뢰서 = { fileName: (tpl ? tpl.name : '의뢰서_상담') + '_' + 고객명 + '.md', editedContent: tpl ? content : memoCaseEntry_(ctx) }; // 양식으로 쓴 글은 그대로 의뢰서 본문, 그 밖은 상담기록 한 덩이
      if (tpl) createPayload.의뢰서.templateFileId = tpl.id; // [2026.10.21] 서버가 첫머리에 "바탕 템플릿: 이름 · 판 수정일" 한 줄
      var sum = memoSummaryLine_(content);
      if (sum) createPayload.개요 = sum;
    }
    if (overview) createPayload.사건개요 = overview;
    // 손글씨는 PDF를 바로 넣을 폴더가 있어야 해서 폴더를 뒤로 미루지 않는다(folderNow — 서버가 폴더를 만든 뒤 답함)
    var tmpCase_ = nxCaseCreateLater_(createPayload, { folderNow: !!ctx.extraFile, onDone: function(res){
      if (typeof bookingAskLinkAfterCreate_ === 'function') bookingAskLinkAfterCreate_(res); // [2026.10.30] 같은 고객의 확정 예약이 있으면 이을지 여쭘
      if (!ctx.extraFile){ if (ctx.onDone) ctx.onDone(); return; }
      var fid = res && res.case && res.case.폴더ID;
      if (!fid){ toast('사건은 만들었지만 폴더가 없어 손글씨 PDF를 넣지 못했습니다 — 손글씨는 그대로 있으니 「사건에 넣기」로 그 사건을 골라 다시 넣어 주세요.'); return; }
      callGas('uploadFile', { folderId: fid, name: ctx.extraFile.name, mimeType: ctx.extraFile.mimeType, base64Data: ctx.extraFile.base64Data }).then(function(up){
        if (up && up.error) throw new Error(up.error);
        toast('손글씨 PDF를 「' + (res.case.사건명 || 고객명) + '」 사건 폴더에 넣었습니다.');
        if (ctx.onDone) ctx.onDone();
      }).catch(function(err){ toast('손글씨 PDF를 넣지 못했습니다(손글씨는 그대로 있음): ' + nxErrText_(err)); });
    } });
    toast('"' + tmpCase_.사건명 + '" 사건을 등록했습니다' + (overview ? '(사건개요도 같이 채움)' : '') + (uptype === '상담' ? ' — 상담 사건이라 적은 글은 「의뢰 요약」 칸에 넣었습니다.' : ' — 폴더·의뢰서는 뒤에서 저장합니다.'));
    memoReqApplyStepEl.style.display = 'none';
    memoReqShowRegisteredBar_(tmpCase_);
  });

  // 기존 사건에 넣기 — 그 사건 의뢰서 파일(없으면 「의뢰서_상담_고객명.md」 새로) 맨 앞에 상담기록을 쌓고,
  //  글에서 뽑은 값은 사건개요의 빈 칸만 가설로 채운다(세무사님이 넣은 값은 바꾸지 않음 — 공통원칙 1절)
  function memoAppendToCase_(c, ctx){
    return nxEnsureCaseFolder_(c, '상담 내용을').then(function(cc){
      if (!cc || !cc.폴더ID) return null;
      var entry = memoCaseEntry_(ctx);
      return callGas('listFolder', { folderId: cc.폴더ID }).then(function(listing){
        if (listing && listing.error) throw new Error(listing.error);
        var reqs = (listing.files || []).filter(function(f){ return /^의뢰서_.*\.md$/i.test(f.name); });
        reqs.sort(function(a, b){ return String(b.modifiedDate || '').localeCompare(String(a.modifiedDate || '')); }); // 여럿이면 가장 최근에 고친 것
        var target = reqs[0];
        var write = target
          ? callGas('readFile', { fileId: target.id }).then(function(fd){
              if (!fd || fd.error || typeof fd.content !== 'string') throw new Error((fd && fd.error) || '의뢰서 파일을 읽지 못했습니다');
              return callGas('uploadFile', { fileId: target.id, name: target.name, mimeType: 'text/markdown', base64Data: utf8ToBase64(entry + '\n---\n\n' + fd.content) });
            })
          : callGas('uploadFile', { folderId: cc.폴더ID, name: '의뢰서_상담_' + (cc.고객명 || c.고객명 || '') + '.md', mimeType: 'text/markdown', base64Data: utf8ToBase64(entry) });
        return write.then(function(res){
          if (res && res.error) throw new Error(res.error);
          if (!ctx.extraFile) return;
          return callGas('uploadFile', { folderId: cc.폴더ID, name: ctx.extraFile.name, mimeType: ctx.extraFile.mimeType, base64Data: ctx.extraFile.base64Data }).then(function(r2){
            if (r2 && r2.error) throw new Error('상담기록은 넣었지만 손글씨 PDF를 넣지 못했습니다: ' + r2.error);
          });
        }).then(function(){ return { case: cc, file: target ? target.name : ('의뢰서_상담_' + (cc.고객명 || c.고객명 || '') + '.md') }; });
      });
    }).then(function(r){
      if (!r) return null;
      var content = String(ctx.content || '');
      var overview = content ? memoReqExtractOverview_(r.case.세목, content) : null;
      var cur = r.case.사건개요 || {};
      var add = {};
      if (overview) Object.keys(overview).forEach(function(k){
        var v = cur[k];
        var empty = v == null || v === '' || (Array.isArray(v) && !v.length);
        if (empty) add[k] = overview[k];
      });
      var payload = { id: r.case.id, 기대수정일: r.case.수정일 };
      var changed = false;
      if (Object.keys(add).length){ payload.사건개요 = Object.assign({}, cur, add); changed = true; }
      var sum = memoSummaryLine_(content);
      if (sum && !String(r.case.개요 || '').trim()){ payload.개요 = sum; changed = true; }
      if (!changed) return r;
      return nxCaseSave_(payload).then(function(res2){
        if (res2 && res2.conflict) r.note = '그 사이 다른 곳에서 이 사건이 바뀌어 사건개요 빈 칸은 채우지 못했습니다';
        else if (res2 && res2.success === false) r.note = '사건개요 빈 칸 채우기 실패: ' + (res2.message || '');
        else { r.filled = Object.keys(add).length; if (typeof loadWorkCases === 'function') loadWorkCases(); }
        return r;
      });
    });
  }
  document.getElementById('memoReqApplyConfirm').addEventListener('click', function(){
    var sel = document.getElementById('memoReqApplyCaseSelect');
    if (!sel.value){ toast('넣을 사건을 선택해주세요.'); return; }
    var c = memoReqAllCases_.filter(function(x){ return x.id === sel.value; })[0];
    if (!c) return;
    var ctx = memoCaseCtx_ || {};
    var btn = document.getElementById('memoReqApplyConfirm');
    btn.disabled = true; btn.textContent = '넣는 중…';
    memoAppendToCase_(c, ctx).then(function(r){
      if (!r) return;
      memoReqApplyStepEl.style.display = 'none';
      toast('「' + (c.사건명 || '') + '」 사건의 「' + r.file + '」 맨 앞에 상담기록을 넣었습니다' + (r.filled ? '(사건개요 빈 칸 ' + r.filled + '개도 채움)' : '') + (r.note ? ' — ' + r.note : '') + '.');
      if (ctx.onDone) ctx.onDone();
    }).catch(function(err){
      toast('넣는 중 오류: ' + nxErrText_(err));
    }).finally(function(){ btn.disabled = false; btn.textContent = '이 사건에 넣기'; });
  });
</script>
