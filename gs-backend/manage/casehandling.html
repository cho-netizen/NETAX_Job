<div class="view" id="view-casehandling">
  <div class="view-head"><h2>🧭 처리개요</h2><p style="color:var(--sub); font-size:12.5px; margin:2px 0 0;">사건 하나를 골라 처리방향·처리대상을 정하고, 작업일지를 남깁니다. 법령조회·증빙확보·세액계산·문서작성·my.netax.kr 연동은 각 카드에서 요약만 보고 실제 작업은 해당 화면에서 합니다.</p></div>
  <div class="view-body">
    <div class="card">
      <label style="display:block; font-size:12px; color:var(--sub); margin-bottom:5px;">처리할 사건</label>
      <select id="chCaseSelect" style="width:100%; max-width:420px;"><option value="">사건을 선택하세요</option></select>
    </div>
    <div id="chBody"><div class="explorer-status">위에서 사건을 선택해주세요.</div></div>
  </div>
</div>

<script>
  // ============================================================
  // 사건처리 — 작업관리(사건 목록·현황)와 분리된 "실제 처리" 전용 화면.
  // [2026.09] 원래 작업관리 사건 상세화면 안에 처리방향/작업일지/법령예규판례를 다 넣었었는데,
  // "작업관리에는 현황만, 실제 작업은 처리에서" 라는 피드백에 따라 이 화면으로 분리했다.
  // 사건 목록은 work_get_cases를 이 화면에서 독립적으로 다시 불러온다(작업관리를 먼저 열지
  // 않고 바로 이 화면으로 와도 동작해야 하므로, workmanage.html의 workCases 전역과는 별도).
  // ============================================================
  var chCases = [];
  var chSelectedId = null;
  var chCaseSelectEl = document.getElementById('chCaseSelect');
  var chBodyEl = document.getElementById('chBody');

  // [2026.09] 사건개요서 — "처리방향(어떻게 처리할지)을 정하기 전에, 무슨 사실관계인지부터
  // 세목별로 정해진 항목에 채워넣는 양식이 있어야 한다"는 지적에 따라, 자유텍스트였던
  // "처리대상" 칸을 세목별 구조화 양식으로 바꿨다. 항목은 세액계산기가 이미 알고 있는
  // "이 계산에 필요한 사실관계"를 그대로 재사용한 것(양도소득세: taxcalc-engine.html의
  // 1세대1주택 판정 로직이 쓰는 값들과 동일) — 체크리스트를 따로 새로 만들지 않고 세액계산
  // 코드 하나에 노하우를 집중시킨다는 원칙을 따른다. 1단계 파일럿이라 양도소득세만 있고,
  // 나머지 세목은 검증 후 확장 — 템플릿이 없는 세목은 예전처럼 자유텍스트(처리대상)로 남는다.
  // [2026.09 수정] 사용자 피드백 반영: (1) 양도물건을 자산종류·유형·소재지(동,호)로 세분화 —
  // 증빙확보의 자동확보(주소검색·실거래가·공시가격 조회)가 동작하려면 대표필지 수준의 상세
  // 소재지가 필요하다. (2) 필요경비는 개요 단계에서 불필요해 제거(세액계산 단계에서 다룸).
  // (3) "사건분류"(일반/비과세/감면/1주택고가/다주택중과/부담부증여) 콤보박스 추가 — 이게
  // 기존 "1세대1주택여부"보다 더 정확한 분류라 그 필드를 대체한다. 부담부증여는 전액부담부
  // 증여만 해당(부분부담부증여는 증여세 사건으로 따로 분류됨) — 옵션 라벨에 명시.
  // (4) 양도일만 제외하고 취득일·양도가액·취득가액·보유기간·거주기간·다른주택보유현황은
  // 그대로 둔다 — "나중에 세액계산에서도 물어보니 여기선 빼자"는 건 순서가 거꾸로다.
  // 사건개요서가 먼저 작성되고 세액계산은 그 뒤에 하므로, 여기서 이미 파악된 값이 있으면
  // 나중에 세액계산 쪽을 자동으로 채워주는 방향이어야지 그 반대(세액계산 항목이라서 개요서에서
  // 뺀다)는 성립하지 않는다는 지적. 양도일만 예외인 건 세액계산과 겹쳐서가 아니라, 이미 사건
  // 자체의 "기준일"(법정기한 계산에 쓰는 값, 사건 생성 시 입력)과 완전히 같은 값이기 때문 —
  // 이건 사건개요서보다도 먼저(사건 생성 시점) 파악되는, 같은 단계의 진짜 중복이라 뺀 것.
  // [2026.09 수정 2] (1) 자산종류·유형은 taxcalc.html의 양도세 자산카드가 이미 쓰는 값을
  // 그대로 재사용(assetType/assetKind, 옵션 문구까지 동일) — 나중에 세액계산 쪽에서 이
  // 사건개요를 읽어 자동으로 채워줄 때 필드명이 같아야 그대로 옮겨꽂을 수 있다. (2) 소재지에
  // taxcalc.html과 같은 주소검색(🔍, openAddressSearchModal_) 버튼을 달았고, 동·호는 처음엔
  // 숨겨뒀다가 유형이 "건물"이거나 주소검색 결과에 동 목록이 있을 때만 보여준다(토지엔 동·호
  // 개념이 없으므로). (3) 보유기간·거주기간·다른주택보유현황은 삭제(요청). 양도일은
  // 사건의 "기준일"(법정기한 계산에 쓰는 값)과 완전히 같은 값이라 별도 저장하지 않고, 이
  // 칸을 고치면 기준일 자체를 같이 업데이트한다 — 값을 두 곳에 따로 들고 있지 않아
  // 작업관리의 법정일 계산과 절대 어긋나지 않는다.
  var CH_ASSET_TYPE_OPTIONS_ = [
    { value: 'other', label: '그 외 부동산' },
    { value: 'house', label: '주택·조합원입주권' },
    { value: 'presale_right', label: '분양권(§104①1호·2호·3호 — 1년미만 70%/1년이상 60% 단일세율, 장기보유특별공제·기본세율누진 배제)' }
  ];
  var CH_ASSET_KIND_OPTIONS_ = [
    { value: 'land', label: '토지' },
    { value: 'building', label: '건물(구분소유 건물·아파트 등 대지권 포함분도 건물면적만 입력)' },
    { value: 'other', label: '기타' }
  ];
  var CH_CASE_OVERVIEW_FIELDS_ = {
    transfer: [
      { key: '양도가액', label: '양도가액', type: 'number' },
      { key: '취득일', label: '취득일', type: 'date' },
      { key: '취득가액', label: '취득가액', type: 'number' },
      { key: '사건분류', label: '사건분류', type: 'select', options: ['', '일반과세', '1세대1주택 비과세', '1세대1주택 고가주택(과세)', '일시적2주택 비과세', '2주택 중과', '3주택이상 중과', '비사업용 토지(중과)', '농지 등 감면(8년자경 등)', '수용 등 공익사업 비과세·감면', '이월과세(배우자·직계존비속 증여 후 양도)', '미등기양도', '경매·공매', '부담부증여(전액)', '교환'] },
      { key: '특이사항', label: '특이사항', type: 'textarea' }
    ],
    // [2026.09] 증여세·상속세 사건개요서 — 양도소득세와 같은 원칙(taxcalc.html의 실제 입력
    // 필드명을 그대로 재사용). 증여: giftDoneeName/giftDonorName/giftRelation(taxcalc.html
    // 2842~2860행과 옵션까지 동일)/giftAmount/giftDebtAssumed(부분부담부증여만 — 전액부담부는
    // 양도세 사건으로 분류)/giftPriorAmount(10년내 동일인 기증여합산액). 상속: ihDeceasedName/
    // ihEstate(taxcalc.html 4583~4601행과 동일).
    gift: [
      { key: 'giftDoneeName', label: '수증자 성명', type: 'text' },
      { key: 'giftDonorName', label: '증여자 성명', type: 'text' },
      { key: 'giftRelation', label: '관계(수증자 기준)', type: 'select', options: ['', '배우자', '직계존속(1촌, 부모 등→자녀)', '직계존속(2촌 이상, 조부모 등→손자녀·세대생략)', '직계비속(1촌, 자녀 등→부모)', '직계비속(2촌 이상, 손자녀 등→조부모·세대생략)', '기타친족', '기타(상속인 아닌 자 등)'] },
      { key: 'giftAmount', label: '증여재산가액', type: 'number' },
      { key: 'giftDebtAssumed', label: '인수채무액(부분부담부증여만, 없으면 비움)', type: 'number' },
      { key: 'giftPriorAmount', label: '10년내 동일인 기증여합산액', type: 'number' },
      { key: '사건분류', label: '사건분류', type: 'select', options: ['', '일반증여', '부담부증여(부분, 순수증여분만)', '재차증여(10년내 합산)', '세대생략증여(할증)', '명의신탁 증여의제', '저가양수·고가양도 증여의제', '특정법인과의 거래 증여의제', '창업자금·가업승계 특례증여'] },
      { key: '특이사항', label: '특이사항', type: 'textarea' }
    ],
    inheritance: [
      { key: 'ihDeceasedName', label: '피상속인 성명', type: 'text' },
      { key: '상속인수', label: '상속인 수', type: 'number' },
      { key: 'ihEstate', label: '상속세과세가액(예상)', type: 'number' },
      { key: '사건분류', label: '사건분류', type: 'select', options: ['', '일반상속', '배우자상속공제 해당', '가업상속공제 해당', '영농상속공제 해당', '동거주택상속공제 해당', '사전증여재산 합산(10년내 상속인·5년내 비상속인)', '상속포기·한정승인', '유증·사인증여'] },
      { key: '특이사항', label: '특이사항', type: 'textarea' }
    ]
  };

  function chRenderOverviewFieldInput_(field, value){
    var v = escapeHtml(value || '');
    var common = 'id="chOv_' + field.key + '" data-key="' + field.key + '" style="width:100%; box-sizing:border-box;"';
    if (field.type === 'select'){
      return '<select ' + common + '>' + field.options.map(function(opt){
        return '<option value="' + escapeHtml(opt) + '"' + (opt === (value || '') ? ' selected' : '') + '>' + (opt || '(선택 안 함)') + '</option>';
      }).join('') + '</select>';
    }
    if (field.type === 'textarea'){
      return '<textarea ' + common + ' style="width:100%; min-height:44px; font-family:inherit; font-size:13px; box-sizing:border-box;">' + v + '</textarea>';
    }
    return '<input type="' + field.type + '" ' + common + ' value="' + v + '">';
  }

  // 자산종류·유형·소재지·동·호·물건수·양도일 — taxcalc.html의 assetType/assetKind/assetLocation
  // /assetDong/assetHo와 필드명을 맞춘 커스텀 블록(단순 select/input이 아니라 주소검색·동호
  // 조건부 표시 같은 상호작용이 필요해 CH_CASE_OVERVIEW_FIELDS_의 일반 렌더러와 분리했다).
  function chBuildTransferAssetBlockHtml_(overview, baseDate){
    var showDongHo = overview.assetKind === 'building' || (Array.isArray(overview.assetDongList) && overview.assetDongList.length > 0);
    var dongOptions = Array.isArray(overview.assetDongList) ? overview.assetDongList : [];
    return '<div>' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">물건 수</label>' +
      '<input type="number" id="chOvCount" style="width:100%; box-sizing:border-box;" value="' + escapeHtml(overview.물건수 || '') + '">' +
      '</div>' +
      '<div>' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">자산종류(대표 물건)</label>' +
      '<select id="chOvAssetType" style="width:100%; box-sizing:border-box;"><option value="">선택</option>' +
      CH_ASSET_TYPE_OPTIONS_.map(function(o){ return '<option value="' + o.value + '"' + (o.value === overview.assetType ? ' selected' : '') + '>' + escapeHtml(o.label) + '</option>'; }).join('') +
      '</select></div>' +
      '<div>' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">유형</label>' +
      '<select id="chOvAssetKind" style="width:100%; box-sizing:border-box;"><option value="">선택</option>' +
      CH_ASSET_KIND_OPTIONS_.map(function(o){ return '<option value="' + o.value + '"' + (o.value === overview.assetKind ? ' selected' : '') + '>' + escapeHtml(o.label) + '</option>'; }).join('') +
      '</select></div>' +
      '<div style="grid-column:span 2;">' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">소재지</label>' +
      '<div style="display:flex; gap:6px;">' +
      '<input type="text" id="chOvAssetLocation" style="flex:1; box-sizing:border-box;" value="' + escapeHtml(overview.assetLocation || '') + '" placeholder="예: OO시 OO구 OO동 123-4">' +
      '<button type="button" id="chOvAddrSearchBtn" class="ghost-btn" style="flex-shrink:0;" title="주소 검색">🔍</button>' +
      '</div></div>' +
      '<div id="chOvDongHoWrap" style="display:' + (showDongHo ? 'contents' : 'none') + ';">' +
      '<div><label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">동</label>' +
      '<select id="chOvAssetDong" style="width:100%; box-sizing:border-box;"><option value="">직접입력/해당없음</option>' +
      dongOptions.map(function(d){ return '<option value="' + escapeHtml(d) + '"' + (overview.assetDong === d ? ' selected' : '') + '>' + escapeHtml(d) + '</option>'; }).join('') +
      '</select></div>' +
      '<div><label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">호</label>' +
      '<input type="text" id="chOvAssetHo" style="width:100%; box-sizing:border-box;" value="' + escapeHtml(overview.assetHo || '') + '">' +
      '</div></div>' +
      '<div>' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">양도일</label>' +
      '<input type="date" id="chOvTransferDate" style="width:100%; box-sizing:border-box;" value="' + escapeHtml(baseDate || '') + '">' +
      '</div>';
  }

  // 주소검색·유형변경(동·호 표시 여부) 상호작용을 연결한다 — chBodyEl.innerHTML 대입 뒤에 호출.
  function chWireTransferAssetBlock_(overview){
    var kindSel = document.getElementById('chOvAssetKind');
    var wrap = document.getElementById('chOvDongHoWrap');
    if (!kindSel || !wrap) return;
    kindSel.addEventListener('change', function(){
      wrap.style.display = kindSel.value === 'building' ? 'contents' : 'none';
    });
    document.getElementById('chOvAddrSearchBtn').addEventListener('click', function(){
      if (typeof openAddressSearchModal_ !== 'function'){ showToast('주소 검색 기능을 불러오지 못했습니다.', 'error'); return; }
      openAddressSearchModal_(function(picked){
        document.getElementById('chOvAssetLocation').value = picked.roadAddr || picked.jibunAddr || '';
        overview.assetDongList = picked.dongList || [];
        overview.assetDong = '';
        if ((overview.assetDongList.length > 0) && wrap.style.display === 'none') wrap.style.display = 'contents';
        var dongSel = document.getElementById('chOvAssetDong');
        if (dongSel){
          dongSel.innerHTML = '<option value="">직접입력/해당없음</option>' +
            overview.assetDongList.map(function(d){ return '<option value="' + escapeHtml(d) + '">' + escapeHtml(d) + '</option>'; }).join('');
        }
      });
    });
  }

  // [2026.09] 증여·상속 사건개요서용 — 자산종류(assetType, 양도소득세 전용 개념) 없이
  // 물건수·유형·소재지·동·호만 필요한 세목(증여·상속)이 재사용하는 부분. 필드 id는
  // chBuildTransferAssetBlockHtml_와 완전히 같은 이름을 쓴다(한 번에 하나의 세목 양식만
  // 화면에 있으므로 충돌 없음) — chWireTransferAssetBlock_(주소검색·동호 토글)와
  // 저장 핸들러(chSaveTarget)를 그대로 재사용하기 위함.
  function chBuildLocationFieldsHtml_(overview){
    var showDongHo = overview.assetKind === 'building' || (Array.isArray(overview.assetDongList) && overview.assetDongList.length > 0);
    var dongOptions = Array.isArray(overview.assetDongList) ? overview.assetDongList : [];
    return '<div>' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">물건 수</label>' +
      '<input type="number" id="chOvCount" style="width:100%; box-sizing:border-box;" value="' + escapeHtml(overview.물건수 || '') + '">' +
      '</div>' +
      '<div>' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">유형</label>' +
      '<select id="chOvAssetKind" style="width:100%; box-sizing:border-box;"><option value="">선택</option>' +
      CH_ASSET_KIND_OPTIONS_.map(function(o){ return '<option value="' + o.value + '"' + (o.value === overview.assetKind ? ' selected' : '') + '>' + escapeHtml(o.label) + '</option>'; }).join('') +
      '</select></div>' +
      '<div style="grid-column:span 2;">' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">소재지</label>' +
      '<div style="display:flex; gap:6px;">' +
      '<input type="text" id="chOvAssetLocation" style="flex:1; box-sizing:border-box;" value="' + escapeHtml(overview.assetLocation || '') + '" placeholder="예: OO시 OO구 OO동 123-4">' +
      '<button type="button" id="chOvAddrSearchBtn" class="ghost-btn" style="flex-shrink:0;" title="주소 검색">🔍</button>' +
      '</div></div>' +
      '<div id="chOvDongHoWrap" style="display:' + (showDongHo ? 'contents' : 'none') + ';">' +
      '<div><label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">동</label>' +
      '<select id="chOvAssetDong" style="width:100%; box-sizing:border-box;"><option value="">직접입력/해당없음</option>' +
      dongOptions.map(function(d){ return '<option value="' + escapeHtml(d) + '"' + (overview.assetDong === d ? ' selected' : '') + '>' + escapeHtml(d) + '</option>'; }).join('') +
      '</select></div>' +
      '<div><label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">호</label>' +
      '<input type="text" id="chOvAssetHo" style="width:100%; box-sizing:border-box;" value="' + escapeHtml(overview.assetHo || '') + '">' +
      '</div></div>';
  }

  function chBuildGiftBlockHtml_(overview, baseDate){
    return chBuildLocationFieldsHtml_(overview) +
      '<div>' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">증여일</label>' +
      '<input type="date" id="chOvTransferDate" style="width:100%; box-sizing:border-box;" value="' + escapeHtml(baseDate || '') + '">' +
      '</div>';
  }

  function chBuildInheritanceBlockHtml_(overview, baseDate){
    return chBuildLocationFieldsHtml_(overview) +
      '<div>' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">상속일</label>' +
      '<input type="date" id="chOvTransferDate" style="width:100%; box-sizing:border-box;" value="' + escapeHtml(baseDate || '') + '">' +
      '</div>';
  }

  // 세목별 템플릿이 있으면(현재 양도소득세만) 사건개요 구조화 양식을, 없으면 예전과 동일한
  // 자유텍스트 "처리대상" 칸을 그려준다 — chSaveTarget 클릭 핸들러가 같은 조건으로 어느 쪽
  // 값을 모아 저장할지 판단한다(CH_CASE_OVERVIEW_FIELDS_[c.세목] 존재 여부).
  function chBuildOverviewCardHtml_(c){
    var fields = CH_CASE_OVERVIEW_FIELDS_[c.세목];
    if (!fields){
      return '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:8px;">📋 사건처리개시 — 처리대상 · 처리방향</div>' +
        '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">처리대상 <span style="font-weight:400;">(무엇을 처리하는지)</span></label>' +
        '<input type="text" id="chEditTarget" placeholder="예: OO아파트 매각건의 양도소득세 신고" value="' + escapeHtml(c.처리대상 || '') + '" style="width:100%; max-width:600px; box-sizing:border-box;">';
    }
    var overview = c._chOverviewWorking = Object.assign({}, c.사건개요 || {});
    var rows = fields.map(function(field){
      return '<div>' +
        '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">' + escapeHtml(field.label) + '</label>' +
        chRenderOverviewFieldInput_(field, overview[field.key]) +
        '</div>';
    }).join('');
    var semokLabel = (typeof WORK_SEMOK_LABELS !== 'undefined' && WORK_SEMOK_LABELS[c.세목]) || c.세목 || '';
    var assetBlock = c.세목 === 'transfer' ? chBuildTransferAssetBlockHtml_(overview, c.기준일) :
      c.세목 === 'gift' ? chBuildGiftBlockHtml_(overview, c.기준일) :
      c.세목 === 'inheritance' ? chBuildInheritanceBlockHtml_(overview, c.기준일) : '';
    return '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:8px;">📋 사건개요서 — ' + escapeHtml(semokLabel) + '</div>' +
      '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:8px 12px; max-width:760px;">' + assetBlock + rows + '</div>';
  }

  function initCaseHandling(){
    loadChCases_();
  }

  function loadChCases_(preselectId){
    chCaseSelectEl.innerHTML = '<option value="">불러오는 중…</option>';
    callGas('work_get_cases', {}).then(function(res){
      chCases = res.cases || [];
      renderChCaseSelect_();
      var wantId = preselectId || chSelectedId;
      if (wantId && chCases.some(function(c){ return c.id === wantId; })){
        chCaseSelectEl.value = wantId;
        chSelectedId = wantId;
        renderChBody_();
      }
    }).catch(function(){ chCaseSelectEl.innerHTML = '<option value="">불러오지 못했습니다</option>'; });
  }

  function renderChCaseSelect_(){
    var keepValue = chCaseSelectEl.value;
    chCaseSelectEl.innerHTML = '<option value="">사건을 선택하세요</option>' +
      chCases.slice().sort(function(a, b){ return (a.고객명 || '').localeCompare(b.고객명 || ''); }).map(function(c){
        return '<option value="' + c.id + '">' + escapeHtml(c.고객명 || '') + ' · ' + escapeHtml(c.사건명 || '') + ' (' + escapeHtml(c.상태 || '') + ')</option>';
      }).join('');
    if (keepValue) chCaseSelectEl.value = keepValue;
  }

  chCaseSelectEl.addEventListener('change', function(){
    chSelectedId = chCaseSelectEl.value || null;
    renderChBody_();
  });

  function renderChBody_(){
    if (!chSelectedId){
      chBodyEl.innerHTML = '<div class="explorer-status">위에서 사건을 선택해주세요.</div>';
      return;
    }
    var c = chCases.filter(function(x){ return x.id === chSelectedId; })[0];
    if (!c){
      chBodyEl.innerHTML = '<div class="explorer-status">사건을 찾을 수 없습니다.</div>';
      return;
    }
    chBodyEl.innerHTML =
      '<div class="card">' +
      chBuildOverviewCardHtml_(c) +
      '<label style="font-size:12px; color:var(--sub); display:block; margin:10px 0 3px;">처리방향 <span style="font-weight:400;">(법령·예규·판례를 검토해 어떻게 처리할지)</span></label>' +
      '<textarea id="chEditDirection" placeholder="예: 1세대1주택 비과세 요건 충족 여부 검토 후 신고" style="width:100%; max-width:600px; min-height:50px; font-family:inherit; font-size:13px; box-sizing:border-box;">' + escapeHtml(c.처리방향 || '') + '</textarea>' +
      '<div style="margin-top:8px;"><button type="button" id="chSaveTarget" class="save-btn">저장</button></div>' +
      '</div>' +
      '<div class="card">' +
      '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:10px;">🔗 my.netax.kr 고객포털</div>' +
      '<div id="chMyPortalBody">불러오는 중…</div>' +
      '</div>' +
      '<div class="card">' +
      '<div id="chLogToggle" style="font-size:12.5px; color:var(--sub); margin-bottom:8px; cursor:pointer; width:fit-content;" title="눌러서 작업일지 추가">📓 작업일지 ' + (c.작업일지 || []).length + '건</div>' +
      '<div id="chNewLogFormWrap" style="display:none; gap:6px; margin-bottom:10px; flex-wrap:wrap;"></div>' +
      '<div id="chLogList"></div>' +
      '</div>' +
      '<div class="card">' +
      '<button type="button" id="chLawOpenBtn" class="ch-card-head-btn">⚖️ 법령조회 <span class="ch-card-head-arrow">›</span></button>' +
      '<div style="font-size:13px; color:var(--sub); margin-top:6px;">' + ((c.법령예규판례 || []).length ? ('첨부된 자료 ' + (c.법령예규판례 || []).length + '건') : '아직 첨부된 자료가 없습니다.') + '</div>' +
      '</div>' +
      '<div class="card">' +
      '<button type="button" id="chEvOpenDocsBtn" class="ch-card-head-btn">📁 증빙확보 <span class="ch-card-head-arrow">›</span></button>' +
      '<div id="chEvSummary" style="font-size:13px; color:var(--sub); margin-top:6px;"></div>' +
      '</div>' +
      '<div class="card">' +
      '<button type="button" id="chTaxCalcOpenBtn" class="ch-card-head-btn">🧮 세액계산 <span class="ch-card-head-arrow">›</span></button>' +
      '<div id="chTaxCalcList" style="margin-top:6px;"></div>' +
      '</div>' +
      '<div class="card">' +
      '<button type="button" id="chDocsWriterOpenBtn" class="ch-card-head-btn">✍ 문서작성 <span class="ch-card-head-arrow">›</span></button>' +
      '<div id="chMyReports" style="margin-top:6px;"><div class="log-empty">불러오는 중…</div></div>' +
      '</div>';

    if (c.세목 === 'transfer' || c.세목 === 'gift' || c.세목 === 'inheritance') chWireTransferAssetBlock_(c._chOverviewWorking || {});

    document.getElementById('chSaveTarget').addEventListener('click', function(){
      var payload = { id: c.id, 처리방향: document.getElementById('chEditDirection').value.trim() };
      var fields = CH_CASE_OVERVIEW_FIELDS_[c.세목];
      if (fields){
        var overview = {};
        fields.forEach(function(field){
          var el = document.getElementById('chOv_' + field.key);
          if (el) overview[field.key] = el.value.trim();
        });
        if (c.세목 === 'transfer' || c.세목 === 'gift' || c.세목 === 'inheritance'){
          // [2026.09] 자산종류·유형·소재지·동·호·물건수는 CH_CASE_OVERVIEW_FIELDS_의 일반
          // 렌더러가 아니라 chBuildTransferAssetBlockHtml_/chBuildGiftBlockHtml_/
          // chBuildInheritanceBlockHtml_(chWireTransferAssetBlock_로 상호작용 연결)가 그린
          // 커스텀 입력들이라 여기서 따로 모은다 — 세 세목이 같은 필드 id를 재사용하므로
          // (한 번에 하나만 화면에 있음) 이 수집 코드도 공통이다. 자산종류(assetType)는
          // 양도소득세 전용 필드라 증여·상속에서는 그 input 자체가 없어 빈 문자열로 남는다.
          // 동 목록(assetDongList)은 주소검색 결과로 chWireTransferAssetBlock_가
          // c._chOverviewWorking에 갱신해둔 값을 그대로 가져온다.
          var working = c._chOverviewWorking || {};
          overview.물건수 = (document.getElementById('chOvCount') || {}).value || '';
          overview.assetType = (document.getElementById('chOvAssetType') || {}).value || '';
          overview.assetKind = (document.getElementById('chOvAssetKind') || {}).value || '';
          overview.assetLocation = (document.getElementById('chOvAssetLocation') || {}).value || '';
          overview.assetDong = (document.getElementById('chOvAssetDong') || {}).value || '';
          overview.assetHo = (document.getElementById('chOvAssetHo') || {}).value || '';
          overview.assetDongList = working.assetDongList || [];
          var transferDateEl = document.getElementById('chOvTransferDate');
          if (transferDateEl) payload.기준일 = transferDateEl.value;
        }
        payload.사건개요 = overview;
      } else {
        payload.처리대상 = document.getElementById('chEditTarget').value.trim();
      }
      callGas('work_update_case', payload).then(function(res){
        if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return; }
        showToast('저장했습니다.', 'success');
        loadChCases_();
        if (typeof loadWorkCases === 'function') loadWorkCases();
      }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
    });

    chRenderLog_(c);
    document.getElementById('chLawOpenBtn').addEventListener('click', function(){
      if (typeof goToLawSearch_ === 'function') goToLawSearch_(c.id);
    });
    document.getElementById('chTaxCalcOpenBtn').addEventListener('click', function(){
      if (typeof goToTaxCalc_ === 'function') goToTaxCalc_(c.id);
    });
    // [2026.09] 예전엔 카드 안 "📁 보고서 폴더 열기"가 구글드라이브를 새 탭으로 열었는데,
    // 다른 카드들처럼 앱 밖으로 안 나가도록 증빙확보 화면 안에서 이 사건의 "보고서" 하위폴더로
    // 바로 이동시킨다(chEvOpenDocsBtn과 같은 패턴, 경로만 '보고서' 한 단계 더 들어감).
    document.getElementById('chDocsWriterOpenBtn').addEventListener('click', function(){
      getCustomerRootPath_().then(function(basePath){
        docsLoaded = true;
        if (typeof goToView_ === 'function') goToView_('docs');
        if (typeof docsNavigate === 'function') docsNavigate(basePath.concat([(c.고객명 + ' ' + c.사건명).trim(), '보고서']));
      });
    });
    chRenderTaxCalcList_(c);
    chRenderEvidenceSummary_(c);
    chLoadMyReports_(c);
    chInitMyPortal_(c);
  }

  // [2026.09] 세액계산 카드 — 예전엔 "저장된 계산 N건"만 보여줬는데, 사건처리가 이 사건의
  // 대시보드 역할을 하려면 건수보다 실제 계산 결과값이 보여야 한다는 피드백에 따라 건별
  // 요약(세목·구분·계산일 + 결과 미리보기)을 나열한다. taxcalc.html의 renderTcSavedList_와
  // 같은 표시 방식이되, 여긴 여러 카드 중 하나라 미리보기 길이를 더 짧게 자른다.
  function chRenderTaxCalcList_(c){
    var el = document.getElementById('chTaxCalcList');
    if (!el) return;
    var list = c.세액계산결과 || [];
    if (!list.length){ el.innerHTML = '<div class="log-empty">아직 저장된 계산이 없습니다.</div>'; return; }
    el.innerHTML = list.slice().reverse().map(function(entry){
      var preview = String(entry.요약 || '').replace(/\s+/g, ' ').trim();
      if (preview.length > 120) preview = preview.slice(0, 120) + '…';
      return '<div class="log-entry"><div class="log-date">' + escapeHtml(fmtDateShort_(entry.계산일) || entry.계산일 || '') + '</div>' +
        '<div class="log-text"><b>' + escapeHtml(entry.세목 || '') + ' · ' + escapeHtml(entry.구분 || '') + '</b><br>' +
        '<span style="color:var(--sub); font-size:12.5px;">' + escapeHtml(preview) + '</span></div></div>';
    }).join('');
  }

  function chSaveLog_(caseId, newLog){
    callGas('work_update_case', { id: caseId, 작업일지: newLog }).then(function(res){
      if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return; }
      loadChCases_();
      if (typeof loadWorkCases === 'function') loadWorkCases();
    }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
  }

  function chRenderLog_(c){
    var list = document.getElementById('chLogList');
    if (!list) return;
    var entries = (c.작업일지 || []).slice().sort(function(a, b){ return (b.date || '').localeCompare(a.date || ''); });
    if (!entries.length){
      list.innerHTML = '<div class="log-empty">아직 작업일지가 없습니다.</div>';
    } else {
      list.innerHTML = '';
      entries.forEach(function(entry){
        var row = document.createElement('div');
        row.className = 'log-entry';
        row.innerHTML =
          '<div class="log-date">' + escapeHtml(fmtDateShort_(entry.date) || entry.date || '') + '</div>' +
          '<div class="log-text">' + escapeHtml(entry.text || '') +
          (entry.dueDate ? ' <span style="color:var(--sub); font-size:12px;">— 다음: ' + escapeHtml(fmtDateShort_(entry.dueDate)) + '</span>' : '') + '</div>' +
          '<span class="log-del" title="삭제">✕</span>';
        row.querySelector('.log-del').addEventListener('click', function(){
          var newLog = (c.작업일지 || []).filter(function(e){ return e.id !== entry.id; });
          chSaveLog_(c.id, newLog);
        });
        list.appendChild(row);
      });
    }

    var newLogFormWrap = document.getElementById('chNewLogFormWrap');
    document.getElementById('chLogToggle').addEventListener('click', function(){
      if (newLogFormWrap.style.display === 'none'){
        newLogFormWrap.style.display = 'flex';
        var todayStr = new Date().toISOString().slice(0, 10);
        newLogFormWrap.innerHTML =
          '<input type="date" id="chNewLogDate" value="' + todayStr + '" style="width:130px;">' +
          '<input type="text" id="chNewLogText" placeholder="진행 내용 · 다음 할일" style="flex:1; min-width:160px;">' +
          '<input type="date" id="chNewLogDue" title="다음 일정(선택) — 입력하면 캘린더에 등록됩니다">' +
          '<button type="button" id="chAddLog" class="save-btn">추가</button>' +
          '<button type="button" id="chAddLogCancel" class="ghost-btn">취소</button>';
        document.getElementById('chAddLogCancel').addEventListener('click', function(){ newLogFormWrap.style.display = 'none'; newLogFormWrap.innerHTML = ''; });
        document.getElementById('chAddLog').addEventListener('click', function(){
          var text = document.getElementById('chNewLogText').value.trim();
          if (!text){ showToast('내용을 입력해주세요.', 'warning'); return; }
          var entry = {
            id: 'log_' + Date.now(),
            date: document.getElementById('chNewLogDate').value || todayStr,
            text: text,
            dueDate: document.getElementById('chNewLogDue').value || ''
          };
          var newLog = (c.작업일지 || []).concat([entry]);
          chSaveLog_(c.id, newLog);
        });
      } else {
        newLogFormWrap.style.display = 'none';
        newLogFormWrap.innerHTML = '';
      }
    });
  }

  // 법령예규판례 검색·첨부 UI는 별도 탭(lawsearch.html)으로 옮겼다 — "사건처리=대시보드,
  // 실제 작업은 각 처리 화면에서"라는 원칙에 맞춰 여기는 요약+이동 버튼만 남긴다.

  // 작업관리 사건 상세화면의 "🧭 이 사건 처리하기" 버튼에서 호출 — 사건처리 화면으로 이동하고
  // 그 사건을 바로 골라준다.
  function goToCaseHandling_(caseId){
    if (typeof goToView_ === 'function') goToView_('casehandling');
    chSelectedId = caseId;
    loadChCases_(caseId);
  }

  // ============================================================
  // 3단계였던 증빙 3분류(자동확보/추가확보/요청자료)의 실제 목록·검색·추가 UI는 증빙관리
  // (docs.html)로 옮겼다 — "사건처리=이 사건의 대시보드, 실제 작업(파일)은 증빙관리"라는
  // 원칙에 맞게, 여기서는 건수 요약과 증빙관리로 바로 이동하는 버튼만 둔다. 다만 저장
  // 함수(chSaveEvidence_/chAddEvidence_)는 my포털 카드의 "요청자료 추가"(chAddRequestedItem_)가
  // 여전히 써서 여기 남겨뒀다.
  // ============================================================
  function chSaveEvidence_(caseId, newList){
    callGas('work_update_case', { id: caseId, 증빙목록: newList }).then(function(res){
      if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return; }
      loadChCases_();
      if (typeof loadWorkCases === 'function') loadWorkCases();
    }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
  }

  function chAddEvidence_(c, entryPartial){
    var entry = Object.assign({ id: 'ev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) }, entryPartial);
    var newList = (c.증빙목록 || []).concat([entry]);
    chSaveEvidence_(c.id, newList);
  }

  function chRenderEvidenceSummary_(c){
    var el = document.getElementById('chEvSummary');
    if (!el) return;
    var list = c.증빙목록 || [];
    var auto = list.filter(function(e){ return e.source === 'auto'; }).length;
    var manual = list.filter(function(e){ return e.source === 'manual'; }).length;
    var requested = list.filter(function(e){ return e.source === 'requested'; });
    var reqPending = requested.filter(function(e){ return e.status !== '확보됨'; }).length;
    el.textContent = list.length
      ? ('자동확보 ' + auto + '건 · 추가확보 ' + manual + '건 · 요청자료 ' + requested.length + '건(미확보 ' + reqPending + '건)')
      : '아직 등록된 증빙이 없습니다.';
    document.getElementById('chEvOpenDocsBtn').addEventListener('click', function(){
      // listFolder는 path가 있으면 절대 루트부터 이름을 따라 내려가므로, "고객사건" 기본폴더
      // 까지의 전체 경로(getCustomerRootPath_)를 먼저 구해서 사건명을 그 뒤에 붙여야 한다.
      getCustomerRootPath_().then(function(basePath){
        // [버그수정] 증빙관리를 이번 페이지에서 처음 여는 거면 goToView_('docs')가 내부적으로
        // initDocs()를 불러 자기 나름의 기본 위치(고객사건 폴더 자체)로 또 이동시켜버린다 —
        // 그게 우리가 지금 지정하는 사건 폴더 이동과 동시에 실행되면서 경쟁하다가, 매번
        // "기본 위치"(=사건 폴더 바로 위)가 이겨서 그쪽으로 보였다. docsLoaded를 먼저 true로
        // 표시해 initDocs()의 자체 이동을 막아둔다.
        docsLoaded = true;
        if (typeof goToView_ === 'function') goToView_('docs');
        if (typeof docsNavigate === 'function') docsNavigate(basePath.concat([(c.고객명 + ' ' + c.사건명).trim()]));
      });
    });
  }

  // ============================================================
  // 4단계 — my.netax.kr 고객포털 연동. "요청자료"는 곧 my.netax.kr의 체크리스트 항목과 같은
  // 개념이라(예약의 직권등록과 같은 구조 — 직원이 대신 자료를 올릴 수도, 고객이 my페이지로
  // 들어와 스스로 올릴 수도 있음), 사건에 연결된 my_report_id가 있으면 요청자료를 추가할 때
  // 자동으로 그쪽 체크리스트에도 반영한다(반대 방향은 my포털 카드 자체에서 추가할 때도 동일
  // 함수를 태워 한쪽만 구현하지 않는다).
  // ============================================================
  function chAddRequestedItem_(c, label, note){
    chAddEvidence_(c, { source: 'requested', label: label, note: note || '', status: '미확보', 요청일: new Date().toISOString().slice(0, 10) });
    if (c.my_report_id){
      callGas('admin_add_checklist_item', { report_id: c.my_report_id, item: label }).catch(function(){});
    }
  }

  function chInitMyPortal_(c){
    var box = document.getElementById('chMyPortalBody');
    if (!box) return;

    if (!c.my_report_id){
      box.innerHTML =
        '<div style="font-size:12.5px; color:var(--sub); margin-bottom:8px;">아직 고객포털에 연결되지 않았습니다. 연결하면 위 "요청자료"가 고객 체크리스트로 자동 전달되고, 고객이 my.netax.kr로 들어와 직접 자료를 올리고 진행상황·결과보고서를 확인할 수 있습니다.</div>' +
        '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:8px;">보고서 다운로드 권한 ' +
        '<select id="chMyNewPermission" style="margin-left:4px;"><option value="허용">허용(다운로드 가능)</option><option value="차단">차단(다운로드 불가)</option></select></label>' +
        '<button type="button" id="chMyConnectBtn" class="save-btn">🔗 고객포털 연결하기</button>';
      document.getElementById('chMyConnectBtn').addEventListener('click', function(){
        if (!confirm(c.고객명 + '님을 위한 my.netax.kr 고객포털을 새로 만들까요?')) return;
        var requestedLabels = (c.증빙목록 || []).filter(function(e){ return e.source === 'requested'; }).map(function(e){ return e.label; });
        var permission = document.getElementById('chMyNewPermission').value;
        // 사건 시작 때 이미 만들어둔 폴더(c.폴더ID)를 그대로 넘겨서 my.netax.kr이 별도 폴더를
        // 새로 만들지 않고 재사용하게 한다 — 그래야 고객 업로드가 증빙관리와 같은 폴더에 쌓인다.
        callGas('admin_create_case', { name: c.고객명, case_name: c.사건명, checklist: requestedLabels, permission: permission, folder_id: c.폴더ID || '' }).then(function(res){
          if (res.success === false){ showToast(res.message || '연결 실패', 'error'); return; }
          callGas('work_update_case', { id: c.id, my_report_id: res.report_id }).then(function(){
            showToast('고객포털을 연결했습니다 — 열람번호 ' + res.report_id, 'success');
            loadChCases_();
            if (typeof loadWorkCases === 'function') loadWorkCases();
          });
        }).catch(function(err){ showToast('연결 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
      });
      return;
    }

    box.innerHTML = '<div class="log-empty">불러오는 중…</div>';
    callGas('admin_get_case', { report_id: c.my_report_id }).then(function(res){
      if (res.success === false){
        box.innerHTML = '<div class="log-empty">' + escapeHtml(res.message || '불러오지 못했습니다.') + '</div>';
        return;
      }
      var mc = res.case;
      var url = 'https://my.netax.kr/?report_id=' + mc.report_id;
      var checklist = mc.checklist || [];
      var status = mc.submission_status || {};
      var rows = checklist.map(function(item){
        var done = status[item] && status[item].submitted;
        return '<div class="log-entry"><div class="log-date" style="color:' + (done ? 'var(--navy)' : 'var(--sub)') + ';">' + (done ? '제출완료' : '미제출') + '</div>' +
          '<div class="log-text">' + escapeHtml(item) + '</div></div>';
      }).join('');
      var extra = status._extra || [];
      box.innerHTML =
        '<div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px;">' +
        '<code style="background:var(--panel); padding:3px 8px; border-radius:6px;">' + escapeHtml(mc.report_id) + '</code>' +
        '<button type="button" id="chMyCopyLinkBtn" class="ghost-btn" style="font-size:12px;">🔗 링크복사</button>' +
        '<button type="button" id="chMySendSmsBtn" class="ghost-btn" style="font-size:12px;">📱 문자로 전달</button>' +
        (mc.has_password ? '' : '<span style="font-size:11px; color:var(--danger); border:1px solid var(--danger); border-radius:10px; padding:1px 7px;">비밀번호 미설정</span>') +
        '</div>' +
        '<div style="font-size:12px; color:var(--sub); margin-bottom:6px;">체크리스트 제출현황</div>' +
        (rows || '<div class="log-empty">체크리스트가 없습니다.</div>') +
        (extra.length ? '<div style="font-size:12px; color:var(--sub); margin-top:8px;">기타 제출 ' + extra.length + '건: ' + escapeHtml(extra.map(function(f){ return f.fileName; }).join(', ')) + '</div>' : '') +
        '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:12px;">' +
        '<input type="text" id="chMyNewItem" placeholder="추가로 요청할 자료명" style="flex:1; min-width:140px;">' +
        '<button type="button" id="chMyAddItemBtn" class="save-btn">추가</button>' +
        '</div>';

      document.getElementById('chMyCopyLinkBtn').addEventListener('click', function(){
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function(){ showToast('링크를 복사했습니다.', 'success'); });
        else showToast(url, 'success');
      });
      document.getElementById('chMySendSmsBtn').addEventListener('click', function(){
        if (!confirm(c.고객명 + '님께 my.netax.kr 주소와 접근번호를 문자로 보낼까요?')) return;
        var btn = document.getElementById('chMySendSmsBtn');
        btn.disabled = true; btn.textContent = '전송 중…';
        callGas('send_my_portal_sms', { caseId: c.id }).then(function(res){
          btn.disabled = false; btn.textContent = '📱 문자로 전달';
          if (res.success === false){ showToast(res.message || '전송 실패', 'error'); return; }
          showToast('문자를 전송했습니다.', 'success');
        }).catch(function(err){ btn.disabled = false; btn.textContent = '📱 문자로 전달'; showToast('전송 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
      });
      document.getElementById('chMyAddItemBtn').addEventListener('click', function(){
        var label = document.getElementById('chMyNewItem').value.trim();
        if (!label){ showToast('자료명을 입력해주세요.', 'warning'); return; }
        chAddRequestedItem_(c, label, '');
      });
    }).catch(function(err){ box.innerHTML = '<div class="log-empty">불러오는 중 오류: ' + escapeHtml(err && err.message ? err.message : '') + '</div>'; });
  }

  // my.netax.kr 케이스 폴더 안 "보고서" 하위폴더(5-A에서 사건 폴더와 통합됨) 안의 파일 목록을
  // 보여준다 — 여기 .html 파일을 넣어두면 고객이 my.netax.kr에서 바로 본다(my_handleGetReportList
  // 가 .html/.htm만 필터링해서 보여줌). listFolder는 이미 있는 범용 Drive 탐색 액션을 그대로 씀.
  function chLoadMyReports_(c){
    var box = document.getElementById('chMyReports');
    if (!box) return;
    var folderName = (c.고객명 + ' ' + c.사건명).trim();
    // listFolder는 path가 있으면 절대 루트부터 이름을 따라 내려가므로 "고객사건" 기본폴더까지의
    // 전체 경로가 필요하다(위 "증빙관리에서 열기"와 같은 이유).
    getCustomerRootPath_().then(function(basePath){
    return callGas('listFolder', { path: basePath.concat([folderName, '보고서']) }).then(function(res){
      if (res.error){ box.innerHTML = '<div class="log-empty">' + escapeHtml(res.error) + '</div>'; return; }
      var files = res.files || [];
      // [2026.09] "📁 보고서 폴더 열기"(구글드라이브 새 탭) 링크는 카드 제목 버튼(chDocsWriterOpenBtn,
      // 증빙확보 화면 안에서 이 폴더로 바로 이동)으로 흡수했으므로 여기선 뺀다 — 작성관리
      // (report-writer)도 work.netax.kr이 아니라 이 앱 안의 네이티브 화면(reportwriter.html)이라
      // <a href> 대신 버튼 + goToReportWriter_ 호출을 쓴다. saveFolderId(이 폴더 ID)를 넘기면
      // 작성관리가 처음 저장할 때 이 폴더 안에 파일을 새로 만들고, 그 다음부터는 덮어쓰기 저장한다.
      var newDocLink = '<button type="button" id="chNewReportBtn" class="ghost-btn" style="font-size:12px; margin-bottom:8px;">✍ 새 문서 작성</button>';
      if (!files.length){
        box.innerHTML = newDocLink + '<div class="log-empty">아직 올린 보고서가 없습니다.</div>';
      } else {
        var htmlFiles = files.filter(function(f){ return /\.html?$/i.test(f.name); });
        var otherFiles = files.filter(function(f){ return !/\.html?$/i.test(f.name); });
        var rows = htmlFiles.map(function(f){
          return '<div class="log-entry"><div class="log-date" style="color:var(--navy);">열람가능</div><div class="log-text">' + escapeHtml(f.name) +
            ' <button type="button" class="chEditReportBtn ghost-btn" data-file-id="' + escapeHtml(f.id) + '" style="font-size:11px; padding:1px 7px; margin-left:6px;">✍ 편집</button>' +
            '</div></div>';
        }).join('');
        box.innerHTML = newDocLink + rows +
          (otherFiles.length ? '<div style="font-size:12px; color:var(--sub); margin-top:6px;">그 외 파일(.html 아님, 고객에게 안 보임) ' + otherFiles.length + '건: ' + escapeHtml(otherFiles.map(function(f){ return f.name; }).join(', ')) + '</div>' : '');
      }
      var newBtn = document.getElementById('chNewReportBtn');
      if (newBtn){
        newBtn.addEventListener('click', function(){
          if (typeof goToReportWriter_ === 'function') goToReportWriter_(c.id, { saveFolderId: res.folderId, saveFileName: folderName });
        });
      }
      box.querySelectorAll('.chEditReportBtn').forEach(function(btn){
        btn.addEventListener('click', function(){
          if (typeof goToReportWriter_ === 'function') goToReportWriter_(c.id, { fileId: btn.getAttribute('data-file-id') });
        });
      });
    });
    }).catch(function(){ box.innerHTML = '<div class="log-empty">불러오지 못했습니다.</div>'; });
  }
</script>
