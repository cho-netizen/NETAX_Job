<div class="view" id="view-casehandling">
  <div class="view-head"><h2>🧭 처리개요</h2></div>
  <div class="view-body">
    <div class="card">
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <select id="chCaseSelect" style="min-width:220px; max-width:420px;"><option value="">사건을 선택하세요</option></select>
      </div>
    </div>
    <div id="chBody"></div>
  </div>
</div>

<script>
  // ============================================================
  // 사건처리 — 작업관리(사건 목록·현황)와 분리된 "실제 처리" 전용 화면.
  // [2026.09] 원래 작업관리 사건 상세화면 안에 처리방향/작업일지/법령예규판례를 다 넣었었는데,
  // "작업관리에는 현황만, 실제 작업은 처리에서" 라는 피드백에 따라 이 화면으로 분리했다.
  // 사건 목록은 work_get_cases를 이 화면에서 독립적으로 다시 불러온다(작업관리를 먼저 열지
  // 않고 바로 이 화면으로 와도 동작해야 하므로, workmanage.html의 workCases 전역과는 별도).
  // ============================================================
  var chCases = [];
  var chSelectedId = null;
  // [2026.10.23 ㅅ16차 — 점검표 195] 세무사님이 처리개요 칸에 적는 중인 값은 화면이 다시 그려져도(저장 충돌 새로고침·GAS 처리 뒤 사건 화면 복귀 등) 어떤 경우에도 보존한다 — 칸 id → 적은 값
  var chTyped_ = {}, chTypedCase_ = null;
  function chTypedRestore_(){
    var ids = Object.keys(chTyped_), n = 0;
    ids.forEach(function(id){ var el = document.getElementById(id); if (!el || !('value' in el)) return; if (String(el.value) !== String(chTyped_[id])){ el.value = chTyped_[id]; try { el.dispatchEvent(new Event('input', { bubbles: true })); } catch (e) {} n++; } });
    if (n && typeof showToast === 'function') showToast('화면을 다시 그렸지만 적고 계시던 값 ' + n + '개는 그대로 두었습니다 — [저장]을 눌러 주세요.', 'warning');
  }
  // [2026.09] 사건분류 옵션의 진짜 목록은 서버(work_get_cases 응답의 evidenceClassificationOptions,
  // Code.js의 WORK_EVIDENCE_TEMPLATES_에서 그대로 뽑아온 것)에서만 가져온다 — 여기서는 그
  // 목록 앞에 빈 선택지와 "일반OO" 기본값만 붙여서 그린다(CH_CLASSIFICATION_DEFAULT_LABEL_).
  // 서버 응답이 아직 안 왔을 때(최초 렌더링 등)를 대비해 빈 배열을 기본값으로 둔다 — 이 경우
  // 화면엔 "일반OO" 하나만 보이다가, work_get_cases 응답이 오면 다시 그려질 때 채워진다.
  var chCaseClassificationOptions_ = {};
  var CH_CLASSIFICATION_DEFAULT_LABEL_ = { transfer: '일반과세', gift: '일반증여', inheritance: '일반상속' };
  var chCaseSelectEl = document.getElementById('chCaseSelect');
  var chBodyEl = document.getElementById('chBody');

  // [2026.09] 사건개요서 — "처리방향(어떻게 처리할지)을 정하기 전에, 무슨 사실관계인지부터
  // 세목별로 정해진 항목에 채워넣는 양식이 있어야 한다"는 지적에 따라, 자유텍스트였던
  // "처리대상" 칸을 세목별 구조화 양식으로 바꿨다. 항목은 세액계산기가 이미 알고 있는
  // "이 계산에 필요한 사실관계"를 그대로 재사용한 것(양도소득세: taxcalc-engine.html의
  // 1세대1주택 판정 로직이 쓰는 값들과 동일) — 체크리스트를 따로 새로 만들지 않고 세액계산
  // 코드 하나에 노하우를 집중시킨다는 원칙을 따른다. 1단계 파일럿이라 양도소득세만 있고,
  // 나머지 세목은 검증 후 확장 — 템플릿이 없는 세목은 예전처럼 자유텍스트(처리대상)로 남는다.
  // [2026.09 수정] 사용자 피드백 반영: (1) 양도물건을 자산종류·유형·소재지(동,호)로 세분화 —
  // 증빙확보의 자동확보(주소검색·실거래가·공시가격 조회)가 동작하려면 대표필지 수준의 상세
  // 소재지가 필요하다. (2) 필요경비는 개요 단계에서 불필요해 제거(세액계산 단계에서 다룸).
  // (3) "사건분류"(일반/비과세/감면/1주택고가/다주택중과/부담부증여) 콤보박스 추가 — 이게
  // 기존 "1세대1주택여부"보다 더 정확한 분류라 그 필드를 대체한다. 부담부증여는 전액부담부
  // 증여만 해당(부분부담부증여는 증여세 사건으로 따로 분류됨) — 옵션 라벨에 명시.
  // (4) 양도일만 제외하고 취득일·양도가액·취득가액·보유기간·거주기간·다른주택보유현황은
  // 그대로 둔다 — "나중에 세액계산에서도 물어보니 여기선 빼자"는 건 순서가 거꾸로다.
  // 사건개요서가 먼저 작성되고 세액계산은 그 뒤에 하므로, 여기서 이미 파악된 값이 있으면
  // 나중에 세액계산 쪽을 자동으로 채워주는 방향이어야지 그 반대(세액계산 항목이라서 개요서에서
  // 뺀다)는 성립하지 않는다는 지적. 양도일만 예외인 건 세액계산과 겹쳐서가 아니라, 이미 사건
  // 자체의 "기준일"(법정기한 계산에 쓰는 값, 사건 생성 시 입력)과 완전히 같은 값이기 때문 —
  // 이건 사건개요서보다도 먼저(사건 생성 시점) 파악되는, 같은 단계의 진짜 중복이라 뺀 것.
  // [2026.09 수정 2] (1) 자산종류·유형은 taxcalc.html의 양도세 자산카드가 이미 쓰는 값을
  // 그대로 재사용(assetType/assetKind, 옵션 문구까지 동일) — 나중에 세액계산 쪽에서 이
  // 사건개요를 읽어 자동으로 채워줄 때 필드명이 같아야 그대로 옮겨꽂을 수 있다. (2) 소재지에
  // taxcalc.html과 같은 주소검색(🔍, openAddressSearchModal_) 버튼을 달았고, 동·호는 처음엔
  // 숨겨뒀다가 유형이 "건물"이거나 주소검색 결과에 동 목록이 있을 때만 보여준다(토지엔 동·호
  // 개념이 없으므로). (3) 보유기간·거주기간·다른주택보유현황은 삭제(요청). 양도일은
  // 사건의 "기준일"(법정기한 계산에 쓰는 값)과 완전히 같은 값이라 별도 저장하지 않고, 이
  // 칸을 고치면 기준일 자체를 같이 업데이트한다 — 값을 두 곳에 따로 들고 있지 않아
  // 작업관리의 법정일 계산과 절대 어긋나지 않는다.
  var CH_ASSET_TYPE_OPTIONS_ = [
    { value: 'other', label: '그 외 부동산' },
    { value: 'house', label: '주택·조합원입주권' },
    { value: 'presale_right', label: '분양권(§104①1호·2호·3호 — 1년미만 70%/1년이상 60% 단일세율, 장기보유특별공제·기본세율누진 배제)' }
  ];
  var CH_ASSET_KIND_OPTIONS_ = [
    { value: 'land', label: '토지' },
    { value: 'building', label: '건물(구분소유 건물·아파트 등 대지권 포함분도 건물면적만 입력)' },
    { value: 'other', label: '기타' }
  ];
  // [2026.09] 세목별로 "납세의무자 이름" 역할을 하는 사건개요 필드 키 — 작업관리의 "납세자"와
  // 반드시 같은 값이어야 한다는 요청에 따라, 이 키를 가진 필드가 채워지면 양쪽을 서로 맞춘다
  // (casehandling.html의 chSaveTarget, workmanage.html의 saveCaseNow_, memo.html의 사건개요
  // 초안 적용 3곳이 이 상수를 함께 참조한다). 양도소득세는 양도인(taxcalc.html의
  // trTransferorName과 동일 키), 증여세는 수증자(납세의무자가 곧 수증자).
  // [2026.09.15 변경] 상속세는 원래 법적 납세의무자인 대표 상속인(상속인성명)과 동기화했으나,
  // 세무사님 지시로 사건 식별에 실무상 더 유용한 피상속인(ihDeceasedName)과 동기화하도록
  // 변경 — 작업관리의 "납세자"란에 피상속인 이름을 적으면 이제 처리개요의 "피상속인 성명"란도
  // 같이 채워진다(반대 방향도 동일).
  // [2026.09.23 버그수정] '사업' 세목이 이 매핑에서 빠져 있어(사업 사건개요는 2026.09.19에
  // 나중에 추가됨) 작업관리 납세자가 아무리 입력돼도 "납세자(대표) 성명"(bizTaxpayerName)에
  // 전혀 반영되지 않았다 — Code.js의 WORK_TAXPAYER_FIELD_BY_SEMOK_도 같이 고칠 것.
  var TAXPAYER_NAME_FIELD_BY_SEMOK_ = { transfer: 'trTransferorName', gift: 'giftDoneeName', inheritance: 'ihDeceasedName', business: 'bizTaxpayerName' };
  var CH_CASE_OVERVIEW_FIELDS_ = {
    // [2026.09 버그수정] 실사용 감사 지적 — '양도가액'/'취득일'/'취득가액' 세 필드는 물건목록
    // 재설계 이전(대표 1건만 다루던 시절)의 유물이었다. 물건목록 카드에도 취득일·취득가액이
    // 있고, 양도가액은 계약별 금액란에서 다루는데, 이 죽은 필드들이 같은 화면에 그대로
    // 남아있어 "어디에 입력해야 진짜 저장되는지" 혼란을 줬고, 저장 시(chSaveTarget의
    // Object.assign(overview, assetList[0]))에 물건목록 값으로 조용히 덮어써져 여기 입력한
    // 값은 애초에 저장되지도 않았다.
    transfer: [
      { key: 'trTransferorName', label: '양도인 성명', type: 'text', beforeAsset: true },
      { key: 'trTransferorExtraNames', label: '공동양도인(대표 외, 쉼표로 구분)', type: 'text', beforeAsset: true },
      { key: '고객추가명단', label: '공동의뢰인(대표 외, 쉼표로 구분)', type: 'text', beforeAsset: true },
      { key: '사건분류', label: '사건분류', type: 'select', dynamicClassification: true },
      { key: '특이사항', label: '특이사항', type: 'textarea' }
    ],
    // [2026.09] 증여세·상속세 사건개요서 — 양도소득세와 같은 원칙(taxcalc.html의 실제 입력
    // 필드명을 그대로 재사용). 증여: giftDoneeName/giftDonorName/giftRelation(taxcalc.html
    // 2842~2860행과 옵션까지 동일)/giftAmount/giftDebtAssumed(부분부담부증여만 — 전액부담부는
    // 양도세 사건으로 분류)/giftPriorAmount(10년내 동일인 기증여합산액). 상속: ihDeceasedName/
    // ihEstate(taxcalc.html 4583~4601행과 동일).
    // [2026.09.19 추가] "의뢰인·양도인·증여인·수증인·상속인도 모두 여러 명일 수 있다" —
    // 대표 1명은 기존 필드(세액계산·사건명 생성이 이미 이 필드명을 쓰고 있어 그대로 둠) 그대로,
    // 그 외 인원은 "…ExtraNames"(쉼표구분)에 추가로 받아 고객관리 등록/연결에만 쓴다.
    gift: [
      { key: 'giftDoneeName', label: '수증자 성명', type: 'text', beforeAsset: true },
      { key: 'giftDoneeExtraNames', label: '공동수증인(대표 외, 쉼표로 구분)', type: 'text', beforeAsset: true },
      { key: 'giftDonorName', label: '증여자 성명', type: 'text', beforeAsset: true },
      { key: 'giftDonorExtraNames', label: '공동증여인(대표 외, 쉼표로 구분)', type: 'text', beforeAsset: true },
      { key: '고객추가명단', label: '공동의뢰인(대표 외, 쉼표로 구분)', type: 'text', beforeAsset: true },
      { key: 'giftRelation', label: '관계(수증자 기준)', type: 'select', options: ['', '배우자', '직계존속(1촌, 부모 등→자녀)', '직계존속(2촌 이상, 조부모 등→손자녀·세대생략)', '직계비속(1촌, 자녀 등→부모)', '직계비속(2촌 이상, 손자녀 등→조부모·세대생략)', '기타친족', '기타(상속인 아닌 자 등)'] },
      { key: 'giftAmount', label: '증여재산가액(전체, 채무 차감 전)', type: 'money' },
      { key: 'giftAppraisalFee', label: '감정평가수수료(500만원 한도 공제)', type: 'money' },
      { key: 'giftDebtAssumed', label: '인수채무액(부담부증여, 없으면 비움)', type: 'money' },
      { key: 'giftPriorAmount', label: '10년내 동일인 기증여합산액', type: 'money' },
      { key: '사건분류', label: '사건분류', type: 'select', dynamicClassification: true },
      { key: '특이사항', label: '특이사항', type: 'textarea' }
    ],
    inheritance: [
      { key: 'ihDeceasedName', label: '피상속인 성명', type: 'text', beforeAsset: true },
      { key: '상속인성명', label: '대표 상속인 성명', type: 'text' },
      { key: '상속인추가명단', label: '그 외 상속인(대표 외, 쉼표로 구분)', type: 'text' },
      { key: '고객추가명단', label: '공동의뢰인(쉼표로 구분)', type: 'text' },
      { key: '상속인수', label: '상속인 수', type: 'number' },
      { key: 'ihEstate', label: '상속세과세가액(예상)', type: 'money' },
      { key: '사건분류', label: '사건분류', type: 'select', dynamicClassification: true },
      { key: '특이사항', label: '특이사항', type: 'textarea' }
    ],
    // [2026.09.19 신규] 사업 사건은 구조화된 사건개요가 아직 없었다("사업 세목 추가" 당시
    // 최소범위로 시작) — 관계자(납세자·임직원)를 고객관리에 등록/연결하려면 최소한 이름을
    // 받을 자리가 필요해서 여기서 처음 만든다. 세액계산·사건명 생성 등 다른 로직은 이 세목에
    // 아직 의존하지 않으므로 필드명을 자유롭게 정해도 안전하다.
    business: [
      { key: 'bizTaxpayerName', label: '납세자(대표) 성명', type: 'text', beforeAsset: true },
      { key: 'bizTaxpayerExtraNames', label: '공동납세자(대표 외, 쉼표로 구분)', type: 'text', beforeAsset: true },
      { key: '고객추가명단', label: '공동의뢰인(쉼표로 구분)', type: 'text', beforeAsset: true },
      { key: 'bizEmployeeNames', label: '임직원(여러 명이면 쉼표로 구분)', type: 'text' },
      { key: '특이사항', label: '특이사항', type: 'textarea' }
    ]
  };

  // [2026.09] "양도·상속·증여가액란은 자동으로 콤마 형식이 되어야" — 금액 필드(type:'money')는
  // 실제로는 type="text"+inputmode="numeric"으로 그리고, 입력할 때마다 chOnMoneyInput_이
  // 숫자만 남겨 천단위 콤마를 다시 채운다. 저장할 때(chSaveTarget 등 수집부)는 콤마를 뺀
  // 순수 숫자 문자열로 되돌려야 하므로 chUnformatMoney_를 꼭 거칠 것 — memo.html도 사건개요
  // 초안 폼에서 이 두 함수를 그대로 재사용한다(같은 페이지에 로드되어 전역으로 접근 가능).
  function chFormatMoney_(raw){
    var digits = String(raw == null ? '' : raw).replace(/[^0-9]/g, '');
    if (!digits) return '';
    return Number(digits).toLocaleString('ko-KR');
  }
  function chUnformatMoney_(formatted){
    return String(formatted == null ? '' : formatted).replace(/[^0-9]/g, '');
  }
  function chOnMoneyInput_(el){
    var caretFromEnd = el.value.length - el.selectionStart;
    el.value = chFormatMoney_(el.value);
    var pos = Math.max(0, el.value.length - caretFromEnd);
    el.setSelectionRange(pos, pos);
  }

  function chRenderOverviewFieldInput_(field, value, semok){
    var v = escapeHtml(value || '');
    var idAttr = 'id="chOv_' + field.key + '" data-key="' + field.key + '"';
    var common = idAttr + ' style="width:100%; box-sizing:border-box;"';
    if (field.type === 'select'){
      // [2026.09] 사건분류만 서버가 내려준 실제 목록(chCaseClassificationOptions_)으로 그린다 —
      // 빈 선택지 + "일반OO" + 서버 목록 순서. 나머지 select 필드(관계 등)는 그대로 고정 옵션.
      var opts = field.dynamicClassification
        ? [''].concat([CH_CLASSIFICATION_DEFAULT_LABEL_[semok] || '일반']).concat(chCaseClassificationOptions_[semok] || [])
        : field.options;
      // [2026.09 버그수정] 실사용 감사 지적 — 이 사건에 이미 저장된 사건분류 값이 서버의
      // 현재 목록(라벨을 나중에 바꾸거나 뺀 경우)에 없으면 어떤 option도 selected가 안 돼
      // 화면엔 "선택 안 함"처럼 보이다가, 그 상태로 저장을 누르면 원래 값이 빈 값으로 조용히
      // 사라졌다. 목록에 없는 기존 값은 지우지 말고 그대로 옵션에 끼워 넣어 보존한다.
      // [2026.10.28] 관계 등 고정 선택지 칸도 같은 원칙 — 저장된 값이 선택지에 없으면(GAS·사이드바가 적은 글이 선택지와 조금 다를 때) 끼워 넣어 보존한다.
      //  예전엔 사건분류만 보존해, 관계 칸은 "선택 안 함"으로 보이다 저장하면 말없이 지워졌다(증여 값이 장부로 이어지면 손대지 않은 칸이 "비움"으로 잡힘)
      if (value && opts.indexOf(value) === -1) opts = opts.concat([value]);
      return '<select ' + common + '>' + opts.map(function(opt){
        return '<option value="' + escapeHtml(opt) + '"' + (opt === (value || '') ? ' selected' : '') + '>' + (opt || '(선택 안 함)') + '</option>';
      }).join('') + '</select>';
    }
    if (field.type === 'textarea'){
      return '<textarea ' + common + ' style="width:100%; min-height:44px; font-family:inherit; font-size:13px; box-sizing:border-box;">' + v + '</textarea>';
    }
    if (field.type === 'money'){
      return '<input type="text" inputmode="numeric" placeholder="원" ' + common + ' value="' + escapeHtml(chFormatMoney_(value)) + '" oninput="chOnMoneyInput_(this)">';
    }
    // [2026.09.16 버그수정] 세무사님 지적 — 성명(2~6자)·날짜(10자)·인원수(1~2자)처럼 대체로
    // 아주 짧은 값인데, 그리드 칸(180px)을 꽉 채우는 width:100%를 그대로 써서 빈 칸이 크게
    // 남아 보였다. 그리드 칸 자체 크기는 그대로 두고(다른 칸과 줄이 맞아야 하므로) 입력창만
    // 실제 데이터 길이에 맞춰 좁혀 왼쪽으로 붙인다.
    if (field.type === 'date'){
      return '<input type="date" ' + idAttr + ' style="width:95px; box-sizing:border-box;" value="' + v + '">';
    }
    if (field.type === 'number'){
      return '<input type="number" ' + idAttr + ' style="width:70px; box-sizing:border-box;" value="' + v + '">';
    }
    var sizeAttr = Math.max(String(value || '').length, 6) + 2;
    return '<input type="' + field.type + '" ' + idAttr + ' size="' + sizeAttr + '" style="box-sizing:border-box;" value="' + v + '">';
  }

  // 자산종류·유형·소재지·동·호·물건수·양도일 — taxcalc.html의 assetType/assetKind/assetLocation
  // /assetDong/assetHo와 필드명을 맞춘 커스텀 블록(단순 select/input이 아니라 주소검색·동호
  // 조건부 표시 같은 상호작용이 필요해 CH_CASE_OVERVIEW_FIELDS_의 일반 렌더러와 분리했다).
  // [2026.09 재설계] "양도 물건이 여러 필지일 때 전체 목록을 가장 먼저 파악해야 하는데,
  // 이 시스템은 세액계산 단계에서야 겨우 다 입력하게 된다"는 지적 — 물건 목록의 주인을
  // 세액계산(taxcalc.html의 transferAssets, 계산 편의용 임시 배열이라 실제로는 대표 1건
  // 말고는 저장조차 안 되고 있었다)에서 사건개요서로 옮긴다. 사건을 열자마자(사실관계
  // 파악 시점) 물건을 몇 개든 바로 추가할 수 있고, 세액계산 화면은 이 목록을 그대로
  // 불러와 시작한다(자세한 내용은 taxcalc.html의 tcApplyOverviewToTransfer_ 참고).
  // 옛 사건(대표 물건 1건을 overview에 바로 flat하게 저장하던 방식)은 첫 렌더링 때 1건짜리
  // 물건목록으로 자동 이관한다 — 데이터 유실 없음.
  function chGetAssetList_(overview){
    if (Array.isArray(overview.물건목록) && overview.물건목록.length) return overview.물건목록;
    if (overview.assetType || overview.assetLocation || overview.양도가액 || overview.취득가액) {
      return [{
        assetType: overview.assetType || '', assetKind: overview.assetKind || '',
        assetLocation: overview.assetLocation || '', assetDong: overview.assetDong || '',
        assetHo: overview.assetHo || '', assetDongList: overview.assetDongList || [],
        취득일: overview.취득일 || '', 양도가액: overview.양도가액 || '', 취득가액: overview.취득가액 || '',
        취득계약구분: '', 양도계약구분: ''
      }];
    }
    return [{}];
  }

  function chBuildAssetCardHtml_(asset, idx, showDelete, hideAcqGroup, hideTransferGroup){
    var showDongHo = asset.assetKind === 'building' || (Array.isArray(asset.assetDongList) && asset.assetDongList.length > 0);
    var dongOptions = Array.isArray(asset.assetDongList) ? asset.assetDongList : [];
    return '<div class="chAssetCard" data-idx="' + idx + '" style="grid-column:1/-1; border:1px solid var(--line); border-radius:8px; padding:10px; display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:8px 12px; position:relative;">' +
      (showDelete ? '<button type="button" class="chAssetDelBtn ghost-btn" data-idx="' + idx + '" style="position:absolute; top:6px; right:6px; padding:1px 8px; font-size:11px;" title="이 물건 삭제">✕</button>' : '') +
      '<div><label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">자산종류</label>' +
      '<select class="chAssetField" data-field="assetType" style="width:100%; box-sizing:border-box;"><option value="">선택</option>' +
      CH_ASSET_TYPE_OPTIONS_.map(function(o){ return '<option value="' + o.value + '"' + (o.value === asset.assetType ? ' selected' : '') + '>' + escapeHtml(o.label) + '</option>'; }).join('') +
      '</select></div>' +
      '<div><label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">유형</label>' +
      '<select class="chAssetField chAssetKindSel" data-field="assetKind" style="width:100%; box-sizing:border-box;"><option value="">선택</option>' +
      CH_ASSET_KIND_OPTIONS_.map(function(o){ return '<option value="' + o.value + '"' + (o.value === asset.assetKind ? ' selected' : '') + '>' + escapeHtml(o.label) + '</option>'; }).join('') +
      '</select></div>' +
      '<div style="grid-column:span 2;"><label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">소재지</label>' +
      '<div style="display:flex; gap:6px;">' +
      '<input type="text" class="chAssetField" data-field="assetLocation" style="flex:1; box-sizing:border-box;" value="' + escapeHtml(asset.assetLocation || '') + '" placeholder="예: OO시 OO구 OO동 123-4">' +
      '<button type="button" class="chAssetAddrSearchBtn ghost-btn" data-idx="' + idx + '" style="flex-shrink:0;" title="주소 검색">🔍</button>' +
      '</div></div>' +
      '<div class="chAssetDongHoWrap" style="display:' + (showDongHo ? 'contents' : 'none') + ';">' +
      '<div><label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">동</label>' +
      '<select class="chAssetField" data-field="assetDong" style="width:100%; box-sizing:border-box;"><option value="">직접입력/해당없음</option>' +
      dongOptions.map(function(d){ return '<option value="' + escapeHtml(d) + '"' + (asset.assetDong === d ? ' selected' : '') + '>' + escapeHtml(d) + '</option>'; }).join('') +
      '</select></div>' +
      '<div><label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">호</label>' +
      '<input type="text" class="chAssetField" data-field="assetHo" size="6" style="box-sizing:border-box;" value="' + escapeHtml(asset.assetHo || '') + '"></div></div>' +
      '<div><label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">취득일(선택)</label>' +
      '<input type="date" class="chAssetField" data-field="취득일" style="width:95px; box-sizing:border-box;" value="' + escapeHtml(asset.취득일 || '') + '"></div>' +
      // [2026.09 재설계] "양도가액은 물건별이 아니라 양도계약 단위로 정해지는 값"이라는 지적 —
      // 물건 카드마다 따로 입력하던 것을 없애고, 아래 "양도계약별 금액"란(chBuildTransferGroupAmountsHtml_)
      // 에서 계약(그룹) 하나당 한 번만 입력하도록 옮겼다. 취득가액은 사용자 판단에 따라
      // "취득 쪽은 세액계산 단계에서 정확히 반영하면 된다"고 하여 예전처럼 물건별 개산값만 유지한다.
      '<div><label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">취득가액(예상, 선택)</label>' +
      '<input type="text" inputmode="numeric" class="chAssetField" data-field="취득가액" data-money="1" style="width:100%; box-sizing:border-box;" value="' + escapeHtml(chFormatMoney_(asset.취득가액)) + '" placeholder="원" oninput="chOnMoneyInput_(this)"></div>' +
      // [2026.09] "중개비용·법무비용은 물건별이 아니라 계약·등기별로 발생한다"는 지적 — 여러
      // 물건을 같은 취득계약(또는 같은 양도계약)으로 한꺼번에 샀거나/판 경우, 같은 구분값을
      // 적어두면 증빙확보에서 취득/양도 관련 서류(취득세·중개보수·계약서 등)를 물건 수만큼이
      // 아니라 계약 수만큼만 요청한다. 물건이 1건뿐이거나, 위 "모두 같은 계약으로 묶기"
      // 체크박스를 켰으면(제일 흔한 "통째로 한 세트로 사고팔았다" 경우) 이 칸 자체를 숨겨서
      // 매번 똑같은 값을 일일이 타이핑할 필요가 없게 한다.
      (hideAcqGroup ? '' :
      '<div><label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">취득계약 구분(선택)</label>' +
      '<input type="text" class="chAssetField" data-field="취득계약구분" style="width:100%; box-sizing:border-box;" value="' + escapeHtml(asset.취득계약구분 || '') + '" placeholder="예: A계약(다른 물건과 같이 샀으면)"></div>') +
      (hideTransferGroup ? '' :
      '<div><label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">양도계약 구분(선택)</label>' +
      '<input type="text" class="chAssetField" data-field="양도계약구분" style="width:100%; box-sizing:border-box;" value="' + escapeHtml(asset.양도계약구분 || '') + '" placeholder="예: A계약(다른 물건과 같이 팔면)"></div>') +
      '</div>';
  }

  // [2026.09] "1필이든 여러 필지든 무조건 몽땅 세트로 사고팔 때는 매번 같은 구분값을 물건마다
  // 타이핑하지 않아도 간단히 처리돼야 한다"는 지적 — 물건 목록 위에 체크박스 한 번으로 "전체
  // 묶기"를 켜면, 물건마다 취득계약/양도계약 구분을 따로 안 적어도 전체가 한 세트로 처리된다
  // (구분값을 부분적으로만 묶고 싶은 복잡한 경우엔 체크박스를 끄고 카드별로 직접 적으면 된다).
  function chMakeTransferCardBuilder_(overview){
    return function(asset, idx, showDelete){
      var list = overview._chAssetListWorking || [];
      var hideAcq = list.length <= 1 || !!overview.취득계약일괄;
      var hideTransfer = list.length <= 1 || !!overview.양도계약일괄;
      return chBuildAssetCardHtml_(asset, idx, showDelete, hideAcq, hideTransfer);
    };
  }

  function chBuildTransferAssetBlockHtml_(overview, baseDate){
    var list = overview._chAssetListWorking || (overview._chAssetListWorking = chGetAssetList_(overview));
    var cardBuilder = chMakeTransferCardBuilder_(overview);
    var cardsHtml = list.map(function(asset, idx){ return cardBuilder(asset, idx, idx > 0); }).join('');
    // 물건이 2건 이상일 때만 "전체 묶기" 체크박스를 보여준다 — 1건이면 애초에 묶고 말고가 없다.
    var bundleControls = list.length > 1
      ? '<div style="grid-column:1/-1; display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--sub); background:var(--panel); border-radius:6px; padding:6px 10px;">' +
        '<label style="display:flex; align-items:center; gap:4px; cursor:pointer;"><input type="checkbox" id="chAcqBundleChk"' + (overview.취득계약일괄 ? ' checked' : '') + '> 물건 전체를 같은 취득계약(한 세트로 매입)으로 묶기</label>' +
        '<label style="display:flex; align-items:center; gap:4px; cursor:pointer;"><input type="checkbox" id="chTransferBundleChk"' + (overview.양도계약일괄 ? ' checked' : '') + '> 물건 전체를 같은 양도계약(한 세트로 매도)으로 묶기</label>' +
        '</div>'
      : '';
    // [2026.09 버그수정] 실사용 지적 — 취득일·취득가액(물건 카드 안)이 양도일·양도가액보다
    // 화면에 먼저 나와 순서가 어색했다. 양도(팔 때) 정보가 먼저, 취득(살 때) 정보가 그 다음에
    // 나오도록 양도일·양도가액 블록을 물건 카드 앞으로 옮긴다.
    return bundleControls +
      '<div>' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">양도일</label>' +
      '<input type="date" id="chOvTransferDate" style="width:95px; box-sizing:border-box;" value="' + escapeHtml(baseDate || '') + '">' +
      '</div>' +
      '<div id="chTransferGroupAmountsHost" style="display:contents;">' + chBuildTransferGroupAmountsHtml_(list, overview) + '</div>' +
      '<div id="chAssetCardsHost" style="display:contents;">' + cardsHtml + '</div>' +
      '<div style="grid-column:1/-1;"><button type="button" id="chAssetAddBtn" class="ghost-btn" style="font-size:12px;">+ 물건 추가</button>' +
      (list.length > 1 ? ' <span style="color:var(--sub); font-size:12px;">물건 ' + list.length + '건 — 실제 사건개요서 목록입니다(대표 1건이 아닙니다).</span>' : '') +
      '</div>';
  }

  // [2026.09 재설계] "양도가액은 물건별이 아니라 양도계약 단위로 정해진다"는 지적 — 물건들을
  // 양도계약구분(또는 전체묶기)으로 묶어서, 계약(그룹) 하나당 금액 입력칸을 딱 하나만 보여준다.
  // 같은 그룹에 물건이 여러 개면 값을 그 물건들 모두의 양도가액 필드에 똑같이 써넣는다 —
  // 배열 구조 자체는 그대로 두고(물건마다 양도가액 필드는 여전히 있음) 입력 UI만 계약 단위로
  // 묶은 것이라, 세액계산(taxcalc.html)이나 증빙확보 쪽 코드는 그대로 호환된다.
  function chComputeTransferGroups_(list, overview){
    if (overview.양도계약일괄) return [{ tag: '', members: list.map(function(_, i){ return i; }) }];
    var groups = [];
    var byTag = {};
    list.forEach(function(asset, idx){
      var tag = String(asset.양도계약구분 || '').trim();
      if (tag && byTag[tag]) { byTag[tag].members.push(idx); return; }
      var group = { tag: tag, members: [idx] };
      if (tag) byTag[tag] = group;
      groups.push(group);
    });
    return groups;
  }
  function chTransferGroupLabel_(group, list, gi){
    if (group.tag) return group.tag;
    if (group.members.length > 1) return '전체(' + group.members.length + '건)';
    var only = list[group.members[0]];
    return (only && only.assetLocation) ? only.assetLocation : ('물건' + (group.members[0] + 1));
  }
  function chBuildTransferGroupAmountsHtml_(list, overview){
    // [2026.09 버그수정] 물건이 1건뿐이어도 양도가액을 입력할 곳 자체가 없어지면 안 된다 —
    // 이 경우 그룹 계산이 자연스럽게 "물건 1개짜리 그룹 1개"가 되어 입력칸 1개만 뜬다.
    var groups = chComputeTransferGroups_(list, overview);
    return groups.map(function(group, gi){
      var first = list[group.members[0]] || {};
      var labelSuffix = groups.length > 1 ? ' — ' + escapeHtml(chTransferGroupLabel_(group, list, gi)) : '';
      // [2026.09 버그수정] 물건이 여러 건인 그룹은 이 칸에 "계약 전체 금액"이 들어가고, 저장 시
      // 그 값이 그룹에 속한 모든 물건에 그대로 복제된다(정확한 물건별 몫은 세액계산 화면에서
      // 기준시가로 안분— "🧮 계약 안분" 버튼). 실사용 감사에서 이 사실을 모르고 그대로 합산하면
      // 양도소득이 물건 수만큼 부풀려질 수 있다는 지적이 있어 안내를 명확히 한다.
      var groupHint = group.members.length > 1 ? '<div style="font-size:11px; color:var(--sub); margin-top:2px;">계약 전체 금액입니다 — 세액계산 화면에서 물건별로 안분해야 합니다</div>' : '';
      return '<div class="chTransferGroupRow" data-members="' + group.members.join(',') + '">' +
        '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">양도가액' + labelSuffix + '(선택)</label>' +
        '<input type="text" inputmode="numeric" class="chTransferGroupAmountInput" style="width:100%; box-sizing:border-box;" placeholder="원" value="' + escapeHtml(chFormatMoney_(first.양도가액)) + '" oninput="chOnMoneyInput_(this)">' + groupHint + '</div>';
    }).join('');
  }

  // 물건카드 각각의 유형변경(동·호 표시)·주소검색·값 변경·추가·삭제를 이벤트 위임으로 연결한다.
  // chBodyEl.innerHTML 대입 뒤에 호출. 양도(chBuildAssetCardHtml_)·증여·상속
  // (chBuildLocationAssetCardHtml_) 모두 같은 class/data-* 관례(.chAssetCard/.chAssetField/
  // .chAssetKindSel/.chAssetAddrSearchBtn/.chAssetDelBtn/#chAssetAddBtn/#chAssetCardsHost)를
  // 쓰므로 카드를 실제로 그리는 함수만 cardBuilderFn으로 받아 세 세목이 공유한다. 양도만 쓰는
  // "양도계약별 금액" 영역(#chTransferGroupAmountsHost)은 물건 구성이 바뀔 때마다 다시 그려야
  // 해서, 그 갱신 함수를 onGroupsChanged로 따로 받는다(증여·상속은 안 넘기면 그만이라 무해함).
  function chWireAssetListBlock_(overview, cardBuilderFn, onGroupsChanged){
    var container = document.getElementById('chOverviewFieldsGrid');
    if (!container || !overview._chAssetListWorking) return;
    var list = overview._chAssetListWorking;

    function rerender(){
      // 카드 배열만 다시 그린다 — 나머지(처리방향 등)는 그대로 둔다.
      var cardsHost = document.getElementById('chAssetCardsHost');
      if (cardsHost) cardsHost.innerHTML = list.map(function(asset, idx){ return cardBuilderFn(asset, idx, idx > 0); }).join('');
      // 물건 추가/삭제로 새로 생긴 카드의 취득일 칸도 네이티브 달력 대신 타이핑 입력으로
      // 바꿔준다(위 renderChBody_의 enhanceDateInputs 참고 — 이미 처리된 칸은 건너뛴다).
      if (cardsHost && typeof enhanceDateInputs === 'function') enhanceDateInputs(cardsHost);
      if (onGroupsChanged) onGroupsChanged();
    }

    container.addEventListener('input', function(e){
      var field = e.target.closest('.chAssetField');
      if (field){
        var card = field.closest('.chAssetCard');
        var idx = Number(card.dataset.idx);
        var key = field.dataset.field;
        // [2026.09 버그수정] 취득가액도 양도가액처럼 콤마 표시(chOnMoneyInput_)로 바꾸면서,
        // 화면에 보이는 값(콤마 포함 문자열)이 아니라 실제 숫자만 저장하도록 구분해야 한다
        // (콤마 섞인 문자열이 그대로 저장되면 세액계산에서 숫자로 안 읽혀 계산이 깨진다).
        list[idx][key] = field.dataset.money ? chUnformatMoney_(field.value) : field.value;
        // 양도계약 구분을 고치면 그룹이 바뀔 수 있으니 금액란도 다시 그린다.
        if (key === '양도계약구분' && onGroupsChanged) onGroupsChanged();
        return;
      }
      var groupAmountInput = e.target.closest('.chTransferGroupAmountInput');
      if (groupAmountInput){
        var members = groupAmountInput.closest('.chTransferGroupRow').dataset.members.split(',').map(Number);
        var amount = chUnformatMoney_(groupAmountInput.value);
        members.forEach(function(mi){ list[mi].양도가액 = amount; });
      }
    });
    container.addEventListener('change', function(e){
      // select 요소는 브라우저에 따라 input 대신(또는 같이) change만 쏘는 경우가 있어 여기서도
      // 값 동기화를 한 번 더 해둔다(idempotent라 두 번 실행돼도 문제 없음).
      var field = e.target.closest('.chAssetField');
      if (field){
        var fCard = field.closest('.chAssetCard');
        list[Number(fCard.dataset.idx)][field.dataset.field] = field.dataset.money ? chUnformatMoney_(field.value) : field.value;
      }
      if (e.target.classList.contains('chAssetKindSel')){
        var card = e.target.closest('.chAssetCard');
        var wrap = card.querySelector('.chAssetDongHoWrap');
        if (wrap) wrap.style.display = e.target.value === 'building' ? 'contents' : 'none';
      }
      // [2026.09] "전체 묶기" 체크박스 — 양도(chBuildTransferAssetBlockHtml_)에만 존재하고
      // 증여·상속 화면엔 이 id 자체가 없으니 여기 있어도 무해하다. 켜고 끌 때마다 카드를
      // 다시 그려서 물건별 계약구분 칸을 숨기거나 다시 보여준다.
      if (e.target.id === 'chAcqBundleChk'){ overview.취득계약일괄 = e.target.checked; rerender(); }
      if (e.target.id === 'chTransferBundleChk'){
        // [2026.09 버그수정] 실사용 감사 지적 — 물건마다 이미 다른 양도가액을 입력해둔
        // 상태에서 "전체 묶기"를 켜면, 묶음 금액란엔 첫 번째 물건 값만 표시돼 나머지 물건의
        // 값이 실제로는 다른데도 화면상 "전체가 같은 금액"처럼 보인다. 미리 알려준다.
        if (e.target.checked) {
          var amounts = list.map(function(a){ return chUnformatMoney_(a.양도가액); }).filter(function(v){ return v; });
          var distinct = amounts.filter(function(v, i){ return amounts.indexOf(v) === i; });
          if (distinct.length > 1){
            nxConfirm_('물건마다 이미 다른 양도가액이 입력돼 있습니다.\n"전체 묶기"를 켜면 아래 금액란에 첫 번째 물건 값만 보이고, 저장 시 그 값이 전체 계약금액으로 모든 물건에 적용됩니다.\n계속할까요?').then(function(ok){
              if (!ok){ e.target.checked = false; return; }
              overview.양도계약일괄 = e.target.checked; rerender();
            });
            return;
          }
        }
        overview.양도계약일괄 = e.target.checked; rerender();
      }
    });
    container.addEventListener('click', function(e){
      var addrBtn = e.target.closest('.chAssetAddrSearchBtn');
      if (addrBtn){
        var idx = Number(addrBtn.dataset.idx);
        if (typeof openAddressSearchModal_ !== 'function'){ showToast('주소 검색 기능을 불러오지 못했습니다.', 'error'); return; }
        openAddressSearchModal_(function(picked){
          list[idx].assetLocation = picked.roadAddr || picked.jibunAddr || '';
          list[idx].assetDongList = picked.dongList || [];
          list[idx].assetDong = '';
          rerender();
        });
        return;
      }
      var delBtn = e.target.closest('.chAssetDelBtn');
      if (delBtn){
        var delIdx = Number(delBtn.dataset.idx);
        nxConfirm_('이 물건을 목록에서 삭제할까요?').then(function(ok){
          if (!ok) return;
          list.splice(delIdx, 1);
          rerender();
        });
        return;
      }
      if (e.target.id === 'chAssetAddBtn'){
        list.push({});
        rerender();
      }
    });
  }

  // [2026.09 재설계] 증여·상속도 양도와 같은 이유로 물건 목록을 사건개요서 단계에서 여러
  // 건 바로 등록하게 한다. 다만 증여세·상속세는 실제로 "전체 과세가액 - 공제"로 세액을
  // 한 번에 계산하지(물건별로 세액을 따로 계산하지 않음) 자산종류(assetType, 양도소득세
  // 전용 개념)도 필요 없으므로, 물건별로는 "무엇이 어디에 있는지"만 관리하고 금액
  // (증여재산가액/상속세과세가액)은 지금처럼 사건 전체 합계 1개로 유지한다 — taxcalc.html은
  // 이번엔 손대지 않는다.
  function chGetLocationAssetList_(overview){
    if (Array.isArray(overview.물건목록) && overview.물건목록.length) return overview.물건목록;
    if (overview.assetKind || overview.assetLocation) {
      return [{
        assetKind: overview.assetKind || '', assetLocation: overview.assetLocation || '',
        assetDong: overview.assetDong || '', assetHo: overview.assetHo || '', assetDongList: overview.assetDongList || []
      }];
    }
    return [{}];
  }

  function chBuildLocationAssetCardHtml_(asset, idx, showDelete){
    var showDongHo = asset.assetKind === 'building' || (Array.isArray(asset.assetDongList) && asset.assetDongList.length > 0);
    var dongOptions = Array.isArray(asset.assetDongList) ? asset.assetDongList : [];
    return '<div class="chAssetCard" data-idx="' + idx + '" style="grid-column:1/-1; border:1px solid var(--line); border-radius:8px; padding:10px; display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:8px 12px; position:relative;">' +
      (showDelete ? '<button type="button" class="chAssetDelBtn ghost-btn" data-idx="' + idx + '" style="position:absolute; top:6px; right:6px; padding:1px 8px; font-size:11px;" title="이 물건 삭제">✕</button>' : '') +
      '<div><label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">유형</label>' +
      '<select class="chAssetField chAssetKindSel" data-field="assetKind" style="width:100%; box-sizing:border-box;"><option value="">선택</option>' +
      CH_ASSET_KIND_OPTIONS_.map(function(o){ return '<option value="' + o.value + '"' + (o.value === asset.assetKind ? ' selected' : '') + '>' + escapeHtml(o.label) + '</option>'; }).join('') +
      '</select></div>' +
      '<div style="grid-column:span 2;"><label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">소재지</label>' +
      '<div style="display:flex; gap:6px;">' +
      '<input type="text" class="chAssetField" data-field="assetLocation" style="flex:1; box-sizing:border-box;" value="' + escapeHtml(asset.assetLocation || '') + '" placeholder="예: OO시 OO구 OO동 123-4">' +
      '<button type="button" class="chAssetAddrSearchBtn ghost-btn" data-idx="' + idx + '" style="flex-shrink:0;" title="주소 검색">🔍</button>' +
      '</div></div>' +
      '<div class="chAssetDongHoWrap" style="display:' + (showDongHo ? 'contents' : 'none') + ';">' +
      '<div><label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">동</label>' +
      '<select class="chAssetField" data-field="assetDong" style="width:100%; box-sizing:border-box;"><option value="">직접입력/해당없음</option>' +
      dongOptions.map(function(d){ return '<option value="' + escapeHtml(d) + '"' + (asset.assetDong === d ? ' selected' : '') + '>' + escapeHtml(d) + '</option>'; }).join('') +
      '</select></div>' +
      '<div><label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">호</label>' +
      '<input type="text" class="chAssetField" data-field="assetHo" size="6" style="box-sizing:border-box;" value="' + escapeHtml(asset.assetHo || '') + '"></div></div>' +
      '</div>';
  }

  function chBuildLocationFieldsHtml_(overview){
    var list = overview._chAssetListWorking || (overview._chAssetListWorking = chGetLocationAssetList_(overview));
    var cardsHtml = list.map(function(asset, idx){ return chBuildLocationAssetCardHtml_(asset, idx, idx > 0); }).join('');
    return '<div id="chAssetCardsHost" style="display:contents;">' + cardsHtml + '</div>' +
      '<div style="grid-column:1/-1;"><button type="button" id="chAssetAddBtn" class="ghost-btn" style="font-size:12px;">+ 물건 추가</button>' +
      (list.length > 1 ? ' <span style="color:var(--sub); font-size:12px;">물건 ' + list.length + '건 — 증여재산가액/상속세과세가액은 아래 사건 전체 합계 1개로 입력합니다.</span>' : '') +
      '</div>';
  }

  function chBuildGiftBlockHtml_(overview, baseDate){
    return chBuildLocationFieldsHtml_(overview) +
      '<div>' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">증여일</label>' +
      '<input type="date" id="chOvTransferDate" style="width:95px; box-sizing:border-box;" value="' + escapeHtml(baseDate || '') + '">' +
      '</div>';
  }

  function chBuildInheritanceBlockHtml_(overview, baseDate){
    return chBuildLocationFieldsHtml_(overview) +
      '<div>' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">상속개시일</label>' +
      '<input type="date" id="chOvTransferDate" style="width:95px; box-sizing:border-box;" value="' + escapeHtml(baseDate || '') + '">' +
      '</div>';
  }

  // 세목별 템플릿이 있으면(현재 양도소득세만) 사건개요 구조화 양식을, 없으면 예전과 동일한
  // 자유텍스트 "처리대상" 칸을 그려준다 — chSaveTarget 클릭 핸들러가 같은 조건으로 어느 쪽
  // 값을 모아 저장할지 판단한다(CH_CASE_OVERVIEW_FIELDS_[c.세목] 존재 여부).
  function chBuildOverviewCardHtml_(c){
    var fields = CH_CASE_OVERVIEW_FIELDS_[c.세목];
    if (!fields){
      return '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:8px;">📋 사건처리개시 — 처리대상 · 처리방향</div>' +
        '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">처리대상 <span style="font-weight:400;">(무엇을 처리하는지)</span></label>' +
        '<input type="text" id="chEditTarget" placeholder="예: OO아파트 매각건의 양도소득세 신고" value="' + escapeHtml(c.처리대상 || '') + '" style="width:100%; max-width:600px; box-sizing:border-box;">';
    }
    var overview = c._chOverviewWorking = Object.assign({}, c.사건개요 || {});
    // [2026.09 버그수정] "물건이 먼저 나오는 게 아니다" — 지금까지는 항상 물건목록(자산 카드)이
    // 맨 위에 오고 그 아래 성명 등 신원 필드가 나왔다. 실제 업무 흐름(누가 → 무엇을)에 맞게
    // "누구의 사건인지"부터 알아야 하는 핵심 신원 필드(beforeAsset: true로 표시)는 물건목록보다
    // 먼저 보여준다.
    function chRenderFieldRow_(field){
      return '<div>' +
        '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">' + escapeHtml(field.label) + '</label>' +
        chRenderOverviewFieldInput_(field, overview[field.key], c.세목) +
        '</div>';
    }
    var beforeRows = fields.filter(function(f){ return f.beforeAsset; }).map(chRenderFieldRow_).join('');
    var afterRows = fields.filter(function(f){ return !f.beforeAsset; }).map(chRenderFieldRow_).join('');
    var semokLabel = (typeof WORK_SEMOK_LABELS !== 'undefined' && WORK_SEMOK_LABELS[c.세목]) || c.세목 || '';
    var assetBlock = c.세목 === 'transfer' ? chBuildTransferAssetBlockHtml_(overview, c.기준일) :
      c.세목 === 'gift' ? chBuildGiftBlockHtml_(overview, c.기준일) :
      c.세목 === 'inheritance' ? chBuildInheritanceBlockHtml_(overview, c.기준일) : '';
    // [2026.09 버그수정] 실사용 지적 — "+ 물건 추가" 버튼 바로 아래에 사건분류·특이사항
    // 입력란이 구분선 없이 바로 붙어 있어서, 마치 그 버튼(물건 추가)에 딸린 입력란인 것처럼
    // 보였다. 실제로는 물건 목록과 전혀 무관한, 사건 전체에 대한 별도 항목이라 구분선을 넣어
    // 시각적으로 갈라놓는다.
    var afterDivider = (assetBlock && afterRows)
      ? '<div style="grid-column:1/-1; border-top:1px solid var(--line); margin:4px 0;"></div>' : '';
    return '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:8px;">📋 사건개요서 — ' + escapeHtml(semokLabel) + '</div>' +
      '<div id="chOverviewFieldsGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:8px 12px; max-width:760px;">' + beforeRows + assetBlock + afterDivider + afterRows + '</div>';
  }

  function initCaseHandling(){
    loadChCases_();
  }

  function loadChCases_(preselectId){
    // [2026.10.23 특단 반응 잣대 — 세무사님 "요즘 사용자들이 클릭하고 반응기다려주는 시간이 몇초인 줄 아는가?"] 이미 받아 둔 사건 목록에 그 사건이 있으면 1초 안에 먼저 그리고,
    //  목록은 뒤에서 다시 받아 그 사건 내용이 바뀌었을 때만 다시 그린다(예전엔 사건 목록(2~5초)을 받은 뒤에야 처리개요가 보였다)
    var wantId0 = preselectId || chSelectedId;
    var cachedCase = wantId0 ? chCases.filter(function(c){ return c.id === wantId0; })[0] : null;
    var cachedJson = cachedCase ? JSON.stringify(cachedCase) : null;
    if (cachedCase){ chSelectedId = wantId0; renderChCaseSelect_(); chCaseSelectEl.value = wantId0; renderChBody_(); }
    else chCaseSelectEl.innerHTML = '<option value="">불러오는 중…</option>';
    callGas('work_get_cases', {}).then(function(res){
      chCases = res.cases || [];
      if (cachedCase){
        if (res.evidenceClassificationOptions) chCaseClassificationOptions_ = res.evidenceClassificationOptions;
        renderChCaseSelect_();
        var nowCase = chCases.filter(function(c){ return c.id === wantId0; })[0];
        if (nowCase && JSON.stringify(nowCase) !== cachedJson && chSelectedId === wantId0){ chCaseSelectEl.value = wantId0; renderChBody_(); } // 바뀐 때만(적던 값은 chTyped_가 지킴)
        return;
      }
      // [2026.09] 사건분류 목록의 진짜 출처는 이제 서버(Code.js의 WORK_EVIDENCE_TEMPLATES_)
      // 하나뿐이다 — 여기서는 받은 목록을 그대로 저장해두고 렌더링만 한다(chCaseClassificationOptions_
      // 참고, chRenderOverviewFieldInput_이 사건분류 필드를 그릴 때 이걸 쓴다).
      if (res.evidenceClassificationOptions) chCaseClassificationOptions_ = res.evidenceClassificationOptions;
      renderChCaseSelect_();
      var wantId = preselectId || chSelectedId;
      if (wantId && chCases.some(function(c){ return c.id === wantId; })){
        chCaseSelectEl.value = wantId;
        chSelectedId = wantId;
        renderChBody_();
      } else if (wantId) {

        }
        // [2026.09] 작업관리의 "납세자"와 사건개요서의 납세의무자 이름 필드(TAXPAYER_NAME_FIELD_BY_SEMOK_)
        // 가 반드시 같은 값이어야 한다는 요청 — 여기서 그 필드를 채우면 작업관리의 납세자도
        // 같이 맞춘다(반대 방향은 workmanage.html의 saveCaseNow_가 담당). 비워두면(아직 안
        // 채웠으면) 기존 납세자 값을 건드리지 않는다.
        var taxpayerField = TAXPAYER_NAME_FIELD_BY_SEMOK_[c.세목];
        if (taxpayerField && overview[taxpayerField]) {
          payload.납세자 = overview[taxpayerField];
        }
        payload.사건개요 = overview;
        // [2026.10.22 작업 기록부] 세무사님이 처리개요 화면에서 직접 고친 칸 — 사건 기록부에 한 줄(넥스가 이어 받을 때 봄)
        var chChanged_ = Object.keys(overview).filter(function(k){ var o = (c.사건개요 || {})[k]; return JSON.stringify(o == null ? '' : o) !== JSON.stringify(overview[k] == null ? '' : overview[k]); });
        if (chChanged_.length) payload._log = { by: '세무사님', what: '처리개요 고침', detail: chChanged_.slice(0, 8).map(function(k){ var v = overview[k]; return k + '=' + String(typeof v === 'object' ? JSON.stringify(v) : v).slice(0, 30); }).join(', ') + (chChanged_.length > 8 ? ' 외 ' + (chChanged_.length - 8) + '칸' : '') };
      } else {
        payload.처리대상 = document.getElementById('chEditTarget').value.trim();
      }
      callGas('work_update_case', payload).then(function(res){
        // [2026.10.23 ㅅ16차 — 점검표 195] 충돌(그 사이 GAS 처리·세액계산 저장이 사건을 고침)이면 최신으로 다시 불러오되 적으신 값은 chTyped_로 되살려 [저장]만 다시 누르시면 되게 — 예전엔 입력이 통째로 날아가 0으로 보였다(가상증여8 세 번)
        if (res.conflict){ showToast('그 사이 사건이 다른 곳(GAS 처리·세액계산)에서 바뀌어 최신 내용으로 다시 불러왔습니다 — 적으신 값은 그대로 두었으니 [저장]을 다시 눌러 주세요.', 'warning'); loadChCases_(); return; }
        if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return; }
        chTyped_ = {}; // 저장됐으니 적던 값 보관을 비운다
        showToast('저장했습니다.', 'success');
        if (res.warning) showToast(res.warning, 'warning');
        // [2026.10.09 버그수정] 저장 응답(수 초)이 오는 사이 다른 칸(작업일지·특이사항 등)에 이미 타이핑을 시작했으면,
        // 예전처럼 화면 전체를 다시 그리면 그 입력이 통째로 지워졌다(실사용 점검에서 확인). 그때는 사건 데이터만
        // 조용히 최신으로 맞추고(다음 저장이 충돌 안 나게 수정일 포함) 화면은 그대로 둔다.
        var chActive_ = document.activeElement;
        var chTyping_ = chActive_ && /^(INPUT|TEXTAREA|SELECT)$/.test(chActive_.tagName) && document.getElementById('view-casehandling').contains(chActive_) && chActive_.id !== 'chCaseSelect';
        if (chTyping_ && res.case){ Object.assign(c, res.case); renderChCaseSelect_(); }
        else loadChCases_();
        if (typeof loadWorkCases === 'function') loadWorkCases();
      }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
    });

    chRenderLog_(c);
    chRenderPayments_(c);
    document.getElementById('chLawOpenBtn').addEventListener('click', function(){
      if (typeof goToLawSearch_ === 'function') goToLawSearch_(c.id);
    });
    chBindGasCard_(c); // [2026.10.22 1단계] ⚡ GAS 사건처리 칸
    document.getElementById('chTaxCalcOpenBtn').addEventListener('click', function(){
      if (typeof goToTaxCalc_ === 'function') goToTaxCalc_(c.id);
    });
    // [2026.09] 예전엔 카드 안 "📁 보고서 폴더 열기"가 구글드라이브를 새 탭으로 열었는데,
    // [2026.09 버그수정] "문서작성은 일반문서가 아니라 보고서 작성인데, 카드 제목을 누르면
    // 증빙확보(파일탐색기) 화면이 그대로 열린다"는 지적 — 예전엔 chEvOpenDocsBtn과 같은 패턴으로
    // "보고서" 하위폴더를 증빙확보에서 탐색만 하게 했는데, 그러면 상위·새폴더·업로드·PDF관리·스캔
    // 같은 증빙확보 전용 버튼이 그대로 보여서 "보고서를 작성"할 방법이 없었다. 실제로 새 보고서를
    // 쓰거나 기존 보고서를 여는 곳(chNewReportBtn/chEditReportBtn)과 똑같이 reportwriter.html로
    // 보낸다.
    document.getElementById('chDocsWriterOpenBtn').addEventListener('click', function(){
      if (typeof goToReportWriter_ === 'function') goToReportWriter_(c.id);
    });
    chRenderTaxCalcList_(c);
    chRenderEvidenceSummary_(c);
    chRenderMemoSummary_(c);
    chRenderProgress_(c);
    chLoadMyReports_(c);
    chInitMyPortal_(c);
  }

  // [2026.09] 세액계산 카드 — 예전엔 "저장된 계산 N건"만 보여줬는데, 사건처리가 이 사건의
  // 대시보드 역할을 하려면 건수보다 실제 계산 결과값이 보여야 한다는 피드백에 따라 건별
  // 요약(세목·구분·계산일 + 결과 미리보기)을 나열한다. taxcalc.html의 renderTcSavedList_와
  // 같은 표시 방식이되, 여긴 여러 카드 중 하나라 미리보기 길이를 더 짧게 자른다.
  function chRenderTaxCalcList_(c){
    var el = document.getElementById('chTaxCalcList');
    if (!el) return;
    var list = c.세액계산결과 || [];
    if (!list.length){ el.innerHTML = '<div class="log-empty">아직 저장된 계산이 없습니다.</div>'; return; }
    // [2026.09 버그수정] 재계산해도 예전 결과가 그대로 나란히 남아 헷갈렸다 — taxcalc.html과
    // 같은 기준(같은 세목 중 가장 최근 것)으로 "최신" 표시를 단다.
    // [2026.09.23 버그수정] 세무사님 지적 — 저장된 계산 목록에 "언제 계산했다"는 날짜만 보이고
    // 세액이 안 보여 아무 정보가 안 된다고 지적받음. entry.최종세액(저장 시 이미 숫자로 뽑아둠,
    // taxcalc.html의 tcSaveCurrentResult_ 참고)을 항상 보이는 줄에 표시하고, 클릭하면 저장 당시
    // 결과 전체 텍스트를 펼쳐볼 수 있게 한다(요약을 120자로 잘라 보여주기만 하고 확인할 방법이
    // 없었던 것 — taxcalc.html의 저장 목록과 같은 펼치기 패턴을 재사용).
    var seenSemok_ = {};
    el.innerHTML = list.slice().reverse().map(function(entry){
      var isLatest = !seenSemok_[entry.세목];
      seenSemok_[entry.세목] = true;
      var amountHtml = Number.isFinite(entry.최종세액) ? ' <b style="color:#2a7a4f;">' + Number(entry.최종세액).toLocaleString('ko-KR') + '원</b>' : '';
      // [2026.10.19 조견표 0단계] 계산 결과에 "⚠ 이 양도일(…)의 … 연혁이 아직 계산기에 없습니다" 경고가 있으면 줄에도 바로 보이게
      // [2026.10.19] 상속개시일·증여일 연혁 경고, 서식 칸 산식 검산 경고도 같은 줄에
      var warnM = /⚠ 이 (?:양도일|상속개시일|증여일)\([^)]*\)의 [^\n]*?확인 필요/.exec(String(entry.요약 || ''));
      if (warnM) amountHtml += ' <span style="color:#b26a00; font-weight:600; font-size:12px;">' + escapeHtml(warnM[0]) + '</span>';
      var formM = /⚠ 서식 칸 검산[^\n]*?확인 필요/.exec(String(entry.요약 || ''));
      var judgeM = /⚠ 세무사님 판단 대기 — [^\n]*/.exec(String(entry.요약 || '')); // [2026.10.19] 해석 A/B — 세액계산 결과에서 고르기
      if (judgeM) amountHtml += ' <span style="color:#4a148c; font-weight:600; font-size:12px;">' + escapeHtml(judgeM[0].slice(0, 120)) + (judgeM[0].length > 120 ? '…' : '') + ' (세액계산에서 해석 A/B 고르기)</span>';
      if (formM) amountHtml += ' <span style="color:#b00020; font-weight:600; font-size:12px;">' + escapeHtml(formM[0]) + '</span>';
      return '<div class="log-entry" style="flex-direction:column; align-items:stretch;">' +
        '<div class="ch-taxcalc-toggle" style="display:flex; align-items:center; gap:8px; cursor:pointer;">' +
        '<span class="ch-taxcalc-toggle-arrow" style="color:var(--sub); font-size:11px; flex-shrink:0; width:14px;">▾</span>' +
        '<div class="log-date" style="flex-shrink:0;">' + escapeHtml(fmtDateShort_(entry.계산일) || entry.계산일 || '') + '</div>' +
        '<div class="log-text" style="flex:1;"><b>' + escapeHtml(entry.세목 || '') + ' · ' + escapeHtml(entry.구분 || '') + '</b>' + amountHtml +
        (isLatest ? ' <span style="color:#2a7a4f; font-weight:700; font-size:11px;">최신</span>' : ' <span style="color:var(--sub); font-size:11px;">이전 계산</span>') + '</div>' +
        '</div>' +
        '<div class="ch-taxcalc-preview" style="display:none; color:var(--sub); font-size:12.5px; margin:6px 0 0 22px; white-space:pre-wrap;">' + escapeHtml(String(entry.요약 || '')) + '</div>' +
        '</div>';
    }).join('');
    el.querySelectorAll('.ch-taxcalc-toggle').forEach(function(toggle){
      var wrap2 = toggle.closest('.log-entry');
      var arrow = toggle.querySelector('.ch-taxcalc-toggle-arrow');
      var previewEl = wrap2.querySelector('.ch-taxcalc-preview');
      toggle.addEventListener('click', function(){
        var open = previewEl.style.display !== 'none';
        previewEl.style.display = open ? 'none' : 'block';
        arrow.textContent = open ? '▾' : '▴';
      });
    });
  }

  // [2026.09] 동시편집 낙관적 잠금 — c.수정일을 같이 보내 그 사이 다른 곳에서 먼저 저장됐으면
  // 덮어쓰지 않고 최신 내용으로 새로고침한다.
  // [2026.09 버그수정] 로그 하나 저장했다고(성공 케이스) loadChCases_()로 카드 전체를 다시
  // 그리면, 그 사이 화면에 입력하고 있던(아직 저장 안 한) 사건개요서 등 다른 폼 내용이
  // 통째로 날아갔다(실사용 감사에서 확인된 데이터유실 버그) — c는 chCases 배열 속 항목과
  // 같은 객체 참조이므로, 성공 시에는 그 자리에서 필드만 갱신하고 로그 목록 영역만 다시
  // 그린다. 충돌(다른 곳에서 먼저 저장됨)일 때만 전체 새로고침이 안전하므로 그 경로는 유지.
  function chSaveLog_(c, newLog, onSuccess){
    callGas('work_update_case', { id: c.id, 작업일지: newLog, 기대수정일: c.수정일 }).then(function(res){
      if (res.conflict){ showToast(res.message || '충돌이 발생했습니다. 새로고침합니다.', 'warning'); loadChCases_(); return; }
      if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return; }
      if (res.case) Object.assign(c, res.case); else c.작업일지 = newLog;
      chRenderLog_(c);
      if (typeof onSuccess === 'function') onSuccess();
      if (typeof loadWorkCases === 'function') loadWorkCases();
    }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
  }

  function chRenderLog_(c){
    var list = document.getElementById('chLogList');
    if (!list) return;
    // [2026.09 버그수정] 실사용 시뮬레이션 중 발견 — 이 함수(목록만 갱신)로 저장을 바꾼 뒤에도
    // 위쪽 "N건" 카운터는 여전히 카드 전체를 새로 그릴 때만 갱신되는 별도 요소라, 작업일지를
    // 추가·삭제해도 화면에는 예전 건수가 그대로 남아 보였다 — 여기서 같이 갱신한다.
    var countEl = document.getElementById('chLogCount');
    if (countEl) countEl.textContent = (c.작업일지 || []).length + '건';
    var entries = (c.작업일지 || []).slice().sort(function(a, b){ return (b.date || '').localeCompare(a.date || ''); });
    if (!entries.length){
      list.innerHTML = '<div class="log-empty">아직 작업일지가 없습니다.</div>';
    } else {
      list.innerHTML = '';
      entries.forEach(function(entry){
        var row = document.createElement('div');
        row.className = 'log-entry';
        row.innerHTML =
          '<div class="log-date">' + escapeHtml(fmtDateShort_(entry.date) || entry.date || '') + '</div>' +
          '<div class="log-text">' + escapeHtml(entry.text || '') +
          (entry.dueDate ? ' <span style="color:var(--sub); font-size:12px;">— 다음: ' + escapeHtml(fmtDateShort_(entry.dueDate)) + '</span>' : '') + '</div>' +
          '<span class="log-del" title="삭제">✕</span>';
        row.querySelector('.log-del').addEventListener('click', function(){
          var newLog = (c.작업일지 || []).filter(function(e){ return e.id !== entry.id; });
          chSaveLog_(c, newLog);
        });
        list.appendChild(row);
      });
    }

    var newLogFormWrap = document.getElementById('chNewLogFormWrap');
    var logToggleBtn = document.getElementById('chLogToggle');
    // [2026.09 버그수정] chSaveLog_가 이제 전체 카드를 다시 그리지 않고 이 함수만 반복 호출
    // 하므로, 매번 새로 addEventListener하면 저장할 때마다 클릭 핸들러가 누적된다 — 최초
    // 1회만 연결한다(핸들러 안에서는 그때그때 c.작업일지를 다시 읽으므로 재사용 가능).
    if (logToggleBtn && logToggleBtn.dataset.wired) return;
    if (logToggleBtn) logToggleBtn.dataset.wired = '1';
    logToggleBtn.addEventListener('click', function(){
      if (newLogFormWrap.style.display === 'none'){
        newLogFormWrap.style.display = 'flex';
        var todayStr = new Date().toISOString().slice(0, 10);
        newLogFormWrap.innerHTML =
          '<input type="date" id="chNewLogDate" value="' + todayStr + '" style="width:95px;">' +
          '<input type="text" id="chNewLogText" placeholder="진행 내용 · 다음 할일" style="flex:1; min-width:160px;">' +
          '<input type="date" id="chNewLogDue" title="다음 일정(선택) — 입력하면 캘린더에 등록됩니다" style="width:95px;">' +
          '<button type="button" id="chAddLog" class="save-btn">추가</button>' +
          '<button type="button" id="chAddLogCancel" class="ghost-btn">취소</button>';
        document.getElementById('chAddLogCancel').addEventListener('click', function(){ newLogFormWrap.style.display = 'none'; newLogFormWrap.innerHTML = ''; });
        document.getElementById('chAddLog').addEventListener('click', function(){
          var text = document.getElementById('chNewLogText').value.trim();
          if (!text){ showToast('내용을 입력해주세요.', 'warning'); return; }
          var entry = {
            id: 'log_' + Date.now(),
            date: document.getElementById('chNewLogDate').value || todayStr,
            text: text,
            dueDate: document.getElementById('chNewLogDue').value || ''
          };
          var newLog = (c.작업일지 || []).concat([entry]);
          // [2026.09 버그수정] 예전엔 저장 성공 시 loadChCases_()의 전체 재구성이 이 입력폼을
          // 자동으로 닫아줬는데, 이제 로그 목록만 갱신하므로 성공 콜백에서 직접 닫아준다.
          chSaveLog_(c, newLog, function(){ newLogFormWrap.style.display = 'none'; newLogFormWrap.innerHTML = ''; });
        });
      } else {
        newLogFormWrap.style.display = 'none';
        newLogFormWrap.innerHTML = '';
      }
    });
  }

  // [2026.09.15 신규] 세무사님 지적 — "수금내역은 고객과 사건 모두에 연결되어야 한다." 이
  // 사건에 연결된 수금 내역(client_get_consult_logs를 사건ID로 필터)을 여기서 바로 보고
  // 추가할 수 있게 한다 — 수금관리(전체 고객 기준)·고객관리(그 고객의 전체 사건 기준)와
  // 같은 원천 데이터를 사건 기준으로만 필터링해서 보여준다(작업일지 카드와 같은 패턴).
  function chRenderPayments_(c){
    var list = document.getElementById('chPaymentList');
    if (!list) return;
    callGas('client_get_consult_logs', { 사건ID: c.id }).then(function(res){
      var payments = res.logs || [];
      var countEl = document.getElementById('chPaymentCount');
      if (countEl) countEl.textContent = payments.length ? (payments.length + '건 · 합계 ' + payments.reduce(function(s, p){ return s + (Number(p.금액) || 0); }, 0).toLocaleString('ko-KR') + '원') : '아직 수금 내역이 없습니다.';
      list.innerHTML = '';
      payments.forEach(function(pay){
        var row = document.createElement('div');
        row.className = 'log-entry';
        var amountText = pay.금액 ? Number(pay.금액).toLocaleString('ko-KR') + '원' : '';
        row.innerHTML =
          '<div class="log-date">' + escapeHtml(fmtDateShort_(pay.날짜)) + '</div>' +
          '<div class="log-text">' + escapeHtml(amountText) + (pay.수취증빙 ? ' · ' + escapeHtml(pay.수취증빙) : '') + '</div>' +
          '<span class="log-del" title="삭제">✕</span>';
        row.querySelector('.log-del').addEventListener('click', function(){
          nxConfirm_('이 수금 내역을 삭제할까요?').then(function(ok){
            if (!ok) return;
            callGas('client_delete_consult_log', { id: pay.id }).then(function(delRes){
              if (delRes.error || delRes.success === false){ showToast(delRes.error || delRes.message || '삭제 실패', 'error'); return; }
              chRenderPayments_(c);
            }).catch(function(){ showToast('삭제 중 오류가 발생했습니다.', 'error'); });
          });
        });
        list.appendChild(row);
      });
    }).catch(function(){ list.innerHTML = '<div class="log-empty">불러오지 못했습니다.</div>'; });

    var newPaymentFormWrap = document.getElementById('chNewPaymentFormWrap');
    var paymentToggleBtn = document.getElementById('chPaymentToggle');
    // chRenderLog_의 chLogToggle과 같은 이유(재호출 시 핸들러 중복 방지) — 최초 1회만 연결.

    var label = c.상태 === '완료' ? '완료일' : (manual ? '처리시한' : '법정일');
    var dday = '';
    // [2026.10.22 묶음 ㅁ2] 기준일(양도일·증여일·사망일)이 아직 없으면 서버가 "오늘+7일"을 임시로 넣어 둔다(목록·마감 집계에서 빠지지 않게) — 그걸 진짜 기한처럼 "(D-7)"로 굵게 보이면 급한 사건으로 오해한다(가상양도7 표 10). 임시값임을 밝히고 D-n은 기준일이 정해진 뒤에만
    var provisional = !manual && c.상태 !== '완료' && c.법정일 && !c.기준일;
    if (provisional) dday = ' <span style="color:var(--sub);">(임시 — 양도일·증여일·사망일이 정해지면 다시 계산됩니다)</span>';
    if (c.법정일 && c.상태 !== '완료' && !provisional){
      var d = new Date(String(c.법정일).slice(0, 10) + 'T00:00:00'), t = new Date(); t.setHours(0, 0, 0, 0);
      if (!isNaN(d.getTime())){
        var n = Math.round((d - t) / 86400000);
        dday = n > 0 ? ' <b>(D-' + n + ')</b>' : (n === 0 ? ' <b style="color:#a83232;">(오늘 마감)</b>' : ' <b style="color:#a83232;">(' + (-n) + '일 지남)</b>');
      }
    }
    var rows = [];
    (function walk(nodes, depth){
      (nodes || []).forEach(function(nd){ rows.push({ n: nd, depth: depth }); walk(nd.children, depth + 1); });
    })(c.하위업무, 0);
    var done = rows.filter(function(r){ return r.n.status === '완료'; }).length;
    box.innerHTML =
      '<div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between;">' +
        '<div style="font-weight:700;">📅 기한·하위업무</div>' +
        '<button type="button" class="ghost-btn" data-ch-prog="work" style="padding:2px 8px; font-size:12px;">📌 작업관리에서 고치기</button>' +
      '</div>' +
      '<div style="font-size:13px; margin-top:6px;">' + escapeHtml(label) + ': ' + (c.법정일 ? escapeHtml(String(c.법정일).slice(0, 10)) + dday : '<span style="color:var(--sub);">아직 없음</span>') +
        ' · 상태: ' + escapeHtml(c.상태 || '') + (rows.length ? ' · 하위업무 ' + done + '/' + rows.length + ' 완료' : '') + '</div>' +
      (rows.length
        ? '<div style="margin-top:6px;">' + rows.map(function(r){
            return '<label style="display:flex; gap:6px; align-items:center; font-size:13px; padding:2px 0 2px ' + (r.depth * 18) + 'px;">' +
              '<input type="checkbox" data-ch-sub="' + escapeHtml(r.n.id) + '"' + (r.n.status === '완료' ? ' checked' : '') + '>' +
              '<span' + (r.n.status === '완료' ? ' style="text-decoration:line-through; color:var(--sub);"' : '') + '>' + escapeHtml(r.n.title || '') + '</span>' +
              (r.n.dueDate ? '<span style="color:var(--sub); font-size:12px;">~' + escapeHtml(r.n.dueDate) + '</span>' : '') +
              (r.n.status && r.n.status !== '완료' && r.n.status !== '대기' ? '<span style="color:var(--sub); font-size:12px;">(' + escapeHtml(r.n.status) + ')</span>' : '') +
              '</label>';
          }).join('') + '</div>'
        : '<div style="font-size:12.5px; color:var(--sub); margin-top:4px;">하위업무가 없습니다(작업관리에서 추가).</div>');
    box.querySelector('[data-ch-prog="work"]').addEventListener('click', function(){ if (typeof goToWorkManage_ === 'function') goToWorkManage_(c.id); });
    box.querySelectorAll('input[data-ch-sub]').forEach(function(cb){
      cb.addEventListener('change', function(){
        cb.disabled = true;
        callGas('work_update_subtask', { id: c.id, nodeId: cb.getAttribute('data-ch-sub'), status: cb.checked ? '완료' : '대기' }).then(function(res){
          if (!res || res.success === false || !res.case){ showToast((res && (res.message || res.error)) || '하위업무를 저장하지 못했습니다.'); cb.checked = !cb.checked; cb.disabled = false; return; }
          // 이 화면의 다른 저장(작업일지 등)이 기대수정일 충돌로 막히지 않게 수정일도 같이 맞춘다
          c.하위업무 = res.case.하위업무; c.수정일 = res.case.수정일;
          if (res.warning) showToast(res.warning);
          chRenderProgress_(c);
        }).catch(function(){ showToast('하위업무 저장 중 오류가 났습니다.'); cb.checked = !cb.checked; cb.disabled = false; });
      });
    });
  }

  // [2026.10.18 탭연결 2번] 「_상담녹음보관함」(사건 없이 또는 폴더 없는 상담 사건으로 녹음한 것)에서 골라 이 사건 폴더로 옮긴다.
  // 미리 보기(목록·체크) → [옮기기]를 눌러야만 옮긴다. 이 사건 이름으로 녹음한 것은 미리 체크해 둔다. 지우는 것은 없다.
  function chOpenConsultInbox_(c){
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.style.display = 'flex';
    overlay.innerHTML = '<div class="modal-panel" style="width:min(560px, 94vw); max-height:84vh; display:flex; flex-direction:column;">' +
      '<div class="modal-head"><span>🎙 보관함 상담 녹음 → 이 사건</span><span class="modal-close" data-x="1">✕</span></div>' +
      '<div class="modal-body" style="overflow-y:auto;" id="chCiBody"><div class="spinner">보관함 읽는 중…</div></div></div>';
    document.body.appendChild(overlay);
    var close = function(){ overlay.remove(); };
    overlay.querySelector('[data-x]').onclick = close;
    overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });
    var body = overlay.querySelector('#chCiBody');
    callGas('consult_inbox_list', {}).then(function(res){
      if (!res || res.error){ body.innerHTML = '<div class="log-empty">' + escapeHtml((res && res.error) || '보관함을 읽지 못했습니다.') + '</div>'; return; }
      var items = res.items || [];
      if (!items.length){ body.innerHTML = '<div class="log-empty">보관함이 비어 있습니다.</div>'; return; }
      body.innerHTML = '<div style="font-size:12.5px; color:var(--sub); margin-bottom:8px;">옮길 녹음을 고르세요. 상담내용(.md)은 이 사건 폴더 바로 안(📝 메모에서 보임), 원본 음성은 사건 폴더/상담녹음/으로 옮깁니다.</div>' +
        items.map(function(it, i){
          var mine = it.caseName && it.caseName === c.사건명;
          return '<label style="display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-bottom:1px solid var(--line);">' +
            '<input type="checkbox" data-i="' + i + '"' + (mine ? ' checked' : '') + '>' +
            '<span><b>' + escapeHtml(it.when) + '</b> · ' + escapeHtml(it.caseName || '사건 미지정') + (mine ? ' <span style="color:#16a34a;">(이 사건)</span>' : '') +
            '<br><span style="font-size:12px; color:var(--sub);">' + (it.mdId ? '상담내용' : '상담내용 없음(정리 전이거나 실패)') + (it.audio.length ? ' · 원본 음성 ' + it.audio.length + '개' : '') +
            (it.mdUrl ? ' · <a href="' + escapeHtml(it.mdUrl) + '" target="_blank" rel="noopener">열어 보기</a>' : '') + '</span></span></label>';
        }).join('') +
        (res.total > items.length ? '<div style="font-size:12px; color:var(--sub); margin-top:6px;">최근 ' + items.length + '건만 보입니다(전체 ' + res.total + '건).</div>' : '') +
        '<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;"><button type="button" class="save-btn" id="chCiGo">고른 녹음 이 사건으로 옮기기</button><button type="button" class="ghost-btn" data-x="1">닫기</button></div>';
      body.querySelector('.ghost-btn[data-x]').onclick = close;
      body.querySelector('#chCiGo').onclick = function(){
        var btn = this;
        var stamps = Array.prototype.filter.call(body.querySelectorAll('input[type=checkbox]'), function(x){ return x.checked; })
          .map(function(x){ return items[Number(x.getAttribute('data-i'))].stamp; });
        if (!stamps.length){ showToast('옮길 녹음을 고르세요.'); return; }
        btn.disabled = true;
        // 폴더 없는 상담 사건이면 업무유형을 먼저 물어 폴더를 만든다(탭연결 1번과 같은 도우미)
        nxEnsureCaseFolder_(c, '상담 녹음을').then(function(cc){
          if (!cc || !cc.폴더ID){ btn.disabled = false; return; }
          return callGas('consult_inbox_move', { caseId: c.id, stamps: stamps }).then(function(r){
            if (!r || r.error){ showToast((r && r.error) || '옮기지 못했습니다.'); btn.disabled = false; return; }
            showToast('보관함에서 ' + r.moved + '개 파일을 이 사건으로 옮겼습니다.');
            close();
            if (typeof goToCaseHandling_ === 'function') goToCaseHandling_(c.id);
          });
        }).catch(function(){ showToast('옮기는 중 오류가 났습니다.'); btn.disabled = false; });
      };
    }).catch(function(){ body.innerHTML = '<div class="log-empty">보관함을 읽지 못했습니다.</div>'; });
  }

  // ============================================================
  // 4단계 — my.netax.kr 고객창구 연동. "요청자료"는 곧 my.netax.kr의 체크리스트 항목과 같은
  // 개념이라(예약의 직권등록과 같은 구조 — 직원이 대신 자료를 올릴 수도, 고객이 my페이지로
  // 들어와 스스로 올릴 수도 있음), 사건에 연결된 my_report_id가 있으면 요청자료를 추가할 때
  // 자동으로 그쪽 체크리스트에도 반영한다(반대 방향은 my포털 카드 자체에서 추가할 때도 동일
  // 함수를 태워 한쪽만 구현하지 않는다).
  // ============================================================
  function chAddRequestedItem_(c, label, note){
    // [2026.09 버그수정] 호출부(my포털 카드의 "추가" 버튼)가 저장 완료 후 체크리스트 화면을
    // 다시 그릴 수 있도록 프라미스를 반환한다.
    var saved = chAddEvidence_(c, { source: 'requested', label: label, note: note || '', status: '미확보', 요청일: new Date().toISOString().slice(0, 10) });
    if (c.my_report_id){
      saved = saved.then(function(res){
        return callGas('admin_add_checklist_item', { report_id: c.my_report_id, item: label }).catch(function(){}).then(function(){ return res; });
      });
    }
    return saved;
  }

  function chInitMyPortal_(c){
    var box = document.getElementById('chMyPortalBody');
    if (!box) return;

    if (!c.my_report_id){
      // [2026.09 버그수정] "다운로드 허용/차단" 선택지가 있었지만, 실제로 서버 어디에도 그
      // 값을 확인해서 다운로드를 막는 코드가 없었다(고객창구엔애초에 별도 "다운로드" 버튼 자체가
      // 없고, 보고서는 그냥 웹페이지로 보여줄 뿐이다) — 세무사에게 실제로 없는 접근제어 기능이
      // 있는 것처럼 잘못된 안도감을 줄 수 있어 선택지를 없앤다(항상 "허용"으로 연결).
      box.innerHTML =
        '<div style="font-size:12.5px; color:var(--sub); margin-bottom:8px;">아직 고객창구에 연결되지 않았습니다. 연결하면 위 "요청자료"가 고객 체크리스트로 자동 전달되고, 고객이 고객창구로 들어와 직접 자료를 올리고 진행상황·결과보고서를 확인할 수 있습니다.</div>' +
        '<button type="button" id="chMyConnectBtn" class="ch-card-head-btn">🔗 고객창구 연결하기 <span class="ch-card-head-arrow">›</span></button>';
      document.getElementById('chMyConnectBtn').addEventListener('click', function(){
        var connectBtn = this;
        nxConfirm_(c.고객명 + '님을 위한 고객창구을 새로 만들까요?').then(function(ok){
          if (!ok) return;
          // [2026.09 버그수정] 더블클릭 방지 — admin_create_case는 멱등성이 없어서(호출할 때마다
          // 무조건 새 접속코드를 발급) 막지 않으면 코드가 두 개 발급되고, 담당자가 먼저 뜬(이미
          // 무효가 된) 코드를 실수로 고객에게 전달할 위험이 있다.
          var btn = connectBtn;
          if (btn.disabled) return;
          btn.disabled = true;
          var requestedLabels = (c.증빙목록 || []).filter(function(e){ return e.source === 'requested'; }).map(function(e){ return e.label; });
          var permission = '허용';
          // [2026.09 버그수정] c.폴더ID가 비어있는 채로(옛날 사건, 또는 사건 생성 시 드라이브
          // 오류로 폴더 생성이 실패한 경우) 그대로 넘기면, my.netax.kr 쪽이 완전히 다른 위치에
          // 새 폴더를 만들어버려서 고객 업로드 파일을 증빙관리·작성관리에서 영영 못 찾게 됐다 —
          // 연결하기 전에 항상 올바른 위치의 폴더를 먼저 확보(없으면 새로 생성)하고 사건에 저장한다.
          (c.폴더ID ? Promise.resolve({ success: true, folderId: c.폴더ID }) : callGas('ensure_case_folder', { id: c.id })).then(function(folderRes){
            if (folderRes.success === false){ showToast(folderRes.message || '사건 폴더를 준비하지 못했습니다.', 'error'); btn.disabled = false; return; }
            c.폴더ID = folderRes.folderId;
            return callGas('admin_create_case', { name: c.고객명, case_name: c.사건명, checklist: requestedLabels, permission: permission, folder_id: folderRes.folderId }).then(function(res){
              if (res.success === false){ showToast(res.message || '연결 실패', 'error'); btn.disabled = false; return; }
              return callGas('work_update_case', { id: c.id, my_report_id: res.report_id }).then(function(updRes){
                showToast('고객창구을 연결했습니다 — 접속코드 ' + res.report_id, 'success');
                // [2026.09 버그수정] 연결 성공 후 loadChCases_()로 카드 전체를 다시 그리면 그 사이
                // 입력 중이던 다른 폼이 날아갔다 — c에 새 report_id만 반영하고 my포털 카드만 다시
                // 그린다(이제 "연결됨" 상태이므로 chInitMyPortal_이 알아서 체크리스트 화면으로 바뀐다).
                if (updRes && updRes.case) Object.assign(c, updRes.case); else c.my_report_id = res.report_id;
                chInitMyPortal_(c);
                if (typeof loadWorkCases === 'function') loadWorkCases();
              });
            });
          }).catch(function(err){ showToast('연결 중 오류: ' + (err && err.message ? err.message : err), 'error'); btn.disabled = false; });
        });
      });
      return;
    }

    box.innerHTML = '<div class="log-empty">불러오는 중…</div>';
    callGas('admin_get_case', { report_id: c.my_report_id }).then(function(res){
      if (res.success === false){
        box.innerHTML = '<div class="log-empty">' + escapeHtml(res.message || '불러오지 못했습니다.') + '</div>';
        return;
      }
      var mc = res.case;
      var url = 'https://netax.kr/my/?report_id=' + mc.report_id;
      var checklist = mc.checklist || [];
      var status = mc.submission_status || {};
      var rows = checklist.map(function(item){
        var done = status[item] && status[item].submitted;
        return '<div class="log-entry"><div class="log-date" style="color:' + (done ? 'var(--navy)' : 'var(--sub)') + ';">' + (done ? '제출완료' : '미제출') + '</div>' +
          '<div class="log-text">' + escapeHtml(item) + '</div></div>';
      }).join('');
      var extra = status._extra || [];
      box.innerHTML =
        '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:10px;">🔗 고객창구</div>' +
        '<div class="tb-row" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px;">' +
        '<code style="background:var(--panel); padding:3px 8px; border-radius:6px; font-weight:700; font-size:14px; letter-spacing:0.5px; color:var(--navy);">' + escapeHtml(mc.report_id) + '</code>' +
        '<button type="button" id="chMyCopyLinkBtn" class="ghost-btn" style="font-size:12px;"><span class="btn-ic">🔗</span><span class="btn-tx"> 링크복사</span></button>' +
        '<button type="button" id="chMySendSmsBtn" class="ghost-btn" style="font-size:12px;"><span class="btn-ic">📱</span><span class="btn-tx"> 문자로 전달</span></button>' +
        (mc.has_password ? '' : '<span style="font-size:11px; color:var(--danger); border:1px solid var(--danger); border-radius:10px; padding:1px 7px;">비밀번호 미설정</span>') +
        '</div>' +
        '<div style="font-size:12px; color:var(--sub); margin-bottom:6px;">체크리스트 제출현황</div>' +
        (rows || '<div class="log-empty">체크리스트가 없습니다.</div>') +
        (extra.length ? '<div style="font-size:12px; color:var(--sub); margin-top:8px;">기타 제출 ' + extra.length + '건: ' + escapeHtml(extra.map(function(f){ return f.fileName; }).join(', ')) + '</div>' : '') +
        '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:12px;">' +
        '<input type="text" id="chMyNewItem" placeholder="추가로 요청할 자료명" style="flex:1; min-width:140px;">' +
        '<button type="button" id="chMyAddItemBtn" class="save-btn">추가</button>' +
        '</div>';

      document.getElementById('chMyCopyLinkBtn').addEventListener('click', function(){
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function(){ showToast('링크를 복사했습니다.', 'success'); });
        else showToast(url, 'success');
      });
      document.getElementById('chMySendSmsBtn').addEventListener('click', function(){
        nxConfirm_(c.고객명 + '님께 고객창구 주소와 접근번호를 문자로 보낼까요?').then(function(ok){
          if (!ok) return;
          var btn = document.getElementById('chMySendSmsBtn');
          btn.disabled = true; btn.textContent = '전송 중…';
          callGas('send_my_portal_sms', { caseId: c.id }).then(function(res){
            btn.disabled = false; btn.textContent = '📱 문자로 전달';
            if (res.success === false){ showToast(res.message || '전송 실패', 'error'); return; }
            showToast('문자를 전송했습니다.', 'success');
          }).catch(function(err){ btn.disabled = false; btn.textContent = '📱 문자로 전달'; showToast('전송 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
        });
      });
      document.getElementById('chMyAddItemBtn').addEventListener('click', function(){
        var label = document.getElementById('chMyNewItem').value.trim();
        if (!label){ showToast('자료명을 입력해주세요.', 'warning'); return; }
        // [2026.09 버그수정] chSaveEvidence_가 더 이상 카드 전체를 다시 그리지 않으므로, 방금
        // 추가한 항목이 이 체크리스트 화면에 바로 반영되도록 저장 완료 후 이 카드만 다시 그린다.
        chAddRequestedItem_(c, label, '').then(function(){ chInitMyPortal_(c); });
      });
    }).catch(function(err){ box.innerHTML = '<div class="log-empty">불러오는 중 오류: ' + escapeHtml(err && err.message ? err.message : '') + '</div>'; });
  }

  // [2026.09] "내부보고서" 폴더(작성 원본, .md — 검토서 포함, 고객에게 절대 안 보임)와
  // "보고서" 폴더(발행된 완성본, .html — my.netax.kr 보고서함이 여기만 봄)를 각각 조회해서
  // 같은 이름끼리 묶어 한 줄로 보여준다. "편집"은 항상 내부보고서의 .md를 연다(예전 단일
  // .html 문서처럼 .md가 없는 경우만 그 .html을 그대로 연다). listFolder는 이미 있는 범용
  // Drive 탐색 액션을 그대로 씀.
  function chLoadMyReports_(c){
    var box = document.getElementById('chMyReports');
    if (!box) return;
    var folderName = String(c.사건명 || '').trim();
    // [2026.09] "내부보고서"/"보고서" 폴더ID를 이름 기반 경로탐색 대신 사건ID로 직접 얻는다
    // (work_getCaseSubfolders — find-or-create라서 이 세션 이전에 만들어진 옛날 사건도
    // 이 호출 한 번으로 자동으로 폴더가 생기고, 고객명이 나중에 바뀌어도 안 깨진다).
    callGas('get_case_subfolders', { caseId: c.id }).then(function(sub){
    // [2026.10.18 탭연결 1번] 폴더 없는 상담 사건 — 업무유형을 정해 폴더를 만드는 버튼을 같이 보여준다(script.html nxEnsureCaseFolder_)
    if (sub.noFolder && typeof nxEnsureCaseFolder_ === 'function'){
      box.innerHTML = '<div class="log-empty">' + escapeHtml(sub.error) + ' <button type="button" class="ghost-btn" data-ch-make-folder="1">업무유형 정하고 폴더 만들기</button></div>';
      box.querySelector('[data-ch-make-folder]').addEventListener('click', function(){
        nxEnsureCaseFolder_(c, '문서를').then(function(cc){ if (cc && cc.폴더ID && typeof goToCaseHandling_ === 'function') goToCaseHandling_(c.id); });
      });
      return;
    }
    if (sub.error){ box.innerHTML = '<div class="log-empty">' + escapeHtml(sub.error) + '</div>'; return; }
    return Promise.all([
      callGas('listFolder', { folderId: sub.internalFolderId }),
      callGas('listFolder', { folderId: sub.reportFolderId })
    ]).then(function(results){
      var internalRes = results[0], reportRes = results[1];
      internalRes.folderId = sub.internalFolderId;
      reportRes.folderId = sub.reportFolderId;
      if (internalRes.error){ box.innerHTML = '<div class="log-empty">' + escapeHtml(internalRes.error) + '</div>'; return; }
      var internalFiles = internalRes.files || [];
      var reportFiles = reportRes.error ? [] : (reportRes.files || []);
      var publishedByBase = {};
      reportFiles.forEach(function(f){
        var m = f.name.match(/^(.*)\.html?$/i);
        if (m) publishedByBase[m[1]] = f;
      });
      // [2026.09] "📁 보고서 폴더 열기"(구글드라이브 새 탭) 링크는 카드 제목 버튼(chDocsWriterOpenBtn,
      // 증빙확보 화면 안에서 이 폴더로 바로 이동)으로 흡수했으므로 여기선 뺀다 — 작성관리
      // (report-writer)도 work.netax.kr이 아니라 이 앱 안의 네이티브 화면(reportwriter.html)이라
      // <a href> 대신 버튼 + goToReportWriter_ 호출을 쓴다. saveFolderId(내부보고서 폴더ID)를
      // 넘기면 작성관리가 처음 저장할 때 이 폴더 안에 .md를 새로 만들고, publishFolderId(보고서
      // 폴더ID)는 "고객에게 발행"을 눌렀을 때 완성본(.html)이 처음 만들어질 곳을 알려준다.
      var newDocLink = '<button type="button" id="chNewReportBtn" class="ghost-btn" style="font-size:12px; margin-bottom:8px;">✍ 새 문서 작성</button>';
      var mdBases = {};
      var rows = internalFiles.filter(function(f){ return /\.md$/i.test(f.name); }).map(function(f){
        var base = f.name.replace(/\.md$/i, '');
        mdBases[base] = true;
        var published = publishedByBase[base];
        var status = published ? '📤 발행됨' : '✏️ 작성중(미발행)';
        return '<div class="log-entry"><div class="log-date" style="color:var(--navy);">' + status + '</div><div class="log-text">' + escapeHtml(base) +
          ' <button type="button" class="chEditReportBtn ghost-btn" data-file-id="' + escapeHtml(f.id) + '" style="font-size:11px; padding:1px 7px; margin-left:6px;">✍ 편집</button>' +
          '</div></div>';
      });
      // 옛날 방식(.md 없이 .html 단일 파일만 있던 시절)에 만들어진 보고서는 그 .html을 그대로 편집하게 둔다.
      var legacyRows = reportFiles.filter(function(f){
        var m = f.name.match(/^(.*)\.html?$/i);
        return m && !mdBases[m[1]];
      }).map(function(f){
        return '<div class="log-entry"><div class="log-date" style="color:var(--navy);">📤 발행됨(구버전)</div><div class="log-text">' + escapeHtml(f.name.replace(/\.html?$/i, '')) +
          ' <button type="button" class="chEditReportBtn ghost-btn" data-file-id="' + escapeHtml(f.id) + '" style="font-size:11px; padding:1px 7px; margin-left:6px;">✍ 편집</button>' +
          '</div></div>';
      });
      var allRows = rows.concat(legacyRows);
      box.innerHTML = newDocLink + (allRows.length ? allRows.join('') : '<div class="log-empty">아직 작성한 보고서가 없습니다.</div>');
      var newBtn = document.getElementById('chNewReportBtn');
      if (newBtn){
        newBtn.addEventListener('click', function(){
          if (typeof goToReportWriter_ === 'function') {
            goToReportWriter_(c.id, {
              saveFolderId: internalRes.folderId,
              publishFolderId: reportRes.folderId,
              saveFileName: folderName
            });
          }
        });
      }
      box.querySelectorAll('.chEditReportBtn').forEach(function(btn){
        btn.addEventListener('click', function(){
          if (typeof goToReportWriter_ === 'function') goToReportWriter_(c.id, { fileId: btn.getAttribute('data-file-id') });
        });
      });
    });
    }).catch(function(){ box.innerHTML = '<div class="log-empty">불러오지 못했습니다.</div>'; });
  }
</script>
