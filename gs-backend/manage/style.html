<style>
  :root{
    --navy:#0D1B3D; --navy-deep:#081226; --gold:#C8A244; --gold-light:#DCC17E;
    --bg:#e9eaee; --panel:#ffffff; --line:#d8dce3; --ink:#1b2430; --sub:#1b2430;
    --danger:#b3261e; --danger-bg:#fbe7e5; --success:#1f7a4d; --success-bg:#e4f3ea;
  }
  *{ box-sizing:border-box; }
  /* [2026.09.16] "Pretendard"를 폰트스택에서 시도했다가(실제로 불러온 적 없는 죽은 이름이라
     의미 없었음) 대신 구글폰트(Noto Sans KR)를 외부에서 불러오게 했더니, 그 요청이 느리거나
     막힌 네트워크에서 로그인 후 화면 전체가 멈춰버리는 훨씬 심각한 문제가 생겨 즉시 되돌렸다
     — 원래대로 시스템 기본 폰트만 쓴다(표 줄바꿈 문제의 실제 해결책은 booking.html의 말줄임
     처리이지 폰트가 아니다). */
  html,body{ margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; }

  /* ===== 로그인 게이트 ===== */
  #loginGate{ position:fixed; inset:0; background:var(--navy-deep); display:flex; align-items:center;
    justify-content:center; z-index:9999; }
  #loginGate.hidden{ display:none; }
  .login-box{ background:var(--panel); border-radius:14px; padding:36px 32px; width:300px; text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,0.35); }
  .login-box h1{ font-size:18px; margin:0 0 20px; color:var(--navy); }
  .login-box input{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; margin-bottom:10px; text-align:center; }
  .login-box input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  .login-box button{ width:100%; padding:10px; border:none; border-radius:8px; background:var(--navy);
    color:#fff; font-size:14px; font-weight:700; }
  .login-box button:hover{ background:var(--navy-deep); }
  .login-err{ color:var(--danger); font-size:12px; margin-top:8px; min-height:16px; }

  /* ===== 3단 레이아웃 ===== */
  #appRoot{ display:none; height:100%; }
  #appRoot.shown{ display:flex; }

  #sideMenu{ width:34px; flex-shrink:0; background:var(--navy); position:relative; transition:width .15s ease; z-index:50; cursor:pointer; overflow:hidden; }
  #sideMenu.expanded{ width:min(var(--side-expanded-w, 190px), 80vw); cursor:default; }
  #sideMenuInner{ position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; padding:14px 0; }
  /* [2026.09 재설계] 접힌 상태에서 별도의 "아이콘 전용 목록"을 새로 그리는 대신, 펼쳤을 때와
     완전히 같은 .menu-item/.menu-group-label 엘리먼트를 그대로 두고 라벨만 숨긴다 —
     "사이드바가 열렸을 때 자리에 그대로 아이콘이 자리했으면 좋겠다"는 지적대로, 같은
     엘리먼트라 세로 위치가 펼친 상태와 정확히 같다(예전엔 별도 목록이 margin:3px로 훨씬
     촘촘하게 쌓여서 자리가 전혀 안 맞았음). */
  /* [2026.09 버그수정] 처음엔 .menu-brand를 display:none으로, .menu-group-label을 height:1px로
     줄여서 접었을 때 박스 크기 자체가 펼쳤을 때와 달라졌다 — 그러면 그 아래 모든 항목이
     펼친 상태보다 위로 밀려 올라가서 "타이틀이 있다가 없어지니까" 자리가 도로 안 맞았다.
     padding·margin·글자크기는 그대로 두어 박스 높이를 펼친 상태와 똑같이 유지하고, 글자만
     안 보이게(color:transparent) 한다 — 그룹 구분선은 같은 자리에 얇은 선을 따로 그린다. */
  #sideMenu:not(.expanded) .menu-brand{ color:transparent; }
  #sideMenu:not(.expanded) .menu-group-label{ color:transparent; position:relative; }
  #sideMenu:not(.expanded) .menu-group-label::after{ content:''; position:absolute; left:8px; right:8px; top:50%; height:1px; background:rgba(255,255,255,0.14); }
  #sideMenu:not(.expanded) .menu-item{ padding:9px 0; justify-content:center; }
  #sideMenu:not(.expanded) .menu-item .mi-label{ display:none; }
  /* font-size는 펼친 상태와 반드시 똑같이 둔다 — 여기서 조금이라도 키우면 줄 높이가 늘어나서
     항목마다 1px씩 어긋나고, 그게 쌓여 아래로 갈수록 펼친 상태와 자리가 벌어진다(실제로
     15px로 키웠다가 발견함). */
  #sideMenu:not(.expanded) .menu-item .mi-icon{ width:auto; }
  .menu-brand{ color:var(--gold-light); font-weight:800; font-size:15px; padding:0 16px 14px; letter-spacing:.5px; }
  .menu-group-label{ color:#8b93ad; font-size:11px; font-weight:700; padding:10px 16px 4px; letter-spacing:.5px; }
  .menu-item{ display:flex; align-items:center; gap:8px; padding:9px 16px; color:#dfe3ee; font-size:13px;
    cursor:pointer; white-space:nowrap; border-left:3px solid transparent; }
  .menu-item:hover{ background:rgba(255,255,255,0.06); }
  .menu-item.active{ background:rgba(200,162,68,0.15); border-left-color:var(--gold); color:var(--gold-light); font-weight:700; }
  .menu-item.soon{ opacity:.55; }
  /* [2026.09 버그수정] 이모지 폭이 제각각이라(⚖️ vs 👤 vs 🧭) 그 뒤 글자 시작 위치가 항목마다
     들쭉날쭉했다 — 아이콘 칸 폭을 고정해서 라벨이 항상 같은 위치에서 시작하게 한다. */
  .menu-item .mi-icon{ display:inline-flex; align-items:center; justify-content:center; width:18px; flex-shrink:0; font-size:14px; }
  .menu-item .mi-label{ flex:1; }

  #centerWork{ flex:1; min-width:0; height:100%; overflow:hidden; position:relative; background:var(--bg); }
  .view{ position:absolute; inset:0; overflow-y:auto; display:none; }
  .view.active{ display:block; }
  #view-workmanage.active, #view-clientmanage.active, #view-docs.active,
  #view-memo-text.active, #view-memo-hand.active, #view-taxcalc.active, #view-reporthub.active{ display:flex; flex-direction:column; overflow:hidden; }

  /* [2026.09 신규] 보고서 모음 화면 */
  .rh-subtab-btn{ background:#f2f3f6; border:1px solid var(--line); border-radius:6px; padding:6px 12px;
    font-size:12.5px; font-family:inherit; cursor:pointer; color:var(--sub); }
  .rh-subtab-btn.active{ background:var(--navy); color:#fff; border-color:var(--navy); font-weight:600; }
  .rh-pane{ flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .view-head{ padding:16px 22px 10px; }
  .view-head h2{ margin:0; font-size:19px; color:var(--navy); }
  .view-body{ padding:0 22px 24px; }

  /* [2026.09 버그수정] 접힌 상태 배경이 #f1f2f5로 중앙 작업영역 배경(--bg:#e9eaee)과 거의
     같은 밝기라 오른쪽 끝에 뭐가 있는지 전혀 안 보였다("도대체 보이지가 않는다") — 왼쪽
     메뉴(#sideMenu)와 같은 남색으로 맞춰 접힌 상태에서도 눈에 띄게 한다. */
  /* [2026.09 버그수정] 접힌 상태 배경이 중앙 작업영역과 거의 같은 밝기라 오른쪽 끝에 뭐가
     있는지 안 보였다("도대체 보이지가 않는다") — 왼쪽 메뉴(#sideMenu)와 같은 남색으로
     통일하고, 펼쳤을 때도 계속 남색을 유지한다(사용자 요청) — 그래서 아래 .ai-sb-* 들도
     전부 밝은 배경 기준 색상에서 남색 배경에 맞는 밝은 글자색으로 다시 맞췄다. */
  #sideAI{ width:14px; flex-shrink:0; background:var(--navy); border-left:1px solid var(--line); position:relative; transition:width .15s ease; z-index:40; cursor:pointer; overflow:hidden; }
  #sideAI.expanded{ width:min(320px, 88vw); cursor:default; }
  #sideAIInner{ position:absolute; inset:0; display:flex; flex-direction:column; min-width:0; }
  /* [2026.09 버그수정] 접힌 상태(14px)에서도 #sideAIInner 내용(입력창 등 기본 흰 배경을 가진
     요소들)이 그대로 그려져 overflow:hidden에 잘려나간 조각들이 남색 배경 중간중간에 흰
     얼룩처럼 비쳐 보였다("흰색이 중간에 들어가 있다") — 왼쪽 메뉴가 접힌 상태에서 전용
     아이콘 뷰(#sideMenuIcons)로 통째로 바꿔치기하는 것처럼, 여기서도 접혔을 땐 안의 내용을
     아예 숨겨서 순수한 남색 막대만 보이게 한다. */
  #sideAI:not(.expanded) #sideAIInner{ display:none; }
  .ai-sb-resize-handle{ position:absolute; left:0; top:0; bottom:0; width:6px; cursor:ew-resize; z-index:1; }
  .ai-sb-resize-handle:hover, .ai-sb-resize-handle.dragging{ background:rgba(200,162,68,0.35); }
  #sideAI:not(.expanded) .ai-sb-resize-handle{ display:none; }

  /* ===== 자체 AI 사이드바 (남색 배경 기준 — 왼쪽 메뉴와 같은 톤) ===== */
  .ai-sb-head{ display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,0.14); flex-shrink:0; }
  .ai-sb-head b{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; color:var(--gold-light); }
  .ai-sb-collapse{ border:none; background:none; cursor:pointer; font-size:14px; color:rgba(255,255,255,0.6); padding:2px 6px; }
  .ai-sb-collapse:hover{ color:#fff; }
  .ai-sb-body{ flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .ai-sb-msg{ width:100%; box-sizing:border-box; padding:9px 11px; border-radius:9px; font-size:13px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .ai-sb-msg.ai{ background:#f0f2f6; color:var(--ink); border-top-left-radius:2px; }
  .ai-sb-msg.me{ background:rgba(200,162,68,0.22); color:#fff; border-top-left-radius:2px; }
  .ai-sb-empty{ color:rgba(255,255,255,0.6); font-size:12.5px; text-align:center; margin-top:40px; line-height:1.7; }
  .ai-sb-foot{ border-top:1px solid rgba(255,255,255,0.14); padding:10px; flex-shrink:0; display:flex; gap:6px; align-items:flex-end; }
  .ai-sb-foot textarea{ flex:1; resize:none; border:1px solid rgba(255,255,255,0.2); border-radius:8px; padding:7px 9px; font-family:inherit; font-size:13px; max-height:100px; }
  .ai-sb-foot button{ flex-shrink:0; border:none; border-radius:8px; background:var(--gold); color:var(--navy); width:34px; height:34px; cursor:pointer; font-size:14px; }
  .ai-sb-foot button:hover{ background:var(--gold-light); }
  .ai-sb-foot button.stop{ background:var(--danger); color:#fff; }
  .ai-soon{ color:rgba(255,255,255,0.6); font-size:13px; text-align:center; margin-top:60px; line-height:1.7; }

  /* ===== 공용 위젯 ===== */
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card h3{ margin:0 0 10px; font-size:14px; color:var(--navy); }
  /* [2026.09] 사건처리 카드들 — 예전엔 "제목 텍스트" + 그 밑에 "~에서 열기" 버튼이 따로
     있었는데, 제목 자체를 눌러서 바로 이동하도록 통합해 화면을 정리했다(사건처리화면). */
  .ch-card-head-btn{ display:flex; align-items:center; gap:6px; width:100%; background:none; border:none;
    padding:0; margin:0; font:inherit; font-size:12.5px; font-weight:700; color:var(--navy); cursor:pointer; text-align:left; }
  .ch-card-head-btn:hover{ text-decoration:underline; }
  .ch-card-head-arrow{ color:var(--sub); font-weight:400; }
  .empty-row{ color:var(--sub); font-size:13px; padding:10px 0; }
  /* [2026.09.16 버그수정] 실사용 지적 — "저장"(.save-btn) 옆에 놓인 "🗑 삭제"(.btn.danger)의
     높이가 눈에 띄게 달랐다. 원인 두 가지: ① .btn의 패딩(6px 12px)이 .save-btn/.ghost-btn
     (7px 14px)과 애초에 달랐다. ② 그걸 맞춰도, 이모지(🗑) 글리프가 순한글 텍스트보다 폰트
     자체의 줄높이가 커서 line-height를 명시하지 않으면 브라우저가 그 버튼만 더 늘려 그린다
     — 세 버튼 클래스 모두에 같은 line-height를 명시해야 내용이 이모지든 순텍스트든 버튼
     높이가 항상 같아진다. */
  .btn{ border:1px solid var(--gold); background:rgba(200,162,68,0.10); color:var(--navy); border-radius:7px;
    padding:7px 14px; font-size:12.5px; font-weight:600; line-height:1.2; display:inline-block; box-sizing:border-box; vertical-align:middle; font-family:inherit; cursor:pointer; }
  .btn:hover{ background:rgba(200,162,68,0.22); }
  .btn.primary{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .btn.primary:hover{ background:var(--navy-deep); }
  .btn.danger{ background:var(--danger-bg); color:var(--danger); border-color:var(--danger-bg); }
  .btn.success{ background:var(--success-bg); color:var(--success); border-color:var(--success-bg); }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--navy);
    color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; z-index:999; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.shown{ opacity:1; }

  /* [2026.09] "저장 버튼을 눌러도 아무 반응이 없어 답답하다" — 저장 버튼 하나하나를 고치는
     대신, 서버에 요청을 보내는 동안(callGas, script.html) 화면 맨 위에 항상 뜨는 진행바
     하나로 전부 해결한다. 실제로 안 움직이는 진행률 대신 좌우로 흐르는 애니메이션만 준다
     (몇 %인지 알 수 없는 요청이 대부분이라 "진행 중"이라는 사실만 전달하면 충분). */
  #globalProgressBar{ position:fixed; top:0; left:0; right:0; height:3px; z-index:10000;
    background:transparent; pointer-events:none; overflow:hidden; }
  #globalProgressBar.active::before{
    content:''; position:absolute; top:0; left:0; height:100%; width:40%;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    animation:globalProgressSlide 1s linear infinite;
  }
  @keyframes globalProgressSlide{
    from{ transform:translateX(-100%); }
    to{ transform:translateX(350%); }
  }

  table.list-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.list-table th{ text-align:left; padding:8px 10px; color:var(--sub); font-weight:600; border-bottom:1px solid var(--line); font-size:12px; }
  table.list-table td{ padding:9px 10px; border-bottom:1px solid var(--line); }
  table.list-table tr:hover td{ background:#f7f8fa; }

  .spinner{ color:var(--sub); font-size:13px; padding:20px; text-align:center; }

  /* [2026.09 신규] 사용자메뉴얼 — ❓ 버튼으로 특정 항목으로 이동했을 때 어디로 왔는지
     한눈에 보이도록 잠깐 배경을 강조했다가 원래대로 돌아간다. */
  #help-toc a{ color:var(--navy); text-decoration:none; }
  #help-toc a:hover{ text-decoration:underline; }
  .help-flash{ animation:helpFlash_ 1.6s ease-out; }
  @keyframes helpFlash_{
    0%{ background:rgba(200,162,68,0.28); }
    100%{ background:transparent; }
  }

  /* ===== 버튼 색상 체계 (2026.09 정리) =====
     "버튼인지 구분이 안 된다" + "일관된 기준이 있어야" — 이 앱 팔레트의 두 축(남색=주,
     금색=포인트)을 그대로 버튼 위계에 쓴다.
     - 남색 채움(.save-btn, .btn.primary) = 주 실행(저장·등록·확정 등 데이터를 바꾸는 확정동작)
     - 금색 테두리+옅은 금색 배경(.ghost-btn) = 이동·보조(열기·이동·취소 등 확정이 아닌 동작)
     - 빨강/초록(.btn.danger/.success)은 원래대로 위험·성공 의미 전용으로 유지
     한 클래스만 고치면 앱 전체 화면에 한번에 반영된다(모든 화면이 이 style.html 하나를 공유). */
  .ghost-btn{ font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; border-radius:6px; padding:7px 14px;
    border:1px solid var(--gold); background:rgba(200,162,68,0.10); color:var(--navy); line-height:1.2; box-sizing:border-box; display:inline-block; vertical-align:middle; }
  .ghost-btn:hover{ background:rgba(200,162,68,0.22); }
  .ghost-btn:active{ background:rgba(200,162,68,0.32); }
  /* border:none이면 .ghost-btn/.btn(둘 다 1px 테두리)과 border-box 계산이 달라져 미세하게
     낮이가 어긋난다 — 안 보이는 투명 테두리를 같은 두께로 둬서 셋 다 같은 박스모델을 쓴다. */
  .save-btn{ font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer; border-radius:6px; padding:7px 14px;
    border:1px solid transparent; background:var(--navy); color:#fff; box-shadow:0 1px 2px rgba(16,24,40,0.12); line-height:1.2; box-sizing:border-box; display:inline-block; vertical-align:middle; }
  .save-btn:hover{ background:var(--navy-deep); }

  /* [2026.09] "아이콘+버튼명" 툴바가 화면 폭이 좁아지면(특히 오른쪽 AI사이드바가 열려서
     작업영역이 좁아질 때) 버튼들이 줄바꿈되며 아래 내용과 겹치는 문제 — 1단계로 아이콘부터
     숨기고, 그래도 좁으면 2단계로 글자를 숨기고 아이콘만 남겨 자리를 줄인다.
     [버그수정] 처음엔 container query(폭 숫자 기준)로 시도했는데, .tb-row 자체가
     flex-wrap:wrap이라 버튼이 넘치면 컨테이너가 좁아지는 게 아니라 그냥 2줄로 줄바꿈돼버려서
     폭 기준이 전혀 충족되지 않는 문제가 있었다 — "아이콘 생략 단계로 안 넘어가고 바로
     2줄이 된다"는 지적. 폭 숫자가 아니라 "실제로 한 줄에 다 들어가는지"를 스크립트가 직접
     재보고 이 클래스를 붙이는 방식(script.html의 tbCollapseAll_)으로 바꿨다. */
  .btn-ic{ flex-shrink:0; }
  .tb-row.tb-ic-off .btn-ic, .scan-row.tb-ic-off .btn-ic{ display:none; }
  .tb-row.tb-tx-off .btn-tx, .scan-row.tb-tx-off .btn-tx{ display:none; }

  .explorer-status{ padding:16px 14px; font-size:13px; color:var(--sub); }
  /* [2026.09.16 버그수정] 예약관리(booking.html)와 같은 종류의 문제 — 화면이 좁아져 버튼·
     라벨이 다 안 들어가면, 고정 height(44px)+flex-wrap 기본값(nowrap) 때문에 줄바꿈은 안
     되고 버튼 박스 자체가 눌려 찌그러지면서 그 안의 글자가 한 글자씩 세로로 쌓여 보였다
     (수금관리 상단 메뉴행에서 실제로 재현됨). height를 min-height로 바꾸고 flex-wrap:wrap을
     걸어 안 들어가는 버튼은 다음 줄로 통째로 넘어가게 하고, 버튼/라벨 글자 자체에도
     white-space:nowrap을 걸어(.btn/.ghost-btn/.save-btn 참고) 안에서 잘리지 않게 한다. */
  .editor-toolbar{ display:flex; align-items:center; gap:10px; min-height:44px; padding:8px 12px;
    border-bottom:1px solid var(--line); flex-shrink:0; background:#f9fafb; flex-wrap:wrap; }
  .editor-filename{ font-size:12.5px; color:var(--sub); font-weight:600; white-space:nowrap; }
  .spacer{ flex:1; }
  .log-list{ flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; box-sizing:border-box; }
  .log-entry{ display:flex; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; position:relative; }
  /* [2026.09 버그수정] 고정 폭(84px→66px로 줄였다가도 여전히 지적받음)은 결국 "가장 긴 경우"
     기준으로 정해야 해서 대부분의 행(완료·짧은 날짜)에는 항상 빈 공간이 남는다 — 애초에
     고정폭 자체가 원인이었다. flex:0 0 auto로 바꿔 각 행이 자기 글자 수만큼만 차지하게 한다
     (실측: "26-09-16" 약 49px, "⏰ 26-09-16" 약 68px — 행마다 실제 필요한 만큼만 차지). */
  .log-entry .log-date{ flex:0 0 auto; font-size:11.5px; font-weight:700; color:var(--gold); white-space:nowrap; display:flex; flex-direction:column; gap:4px; }
  .log-entry .log-text{ flex:1; font-size:13px; color:var(--ink); line-height:1.5; white-space:pre-wrap; }
  .log-entry .log-del{ flex:0 0 auto; background:none; border:none; color:var(--sub); cursor:pointer; font-size:16px; font-weight:800; padding:0 4px; }
  .log-entry .log-del:hover{ color:var(--danger); }
  .log-empty{ padding:16px 14px; font-size:12.5px; color:var(--sub); }
  /* [2026.09.16 신규] "고객관리 좌측 목록의 필드길이를 줄이자, 휴대폰번호가 끝나는 지점에
     맞춰라" — 위 .log-date와 같은 원인(고정폭 컨테이너가 가장 긴 이름 기준으로 정해져 있어
     "1"/"2"처럼 짧은 이름도 항상 넓은 빈 칸을 남김)이라, 컨테이너 폭이 아니라 각 행 자체를
     내용 길이만큼만 차지하게 한다(고객관리 목록에만 적용 — .log-entry는 작업관리 등 다른
     화면에서도 널리 쓰여 전체를 바꾸면 그쪽 레이아웃이 깨진다). */
  #clientList .log-entry{ align-self:flex-start; width:fit-content; max-width:100%; }
  /* 행뿐 아니라 패널 자체도 280px 고정이라, 좁아진 행 오른쪽에 빈 공간과 엉뚱한 위치의
     스크롤바가 남았다("좌측목록영역의 크기문제") — 패널도 내용에 맞춰 줄이되, 이름 하나 없이
     너무 좁아지거나(빈 목록) 유난히 긴 이름 하나 때문에 과하게 넓어지는 것만 막는다. */
  #clientSplitList{ width:fit-content; max-width:360px; }
  .manage-split{ flex:1; display:flex; flex-direction:row; min-height:0; height:calc(100% - 44px); }
  .manage-split-list{ width:280px; min-width:220px; border-right:1px solid var(--line); overflow-y:auto; box-sizing:border-box; }
  .manage-split-detail{ flex:1; overflow-y:auto; padding:16px; box-sizing:border-box; }
  input[type=text], input[type=date], input[type=password], input[type=tel], select, textarea{
    font-family:inherit; font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; color:var(--ink); background:#fff; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  input[type=number], input[inputmode=numeric], input[inputmode=decimal]{ text-align:right; }
  /* [2026.09.16] 세무사님 지시 — 날짜칸이 좁아진 상태에서 글자가 왼쪽에 붙어있으면 남는
     여백이 오른쪽으로만 몰려 어색해 보인다는 지적. 모든 날짜칸에 가운데정렬을 적용.
     [주의] 순수 <input type=date>뿐 아니라, enhanceDateInputs(taxcalc.html)가 렌더링 직후
     type을 text로 바꾸고 inputmode="numeric"을 붙이는 .taxcalc-date도 같이 잡아야 한다 —
     안 그러면 바로 위 숫자칸 우측정렬 규칙(input[inputmode=numeric])에 걸려 그쪽이 이긴다
     (실제로 처음엔 .taxcalc-date를 빠뜨려서 작업관리 등 날짜칸이 하나도 안 먹혔었다). */
  input[type=date], input.taxcalc-date{ text-align:center; }
  label{ font-size:12.5px; color:var(--sub); }

  #memoFindReplaceBar input:focus{ outline:none; border-color:#7686ab; }

  .note-tb{ display:flex; align-items:center; gap:5px; height:44px; padding:0 10px; background:var(--navy); flex-shrink:0; flex-wrap:wrap; }
  .note-tb-btn{ flex:0 0 auto; width:30px; height:30px; border:none; border-radius:6px; background:rgba(255,255,255,0.14);
    color:#fff; font-size:15px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
  .note-tb-btn:hover{ background:rgba(255,255,255,0.24); }

  .note-tb-page{ color:#fff; font-size:12px; padding:0 4px; }
  #noteCanvasWrap{ flex:1; position:relative; background:#fff; overflow:hidden; touch-action:none; }
  #noteCanvasWrap.note-zoomed{ overflow:auto; }
  #noteCanvasWrap.note-bg-ruled{ background-image: repeating-linear-gradient(to bottom, transparent, transparent 27px, #cfd8e8 28px); }
  #noteCanvasWrap.note-bg-grid{ background-image:

      repeating-linear-gradient(to right, transparent, transparent 27px, #cfd8e8 28px); }
  #noteZoomInner{ position:relative; width:100%; height:100%; transform-origin:top left; }

  #memoSaveStep .box{ background:#fff; border-radius:10px; padding:18px; width:min(92vw,360px); display:flex; flex-direction:column; gap:10px; box-shadow:0 12px 32px rgba(0,0,0,0.3); }

  #memoReqApplyStep .box{ background:#fff; border-radius:10px; padding:18px; width:min(92vw,380px); display:flex; flex-direction:column; gap:10px; box-shadow:0 12px 32px rgba(0,0,0,0.3); }

  /* ===== 세액계산 (tax-calculator.js 이식 — 원본 index.html의 .taxcalc-* 규칙 그대로) ===== */
  :root{
    --taxcalc-border:#a9b0bd; --taxcalc-border-strong:#8b93a3; --taxcalc-hint:#1b2430; --taxcalc-faint:#1b2430;
    --taxcalc-chip-bg:#eef0f4; --taxcalc-chip-bg-hover:#e2e5eb; --taxcalc-result-bg:#f3f5f8;
    --taxcalc-basis-bg:#eceef2; --taxcalc-gold-deep:#93712a;
    --taxcalc-success:#1f7a4d; --taxcalc-success-bg:#e4f3ea;
    --taxcalc-warning:#b45309; --taxcalc-warning-bg:#fbeedf;
    --taxcalc-danger:#b3261e;  --taxcalc-danger-bg:#fbe7e5;
    --taxcalc-info:#2b5c8a;    --taxcalc-info-bg:#e7eef6;
    --taxcalc-radius-s:4px; --taxcalc-radius-m:8px; --taxcalc-radius-l:14px;
  }
  .taxcalc-tabs{ display:flex; gap:0; border-bottom:1px solid var(--taxcalc-border); padding:0 14px; flex-shrink:0; }
  .taxcalc-tab{
    background:none; border:none; border-bottom:2px solid transparent; padding:10px 14px;
    font-family:inherit; font-size:13px; font-weight:700; color:var(--ink); opacity:0.7; cursor:pointer;
  }
  .taxcalc-tab.active{ color:var(--navy); opacity:1; border-bottom-color:var(--gold); }
  /* [2026.09.24] 양도소득세 탭 안의 부동산/주식등/국외자산 — 서로 계산을 절대 합칠 수 없는
     별도 세목이라 한 화면에 늘어놓지 않고 위 탭과 같은 모양의 하위 탭으로 완전히 분리한다. */
  .taxcalc-subtabs{ display:flex; gap:0; border-bottom:1px solid var(--taxcalc-border); margin-bottom:14px; }
  .taxcalc-subtab{
    background:none; border:none; border-bottom:2px solid transparent; padding:8px 12px;
    font-family:inherit; font-size:13px; font-weight:700; color:var(--ink); opacity:0.6; cursor:pointer;
  }
  .taxcalc-subtab.active{ color:var(--navy); opacity:1; border-bottom-color:var(--gold); }
  .taxcalc-body{ flex:1; overflow-y:auto; padding:14px; }
  .taxcalc-hint{ font-size:12px; color:var(--taxcalc-hint); margin-bottom:12px; line-height:1.55; }
  .taxcalc-asset{ border:1px solid var(--taxcalc-border); border-radius:10px; padding:12px; margin-bottom:12px; background:var(--panel); }
  .taxcalc-asset-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .taxcalc-asset-head b{ font-size:13px; font-weight:800; color:var(--ink); }
  /* [2026.09.20 필드 간격 정비, 최최종] auto-fill/1fr(그리드) 방식은 "공유 트랙" 구조상
     한 트랙의 최소폭(160px) 밑으로는 절대 못 내려가서, 성명처럼 95px면 충분한 필드도 항상
     60~90px가 남아 세무사님이 보기엔 여전히 "떨어져 보였다"(실측: 캡쳐 확인 후 grid 방식은
     한계로 판단). 그리드를 통째로 flex로 바꿔 각 필드가 "자기 라벨/입력칸 크기만큼만" 차지하고
     남는 폭은 그냥 다음 줄로 넘기게 한다 — 공유 트랙이 없으니 옆 필드 폭과 무관하게 각자
     내용물 크기로 정렬된다(좌측정렬 그 자체). 체크박스·전체폭 note는 flex-basis:100%로,
     주소처럼 넓게 써야 하는 칸은 flex-basis 고정값으로 대체(아래 grid-column:1/-1·span 2
     전부 치환, taxcalc.html 쪽도 함께 수정함). */
  .taxcalc-grid{ display:flex; flex-wrap:wrap; gap:8px 10px; }
  /* [2026.09.20 flex 전환 후 자체 점검 2] 라벨 옆 .taxcalc-field-help·.taxcalc-result-note에
     법조문 설명처럼 긴 문장이 붙은 필드는, flex가 "줄바꿈 없이 한 줄에 다 담을 수 있는
     폭"으로 필드 전체를 늘려버려서(거주구분 select 자체는 짧은데 옆의 긴 안내문장 때문에
     필드 전체가 통째로 넓어짐) 셀렉트와 똑같은 문제가 났다. 필드 자체에 상한을 둬서
     긴 문장은 필드 폭 안에서 줄바꿈되게 한다(주소 등 flex-basis:340px 지정 필드는
     그대로 340px 유지, 상한보다 작으므로 영향 없음). */
  .taxcalc-field{ display:flex; flex-direction:column; gap:3px; flex:0 1 auto; max-width:360px; position:relative; }
  .taxcalc-field label{ font-size:12px; font-weight:600; color:var(--ink); }
  .taxcalc-field input, .taxcalc-field select{
    border:1px solid var(--taxcalc-border); border-radius:6px; padding:6px 8px; font-family:inherit;
    font-size:13px; box-sizing:border-box; background:var(--panel); color:var(--ink);
  }
  /* [2026.09.20 flex 전환 후 자체 점검] select는 브라우저가 "가장 긴 option 글자수"로
     자기 폭을 잡는다 — 지금 고른 값이 "그 외 부동산"(6자)이어도 같은 select 안에
     "분양권(§104①1호·2호·3호 — ...)"처럼 긴 옵션이 하나만 있으면 그 옵션 길이만큼
     통째로 넓어져 있었다(실측 607px). 셀렉트만 상한을 둬서 긴 옵션은 그 옵션이 실제
     선택됐을 때만 말줄임(...)되게 한다. */
  .taxcalc-field select{ max-width:280px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  /* [2026.09.16 버그수정] 세무사님 전체 재검토 지시 — .taxcalc-field가 flex-column
     기본값(align-items:stretch)이라, 날짜(10자)·숫자(면적·연도 등 대개 몇 자리) 입력칸까지
     그리드 칸(180px 이상) 전체 폭으로 늘어나 데이터 길이에 비해 항상 크게 남아 보였다.
     .taxcalc-field-inline(소재지 등 일부러 넓게 쓰는 칸)의 입력창은 한 단계 더 안쪽
     자손이라 직계자손(>) 선택자에 안 걸려 영향 없음 — 날짜·숫자칸만 안전하게 좁힌다.
     [주의] enhanceDateInputs(taxcalc.html)가 렌더링 직후 모든 type="date"를
     type="text"+class="taxcalc-date"(직접 입력용 커스텀 포맷)로 바꿔버려서, 처음에
     input[type="date"] 선택자로 걸었더니 실제로는 하나도 안 먹었다 — 바뀐 뒤의
     실제 상태(.taxcalc-date 클래스)를 기준으로 다시 걸었다. */
  .taxcalc-field > input[type="date"]{ align-self:flex-start; width:auto; }
  .taxcalc-field > input.taxcalc-date{ align-self:flex-start; width:95px; }
  .taxcalc-field > input[type="number"]{ align-self:flex-start; width:auto; }
  /* [2026.09.20 자체 점검] 금액(원) 입력칸은 enhanceNumberInputs가 렌더 직후 type="number"를
     type="text"+class="taxcalc-money"로 바꿔버려서 위 규칙이 실제로는 적용된 적이 없었다
     (브라우저 기본폭 ~165px에 우연히 맡겨져 있었음) — 같은 종류의 데이터는 폭도 똑같아야
     하므로 명시적으로 통일한다. */
  .taxcalc-field > input.taxcalc-money, .taxcalc-field-inline > input.taxcalc-money{ align-self:flex-start; width:150px; }
  /* data-nameonly는 이미 JS(enhanceNameOnlyInputs)가 "이 칸은 사람 이름만 들어간다"는
     표시로 쓰고 있던 기존 속성 — 같은 의미를 폭에도 그대로 활용, 성명(2~6자)칸을 좁힌다. */
  .taxcalc-field > input[data-nameonly]{ align-self:flex-start; width:95px; }
  /* data-regno(주민등록번호 등 "000000-0000000" 고정형식)·호·지분비율도 같은 이유로 좁힌다. */
  .taxcalc-field > input[data-regno]{ align-self:flex-start; width:150px; }
  .taxcalc-field > input[data-field="assetHo"]{ align-self:flex-start; width:95px; }
  .taxcalc-field > input[data-field="ownershipRatio"]{ align-self:flex-start; width:80px; }
  /* [2026.09.20 필드길이 정비] 위와 같은 이유로 좁혀야 하는데 기존 선택자에 안 걸리던
     짧은 고정형식 입력칸들 — 호실("101호"), 배분비율("1/2"), 계약년월("202601", 6자리),
     사업자번호("123-45-67890")·임대차 임차인번호(사업자/주민 겸용이라 더 긴 주민번호 기준). */
  .taxcalc-field > input[data-lfield="unitLabel"]{ align-self:flex-start; width:95px; }
  .taxcalc-field > input[data-hafield="ratio"]{ align-self:flex-start; width:80px; }
  .taxcalc-field > input#realPriceYm{ align-self:flex-start; width:95px; }
  .taxcalc-field > input[data-ffield="bizNo"]{ align-self:flex-start; width:130px; }
  .taxcalc-field > input[data-lfield="tenantBizNo"]{ align-self:flex-start; width:150px; }
  .taxcalc-field > input[data-cfield="name"]{ align-self:flex-start; width:140px; }
  .taxcalc-field > input#ihReporterRelation{ align-self:flex-start; width:95px; }
  .taxcalc-field input::placeholder{ color:var(--taxcalc-hint); opacity:0.85; }
  .taxcalc-field input:focus, .taxcalc-field select:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  .taxcalc-field input[readonly]{ background:var(--taxcalc-hint-bg, rgba(128,128,128,0.12)); color:var(--taxcalc-hint); cursor:default; }
  /* [2026.09 신규] 실사용 지적 — 라벨에 조건설명을 그대로 박아넣거나(예: "[실지거래가액
     모를 때] 매매사례가액") placeholder/설명 문구가 항상 화면에 보여서 화면이 지저분하다는
     지적. 라벨은 짧게 두고, 자세한 설명(.taxcalc-field-help)은 그 입력칸에 포커스가 가 있는
     동안에만 보이게 한다 — 값을 넣을 때만 필요한 설명이 나타났다가, 다른 칸으로 넘어가면
     다시 숨어서 화면이 평소엔 훨씬 단순해 보인다. (:focus-within이라 input뿐 아니라 그
     칸 안의 버튼 등 무엇에 포커스가 가도 같이 나타난다.) */
  /* [2026.09.20 flex 전환 후 자체 점검 3] flex는 폭을 "지금 보이는 자식 내용"에 맞춰
     계산하는데, 이 도움말은 포커스 전엔 display:none이라 폭 계산에서 빠져 있다가
     포커스가 가는 순간(:focus-within) display:block이 되면서 그 순간 필드 폭이
     도움말 문장 길이만큼 갑자기 넓어져 보였다(타이핑하려는 순간 칸이 늘어나는 원인).
     position:absolute로 레이아웃 흐름에서 아예 빼서, 보이든 안 보이든 필드 자체의
     폭 계산에 전혀 영향을 못 주게 한다(입력칸 바로 아래에 살짝 뜨는 방식으로 표시). */
  .taxcalc-field-help{
    display:none; position:absolute; top:100%; left:0; margin-top:2px; z-index:20;
    width:max-content; max-width:260px; padding:3px 6px; border-radius:5px;
    background:var(--panel); border:1px solid var(--taxcalc-border); box-shadow:0 2px 6px rgba(0,0,0,0.12);
    font-size:11.5px; color:var(--taxcalc-hint); line-height:1.5;
  }
  .taxcalc-field:focus-within .taxcalc-field-help{ display:block; }
  /* [2026.09 버그수정] 실사용 감사 지적 — 체크박스 라벨(특히 상속공제 요건 등 조문을 그대로
     풀어쓴 것)이 100자 넘는 경우가 많은데, 지금까지는 다른 짧은 입력칸과 똑같이 180px 남짓한
     grid 칸 하나에 갇혀 여러 줄로 심하게 줄바꿈됐다 — 체크박스는 항상 grid 전체 폭을 쓰게 한다
     (짧은 라벨도 폭이 넓어질 뿐 가독성엔 문제 없음). */
  .taxcalc-field.checkbox{ flex-direction:row; align-items:center; gap:6px; flex-basis:100%; max-width:none; }
  .taxcalc-field.checkbox label{ font-size:12.5px; font-weight:600; color:var(--ink); }
  .taxcalc-field.checkbox input{ width:15px; height:15px; accent-color:var(--gold); }
  .taxcalc-del-asset{
    background:var(--taxcalc-chip-bg); border:1px solid var(--taxcalc-border); border-radius:6px;
    color:var(--ink); cursor:pointer; font-size:12px; padding:4px 8px;
  }
  .taxcalc-del-asset:hover{ color:#fff; background:#a83232; border-color:#a83232; }
  .taxcalc-asset-head span{ display:flex; gap:8px; align-items:center; }
  .taxcalc-calcbasis-btn{
    background:var(--taxcalc-chip-bg); border:1px solid var(--taxcalc-border); border-radius:6px;
    color:var(--ink); cursor:pointer; font-size:12px; font-weight:600; padding:4px 8px;
  }
  .taxcalc-calcbasis-btn:hover{ background:var(--taxcalc-chip-bg-hover); border-color:var(--gold); color:var(--navy); }
  .taxcalc-calcbasis{
    margin:-2px 0 10px; padding:10px 12px; border-radius:8px; background:var(--taxcalc-basis-bg);
    border:1px solid var(--taxcalc-border); font-size:12.5px; line-height:1.7; font-variant-numeric:tabular-nums;
  }
  .taxcalc-calcbasis-title{ font-weight:800; color:var(--ink); margin-bottom:4px; }
  .taxcalc-calcbasis-line{ color:var(--ink); word-break:break-all; }
  .taxcalc-add-asset{
    width:100%; padding:10px; border:1px dashed var(--taxcalc-border-strong); border-radius:8px; background:var(--taxcalc-chip-bg);
    color:var(--ink); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; margin-bottom:14px;
  }
  .taxcalc-add-asset:hover{ border-color:var(--gold); background:var(--taxcalc-chip-bg-hover); color:var(--navy); }
  /* [2026.09 버그수정] 세무사님 지적 — "+ 계약 추가"/"+ 항목 추가"처럼 제목행(.taxcalc-asset-head)
     안에서 "🧮 계산근거"·"✕ 삭제" 같은 작은 칩 버튼과 나란히 놓이는 추가버튼은, 목록 아래에
     혼자 크게 놓이는 표준 .taxcalc-add-asset(카드 하나를 통째로 새로 만드는 CTA)과 똑같이
     width:100%·큰 패딩을 써서 같은 줄의 다른 버튼보다 훨씬 커 보였다 — 제목행용 작은 버전을
     따로 둔다(점선 테두리는 "추가" 의미를 유지하되 크기만 이웃 버튼들과 맞춤). */
  .taxcalc-add-asset-inline{
    background:var(--taxcalc-chip-bg); border:1px dashed var(--taxcalc-border-strong); border-radius:6px;
    color:var(--ink); cursor:pointer; font-size:12px; font-weight:600; padding:4px 8px; width:auto; margin-bottom:0;
  }
  .taxcalc-add-asset-inline:hover{ border-color:var(--gold); background:var(--taxcalc-chip-bg-hover); color:var(--navy); }
  .taxcalc-run-btn{
    width:100%; padding:11px; border:none; border-radius:8px; background:var(--navy); color:#fff;
    font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer; margin-bottom:14px;
  }
  .taxcalc-run-btn:hover{ background:var(--navy-deep); }
  .taxcalc-result{ border:1px solid var(--taxcalc-border); border-radius:10px; padding:14px; background:var(--taxcalc-result-bg); }
  .taxcalc-result-row{
    display:flex; justify-content:space-between; gap:10px; padding:6px 0; font-size:13px; color:var(--ink);
    border-bottom:1px solid var(--taxcalc-border);
  }
  .taxcalc-result-row span:first-child{ color:var(--ink); }
  .taxcalc-result-row.total{ font-weight:800; font-size:15px; color:var(--navy); border-bottom:none; padding-top:10px; }
  .taxcalc-result-row .v{ font-variant-numeric:tabular-nums; font-weight:700; }
  .taxcalc-result-note{ font-size:12px; color:var(--taxcalc-hint); margin-top:10px; line-height:1.55; }
  .taxcalc-error{ color:#d64545; font-size:13px; font-weight:700; padding:10px; }

  .taxcalc-badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:99px; }
  .taxcalc-badge::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
  .taxcalc-badge.success{ background:var(--taxcalc-success-bg); color:var(--taxcalc-success); }
  .taxcalc-badge.warning{ background:var(--taxcalc-warning-bg); color:var(--taxcalc-warning); }
  .taxcalc-badge.danger{ background:var(--taxcalc-danger-bg); color:var(--taxcalc-danger); }
  .taxcalc-badge.info{ background:var(--taxcalc-info-bg); color:var(--taxcalc-info); }

  .taxcalc-ai-btn{
    background:var(--taxcalc-info-bg); border:1px solid var(--taxcalc-info); border-radius:6px;
    color:var(--taxcalc-info); cursor:pointer; font-size:12px; font-weight:700; padding:4px 8px;
  }
  /* [2026.09.20 자체 점검] .taxcalc-field(flex-column, align-items 기본값 stretch)의 직계
     자식으로 들어간 버튼(예: 관할세무서 확인)은 부모 폭 전체(예: 주소칸 340px)로 늘어나
     불필요하게 커 보였다 — .taxcalc-ai-btn 전체에 걸면 .taxcalc-asset-head(가로 flex,
     align-items:center)의 세로 중앙정렬까지 깨지므로, .taxcalc-field의 직계 자식인
     경우로만 좁혀서 적용한다. */
  .taxcalc-field > .taxcalc-ai-btn{ align-self:flex-start; }
  .taxcalc-ai-btn:hover{ background:var(--taxcalc-info); color:#fff; }
  .taxcalc-ai-btn[disabled]{ opacity:0.5; cursor:not-allowed; }
  .taxcalc-field-inline{ display:flex; gap:4px; align-items:stretch; }
  .taxcalc-field-inline input{ flex:1; min-width:0; }
  .taxcalc-field-inline .taxcalc-ai-btn{ flex:none; margin-top:0 !important; padding:0 9px; }
  .taxcalc-ai-status{ margin-bottom:8px; }
  .taxcalc-ai-status .taxcalc-badge{ margin-right:6px; }
  .taxcalc-ai-fields{ font-size:11.5px; color:var(--taxcalc-hint); margin-top:4px; }

  .taxcalc-evidence-list{ display:flex; flex-direction:column; gap:6px; margin:10px 0; max-height:280px; overflow-y:auto; }
  .taxcalc-evidence-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 10px;
