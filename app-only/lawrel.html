<script>
  // ============================================================
  // [2026.10.19 법령 정비본] 📑 관련법령 만들기 — 사건 하나에 쓰인 조문을 모두 발췌해 검토서 옆에 "관련법령_<사건명>.md"로(토큰 0).
  //  세무사님 말씀(원문): "최종보고서에는 들어가지 않더라도 보고서 작성에 관련되는 모든 법령을 발췌하여 참조법령을 보고서와 별도로 작성하면
  //  보고서 검토에 시간이 절약되잖아", "검토서 작성시 관련법령 이라는 파일이 대부분 필요한데, 이것이 쉬워지잖아"
  //  모으는 곳: 사건 폴더 내부보고서의 검토서·보고서(.md) 본문 인용(「…」 제N조·소득세법 §95② 꼴), 세액계산 결과에 남은 근거(§), 법령 탭 첨부(직접·AI).
  //  판: 사건 기준일(양도일·증여일·상속개시일)에 시행된 판 — 법령 정비본(없으면 법제처 그 날짜 판). 기준일이 없으면 현행판으로 대신하고 "확인 필요".
  //  조문마다 "→ 쓰인 곳"(문서 제목 아래 몇 번째 절인지·계산·첨부)을 적는다. 순서: 법 → 시행령 → 시행규칙, 같은 조문은 한 번.
  // ============================================================
  var LSI_REL_ALIAS_ = [
    ['소득세법 시행령', /^(소득세법\s*시행령|소득령|소득세법시행령)$/], ['소득세법 시행규칙', /^(소득세법\s*시행규칙|소득칙|소득규칙)$/], ['소득세법', /^(소득세법|소법)$/],
    ['상속세 및 증여세법 시행령', /^(상속세\s*및\s*증여세법\s*시행령|상증령|상증(세)?법\s*시행령)$/], ['상속세 및 증여세법 시행규칙', /^(상속세\s*및\s*증여세법\s*시행규칙|상증칙|상증규칙)$/], ['상속세 및 증여세법', /^(상속세\s*및\s*증여세법|상증세법|상증법)$/],
    ['조세특례제한법 시행령', /^(조세특례제한법\s*시행령|조특령|조특법\s*시행령)$/], ['조세특례제한법 시행규칙', /^(조세특례제한법\s*시행규칙|조특칙|조특규칙)$/], ['조세특례제한법', /^(조세특례제한법|조특법)$/],
    ['국세기본법 시행령', /^(국세기본법\s*시행령|국기령)$/], ['국세기본법 시행규칙', /^(국세기본법\s*시행규칙|국기칙)$/], ['국세기본법', /^(국세기본법|국기법)$/],
    ['국세징수법 시행령', /^(국세징수법\s*시행령|국징령)$/], ['국세징수법', /^(국세징수법|국징법)$/], ['농어촌특별세법 시행령', /^농어촌특별세법\s*시행령$/], ['농어촌특별세법', /^(농어촌특별세법|농특세법)$/]
  ];
  var LSI_REL_NAMES_RE_ = '(?:소득세법\\s*시행령|소득세법\\s*시행규칙|소득세법|소득령|소득칙|소득규칙|상속세\\s*및\\s*증여세법\\s*시행령|상속세\\s*및\\s*증여세법\\s*시행규칙|상속세\\s*및\\s*증여세법|상증세법|상증법|상증령|상증칙|상증규칙|조세특례제한법\\s*시행령|조세특례제한법\\s*시행규칙|조세특례제한법|조특법|조특령|조특칙|조특규칙|국세기본법\\s*시행령|국세기본법\\s*시행규칙|국세기본법|국기법|국기령|국세징수법\\s*시행령|국세징수법|국징법|농어촌특별세법\\s*시행령|농어촌특별세법|농특세법)';
  function lsiRelLaw_(name){
    var n = String(name || '').replace(/\s+/g, ' ').trim();
    for (var i = 0; i < LSI_REL_ALIAS_.length; i++) if (LSI_REL_ALIAS_[i][1].test(n)) return LSI_REL_ALIAS_[i][0];
    return n;
  }
  function lsiRelFamily_(law){ return String(law).replace(/\s*(시행령|시행규칙)$/, ''); }
  function lsiRelRank_(law){ return /시행규칙$/.test(law) ? 2 : /시행령$/.test(law) ? 1 : 0; }
  // 글에서 조문 인용 뽑기 — [{law, art, hang, ho, at(글자 위치)}]. "시행령 §155"·"영 §155"처럼 법 이름 없이 오면 바로 앞에 나온 법의 시행령으로.
  function lsiRelScan_(text, defLaw){
    var out = [], s = String(text || ''), last = defLaw || ''; // 법 이름 없이 시작하면(시행령§176의2) 사건 세목의 법으로
    var re = new RegExp('「([^」]{2,40})」\\s*제\\s*(\\d+)\\s*조(?:\\s*의\\s*(\\d+))?(?:\\s*제\\s*(\\d+)\\s*항)?(?:\\s*제\\s*(\\d+)\\s*호)?' +
      '|(' + LSI_REL_NAMES_RE_ + ')\\s*(?:§\\s*|제\\s*)(\\d+)\\s*(?:조)?(?:\\s*의\\s*(\\d+))?\\s*([①-⑳])?(?:\\s*(\\d+)\\s*호)?' +
      '|(?:^|[\\s(·,])(시행령|시행규칙|영|령|규칙)\\s*§\\s*(\\d+)(?:\\s*의\\s*(\\d+))?\\s*([①-⑳])?', 'g');
    var m;
    while ((m = re.exec(s))){
      var law, art, hang = 0, ho = 0;
      if (m[1]){ law = lsiRelLaw_(m[1]); art = m[2] + (m[3] ? '의' + m[3] : ''); hang = +m[4] || 0; ho = +m[5] || 0; }
      else if (m[6]){ law = lsiRelLaw_(m[6]); art = m[7] + (m[8] ? '의' + m[8] : ''); hang = m[9] ? m[9].charCodeAt(0) - 0x2460 + 1 : 0; ho = +m[10] || 0; }
      else { if (!last) continue; var fam = lsiRelFamily_(last), k = m[11]; law = fam + (/규칙/.test(k) ? ' 시행규칙' : ' 시행령'); art = m[12] + (m[13] ? '의' + m[13] : ''); hang = m[14] ? m[14].charCodeAt(0) - 0x2460 + 1 : 0; }
      last = law;
      out.push({ law: law, art: art, hang: hang, ho: ho, at: m.index });
    }
    return out;
  }
  // 그 위치 바로 위의 마크다운 제목(# …) — "쓰인 곳"
  function lsiRelHeading_(md, at){
    var head = String(md).slice(0, at).split('\n').filter(function(l){ return /^#{1,4}\s/.test(l); }).pop();
    return head ? head.replace(/^#+\s*/, '').trim().slice(0, 40) : '';
  }
  // 조문 하나 → 마크다운(관계법령 모양). hangs: 고를 항 번호들(비면 조 전체), 뺀 항은 "(생략)"
  function lsiRelArtMd_(a, hangs){
    var L = [], line = function(lv, s){ var t = String(s).replace(LSI_CITE_REV_, '').trim(); if (t) L.push(new Array(lv + 1).join('　') + t + '  '); };
    var segs = function(text, lv0){
      lsiCiteSegs_(text, lv0).forEach(function(g){
        if (g.k === 't'){ line(g.lv, g.s); return; }
        if (g.lines.length){ g.lines.forEach(function(x){ L.push('> ' + x + '  '); }); return; }
        if (g.box.length){
          var tb = lsiCiteBoxTable_(g.box);
          if (tb.cap.length) line(g.lv, tb.cap.join(' '));
          if (tb.cols > 1){ L.push('', '| ' + tb.rows[0].join(' | ') + ' |', '|' + tb.rows[0].map(function(){ return '---'; }).join('|') + '|'); tb.rows.slice(1).forEach(function(r){ L.push('| ' + r.join(' | ') + ' |'); }); L.push(''); }
          else { L.push(''); g.box.filter(function(l){ return !/^[\s┌└─┐┘]+$/.test(l); }).forEach(function(l){ var t = l.replace(/^\s*│|│\s*$/g, '').trim(); if (t) L.push('> ' + t + '  '); }); L.push(''); }
          return;
        }
        L.push('[그림 산식 — 판독 대기](https://www.law.go.kr/LSW/flDownload.do?flSeq=' + g.id + ')  ');
      });
    };
    segs(a.rest, 0);
    var pick = hangs && hangs.length ? hangs : null, skipped = [];
    var flush = function(){ if (skipped.length){ line(0, (skipped.length > 1 ? skipped[0] + '~' + skipped[skipped.length - 1] : skipped[0]) + ' (생략)'); skipped = []; } };
    a.hangs.forEach(function(h){
      if (pick && h.n && pick.indexOf(h.n) === -1){ skipped.push(h.mark || '·'); return; }
      flush(); segs(h.text, 0); h.ho.forEach(function(o){ segs(o.text, 1); });
    });
    flush();
    return L;
  }
  function lsiRelSafeName_(s){ return String(s || '').replace(/[\\/:*?"<>|]/g, '_').trim(); }
  // 만들기 — c: 사건(work_get_cases 행), onStep(글): 진행 표시. 돌려줌 {ok, name, fileId, 조문수, 대신함, 예규, 실패}
  function lsiRelMake_(c, onStep){
    var say = function(t){ if (onStep) try { onStep(t); } catch (e) {} };
    if (!c || !c.id) return Promise.resolve({ ok: false, error: '사건을 먼저 고르세요.' });
    var defLaw = { transfer: '소득세법', gift: '상속세 및 증여세법', inheritance: '상속세 및 증여세법' }[c.세목] || '';
    var base = String(c.기준일 || '').replace(/\D/g, '').slice(0, 8), cites = {}, order = [], precs = [], texts = [];
    var add = function(law, art, hang, where){
      var k = law + '|' + art, e = cites[k];
      if (!e){ e = cites[k] = { law: law, art: art, hangs: [], whole: false, uses: [] }; order.push(k); }
      if (hang){ if (e.hangs.indexOf(hang) === -1) e.hangs.push(hang); } else e.whole = true;
      if (where && e.uses.indexOf(where) === -1) e.uses.push(where);
    };
    say('사건 폴더 읽는 중…');
    return callGas('get_case_subfolders', { caseId: c.id }).then(function(sub){
      if (!sub || sub.error || !sub.internalFolderId) throw new Error((sub && sub.error) || '사건 폴더를 찾지 못했습니다.');
      return callGas('listFolder', { folderId: sub.internalFolderId }).then(function(ls){
        var files = ((ls && ls.files) || []).filter(function(f){ return /\.md$/i.test(f.name) && !/^관련법령_/.test(f.name); });
        say('검토서·보고서 ' + files.length + '개 읽는 중…');
        return files.reduce(function(p, f){ return p.then(function(){ return callGas('readFile', { fileId: f.id }).then(function(d){ texts.push({ name: f.name.replace(/\.md$/i, ''), md: (d && d.content) || '' }); }, function(){}); }); }, Promise.resolve()).then(function(){ return { sub: sub, files: ls.files || [] }; });
      });
    }).then(function(ctx){
      // 1) 문서 본문 인용
      texts.forEach(function(t){ lsiRelScan_(t.md, defLaw).forEach(function(x){ var h = lsiRelHeading_(t.md, x.at); add(x.law, x.art, x.hang, t.name + (h ? ' 「' + h + '」' : '')); }); });
      // 2) 세액계산 결과에 남은 근거(§ 표기)
      var calc = Array.isArray(c.세액계산결과) ? c.세액계산결과 : (function(){ try { return JSON.parse(c.세액계산결과 || '[]'); } catch (e) { return []; } })();
      calc.slice(-3).forEach(function(r){ lsiRelScan_(JSON.stringify(r), defLaw).forEach(function(x){ add(x.law, x.art, x.hang, '세액계산 결과(' + (r.세목 || '') + ' ' + (r.계산일 || '') + ')'); }); });
      // 3) 법령 탭 첨부 — 조문은 그 조·항, 예규·판례는 뒤 절로
      (c.법령예규판례 || []).forEach(function(e){
        var who = e.첨부 === 'AI' ? 'AI 첨부' + (e.확인 ? '' : '(미확인)') : '직접 첨부';
        var use = who + (e.쓸곳 ? ' — 쓸 곳: ' + e.쓸곳 : '') + (e.이유 ? ' — ' + e.이유 : '');
        if (e.category === 'statute' && e.법령명 && e.조){ add(lsiRelLaw_(e.법령명), String(e.조), +e.항 || 0, use); return; }
        if (e.category === 'law') return; // 법령 이름만 첨부된 옛 항목 — 조문이 없어 뺀다
        precs.push({ e: e, use: use });
      });
      order.sort(function(a, b){ var x = cites[a], y = cites[b]; return lsiRelFamily_(x.law).localeCompare(lsiRelFamily_(y.law)) || lsiRelRank_(x.law) - lsiRelRank_(y.law) || (parseInt(x.art, 10) - parseInt(y.art, 10)) || x.art.localeCompare(y.art); });
      var got = [], i = 0;
      return order.reduce(function(p, k){
        return p.then(function(){
          var e = cites[k]; say('조문 읽는 중 ' + (++i) + '/' + order.length + ' — ' + e.law + ' 제' + e.art + '조');
          return callGas('law_lookup_article', { lawName: e.law, articleNo: e.art, baseDate: base }).then(function(r){ got.push({ e: e, r: r }); }, function(err){ got.push({ e: e, r: { error: String(err && err.message || err) } }); });
        });
      }, Promise.resolve()).then(function(){ return { ctx: ctx, got: got }; });
    }).then(function(o){
      var label = { transfer: '양도일', gift: '증여일', inheritance: '상속개시일' }[c.세목] || '기준일';
      var name = '관련법령_' + lsiRelSafeName_(c.사건명 || c.고객명 || c.id);
      var subst = 0, fail = 0, L = ['# 관련법령 — ' + (c.사건명 || c.고객명 || ''), ''];
      L.push('- 사건: ' + [c.고객명, c.사건명, c.업무유형].filter(Boolean).join(' · '));
      L.push('- ' + label + ': ' + (base ? lsiDbYmd_(base) + ' — 그 날 시행된 판으로 실었습니다' : '없음 — **현행판으로 대신함(확인 필요)**'));
      L.push('- 모은 곳: 문서 ' + texts.length + '개(' + texts.map(function(t){ return t.name; }).join(', ') + ') · 세액계산 결과 · 법령 탭 첨부');
      L.push('- 만든 때: ' + new Date().toLocaleString('ko-KR') + ' · 📑 관련법령 만들기(법령 정비본, 토큰 0) — 다시 만들면 이 파일을 새로 씁니다', '');
      var fam = '', body = [];
      o.got.forEach(function(g){
        var e = g.e, r = g.r || {}, art = e.art.replace(/^(\d+)의(\d+)$/, '$1조의$2').replace(/^(\d+)$/, '$1조');
        if (lsiRelFamily_(e.law) !== fam){ fam = lsiRelFamily_(e.law); body.push('', '## 「' + fam + '」 관계', ''); }
        if (!r.조문 || !r.조문.length){ fail++; body.push('### 「' + e.law + '」 제' + art, '> ⚠ 조문을 찾지 못함 — 확인 필요' + (r.error ? ' (' + r.error + ')' : ''), '> → ' + e.uses.join(' / '), ''); return; }
        var a = lsiCiteArt_(r.조문[0]), cur = !base || !r.시행일자;
        if (cur) subst++;
        body.push('### 「' + (r.법령명 || e.law) + '」 ' + a.label + (a.title ? '(' + a.title + ')' : '') + ' — ' + (r.시행일자 ? lsiDbYmd_(r.시행일자) + ' 시행' : '') + (cur ? ' **(현행판으로 대신함 — 확인 필요)**' : ''));
        // [2026.10.20 위원회 N14] 기준일 판이 낡은 연혁 글이면 서버가 대신 쓴 판과 경고를 같이 적는다
        if (r.경고) body.push('> ' + r.경고);
        if (r.판주의) body.push('> ※ ' + r.판주의);
        body.push('> → ' + e.uses.join(' / '), '');
        body = body.concat(lsiRelArtMd_(a, e.whole ? [] : e.hangs));
        if ((r.조문[0]['검증필요_코드에서옮김(근거 아님)'] || []).length) body.push('', '> ※ 이 조문의 산식 중 근거로 쓰지 않는 것이 있습니다(계산기 코드에서 옮김 — 법령 근거 아님).');
        body.push('');
      });
      L = L.concat(['- 조문 ' + o.got.length + '개' + (subst ? ' · 현행판으로 대신함 ' + subst + '건' : '') + (fail ? ' · 찾지 못함 ' + fail + '건' : '') + ' · 예규·판례 ' + precs.length + '건'], body);
      if (precs.length){
        L.push('', '## 관련 예규·판례', '');
        precs.forEach(function(p){ var e = p.e; L.push('- **[' + ((typeof LS_CATEGORY_LABELS_ !== 'undefined' && LS_CATEGORY_LABELS_[e.category]) || e.category) + '] ' + String(e.제목 || '').replace(/\n/g, ' ') + '**' + (e.번호 ? ' (' + e.번호 + ')' : '') + (e.결과 ? ' — ' + e.결과 : '')); if (e.요약) L.push('  ' + String(e.요약).replace(/\s+/g, ' ').slice(0, 300)); L.push('  → ' + p.use, ''); });
      }
      if (!o.got.length && !precs.length) L.push('', '(모은 조문이 없습니다 — 검토서·보고서에 「법령」 제N조나 소득세법 §95 꼴로 인용하거나, 법령 탭에서 조문을 사건에 첨부하세요.)');
      var md = L.join('\n').replace(/\n{3,}/g, '\n\n') + '\n';
