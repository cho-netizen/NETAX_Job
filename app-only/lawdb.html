<!-- [2026.10.19] 법령 정비본 원문 보기·인용 복사 — 앱(job.netax.kr/app)에만 들어간다(tools/build-app.js가 lawsearch.html의 자리 표시에 끼움). 서버(구글) 화면 사본에는 없다 — 서버 10MB 한도. -->
<style>
  .lsidb-bar{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .lsidb-toc{ max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:6px; padding:6px 10px; margin-top:8px; font-size:12.5px; }
  .lsidb-toc .h{ font-weight:600; color:var(--navy); margin-top:6px; }
  .lsidb-toc button{ background:none; border:none; padding:1px 0; color:var(--text, #222); cursor:pointer; text-align:left; display:block; }
  .lsidb-toc button.on{ color:var(--navy); font-weight:600; }
  .lsidb-doc{ margin-top:10px; font-size:14px; line-height:1.75; }
  .lsidb-head{ font-size:13px; color:var(--sub); margin-bottom:8px; }
  .lsidb-art{ border-top:1px solid var(--line); padding-top:8px; margin-top:8px; }
  .lsidb-t{ font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .lsidb-g{ position:relative; padding-right:44px; }
  .lsidb-g:hover{ background:rgba(0,0,0,.03); }
  .lsidb-l1{ padding-left:1.2em; } .lsidb-l2{ padding-left:2.4em; } .lsidb-l3{ padding-left:3.6em; }
  .lsidb-copy{ font-size:11px; padding:1px 6px; border:1px solid var(--line); border-radius:4px; background:#fff; cursor:pointer; color:var(--sub); }
  .lsidb-g > .lsidb-copy{ position:absolute; right:0; top:2px; visibility:hidden; }
  .lsidb-g:hover > .lsidb-copy{ visibility:visible; }
  .lsidb-box{ font-family:'D2Coding','Consolas','맑은 고딕',monospace; font-size:12px; line-height:1.35; white-space:pre; overflow-x:auto; background:#fafafa; border:1px solid var(--line); border-radius:4px; padding:6px; margin:4px 0; }
  .lsidb-img{ max-width:100%; border:1px solid var(--line); margin:4px 0; }
  .lsidb-fx{ background:#fff8e1; border-left:3px solid var(--gold); padding:2px 8px; margin:3px 0; }
  .lsidb-wait{ color:#a15c00; }
  .lsidb-ref{ color:var(--sub); font-size:12.5px; }
</style>
<script>
  // ============================================================
  // [2026.10.19 법령 정비본] [📜 법령] 탭 — 법령 원문을 법령정보시스템 모양으로 보기·복사.
  //  세무사님 말씀(원문): "내가 처음에 구상했던 것은 법령파일을 md파일로 만들어서 문서작성할때 처럼 법령정보시스템 모양으로 보여주는 것이었다.
  //  그렇게 하면 원본문서를 다른 곳으로 복사하여 인용하기도 좋고, 보기도 좋겠다는 생각이었지."
  //  자료: 드라이브 업무관리자/법령/_본문(서버 law_db_toc·law_lookup_article이 읽음 — 본문은 서버 코드에 없음). 판(시행일)을 고르면 그때 법령.
  //  [복사]는 조문 전체 또는 항 하나를 법령정보 모양 그대로(들여쓰기는 전각 공백) 클립보드에 넣는다. 로그인 전에는 서버를 부르지 않는다(열기 단추를 눌러야 읽음).
  // ============================================================
  var lsiDb_ = { laws: null, law: null, ver: null, toc: null, art: null };
  function lsiDbYmd_(s){ var m = String(s || '').match(/^(\d{4})(\d{2})(\d{2})$/); return m ? m[1] + '. ' + (+m[2]) + '. ' + (+m[3]) + '.' : String(s || ''); }
  function lsiDbOpen_(then){
    if (lsiDb_.laws){ if (then) then(); return; }
    document.getElementById('lsiDbBody').innerHTML = '<div class="lsi-note">법령 목록을 읽는 중…</div>';
    callGas('law_db_toc', {}).then(function(r){
      if (!r || r.error || !r.법령){ document.getElementById('lsiDbBody').innerHTML = '<div class="lsi-note">' + lsiEsc_((r && r.error) || '법령 정비본을 읽지 못했습니다.') + '</div>'; return; }
      lsiDb_.laws = r.법령;
      document.getElementById('lsiDbBar').innerHTML =
        '<select id="lsiDbLaw" aria-label="법령 고르기">' + r.법령.map(function(l){ return '<option value="' + lsiEsc_(l.키) + '">' + lsiEsc_(l.이름 + (l.범위 === '조회만' ? ' (지방세 — 조회만)' : '')) + '</option>'; }).join('') + '</select>' +
        '<select id="lsiDbVer" aria-label="판(시행일) 고르기"></select>' +
        '<span>제</span><input type="text" id="lsiDbNo" style="width:80px;" placeholder="예: 95, 97의2" aria-label="조문 번호"><span>조</span>' +
        '<button type="button" class="btn" id="lsiDbGo">보기</button>' +
        '<button type="button" class="ghost-btn" id="lsiDbPrev">◀ 앞 조</button><button type="button" class="ghost-btn" id="lsiDbNext">뒤 조 ▶</button>' +
        '<span class="lsi-note" style="margin-left:8px;">복사 모양</span><select id="lsiDbOptStyle" aria-label="복사 모양"><option value="rel">관계법령(결정문) 모양</option><option value="plain">본문만</option></select>' +
        '<select id="lsiDbOptTo" aria-label="붙일 곳" title="붙일 프로그램에 맞춰 들여쓰기를 만듭니다"><option value="doc">워드·구글 문서·보고서 화면에 붙이기</option><option value="hwp">한글에 붙이기</option></select><label class="lsi-note"><input type="checkbox" id="lsiDbOptSrc" checked> 출처 줄</label><label class="lsi-note"><input type="checkbox" id="lsiDbOptRev"> &lt;개정&gt; 꼬리표</label>';
      // 복사 고르기는 이 기기에 기억(편의용)
      try { var sv = JSON.parse(localStorage.getItem('lsiCiteOpts') || 'null'); if (sv){ document.getElementById('lsiDbOptStyle').value = sv.style || 'rel'; document.getElementById('lsiDbOptSrc').checked = sv.src !== false; document.getElementById('lsiDbOptRev').checked = !!sv.rev; if (sv.to) document.getElementById('lsiDbOptTo').value = sv.to; } } catch (e) {}
      ['lsiDbOptStyle', 'lsiDbOptTo', 'lsiDbOptSrc', 'lsiDbOptRev'].forEach(function(id){ document.getElementById(id).addEventListener('change', function(){ try { localStorage.setItem('lsiCiteOpts', JSON.stringify(lsiCiteOpts_())); } catch (e) {} }); });
      document.getElementById('lsiDbLaw').addEventListener('change', function(){ lsiDbPickLaw_(this.value); });
      document.getElementById('lsiDbVer').addEventListener('change', function(){ lsiDb_.ver = this.value; lsiDbToc_(); });
      document.getElementById('lsiDbGo').addEventListener('click', function(){ lsiDbShow_(document.getElementById('lsiDbNo').value); });
      document.getElementById('lsiDbNo').addEventListener('keydown', function(e){ if (e.key === 'Enter') lsiDbShow_(this.value); });
      document.getElementById('lsiDbPrev').addEventListener('click', function(){ lsiDbStep_(-1); });
      document.getElementById('lsiDbNext').addEventListener('click', function(){ lsiDbStep_(1); });
      document.getElementById('lsiDbBody').innerHTML = '<div id="lsiDbTocBox"></div><div id="lsiDbDoc" class="lsidb-doc"></div>';
      lsiDbPickLaw_(r.법령[0].키, then);
    }).catch(function(e){ document.getElementById('lsiDbBody').innerHTML = '<div class="lsi-note">법령 목록을 읽지 못했습니다: ' + lsiEsc_(e && e.message || e) + '</div>'; });
  }
  function lsiDbPickLaw_(key, then){
    var l = lsiDb_.laws.filter(function(x){ return x.키 === key; })[0]; if (!l) return;
    lsiDb_.law = l; lsiDb_.ver = l.현행;
    document.getElementById('lsiDbLaw').value = key;
    // [2026.10.20] 옛 판(2014~ 연혁)이 법령마다 수십~백여 개 — 현행·시행예정과 옛판을 나눠 묶는다
    var opt = function(p){ return '<option value="' + lsiEsc_(p.판) + '"' + (p.판 === l.현행 ? ' selected' : '') + '>' + lsiEsc_(lsiDbYmd_(p.시행일) + ' 시행 (' + (p.상태 || '') + ', 제' + String(p.공포번호).replace(/^0+/, '') + '호)' + (p.낡은글 ? ' ⚠ 낡은 연혁 글 — 늦게 공포된 판 글로 보임' : '')) + '</option>'; };
    var vs = l.판.slice().reverse(), now = vs.filter(function(p){ return p.상태 !== '옛판'; }), old = vs.filter(function(p){ return p.상태 === '옛판'; });
    document.getElementById('lsiDbVer').innerHTML = '<optgroup label="현행·시행예정">' + now.map(opt).join('') + '</optgroup>' + (old.length ? '<optgroup label="옛 판 ' + old.length + '개(연혁 — 양도일·증여일 당시 법)">' + old.map(opt).join('') + '</optgroup>' : '');
    lsiDbToc_(then);
  }
  function lsiDbToc_(then){
    var box = document.getElementById('lsiDbTocBox'); box.innerHTML = '<div class="lsi-note">차례를 읽는 중…</div>';
    callGas('law_db_toc', { lawName: lsiDb_.law.키, ver: lsiDb_.ver }).then(function(r){
      if (!r || r.error || !r.조){ box.innerHTML = '<div class="lsi-note">' + lsiEsc_((r && r.error) || '차례를 읽지 못했습니다.') + '</div>'; return; }
      lsiDb_.toc = r.조;
      var heads = {}; (r.머리 || []).forEach(function(h){ heads[h.앞] = h.글; });
      box.innerHTML = '<details' + (lsiDb_.art ? '' : ' open') + '><summary class="lsi-note" style="cursor:pointer;">차례 (' + r.조.length + '개 조) — 누르면 그 조를 봅니다</summary><div class="lsidb-toc">' +
        r.조.map(function(a){ return (heads[a[0]] || []).map(function(h){ return '<div class="h">' + lsiEsc_(h) + '</div>'; }).join('') +
          '<button type="button" data-lsidbart="' + lsiEsc_(a[0]) + '">제' + lsiEsc_(a[0].replace(/^(\d+)의(\d+)$/, '$1조의$2').replace(/^(\d+)$/, '$1조')) + ' ' + lsiEsc_(a[1] || '') + '</button>'; }).join('') + '<div class="h">부칙</div><button type="button" data-lsidbbu="1">📜 부칙 — 적용례·경과조치(이 판 공포일까지, 최근 것부터)</button>' +
          ((r.별표 || []).length ? '<div class="h">별표·서식 ' + r.별표.length + '개</div>' + r.별표.map(function(b){ return '<button type="button" data-lsidbbyul="' + lsiEsc_(b[0]) + '" data-lsidbbyulk="' + lsiEsc_(b[1] || '') + '">[' + lsiEsc_((b[1] || '별표') + ' ' + b[0]) + '] ' + lsiEsc_(b[2] || '') + '</button>'; }).join('') : '') + '</div></details>';
      var bu = box.querySelector('[data-lsidbbu]'); if (bu) bu.addEventListener('click', lsiDbBuchik_);
      box.querySelectorAll('[data-lsidbbyul]').forEach(function(b){ b.addEventListener('click', function(){ lsiDbByul_(b.dataset.lsidbbyul, b.dataset.lsidbbyulk); }); });
      box.querySelectorAll('[data-lsidbart]').forEach(function(b){ b.addEventListener('click', function(){ lsiDbShow_(b.dataset.lsidbart); }); });
      if (then) then(); else if (lsiDb_.art) lsiDbShow_(lsiDb_.art);
    }).catch(function(e){ box.innerHTML = '<div class="lsi-note">차례를 읽지 못했습니다: ' + lsiEsc_(e && e.message || e) + '</div>'; });
  }
  // [2026.10.20] 📜 부칙 — 서버 law_lookup_article(articleNo '부칙', 그 판 시행일). 이월과세 증여자 사망처럼 "언제부터 적용하는가"를 보는 곳
  function lsiDbBuchik_(){
    var doc = document.getElementById('lsiDbDoc'), l = lsiDb_.law, p = l.판.filter(function(x){ return x.판 === lsiDb_.ver; })[0];
    doc.innerHTML = '<div class="lsi-note">부칙을 읽는 중…</div>';
    callGas('law_lookup_article', { lawName: l.이름, articleNo: '부칙', baseDate: p ? p.시행일 : '' }).then(function(r){
      if (!r || r.error || !r.부칙){ doc.innerHTML = '<div class="lsi-note">' + lsiEsc_((r && r.error) || '부칙을 읽지 못했습니다.') + '</div>'; return; }
      doc.innerHTML = '<div class="lsidb-head"><b>' + lsiEsc_(r.법령명) + '</b> 부칙 — ' + (p ? lsiEsc_(lsiDbYmd_(p.시행일)) + ' 시행판 공포일까지 ' : '') + r.전체 + '개 중 최근 ' + r.부칙.length + '개</div>' +
        r.부칙.map(function(b){ return '<div class="lsidb-art" style="margin:8px 0;"><b>부칙 &lt;제' + lsiEsc_(String(b.공포번호).replace(/^0+/, '')) + '호, ' + lsiEsc_(lsiDbYmd_(b.공포일)) + '&gt;</b><div style="white-space:pre-wrap;">' + lsiEsc_(String(b.내용 || '').replace(/^부칙\s*<[^>]*>\s*/, '')) + '</div></div>'; }).join('') +
        (r.전체 > r.부칙.length ? '<div class="lsi-note">더 옛 부칙은 위 판 고르기에서 옛 판을 고르면 그 판 공포일까지 다시 보입니다.</div>' : '');
    }).catch(function(e){ doc.innerHTML = '<div class="lsi-note">부칙을 읽지 못했습니다: ' + lsiEsc_(e && e.message || e) + '</div>'; });
  }
  // [2026.10.20] 별표·서식 — 서버 law_lookup_article(articleNo "별표 N"), 본문 글(법제처가 글로 준 것)과 원본 PDF
  function lsiDbByul_(no, kind){
    var doc = document.getElementById('lsiDbDoc'), l = lsiDb_.law, p = l.판.filter(function(x){ return x.판 === lsiDb_.ver; })[0];
    doc.innerHTML = '<div class="lsi-note">별표를 읽는 중…</div>';
    callGas('law_lookup_article', { lawName: l.이름, articleNo: '별표 ' + no, baseDate: p && p.판 !== l.현행 ? p.시행일 : '' }).then(function(r){
      var list = (r && r.별표) || [];
      if (!list.length){ doc.innerHTML = '<div class="lsi-note">' + lsiEsc_((r && r.error) || '별표를 읽지 못했습니다.') + '</div>'; return; }
      var bs = list.filter(function(b){ return !kind || b.구분 === kind; }); if (!bs.length) bs = list;
      doc.innerHTML = bs.map(function(b){ return '<div class="lsidb-head"><b>' + lsiEsc_(r.법령명) + '</b> [' + lsiEsc_((b.구분 || '별표') + ' ' + b.번호) + '] ' + lsiEsc_(b.제목 || '') + (b.시행 ? ' (' + lsiEsc_(lsiDbYmd_(b.시행)) + ' 시행)' : '') + (b.pdf ? ' <a href="https://www.law.go.kr/LSW/flDownload.do?flSeq=' + lsiEsc_(b.pdf) + '" target="_blank" rel="noopener">원본 PDF ↗</a>' : '') + '</div>' +
        (b.내용 ? '<pre style="white-space:pre-wrap;font-size:12px;overflow-x:auto;">' + lsiEsc_(b.내용) + '</pre>' : '<div class="lsi-note">본문 글이 없는 별표(그림·표) — 원본 PDF를 여세요.</div>'); }).join('');
    }).catch(function(e){ doc.innerHTML = '<div class="lsi-note">별표를 읽지 못했습니다: ' + lsiEsc_(e && e.message || e) + '</div>'; });
  }
  function lsiDbStep_(d){
    if (!lsiDb_.toc || !lsiDb_.art) return;
    var i = lsiDb_.toc.map(function(a){ return a[0]; }).indexOf(lsiDb_.art), n = lsiDb_.toc[i + d];
    if (n) lsiDbShow_(n[0]);
  }
  // ---------- 인용 복사 (세무사님 "보고서 작성시 법령을 인용할 때가 있는데, 매번 복사하여 원문 비슷하게 편집하는 것도 이젠 지겹다. 그렇다고 화면복사로 붙이기에는 성의가 없어보이고 말야",
  //  "불복시 가장 많이 보이는 참조법령 문단처럼 보고서에서도 필요하면 그 정도는 아니지만 모양을 갖춰서 인용을 해야 한다")
  //  붙여 넣는 순간 손볼 데가 없게: 서식 있는 글(text/html — 한글·워드·구글 문서) + 일반 글(text/plain)을 함께 담는다.
  //  모양: 관계법령(불복 결정문의 "관계법령" 문단 — 「법령명」 제N조(제목) 머리줄 + 해당 항·호만 들여쓰기, 뺀 곳은 "(생략)") / 본문만.
  //  단위: 조 전체·항 하나·호 하나. 출처 줄·<개정 …> 꼬리표는 고른다(보고서엔 보통 꼬리표를 뺌). 그림 산식은 글로 옮긴 식 또는 표로(그림은 안 붙임).
  //  lsiCite*는 관련법령(검토서·보고서용 발췌) 만들기에서도 그대로 쓴다.
  var LSI_CITE_REV_ = /\s*<\s*(개정|신설|전문개정|타법개정|본조신설|제목개정|일부개정)[^>]*>/g;
  function lsiCiteOpts_(){
    var g = function(id, d){ var e = document.getElementById(id); return e ? (e.type === 'checkbox' ? e.checked : e.value) : d; };
    return { src: g('lsiDbOptSrc', true), rev: g('lsiDbOptRev', false), style: g('lsiDbOptStyle', 'rel'), to: g('lsiDbOptTo', 'doc') };
  }
  // 글 덩어리 → 조각들: 글줄 {k:'t', lv, s} / 산식 {k:'fx', head, lines, box, id}
  function lsiCiteSegs_(text, lv0){
    var lines = String(text || '').split('\n'), out = [], i;
    var isBox = function(s){ return s !== undefined && /^[│┌└├┬┴┼─┐┘┤\s]/.test(s) && /[│┌└─]/.test(s); };
    for (i = 0; i < lines.length; i++){
      var l = lines[i], m = l.match(/^\s*〔산식 그림 img(\d+)〕\s*$/);
      if (!m){ if (l.trim()) out.push({ k: 't', lv: i === 0 ? lv0 : lsiDbLevel_(l, lv0 >= 1), s: l.trim() }); continue; }
      var fx = [], box = [], head = '';
      if (/^〔산식 보정/.test(lines[i + 1] || '')){ head = lines[++i].replace(/^〔|〕$/g, ''); while (i + 1 < lines.length && lines[i + 1].trim() && !isBox(lines[i + 1]) && !/^\s*〔산식 그림/.test(lines[i + 1]) && !(lines[i + 1].trim().length <= 20 && isBox(lines[i + 2]))) fx.push(lines[++i].trim()); }
      while (i + 1 < lines.length && (isBox(lines[i + 1]) || (lines[i + 1].trim().length <= 20 && isBox(lines[i + 2])))) box.push(lines[++i]);
      out.push({ k: 'fx', id: m[1], head: head, lines: fx, box: box, lv: lv0 });
    }
    return out;
  }
  // 법제처 글자상자 → 표 [[칸,…],…] (칸 나누기 │, 가로줄 ├─┼ 은 행 나눔). 칸 하나뿐이면 산식 상자(줄 목록)
  function lsiCiteBoxTable_(box){
    var cap = [], rows = [], cur = null, cols = 0;
    box.forEach(function(l){
      var t = l.replace(/\s+$/, '');
      if (/^[\s┌└├┬┴┼─┐┘┤]+$/.test(t)){ if (/[├┼┤]/.test(t) || /^[\s┌┬─┐]+$/.test(t) || /^[\s└┴─┘]+$/.test(t)){ if (cur) rows.push(cur); cur = null; } return; }
      if (t.indexOf('│') < 0){ if (t.trim()) cap.push(t.trim()); return; }
      var parts = t.split('│'); parts = parts.slice(1, parts.length - 1);
      if (/[├┤┼─]/.test(t)) { if (cur) rows.push(cur); cur = null; parts = parts.map(function(p){ return /^[─\s├┤┼]*$/.test(p) ? '' : p; }); }
      cols = Math.max(cols, parts.length);

  //  위 "사건을 선택하세요"에서 고른 사건에, 그 사건 기준일 판의 그 조(또는 항) 원문·판·쓸 곳을 저장한다(category 'statute').
  //  관련법령 파일(→ 쓰인 곳 "직접 첨부"), 검토서 근거, AI 지휘가 이 항목을 읽는다.
  function lsiDbAttach_(a, h, meta){
    var c = typeof lsCurrentCase !== 'undefined' ? lsCurrentCase : null;
    if (!c){ alert('위 "사건을 선택하세요"에서 사건을 먼저 고르세요.'); return; }
    var hang = h >= 0 ? (a.hangs[h].n || 0) : 0, art = a.label.replace(/^제/, '').replace('조', ''), law = meta.law;
    var ref = '「' + law + '」 ' + a.label + (hang ? '제' + hang + '항' : '');
    var use = window.prompt(ref + ' — 어디에 쓸 자료인가요? 쟁점이나 계산 칸을 적어 주세요(비워도 됩니다).', '');
    if (use === null) return;
    var base = String(c.기준일 || '').replace(/\D/g, '').slice(0, 8), target = c;
    callGas('law_lookup_article', { lawName: law, articleNo: art, baseDate: base }).then(function(r){
      if (!r || r.error || !r.조문 || !r.조문.length){ showToast('조문을 읽지 못했습니다: ' + ((r && r.error) || ''), 'error'); return; }
      var a2 = lsiCiteArt_(r.조문[0]);
      var md = typeof lsiRelArtMd_ === 'function' ? lsiRelArtMd_(a2, hang ? [hang] : []).join('\n') : lsiCiteBuild_(a2, { h: h, o: -1 }, meta, { style: 'plain', src: false, rev: false }).plain;
      var id = law + '|' + art + '|' + (hang || '');
      var entry = { category: 'statute', id: id, 제목: ref + (a2.title ? '(' + a2.title + ')' : ''), 요약: md.replace(/\s+/g, ' ').slice(0, 300), 법령명: law, 조: art, 항: hang || '',
        판: r.시행일자 ? lsiDbYmd_(r.시행일자) : '', 기준일판: !!base, 원문: md.slice(0, 6000), 쓸곳: String(use || '').trim(), 첨부: '직접', 첨부일: new Date().toISOString().slice(0, 10) };
      var list = (target.법령예규판례 || []).filter(function(e){ return !(e.category === 'statute' && e.id === id); }).concat([entry]);
      lsSaveAttachments_(list, target).then(function(ok){ if (ok) showToast(ref + ' 첨부했습니다' + (base ? ' (' + entry.판 + ' 시행판)' : ' — 사건 기준일이 없어 현행판'), 'success'); });
    });
  }
  // 다른 곳(조문으로 찾아보기 등)에서 "이 조문 원문"으로 열기
  function lsiDbJump_(lawName, art){
    var key = String(lawName || '').replace(/\s/g, '');
    lsiDbOpen_(function(){
      var has = lsiDb_.laws.some(function(l){ return l.키 === key; });
      if (!has){ document.getElementById('lsiDbDoc').innerHTML = '<div class="lsi-note">' + lsiEsc_(lawName) + '은(는) 법령 정비본에 없습니다(법제처 원문 링크를 이용해 주세요).</div>'; return; }
      lsiDb_.art = art;
      // 다른 곳에서 넘어오면 늘 현행판으로(앞서 골라 둔 옛 판·예정판이 남지 않게)
      if (lsiDb_.law && lsiDb_.law.키 === key && lsiDb_.toc && lsiDb_.ver === lsiDb_.law.현행) lsiDbShow_(art); else lsiDbPickLaw_(key, function(){ lsiDbShow_(art); });
    });
    var c = document.getElementById('lsiDbCard'); if (c && c.scrollIntoView) c.scrollIntoView({ block: 'start' });
  }
  document.getElementById('lsiDbOpen').addEventListener('click', function(){ lsiDbOpen_(); });
  // "조문으로 찾아보기" 결과 아래에 원문 보기 단추를 붙인다(그쪽 코드는 건드리지 않음 — 그쪽 보기가 먼저 그린 뒤에 덧붙임)
  document.getElementById('lsiArtGo').addEventListener('click', function(){
    var law = document.getElementById('lsiArtLaw').value, art = String(document.getElementById('lsiArtNo').value || '').replace(/^제\s*/, '').replace(/\s*조\s*/, '').replace(/\s/g, '');
    var box = document.getElementById('lsiArtResult');
    if (!/^\d+(의\d+)?$/.test(art) || !box) return;
    var b = document.createElement('button'); b.type = 'button'; b.className = 'lsi-link'; b.textContent = '📖 이 조문 원문 보기(법령정보 모양·복사)';
    b.addEventListener('click', function(){ lsiDbJump_(law, art); });
    var d = document.createElement('div'); d.style.marginTop = '6px'; d.appendChild(b); box.appendChild(d);
  });
</script>
