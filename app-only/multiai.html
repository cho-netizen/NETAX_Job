<style>

<script>
  // ============================================================
  // [2026.10.19] 🤝 멀티 AI 사이드바 — 질문 하나를 여러 AI 칸에 동시에(웹 AI는 복사·사이트 열기·답 붙여넣기, API는 켜면 자동) → 비교표 → 세무사님이 고름.
  //  세무사님 말씀(원문): "이 ai연합체를 시스템업그레이드와 법령검색 양쪽에 활용하자는 것이다. 멀티ai사이드바 라는 것을 보고 여러ai들을 동시에 활용하는 방안을 생각한 것이었다."
  //                       "일단 api없이 해보고, 무료api가 있다고 하면 추후 보완할께"
  //  - 웹 AI(B 등급)는 약관상 자동 질의·자동 답 수집 금지(docs/ai-federation.md 2절) → 칸마다 "📋 복사·열기"(한 번 누를 때 창 하나 — 팝업 차단 안 걸림),
  //    "▶ 다음 웹 AI" 단추로 차례대로. 보내기는 세무사님이 그 사이트에서 누르고, 답을 칸에 붙여 넣는다.
  //    주소에 질문을 미리 넣는 방식(?q=)은 쓰지 않는다 — 질문지(조문 원문 포함)가 주소 길이 한도를 넘고, 일부 사이트는 ?q=로 바로 보내 버려 "보내기는 세무사님이"와 어긋남.
  //  - API 칸: A 무료(설정 🔑에 키가 들어오면 바로 자동 칸, 0원)·C 유료(Claude·Gemini — 기본 꺼짐, 켜면 건당 예상 비용 확인 후 보냄). 서버 ai_ask_slots(Federation.js).
  //  - 법령 쪽(mode 'law'): 답에서 결론(가/나)·근거 조문·판례·예규 번호를 규칙으로 뽑고(토큰 0) 법제처에 실제로 있는지 확인(실재 ✔ / 못 찾음 ⚠ / 확인 못 함 ?).
  //    시스템 쪽(mode 'system'): 같은 방식, 근거 확인 없이 결론끼리 묶기만.
  //  열기: nxMultiAi_.open({ mode, title, head, law, choices, defLaw, saved, decided, onAnswer, onCheck, onDecide, storeKey })
  // ============================================================
  var MAI_WEB_FALLBACK_ = [ // 명단(ai_registry)을 못 받을 때만 — Federation.js AI_REGISTRY_ B 등급과 같게
    { id: 'web-chatgpt', name: 'ChatGPT(웹)', url: 'https://chatgpt.com/' }, { id: 'web-gemini', name: 'Gemini(웹)', url: 'https://gemini.google.com/app' },
    { id: 'web-claude', name: 'Claude(웹)', url: 'https://claude.ai/new' }, { id: 'web-copilot', name: 'Copilot(웹)', url: 'https://copilot.microsoft.com/' },
    { id: 'web-perplexity', name: 'Perplexity(웹)', url: 'https://www.perplexity.ai/' }, { id: 'web-deepseek', name: 'DeepSeek(웹)', url: 'https://chat.deepseek.com/' },
    { id: 'web-grok', name: 'Grok(웹)', url: 'https://grok.com/' }, { id: 'web-clovax', name: '클로바X(웹)', url: 'https://clova-x.naver.com/' }];
  var MAI_KRW_ = 1400, MAI_OUT_TOKENS_ = 1200;
  var mai_ = null; // 지금 열린 사이드바 상태
  var maiVerifyCache_ = {}; // 근거 실재 확인 결과(같은 번호를 두 번 묻지 않음)
  function maiEsc_(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function maiToast_(m){ if (typeof showToast === 'function') showToast(m); else if (typeof toast === 'function') toast(m); }
  function maiSheet_(){ return mai_.head + (mai_.law ? '\n\n' + mai_.law + '\n\n※ 답은 위 "답 형식" 그대로 적어 주세요.' : ''); }
  // ---- 답에서 뽑기(규칙, 토큰 0) ----
  var MAI_COURT_ = '재두|재누|구합|구단|가합|가단|카합|헌바|헌마|헌가|두|누|구|다|나|도|노|후|허|머|추';
  function maiNums_(t){
    var out = [], seen = {}, m, add = function(kind, label, q){ var k = kind + '|' + q; if (seen[k]) return; seen[k] = 1; out.push({ 종류: kind, 번호: String(label).replace(/\s+/g, ' ').trim(), q: q }); };
    var re1 = new RegExp('((?:대법원|헌법재판소|[가-힣]{2,10}법원)[\\s-]*)?(\\d{2,4})[\\s-]*(' + MAI_COURT_ + ')[\\s-]*(\\d{1,6})(?![\\d가-힣])', 'g');
    while ((m = re1.exec(t))) add(/^헌/.test(m[3]) ? '헌재' : '판례', m[0], m[2] + m[3] + m[4]);
    var re2 = /(조심|국심)[\s-]*(\d{4})[\s-]*([가-힣]{1,2})[\s-]*(\d{1,6})/g;
    while ((m = re2.exec(t))) add('심판례', m[0], m[1] + m[2] + m[3] + m[4]);
    var re3 = /(서면|사전|법규|기준|심사|재산세제과|재산세과|부동산납세과|부동산거래관리과|조세법령운용과|법령해석과)[-\s]*(?:[가-힣\d]+-){0,4}\d{3,}/g; // 서면-2020-상속증여-1234처럼 끝 번호까지
    while ((m = re3.exec(t))) add('예규', m[0], m[0].replace(/\s+/g, ''));
    return out.slice(0, 20);
  }
  function maiParse_(text){
    var t = String(text || ''), r = { 결론: '', 결론글: '', 조문: [], 번호: [] };
    var m = t.match(/결론\s*\**\s*[:：]\s*\**\s*([^\n]*)/);
    var line = m ? m[1].replace(/\*+/g, '').trim() : (t.split('\n').filter(function(x){ return x.trim(); }).slice(-1)[0] || '').trim();
    r.결론글 = line.slice(0, 200);
    var keys = (mai_ && mai_.choices || []).map(function(c){ return c.기호; });
    if (keys.length){
      var k = (line.match(/^[(（\[]?\s*([가-하])\s*(?:[)）\].:·,]|안|번|$|\s)/) || [])[1] || (line.match(/(?:^|[^가-힣])([가-하])\s*(?:안|번|선택지)?(?=$|[^가-힣])/) || [])[1];
      if (k && keys.indexOf(k) !== -1) r.결론 = k;
    }
    if (typeof lsiRelScan_ === 'function'){
      var seen = {};
      lsiRelScan_(t, mai_ && mai_.defLaw || '').forEach(function(x){ var key = x.law + '|' + x.art + '|' + (x.hang || ''); if (!seen[key]){ seen[key] = 1; r.조문.push({ 종류: '조문', law: x.law, art: x.art, hang: x.hang || 0, 번호: '「' + x.law + '」 제' + String(x.art).replace(/의/, '조의').replace(/^(\d+)$/, '$1조') + (x.hang ? '제' + x.hang + '항' : '') }); } });
      r.조문 = r.조문.slice(0, 12);
    }
    r.번호 = maiNums_(t);
    return r;
  }
  // ---- 근거가 법제처에 실제로 있는지(조문: 정비본, 판례·헌재·심판례: 법제처 검색 — 번호가 글자 그대로 같아야 실재) ----
  function maiNorm_(s){ return String(s || '').replace(/[^0-9가-힣]/g, ''); }
  function maiVerify_(it){
    var key = it.종류 + '|' + (it.q || it.번호);
    if (maiVerifyCache_[key]) return maiVerifyCache_[key];
    var p;
    if (it.종류 === '조문'){
      p = callGas('law_lookup_article', { lawName: it.law, articleNo: it.art }).then(function(r){
        var u = r && r.조문 && r.조문[0];
        if (!u) return { 상태: '못 찾음', 메모: (r && (r.error || r.오류)) || '조문 없음' };
        if (it.hang && (u.항 || []).length < it.hang) return { 상태: '못 찾음', 메모: '제' + it.hang + '항 없음(항 ' + (u.항 || []).length + '개)' };
        return { 상태: '실재', 제목: u.조문제목 || '', 판: r.시행일자 || '', r: r };
      });
    } else if (it.종류 === '예규'){
      p = Promise.resolve({ 상태: '확인 못 함', 메모: '국세청 예규·심사는 법제처에 없음 — 국세법령정보시스템에서 확인' });
    } else {
      var cat = { 판례: 'precedent', 헌재: 'constitutional', 심판례: 'tax_tribunal' }[it.종류];
      p = callGas('law_search_precedent', { category: cat, query: it.종류 === '심판례' ? it.q.replace(/^(조심|국심)/, '') : it.q }).then(function(r){
        var list = (r && r.results) || [], q = maiNorm_(it.q).replace(/^(조심|국심)/, '');
        var hit = list.filter(function(x){ return maiNorm_(x.사건번호 || x.청구번호).indexOf(q) !== -1; })[0];
        if (!hit) return { 상태: '못 찾음', 메모: list.length ? '비슷한 번호만 있음: ' + list.slice(0, 2).map(function(x){ return x.사건번호 || x.청구번호; }).join(', ') : '검색 결과 없음' };
        return { 상태: '실재', category: cat, id: hit.id, 제목: hit.사건명 || '', 번호: [hit.사건번호 || hit.청구번호, hit.선고일자 || hit.의결일자 || hit.종국일자].filter(Boolean).join(' · ') };
      });
    }
    p = p.catch(function(e){ delete maiVerifyCache_[key]; return { 상태: '확인 못 함', 메모: '확인 중 오류: ' + (e && e.message || e) }; });
    maiVerifyCache_[key] = p;
    return p;
  }
  function maiMark_(st){ return st === '실재' ? '<span class="mai-ok">✔</span>' : st === '못 찾음' ? '<span class="mai-warn">⚠</span>' : '<span class="mai-q">?</span>'; }
  // ---- 열기 ----
  function maiOpen_(opts){
    mai_ = Object.assign({ mode: 'law', title: '', head: '', law: '', choices: [], saved: {}, decided: null }, opts || {});
    mai_.ans = {}; mai_.opened = {}; mai_.checks = {};
    Object.keys(mai_.saved || {}).forEach(function(id){ var a = mai_.saved[id]; mai_.ans[id] = { text: a.글 || a.text || '', 방식: a.방식 || '붙여넣기' }; });
    if (mai_.storeKey){ try { var st = JSON.parse(localStorage.getItem(mai_.storeKey) || '{}'); Object.keys(st).forEach(function(id){ if (!mai_.ans[id]) mai_.ans[id] = st[id]; }); } catch (e) {} }
    var el = document.getElementById('maiPanel');
    if (!el){ el = document.createElement('div'); el.id = 'maiPanel'; document.body.appendChild(el); el.addEventListener('click', maiClick_); el.addEventListener('input', maiInput_); el.addEventListener('change', maiChange_); }
    el.style.display = 'flex';
    el.innerHTML = '<div class="mai-head"><b title="' + maiEsc_(mai_.title) + '">🤝 ' + maiEsc_(mai_.title) + '</b><button type="button" class="ghost-btn" data-mai="close">✕ 닫기</button></div><div class="mai-body" id="maiBody">명단 불러오는 중…</div>';
    var go = function(reg){
      mai_.reg = reg;
      mai_.web = (reg.filter(function(x){ return x.tier === 'B'; }).length ? reg.filter(function(x){ return x.tier === 'B'; }) : MAI_WEB_FALLBACK_);
      mai_.api = reg.filter(function(x){ return (x.tier === 'A' && x.keyProp) || (x.tier === 'C' && /^(claude-|gemini-paid)/.test(x.id)); });
      mai_.on = {}; mai_.api.forEach(function(x){ mai_.on[x.id] = x.tier === 'A' && x.status === '사용 가능'; }); // 무료는 키 있으면 켜짐, 유료는 기본 꺼짐(세무사님 "api없이")
      maiRender_();
      Object.keys(mai_.ans).forEach(maiCheckSlot_);
    };
    callGas('ai_registry', {}).then(function(r){ go((r && r.registry) || []); }).catch(function(){ go([]); });
  }
  function maiAllSlots_(){ return (mai_.api || []).concat(mai_.web || []); }
  function maiSlot_(id){ return maiAllSlots_().filter(function(x){ return x.id === id; })[0] || { id: id, name: id }; }
  function maiCost_(x){
    if (!x.price) return x.tier === 'A' ? '0원' : '단가 모름';
    var inTok = Math.round(maiSheet_().length * 0.9), krw = (inTok * x.price.in + MAI_OUT_TOKENS_ * x.price.out) / 1e6 * MAI_KRW_;
    return '약 ' + Math.max(1, Math.round(krw)) + '원(추정)';
  }
  function maiRender_(){
    var b = document.getElementById('maiBody'); if (!b) return;
    var sheet = maiSheet_(), webDone = mai_.web.filter(function(w){ return mai_.ans[w.id] && mai_.ans[w.id].text; }).length;
    var html = '<div class="mai-note">' + (mai_.mode === 'law' ? '질문지를 여러 AI에 보내고, 답을 칸에 붙여 넣으면 결론·근거를 뽑아 근거가 법제처에 실제로 있는지 확인합니다. 결정은 세무사님이 고릅니다(엔진은 자동으로 고치지 않음).' : '질문을 여러 AI에 보내고 답을 붙여 넣으면 결론끼리 비교합니다.') + '</div>';
    html += '<div class="mai-sec">질문지 <span class="mai-chip">' + sheet.length.toLocaleString() + '자</span></div><pre class="mai-sheet">' + maiEsc_(sheet) + '</pre>' +
      '<div class="mai-row" style="display:flex;gap:6px;flex-wrap:wrap;"><button type="button" class="ghost-btn" data-mai="copy">📋 질문지 복사</button><button type="button" class="btn" data-mai="next">▶ 다음 웹 AI 열기 (' + webDone + '/' + mai_.web.length + ' 답함)</button></div>';
    // API 칸
    html += '<div class="mai-sec">API 칸 — 켜면 자동</div>' + (mai_.api.length ? mai_.api.map(function(x){
      var can = x.status === '사용 가능', paid = x.tier === 'C';
      return '<div class="mai-slot"><div class="mai-row"><label><input type="checkbox" data-maion="' + maiEsc_(x.id) + '"' + (mai_.on[x.id] ? ' checked' : '') + (can ? '' : ' disabled') + '> <b>' + maiEsc_(x.name) + '</b></label>' +
        '<span class="mai-chip">' + (paid ? '유료 · ' + maiEsc_(maiCost_(x)) : '무료') + '</span><span class="mai-note">' + maiEsc_(can ? '' : x.status + (x.tier === 'A' ? ' — 설정 🤝 카드 🔑에 키를 넣으면 바로 자동 칸' : '')) + '</span></div>' + maiAnsBox_(x) + '</div>';
    }).join('') + '<button type="button" class="ghost-btn" data-mai="api">🤖 켠 API 칸에 보내기</button>' : '<div class="mai-note">명단을 받지 못했습니다.</div>');
    // 웹 칸
    html += '<div class="mai-sec">웹 AI 칸 — 복사·열기 → 그 사이트에서 붙여넣고 보내기 → 답을 복사해 칸에 붙여넣기</div>' + mai_.web.map(function(x){
      return '<div class="mai-slot"><div class="mai-row"><b>' + maiEsc_(x.name) + '</b><button type="button" class="ghost-btn" data-maiopen="' + maiEsc_(x.id) + '">📋 복사·열기</button>' + (mai_.opened[x.id] ? '<span class="mai-chip">열림 ' + maiEsc_(mai_.opened[x.id]) + '</span>' : '') + '</div>' + maiAnsBox_(x) + '</div>';
    }).join('');
    html += '<div class="mai-sec">비교표</div><div id="maiCmp">' + maiCmpHtml_() + '</div>';
    if (mai_.mode === 'law' && mai_.choices.length) html += '<div class="mai-sec">결정 — 세무사님이 고릅니다</div><div id="maiDec">' + maiDecHtml_() + '</div>';
    b.innerHTML = html;
  }
  function maiAnsBox_(x){
    var a = mai_.ans[x.id] || {};
    return '<textarea data-maians="' + maiEsc_(x.id) + '" placeholder="' + (x.tier === 'B' || !x.tier ? '여기에 ' + maiEsc_(x.name) + ' 답을 붙여 넣으세요' : '자동으로 채워집니다(직접 붙여 넣어도 됨)') + '">' + maiEsc_(a.text || '') + '</textarea><div class="mai-sum" id="maiSum-' + maiEsc_(x.id) + '">' + maiSumHtml_(x.id) + '</div>';
  }
  function maiSumHtml_(id){
    var a = mai_.ans[id]; if (!a || !a.text) return '';
    var p = a.p || (a.p = maiParse_(a.text)), ck = mai_.checks[id] || {};
    var items = p.조문.concat(p.번호);
    return '결론: <b>' + maiEsc_(p.결론 || p.결론글.slice(0, 40) || '못 찾음') + '</b>' + (mai_.mode === 'law' ? ' · 근거 ' + items.length + '개 ' + items.map(function(it){ var c = ck[it.종류 + '|' + (it.q || it.번호)]; return (c ? maiMark_(c.상태) : '…') + maiEsc_(it.번호); }).join(' ') : '') + (a.방식 ? ' <span class="mai-chip">' + maiEsc_(a.방식) + '</span>' : '');
  }
  // 근거 확인(법령 쪽만) — 끝나면 요약·비교표 다시 그림, 저장(onCheck)

  function maiBig_(s){ s = String(s || '').replace(/[\s.,·:;()"'「」]/g, ''); var b = {}; for (var i = 0; i + 1 < s.length; i++) b[s.substr(i, 2)] = 1; return b; }

  // ---- 복사·열기 — 복사를 먼저(같은 누름 안에서 바로) 하고 창 하나만 연다: 한 번 누를 때 창 하나라 팝업 차단에 안 걸림 ----
