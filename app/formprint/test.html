<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>법정서식 출력 시험</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --line: #d9d9d4; --accent: #1f5fbf; --bad: #b3261e; --ok: #1e7b34; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, "Malgun Gothic", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.lead { margin: 0 0 12px; color: var(--muted); }
  .box { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  label { color: var(--muted); }
  #status { white-space: pre-wrap; font-size: 13px; }
  .bad { color: var(--bad); } .ok { color: var(--ok); }
  iframe { width: 100%; height: 80vh; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  details { margin-top: 6px; } summary { cursor: pointer; }
  table { border-collapse: collapse; font-size: 12px; } td, th { border: 1px solid var(--line); padding: 2px 6px; text-align: left; vertical-align: top; }
</style>
</head>
<body>
<h1>법정서식 원본 모양 출력 — 시험</h1>
<p class="lead">서버 없이 시험합니다. 법제처 원본(PDF) PDF를 골라 주면 가짜 서버(listFolder·readFileBinary 흉내)가 그 파일을 넘겨 줍니다. 값은 합성 값(신고용 아님)이고 세액은 실제 계산 엔진으로 계산합니다. 이 페이지는 http로 열어야 합니다(위치판·글꼴을 fetch로 읽음).</p>

<div class="box">
  <div class="row">
    <label>① 원본 PDF 고르기(여러 개 또는 폴더):</label>
    <input type="file" id="pick" accept="application/pdf" multiple>
    <input type="file" id="pickDir" webkitdirectory>
  </div>
  <div id="picked" style="margin-top:6px;color:var(--muted)">아직 고르지 않음 — 양도 84호·증여 10호·상속 9호 묶음 PDF(법제처) 3개가 필요</div>
</div>

<div class="box">
  <div class="row">
    <label>② 찍기:</label>
    <button data-case="양도84호" disabled>양도 84호 + 부표1</button>
    <button data-case="증여10호" disabled>증여 10호</button>
    <button data-case="상속9호" disabled>상속 9호 + 부표1·부표3</button>
    <button data-case="양도_부표" disabled>양도 전체(plan: 부표1~3)</button>
    <button data-case="증여_부표" disabled>증여 전체(plan: 부표1~6)</button>
    <button data-case="상속_부표" disabled>상속 전체(plan: 부표1~8)</button>
    <button data-case="상속_부표7" disabled>상속 부표7</button>
    <label><input type="checkbox" id="boxes"> 칸 테두리 보기</label>
    <label><input type="checkbox" id="back"> 뒷면(작성방법) 포함</label>
  </div>
  <div id="status" style="margin-top:8px">엔진 불러오는 중…</div>
</div>

<iframe id="view" title="출력 결과"></iframe>

<script src="formprint.js"></script>
<script src="mappers.js"></script>
<script src="test-cases.js"></script>
<script>
(function () {
  'use strict';
  var FP = window.NxFormPrint, picked = {}, list = null, E = null, CASES = null;
  var st = document.getElementById('status');
  function say(t, cls) { st.className = cls || ''; st.textContent = t; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // 위치판 목록(원본 이름·md5)
  fetch(FP.config.base + '위치판/_목록.json').then(function (r) { return r.json(); }).then(function (j) { list = j.위치판; }).catch(function (e) { say('위치판 목록을 못 읽음(http로 열었는지 확인): ' + e.message, 'bad'); });

  // 엔진: tools/engine-regress.js 의 load와 같은 방식
  fetch('../../gs-backend/manage/taxcalc-engine.html').then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (src) {
    src = src.replace(/^\s*<script>/, '').replace(/<\/script>\s*$/, '');
    var win = {}; new Function('window', src)(win); E = win;
    CASES = window.NxFormPrintTestCases(E); CASES = CASES.concat(CASES.부표 || []);
    say('엔진 준비됨 — 원본 PDF를 고른 뒤 단추를 누르세요.');
    refresh();
  }).catch(function (e) { say('엔진(gs-backend/manage/taxcalc-engine.html)을 못 읽음: ' + e.message, 'bad'); });

  function onFiles(files) {
    var arr = Array.prototype.filter.call(files, function (f) { return /\.pdf$/i.test(f.name); });
    Promise.all(arr.map(function (f) { return f.arrayBuffer().then(function (ab) { var b = new Uint8Array(ab); return { name: f.name, bytes: b, md5: FP.md5hex(b) }; }); }))
      .then(function (rs) {
        rs.forEach(function (x) { picked[x.md5] = x; });
        var hit = (list || []).filter(function (m) { return picked[m.md5]; }).map(function (m) { return m.formKey; });
        document.getElementById('picked').textContent = 'PDF ' + Object.keys(picked).length + '개 읽음 — 위치판과 맞는 원본: ' + (hit.length ? hit.join(', ') : '없음');
        refresh();
      });
  }
  // ?pdfs=주소1,주소2 — 고르는 대신 주소로 원본 PDF를 받아 씀(시험 서버용)
  var qs = new URLSearchParams(location.search).get('pdfs');
  if (qs) Promise.all(qs.split(',').map(function (u) {
    return fetch(u).then(function (r) { if (!r.ok) throw new Error(r.status + ' ' + u); return r.blob(); })
      .then(function (b) { return new File([b], decodeURIComponent(u.split('/').pop())); });
  })).then(onFiles).catch(function (e) { say('원본 PDF 주소를 못 읽음: ' + e.message, 'bad'); });
  document.getElementById('pick').addEventListener('change', function (e) { onFiles(e.target.files); });
  document.getElementById('pickDir').addEventListener('change', function (e) { onFiles(e.target.files); });

  function refresh() {
    Array.prototype.forEach.call(document.querySelectorAll('button[data-case]'), function (b) { b.disabled = !E || !Object.keys(picked).length; });
  }
  function b64(bytes) { var s = '', CH = 0x8000; for (var i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH)); return btoa(s); }

  // 가짜 callGas — 앱 서버(Code.js handleListFolder·handleReadFileBinary)와 같은 모양으로 돌려줌
  function fakeCallGas(action, payload) {
    if (action === 'listFolder') {
      var files = Object.keys(picked).map(function (md5) {
        var m = (list || []).filter(function (x) { return x.md5 === md5; })[0];
        return { id: md5, name: m ? m.원본 : picked[md5].name, type: 'file', mimeType: 'application/pdf', sizeBytes: picked[md5].bytes.length };
      });
      return Promise.resolve({ path: [], folderId: payload.folderId, folders: [], files: files });
    }
    if (action === 'readFileBinary') {
      var p = picked[payload.fileId];
      return Promise.resolve(p ? { name: p.name, mimeType: 'application/pdf', base64: b64(p.bytes) } : { error: '파일 없음' });
    }
    return Promise.resolve({ error: '시험용 callGas가 모르는 요청: ' + action });
  }

  Array.prototype.forEach.call(document.querySelectorAll('button[data-case]'), function (btn) {
    btn.addEventListener('click', function () {
      var cs = CASES.filter(function (c) { return c.name === btn.getAttribute('data-case'); })[0];
      say('찍는 중…');
      var t0 = performance.now();
      var jobs = cs.tax ? FP.plan(cs.tax, cs.ctx).filter(function (it) { return !cs.only || cs.only.indexOf(typeof it === 'string' ? it : it.formKey) >= 0; }) : cs.forms; // 작업자 하: 세목별 plan
      FP.renderWithMappers(jobs, cs.ctx, {
        callGas: fakeCallGas, debugBoxes: document.getElementById('boxes').checked, backPages: document.getElementById('back').checked,
        watermark: '견본 — NETAX 원본 서식 출력 시험(합성 값, 신고용 아님)'
      }).then(function (r) {
        document.getElementById('view').src = URL.createObjectURL(r.blob);
        var html = '<b>' + esc(cs.name) + '</b> — ' + (r.bytes.length / 1024).toFixed(0) + 'KB, ' + Math.round(performance.now() - t0) + 'ms, 찍은 칸 ' + r.report.placed +
          ', 줄인 칸 ' + r.report.shrunk.length + ', <span class="' + (r.report.overflow.length ? 'bad' : 'ok') + '">넘친 칸 ' + r.report.overflow.length + '</span>' +
          ', <span class="' + (r.report.unknownKeys.length ? 'bad' : 'ok') + '">모르는 키 ' + r.report.unknownKeys.length + '</span>';
        r.mapped.forEach(function (m) {
          var bad = m.checks.filter(function (c) { return !c.맞음; });
          html += '<details><summary>' + esc(m.formKey) + ' — 비운 칸 ' + m.missing.length + ', 검산 ' + m.checks.length + '개 중 틀림 <span class="' + (bad.length ? 'bad' : 'ok') + '">' + bad.length + '</span></summary>' +
            '<table><tr><th>비운 칸</th><th>이유</th></tr>' + m.missing.map(function (x) { return '<tr><td>' + esc(x.칸) + '</td><td>' + esc(x.이유) + '</td></tr>'; }).join('') + '</table>' +
            (m.notes.length ? '<ul>' + m.notes.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') +
            '<table><tr><th>검산</th><th>서식값</th><th>계산값</th></tr>' + m.checks.map(function (c) { return '<tr class="' + (c.맞음 ? '' : 'bad') + '"><td>' + esc(c.식) + '</td><td>' + c.서식값.toLocaleString() + '</td><td>' + c.계산값.toLocaleString() + '</td></tr>'; }).join('') + '</table></details>';
        });
        if (r.report.overflow.length) html += '<div class="bad">' + r.report.overflow.map(esc).join('<br>') + '</div>';
        st.className = ''; st.innerHTML = html;
      }).catch(function (e) { say('실패: ' + e.message, 'bad'); });
    });
  });
})();
</script>
</body>
</html>
