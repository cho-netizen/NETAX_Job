<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1B3D">
<title>NETAX job</title>
<link rel="manifest" href="/m/manifest.json">
<link rel="icon" href="/m/icon-192.png">
<link rel="apple-touch-icon" href="/m/icon-192.png">
<!--
  [2026.10.15] job 휴대폰 창구 — job.netax.kr/m/
  job 화면은 구글 서버 주소에서 뜨므로 그 자체로는 휴대폰 앱 설치·"공유하기" 대상이 될 수 없다.
  구조 전환(화면을 깃허브에서 직접 서빙)은 구글 응답 지연·실패 때문에 보류(2026-10-08)했고, 구글 실행 API는
  계정 전체 권한 열쇠를 브라우저에 둬야 해서 하지 않기로 했다(2026-10-10). 그래서 이 작은 창구만 따로 둔다:
    · 설치하면 휴대폰 앱 목록·공유 메뉴에 "NETAX job"이 뜬다.
    · 앱으로 열면 곧바로 지금의 job(구글 주소)으로 넘어간다 — job 화면·기능은 하나도 안 바뀐다.
    · 다른 앱에서 공유한 파일은 여기서 받아 기존 서버 입구(doPost __manage → manageApp_call의
      listFolder/createFolder/uploadFile/moveItem/work_get_cases)로 드라이브에 올린다. 서버 코드 변경 없음.
  보안: 구글 계정 열쇠는 쓰지 않는다. job 비밀번호로 받은 12시간짜리 job 로그인표(세션 토큰)만 이 기기에 둔다.
-->
<style>
  :root { --bg:#0D1B3D; --card:#15264f; --line:#2a3d6b; --text:#eef2fb; --muted:#9fb0d6; --accent:#4f8cff; --ok:#3fbf7f; --warn:#f0b03c; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; font-size:16px; }
  body { padding:16px 16px calc(24px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:4px 0 14px; display:flex; align-items:center; gap:10px; }
  h1 img { width:32px; height:32px; border-radius:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .muted { color:var(--muted); font-size:14px; line-height:1.5; }
  button, .btn { display:block; width:100%; border:0; border-radius:10px; padding:14px; font-size:16px; font-weight:600; background:var(--accent); color:#fff; text-align:center; text-decoration:none; cursor:pointer; margin-top:10px; }
  button.sub, .btn.sub { background:transparent; border:1px solid var(--line); color:var(--text); font-weight:500; }
  button:disabled { opacity:.5; }
  input[type=password], input[type=search] { width:100%; padding:13px; font-size:16px; border-radius:10px; border:1px solid var(--line); background:#0b1630; color:var(--text); }
  .item { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); }
  .item:first-child { border-top:0; }
  .item .thumb { width:44px; height:44px; border-radius:6px; object-fit:cover; background:#0b1630; flex:none; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .item .nm { flex:1; min-width:0; overflow-wrap:anywhere; font-size:15px; }
  .item .st { flex:none; font-size:13px; color:var(--muted); }
  .st.ok { color:var(--ok); } .st.err { color:var(--err); }
  .case { padding:12px 4px; border-top:1px solid var(--line); cursor:pointer; }
  .case:first-child { border-top:0; }
  .case b { display:block; font-size:15px; }
  .case span { font-size:13px; color:var(--muted); }
  .case:active { background:#1d3266; }
  #caseList { max-height:55vh; overflow:auto; margin-top:10px; }
  .msg { padding:10px 12px; border-radius:10px; margin-top:10px; font-size:14px; line-height:1.5; }
  .msg.err { background:#4a1f2a; color:#ffd3d3; } .msg.ok { background:#173d2c; color:#c9f5dc; } .msg.info { background:#1b2f5e; color:#d6e2ff; }
  label.chk { display:flex; gap:10px; align-items:center; flex:1; min-width:0; }
  label.chk input { width:20px; height:20px; flex:none; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<h1><img src="/m/icon-192.png" alt="">NETAX job</h1>
<div id="root"><div class="card muted">불러오는 중…</div></div>

<script>
(function () {
  'use strict';
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbyFbvXiV6rSzCvhtc_T2WrzNF5ZxhOFWtSSsgzSavzPbjv4LBGhjXhu_Q2_8m-PDj8s/exec';
  var JOB_URL = GAS_URL + '?app=manage';
  var INBOX_NAME = '_휴대폰받은파일'; // "_"로 시작 — AI 자동참조 대상에서 빠진다(_AI대화기록과 같은 규칙)
  var SHARE_CACHE = 'nx-m-share-v1', META_KEY = '/m/__share/meta';
  var TOKEN_KEY = 'nxMobileToken', INBOX_KEY = 'nxMobileInboxId';
  var MAX_BYTES = 30 * 1024 * 1024; // 구글 웹앱 요청 한도(약 50MB)를 base64(1.33배)로 넘지 않게
  var root = document.getElementById('root');
  var params = new URLSearchParams(location.search);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/m/sw.js', { scope: '/m/' }).catch(function () {});

  // ---------- 작은 도우미 ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function fmtSize(n) { if (n < 1024) return n + 'B'; if (n < 1048576) return Math.round(n / 1024) + 'KB'; return (n / 1048576).toFixed(1) + 'MB'; }
  // [2026-10-15 실기기] 이 휴대폰에서는 job의 구글 주소 자체가 "페이지를 찾을 수 없음"으로 안 열렸다(앱 창·크롬 모두 —
  // 구글 계정 여러 개 로그인 시 생기는 구글 쪽 문제로 추정). job.netax.kr/app/(구조 전환 1단계: 화면은 깃허브, 자료는 구글)은
  // 구글 주소를 거치지 않아 정상으로 열림을 세무사님이 확인 → 이 창구에서 여는 job은 모두 /app/으로.
  var APP_URL = '/app/';
  function jobHref() { return APP_URL; }
  // /app/은 sessionStorage의 로그인표(nxManageSessionToken)가 있으면 비밀번호를 다시 묻지 않는다(manage/script.html).
  // 이 창구의 12시간 로그인표를 넘겨 줘서 앱을 열 때마다 비밀번호를 치지 않게 한다.
  function handOffToken() {
    var t = lsGet(TOKEN_KEY);
    if (tokenValid(t)) { try { sessionStorage.setItem('nxManageSessionToken', t); } catch (e) {} }
  }
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('a');
    if (a && a.getAttribute('href') === APP_URL) handOffToken();
  }, true);
  function isStandalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function msg(kind, text) { return '<div class="msg ' + kind + '">' + text + '</div>'; }
  function icon(type, name) {
    if (/^image\//.test(type)) return '🖼'; if (/pdf/.test(type) || /\.pdf$/i.test(name)) return '📄';
    if (/sheet|excel|csv/.test(type) || /\.(xlsx?|csv)$/i.test(name)) return '📊'; if (/^text\//.test(type)) return '📝'; return '📎';
  }
  function stamp() { var d = new Date(); function p(n) { return (n < 10 ? '0' : '') + n; } return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()); }

  // ---------- 서버 호출(gasbridge.html과 같은 방식) ----------
  // 구글 응답의 "결과 받아가기" 단계가 자주 실패하므로, 같은 요청번호(rid)로 다시 묻는다 — 서버는 다시
  // 실행하지 않고 기억해둔 결과를 준다(파일이 두 번 올라가지 않음, Code.js manageApp_dispatchHttpOnce_).
  var RETRY_DELAYS = [1000, 2000, 3000, 4000, 5000, 6000, 6000, 6000];
  function newRid() { return 'm-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); }
  function gas(fn, args, timeoutMs) {
    var rid = newRid();
    var body = JSON.stringify({ __manage: { fn: fn, args: args }, __rid: rid });
    function attempt(n) {
      var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, timeoutMs || 25000) : null;
      function retry(err) {
        if (n >= RETRY_DELAYS.length) throw err || new Error('서버 응답을 받지 못했습니다(구글 서버가 일시적으로 불안정합니다). 잠시 후 다시 시도하세요.');
        return new Promise(function (r) { setTimeout(r, RETRY_DELAYS[n]); }).then(function () { return attempt(n + 1); });
      }
      return fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body, signal: ctrl ? ctrl.signal : undefined })
        .then(function (res) { return res.text(); })
        .then(function (text) {
          clearTimeout(timer);
          var data = null; try { data = JSON.parse(text); } catch (e) { data = null; }
          if (!data) return retry();
          if (data.error && !('__result' in data)) throw new Error(data.error);
          return data.__result;
        }, function (err) { clearTimeout(timer); return retry(err); });
    }
    return attempt(0);
  }
  function tokenValid(t) { if (!t) return false; var exp = Number(String(t).split('.')[0]); return !!exp && Date.now() < exp - 60000; }
  function call(action, payload, timeoutMs) {
    var tok = lsGet(TOKEN_KEY);
    if (!tokenValid(tok)) return Promise.reject(new Error('AUTH_REQUIRED'));
    return gas('manageApp_call', [action, payload || {}, tok], timeoutMs).then(function (r) {
      if (r && r.error === 'AUTH_REQUIRED') { lsSet(TOKEN_KEY, null); throw new Error('AUTH_REQUIRED'); }
      if (r && r.error) throw new Error(r.error);
      return r;
    });
  }

  // ---------- 로그인(job 비밀번호 — 구글 계정 열쇠는 쓰지 않음) ----------
  function ensureLogin() {
    if (tokenValid(lsGet(TOKEN_KEY))) return Promise.resolve();
    return new Promise(function (resolve) {
      var box = document.createElement('div');
      box.className = 'card';
      box.innerHTML = '<b>job 로그인</b><div class="muted" style="margin:6px 0 10px">job에 들어갈 때 쓰는 비밀번호를 넣어 주세요. 이 휴대폰에서 12시간 동안 다시 묻지 않습니다.</div>' +
        '<form><input type="password" autocomplete="current-password" placeholder="비밀번호" required><button type="submit">로그인</button></form><div class="out"></div>';
      root.insertBefore(box, root.firstChild);
      var form = box.querySelector('form'), input = box.querySelector('input'), out = box.querySelector('.out'), btn = box.querySelector('button');
      input.focus();
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        btn.disabled = true; out.innerHTML = msg('info', '확인 중…(구글 서버라 몇 초~30초 걸릴 수 있습니다)');
        gas('manageApp_checkPassword', [input.value]).then(function (r) {
          if (r && r.ok && r.token) { lsSet(TOKEN_KEY, r.token); box.remove(); resolve(); return; }
          out.innerHTML = msg('err', esc((r && r.message) || '비밀번호가 맞지 않습니다.'));
          btn.disabled = false; input.select();
        }, function (err) { out.innerHTML = msg('err', esc(err.message)); btn.disabled = false; });
      });
    });
  }
  function withLogin(fn) {
    return ensureLogin().then(fn).catch(function (err) {
      if (err && err.message === 'AUTH_REQUIRED') return withLogin(fn); // 로그인표가 만료됨 → 다시 로그인
      throw err;
    });
  }

  // ---------- 받은 파일 보관 폴더(기본폴더 아래 _휴대폰받은파일) ----------
  function inboxFolderId() {
    var saved = lsGet(INBOX_KEY);
    if (saved) return Promise.resolve(saved);
    return call('listFolder', {}).then(function (res) {
      var hit = (res.folders || []).filter(function (f) { return f.name === INBOX_NAME; })[0];
      if (hit) return hit.id;
      return call('createFolder', { path: res.path, name: INBOX_NAME }).then(function (r) { return r.id; });
    }).then(function (id) { lsSet(INBOX_KEY, id); return id; });
  }

  // ---------- 공유받은 것 꺼내기(sw.js가 Cache Storage에 담아 둔 것) ----------
  function readShared() {
    if (!('caches' in window)) return Promise.resolve({ cache: null, items: [] });
    return caches.open(SHARE_CACHE).then(function (cache) {
      return cache.match(META_KEY).then(function (res) { return res ? res.json() : { items: [] }; })
        .then(function (meta) { return { cache: cache, items: Array.isArray(meta.items) ? meta.items : [] }; });
    });
  }
  function saveMeta(cache, items) {
    if (!items.length) return cache.delete(META_KEY);
    return cache.put(META_KEY, new Response(JSON.stringify({ items: items }), { headers: { 'Content-Type': 'application/json' } }));
  }
  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { var s = String(fr.result); resolve(s.slice(s.indexOf(',') + 1)); };
      fr.onerror = function () { reject(fr.error || new Error('파일을 읽지 못했습니다.')); };
      fr.readAsDataURL(blob);
    });
  }
  function textToBase64(text) { return blobToBase64(new Blob([text], { type: 'text/plain;charset=utf-8' })); }

  // ---------- 화면: 공유받기 ----------
  function showShare() {
    readShared().then(function (sh) {
      if (!sh.items.length) {
        root.innerHTML = '<div class="card">' + msg('info', '받은 파일이 없습니다. 다른 앱에서 <b>공유 → NETAX job</b>을 고르면 여기로 들어옵니다.') +
          '<a class="btn" href="' + jobHref() + '">job 열기</a><a class="btn sub" href="/m/?inbox=1">보관함 파일 사건에 넣기</a></div>';
        return;
      }
      var html = '<div class="card"><b>받은 것 ' + sh.items.length + '개</b><div class="muted">job 드라이브의 「' + INBOX_NAME + '」 폴더에 먼저 올린 뒤, 넣을 사건을 고릅니다.</div><div id="items" style="margin-top:8px">';
      sh.items.forEach(function (it, i) {
        var name = it.kind === 'text' ? '공유글: ' + it.text.slice(0, 60) : it.name;
        html += '<div class="item"><div class="thumb" id="th' + i + '">' + (it.kind === 'text' ? '📝' : icon(it.type, it.name)) + '</div><div class="nm">' + esc(name) + '</div><div class="st" id="st' + i + '">' + fmtSize(it.size || 0) + '</div></div>';
      });
      html += '</div><div id="upOut"></div></div><div id="next"></div>';
      root.innerHTML = html;
      // 사진은 작은 미리보기
      sh.items.forEach(function (it, i) {
        if (it.kind === 'file' && /^image\//.test(it.type)) sh.cache.match(it.key).then(function (r) { return r && r.blob(); }).then(function (b) {
          if (!b) return; var el = document.getElementById('th' + i); el.innerHTML = '<img class="thumb" src="' + URL.createObjectURL(b) + '" alt="">';
        });
      });
      withLogin(function () { return uploadAll(sh); }).catch(function (err) {
        document.getElementById('upOut').innerHTML = msg('err', '올리지 못했습니다: ' + esc(err.message) + '<br>받은 파일은 이 휴대폰에 그대로 남아 있습니다.') + '<button id="again">다시 시도</button>';
        document.getElementById('again').onclick = function () { showShare(); };
      });
    });
  }

  function uploadAll(sh) {
    var out = document.getElementById('upOut');
    out.innerHTML = msg('info', '올리는 중…');
    return inboxFolderId().then(function (folderId) {
      var uploaded = [], failed = [], remaining = sh.items.slice();
      var seq = Promise.resolve();
      sh.items.forEach(function (it, i) {
        seq = seq.then(function () {
          var st = document.getElementById('st' + i);
          if (it.kind === 'file' && it.size > MAX_BYTES) { st.textContent = '너무 큼(30MB 초과)'; st.className = 'st err'; failed.push(it); return; }
          st.textContent = '올리는 중…'; st.className = 'st';
          var p = it.kind === 'text'
            ? textToBase64(it.text).then(function (b64) { return { name: '공유글_' + stamp() + '.txt', mimeType: 'text/plain', base64Data: b64 }; })
            : sh.cache.match(it.key).then(function (r) { if (!r) throw new Error('휴대폰에 남은 파일을 찾지 못했습니다.'); return r.blob(); })
                .then(blobToBase64).then(function (b64) { return { name: it.name, mimeType: it.type || 'application/octet-stream', base64Data: b64 }; });
          return p.then(function (payload) {
            payload.folderId = folderId;
            // 큰 파일은 올리는 데만 오래 걸리므로 기다리는 시간을 길게(중간에 끊고 다시 보내면 또 올리게 됨)
            return call('uploadFile', payload, it.kind === 'file' ? Math.max(60000, Math.round(it.size / 50)) : 25000);
          }).then(function (r) {
            if (!r || !r.id) throw new Error('올린 파일 정보를 받지 못했습니다.');
            st.textContent = '✓ 올림'; st.className = 'st ok';
            uploaded.push({ id: r.id, name: r.name });
            remaining.splice(remaining.indexOf(it), 1);
            if (it.kind === 'file') sh.cache.delete(it.key);
            return saveMeta(sh.cache, remaining);
          }).catch(function (err) {
            if (err && err.message === 'AUTH_REQUIRED') throw err;
            st.textContent = '실패'; st.className = 'st err'; failed.push(it);
            out.innerHTML = msg('err', esc(it.kind === 'text' ? '공유글' : it.name) + ': ' + esc(err.message));
          });
        });
      });
      return seq.then(function () {
        out.innerHTML = failed.length
          ? msg('err', uploaded.length + '개 올림, ' + failed.length + '개 실패 — 실패한 것은 이 휴대폰에 남아 있습니다.') + '<button id="again" class="sub">실패한 것 다시 올리기</button>'
          : msg('ok', uploaded.length + '개 모두 「' + INBOX_NAME + '」에 올렸습니다.');
        var again = document.getElementById('again'); if (again) again.onclick = function () { showShare(); };
        if (uploaded.length) showCasePicker(document.getElementById('next'), uploaded);
      });
    });
  }

  // ---------- 화면: 사건 고르기 → 사건 폴더로 옮기기 ----------
  var casesPromise = null;
  function loadCases() {
    if (!casesPromise) casesPromise = call('work_get_cases', {}, 60000).then(function (r) {
      // [2026.10.18 탭연결 1번] 폴더 없는 상담 사건도 목록에 넣는다 — 고르면 업무유형을 물어 폴더를 만든 뒤 옮긴다(ensureFolder)
      return (r.cases || []).filter(function (c) { return c.폴더ID || String(c.업무유형 || '') === '상담'; }).map(function (c) {
        return { id: c.id, name: String(c.사건명 || ''), client: String(c.고객명 || ''), status: String(c.상태 || ''), folderId: c.폴더ID || '', upType: String(c.업무유형 || ''), semok: String(c.세목 || ''), modified: String(c.수정일 || c.생성일 || '') };
      }).sort(function (a, b) {
        var da = a.status === '완료' ? 1 : 0, db = b.status === '완료' ? 1 : 0;
        if (da !== db) return da - db;
        return b.modified.localeCompare(a.modified);
      });
    });
    casesPromise.catch(function () { casesPromise = null; });
    return casesPromise;
  }
  function showCasePicker(box, files) {
    box.innerHTML = '<div class="card"><b>어느 사건에 넣을까요?</b><div class="muted">고르면 ' + files.length + '개 파일이 그 사건 폴더로 옮겨집니다. 나중에 정해도 됩니다(보관함에 그대로 남음).</div>' +
      '<input type="search" id="q" placeholder="고객명·사건명 검색" style="margin-top:10px"><div id="caseList">' + msg('info', '사건 목록 불러오는 중…(구글 서버라 10~30초 걸릴 수 있습니다)') + '</div>' +
      '<div id="mvOut"></div><a class="btn sub" href="' + jobHref() + '">나중에 정하기 — job 열기</a></div>';
    var list = box.querySelector('#caseList'), q = box.querySelector('#q'), mvOut = box.querySelector('#mvOut');
    var all = [];
    function render() {
      var words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      var hits = all.filter(function (c) { var s = (c.client + ' ' + c.name).toLowerCase(); return words.every(function (w) { return s.indexOf(w) !== -1; }); }).slice(0, 80);
      list.innerHTML = hits.length ? hits.map(function (c, i) {
        return '<div class="case" data-i="' + all.indexOf(c) + '"><b>' + esc(c.name || c.client) + '</b><span>' + esc(c.client) + (c.status ? ' · ' + esc(c.status) : '') + (c.folderId ? '' : ' · 상담(폴더 없음)') + '</span></div>';
      }).join('') : msg('info', '맞는 사건이 없습니다.');
    }
    q.addEventListener('input', render);
    list.addEventListener('click', function (ev) {
      var el = ev.target.closest('.case'); if (!el) return;
      var c = all[Number(el.getAttribute('data-i'))];
      // [2026.10.18 탭연결 1번] 상담 사건은 폴더가 없다 — 업무유형을 물어(신고·자문) 바꾸면 서버가 사건명·폴더·고객창구를 함께 만든다
      var upType = '';
      if (!c.folderId) {
        var ans = prompt('「' + (c.name || c.client) + '」은(는) 상담 사건이라 파일을 넣을 사건 폴더가 없습니다.\n' +
          '업무유형을 정하면 사건 폴더가 만들어집니다(업무유형·사건명도 바뀜).\n\n1 = 신고(신고서 작성)\n2 = 자문(검토서·보고서 작성)\n\n번호를 입력하세요(취소하면 그대로 둡니다).', '1');
        if (ans === null) return;
        upType = ({ '1': '신고', '2': '자문', '신고': '신고', '자문': '자문' })[String(ans).trim()];
        if (!upType) { alert('1(신고) 또는 2(자문)를 입력해 주세요.'); return; }
      } else if (!confirm('「' + (c.name || c.client) + '」 사건 폴더로 ' + files.length + '개 파일을 옮길까요?')) return;
      list.classList.add('hidden'); q.classList.add('hidden');
      mvOut.innerHTML = msg('info', upType ? '업무유형을 "' + upType + '"(으)로 바꾸고 폴더 만드는 중…' : '옮기는 중…');
      var seq = c.folderId ? Promise.resolve() : call('work_update_case', { id: c.id, 업무유형: upType }, 60000).then(function (r) {
        if (!r || r.success === false || !r.case || !r.case.폴더ID) throw new Error((r && r.message) || '사건 폴더를 만들지 못했습니다.');
        c.folderId = r.case.폴더ID; c.name = String(r.case.사건명 || c.name); c.upType = upType;
        casesPromise = null; // 다음에 사건 목록을 다시 받게
      });
      var moved = 0, errs = [];
      seq = seq.catch(function (err) { errs.push('업무유형 변경: ' + err.message); });
      files.forEach(function (f) {
        seq = seq.then(function () { if (!c.folderId) throw new Error('사건 폴더가 없어 옮기지 않았습니다'); return call('moveItem', { id: f.id, type: 'file', destFolderId: c.folderId }); })
          .then(function () { moved++; }, function (err) { errs.push(f.name + ': ' + err.message); });
      });
      seq.then(function () {
        mvOut.innerHTML = errs.length
          ? msg('err', moved + '개 옮김, ' + errs.length + '개 실패(보관함에 남음):<br>' + errs.map(esc).join('<br>'))
          : msg('ok', '「' + esc(c.name || c.client) + '」 사건 폴더로 ' + moved + '개 옮겼습니다.');
        box.querySelector('a.btn').textContent = 'job 열기';
      });
    });
    loadCases().then(function (cs) { all = cs; render(); }, function (err) {
      list.innerHTML = msg('err', '사건 목록을 못 불러왔습니다: ' + esc(err.message)) + '<button class="sub" id="reload">다시 불러오기</button>';
      list.querySelector('#reload').onclick = function () { showCasePicker(box, files); };
    });
  }

  // ---------- 화면: 보관함(전에 받아 두고 사건을 안 정한 파일) ----------
  function showInbox() {
    root.innerHTML = '<div class="card"><b>보관함 「' + INBOX_NAME + '」</b><div id="ib">' + msg('info', '불러오는 중…') + '</div></div><div id="next"></div>';
    withLogin(function () {
      return inboxFolderId().then(function (id) { return call('listFolder', { folderId: id }); });
    }).then(function (res) {
      var files = res.files || [], ib = document.getElementById('ib');
      if (!files.length) { ib.innerHTML = msg('ok', '보관함이 비어 있습니다.') + '<a class="btn" href="' + jobHref() + '">job 열기</a>'; return; }
      ib.innerHTML = '<div class="muted" style="margin:6px 0">사건에 넣을 파일을 고르세요.</div>' + files.map(function (f, i) {
        return '<div class="item"><label class="chk"><input type="checkbox" data-i="' + i + '" checked><span class="nm">' + icon(f.mimeType || '', f.name) + ' ' + esc(f.name) + '</span></label><div class="st">' + esc((f.modifiedDate || '').slice(5, 16)) + '</div></div>';
      }).join('') + '<button id="pick">고른 파일 사건에 넣기</button>';
      document.getElementById('pick').onclick = function () {
        var sel = Array.prototype.filter.call(ib.querySelectorAll('input[type=checkbox]'), function (c) { return c.checked; })
          .map(function (c) { var f = files[Number(c.getAttribute('data-i'))]; return { id: f.id, name: f.name }; });
        if (!sel.length) { alert('파일을 하나 이상 고르세요.'); return; }
        showCasePicker(document.getElementById('next'), sel);
        document.getElementById('next').scrollIntoView({ behavior: 'smooth' });
      };
    }).catch(function (err) {
      if (err && /폴더를 찾을 수 없습니다/.test(err.message)) lsSet(INBOX_KEY, null); // 보관 폴더를 지웠으면 다음에 다시 찾기
      document.getElementById('ib').innerHTML = msg('err', esc(err.message)) + '<button class="sub" onclick="location.reload()">다시 시도</button>';
    });
  }

  // ---------- 화면: 설치 안내(브라우저로 열었을 때) ----------
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferredPrompt = e;
    var b = document.getElementById('installBtn'); if (b) b.classList.remove('hidden');
  });
  window.addEventListener('appinstalled', function () {
    var o = document.getElementById('installOut'); if (o) o.innerHTML = msg('ok', '설치했습니다. 휴대폰 앱 목록의 <b>NETAX job</b>으로 여세요.');
  });
  function showInstall() {
    root.innerHTML = '<div class="card"><b>휴대폰에 앱으로 설치</b><div class="muted" style="margin-top:6px">설치하면 <b>앱 목록·홈 화면</b>에 "NETAX job"이 생기고, 다른 앱(카카오톡·갤러리·파일·크롬)의 <b>공유 → NETAX job</b>으로 파일을 job 드라이브에 바로 보낼 수 있습니다. 앱을 누르면 지금 쓰는 job이 그대로 열립니다.</div>' +
      '<button id="installBtn" class="hidden">앱 설치</button><div id="installOut"></div>' +
      '<div class="muted" id="manualHint" style="margin-top:10px">설치 버튼이 안 보이면: 크롬 오른쪽 위 <b>⋮</b> → <b>앱 설치</b>(또는 <b>홈 화면에 추가</b>)를 누르세요. 삼성 인터넷은 아래쪽 <b>≡</b> → <b>현재 페이지 추가</b> → <b>홈 화면</b>.</div></div>' +
      '<div class="card"><a class="btn sub" href="' + jobHref() + '" style="margin-top:0">설치 없이 job 열기</a><a class="btn sub" href="/m/?inbox=1">보관함 파일 사건에 넣기</a></div>';
    var b = document.getElementById('installBtn');
    if (deferredPrompt) b.classList.remove('hidden');
    b.onclick = function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function () { deferredPrompt = null; b.classList.add('hidden'); });
    };
  }

  // ---------- 시작 ----------
  if (params.get('share')) { history.replaceState(null, '', '/m/?share=1'); showShare(); }
  else if (params.get('inbox')) showInbox();
  else if (params.get('launch') || isStandalone()) {
    // 앱 아이콘으로 열었을 때 — 공유받고 못 올린 것이 있으면 그것부터, 아니면 로그인 확인 후 곧바로 job(/app/)으로.
    // (구글 주소로 넘기던 처음 방식은 이 휴대폰에서 "페이지를 찾을 수 없음" — 위 jobHref 설명 참고)
    readShared().then(function (sh) { return sh.items.length; }, function () { return 0; }).then(function (n) {
      if (n) { showShare(); return; }
      root.innerHTML = '';
      ensureLogin().then(function () { handOffToken(); location.replace(APP_URL); });
    });
  }
  else showInstall();
})();
</script>
</body>
</html>
