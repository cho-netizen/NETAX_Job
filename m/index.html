<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1B3D">
<title>NETAX job</title>
<link rel="manifest" href="/m/manifest.json">
<link rel="icon" href="/m/icon-192.png">
<link rel="apple-touch-icon" href="/m/icon-192.png">
<!--
  [2026.10.15] job 휴대폰 창구 — job.netax.kr/m/
  job 화면은 구글 서버 주소에서 뜨므로 그 자체로는 휴대폰 앱 설치·"공유하기" 대상이 될 수 없다.
  구조 전환(화면을 깃허브에서 직접 서빙)은 구글 응답 지연·실패 때문에 보류(2026-10-08)했고, 구글 실행 API는
  계정 전체 권한 열쇠를 브라우저에 둬야 해서 하지 않기로 했다(2026-10-10). 그래서 이 작은 창구만 따로 둔다:
    · 설치하면 휴대폰 앱 목록·공유 메뉴에 "NETAX job"이 뜬다.
    · 앱으로 열면 곧바로 지금의 job(구글 주소)으로 넘어간다 — job 화면·기능은 하나도 안 바뀐다.
    · 다른 앱에서 공유한 파일은 여기서 받아 기존 서버 입구(doPost __manage → manageApp_call의
      listFolder/createFolder/uploadFile/moveItem/work_get_cases)로 드라이브에 올린다. 서버 코드 변경 없음.
  보안: 구글 계정 열쇠는 쓰지 않는다. job 비밀번호로 받은 12시간짜리 job 로그인표(세션 토큰)만 이 기기에 둔다.
-->
<style>
  :root { --bg:#0D1B3D; --card:#15264f; --line:#2a3d6b; --text:#eef2fb; --muted:#9fb0d6; --accent:#4f8cff; --ok:#3fbf7f; --warn:#f0b03c; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; font-size:16px; }
  body { padding:16px 16px calc(24px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:4px 0 14px; display:flex; align-items:center; gap:10px; }
  h1 img { width:32px; height:32px; border-radius:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .muted { color:var(--muted); font-size:14px; line-height:1.5; }
  button, .btn { display:block; width:100%; border:0; border-radius:10px; padding:14px; font-size:16px; font-weight:600; background:var(--accent); color:#fff; text-align:center; text-decoration:none; cursor:pointer; margin-top:10px; }
  button.sub, .btn.sub { background:transparent; border:1px solid var(--line); color:var(--text); font-weight:500; }
  button:disabled { opacity:.5; }
  input[type=password], input[type=search], input[type=text], input:not([type]) { width:100%; padding:13px; font-size:16px; border-radius:10px; border:1px solid var(--line); background:#0b1630; color:var(--text); }
  .item { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); }
  .item:first-child { border-top:0; }
  .item .thumb { width:44px; height:44px; border-radius:6px; object-fit:cover; background:#0b1630; flex:none; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .item .nm { flex:1; min-width:0; overflow-wrap:anywhere; font-size:15px; }
  .item .st { flex:none; font-size:13px; color:var(--muted); }
  .st.ok { color:var(--ok); } .st.err { color:var(--err); }
  .case { padding:12px 4px; border-top:1px solid var(--line); cursor:pointer; }
  .case:first-child { border-top:0; }
  .case b { display:block; font-size:15px; }
  .case span { font-size:13px; color:var(--muted); }
  .case:active { background:#1d3266; }
  #caseList { max-height:55vh; overflow:auto; margin-top:10px; }
  .msg { padding:10px 12px; border-radius:10px; margin-top:10px; font-size:14px; line-height:1.5; }
  .msg.err { background:#4a1f2a; color:#ffd3d3; } .msg.ok { background:#173d2c; color:#c9f5dc; } .msg.info { background:#1b2f5e; color:#d6e2ff; }
  label.chk { display:flex; gap:10px; align-items:center; flex:1; min-width:0; }
  label.chk input { width:20px; height:20px; flex:none; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<h1><img src="/m/icon-192.png" alt="">NETAX job</h1>
<div id="root"><div class="card muted">불러오는 중…</div></div>

<script>
(function () {
  'use strict';
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbyFbvXiV6rSzCvhtc_T2WrzNF5ZxhOFWtSSsgzSavzPbjv4LBGhjXhu_Q2_8m-PDj8s/exec';
  var JOB_URL = GAS_URL + '?app=manage';
  var INBOX_NAME = '_휴대폰받은파일'; // "_"로 시작 — AI 자동참조 대상에서 빠진다(_AI대화기록과 같은 규칙)
  var SHARE_CACHE = 'nx-m-share-v1', META_KEY = '/m/__share/meta';
  var TOKEN_KEY = 'nxMobileToken', INBOX_KEY = 'nxMobileInboxId';
  var MAX_BYTES = 30 * 1024 * 1024; // 구글 웹앱 요청 한도(약 50MB)를 base64(1.33배)로 넘지 않게
  var root = document.getElementById('root');
  var params = new URLSearchParams(location.search);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/m/sw.js', { scope: '/m/' }).catch(function () {});

  // ---------- 작은 도우미 ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function fmtSize(n) { if (n < 1024) return n + 'B'; if (n < 1048576) return Math.round(n / 1024) + 'KB'; return (n / 1048576).toFixed(1) + 'MB'; }
  // [2026-10-15 실기기] 이 휴대폰에서는 job의 구글 주소 자체가 "페이지를 찾을 수 없음"으로 안 열렸다(앱 창·크롬 모두 —
  // 구글 계정 여러 개 로그인 시 생기는 구글 쪽 문제로 추정). job.netax.kr/app/(구조 전환 1단계: 화면은 깃허브, 자료는 구글)은
  // 구글 주소를 거치지 않아 정상으로 열림을 세무사님이 확인 → 이 창구에서 여는 job은 모두 /app/으로.
  var APP_URL = '/app/';
  function jobHref() { return APP_URL; }
  // /app/은 sessionStorage의 로그인표(nxManageSessionToken)가 있으면 비밀번호를 다시 묻지 않는다(manage/script.html).
  // 이 창구의 12시간 로그인표를 넘겨 줘서 앱을 열 때마다 비밀번호를 치지 않게 한다.
  function handOffToken() {
    var t = lsGet(TOKEN_KEY);
    if (tokenValid(t)) { try { sessionStorage.setItem('nxManageSessionToken', t); } catch (e) {} }
  }
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('a');
    if (a && a.getAttribute('href') === APP_URL) handOffToken();
  }, true);
  function isStandalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function msg(kind, text) { return '<div class="msg ' + kind + '">' + text + '</div>'; }
  function icon(type, name) {
    if (/^image\//.test(type)) return '🖼'; if (/pdf/.test(type) || /\.pdf$/i.test(name)) return '📄';
    if (/sheet|excel|csv/.test(type) || /\.(xlsx?|csv)$/i.test(name)) return '📊'; if (/^text\//.test(type)) return '📝'; return '📎';
  }
  function stamp() { var d = new Date(); function p(n) { return (n < 10 ? '0' : '') + n; } return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()); }

  // ---------- 서버 호출(gasbridge.html과 같은 방식) ----------
  // 구글 응답의 "결과 받아가기" 단계가 자주 실패하므로, 같은 요청번호(rid)로 다시 묻는다 — 서버는 다시
  // 실행하지 않고 기억해둔 결과를 준다(파일이 두 번 올라가지 않음, Code.js manageApp_dispatchHttpOnce_).
  var RETRY_DELAYS = [1000, 2000, 3000, 4000, 5000, 6000, 6000, 6000];
  function newRid() { return 'm-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); }
  function gas(fn, args, timeoutMs) {
    var rid = newRid();
    var body = JSON.stringify({ __manage: { fn: fn, args: args }, __rid: rid });
    function attempt(n) {
      var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, timeoutMs || 25000) : null;
      function retry(err) {
        if (n >= RETRY_DELAYS.length) throw err || new Error('서버 응답을 받지 못했습니다(구글 서버가 일시적으로 불안정합니다). 잠시 후 다시 시도하세요.');
        return new Promise(function (r) { setTimeout(r, RETRY_DELAYS[n]); }).then(function () { return attempt(n + 1); });
      }
      return fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body, signal: ctrl ? ctrl.signal : undefined })
        .then(function (res) { return res.text(); })
        .then(function (text) {
          clearTimeout(timer);
          var data = null; try { data = JSON.parse(text); } catch (e) { data = null; }
          if (!data) return retry();
          if (data.error && !('__result' in data)) throw new Error(data.error);
          return data.__result;
        }, function (err) { clearTimeout(timer); return retry(err); });
    }
    return attempt(0);
  }
  function tokenValid(t) { if (!t) return false; var exp = Number(String(t).split('.')[0]); return !!exp && Date.now() < exp - 60000; }
  function call(action, payload, timeoutMs) {
    var tok = lsGet(TOKEN_KEY);
    if (!tokenValid(tok)) return Promise.reject(new Error('AUTH_REQUIRED'));
    return gas('manageApp_call', [action, payload || {}, tok], timeoutMs).then(function (r) {
      if (r && r.error === 'AUTH_REQUIRED') { lsSet(TOKEN_KEY, null); throw new Error('AUTH_REQUIRED'); }
      if (r && r.error) throw new Error(r.error);
      return r;
    });
  }

  // ---------- 로그인(job 비밀번호 — 구글 계정 열쇠는 쓰지 않음) ----------
  function ensureLogin() {
    if (tokenValid(lsGet(TOKEN_KEY))) return Promise.resolve();
    return new Promise(function (resolve) {
      var box = document.createElement('div');
      box.className = 'card';
      box.innerHTML = '<b>job 로그인</b><div class="muted" style="margin:6px 0 10px">job에 들어갈 때 쓰는 비밀번호를 넣어 주세요. 이 휴대폰에서 12시간 동안 다시 묻지 않습니다.</div>' +
        '<form><input type="password" autocomplete="current-password" placeholder="비밀번호" required><button type="submit">로그인</button></form><div class="out"></div>';
      root.insertBefore(box, root.firstChild);
      var form = box.querySelector('form'), input = box.querySelector('input'), out = box.querySelector('.out'), btn = box.querySelector('button');
      // [2026.10.22] 지문 로그인 — job 앱에서 켠 것과 같은 저장(같은 job.netax.kr). 켜져 있으면 지문 단추를 먼저.
      if (window.PublicKeyCredential && lsGet('nxFpCred') && lsGet('nxFpDevTok')) {
        var fb = document.createElement('button'); fb.type = 'button'; fb.textContent = '👆 지문으로 로그인'; form.parentNode.insertBefore(fb, form);
        fb.onclick = function () {
          fb.disabled = true; out.innerHTML = msg('info', '지문을 대 주세요…');
          var raw = atob(lsGet('nxFpCred')), id = new Uint8Array(raw.length); for (var i = 0; i < raw.length; i++) id[i] = raw.charCodeAt(i);
          var ch = new Uint8Array(32); crypto.getRandomValues(ch);
          navigator.credentials.get({ publicKey: { challenge: ch, rpId: location.hostname, allowCredentials: [{ type: 'public-key', id: id }], userVerification: 'required', timeout: 60000 } })
            .then(function () { return gas('manageApp_deviceLogin', [lsGet('nxFpDevTok')]); })
            .then(function (r) {
              if (r && r.ok && r.token) { lsSet(TOKEN_KEY, r.token); box.remove(); resolve(); return; }
              if (r && /무효|기한/.test(r.message || '')) { lsSet('nxFpCred', null); lsSet('nxFpDevTok', null); }
              out.innerHTML = msg('err', esc((r && r.message) || '지문 로그인 실패 — 비밀번호로 들어오세요.')); fb.disabled = false;
            }, function (err) { out.innerHTML = msg('err', '지문 확인을 못 했습니다: ' + esc(err.message) + ' — 비밀번호로 들어오세요.'); fb.disabled = false; });
        };
      }
      input.focus();
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        btn.disabled = true; out.innerHTML = msg('info', '확인 중…(구글 서버라 몇 초~30초 걸릴 수 있습니다)');
        gas('manageApp_checkPassword', [input.value]).then(function (r) {
          if (r && r.ok && r.token) { lsSet(TOKEN_KEY, r.token); box.remove(); resolve(); return; }
          out.innerHTML = msg('err', esc((r && r.message) || '비밀번호가 맞지 않습니다.'));
          btn.disabled = false; input.select();
        }, function (err) { out.innerHTML = msg('err', esc(err.message)); btn.disabled = false; });
      });
    });
  }
  function withLogin(fn) {
    return ensureLogin().then(fn).catch(function (err) {
      if (err && err.message === 'AUTH_REQUIRED') return withLogin(fn); // 로그인표가 만료됨 → 다시 로그인
      throw err;
    });
  }

  // ---------- 받은 파일 보관 폴더(기본폴더 아래 _휴대폰받은파일) ----------
  function inboxFolderId() {
    var saved = lsGet(INBOX_KEY);
    if (saved) return Promise.resolve(saved);
    return call('listFolder', {}).then(function (res) {
      var hit = (res.folders || []).filter(function (f) { return f.name === INBOX_NAME; })[0];
      if (hit) return hit.id;
      return call('createFolder', { path: res.path, name: INBOX_NAME }).then(function (r) { return r.id; });
    }).then(function (id) { lsSet(INBOX_KEY, id); return id; });
  }

  // ---------- 공유받은 것 꺼내기(sw.js가 Cache Storage에 담아 둔 것) ----------
  function readShared() {
    if (!('caches' in window)) return Promise.resolve({ cache: null, items: [] });
    return caches.open(SHARE_CACHE).then(function (cache) {
      return cache.match(META_KEY).then(function (res) { return res ? res.json() : { items: [] }; })
        .then(function (meta) { return { cache: cache, items: Array.isArray(meta.items) ? meta.items : [] }; });
    });
  }
  function saveMeta(cache, items) {
    if (!items.length) return cache.delete(META_KEY);
    return cache.put(META_KEY, new Response(JSON.stringify({ items: items }), { headers: { 'Content-Type': 'application/json' } }));
  }
  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { var s = String(fr.result); resolve(s.slice(s.indexOf(',') + 1)); };
      fr.onerror = function () { reject(fr.error || new Error('파일을 읽지 못했습니다.')); };
      fr.readAsDataURL(blob);
    });
  }
  function textToBase64(text) { return blobToBase64(new Blob([text], { type: 'text/plain;charset=utf-8' })); }

  // ---------- 화면: 공유받기 ----------
  function showShare() {
    readShared().then(function (sh) {
      if (!sh.items.length) {
        root.innerHTML = '<div class="card">' + msg('info', '받은 파일이 없습니다. 다른 앱에서 <b>공유 → NETAX job</b>을 고르면 여기로 들어옵니다.') +
          '<a class="btn" href="' + jobHref() + '">job 열기</a><a class="btn sub" href="/m/?inbox=1">보관함 파일 사건에 넣기</a></div>';
        return;
      }
      var html = '<div class="card"><b>받은 것 ' + sh.items.length + '개</b><div class="muted">job 드라이브의 「' + INBOX_NAME + '」 폴더에 먼저 올린 뒤, 넣을 사건을 고릅니다.</div><div id="items" style="margin-top:8px">';
      sh.items.forEach(function (it, i) {
        var name = it.kind === 'text' ? '공유글: ' + it.text.slice(0, 60) : it.name;
        html += '<div class="item"><div class="thumb" id="th' + i + '">' + (it.kind === 'text' ? '📝' : icon(it.type, it.name)) + '</div><div class="nm">' + esc(name) + '</div><div class="st" id="st' + i + '">' + fmtSize(it.size || 0) + '</div></div>';
      });
      html += '</div><div id="upOut"></div></div><div id="next"></div>';
      root.innerHTML = html;
      // 사진은 작은 미리보기
      sh.items.forEach(function (it, i) {
        if (it.kind === 'file' && /^image\//.test(it.type)) sh.cache.match(it.key).then(function (r) { return r && r.blob(); }).then(function (b) {
          if (!b) return; var el = document.getElementById('th' + i); el.innerHTML = '<img class="thumb" src="' + URL.createObjectURL(b) + '" alt="">';
        });
      });
      // [2026.10.22] 세무사님 "권장순서대로 하고 배포는 일괄배포하라"(기기 3종 검토 B-1·B-3) — 사진은 문서 하나 PDF로 묶기(사무실 기본:
      //  "이미지는 문서별 PDF, 사진 여러 장이면 한 PDF"), 녹음은 상담 녹음으로 글 만들기(커버화면 상담 녹음과 같은 서버 길 consult_*).
      //  사진·녹음이 있으면 고르는 칸을 먼저 보이고, 없으면 예전처럼 곧바로 올린다.
      var imgs = sh.items.filter(function (it) { return it.kind === 'file' && /^image\//.test(it.type); });
      var auds = sh.items.filter(function (it) { return it.kind === 'file' && /^audio\//.test(it.type); });
      var start = function (opt) {
        withLogin(function () { return prepareItems(sh, opt).then(function (aud) { renderList(sh); return uploadAll(sh, aud); }); }).catch(function (err) {
          document.getElementById('upOut').innerHTML = msg('err', '올리지 못했습니다: ' + esc(err.message) + '<br>받은 파일은 이 휴대폰에 그대로 남아 있습니다.') + '<button id="again">다시 시도</button>';
          document.getElementById('again').onclick = function () { showShare(); };
        });
      };
      if (!imgs.length && !auds.length) { start({}); return; }
      var ob = document.getElementById('upOut');
      ob.innerHTML = (imgs.length ? '<label class="chk" style="margin-top:8px"><input type="checkbox" id="optPdf" checked><span>사진 ' + imgs.length + '장을 <b>문서 하나(PDF)</b>로 묶기</span></label>'
          + '<input id="optName" placeholder="문서 이름(예: 매매계약서)" value="서류_' + stamp() + '" style="margin-top:6px">' : '')
        + (auds.length ? '<label class="chk" style="margin-top:8px"><input type="checkbox" id="optAud" checked><span>녹음 ' + auds.length + '개는 <b>상담 녹음</b>으로 글 만들기(사건 고른 뒤 요약·녹취록 저장)</span></label>' : '')
        + '<button id="goUp">올리기</button>';
      document.getElementById('goUp').onclick = function () {
        var p = document.getElementById('optPdf'), n = document.getElementById('optName'), a = document.getElementById('optAud');
        this.disabled = true;
        start({ pdf: !!(p && p.checked), pdfName: n ? n.value : '', consult: !!(a && a.checked) });
      };
    });
  }

  // ---------- 사진 → PDF, 녹음 → 상담 녹음 ----------
  var jsPdfPromise = null;
  function loadJsPdf() {
    if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
    if (!jsPdfPromise) jsPdfPromise = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      s.onload = function () { window.jspdf ? resolve(window.jspdf.jsPDF) : reject(new Error('PDF 도구를 불러오지 못했습니다.')); };
      s.onerror = function () { jsPdfPromise = null; reject(new Error('PDF 도구를 불러오지 못했습니다(인터넷 확인).')); };
      document.head.appendChild(s);

    return jsPdfPromise;
  }
  // 사진을 긴 쪽 2000px 이하 JPEG로 줄여 A4 한 장씩(사진 비율 그대로 가운데). 휴대폰 카메라의 "문서 스캔"으로 찍은 사진이면 이미 반듯하다.
  function imagesToPdf(blobs) {
    return loadJsPdf().then(function (JsPDF) {
      var pdf = null, seq = Promise.resolve();
      blobs.forEach(function (b) {
        seq = seq.then(function () {
          return new Promise(function (resolve, reject) {
            var url = URL.createObjectURL(b), img = new Image();
            img.onload = function () {
              var k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
              var cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
              cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
              URL.revokeObjectURL(url);
              var land = cv.width > cv.height, pw = land ? 297 : 210, ph = land ? 210 : 297;
              if (!pdf) pdf = new JsPDF({ orientation: land ? 'l' : 'p', unit: 'mm', format: 'a4' }); else pdf.addPage('a4', land ? 'l' : 'p');
              var s = Math.min((pw - 10) / cv.width, (ph - 10) / cv.height), w = cv.width * s, h = cv.height * s;
              pdf.addImage(cv.toDataURL('image/jpeg', 0.85), 'JPEG', (pw - w) / 2, (ph - h) / 2, w, h);
              resolve();
            };
            img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('사진을 읽지 못했습니다.')); };
            img.src = url;
          });
        });
      });
      return seq.then(function () { return pdf.output('blob'); });
    });
  }
  // 올리기 전 준비 — 사진을 PDF 하나로 바꿔 받은 목록에 넣고(원본 사진은 휴대폰에서 지움), 상담 녹음으로 돌릴 것은 목록에서 떼어 돌려준다
  function prepareItems(sh, opt) {
    var aud = opt.consult ? sh.items.filter(function (it) { return it.kind === 'file' && /^audio\//.test(it.type); }) : [];
    if (aud.length) sh.items = sh.items.filter(function (it) { return aud.indexOf(it) === -1; });
    if (!opt.pdf) return Promise.resolve(aud);
    var imgs = sh.items.filter(function (it) { return it.kind === 'file' && /^image\//.test(it.type); });
    if (!imgs.length) return Promise.resolve(aud);
    document.getElementById('upOut').innerHTML = msg('info', '사진 ' + imgs.length + '장을 PDF로 묶는 중…');
    return Promise.all(imgs.map(function (it) { return sh.cache.match(it.key).then(function (r) { if (!r) throw new Error('휴대폰에 남은 사진을 찾지 못했습니다.'); return r.blob(); }); }))
      .then(imagesToPdf).then(function (pdfBlob) {
        var name = String(opt.pdfName || '').trim().replace(/[\\/:*?"<>|]/g, '_') || ('서류_' + stamp());
        var key = '/m/__share/pdf_' + Date.now().toString(36);
        return sh.cache.put(key, new Response(pdfBlob, { headers: { 'Content-Type': 'application/pdf' } })).then(function () {
          imgs.forEach(function (it) { sh.cache.delete(it.key); });
          var first = sh.items.indexOf(imgs[0]);
          sh.items = sh.items.filter(function (it) { return imgs.indexOf(it) === -1; });
          sh.items.splice(Math.max(0, first), 0, { kind: 'file', key: key, name: name + '.pdf', type: 'application/pdf', size: pdfBlob.size });
          return saveMeta(sh.cache, sh.items.concat(aud));
        });
      }).then(function () { return aud; });
  }
  // 목록 다시 그리기 — 사진 줄이 PDF 한 줄로, 상담 녹음으로 뗀 것은 빠진 뒤 올리기 상태 칸(st0…)을 다시 맞춘다
  function renderList(sh) {
    var box = document.getElementById('items'); if (!box) return;
    box.innerHTML = sh.items.map(function (it, i) { var nm = it.kind === 'text' ? '공유글: ' + it.text.slice(0, 60) : it.name; return '<div class="item"><div class="thumb">' + (it.kind === 'text' ? '📝' : icon(it.type, it.name)) + '</div><div class="nm">' + esc(nm) + '</div><div class="st" id="st' + i + '">' + fmtSize(it.size || 0) + '</div></div>'; }).join('');
  }
  // 녹음 한 개를 상담 녹음으로 — 2MB 조각(드라이브 이어 올리기는 256KB 배수)으로 보내고 등록하면 서버가 받아쓰기·요약해 사건 폴더에 저장
  function audioDuration(blob) {
    return new Promise(function (resolve) {
      var a = document.createElement('audio'), url = URL.createObjectURL(blob), done = false;
      var fin = function (v) { if (done) return; done = true; URL.revokeObjectURL(url); resolve(isFinite(v) && v > 0 ? Math.round(v) : 0); };
      a.preload = 'metadata'; a.onloadedmetadata = function () { fin(a.duration); }; a.onerror = function () { fin(0); };
      setTimeout(function () { fin(0); }, 5000); a.src = url;
    });
  }
  function sendConsultAudio(sh, it, caseId, st) {
    return sh.cache.match(it.key).then(function (r) { if (!r) throw new Error('휴대폰에 남은 녹음을 찾지 못했습니다.'); return r.blob(); }).then(function (blob) {
      var CH = 2 * 1024 * 1024, total = Math.max(1, Math.ceil(blob.size / CH)), id = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      var seq = Promise.resolve();
      for (var i = 0; i < total; i++) (function (i) {
        seq = seq.then(function () { st('녹음 보내는 중 ' + (i + 1) + '/' + total); return blobToBase64(blob.slice(i * CH, (i + 1) * CH)); })
          .then(function (b64) { return call('consult_chunk', { id: id, index: i, base64: b64 }, 120000); });
      })(i);
      return seq.then(function () { return audioDuration(blob); }).then(function (sec) {
        return call('consult_finish', { id: id, total: total, mimeType: it.type || 'audio/mp4', caseId: caseId || '', durationSec: sec, startedAt: Date.now() - sec * 1000 }, 60000);
      }).then(function (r) {
        if (!r || r.error) throw new Error((r && r.error) || '상담 녹음 등록 실패');
        sh.cache.delete(it.key);
        return readShared().then(function (s2) { return saveMeta(s2.cache, s2.items.filter(function (x) { return x.key !== it.key; })); });
      });
    });
  }

  function uploadAll(sh, aud) {
    aud = aud || [];
    var out = document.getElementById('upOut');
    out.innerHTML = msg('info', '올리는 중…');
    return inboxFolderId().then(function (folderId) {
      var uploaded = [], failed = [], remaining = sh.items.slice();
      var seq = Promise.resolve();
      sh.items.forEach(function (it, i) {
        seq = seq.then(function () {
          var st = document.getElementById('st' + i);
          if (it.kind === 'file' && it.size > MAX_BYTES) { st.textContent = '너무 큼(30MB 초과)'; st.className = 'st err'; failed.push(it); return; }
          st.textContent = '올리는 중…'; st.className = 'st';
          var p = it.kind === 'text'
            ? textToBase64(it.text).then(function (b64) { return { name: '공유글_' + stamp() + '.txt', mimeType: 'text/plain', base64Data: b64 }; })
            : sh.cache.match(it.key).then(function (r) { if (!r) throw new Error('휴대폰에 남은 파일을 찾지 못했습니다.'); return r.blob(); })
                .then(blobToBase64).then(function (b64) { return { name: it.name, mimeType: it.type || 'application/octet-stream', base64Data: b64 }; });
          return p.then(function (payload) {
            payload.folderId = folderId;
            // 큰 파일은 올리는 데만 오래 걸리므로 기다리는 시간을 길게(중간에 끊고 다시 보내면 또 올리게 됨)

          }).then(function (r) {

          }).catch(function (err) {

  // ---------- 화면: 사건 고르기 → 사건 폴더로 옮기기 ----------
  var casesPromise = null;
  function loadCases() {
    if (!casesPromise) casesPromise = call('work_get_cases', {}, 60000).then(function (r) {
      // [2026.10.18 탭연결 1번] 폴더 없는 상담 사건도 목록에 넣는다 — 고르면 업무유형을 물어 폴더를 만든 뒤 옮긴다(ensureFolder)
      return (r.cases || []).filter(function (c) { return c.폴더ID || String(c.업무유형 || '') === '상담'; }).map(function (c) {
        return { id: c.id, name: String(c.사건명 || ''), client: String(c.고객명 || ''), status: String(c.상태 || ''), folderId: c.폴더ID || '', upType: String(c.업무유형 || ''), semok: String(c.세목 || ''), modified: String(c.수정일 || c.생성일 || '') };
      }).sort(function (a, b) {

    });

  }
  function showCasePicker(box, files, opts) {

      '<input type="search" id="q" placeholder="고객명·사건명 검색" style="margin-top:10px"><div id="caseList">' + msg('info', '사건 목록 불러오는 중…(구글 서버라 10~30초 걸릴 수 있습니다)') + '</div>' +

          '업무유형을 정하면 사건 폴더가 만들어집니다(업무유형·사건명도 바뀜).\n\n1 = 신고(신고서 작성)\n2 = 자문(검토서·보고서 작성)\n\n번호를 입력하세요(취소하면 그대로 둡니다).', '1');

  // ---------- [2026.10.22] 화면: 현장 서류 찍기(기기 3종 검토 B-2) ----------
  // 카메라로 여러 장 찍어 두고 "다 찍었음"을 누르면 공유받기 화면과 같은 길(사진 → 문서 하나 PDF → 사건 폴더)로 간다.
  // 반듯하게 펴기는 휴대폰 카메라의 "문서 스캔"이 더 잘하므로, 그것으로 찍은 사진을 공유해도 같다.
  function showScan() {
    root.innerHTML = '<div class="card"><b>📷 현장 서류 찍기</b><div class="muted" style="margin-top:6px">한 문서의 쪽을 차례로 찍으세요. 다 찍으면 문서 하나(PDF)로 묶어 사건에 넣습니다.</div>' +
      '<input type="file" id="cam" accept="image/*" capture="environment" multiple class="hidden"><button id="shot">📷 찍기</button><div id="pages" style="margin-top:8px"></div>' +
      '<button id="doneShot" class="hidden">다 찍었음 — 묶어서 올리기</button></div>';
    var cam = document.getElementById('cam'), pages = document.getElementById('pages'), done = document.getElementById('doneShot'), n = 0;
    document.getElementById('shot').onclick = function () { cam.click(); };
    cam.onchange = function () {

  // ---------- [2026.10.22] 화면: 서명 받기(기기 3종 검토 C-4 — 태블릿·휴대폰) ----------
  // 사건을 고르고 문서 이름을 적은 뒤 고객이 손가락·펜으로 서명 → 문서명·사건·날짜·서명을 한 장(A4)으로 그려 PDF → 사건 폴더.
  // PDF 글꼴에 한글이 없어 글자도 그림으로 그린다(브라우저 글꼴 그대로).
  function showSign() {
    root.innerHTML = '<div class="card"><b>✍ 서명 받기</b><input type="search" id="q" placeholder="사건 검색(고객명·사건명)" style="margin-top:8px"><div id="caseList">' + msg('info', '사건 목록 불러오는 중…') + '</div><div id="signBox"></div></div>';
    withLogin(function () { return loadCases(); }).then(function (all) {
      var list = document.getElementById('caseList'), q = document.getElementById('q');
      function render() {
        var words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
        var hits = all.filter(function (c) { var s = (c.client + ' ' + c.name).toLowerCase(); return c.folderId && words.every(function (w) { return s.indexOf(w) !== -1; }); }).slice(0, 40);
        list.innerHTML = hits.length ? hits.map(function (c) { return '<div class="case" data-i="' + all.indexOf(c) + '"><b>' + esc(c.name || c.client) + '</b><span>' + esc(c.client) + '</span></div>'; }).join('') : msg('info', '맞는 사건이 없습니다(폴더 있는 사건만).');
      }
      q.addEventListener('input', render); render();
      list.addEventListener('click', function (ev) {

    }).catch(function (err) { document.getElementById('caseList').innerHTML = msg('err', esc(err.message)); });
  }
  function signPad(box, c) {
    box.innerHTML = '<div style="margin-top:6px"><b>' + esc(c.name || c.client) + '</b></div>' +
      '<input id="docName" placeholder="문서 이름(예: 세무대리 위임장)" style="margin-top:8px"><input id="signer" placeholder="서명하는 분 성함" value="' + esc(c.client || '') + '" style="margin-top:6px">' +
      '<div class="muted" style="margin-top:8px">아래 칸에 서명해 주세요.</div><canvas id="pad" style="width:100%;height:220px;background:#fff;border:1px solid #ccc;border-radius:8px;touch-action:none"></canvas>' +
      '<button id="clr" class="sub">다시 쓰기</button><button id="saveSign">서명 저장(사건 폴더에 PDF)</button><div id="sgOut"></div>';
    var cv = document.getElementById('pad'), ctx = cv.getContext('2d'), drawing = false, inked = false, ratio = window.devicePixelRatio || 1;
    cv.width = cv.clientWidth * ratio; cv.height = cv.clientHeight * ratio; ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
    function pt(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    cv.addEventListener('pointerdown', function (e) { drawing = true; inked = true; var p = pt(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', function (e) { if (!drawing) return; var p = pt(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
    cv.addEventListener('pointerup', function () { drawing = false; });
    document.getElementById('clr').onclick = function () { ctx.clearRect(0, 0, cv.width, cv.height); inked = false; };
    document.getElementById('saveSign').onclick = function () {
      var doc = document.getElementById('docName').value.trim(), who = document.getElementById('signer').value.trim(), out = document.getElementById('sgOut'), btn = this;
      if (!doc) { alert('문서 이름을 적어 주세요.'); return; }
      if (!inked) { alert('서명이 비어 있습니다.'); return; }
      btn.disabled = true; out.innerHTML = msg('info', 'PDF 만드는 중…');
      // A4 한 장(1240×1754px ≈ 150dpi)에 글자·서명을 그린다
      var pg = document.createElement('canvas'); pg.width = 1240; pg.height = 1754; var g = pg.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, pg.width, pg.height); g.fillStyle = '#111';
      var now = new Date(), day = now.getFullYear() + '년 ' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 ' + now.getHours() + '시 ' + now.getMinutes() + '분';
      g.font = 'bold 56px sans-serif'; g.fillText(doc, 110, 200);
      g.font = '36px sans-serif';
      g.fillText('사건: ' + (c.name || c.client || ''), 110, 320);
      g.fillText('서명인: ' + (who || ''), 110, 390);
      g.fillText('서명 일시: ' + day, 110, 460);
      g.fillText('위 문서의 내용을 확인하고 서명합니다.', 110, 560);
      g.strokeStyle = '#999'; g.strokeRect(110, 640, 1020, 520);
      var sh_ = Math.min(480, 980 * cv.height / cv.width), sw_ = sh_ * cv.width / cv.height; // 서명 비율 그대로
      g.drawImage(cv, 130, 660, sw_, sh_);
      g.font = '28px sans-serif'; g.fillStyle = '#666'; g.fillText('NETAX job 서명 받기로 만든 문서', 110, 1690);
      loadJsPdf().then(function (JsPDF) {
        var pdf = new JsPDF({ unit: 'mm', format: 'a4' });
        pdf.addImage(pg.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297);
        return blobToBase64(pdf.output('blob'));
      }).then(function (b64) {
        var name = (doc + '_서명_' + stamp()).replace(/[\\/:*?"<>|]/g, '_') + '.pdf';
        return call('uploadFile', { name: name, mimeType: 'application/pdf', base64Data: b64, folderId: c.folderId }, 60000).then(function (r) {
          if (!r || !r.id) throw new Error('올린 파일 정보를 받지 못했습니다.');
          out.innerHTML = msg('ok', '「' + esc(c.name || c.client) + '」 사건 폴더에 저장했습니다: ' + esc(name)) + '<a class="btn sub" href="/m/?sign=1">다른 서명 받기</a>';
        });
      }).catch(function (err) { btn.disabled = false; out.innerHTML = msg('err', '저장하지 못했습니다: ' + esc(err.message)); });
    };
  }

  // =====================================================================================

      loadCases().then(function (all) {
        var list = box.querySelector('#pl'), q = box.querySelector('#pq');
        function render() {
          var words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
          var hits = all.filter(function (c) { var s = (c.client + ' ' + c.name).toLowerCase(); return words.every(function (w) { return s.indexOf(w) !== -1; }); });
          hits.sort(function (a, b) { return (preferIds.indexOf(b.id) !== -1) - (preferIds.indexOf(a.id) !== -1); });
          list.innerHTML = hits.slice(0, 60).map(function (c) { return '<div class="case" data-id="' + esc(c.id) + '"><b>' + (preferIds.indexOf(c.id) !== -1 ? '📅 ' : '') + esc(c.name || c.client) + '</b><span>' + esc(c.client) + '</span></div>'; }).join('') || msg('info', '맞는 사건이 없습니다.');

        list.addEventListener('click', function (ev) { var el = ev.target.closest('.case'); if (!el) return; var c = all.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0]; if (c) resolve(c); });
      }, function (err) { box.querySelector('#pl').innerHTML = msg('err', esc(err.message)); });

        call('notify_answer', { id: id, answer: b.getAttribute('data-a') }, 60000).then(function (x) {
          document.getElementById('ao').innerHTML = msg('ok', '「' + esc(x.status) + '」로 남겼습니다' + (it.caseId && x.status !== '나중에' ? '(사건 작업일지에도)' : x.status === '나중에' ? '(내일 아침 알림에 다시)' : '') + '.');
        }, function (err) { document.getElementById('ao').innerHTML = msg('err', esc(err.message)); });
      });
    }).catch(function (err) { document.getElementById('an').innerHTML = msg('err', esc(err.message)); });
  }

  // ---------- 펜으로 표시해 넥스에게(태블릿) ----------
  // 검토서·서식 화면을 캡처한 그림(또는 사진) 위에 펜으로 표시 → 사건 폴더에 저장 + 넥스 대화에 그림을 붙여 열기(묻는 말은 세무사님이 보냄)
  function showPen() {
    root.innerHTML = '<div class="card" id="pp"></div>';
    var box = document.getElementById('pp');
    withLogin(function () { return pickCase(box, '🖊 펜 표시 — 어느 사건?', []); }).then(function (c) {
      box.innerHTML = '<b>🖊 ' + esc(c.name || c.client) + '</b><div class="muted" style="margin-top:6px">표시할 그림(검토서·서식 화면 캡처나 사진)을 고르고 펜으로 표시하세요.</div>' +
        '<input type="file" id="pf" accept="image/*" style="margin-top:8px"><div style="position:relative; margin-top:8px"><canvas id="pc" style="width:100%; touch-action:none; background:#fff; border-radius:8px"></canvas></div>' +
        '<div style="display:flex; gap:6px"><button id="pclr" class="sub">표시 지우기</button><button id="psend">넥스에게 보내기</button></div><input id="pq" placeholder="넥스에게 할 말(비우면: 표시한 곳 고칠 점 정리)" style="margin-top:6px"><div id="po"></div>';
      var cv = document.getElementById('pc'), g = cv.getContext('2d'), bg = null, drawing = false, inked = false;
      function paintBg() { if (!bg) return; cv.width = bg.naturalWidth > 1600 ? 1600 : bg.naturalWidth; cv.height = Math.round(cv.width * bg.naturalHeight / bg.naturalWidth); g.drawImage(bg, 0, 0, cv.width, cv.height); g.lineWidth = Math.max(3, cv.width / 300); g.lineCap = 'round'; g.strokeStyle = '#e0242a'; }
      document.getElementById('pf').onchange = function () { var f = this.files[0]; if (!f) return; var img = new Image(); img.onload = function () { bg = img; paintBg(); inked = false; }; img.src = URL.createObjectURL(f); };
      function pt(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; }
      cv.addEventListener('pointerdown', function (e) { if (!bg) return; drawing = true; inked = true; var p = pt(e); g.beginPath(); g.moveTo(p.x, p.y); cv.setPointerCapture(e.pointerId); });
      cv.addEventListener('pointermove', function (e) { if (!drawing) return; var p = pt(e); g.lineTo(p.x, p.y); g.stroke(); });
      cv.addEventListener('pointerup', function () { drawing = false; });
      document.getElementById('pclr').onclick = function () { paintBg(); inked = false; };
      document.getElementById('psend').onclick = function () {
        if (!bg || !inked) { alert('그림을 고르고 펜으로 표시해 주세요.'); return; }
        var b = this; b.disabled = true; var dataUrl = cv.toDataURL('image/jpeg', 0.85), name = '펜표시_' + stamp() + '.jpg';
        var out = document.getElementById('po'); out.innerHTML = msg('info', '사건 폴더에 저장하는 중…');
        call('uploadFile', { name: name, mimeType: 'image/jpeg', base64Data: dataUrl.slice(dataUrl.indexOf(',') + 1), folderId: c.folderId }, 60000).then(function () {
          return call('work_append_log', { caseId: c.id, text: '[펜 표시] ' + name + ' — 넥스에게 보냄' }, 60000).catch(function () {});
        }).then(function () {
          try { localStorage.setItem('nxPenPending', JSON.stringify({ dataUrl: dataUrl, name: name, text: document.getElementById('pq').value.trim(), caseName: c.name || c.client })); }
          catch (e) { out.innerHTML = msg('err', '사건 폴더에는 저장했지만 그림이 커서 넥스 대화로 넘기지 못했습니다 — job에서 그 파일을 첨부해 주세요.'); return; }
          handOffToken(); location.href = APP_URL;
        }, function (err) { b.disabled = false; out.innerHTML = msg('err', esc(err.message)); });
      };
    });
  }

  // ---------- 화면: 설치 안내(브라우저로 열었을 때) ----------
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferredPrompt = e;
    var b = document.getElementById('installBtn'); if (b) b.classList.remove('hidden');
  });
  window.addEventListener('appinstalled', function () {
    var o = document.getElementById('installOut'); if (o) o.innerHTML = msg('ok', '설치했습니다. 휴대폰 앱 목록의 <b>NETAX job</b>으로 여세요.');
  });
  function showInstall() {
    root.innerHTML = '<div class="card"><b>휴대폰에 앱으로 설치</b><div class="muted" style="margin-top:6px">설치하면 <b>앱 목록·홈 화면</b>에 "NETAX job"이 생기고, 다른 앱(카카오톡·갤러리·파일·크롬)의 <b>공유 → NETAX job</b>으로 파일을 job 드라이브에 바로 보낼 수 있습니다. 앱을 누르면 지금 쓰는 job이 그대로 열립니다.</div>' +
      '<button id="installBtn" class="hidden">앱 설치</button><div id="installOut"></div>' +
      '<div class="muted" id="manualHint" style="margin-top:10px">설치 버튼이 안 보이면: 크롬 오른쪽 위 <b>⋮</b> → <b>앱 설치</b>(또는 <b>홈 화면에 추가</b>)를 누르세요. 삼성 인터넷은 아래쪽 <b>≡</b> → <b>현재 페이지 추가</b> → <b>홈 화면</b>.</div></div>' +
      '<div class="card"><a class="btn sub" href="' + jobHref() + '" style="margin-top:0">설치 없이 job 열기</a><a class="btn sub" href="/m/?inbox=1">보관함 파일 사건에 넣기</a></div>';
    var b = document.getElementById('installBtn');
    if (deferredPrompt) b.classList.remove('hidden');
    b.onclick = function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function () { deferredPrompt = null; b.classList.add('hidden'); });
    };
  }

  // ---------- 시작 ----------
  if (params.get('share')) { history.replaceState(null, '', '/m/?share=1'); showShare(); }
  else if (params.get('inbox')) showInbox();
  else if (params.get('menu')) showMenu();
  else if (params.get('todo')) showTodo();
  else if (params.get('board')) showBoard();
  else if (params.get('memo')) showMemo();
  else if (params.get('visit')) showVisit();
  else if (params.get('pen')) showPen();
  else if (params.get('a')) showAnswer(params.get('a'));
  else if (params.get('scan')) showScan();
  else if (params.get('sign')) showSign();
  // [2026.10.22] 넥스에게 말하기(워치·휴대폰) — 로그인표를 넘겨 job 앱의 "말하기 모드"(접는 폰 커버화면과 같은 화면·같은 대화)로
  else if (params.get('talk')) ensureLogin().then(function () { handOffToken(); location.replace(APP_URL + '?talk=1'); });
  else if (params.get('launch') || isStandalone()) {
    // 앱 아이콘으로 열었을 때 — 공유받고 못 올린 것이 있으면 그것부터, 아니면 로그인 확인 후 곧바로 job(/app/)으로.
    // (구글 주소로 넘기던 처음 방식은 이 휴대폰에서 "페이지를 찾을 수 없음" — 위 jobHref 설명 참고)
    readShared().then(function (sh) { return sh.items.length; }, function () { return 0; }).then(function (n) {
      if (n) { showShare(); return; }
      root.innerHTML = '';
      ensureLogin().then(function () { handOffToken(); location.replace(APP_URL); });
    });
  }
  else showInstall();
})();
</script>
</body>
</html>
